<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="description" content="تمتد هذه الحقبة من سنة إحدى وأربعين للهجرة، حين بايع أهل الشام معاوية بن أبي سفيان، إلى سنة اثنتين وثلاثين ومئة، حين سقطت الدولة على يد الثورة العباسي">
<title>الدولة الأموية | موسوعة تاريخ الإسلام</title>
<link rel="preload" href="assets/fonts/amiri-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/amiri-700.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* ===== موسوعة تاريخ الإسلام — التنسيق المشترك ===== */

/* الخطوط محليّة (Subset عربي): لا شبكة، ولا اختلاف في القياس بين تشغيل وتشغيل */
@font-face{font-family:'Amiri';font-style:normal;font-weight:400;font-display:block;
  src:url(assets/fonts/amiri-400.woff2) format('woff2')}
@font-face{font-family:'Amiri';font-style:normal;font-weight:700;font-display:block;
  src:url(assets/fonts/amiri-700.woff2) format('woff2')}
@font-face{font-family:'Cairo';font-style:normal;font-weight:200 1000;font-display:block;
  src:url(assets/fonts/cairo-var.woff2) format('woff2')}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --gold:#B8942F;--gold2:#8B6914;--cream:#FBF4E4;--paper:#FFFDF8;
  --ink:#2E2A24;--muted:#7C7364;--line:#E7DCC3;
  --green:#1E6B3A;--blue:#155E9C;
  --shadow:0 4px 18px rgba(80,60,20,.08);
  --c:#B8942F;
}
body{font-family:'Cairo',sans-serif;background:var(--cream);color:var(--ink);
  min-height:100vh;line-height:1.9;transition:.3s}

body.dark{--paper:#201E1A;--cream:#161512;--ink:#E8E1D2;--muted:#A79E8B;
  --line:#3A362C;--shadow:0 4px 18px rgba(0,0,0,.35)}

main{max-width:820px;margin:0 auto;padding:1.2rem 1.1rem 5rem}

/* ---------- الترويسة ---------- */
header.top{position:sticky;top:0;z-index:60;display:flex;align-items:center;
  justify-content:space-between;gap:.6rem;padding:.55rem 1rem;
  background:var(--paper);border-bottom:2px solid var(--gold)}
.brand{font-family:'Amiri',serif;font-weight:700;font-size:1.02rem;color:var(--ink);
  text-decoration:none;display:flex;align-items:center;gap:.4rem}
.tools{display:flex;align-items:center;gap:.5rem}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
  background:transparent;color:var(--ink);font-size:1.05rem;cursor:pointer;
  display:grid;place-items:center;transition:.2s}
.ib:hover{background:var(--gold);color:#fff;border-color:var(--gold)}
.ib:active{transform:scale(.9)}

/* ---------- قبة التقدم ---------- */
.dome{width:38px;height:44px;position:relative;cursor:default}
.dome svg{width:100%;height:100%;display:block}
.dome .fill{fill:var(--gold);opacity:.85;transition:.4s}

/* ---------- شارات ---------- */
.badge{display:inline-flex;align-items:center;gap:.3rem;font-size:.72rem;
  background:var(--gold);color:#fff;border-radius:50px;padding:.15rem .6rem;
  font-weight:700}

/* ---------- المسار ---------- */
.crumbs{font-size:.82rem;color:var(--muted);margin-bottom:.8rem;
  display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.crumbs a{color:var(--muted);text-decoration:none}
.crumbs a:hover{color:var(--gold2)}

/* ---------- الترويسة البطلة ---------- */
.hero{position:relative;background:var(--paper);border:1px solid var(--line);
  border-top:6px solid var(--c);border-radius:20px;padding:1.6rem 1.3rem 1.4rem;
  text-align:center;box-shadow:var(--shadow);margin-bottom:1.4rem;overflow:hidden}
.hero .ic{font-size:2.6rem;line-height:1}
.hero h1{font-family:'Amiri',serif;font-size:1.9rem;color:var(--c);margin:.3rem 0 .1rem}
.hero .period{color:var(--gold2);font-size:.85rem;font-weight:600;margin-bottom:.6rem}
.hero .intro{color:var(--muted);font-size:.96rem;line-height:2;max-width:620px;margin:0 auto}

/* ---------- زخرفة SVG ---------- */
.orn{display:block;margin:1.2rem auto;opacity:.55}
.orn line,.orn path,.orn circle{stroke:var(--gold);stroke-width:1.1;fill:none}

/* ---------- العناوين ---------- */
h2.sec{font-family:'Amiri',serif;font-size:1.35rem;color:var(--c);
  margin:2rem 0 .9rem;display:flex;align-items:center;gap:.6rem}
h2.sec:before{content:"";width:6px;height:22px;background:var(--gold);
  border-radius:3px;flex:0 0 auto}
h2.sec .n{margin-right:auto;font-family:'Cairo';font-size:.75rem;color:var(--muted);font-weight:400}

/* ---------- الخط الزمني ---------- */
.tlwrap{position:relative;margin-bottom:.4rem}
.tl{display:flex;gap:.6rem;overflow-x:auto;padding:.6rem .2rem 1rem;
  scroll-snap-type:x mandatory;scrollbar-width:thin}
.tl::-webkit-scrollbar{height:5px}
.tl::-webkit-scrollbar-thumb{background:var(--gold);border-radius:9px}
.tli{flex:0 0 150px;scroll-snap-align:center;background:var(--paper);
  border:1px solid var(--line);border-right:4px solid var(--c);
  border-radius:14px;padding:.6rem .7rem;cursor:pointer;text-align:right;
  transition:.22s;font-family:'Cairo'}
.tli:hover,.tli.on{transform:translateY(-3px);box-shadow:var(--shadow);border-right-color:var(--gold)}
.tli b{display:block;color:var(--c);font-size:.9rem}
.tli span{display:block;color:var(--muted);font-size:.76rem;line-height:1.6}
.tlnav{display:flex;justify-content:space-between;margin-top:-.5rem}

/* ---------- الأحداث ---------- */
.ev{background:var(--paper);border:1px solid var(--line);border-radius:16px;
  padding:1rem 1.1rem;margin-bottom:.9rem;box-shadow:var(--shadow);
  opacity:0;transform:translateY(14px);transition:.45s}
.ev.in{opacity:1;transform:none}
.ev-head{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;margin-bottom:.5rem}
.ev-y{background:var(--c);color:#fff;font-size:.74rem;font-weight:700;
  padding:.15rem .55rem;border-radius:6px;white-space:nowrap}
.ev h3{font-family:'Amiri',serif;font-size:1.18rem;color:var(--ink)}
.ev p{font-family:'Amiri',serif;font-size:1.08rem;line-height:2.05;text-align:justify}
.ev .res{margin-top:.7rem;padding:.55rem .8rem;border-right:4px solid var(--gold);
  background:linear-gradient(135deg,rgba(184,148,47,.10),rgba(184,148,47,.04));
  border-radius:10px;font-size:.9rem;color:var(--gold2);font-weight:600}
.ev .res:before{content:"◀ النتيجة  "}

/* ---------- الشخصيات ---------- */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.6rem}
.pc{background:var(--paper);border:1px solid var(--line);border-radius:14px;
  padding:.65rem .8rem;border-top:3px solid var(--c)}
.pc b{display:block;color:var(--ink);font-size:.95rem}
.pc span{display:block;color:var(--muted);font-size:.78rem;line-height:1.65}

/* ---------- النتائج ---------- */
.outs{list-style:none}
.outs li{position:relative;padding:.5rem 1.5rem .5rem 0;border-bottom:1px dashed var(--line);
  font-size:.95rem}
.outs li:before{content:"◆";position:absolute;right:0;color:var(--gold);font-size:.8rem}

/* ---------- المصادر ---------- */
.src{background:var(--paper);border:1px solid var(--line);border-radius:16px;
  padding:.9rem 1.1rem;margin-top:2.2rem}
.src li{font-size:.86rem;color:var(--muted);padding:.25rem 1.2rem .25rem 0;
  position:relative;line-height:1.8}
.src li:before{content:"❋";position:absolute;right:0;color:var(--gold)}
.src li cite{font-style:normal;color:var(--ink);font-weight:600}

/* ---------- التنقل بين الصفحات ---------- */
.pager{display:flex;gap:.6rem;margin-top:1.6rem}
.pager a{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:14px;
  padding:.7rem .9rem;text-decoration:none;color:var(--ink);transition:.22s}
.pager a:hover{border-color:var(--gold);box-shadow:var(--shadow)}
.pager a small{display:block;color:var(--muted);font-size:.7rem}
.pager a b{font-size:.92rem;color:var(--c)}
.pager a.next{text-align:left}
.pager a.empty{visibility:hidden}

/* ---------- الانتقال بين الصفحات ---------- */
main{animation:pageIn .4s ease}
@keyframes pageIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}

/* ---------- فهرس الصفحة الرئيسية ---------- */
.eg{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:.8rem}
.ec{position:relative;background:var(--paper);border:1px solid var(--line);
  border-top:5px solid var(--c);border-radius:18px;padding:1rem .8rem .9rem;
  text-align:center;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);
  transition:.25s;overflow:hidden}
.ec:hover{transform:translateY(-4px);box-shadow:0 10px 26px rgba(80,60,20,.16)}
.ec .ic{font-size:2.1rem;line-height:1.2}
.ec b{display:block;color:var(--c);font-size:.98rem;margin:.25rem 0 .15rem}
.ec small{display:block;color:var(--muted);font-size:.72rem;line-height:1.55}
.ec .pg{height:5px;background:var(--line);border-radius:9px;margin-top:.55rem;overflow:hidden}
.ec .pg i{display:block;height:100%;background:var(--c);width:0;transition:.4s}
.ec .done{position:absolute;top:.4rem;left:.5rem;font-size:.95rem;color:var(--gold)}

/* ---------- البحث ---------- */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;display:none}
.ov.on{display:block}
.panel{position:fixed;inset:0;background:var(--paper);z-index:95;display:none;flex-direction:column}
.panel.on{display:flex}
.sh{display:flex;gap:.6rem;padding:.8rem;border-bottom:2px solid var(--gold)}
.sh input{flex:1;border:0;background:transparent;font-family:'Cairo';
  font-size:1.05rem;color:var(--ink);outline:none}
.sb{flex:1;overflow-y:auto;padding:.8rem}
.res{background:transparent;border:1px solid var(--line);border-radius:12px;
  padding:.7rem .9rem;margin-bottom:.5rem;cursor:pointer}
.res b{display:block;color:var(--c);font-size:.95rem}
.res small{color:var(--muted);font-size:.78rem;line-height:1.6}
.res em{font-style:normal;background:rgba(184,148,47,.22);border-radius:3px;padding:0 2px}

@media(max-width:420px){
  main{padding:.9rem .8rem 4rem}
  .hero h1{font-size:1.5rem}
  .tli{flex:0 0 132px}
}

/* ========== ١) الإطار المزخرف — حواشي المخطوطات (زوايا ثابتة الحجم) ========== */
.frame{position:relative;border:1px solid var(--gold);border-radius:6px;padding:1.6rem 1.35rem}
.frame:before{content:"";position:absolute;inset:5px;border:1px solid var(--gold);
  opacity:.28;border-radius:3px;pointer-events:none}
.crn{position:absolute;width:26px;height:26px;pointer-events:none;color:var(--gold);opacity:.75}
.crn svg{width:100%;height:100%;display:block;stroke:currentColor;fill:none;stroke-width:1.1}
.crn.tl{top:-1px;right:-1px}.cn-tr{}
.crn.tr{top:-1px;left:-1px}
.crn.bl{bottom:-1px;right:-1px}
.crn.br{bottom:-1px;left:-1px}
.frame>*:not(.crn){position:relative;z-index:1}

/* ========== ٢) الخط الزمني الكبير ========== */
.orn{width:210px;max-width:70%;height:18px;opacity:.55}
.bigtl{display:flex;gap:.55rem;overflow-x:auto;padding:1rem .3rem 1.3rem;
  scroll-snap-type:x mandatory;cursor:grab;scrollbar-width:thin;
  -webkit-overflow-scrolling:touch}
.bigtl:active{cursor:grabbing}
.bigtl::-webkit-scrollbar{height:6px}
.bigtl::-webkit-scrollbar-thumb{background:var(--gold);border-radius:9px}
.btl{flex:0 0 126px;scroll-snap-align:center;position:relative;
  display:flex;flex-direction:column;align-items:center;gap:.25rem;
  text-decoration:none;color:inherit;padding-top:1.1rem}
.btl:before{content:"";position:absolute;top:.4rem;right:-.3rem;left:-.3rem;height:2px;
  background:var(--line)}
.btl:after{content:"";position:absolute;top:0;right:calc(50% - 9px);
  width:18px;height:18px;border-radius:50%;background:var(--paper);
  border:3px solid var(--c);z-index:2;transition:.25s}
.btl:hover:after{transform:scale(1.25)}
.btl .ic{font-size:1.6rem;line-height:1;z-index:2}
.btl .nm{font-family:'Amiri',serif;font-size:.86rem;color:var(--c);text-align:center;line-height:1.5}
.btl .yr{font-size:.65rem;color:var(--muted)}
.btl .st{font-size:.6rem;color:var(--gold2);font-weight:700}

/* ========== ٣) تقليب الصفحة ========== */
.flip{position:fixed;inset:0;background:var(--cream);z-index:200;pointer-events:none;opacity:0}
.flip.go{animation:flipA .5s ease forwards}
@keyframes flipA{
  0%{opacity:.95;transform:perspective(1200px) rotateY(0)}
  55%{opacity:.95;transform:perspective(1200px) rotateY(-38deg)}
  100%{opacity:1;transform:perspective(1200px) rotateY(0)}
}
main.flip-out{animation:flipB .3s ease forwards}
@keyframes flipB{to{opacity:0;transform:perspective(1200px) translateX(-45px)}}

/* ========== ٤) تقدّم على شكل سيف ========== */
.sword{position:fixed;bottom:14px;right:50%;transform:translateX(50%);
  z-index:70;pointer-events:none;display:flex;align-items:center;gap:.5rem;
  background:var(--paper);border:1px solid var(--line);border-radius:50px;
  padding:.3rem .85rem;box-shadow:var(--shadow);font-size:.72rem;color:var(--muted)}
.sword svg{height:11px;width:118px}
.sword .bl{fill:var(--gold);opacity:.9}

/* ========== ٥) الأوسمة ========== */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:.55rem;margin-top:.8rem}
.bg{border:1px dashed var(--line);border-radius:14px;padding:.7rem .5rem;text-align:center;
  background:var(--paper);opacity:.4;filter:grayscale(1);transition:.35s}
.bg.on{opacity:1;filter:none;border:1px solid var(--gold);
  box-shadow:0 0 0 1px rgba(184,148,47,.22),var(--shadow)}
.bg .bi{font-size:1.9rem;line-height:1.2}
.bg b{display:block;font-size:.82rem;color:var(--ink);margin-top:.15rem}
.bg small{display:block;color:var(--muted);font-size:.64rem;line-height:1.5}

/* ========== ٦) شريط علوي رفيع ========== */
.topbar{position:fixed;top:0;right:0;left:0;height:3px;z-index:80}
.topbar i{display:block;height:100%;width:0;
  background:linear-gradient(90deg,var(--gold),#E8CE7C);transition:width .1s linear}

/* ==========================================================
   واجهة الصفحات العميقة (فصول متعددة)
   ========================================================== */

/* الفهرس */
.toc{margin-bottom:1.4rem;padding:1.2rem 1.3rem 1.4rem}
.toclist{list-style:none}
.toclist li{margin:0}
.toclist a{display:flex;align-items:center;gap:.6rem;padding:.42rem .3rem;
  border-bottom:1px dashed var(--line);text-decoration:none;color:var(--ink);
  font-size:.92rem;transition:.2s}
.toclist a:hover{color:var(--c);padding-right:.8rem;background:rgba(184,148,47,.07)}
.toclist b{background:var(--c);color:#fff;border-radius:6px;min-width:24px;
  text-align:center;font-size:.72rem;padding:.1rem .3rem;flex:0 0 auto}
.toclist .ttl{flex:1 1 auto;min-width:0}
.toclist .tpg{margin-inline-start:auto;flex:0 0 auto;font-size:.74rem;color:var(--muted);
  background:rgba(184,148,47,.1);border-radius:6px;padding:.05rem .4rem;min-width:26px;text-align:center}

/* عنوان القسم */
.part{margin-bottom:2.6rem}
.part-h{position:relative;text-align:center;margin:2.4rem 0 1.6rem;
  padding:1.1rem .9rem;border-top:1px solid var(--gold);border-bottom:1px solid var(--gold)}
.part-ic{font-size:2rem;line-height:1}
.part-h h2{font-family:'Amiri',serif;font-size:1.5rem;color:var(--c);margin:.2rem 0}
.part-h p{color:var(--muted);font-size:.92rem;max-width:640px;margin:.4rem auto 0;line-height:1.95}

/* الفصل */
.ch3{position:relative;background:var(--paper);border:1px solid var(--line);
  border-radius:16px;padding:1.3rem 1.2rem;margin-bottom:1.1rem;box-shadow:var(--shadow)}
.ch3-h{display:flex;align-items:flex-start;gap:.6rem;margin-bottom:.7rem;
  padding-bottom:.6rem;border-bottom:1px solid var(--line)}
.ch3-n{background:var(--c);color:#fff;font-size:.72rem;font-weight:700;
  padding:.18rem .5rem;border-radius:6px;flex:0 0 auto;margin-top:.25rem}
.ch3 h3,.rbody h3{font-family:'Amiri',serif;font-size:1.35rem;color:var(--ink);line-height:1.6}
.ch3 .lead,.rbody .lead{font-family:'Amiri',serif;font-size:1.12rem;line-height:2.05;
  color:var(--c);font-weight:700;margin-bottom:.7rem;text-align:right}
.ch3 .ap,.rbody .ap{font-family:'Amiri',serif;font-size:1.1rem;line-height:2.15;
  text-align:justify;margin-bottom:.75rem}
.ch3 .sub,.rbody .sub{font-family:'Amiri',serif;font-size:1.15rem;color:var(--c);
  margin:1.2rem 0 .5rem;padding-right:.6rem;border-right:4px solid var(--gold)}

/* صندوق الخلاصة */
.kbox{margin-top:1rem;background:linear-gradient(135deg,rgba(184,148,47,.09),rgba(184,148,47,.03));
  border:1px solid var(--line);border-radius:12px;padding:.8rem .9rem}
.kbox .bt{font-family:'Amiri',serif;color:var(--gold2);font-size:1rem;margin-bottom:.5rem}
.kgrid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.55rem}
.kb{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:.5rem .6rem}
.kb b{display:block;color:var(--blue);font-size:.88rem;margin-bottom:.1rem}
.kb span{font-size:.78rem;color:var(--muted);line-height:1.6;display:block}

/* جدول */
.tblwrap{overflow-x:auto;margin-top:1rem;border:1px solid var(--line);border-radius:12px}
.tblwrap table{border-collapse:collapse;width:100%;min-width:380px}
.tblwrap th{background:var(--c);color:#fff;font-size:.82rem;font-weight:700;
  padding:.55rem .7rem;text-align:right;white-space:nowrap}
.tblwrap td{padding:.55rem .7rem;font-size:.84rem;border-bottom:1px solid var(--line);
  line-height:1.8;vertical-align:top}
.tblwrap tr:last-child td{border-bottom:0}
.tblwrap tbody tr:nth-child(odd){background:rgba(184,148,47,.045)}

/* اقتباس */
.ch3 blockquote,.rbody blockquote{margin:1rem 0;padding:.8rem 1rem;border-right:5px solid var(--gold);
  background:rgba(184,148,47,.07);border-radius:0 12px 12px 0}
.ch3 blockquote p,.rbody blockquote p{font-family:'Amiri',serif;font-size:1.08rem;line-height:2;color:var(--gold2)}
.ch3 blockquote cite,.rbody blockquote cite{display:block;margin-top:.4rem;font-size:.78rem;
  color:var(--muted);font-style:normal}

/* خلاصة الفصل */
.ch3 .res,.rbody .res{margin-top:1rem;padding:.6rem .9rem;border-right:4px solid var(--gold);
  background:linear-gradient(135deg,rgba(184,148,47,.12),rgba(184,148,47,.04));
  border-radius:10px;font-size:.9rem;color:var(--gold2);font-weight:600}
.ch3 .up{display:block;text-align:left;margin-top:.9rem;font-size:.78rem;
  color:var(--muted);text-decoration:none}
.ch3 .up:hover{color:var(--c)}

@media(max-width:420px){
  .ch3{padding:1rem .85rem}
  .ch3 .ap,.rbody .ap{font-size:1.05rem}
  .kgrid3{grid-template-columns:1fr 1fr}
}


/* ==========================================================
   COMFORT — راحة القراءة والزخرفة
   ========================================================== */

/* عرض مريح للسطر: يمنع الإرهاق البصري */
main{max-width:760px}
.ch3 .ap,.ch3 .lead{max-width:100%}

/* سطر استهلالي كبير (حرف Headline) */
.ch3 .lead .drop,.rbody .lead .drop{float:right;font-family:'Amiri',serif;font-size:3.4rem;line-height:.82;
  color:var(--c);margin:.18rem 0 0 .45rem;font-weight:700;opacity:.9;
  border-right:3px solid var(--gold);padding:.1rem .45rem 0 0}

/* فاصل زخرفي بين الأقسام */
.porn{width:280px;max-width:80%;height:38px;margin:0 auto .6rem;display:block}
.porn .ln{stroke:var(--gold);stroke-width:1.1;fill:none;opacity:.7}
.porn .dm{stroke:var(--gold);stroke-width:.9;fill:none;opacity:.5}

/* فهرس الأقسام داخل رأس القسم */
.part-list{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin-top:.7rem}
.part-list a{font-size:.76rem;text-decoration:none;color:var(--muted);
  border:1px solid var(--line);border-radius:50px;padding:.2rem .7rem;transition:.2s}
.part-list a:hover{color:var(--c);border-color:var(--gold);background:rgba(184,148,47,.08)}

/* فهرس متشعّب */
.toclist>li{padding:0}
.toc-part{list-style:none;margin-bottom:.9rem}
.toc-part>b{display:inline-block;margin-left:.4rem}
.toc-part>a{font-weight:700;font-size:.98rem;color:var(--c);display:flex;align-items:center;gap:.45rem}
.toc-part>ul{list-style:none;margin:.35rem 0 0;padding-right:.9rem;
  border-right:1px dashed var(--line)}
.toc-part>ul>li{margin:0}
.toc-part>ul a{padding:.32rem .3rem;font-size:.88rem;border:0;gap:.45rem}

.toc-part>li.here a,.toc-part>ul>li.here a{color:var(--c);background:rgba(184,148,47,.1)}
.toc-part>ul>li.here a i{background:var(--gold);box-shadow:0 0 0 3px rgba(184,148,47,.2)}

/* تنقّل بين الفصول */
.chnav{display:flex;gap:.5rem;align-items:stretch;margin-top:1.1rem;
  padding-top:.9rem;border-top:1px dashed var(--line)}

  padding:.5rem .7rem;text-decoration:none;transition:.22s;min-width:0}

.chnav a.empty{visibility:hidden}

.railbar{position:fixed;bottom:52px;right:0;left:0;z-index:69;pointer-events:none;

/* ==========================================================
   القارئ — كتاب بلا تمرير عمودي
   ========================================================== */

/* الصفحة كلها: شريط علوي + مسرح + شريط سفلي */
body.reading{height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
body.reading .top{flex:0 0 auto}
body.reading .flip,body.reading .sword,body.reading .railbar,body.reading .crumbs{display:none}

main.reader{max-width:none;margin:0;padding:0;flex:1;min-height:0;
  display:flex;flex-direction:column;animation:none}

/* الشريط العلوي يحمل اسم الفصل */
.top.reading .brand{flex:1;min-width:0;gap:.35rem}
.top.reading .btxt{display:none}
.rbrand{font-family:'Amiri',serif;font-size:.92rem;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* المسرح */
.rstage{position:relative;flex:1;min-height:0;overflow:hidden;
  perspective:2200px;perspective-origin:50% 50%;touch-action:pan-y}

/* الصفحة */
.rpage{position:absolute;display:flex;flex-direction:column;overflow:hidden;
  background:var(--paper);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 6px 22px rgba(80,60,20,.12)}
.rbody{flex:1;min-height:0;overflow:hidden;padding:12px 20px}
.rpfoot{flex:0 0 auto;height:26px;display:flex;align-items:center;justify-content:center;
  font-size:.72rem;color:var(--muted);border-top:1px solid var(--line);
  direction:ltr;unicode-bidi:isolate}

/* حاوية القياس (خارج الشاشة) */
.rmeas{position:absolute;left:-99999px;top:0;visibility:hidden;pointer-events:none}
.rmeas .rbody{height:auto!important;padding:0;overflow:hidden}

/* ورقة التقليب */
.rleaf{position:absolute;display:none;transform-style:preserve-3d;
  will-change:transform;z-index:20;pointer-events:none}
.rleaf.on{display:block}
.rface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--paper);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);overflow:hidden}
.rback{transform:rotateY(180deg);
  background:linear-gradient(270deg,var(--paper) 55%,var(--cream) 100%)}
.rleaf::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to left,rgba(0,0,0,.30),rgba(0,0,0,0) 45%);
  opacity:calc(var(--a,0)*.95)}
.rleaf.prev::after{background:linear-gradient(to right,rgba(0,0,0,.30),rgba(0,0,0,0) 45%)}

/* الشريط السفلي */
.rfoot{flex:0 0 auto;display:flex;align-items:center;gap:.6rem;
  padding:.35rem .8rem;min-height:56px;border-top:1px solid var(--line);background:var(--paper)}
.rnav{min-height:48px;min-width:66px;padding:.35rem .9rem;border:1px solid var(--line);
  border-radius:12px;background:transparent;color:var(--ink);font-family:'Cairo';
  font-size:.9rem;font-weight:600;cursor:pointer;transition:.2s}
.rnav:hover:not(:disabled){border-color:var(--gold);background:rgba(184,148,47,.07)}
.rnav:disabled{opacity:.3;cursor:default}
.rprog{flex:1;height:9px;min-width:60px;border:0;padding:0;border-radius:9px;
  background:var(--line);overflow:hidden;cursor:pointer;display:block}
.rprog i{display:block;height:100%;width:0;
  background:linear-gradient(90deg,var(--gold),#E3C56A);transition:width .25s}

/* لوحة الفهرس والذهاب إلى صفحة */
.rpanel{position:fixed;top:0;right:0;bottom:0;width:min(86vw,360px);z-index:120;
  background:var(--paper);border-left:1px solid var(--line);display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .28s ease;
  box-shadow:-6px 0 24px rgba(0,0,0,.14)}
.rpanel.on{transform:translateX(0)}
.rphead{display:flex;align-items:center;justify-content:space-between;
  padding:.65rem .9rem;border-bottom:2px solid var(--gold);
  font-family:'Amiri';font-size:1.05rem;color:var(--c)}
.rpjump{display:flex;gap:.5rem;padding:.7rem .9rem;border-bottom:1px solid var(--line)}
.rpjump input{flex:1;min-width:0;min-height:46px;border:1px solid var(--line);border-radius:10px;
  background:var(--cream);color:var(--ink);font-family:'Cairo';font-size:1rem;padding:0 .7rem}
.rpgo{min-height:46px;padding:0 1rem;border:0;border-radius:10px;background:var(--gold);
  color:#fff;font-family:'Cairo';font-weight:700;cursor:pointer}
.rpfont{display:flex;align-items:center;gap:.45rem;padding:.55rem .9rem;
  border-bottom:1px solid var(--line);font-size:.85rem;color:var(--muted)}
.rpfont span{margin-left:auto}
.rpfont button{min-width:44px;min-height:42px;border:1px solid var(--line);border-radius:9px;
  background:transparent;color:var(--ink);font-family:'Cairo';font-size:.92rem;cursor:pointer}
.rpfont button.on{border-color:var(--gold);background:rgba(184,148,47,.12);color:var(--c);font-weight:700}
.rplist{flex:1;overflow-y:auto;padding:.4rem .6rem;-webkit-overflow-scrolling:touch}
.rpitem{display:flex;align-items:center;gap:.55rem;padding:.45rem .5rem;
  border-bottom:1px dashed var(--line);text-decoration:none;color:var(--ink);font-size:.9rem}
.rpitem i{background:var(--gold);color:#fff;border-radius:6px;min-width:32px;text-align:center;
  font-size:.72rem;font-style:normal;padding:.15rem .2rem;flex:0 0 auto}
.rpitem:hover{color:var(--c);background:rgba(184,148,47,.07)}
.rphome{display:block;text-align:center;padding:.85rem;border-top:1px solid var(--line);
  color:var(--c);text-decoration:none;font-weight:700;font-size:.9rem}

/* داخل الصفحة: إزالة إطار الفصل، وتوسيط الجدول بلا تمرير أفقي */
.rbody .ch3{border:0;background:transparent;box-shadow:none;padding:0;margin:0 0 .5rem}
.rbody .ch3-h{border-bottom:1px solid var(--line);padding-bottom:.5rem;margin-bottom:.7rem}
.rbody .part-h{margin:0 0 .6rem;padding-top:.4rem}
/* غلاف الحقبة داخل القارئ: مضغوط ليدخل في صفحة واحدة بلا تمرير */
.rbody .hero{padding:.9rem .8rem .7rem;margin:0;border-top-width:4px}
.rbody .hero .ic{font-size:1.7rem}
.rbody .hero h1{font-size:1.42rem;margin:.15rem 0 0}
.rbody .hero .period{font-size:.78rem;margin-bottom:.35rem}
.rbody .hero .intro{font-size:.86rem;line-height:1.72}
.rbody .hero .orn{margin:.5rem auto;height:14px}
/* غلاف القسم داخل القارئ: مضغوط ليدخل في صفحة واحدة بلا قصّ */
.rbody .part-h .part-list{gap:.22rem;margin-top:.45rem}
.rbody .part-h .part-list a{font-size:.66rem;padding:.1rem .5rem}
.rbody .part-h p{font-size:.84rem;line-height:1.72;margin-top:.3rem}
.rbody .part-h h2{font-size:1.28rem}
.rbody .part-ic{font-size:1.5rem}
.rpfoot span:nth-child(2){margin:0 .22rem}
.rbody .tblwrap{overflow:hidden}
.rbody .tblwrap table{min-width:0;width:100%;table-layout:auto}
/* كسر الكلمات عند حدودها فقط: overflow-wrap:anywhere كان يقصّ «المرحلة» إلى «المر/حلة» */
.rbody .tblwrap th,.rbody .tblwrap td{word-break:normal;overflow-wrap:break-word;white-space:normal;hyphens:none}
.rbody .people{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.rbody mark{background:rgba(184,148,47,.38);color:inherit;border-radius:3px;padding:0 2px}
/* فهرس أكثف داخل القارئ: أقسام أكثر في الصفحة */
.rbody .toc-part{margin-bottom:.5rem}
.rbody .toclist a{padding:.26rem .3rem}
.rbody .toc-part>ul{margin-top:.2rem}
/* كتلة أطول من الصفحة (الغلاف مثلًا): تمرير داخلي بدل قصّ المحتوى */
.rbody.rflow{overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}

  .rnav{min-width:56px;font-size:.82rem;padding:.3rem .55rem}

\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🏗️\u003c/div\u003e\n      \u003ch2\u003eالقسم الأول: التأسيس وانتقال الخلافة\u003c/h2\u003e\n      \u003cp\u003eسنة واحدة تفصل بين مقتل عليّ بن أبي طالب في الكوفة وبيعة معاوية في دمشق، لكنها سنة غيّرت شكل الحكم في الإسلام إلى الأبد. ففيها انتهت تجربة الخلافة الراشدة كما عرفها الصحابة، وبدأت دولةٌ لها عاصمةٌ ثابتة وجيشٌ نظاميّ ودواوينُ ونقدٌ وطريقُ بريد. وفيها أيضًا بدأت الجروح التي ستظل تُفتح كلما ذكر الناس كربلاء.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#muawiya\"\u003eمعاوية وانتقال الخلافة\u003c/a\u003e\u003ca href=\"#damascus\"\u003eدمشق عاصمةً للدولة\u003c/a\u003e\u003ca href=\"#karbala\"\u003eكربلاء وولاية يزيد\u003c/a\u003e\u003ca href=\"#second-fitna\"\u003eالفتنة الثانية وقيام مروان\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"muawiya","n":"معاوية وانتقال الخلافة","ic":"⚖️","part":"القسم الأول: التأسيس وانتقال الخلافة","h":"\u003carticle class=\"ch3\" id=\"muawiya\" data-toc=\"معاوية وانتقال الخلافة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e١.١\u003c/span\u003e\n          \u003ch3\u003e⚖️ معاوية وانتقال الخلافة\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي سنة إحدى وأربعين للهجرة بايع الناس معاوية بن أبي سفيان في دمشق، وسُمّي ذلك العام «عام الجماعة»؛ لأن الأمة التي افترقت أربع سنوات في حروبٍ داخلية عادت إلى إمامٍ واحد. لكن الوحدة التي تحققت كانت على شروطٍ جديدة، ودفع ثمنها فريقٌ من المسلمين لم يقبل تلك الشروط.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكانت الأمة في سنة إحدى وأربعين قد أنهكتها أربع سنوات من القتال الداخلي: الجمل، وصفّين، والنهروان، ثم الغارات المتبادلة بين العراق والشام. وقد قُتل من الصحابة في هذه السنوات ما لم يُقتل في الفتوح كلها، وتوقّف الفتح على الجبهتين الشرقية والغربية، وانتشر في الأمصار قومٌ لا يعرفون إلا لغة السلاح. وكان الناس في الكوفة والبصرة يخرجون في كل شهر على والٍ جديد، وفي الشام كان معاوية يبني جيشًا واحدًا لا يعرف الانقسام. ولمّا قُتل عليّ بن أبي طالب في رمضان سنة أربعين على يد عبد الرحمن بن ملجم الخارجي، صار أهل العراق أمام خيارين لا ثالث لهما: إما أن يُبايعوا الحسن بن عليّ فيُكملوا حربًا لا يثقون في نهايتها، وإما أن يقبلوا صلحًا يُنهي الدم.\u003c/p\u003e\u003cp class=\"ap\"\u003eأما معاوية بن أبي سفيان فقد كان قد دخل الإسلام متأخرًا سنة فتح مكة، لكنه دخل في العمل الإداري مبكرًا؛ فقد ولّاه عمر بن الخطاب الشام بعد موت أخيه يزيد في طاعون عمواس، فبقي واليًا عليها نحو عشرين سنة، في خلافة عمر وعثمان وعليّ معًا. وفي هذه السنوات الطويلة تعلّم كيف يُدير إقليمًا فيه مدنٌ قديمةٌ كدمشق وحمص وقنّسرين، وكيف يعقد مع القبائل العربية عهودًا تقوم على المصالح لا على الخطب، وكيف يبني أسطولًا على ساحل لا يملك أحدٌ غيره. فلمّا جاءت الفتنة كان الرجل الوحيد في الأمة الذي يملك جيشًا منظمًا وخزينةً ممتلئة وساحلًا آمنًا وحدودًا لا تُهدَّد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أرسل الحسن بن عليّ إلى معاوية يطلب الصلح، فاشترط لنفسه ولأهل بيته ولشيعة أبيه شروطًا، منها أن يعمل معاوية بكتاب الله وسنة نبيه، وأن تكون الخلافة شورى بعده، وأن يأمن الناس في أنفسهم وأموالهم وأولادهم، وأن يكفّ عن سبّ عليّ في الصلاة والقنوت. وقد قبل معاوية الشروط في الظاهر، وأخذ البيعة في الكوفة سنة إحدى وأربعين، ثم دخلها وخطب فيها خطبةً ذكر فيها أنه لم يقاتلهم على الصلاة ولا الزكاة بل على الإمرة. وقد روى المؤرخون أن الحسن قال في خطبته بعد الصلح: «إن الله هداكم بهذا الصلح»، وأن الناس بكوا حين سمعوه؛ لأنهم عرفوا أن الدم قد توقّف وأن السياسة قد بدأت.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد اختلف الناس في هذه البيعة اختلافًا لم يُحسم إلى اليوم: فمنهم من رآها انتقالًا شرعيًّا لأنها جاءت بتراضٍ وبيعةٍ من أهل الحل والعقد، ومنهم من رآها تحوّلًا للملك إلى ملكٍ عضوض، لأن معاوية اشترط أن تكون الخلافة لابنه من بعده، ولأنه جعل الطاعة تُبنى على السيف والمال أكثر من الشورى. والحقّ أن في المسألة وجهين: فقد كانت البيعة نفسها صحيحةً في عُرف ذلك الزمان، وكانت الدولة التي بناها أقوى من كل ما سبقها، لكنها في الوقت نفسه فتحت بابًا لم يُغلق: أن يصير الحكم وراثةً، وأن يصير الاعتراضُ جريمةً تُسكت بالسيف. ومن هنا بدأ الفرق بين «الخلافة» و«المُلك» في الوعي السياسي للمسلمين.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد حكم معاوية تسع عشرة سنة، فاستقرّت فيها الأوضاع واستؤنف الفتح، وضُبطت الحدود، وكُتبت الدواوين، ونُظّم البريد، وقُدّمت دمشق على غيرها من الأمصار. لكنه في آخر حياته بايع لابنه يزيد، وكان يزيد شابًّا لم تُعرف له سابقةٌ في الفتوح ولا في السياسة، وكان في الشام من لا يرضاه، وفي الحجاز من لا يقبله أصلًا. ولمّا مات معاوية سنة ستين صار ما كان يُتوقَّع: رفضٌ في المدينة ومكة، وحركةٌ في الكوفة، ثم مأساةٌ في كربلاء. وهكذا اجتمع في هذه الشخصية الواحدة ما لا يجتمع عادةً: باني أول دولة إسلامية منظمة، ومؤسّس أول وراثةٍ في الحكم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان معاوية يُقال عنه إنه «أدهى العرب»؛ لأنه كان يحكم بالرفق والمال والحلم أكثر مما يحكم بالسيف. وقد رُوي عنه أنه قال: «إني لا أضع سيفي حيث يكفيني سوطي، ولا سوطي حيث يكفيني لساني». وهذه الكلمة تشرح طريقته كلها: أنه كان يقدّم الحيلة على القوة، والمصانعة على المواجهة، ويعرف متى يشتدّ ومتى يلين. وقد نجح في ذلك نجاحًا لم ينجح به من قبله ولا من بعده؛ إذ لم تخرج عليه في تسع عشرة سنة إلا حركاتٌ محدودة، ولم تُسفك في عهده دماءٌ كثيرة، وامتدّت الفتوح إلى إفريقية والسند. لكن هذا النجاح نفسه كان مبنيًّا على إرجاء المسألة الخطيرة لا على حلّها: مسألة من يحقّ له أن يحكم، وكيف يُختار.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالشام التي بنت السلطة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الشام قبل الإسلام ولايةً بيزنطيةً غنية، فيها مدنٌ من أقدم مدن العالم كدمشق وأنطاكية وحلب، وفيها زراعةٌ مرويّة وأسواقٌ متصلة بالبحر. ولمّا فُتحت في خلافة عمر تركت الإدارة البيزنطية أثرها في تنظيم الضرائب والطرق، فاستفاد منها المسلمون بدلًا من أن يهدموها. وقد أدرك معاوية مبكرًا أن هذه الأرض أصلح من العراق للحكم؛ لأن العراق بلدُ أحزابٍ وفتنٍ ومدنٍ متنافسة، وأهله أشدّ الناس كلامًا وأقلّهم طاعةً للوالي الغريب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بنى معاوية في الشام ثلاثة أشياء في وقتٍ واحد: جيشًا عربيًّا نظاميًّا مُرتّبًا في أجنادٍ أربعة، وأسطولًا في موانئ صور وعكّا وبيروت، وشبكةً من العلاقات مع القبائل والأشراف المحليين. ثم أنشأ ديوان الخاتم — وهو أول تنظيم بيروقراطي في الإسلام يمنع تزوير الرسائل — ونظّم البريد بنظامٍ من محطاتٍ متتابعة. وقد كانت هذه المؤسسات هي التي جعلت دمشق قادرةً على أن تحكم من خراسان إلى الأندلس بعد ثلاثين سنة فقط من قيام الدولة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eبيعة العام وشروط الحسن\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يكن صلح الحسن تنازلًا عن حقٍّ في نظره، بل كان تقديرًا للمصلحة: فقد رأى أن الدماء التي ستُسفك في حربٍ بين العراق والشام أعظم من مفسدة ترك الإمرة لمعاوية، وأن الأمة في حاجة إلى وقتٍ لتُعيد بناء نفسها. وقد جاء في بعض الروايات أنه قال: «لو وجدت أعوانًا لقاتلته»، وهي عبارة تُبيّن أنه لم يكن راضيًا عن الصلح في قلبه، وإنما ألزم نفسه به لمصلحةٍ رآها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما الشروط فقد كانت في ظاهرها محدودة، لكنها كانت في معناها دستورًا لعلاقة الحاكم بالرعية: أمانٌ للناس، وكفٌّ عن السبّ، ووعدٌ بالشورى. ولم يُنفّذ من هذه الشروط إلا القليل؛ فقد استمرّ سبّ عليّ على المنابر في الشام سنوات، ثم أوقفه عمر بن عبد العزيز بعد نحو ستين سنة. ومن هنا تعلّم الناس درسًا مرًّا: أن الشروط المكتوبة لا تُنفَّذ إلا إذا كان هناك من يُلزم بها، وأن البيعة إذا لم يكن لها ضامنٌ غير الخليفة نفسه صارت توكيلًا بلا رقابة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالخلافة والمُلك: قراءة في التحول\u003c/h4\u003e\u003cp class=\"ap\"\u003eكثيرًا ما يُقال إن الدولة الأموية حوّلت الخلافة إلى مُلك، وهذا صحيحٌ في جوهره، لكنه يحتاج إلى تفسير. فالخلافة الراشدة كانت تقوم على ثلاثة أعمدة: اختيارٌ بالشورى، ومسؤوليةٌ أمام الأمة، ومالٌ لا يُميّز الخليفة عن الناس. والأمويون حافظوا على الأول شكليًّا في أول الأمر، وأسقطوا الثاني والثالث عمليًّا: فلم يكن هناك من يسأل الخليفة، وأصبح بيت المال ومالُ الدولة شيئًا واحدًا في التصرف، وقامت حاشيةٌ وحرّاسٌ وحُجّابٌ بين الحاكم والناس.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان لهذا التحول ما يُبرّره في نظر مؤيّديه: أن الأمة اتسعت اتساعًا هائلًا، وأن إدارة إمبراطوريةٍ من الصين إلى المحيط لا تُدار بمجلس شورى في مسجد، وأن الفتنة التي وقعت في عثمان وعليّ كانت بسبب ضعف السلطة التنفيذية لا بسبب قوّتها. وفي المقابل كان لناقديه ما يُبرّره: أن قوة السلطة لا تعني إلغاء المسؤولية، وأن استقرار الدولة لا يُشترى بتوريث الحكم لمن لا يصلح له. وقد ظلّ هذا الجدل قائمًا في الفكر السياسي الإسلامي إلى العصر الحديث.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eعام الجماعة\u003c/b\u003e\u003cspan\u003eسنة ٤١هـ، سُمّيت بذلك لأن الأمة اجتمعت على إمامٍ واحد بعد أربع سنوات من الفتنة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمدة ولايته للشام\u003c/b\u003e\u003cspan\u003eنحو عشرين سنة قبل الخلافة، وهي التي صنعت خبرته الإدارية والعسكرية.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eديوان الخاتم\u003c/b\u003e\u003cspan\u003eأول تنظيم بيروقراطي يمنع تزوير الرسائل الرسمية، أُنشئ في عهده.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمدة خلافته\u003c/b\u003e\u003cspan\u003eتسع عشرة سنة، وهي أطول خلافة متصلة في تاريخ الدولة الأموية.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالشرط الذي لم يُنفَّذ\u003c/b\u003e\u003cspan\u003eكفّ السبّ عن عليّ؛ فقد استمرّ على المنابر حتى أوقفه عمر بن عبد العزيز.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمسألة\u003c/th\u003e\u003cth\u003eفي الخلافة الراشدة\u003c/th\u003e\u003cth\u003eفي عهد معاوية\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eطريقة الوصول\u003c/td\u003e\u003ctd\u003eشورى أو وصية أو بيعة أهل الحل والعقد\u003c/td\u003e\u003ctd\u003eبيعةٌ بعد صلحٍ، ثم توريثٌ لاحق\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالعاصمة\u003c/td\u003e\u003ctd\u003eالمدينة المنورة\u003c/td\u003e\u003ctd\u003eدمشق، وهي مركز جيشٍ ودولة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eبيت المال\u003c/td\u003e\u003ctd\u003eمال المسلمين يُوزّع ولا يُتصرّف فيه\u003c/td\u003e\u003ctd\u003eخزينة دولة تُصرف على الجيش والإدارة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمسؤولية\u003c/td\u003e\u003ctd\u003eمحاسبةٌ علنية في المسجد\u003c/td\u003e\u003ctd\u003eلا محاسبة، والحلم يُغني عنها\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالفتوح\u003c/td\u003e\u003ctd\u003eمتوقفة بسبب الفتنة\u003c/td\u003e\u003ctd\u003eمستأنفة في إفريقية والسند وجبهة القوقاز\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eإني لا أضع سيفي حيث يكفيني سوطي، ولا سوطي حيث يكفيني لساني.\u003c/p\u003e\u003ccite\u003eكلمة تُنسب إلى معاوية بن أبي سفيان، وتلخّص منهجه في الحكم\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eانتقل الحكم إلى معاوية بصلحٍ أنهى الدماء وأعاد الوحدة، لكنه أسّس في الوقت نفسه دولةً مركزيةً تقوم على الجيش والإدارة، وفتح باب التوريث الذي سيُنتج كربلاء بعد عشرين سنة. فعام الجماعة كان في الظاهر نهاية الفتنة، وفي العمق بداية سؤالٍ جديد: هل يُشترط في الحاكم أن يكون الأفضل، أم يكفي أن يكون الأقدر؟\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"damascus","n":"دمشق عاصمةً للدولة","ic":"🕌","part":"القسم الأول: التأسيس وانتقال الخلافة","h":"\u003carticle class=\"ch3\" id=\"damascus\" data-toc=\"دمشق عاصمةً للدولة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e١.٢\u003c/span\u003e\n          \u003ch3\u003e🕌 دمشق عاصمةً للدولة\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eل\u003c/span\u003eم تكن دمشق قبل الإسلام مدينةً مجهولة؛ كانت عاصمةً لولايةٍ بيزنطية كبيرة، وفيها كنيسة يوحنا المعمدان التي كانت أعظم كنائس الشام. ولمّا صارت عاصمة الخلافة سنة إحدى وأربعين بدأت تتحول من مدينةٍ إقليمية إلى مركز إمبراطوريةٍ يمتد من نهر السند إلى نهر الوادي الكبير، وفي هذا التحول تغيّر شكل المدينة ومعمارها ولغتها ووظائفها.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكانت دمشق في القرن الأول الهجري مدينةً داخل سورٍ قديم، وفي داخلها تخطيطٌ رومانيٌّ لم يتغيّر: شارعٌ مستقيم يُسمّى «الشارع المستقيم» يخترقها من بابها الشرقي إلى غربيها، وعلى جانبيه أعمدةٌ وأسواق. وكان المسلمون حين فتحوها قد اقتسموا كنائسها مناصفةً مع الروم، فصارت بعض الكنائس مساجدَ وبعضها بقي على حاله، وكانت المدينة تُدار من دار الإمارة قرب الباب الشرقي. وقد كان اختيار معاوية لدمشق قرارًا استراتيجيًّا أكثر منه قرارًا عاطفيًّا: فهي قريبة من الساحل الذي يبني فيه أسطوله، ومن حمص وقنّسرين حيث أجناده، ومن طريق التجارة إلى العراق والحجاز.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بدأ معاوية في توسيع المسجد الجامع، ثم جاء الوليد بن عبد الملك سنة سبعٍ وثمانين فهدم الكنيسة وبعض الكنائس المجاورة وبنى المسجد الأموي الكبير، واشترى من الروم ما هدمه بأموالٍ كثيرة، وشرط أن يُعاد بناء ما خُرّب في الروم إن فُتحت القسطنطينية. وقد استقدم للبناء صنّاعًا من فارس والروم والمغرب، وأرسل إلى ملك الروم يطلب منه أن يبعث بمن يعرف صناعة الفسيفساء، فبعث له مئتي صانع. وقد كلّف البناء خراج الشام سنتين كاملتين، وهو رقمٌ يدل على حجم المشروع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي عهد الأمويين صارت دمشق مركزًا لنوعٍ جديد من العمارة الإسلامية: القصر والحمّام والبستان والقناة. فقد بنوا قصورًا خارج المدينة مثل قصر الحير الغربي والشرقي، وخانًا للقوافل، وأقاموا شبكةً من القنوات تجلب الماء من بردى إلى الحقول والبيوت. وقد كان في المدينة في عهد هشام بن عبد الملك من الحدائق والأنهار ما وصفه الشعراء ووصفه الجغرافيون، حتى قيل إن بردى سبعة أنهار، وإن المدينة تُشبه دمشقَ الجنة في الحديث النبوي المشهور. وكان هذا العمران يُموَّل من خراجٍ ثابت، ويُدار بواسطة ديوانٍ مركزي.\u003c/p\u003e\u003cp class=\"ap\"\u003eلكن دمشق لم تكن عاصمةً للعرب وحدهم، بل صارت مدينةً متعددة الأديان والألسنة. فقد كان فيها نصارى يعملون في الدواوين، ويهود، وموالٍ من الفرس والروم والقبط، وكانت اللغة اليونانية لا تزال لغةَ الحساب في الديوان إلى أن عُرّب في عهد عبد الملك. وقد كان هذا التنوع مصدر قوةٍ للدولة في البداية؛ لأنها استفادت من خبراتٍ إدارية قديمة، ثم صار مصدر ضعفٍ في النهاية؛ لأن الخلافة لم تُبنِ جيشًا واحدًا متجانسًا بل جيوشًا قبلية متنافسة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد تغيّر وجه المدينة في العصر العباسي بعد سقوط الدولة؛ فقد نُقلت العاصمة إلى بغداد، وفقدت دمشق وظيفتها السياسية، لكنها بقيت مركزًا تجاريًّا وعلميًّا، وظلّ المسجد الأموي فيها أحد أعظم مساجد الإسلام. وقد كان هذا مصيرًا مشتركًا لكل عواصم الأمويين تقريبًا: أن تبقى المدينة قائمةً بعد سقوط الدولة، وأن يبقى أثرها المعماري شاهدًا على أنها كانت يومًا مركزًا للعالم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في دمشق ما لم يكن في المدينة المنورة: دارٌ للخليفة منفصلة عن المسجد، وحرسٌ مسلّح، وبابٌ يُحجَب به الخليفة، ومقصورةٌ في المسجد يصلّي فيها دون أن يمسّه الناس. وقد روى المؤرخون أن معاوية كان أول من اتّخذ المقصورة في المسجد، وأول من جلس على سريرٍ في الخطبة. وهذه التفاصيل الصغيرة تُبيّن تحوّلًا كبيرًا في مفهوم الحكم: أن الخليفة لم يعد واحدًا من الناس يجلس في صحن المسجد، بل صار شخصًا له مسافةٌ وحاجبٌ ومكانٌ مرتفع، وهذه المسافة ستزداد في العصور التالية حتى تصير الخليفة في بغداد محجوبًا بسبعة حُجّاب.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالمسجد الأموي: سياسةٌ في الحجر\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان المسجد الأموي مشروعًا سياسيًّا قبل أن يكون مشروعًا دينيًّا. فالدولة التي كانت تُتَّهم بأنها ملكٌ لا خلافةٌ احتاجت إلى أثرٍ بصري يمنحها الشرعية، ويقول للناس: إن هذا الحكم قادرٌ على أن يبني ما لم يبنه أحد. وقد جُعلت الفسيفساء في المسجد تصوّر مدنًا وأنهارًا وأشجارًا، ولم تصوّر كائنًا حيًّا؛ وهي دلالةٌ على أن الفن الإسلامي المبكر كان قد بدأ يتشكّل في اتجاه الزخرفة لا التصوير.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بلغ طول المسجد نحو مئة وسبعين مترًا، وله ثلاث مآذن، وصحنه مفروش بالرخام، وجدرانه المئة مكسوّة بالفسيفساء الذهبية. وقد قال أحد المؤرخين إنه لم يكن في الإسلام مسجدٌ أجمل منه، وإن الواقف فيه يظن نفسه في بستان. وقد بقي المسجد قائمًا بعد سقوط الدولة، وبقيت فيه آثار الفسيفساء إلى اليوم، وهي من أهم ما وصلنا من الفن الأموي.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eقصور البادية والانتقال إلى الحضر\u003c/h4\u003e\u003cp class=\"ap\"\u003eبنى الأمويون في البادية الشامية والأردنية مجموعةً من القصور التي تُعرف اليوم بالقصور الصحراوية، مثل قصير عمرة والخرانة والمشتى وقصر الحير. وكانت هذه القصور تُستخدم للصيد والاستجمام ولقاء القبائل، لكنها كانت أيضًا مراكز اقتصادية؛ فقد كانت تُشرف على الآبار والقنوات والزراعة في المناطق الجافة، وكانت في الوقت نفسه محطاتٍ على طرق التجارة والحج.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كشفت هذه القصور عن مستوى عالٍ من التقنية: حمّاماتٌ ذات تدفئة أرضية، وقنواتٌ لجلب الماء، ونظامٌ للتبريد بالهواء، وفسيفساء تُصوّر الصيد والموسيقى والرقص. وفي قصير عمرة تصويرٌ لملوك الأرض يجتمعون، وفيه دلالةٌ سياسية: أن الخليفة وارثٌ لملكٍ عالمي، لا حاكمٌ محلي فقط. وهذه القصور لم تكن ترفًا فقط، بل كانت أدواتَ سلطةٍ في الصحراء.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eاللغة والدواوين\u003c/h4\u003e\u003cp class=\"ap\"\u003eظلّت الدواوين في الشام تُكتب باليونانية إلى عهد عبد الملك، وفي العراق بالفارسية، وفي مصر بالقبطية. وكان هذا يعني أن الدولة الإسلامية كانت تُدار بلغاتٍ أجنبية في أكثر أمصارها، وأن الموالي كانوا هم الذين يعرفون الحساب والكتابة. وقد كان في هذا خطرٌ سياسي: أن يكون الجهاز الإداري في يد من لا يعرف لغة القرآن ولا يشارك الأمة في ثقافتها.\u003c/p\u003e\u003cp class=\"ap\"\u003eولمّا عُرّبت الدواوين صارت العربية لغةَ الدولة، وصار الموظفون يُشترط فيهم أن يعرفوها، فبدأ جيلٌ جديد من الكتّاب العرب. وقد كان لهذا أثرٌ ثقافي هائل: أن اللغة العربية انتقلت من لغة شعرٍ وقرآن إلى لغة إدارةٍ وقانونٍ وحساب، وأنها اكتسبت من الدواوين مصطلحاتٍ جديدة، واحتاجت إلى قواعدَ تُضبط بها، فبدأ علم النحو في البصرة والكوفة في هذا العصر نفسه.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسنة بناء المسجد\u003c/b\u003e\u003cspan\u003e٨٧هـ في عهد الوليد بن عبد الملك، وأشرف عليه أخوه مسلمة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالفسيفساء\u003c/b\u003e\u003cspan\u003eأرسل ملك الروم مئتي صانع للمساعدة في تنفيذها، وهي من أوسع ما وصلنا من الفن الأموي.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالكلفة\u003c/b\u003e\u003cspan\u003eقيل إنها بلغت خراج الشام سنتين كاملتين.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمقصورة\u003c/b\u003e\u003cspan\u003eأول ما اتُّخذ في المسجد لعزل الخليفة عن الناس، وكان ذلك في عهد معاوية.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eقصور البادية\u003c/b\u003e\u003cspan\u003eقصير عمرة والخرانة والمشتى وقصر الحير، وهي مراكز اقتصادية وسياسية لا ترفًا فقط.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمدينة\u003c/th\u003e\u003cth\u003eوظيفتها قبل الإسلام\u003c/th\u003e\u003cth\u003eوظيفتها في العهد الأموي\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eدمشق\u003c/td\u003e\u003ctd\u003eعاصمة ولاية بيزنطية\u003c/td\u003e\u003ctd\u003eعاصمة الخلافة ومركز الدواوين والجيش\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eحمص\u003c/td\u003e\u003ctd\u003eمدينة تجارية في وسط الشام\u003c/td\u003e\u003ctd\u003eقاعدة جندٍ من أجناد الشام\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالقدس\u003c/td\u003e\u003ctd\u003eمدينة مقدسة عند الروم\u003c/td\u003e\u003ctd\u003eمدينة مقدسة عند المسلمين، وفيها قبة الصخرة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eعمّان\u003c/td\u003e\u003ctd\u003eبلدة صغيرة في البلقاء\u003c/td\u003e\u003ctd\u003eمحطة على طريق الحج وموقع قصرٍ أموي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالرصافة\u003c/td\u003e\u003ctd\u003eحصنٌ على الفرات\u003c/td\u003e\u003ctd\u003eمقرٌّ صيفي لهشام بن عبد الملك\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eإن دمشق من أحسن مدن الله، وأكثرها خيرًا وأرخصها سعرًا وأطيبها ماءً.\u003c/p\u003e\u003ccite\u003eمن وصف الجغرافيين والرحّالين العرب لدمشق\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eلم تكن دمشق مجرد مكانٍ انتقل إليه الخليفة، بل كانت مشروعًا سياسيًّا: مسجدٌ يُبهر، وقصرٌ يُحكم، وديوانٌ يُدير، وقناةٌ تُسقي. وبها تحوّل الإسلام من دولةٍ في المدينة إلى إمبراطوريةٍ في العالم القديم، وبها أيضًا بدأت المسافة بين الحاكم والمحكوم تتّسع.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"karbala","n":"كربلاء وولاية يزيد","ic":"💔","part":"القسم الأول: التأسيس وانتقال الخلافة","h":"\u003carticle class=\"ch3\" id=\"karbala\" data-toc=\"كربلاء وولاية يزيد\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e١.٣\u003c/span\u003e\n          \u003ch3\u003e💔 كربلاء وولاية يزيد\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي سنة ستين للهجرة مات معاوية، فبايع أهل الشام ابنه يزيد، وكانت هذه أول وراثةٍ للخلافة في الإسلام. وفي المدينة ومكة والكوفة كان في الناس من رأى أن البيعة لم تكن صحيحة، وأن الحسين بن عليّ أولى بها. وفي العاشر من محرم سنة إحدى وستين وقعت في كربلاء حادثةٌ صارت أشدّ جرحٍ في ذاكرة الأمة، وظلّت تُحيّا كل عام بعد أربعة عشر قرنًا.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان يزيد بن معاوية قد وُلد في خلافة عثمان، ونشأ في الشام، وولّاه أبوه على بعض الغزوات في الصيف، لكنه لم يُعرف بحكمٍ ولا بإدارةٍ قبل الخلافة. ولمّا مات معاوية في رجب سنة ستين، أخذ البيعة له والي المدينة الوليد بن عتبة، فامتنع الحسين بن عليّ وعبد الله بن الزبير. وقد كان امتناعهما ذا معنىً سياسي كبير: أنهما لم يقولا إن البيعة باطلةٌ بالمعنى الشرعي المحض، بل قالا إن هذه البيعة أُخذت بالإكراه ولم تُستوفَ فيها الشورى، وإن السكوت عنها يعني قبول مبدأ التوريث إلى الأبد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد خرج الحسين من المدينة إلى مكة، وفي مكة أقام أشهرًا، ووصلته رسائل من أهل الكوفة يطلبون منه القدوم ليبايعوه، فبعث ابن عمه مسلم بن عقيل ليُبايع له، فبايعه في الكوفة عددٌ كبير. ثم تغيّر الوضع عندما ولّى يزيد على الكوفة عبيد الله بن زياد، فأخذ مسلمًا وقتله، وأرهب الناس حتى تفرّقوا عن الحسين قبل أن يصل. وقد خرج الحسين من مكة متوجهًا إلى العراق في ذي الحجة سنة ستين، ومعه أهل بيته ونحوٌ من سبعين رجلًا من أصحابه، ولم يكن يعلم أن أهل الكوفة قد خذلوه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي الثاني من محرم سنة إحدى وستين نزل الحسين في كربلاء، فحاصرته جيوش عبيد الله بن زياد بقيادة عمر بن سعد، ومنعته من الماء. وقد جرت بينه وبينهم مفاوضاتٌ عرض فيها أن يرجع إلى الحجاز، أو يذهب إلى ثغرٍ من ثغور المسلمين، أو يلقى يزيد بنفسه، لكن عبيد الله أصرّ على أن يستسلم استسلامًا كاملًا. ولمّا رفض، بدأ القتال في العاشر من محرم، فقُتل الحسين وأهل بيته وأصحابه، وحُملت رؤوسهم إلى الكوفة ثم إلى دمشق. وقد كان في مقتل الحسين من الفظاعة ما جعل حتى بعض أهل الشام يُنكرونه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان لهذه الحادثة أثرٌ لا يُقاس في تاريخ المسلمين. فقد تحوّل الحسين إلى رمزٍ للثائر على الظلم، وتحوّلت كربلاء إلى مكانةٍ مقدسةٍ عند الشيعة، وصارت زيارة الأربعين من أعظم شعائرهم. وعند السنة أيضًا بقيت الحادثة جرحًا؛ فقد روى كثير من العلماء أن النبيّ قال في الحسن والحسين إنهما سيّدا شباب أهل الجنة، وأن كثيرًا منهم توقّف في يزيد ولم يُسمّه، ومنهم من أطلق عليه «يزيد» فقط دون لقب الخلافة. ومن هنا بدأ في الفكر السياسي الإسلامي بابٌ واسع: متى يجوز الخروج على الحاكم الجائر؟\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد تفرّع الناس في هذا السؤال إلى ثلاثة مذاهب: مذهبٍ يرى الخروج واجبًا على كل حال، ومذهبٍ يرى الصبر وترك الفتنة، ومذهبٍ ثالث يفرّق بين الجور الذي يُحتمل والجور الذي يُفسد الدين. وقد كان لهذه المسألة أثرٌ عملي في كل ثورةٍ قامت بعد ذلك: في ثورة المدينة سنة ثلاث وستين، وفي ثورة المختار، وفي خروج زيد بن عليّ، وفي ثورة العباسيين أنفسهم. والغريب أن الثورة العباسية نفسها استعملت شعار «الرضا من آل محمد» لتُسقط الأمويين، ثم ورثت الحكم كما ورثه الأمويون.\u003c/p\u003e\u003cp class=\"ap\"\u003eومن الناحية العسكرية لم تكن كربلاء معركة؛ فقد كان الفريقان غير متكافئين أصلًا. لكنها كانت أشدّ من معركة في نتائجها؛ لأنها حوّلت الصراع على الحكم إلى صراعٍ على الشرعية الأخلاقية. فبعد كربلاء لم يستطع أيُّ حاكمٍ أن يقول إنه فوق النقد، وصار في وجدان الأمة معيارٌ يقول: إن الحقّ لا يقاس بمن انتصر، وإن الدم الذي يُسفك ظلمًا يبقى حيًّا في الذاكرة أطول من الدولة التي سفكته.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eبيعة يزيد ومبدأ التوريث\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت بيعة يزيد أول انتقالٍ وراثيٍّ في الإسلام، وقد أخذها معاوية بالترغيب والترهيب معًا: فقد كتب إلى الأمصار، وأرسل الوفود، واستعمل المال، وهدّد من يرفض. وقد كان في الصحابة يومئذٍ من لم يُبايع، كالحسين وعبد الله بن الزبير وعبد الرحمن بن أبي بكر، وكان في التابعين من أنكرها علنًا كسعيد بن المسيب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد احتجّ مؤيّدو البيعة بأن معاوية اجتهد لمصلحة الأمة، وأن الفتنة إذا قامت بعد موته كانت أشدّ من التوريث. واحتجّ المنكرون بأن الشورى أصلٌ لا يجوز تركه، وأن فساد المبدأ أخطر من فتنةٍ عارضة. والحقّ أن المسألة لم تُحلّ في ذلك الزمان، بل بقيت مفتوحة، ولذلك لم تُقم خلافةٌ بعد الأمويين إلا على نوعٍ من القهر أو الغلبة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالخذلان: أهل الكوفة ومسلم بن عقيل\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الكوفة في ذلك الوقت مدينةً كبيرة فيها شيعةٌ لعليّ وأهل بيته، وفيها أيضًا قبائلُ متخاصمة وأشرافٌ يطلبون المناصب. وقد كتب أهلها إلى الحسين أكثر من رسالة يطلبون منه القدوم، لكنهم لم يكونوا مستعدين للقتال؛ فحين خرج مسلم بن عقيل وبايعوه، ثم جاء عبيد الله بن زياد، تفرّقوا عنه في أيامٍ قليلة، حتى قيل إنه بقي في بيتٍ وحده.\u003c/p\u003e\u003cp class=\"ap\"\u003eوهذه الخذلة صارت مثلًا في التاريخ العربي، ويُروى أن الحسين قال في كربلاء كلمةً تُنسب إليه: «ألا إن الدعيَّ ابن الدعي قد ركز بين اثنتين: بين السلة والذلة، وهيهات منا الذلة». والخذلان نفسه كان درسًا سياسيًّا: أن الحماسة في الرسائل لا تُغني عن التنظيم، وأن من يُحرّض ولا يحضر لا يُحتسب له شيء.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eما بعد كربلاء: ثورة المدينة والمختار\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم تسكت الأمة بعد كربلاء. فقد ثار أهل المدينة سنة ثلاث وستين وأخرجوا عامل يزيد، فبعث إليهم جيشًا في وقعة الحرة، فاستباح المدينة ثلاثة أيام. ثم حاصر مكة، وفي أثناء الحصار مات يزيد، فانسحب الجيش. وفي الكوفة قام المختار بن أبي عبيد سنة ستٍّ وستين يطلب بدم الحسين، فقتل من شارك في قتله، لكن حركته انتهت سنة سبعٍ وستين بقتله على يد مصعب بن الزبير.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت هذه الحركات كلها علامةً على أن الدولة الأموية قامت على جرحٍ لم يندمل. وقد نجحت في إخمادها بالقوة، لكنها لم تنجح في إقناع الناس بشرعيتها؛ ولذلك لم تمرّ سنواتٌ قليلة حتى جاءت الفتنة الثانية التي كادت تُسقط الدولة، ثم جاءت الثورة العباسية التي أسقطتها فعلًا.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالتاريخ\u003c/b\u003e\u003cspan\u003eالعاشر من محرم سنة ٦١هـ، في كربلاء على الفرات في العراق.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eعدد أصحاب الحسين\u003c/b\u003e\u003cspan\u003eنحو سبعين رجلًا مع أهل بيته، بحسب أكثر الروايات.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالحصار\u003c/b\u003e\u003cspan\u003eمن الثاني إلى العاشر من محرم، ومُنع الماء قبل القتال.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأول وراثة\u003c/b\u003e\u003cspan\u003eبيعة يزيد سنة ٦٠هـ كانت أول انتقالٍ وراثيٍّ للخلافة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eوقعة الحرة\u003c/b\u003e\u003cspan\u003eسنة ٦٣هـ، بعد ثورة المدينة على يزيد.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e٦٠هـ\u003c/td\u003e\u003ctd\u003eموت معاوية وبيعة يزيد\u003c/td\u003e\u003ctd\u003eرفض الحسين وابن الزبير، وبداية الأزمة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٦٠هـ\u003c/td\u003e\u003ctd\u003eمسلم بن عقيل في الكوفة\u003c/td\u003e\u003ctd\u003eبيعةٌ ثم خذلانٌ ثم قتل\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٦١هـ\u003c/td\u003e\u003ctd\u003eكربلاء\u003c/td\u003e\u003ctd\u003eمقتل الحسين، وتحوّل الحادثة إلى رمزٍ دائم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٦٣هـ\u003c/td\u003e\u003ctd\u003eوقعة الحرة\u003c/td\u003e\u003ctd\u003eاستباحة المدينة، وتعميق الكراهية للدولة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٦٤هـ\u003c/td\u003e\u003ctd\u003eحصار مكة وموت يزيد\u003c/td\u003e\u003ctd\u003eانفراط عقد الدولة ودخول الفتنة الثانية\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eهيهات منا الذلة.\u003c/p\u003e\u003ccite\u003eكلمة تُنسب إلى الحسين بن عليّ في كربلاء\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eكانت كربلاء نتيجةً منطقيةً لتوريث الحكم بلا شورى، وخذلانًا من أهل الكوفة، وقسوةً من والي العراق. وقد مات الحسين لكنه انتصر في الذاكرة، وسقطت هيبة الدولة الأموية في وجدان كثير من المسلمين، فلم تبقَ بعدها دولةٌ قادرة على أن تُقنع الناس بأنها خلافةٌ لا مُلك.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"second-fitna","n":"الفتنة الثانية وقيام مروان","ic":"🌪️","part":"القسم الأول: التأسيس وانتقال الخلافة","h":"\u003carticle class=\"ch3\" id=\"second-fitna\" data-toc=\"الفتنة الثانية وقيام مروان\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e١.٤\u003c/span\u003e\n          \u003ch3\u003e🌪️ الفتنة الثانية وقيام مروان\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eب\u003c/span\u003eين سنة أربعٍ وستين وسبعين للهجرة عاشت الأمة أخطر سنواتها: ثلاث خلافاتٍ في وقتٍ واحد، وحرائق في مكة، وطاعون، وجيشٌ يحاصر الكعبة، وثوراتٌ في كل مصر. وقد خرجت الدولة من هذه الفتنة أسوأ مما دخلتها: أقوى جيشًا، وأضعف شرعية، وأشدّ اعتمادًا على القهر.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eمات يزيد بن معاوية سنة أربعٍ وستين في أثناء حصار مكة، ولم يكن قد استخلف أحدًا، فبايع أهل الشام ابنه معاوية بن يزيد، وكان شابًّا صالحًا لكنه لم يرد الخلافة، فاعتزلها ومات بعد أشهر. فلم يبقَ في البيت الأموي من يجمع الشام، وبدأت القبائل تتنازع: القيسية واليمانية، وكلٌّ منهما تريد خليفةً منها. وفي هذه الفوضى برز مروان بن الحكم، وكان شيخًا من بني أمية قديمًا، فنصّبه أهل الشام خليفةً في سنة أربعٍ وستين، فبدأ ما يُعرف بالفرع المرواني من الدولة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي الحجاز كان عبد الله بن الزبير قد بويع بالخلافة بعد موت يزيد، وسيطر على مكة والمدينة واليمن والعراق ومصر في سنواتٍ قليلة، وصار له الأمر في معظم الأمة إلا الشام. لكن خلافته كانت خلافًا بلا دولة: فقد رفض أن يخرج من مكة، ولم يبنِ جيشًا نظاميًّا، ولم يستطع أن يضبط العراق الذي كان يتنازعه المختار ومصعب بن الزبير. وقد كان ابن الزبير رجلًا صادقًا شجاعًا، لكنه لم يكن رجلَ دولةٍ بالمعنى الذي كانت الأمة تحتاجه في تلك اللحظة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سنة خمسٍ وستين مات مروان بن الحكم بعد تسعة أشهر من خلافته، فخلفه ابنه عبد الملك، وكان عبد الملك من أشدّ خلفاء بني أمية وأكثرهم قدرةً على الإدارة والحرب معًا. وقد وجد الدولة ممزّقة: الشام وحدها له، والعراق للزبيريين، والحجاز لابن الزبير، وخراسان في اضطراب، وجبهة الروم مفتوحة. فبدأ يوحّد الشام أولًا، ثم أرسل جيوشه إلى العراق سنة إحدى وسبعين بقيادة الحجاج بن يوسف الثقفي، فقتل مصعب بن الزبير، ودخل الكوفة.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم توجّه الحجاج إلى مكة وحاصر ابن الزبير في الحرم، ونصب المنجنيق على أبي قبيس، وقيل إنه رماها بالحجارة والنار حتى تهدّمت أجزاءٌ من الكعبة. وفي جمادى الأولى سنة ثلاثٍ وسبعين قُتل عبد الله بن الزبير وهو يقاتل عند الكعبة، وبمقتله انتهت الفتنة الثانية واستقرّ الأمر لعبد الملك. وقد كان في مقتل ابن الزبير في الحرم وفي إحراق الكعبة ما زاد في نقمة الناس على الأمويين، وفي الوقت نفسه ما دلّ على أن الدولة صارت قادرةً على أن تفعل ما تريد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت الفتنة الثانية أشدّ من الأولى في آثارها؛ لأنها لم تكن صراعًا على من يحكم فقط، بل كانت أيضًا صراعًا على مكانة الحرمين، وعلى معنى الخلافة نفسها. وقد خرجت منها الدولة بمبدأٍ جديد: أن الحكم يُحسم بالقوة، وأن المعارضة تُقابل بالحديد لا بالحوار. وقد صار هذا المبدأ سياسةً رسمية في عهد عبد الملك والحجاج، وظهر في كل شيء: في بناء الجيش، وفي إدارة الأمصار، وفي طريقة التعامل مع العلماء، وفي اللغة التي كُتبت بها الرسائل الرسمية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان لهذه الفتنة أثرٌ في توزيع القوى داخل الدولة أيضًا. فقد صعدت القيسية في الشام، وصعدت قبائل اليمن في خراسان، وصار الجيش الأموي جيشًا قبليًّا لا جيشَ دولة. وقد ظهر هذا في كل الأزمات التالية: في ثورة زيد، وفي حركة الخوارج، وفي سقوط الدولة نفسها سنة اثنتين وثلاثين ومئة، حين انهار الجيش الأموي من الداخل قبل أن يصل إليه العباسيون.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eمروان بن الحكم ومبدأ الفرع المرواني\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان مروان بن الحكم من بني أمية، وقد كان كاتبًا لمعاوية وعاملًا له على المدينة في بعض الفترات، وكان معروفًا بالدهاء والخبرة الإدارية. ولم يكن وصوله إلى الخلافة نتيجة شورى عامة، بل نتيجة صراعٍ بين قبائل الشام في لحظة فراغ، وهذا ما جعل شرعيته ضعيفةً من البداية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد حكم تسعة أشهر فقط، لكنه في هذه الأشهر ثبّت قواعد الحكم في الشام، وعهد بالخلافة إلى ابنه عبد الملك، فصار الحكم في عقبه لا في عقب أبي سفيان. ومن هنا انقسمت الدولة الأموية إلى فرعين: السفياني، والمرواني، وكان الفرع الثاني هو الذي حكم سبعين سنة بعد ذلك.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eحصار مكة وحرق الكعبة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان حصار مكة سنة ثلاثٍ وسبعين من أقسى ما جرى في تاريخ الحرم. فقد نصب الحجاج المنجنيق على الجبال المحيطة، ورماها بالحجارة والنار، وتضرّرت الكعبة، وقُتل من أهل مكة عددٌ كبير. وقد روى المؤرخون أن ابن الزبير كان يصلّي في الحرم والنار تُشتعل حوله، وأنه قال كلمةً تُنسب إليه: «ما أبالي لو خرّ عليّ سقف البيت».\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أثار هذا الحدث سؤالًا فقهيًّا وسياسيًّا: هل يجوز قتال من تحصّن في الحرم؟ وقد أجاز بعض العلماء ذلك إذا كان الخارج باغيًا، ومنع منه آخرون مطلقًا. وقد بقي هذا السؤال حاضرًا في كل أزمةٍ مرّت بالحرمين بعد ذلك، من القرامطة إلى العصر الحديث. وقد اختلف الفقهاء أيضًا في حكم من قُتل في الحرم خطأً، وفي دية من مات تحت الحصار، وفي مشروعية هدم ما تضرّر من الكعبة وإعادة بنائه على غير ما كان عليه إبراهيم. وقد أعاد عبد الملك بناءها بعد ذلك على هيئةٍ غير هيئة ابن الزبير، ثم أعادها الحارث بن أبي ربيعة إلى ما كانت عليه في عهد النبيّ، وهي الهيئة التي بقيت إلى اليوم.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eأثر الفتنة في بنية الدولة\u003c/h4\u003e\u003cp class=\"ap\"\u003eخرجت الدولة من الفتنة الثانية أشدّ مركزيةً وأكثر اعتمادًا على الجيش. فقد صار الخليفة يعتمد على جيشٍ دائم من الشام، وصار الولاة يُختارون من قادة الجيش، وصار الحجاج نموذجًا للوالي القوي الذي يُدير إقليمًا بالحديد. وقد كان لهذا نجاحٌ في ضبط الأمصار، لكنه كان يعني أن الدولة لم تكن محبوبةً بل مَرهوبة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ظهر هذا في العلاقة مع العلماء: فقد كان الحسن البصري وسعيد بن المسيّب وأمثالهما ينتقدون الولاة، وكان الولاة يضربون ويقتلون ويحبسون. ومع ذلك لم تُغلق أبواب المساجد، ولم تتوقف حركة العلم، بل صار هذا العصر نفسه عصر تدوين الحديث وبداية الفقه المنتظم، وكأنّ الأمة عوّضت ما فقدته في السياسة بما بنته في العلم.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمدة الفتنة\u003c/b\u003e\u003cspan\u003eمن سنة ٦٤هـ إلى ٧٣هـ، أي نحو تسع سنوات.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eعدد الخلفاء في وقتٍ واحد\u003c/b\u003e\u003cspan\u003eثلاثة: مروان في الشام، وابن الزبير في الحجاز، ومصعب في العراق.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمقتل ابن الزبير\u003c/b\u003e\u003cspan\u003eسنة ٧٣هـ بعد حصار مكة، وبمقتله انتهت الفتنة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالفرع المرواني\u003c/b\u003e\u003cspan\u003eبدأ بمروان بن الحكم، واستمر في عقبه إلى سقوط الدولة سنة ١٣٢هـ.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأثر الحصار\u003c/b\u003e\u003cspan\u003eتضرّر بناء الكعبة، وأُعيد بناؤها بعد ذلك في عهد عبد الملك.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالخليفة في الشام\u003c/th\u003e\u003cth\u003eالخليفة في الحجاز\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e٦٤هـ\u003c/td\u003e\u003ctd\u003eمعاوية بن يزيد\u003c/td\u003e\u003ctd\u003eعبد الله بن الزبير\u003c/td\u003e\u003ctd\u003eموت يزيد وتفكّك الشام\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٦٤هـ\u003c/td\u003e\u003ctd\u003eمروان بن الحكم\u003c/td\u003e\u003ctd\u003eعبد الله بن الزبير\u003c/td\u003e\u003ctd\u003eقيام الفرع المرواني\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٦٥هـ\u003c/td\u003e\u003ctd\u003eعبد الملك\u003c/td\u003e\u003ctd\u003eعبد الله بن الزبير\u003c/td\u003e\u003ctd\u003eبداية إعادة التوحيد\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٧١هـ\u003c/td\u003e\u003ctd\u003eعبد الملك\u003c/td\u003e\u003ctd\u003eعبد الله بن الزبير\u003c/td\u003e\u003ctd\u003eالحجاج يدخل العراق ويقتل مصعبًا\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٧٣هـ\u003c/td\u003e\u003ctd\u003eعبد الملك\u003c/td\u003e\u003ctd\u003e—\u003c/td\u003e\u003ctd\u003eحصار مكة ومقتل ابن الزبير ونهاية الفتنة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eما أبالي لو خرّ عليّ سقف البيت.\u003c/p\u003e\u003ccite\u003eكلمة تُنسب إلى عبد الله بن الزبير في أثناء حصار مكة\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eأنهت الفتنة الثانية تسع سنوات من الانقسام، لكنها رسّخت مبدأً خطيرًا: أن الحكم يُحسم بالقوة لا بالشورى. وقد خرجت الدولة منها موحّدةً على الورق، منقسمةً في القلوب، فاحتاجت إلى عبد الملك والحجاج ليبنيا لها إدارةً ونقدًا ولغةً موحّدة، وإلى القوة لتُبقيها قائمة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-2","n":"القسم الثاني: التوسع إلى الأطراف","ic":"","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-2\" style=\"--c:#4B0082\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🗺️\u003c/div\u003e\n      \u003ch2\u003eالقسم الثاني: التوسع إلى الأطراف\u003c/h2\u003e\n      \u003cp\u003eفي سبعين سنة امتدّت الدولة من نهر السند إلى نهر الوادي الكبير، وهو اتساعٌ لم تعرفه إمبراطوريةٌ في ذلك الزمان بهذه السرعة. ولم يكن هذا الفتح حركةً واحدة، بل كان أربع جبهاتٍ في وقتٍ واحد: إفريقية والأندلس في الغرب، وما وراء النهر والقوقاز في الشرق، والبحر في الوسط. وكل جبهةٍ منها كانت قصةً مستقلة، وقائدًا مختلفًا، وحسابًا خاصًّا.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#ifriqiya\"\u003eإفريقية والقيروان\u003c/a\u003e\u003ca href=\"#andalus\"\u003eفتح الأندلس\u003c/a\u003e\u003ca href=\"#caucasus\"\u003eجبهة الشرق: ما وراء النهر والقوقاز\u003c/a\u003e\u003ca href=\"#navy\"\u003eالأسطول الإسلامي والبحر\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"ifriqiya","n":"إفريقية والقيروان","ic":"🐎","part":"القسم الثاني: التوسع إلى الأطراف","h":"\u003carticle class=\"ch3\" id=\"ifriqiya\" data-toc=\"إفريقية والقيروان\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٢.١\u003c/span\u003e\n          \u003ch3\u003e🐎 إفريقية والقيروان\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eك\u003c/span\u003eانت إفريقية — تونس اليوم وشرق الجزائر — أخطر جبهةٍ في الغرب؛ لأنها كانت قاعدة الأسطول البيزنطي في غرب المتوسط، وفيها قبائل البربر في الجبال والبوادي، وفيها مدنٌ ساحلية محصّنة. وقد احتاج فتحها إلى ثلاثين سنة وأربع حملاتٍ كبيرة حتى استقرّ فيها الإسلام.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eبدأت حملات المسلمين إلى إفريقية في خلافة عمر بن الخطاب، حين أرسل عمرو بن العاص إلى طرابلس سنة ثلاثٍ وعشرين، ثم توقّف الفتح بأمر عمر لأنه قال إنه لا يريد أن يُغرّر بالمسلمين في أرضٍ بعيدة. ثم عاد الفتح في خلافة عثمان على يد عبد الله بن سعد بن أبي سرح، فانتصر في معركة سبيطلة سنة سبعٍ وعشرين، وأخذ من الغنائم ما لم يؤخذ في معركةٍ قبلها. لكن الفتح لم يكن مستقرًّا؛ فقد كان المسلمون يخرجون منها كلما خرجوا، لأنهم لم يبنوا مدينةً ولا حاميةً دائمة.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم جاءت الفتنة فتوقّف كل شيء، حتى استقرّ الأمر لمعاوية سنة إحدى وأربعين، فأرسل معاوية بن أبي سفيان جيشًا بقيادة معاوية بن حديج، فدخل إفريقية وضبطها، لكنه لم يبنِ مدينة. وفي سنة خمسين أرسل معاوية جيشًا آخر بقيادة عقبة بن نافع، وهو ابن عمّ عمرو بن العاص، وكان قد نشأ في الفتح الأول وعرف البلاد وأهلها. وفي هذه الحملة اختار عقبة موضعًا على بعد نحو خمسين فرسخًا من الساحل، وأسّس فيه مدينة القيروان سنة خمسين للهجرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان اختيار موقع القيروان قرارًا استراتيجيًّا عبقريًّا: فقد أراد عقبة أن يبني مدينةً داخلية بعيدة عن مدّ الأسطول البيزنطي، وفي موقعٍ تتصل به الطرق من كل الجهات، وفي أرضٍ صالحة للرعي والزراعة. وقد قال في خطبته عند تأسيسها كلمةً مشهورة: «إن أهل هذه البلاد قومٌ لا يفقهون، وإنهم لا يريدون إلا ما يريدون، وقد أردت أن أبني مدينةً تكون عزًّا للإسلام». وقد جعل فيها المسجد الجامع ودار الإمارة، ونقل إليها الناس من الأمصار.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم خرج عقبة في حملةٍ كبيرة إلى المغرب الأقصى سنة اثنتين وستين، فبلغ السوس، وقيل إنه بلغ المحيط الأطلسي، وأنه ضرب فرسه في الماء وقال: «يا ربّ لو كان هذا البحر لا يعبره أحدٌ إلا أنت، لقاتلتُ من ورائه». لكنه في عودته اعترضته قبائل البربر بقيادة كسيلة، فقُتل هو وأصحابه في تهودة سنة ثلاثٍ وستين، ومعه أبو المهاجر دينار. وكان هذا أول انقلابٍ كبير في الغرب، وبيّن أن البربر لم يكونوا قد دخلوا في الإسلام بعد.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم عادت إفريقية بيد البيزنطيين والبربر سنوات، حتى أرسل عبد الملك بن مروان حسان بن النعمان الغساني سنة أربعٍ وسبعين في جيشٍ كبير، فاستعاد القيروان وبنى مدينة تونس وأسّس دار صناعة السفن فيها، ثم انتصر على الكاهنة داهية البربر في معركةٍ كبيرة سنة اثنتين وسبعين أو ثلاثٍ وسبعين. وقد قتلت الكاهنة أسرى المسلمين، ثم قُتلت هي، وتمّ الفتح. ومنذ ذلك الحين صارت القيروان قاعدةً للفتح غربًا، ومنها خرج موسى بن نصير إلى الأندلس سنة اثنتين وتسعين.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان لفتح إفريقية أثرٌ عميق في التاريخ الإسلامي كله. فقد دخل البربر في الإسلام بعد ذلك أفواجًا، وصاروا عمودًا أساسيًّا في جيش الأندلس، وفي وقتٍ لاحق صاروا أساس الدولتين المرابطية والموحدية. وفي القيروان نشأت مدرسةٌ فقهيةٌ كبيرة، منها الإمام مالك بن أنس عن طريق تلاميذه، ومنها انتشر مذهب مالك في إفريقية والأندلس حتى صار المذهب السائد في الغرب الإسلامي كله.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eلماذا القيروان؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت مدن الساحل الإفريقي كلها مكشوفةً للأسطول البيزنطي، وكان البيزنطيون إذا هاجموا مدينةً استعادوها بسهولة لأن سكانها من الروم ومن معهم. فقرّر عقبة أن يبني مدينةً داخلية لا تصلها السفن، فتكون ملجأً للمسلمين في حال الهزيمة، وقاعدةً للانطلاق في حال الفتح، ومركزًا لنشر اللغة والدين.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد اختار موضعًا في سهلٍ فسيح، قريب من الجبال والطرق، وقيل إنه كان موضعًا تُرعى فيه الوحوش، فسمّاه الناس القيروان، وهي كلمةٌ فارسية معرّبة تعني «القافلة» أو «المعسكر». وقد صارت المدينة في قرنٍ واحدٍ من أعظم مدن الإسلام علمًا وعمارةً وتجارة. وقد وصف الجغرافيون القيروان بعد قرنٍ من تأسيسها بأنها مدينةٌ واسعة الأسواق، كثيرة المياه، وفيها جامعٌ عظيم وحمّاماتٌ وبساتين، وأنها كانت تُصدّر الزيت والحبوب إلى المشرق والأندلس.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eكسيلة والكاهنة: مقاومة البربر\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يكن البربر أعداءً للإسلام بذاته، بل كانوا يدفعون الجزية ويحكمون أنفسهم، وكان من مصلحة أشرافهم أن يبقوا بين قوتين يتنافسان. وقد استغل البيزنطيون ذلك، فتحالفوا مع كسيلة، ثم مع الكاهنة، وقاتلوا المسلمين سنوات. وقد كانت الكاهنة زعيمةً دينية وسياسية في جبال الأوراس، وقيل إنها أمرت بخراب المدن والبساتين لتُجبر المسلمين على الرحيل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان حلّ هذه المشكلة عند حسان بن النعمان سياسيًّا أكثر منه عسكريًّا: أنه أخذ البربر بالعطاء والتجنيد، فأدخلهم في الجيش، وأعطى قادتهم مناصب، حتى صار البربر هم عماد جيش إفريقية. ومنذ ذلك الحين تحوّلت المقاومة إلى مشاركة، ودخل البربر في الإسلام على نحوٍ لم يعد بعده خروجٌ عامّ.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالقيروان ومدرسة الغرب\u003c/h4\u003e\u003cp class=\"ap\"\u003eصارت القيروان في القرن الثاني والثالث مركزًا علميًّا موازيًا للمدينة والكوفة وبغداد. فقد درس فيها أسد بن الفرات، ونقل عن مالك بن أنس، وصار فقهه أساس المذهب المالكي في إفريقية. ومنها خرجت كتب «المدونة» و«العتبية»، وهي التي جمعت فقه الغرب على مذهب مالك.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان لهذا أثرٌ في تشكيل هوية الغرب الإسلامي: فالمغرب والأندلس صارا مالكيَّين، في حين بقي المشرق شافعيًّا وحنفيًّا في الأغلب. وهذا الاختلاف نشأ من جغرافية العلم لا من اختلاف العقيدة؛ لأن طلاب الغرب كانوا يذهبون إلى المدينة والقيروان، وطلاب المشرق كانوا يذهبون إلى الكوفة وبغداد.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eتأسيس القيروان\u003c/b\u003e\u003cspan\u003eسنة ٥٠هـ على يد عقبة بن نافع، وكانت أول مدينةٍ إسلامية في إفريقية.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمقتل عقبة\u003c/b\u003e\u003cspan\u003eسنة ٦٣هـ في تهودة، على يد كسيلة وقبائل البربر.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eحسان بن النعمان\u003c/b\u003e\u003cspan\u003eاستعاد إفريقية سنة ٧٤هـ، وبنى تونس ودار صناعة السفن.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالكاهنة\u003c/b\u003e\u003cspan\u003eزعيمة بربرية في جبال الأوراس، قاتلت المسلمين سنوات ثم قُتلت.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمذهب المالكي\u003c/b\u003e\u003cspan\u003eانتشر في الغرب من القيروان، وصار مذهب إفريقية والأندلس.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالقائد\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e٢٣هـ\u003c/td\u003e\u003ctd\u003eعمرو بن العاص\u003c/td\u003e\u003ctd\u003eأول حملة إلى طرابلس، ثم التوقف بأمر عمر\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٢٧هـ\u003c/td\u003e\u003ctd\u003eعبد الله بن سعد\u003c/td\u003e\u003ctd\u003eمعركة سبيطلة وغنائم كبيرة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٥٠هـ\u003c/td\u003e\u003ctd\u003eعقبة بن نافع\u003c/td\u003e\u003ctd\u003eتأسيس القيروان\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٦٣هـ\u003c/td\u003e\u003ctd\u003eعقبة بن نافع\u003c/td\u003e\u003ctd\u003eمقتله في تهودة بعد بلوغه السوس\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٧٤هـ\u003c/td\u003e\u003ctd\u003eحسان بن النعمان\u003c/td\u003e\u003ctd\u003eاستعادة إفريقية وبناء تونس\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eيا ربّ لو كان هذا البحر لا يعبره أحدٌ إلا أنت، لقاتلتُ من ورائه.\u003c/p\u003e\u003ccite\u003eكلمة تُنسب إلى عقبة بن نافع عند بلوغه المحيط\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eلم يكن فتح إفريقية فتحًا عسكريًّا فقط، بل كان تأسيسًا: مدينةٌ في القيروان، وأسطولٌ في تونس، ومذهبٌ في الفقه. وقد احتاج ثلاثين سنة وأربع حملاتٍ حتى يستقرّ، ثم صار قاعدةً لفتح الأندلس بعد عشرين سنة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"andalus","n":"فتح الأندلس","ic":"🌍","part":"القسم الثاني: التوسع إلى الأطراف","h":"\u003carticle class=\"ch3\" id=\"andalus\" data-toc=\"فتح الأندلس\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٢.٢\u003c/span\u003e\n          \u003ch3\u003e🌍 فتح الأندلس\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي سنة اثنتين وتسعين للهجرة عبر طارق بن زياد المضيق من سبتة إلى جبل طارق، وبعد أشهرٍ قليلة انهارت مملكة القوط التي حكمت إسبانيا ثلاث مئة سنة. وقد كان هذا الفتح أسرع فتحٍ في تاريخ الإسلام بالنسبة إلى مساحة الأرض، وأغربها في نتائجه؛ فقد بقي الإسلام في الأندلس ثمانية قرون، وأنتج حضارةً لم تعرفها أوروبا في ذلك العصر.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكانت إسبانيا في ذلك الوقت تحت حكم مملكة القوط، وكانت مملكةً ضعيفةً من الداخل: صراعٌ على العرش بعد موت الملك غيطشة، وانقسامٌ بين أتباع الملك الجديد لذريق وأبناء الملك القديم، واضطهادٌ لليهود، وظلمٌ للفلاحين، وكنيسةٌ تملك ثلث الأرض. وكانت هذه الشقوق هي التي جعلت الفتح ممكنًا بهذه السرعة؛ فقد كان في البلاد من يستقبل الغزاة لا من يقاومهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سنة اثنتين وتسعين أرسل موسى بن نصير، والي إفريقية، طارق بن زياد في جيشٍ من البربر والعرب، فعبر المضيق في رجب من تلك السنة، ونزل عند الجبل الذي سُمّي باسمه. وقد أحرق طارق السفن — أو هكذا تُروي الحكاية المشهورة — وخطب في جيشه خطبةً تُنسب إليه: «أيها الناس، أين المفرّ؟ البحر من ورائكم والعدوّ أمامكم». ثم زحف إلى الداخل، فالتقى بجيش لذريق عند وادي لكة قرب شذونة في رمضان سنة اثنتين وتسعين، فانتصر انتصارًا كاملًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان سبب هذا الانتصار الحاسم أن جيش لذريق كان في أغلبه من أتباعه الشخصيين، وأن جناحي الجيش انسحبا في أثناء المعركة بسبب الخلاف على العرش. وقد قُتل لذريق أو غرق في النهر، ولم تبقَ بعد ذلك قوةٌ منظمة تدافع عن المملكة. فانتشر المسلمون في الأندلس في أشهرٍ قليلة، ودخلوا طليطلة العاصمة، ثم قرطبة وإشبيلية ومالقة وغرناطة، ثم الشمال الغربي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سنة ثلاثٍ وتسعين عبر موسى بن نصير بنفسه بجيشٍ آخر، فدخل المدن التي لم يدخلها طارق، ومنها إشبيلية وماردة، ثم التقى بطارق في طليطلة، وقيل إن بينهما خلافًا على الغنائم والقيادة، فكتب إليه الوليد بن عبد الملك يأمره بالرجوع. وقد رجع موسى إلى دمشق سنة خمسٍ وتسعين، وترك حامياتٍ في المدن الكبرى، وعيّن ابنه عبد العزيز واليًا على الأندلس.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت الأندلس في البداية ولايةً تابعةً لإفريقية، ثم لإفريقية التابعة لدمشق، وكانت تُدار من قرطبة. وقد استقرّ فيها المسلمون على نظامٍ عُرف باسم «الصلح»؛ فمن المدن من فُتحت عنوةً فصارت أرضًا للمسلمين، ومنها من صالحت على الجزية وبقيت أرضها لأهلها. وقد كان هذا النظام هو الذي سمح ببقاء مجتمعٍ مسيحيٍّ كبير في الأندلس قرونًا، وهو الذي جعل المدن الأندلسية تحتفظ بطابعها الروماني في التخطيط والعمارة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت هناك مقاومةٌ في الشمال؛ في جبال أستورياس وفي الباسك وفي البرانس، حيث لم يصل الفتح أو لم يستقرّ. ومن هذه الجيوب خرجت حركاتٌ صغيرة في البداية، ثم صارت ممالك مسيحية في الشمال، وهي التي بدأت حرب الاستعادة بعد ذلك. وقد كان هذا هو الخطأ الاستراتيجي الأكبر في الفتح: أن المسلمين لم يضبطوا الجبال الشمالية، فبقيت بابًا مفتوحًا لكل من يريد أن يعود.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بدأ الفتح بأربعٍ وعشرين ألف مقاتل في تقدير أكثر الروايات، وهو عددٌ قليل جدًّا بالنسبة إلى مساحة شبه الجزيرة. وقد كان هذا ممكنًا لأن الفتح لم يكن احتلالًا عسكريًّا كاملًا، بل كان سيطرةً على المدن وعقدًا للصلح مع الأشراف المحليين. وهذا يفسّر سرعته، ويفسّر أيضًا هشاشته في البداية؛ فقد كانت الثورات تتكرر في كل ولاية، وكان على الوالي أن يُعيد الفتح كلما تغيّر.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eلماذا سقطت مملكة القوط بهذه السرعة؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت مملكة القوط مملكةً انتخابية لا وراثية؛ فالملك يُختار من بين النبلاء، وهذا جعل كل موت ملكٍ أزمةً سياسية. وقد مات الملك غيطشة، فاختار النبلاء لذريق، وكان له منافسون من أبناء الملك السابق، وكانوا مستعدين للتحالف مع أي قوةٍ خارجية لإسقاطه. وقد كان لذريق نفسه قد وصل إلى العرش بعد صراعٍ طويل، ولم يكن قد استقرّ له الأمر إلا سنةً واحدة قبل العبور، فلم يكن في يده
