03eالجزية\u003c/td\u003e\u003ctd\u003eتُفرض على من أسلم أحيانًا\u003c/td\u003e\u003ctd\u003eتُسقط عن كل من أسلم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالسبّ على المنابر\u003c/td\u003e\u003ctd\u003eسنةٌ ثابتة في الشام\u003c/td\u003e\u003ctd\u003eأُلغي واستُبدل بآية العدل\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالقضاء\u003c/td\u003e\u003ctd\u003eتأثيرٌ للولاة على القضاة\u003c/td\u003e\u003ctd\u003eاستقلالٌ وعزلٌ للظلمة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمال العام\u003c/td\u003e\u003ctd\u003eيُصرف على الخاصة\u003c/td\u003e\u003ctd\u003eيُوزّع على المستحقين ويُجهّز الجيوش\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eإن الله بعث محمدًا داعيًا ولم يبعثه جابيًا.\u003c/p\u003e\u003ccite\u003eعمر بن عبد العزيز لعامله حين قلت الجزية بإسلام الناس\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eكان إصلاح عمر بن عبد العزيز ثورةً قانونيةً لا عسكرية: ردّ الأموال، وألغى الامتيازات، وأسقط الجزية عن المسلمين الجدد، وأوقف السبّ، وعزل الظلمة. وقد نجح في سنتين لأنه بدأ بأهل بيته، وفشل بعد موته لأن الإصلاح الذي يقوم على شخصٍ واحد لا يبقى إذا مات الشخص.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"umar-years","n":"سنواته القصيرة وأثرها","ic":"⏳","part":"القسم الرابع: عمر بن عبد العزيز وسنوات العدل","h":"\u003carticle class=\"ch3\" id=\"umar-years\" data-toc=\"سنواته القصيرة وأثرها\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٤.٣\u003c/span\u003e\n          \u003ch3\u003e⏳ سنواته القصيرة وأثرها\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eس\u003c/span\u003eنتان ونصف فقط، وهذا أقلّ من مدة أي خليفةٍ في تاريخ الدولة الأموية. ومع ذلك صارت هذه السنتين مقياسًا يُقاس به الحكم في الإسلام إلى اليوم، وصار عمر بن عبد العزيز مثالًا للخليفة العادل عند كل الفرق والمذاهب، حتى إن الشيعة يذكرونه بخير، وهو من بني أمية.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eلماذا صار عمر بن عبد العزيز بهذه المكانة مع قصر مدته؟ لأن الناس لا يقيسون الحكم بطول الزمن بل بأثره. وقد كان في سنتين قد غيّر منطق الدولة: من دولةٍ تُصادر وتُكافئ أنصارها، إلى دولةٍ تردّ وتُحاسب نفسها. وقد كان هذا التغيير في المنطق أخطر من أي إجراءٍ جزئي، لأن الناس حين رأوا خليفةً يردّ على نفسه، عرفوا أن العدل ممكن. وقد كان في هذه السنوات القصيرة عبرةٌ في علاقة الناس بالحكم: أنهم لا يحتاجون إلى خطبٍ طويلة، بل إلى فعلٍ واحد يُثبت أن الحاكم يخضع للقانون كما يخضعون، وهذا هو الذي يجعل الطاعة اختيارًا لا قهرًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان أثر إصلاحه في الفقه والسياسة كبيرًا. فقد صار عهده مرجعًا في مسائل المال العام والأراضي المفتوحة والجزية، ونقل عنه الفقهاء كثيرًا من الأحكام. وقد كان مالك بن أنس يقول في بعض المسائل: «هذا رأي عمر بن عبد العزيز»، ويُقدّمه على غيره من الخلفاء. وقد كان في هذا دليلًا على أن الفقه السياسي الإسلامي لم يُبنَ من الخيال بل من تجربة حكمٍ حقيقية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان أثره في الحركات السياسية أيضًا. فقد استعمل العباسيون سيرته في دعوتهم؛ فقد كانوا يقولون إنهم سيُعيدون سيرة عمر بن عبد العزيز، وإنهم سيملؤون الأرض عدلًا. وقد رُوي أن شعارهم كان «الرضا من آل محمد»، وأنهم وعدوا بإلغاء المظالم. وقد كان في هذا استثمارٌ لذكرى رجلٍ لم يكن منهم، وهذا يُبيّن أن الذاكرة الشعبية أقوى من الدعاية الرسمية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في عهده أيضًا حركة علمية مهمة. فقد كان يجلس للعلم، ويُجالس الفقهاء، ويكتب إلى الأمصار يسأل عن الحديث والسنة، ويأمر بجمعها. وقد رُوي أنه كتب إلى أبي بكر بن حزم: «انظر ما كان من حديث رسول الله فاكتبه»، وهذا من أوائل ما دُوّن فيه الحديث رسميًّا. وقد كان في هذا العهد بداية التدوين المنظم للسنة، وهو ما سيؤدي بعد قرنٍ إلى كتب الصحاح.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في سيرته أيضًا درسٌ في علاقة العالم بالسلطان. فقد كان يقبل النصيحة من أي أحد، ويكتب إلى العلماء يسألهم، وكان يرى أن الخليفة يحتاج إلى من يُذكّره. وقد رُوي أن رجلًا قال له في مجلسه كلمةً فيها عتاب، فلم يغضب بل قال: «جزاك الله خيرًا». وهذا يخالف ما كان عليه من قبله من الخلفاء الذين كانوا يعاقبون من يُعاتبهم. وقد كان في هذا العهد أيضًا اهتمامٌ بالعلم لم يكن في عهود من قبله؛ فقد كان يستدعي العلماء، ويكتب إليهم، ويسألهم عن السنة، وكان يرى أن من واجب الخليفة أن يعرف الحكم قبل أن يحكم، وهذا يخالف منطق القوة الذي كان سائدًا في الشام.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد مات عمر بن عبد العزيز سنة إحدى ومئة في دير سمعان، وكان عمره نحو أربعين سنة. وقد رُوي أن أهل الشام خرجوا في جنازته، وأن الناس بكوا، وأنه لم يُترك مالًا كثيرًا. وقد ولي بعده يزيد بن عبد الملك، وكان على عكس سيرته، فبدأت الدولة تعود إلى ما كانت عليه، ثم جاء هشام بن عبد الملك فكانت الدولة في عهده قويةً ماديًّا وضعيفةً في القلوب. وقد كان في هذا السلوك درسٌ في أدب الحكم: أن الحاكم إذا قبل النقد صار في مأمنٍ من الخطأ الكبير، لأن الناس يُنبّهونه قبل أن يستفحل الأمر، وإذا رفض النقد لم يبقَ أمامهم إلا الصمت أو الثورة، وكلاهما خطرٌ عليه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بقي سؤالٌ في التاريخ: ماذا لو عاش عمر بن عبد العزيز عشرين سنة؟ الجواب لا يُعلم، لكن يمكن القول إن الإصلاح الذي قام به كان يحتاج إلى أكثر من شخصٍ واحد: إلى مؤسسات، وإلى طبقةٍ من الموظفين، وإلى قبولٍ من الجيش. وقد كان في الدولة الأموية من القوة ما كان يمكن أن يُدمّر الإصلاح إذا طال، ولذلك مات عمر قبل أن يُكمل، ومات إصلاحه بعده.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eلماذا يُذكر بخير عند كل الفرق؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eعمر بن عبد العزيز من القلائل الذين يُذكرون بخير عند السنة والشيعة والمعتزلة والخوارج. والسبب أنه لم يُظلم أحدًا، وردّ فدكًا إلى آل البيت، وأوقف السبّ على عليّ، وأعاد الحقوق إلى أصحابها. وقد كان في هذا ما يجعل كل فريقٍ يجد فيه ما يطلبه. وقد كان في هذا الإنصاف من أهل البيت أنفسهم دليلًا على أن الخلاف السياسي في الإسلام لم يكن خلافًا على الأشخاص فقط، بل كان خلافًا على المبدأ، فحين وُجد من يعمل بالمبدأ أنصفه حتى خصومه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد رُوي عن الإمام جعفر الصادق أنه قال: «عمر بن عبد العزيز ريحانةٌ من رياحين بني أمية»، وهي كلمةٌ تدل على أن أهل البيت أنفسهم أنصفوه. وقد كان هذا الإنصاف نادرًا في تاريخ الخلافات السياسية، وهو دليلٌ على أن العدل يوحّد الناس أكثر من أي خطاب. وقد كان هذا الإنصاف أيضًا مفيدًا للدولة نفسها؛ لأنه أعطاها شرعيةً لم تكن لها من قبل، وجعل الناس يفرّقون بين بني أمية كبيت حكم وبين عمر بن عبد العزيز كشخص، وهذا ما جعل سقوط الدولة بعد ثلاثين سنة لا يُلحق به لومًا.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eبداية تدوين السنة\u003c/h4\u003e\u003cp class=\"ap\"\u003eأمر عمر بن عبد العزيز بكتابة السنة النبوية وجمعها، وكان ذلك في سنة مئة للهجرة تقريبًا. وقد كتب إلى أبي بكر بن محمد بن حزم الأنصاري، وكان قاضيًا في المدينة، وإلى غيره من العلماء، بأن يجمعوا الحديث ويُدوّنوه خوفًا من ضياعه بموت الحفاظ. وقد كان في هذا الأمر وعيٌ بأن السنة تُحفظ بالكتابة لا بالذاكرة وحدها، وقد كان في القرن الأول حفاظٌ كثيرون، لكن الخليفة أدرك أن الحفاظ يموتون وأن الأسانيد قد تضيع، فكان التدوين ضرورةً لا ترفًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان هذا الأمر بدايةً لحركة تدوينٍ استمرت قرنًا، وانتهت بكتب ابن جريج ومالك والبخاري ومسلم. ومن هنا يمكن القول إن عمر بن عبد العزيز لم يُصلح المال فقط، بل بدأ أيضًا ما سيصير أعظم تراثٍ علمي في الإسلام، وهو علم الحديث المدوّن. وقد كان موطأ مالك، الذي أُلّف بعد ذلك بنحو نصف قرن، من ثمرات هذه الحركة؛ فقد جمع فيه مالك حديث أهل المدينة وفقههم، وصار أساسًا للمذهب المالكي الذي انتشر في إفريقية والأندلس، وهذا كله يرجع إلى أمرٍ صغيرٍ في ظاهره صدر سنة مئة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالدرس: الإصلاح والمؤسسة\u003c/h4\u003e\u003cp class=\"ap\"\u003eالدرس الأكبر من تجربة عمر بن عبد العزيز أن الإصلاح الذي يعتمد على شخصٍ واحد لا يدوم. فقد كان في الدولة أجهزةٌ وقبائل وجيش، وكلها كانت تعيش على الامتيازات، فلمّا مات الرجل عادت إلى ما كانت عليه في سنواتٍ قليلة. وقد كان هذا السؤال مطروحًا في كل إصلاحٍ في التاريخ، وقد أجاب عنه الفقهاء بأن العدل يحتاج إلى سلطانٍ يُنفّذه، وأن السلطان يحتاج إلى عدلٍ يُبرّره، فإذا انفصل أحدهما عن الآخر سقط الآخر معه في النهاية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوهذا يفتح سؤالًا مهمًّا: هل الإصلاح يحتاج إلى رجلٍ عادل أم إلى نظامٍ يُلزم بالعدل؟ والجواب أن الاثنين: فالرجل العادل يبدأ، والنظام يُكمل. وقد كان عمر بن عبد العزيز يعرف هذا، ولذلك كتب إلى عماله، وأراد أن يُلزمهم بالكتاب لا بشخصه، لكنه لم يُملك الوقت ليُكمل.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمدة الخلافة\u003c/b\u003e\u003cspan\u003eسنتان ونصف تقريبًا، من ٩٩هـ إلى ١٠١هـ.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسنة الوفاة\u003c/b\u003e\u003cspan\u003e١٠١هـ في دير سمعان قرب حمص، وعمره نحو أربعين سنة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eفدك\u003c/b\u003e\u003cspan\u003eردّها إلى آل البيت، وكانت موضع خلافٍ منذ عهد أبي بكر.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eتدوين السنة\u003c/b\u003e\u003cspan\u003eأمر بجمع الحديث وكتابته، وكان بداية التدوين الرسمي.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمن جاء بعده\u003c/b\u003e\u003cspan\u003eيزيد بن عبد الملك، فعادت الدولة إلى سياسة الامتيازات.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالخليفة\u003c/th\u003e\u003cth\u003eالمدة\u003c/th\u003e\u003cth\u003eالسمة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eعبد الملك\u003c/td\u003e\u003ctd\u003e٦٥–٨٦هـ\u003c/td\u003e\u003ctd\u003eبناء الدولة وتعريب الديوان والنقد\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالوليد\u003c/td\u003e\u003ctd\u003e٨٦–٩٦هـ\u003c/td\u003e\u003ctd\u003eالفتوح والعمارة الكبرى\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eسليمان\u003c/td\u003e\u003ctd\u003e٩٦–٩٩هـ\u003c/td\u003e\u003ctd\u003eحصار القسطنطينية والوصية لعمر\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eعمر بن عبد العزيز\u003c/td\u003e\u003ctd\u003e٩٩–١٠١هـ\u003c/td\u003e\u003ctd\u003eالإصلاح وردّ المظالم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eيزيد بن عبد الملك\u003c/td\u003e\u003ctd\u003e١٠١–١٠٥هـ\u003c/td\u003e\u003ctd\u003eالعودة إلى سياسة القبائل والامتيازات\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eعمر بن عبد العزيز ريحانةٌ من رياحين بني أمية.\u003c/p\u003e\u003ccite\u003eكلمة تُنسب إلى الإمام جعفر الصادق\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eسنتان ونصف كفت لتجعل من عمر بن عبد العزيز مقياسًا للعدل عند كل الفرق. وقد بدأ تدوين السنة، وردّ المظالم، وألغى الامتيازات، لكنه مات قبل أن يُحوّل إصلاحه إلى نظام، فعادت الدولة بعده إلى ما كانت عليه، وبقي هو في الذاكرة وحدَه.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-5","n":"القسم الخامس: المجتمع والاقتصاد والعلم","ic":"","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-5\" style=\"--c:#4B0082\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🏘️\u003c/div\u003e\n      \u003ch2\u003eالقسم الخامس: المجتمع والاقتصاد والعلم\u003c/h2\u003e\n      \u003cp\u003eلا يُفهم سقوط الدولة الأموية إلا إذا عُرف المجتمع الذي كانت تحكمه: مجتمعٌ فيه عربٌ فاتحون وموالٍ دخلوا الإسلام ولم يدخلوا الطبقة الحاكمة، وفيه قبائلُ تتنازع على العطاء والمناصب، وفيه تجّارٌ وعلماءُ وقضاة، وفيه مدنٌ كبرى تنمو بسرعة. وقد كانت هذه التركيبة الاجتماعية هي التي أنتجت الثورة التي أسقطتها.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#mawali\"\u003eالموالي والطبقات\u003c/a\u003e\u003ca href=\"#army-tribes\"\u003eالجيش والقبائل والعصبية\u003c/a\u003e\u003ca href=\"#economy-science\"\u003eالاقتصاد والمدن والعلم\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"mawali","n":"الموالي والطبقات","ic":"🧑‍🌾","part":"القسم الخامس: المجتمع والاقتصاد والعلم","h":"\u003carticle class=\"ch3\" id=\"mawali\" data-toc=\"الموالي والطبقات\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٥.١\u003c/span\u003e\n          \u003ch3\u003e🧑‍🌾 الموالي والطبقات\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eك\u003c/span\u003eان في الدولة الأموية ثلاث طبقات كبرى: العرب المسلمون، وهم الطبقة الحاكمة التي تحمل الديوان والعطاء والقيادة، والموالي وهم من أسلم من الفرس والروم والقبط والبربر، وكانوا في الغالب يُوالون قبيلةً عربية، والذميون وهم أهل الكتاب الذين بقوا على دينهم ودفعوا الجزية. وقد كانت العلاقة بين هذه الطبقات هي المسألة الاجتماعية الأولى في ذلك العصر.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكانت كلمة «مولى» في العصر الأموي تعني من أسلم من غير العرب، أو من أُعتق من العبيد، وكان يُنتسب إلى قبيلةٍ عربية بالولاء لا بالنسب. وقد كان الموالي في البداية يعملون في الزراعة والصناعة والتجارة، ثم دخلوا في الجيش وفي الدواوين، لأنهم كانوا يعرفون الحساب والكتابة ولغات الأمصار القديمة، ولذلك صاروا عمود الإدارة الفعلية في الشام والعراق ومصر.\u003c/p\u003e\u003cp class=\"ap\"\u003eلكن مكانتهم الاجتماعية لم تكن مثل مكانة العرب. فقد كان العطاء في الديوان يُفرض بحسب النسب لا بحسب السابقة في الإسلام، وكان العربي يأخذ أكثر من المولى وإن كان المولى أقدم إسلامًا وأكثر جهادًا. وقد كان هذا النظام موروثًا من ترتيب عمر بن الخطاب للعطاء على السابقة، لكنه في العهد الأموي تحوّل إلى تمييزٍ عنصري لا إلى تقديرٍ للسابقة، وهذا هو الفرق الخطير.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا التمييز ما يُخالف نصًّا صريحًا في القرآن والسنة. فقد قال الله تعالى: «إن أكرمكم عند الله أتقاكم»، وقال النبيّ في خطبة الوداع: «لا فضل لعربيٍّ على أعجميٍّ ولا لأحمر على أسود إلا بالتقوى». وقد كان العلماء في العهد الأموي يذكّرون بهذا، ومنهم الحسن البصري وعمر بن عبد العزيز، وقد كان في كلامهم نقدٌ ضمنيٌّ لسياسة الدولة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ظهرت هذه المسألة في خراسان بشكلٍ حادّ؛ فقد كان فيها عربٌ من قبائل مختلفة، وفيها فرسٌ أسلموا ودخلوا الجيش، وكان الموالي يُقاتلون في الصفوف ويُحرمون من العطاء الكامل. وقد كان هذا سببًا مباشرًا في أن الثورة العباسية وجدت في خراسان أرضًا خصبة، لأن أبا مسلم الخراساني خاطب الناس بخطاب المساواة، وأعطى الموالي مناصب القيادة. وقد كان في هذا الخطاب خطرٌ على بني أمية؛ لأنه أخذ مبدأً إسلاميًّا صحيحًا واستعمله سلاحًا سياسيًّا، فلا يستطيع أحدٌ أن يُنكره.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في العراق أيضًا احتقارٌ ظاهر للموالي؛ فقد كان يقال للرجل إذا أرادوا تحقيره: «يا مولى»، وكان بعض الولاة يمنع الموالي من الصلاة في الصف الأول، وكانت المرأة العربية لا تتزوج المولى في كثير من الأحيان. وقد كان هذا الاحتقار يُولّد في نفوس الموالي شعورًا بالغربة عن الدولة، وإن كانوا مسلمين مثل غيرهم. وقد كان في هذا الاحتقار اليومي أثرٌ أعمق من الضرائب، لأن الضريبة تُنسى والكرامة إذا أُهينت لا تُنسى، وهذا ما جعل الموالي يكنّون للدولة عداوةً صامتة سنوات.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في مصر حالةٌ مختلفة قليلًا؛ فقد بقي الأقباط على دينهم بأعدادٍ كبيرة، وكان الموظفون القبط يعملون في الديوان حتى عُرّب، وكانت العلاقة بين المسلمين والأقباط تتوتر أحيانًا بسبب الضرائب لا بسبب الدين. وقد كانت الثورات القبطية في العهد الأموي في الغالب ثوراتٌ على الخراج لا على الإسلام. وقد كان في مصر نظامٌ ضريبي معقّد يجمع بين الخراج والجزية، وكانت الكنيسة القبطية تتوسّط في التحصيل، وهذا جعلها طرفًا في الصراع بين الناس والدولة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان البربر في المغرب أشدّ الطبقات تضررًا؛ فقد كانوا يُقاتلون في جيوش الأندلس ويفتحون البلاد، ثم يُحرمون من الغنائم ومن الإمارة، وكان الوالي يبعث بهم إلى المشرق كجنودٍ لا كمواطنين. وقد أدّى هذا إلى ثوراتٍ كبيرة في المغرب في العهد الأموي، ثم إلى قيام دولٍ مستقلة فيه بعد سقوط الدولة. وقد كان الخوارج الصفريون والإباضيون في المغرب يقودون هذه الثورات، وقد أقاموا دولًا صغيرة في تاهرت وسجلماسة، وهي أول دولٍ مستقلة عن الخلافة في الغرب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان هذا كله يُنذر بأن الدولة الأموية تبني قوتها على طبقةٍ واحدة، وأن هذه الطبقة إذا انهارت انهارت الدولة معها. وقد كان هذا ما جرى فعلًا: فحين خرج العباسيون لم تدافع عن الدولة إلا قبائل الشام، ولم يكن في خراسان ولا في العراق ولا في المغرب من يريد أن يُنقذها. وقد كان في هذا الدرس ما يُفسّر سرعة سقوط دمشق: أن الدولة التي تحكم ثمانين سنة بطبقةٍ واحدة لا تجد عند الشدة من يحمل عنها السلاح إلا تلك الطبقة، وإذا انقسمت انقسم معها كل شيء.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالديوان والعطاء\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الديوان في العهد الأموي يُثبت أسماء المقاتلين وعطاءهم بحسب القبيلة والسابقة. وقد كان العطاء يُدفع مرتين في السنة، وكان يُكتب في الديوان: اسم الرجل، وقبيلته، ومقدار عطائه، وعدد أفراد أسرته. وكان الديوان هو سجل المواطنة الفعلية في الدولة. وقد كان الديوان في بعض الأمصار يُكتب بالعربية وباليونانية معًا قبل التعريب، وهذا يدل على أن الدولة كانت تحتاج إلى وقتٍ طويل قبل أن تستغني عن الموظفين الأجانب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا النظام تمييزٌ بنيوي: فالمرأة والطفل يُعطيان أنصافًا أو أقلّ، والمولى يُعطى أقلّ من العربي، والذمي لا يُعطى شيئًا. وقد كان في هذا ما يجعل الطبقات تُعاد إنتاجها في كل جيل، لأن العطاء هو رأس المال الأول في اقتصادٍ لا صناعة له. وقد كان في هذا النظام أيضًا تشجيعٌ على كثرة الأولاد، لأن العطاء يُحسب بعدد الأفراد، وهذا ما جعل الأسر العربية في الأمصار كبيرة، وهذا بدوره أثّر في التركيبة السكانية.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eموالي صاروا قادةً\u003c/h4\u003e\u003cp class=\"ap\"\u003eمع كل هذا التمييز، ظهر في العهد الأموي موالٍ بلغوا أعلى المناصب. ومنهم زاذان فروخ وصالح بن عبد الرحمن في ديوان العراق، ومنهم كثير من الأطباء والمترجمين والكتّاب. وقد كان هذا يُبيّن أن الطريق إلى الصعود لم يكن مغلقًا تمامًا، لكنه كان طويلًا وشاقًّا. وقد كان في هذا الطريق الطويل ما يُشبه الامتحان: أن يصل الرجل إلى منصبٍ عالٍ ثم يُذكَّر بأصله في كل مجلس، فيصير نجاحه نفسه دليلًا على التمييز لا على المساواة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا الطريق الطويل خطرٌ على الدولة: أن من يصعد فيه يصل وهو يحمل شعورًا بأنه صعد رغم النظام لا بسببه، فلا يكون وفيًّا للنظام الذي أذلّه سنوات. وقد كان هذا شعور أبي مسلم الخراساني نفسه، وقد كان من الموالي. وقد كان أبو مسلم من الموالي، وقد قاد الثورة التي أسقطت الدولة، وهذا في ذاته دليلٌ على أن الطاقة التي حُرمت من المشاركة تحوّلت إلى طاقة هدمٍ حين وجدت من يستثمرها.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالموالي في الجيش\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الموالي يقاتلون في الجيوش الأموية بأعدادٍ كبيرة، وخاصة في جيوش خراسان والأندلس والمغرب. وكانوا في الغالب في المقدمة، لأنهم أقلّ حظًّا في الغنائم فكانوا أكثر تعرضًا للخطر. وقد كان هذا يزيد في شعورهم بالظلم لا في ولائهم. وقد كان في هذا أيضًا سببٌ عسكري: أن الموالي كانوا أقلّ خبرةً بالقتال الصحراوي من العرب، فكانوا يُوضعون في المواقع الأخطر، وكانت خسائرهم أكبر، وهذا زاد في شعورهم بالغبن.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان هذا ما جعل الجيش الأموي في الشرق جيشًا هشًّا: فجنوده يقاتلون من أجل العطاء لا من أجل الدولة، فإذا انقطع العطاء أو تغيّر الوالي تغيّر ولاؤهم. وهذا ما جعل الثورة العباسية تنتصر بسرعةٍ في خراسان، حيث كان الجيش الأموي نفسه مكوّنًا من طبقاتٍ لا تُحبّ الدولة.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالموالي\u003c/b\u003e\u003cspan\u003eمن أسلم من غير العرب أو من أُعتق، وكانوا في الغالب يُوالون قبيلةً عربية.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالديوان\u003c/b\u003e\u003cspan\u003eسجل المقاتلين وعطاءاتهم، وكان يُفرض بحسب النسب والسابقة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eخراسان\u003c/b\u003e\u003cspan\u003eأكثر الأمصار احتقانًا، وفيها بدأت الثورة العباسية.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالبربر\u003c/b\u003e\u003cspan\u003eقاتلوا في الجيوش وحُرمُوا الإمارة والغنائم، فثاروا في المغرب.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eعمر بن عبد العزيز\u003c/b\u003e\u003cspan\u003eألغى التمييز في الجزية، ولم يستطع أن يُغيّر نظام العطاء في سنتين.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالطبقة\u003c/th\u003e\u003cth\u003eالحقوق\u003c/th\u003e\u003cth\u003eالواجبات\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالعرب المسلمون\u003c/td\u003e\u003ctd\u003eعطاءٌ كامل وقيادة الجيش والولاية\u003c/td\u003e\u003ctd\u003eالجهاد والطاعة ودفع الزكاة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالموالي\u003c/td\u003e\u003ctd\u003eعطاءٌ أقلّ ومناصب إدارية محدودة\u003c/td\u003e\u003ctd\u003eالجهاد ودفع الجزية أحيانًا\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالذميون\u003c/td\u003e\u003ctd\u003eأمانٌ على الدين والمال\u003c/td\u003e\u003ctd\u003eالجزية والخراج\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالعبيد\u003c/td\u003e\u003ctd\u003eلا حقّ في العطاء\u003c/td\u003e\u003ctd\u003eالخدمة، ويُعتقون بالكتابة أحيانًا\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالبربر\u003c/td\u003e\u003ctd\u003eعطاءٌ ناقص وقيادةٌ محلية محدودة\u003c/td\u003e\u003ctd\u003eالجهاد في المقدمة والفتح\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eلا فضل لعربيٍّ على أعجميٍّ ولا لأحمر على أسود إلا بالتقوى.\u003c/p\u003e\u003ccite\u003eمن خطبة الوداع، وكان العلماء يذكّرون بها في نقد سياسة التمييز\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eكان المجتمع الأموي مجتمع طبقات: عربٌ يحكمون، وموالٍ يُديرون ويقاتلون ولا يساوون، وذميون يدفعون، وبربر يفتحون ولا يملكون. وقد كانت هذه التركيبة أقوى من الجيش في إسقاط الدولة، لأنها جعلت أكثر الناس لا يجدون سببًا للدفاع عنها.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"army-tribes","n":"الجيش والقبائل والعصبية","ic":"🏹","part":"القسم الخامس: المجتمع والاقتصاد والعلم","h":"\u003carticle class=\"ch3\" id=\"army-tribes\" data-toc=\"الجيش والقبائل والعصبية\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٥.٢\u003c/span\u003e\n          \u003ch3\u003e🏹 الجيش والقبائل والعصبية\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eك\u003c/span\u003eان الجيش الأموي في ظاهره جيش دولة، وفي حقيقته جيش قبائل. وقد كانت القبائل العربية في الشام تنقسم إلى مجموعتين كبيرتين: القيسية واليمانية، وكان لكل مجموعةٍ ولاةٌ ومناصب وأراضٍ. وقد كانت العصبية القبلية هي العامل الخفي الذي حرّك السياسة الأموية، ثم كان هو السبب في سقوطها.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكانت القبائل العربية في الشام قد استقرّت منذ الفتوح، وكانت كل قبيلة تسكن منطقةً معينة، وكان لها زعماؤها وأشياخها. وقد كان معاوية يعرف كيف يوازن بينها، فيُعطي كل قبيلةٍ منصبًا وحصةً في الجيش، ويمنع أن تطغى واحدةٌ على غيرها. وقد كان هذا التوازن هو سرّ استقرار الشام في عهده، لكنه كان توازنًا هشًّا لأنه لم يكن مبنيًّا على مؤسسة بل على شخص.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي الفتنة الثانية انكشف هذا الهشاشة: فلمّا مات يزيد لم يجد أهل الشام من يجمعهم، فتنازعت القيسية واليمانية على من يكون الخليفة، وكانت النتيجة أن صار مروان بن الحكم خليفةً بتوافقٍ مؤقت. وقد كان في هذه اللحظة أن ظهرت العصبية على حقيقتها: أن القبيلة تُقدّم مصلحتها على مصلحة الدولة. وقد كان في هذه اللحظة أن ظهر أن الدولة لم تكن مؤسسةً بل توازنًا بين قبائل، وأن التوازن إذا اختلّ لم يكن هناك من يُعيده إلا بالسيف.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي عهد عبد الملك والحجاج صار الجيش أكثر تنظيمًا، وأُنشئت مدنٌ عسكرية مثل واسط، وأصبح الجند يتقاضون أعطياتهم من الديوان بانتظام. لكن العصبية لم تُلغَ، بل دخلت في بنية الجيش نفسه: فكانت كل كتيبةٍ من قبيلة، وكان القائد يُختار من قبيلةٍ لا من أخرى، وكانت المنافسة على المناصب منافسةً قبلية. وقد كان هذا التنظيم يُقلّد تنظيم الجيش البيزنطي في بعض جوانبه، لكنه أخذ منه الشكل ولم يأخذ منه المهنية، فبقي جيشًا قبليًّا في ثياب نظامية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ظهر أثر هذا في خراسان بشكلٍ أخطر. فقد كان الجيش الأموي في خراسان مقسومًا بين مضر واليمانية، وكان الوالي إذا جاء من إحدى المجموعتين عزل أهل الأخرى وأساء إليهم. وقد أدّى هذا إلى ثوراتٍ داخلية كثيرة، وإلى ضعف الجيش في مواجهة الترك، وإلى أن كثيرًا من الجنود صاروا مستعدين للانضمام إلى أي حركةٍ تُغيّر النظام. وقد كان في خراسان أن الثورة العباسية لم تحتج إلى معركةٍ كبرى، بل احتاجت إلى انقسام الجيش الأموي نفسه، وهذا ما جعل أبا مسلم ينتصر بسرعةٍ قبل أن يصل الجيش الشامي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الأندلس أسوأ من ذلك؛ فقد كان الجيش هناك مقسومًا بين العرب والبربر، وبين القيسية واليمانية، وكان الوالي يُعزل ويُقتل في كل سنوات. وقد أدّى هذا إلى أن الأندلس لم تستقرّ إلا بعد أن جاء عبد الرحمن الداخل سنة ثمانٍ وثلاثين ومئة، وأسّس دولةً قائمة على جيشٍ من الموالي والبربر لا على القبائل. وقد كان عبد الرحمن الداخل أذكى من أن يُعيد بناء الجيش على القبائل، فبنى جيشًا من الموالي والبربر، وكانوا مخلصين له لأنه أعطاهم ما لم يُعطهم غيرُه، وهذا هو أساس الدولة الأموية في الأندلس.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان الخوارج يستغلون هذه العصبية في دعايتهم؛ فقد كانوا يقولون إن القبيلة لا تُقدّم ولا تُؤخّر، وإن الإمامة لمن قام بالكتاب والسنة ولو كان عبدًا حبشيًّا. وقد كان هذا الخطاب جاذبًا لكل من شعر بالظلم من غير العرب ومن الفقراء، ولذلك انتشر الخوارج في المغرب وعمان واليمامة والبحرين. وقد كان الخوارج في هذا العهد حركةً اجتماعية أكثر من كونهم حركةً عقائدية، وقد كان خطابهم يجذب الفقراء والموالي والفلاحين، ولهذا لم يُمكن القضاء عليهم بالقتال وحده.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الجيش الأموي أيضًا عنصرٌ آخر مهم: الجند الشامي. فقد كان الشام هو قاعدة الدولة، وكان جنوده يُرسلون إلى الأمصار لحفظ النظام، وكانوا يُقيمون في مدنٍ خاصة بهم. وقد كان هذا الجند مخلصًا للدولة لأنه كان يأخذ أعطياته منها، لكنه كان أيضًا أداة قهرٍ للناس، وقد كان الناس يكرهونهم في العراق ومصر. وقد كان الجند الشامي يُقيم في مدنٍ خاصة به في العراق ومصر، وكانت هذه المدن تُسمّى «الأمصار»، وكانت العلاقة بينهم وبين السكان المحليين متوترةً دائمًا بسبب الأعطيات والامتيازات.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا كله درسٌ في بناء الجيوش: أن الجيش الذي يُبنى على الولاء القبلي لا على الولاء للدولة يتحوّل إلى أداةٍ في يد القبيلة لا في يد الدولة، وإذا تنازعت القبائل تنازع الجيش، وإذا تنازع الجيش سقطت الدولة. وهذا ما جرى للأمويين بالضبط، فقد سقطت دولتهم في معارك داخلية أكثر من سقوطها بضربة العباسيين. وقد كان في معركة الزاب سنة ١٣٢هـ أن جزءًا من الجيش الأموي انسحب أو انضمّ إلى العباسيين، وهذا يُبيّن أن السقوط كان نتيجة انقسامٍ داخلي أكثر من كونه هزيمةً عسكرية.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالقيسية واليمانية\u003c/h4\u003e\u003cp class=\"ap\"\u003eالقيسية واليمانية مجموعتان كبيرتان من القبائل العربية، تعودان إلى نزار من عدنان وإلى قحطان من اليمن. وقد كان الخلاف بينهما قديمًا في الجاهلية، ثم عاد في الإسلام في صورٍ سياسية، وخاصة في الشام وخراسان والأندلس. وقد كان الخلاف بينهما في الجاهلية على الماء والمرعى، ثم صار في الإسلام على المناصب والأعطيات، وهذا تحوّلٌ مهم: أن العصبية لم تمت بالإسلام بل غيّرت موضوعها فقط.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان لكل مجموعةٍ ولاةٌ تفضّلها، فكان بنو أمية في الغالب يميلون إلى القيسية، وكان اليمانية يشعرون بأنهم مظلومون. وقد كان هذا الخلاف يُستهلك في المنافسة على المناصب والأعطيات، وقد أدّى في النهاية إلى حروبٍ داخلية في الشام في آخر العهد الأموي. وقد كان آخر خلفاء بني أمية مروان بن محمد من القيسية، وقد عزل اليمانية من المناصب، فكان ذلك سببًا في انسحابهم عنه في آخر المعارك، وهذا يُبيّن كيف تُكلّف العصبية الدولة وجودها.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eواسط والجيش النظامي\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت واسط أول محاولةٍ جدية لبناء جيشٍ نظاميٍّ لا قبلي، لأن الحجاج أراد أن يُخرج الجنود من الكوفة والبصرة إلى مدينةٍ لا يعيش فيها إلا من يخدم الدولة. وقد كان في المدينة قصرٌ وجامعٌ وديوانٌ وأسواق، وكانت تُدار منها خراسان والسند. وقد كان اختيار موقع واسط ذكيًّا من ناحية أخرى: أنها بعيدة عن الفرات قليلًا، فلا تتأثر بفيضانه، وقريبة من الطريق بين الكوفة والبصرة، فكانت ملتقى الطرق التجارية والعسكرية.\u003c/p\u003e\u003cp class=\"ap\"\u003eلكن التجربة لم تنجح تمامًا، لأن الحجاج نفسه كان يستعمل القبائل في إدارة المدينة، وكان يُعطي كل قبيلةٍ محلّة. ومن هنا يتبيّن أن بناء جيشٍ لا قبلي يحتاج إلى تغييرٍ في نظام العطاء والتمثيل السياسي، لا إلى بناء مدينةٍ جديدة فقط. وقد كان في تجربة واسط درسٌ لمن جاء بعدها: أن الجيش النظامي يحتاج إلى ثكناتٍ ومخازن وديوان، وهذا ما فعله العباسيون في بغداد وسامراء بعد ذلك، فقد بنوا مدنًا عسكرية كاملة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eأثر العصبية في سقوط الدولة\u003c/h4\u003e\u003cp class=\"ap\"\u003eفي آخر العهد الأموي، وتحديدًا في عهد مروان بن محمد، اشتعلت الحرب بين القيسية واليمانية في الشام، ووصل الأمر إلى قتالٍ في دمشق نفسها. وقد كان هذا في الوقت الذي كانت فيه الدعوة العباسية تتقدّم في خراسان، وكان الجيش الأموي يحتاج إلى وحدةٍ لا إلى حربٍ داخلية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا الدرس الأوضح: أن الدولة لا تسقط بضربةٍ واحدة من الخارج، بل تسقط حين تكون منقسمةً من الداخل. وقد كان العباسيون يعرفون هذا، فكانوا يُشعلون الخلاف بين القبائل، ويستفيدون من كل ثورةٍ داخلية في الشام. وقد كان في هذا استثمارٌ للعداوة القديمة بين القبائل، وهو أسلوبٌ استعمله العباسيون في الشام كما استعمله الأمويون في خراسان من قبل، فالسياسة نفسها تتكرّر مع تغيّر الفاعلين.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالقيسية\u003c/b\u003e\u003cspan\u003eقبائل عدنان، وكانت أقرب إلى بني أمية في الشام.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eاليمانية\u003c/b\u003e\u003cspan\u003eقبائل قحطان، وكانت تشعر بالظلم في توزيع المناصب.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالجند الشامي\u003c/b\u003e\u003cspan\u003eقاعدة الجيش الأموي، أُرسل إلى الأمصار لحفظ النظام.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eواسط\u003c/b\u003e\u003cspan\u003eمحاولة بناء جيشٍ نظامي بعيد عن الكوفة والبصرة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالحرب الأهلية\u003c/b\u003e\u003cspan\u003eاشتعلت في الشام في عهد مروان بن محمد قبيل سقوط الدولة.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالإقليم\u003c/th\u003e\u003cth\u003eالانقسام\u003c/th\u003e\u003cth\u003eالنتيجة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالشام\u003c/td\u003e\u003ctd\u003eقيسية ويمانية\u003c/td\u003e\u003ctd\u003eحربٌ داخلية قبيل سقوط الدولة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eخراسان\u003c/td\u003e\u003ctd\u003eمضر ويمانية\u003c/td\u003e\u003ctd\u003eضعف الجيش وانتصار الثورة العباسية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالعراق\u003c/td\u003e\u003ctd\u003eقبائل متفرقة وموالٍ\u003c/td\u003e\u003ctd\u003eثوراتٌ متكررة وعدم استقرار\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالأندلس\u003c/td\u003e\u003ctd\u003eعرب وبربر\u003c/td\u003e\u003ctd\u003eاضطرابٌ حتى قيام الدولة الأموية فيها\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمغرب\u003c/td\u003e\u003ctd\u003eبربر وعرب\u003c/td\u003e\u003ctd\u003eثوراتٌ وقيام دولٍ مستقلة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eلو تنازع أهل الشام على شيءٍ ما قامت لهم دولة.\u003c/p\u003e\u003ccite\u003eمعنى ما رُوي في وصف أثر العصبية القبلية على الدولة الأموية\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eكان الجيش الأموي جيش قبائل لا جيش دولة، وكانت العصبية هي العامل الخفي في كل أزمة. وقد استطاع معاوية أن يوازن بينها، ولم يستطع من جاء بعده أن يُلغيها، فلمّا اشتعلت في الشام كان العباسيون على أبواب دمشق.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"economy-science","n":"الاقتصاد والمدن والعلم","ic":"📚","part":"القسم الخامس: المجتمع والاقتصاد والعلم","h":"\u003carticle class=\"ch3\" id=\"economy-science\" data-toc=\"الاقتصاد والمدن والعلم\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٥.٣\u003c/span\u003e\n          \u003ch3\u003e📚 الاقتصاد والمدن والعلم\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي العهد الأموي نبتت البذور الأولى للحضارة الإسلامية: مدنٌ جديدة، وأسواقٌ دولية، ونقدٌ موحّد، وطرقٌ بريدية، وأولى محاولات تدوين العلم. ولم يكن هذا العهد عهد فتوحٍ فقط، بل كان عهد تأسيسٍ لبنيةٍ سيبني عليها العباسيون بعد ذلك صرحهم الكبير.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان اقتصاد الدولة الأموية قائمًا على الزراعة والتجارة والخراج. فالزراعة كانت في العراق ومصر والشام والأندلس، وكانت تُنتج الحبوب والزيت والسكر والقطن، وكانت تُروى بأنظمةٍ قديمة أصلحها المسلمون. والتجارة كانت تمرّ من الصين والهند إلى الشام ومصر وإفريقية، وكانت القوافل تتحرك في طرقٍ طويلة، وكانت السفن تنقل البضائع في البحر الأحمر والخليج والمتوسط.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان الخراج هو المورد الأساسي للدولة، وكان يُفرض على الأرض لا على الشخص، وكان يُحصّل سنويًّا بعد الحصاد. وقد كان في العراق نظامٌ خاص يُسمّى «المقاطعة» أو «المساحة»، وفيه تُقدَّر الأرض وتُفرض عليها نسبة. وقد كان الحجاج يُشرف على هذا النظام بنفسه، وقد زاد الخراج في عهده زيادةً كبيرة. وقد كان في هذا النظام أيضًا ظلمٌ في التقدير، لأن الأرض تُقدَّر بحسب ما تُنتجه في سنةٍ معينة، فإذا قلّ المحصول بقي الخراج كما هو، وهذا ما جعل الفلاحين يتركون الأرض أحيانًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت الجزية تُفرض على أهل الذمة من الرجال البالغين، وكانت تُقدَّر بحسب الغنى، وكانت في الغالب دينارين أو أربعة. وكانت الجزية في العهد الأموي تُحصّل بصرامةٍ أحيانًا، وقد كانت ثوراتٌ كثيرة في مصر والمغرب سببها طريقة التحصيل لا أصل الفرض. وقد كان في مصر نظامٌ خاص يُسمّى «الخِراج» على الأرض و«الجزية» على الرؤوس، وكانت الكنيسة تجمع المال وتُسلّمه للدولة، وكانت هذه الوساطة سببًا في نزاعاتٍ طويلة بين المسلمين والأقباط.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان نظام البريد من أهم ما بناه الأمويون. فقد كان في الدولة محطاتٌ متتابعة على الطرق الرئيسية، وفي كل محطة خيلٌ ورجال، وكان البريد ينقل رسائل الخليفة إلى الولاة في أيامٍ قليلة. وقد كان البريد أيضًا أداة استخبارات؛ فقد كان صاحبه يُبلغ الخليفة بأحوال الأمصار، وقد قيل إن معاوية كان أول من نظّم البريد في الإسلام. وقد كان في كل محطةٍ دوابٌ معدّة، وكان البريد يعمل بأمرٍ من الخليفة فقط، وكان صاحبه مسؤولًا أمامه مباشرة، وهذا جعله جهازًا مستقلًّا عن الولاة، وهو ما جعل الدولة قادرةً على الرقابة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت المدن تنمو نموًّا سريعًا. فالقيروان وواسط والرصافة والرملة وحلوان كلها مدنٌ أُسست في هذا العهد، وكانت تُبنى على نمطٍ واحد: جامعٌ في الوسط، ودار إمارةٍ بجانبه، وأسواقٌ حولهما، ومحلّاتٌ للقبائل في الأطراف. وقد كان هذا النمط هو الذي ستصير عليه كل مدينةٍ إسلامية بعد ذلك. وقد كان في هذا النمط أيضًا وظيفة دفاعية: أن الجامع في الوسط يجعل المدينة كلها تحت نظر السلطة، وأن الأسواق حوله تُسهّل مراقبة الأسعار والأوزان، وهذا كله كان يُنظّم الحياة اليومية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي العلم كانت البداية. فقد كُتب الحديث في صحفٍ صغيرة، وبدأ النحو في البصرة على يد أبي الأسود الدؤلي ثم تلاميذه، وظهر في العراق مدرستان: مدرسة الحديث في الحجاز، ومدرسة الرأي في العراق. وقد كان في العهد الأموي أيضًا أول اشتغالٍ بالتاريخ والسيرة، فقد كُتبت السيرة النبوية في هذا العهد على يد عروة بن الزبير وأبان بن عثمان. وقد كان في هذا العهد أيضًا اهتمامٌ بالأنساب وأيام العرب، لأن الدولة كانت تحتاج إلى معرفة القبائل لتوزيع الأعطيات، وهذا ما جعل الرواية الشفوية تُدوّن، فحُفظ تراثٌ كان سيضيع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في العهد الأموي اهتمامٌ بالطب والكيمياء على مستوى بسيط؛ فقد كان في الشام أطباء من الروم، وكان في مصر أطباء من القبط، وكان الخلفاء يستعينون بهم. وقد كان خالد بن يزيد بن معاوية مهتمًّا بالكيمياء والنجوم، وقد نُسبت إليه رسائل في الصنعة، وهو أول من اشتغل بهذا في بيت الخلافة. وقد كان في هذا الاهتمام بدايةٌ لما سيصير حركة ترجمةٍ كبيرة في العهد العباسي، فقد كان خالد بن يزيد يستقدم علماء من مصر والإسكندرية، ويطلب كتبًا في النجوم والطب، وهذا أول اتصالٍ منظم بالعلم القديم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في العهد الأموي أيضًا بداية العمارة المدنية: الحمّامات، والخانات، والأسواق المسقوفة، والقنوات. وقد كانت هذه المنشآت تُبنى بأموال الدولة أو بأوقاف الأغنياء، وكانت تُدار بنظامٍ يُشبه البلدية، فيه من يُشرف على النظافة والأسعار والأوزان. وقد كان في دمشق نظامٌ للمياه يُعدّ من أعجب ما في الشرق في ذلك الزمان. وقد كان في هذا النظام ما يُشبه الإدارة البلدية الحديثة: من يُشرف على الأسواق ويُسمّى «المحتسب»، ومن يُشرف على الماء، ومن يُشرف على النظافة، وهذا كله نشأ في العهد الأموي ثم تطوّر بعد ذلك.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالبريد: شبكة الدولة العصبية\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان البريد في العهد الأموي يُشبه شبكة الاتصالات الحديثة؛ فقد كان يربط دمشق بخراسان ومصر والأندلس عبر محطاتٍ متتابعة. وقد كان لكل محطةٍ اسمٌ وموقعٌ معروف، وكان البريد يعمل في الصيف والشتاء، ويقطع المسافات في أيامٍ لا في أسابيع. وقد كان البريد يعمل بالخيل والبغال، وكان في المحطات طعامٌ وماء، وكان الرسول يُبدّل دابته ويستمر، وهذا يحتاج إلى تنظيمٍ دقيق لا يقدر عليه إلا دولةٌ مركزية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان للبريد وظيفتان: نقل الرسائل الرسمية، ونقل الأخبار إلى الخليفة. وقد كان صاحب البريد في كل إقليم يُبلّغ الخليفة بأحوال الوالي والناس والأسعار، ولذلك كان الولاة يخافونه أكثر من خوفهم من الخليفة نفسه، لأن كلامه يصل مباشرةً دون وسيط. وقد كان في هذا النظام خطرٌ على الولاة: أنهم كانوا يُحاسبون بأقوال صاحب البريد، فكانوا يُحاولون إرضاءه أو تخويفه، وقد وقعت في التاريخ حالاتٌ كثيرة لرشوةٍ أو تهديد في هذا الباب.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eبدايات النحو والسيرة\u003c/h4\u003e\u003cp class=\"ap\"\u003eبدأ النحو في البصرة في هذا العهد، وسبب بدايته أن الناس دخلوا في الإسلام من غير العرب، فبدأ اللحن في القرآن، فخشي العلماء أن يفسد المعنى. وقد وضع أبو الأسود الدؤلي علاماتٍ أولية للإعراب، ثم طوّرها تلاميذه، ثم جاء الخليل بن أحمد وسيبويه بعد ذلك فبنوا النحو الكامل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي المدينة بدأت السيرة النبوية تُكتب؛ فقد جمع عروة بن الزبير وأبان بن عثمان أخبار المغازي، ثم جاء الزهري فجمعها في كتابٍ واحد. وقد كان في هذا بداية علمٍ سيتحول بعد قرنٍ إلى مؤلفاتٍ ضخمة مثل سيرة ابن هشام وطبقات ابن سعد. وقد كان في هذا الجمع خطرٌ أيضًا: أن الروايات الشفوية قد تختلط بالأخبار الموضوعة، ولذلك نشأ بعد ذلك علم الإسناد، وهو الذي ميّز الحضارة الإسلامية عن غيرها في حفظ النصوص.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالمدن الجديدة ونمطها\u003c/h4\u003e\u003cp class=\"ap\"\u003eالمدن التي أُسست في العهد الأموي كانت في الغالب مدنًا مخططة، لا مدنًا نمت عشوائيًّا. فالقيروان وواسط والرملة بُنيت على تخطيطٍ مسبق: جامعٌ ودار إمارةٍ في المركز، وأسواقٌ حولهما، ومحلّاتٌ قبلية في الأطراف، وخندقٌ أو سورٌ في الخارج. وقد كان في هذا التخطيط نظامٌ للمياه أيضًا: قنواتٌ تجلب الماء إلى الجامع والحمّامات والأسواق، وهذا ما جعل المدينة قادرةً على النمو في أرضٍ قليلة الماء مثل القيروان.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان هذا النمط انعكاسًا لبنية الدولة نفسها: مركزٌ يمثّل السلطة، وأطرافٌ تمثّل القبائل، وسوقٌ يمثّل الاقتصاد. ومن هنا يمكن قراءة المدينة الإسلامية المبكرة كوثيقةٍ سياسية، لا كعمرانٍ فقط، وهذا ما يجعل دراسة تخطيط المدن جزءًا من دراسة التاريخ. وقد كان في هذا أيضًا دلالةٌ على أن الإسلام لم يبنِ مدنه على العشوائية، بل على تصوّرٍ للعلاقة بين المسجد والسوق والسلطة، وهذا التصور هو ما جعل المدينة الإسلامية تُعرف في كل مكان بشكلها المميز.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالخراج\u003c/b\u003e\u003cspan\u003eضريبة على الأرض، وكان المورد الأساسي للدولة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالجزية\u003c/b\u003e\u003cspan\u003eضريبة على أهل الذمة، ديناران إلى أربعة في الغالب.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالبريد\u003c/b\u003e\u003cspan\u003eشبكة محطات تربط دمشق بالأمصار، وله وظيفة إخبارية أيضًا.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأول النحو\u003c/b\u003e\u003cspan\u003eبدأ في البصرة على يد أبي الأسود الدؤلي ثم تلاميذه.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأول السيرة\u003c/b\u003e\u003cspan\u003eجمعها عروة بن الزبير وأبان بن عثمان ثم الزهري.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمجال\u003c/th\u003e\u003cth\u003eما نشأ في العهد الأموي\u003c/th\u003e\u003cth\u003eما صار إليه بعد ذلك\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالنحو\u003c/td\u003e\u003ctd\u003eعلامات إعراب أولية في البصرة\u003c/td\u003e\u003ctd\u003eمدرسة سيبويه والكوفيين\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالسيرة\u003c/td\u003e\u003ctd\u003eجمع المغازي في المدينة\u003c/td\u003e\u003ctd\u003eسيرة ابن هشام وطبقات ابن سعد\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالحديث\u003c/td\u003e\u003ctd\u003eصحفٌ صغيرة وتدوينٌ محدود\u003c/td\u003e\u003ctd\u003eالصحاح والسنن في القرن الثالث\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالعمارة\u003c/td\u003e\u003ctd\u003eالمسجد الأموي وقبة الصخرة وقصور البادية\u003c/td\u003e\u003ctd\u003eجامع قرطبة وعمارة القاهرة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمدن\u003c/td\u003e\u003ctd\u003eالقيروان وواسط والرملة\u003c/td\u003e\u003ctd\u003eنمط المدينة الإسلامية في كل الأمصار\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eالناس على دين ملوكهم.\u003c/p\u003e\u003ccite\u003eمعنى ما رُوي في أثر السلطة في تشكيل ثقافة المجتمع\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eكان العهد الأموي عهد تأسيسٍ لا عهد فتوحٍ فقط: نقدٌ موحّد، وبريد، ومدنٌ مخططة، وبدايات النحو والسيرة والحديث. وقد ورث العباسيون هذه البنية فبنوا عليها، فصار ما يُسمّى «العصر الذهبي» ثمرة بذورٍ زُرعت في هذا العهد الذي يُوصف عادةً بالعسكري فقط.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-6","n":"القسم السادس: السقوط وبقاء الأثر","ic":"","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-6\" style=\"--c:#4B0082\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🍂\u003c/div\u003e\n      \u003ch2\u003eالقسم السادس: السقوط وبقاء الأثر\u003c/h2\u003e\n      \u003cp\u003eفي سنة خمسٍ ومئة مات هشام بن عبد الملك، وكانت الدولة في ظاهرها في أوج قوتها: خراجٌ كبير، وجيوشٌ منتصرة، وحدودٌ ثابتة. وبعد ثمانية وعشرين سنة فقط كانت دمشق قد سقطت، وآخر خلفاء بني أمية يُقتل في قريةٍ في مصر. وقد كان السقوط أسرع من قيام الدولة، ولم يكن سببه جيشًا خارجيًّا، بل انقسامًا داخليًّا وثورةً أعدّت لها ثلاثون سنة.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#hisham\"\u003eهشام: قوة الظاهر\u003c/a\u003e\u003ca href=\"#weakness\"\u003eضعف الدولة والفتن الأخيرة\u003c/a\u003e\u003ca href=\"#dawa\"\u003eالدعوة العباسية السرية\u003c/a\u003e\u003ca href=\"#fall\"\u003eسقوط دمشق وبقاء الأثر\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"hisham","n":"هشام: قوة الظاهر","ic":"🏛️","part":"القسم السادس: السقوط وبقاء الأثر","h":"\u003carticle class=\"ch3\" id=\"hisham\" data-toc=\"هشام: قوة الظاهر\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٦.١\u003c/span\u003e\n          \u003ch3\u003e🏛️ هشام: قوة الظاهر\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eح\u003c/span\u003eكم هشام بن عبد الملك تسع عشرة سنة، وهي أطول مدةٍ حكمها خليفة أموي بعد معاوية، وفي عهده بلغت الدولة أقصى اتساعها، واستقرّت إدارتها، وازدهر اقتصادها، وبُنيت القصور والمدن. ومع ذلك كان عهده هو الذي بدأ فيه الهبوط، لأن القوة التي بناها كانت قوة أجهزةٍ لا قوة قلوب.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان هشام بن عبد الملك من أشدّ خلفاء بني أمية حرصًا على المال والإدارة، وقد رُوي أنه كان يُراقب الحسابات بنفسه، ويُحاسب العمال حسابًا دقيقًا، وكان يقول: «ما بقي من مال المسلمين درهمٌ إلا وأنا أعرف موضعه». وقد كان في هذا شبهًا بعمر بن عبد العزيز في الحزم الإداري، لكنه كان مختلفًا عنه في الغاية: عمر كان يردّ المظالم، وهشام كان يُحكم القبضة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في عهده أن بلغت الفتوح آخر مداها؛ فقد أرسل جيوشه إلى بلاد الفرنجة في الغال، وإلى جبال القوقاز، وإلى السند، وإلى صقلية. وقد كانت معركة بلاط الشهداء سنة أربع عشرة ومئة في عهده، وفيها هُزم المسلمون في قلب فرنسا، وكانت هذه الهزيمة هي التي أوقفت التوسع غربًا. وفي الشرق وصل جيشه إلى نهر الفولغا في عهد مروان بن محمد الذي كان واليًا على أرمينيا وأذربيجان.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان عهده عهد عمرانٍ كبير. فقد بنى قصر الرصافة في البادية، وبنى مدنًا ومصانع، وأصلح الطرق والقنوات، وأنشأ نظامًا للبريد منتظمًا. وقد كان في دمشق في عهده أسواقٌ وحمّاماتٌ ومدارس، وكانت الدولة تُنفق على العمارة إنفاقًا واسعًا. وقد كان هذا كله يُموّل من خراجٍ ثابت ومن غنائم الفتوح. وقد كان في هذا الإنفاق خطرٌ لم يظهر في وقته: أن الدولة صارت تُنفق إنفاق من يظنّ أن الخراج لا ينقص، فلمّا نقص في آخر عهده لم يكن هناك احتياطٌ ماليّ يُغطّي النقص.\u003c/p\u003e\u003cp class=\"ap\"\u003eلكن في عهده بدأت المشاكل الكبرى. فقد اشتدّت العصبية بين القيسية واليمانية في الشام وفي خراسان، وكان هشام يميل إلى اليمانية أحيانًا وإلى القيسية أحيانًا، وكان هذا يُغضب الطرف الآخر. وفي خراسان كان الولاة يتغيّرون بسرعة، وكان كل والٍ يعزل أنصار من قبله ويُقرّب أنصاره، وكان هذا يُنتج ثوراتٍ متتالية. وقد كان في هذا دليلًا على أن الولايات البعيدة لا تُحكم بتغيير الولاة كل سنة، لأن كل والٍ يحتاج إلى وقتٍ ليعرف البلاد وأهلها، فإذا تغيّر قبل أن يعرفها بقي كل شيء في مكانه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي العراق كان الخوارج يخرجون في كل سنة تقريبًا، وكان الزيدية يتحركون، وقد خرج زيد بن عليّ في الكوفة سنة اثنتين وعشرين ومئة، فقتله يوسف بن عمر الثقفي وصلبه. وقد كان في مقتل زيد بن عليّ حدثٌ خطير؛ لأنه كان من أهل البيت، ولأن قتله وصلبه أثار الناس في العراق والحجاز وخراسان، وصار رمزًا للثورة على بني أمية. وقد كان في هذا الحدث أيضًا أثرٌ مذهبي: أن قتل العلويين وصلبهم صار حجّةً للدعوة العباسية التي كانت تُخاطب الناس باسم أهل البيت، وأن بني أمية لم يعرفوا أنهم يُهدون خصومهم دليلًا في كل مرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في عهد هشام أيضًا أن بدأت الدعوة العباسية تنشط في خراسان، وكانت حركةً سرية تُدار من الحميمة في الأردن، وكان لها دعاتها في الأمصار، وكان شعارها «الرضا من آل محمد». وقد كان هشام يعرف بوجود حركةٍ سرية، لكنه لم يُدرك حجمها، وقد رُوي أن والي خراسان كتب إليه يُخبره بأمر أبي مسلم، فلم يُعطِ الأمر اهتمامًا كبيرًا. وقد كان في هذا الإهمال ما يُشبه الإهمال الذي وقع لبعض الدول قبل سقوطها: أن الخطر يُرى صغيرًا لأنه في طرفٍ بعيد، ثم يتبيّن أنه كان في الطرف البعيد لأنه ينمو حيث لا يُنظر إليه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في عهد هشام أيضًا أن توقّف الفتح في الغرب بعد بلاط الشهداء، وتوقّف في الشرق بعد معارك الخزر، وفي الأندلس بدأت حركة الاستعادة المسيحية في الشمال. وقد كان هذا يعني أن الدولة انتقلت من الهجوم إلى الدفاع، وأن مواردها ستنقص، وأن جيشها سيُوزّع على جبهاتٍ كثيرة، وهذا كله كان يُنذر بأن الأزمة قادمة. وقد كان في هذا التحوّل من الهجوم إلى الدفاع ما يُفسّر نقص المال في السنوات التالية: فالدولة التي كانت تعيش على الغنائم صارت تُنفق على الحصون والجيوش بلا غنائم تُعادل النفقة، وهذا يُنتج أزمةً ماليةً لا يُعالجها إلا إصلاحٌ داخلي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد مات هشام سنة خمسٍ وعشرين ومئة في الرصافة، وكان قد أوصى بالخلافة لابنه، لكن الأمر انتهى إلى الوليد بن يزيد بن عبد الملك، وكان رجلًا مشغولًا باللهو والشعر، ولم يكن له من خبرة الحكم ما لأبيه. وقد كان هذا الانتقال هو الشرارة التي أشعلت الفتنة الأخيرة، لأن بني أمية أنفسهم انقسموا عليه. وقد كان في هذا الانتقال درسٌ في نظام التوريث: أن الخلافة إذا صارت ملكًا وراثيًّا بلا ضابطٍ للكفاءة صارت تُنتج خليفةً ضعيفًا كل جيلٍ أو جيلين، وهذا ما جرى في بني أمية أكثر من مرة.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eبلاط الشهداء: نهاية التوسع غربًا\u003c/h4\u003e\u003cp class=\"ap\"\u003eفي سنة أربع عشرة ومئة خرج عبد الرحمن الغافقي من الأندلس بجيشٍ كبير إلى بلاد الفرنجة، فعبر البرانس وانتصر في معارك عدة، وبلغ مدينة بواتييه في وسط فرنسا. وهناك التقى بجيش شارل مارتل في موضعٍ سُمّي بلاط الشهداء، فدارت معركةٌ استمرت أيامًا، ثم انهزم المسلمون وقُتل الغافقي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد اختلف المؤرخون في سبب الهزيمة: فمنهم من قال إن السبب هو انشغال الجيش بحماية الغنائم، ومنهم من قال إن السبب هو كثرة الخيول المدرّعة عند الفرنجة، ومنهم من قال إن الجيش كان بعيدًا عن قواعده وأن الإمدادات لم تصل. وأيا كان السبب، فإن النتيجة كانت أن الفتح توقف عند البرانس ولم يتجاوزه.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eزيد بن عليّ والزيدية\u003c/h4\u003e\u003cp class=\"ap\"\u003eخرج زيد بن عليّ بن الحسين في الكوفة سنة اثنتين وعشرين ومئة، وكان عالِمًا وشجاعًا، وقد أراد أن يُغيّر الحكم بالسلاح، وتبعه في الكوفة عددٌ كبير. لكن الوالي يوسف بن عمر استطاع أن يُفرّق الناس عنه، فقُتل في المعركة، ثم صُلب في الكناسة سنوات. وقد كان في خروجه علامةً على أن العلويين لم يتوقفوا عن المطالبة بالحكم، وأن كل جيلٍ منهم كان يُخرج واحدًا، وهذا ما جعل الدولة تعيش في حالة استنفارٍ دائم مع أهل البيت.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في مقتله أثرٌ كبير في تكوين الفرق؛ فقد قامت بعد ذلك فرقة الزيدية التي ترى أن الإمامة لمن خرج بالسيف من ولد فاطمة، وكانت هذه الفرقة أكثر الفرق قربًا من أهل السنة في الفقه. وقد كان صلب زيد وصَلْبُه في الكناسة من أشهر ما نُعي على بني أمية. وقد كان في مصير جسده أيضًا رمزٌ سياسي: أن يُصلب في الكناسة بالكوفة، وهي موضعٌ عامّ يراه الناس كل يوم، كان إعلانًا بالسلطة، لكنه كان في الوقت نفسه إعلانًا بالظلم يُحرّض الناس أكثر مما يُرهبهم.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالحميمة والدعوة السرية\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الحميمة قريةً في الأردن، وفيها عاش عددٌ من أبناء العباس بن عبد المطلب، وكانوا يُديرون منها دعوةً سرية إلى أنفسهم. وقد كان في الدعوة اثنا عشر نقيبًا في الأمصار، وكانوا يتنقلون بين خراسان والعراق والحجاز، ويجمعون الأموال من الأنصار، ويُرسلون الدعاة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان نجاح الدعوة في سريتها؛ فقد استمرت ثلاثين سنة قبل أن تظهر، ولم يعرف بها أحدٌ إلا في السنوات الأخيرة. وقد كان في هذا درسٌ سياسي: أن الحركة التي تُبنى ببطءٍ وتنظيمٍ تُسقط دولةً في أشهر، وأن الدولة التي تُراقب الخطباء والثوار لا تُراقب التجار والحجاج والدعاة.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمدة حكم هشام\u003c/b\u003e\u003cspan\u003e١٩ سنة، من ١٠٥هـ إلى ١٢٥هـ.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eبلاط الشهداء\u003c/b\u003e\u003cspan\u003eسنة ١١٤هـ، أوقفت التوسع الإسلامي غربًا.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالرصافة\u003c/b\u003e\u003cspan\u003eقصرٌ ومدينةٌ بناها هشام في البادية قرب الرقة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eزيد بن عليّ\u003c/b\u003e\u003cspan\u003eخرج في الكوفة سنة ١٢٢هـ، وقُتل وصُلب.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالحميمة\u003c/b\u003e\u003cspan\u003eمركز الدعوة العباسية السرية في الأردن.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالخليفة\u003c/th\u003e\u003cth\u003eالمدة\u003c/th\u003e\u003cth\u003eأبرز ما في عهده\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالوليد بن عبد الملك\u003c/td\u003e\u003ctd\u003e٨٦–٩٦هـ\u003c/td\u003e\u003ctd\u003eالمسجد الأموي وفتح الأندلس\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eسليمان\u003c/td\u003e\u003ctd\u003e٩٦–٩٩هـ\u003c/td\u003e\u003ctd\u003eحصار القسطنطينية والوصية لعمر\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eعمر بن عبد العزيز\u003c/td\u003e\u003ctd\u003e٩٩–١٠١هـ\u003c/td\u003e\u003ctd\u003eالإصلاح وردّ المظالم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eيزيد بن عبد الملك\u003c/td\u003e\u003ctd\u003e١٠١–١٠٥هـ\u003c/td\u003e\u003ctd\u003eالعودة إلى سياسة القبائل\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eهشام\u003c/td\u003e\u003ctd\u003e١٠٥–١٢٥هـ\u003c/td\u003e\u003ctd\u003eأقصى اتساع وقوة ظاهرية وبداية الهبوط\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eما بقي من مال المسلمين درهمٌ إلا وأنا أعرف موضعه.\u003c/p\u003e\u003ccite\u003eكلمة تُنسب إلى هشام بن عبد الملك في حرصه على المال\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eكان عهد هشام أطول عهود بني أمية بعد معاوية، وأقواها في الظاهر: فتوحٌ واقتصادٌ وعمارة. لكن فيه توقّف التوسع، واشتدّت العصبية، وقُتل زيد بن عليّ، ونمت الدعوة العباسية في السرّ. فلمّا مات لم يكن في الدولة من يحملها.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"weakness","n":"ضعف الدولة والفتن الأخيرة","ic":"🌫️","part":"القسم السادس: السقوط وبقاء الأثر","h":"\u003carticle class=\"ch3\" id=\"weakness\" data-toc=\"ضعف الدولة والفتن الأخيرة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٦.٢\u003c/span\u003e\n          \u003ch3\u003e🌫️ ضعف الدولة والفتن الأخيرة\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eب\u003c/span\u003eين سنة خمسٍ وعشرين ومئة وسنة اثنتين وثلاثين ومئة تعاقب على الخلافة أربعة خلفاء، وكانت الدولة في حربٍ داخلية دائمة. وقد كان هذا العقد هو الذي أسقط الدولة فعلًا، لا معركة الزاب؛ فالدولة التي تُقاتل نفسها عشر سنين لا تحتاج إلى عدوٍّ خارجي كبير.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان الوليد بن يزيد بن عبد الملك شاعرًا مُحبًّا للغناء والصيد، ولم يكن له من خبرة الحكم ما يُؤهّله، وقد كان بنو أمية أنفسهم يرفضونه. وقد كان في عهده أن خرج عليه ابن عمه يزيد بن الوليد، وكان يزيد هذا زاهدًا يُلقّب «الناقص» لأنه قال إنه سيُنقص من الأعطيات، فاستطاع أن يجمع أنصارًا في الشام وأن يقتل الوليد سنة ستٍّ وعشرين. وقد كان في هذا القتل أيضًا انقلابٌ في مفهوم البيعة: فلم تبقَ البيعة عهدًا يُحترم، بل صارت عقدًا يُنقض إذا وجد الناقض قوةً كافية، وهذا ما جعل عقد الخلافة في بني أمية مضطربًا في سنواته الأخيرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان قتل الوليد بن يزيد أول قتلٍ لخليفةٍ على يد بني أمية أنفسهم، وهذا كان انقلابًا في قواعد اللعبة: فلم يبقَ للخلافة حرمة، وصار كل أميرٍ يرى نفسه أهلًا لها. وقد حكم يزيد الناقص ستة أشهر فقط، ثم مات، فبايع أهل الشام أخاه إبراهيم، ثم خرج عليهم مروان بن محمد من أرمينيا فانتصر عليهم ودخل دمشق سنة سبعٍ وعشرين. وقد كان مروان يُلقّب «الحمار» في المصادر الأموية، وكان يُقال إنه لا يُبالي بمن قتل، وقد كان في قوّته ما كان يمكن أن يُنقذ الدولة لو جاء قبل عشر سنوات، لكنه جاء بعد أن استُنزفت في الفتن الداخلية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان مروان بن محمد — وهو آخر الخلفاء — رجلًا قويًّا وحازمًا، وقد حاول أن يُعيد بناء الدولة، لكنه بدأ في وقتٍ متأخر. وقد كان في عهده أن اشتعلت الحرب بين القيسية واليمانية في الشام، فقاتل اليمانية معه في معارك داخلية، وقد كان في الوقت نفسه أن الثورة العباسية ظهرت في خراسان. وقد كان في تزامن الفتن الداخلية مع الثورة الخارجية ما يُعرف في الدراسات الحديثة بـ«النافذة التاريخية»: أن الدولة لا تسقط حين يكون عدوّها أقوى، بل حين تكون هي في أضعف حالاتها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت ثورات الخوارج في هذا العهد أشدّ من قبل؛ فقد خرج في العراق الضحاك بن قيس الشيباني، واستولى على الكوفة سنة سبعٍ وعشرين، ثم خرج سليمان بن هشام في الشام، ثم خرج في اليمن واليمامة والبحرين ثوارٌ آخرون. وقد كان مروان يشتغل بثورةٍ في الشرق فيخرج عليه ثائرٌ في الغرب، وهذا ما أضعف جيشه إلى حدٍّ كبير. وقد كان في هذا الإرهاق سببٌ مباشر في أن جيش الزاب لم يكن في أفضل حالاته: فقد كان الجند مُتعَبين من سنوات القتال الداخلي، وكانت أعطياتهم متأخرة، وكانت ثقتهم بقادتهم مهزوزة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت ثورة البربر في المغرب سنة اثنتين وعشرين ومئة من أخطر الثورات؛ فقد خرجوا على الوالي بسبب الضرائب والتعسف، وانتصروا في معركة الأشراف قرب طنجة، وقتلوا الوالي خالد بن أبي حبيب. وقد أدّى هذا إلى انفصال المغرب عن الدولة الأموية فعليًّا، ثم إلى قيام دولة بني مدرار والدول الإباضية هناك. وقد كان في انفصال المغرب خطرٌ استراتيجي بعيد المدى: أن الدولة فقدت ساحلها الغربي وطرق تجارتها مع السودان، وأن هذا الانفصال مهّد بعد ذلك لقيام دولٍ مستقلة في كل المغرب لم تخضع لبغداد أبدًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا العهد أيضًا أن توقّف الخراج في كثير من الأمصار، وأن نقصت الأعطيات، وأن كثرت الفتن. وقد كان هذا يُنتج حلقةً مفرغة: أن الفتنة تُنقص المال، وأن نقص المال يُنتج فتنةً جديدة، وأن الجيش الذي يُقاتل الفتن يحتاج إلى مالٍ لا يوجد. وقد كان هذا هو ما يُعجّل السقوط في كل دولةٍ تمرّ بهذه المرحلة. وقد كان في هذه الحلقة المفرغة ما يجعل الإصلاح المالي هو الحلّ الوحيد، وقد حاول بعض الخلفاء ذلك، لكن الإصلاح المالي في دولةٍ قائمة على الامتيازات يعني مصادرة مصالح الأقوياء، وهذا يحتاج إلى استقرارٍ لا إلى فتنة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه السنوات أيضًا أن ضعفت هيبة الخلافة في الأمصار؛ فصار الولاة يستقلّون بالحكم، وصار الناس يدفعون الخراج لمن يغلب لا لمن يحكم. وفي خراسان صار نصر بن سيار واليًا ضعيفًا لا يملك جيشًا كافيًا، وكان يكتب إلى مروان يستنجد، وكانت رسائله تُشبه نُذُرًا أخيرة: «إنّي أرى الفتن كالموج»، وقد كان في هذا دليلًا على أن الدولة لم تكن تعرف حجم الخطر القادم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه السنوات أن ظهرت في الشام أعراض انحلالٍ اجتماعي: كثرة الغناء والمجون في قصور بعض الأمراء، وانشغال الناس باللهو، وانقطاع الناس عن الجهاد في الثغور. وقد كان هذا يُقارَن في المصادر بسيرة عمر بن عبد العزيز، وكان المؤرخون يُقيمون العهد بذلك الفرق، وهذا ما جعل رواياتهم عن هذا العقد أكثر قتامةً مما قد يكون الواقع. وقد كان في هذا الوصف مبالغةٌ في بعضه، لأن المصادر التي وصلتنا كُتبت في العهد العباسي، وكان أصحابها يميلون إلى تشويه صورة بني أمية لتبرير قيام الدولة الجديدة، وهذا ما يجب أن يُؤخذ في الحساب عند قراءة أخبار ذلك العهد.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eقتل الوليد بن يزيد\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الوليد بن يزيد قد أثار غضب بني أمية بأشياء كثيرة: أنه كان يُجالس الشعراء والمغنين، وأنه كان يُكثر من الصيد، وأنه لم يكن يحضر الصلاة، وأنه هدّد بعض أعمامه. وقد اجتمع عليه بنو أمية في الشام، وقدّم يزيد بن الوليد نفسه بديلًا، وقال إنه سيُنقص من الأعطيات وأنه سيعمل بالكتاب والسنة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد حوصر الوليد في قصرٍ في البادية، وقُتل سنة ستٍّ وعشرين ومئة، وحُمل رأسه إلى دمشق. وقد كان في هذا القتل ما لم يجرِ من قبل: أن يقتل بنو العمّ ابن عمّهم الخليفة، وأن يُنتهك حرمة البيت الأموي من داخله، وهذا ما جعل كل أميرٍ بعد ذلك يخشى على نفسه من أقرب الناس إليه.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالحرب بين القيسية واليمانية\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الحرب بين القيسية واليمانية في الشام قد بدأت في عهد الوليد بن يزيد، ثم صارت حربًا مفتوحة في عهد مروان بن محمد. فقد ثار أهل حمص، ثم ثار اليمانية في دمشق، وحاصر مروان دمشق، وقاتل أهلها، ثم دخلها بعد حصارٍ طويل. وقد كان في حصار دمشق رمزٌ ثقيل: أن عاصمة الدولة تُحاصر بجيشٍ من أهلها، وأن الخليفة يدخلها بعد قتالٍ لإخوانه، وهذا ما لم يجرِ في تاريخ بني أمية من قبل، وقد كان في هذا إعلانٌ بأن الدولة لم يبقَ لها ما تحميه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه الحرب أن الجيش الشامي انقسم إلى قسمين، وكل قسم يقاتل الآخر، وقد كان هذا في وقتٍ كانت فيه الثورة العباسية تتقدّم في خراسان. وقد كان في هذا الانقسام السبب المباشر في أن مروان لم يستطع أن يجمع جيشًا كبيرًا لمواجهة أبي مسلم، وأنه اضطرّ إلى أن يترك الشام في حالة ضعف.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eنصر بن سيار ونُذُر الخراسانيين\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان نصر بن سيار آخر ولاة خراسان الأمويين، وقد حكمها في ظروفٍ صعبة: ثوراتٌ في المدن، ودعوةٌ سرية تنتشر، وجيشٌ منقسم على القبائل. وقد كتب إلى مروان بن محمد رسائل يُنذره، وكان في رسائله يُشبّه الفتنة بالموج، ويطلب المدد. وقد كان نصر من القيسية، وكان اليمانية في خراسان يعادونه، فلم يستطع أن يجمع الجيش كله تحت رايته، وكان في هذا مثالًا على أن العصبية القبلية كانت تُسقط الوالي قبل أن تُسقط الدولة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان مروان يشتغل بالشام، فلم يُرسل ما يكفي، حتى قيل إن نصرًا قال: «أرى الفتن كالموج، وإنّي لأنظر إلى خراسان وقد خرجت من يدي». وقد خرج نصر من مرو سنة ثلاثين ومئة، ثم مات في الطريق إلى العراق، ولم يشهد سقوط الدولة التي كان يُدافع عنها. وقد كان في موته في الطريق صورةً بليغةً لمصير الدولة: أن آخر من دافع عنها لم يمت في معركة، بل مات في طريق الهجرة، ولم يعرف أحدٌ مكان قبره على وجه اليقين.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالوليد بن يزيد\u003c/b\u003e\u003cspan\u003eقُتل سنة ١٢٦هـ، وكان أول خليفةٍ يقتله بنو أميته.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eيزيد الناقص\u003c/b\u003e\u003cspan\u003eحكم ستة أشهر، ولُقّب بذلك لأنه وعد بإنقاص الأعطيات.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمروان بن محمد\u003c/b\u003e\u003cspan\u003eآخر الخلفاء، حاول الإصلاح في وقتٍ متأخر جدًّا.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eثورة البربر\u003c/b\u003e\u003cspan\u003eسنة ١٢٢هـ في المغرب، أدّت إلى انفصاله عن الدولة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eنصر بن سيار\u003c/b\u003e\u003cspan\u003eآخر ولاة خراسان، مات في الطريق قبل سقوط الدولة.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالخليفة\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e١٢٥هـ\u003c/td\u003e\u003ctd\u003eهشام\u003c/td\u003e\u003ctd\u003eموته وانتقال الخلافة إلى الوليد بن يزيد\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٢٦هـ\u003c/td\u003e\u003ctd\u003eالوليد بن يزيد\u003c/td\u003e\u003ctd\u003eقتله على يد بني أمية أنفسهم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٢٦هـ\u003c/td\u003e\u003ctd\u003eيزيد الناقص\u003c/td\u003e\u003ctd\u003eستة أشهر ثم موت\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٢٧هـ\u003c/td\u003e\u003ctd\u003eمروان بن محمد\u003c/td\u003e\u003ctd\u003eدخول دمشق بعد حربٍ داخلية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٣٢هـ\u003c/td\u003e\u003ctd\u003eمروان بن محمد\u003c/td\u003e\u003ctd\u003eسقوط الدولة في معركة الزاب\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eأرى الفتن كالموج، وإنّي لأنظر إلى خراسان وقد خرجت من يدي.\u003c/p\u003e\u003ccite\u003eمن رسائل نصر بن سيار إلى مروان بن محمد\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eفي سبع سنوات قُتل خليفة، وتنازع أربعة، واشتعلت الحرب بين القيسية واليمانية، وثار البربر في المغرب، وظهرت الثورة في خراسان. وقد كانت الدولة في هذه السنوات تُقاتل نفسها، فلم يكن سقوطها مفاجأةً بل نتيجةً متوقّعة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"dawa","n":"الدعوة العباسية السرية","ic":"🕯️","part":"القسم السادس: السقوط وبقاء الأثر","h":"\u003carticle class=\"ch3\" id=\"dawa\" data-toc=\"الدعوة العباسية السرية\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٦.٣\u003c/span\u003e\n          \u003ch3\u003e🕯️ الدعوة العباسية السرية\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي قرية الحميمة في الأردن، وبين أبناء العباس بن عبد المطلب، بدأت سنة مئة للهجرة حركةٌ سرية لم يُعرَف بها أحد. وقد استمرت ثلاثين سنة تعمل في الظل: تُرسل الدعاة، وتجمع المال، وتُعدّ الأنصار، وتنتظر اللحظة. وحين ظهرت في خراسان سنة تسعٍ وعشرين ومئة، لم تحتج إلى أكثر من ثلاث سنوات لتُسقط دولةً عمرها تسعون سنة.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان العباسيون من ولد العباس بن عبد المطلب، عمّ النبيّ، ولم يكن لهم في الخلافة نصيبٌ من قبل، وقد كانوا يعيشون في الحميمة في الأردن، وكان لهم فيها ضيعةٌ صغيرة. وقد بدأت الدعوة سنة مئة على يد محمد بن عليّ بن عبد الله بن العباس، وقد كان رجلًا هادئًا ذكيًّا، وقد اختار لحركته شعارًا واسعًا: «الرضا من آل محمد»، ولم يُحدّد اسمًا، وهذا الشعار كان يستوعب كل من كان يرى أن الحكم يجب أن يكون في أهل البيت.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت الدعوة تُدار بنظامٍ دقيق: إمامٌ في الحميمة، ونقباء في الأمصار، ودعاةٌ يتنقلون، وكان لكل داعيةٍ منطقةٌ معروفة، وكان الدعاة لا يعرفون الإمام الأعلى بالاسم، بل يعرفون نقيبهم فقط، وهذا ما جعل الحركة تصمد ثلاثين سنة بلا انكشاف. وقد كان الدعاة يتظاهرون بالتجارة والحج، وكانوا يجمعون الأموال من الأنصار باسم «حقّ الإمام». وقد كان في هذا التنظيم ما يُشبه التنظيمات الحديثة: أن العضو لا يعرف إلا من فوقه، وأن المعلومة تُقسّم إلى أجزاء، فإذا أُسر واحدٌ لا يستطيع أن يُفشي كل شيء، وهذا ما جعل الحركة تعيش ثلاثين سنة في بلدٍ فيه جواسيس للدولة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد اختار العباسيون خراسان لتكون مركز حركتهم، والسبب في ذلك أن خراسان كانت أكثر الأمصار احتقانًا: فيها عربٌ متنازعون، وفيها موالٍ محرومون، وفيها فرسٌ يريدون أن يعود إليهم مجدهم القديم. وقد كان أهل خراسان قد تعبوا من ولاةٍ يتغيّرون كل سنة، ومن ضرائب لا تنتهي، ومن جيوشٍ تُقاتل بعضها. وقد كان في هذا كله أرضًا خصبةً لأي حركةٍ تُطالب بالعدل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سنة تسعٍ وعشرين ومئة أرسل الإمام إبراهيم بن محمد — وهو ابن محمد بن عليّ — أبا مسلم الخراساني إلى خراسان، وكان شابًّا في نحو الثلاثين، وكان من الموالي الفرس، وقد كان ذكيًّا وحازمًا وقاسيًا في الوقت نفسه. وقد استطاع في سنةٍ واحدة أن يجمع الأنصار، وأن يرفع الرايات السوداء في مرو سنة تسعٍ وعشرين، وأن يُخرج الوالي الأموي منها. وقد كان في سرعة صعوده ما يُدهش: أن رجلًا غريبًا عن البلاد، من الموالي، بلا قبيلةٍ ولا مال، صار في سنةٍ واحدة قائد خراسان، وقد كان في هذا دليلًا على أن التنظيم الحركي أقوى من العصبية القبلية إذا أُحسن بناؤه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان اختيار اللون الأسود مقصودًا؛ فقد كان يُروى أن رايات أهل البيت سوداء، وكان الأسود أيضًا لون الحزن على ما جرى لأهل البيت، وكان في الوقت نفسه لونًا يُخالف ألوان بني أمية التي كانت بيضاء في الشام. وقد صار الأسود شعار الدولة العباسية كلها بعد ذلك، حتى قيل «المسوّدة» على أنصارها. وقد كان في هذا اللون أيضًا دلالةً على الثأر: أن الحركة جاءت لتطلب بدم أهل البيت، وأن السواد لباس الحزن عليهم، وقد كان في هذا استثمارٌ عاطفي كبير جعل الناس يلتفّون حول الرايات قبل أن يعرفوا أصحابها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان أبو مسلم يُدير الحرب بمنهجٍ جديد: أنه لا يقاتل إلا بعد أن يُهيّئ الأرض، وكان يستعمل الدعاية قبل السلاح، وكان يُوالي بين القبائل ويُوازن بينها، وكان لا يتردّد في قتل من يرى فيه خطرًا. وقد قيل إنه قتل في خراسان أعدادًا كبيرة من العرب والفرس معًا، وإنه كان يقول: «ما أُبالي بمن قتل من العرب»، وهذا يُبيّن أن الحركة لم تكن حركة عدلٍ بالمعنى الذي وعدت به.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد استولى أبو مسلم على مرو، ثم على نيسابور، ثم على هراة، ثم على بلخ، ثم على سمرقند. وقد حاول الجيش الأموي أن يُوقفه في معارك عدة، لكنه انتصر، وقد كان في هذا أن خراسان كلها صارت في يده سنة إحدى وثلاثين. وقد كان الوالي نصر بن سيار يطلب المدد من مروان، ولم يصل، فخرج من مرو ومات في الطريق. وقد كان في هذا الأسلوب ما يُبيّن أن الثورة لم تكن حركة مظلومين بالمعنى النقي؛ فقد استعملت الظلم شعارًا، ثم مارست القتل بلا حساب، وهذا ما يجعل الحكم عليها يحتاج إلى تمييزٍ بين الشعار والسلوك.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الحركة عنصرٌ ثالث لم يُذكر كثيرًا: أن جماعةً من الشيعة والزيدية انضمّت إليها وهي تحسب أنها تعمل لآل البيت الحقيقيين، أي لولد عليّ وفاطمة، لا لولد العباس. وقد كان في هذا خدعةً سياسية كبيرة، وقد انكشف الأمر بعد ذلك حين صار الحكم للعباسيين، فثارت حركاتٌ شيعية كثيرة في العهد العباسي، ومنها حركة محمد النفس الزكية سنة خمسٍ وأربعين ومئة.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eشعار «الرضا من آل محمد»\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان هذا الشعار من أذكى الشعارات في التاريخ السياسي؛ لأنه لم يُحدّد اسمًا، فاستوعب كل من كان غاضبًا: الشيعة الذين يريدون عليًّا وأولاده، والعباسيون الذين يريدون العباس وأولاده، والزيدية الذين يريدون من يخرج بالسيف، وحتى بعض أهل السنة الذين كانوا يرون أن الحكم يجب أن يكون في قريش.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا الشعار أيضًا غموضٌ مقصود؛ فالدعاة كانوا يقولون للناس إن الإمام سيُرضي الجميع، ولا يقولون من هو. وقد كان في هذا الغموض قوةً في المرحلة السرية، وخطرًا في المرحلة العلنية، لأنه لمّا ظهرت الحركة وظهر إمامها عباسيًّا لا علويًّا، شعر كثير من الأنصار أنهم خُدعوا.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eأبو مسلم الخراساني\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان أبو مسلم من الموالي، وقيل إن اسمه كان بهزادان، وكان من قريةٍ في خراسان، وقد نشأ في الكوفة ثم عاد إلى خراسان. وقد كان شابًّا حين أُرسل إليها، ولم يكن له نسبٌ ولا قبيلة، وكان هذا في صالحه؛ لأنه لم يكن طرفًا في صراع القبائل، فاستطاع أن يُوازن بينها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان أبو مسلم قائدًا عسكريًّا من الطراز الأول، وقد استعمل أسلوب الحرب النفسية: كان يُرسل الرسائل إلى قوّاد الأمويين يُحرّضهم على الانضمام، وكان يُشيع أن جيشه لا يُهزم، وكان يقطع خطوط الإمداد. وقد قُتل بعد ذلك سنة سبعٍ وثلاثين بأمر المنصور، وقد كان قتله من أكبر المفارقات: أن يُقتل باني الدولة على يد من بنى له الدولة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eلماذا خراسان؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت خراسان في ذلك الوقت أكبر ولايةٍ إسلامية في الشرق، وكانت فيها مدنٌ كبيرة مثل مرو ونيسابور وهراة وبلخ، وكانت مركزًا للتجارة بين الصين والهند والغرب. وقد كان فيها عددٌ كبير من الموالي الذين أسلموا ولم يأخذوا حقوقهم، وكان فيها عربٌ من قبائل متنازعة، وكانت بعيدة عن دمشق بحيث يصعب ضبطها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في خراسان أيضًا تراثٌ من الحركات السابقة: حركة المختار، وحركات الخوارج، وحركات الزيدية، وكان الناس فيها قد تعوّدوا على المعارضة. وقد كان في هذا كله ما يجعلها المكان الأمثل لحركةٍ تريد أن تُسقط الدولة من أطرافها لا من مركزها، وقد كان هذا هو ما جرى فعلًا.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eبداية الدعوة\u003c/b\u003e\u003cspan\u003eسنة ١٠٠هـ على يد محمد بن عليّ بن العباس في الحميمة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالشعار\u003c/b\u003e\u003cspan\u003e«الرضا من آل محمد»، ولم يُحدّد اسم الإمام.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأبو مسلم\u003c/b\u003e\u003cspan\u003eأُرسل إلى خراسان سنة ١٢٩هـ، ورفع الرايات السوداء في مرو.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eاللون الأسود\u003c/b\u003e\u003cspan\u003eشعار العباسيين، ويُخالف بياض رايات بني أمية.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالنتيجة\u003c/b\u003e\u003cspan\u003eسقوط الدولة الأموية سنة ١٣٢هـ بعد ثلاث سنوات من الظهور.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e١٠٠هـ\u003c/td\u003e\u003ctd\u003eبداية الدعوة في الحميمة\u003c/td\u003e\u003ctd\u003eحركةٌ سرية تُدار من قريةٍ في الأردن\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٢٩هـ\u003c/td\u003e\u003ctd\u003eأبو مسلم في خراسان\u003c/td\u003e\u003ctd\u003eرفع الرايات السوداء في مرو\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٣٠هـ\u003c/td\u003e\u003ctd\u003eسقوط نيسابور وهراة\u003c/td\u003e\u003ctd\u003eسيطرة العباسيين على شرق خراسان\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٣١هـ\u003c/td\u003e\u003ctd\u003eسقوط مرو وبلخ\u003c/td\u003e\u003ctd\u003eخراسان كلها في يد أبي مسلم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٣٢هـ\u003c/td\u003e\u003ctd\u003eمعركة الزاب\u003c/td\u003e\u003ctd\u003eسقوط دمشق ونهاية الدولة الأموية\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eالرضا من آل محمد.\u003c/p\u003e\u003ccite\u003eشعار الدعوة العباسية في مرحلتها السرية\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eثلاثون سنة من العمل في الظل، وشعارٌ غامض يستوعب كل غاضب، واختيارٌ ذكي لخراسان، وقائدٌ شابٌّ من الموالي. بهذه العناصر أُسقطت دولةٌ عمرها تسعون سنة في ثلاث سنوات، ولم يكن السلاح أهم من التنظيم ولا التنظيم أهم من الشعار.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"fall","n":"سقوط دمشق وبقاء الأثر","ic":"🔥","part":"القسم السادس: السقوط وبقاء الأثر","h":"\u003carticle class=\"ch3\" id=\"fall\" data-toc=\"سقوط دمشق وبقاء الأثر\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٦.٤\u003c/span\u003e\n          \u003ch3\u003e🔥 سقوط دمشق وبقاء الأثر\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي الحادي عشر من جمادى الآخرة سنة اثنتين وثلاثين ومئة التقى جيش مروان بن محمد بجيش أبي مسلم عند نهر الزاب قرب الموصل. وقد كانت المعركة قصيرة، وانتهت بهزيمة الأمويين، ثم تتابع السقوط: دمشق، ثم فلسطين، ثم مصر، ثم قُتل مروان في بوصير. وقد انتهت دولةٌ في أشهر، لكن آثارها بقيت في كل مكان.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان جيش مروان كبيرًا، ويُقدَّر في بعض الروايات بمئةٍ وعشرين ألفًا، وكان جيش أبي مسلم أقلّ عددًا، لكنه كان أكثر تنظيمًا وأشدّ حماسًا. وقد كان في جيش مروان انقسامٌ قبلي كما ذكرنا، وقد انسحبت منه فرقٌ في أثناء المعركة، وقد قيل إن مروان قال لجنوده: «قفوا فإنكم أكثر عددًا»، فلم يثبتوا. وقد كان في هذه الكلمة ما يُشبه الاعتراف: أنه كان يعرف أن العدد ليس كل شيء، وأن جيشه لم يكن مؤمنًا بقضيته، ولذلك لم يثبت حين اشتدّ القتال.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد هرب مروان بعد المعركة إلى حرّان، ثم إلى دمشق، ثم إلى فلسطين، ثم إلى مصر، وكان يتتبعه جيش العباسيين. وقد قُتل في بوصير في مصر سنة اثنتين وثلاثين، وقيل إنه قُتل في المسجد، وقيل في بيتٍ، وقد كان آخر من حمل لقب «أمير المؤمنين» من بني أمية في المشرق. وقد كان في مقتله في مصر نهايةً رمزية: أن آخر خلفاء دمشق قُتل في بلدٍ بعيد، في قريةٍ صغيرة، ولم يكن معه جيشٌ ولا حاشية، وقد كان في هذا مصيرًا يُشبه مصير من بنى الدولة الأولى في المدينة قبل قرنٍ من الزمان.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد دخل العباسيون دمشق في رمضان سنة اثنتين وثلاثين، ولم تكن المدينة قد استعدّت للدفاع، لأن جيشها كان مع مروان في الشام الشمالية. وقد كان في المدينة بقايا من بني أمية، وقد أُمر بقتلهم ومصادرة أموالهم، وقد فُتحت قبور الخلفاء وأُحرقت، ولم يبقَ من قبورهم أثرٌ يُذكر. وقد كان في هذا العمل قسوةٌ زائدة عن منطق السياسة، وقد نُعي على العباسيين في المصادر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه الفترة أن قُتل عددٌ كبير من بني أمية في كل الأمصار، وقد كان العباسيون يبحثون عنهم في البيوت والأسفار، وقد نجح بعضهم في الهرب، وكان من أشهرهم عبد الرحمن بن معاوية بن هشام الذي هرب إلى المغرب ثم إلى الأندلس، وأسّس فيها دولةً أموية سنة ثمانٍ وثلاثين ومئة، وهي التي بقيت ثمانية قرون. وقد كان في نجاته قصةً من أعجب قصص التاريخ: أنه عبر الشام وفلسطين ومصر والمغرب، وكان يتخفّى ويتنقل بين القبائل خمس سنوات، ثم بنى دولةً بقيت ثلاثمئة سنة، وقد كان في هذا دليلًا على أن السقوط في مكانٍ ليس سقوطًا في كل مكان.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت نهاية الدولة الأموية في المشرق سريعة إلى حدٍّ يُدهش المؤرخين؛ فقد كانت الدولة قبل عشر سنوات في أوج قوتها، وكانت جيوشها في فرنسا والقوقاز والسند، ثم سقطت في سنتين. والسبب في هذا السرعة أن الدولة كانت قائمة على قبائل، وأن القبائل انقسمت، وأن الناس في الأمصار لم يكونوا يجدون سببًا للدفاع عنها. وقد كان في هذه السرعة درسٌ في علم الاجتماع السياسي: أن الدولة التي لا يشعر الناس بأنها لهم لا تُدافع عنها، وأن الجيوش لا تُقاتل من أجل نظامٍ لا تعرف له معنى، وأن السقوط في هذه الحالة يكون انهيارًا لا معركة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في سقوطها عبرةٌ في معنى الشرعية: فالدولة التي تحكم ثمانين سنة بلا شورى، وتُفرّق بين الناس بالعطاء والنسب، وتُسكت المعارضة بالسيف، تبقى ما بقي السيف، فإذا انكسر السيف من داخله لم يبقَ ما يحميها. وقد كان في هذا ما يُفسّر لماذا لم تُقاوم دمشق مقاومةً كبيرة، ولماذا انضمّ كثير من الناس إلى العباسيين وهم لا يعرفونهم. وقد كان في هذا ما يُفسّر أن العباسيين لم يجدوا مقاومةً شعبية في معظم الأمصار، وأن الناس في كثير من المدن فتحوا الأبواب، وأن بعضهم قاتل إلى جانب العباسيين وهو لا يعرف من هم، لأن كل شيءٍ كان أفضل من البقاء على الحال.\u003c/p\u003e\u003cp class=\"ap\"\u003eلكن الأثر الأموي لم يذهب. فقد بقي المسجد الأموي، وبقيت قبة الصخرة، وبقي النقد، وبقيت الدواوين المعرّبة، وبقيت القصور في البادية، وبقيت اللغة العربية لغة الدولة. وقد كان العباسيون قد أخذوا من الأمويين كل شيء: الإدارة، والبريد، والنقد، والعمارة، وحتى فكرة الملك الوراثي. وقد كان في هذا دليلًا على أن الدولة تُسقط بالسياسة وتبقى بالحضارة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الأندلس أن استمرّ الخط الأموي، وقد صار عبد الرحمن الداخل يُلقّب «صقر قريش»، وقد بنى قرطبة، وأسّس دولةً بقيت قرونًا، وفيها بلغت الحضارة الإسلامية في الغرب ذروتها. ومن هنا يمكن القول إن الأمويين لم يسقطوا كلهم سنة اثنتين وثلاثين، بل سقط فرعهم الشرقي، وبقي فرعهم الغربي يبني حضارةً أخرى. وقد كان في بقاء هذا الفرع ما يُغيّر الحكم على الأمويين في التاريخ: أنهم لم يكونوا دولةً عابرة، بل كانوا خطًّا حضاريًّا استمر في الغرب ثمانية قرون، وأن قرطبة صارت في القرن الرابع الهجري أعظم مدينة في أوروبا.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eمعركة الزاب\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت معركة الزاب في موضعٍ على نهر الزاب الكبير قرب الموصل، وقد جرت في جمادى الآخرة سنة اثنتين وثلاثين ومئة. وقد كان مروان قد جمع جيشًا كبيرًا، لكنه لم يكن متجانسًا، وكان فيه من القيسية واليمانية من يتنازعون، وكان في بعضهم من يتصل بأبي مسلم سرًّا. وقد كان في هذا الاستعداد المسبق ما يُبيّن أن الثورة كانت مُعدّةً بعناية، وأنها كانت تعرف متى تُضرب، وأنها كانت تنتظر لحظة انقسام الجيش الأموي لتضرب، وقد جاءت اللحظة في الزاب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في المعركة أن فرقةً من الجيش انسحبت في بدايتها، ثم تبعها غيرها، فانهار الجيش. وقد كان في هذا دليلًا على أن المعركة لم تُحسم بالعدد ولا بالسلاح، بل بالولاء. وقد قيل إن مروان لمّا رأى الانسحاب قال: «كأنّ القوم قد أُعطوا الأمان»، وكان في كلامه مرارةٌ على من خانه من أهله.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eعبد الرحمن الداخل: بقاء الأمويين في الغرب\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان عبد الرحمن بن معاوية من ولد هشام بن عبد الملك، وكان في العشرين حين سقطت الدولة، وقد هرب من الشام إلى فلسطين ثم إلى مصر ثم إلى المغرب، وقد كان يتنقل بين القبائل البربرية سنوات، ثم عبر إلى الأندلس سنة ثمانٍ وثلاثين ومئة، واستولى على قرطبة. وقد كان في رحلته ما يُشبه الملحمة: أنه مرّ بأماكن لم يكن يعرف فيها أحدًا، وكان يُخفي نسبه خوفًا من القتل، وكان ينتظر فرصةً، وقد وجدها في الأندلس حيث كانت القبائل تتنازع وتحتاج إلى حاكمٍ يجمعها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أسّس فيها دولةً أموية بقيت نحو ثلاثمئة سنة، ثم صارت خلافةً في عهد عبد الرحمن الثالث. وقد كان في هذا أطول بقاءٍ لأسرةٍ حاكمة في تاريخ الإسلام. وقد كان عبد الرحمن قد قال كلمةً تُنسب إليه في وصف حياته: «لم أعرف يومًا سرورًا منذ هربت»، وهذا يُبيّن ثمن النجاة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eما أخذه العباسيون من الأمويين\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يبنِ العباسيون دولةً من الصفر، بل أخذوا بنية الدولة الأموية كما هي: الدواوين، والبريد، والنقد، والخراج، والجيش، والعمارة. وقد أضافوا إليها أشياء جديدة، مثل بيت الحكمة والترجمة والوزارة، لكن الأساس كان أمويًّا. وقد كان في هذا الاحتفاظ بالأجهزة دليلًا على أن البنية الإدارية أقوى من الأسر الحاكمة، وأن من يريد أن يحكم يحتاج إلى موظفين أكثر مما يحتاج إلى جنود، وأن الدولة تُبنى بالقرطاس والقلم أكثر مما تُبنى بالسيف.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا دليلًا على أن الدولة تُقاس بأجهزتها لا بأسماء حكّامها. وقد كان العباسيون أنفسهم يعرفون هذا، ولذلك احتفظوا بالعمال والكتّاب، واستعملوا كثيرًا من موظفي الدولة السابقة، وكان في هذا ما جعل الانتقال سريعًا في الإدارة رغم العنف في السياسة. وقد كان في هذا الانتقال السريع أيضًا خطرٌ على العباسيين: أنهم ورثوا مشاكل الأمويين نفسها، من العصبية إلى الخراج إلى الموالي، ولم يحلّوها، بل أعادوا إنتاجها في شكلٍ جديد، وهذا ما جعل دولتهم تسقط بعد خمسة قرون بالطريقة نفسها.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الف
