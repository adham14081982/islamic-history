 وقتٌ ليُوحّد صفوف النبلاء ولا ليستعدّ لحربٍ خارجية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في المجتمع القوطي انقسامٌ ديني حادّ: الكنيسة الكاثوليكية كانت تضطهد الآريين، وكان اليهود يُجبرون على التنصّر أو يُهجَّرون. وقد كان في المدن أساقفةٌ يملكون الأرض والسلطة، وكان الفلاحون يعملون في شبه عبودية. فلم تكن المملكة جسدًا واحدًا يستطيع أن يقاوم.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالصلح والعنوة: كيف أُديرت البلاد؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eقسّم الفقهاء البلاد المفتوحة إلى قسمين: ما فُتح عنوةً فيصير أرضًا للمسلمين ويُخمَّس، وما صُولح عليه أهله فيبقى لهم ويُضرب عليهم الخراج والجزية. وقد وُجد في الأندلس النوعان معًا، وهذا جعل النظام المالي فيها مرنًا، وجعل المسلمين يحكمون مدنًا كثيرةً بأقلّ عددٍ من الجنود.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أبقى المسلمون على كثيرٍ من النظم الإدارية القوطية، وعلى اللغة اللاتينية في بعض الدواوين في البداية، ثم عُرّبت في عهد عبد الرحمن الداخل. وقد بقي في البلاد أساقفةٌ ونبلاءٌ يدفعون الجزية ويحكمون مناطقهم، وكان هذا هو الأساس الذي جعل المجتمع الأندلسي مجتمعًا متعدد الطوائف لا مجتمعًا واحدًا.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eثغور الشمال والخطأ الاستراتيجي\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يهتم الفاتحون بالجبال الشمالية اهتمامهم بالمدن الجنوبية؛ لأنها كانت فقيرةً قليلة السكان، وكانت الغنائم في الجنوب. وقد كانت هذه الجبال هي الملجأ الذي انسحبت إليه فلول القوط، ومنه بدأت مملكة أستورياس سنة سبعمائة وثمانية عشر ميلادية، أي بعد ست سنوات فقط من الفتح.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ظلّت هذه الجيوب تُهدّد الأندلس ثمانية قرون، وكانت الدولة تُرسل إليها حملاتٌ صيفية كل عام تُسمّى «الصوائف»، وتُبنى الثغور والحصون لصدّها. وقد صار هذا الخطّ الجبلي هو الحدّ الذي سيتقدّم ويتراجع عليه التاريخ الأندلسي كله، حتى ينتهي بسقوط غرناطة سنة تسعمائة واثنتين وتسعين هجرية.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسنة العبور\u003c/b\u003e\u003cspan\u003e٩٢هـ، في رجب، على يد طارق بن زياد من سبتة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمعركة لكة\u003c/b\u003e\u003cspan\u003eفي رمضان ٩٢هـ، وفيها هُزم جيش لذريق ومات الملك.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eجبل طارق\u003c/b\u003e\u003cspan\u003eسُمّي باسم طارق بن زياد، وهو نقطة العبور الأولى.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eحجم الجيش\u003c/b\u003e\u003cspan\u003eنحو ٢٤ ألف مقاتل في أكثر الروايات، أغلبه من البربر.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمملكة أستورياس\u003c/b\u003e\u003cspan\u003eقامت سنة ٧١٨م في الشمال، وكانت بداية حركة الاستعادة.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالنتيجة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e٩٢هـ\u003c/td\u003e\u003ctd\u003eعبور طارق ومعركة لكة\u003c/td\u003e\u003ctd\u003eانهيار مملكة القوط ودخول طليطلة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٩٣هـ\u003c/td\u003e\u003ctd\u003eعبور موسى بن نصير\u003c/td\u003e\u003ctd\u003eاستكمال فتح المدن الغربية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٩٥هـ\u003c/td\u003e\u003ctd\u003eرجوع موسى إلى دمشق\u003c/td\u003e\u003ctd\u003eتثبيت الحاميات وتنظيم الولاية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٩٨هـ\u003c/td\u003e\u003ctd\u003eعبد العزيز بن موسى واليًا\u003c/td\u003e\u003ctd\u003eأول تنظيم إداري للأندلس\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٠٧هـ\u003c/td\u003e\u003ctd\u003eقيام الدولة الأموية في قرطبة\u003c/td\u003e\u003ctd\u003eانفصال الأندلس عن دمشق\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eأيها الناس، أين المفرّ؟ البحر من ورائكم والعدوّ أمامكم.\u003c/p\u003e\u003ccite\u003eخطبة تُنسب إلى طارق بن زياد عند نزوله بالأندلس\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eكان فتح الأندلس أسرع فتحٍ في تاريخ الإسلام، ونجح لأن مملكة القوط كانت منقسمةً من الداخل، ولأن المسلمين استعملوا الصلح أكثر من الحرب. لكنه ترك ثغرةً في الشمال لم تُسدّ، فكانت تلك الثغرة هي التي أعادت الأندلس إلى أوروبا بعد ثمانية قرون.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"caucasus","n":"جبهة الشرق: ما وراء النهر والقوقاز","ic":"🏔️","part":"القسم الثاني: التوسع إلى الأطراف","h":"\u003carticle class=\"ch3\" id=\"caucasus\" data-toc=\"جبهة الشرق: ما وراء النهر والقوقاز\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٢.٣\u003c/span\u003e\n          \u003ch3\u003e🏔️ جبهة الشرق: ما وراء النهر والقوقاز\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي الشرق لم تكن الجبهة أقلّ ضراوة؛ فقد كان على المسلمين أن يواجهوا ثلاث قوى في وقتٍ واحد: الترك في ما وراء النهر، والخزر في القوقاز، والروم في آسيا الصغرى. وقد كان فتح الشرق أبطأ من فتح الغرب، لكنه كان أعمق أثرًا؛ لأن مدنه صارت مراكز علمٍ كبرى كبخارى وسمرقند ومرو.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eبدأ فتح خراسان في خلافة عثمان، ثم توقّف في الفتنة، ثم استُؤنف في عهد معاوية على يد زياد بن أبيه والحكم بن عمرو الغفاري. وقد كانت خراسان ولايةً واسعةً تشمل خراسان اليوم وأجزاءً من أفغانستان، وكانت مدنها الكبرى مرو ونيسابور وهراة وبلخ. وقد كان أهلها من الفرس والترك، وكانت فيها دياناتٌ متعددة: الزرادشتية والبوذية والمسيحية، وكانت مركزًا للتجارة بين الصين والهند والغرب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سنة خمسٍ وستين عيّن عبد الملك بن مروان قتيبة بن مسلم الباهلي واليًا على خراسان، وكان شابًّا في العشرين من عمره، فبدأ سلسلةً من الحملات لم تتوقف حتى بلغت حدود الصين. ففتح بيكند سنة سبعٍ وستين، ثم بخارى سنة تسعين، ثم سمرقند سنة ثلاثٍ وتسعين، ثم خجندة، ثم بلغ كاشغر. وقد كان فتحه منهجيًّا: يفتح مدينة، ثم يُثبّت حامية، ثم يُصالح أهلها على خراج، ثم ينتقل إلى التالية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في فتح سمرقند حادثةٌ تُبيّن أسلوب قتيبة: فقد دخل المدينة صلحًا مع أهلها، ثم نقضوا الصلح، فدخلها عنوةً، ثم بنى فيها مسجدًا جامعًا وأمر الناس بالصلاة فيه، ووضع ديوانًا للخراج. وقد روى المؤرخون أنه كان يستعمل مع أهل البلاد سياسةً من نوعٍ خاص: يُقرّ الأشراف في مناصبهم، ويُجنّد أهل البلاد في جيشه، ويُعطي العلماء والمترجمين مكانةً. وقد كان هذا هو السبيل الوحيد لحكم أرضٍ بعيدة بهذا الحجم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي القوقاز كانت الجبهة مختلفة؛ فقد كان المسلمون يواجهون الخزر، وهم شعبٌ تركي كبير في شمال القوقاز، وكانت لهم دولةٌ قوية في حوض الفولغا. وقد دخل المسلمون إلى أرمينيا وأذربيجان في خلافة عثمان، ثم صارت هذه المنطقة ساحة صراعٍ دائم بين المسلمين والخزر والروم. وقد بلغت الحملات الإسلامية في عهد مروان بن محمد — آخر خلفاء بني أمية — إلى نهر الفولغا، وأُسر فيها من الخزر عددٌ كبير.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان لفتح ما وراء النهر أثرٌ حضاري أكبر من أثره العسكري. فقد انتقلت إلى تلك البلاد اللغة العربية، وصارت بخارى وسمرقند مركزين للحديث والفقه، ثم صارتا في القرن الثالث والرابع مركزين للرياضيات والفلك والطب. ومن تلك البلاد خرج البخاري ومسلم والترمذي، وخرج الخوارزمي والفارابي وابن سينا. وقد كان هذا الثمر العلمي هو النتيجة الحقيقية للفتح، لا الخراج ولا الغنائم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في جبهة الشرق درسٌ سياسي مهم: أن الفتح الذي يبقى هو الذي يُبنى فيه مسجدٌ وديوانٌ ومدرسة، لا الذي يُكتفى فيه بالغنيمة. وقد تعلّم المسلمون هذا الدرس في خراسان، ونسوه في بعض الجبهات الأخرى، فكان الفتح في خراسان باقيًا، وكان في غيرها عابرًا. وقد صارت خراسان نفسها بعد ذلك مركز الثورة العباسية التي أسقطت الدولة الأموية؛ لأن أهلها كانوا قد دخلوا الإسلام ولكنهم لم يدخلوا في طبقة العرب المسيطرة على الدولة.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eقتيبة بن مسلم: الفتح المنهجي\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان قتيبة بن مسلم من أشهر قادة الفتح في الشرق، وقد جمع بين الشجاعة والتنظيم. وقد كان يخطط للحملة الواحدة سنوات، ويبني الطرق ويحفر الآبار قبل أن يتقدّم، ويُرسل السرايا لتستطلع الأرض والسكان. وقد كان يفتح في الصيف ويُقيم في الشتاء، ويعود في العام التالي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بلغ في سنة ستٍّ وتسعين إلى كاشغر على حدود الصين، وأرسل رسالةً إلى ملك الصين يطلب منه أن يبعث من يُعلّمه الإسلام أو يدفع الجزية، فردّ الملك بمالٍ وهدايا. وقد كانت هذه أقصى نقطةٍ بلغها الفتح الإسلامي شرقًا، وهي التي تُبيّن أن الدولة الأموية كانت أوسع دولةٍ في العالم في ذلك الزمان.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالخزر وجبهة القوقاز\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الخزر دولةً قوية في شمال القوقاز، وقد خاضوا مع المسلمين حروبًا طويلة، وكانت لهم غزواتٌ إلى أذربيجان وأرمينيا. وقد بلغ الأمر أنهم هاجموا الموصل سنة ثلاثٍ وثلاثين ومئة، في آخر أيام الدولة الأموية، فاضطر مروان بن محمد إلى أن يزحف إليهم بنفسه في حملةٍ كبيرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت هذه الجبهة هي التي أوقفت التوسع شمالًا، كما أوقفت جبهة الفرنجة التوسع غربًا في بلاط الشهداء. ومن هنا يمكن القول إن الدولة الأموية بلغت حدودها الطبيعية في الشرق والشمال والغرب، وأن ما بقي بعد ذلك كان دفاعًا لا فتحًا. وقد بقي هذا الحدّ ثابتًا قرونًا، ولم يتغيّر إلا في العصر العباسي حين دخل الإسلام إلى بلاد الخزر من طريق التجارة لا من طريق الفتح، وصارت مدينة إتل على الفولغا سوقًا إسلامية كبرى.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eخراسان: من الثغر إلى مركز الثورة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت خراسان في العهد الأموي ولايةً كبيرة، فيها جيشٌ عربي من قبائل اليمن ومضر، وفيها موالٍ من الفرس دخلوا الإسلام وشاركوا في الفتوح، لكنهم لم يحصلوا على العطاء نفسه الذي يحصل عليه العرب. وقد كانت هذه التفرقة هي الشرارة التي أشعلت حركات كثيرة، منها حركة أبي مسلم الخراساني.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان العباسيون أذكى من الأمويين في هذا الباب؛ فقد خاطبوا أهل خراسان بوصفهم مسلمين متساوين، وشعارهم «الرضا من آل محمد»، فالتفّ حولهم الفرس والعرب والموالي. وقد أسقطت خراسان الدولة الأموية، وأصبحت بعد ذلك قاعدةً للدولة العباسية في الشرق. وقد كان هذا التحوّل في خطاب الدولة من «العرب الفاتحين» إلى «المسلمين المتساوين» هو ما جعل الثورة العباسية تنجح حيث فشلت ثورات العلويين والخوارج من قبل، لأنها لم تكن ثورةً على الدولة فقط بل كانت مشروعًا لتغيير قواعدها.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eقتيبة بن مسلم\u003c/b\u003e\u003cspan\u003eوالي خراسان من ٨٦هـ إلى ٩٦هـ، وبلغ فتحه حدود الصين.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسمرقند\u003c/b\u003e\u003cspan\u003eفُتحت سنة ٩٣هـ، وصارت من أعظم مدن العلم في الإسلام.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eكاشغر\u003c/b\u003e\u003cspan\u003eأقصى نقطة بلغها الفتح الإسلامي شرقًا سنة ٩٦هـ.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالخزر\u003c/b\u003e\u003cspan\u003eدولة تركية في شمال القوقاز، أوقفت التوسع شمالًا.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأثر خراسان\u003c/b\u003e\u003cspan\u003eمنها خرج البخاري ومسلم والترمذي، ومنها بدأت الثورة العباسية.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمنطقة\u003c/th\u003e\u003cth\u003eالقوة المقابلة\u003c/th\u003e\u003cth\u003eالنتيجة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eما وراء النهر\u003c/td\u003e\u003ctd\u003eالترك والسغد\u003c/td\u003e\u003ctd\u003eفتحٌ باقٍ ومدنٌ علمية كبرى\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eخراسان\u003c/td\u003e\u003ctd\u003eالفرس والهياطلة\u003c/td\u003e\u003ctd\u003eولايةٌ إسلامية واسعة ومركز ثورة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالقوقاز\u003c/td\u003e\u003ctd\u003eالخزر\u003c/td\u003e\u003ctd\u003eحدٌّ شمالي ثابت لم يتجاوزه الفتح\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eآسيا الصغرى\u003c/td\u003e\u003ctd\u003eالروم\u003c/td\u003e\u003ctd\u003eحدٌّ متبادل مع صوائف وغزوات\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالسند\u003c/td\u003e\u003ctd\u003eممالك الهند\u003c/td\u003e\u003ctd\u003eفتحٌ في عهد محمد بن القاسم\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eما وراء النهر أرضٌ لا يُفتح إلا بالعدل، فإن ظلمت أهلها خرجت من يدك.\u003c/p\u003e\u003ccite\u003eمعنى ما رُوي عن ولاة خراسان في سياسة البلاد المفتوحة\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eكان فتح الشرق أبطأ من فتح الغرب، لكنه كان أعمق أثرًا. فبخارى وسمرقند لم تكونا غنيمةً بل مصنعًا للعلم، وخراسان لم تكن ثغرًا بل بوابةً دخل منها الإسلام إلى تركستان والهند. لكن التفرقة بين العرب والموالي فيها هي التي أشعلت الثورة التي أسقطت الدولة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"navy","n":"الأسطول الإسلامي والبحر","ic":"⛵","part":"القسم الثاني: التوسع إلى الأطراف","h":"\u003carticle class=\"ch3\" id=\"navy\" data-toc=\"الأسطول الإسلامي والبحر\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٢.٤\u003c/span\u003e\n          \u003ch3\u003e⛵ الأسطول الإسلامي والبحر\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eك\u003c/span\u003eان العرب قبل الإسلام قومًا لا يعرفون البحر؛ كانوا تجار برٍّ وركّاب قوافل، وكان البحر عندهم خطرًا لا طريقًا. وفي أقلّ من خمسين سنة صار لهم أسطولٌ في المتوسط يضرب سواحل الروم، ويحاصر عاصمتهم مرتين، وينقل الجيوش إلى قبرص ورودس وكريت والأندلس. وهذه واحدة من أعجب التحولات في التاريخ العسكري.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eبدأ التفكير في الأسطول في خلافة عمر بن الخطاب، حين طلب معاوية بن أبي سفيان أن يُغزو البحر، فكتب إليه عمر: «لا تُحمّلنّ مسلمًا على البحر؛ فإن البحر عظيمٌ خطره، قليلٌ غنمه»، فردّه. لكن معاوية لم ييأس؛ فكان يكتب إليه في كل عام، حتى كتب عمر إلى عمرو بن العاص يسأله عن البحر، فكتب إليه عمرو وصفًا طويلًا قال فيه: «إن البحر خلقٌ عظيم يركبه خلقٌ صغير، دودٌ على عود». فلم يأذن عمر.\u003c/p\u003e\u003cp class=\"ap\"\u003eولمّا ولي عثمان بن عفان أذن لمعاوية في غزو البحر بشرط أن لا يُحمّل أحدًا إلا برضاه، فبنى معاوية أسطولًا في عكّا وصور، وخرج أول غزوٍ بحري في الإسلام سنة ثمانٍ وعشرين إلى قبرص. وقد كان في هذه الحملة أبو ذر الغفاري وأبو الدرداء وعبادة بن الصامت، ومعه زوجته أم حرام بنت ملحان، وقد سقطت عن دابتها فماتت في قبرص، وقبرها هناك معروف. وقد صالح أهل قبرص على جزية، وكان هذا أول صلحٍ بحري في الإسلام.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي عهد معاوية بن أبي سفيان تطوّر الأسطول تطوّرًا كبيرًا. فقد بنى دار صناعة في عكّا وتونس، واستقدم بحّارة من الروم والقبط، وأدخل نظام «الشيني» أي المعسكر البحري، وأصبحت السفن تُبنى على نمطٍ موحّد. وفي سنة أربعٍ وخمسين أرسل حملةً بحرية كبيرة إلى القسطنطينية بقيادة ابنه يزيد، وفيها كان أبو أيوب الأنصاري الذي مات هناك ودُفن عند سور المدينة، وقبره معروف إلى اليوم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد استمرّ حصار القسطنطينية سنوات، وكان الشتاء قاسيًا على المسلمين، وكان الروم يستعملون النار الإغريقية — وهي مادة حارقة تُطلق من أنابيب نحاسية — فحرقت كثيرًا من السفن. وقد انتهى الحصار بفشلٍ وتكبد المسلمين خسائر كبيرة، وقد كان هذا الفشل درسًا في حدود القوة البحرية في ذلك الزمان؛ فقد كان المسلمون يملكون سفنًا ولكنهم لم يملكوا خبرةً في الحصار الطويل وفي مواجهة الأسلحة الحارقة.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم بقي الأسطول قويًّا في عهد عبد الملك والوليد، وكان يُستعمل في نقل الجيوش إلى الأندلس وإلى إفريقية، وكانت تونس القاعدة الأساسية له. وقد كان الأسطول الأموي يهاجم صقلية وسردينية وكورسيكا كل عام تقريبًا، ويضرب سواحل فرنسا وإيطاليا. وقد بلغ من قوّته أن المسلمين سيطروا على غرب المتوسط كله في القرن الأول، وصار البحر الذي كان روميًّا بحرًا إسلاميًّا في معظمه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان للأسطول أثرٌ اقتصادي كبير أيضًا؛ فقد أمنت السفن التجارة بين مصر وإفريقية والأندلس، وصارت الإسكندرية وتونس وقرطبة مرتبطةً بطرقٍ بحرية دائمة. وقد انتقلت من خلال هذه الطرق البضائع والأفكار والكتب، ودخلت المنتجات الشرقية إلى أوروبا عن طريق الأندلس وصقلية. ومن هنا يمكن القول إن الأسطول لم يكن أداة حربٍ فقط، بل كان أداة بناء اقتصادٍ وحضارة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في البحر أيضًا عاملٌ ثالث لم يُلتفت إليه كثيرًا: أنه فتح باب الهجرة. فقد انتقل إلى سواحل الشام وإفريقية والأندلس أعدادٌ كبيرة من العرب والموالي، وأسّسوا مدنًا ساحلية جديدة، وصاروا تجارًا وبحّارة. وقد كان هؤلاء هم الذين حملوا الإسلام إلى جزر المتوسط، وإليهم يرجع الفضل في أن صقلية وكريت وقبرص عرفت العربية قبل أن تعرفها أوروبا.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eلماذا تردّد عمر؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان تردّد عمر بن الخطاب في غزو البحر مبنيًّا على تقدير المصلحة لا على خوفٍ من المجهول. فقد كان يرى أن المسلمين قومٌ لا يعرفون الملاحة، وأن البحر لا يُؤمن فيه على نفسٍ ولا مال، وأن الغنائم التي تُحصّل من البحر قليلةٌ بالنسبة إلى الخطر. وقد كان في هذا التقدير صوابٌ في وقته.\u003c/p\u003e\u003cp class=\"ap\"\u003eلكن تغيّر الحال بعد ذلك: فقد اتسعت الدولة، وصار في يدها سواحل طويلة، وصار لها أسرى وعلماء من الروم يعرفون بناء السفن. وقد كان إصرار معاوية على المشروع دليلًا على أن السياسة البحرية تحتاج إلى رؤيةٍ طويلة لا إلى حسابٍ قصير. وقد بقي هذا التردّد في المصادر علامةً على أن قرار البحر كان في الإسلام قرارًا فقهيًّا وسياسيًّا معًا، لا قرارًا عسكريًّا محضًا، وأن كل زيادةٍ في المشروع البحري كانت تحتاج إلى فتوى ومصلحةٍ معًا.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالنار الإغريقية والفشل أمام القسطنطينية\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت النار الإغريقية سلاحًا سريًّا استعمله البيزنطيون لأول مرة في حصار القسطنطينية، وهي مزيجٌ من النفط والكلس والكبريت يُقذف من أنابيب، ويشتعل على الماء. وقد كانت فعّالةً بشكلٍ مرعب في المعارك البحرية، وقد ظلّ سرّها محفوظًا في بيزنطة قرونًا. وقد كان الروم يعتبرون هذا السلاح سرًّا من أسرار الدولة، فحفظوا تركيبته في قصورهم، ولم يعرفها المسلمون إلا بعد قرونٍ طويلة، ولذلك ظلّت السفن الإسلامية عرضةً له في كل معركةٍ بحرية كبرى.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان فشل الحصار درسًا للمسلمين: أن القوة البحرية وحدها لا تكفي لفتح مدينةٍ محصّنة بسورٍ بحري، وأن الحصار يحتاج إلى مؤونةٍ طويلة وإلى سيطرةٍ على البر المحيط. وقد تكرّر هذا الدرس بعد قرون في حصار فيينا، وفي كل حملةٍ حاولت أن تُسقط مدينةً كبيرة من البحر.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eمن الحرب إلى التجارة\u003c/h4\u003e\u003cp class=\"ap\"\u003eبعد أن استقرّ الأسطول صار له دورٌ تجاري كبير. فقد أُمنت الطرق البحرية، ونشأت موانئ جديدة، ودخلت في التجارة الدولية سلعٌ لم تكن تُتداول من قبل مثل السكر والأرز والورق. وقد صارت الإسكندرية وتونس وقرطبة وألمرية مراكز تصديرٍ إلى أوروبا. وقد كان لهذا الأمن البحري أثرٌ مباشر في المدن الساحلية: فقد كبرت صور وعكّا وتونس والإسكندرية، وكثر فيها السكان والتجار، وانتقل إليها من كان يخاف غارات الروم من أهل الداخل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان لهذا أثرٌ في انتقال المعرفة: فالسفن لم تنقل البضائع فقط، بل نقلت الكتب والعلماء والتقنيات. وقد وصلت الأرقام الهندية والورق من الصين إلى الأندلس في هذا العهد، ومنها إلى أوروبا بعد قرون. ومن هنا يتبيّن أن البحر كان جسرًا لا حدًّا. وقد كان انتقال الورق تحديدًا ذا أثرٍ بالغ؛ لأن الورق أرخص من الرقّ، فكثرت الكتب وانتشرت المكتبات، وهذا هو الشرط المادي الأول الذي جعل النهضة العلمية في القرنين الثالث والرابع ممكنة.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأول غزو بحري\u003c/b\u003e\u003cspan\u003eسنة ٢٨هـ إلى قبرص، في خلافة عثمان، بقيادة معاوية.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eدار الصناعة\u003c/b\u003e\u003cspan\u003eأُنشئت في عكّا وتونس لبناء السفن وصيانتها.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eحصار القسطنطينية\u003c/b\u003e\u003cspan\u003eبدأ سنة ٥٤هـ واستمر سنوات، وانتهى بفشل المسلمين.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالنار الإغريقية\u003c/b\u003e\u003cspan\u003eسلاح بحري بيزنطي حارق، كان من أهم أسباب فشل الحصار.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأثر البحر\u003c/b\u003e\u003cspan\u003eنقل الجيوش والبضائع والكتب، وربط الأندلس بالمشرق.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e٢٨هـ\u003c/td\u003e\u003ctd\u003eغزو قبرص\u003c/td\u003e\u003ctd\u003eأول أسطول إسلامي وأول صلحٍ بحري\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٣٤هـ\u003c/td\u003e\u003ctd\u003eغزو صقلية\u003c/td\u003e\u003ctd\u003eبداية الضغط على وسط المتوسط\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٥٤هـ\u003c/td\u003e\u003ctd\u003eحصار القسطنطينية\u003c/td\u003e\u003ctd\u003eفشلٌ كبير وخسائر في السفن\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٧٤هـ\u003c/td\u003e\u003ctd\u003eبناء تونس ودار الصناعة\u003c/td\u003e\u003ctd\u003eقاعدة دائمة لغرب المتوسط\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٩٢هـ\u003c/td\u003e\u003ctd\u003eعبور الأندلس\u003c/td\u003e\u003ctd\u003eاستعمال الأسطول في نقل الجيوش\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eإن البحر خلقٌ عظيم يركبه خلقٌ صغير، دودٌ على عود.\u003c/p\u003e\u003ccite\u003eمن كتاب عمرو بن العاص إلى عمر بن الخطاب في وصف البحر\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eمن قومٍ لا يعرفون البحر إلى أسطولٍ يحاصر عاصمة الروم في خمسين سنة: هذا هو معنى التحول الذي صنعه الأمويون. وقد فشلوا أمام القسطنطينية، لكنهم نجحوا في تحويل المتوسط إلى بحرٍ إسلامي في الغرب، وفي جعل البحر طريقًا للتجارة والعلم لا للحرب فقط.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-3","n":"القسم الثالث: عبد الملك وإعادة بناء الدولة","ic":"","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-3\" style=\"--c:#4B0082\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🪙\u003c/div\u003e\n      \u003ch2\u003eالقسم الثالث: عبد الملك وإعادة بناء الدولة\u003c/h2\u003e\n      \u003cp\u003eبين سنة خمسٍ وستين وستٍّ وثمانين للهجرة أعاد عبد الملك بن مروان بناء الدولة من الداخل: عرّب الدواوين، وضرب النقد، وأصلح البريد، وبَنى القبة، ووحّد الأمصار تحت إدارةٍ واحدة. وقد كان هذا العقد هو الذي جعل الدولة الأموية تدوم سبعين سنة أخرى، لأنها لم تبقَ دولة جيشٍ فقط بل صارت دولة مؤسسات.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#arabization\"\u003eتعريب الديوان\u003c/a\u003e\u003ca href=\"#coinage\"\u003eالدينار الإسلامي\u003c/a\u003e\u003ca href=\"#hajjaj\"\u003eالحجاج والعراق\u003c/a\u003e\u003ca href=\"#dome\"\u003eقبة الصخرة والمسجد الأموي\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"arabization","n":"تعريب الديوان","ic":"📜","part":"القسم الثالث: عبد الملك وإعادة بناء الدولة","h":"\u003carticle class=\"ch3\" id=\"arabization\" data-toc=\"تعريب الديوان\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٣.١\u003c/span\u003e\n          \u003ch3\u003e📜 تعريب الديوان\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eك\u003c/span\u003eانت الدولة الإسلامية في أول أمرها تُدار بلغات الأمم التي فتحتها: اليونانية في الشام، والفارسية في العراق وخراسان، والقبطية في مصر. ثم قرّر عبد الملك أن تكون العربية لغة الديوان في كل الأمصار، وكان هذا القرار أحد أهم القرارات في تاريخ الإسلام الثقافي.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان ديوان الخراج في الشام يُكتب باليونانية، وفي العراق بالفارسية، وكان الموظفون فيه من الروم والفرس الذين أسلموا أو لم يُسلموا. وقد كان هذا يعني أن حساب الدولة وأموالها بيد طبقةٍ لا تعرف العربية، وأن الوالي العربي كان يعتمد على مترجمٍ في كل معاملة. وقد كان في هذا خطرٌ مزدوج: خطرٌ سياسي في أن يكون الجهاز المالي في يد من لا يخضع للثقافة الحاكمة، وخطرٌ عملي في أن الأخطاء والتزوير كانا ممكنين بسهولة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بدأ التعريب في العراق أولًا على يد الحجاج بن يوسف الثقفي، حين أمر كاتبه زاذان فروخ أن يكتب بالعربية، وقيل إنه قال: «إني أرى الفارسية لا تزيد على أن تكون خُراءةً». ثم أمر صالح بن عبد الرحمن، وكان على ديوان الخراج، أن ينقل الديوان إلى العربية، وكان يعرف الفارسية فترجم الحسابات كلها. وقد كان هذا العمل شاقًّا؛ لأن المصطلحات المالية الفارسية لم يكن لها مقابلٌ عربي، فاضطرّ الكتّاب إلى أن يضعوا مصطلحاتٍ جديدة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي الشام أمر عبد الملك بن مروان بتعريب الديوان سنة إحدى وثمانين، وكان على ديوانه سليمان بن سعد الخشني، وقد كان يعرف اليونانية، فنقل الديوان من اليونانية إلى العربية في سنةٍ واحدة. وقد رُوي أن الروم الذين كانوا يعملون في الديوان غضبوا وخرجوا، وأن بعضهم حاول أن يُفسد الحساب فلم يستطع. وفي مصر عُرّب الديوان سنة سبعٍ وثمانين على يد عبد الله بن عبد الملك بن مروان، وكان ديوانها يُكتب بالقبطية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان لهذا القرار نتائج بعيدة المدى. فأولًا: صارت العربية لغةَ الدولة، وهذا يعني أن كل من يريد وظيفةً أو مكانةً عليه أن يتعلّمها، فدخل فيها أهل الأمصار من الفرس والقبط والروم، وصارت لغةً مشتركةً بين طبقاتٍ مختلفة. وثانيًا: احتاجت العربية إلى قواعدَ تُضبط بها الأرقام والحسابات، فازدهر النحو، ووُضعت علامات الإعراب والنقط، ونُقط المصحف، وكُتبت أولى الرسائل في النحو للفرس الذين يتعلّمون العربية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوثالثًا: إن تعريب الديوان خلق طبقةً جديدة من الكتّاب، وهم «أهل القلم» الذين صاروا عمود الدولة. وقد كان هؤلاء في الغالب من الموالي، وكانت لهم مكانةٌ أعلى من مكانة الجند أحيانًا، لأنهم كانوا يعرفون الحساب والكتابة والقانون. وقد ظهر هذا في العصر العباسي حين صار كتّاب الفرس والدهقان هم من يُدير الدولة فعلًا، وصار الخليفة يعتمد عليهم أكثر من اعتماده على قوّاده.\u003c/p\u003e\u003cp class=\"ap\"\u003eورابعًا: إن التعريب لم يكن مجرّد تغيير لغة، بل كان نقلًا لمفاهيم. فمصطلحات الخراج والجزية والعطاء والفيء أُعيدت صياغتها بالعربية، وأُدخلت مفاهيم إسلامية في نظامٍ كان في أصله بيزنطيًّا أو ساسانيًّا. وقد كان هذا هو الطريق الذي تحوّلت به المؤسسات القديمة إلى مؤسسات إسلامية، لا بالهدم بل بالترجمة والتعديل. وقد كان هؤلاء الكتّاب يُمثّلون طبقةً اجتماعية جديدة لم تكن معروفة في الجاهلية ولا في صدر الإسلام؛ طبقةً تعتمد على العلم لا على النسب، وهذا ما جعل الموالي يدخلون في الدولة من باب القلم بعد أن أُغلق عليهم باب الإمارة والقيادة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان من ثمرات هذا العهد أيضًا أن ظهرت الحاجة إلى «علم الحساب» بالمعنى العملي: فمساحة الأرض، وحساب الخراج، وتقسيم المواريث، وتقدير الديات، كلها تحتاج إلى حسابٍ دقيق. وقد كان في هذا ما مهّد لظهور علمٍ عربي في الحساب والجبر بعد قرنٍ من الزمان، حين بدأ نقل كتب اليونان والهند، فوجدت العربية لغةً قادرةً على استيعابها. وقد كان هذا النقل للمفاهيم أخطر ما في التعريب؛ لأن الكلمة ليست وعاءً محايدًا، بل تحمل معها تصورًا. فحين صار «الخراج» و«الجزية» و«العطاء» و«الفيء» مصطلحاتٍ عربيةً إسلامية، صار من الممكن أن تُفهم وتُناقش وتُنقد بالقرآن والحديث، وهذا لم يكن ممكنًا حين كانت الحسابات تُكتب بلغةٍ أجنبية.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eزاذان فروخ وصالح بن عبد الرحمن\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان زاذان فروخ من كتّاب الفرس الذين عملوا في ديوان العراق، وقد أسلم وحسن إسلامه، وكان يعرف العربية والفارسية معًا. وقد بدأ بنفسه يكتب بالعربية، ثم أمره الحجاج أن يجعل الديوان كله عربيًّا، فاستعان بصالح بن عبد الرحمن. وقد كان زاذان من الطبقة التي دخلت الإسلام حديثًا، ولكنه صار من أعمدة الدولة، وهذا يُبيّن أن التعريب لم يكن حركةً قومية ضد الفرس، بل كان عمليةً حضارية دخل فيها الفرس أنفسهم، وكانوا من أهم من نفّذها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان صالح بن عبد الرحمن أخًا للحجاج من الرضاعة، وكان على ديوان الخراج، وقد نقل الحسابات من الفارسية إلى العربية في مدةٍ قصيرة. ويُروى أن الحجاج سأله عن عمله فقال: «أطبقتُ الديوان بالعربية»، أي أُغلق على الفارسية، فصارت هذه الكلمة تعبيرًا عن التعريب في المصادر.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالأثر في اللغة العربية\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يكن تعريب الديوان حدثًا إداريًّا فقط، بل كان حدثًا لغويًّا كبيرًا. فقد دخلت في العربية مئات الكلمات من الفارسية واليونانية والقبطية، ودخلت صيغٌ جديدة للتعبير عن المفاهيم المالية والإدارية، وصارت العربية قادرةً على أن تُعبّر عن مصطلحاتٍ لم تكن تعرفها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان لهذا أثرٌ في النثر العربي أيضًا: فقد نشأت «الكتابة الديوانية» بأسلوبها الخاص، وصار للكتّاب ذوقٌ في السجع والإيجاز، وظهرت الرسائل الرسمية والعقود والصكوك. وهذا كله كان أساسًا للنثر العربي في العصر العباسي، حيث بلغت الكتابة الديوانية ذروتها على يد ابن المقفع وعبد الحميد الكاتب.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eلماذا تأخّر التعريب ثلاثين سنة؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يُعرّب الديوان في عهد معاوية مع أنه كان يعرف أهمية ذلك، والسبب أن التعريب كان يحتاج إلى جيلٍ من الكتّاب يعرفون العربية والحساب معًا، ولم يكن هذا الجيل موجودًا بعد. وقد كان معاوية يفضّل الاستقرار على الإصلاح، وكان يخشى أن يُفسد الديوان إذا نقله إلى أيدٍ غير خبيرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان عبد الملك في وضعٍ مختلف: فقد خرج من فتنةٍ طويلة، وكان يريد أن يبني دولةً لها هويةٌ واضحة، فكان التعريب عنده جزءًا من مشروع سياسي، لا مجرّد إصلاح إداري. ومن هنا يتبيّن أن الإصلاحات الكبرى تحتاج إلى لحظةٍ سياسية تسمح بها، لا إلى قرارٍ صحيح فقط.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسنة التعريب في الشام\u003c/b\u003e\u003cspan\u003e٨١هـ، على يد سليمان بن سعد الخشني.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسنة التعريب في مصر\u003c/b\u003e\u003cspan\u003e٨٧هـ، على يد عبد الله بن عبد الملك.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأول من عرّب العراق\u003c/b\u003e\u003cspan\u003eالحجاج بن يوسف، بمساعدة زاذان فروخ وصالح بن عبد الرحمن.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eاللغات قبل التعريب\u003c/b\u003e\u003cspan\u003eاليونانية في الشام، والفارسية في العراق، والقبطية في مصر.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأثر القرار\u003c/b\u003e\u003cspan\u003eصارت العربية لغة الدولة والعلم، ونشأت طبقة الكتّاب.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالإقليم\u003c/th\u003e\u003cth\u003eلغة الديوان قبله\u003c/th\u003e\u003cth\u003eسنة التعريب\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالعراق\u003c/td\u003e\u003ctd\u003eالفارسية\u003c/td\u003e\u003ctd\u003eفي عهد الحجاج، نحو ٧٨هـ\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالشام\u003c/td\u003e\u003ctd\u003eاليونانية\u003c/td\u003e\u003ctd\u003e٨١هـ\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eمصر\u003c/td\u003e\u003ctd\u003eالقبطية\u003c/td\u003e\u003ctd\u003e٨٧هـ\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eخراسان\u003c/td\u003e\u003ctd\u003eالفارسية\u003c/td\u003e\u003ctd\u003eتبع العراق في التعريب\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eإفريقية\u003c/td\u003e\u003ctd\u003eاليونانية واللاتينية\u003c/td\u003e\u003ctd\u003eتبع الشام في التعريب\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eأطبقتُ الديوان بالعربية.\u003c/p\u003e\u003ccite\u003eقول صالح بن عبد الرحمن في تعريب ديوان العراق\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eكان تعريب الديوان قرارًا إداريًّا في ظاهره، لكنه كان في العمق قرارًا ثقافيًّا: أنهى اعتماد الدولة على موظفين أجانب، وخلق طبقة كتّاب عربية، ودفع اللغة إلى أن تصير لغة حسابٍ وقانون، وهو الشرط الأول لقيام نهضةٍ علمية بعد قرن.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"coinage","n":"الدينار الإسلامي","ic":"🪙","part":"القسم الثالث: عبد الملك وإعادة بناء الدولة","h":"\u003carticle class=\"ch3\" id=\"coinage\" data-toc=\"الدينار الإسلامي\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٣.٢\u003c/span\u003e\n          \u003ch3\u003e🪙 الدينار الإسلامي\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eك\u003c/span\u003eان المسلمون في أول أمرهم يتعاملون بنقود الروم والفرس: الدينار الذهبي البيزنطي، والدرهم الفضي الساساني. ثم قرّر عبد الملك سنة سبعٍ وسبعين أن يُضرب نقدٌ إسلامي خالص، عليه كلمة التوحيد واسم الله واسم الخليفة، بلا صورةٍ ولا شعارٍ أجنبي. وكان هذا القرار إعلانًا اقتصاديًّا وسياسيًّا في وقتٍ واحد.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكانت النقود في صدر الإسلام على حالها قبل الفتح: دنانير ذهبية بيزنطية عليها صورة هرقل وأبنائه، ودراهم فضية ساسانية عليها صورة كسرى ونار المجوس. وقد كان المسلمون يتعاملون بها كما هي، وربما كتبوا عليها كلماتٍ عربية بسيطة مثل «بسم الله» أو «محمد رسول الله» في بعض المسكوكات. وقد كان هذا يعني أن الدولة الإسلامية لم تكن تملك سيادةً نقدية كاملة، وأن اقتصادها كان تابعًا لمعايير الروم والفرس.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت هناك مشكلةٌ عملية كبيرة: أن الدنانير البيزنطية كانت تُضرب في القسطنطينية، وكان ملك الروم يهدّد المسلمين بأن يكتب على الدنانير سبًّا للنبيّ إذا كتب المسلمون عليها ما لا يرضيه. وقد رُوي أن عبد الملك أراد أن يكتب على النقود شيئًا، فبلغ ذلك ملك الروم فهدّده بأن يكتب على دنانيره سبًّا للنبيّ، فاستشار عبد الملك أهل الرأي، فأشار عليه بعضهم بأن يضرب نقدًا إسلاميًّا خالصًا لا يعتمد على الروم في شيء.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سنة سبعٍ وسبعين ضُرب أول دينارٍ عربي خالص، وعليه من جهة: «لا إله إلا الله وحده لا شريك له»، ومن جهة: «الله أحد الله الصمد لم يلد ولم يولد»، وفي الإطار: «ضرب هذا الدينار سنة سبعٍ وسبعين». وفي سنة ثمانٍ وسبعين ضُرب الدرهم على النمط الساساني مع تعديلات، ثم في سنة تسعٍ وسبعين ضُرب الدرهم الإسلامي الخالص. وقد كان وزن الدينار سبعة عشر قيراطًا من الذهب، ووزن الدرهم سبعة أعشار المثقال، وهي أوزانٌ بقيت معتمدة قرونًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان لهذا القرار أثرٌ اقتصادي هائل. فقد صار للدولة الإسلامية نقدٌ موحّد يُعتمد عليه في كل الأمصار، من خراسان إلى الأندلس، وكان وزنه ثابتًا لا يتغيّر، وهذا جعل التجارة الدولية أسهل وأأمن. وقد رُوي أن الدينار العربي ظلّ معيارًا في أوروبا قرونًا، وأن بعض المدن الأوروبية كانت تضرب نقودًا على غراره، وأن اسم «دينار» بقي في لغات كثيرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في النقد أيضًا بيانٌ سياسي: فقد كان الدينار البيزنطي يحمل صورة الإمبراطور، والدرهم الساساني يحمل صورة كسرى، فكان التعامل بهما إقرارًا بسلطةٍ أجنبية. أما النقد الإسلامي فلم يحمل صورةً، بل حمل كلامًا، وكان هذا تعبيرًا عن عقيدةٍ تقول إن الحكم لله لا لصورة إنسان. وقد كان اختيار الزخرفة والكتابة بدل التصوير قرارًا فقهيًّا وثقافيًّا معًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان النقد أداةً لضبط الاقتصاد أيضًا. فالدولة كانت تُشرف على دار الضرب، وتُعاقب من يقطع النقود أو يُزوّرها، وكانت تفرض أن يُتعامل بالدينار والدرهم الرسميين في الخراج والجزية والعطاء. وقد أدّى هذا إلى توحيد المقاييس والأوزان في الأمصار، وهو شرطٌ أساسي لأي اقتصادٍ كبير. وقد كان لهذا الضبط أثرٌ في العلاقة بين الدولة والفلاحين؛ فقد كان الفلاح يعرف مقدار ما عليه بالدينار والدرهم لا بالمقاييس المحلية، وهذا قلّل النزاع بين الجباة وأهل الأرض، وجعل الخراج أسهل تحصيلًا وأقلّ ظلمًا في كثير من الأحيان.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ظلّ النقد الأموي أساسًا للنقد العباسي بعده؛ فقد ضرب العباسيون دنانيرهم ودراهمهم على الوزن نفسه، وأضافوا أسماء خلفائهم وولاتهم، ثم صار على النقود ذكر الوزير أحيانًا. وقد صارت هذه النقود وثائق تاريخية مهمة؛ لأنها تحمل أسماء الخلفاء والولاة وسنوات الضرب ومواضعها، وهي أدقّ من كثيرٍ من الروايات في تأريخ الأحداث. وقد كانت النقود أيضًا أداة دعاية سياسية؛ فالخليفة الذي يُكتب اسمه على النقد يُعلن سيادته على الاقتصاد، ومن أراد أن يُنازع الدولة سلطتها كان أول ما يفعله أن يضرب نقدًا باسمه، وهذا ما فعله ابن الزبير وثوارٌ آخرون في أثناء الفتن.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eلماذا لا صورة على الدينار؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان في الأمصار الإسلامية صورٌ في القصور والحمّامات، ولكن النقد كان له حكمٌ خاص؛ لأنه يُتداول بين الناس ويُلمس ويُنظر إليه في كل وقت، ولو وُضعت عليه صورةٌ لصار تعظيمها من تعظيم الأصنام في نظر كثير من الفقهاء. وقد كان الفقهاء يمنعون تصوير ذوات الأرواح في النقود والآنية من بابٍ أشدّ من منعهم له في الجدران.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان القرار أيضًا سياسيًّا: فالنقد الذي يحمل صورة الملك يعني أن الملك هو مصدر القيمة، والنقد الذي يحمل كلمة التوحيد يعني أن القيمة قائمةٌ على عهدٍ بين الناس والله. وقد كان هذا فرقًا في التصور لا في الشكل فقط. وقد كان في النقد أيضًا بيانٌ ضدّ الشرك؛ فالنقود البيزنطية كانت تحمل صورة الإمبراطور مع الصليب، والساسانية صورة كسرى مع النار، فكان في التعامل بها إقرارٌ بصورةٍ دينية لا يرضاها المسلمون.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eأثر الدينار في التجارة العالمية\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الدينار الذهبي الإسلامي في القرون الوسطى من أثبت العملات وزنًا وأوسعها انتشارًا. وقد وُجدت دنانير أموية في حفائر السويد وروسيا وفنلندا، وهي أماكن لم يصلها جيشٌ إسلامي، وإنما وصلها التجار. وهذا يدل على أن النقد الإسلامي كان عملةً دولية بالمعنى الحديث.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان هذا مرتبطًا بتجارة القوافل والسفن: فتجار الشرق كانوا يبيعون الحرير والتوابل والورق، ويأخذون الذهب، وكان الدينار هو الوحدة التي تُحسب بها الأسعار في أسواقٍ بعيدة. ومن هنا صار للدولة الإسلامية نفوذٌ اقتصادي يتجاوز حدودها العسكرية. وقد كانت التجارة العربية في هذا العهد تعمل على مستويين: تجارة القوافل في الصحراء إلى إفريقية والسودان، وتجارة السفن في البحر إلى الهند والصين. وكان الدينار هو العملة التي تُحسب بها الأسعار في المستويين معًا، وهذا ما جعله معيارًا عالميًّا.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالنقود وثيقةً تاريخية\u003c/h4\u003e\u003cp class=\"ap\"\u003eالمسكوكات من أدقّ المصادر التاريخية؛ لأنها تُضرب في سنةٍ معروفة، وتحمل اسم الخليفة واسم الوالي وموضع الضرب، ولا يمكن أن تُؤرَّخ لغير زمانها. وقد استعملها المؤرخون لتصحيح تواريخ الولايات وتحديد أسماء من حكم فعلًا في كل إقليم. وقد استُعملت النقود أيضًا في تحديد تسلسل الأحداث؛ فحين وُجد دينارٌ باسم والٍ لا تذكره المصادر، عُلم أنه حكم فعلًا في تلك السنة، وهذا سدّ فراغًا في الرواية الأدبية لا يمكن سدّه بغير المسكوكات.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كشفت النقود أمورًا لم تذكرها الكتب، مثل أسماء ولاةٍ لم يُترجم لهم، وتواريخ ولاياتٍ قصيرة، ومدنٍ كانت تضرب النقد ثم توقفت. وهي بهذا تُكمّل الرواية الأدبية، وتُصحّحها أحيانًا، وتُعطي صورةً مباشرة عن الاقتصاد واللغة والعقيدة في زمنها. وقد كانت النقود أيضًا شاهدةً على اللغة؛ فقد كُتبت عليها عباراتٌ عربية بخطٍّ كوفي مبكر، وهي من أقدم ما وصلنا من الخط العربي المنقوط، ولذلك يدرسها اللغويون إلى اليوم لمعرفة تطور الرسم والخط.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسنة أول دينار عربي\u003c/b\u003e\u003cspan\u003e٧٧هـ، في عهد عبد الملك بن مروان.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eوزن الدينار\u003c/b\u003e\u003cspan\u003eنحو ٤٫٢٥ غرامًا من الذهب، وهو وزنٌ بقي معتمدًا قرونًا.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالدرهم\u003c/b\u003e\u003cspan\u003eسبعة أعشار المثقال، وضُرب إسلاميًّا خالصًا سنة ٧٩هـ.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسبب الضرب\u003c/b\u003e\u003cspan\u003eالاستقلال عن نقد الروم والفرس، وردّ تهديد ملك الروم بالسبّ على النقود.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأثر عالمي\u003c/b\u003e\u003cspan\u003eوُجدت دنانير أموية في السويد وروسيا وفنلندا عن طريق التجارة.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالنقد\u003c/th\u003e\u003cth\u003eأصله\u003c/th\u003e\u003cth\u003eما تغيّر في العهد الأموي\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالدينار الذهبي\u003c/td\u003e\u003ctd\u003eبيزنطي، عليه صورة هرقل\u003c/td\u003e\u003ctd\u003eنقدٌ إسلامي خالص بالكتابة دون صورة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالدرهم الفضي\u003c/td\u003e\u003ctd\u003eساساني، عليه صورة كسرى\u003c/td\u003e\u003ctd\u003eضبط الوزن والعيار وإضافة الشهادتين\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالفلس النحاسي\u003c/td\u003e\u003ctd\u003eبيزنطي وساساني\u003c/td\u003e\u003ctd\u003eضرب محلي في الأمصار بأسماء الولاة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمثقال\u003c/td\u003e\u003ctd\u003eوزنٌ قديم\u003c/td\u003e\u003ctd\u003eصار أساسًا لوزن الدينار والدرهم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eدار الضرب\u003c/td\u003e\u003ctd\u003eمتفرقة\u003c/td\u003e\u003ctd\u003eإشراف مركزي وضربٌ باسم الخليفة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eالله أحد الله الصمد لم يلد ولم يولد.\u003c/p\u003e\u003ccite\u003eمن كتابة أول دينار عربي خالص سنة ٧٧هـ\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eكان الدينار الإسلامي إعلان استقلال اقتصادي: نقدٌ موحّد الوزن، بلا صورة، يحمل كلمة التوحيد، وسيطر على تجارة العالم القديم قرونًا. ومنه تعلّم المسلمون أن السيادة لا تكتمل بالجيش واللغة فقط، بل بالنقد أيضًا.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"hajjaj","n":"الحجاج والعراق","ic":"⚔️","part":"القسم الثالث: عبد الملك وإعادة بناء الدولة","h":"\u003carticle class=\"ch3\" id=\"hajjaj\" data-toc=\"الحجاج والعراق\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٣.٣\u003c/span\u003e\n          \u003ch3\u003e⚔️ الحجاج والعراق\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eل\u003c/span\u003eا يذكر الناس الحجاج بن يوسف الثقفي إلا بالظلم، وهذا حقٌّ لا يُنكر؛ فقد قتل في العراق خلقًا كثيرًا، وحاصر مكة، وسجن العلماء. لكنه كان في الوقت نفسه من أعظم من بنى الدولة الأموية إدارةً ونظامًا؛ فقد ضبط العراق بعد عشرين سنة من الفتنة، وأصلح الماء والزراعة، ونظّم المصحف، وعرّب الديوان.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eوُلد الحجاج بن يوسف في الطائف، ونشأ في قبيلة ثقيف، وكان معلّمًا للصبيان في أول أمره، ثم التحق بالجيش، وظهرت موهبته في الخطابة والسياسة. وقد عيّنه عبد الملك على العراق سنة خمسٍ وسبعين بعد أن قتل مصعب بن الزبير، وكان العراق في ذلك الوقت في حالةٍ من الفوضى: خوارجٌ في الأطراف، وأشرافٌ يتنازعون، وقبائلٌ متناحرة، ومدنٌ خربة من الحروب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد دخل الحجاج الكوفة خطيبًا، فقال خطبته المشهورة التي قال فيها إنه يرى رؤوسًا قد أينعت وحان قطافها، وإنه لصاحبها. وقد بدأ حكمه بأشدّ ما يمكن: قتل عددًا من الأشراف والقرّاء، وسجن آخرين، وأرهب الناس حتى سكنت الفتنة. وقد كان يقول: «لو أمرتُ الناس أن يخرجوا من بابٍ واحدٍ فخرجوا من بابٍ آخر، لحلّ دمهم ومالهم». وهذه العبارة تُبيّن منهجه: أن الطاعة عنده مطلقة، وأن المعصية لا تُحتمل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في العراق خوارجٌ يخرجون في كل سنة، وكان منهم من يُقاتل في الصفوف ويُصيب. وقد قاتلهم الحجاج في معارك كثيرة، ومن أشهرها معركة دير الجماجم مع ابن الأشعث سنة ثلاثٍ وثمانين، وقد كان ابن الأشعث من أشرف أهل العراق، فخرج عليه ومعه العلماء والقرّاء، وكانت المعركة من أشدّ المعارك، وانتهت بهزيمة ابن الأشعث ومقتل كثير من أصحابه. وقد كان في هذه الحادثة ما زاد في كراهية الناس للحجاج؛ لأن كثيرًا من العلماء قُتلوا أو سُجنوا.\u003c/p\u003e\u003cp class=\"ap\"\u003eلكن الحجاج لم يكن ظالمًا فقط. فقد كان إداريًّا عظيمًا: أصلح نظام الخراج، وضبط المقاييس، وأمر بضرب الدراهم الإسلامية، وبنى مدينة واسط سنة ثلاثٍ وثمانين لتكون قاعدةً للجيش بعيدة عن الكوفة والبصرة، وجعلها مدينةً عسكريةً منظمة. وقد كان في واسط قصرٌ وجامعٌ وديوانٌ وأسواق، وكانت تُدار منها خراسان والسند وإفريقية أحيانًا. وقد كان الحجاج يرى أن العراق لا يستقيم إلا بالشدة، وأن كل لينٍ فيه يُفسَّر ضعفًا، ولذلك كان يقول إنه ما أراد بالعراق خيرًا قطّ إلا قابله بالشرّ، وكان يضرب المثل بنفسه في القسوة حتى صار اسمه مثلًا في الظلم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان له في الماء والزراعة أثرٌ كبير. فقد أمر بحفر الأنهار والقنوات في العراق، وأصلح شطّ الفرات، واستقدم الفلاحين، ووضع نظامًا لتوزيع الماء بين الأراضي. وقد رُوي أن خراج العراق زاد في عهده زيادةً كبيرة، وأنه كان يُراقب الحسابات بنفسه. وقد كان يقول: «ما بقي من المال شيءٌ إلا وقد وضعته في موضعه»، وهو كلامٌ يُبيّن أن همّه كان بناء دولةٍ قادرة لا مجرّد إرهاب الناس.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان للحجاج دورٌ في جمع المصحف وضبط رسمه. فقد أمر في عهد عبد الملك بأن تُجمع القراءات وتُضبط الحروف، وأن يُكتب المصحف على رسمٍ واحد، وكان ذلك بدايةً للعمل الذي أكمله بعده. وقد كان هذا العمل ضروريًّا؛ لأن الأمصار كانت تختلف في القراءة والرسم، وكان ذلك مدخلًا للخلاف. وقد كان اهتمامه بالماء نابعًا من طبيعة العراق؛ فهو بلدٌ يعيش على النهرين، ولو أُهمل الريّ لضاعت الزراعة وضاع الخراج. وقد رُوي أنه كان يأمر بكنس الأنهار، وأنه عاقب من أفسد قناةً أو سرق ماءً، وكانت عقوبته في ذلك شديدة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد مات الحجاج سنة خمسٍ وتسعين بعد أن حكم العراق عشرين سنة، وكان في آخر حياته مريضًا، وقد رُوي أنه كان يتمنّى أن يُعطى رجلًا واحدًا فيقتله، فقيل له في ذلك، فقال: «لأن الله تعالى يقول: «ومن قتل نفسًا بغير نفس فكأنما قتل الناس جميعًا»، وأنا قد قتلت أناسًا كثيرًا». وقد مات بعد أن أوصى بأن يُدفن في مكانٍ لا يُعرف، وكانت وفاته في السنة التي مات فيها الوليد بن عبد الملك، وفيها بدأت علامات ضعف الدولة.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eواسط: مدينة الجيش\u003c/h4\u003e\u003cp class=\"ap\"\u003eبنى الحجاج مدينة واسط بين الكوفة والبصرة سنة ثلاثٍ وثمانين، وجعلها معسكرًا دائمًا لجيشه. وقد كانت المدينة منظمةً على شكلٍ دائري تقريبًا، وفي وسطها القصر والجامع، وحولها مساكن الجنود وأسرهم، وكان لكل قبيلةٍ محلّةٌ فيها. وقد كان اسم المدينة من موقعها؛ فقد كانت «واسطًا» بين الكوفة والبصرة، أي في الوسط بينهما، ولذلك سُمّيت واسط. وقد صارت في العصر العباسي مركزًا أدبيًّا، ومنها خرج شعراء وكتّاب، وبقيت آثارها قائمةً إلى القرن الرابع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت فكرة واسط ذكية؛ فقد أراد أن يُخرج الجيش من الكوفة والبصرة حيث الفتن والتحزّب، وأن يجعله في مدينةٍ لا يعيش فيها إلا من يخدم الدولة. وقد صارت واسط بعد ذلك مدينةً كبيرة، وبقيت قائمةً قرونًا، وفيها وُلد علماء وأدباء. وقد كان في هذه المدينة أيضًا دارٌ لضرب النقد، وديوانٌ للخراج، ومخازن للسلاح والمؤونة، وكانت تُدار منها خراسان والسند في بعض الفترات، وهذا يدل على أنها لم تكن معسكرًا فقط بل مركز إدارةٍ كامل.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالظلم والبناء: كيف نحكم على الرجل؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eالحجاج من الشخصيات التي يصعب الحكم عليها بحكمٍ واحد. فقد كان ظالمًا في حق كثير من الناس، قتل وسجن وسبّ الصحابة على المنابر، وهذا لا يجوز تبريره. وكان في الوقت نفسه من أشدّ من ضبط الدولة وأصلح إدارتها، وكان في العراق بعد عشرين سنة من الفتنة حاجةٌ إلى يدٍ قوية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان موقف العلماء منه مختلفًا: فمنهم من قاطعه وهجره كسعيد بن جبير، ومنهم من تعامل معه بحذرٍ كالحسن البصري الذي كان ينكر عليه ولا يخرج عليه. وقد ظلّ هذا الموقف نموذجًا في الفكر السياسي الإسلامي: أن الظلم لا يُبرَّر، لكن الخروج الذي يُسفك فيه الدم بلا نتيجةٍ ليس حلًّا أيضًا.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eأثر الحجاج في العراق\u003c/h4\u003e\u003cp class=\"ap\"\u003eترك الحجاج في العراق أثرًا مزدوجًا: فقد ضبط الأمن وأصلح الزراعة والري، وبنى واسط، وعرّب الديوان، ووحّد النقد. لكنه في الوقت نفسه أضعف الشرعية الأموية في العراق، وجعل أهل العراق أكثر بغضًا لبني أمية، حتى صار العراق أرضًا خصبةً لكل ثورةٍ بعد ذلك. وقد كان أهل العراق بعد الحجاج أكثر استعدادًا للثورة من أي إقليمٍ آخر، وقد ظهر ذلك في ثوراتٍ كثيرة بعده، حتى قيل إن كل حركةٍ في المشرق بدأت من العراق أو مرّت به، وهذا أثرٌ سياسي لم يُحسب في ميزان إنجازاته الإدارية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان هذا التناقض هو الذي جعل الدولة الأموية تسقط في النهاية: فقد كانت قويةً بالإدارة، لكنها كانت مكروهةً في القلوب. وقد كانت الثورة العباسية في العراق وخراسان، أي في المنطقتين اللتين كان فيهما أشدّ ظلمٍ وأشدّ إصلاحٍ معًا. وقد كان في هذا درسٌ للدول التي تعتمد على القوة وحدها: أنها قد تنجح في ضبط الظاهر، لكنها تخسر القلوب، وحين تخسر القلوب يصير كل ضعفٍ عارضٍ فرصةً للانقضاض عليها، وهذا ما جرى للأمويين في آخر أيامهم.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eولايته\u003c/b\u003e\u003cspan\u003eعلى العراق من ٧٥هـ إلى ٩٥هـ، أي عشرين سنة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eواسط\u003c/b\u003e\u003cspan\u003eمدينةٌ عسكرية بناها سنة ٨٣هـ لتكون قاعدةً لجيشه.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eدير الجماجم\u003c/b\u003e\u003cspan\u003eمعركة مع ابن الأشعث سنة ٨٣هـ، انتهت بمقتل كثير من العلماء.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالأثر الإداري\u003c/b\u003e\u003cspan\u003eضبط الخراج، وأصلح الريّ، وعرّب الديوان، وضرب الدراهم.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالأثر السياسي\u003c/b\u003e\u003cspan\u003eعمّق كراهية أهل العراق لبني أمية، وهو ما ساعد الثورة العباسية.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمجال\u003c/th\u003e\u003cth\u003eما فعله\u003c/th\u003e\u003cth\u003eالتقييم\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالأمن\u003c/td\u003e\u003ctd\u003eإخماد ثورات الخوارج وابن الأشعث\u003c/td\u003e\u003ctd\u003eنجاحٌ عسكري بثمنٍ بشري فادح\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالإدارة\u003c/td\u003e\u003ctd\u003eضبط الخراج والمقاييس\u003c/td\u003e\u003ctd\u003eأثرٌ باقٍ في تنظيم الدولة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالعمران\u003c/td\u003e\u003ctd\u003eبناء واسط وحفر القنوات\u003c/td\u003e\u003ctd\u003eمدينةٌ بقيت قرونًا وزراعةٌ انتعشت\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eاللغة\u003c/td\u003e\u003ctd\u003eتعريب ديوان العراق\u003c/td\u003e\u003ctd\u003eخطوةٌ أساسية في مسار التعريب\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالشرعية\u003c/td\u003e\u003ctd\u003eالقتل والسجن وسبّ الصحابة\u003c/td\u003e\u003ctd\u003eأضعف هيبة الدولة في القلوب\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eإني أرى رؤوسًا قد أينعت وحان قطافها، وإني لصاحبها.\u003c/p\u003e\u003ccite\u003eمن خطبة الحجاج الأولى في الكوفة\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eكان الحجاج أداة الدولة الأموية القوية وأسباب سقوطها في وقتٍ واحد: بنى لها إدارةً ونقدًا وماءً ومدينة، وزرع في القلوب كراهيةً لم تُشفَ. وقد بقي في التاريخ مثالًا على أن القوة التي تُصلح الظاهر قد تُفسد الباطن.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"dome","n":"قبة الصخرة والمسجد الأموي","ic":"🕌","part":"القسم الثالث: عبد الملك وإعادة بناء الدولة","h":"\u003carticle class=\"ch3\" id=\"dome\" data-toc=\"قبة الصخرة والمسجد الأموي\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٣.٤\u003c/span\u003e\n          \u003ch3\u003e🕌 قبة الصخرة والمسجد الأموي\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي سنة اثنتين وسبعين أمر عبد الملك ببناء قبة الصخرة في القدس، فكانت أول بناءٍ إسلامي ضخم في المدينة المقدسة، وأحد أعظم الآثار المعمارية في التاريخ. وفي عهد ابنه الوليد بُني المسجد الأموي في دمشق. وقد كان هذان البناءان مشروعًا سياسيًّا ودينيًّا في وقتٍ واحد.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكانت القدس قد فُتحت في خلافة عمر بن الخطاب سنة خمس عشرة، وقد دخلها عمر وبنى في الحرم مسجدًا صغيرًا في الطرف الجنوبي، وكان الحرم في ذلك الوقت مكبًّا للقمامة لأن الروم كانوا قد أهانوه. وقد روى المؤرخون أن عمر لما دخل وجد الصخرة مغطاةً بالتراب، فأمر بكنسها، ثم بنى مسجدًا في القبلة. وقد بقي هذا المسجد صغيرًا حتى عهد عبد الملك. وقد بقي هذا المسجد الصغير أساسًا للمسجد الأقصى، ثم وسّعه الأمويون بعد ذلك، وقد كانت مساحة الحرم في ذلك الوقت أكبر بكثير من المسجد، وكانت الصخرة في وسطه مكشوفةً لا بناء عليها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سنة اثنتين وسبعين — وقيل خمسٍ وستين — بدأ عبد الملك بناء قبة الصخرة، وقد استغرق البناء سنواتٍ وانتهى سنة اثنتين وتسعين، وقد كان في هذه السنوات خلافٌ مع ابن الزبير على الحرم، فقيل إن عبد الملك أراد أن يبني بناءً يُعظّم القدس ليجعل الحج إليها بدلًا من مكة، وهذا القول ضعيفٌ عند المحققين؛ لأن عبد الملك كان قد فرغ من ابن الزبير قبل تمام البناء، ولأن القبة بُنيت على الصخرة التي عرج منها النبيّ لا لتكون بديلًا عن الكعبة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بُنيت القبة على شكلٍ مثمن، وفي وسطها الصخرة، وفوقها قبةٌ خشبية مكسوّةٌ بالذهب، وقد بلغ قطرها نحو عشرين مترًا، وارتفاعها نحو خمسةٍ وثلاثين مترًا. وقد كُسيت جدرانها من الداخل والخارج بالرخام والفسيفساء، وكُتبت عليها آياتٌ من سورة النساء وسورة مريم تُخاطب أهل الكتاب: «يا أهل الكتاب لا تغلوا في دينكم»، وهذا اختيارٌ دقيق؛ لأن المدينة مقدسةٌ عند الأديان الثلاثة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في بناء القبة تقنياتٌ متقدمة: فقد استُخدمت الأخشاب والقباب المزدوجة لعزل الحرارة، ووُضعت في الجدران قنواتٌ للتصريف، واستُخدم الرصاص في تثبيت الألواح. وقد أُحضر للبناء صنّاعٌ من بيزنطة، وقيل إن سبعة آلاف عاملٍ عملوا فيه. وقد كان التمويل من خراج مصر لسبع سنوات في بعض الروايات. وقد كان في القبة تقنيةٌ أخرى مهمة: أنها بُنيت على قاعدةٍ مثمّنة لا مربعة، وهذا يسمح بأن تُوضع القبة على مساحةٍ دائرية دون حاجة إلى أقواسٍ ضخمة، وقد كان هذا حلًّا هندسيًّا ذكيًّا انتقل بعد ذلك إلى كل القباب الإسلامية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي دمشق بنى الوليد بن عبد الملك المسجد الأموي سنة سبعٍ وثمانين على موقع الكنيسة، وقد كان أعظم من قبة الصخرة مساحةً، وقد كُسي جداره بالفسيفساء التي تُصوّر مدنًا وأنهارًا. وقد كان البناء يستغرق عشر سنوات، وقد شارك في العمل صنّاعٌ من الروم والفرس والمغاربة، وقد قال الوليد حين سألوه عن كلفته: «أنفقوا فإن ابن أبي سفيان ما أنفق في شيءٍ إلا ازداد به ملكه جمالًا».\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان لهذين البناءين وظيفة سياسية واضحة: أن يُريا الناس أن الدولة الأموية دولةٌ قادرة على أن تبني ما لم يبنه أحد، وأن الإسلام ليس دينًا زاهدًا فقط بل دينٌ يُنتج فنًّا وعمارة. وقد كان في هذا ردٌّ على من كان يقول إن الأمويين مُلكٌ لا خلافة: أنهم يبنون للمسلمين ما يليق بمكانتهم في العالم. وقد كان في هذا الكلام تبريرٌ للنفقات الكبيرة: أن المال الذي يُنفق على العمارة ليس مالًا مهدورًا، بل هو استثمارٌ في هيبة الدولة وفي جمال مدنها، وهذا منطقٌ يختلف عن منطق الخلافة الراشدة التي كانت ترى في الزهد في البناء فضيلة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان لهذين البناءين أثرٌ في تاريخ الفن أيضًا. فقد نشأ في العهد الأموي أسلوبٌ معماري خاص: القبّة والمئذنة والقوس المدبّب والزخرفة النباتية. وقد انتقل هذا الأسلوب إلى الأندلس، فظهر في جامع قرطبة، ثم إلى المغرب، ثم إلى العمارة الإسلامية في كل مكان. ومن هنا يمكن القول إن العمارة الإسلامية بدأت فعلًا في العهد الأموي، وأن ما جاء بعدها كان تطويرًا لها لا ابتداءً.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eلماذا الصخرة؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eالصخرة في الحرم القدسي هي المكان الذي يُعتقد أن النبيّ عرج منه إلى السماء في ليلة الإسراء، ولذلك كانت موضع تعظيمٍ منذ الفتح. وقد كان بناء قبةٍ فوقها إعلانًا بأن القدس مدينةٌ إسلامية لها مكانةٌ دينية، لا مجرّد مدينةٍ مفتوحة. وقد كان في القدس أيضًا المسجد الأقصى، وهو اسمٌ يُطلق على الحرم كله لا على المسجد ذي القبلة فقط، وقد بُني في العهد الأموي على هيئته الكبيرة، وبقي حتى زلزالٍ في القرن الرابع الهجري ثم أُعيد بناؤه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان اختيار الشكل المثمّن والقبة المرتفعة مقصودًا؛ لأنه يُشبه في هيئته بعض المباني البيزنطية المقدسة، ولكنه يختلف عنها في الزخرفة والكتابة. وقد كان هذا أسلوبًا ذكيًّا: أن يأخذ المسلمون الشكل الذي يعرفه الناس، ثم يملؤوه بمضمونٍ جديد. وقد كان هذا الأسلوب معروفًا في العمارة الإسلامية في كل عصر: أن تأخذ الشكل الذي يعرفه الناس في بلدٍ ما، ثم تُفرغه من مضمونه القديم وتملأه بمضمونٍ إسلامي، وهذا هو معنى «التوطين» في العمارة، وهو أذكى من الرفض الكامل أو التقليد الكامل.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالفسيفساء والكتابة\u003c/h4\u003e\u003cp class=\"ap\"\u003eالفسيفساء في قبة الصخرة من أروع ما وصلنا من الفن الأموي؛ فقد كُسي بها الجدران الداخلية والخارجية، وتُصوّر أشجارًا وثمارًا وتيجانًا، ولا تُصوّر إنسانًا ولا حيوانًا. وقد كان هذا اختيارًا دينيًّا، لكنه أنتج فنًّا زخرفيًّا بلغ درجةً عالية من الدقة. وقد كان في الفسيفساء دلالةٌ على ثراء الدولة أيضًا؛ لأن موادها كانت تُستورد من أماكن بعيدة، وكانت صناعتها تحتاج إلى سنوات، وكان العاملون فيها من أمهر الصنّاع في العالم القديم، وهذا كله كان يُظهر أن الدولة قادرةٌ على جمع الموارد والخبرات.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالكتابة على الجدران ليست زخرفةً فقط، بل هي رسالةٌ موجّهة: فقد اختيرت آياتٌ تُخاطب أهل الكتاب وتُبيّن عقيدة التوحيد وتنفي التثليث والتجسيد. ومن هنا كانت القبة بيانًا عقائديًّا بالحجر والذهب، لا مجرّد أثرٍ جمالي. وقد كان في اختيار الآيات أيضًا ردٌّ على النصارى الذين كانوا يقولون إن المسيح ابن الله، وعلى من كان يعتقد أن القدس مكانٌ خاصٌّ بهم وحدهم، وهذا ردٌّ بالحجة لا بالسيف، وهو أسلوبٌ لم يُستعمل في كثير من الحالات المشابهة في التاريخ.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالعمارة الأموية وإرثها\u003c/h4\u003e\u003cp class=\"ap\"\u003eمن العهد الأموي ورثت العمارة الإسلامية عناصرها الأساسية: القبّة، والمئذنة المربعة، والمحراب المجوّف، والصحن المكشوف، والزخرفة النباتية المتشابكة. وقد ظهرت هذه العناصر في المسجد الأموي والمسجد الأقصى وقصور البادية، ثم انتقلت إلى كل مكان. وقد كان المحراب المجوّف ابتكارًا إسلاميًّا خالصًا؛ فالمحاريب قبل ذلك كانت مسطّحة، ثم صارت مقوّسةً إلى الداخل، وهذا الشكل انتقل بعد ذلك إلى كل مساجد العالم، وصار علامةً مميزة للعمارة الإسلامية في كل قارة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان لهذا الأثر ما بعده في الأندلس خاصة؛ فقد بُني جامع قرطبة على نمطٍ أموي، وقد بلغت فيه الأقواس المزدوجة درجةً لم تُسبق. وقد كان هذا الفن هو الذي جعل الأندلس تُعرف في أوروبا، وهو الذي جعل ملوك أوروبا يستقدمون الصنّاع الأندلسيين بعد ذلك. وقد كان انتقال هذا الفن إلى أوروبا بطريقتين: عن طريق صقلية التي حكمها المسلمون قرنين، وعن طريق الأندلس التي بقي فيها الإسلام ثمانية قرون. ومن هذين الطريقين دخلت الزخرفة العربية والقوس المدبّب والقبّة إلى عمارة أوروبا في العصور الوسطى.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eبداية بناء القبة\u003c/b\u003e\u003cspan\u003eسنة ٧٢هـ، وانتهى سنة ٩٢هـ في عهد عبد الملك.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eشكلها\u003c/b\u003e\u003cspan\u003eمثمّن الأضلاع، وفي وسطه الصخرة، وقبّتها مكسوّة بالذهب.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالكتابة\u003c/b\u003e\u003cspan\u003eآيات من سورة النساء ومريم تُخاطب أهل الكتاب في التوحيد.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمسجد الأموي\u003c/b\u003e\u003cspan\u003eبُني سنة ٨٧هـ في عهد الوليد، وكُسي بالفسيفساء.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأثر معماري\u003c/b\u003e\u003cspan\u003eمنه انتقلت القبّة والمئذنة والمحراب المجوّف إلى العمارة الإسلامية كلها.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالبناء\u003c/th\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالخليفة\u003c/th\u003e\u003cth\u003eأهم ما فيه\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالمسجد الأقصى الأول\u003c/td\u003e\u003ctd\u003e١٥هـ\u003c/td\u003e\u003ctd\u003eعمر بن الخطاب\u003c/td\u003e\u003ctd\u003eمسجدٌ صغير في جنوب الحرم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eقبة الصخرة\u003c/td\u003e\u003ctd\u003e٧٢–٩٢هـ\u003c/td\u003e\u003ctd\u003eعبد الملك\u003c/td\u003e\u003ctd\u003eأول بناء إسلامي ضخم في القدس\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمسجد الأقصى\u003c/td\u003e\u003ctd\u003eأواخر القرن الأول\u003c/td\u003e\u003ctd\u003eالوليد\u003c/td\u003e\u003ctd\u003eتوسعةٌ كبيرة على أساسٍ أموي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمسجد الأموي\u003c/td\u003e\u003ctd\u003e٨٧هـ\u003c/td\u003e\u003ctd\u003eالوليد\u003c/td\u003e\u003ctd\u003eأعظم مساجد الشام وأوسعها فسيفساءً\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eقصور البادية\u003c/td\u003e\u003ctd\u003eالقرن الأول\u003c/td\u003e\u003ctd\u003eهشام وغيره\u003c/td\u003e\u003ctd\u003eحمّاماتٌ وقنواتٌ وفسيفساء الصيد\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eيا أهل الكتاب لا تغلوا في دينكم.\u003c/p\u003e\u003ccite\u003eمن الآيات المكتوبة على جدران قبة الصخرة\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eلم تكن القبة والمسجد الأموي ترفًا معماريًّا، بل كانا بيانًا بالحجر: أن هذه الدولة قادرة، وأن القدس إسلامية، وأن الإسلام يُنتج فنًّا. ومنهما بدأت العمارة الإسلامية التي ستصل إلى قرطبة وإشبيلية وسمرقند.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-4","n":"القسم الرابع: عمر بن عبد العزيز وسنوات العدل","ic":"","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-4\" style=\"--c:#4B0082\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🌾\u003c/div\u003e\n      \u003ch2\u003eالقسم الرابع: عمر بن عبد العزيز وسنوات العدل\u003c/h2\u003e\n      \u003cp\u003eفي سنة تسعٍ وتسعين للهجرة صار عمر بن عبد العزيز خليفةً، ولم يبقَ في الحكم إلا سنتين ونصفًا، ثم مات. ومع ذلك يُعدّ في ذاكرة المسلمين خامس الخلفاء الراشدين، وسبب ذلك أنه حاول في سنتين ما لم يُحاوله أحدٌ في ثمانين: أن يُعيد الحكم إلى ما كان عليه في عهد عمر بن الخطاب، وأن يردّ المظالم، وأن يُلغي الامتيازات، وأن يجعل الخلافة مسؤوليةً لا مُلكًا.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#umar-life\"\u003eسيرته وزهده\u003c/a\u003e\u003ca href=\"#umar-reform\"\u003eالإصلاح المالي والقضائي\u003c/a\u003e\u003ca href=\"#umar-years\"\u003eسنواته القصيرة وأثرها\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"umar-life","n":"سيرته وزهده","ic":"🕯️","part":"القسم الرابع: عمر بن عبد العزيز وسنوات العدل","h":"\u003carticle class=\"ch3\" id=\"umar-life\" data-toc=\"سيرته وزهده\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٤.١\u003c/span\u003e\n          \u003ch3\u003e🕯️ سيرته وزهده\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eوُ\u003c/span\u003eلد عمر بن عبد العزيز في المدينة سنة إحدى وستين، وجدّه لأمه عمر بن الخطاب، وجدّه لأبيه مروان بن الحكم؛ فهو يجمع بين بيت الخلافة وبيت الخلافة، لكنه نشأ نشأةً مختلفة: في المدينة، بين العلماء، بعيدًا عن قصور الشام. وقد كان في شبابه واليًا على المدينة، ثم واليًا على مكة، ثم عزل نفسه وعاد إلى العلم.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان عمر بن عبد العزيز بن مروان بن الحكم، وأمه أم عاصم بنت عاصم بن عمر بن الخطاب، ولذلك كان يقول: «أنا ابن الخليفتين»، يعني عمر بن الخطاب ومروان. وقد نشأ في المدينة في بيتٍ يجتمع فيه الشرف والصلاح، وقد روى المؤرخون أنه كان في صغره يدرس الحديث والفقه، وأنه روى عن أنس بن مالك وعن عبيد الله بن عبد الله بن عتبة، وكان يُجالس علماء المدينة ويسألهم ويُداعبهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ولّاه عبد الملك بن مروان المدينة وهو شابٌّ في نحو العشرين، فحكمها سنين، وكان في أول أمره شديدًا في الولاية؛ فقد رُوي أنه كان إذا أراد أن يُنفّذ أمرًا لم يتأنّ، حتى كتب إليه بعض العلماء ينصحه. ثم ولّاه الوليد مكة والمدينة معًا، ثم عزله بعد سنوات، فرجع إلى المدينة وعاش فيها زاهدًا، ولبس الخشن، وأقبل على الحديث والفقه، حتى قيل إنه كان من أفضل أهل زمانه علمًا وورعًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في زهده قبل الخلافة مثالًا؛ فقد رُوي أن امرأته فاطمة بنت عبد الملك — وهي أخت الخليفة — كانت تعيش معه في ضيقٍ شديد، وأنها كانت تبيع حُليّها لتُنفق، وأنها قالت بعد أن صار خليفةً: «لقد كان يشتري لي الحُلِيّ، فلما صار خليفةً باع حُليّي»، وهذا يُبيّن أنه لم يتغيّر حين تغيّر حاله، بل كان زهده قبل الحكم وبعده واحدًا. وقد كان في زهده قبل الخلافة معنى سياسي أيضًا: أنه كان يعرف أن الناس ينظرون إلى بيت الحكم، وأن إسرافه يُبرّر إسراف الأشراف، فلذلك اختار أن يعيش كما يعيش الفقراء وهو في منصبٍ لا ينقصه مال.\u003c/p\u003e\u003cp class=\"ap\"\u003eولمّا مات سليمان بن عبد الملك سنة تسعٍ وتسعين كان وليّ عهده قد كتب اسمًا لم يُبيّنه، فسأل أهل الشام عن ذلك، فذكروا أنه كتب «رجُلًا من المسلمين»، ثم قيل إنه عمر بن عبد العزيز. وقد كان في هذا الاختيار مفارقةٌ عجيبة: أن يصل إلى الخلافة رجلٌ لم يطلبها، ولم يكن في بيت الحكم، ولم يكن له جيشٌ ولا حزب، وإنما وصل إليها بوصيةٍ من خليفةٍ مات بعد شهور.\u003c/p\u003e\u003cp class=\"ap\"\u003eولمّا بويع، خطب في الناس خطبةً ذكر فيها أنه ليس بخليفةٍ مختار، وأنه إنما قام بأمرٍ لم يسأله، ثم قال: «أيها الناس، من أطاع الله فطاعته واجبة، ومن عصى الله فلا طاعة له». وهذه الكلمة تُلخّص فقهه السياسي: أن الطاعة ليست للأشخاص بل لله، وأن الحاكم إذا خالف أمر الله سقطت طاعته في ذلك الأمر. وقد كان هذا الكلام في مجلس الخلافة، أمام أهل الشام، في وقتٍ كانت فيه الدولة قد بُنيت على الطاعة المطلقة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان أول ما فعله أنه ردّ ما كان في يد أهله من أموالٍ وأملاك؛ فقد قال إنه لا يريد أن يكون مثل من كان قبله، وإن هذه الأموال إن كانت ظُلمًا فسيردّها، وإن كانت حقًّا فسيتركها. وقد رُوي أن امرأته فاطمة ردّت حُليّها إلى بيت المال، وأنه ردّ أرضًا كانت له، وأنه كتب إلى عماله أن يردّوا كل ما أُخذ بغير حق. وقد كان هذا الإعلان هو الذي جعل الناس يثقون به من أول يوم، لأنهم رأوا أن الرجل يبدأ بنفسه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في شخصه اجتماعٌ نادر بين العلم والزهد والقدرة على الإدارة. فلم يكن زاهدًا عاجزًا، ولا قويًّا فاجرًا، بل كان يعرف كيف تُدار الدولة، وكيف تُكتب الرسائل، وكيف تُحسب الأموال، ثم كان يستعمل هذا كله في إصلاحٍ لا في تمكينٍ. وقد قال عنه مالك بن أنس: «كان عمر بن عبد العزيز إمامًا يُقتدى به»، وقال عنه غيره: «ما رأيت رجلًا كان أشدّ استقصاءً في الحقّ منه».\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eبيتٌ يجمع الخلافتين\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان في نسب عمر بن عبد العزيز أمرٌ لم يكن لأحدٍ غيره: أنه حفيد عمر بن الخطاب من جهة أمه، وحفيد مروان بن الحكم من جهة أبيه. وقد كان هذا النسب يمنحه شرعيةً عند الفريقين: عند أهل الحجاز الذين يحبّون عمر، وعند أهل الشام الذين يطيعون بني أمية. وقد كان هذا النسب أيضًا سببًا في حساسيته تجاه قضية الأموال؛ فهو يعرف أن بني أمية يملكون ما لا يملكه غيرهم، ويعرف أن الناس يربطون بين هذا وبين الخلافة، ولذلك بدأ إصلاحه من هذا الباب بالذات.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان يستعمل هذا النسب في خطابه أحيانًا؛ فقد رُوي أنه قال في أول خطبةٍ له إنه ليس مثله مثل من كان قبله، وإنه لا يريد أن يُدخل في هذا الأمر ما ليس منه. وقد كان الناس يرون فيه شبها بعمر بن الخطاب في الزهد والعدل، حتى قيل إنه «عمر الثاني»، وهذا اللقب لم يُطلق على غيره من خلفاء بني أمية.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eمن والٍ شابٍّ إلى زاهدٍ عالم\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت ولايته على المدينة في شبابه مرحلةً مهمة في تكوينه؛ فقد تعلّم فيها كيف تُدار الأموال والأوقاف والقضاء، وكيف يُتعامل مع أشراف المدينة وعلمائها. وقد كان في هذه المرحلة شديدًا في بعض الأمور، ثم تغيّر بعد ذلك بسبب مجالسة العلماء. وقد كان في هذه المرحلة يتعلّم كيف يوازن بين الشدة والرفق، وهو ما ظهر بعد ذلك في سياسته: فقد كان حازمًا في الحقّ، رحيمًا في التنفيذ، لا يُعاقب إلا بعد ثبوتٍ، ولا يُسقط حقًّا لأحد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد رُوي أن سبب تغيّره أنه سمع حديثًا أو موعظةً من رجلٍ صالح، فترك ما كان فيه وأقبل على العلم والعبادة. وقد كان في هذا دليلًا على أن الشخصية لا تتشكّل مرةً واحدة، وأن من كان واليًا شديدًا قد يصير خليفةً عادلًا إذا تغيّر قلبه قبل أن تتغيّر مناصبه. وقد كان في هذه السنوات يقرأ الحديث ويسمع من الصحابة من بقي منهم، في المدينة التي كانت دار الهجرة وموطن الفقه، وقد كان لهذا أثره في تكوين فهمه للسياسة: أنه لم يكن رجل دولةٍ فقط، بل كان رجل نصّ يقرأ الواقع في ضوئه.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالخطبة الأولى: نظرية الحكم في كلمات\u003c/h4\u003e\u003cp class=\"ap\"\u003eخطبة عمر بن عبد العزيز الأولى في الخلافة من أهم الوثائق السياسية في تاريخ الإسلام؛ فقد قال فيها إنه ليس بخليفةٍ مختار، وإنه لا يريد أن يكون مبتدعًا، وإنه سيعمل بسنة النبيّ وسنة الخلفاء الراشدين، وإن من أطاع الله فطاعته واجبة ومن عصاه فلا طاعة له. وقد كان في خطبته أيضًا إعلانٌ بأنه لن يُقاتل أحدًا على الخلافة، وأنه لن يطلب من الناس ما لم يطلبه الله منهم، وقد كان هذا نادرًا في خطب التولية التي كانت تُبنى عادةً على التهديد والترغيب معًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا الكلام ثلاثة أصول: أن الحكم تكليفٌ لا تشريف، وأن الشرعية مقيّدةٌ بالكتاب والسنة لا بالغلبة، وأن الطاعة مشروطةٌ بالطاعة لله. وهذه الأصول لم تكن جديدةً في الفكر الإسلامي، لكن الجديد أن تُعلن في مجلس الخلافة، وأن يعمل بها خليفةٌ فعليًّا لا خطيبًا فقط.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمولده\u003c/b\u003e\u003cspan\u003eسنة ٦١هـ في المدينة، وهو من بني أمية من جهة أبيه ومن بني عدي من جهة أمه.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأمه\u003c/b\u003e\u003cspan\u003eأم عاصم بنت عاصم بن عمر بن الخطاب، ولذلك قيل إنه «عمر الثاني».\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eولايته\u003c/b\u003e\u003cspan\u003eالمدينة ثم مكة في عهد عبد الملك والوليد، ثم عُزل وأقبل على العلم.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسنة خلافته\u003c/b\u003e\u003cspan\u003e٩٩هـ إلى ١٠١هـ، أي سنتان ونصف تقريبًا.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأول قرار\u003c/b\u003e\u003cspan\u003eردّ الأموال والمظالم، وبدأ بأهل بيته ونفسه.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمرحلة\u003c/th\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالوصف\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالمولد والنشأة\u003c/td\u003e\u003ctd\u003e٦١هـ\u003c/td\u003e\u003ctd\u003eفي المدينة بين العلماء وأهل الحديث\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eولاية المدينة\u003c/td\u003e\u003ctd\u003e٨٧هـ تقريبًا\u003c/td\u003e\u003ctd\u003eأول منصبٍ إداري في شبابه\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eولاية مكة والمدينة\u003c/td\u003e\u003ctd\u003e٩٣هـ\u003c/td\u003e\u003ctd\u003eجمع له الوليد بين الحرمين\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالعزل والزهد\u003c/td\u003e\u003ctd\u003e٩٦هـ\u003c/td\u003e\u003ctd\u003eترك المناصب وأقبل على الفقه والحديث\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالخلافة\u003c/td\u003e\u003ctd\u003e٩٩هـ\u003c/td\u003e\u003ctd\u003eبوصيةٍ من سليمان بن عبد الملك\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eمن أطاع الله فطاعته واجبة، ومن عصى الله فلا طاعة له.\u003c/p\u003e\u003ccite\u003eمن خطبة عمر بن عبد العزيز الأولى في الخلافة\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eوصل عمر بن عبد العزيز إلى الخلافة بلا طلبٍ ولا حزب، وكان قبلها واليًا وعالمًا وزاهدًا. وقد كانت خطبته الأولى إعلانًا بأن الحكم مسؤوليةٌ لا مُلك، وأن الطاعة لله لا للأشخاص، وهذا ما جعله في ذاكرة الأمة خامس الخلفاء الراشدين رغم قصر مدته.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"umar-reform","n":"الإصلاح المالي والقضائي","ic":"⚖️","part":"القسم الرابع: عمر بن عبد العزيز وسنوات العدل","h":"\u003carticle class=\"ch3\" id=\"umar-reform\" data-toc=\"الإصلاح المالي والقضائي\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٤.٢\u003c/span\u003e\n          \u003ch3\u003e⚖️ الإصلاح المالي والقضائي\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eل\u003c/span\u003eم يكن إصلاح عمر بن عبد العزيز خطابةً؛ بل كان قراراتٍ صعبة: ردّ الأموال التي أُخذت بغير حق، وألغى الامتيازات، وأعاد الجزية إلى أصلها، وأصلح القضاء، وكتب إلى عماله رسائلَ فيها برنامج حكمٍ كامل. وقد كانت هذه القرارات تُصادم مصالح أقوى طبقةٍ في الدولة، وهي طبقة بني أمية وأنصارهم.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكانت الدولة الأموية قد بُنيت على نظامٍ من الامتيازات: أراضٍ تُقطع لأهل البيت، وأموالٌ تُؤخذ في الفيء وتُصرف على الخاصة، وعطاءٌ يُفرَّق بحسب النسب لا بحسب الحاجة، وجزيةٌ تُفرض على من أسلم من الموالي لأنهم لا يملكون قبيلةً تحميهم. وقد كان هذا النظام يُنتج ثراءً هائلًا لطبقةٍ صغيرة، وفقرًا واسعًا في الأمصار، وكان هو السبب الأول في كل ثورةٍ قامت في العهد الأموي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بدأ عمر بن عبد العزيز بوقف ما يُسمّى «القطائع»، وهي الأراضي التي أُعطيت لبني أمية وأتباعهم، فردّها إلى بيت المال، وكتب إلى عماله أن يردّوا كل ما أُخذ بغير حق، وأن يُنظروا في المظالم القديمة. وقد رُوي أن رجلًا من بني أمية قال له: «إن هذا الأمر لا يستقيم إلا بما كرهنا»، فقال: «ما كنت أظن أن أحدًا يعرف الحقّ ثم يتركه»، وكان جوابه هذا يُبيّن أنه كان يعرف أن الإصلاح سيكلّفه تأييد أهله.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي المال كتب رسالةً شهيرةً إلى عُمر بن عبد الله الأنصاري، وهي من أهم الوثائق الإدارية في التاريخ الإسلامي. وقد جاء فيها: «انظر ما كان من حقّ المسلمين في يد من كان قبلك من أهل بيتك فاردده»، ثم أوصاه بأن يبدأ بأهل بيته، وقال: «فإنّي لا أرى أن أحدًا أشدّ عليّ في ذلك منك». وهذه العبارة تُبيّن أنه كان يعرف أن الإصلاح يبدأ من الأقربين لا من الأبعدين.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي الجزية كان قراره أن من أسلم من أهل الذمة لا تُفرض عليه الجزية، وهذا كان مذهب عمر بن الخطاب، وقد كان الخلفاء قبله يأخذون الجزية من المسلمين الجدد لأنهم يريدون المال. وقد رُوي أن عاملًا له كتب إليه: «إن الناس قد أسلموا حتى قلّت الجزية»، فكتب إليه: «إن الله بعث محمدًا داعيًا ولم يبعثه جابيًا»، وهذه الكلمة من أشهر ما رُوي عنه، وهي تُلخّص مبدأه: أن الدعوة غايتها الناس لا المال.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي القضاء كان إصلاحه أن يعزل القضاة الظلمة، وأن يكتب إلى قاضيه في مصر أن ينظر في المظالم، وأن يُعيد للناس حقوقهم من الولاة. وقد رُوي أن رجلًا شكا إليه واليًا ظلمه، فكتب إلى الوالي يعنّفه، ثم أمر بردّ ما أخذ. وقد كان يرى أن القضاء مستقلٌّ عن السلطة التنفيذية، وأن الوالي لا يشفع عنده. وقد كان في هذا القرار أيضًا ردٌّ على سياسة معاوية وعبد الملك الذين كانوا يستعملون السبّ أداةً لتثبيت شرعية بني أمية في مقابل بني هاشم، وقد كان قطعُه إعلانًا بأن الدولة لم تعد طرفًا في خصومةٍ قديمة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان من إصلاحاته أن ألغى السبّ على المنابر؛ فقد كانت سنةً أموية أن يُسبّ عليّ بن أبي طالب في خطبة الجمعة، فقطعها وأبدلها بقوله تعالى: «إن الله يأمر بالعدل والإحسان». وقد رُوي أن ذلك كان في أول جمعةٍ له، وأن الناس بكوا. وقد كان هذا القرار إشارةً إلى أن الدولة لم تعد دولة فريقٍ ضد فريق، بل دولة جميع المسلمين. وقد كان في هذا الفائض دليلٌ على أن الفقر في الأمصار لم يكن بسبب قلة المال، بل بسبب طريقة توزيعه، وهذا اكتشافٌ اقتصادي مبكر يُشبه ما تقوله النظريات الحديثة عن أن الفقر مسألة توزيع لا مسألة موارد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان للإصلاح المالي نتيجةٌ مذهلة: فقد رُوي أن المال فاض في بيت المال حتى لم يجد من يقبله، وأن عاملًا كتب إليه: «ما بقي في بيت المال شيءٌ إلا وقد وزّعته، ولم يبقَ من يستحقه»، فكتب إليه أن يُجهّز الجيوش ويُحسّن الطرق ويُعين الفقراء. وقد يكون في هذه الروايات مبالغة، لكنها تدل على أن الفائض كان كبيرًا بسبب إلغاء الامتيازات وضبط الجباية.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eرسالة الإصلاح إلى عُمر الأنصاري\u003c/h4\u003e\u003cp class=\"ap\"\u003eالرسالة التي كتبها عمر بن عبد العزيز إلى عامله على المدينة من أهم نصوص الفكر الإداري الإسلامي. فقد بدأها بأن حمد الله وأثنى عليه، ثم قال: «أما بعد، فإنّي أوصيك بتقوى الله»، ثم أمره بأن ينظر في المظالم فيردّها، وأن يبدأ بأهل بيت الخليفة قبل غيرهم. وقد كان في مقدمة الرسالة ما يُشبه العقد: أنه يُوصيه بتقوى الله أولًا، ثم يُلزمه بردّ المظالم، ثم يُبيّن له كيف يفعل. وهذا الترتيب يدل على أن الإصلاح في نظره يبدأ بالنية قبل الإجراء، وبالأصول قبل التفاصيل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الرسالة تفصيلٌ دقيق: أن يكتب إلى العمال في الأمصار، وأن يُحصي ما أُخذ، وأن يردّ إلى أصحابه، وأن يُنصف من نفسه. وقد كان في هذا الأسلوب إقرارٌ بأن الدولة مسؤولةٌ عن مظالم ماضية، وأن العدل لا يبدأ من الآن بل يُعيد ما فات. وقد كان في الرسالة أيضًا اعترافٌ بأن المظالم لم تكن فرديةً بل نظامية؛ فلم يكن يطلب منه أن يُعاقب هذا الوالي أو ذاك، بل أن يُعيد الحقوق إلى أصحابها من أي يدٍ كانت، وهذا فرقٌ كبير في فهم المسؤولية.\u003c/p\u003e\u003ch4 class=\"sub\"\u003e«إن الله بعث محمدًا داعيًا ولم يبعثه جابيًا»\u003c/h4\u003e\u003cp class=\"ap\"\u003eهذه الكلمة من أهم ما رُوي عن عمر بن عبد العزيز، وقد قالها حين شكا إليه عاملٌ أن الجزية قلت لأن الناس أسلموا. وقد كان فيها ردٌّ على منطقٍ مالي يرى في الإسلام مصدر دخل، ويُفضّل أن يبقى الناس على دينهم لتُؤخذ منهم الجزية. وقد كان في هذا الموقف جرأةٌ على منطق الخزينة؛ فقد كان الوالي يرى أن قلة الجزية نقصٌ في الإيرادات، وكان عمر يرى أن إسلام الناس هو الغاية التي من أجلها أُخذ المال، فإذا تعارضا قُدّمت الغاية على الوسيلة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان هذا المبدأ مخالفًا لسياسة بعض الولاة قبله، الذين كانوا يردّون من أسلم إلى دينه أو يأخذون منه الجزية، وخاصة في خراسان والمغرب. وقد كان في هذا المبدأ أثرٌ كبير في انتشار الإسلام؛ لأن الناس دخلوا فيه حين عرفوا أنه لا يكلّفهم مالًا. وقد كان هذا المبدأ يتعارض مع مصلحة بعض الولاة الذين كانوا يخشون أن يقلّ خراجهم فيُحاسبوا، ولذلك كان بعضهم يُخفي إسلام الناس أو يمنعهم منه، وهذا ما جعل سياسة عمر تحتاج إلى رقابةٍ على العمال لا إلى بيانٍ فقط.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eنتائج سنتين\u003c/h4\u003e\u003cp class=\"ap\"\u003eفي سنتين ونصف تغيّرت أشياء كثيرة: عادت الأراضي إلى بيت المال، وسقطت الامتيازات، وارتفع الفائض، وانقطع السبّ على المنابر، وعُزل الولاة الظلمة، وأُعيدت الحقوق إلى أصحابها. وقد كان هذا كافيًا لأن يُذكره التاريخ إلى اليوم. وقد كان في هذا الفائض أيضًا خطرٌ لم يُلحظ دائمًا: أن المال إذا كثر في بيت المال بلا مشروعٍ استثماري فقد يُصرف في وجوهٍ لا نفع فيها، ولذلك أوصى عمر بتجهيز الجيوش وإصلاح الطرق ومساعدة الفقراء، أي بصرفه في مصالح عامة.\u003c/p\u003e\u003cp class=\"ap\"\u003eلكن الإصلاح كان له ثمن: فقد غضب بنو أمية، وتذمّر أهل الشام، وقيل إن بعضهم دسّ إليه السمّ. وقد مات عمر سنة إحدى ومئة في دير سمعان قرب حمص، وقيل إنه قال قبل موته كلمةً تُنسب إليه: «اجلسوني»، ثم قال: «لا إله إلا الله»، ثم مات. ولم يُدم إصلاحه بعده، لأن من جاء بعده أعاد كثيرًا من الامتيازات.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالقطائع\u003c/b\u003e\u003cspan\u003eأراضٍ أُعطيت لبني أمية، ردّها عمر إلى بيت المال.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالجزية\u003c/b\u003e\u003cspan\u003eأسقطها عن من أسلم، وقال: «إن الله بعث محمدًا داعيًا ولم يبعثه جابيًا».\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالسبّ على المنابر\u003c/b\u003e\u003cspan\u003eألغاه ووضح مكانه آية: «إن الله يأمر بالعدل والإحسان».\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالرسالة الأنصارية\u003c/b\u003e\u003cspan\u003eوثيقة إدارية في ردّ المظالم، أُرسلت إلى عامله على المدينة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالنتيجة\u003c/b\u003e\u003cspan\u003eفائضٌ في بيت المال وانقطاعٌ للامتيازات في سنتين ونصف.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمجال\u003c/th\u003e\u003cth\u003eقبل عمر بن عبد العزيز\u003c/th\u003e\u003cth\u003eفي عهده\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالأراضي\u003c/td\u003e\u003ctd\u003eقطائع لبني أمية وأتباعهم\u003c/td\u003e\u003ctd\u003eردٌّ إلى بيت المال\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u0
