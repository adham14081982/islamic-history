وط إشبيلية سنة ١٢٤٨م بعد حصارٍ دام ستة عشر شهرًا، وكانت المدينة قد صارت آخر قاعدةٍ كبيرة في الجنوب، وقد حاول أهلها أن يستعينوا بالمرينيين في المغرب، لكن الخلافة الموحدية كانت قد سقطت، وكان المرينيون قد بدأوا دولتهم في المغرب ولم يكونوا بعد قادرين على حملةٍ كبيرة. وقد دخلها فرديناند الثالث، وكان ذلك إعلانًا بأن الأندلس لم يبقَ منها إلا مملكة غرناطة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان محمد بن الأحمر قد عقد مع فرديناند الثالث عهدًا سنة ١٢٤٦م، وكان فيه تابعًا له، يدفع له الجزية ويُعينه في حروبه، مقابل أن يبقى في غرناطة. وقد ساعده فعلًا في حصار إشبيلية، وكان في هذا العهد معنى مرّ: أن آخر مملكةٍ إسلامية في الأندلس قامت بمساعدة من سيُسقطها بعد قرنين، وأنها اشترت بقاءها بالتخلي عن جيرانها. وقد كان في هذا العهد معنى سياسي دقيق: أن المملكة الصغيرة تضمن بقاءها بأن تكون نافعة لجارها الكبير، وأن تنفع جارها يعني أن تُعينه على من هو أقرب إليها منه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في سقوط هذه المدن أثرٌ بشري هائل: فقد هاجر من قرطبة وإشبيلية وبلنسية أعدادٌ كبيرة من المسلمين إلى غرناطة وإلى المغرب، وكان في المهاجرين علماء وحرفيون وتجار، وكان في هجرتهم خسارةٌ اقتصادية للمدن التي سقطت، لأنهم حملوا معهم الصناعات والمعارف. وقد صار في المغرب أحياءٌ كاملة من الأندلسيين، وكان لهم أثرٌ في فنون البناء والموسيقى والطبخ واللغة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان سقوط قرطبة يعني ضياع جامعها الكبير، وقد حُوّل إلى كنيسة، وكان في هذا رمزٌ واضح: أن المدينة التي كانت أعظم مدن أوروبا في القرن العاشر صارت مدينةً في مملكةٍ نصرانية. وقد بقي بناؤه إلى اليوم، وبقي معه سؤالٌ يُطرح في كل مرة يُزار فيها: كيف سقطت مدينةٌ بهذا الجمال وهذا العلم؟ وقد بقي في المدينة بعد سقوطها مسجدٌ تحوّل إلى كنيسة، وبقيت أحياءٌ سكنها المسلمون ثم ضُيّق عليهم فيها، ثم خرجوا منها بعد قرونٍ في هجراتٍ متتابعة، وكان في هذا الخروج نهايةٌ لوجودٍ دام ثمانية قرون.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه السنوات أيضًا سقوط مرسية ولورقة وأشبيلية وغيرها، ولم تكن هذه السقوط نتيجة خيانةٍ بل نتيجة بنية: أن الأندلس بعد العقاب لم تكن دولة، وأن المدن التي لا تجمعها دولة تُسقط واحدةً بعد أخرى. وقد بقي هذا الدرس في التاريخ الأندلسي وفي التاريخ الإسلامي عمومًا: أن الانقسام في وقت الخطر ليس اختلافًا سياسيًّا بل انتحارًا جماعيًّا.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالعقود وسياسة التسليم\u003c/h4\u003e\u003cp class=\"ap\"\u003eاستعمل فرديناند الثالث سياسة العقود استعمالًا بارعًا: فكان يعرض على المدينة التي تُسلّم أمانًا على الأنفس والأموال والكنائس، وعلى من أراد الهجرة أن يهاجر بأمان. وقد كان هذا العرض يُغري أهل المدن، لأن الحرب كانت تعني القتل والسبي والخراب، وكان التسليم يعني البقاء.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه السياسة حسابٌ آخر: أن الملك الذي يقبل التسليم يحفظ المدينة ويستفيد من سكانها وعمارتها وأسواقها، وكانت المدن المسلمة في الأندلس مدنًا غنية، وكان خرابها خسارةً للملك نفسه. ولهذا كانت العقود أداة فتحٍ سريعة، وقد كانت المدن التي رفضت التسليم هي التي خُرّبت وسُبي أهلها.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالهجرة الكبرى\u003c/h4\u003e\u003cp class=\"ap\"\u003eبعد سقوط كل مدينةٍ كبيرة خرج منها من أراد الخروج، وكان الخروج في الغالب من العلماء والحرفيين والتجار، لأنهم كانوا يجدون في غرناطة أو في المغرب من يُقدّر علمهم أو صنعتهم. وقد كان في هذا نزيفٌ للبلاد، لأن المدينة التي تفقد حرفييها وعلماءها تفقد قدرتها على الحياة الاقتصادية والثقافية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد انتقل هؤلاء إلى فاس وتلمسان ومراكش وتونس، وكان منهم من بنى فيها دورًا وأنشأ فيها مدارس، وكان لهم أثرٌ في العمارة الأندلسية في المغرب. وقد بقي في المدن التي سقطت من بقي، وكانوا يُسمّون المدجّنين، وكانوا يعيشون في أحياءٍ خاصة بهم، ويُدفعون الجزية، ويُحافظون على دينهم سنوات، ثم ضُيّق عليهم بعد ذلك في القرن السادس عشر.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eلماذا نجت غرناطة\u003c/h4\u003e\u003cp class=\"ap\"\u003eنجت غرناطة لثلاثة أسباب: أنها عقدت عهدًا مع قشتالة صارت فيه تابعةً لها، وأنها كانت محصّنة تحصينًا طبيعيًّا في الجبال، وأنها كانت تُدفع لها الجزية فتُشبع خزانة الملك. وقد كان في هذا وضعٌ غريب: مملكةٌ إسلامية تبقى لأنها تابعة، وتُدفع عنها الحرب بالمال لا بالجيش.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان هذا الوضع يُشبه وضع الطوائف قبل قرنين، وقد قال المؤرخون إن غرناطة اشترت الزمن، وإن الزمن الذي اشترته استعملته في بناء قصر الحمراء وفي ازدهار العلم والأدب. وهذا هو العصر الذي تُعالجه الفصول التالية: عصر مملكةٍ صغيرةٍ عظيمة الثقافة، تعيش على هامش تاريخٍ انتهى.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eقرطبة\u003c/b\u003e\u003cspan\u003eسنة ١٢٣٦م في يد فرديناند الثالث\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eبلنسية\u003c/b\u003e\u003cspan\u003eسنة ١٢٣٨م في يد خايمي الأول\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eإشبيلية\u003c/b\u003e\u003cspan\u003eسنة ١٢٤٨م بعد حصارٍ طويل\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eعهد ابن الأحمر\u003c/b\u003e\u003cspan\u003eسنة ١٢٤٦م تابعًا لقشتالة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eما بقي\u003c/b\u003e\u003cspan\u003eمملكة غرناطة وحدها\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمدينة\u003c/th\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالفاتح\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eقرطبة\u003c/td\u003e\u003ctd\u003e١٢٣٦م\u003c/td\u003e\u003ctd\u003eفرديناند الثالث ملك قشتالة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eمرسية\u003c/td\u003e\u003ctd\u003e١٢٤٣م\u003c/td\u003e\u003ctd\u003eتابعةٌ ثم ضمّها قشتالة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eبلنسية\u003c/td\u003e\u003ctd\u003e١٢٣٨م\u003c/td\u003e\u003ctd\u003eخايمي الأول ملك أراغون\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eإشبيلية\u003c/td\u003e\u003ctd\u003e١٢٤٨م\u003c/td\u003e\u003ctd\u003eفرديناند الثالث بعد حصار\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eغرناطة\u003c/td\u003e\u003ctd\u003eبقيت\u003c/td\u003e\u003ctd\u003eبعهد تبعيةٍ وجزية\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eأَوَلَمَّا أَصَابَتْكُم مُّصِيبَةٌ قَدْ أَصَبْتُم مِّثْلَيْهَا قُلْتُمْ أَنَّىٰ هَٰذَا\u003c/p\u003e\u003ccite\u003eسورة آل عمران، الآية ١٦٥\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eسقطت قرطبة ثم بلنسية ثم إشبيلية في اثنتين وعشرين سنة، لا لأنها لم تُقاتل بل لأنها قاتلت وحدها. ولم يبقَ من الأندلس إلا غرناطة، وقد بقيت بعهد تبعيةٍ وجزية، لا بجيشٍ يردّ.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"marinids-and-strait","n":"بنو مرين والمضيق: آخر محاولة للإنقاذ","ic":"🌊","part":"القسم الرابع: معارك المصير","h":"\u003carticle class=\"ch3\" id=\"marinids-and-strait\" data-toc=\"بنو مرين والمضيق: آخر محاولة للإنقاذ\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الرابع: معارك المصير\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٤ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٤\u003ci\u003e.\u003c/i\u003e٤\u003c/span\u003e\n            \u003ch3\u003e🌊 بنو مرين والمضيق: آخر محاولة للإنقاذ\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eب\u003c/span\u003eعد سقوط إشبيلية صار المضيق هو الخط الأخير، وعبرت من المغرب ثلاث دولٍ لتحمي ما بقي: الموحدون ثم المرينيون ثم الغرناطيون أنفسهم. وقد انتصروا في معارك، ثم خسروا في معركةٍ واحدة على نهرٍ صغير قرب طريفة سنة ١٣٤٠م.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eقامت دولة بني مرين في المغرب سنة ١٢٤٤م على أنقاض الموحدين، وكان أول أمرائها عبد الحق، ثم صار أمراؤها يُلقّبون بأمير المسلمين، وكانت فاس عاصمتهم. وقد كانت دولتهم أقوى دولةٍ في المغرب في القرن الثامن الهجري، وكان لها أسطولٌ في المضيق، وكانت ترى في الأندلس امتدادًا طبيعيًّا لها، لأن التجارة في المضيق كانت مصلحةً مشتركة. وقد كانت دولتهم تُشبه الدول التي تقوم على الحدود: قوية في الحرب، دقيقة في الإدارة، وتعتمد على التجارة في المضيق اعتمادًا كبيرًا، ولهذا كان صراعها مع قشتالة صراعًا على البحر قبل أن يكون صراعًا على الأرض.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد عبر أبو يوسف يعقوب المريني إلى الأندلس سنة ١٢٧٥م، وكان قد استُنجد بأهل إشبيلية وبعض المدن، وكانت قشتالة في تلك السنوات في أزمةٍ داخلية بعد موت فرديناند الثالث. وقد انتصر المسلمون في وقعةٍ عند إستجة، وقُتل فيها قائد قشتالي كبير، وكان هذا النصر آخر نصرٍ كبير للمسلمين في الأندلس قبل غرناطة. وقد كان هذا النصر يُشبه نصر الأرك في طبيعته: انتصارٌ في ميدانٍ بجيشٍ جاء من الخارج، لم يُتبعه استقرارٌ في الحكم، لأن الدولة التي جاءت من المغرب كانت تعود إلى المغرب بعد انتهاء الحملة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد حاول المرينيون أن يُقيموا لأنفسهم قاعدةً في الجزيرة الخضراء وطريفة، وكان هذا تحصيلًا مهمًّا لأن من يملك ضفتي المضيق يملك حركة الجيوش. وقد حاصروا طريفة سنوات، ثم استطاعوا أن يأخذوها، وكان في هذا إعلانٌ بأن الأندلس ما زالت ساحةً مفتوحة، وأن الحرب لم تنتهِ بسقوط إشبيلية. وقد كان حصار طريفة طويلًا، وكان أهلها يصبرون على الجوع، وكانت قشتالة تُحاول أن تُنجدها من البحر، وكان في هذا الحصار مثالٌ على أن الحرب في الأندلس صارت حرب حصونٍ وموانئ لا حرب ميادين مفتوحة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في القرن الثامن الهجري صراعٌ طويل بين المرينيين وقشتالة على المضيق، وكانت المعارك تُخاض على البحر وعلى البرّ. وقد بلغ الصراع ذروته في عهد أبي الحسن المريني، الذي عبر بجيشٍ كبير سنة ١٣٤٠م، وكان يرى أن يُعيد الأندلس إلى المسلمين، وكان في جيشه جنودٌ من غرناطة ومن القبائل، وكانت قشتالة بقيادة ألفونسو الحادي عشر قد استعدّت بمساعدة البرتغال.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت المعركة على نهرٍ يُقال له نهر السلطان قرب طريفة، وقد انكسر الجيش المريني انكسارًا كبيرًا، وكان من أسباب الهزيمة أن الجنود الأندلسيين انسحبوا في أثناء القتال، وأن الجيش كان كبيرًا لكنه لم يكن منسجمًا. وقد كانت هذه المعركة هي آخر محاولةٍ جدّية لإنقاذ الأندلس من المغرب، وبعدها لم يبقَ إلا غرناطة وحدها. وقد كان من أسباب الهزيمة أيضًا أن الجيش المريني كان بعيدًا عن قواعده، وأن الإمدادات كانت تعبر المضيق في وقتٍ صارت فيه قشتالة تُراقب السواحل بأسطولٍ صغير لكنه فعّال.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان بعد هذه المعركة سقوط الجزيرة الخضراء سنة ١٣٤٤م، ثم سقطت طريفة، وصار المضيق في يد قشتالة، وكان في هذا معنى استراتيجي كبير: أن غرناطة صارت معزولة عن المغرب، وأن أي إمدادٍ من هناك صار يحتاج إلى موافقة قشتالة أو إلى أسطولٍ لا تملكه غرناطة. وقد كان هذا الحصار الجغرافي هو الذي جعل سقوط غرناطة مسألة وقت. وقد كان هذا الحصار الجغرافي أشدّ من أي معركة، لأن المملكة التي لا تستطيع أن تُصدّر ولا أن تستورد تفقد تدريجيًّا قدرتها على تسليح جيشها وإطعام مدنها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بقي في المصادر وصفٌ للمعارك التي خاضها المرينيون في الأندلس، وفيها أنهم كانوا يُرسلون الجيوش والأموال، وأنهم بنوا في الجزيرة الخضراء وفي فاس منشآت، وأنهم جلبوا معهم من الأندلس الحرفيين والعلماء. وقد كان في هذا تبادلٌ بين ضفتي المضيق جعل الثقافة الأندلسية تعيش في المغرب بعد أن ضعفت في موطنها، وهذا ما يُفسّر لماذا تُوجد إلى اليوم في فاس وتطوان وشفشاون آثارٌ أندلسية واضحة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه المحاولات درسٌ أخير: أن الأندلس لم تسقط لأن المسلمين كانوا أقلّ شجاعة، بل لأنهم كانوا أقلّ وحدةً في اللحظات الفاصلة. ففي كل معركةٍ كبيرة كان في الجيش المسلم فريقٌ ينسحب أو يُفاوض أو ينتظر نتيجة المعركة ليختار جانبه، وكان هذا هو الفرق بين جيشٍ يقاتل من أجل بلدٍ وجيشٍ يقاتل من أجل أمير. وقد كان في هذا المعنى عزاءٌ واتهامٌ في الوقت نفسه: عزاءٌ لأن السقوط لم يكن قدرًا محتومًا، واتهامٌ لأن الذين كانوا في الميدان لم يستغلّوا ما كان في أيديهم.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالمضيق في الاستراتيجيا\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان مضيق جبل طارق أهمّ ممرٍّ في غرب المتوسط، ومن يملك ضفتيه يملك التجارة والحرب في المنطقة. وقد كان المرينيون يُدركون هذا، فبنوا أسطولًا في طنجة وسبتة، وحاولوا أن يُثبتوا قواعد في الجزيرة الخضراء وطريفة، وكانوا يرون أن الدفاع عن الأندلس دفاعٌ عن المغرب نفسه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في سقوط الجزيرة الخضراء سنة ١٣٤٤م نهاية هذه الاستراتيجيا، لأن قشتالة صارت تُسيطر على المضيق من الشمال، وصار عبور الجيوش ممكنًا فقط بموافقتها. وهذا ما يجعل هذه السنة سنةً فاصلة في تاريخ الأندلس، مع أنها لا تُذكر كثيرًا في كتب التاريخ العامة. وقد كان في هذا الوضع درسٌ في الجغرافيا السياسية: أن المضيق لا يُحمى من ضفةٍ واحدة، وأن من يخسر ضفته الشمالية يخسر الطريق كله.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالسلطان والجيش المريني\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الجيش المريني جيشًا قبليًّا منظمًا، وكان يُعتمد فيه على قبائل زناتة وعلى الجند الأندلسي، وكان يُموّل من الغنائم ومن التجارة. وقد كان قويًّا في الهجوم ضعيفًا في الحملات الطويلة، لأن القبائل كانت تعود إلى ديارها بعد انتهاء الموسم، وكان هذا يُفسّر لماذا لم يستطع المرينيون أن يُقيموا حكمًا دائمًا في الأندلس.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في جيوش هذا العصر عنصرٌ ثالث هو المتطوّعة، وهم من يأتون للجهاد بلا راتب، وكانوا يُقاتلون بحماسٍ كبير لكنهم لا يخضعون لنظامٍ واحد. وقد كان في هذا اختلاطٌ بين جيش الدولة وجيش الشعب، وهو اختلاطٌ يُنتج حماسًا في البداية وانفراطًا في الأزمة، وقد ظهر هذا في معارك كثيرة من معارك الأندلس.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالبحر والسواحل\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الحرب في الأندلس حرب سواحل أيضًا: غاراتٌ على الموانئ، وأسرٌ للسفن، وتبادل أسرى، وكان في البحرية الأندلسية والمغربية أسطولٌ يُغير على سواحل الشمال. وقد كان في هذا الأسر تجارةٌ كبيرة، وكانت الفدية مصدر مالٍ للطرفين، وكان في المدن الساحلية أحياءٌ تُعيش على الفداء والترجمة بين الأسرى.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان ضعف الأسطول بعد سقوط إشبيلية والجزيرة الخضراء سببًا في سقوط غرناطة اقتصاديًّا، لأن تجارتها كانت تعتمد على البحر، وكانت قشتالة تُغلق عليها الموانئ سنةً بعد سنة. ولهذا يُقال إن غرناطة لم تسقط بالحصار الأخير فقط، بل بسلسلة حصارٍ بحريٍّ بدأت قبل ذلك بمئة سنة.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eقيام المرينيين\u003c/b\u003e\u003cspan\u003eسنة ١٢٤٤م في المغرب\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالعبور الأول\u003c/b\u003e\u003cspan\u003eسنة ١٢٧٥م ونصر إستجة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمعركة النهر\u003c/b\u003e\u003cspan\u003eسنة ١٣٤٠م على نهر السلطان\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسقوط الجزيرة\u003c/b\u003e\u003cspan\u003eسنة ١٣٤٤م بيد قشتالة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالنتيجة\u003c/b\u003e\u003cspan\u003eعزل غرناطة عن المغرب\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e١٢٤٤م\u003c/td\u003e\u003ctd\u003eقيام دولة بني مرين\u003c/td\u003e\u003ctd\u003eقوةٌ جديدة في المغرب\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٢٧٥م\u003c/td\u003e\u003ctd\u003eعبور أبي يوسف ونصر إستجة\u003c/td\u003e\u003ctd\u003eآخر نصرٍ كبير في الأندلس\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٣٤٠م\u003c/td\u003e\u003ctd\u003eمعركة نهر السلطان\u003c/td\u003e\u003ctd\u003eانكسار الجيش المريني\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٣٤٤م\u003c/td\u003e\u003ctd\u003eسقوط الجزيرة الخضراء\u003c/td\u003e\u003ctd\u003eالمضيق في يد قشتالة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٣٥٠م\u003c/td\u003e\u003ctd\u003eحصار جبل طارق\u003c/td\u003e\u003ctd\u003eالطاعون يقتل ملك قشتالة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eوَأَعِدُّوا لَهُم مَّا اسْتَطَعْتُم مِّن قُوَّةٍ\u003c/p\u003e\u003ccite\u003eسورة الأنفال، الآية ٦٠\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eعبر المرينيون المضيق ثلاث مرات لينقذوا ما بقي من الأندلس، وانتصروا في إستجة ثم انكسروا على نهر السلطان سنة ١٣٤٠م. وبسقوط الجزيرة الخضراء صار المضيق في يد قشتالة، وصارت غرناطة معزولةً تُنتظر دورها.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-5","n":"القسم الخامس: غرناطة والنهاية","ic":"","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-5\" style=\"--c:#B0304A\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🏰\u003c/div\u003e\n      \u003ch2\u003eالقسم الخامس: غرناطة والنهاية\u003c/h2\u003e\n      \u003cp\u003eبقيت غرناطة قرنين ونصفًا بعد سقوط إشبيلية، وكانت في الظاهر مملكةً تابعة، وفي الباطن آخر بقعةٍ في أوروبا يُرفع فيها الأذان. وفي هذه القرون بُني قصر الحمراء، وكُتبت أعظم كتب الأندلس، ثم جاء الحصار الأخير فانتهى كل شيء في يومٍ واحد.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#nasrid-rise\"\u003eبنو الأحمر وقيام غرناطة\u003c/a\u003e\u003ca href=\"#alhambra\"\u003eقصر الحمراء: الجنة المحصّنة\u003c/a\u003e\u003ca href=\"#granada-life\"\u003eالعلم والأدب في غرناطة\u003c/a\u003e\u003ca href=\"#the-last-war\"\u003eالحرب الأخيرة وسقوط غرناطة\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"nasrid-rise","n":"بنو الأحمر وقيام غرناطة","ic":"🕌","part":"القسم الخامس: غرناطة والنهاية","h":"\u003carticle class=\"ch3\" id=\"nasrid-rise\" data-toc=\"بنو الأحمر وقيام غرناطة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الخامس: غرناطة والنهاية\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ١ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٥\u003ci\u003e.\u003c/i\u003e١\u003c/span\u003e\n            \u003ch3\u003e🕌 بنو الأحمر وقيام غرناطة\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي سنة ١٢٣٨م دخل محمد بن الأحمر غرناطة وأعلنها مملكته، وكان قد عقد مع قشتالة عهدًا يكون فيه تابعًا. وبهذا العهد عاشت غرناطة قرنين ونصفًا، وبه أيضًا صارت آخر من يُسأل عن الأندلس.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان محمد بن يوسف بن نصر، المعروف بابن الأحمر، من أسرةٍ عربية من بني خزرج، وكانت أسرته في أرجدونة من أعمال إستجة، وقد بدأ يبني سلطته في الشرق في مدينة أرجونة ثم في جيّان، وكان يستعمل في ذلك ما يستعمله كل من يبني دولةً في وقت الفتنة: أن يتحالف مع من يستطيع، وأن يُقاتل من لا يستطيع أن يتحالف معه. وقد كان في هذا البناء درسٌ في السياسة: أن من يُريد أن يبقى في زمن الضعف عليه أن يعرف ما يُضحّي به، وأن يعرف أيضًا أن التضحية الأولى لا تكون في الأرض بل في الكرامة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سنة ١٢٣٨م دخل غرناطة، وكانت المدينة قد صارت مركزًا للمهاجرين من قرطبة وإشبيلية وبلنسية، وكان فيها من الحرفيين والعلماء والجند من لا يجد مكانًا في المدن التي سقطت. وقد وجد ابن الأحمر في هذه المدينة ما يحتاجه: حصنًا طبيعيًّا في جبل، وسكانًا يريدون الأمن، وموقعًا بعيدًا عن خطّ الزحف القشتالي المباشر. وقد كان في هذا الموقع معنى استراتيجي: أن المدينة محميةٌ بجبلٍ ونهر، وأن الوصول إليها يحتاج إلى جهدٍ كبير، وكان هذا هو السبب الأول في أنها عاشت أطول من كل مدن الأندلس.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد عقد مع فرديناند الثالث سنة ١٢٤٦م عهدًا صار فيه تابعًا لملك قشتالة، وكان في العهد أن يدفع جزية سنوية وأن يحضر بجنده في حروب الملك، وأن يُسلّم بعض الحصون. وقد وفى ابن الأحمر بهذا العهد وفاءً كاملًا، وأعان القشتاليين في حصار إشبيلية سنة ١٢٤٨م، وكان في هذا العمل ما يُغضب المسلمين في الأندلس، لكنه كان في نظره ثمن بقاء مملكته. وقد كان في هذا الوفاء ثمنٌ آخر: أن غرناطة صارت في نظر المسلمين في المغرب والمشرق مملكةً تُعين عدوّها، وكان هذا يُضعف شرعيتها في قلوب الناس، ويجعل من يُهاجمها يُهاجمها بلا حرارة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان هذا الاختيار محلّ جدلٍ في التاريخ الإسلامي: فمن المؤرخين من رآه خيانةً للأندلس، ومنهم من رآه سياسةً واقعية أنقذت ما يمكن إنقاذه. والحقيقة أن المملكة التي قامت في غرناطة كانت تعرف أنها لا تستطيع أن تُقاوم قشتالة وحدها، وأن كل من حاول ذلك من ملوك الطوائف خسر مملكته، وأن البقاء بعهدٍ أفضل من الفناء بكرامة. وقد كان في هذا الجدل ما يُشبه الجدل الذي دار حول معاهدات الصلح في كل تاريخ المسلمين: أن تُقبل التبعية لتحفظ الأنفس والأرض، أو أن تُرفض وتُخسر الأنفس والأرض معًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بنى ابن الأحمر في غرناطة أسس الدولة: فبنى قلعة الحمراء، ونظّم الجيش، وأقام إدارةً للخراج، واستقدم العلماء والحرفيين، وأقطع الأرض للمهاجرين، وكان في سياسته ما يُشبه سياسة عبد الرحمن الداخل: أن يبني جيشًا يخصّه لا يعتمد على قبيلة، وأن يجعل من المدينة مركزًا لا معسكرًا. وقد كان في هذه السياسة ما جعل غرناطة تُشبه قرطبة في أول أمرها: أن تُبنى الدولة على جيشٍ يخصّ السلطان، وعلى إدارةٍ تُحصّل المال، وعلى مدينةٍ تُستقطب الناس من كل ناحية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت غرناطة في هذا العهد مدينةً من طبقات: عربٌ من المهاجرين الأوائل، وأندلسيون من المدن الساقطة، وبربرٌ من المغرب، وصقالبة، ومستعربون، ويهود، وكان في كل طبقةٍ حرفتها وحيّها. وقد كان هذا التنوّع مصدر ثراءٍ ثقافي ومصدر نزاعٍ سياسي في الوقت نفسه، لأن كل طبقةٍ كانت تُنافس الأخرى على مناصب الدولة. وقد كان في هذا التنوّع ما جعل المدينة تُنتج ثقافةً مركّبة، فيها من القرطبي والبلنسي والإشبيلي ما لا يُوجد في مدينةٍ واحدة، وكان في هذا تعويضًا عن صغر المساحة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت المملكة تُدار بنظامٍ دقيق: فالسلطان في الحمراء، والوزير يُدير الديوان، والحاجب يُشرف على القصر، والقاضي ينظر في الأحكام، وكان في المدينة مجلسٌ من الأعيان، وكانت الأحياء تُدار من قبل رؤسائها. وقد كان هذا النظام يُشبه نظام المدن الإسلامية في المغرب، لكنه كان أكثر تعقيدًا بسبب كثرة الوافدين. وقد كان في هذا النظام ما يُشبه المدن الإسلامية في المغرب، لكنه كان أكثر حساسيةً لأن المملكة صغيرة، ولأن كل منصبٍ فيها كان موضع تنافسٍ بين الأسر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت المملكة في القرنين الأولين قويةً نسبيًّا، ووصلت في عهد محمد الخامس إلى ذروةٍ ثقافية وعمرانية، ثم بدأت في القرن الخامس عشر سلسلةٌ من الحروب الأهلية بين أسر النبلاء، وكانت هذه الحروب هي التي أضعفتها قبل أن تُهاجمها قشتالة. وقد قال مؤرخو الأندلس إن غرناطة سقطت مرتين: مرةً حين قتلت رجالها في حروبها الداخلية، ومرةً حين دخلها فرديناند وإيزابيلا.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eعهد التبعية: ثمن البقاء\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت التبعية في هذا العهد تعني أمورًا محدّدة: جزيةٌ سنوية تُدفع في موعدها، وجندٌ يُرسل عند الطلب، وعدم التحالف مع أعداء قشتالة، وتسليم حصونٍ حدودية عند الحاجة. وقد كانت هذه الشروط ثقيلة، لكنها كانت أقلّ ثقلًا من الحرب، وكانت تُعطي غرناطة شرعية البقاء في نظر جارتها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت التبعية تُجدد في كل عهدٍ جديد: فكلما مات سلطانٌ في غرناطة أو ملكٌ في قشتالة، أُعيد التفاوض على الشروط، وكانت الشروط تزداد ثقلًا مع ضعف غرناطة. ولهذا كانت التبعية نظامًا يتحرّك في اتجاهٍ واحد: من عهدٍ مقبول إلى عهدٍ مُذلّ، ومن جزيةٍ رمزية إلى جزيةٍ ثقيلة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eغرناطة مدينة المهاجرين\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت غرناطة في القرن السابع الهجري مدينةً جديدةً نسبيًّا، ولم تكن لها مكانة قرطبة ولا إشبيلية، لكنها صارت في قرنٍ واحدٍ من أكبر مدن الأندلس بسبب الهجرة. وقد جاء إليها من قرطبة من جاء بعد سقوطها سنة ١٢٣٦م، ومن إشبيلية بعد ١٢٤٨م، ومن بلنسية بعد ١٢٣٨م، وكان في هؤلاء من يحمل صنعةً أو كتابًا أو نسبًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه الهجرة ما يُشبه نقل عاصمة: فقد انتقل إلى غرناطة الورّاقون والخطّاطون والبنّاؤون والنسّاجون وصنّاع الحرير، وانتقل معهم الذوق الأندلسي في البناء والزخرفة والغناء. ولهذا يُقال إن غرناطة لم تكن وريثة الأندلس في السياسة فقط، بل كانت وريثتها في الذوق أيضًا، وهذا ما يُرى في الحمراء.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالحروب الأهلية\u003c/h4\u003e\u003cp class=\"ap\"\u003eفي القرن الخامس عشر دخلت غرناطة في سلسلةٍ من الحروب الأهلية بين أسر النبلاء، وكانت هذه الأسر تتكوّن من كبار القادة والوزراء، وكان لكل أسرةٍ جندها وأنصارها في الأحياء. وقد كان الصراع على منصب الوزارة أو على ولاية العهد، لكنه كان في الحقيقة صراعًا على من يُدير المملكة الصغيرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد استغلّت قشتالة هذه الحروب استغلالًا كاملًا: فكانت تدعم فريقًا ضد فريق، وتستقبل اللاجئين، وتُوقع معاهدات مع الطامعين، وكانت هذه السياسة أذكى من الحرب المباشرة، لأنها جعلت غرناطة تُهدم من داخلها. وقد قال أحد مؤرخي هذا العهد إن مملكة غرناطة لم تُفتح بالسيف بل بالشقاق.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالتأسيس\u003c/b\u003e\u003cspan\u003eسنة ١٢٣٨م على يد محمد بن الأحمر\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالعهد\u003c/b\u003e\u003cspan\u003eسنة ١٢٤٦م تابعًا لقشتالة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمساعدة\u003c/b\u003e\u003cspan\u003eجنده في حصار إشبيلية ١٢٤٨م\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالذروة\u003c/b\u003e\u003cspan\u003eعهد محمد الخامس في القرن الثامن\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالضعف\u003c/b\u003e\u003cspan\u003eحروب أهلية في القرن التاسع\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e١٢٣٨م\u003c/td\u003e\u003ctd\u003eدخول ابن الأحمر غرناطة\u003c/td\u003e\u003ctd\u003eقيام المملكة النصرية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٢٤٦م\u003c/td\u003e\u003ctd\u003eعهد جيّان\u003c/td\u003e\u003ctd\u003eتبعيةٌ وجزية لقشتالة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٢٤٨م\u003c/td\u003e\u003ctd\u003eالمشاركة في حصار إشبيلية\u003c/td\u003e\u003ctd\u003eضمان البقاء بثمنٍ سياسي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٣٤٤م\u003c/td\u003e\u003ctd\u003eبناء قصر الحمراء\u003c/td\u003e\u003ctd\u003eذروة العمارة النصرية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٤٦٤م\u003c/td\u003e\u003ctd\u003eبداية حروب الأسر\u003c/td\u003e\u003ctd\u003eضعفٌ داخلي قبل الحرب الأخيرة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eوَأَن لَّيْسَ لِلْإِنسَانِ إِلَّا مَا سَعَىٰ\u003c/p\u003e\u003ccite\u003eسورة النجم، الآية ٣٩\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eقامت غرناطة على عهد تبعيةٍ مع قشتالة، وعاشت به قرنين ونصفًا، ودفعت ثمنه مشاركةً في حصار إشبيلية. ولم تسقط بالحرب الخارجية وحدها، بل سقطت بعد أن أكلت حروبها الداخلية رجالها.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"alhambra","n":"قصر الحمراء: الجنة المحصّنة","ic":"🏛️","part":"القسم الخامس: غرناطة والنهاية","h":"\u003carticle class=\"ch3\" id=\"alhambra\" data-toc=\"قصر الحمراء: الجنة المحصّنة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الخامس: غرناطة والنهاية\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٢ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٥\u003ci\u003e.\u003c/i\u003e٢\u003c/span\u003e\n            \u003ch3\u003e🏛️ قصر الحمراء: الجنة المحصّنة\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eع\u003c/span\u003eلى تلٍّ يُشرف على غرناطة بُني قصرٌ وحصنٌ في وقتٍ واحد: قاعةُ عرشٍ تُستقبل فيها السفارات، وأروقةٌ فيها الماء والظل، وأسوارٌ وأبراج. وقد كتبوا على جدرانه: لا غالب إلا الله، وكانت هذه الكلمة هي اعتراف مملكةٍ تعرف أنها ستُغلب.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eبدأ بناء الحمراء في عهد محمد بن الأحمر في القرن السابع الهجري، وكان في موضعها حصنٌ قديم يُسمى الحمراء، وقد بُنيت على مرحلتين كبيرتين: مرحلةٌ في القرن السابع الهجري بُنيت فيها الأسوار والأبراج والقلعة، ومرحلةٌ في القرن الثامن الهجري بُنيت فيها القصور والقاعات، وكان أكثر من بنى فيها يوسف الأول ومحمد الخامس. وقد كان في هذا التصميم ما يُشبه تخطيط القلاع الأوروبية، لكنه كان مختلفًا في الوظيفة، لأن الحمراء كانت مدينةً كاملة لا معسكرًا، وكان فيها من الحياة اليومية ما لا يكون في القلعة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت الحمراء مدينةً ملكية كاملة لا قصرًا منفردًا: فيها القلعة العسكرية في أعلى التلّ، وفيها القصور للسلطان، وفيها دورٌ للوزراء والحجّاب والجند، وفيها مسجدٌ جامع، وفيها حمّامات ومصانع وحدائق، وفيها سورٌ يُطوّقها بأبراجٍ كثيرة. وقد كان في هذا التخطيط معنى دفاعي واضح: أن السلطان يعيش في حصنٍ لا في قصرٍ مفتوح. وقد كان في برج السفراء معنى آخر: أنه كان أعلى نقطة في القصر، وكان من يقف فيه يرى المدينة كلها، وكان في هذا إعلانٌ بأن السلطان يرى ولا يُرى.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بُنيت قاعة السفراء في برجٍ كبير، وكانت سقفها من خشبٍ مُزخرف، وفيها نوافذ تُطلّ على المدينة والوادي، وكان يجلس فيها السلطان لاستقبال الرسائل والوفود. وقد كان في القاعة أربع نوافذ تُطلّ على أربع جهات، وكان في تصميمها معنى رمزي: أن السلطان يرى من مكانه كل ما يحيط به، وأن من يدخل عليه يرى نفسه في مركز العالم. وقد كان في هذه النوافذ الأربع حسابٌ معماري دقيق: أنها تُدخل الضوء من جهات مختلفة في أوقات مختلفة، وكانت القاعة تُضاء بالشمس أكثر مما تُضاء بالمشاعل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بُنيت في عهد محمد الخامس صحن الأسود، وكان فيه اثنا عشر أسدًا من الرخام تُحيط بحوضٍ في الوسط، وكانت المياه تُجري في أربع قنواتٍ نحو الحوض، وكان في هذا التصميم رمزٌ يُشبه الجنة في الوصف القرآني: أنهارٌ تجري من تحت القصور، وظلٌّ وماءٌ وثمر. وقد كان الصحن يُستخدم للاستقبال والاحتفال، وكان في الليل يُضاء بالمشاعل، وكان الماء يُحدث صوتًا يُسمع في القاعات.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت الزخرفة في الحمراء لغةً كاملة: نقوشٌ جصّية على الجدران، وخطٌّ عربي يُغطّي المساحات، ومقرنصاتٌ في الأسقف، وقيشاني ملوّن في الأسفل. وقد كان في هذا الزخرف ما يُشبه الشعر: تكرارٌ وإيقاعٌ وتنويع، وكانت الجدران تُقرأ كما تُقرأ القصيدة، لأن فيها آياتٍ وأشعارًا وأسماء سلاطين، وكان الغرض منها أن تُذكّر الداخل بمن بنى ومن حكم. وقد كانت الزخرفة تُنفّذ بأيدي حرفيين من غرناطة ومن المدن التي سقطت، وكان في هذا دليلًا على أن الحرفة الأندلسية لم تنقطع بسقوط المدن بل انتقلت إلى حيث بقي السلطان.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت الحمراء تُعبّر عن حال مملكةٍ صغيرة في زمن انحسار: أنها لا تستطيع أن تبني جيشًا كبيرًا، فتبني مكانًا يبقى، وأنها لا تستطيع أن تُوسّع حدودها، فتُوسّع جدرانها بالزخرفة. ولهذا يُقال إن الحمراء كانت آخر عملٍ حضاري كبير في الأندلس، وإنها بُنيت بمال الجزية وبحرفة المهاجرين، وإنها في كل حجرٍ منها أثرٌ من مدينةٍ سقطت. وقد كان في هذا البناء ما يُشبه الوصية: أن المملكة التي تعرف أنها ستنتهي تُريد أن تترك أثرًا يُشبهها، وأن تُثبت أن الضعف السياسي لا يعني ضعف الذوق.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بقي القصر بعد سقوط غرناطة سنة ١٤٩٢م، لأنه صار مقرًّا للملوك الكاثوليك ثم للولاة، وقد أُضيفت إليه في القرن السادس عشر بنايةٌ كبيرة بقصر كارلوس الخامس، وكانت هذه الإضافة غريبةً عن روح المكان، لأنها بُنيت على الطراز الإيطالي في وسط القصر الإسلامي. وقد كان في هذا الاستمرار والهدم معًا صورةٌ لما جرى للأندلس: أن يُحفظ البناء ويُلغى أهله.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد صار القصر في القرنين الثامن عشر والتاسع عشر موضوعًا للرحّالة الأوروبيين، وكانوا يكتبون عنه ويصفونه ويُقارنونه بالعمارة القديمة، وكان من هؤلاء من رأى فيه الشرق كله. وقد أدّى هذا الاهتمام إلى ترميمه في القرن التاسع عشر ثم إلى تسجيله في قائمة التراث العالمي، وصار اليوم من أكثر الآثار زيارةً في أوروبا، وهذا مصيرٌ غريب لبناءٍ أُقيم ليُخفي ضعف مملكة.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالماء في التصميم\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الماء في الحمراء عنصرًا معماريًّا أساسيًّا لا زينة: يجري في قنواتٍ تحت الأرض، ويظهر في أحواضٍ في وسط القاعات، ويُستخدم في التبريد، ويُحدث صوتًا يُسمع في الغرف. وقد كان هذا ضروريًّا في مناخٍ حارّ، وكان في الوقت نفسه رمزًا دينيًّا وجماليًّا، لأن الماء في القرآن علامةٌ على الجنة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت هندسة الماء في الحمراء تُشبه هندسة الدولة: قنواتٌ تُدار من مصدرٍ واحد، وتوزيعٌ دقيق على الأماكن، وحسابٌ للسريان والضغط. وقد كان هذا يحتاج إلى مهندسين وحرفيين، وكان في المملكة الصغيرة من هؤلاء ما يدلّ على أن الحضارة تُقاس بالحرفة لا بالمساحة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالزخرفة كخطاب\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت جدران الحمراء مكتوبةً بالكامل تقريبًا: آياتٌ قرآنية، وأشعارٌ تُمدح السلطان، وشعاراتٌ مثل شعار بني نصر، وعباراتٌ تتكرّر مثل ولا غالب إلا الله. وقد كان الغرض من هذا أن يقرأ الداخل رسالةً محدّدة: أن هذا المكان مكان سلطانٍ مسلم، وأنه حصنٌ لا قصر لهو.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في تكرار العبارة نفسها على مساحاتٍ واسعة معنى آخر: أن الزخرفة تُغطّي الفراغ فلا يبقى للعين مكانٌ تستريح فيه، وهذا ما يُسمّى في فنّ العمارة الإسلامية بالخوف من الفراغ. وقد كان هذا الأسلوب يُنتج إحساسًا بالامتلاء والهيبة، وكان في الوقت نفسه إعلانًا بأن المملكة تُخفي ضعفها بكثرة الجمال.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالحمراء بعد ١٤٩٢م\u003c/h4\u003e\u003cp class=\"ap\"\u003eبعد سقوط غرناطة صارت الحمراء مقرًّا للحكم الجديد، وقد أُجريت فيها تعديلات: تحويل المسجد إلى كنيسة، وإضافة أجراس، وبناء قصرٍ جديد للإمبراطور كارلوس الخامس داخل الأسوار. وقد كان في هذه التعديلات إعلانٌ بأن المكان قد غيّر دينه وسلطانه، لكنه لم يُهدم، لأن جماله كان أكبر من أن يُهدم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد تعرّض القصر في القرون التالية للإهمال والزلازل، ثم رُمّم في القرن التاسع عشر على يد معماريين استعادوا أجزاءً منه، وكان في هذا الترميم بعض الاجتهاد الذي لا يُشبه الأصل. وقد بقي مع ذلك أقرب صورةٍ لنا إلى عمارة الأندلس في عصرها الأخير، ولهذا يُدرس في جامعات العالم كوثيقةٍ لا كبناءٍ فقط.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالبداية\u003c/b\u003e\u003cspan\u003eالقرن السابع الهجري مع ابن الأحمر\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالتوسّع\u003c/b\u003e\u003cspan\u003eيوسف الأول ومحمد الخامس\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالعناصر\u003c/b\u003e\u003cspan\u003eقاعة السفراء وصحن الأسود والحمّامات\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالشعار\u003c/b\u003e\u003cspan\u003eلا غالب إلا الله\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eبعد السقوط\u003c/b\u003e\u003cspan\u003eقصر ملكي ثم أثرٌ عالمي\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالجزء\u003c/th\u003e\u003cth\u003eوظيفته\u003c/th\u003e\u003cth\u003eما يميّزه\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالقلعة\u003c/td\u003e\u003ctd\u003eالحماية والمقر العسكري\u003c/td\u003e\u003ctd\u003eأبراج وسور على أعلى التلّ\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eقاعة السفراء\u003c/td\u003e\u003ctd\u003eاستقبال الوفود\u003c/td\u003e\u003ctd\u003eسقف خشبي وأربع نوافذ\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eصحن الأسود\u003c/td\u003e\u003ctd\u003eالاستقبال والاحتفال\u003c/td\u003e\u003ctd\u003eأسود رخام وأربع قنوات\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالحمّامات\u003c/td\u003e\u003ctd\u003eالطهارة والاجتماع\u003c/td\u003e\u003ctd\u003eقباب مثقّبة وأرضيات رخام\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eقصر كارلوس\u003c/td\u003e\u003ctd\u003eإضافة بعد السقوط\u003c/td\u003e\u003ctd\u003eطراز إيطالي داخل الأسوار\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eجَنَّاتٍ تَجْرِي مِن تَحْتِهَا الْأَنْهَارُ خَالِدِينَ فِيهَا\u003c/p\u003e\u003ccite\u003eسورة البيّنة، الآية ٨\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eبُنيت الحمراء حصنًا وقصرًا في وقتٍ واحد، وجُعل الماء والزخرفة فيها خطابًا سياسيًّا لا زينةً فقط. وقد بقي البناء بعد سقوط مملكته، لأنه صار مقرًّا للسلطة الجديدة، وبهذا حُفظ الحجر وضاع أهله.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"granada-life","n":"العلم والأدب في غرناطة","ic":"📖","part":"القسم الخامس: غرناطة والنهاية","h":"\u003carticle class=\"ch3\" id=\"granada-life\" data-toc=\"العلم والأدب في غرناطة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الخامس: غرناطة والنهاية\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٣ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٥\u003ci\u003e.\u003c/i\u003e٣\u003c/span\u003e\n            \u003ch3\u003e📖 العلم والأدب في غرناطة\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي مملكةٍ صغيرة تُحيط بها ممالك أكبر، عاش في غرناطة ابن الخطيب وابن خلدون وابن زمرك، وكُتبت فيها كتبٌ في التاريخ والطب والشعر، وكانت المدينة تُصدّر الحرير إلى أوروبا وتستورد الكتب من المشرق.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكانت غرناطة في القرن الثامن الهجري واحدة من أهمّ مدن العلم في الغرب الإسلامي، وكان في جامعها درسٌ للفقه والحديث والقراءات، وكان في مدارسها تدريسٌ للطب والرياضيات والفلك، وكان في مكتباتها ما نُقل من قرطبة وإشبيلية وبلنسية. وقد كان العلماء يأتون إليها من المغرب ومن تلمسان ومن فاس، وكان بعضهم يُدرّس فيها ثم يعود إلى بلده بكتبٍ نسخها فيها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان لسان الدين ابن الخطيب أبرز رجال هذا العهد: كان وزيرًا لمحمد الخامس، وكان كاتبًا وشاعرًا ومؤرخًا وطبيبًا، وكتب في تاريخ غرناطة كتابًا يُسمّى الإحاطة في أخبار غرناطة، وهو من أهمّ ما كُتب عن المدينة وأهلها، وفيه تراجمٌ لرجالها وعلمائها وشعرائها، ولو لم يُكتب لضاع كثير من أخبار هذا العهد. وقد كان في هذا الكتاب ما يُشبه أرشيف المدينة: فيه أسماء الرجال والنساء، وفيها أخبار المجالس والفتن، ولو لم يُكتب لضاع كثير من تاريخ غرناطة الاجتماعي لا السياسي فقط.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد زار ابن خلدون غرناطة سنة ١٣٦٢م، وكان قد جاء من المغرب، وقد استقبله ابن الخطيب استقبالًا حافلًا، وقد أُرسل في سفارةٍ إلى إشبيلية للقاء ملك قشتالة، وكان في هذه السفارة ما يدل على أن غرناطة كانت تُدير علاقاتها الدبلوماسية بعنايةٍ كبيرة رغم صغرها. وقد ذكر ابن خلدون هذه الزيارة في سيرته، وفيها وصفٌ للمدينة وللبلاط وللعلماء. وقد كان في هذه الزيارة أثرٌ في كتابة ابن خلدون، لأنه رأى في غرناطة نموذجًا لدولةٍ صغيرة تُدير نفسها بالسياسة لا بالقوة، وهذا النموذج يظهر في تحليله للدول في مقدمته.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان ابن زمرك شاعرًا وكاتبًا في بلاط محمد الخامس، وكان يكتب الرسائل والقصائد التي تُنقش على جدران الحمراء، وكان في شعره وصفٌ للقصر وللماء وللزخرفة، وله قصائد في المدح والوصف تُعدّ من أجمل ما كُتب في الأندلس في هذا الباب. وقد كان في هذا العهد ما يُسمّى بشعر المناسبة: قصيدةٌ تُكتب لبناءٍ أو لفتحٍ أو لعيد، وكان الشعر بذلك جزءًا من العمارة نفسها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت في غرناطة صناعاتٌ مشهورة: الحرير وكان أكبر صادراتها، والسكر وكان يُزرع في السهول الساحلية، والخزف وكان في مالقة نوعٌ منه يُصدَّر إلى أوروبا، والجلود والمعادن. وقد كان في المدينة سوقٌ كبير يُسمّى سوق الحرير، وكان فيها تجارٌ من جنوة وبيزا وبرشلونة، وكانت التجارة مع أوروبا تُدخل الذهب وتُخرج الحرير، وكان في هذا اقتصادٌ يُشبه اقتصاد الدول الصغيرة التي تعيش على الصنعة لا على الأرض.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت اللغة العربية في غرناطة لغة العلم والإدارة، وكانت اللغة القشتالية تُستعمل في التجارة مع الشمال، وكان في المدينة مترجمون يعملون بين اللغتين، وكان في البلاط كتّابٌ يعرفون اللاتينية. وقد كان في هذا دليلًا على أن المدن الحدودية تُنتج لغاتٍ مختلطة، وأن العربية لم تكن لغةً معزولة بل كانت لغةً في حوارٍ دائم مع لغات الجوار. وقد كان في هذا الاقتصاد ما جعل المدينة تُشبه دول المدن الإيطالية: تعيش على الصنعة والتجارة، وتحتاج إلى أسواقٍ مفتوحة، وتضعف إذا أُغلقت الحدود.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت المرأة في غرناطة حاضرةً في الحياة الثقافية أكثر مما يُتوقّع، فقد كانت في المدينة شاعراتٌ وعالماتٌ ومُحدّثات، وكانت بعض النساء تُدرّس في بيوتها، وكان في البلاط نساءٌ لهنّ أثرٌ في السياسة. وقد بقي من هذا أخبارٌ في كتب التراجم، وفيها أن بعض نساء غرناطة كنّ يكتبن الشعر ويُجِدن الخطّ، وهذا يُصحّح صورةً شائعة عن انغلاق المجتمع الأندلسي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان العلم في غرناطة في القرن التاسع الهجري يتراجع مع تراجع الدولة: فالحروب الأهلية أوقفت الإنفاق على المدارس، وهاجر كثير من العلماء إلى فاس وتلمسان، وصار في المدينة من يُشتغل بالعلم بلا راعٍ. وقد كان في هذا مقدمةً لما جرى بعد ١٤٩٢م، لأن المدينة التي فقدت علماءها قبل سقوطها لم تستطع أن تُدافع عن ثقافتها بعده، وكانت أول ما فُقد بعد السقوط هو التعليم بالعربية.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eابن الخطيب: وزيرٌ يكتب التاريخ\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان ابن الخطيب من أسرةٍ ذات مكانة في غرناطة، وقد دخل السياسة في شبابه، وصار وزيرًا لمحمد الخامس، وكان في منصبه هذا يُدير الدولة ويكتب رسائلها، وكان في الوقت نفسه يُصنّف الكتب. وقد كتب في التاريخ والطب والفلسفة والأدب، وكان من أغزر كتّاب الأندلس إنتاجًا، وكان في كتابته أسلوبٌ فنيٌّ عالٍ يُسمّى السجع والبديع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد اتُّهم في آخر عمره بأمورٍ في العقيدة، فسُجن ثم خرج إلى المغرب، وقُتل في فاس سنة ١٣٧٤م في سجنٍ، وكان في مقتله أثرٌ في الثقافة الأندلسية، لأن رجلًا بهذا الإنتاج لم يُكمل ما بدأه. وقد بقي كتابه الإحاطة مصدرًا أساسيًّا لكل من كتب عن غرناطة بعده، وهذا هو الخلود الذي يُمكن أن يناله كاتب.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالحرير والاقتصاد\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الحرير أهمّ صناعةٍ في غرناطة، وكان يُزرع في الريف ويُنسج في المدينة ويُصبغ ويُصدَّر إلى أوروبا. وقد كانت هذه الصناعة تُشغّل أعدادًا كبيرة من الحرفيين، وكانت تُنتج أنواعًا مختلفة بحسب الجودة، وكانت تُباع في أسواق جنوة وبرشلونة ومونبلييه، وكان في هذا الاقتصاد ما جعل غرناطة قادرةً على دفع الجزية لقشتالة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا الاقتصاد خطرٌ سياسي: أن تعتمد مملكةٌ صغيرة على سوقٍ خارجية تُحدّد سعر سلعتها، وأن تكون هذه السوق في يد من يُحاربها. وقد ظهر هذا في الحرب الأخيرة، حين أُغلقت الطرق وأُوقف التبادل، فانهارت الصناعة قبل أن ينهار الجيش، وهذا ما يُفسّر سرعة استسلام المدينة بعد طول حصار.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالمدارس والنسخ\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان في غرناطة مدارسُ تُسمّى المساجد والمدارس، وكان التعليم فيها مجانيًّا في الغالب، لأن الأوقاف كانت تُموّله. وكان الطالب يبدأ بحفظ القرآن ثم النحو ثم الفقه، ثم يتخصّص في علمٍ من العلوم، وكانت الإجازة تُعطى بعد سنوات من الدراسة، وكانت رحلة الطلب إلى المشرق أو المغرب جزءًا من التكوين.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت المكتبات في غرناطة تُنسخ فيها الكتب وتُوقف على المساجد، وكان في المدينة ورّاقون يعملون بأجرة، وكانت الكتب تُستعار وتُنسخ. وقد بقي من هذا التراث مخطوطاتٌ في مكتبات العالم، وفيها أسماء نُسّاخٍ من غرناطة، وهذا يُبيّن أن المدينة كانت تُنتج ثقافةً مكتوبة لا شفوية فقط.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eابن الخطيب\u003c/b\u003e\u003cspan\u003eوزيرٌ ومؤرخٌ وصاحب الإحاطة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eابن خلدون\u003c/b\u003e\u003cspan\u003eزار غرناطة سنة ١٣٦٢م\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eابن زمرك\u003c/b\u003e\u003cspan\u003eشاعر الحمراء وكاتب رسائلها\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالصناعة\u003c/b\u003e\u003cspan\u003eالحرير والسكر والخزف\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالتجارة\u003c/b\u003e\u003cspan\u003eجنوة وبرشلونة وأسواق أوروبا\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمجال\u003c/th\u003e\u003cth\u003eمن أعلامه\u003c/th\u003e\u003cth\u003eأثره\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالتاريخ\u003c/td\u003e\u003ctd\u003eابن الخطيب\u003c/td\u003e\u003ctd\u003eالإحاطة في أخبار غرناطة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالسياسة والفكر\u003c/td\u003e\u003ctd\u003eابن خلدون\u003c/td\u003e\u003ctd\u003eزيارةٌ وسفارةٌ ومقدمة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالشعر\u003c/td\u003e\u003ctd\u003eابن زمرك\u003c/td\u003e\u003ctd\u003eقصائد الحمراء والمدح\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالطب\u003c/td\u003e\u003ctd\u003eأطباء البلاط\u003c/td\u003e\u003ctd\u003eترجمةٌ وتدريسٌ في المدارس\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالصناعة\u003c/td\u003e\u003ctd\u003eنسّاجو الحرير\u003c/td\u003e\u003ctd\u003eأكبر صادرات المملكة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eيَرْفَعِ اللَّهُ الَّذِينَ آمَنُوا مِنكُمْ وَالَّذِينَ أُوتُوا الْعِلْمَ دَرَجَاتٍ\u003c/p\u003e\u003ccite\u003eسورة المجادلة، الآية ١١\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eكانت غرناطة مدينة علمٍ وصناعةٍ في وقتٍ واحد، وفيها كتب ابن الخطيب تاريخها وزارها ابن خلدون. وقد كان اقتصادها الحريري قوّةً وخطرًا في الوقت نفسه، لأنه كان يعتمد على أسواق من كان يُحاصرها.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"the-last-war","n":"الحرب الأخيرة وسقوط غرناطة","ic":"🔥","part":"القسم الخامس: غرناطة والنهاية","h":"\u003carticle class=\"ch3\" id=\"the-last-war\" data-toc=\"الحرب الأخيرة وسقوط غرناطة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الخامس: غرناطة والنهاية\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٤ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٥\u003ci\u003e.\u003c/i\u003e٤\u003c/span\u003e\n            \u003ch3\u003e🔥 الحرب الأخيرة وسقوط غرناطة\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eب\u003c/span\u003eدأت الحرب سنة ١٤٨٢م بسقوط حصنٍ صغير يُسمّى الحامة، وانتهت في الثاني من يناير سنة ١٤٩٢م بدخول فرديناند وإيزابيلا إلى الحمراء. وفي عشر سنوات لم تُخض معركةٌ كبرى واحدة، بل أُكلت المملكة حصنًا حصنًا ومدينةً مدينة.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكانت قشتالة في عهد فرديناند وإيزابيلا قد صارت دولةً موحّدة قوية، وكانت قد أنهت حروبها الداخلية، وكان لها جيشٌ نظامي ومدفعيةٌ جديدة، وكان البابا قد أعلن الحرب على غرناطة حربًا صليبية. وقد كان في هذا كلّه ما لم يكن في الحروب السابقة: أن الحرب صارت مشروعًا دولةً لا حملةً موسمية. وقد كان في هذا التوحّد ما جعل الحرب ممكنة: أن قشتالة لم تكن تستطيع أن تُحاصر غرناطة قبل أن تُوحّد جيشها ومالها وإدارتها في يدٍ واحدة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بدأت الحرب سنة ١٤٨٢م بهجومٍ على حصن الحامة، وكان الحصن قريبًا من غرناطة، وكان سقوطه صدمةً لأن أهل غرناطة كانوا يرون أن حصونهم لا تُؤخذ. وقد ردّ المسلمون بهجومٍ على قرى الحدود، ثم خرج سلطان غرناطة في حملةٍ إلى لوشة، فانهزم وأُسر ابنه بو عبد الله، وكان هذا الأسر بداية مأساةٍ داخلية. وقد كان في هذا الهجوم على الحامة معنى نفسي كبير: أن الحصن كان يُرى من غرناطة، وأن سقوطه جعل أهل المدينة يرون العدوّ من أسوارهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أطلق القشتاليون بو عبد الله بعد أن عقد معهم عهدًا يكون فيه تابعًا لهم، وأعادوه إلى غرناطة ليكون سلطانًا عليهم، وكان في هذا العمل سياسةٌ قديمة: أن يُوضع في الحكم رجلٌ يُطيع، وأن يُترك البلد يُقاتل نفسه. وقد حدث ذلك فعلًا، فقد دخل بو عبد الله في حربٍ مع عمّه الذي كان يحكم في مالقة، وصارت غرناطة مملكتين تتحاربان في وقتٍ تُحاصرها فيه قشتالة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد سقطت المدن واحدةً بعد أخرى: سقطت الحامة ثم لوشة ثم مالقة سنة ١٤٨٧م بعد حصارٍ طويل، ثم سقطت المرية سنة ١٤٨٩م، ثم باسة، وقد كان في سقوط مالقة عبرةٌ لأن المدينة كانت ميناءً كبيرًا، ولأن سقوطها قطع الإمداد البحري عن غرناطة، وكان في سقوط المرية إعلانٌ بأن البحر صار في يد قشتالة. وقد كان في سقوط هذه المدن ترتيبٌ مقصود: أن تُؤخذ الموانئ أولًا ثم المدن الداخلية، لأن من يقطع البحر يقطع الإمداد، ومن يقطع الإمداد لا يحتاج إلى معركة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سنة ١٤٩٠م بدأ الحصار على غرناطة نفسها، وكان حصارًا بالجوع لا بالسلاح: فقد قُطعت الطرق وأُحرقت الزروع، وكان القشتاليون يُغيرون على السهول في موسم الحصاد، وكان أهل المدينة يخرجون للقتال ثم يعودون إلى أسوارهم. وقد بنى القشتاليون معسكرًا كبيرًا قرب المدينة، ثم احترق المعسكر، فبنوا مدينةً كاملة سمّوها سانتا في، أي الإيمان المقدّس، وكان في هذا إعلانٌ بأنهم لن يعودوا حتى يسقط البلد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي نوفمبر سنة ١٤٩١م وُقّع عهد التسليم، وكان في شروطه أن يبقى المسلمون على دينهم ولغتهم وأموالهم، وأن يُحكم بينهم بقضاتهم، وأن يبقى في أيديهم سلاحهم الخفيف، وأن من أراد الهجرة إلى المغرب يُعطى سفينةً وأمانًا. وقد كانت هذه الشروط من أفضل ما عُقد في تاريخ الحروب، وقد قبلها السلطان لأن المدينة لم تكن قادرةً على القتال بعد سنتين من الحصار.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي الثاني من يناير سنة ١٤٩٢م دخل فرديناند وإيزابيلا إلى المدينة، وسلّم بو عبد الله مفاتيح الحمراء، وكان في هذا اليوم نهاية وجودٍ إسلامي في شبه الجزيرة دام ثمانية قرون. وقد خرج السلطان مع أهله إلى البشرات ثم إلى المغرب، وعاش في فاس، ومات هناك سنة ١٥٣٣م، وقد قيل إنه رأى في الطريق موضعًا يُشرف على غرناطة فبكى، وصار ذلك الموضع يُعرف بزفرة العربي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت الشروط التي وُقّعت سنة ١٤٩١م قد بدأت في الانهيار بعد سنوات: فقد ضُيّق على المسلمين في المساجد والأسواق والملابس، ثم صدر قرار التنصير القسري سنة ١٥٠٢م، وكان في هذا نقضٌ صريح للعهد. وقد كان في هذا النقض درسٌ في التاريخ: أن العهود التي تُعقد في لحظة ضعفٍ لا تحميها إلا قوة، وأن من يُسلّم سلاحه لا يستطيع أن يُطالب بحقوقه بعد ذلك.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eلماذا سقطت غرناطة\u003c/h4\u003e\u003cp class=\"ap\"\u003eسقطت غرناطة لثلاثة أسباب: انقسامها الداخلي، وتفوق قشتالة العسكري والتنظيمي، وانقطاع إمدادها من المغرب. وقد كان الانقسام الداخلي أخطرها، لأن المملكة كانت تُقاتل نفسها في وقتٍ تُحاصر فيه، وقد كان بو عبد الله وعمّه يتنازعان السلطة، وكان كل واحدٍ منهما يستعين بالقشتاليين على الآخر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان التفوق العسكري ظاهرًا في أمرين: المدفعية، وكانت تُسقط الأسوار التي كانت في السابق تُصمد سنوات، والتنظيم، لأن الجيش القشتالي كان جيشًا دائمًا يُدفع له راتب، وكان يُدار من مركزٍ واحد. وقد كان الجيش الأندلسي جيشًا من المتطوّعة والحاميات، وكان يُقاتل بشجاعةٍ لكن بلا خطةٍ عامة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eشروط التسليم\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت شروط التسليم تفصيلية: أن يُعطى المسلمون أمانًا على أنفسهم وأموالهم، وأن يبقى لهم قاضيهم ومساجدهم، وأن لا يُدخل عليهم أحدٌ يكرههم على دينه، وأن من أراد الهجرة يُعطى سفينة. وقد كانت هذه الشروط مكتوبةً وموثّقة، وقد قرأها القساوسة والفقهاء، وكان في تفصيلها دليلًا على أن التسليم كان تفاوضًا لا استسلامًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت الشروط تُنفّذ في السنوات الأولى، ثم بدأت تُنقض: فمُنع الأذان في بعض المساجد، ثم أُجبر الناس على حضور القداس، ثم صدر قرار ١٥٠٢م الذي خيّر المسلمين بين التنصير أو الخروج. وقد كان في هذا النقض ما يُثبت أن العهود في التاريخ تُحترم بقدر ما يكون لصاحبها قوة، وأن المملكة التي تسقط لا تستطيع أن تُطالب بما وُقّع لها.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eيوم الثاني من يناير\u003c/h4\u003e\u003cp class=\"ap\"\u003eدخل الملكان المدينة في موكبٍ كبير، وكان في المدينة من بقي من أهلها، وكان في الحمراء من سلّم المفاتيح. وقد صار هذا اليوم في التاريخ الإسباني عيدًا، وصار في التاريخ العربي رمزًا للسقوط، وقد كُتبت فيه قصائد الرثاء في المشرق والمغرب، ومنها ما قاله الشعراء في الأندلس قبل أن يخرجوا منها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا اليوم معنى أكبر من مدينة: أن الأندلس التي كانت في القرن العاشر أعظم بلاد أوروبا في العلم والعمران صارت في آخر القرن الخامس عشر أثرًا يُزار. وقد بقي في المدينة بعد ذلك مسلمون تحت الحكم الجديد، ثم تحوّلوا إلى الموريسكيين، ثم خرجوا في القرن السابع عشر، وكان في خروجهم النهاية الحقيقية للأندلس.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eبداية الحرب\u003c/b\u003e\u003cspan\u003eسنة ١٤٨٢م بسقوط الحامة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسقوط مالقة\u003c/b\u003e\u003cspan\u003eسنة ١٤٨٧م وقطع الإمداد البحري\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمعسكر\u003c/b\u003e\u003cspan\u003eمدينة سانتا في أمام غرناطة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالعهد\u003c/b\u003e\u003cspan\u003eنوفمبر ١٤٩١م بشروطٍ مكتوبة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالتسليم\u003c/b\u003e\u003cspan\u003e٢ يناير ١٤٩٢م ودخول الحمراء\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e١٤٨٢م\u003c/td\u003e\u003ctd\u003eسقوط الحامة\u003c/td\u003e\u003ctd\u003eبداية الحرب وانهيار الثقة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٤٨٣م\u003c/td\u003e\u003ctd\u003eأسر بو عبد الله\u003c/td\u003e\u003ctd\u003eعهدٌ مع قشتالة وصراعٌ داخلي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٤٨٧م\u003c/td\u003e\u003ctd\u003eسقوط مالقة\u003c/td\u003e\u003ctd\u003eقطع الإمداد البحري\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٤٨٩م\u003c/td\u003e\u003ctd\u003eسقوط المرية وباسة\u003c/td\u003e\u003ctd\u003eانحسار المملكة إلى المدينة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٤٩١م\u003c/td\u003e\u003ctd\u003eعهد التسليم\u003c/td\u003e\u003ctd\u003eشروطٌ مكتوبة ثم نُقضت\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٤٩٢م\u003c/td\u003e\u003ctd\u003eدخول المدينة\u003c/td\u003e\u003ctd\u003eنهاية الحكم الإسلامي في الأندلس\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eإِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ\u003c/p\u003e\u003ccite\u003eسورة البقرة، الآية ١٥٦\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eسقطت غرناطة بعد عشر سنواتٍ من الحرب لم تُخض فيها معركةٌ فاصلة، لأن المملكة أُكلت حصنًا حصنًا وهي تُقاتل نفسها. وقد وُقّع عهدٌ بشروطٍ حسنة ثم نُقض بعد سنوات، فكانت النهاية الحقيقية بعد قرنٍ من ذلك اليوم.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-6","n":"القسم السادس: الموريسكيون وإرث الأندلس","ic":"","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-6\" style=\"--c:#B0304A\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🕯️\u003c/div\u003e\n      \u003ch2\u003eالقسم السادس: الموريسكيون وإرث الأندلس\u003c/h2\u003e\n      \u003cp\u003eلم تنتهِ الأندلس سنة ١٤٩٢م، بل بقيت في أحياء المدجّنين وفي الكتب التي خرجت مع المهاجرين وفي القصور التي صارت متاحف. ثم جاء الطرد الكبير في القرن السابع عشر فأغلق الباب، وبقي الإرث وحده يتكلّم.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#moriscos\"\u003eالموريسكيون: قرنٌ من الصمت ثم الطرد\u003c/a\u003e\u003ca href=\"#legacy-in-europe\"\u003eإرث الأندلس في أوروبا\u003c/a\u003e\u003ca href=\"#memory\"\u003eالأندلس في الذاكرة\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"moriscos","n":"الموريسكيون: قرنٌ من الصمت ثم الطرد","ic":"🚶","part":"القسم السادس: الموريسكيون وإرث الأندلس","h":"\u003carticle class=\"ch3\" id=\"moriscos\" data-toc=\"الموريسكيون: قرنٌ من الصمت ثم الطرد\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم السادس: الموريسكيون وإرث الأندلس\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ١ من ٣\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٦\u003ci\u003e.\u003c/i\u003e١\u003c/span\u003e\n            \u003ch3\u003e🚶 الموريسكيون: قرنٌ من الصمت ثم الطرد\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eب\u003c/span\u003eعد سقوط غرناطة بقي المسلمون في البلاد بعقودٍ تُنصّرهم في الظاهر وتُبقي دينهم في الباطن، وكانوا يُسمّون الموريسكيين. وفي سنة ١٦٠٩م صدر قرار الطرد، فخرج من بقي منهم إلى المغرب وتونس، وانتهت بذلك قصة ثمانية قرون.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان في شروط تسليم غرناطة سنة ١٤٩١م أن يبقى المسلمون على دينهم، وقد نُفّذت هذه الشروط سنواتٍ قليلة، ثم بدأ التضييق: فمُنع الأذان في بعض المساجد، وأُجبر الناس على حضور القداس، ومُنعوا من حمل السلاح، وضُيّقت عليهم الأسواق والألبسة. وقد كان هذا التضييق تدريجيًّا، وكان كل خطوةٍ منه تُبرَّر بأنها إجراءٌ أمني، ثم صارت بعد سنواتٍ سياسةً معلنة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سنة ١٥٠٢م صدر في قشتالة قرارٌ يُخيّر المسلمين بين التنصير أو الخروج، وكان هذا القرار نقضًا صريحًا للعهد، وقد صدر بعد ثوراتٍ في المدن وبعد ضغطٍ من رجال الدين. وقد اختار أكثر الناس التنصير في الظاهر، لأن الخروج كان يعني ترك الأرض والمال والأهل، وكان الخروج يحتاج إلى سفينةٍ ومالٍ وأمانٍ لا يملكه الفلاح. وقد كان في هذا القرار ما يُشبه إغلاق بابٍ كان مفتوحًا، لأن العهد الذي وُقّع سنة ١٤٩١م كان يُتيح للمسلمين أن يبقوا بشرط أن يُحترم دينهم، ولمّا سقط هذا الشرط سقط معه معنى البقاء.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد نشأ من ذلك مجتمعٌ مزدوج: ناسٌ يُسمّون بأسماءٍ نصرانية ويُصلّون في الكنائس ويُخفون دينهم في بيوتهم، وكانوا يتكلّمون العربية في البيوت، ويُسمّون أبناءهم بأسماء عربية سرًّا، ويُحفظون القرآن في الصدور لا في الكتب، لأن الكتب كانت تُفتّش. وقد كُتبت في هذه السنوات كتبٌ بالعربية بحروفٍ لاتينية تُسمّى كتب المدجّنين، وكان الغرض منها أن تُقرأ بالعربية لمن لا يعرف الحرف العربي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان هذا المجتمع تحت مراقبةٍ دائمة من محاكم التفتيش، وكانت هذه المحاكم تُراقب الملابس والأطعمة والأغاني والحلي، لأنها كانت ترى في هذه العادات علامةً على الدين. وقد كان في هذا إدراكٌ دقيق من جهة السلطة: أن الدين لا يُحفظ في الكتب وحدها بل في العادات اليومية، وأن من يريد أن يُلغي دينًا فعليه أن يُلغي عاداته لا أن يُلغي كتبه. وقد كان في هذا الوضع ما يجعل الدين مسألةً داخلية لا اجتماعية، فلم يبقَ له مسجدٌ ولا قاضٍ ولا مدرسة، وبقي في البيت وفي الصدر وفي الذاكرة، وهذا هو أضعف أشكال البقاء وأكثرها مقاومةً في الوقت نفسه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سنة ١٥٦٨م قامت ثورةٌ كبيرة في جبال البشرات، وكانت بسبب التضييق على اللغة واللباس والعادات، وقد قادها رجلٌ من أهل المنطقة أعلن نفسه ملكًا، ثم خلفه آخر بعد أن قُتل. وقد استمرّت الثورة ثلاث سنوات، وكانت حربًا في الجبال يصعب فيها على الجيش النظامي أن ينتصر، وكانت نهايتها بعد أن استُعملت فيها القسوة والتفريق. وقد كان في هذا الإدراك ما يُفسّر تشديد السلطة على الملابس والأسماء والأغاني، لأنها كانت ترى أن الدين يُحفظ في هذه التفاصيل أكثر مما يُحفظ في العقيدة المجرّدة، وكانت في هذا مُحقّةً من جهة نظرها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان أثر هذه الثورة كارثيًّا على الموريسكيين: فقد نُقل كثير منهم من غرناطة إلى قشتالة، وكان هذا النقل إجراءً أمنيًّا، وكان في الوقت نفسه إجراءً ثقافيًّا، لأن نقل الناس من أرضهم يُفقدهم شبكاتهم الاجتماعية ومدارسهم وأسواقهم، ويجعلهم أقلّ قدرةً على الحفاظ على لغتهم. وقد كان في قيادة الثورة تناقضٌ: أن يُعلن رجلٌ من أهل البلاد نفسه ملكًا في وقتٍ لا توجد فيه دولة، وأن يقود مقاومةً محلية بلا إمدادٍ ولا حليف، وكان في هذا شجاعةً وسوء تقديرٍ في الوقت نفسه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سنة ١٦٠٩م صدر قرار الطرد، وكان يُبرَّر بأن الموريسكيين لا يُمكن أن يُدمجوا في المجتمع، وأنهم خطرٌ داخلي. وقد نُفّذ القرار على مراحل: فبدأ ببلنسية ثم بالأندلس ثم بقشتالة، واستمرّ إلى سنة ١٦١٤م، وقد خرج في هذه السنوات ما يُقدّر بمئات الآلاف، وكان في الخارجين من الحرفيين والفلاحين والعلماء، وكان في هذا خسارةٌ اقتصادية كبيرة للمناطق التي كانوا يعملون فيها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا الطرد قرارًا سياسيًّا لا دينيًّا فقط: فالملك أراد أن يُوحّد بلاده دينيًّا، وكان يرى في الموريسكيين خطرًا يُمكن أن يتحالف مع أعدائه في المغرب أو مع الدولة العثمانية. وقد كان في هذا الفهم ما يُشبه منطق الدول في كل العصور: أن تُضحّي بأقليةٍ لتشتري وحدةً داخلية، وأن تُبرّر ذلك بالخطر لا بالحق. وقد كان في هذا القرار ما يُشبه إعلان نهاية مشروع: أن الدولة التي عاشت ثمانية قرون مع المسلمين لم تعد ترى لهم مكانًا فيها، وأن الحلّ الذي اختارته كان الخروج لا الإدماج، وكان في هذا اعترافٌ بفشل سياسةٍ طويلة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ذهب الموريسكيون إلى المغرب والجزائر وتونس، وكان منهم من استقرّ في تطوان وشفشاون وسلا، وكان في هذه المدن أثرٌ أندلسي في البناء والملبس والموسيقى والطبخ. وقد بقي في إسبانيا من لم يُطرد، أو من عاد سرًّا، وكانوا يعيشون في قرى نائية، وقد بقي في اللغة الإسبانية أثرٌ عربي في آلاف الكلمات، وهذا هو الإرث الذي لم يُمكن أن يُطرد. وقد كان في هذا المنطق ما يتكرّر في تاريخ الدول: أن تُقاس الأقليات باحتمال الخيانة لا بسلوكها الفعلي، وأن يُطلب منها ما لا يُطلب من الأكثرية، وأن يُبرَّر الطرد بالخوف لا بالعدل.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالتنصير القسري\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان التنصير القسري سنة ١٥٠٢م نقطة تحوّل، لأنه حوّل المسلمين من رعيةٍ لها عهد إلى رعيةٍ مشكوكٍ في دينها. وقد كان في هذا وضعٌ لا يُحتمل: أن يُطلب من الناس أن يُنصّروا في الظاهر ويُخفوا دينهم في الباطن، وأن يُراقبوا في كل تصرّف، وأن يُحاكموا على نيّةٍ لا على فعل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا الوضع ما يُفسّر اندلاع الثورات بعد ذلك، لأن الناس الذين لا يملكون شيئًا يخسرونه يُصبحون أكثر استعدادًا للخطر. وقد قال أحد المؤرخين إن إسبانيا صنعت بنفسها العدوّ الذي خافت منه، لأنها لم تُعطِ الموريسكيين مكانًا في المجتمع فأصبحوا يبحثون عن مكانٍ خارجه.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eثورة البشرات\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت جبال البشرات في جنوب غرناطة موطنًا لمجتمعٍ محافظ على العربية، وكانت القرى هناك بعيدة عن المدن وعن المراقبة. وقد بدأت الثورة سنة ١٥٦٨م بعد قراراتٍ جديدة مُنعت فيها اللغة العربية واللباس التقليدي، وكانت البداية بقتل مسؤولٍ محلي، ثم انتشرت في القرى.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد استعملت الدولة في قمعها جيشًا كبيرًا بقيادة أخٍ للملك، وكانت الحرب في الجبال طويلةً ومريرة، وانتهت سنة ١٥٧١م. وقد كان من نتائجها أن نُقل سكان المنطقة إلى قشتالة، وأن صار الموريسكيون مشكلةً سياسيةً لا مشكلةً دينية فقط، وأن الطريق إلى الطرد صار ممهدًا.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالطرد وأثره\u003c/h4\u003e\u003cp class=\"ap\"\u003eصدر قرار الطرد سنة ١٦٠٩م، وكان يُطبَّق على مراحل، وقد خرج الناس بأمتعتهم القليلة إلى الموانئ، وكان فيهم من مات في الطريق، وكان فيهم من بيعت أملاكه بأبخس الأثمان. وقد قُدّر عدد الخارجين بمئات الآلاف، وكان هذا من أكبر عمليات الترحيل في أوروبا في العصر الحديث.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان أثر الطرد في الاقتصاد الإسباني كبيرًا، لأن الموريسكيين كانوا يعملون في الزراعة المروية وفي الصناعات اليدوية، وكانت مناطقهم من أكثر المناطق إنتاجًا. وقد كتب بعض المؤرخين الإسبان بعد ذلك أن الطرد أضرّ البلاد أكثر مما أضرّ المطرودين، وأن بعض المناطق لم تستعد ازدهارها إلا بعد قرنين.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالتنصير\u003c/b\u003e\u003cspan\u003eقرار سنة ١٥٠٢م في قشتالة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالثورة\u003c/b\u003e\u003cspan\u003eثورة البشرات ١٥٦٨ – ١٥٧١م\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالطرد\u003c/b\u003e\u003cspan\u003e١٦٠٩ – ١٦١٤م على مراحل\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالعدد\u003c/b\u003e\u003cspan\u003eمئات الآلاف من الخارجين\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمصير\u003c/b\u003e\u003cspan\u003eالمغرب والجزائر وتونس\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e١٤٩٢م\u003c/td\u003e\u003ctd\u003eسقوط غرناطة\u003c/td\u003e\u003ctd\u003eعهدٌ بحفظ الدين ثم نُقض\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٥٠٢م\u003c/td\u003e\u003ctd\u003eالتنصير القسري\u003c/td\u003e\u003ctd\u003eموريسكيون في الظاهر\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٥٦٨م\u003c/td\u003e\u003ctd\u003eثورة البشرات\u003c/td\u003e\u003ctd\u003eحربٌ ثلاث سنوات ونقل السكان\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٦٠٩م\u003c/td\u003e\u003ctd\u003eقرار الطرد\u003c/td\u003e\u003ctd\u003eخروج الموريسكيين من بلنسية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٦١٤م\u003c/td\u003e\u003ctd\u003eنهاية الطرد\u003c/td\u003e\u003ctd\u003eخلوّ البلاد من المسلمين\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eوَمَن يَهَاجِرْ فِي سَبِيلِ اللَّهِ يَجِدْ فِي الْأَرْضِ مُرَاغَمًا كَثِيرًا\u003c/p\u003e\u003ccite\u003eسورة النساء، الآية ١٠٠\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eبعد سقوط غرناطة بقي المسلمون بعقودٍ يُنصّرون في الظاهر ويُخفون دينهم، ثم قاموا بثورةٍ في الجبال قُمعت، ثم طُردوا سنة ١٦٠٩م. وبهذا انتهى وجود المسلمين في الأندلس، وبقي أثرهم في اللغة والعمارة والزراعة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"legacy-in-europe","n":"إرث الأندلس في أوروبا","ic":"🌍","part":"القسم السادس: الموريسكيون وإرث الأندلس","h":"\u003carticle class=\"ch3\" id=\"legacy-in-europe\" data-toc=\"إرث الأندلس في أوروبا\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم السادس: الموريسكيون وإرث الأندلس\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٢ من ٣\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٦\u003ci\u003e.\u003c/i\u003e٢\u003c/span\u003e\n            \u003ch3\u003e🌍 إرث الأندلس في أوروبا\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eل\u003c/span\u003eم يخرج من الأندلس مالٌ ولا سلاح، بل خرج شيءٌ أعظم: الكتب. وقد تُرجمت في طليطلة وفي صقلية وفي جنوب فرنسا، ودخلت جامعات أوروبا، وكانت بدايةً لنهضةٍ لم يكن أحدٌ يتوقّعها.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكانت حركة الترجمة في طليطلة هي القناة الكبرى التي انتقل بها العلم العربي إلى أوروبا، وقد بدأت في القرن الثاني عشر الميلادي بعد سقوط المدينة سنة ١٠٨٥م، وكان فيها مترجمون من المسلمين واليهود والنصارى، وكان بعضهم يعمل مع آخر: يقرأ أحدهم العربية ويُترجم شفويًّا إلى القشتالية، ثم يُترجم الآخر من القشتالية إلى اللاتينية. وقد كانت هذه الطريقة بطيئة، لكنها أنتجت ترجماتٍ لكتبٍ كثيرة في الطب والفلك والرياضيات والفلسفة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد تُرجم في طليطلة كتاب القانون في الطب لابن سينا، وكتب الرازي، وكتب ابن رشد في الفلسفة والطب، وكتب الفلك التي كانت تُعرف في أوروبا باسم الجداول الطليطلية، وكتب الجبر للخوارزمي، وكانت هذه الكتب هي التي دخلت جامعات بولونيا وباريس وأكسفورد ومونبلييه. وقد كان أثرها في المنهج أكبر من أثرها في المعلومات، لأنها أعطت أوروبا طريقةً في البحث والاستدلال لم تكن تعرفها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان ابن رشد أهمّ فيلسوفٍ عربي انتقل إلى أوروبا، وقد تُرجمت شروحه على أرسطو إلى اللاتينية، وصار يُسمّى في الجامعات الأوروبية بالشارح، وكان توما الأكويني يُعارضه ويستعمل حججه في الوقت نفسه. وقد ظهر في باريس في القرن الثالث عشر تيارٌ يُسمّى الرشدية اللاتينية، وكان يُدرّس فيه ابن رشد كما يُدرّس أرسطو، وقد أدّى هذا التيار إلى نقاشٍ كبير في العلاقة بين العقل والدين.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد انتقل إلى أوروبا أيضًا علم الحساب والأرقام، وكان الخوارزمي أول من كتب في الجبر، وقد دخلت الأرقام العربية إلى أوروبا عن طريق الأندلس وصقلية، وكانت تُسمّى الأرقام الغبارية، وقد كانت هذه الأرقام أسهل في الحساب من الأرقام الرومانية، وكان هذا سببًا في تطوّر التجارة والمحاسبة في أوروبا في القرون التالية. وقد بقي اسم الخوارزمي في كلمةٍ أوروبية تُستخدم اليوم في الرياضيات وفي الحاسوب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان للأندلس أثرٌ في الزراعة أيضًا، فقد نقل المسلمون إلى شبه الجزيرة أصنافًا من الشرق: الأرز وقصب السكر والحمضيات والقطن والتوت والزعفران، وكانوا يُدخلون أنظمة الريّ بالقنوات والسواقي والنواعير. وقد انتقلت هذه الأنظمة إلى أوروبا بعد ذلك، وكان في هذا أثرٌ في الغذاء والاقتصاد لا في العلم فقط، وهذا ما لا يُذكر عادةً في كتب التاريخ الثقافي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان الأثر في اللغة الإسبانية والبرتغالية ظاهرًا: فآلاف الكلمات فيهما من أصلٍ عربي، ومنها كلماتٌ في الماء والزراعة والبناء والحرف والحرب والإدارة، وكان هذا الأثر ثمرةً لثمانية قرون من العيش المشترك. وقد بقي في أسماء الأماكن أثرٌ عربي واسع، وفي أسماء الأنهار والجبال والقلاع، وفي المصطلحات القانونية والتجارية. وقد كان في هذه المحاصيل أثرٌ اقتصادي كبير: أن تُنتج أرضٌ قاحلة ما لا تنتجه أرضٌ خصبة، وأن يُصبح السكر والحرير والأرز سلعًا تُصدَّر إلى أوروبا، وكان في هذا ثروةٌ للبلاد لا مجرّد غذاء.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان الأثر في العمارة ظاهرًا في ما يُسمّى بالفنّ المدجّن، وهو فنٌّ بنى به المسلمون الذين بقوا في البلاد بعد السقوط، وكان في الكنائس والأبراج والقصور، وكان في الطوب والزخرفة والخطّ. وقد بقي هذا الفنّ في إسبانيا قرونًا، وصار جزءًا من الهوية المعمارية الإسبانية، وهذا مثالٌ على أن الثقافة تبقى في الحجر بعد أن يذهب أهلها. وقد كان هذا الأثر دليلًا على أن اللغة تحفظ التاريخ أكثر من الآثار، لأن الكلمة تبقى في فم الناس بعد أن يذهب الباني والبناء، وكان في هذا بقاءٌ للأندلس لا يحتاج إلى ترميم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان الأثر في الفلسفة والدين أيضًا، فقد انتقلت إلى أوروبا فكرة التأويل العقلي للنص، وفكرة أن العقل لا يُعارض الوحي، وكانت هذه الأفكار مادةً للنقاش في الجامعات الأوروبية قرونًا، وقد أدّت في النهاية إلى ما يُسمّى بالنهضة. وقد كان في هذا معنى مهم: أن أوروبا لم تنهض بقطع صِلتها بالعالم الإسلامي، بل نهضت بترجمة ما جاء منه ثم بالبناء عليه.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eطليطلة: مصنع الترجمة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت طليطلة بعد سقوطها سنة ١٠٨٥م مدينةً فيها مكتباتٌ عظيمة وفيها علماء مسلمون ويهود ونصارى، وكان رئيس أساقفتها يُشجّع الترجمة، وكان في المدينة مترجمون يعملون بأجر. وقد كان هذا العمل مؤسسةً كاملة: نسخٌ ومقابلةٌ وترجمةٌ وتحرير، وكان يُنتج كتبًا تُنسخ وتُبيع في أوروبا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان من أشهر هؤلاء المترجمين جيراردو الكريموني، وقد ترجم كتبًا كثيرة في الطب والفلك والرياضيات، وكان يعمل بالتعاون مع مسلمين ويُترجم ما يقرأونه. وقد كان في هذا التعاون دليلًا على أن نقل العلم يحتاج إلى طرفين لا إلى طرفٍ واحد، وأن المدينة التي تُترجم هي مدينةٌ يعيش فيها أكثر من لسان.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eابن رشد والرشدية\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان ابن رشد قاضيًا وفيلسوفًا في قرطبة في القرن السادس الهجري، وقد شرح أرسطو شرحًا دقيقًا، وكان يرى أن الحكمة والشريعة لا تتعارضان، وأن التأويل هو الطريق إلى الجمع بينهما. وقد كان كتابه فصل المقال من أهمّ ما كُتب في هذا الباب، وفيه دفاعٌ عن الفلسفة بلغة الفقه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان أثره في أوروبا أكبر من أثره في الأندلس، لأن كتبه تُرجمت إلى اللاتينية والعبرية، ولأن الجامعات الأوروبية كانت تحتاج إلى شرحٍ لأرسطو. وقد صار يُسمّى الشارح، وكان يُدرّس في باريس، وقد حوكمت آراؤه هناك كما حوكمت في قرطبة، وكان في هذا دليلًا على أن الفكر الذي يُزعج سلطةً في مكانٍ يُزعج سلطةً في مكانٍ آخر.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eاللغة والزراعة\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يكن أثر الأندلس في الكتب فقط، بل كان في الحياة اليومية: في الكلمات التي تُستخدم، وفي المحاصيل التي تُزرع، وفي القنوات التي تُجري الماء، وفي الحمّامات التي تُبنى. وقد كان هذا الأثر أعمق من الأثر الفلسفي، لأنه دخل بيوت الناس لا مدارسهم. وقد كان في هذا الوصف ما يُشبه الإحصاء: أن يُذكر المحصول والكلمة والقناة، لأن هذه هي الحياة اليومية التي تُصنع منها الحضارة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بقي في الإسبانية كلماتٌ مثل الزيت والسكر والقطن والقناة والوالي، وبقيت في الزراعة أصنافٌ لم تكن في أوروبا قبل المسلمين، وبقيت في العمارة أشكالٌ من الطوب والزخرفة. ولهذا يُقال إن الأندلس لم تُطرد سنة ١٦٠٩م، لأنها كانت قد صارت جزءًا من الحياة اليومية لمن طردها.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالترجمة\u003c/b\u003e\u003cspan\u003eطليطلة في القرنين ١٢ و١٣ الميلاديين\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالفلسفة\u003c/b\u003e\u003cspan\u003eابن رشد والرشدية اللاتينية\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالطب\u003c/b\u003e\u003cspan\u003eالقانون لابن سينا والرازي\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالرياضيات\u003c/b\u003e\u003cspan\u003eالجبر والأرقام العربية\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالزراعة\u003c/b\u003e\u003cspan\u003eالأرز وقصب السكر والحمضيات والريّ\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمجال\u003c/th\u003e\u003cth\u003eما انتقل\u003c/th\u003e\u003cth\u003eأثره في أوروبا\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالفلسفة\u003c/td\u003e\u003ctd\u003eشروح ابن رشد لأرسطو\u003c/td\u003e\u003ctd\u003eالرشدية ونقاش العقل والدين\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالطب\u003c/td\u003e\u003ctd\u003eالقانون والحاوي\u003c/td\u003e\u003ctd\u003eمناهج جامعات مونبلييه وبولونيا\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالرياضيات\u003c/td\u003e\u003ctd\u003eالجبر والأرقام\u003c/td\u003e\u003ctd\u003eتطوّر الحساب والتجارة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالفلك\u003c/td\u003e\u003ctd\u003eالجداول والأسطرلاب\u003c/td\u003e\u003ctd\u003eأساس علم الفلك في الجامعات\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالزراعة\u003c/td\u003e\u003ctd\u003eالريّ والمحاصيل\u003c/td\u003e\u003ctd\u003eتغيّر الغذاء والاقتصاد\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eاللغة\u003c/td\u003e\u003ctd\u003eآلاف الكلمات\u003c/td\u003e\u003ctd\u003eالمعجم الإسباني والبرتغالي\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eوَعَلَّمْنَاهُ مِمَّا لَدَيْنَا\u003c/p\u003e\u003ccite\u003eسورة الكهف، الآية ٦٥\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eانتقل إرث الأندلس إلى أوروبا بالكتب أولًا، ثم بالزراعة واللغة والعمارة، وكانت طليطلة مصنع الترجمة الذي دخلت منه الفلسفة والطب والرياضيات إلى الجامعات. وبهذا لم تنتهِ الأندلس بسقوطها، بل بقيت في حياة من جاء بعدها.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"memory","n":"الأندلس في الذاكرة","ic":"🕯️","part":"القسم السادس: الموريسكيون وإرث الأندلس","h":"\u003carticle class=\"ch3\" id=\"memory\" data-toc=\"الأندلس في الذاكرة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم السادس: الموريسكيون وإرث الأندلس\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٣ من ٣\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٦\u003ci\u003e.\u003c/i\u003e٣\u003c/span\u003e\n            \u003ch3\u003e🕯️ الأندلس في الذاكرة\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eب\u003c/span\u003eعد أن ذهب الناس وبقيت الحجارة، صارت الأندلس موضوعًا للشعر والحنين والدراسة. وقد كتب فيها من رآها ومن لم يرها، وكان في هذا الكتابة شيءٌ من الرثاء وشيءٌ من الحكمة.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eبدأ رثاء الأندلس قبل سقوط غرناطة، فقد كتب شعراء القرن السابع الهجري قصائد في سقوط المدن، وأشهرها قصيدة يُنسب فيها البيت الشهير: لكل شيءٍ إذا ما تمّ نقصان، وقد قيلت في سقوط مدن الأندلس في القرن الثالث عشر، لا في سقوط غرناطة. وقد كانت هذه القصيدة تُنشد في المجالس قرونًا، وكانت تُستعمل في تعليم الناس أن ما جرى لم يكن حادثًا عابرًا بل سنّةً في الدول.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كتب ابن الخطيب في القرن الثامن الهجري عن غرناطة وعن حالها، وكان يرى أن المملكة تعيش على وقتٍ مستعار، وكان في كتابته نبرةٌ تُشبه نبرة من يُودّع. وقد كان في هذا الوعي المبكر شيءٌ مهم: أن بعض أهل العصر يعرفون أنهم يعيشون نهايةً، ويكتبون وهم يعرفون، وهذا ما يُعطي نصوصهم قيمةً خاصة. وقد كان في هذا الوعي المبكر ما يجعل نصوص ابن الخطيب وثيقةً نفسية لا سياسية فقط، لأنها تُظهر كيف يرى رجل دولةٍ نهايته وهو يكتب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بقي في الأندلس بعد الطرد مجتمعٌ صغير يُسمّى المدجّنين، وكان يكتب بالعربية بحروفٍ لاتينية، وكان يحفظ القرآن والتقاليد في نصوصٍ سرية. وقد كانت هذه النصوص تُسمّى كتب المدجّنين، وكانت تُنسخ وتُخبّأ، وكان في هذا إصرارٌ على حفظ الذاكرة في ظروفٍ لا تسمح بالكتابة العلنية. وقد كان في هذا الحفظ السرّي دليلًا على أن الذاكرة لا تُلغى بقرار، وأنها تنتقل من المسجد إلى البيت، ومن الكتاب إلى الصدر، وأنها تعود في الجيل الثالث بلغةٍ أخرى.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بدأ الاهتمام الأوروبي بالأندلس في القرن التاسع عشر، وكان في سياقٍ رومانسي، وكان الرحّالة يزورون الحمراء ويصفونها ويكتبون عنها، وكان من أشهرهم كاتب أمريكي كتب حكايات الحمراء سنة ١٨٣٢م، وقد كان كتابه أشبه بإعادة اختراع للمكان، لأنه خلط التاريخ بالأسطورة، وكان في هذا الكتاب أثرٌ كبير في تصوير الأندلس في الخيال الأوروبي. وقد كان في هذا الكتاب أثرٌ في قرار ترميم الحمراء، لأن الزيارة جعلت من القصر موردًا اقتصاديًّا، وكان في هذا حفظٌ للمكان لأسبابٍ لم تكن في حسابه الأصلي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد صار الحمراء في هذا القرن موضوعًا للرسم والشعر والموسيقى، وكان في هذا الاهتمام شيءٌ من الحنين إلى عالمٍ ضاع، وكان في الوقت نفسه شيئًا من الاستشراق الذي يرى الشرق مرآةً لأحلامه لا موضوعًا لدراسته. وقد كان في ه
