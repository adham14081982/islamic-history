e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الثاني: خلافة قرطبة\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٣ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٢\u003ci\u003e.\u003c/i\u003e٣\u003c/span\u003e\n            \u003ch3\u003e📚 العلم والأدب في قرطبة\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي القرن الرابع الهجري صارت قرطبة واحدة من أكبر مدن العلم في العالم، فيها مكتباتٌ ودواوين ودارٌ للطب وجامعٌ يُدرَّس فيه، وفيها أطباء وفلكيون ونحويون وشعراء. ولم يكن ذلك معجزة، بل كان نتيجة مالٍ يُنفق وسلطانٍ يحمي.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان العلم في قرطبة يقوم على ثلاثة أعمدة: المسجد الجامع وكان يُدرَّس فيه، ومجالس الأمراء وكانت تُستدعى إليها الكتب والعلماء، والأسواق والورّاقون وكانت تُبيع الكتب وتنسخها. وقد كان في قرطبة في القرن الرابع الهجري عددٌ كبير من الورّاقين، وكان الورّاق ينسخ الكتاب ويُجلّده ويبيعه، وكانت هذه صناعةً كاملة لها سوقها وأسعارها وقواعدها. وكانت هذه الأعمدة الثلاثة تتفاعل: فالمسجد يجلب الطلبة، والسوق يجلب الكتب، والقصر يجلب المال، فإذا اجتمعت الثلاثة قامت مدينةٌ عالمة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بلغت مكتبة الخليفة الحكم المستنصر في هذا العهد ما تُقدّره المصادر بمئات الآلاف من المجلدات، والأرجح أن الرقم مبالغ فيه، لكن الثابت أن المكتبة كانت تُدار بفهرسٍ يُسمّى الفهرست، وأن فيها أقسامًا، وأن فيها من الكتب ما جُلب من بغداد ودمشق والقاهرة والقيروان. وقد كان الخليفة يبعث من يشتري الكتب في المشرق، ويكتب إلى العلماء يطلب منهم نسخ مؤلفاتهم، وهذا سلوكٌ يدل على أن الكتاب كان سلعةً نفيسةً تُطلب من مسافة أشهر. وقد كانت هذه الكتب تُنسخ على ورقٍ يُصنع في الأندلس، وكان الورق نفسه صناعةً نقلها المسلمون من الصين إلى سمرقند ثم إلى المغرب والأندلس، وهذا يفسّر كثرة النسخ ورخصها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ظهر في هذا العهد أطباء وعلماء بلغوا مكانةً عالية، ومنهم أبو القاسم الزهراوي وكان طبيبًا في بلاط الحكم المستنصر، وقد كتب كتابه في الجراحة والأدوات، وفيه وصفٌ لأدواتٍ لم تكن معروفة في أوروبا، ومنهم ابن جلجل وكان طبيبًا ومؤرخًا للأطباء، ومنهم مسلمة المجريطي وكان فلكيًّا ورياضيًّا، وقد اختصر كتب الفلك في المشرق وعدّلها، ومنهم ابن السمح وكان في الحساب والفلك.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت اللغة العربية في هذا العهد لغة العلم في شبه الجزيرة كلها، فكان النصارى الذين يريدون أن يتعلّموا الطب أو الفلك أو الفلسفة يتعلّمون العربية أولًا، وكانت الكنائس نفسها تكتب بالعربية في عقودها ورسائلها. وقد بقي من ذلك نصوصٌ تُسمّى بشعر المستعربين، وهي قصائد في العربية على أوزانٍ عربية بقلم نصارى، وهذا يدل على أن اللغة كانت ثقافةً مشتركةً لا علامةً دينية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في قرطبة إلى جانب العلم الشرعي علمٌ آخر يُسمّى علم الأنساب والأخبار، وكانت البلاد قد صارت لها مدرسةٌ تاريخية خاصة، فيها من كتب في أخبار الأندلس وفتوحها وأنساب قبائلها. وقد كان هذا العلم ضروريًّا لدولةٍ تحتاج إلى شرعية: فمن يكتب أنساب العرب في الأندلس يُثبت أن هذه البلاد صارت دارًا لهم لا معبرًا، وهذا ما فعله مؤرخو القرن الرابع والخامس.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا العهد أيضًا شعرٌ بلغ درجةً عالية، وكان الشعر يُنظَم في المدح والرثاء والوصف والغزل، وكان في قصور الخلافة شعراء يُجالسون الخليفة ويُنشدونه. وقد ظهر في الأندلس ما يُسمّى بالموشّح، وهو شكلٌ شعري جديد لا يُقلّد المشرق، وقد انتشر بعد ذلك في المغرب والمشرق، وصار من أشهر ما صدّرته الأندلس إلى العالم الإسلامي في الأدب. وقد كان هذا الشعر يُنشد في المجالس ويُكتب على الجدران ويُحفظ في الدواوين، وكان له جمهورٌ في قرطبة يتذوّق الوزن والصورة، وهذا ما يجعل الأدب مؤشرًا على حال المدينة لا على حال الشعراء وحدهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان لهذا العلم كله ثمنٌ وشرط: ثمنه المال الذي يُنفق على الورّاقين والمكتبات والرواتب، وشرطه الأمن الذي يجعل العالم يشتغل بلا خوف. فلمّا سقطت الخلافة ودخلت البلاد في الفتنة، هاجر كثير من العلماء إلى طليطلة وإلى المغرب وإلى المشرق، وحملوا معهم كتبهم، وكانت هذه الهجرة بداية انتقال العلم من الأندلس إلى أوروبا في القرنين التاليين. وكان في هذه الهجرة خسارةٌ للأندلس ومكسبٌ لأوروبا، لأن الكتب التي خرجت مع العلماء هي التي دخلت بعد قرن إلى مدرسة طليطلة فوُلدت منها نهضة الترجمة.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالورّاقون وسوق الكتاب\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الورّاق في قرطبة يعمل في مهنةٍ لها أصول: ينسخ بخطٍّ معروف، ويُقابل النسخة على أصلها، ويُجلّد، ويبيع في دكّانه أو في سوق الورّاقين. وقد كانت أسعار الكتب تتفاوت بحسب الخط والورق والتجليد وطول الكتاب، وكانت الكتب الكبيرة تُشترى بالتقسيط أحيانًا، وكان بعض الناس يُوقف كتبه على المسجد لتُقرأ.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت هذه الصناعة تُنتج ما يُشبه الجمهور: قرّاءٌ لا يملكون الكتب لكنهم يستعيرونها، وطلبةٌ ينسخون لأنفسهم، وعلماءٌ يُهدون نسخًا. ولهذا لم يكن العلم في قرطبة محصورًا في القصر، بل كان في المسجد والسوق والبيت، وهذا هو ما يُفسّر كثرة العلماء في مدينةٍ لم تكن أكبر مدن العالم في ذلك الوقت.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالطب والجراحة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الطب في الأندلس مهنةً لها تنظيم: طبيبٌ يُجاز، ومريضٌ يُعالج، ودارٌ للمرضى، وصيدليةٌ فيها ما يُعرف اليوم بالأدوية المركّبة. وقد كتب الزهراوي في الجراحة ووصف أدواتٍ دقيقة، وتحدّث عن ربط الأوعية وعن الخياطة وعن علاج الأسنان، وكان يرى أن الجرّاح يجب أن يعرف التشريح قبل أن يقطع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد انتقل كتابه إلى أوروبا في العصور الوسطى وترجم إلى اللاتينية، وكان يُدرَّس في جامعاتها قرونًا، وصار اسمه في اللاتينية ألبوكاسيس. وهذا مثالٌ واضح على أن العلم في الأندلس لم يكن علمًا محليًّا يُستهلك في مكانه، بل كان علمًا يُصدَّر ويُترجم ويُغيّر ما حوله، وهذا هو معنى الحضارة لا معنى الثقافة المحلية.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالمستعربون واللغة المشتركة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان النصارى في قرطبة يُسمّون المستعربين، وكان كثير منهم يتكلّم العربية في البيت ويُصلّي باللاتينية في الكنيسة، وكانت عقودهم ومحاضرهم مكتوبة بالعربية. وقد أثار هذا عند بعض رجال الدين في الشمال قلقًا، فكتب أحدهم يُنبّه إلى أن النصارى تعلّموا لغة العرب وأدبهم حتى صاروا يُنشدون الشعر العربي ويُفضلونه على شعرهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان هذا القلق نفسُه دليلًا على قوّة الثقافة: فالثقافة التي تُغيّر لغة الناس لا تحتاج إلى جيش، تحتاج إلى أسواقٍ ومدارس وكتب. وقد بقي هذا الأثر بعد سقوط قرطبة، فالمستعربون هم الذين حملوا العربية إلى طليطلة، وهم الذين عملوا في مدرسة الترجمة بعد ذلك، وهم الذين جعلوا من سقوط مدينة بداية انتقال علم.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمكتبة\u003c/b\u003e\u003cspan\u003eمكتبة الحكم المستنصر بمئات الآلاف\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالطب\u003c/b\u003e\u003cspan\u003eالزهراوي وابن جلجل ومسلمة المجريطي\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالصناعة\u003c/b\u003e\u003cspan\u003eالورّاقون ونسخ الكتب وبيعها\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالأدب\u003c/b\u003e\u003cspan\u003eالشعر والموشّح\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eاللغة\u003c/b\u003e\u003cspan\u003eالعربية لغة العلم والإدارة\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمجال\u003c/th\u003e\u003cth\u003eمن أعلامه\u003c/th\u003e\u003cth\u003eأثره\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالجراحة\u003c/td\u003e\u003ctd\u003eأبو القاسم الزهراوي\u003c/td\u003e\u003ctd\u003eكتاب في الجراحة والأدوات\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالطب والتاريخ\u003c/td\u003e\u003ctd\u003eابن جلجل\u003c/td\u003e\u003ctd\u003eطبقات الأطباء\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالفلك والحساب\u003c/td\u003e\u003ctd\u003eمسلمة المجريطي\u003c/td\u003e\u003ctd\u003eاختصار وتعديل جداول الفلك\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالأدب\u003c/td\u003e\u003ctd\u003eشعراء الخلافة\u003c/td\u003e\u003ctd\u003eالموشّح وانتشاره\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالكتاب\u003c/td\u003e\u003ctd\u003eالورّاقون\u003c/td\u003e\u003ctd\u003eسوقٌ للكتب ومكتباتٌ عامة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eوَقُل رَّبِّ زِدْنِي عِلْمًا\u003c/p\u003e\u003ccite\u003eسورة طه، الآية ١١٤\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eقام علم قرطبة على مسجدٍ يُدرَّس فيه وسوقٍ يُنسخ فيها كتاب ومجالس تُنفق على العلماء، فصار العلم صناعةً لا هواية. ولمّا سقطت الخلافة هاجر العلماء بالكتب، فكانت الهجرة نفسها بداية انتقال العلم إلى أوروبا.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"al-mansur","n":"ابن أبي عامر: الحاجب الذي حكم باسم الخليفة","ic":"🐎","part":"القسم الثاني: خلافة قرطبة","h":"\u003carticle class=\"ch3\" id=\"al-mansur\" data-toc=\"ابن أبي عامر: الحاجب الذي حكم باسم الخليفة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الثاني: خلافة قرطبة\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٤ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٢\u003ci\u003e.\u003c/i\u003e٤\u003c/span\u003e\n            \u003ch3\u003e🐎 ابن أبي عامر: الحاجب الذي حكم باسم الخليفة\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي سنة ٩٧٦م مات الخليفة وترك طفلًا في الحادية عشرة، فقام رجل من خارج البيت الحاكم فحكم الدولة ثلاثًا وعشرين سنة باسم الخليفة لا بلقبه، وخرج في نحو خمسين حملة، ولم يخسر واحدة.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eمات الحكم المستنصر سنة ٩٧٦م، وكان ابنه هشام في الحادية عشرة، فصار الخلافة في يد طفل، وكان في القصر حجّابٌ ونساءٌ وصقالبة يتنازعون الوصاية. وقد كان محمد بن أبي عامر أحد هؤلاء الحجّاب، وكان رجلًا من أصلٍ عربي يمني لا من بيت الخلافة، وكان ذكيًّا يعرف كيف يُدير الناس، فقرّبه الحكم في آخر عمره، ثم صار بعد موته هو الذي يُدير الدولة فعليًّا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أخذ ابن أبي عامر السلطة بخطواتٍ متدرّجة: فبدأ بمنصب الحجابة ثم أخذ إدارة الأموال، ثم أبعد الخصوم من القصر واحدًا واحدًا، ثم نقل الخليفة الطفل من الزهراء إلى الزاهرة المدينة التي بناها لنفسه، وكان في هذا النقل معنى سياسي كبير: أن الخليفة صار في بيت الحاجب لا في بيت أبيه، وأن الناس صاروا يقصدون الحاجب لا الخليفة. وقد كان في هذا التدرّج فقهٌ سياسي: أن لا يأخذ السلطة مرةً واحدة فتُثير عليه الجميع، بل يأخذها خطوةً خطوةً فيُشغل كل خصمٍ بالذي بعده حتى يبقى وحده في القمة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أدرك ابن أبي عامر أن الشرعية في الأندلس لا تُبنى بالدم بل بالجهاد والفتوح، فبدأ سلسلةً من الحملات على الشمال، وكان يخرج في كل سنة مرتين: حملةً في الصيف وحملةً في الشتاء، وقد بلغت حملاته في رواية ابنه نحو اثنتين وخمسين حملة، ولم يُهزم في واحدة منها، وكانت هذه الحملات تُنتج ثلاث نتائج في وقت واحد: غنائم تُموّل الجيش، وهيبة تُخيف الممالك الشمالية، وشعبية تُبرّر سلطته أمام أهل الأندلس. وقد كان ابن أبي عامر يعرف هذا، فكان يحرص على أن تكون كل حملة ناجحة، لأن الحملة التي تُخفق تُعطي خصومه في القصر والقضاء سلاحًا يُضعف به سلطته.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بلغت حملاته مدًى بعيدًا: فسار إلى برشلونة سنة ٩٨٥م فدخلها وخرّبها، وكانت برشلونة في ذلك الوقت مدينةً قوية على الساحل الشرقي، ثم سار إلى شنت ياقب سنة ٩٩٧م، وهي مدينة الحجّاج النصارى في الشمال الغربي، فدخلها وخرّب كنيستها الكبرى وحمل أبوابها وأجراسها على أكتاف الأسرى إلى قرطبة، فوُضعت في سقف الجامع. وكان في هذا العمل معنى رمزي صريح: أن رموز الدين الآخر صارت تُعلّق في مسجد الدولة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان هذا النجاح العسكري يُخفي مشكلةً بنيوية: فابن أبي عامر لم يكن خليفةً ولا من بيت الخلافة، وكانت شرعيته كلها في النصر، فكان لا يستطيع أن يتوقف عن الحرب. وقد بنى جيشًا كبيرًا من البربر ومن الصقالبة، وكان يُقطع لهم الأرض ويُعطيهم الرواتب، فصار الجيش يعتمد عليه شخصيًّا لا على الدولة، وهذا ما جعل الدولة تُصبح بعد موته ساحةً للجنود.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد مات ابن أبي عامر سنة ١٠٠٢م في مدينة سالم في أثناء عودته من حملة، وقد قال المؤرخون إنه مات في آخر حملة له، وهذا موتٌ يُشبه حياته: أن ينتهي الرجل في الطريق بين معركتين. وقد خلّف ابنه عبد الملك الذي سار على سياسته ثلاث سنوات، ثم خلّف أخاه عبد الرحمن الملقّب بشنجول، وكان شابًّا لا يعرف سياسةً ولا حربًا، فطلب الخلافة لنفسه، فانقلب عليه الناس والجيش، وقُتل سنة ١٠٠٩م، وفي هذه السنة نفسها بدأت الفتنة الكبرى التي مزّقت الخلافة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بقي من آثار هذا العهد المدينة الزاهرة، وكانت مدينةً كاملة بُنيت شرق قرطبة لتكون مقرّ الحاجب، وقد خرّبها البربر سنة ١٠٠٩م كما خرّبوا الزهراء، فلم يبقَ منها أثرٌ ظاهر. وبقي أيضًا أثره في اللغة والتاريخ: فالمؤرخون يعدّون عهده آخر عهود القوة الأندلسية، ويقولون إن الخلافة لم تسقط سنة ١٠٠٩م بل سقطت حين صار الحاجب أقوى من الخليفة، وهذا تشخيصٌ دقيق لمرض الدول: أن تُفرغ المؤسسة من مضمونها وهي قائمة الشكل.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eكيف حكم رجل بلا لقب\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يكن ابن أبي عامر يستطيع أن يُلغي الخلافة، لأن الخلافة هي مصدر الشرعية الوحيد في الدولة، فحكم بلا لقبٍ وأبقى الخليفة في مكانه، وكان يظهر أمام الناس كخادمٍ للخليفة لا كحاكم. وكان يخطب للخليفة على المنابر، ويُصكّ النقود باسمه، ويُصلي في الجامع، ويُظهر التواضع في مجلسه، وكانت هذه كلها أقنعةً ضرورية لسلطةٍ لا تملك الشرعية في ذاتها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان هذا النموذج يُشبه ما سيحدث في المشرق بعد قرن، حين صار السلاجقة يُديرون الخلافة العباسية باسم الخليفة، وحين صار الوزراء في القاهرة يُنصّبون الخلفاء الفاطميين ويعزلونهم. ولهذا يُقال إن القرن الرابع الهجري هو قرن الحجّاب والوزراء، وهو قرنٌ صارت فيه السلطة الفعلية منفصلةً عن السلطة الرمزية، وهذا انفصالٌ يُنهك الدول في كل زمان.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالحملات: الحرب كسياسة داخلية\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت حملات ابن أبي عامر تُخطّط لتُؤدّي وظائف داخلية أكثر مما تُؤدّي وظائف خارجية: فالغنائم تُموّل الجيش البربري الذي يعتمد عليه، والنصر يُعطي شرعيةً للحاجب أمام فقهاء قرطبة وعامتها، والخروج السنوي يُشغل الجيش فلا يتحوّل إلى قوةٍ عاطلة في العاصمة. وقد كان في هذا فهمٌ عميق لطبيعة الجيوش: الجيش الذي لا يعمل يبحث عن عمل، وغالبًا يجده في السياسة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت الحملات أيضًا تُنتج خرابًا في الشمال لا فتحًا دائمًا، فلم تكن أهدافها الاحتلال بل الضرب والغنيمة والإجبار على الجزية. ولهذا لم تُغيّر هذه الحملات خريطة الحدود، لكنها أضعفت ممالك الشمال سنوات، وأخّرت تقدّمها، وهذا فرقٌ بين حربٍ تُغيّر الخريطة وحربٍ تُغيّر التوازن، والأندلس عاشت على النوع الثاني قرونًا.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eنهاية العهد وبداية الفتنة\u003c/h4\u003e\u003cp class=\"ap\"\u003eمات ابن أبي عامر سنة ١٠٠٢م، ثم مات ابنه عبد الملك سنة ١٠٠٨م، ثم قُتل أخوه شنجول سنة ١٠٠٩م، وفي هذه السنوات القليلة انكشف أن الدولة كانت تقوم على رجلٍ لا على نظام. فالجيش البربري الذي بناه ابن أبي عامر لم يكن له سببٌ للولاء لخليفةٍ طفل، وكان الصقالبة يرون أن من حقهم الوصاية، وكانت قرطبة نفسها ترى أن الخلافة صارت لعبةً في يد الحجّاب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بدأت الفتنة بقتالٍ بين البربر والصقالبة في قرطبة، ثم صارت حربًا على الخلافة نفسها: خليفةٌ يُخلع وآخر يُنصّب، ثم خليفةٌ في قرطبة وآخر في مالقة، ثم تدخّل ملوك الشمال في الصراع. وهذا ما يجعل سنة ١٠٠٩م بداية عصرٍ جديد في الأندلس، وهو العصر الذي تُعالجه الفصول التالية: عصر الفتنة والطوائف ثم المرابطين والموحدين ثم غرناطة.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالوصول\u003c/b\u003e\u003cspan\u003eسنة ٩٧٦م بعد موت الحكم المستنصر\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالحملات\u003c/b\u003e\u003cspan\u003eنحو اثنتين وخمسين حملة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eبرشلونة\u003c/b\u003e\u003cspan\u003eسنة ٩٨٥م ودخولها\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eشنت ياقب\u003c/b\u003e\u003cspan\u003eسنة ٩٩٧م وحمل الأجراس\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالوفاة\u003c/b\u003e\u003cspan\u003eسنة ١٠٠٢م في مدينة سالم\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e٩٧٦م\u003c/td\u003e\u003ctd\u003eموت الحكم المستنصر\u003c/td\u003e\u003ctd\u003eطفلٌ في الخلافة وحجّابٌ يتنازعون\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٩٧٨م\u003c/td\u003e\u003ctd\u003eاستقرار ابن أبي عامر\u003c/td\u003e\u003ctd\u003eسلطةٌ فعلية بلا لقب\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٩٨٥م\u003c/td\u003e\u003ctd\u003eدخول برشلونة\u003c/td\u003e\u003ctd\u003eهيبةٌ وغنائم وشعبية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٩٩٧م\u003c/td\u003e\u003ctd\u003eدخول شنت ياقب\u003c/td\u003e\u003ctd\u003eأجراس الكنيسة في سقف الجامع\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٠٠٢م\u003c/td\u003e\u003ctd\u003eموته في مدينة سالم\u003c/td\u003e\u003ctd\u003eانتقال السلطة إلى ابنه\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٠٠٩م\u003c/td\u003e\u003ctd\u003eقتل شنجول\u003c/td\u003e\u003ctd\u003eبداية الفتنة الكبرى\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eإِنَّ الْمُلْكَ لِلَّهِ يُؤْتِيهِ مَن يَشَاءُ\u003c/p\u003e\u003ccite\u003eسورة البقرة، الآية ٢٤٧\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eحكم ابن أبي عامر ثلاثًا وعشرين سنة بلا لقب، وبنى شرعيته على النصر والغنيمة، فكان لا يستطيع أن يتوقف عن الحرب. ولمّا مات انكشف أن الدولة كانت تقوم على رجل لا على نظام، فبدأت الفتنة التي أكلت الخلافة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-3","n":"القسم الثالث: الفتنة وملوك الطوائف","ic":"","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-3\" style=\"--c:#B0304A\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e💔\u003c/div\u003e\n      \u003ch2\u003eالقسم الثالث: الفتنة وملوك الطوائف\u003c/h2\u003e\n      \u003cp\u003eبعد سنة ١٠٠٩م دخلت الأندلس في فتنةٍ أكلت الخلافة نفسها، ثم قامت مكانها نحو عشرين دويلة صغيرة تُسمّى ملوك الطوائف. وفي هذا العصر ازدهر الشعر والعلم ازدهارًا عجيبًا، وانهارت الدولة انهيارًا عجيبًا، وكأن البلاد أرادت أن تُثبت أن الثقافة قد تعيش بلا سياسة.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#collapse\"\u003eسقوط الخلافة\u003c/a\u003e\u003ca href=\"#taifas\"\u003eملوك الطوائف\u003c/a\u003e\u003ca href=\"#taifa-culture\"\u003eثقافة الطوائف: العلم في زمن الانقسام\u003c/a\u003e\u003ca href=\"#murabitun\"\u003eالمرابطون: الإنقاذ الذي صار ضمًّا\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"collapse","n":"سقوط الخلافة","ic":"🏚️","part":"القسم الثالث: الفتنة وملوك الطوائف","h":"\u003carticle class=\"ch3\" id=\"collapse\" data-toc=\"سقوط الخلافة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الثالث: الفتنة وملوك الطوائف\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ١ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٣\u003ci\u003e.\u003c/i\u003e١\u003c/span\u003e\n            \u003ch3\u003e🏚️ سقوط الخلافة\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي سنة ١٠٠٩م قُتل آخر حاجبٍ قوي، وفي اثنتين وعشرين سنة بعدها جلس على عرش قرطبة سبعةٌ من الخلفاء، بعضهم حكم شهورًا وبعضهم حكم أيامًا. وفي سنة ١٠٣١م اجتمع أهل قرطبة فألغوا الخلافة نفسها.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكانت الفتنة في أول أمرها صراعًا على الوصاية لا على الخلافة: فالصقالبة الذين أداروا القصر أرادوا وصيًّا يُشبه ابن أبي عامر، والبربر الذين قاتلوا في جيوشه أرادوا نصيبًا من السلطة، وأهل قرطبة أرادوا خليفةً قويًّا يُعيد الأمن. وقد تحوّل هذا الصراع في أشهرٍ قليلة إلى حربٍ في الشوارع، ودخل الناس بيوتهم وأغلقوا أسواقهم، وخرج الجند إلى المدينة ينهب، وهذا ما يحدث في كل مدينةٍ ينهار فيها مركز السلطة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سنة ١٠٠٩م خُلع هشام المؤيد ونُصّب محمد المهدي، وكان من أحفاد عبد الرحمن الثالث، ثم ثار عليه البربر فنصّبوا سليمان المستعين، ثم عاد المهدي، ثم عاد سليمان، وكان كل خليفةٍ يُنصّب بجيشٍ ويُخلع بجيش. وقد بلغت الفتنة في قرطبة حدًّا جعل المدينة تُقسم إلى أحياءٍ متحاربة، وحين دخل البربر قرطبة سنة ١٠١٣م خرّبوا الزهراء وأحرقوا أجزاءً منها، وكان خراب المدينة الملكية إعلانًا بأن الدولة التي بَنَتها قد انتهت.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا العصر خليفةٌ اسمه المستكفي بالله، وكانت له بنت تُسمّى ولادة بنت المستكفي، وقد صارت في قرطبة صاحبة مجلسٍ أدبي يُجتمع فيه الشعراء، وكانت تُنشد الشعر وتُعارض به، وكان لها في التاريخ الأدبي مكانٌ لم يكن لغيرها من نساء الأندلس. وهذه التفصيلة الصغيرة تُظهر شيئًا مهمًّا: أن الحياة الثقافية في قرطبة لم تتوقف في أثناء الفتنة، بل استمرّت في المجالس الخاصة حين توقّفت في القصور.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد استمرّ تعاقب الخلفاء حتى سنة ١٠٢٧م، ثم جلس هشام الثالث المعتمد، وكان حكمه أربع سنوات في ظلّ وزيرٍ قوي هو أبو الحزم بن جهور، وكانت قرطبة قد صارت مدينةً مُنهكة، خرّبت فيها الحروب أحياءً كثيرة، وانقطع عنها دخلها من الأطراف، وصار الجند يطلب رواتبه فلا يجد. وفي هذه الحال لم يبقَ للخليفة من السلطة إلا الاسم، ولم يبقَ في المدينة من يحمي هذا الاسم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سنة ١٠٣١م اجتمع أعيان قرطبة وقضاتها ورجالها، فقرّروا إلغاء الخلافة وإقامة حكمٍ يُديره مجلسٌ من الوجهاء، وكان هذا القرار فريدًا في تاريخ الإسلام: أن تُلغى الخلافة في مدينةٍ بالإجماع لا بالغلبة، وأن يُقال صراحةً إن الخلافة صارت سببًا للفتنة لا نظامًا للحكم. وقد صار هذا المجلس يُدير المدينة سنوات، لكنه لم يستطع أن يُعيد إليها ما فقدته، لأن المدينة لم تكن قد فقدت خليفةً فقط، بل فقدت مركزًا يجمع الأطراف.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان سقوط الخلافة نتيجةً لثلاثة أسباب مجتمعة: جيشٌ لا يخصّ الدولة بل يخصّ من يدفع، وخلافةٌ صارت وراثيةً في بيتٍ واحد لا انتخابًا ولا غلبةً، واقتصادٌ انهار حين انقطعت الأطراف عن دفع الخراج. وقد كان في كل سببٍ منها ما يكفي لإسقاط دولة، فكيف إذا اجتمعت الثلاثة في عشرين سنة؟ ولهذا لم يُعِد أحدٌ الخلافة في الأندلس بعد ذلك، مع أن بعض ملوك الطوائف حاولوا أن يتلقّبوا بها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت الأطراف قد استقلّت قبل ذلك بأعوام: فإشبيلية استقلّت سنة ١٠٢٣م على يد بني عباد، وغرناطة على يد بني زيري، وطليطلة على يد بني ذي النون، وبلنسية ومرسية ودانية وبطليوس والمرية وسرقسطة، حتى صارت الأندلس عشرين مملكة. ولم يكن هذا الاستقلال خيانةً في نظر أصحابه، بل كان استجابةً لواقع: أن قرطبة لم تعد قادرة على حماية أحد، فحماية كل مدينةٍ نفسها صارت ضرورةً لا خيارًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بقي في الذاكرة الأندلسية أثرٌ لهذه السنوات، فصار يُقال في الأمثال: كفتنة قرطبة، وصار المؤرخون يؤرّخون بها نهاية عصرٍ وبداية عصر. وهذا شأن التواريخ: لا تنكسر عند سنةٍ واحدة، بل عند سلسلةٍ من السنين يظهر بعدها أن ما كان قائمًا قد سقط، وأن الناس قد بدأوا يعيشون في زمنٍ آخر قبل أن يُدركوا ذلك. وقد صار هذا الأثر جزءًا من الوعي الأندلسي بعد ذلك، فكان كل من كتب في السياسة يبدأ من سؤال: كيف نمنع تكرار فتنة قرطبة؟\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالجيش الذي أسقط الدولة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الجيش في عهد ابن أبي عامر جيشًا من البربر والصقالبة يُدفع له راتب، وكان ولاؤه لمن يدفع لا لمن يحكم. فلمّا مات ابن أبي عامر، صار كل فريقٍ يريد أن يكون هو الذي يدفع، أي أن يكون هو الذي يحكم، فدخل الجيش في السياسة لا لحماية الدولة بل ليقتسمها. وهذا هو الفرق بين جيشٍ يحمي دولة وجيشٍ يبحث عن دولةٍ يحميها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ظهر هذا في صورةٍ صريحة: أن الوزراء صاروا يستعينون بالبربر، وأن الخليفة صار يستعين بالصقالبة، وأن كل فريقٍ صار يُنصّب خليفةً يُناسبه. ولم يكن في المدينة مؤسسةٌ تحكم بينهم، لأن الخلافة نفسها كانت هي المؤسسة الوحيدة، فلمّا صارت موضع نزاع، لم يبقَ حكمٌ يُحتكم إليه.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eلماذا أُلغيت الخلافة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان إلغاء الخلافة سنة ١٠٣١م قرارًا عمليًّا لا نظريًّا: فقد رأى أعيان قرطبة أن بقاء اللقب يُغري كل طامعٍ بأن يُنصّب خليفةً ويُقاتل باسمه، وأن إلغاءه يُغلق هذا الباب. وقد كان في القرار اعترافٌ بأن الخلافة لم تعد تُنتج أمنًا، وأن المدينة تريد حكمًا يُدير شأنها لا لقبًا يُقاتل عليه الناس.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد اختار أهل قرطبة نظامًا يُشبه حكم الأعيان، وكان يُدار من مجلسٍ من الوجهاء والقضاة، وقد استمرّ سنوات ثم ضعفت المدينة أمام إشبيلية. وهذا يُظهر أن الشرعية الرمزية حين تُلغى لا يقوم مكانها شيءٌ بسهولة، وأن المدينة التي تُلغي رمزها تحتاج إلى مؤسسةٍ قوية تحلّ محله، وإلا صارت عرضةً لجيرانها.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالفتنة في الذاكرة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكتب مؤرخو الأندلس عن هذه السنوات بحزنٍ ظاهر، ووصفوا نهب الزهراء وخراب قرطبة وبيع الكتب من مكتباتها، وقالوا إن العلم نفسه خرج من المدينة في أكياسٍ حُملت على الدواب. وقد كان في هذا الوصف مبالغةٌ أحيانًا، لكنه يُصوّر شعور أهل العصر بأن ما جرى لم يكن تغيير حكمٍ بل انهيار عالم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد صار هذا الدرس مادةً للفكر السياسي في الأندلس بعد ذلك، فكتب ابن حزم وابن رشد وغيرهما في شروط الإمامة وأسباب الفتنة، وكانوا يكتبون وهم يرون بأعينهم ما يفعله غياب السلطة الجامعة. ولهذا كان الفكر السياسي الأندلسي فكرًا عمليًّا لا نظريًّا: يبدأ من الجرح لا من الكتاب.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالبداية\u003c/b\u003e\u003cspan\u003eسنة ١٠٠٩م بقتل شنجول\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eعدد الخلفاء\u003c/b\u003e\u003cspan\u003eسبعةٌ في اثنتين وعشرين سنة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eخراب الزهراء\u003c/b\u003e\u003cspan\u003eسنة ١٠١٣م على يد البربر\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eإلغاء الخلافة\u003c/b\u003e\u003cspan\u003eسنة ١٠٣١م بقرار أهل قرطبة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالنتيجة\u003c/b\u003e\u003cspan\u003eنحو عشرين مملكة في الأندلس\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e١٠٠٨م\u003c/td\u003e\u003ctd\u003eموت عبد الملك المظفّر\u003c/td\u003e\u003ctd\u003eانقطاع سلسلة الحجّاب الأقوياء\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٠٠٩م\u003c/td\u003e\u003ctd\u003eقتل شنجول وخلع هشام\u003c/td\u003e\u003ctd\u003eبداية تعاقب الخلفاء\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٠١٣م\u003c/td\u003e\u003ctd\u003eدخول البربر قرطبة\u003c/td\u003e\u003ctd\u003eخراب الزهراء والأحياء\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٠٢٣م\u003c/td\u003e\u003ctd\u003eاستقلال إشبيلية\u003c/td\u003e\u003ctd\u003eأول مملكة طائفية كبرى\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٠٢٧م\u003c/td\u003e\u003ctd\u003eخلافة هشام الثالث\u003c/td\u003e\u003ctd\u003eخليفةٌ بلا سلطة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٠٣١م\u003c/td\u003e\u003ctd\u003eإلغاء الخلافة\u003c/td\u003e\u003ctd\u003eمجلس أعيان يُدير قرطبة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eوَإِذَا أَرَدْنَا أَن نُّهْلِكَ قَرْيَةً أَمَرْنَا مُتْرَفِيهَا فَفَسَقُوا فِيهَا\u003c/p\u003e\u003ccite\u003eسورة الإسراء، الآية ١٦\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eسقطت الخلافة لأن جيشها صار أقوى من مؤسساتها، ولأن لقبها صار أداةً في يد كل طامع. ولمّا ألغى أهل قرطبة الخلافة كانوا يُغلقون بابًا للفتنة، لكنهم لم يفتحوا بابًا للحكم، فتركت المدينة لجيرانها.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"taifas","n":"ملوك الطوائف","ic":"🏙️","part":"القسم الثالث: الفتنة وملوك الطوائف","h":"\u003carticle class=\"ch3\" id=\"taifas\" data-toc=\"ملوك الطوائف\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الثالث: الفتنة وملوك الطوائف\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٢ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٣\u003ci\u003e.\u003c/i\u003e٢\u003c/span\u003e\n            \u003ch3\u003e🏙️ ملوك الطوائف\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eق\u003c/span\u003eامت في الأندلس نحو عشرين مملكة صغيرة، لكل واحدة بلاطٌ وجيشٌ وشاعر. وقد كانت هذه الممالك أغنى من قرطبة وأضعف منها، لأن كل واحدة منها كانت تحمي نفسها من جارتها قبل أن تحمي نفسها من عدوّها.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكانت إشبيلية أقوى ممالك الطوائف، وقد حكمها بنو عباد، وكان أولهم أبو القاسم محمد بن عباد قاضيًا في المدينة ثم صار ملكًا سنة ١٠٢٣م، ثم ابنه المعتضد وكان قاسيًا في سياسته، ثم حفيده المعتمد وكان شاعرًا يُحبّ الأدب. وقد بلغت إشبيلية في عهدهم مكانةً عالية، وضمّوا إليها قرطبة ومرسية وأجزاءً من الغرب، وكانت دولتهم تُشبه مملكةً صغيرة في الحجم وكبيرة في الطموح.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت طليطلة في يد بني ذي النون، وكانت مدينةً قديمة ذات مكتبةٍ عظيمة، وقد حكمها المأمون بن ذي النون ثم القادر، وكانت سياستهم تقوم على التحالف مع قشتالة أكثر من التحالف مع إشبيلية. وقد دفعوا الجزية لقشتالة، وكانت الجزية تُسمّى في المصادر الأندلسية «الضريبة» أو «الإتاوة»، وكان دفعها يُغضب الفقهاء والعامة، لأنها صارت علامةً على تبعيةٍ لا على هدنة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت سرقسطة في يد بني هود، وكانت مملكةً قوية في الشمال الشرقي، وقد حكمها المقتدر ثم المؤتمن ثم المستعين، وكانت لهم مكتبةٌ وصفها المؤرخون، وكانوا يُقاومون قشتالة وأراغون معًا. وقد كانت سرقسطة تُشبه ثغرًا كبيرًا أكثر من مملكةٍ مستقرة، لأنها كانت تُقاتل على حدودها في كل سنة، وكانت قوّتها في حصونها وفي جيشها لا في مالها. وقد كانت سرقسطة في هذا العهد تُصدّر الجند والسلاح، وكانت مدنها محصّنة، ولهذا صمدت في وجه أراغون أطول من غيرها، ثم سقطت حين انقطعت عنها الإمدادات.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت في الأندلس ممالك أخرى كثيرة: بنو الأفطس في بطليوس، وبنو جهور في قرطبة، وبنو صمادح في المرية، وبنو زيري في غرناطة، وبنو حمود في مالقة والجزيرة، ومملكة بلنسية ومملكة دانية في الشرق. وقد كانت هذه الممالك تتحالف وتتقاطع في كل سنة، وكانت تُقاتل بعضها بعضًا بالجيش وبالشعر، لأن الحرب في هذا العصر كانت تُخاض أيضًا بالقصائد التي تُهجو الخصم في بلاطه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت المشكلة الكبرى أن هذه الممالك كانت تدفع الجزية لقشتالة وليون، وكانت الممالك الشمالية تستعمل هذا المال لتُقوّي جيشها ثم تعود لتأخذ أكثر. وقد وصف المؤرخون هذا الوضع وصفًا قاسيًا، وقالوا إن ملوك الطوائف كانوا يُموّلون عدوّهم بأيديهم، وإنهم كانوا يُشترون السلام بالمال في وقتٍ كان العدوّ يستعمل المال في شراء الأرض. وقد كان هذا التقاتل بين الممالك يُضعف الجميع، لأن كل مملكة كانت تُنفق على حرب جارتها ما تحتاجه لحرب الشمال، وكان العدوّ الشمالي يستفيد من كل خلافٍ بينها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد حاول بعضهم أن يستعين بالمرابطين في المغرب، وكان أول من فكّر في ذلك المعتمد بن عباد بعد سقوط طليطلة سنة ١٠٨٥م، وقد قيل إنه قال كلمته المشهورة: لأن أكون راعي جمالٍ في المغرب أحبّ إليّ من أن أكون راعي خنازير في قشتالة. وقد كانت هذه الكلمة تعبيرًا عن إدراكٍ متأخر: أن الحرب مع الشمال ليست حرب حدود بل حرب وجود، وأن الممالك الصغيرة لا تستطيع أن تخوضها منفردة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت نهاية الطوائف على مرحلتين: مرحلة المرابطين الذين دخلوا الأندلس سنة ١٠٨٦م ثم ضمّوها إلى دولتهم سنة ١٠٩٠م وما بعدها، ومرحلة الموحدين الذين دخلوها سنة ١١٤٧م بعد سقوط دولة المرابطين. وقد كان في كلتا المرحلتين الدرس نفسه: أن الأندلس لا تحكم نفسها إلا بمركزٍ قوي، وأن المركز إذا جاء من الخارج جاء غالبًا لا حليفًا. وقد كان المرابطون في أول أمرهم يُريدون الأندلس ساحةً للجهاد لا ولايةً يُديرونها، ولهذا عاد قائدهم بعد النصر إلى المغرب، ثم غيّر رأيه حين رأى أن الطوائف لا تُصلح ما أفسدت.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بقي من هذا العصر أثرٌ في الجغرافيا السياسية للأندلس: أن المدن صارت مراكز هوية، وأن لكل مدينةٍ شخصيتها ومدارسها وأسرها، وأن الولاء صار للبلد لا للدولة. وهذا ما يُفسّر لماذا صمدت بعض المدن سنوات في وجه الحصار في القرن الثالث عشر، ولماذا سقطت أخرى في أسابيع: فقد كانت الحرب في هذا العصر حرب مدنٍ لا حرب دولة. وقد صار هذا الدرس واضحًا في القرن الثالث عشر، حين سقطت قرطبة ثم بلنسية ثم إشبيلية في سنواتٍ متقاربة، ولم تستطع أي مدينةٍ أن تُنجد الأخرى لأنها كانت تُقاتل وحدها.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eبنو عباد في إشبيلية\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان بنو عباد أسرةً من أصلٍ عربي يمني، وكان جدّهم قاضيًا في إشبيلية، وقد صاروا ملوكًا بالتدريج: أخذوا المدينة في اضطراب الفتنة، ثم ضمّوا الأطراف، ثم صاروا أقوى مملكة في الجنوب. وقد كان المعتضد يستعمل القسوة في سياسته، وكان المعتمد يستعمل الشعر، وكلاهما كان يستعمل المال في شراء الطاعة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بلغت إشبيلية في عهد المعتمد ذروةً ثقافية، وكان في بلاطه ابن عمار الشاعر الذي صار وزيرًا ثم قُتل، وكان المعتمد نفسه شاعرًا مُجيدًا، وكانت قصائده في الأسر من أصدق ما كُتب في هذا الباب. وقد نُفي المعتمد إلى أغمات في المغرب بعد أن ضمّ المرابطون مملكته، ومات هناك سنة ١٠٩٥م، وصار أسره مادةً للشعر الأندلسي بعده قرونًا.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالجزية ولغة السياسة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الجزية التي تدفعها الطوائف لقشتالة تُسمّى في المصادر «الإتاوة»، وكانت تُدفع سنويًّا، وكانت تُحدّد بمبالغ كبيرة تُثقل الخزانة. وقد كان الفقهاء يرفضونها لأنها تُشبه الجزية التي تُؤخذ من الكافر لا من المسلم، وكان العامة يكرهونها لأنها تُذكّرهم بالتبعية، وكان الملوك يدفعونها لأنهم لا يملكون جيشًا يواجه قشتالة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا الوضع مفارقةٌ سياسية: أن المال الذي يُفترض أن يُبني به جيشٌ صار يُموّل جيش العدوّ، وأن السلام الذي يُشترى بالمال صار سلامًا مؤقتًا يُجدّد كل سنة بسعرٍ أعلى. وقد أدرك بعض ملوك الطوائف هذا، فحاولوا بناء جيوشٍ من البربر ومن المرتزقة، لكن المال لم يكن يكفي لحربٍ دائمة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالمدن والهوية\u003c/h4\u003e\u003cp class=\"ap\"\u003eفي عصر الطوائف صارت لكل مدينةٍ شخصية: قرطبة مدينة العلم والحنين إلى الخلافة، وإشبيلية مدينة الأدب والسياسة، وطليطلة مدينة الكتب والترجمة، وسرقسطة مدينة الحصون والحدود، وغرناطة مدينة الجند البربر. وقد ظهر هذا في الشعر وفي النثر وفي العمارة، وكان لكل بلاطٍ لونه ومجلسه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان لهذا أثرٌ طويل: فحين سقطت المدن في القرن الثالث عشر، سقطت كل واحدة على حدة، ولم يكن هناك جيشٌ واحد يجمعها، لأن الأندلس في هذا العصر لم تكن دولة بل شبكة مدن. وهذا ما يجعل عصر الطوائف مفتاحًا لفهم سقوط الأندلس كله، لا مجرّد حلقةٍ بين الخلافة وغرناطة.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالعدد\u003c/b\u003e\u003cspan\u003eنحو عشرين مملكة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأقواها\u003c/b\u003e\u003cspan\u003eإشبيلية في يد بني عباد\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالثغور\u003c/b\u003e\u003cspan\u003eسرقسطة في يد بني هود\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالوسط\u003c/b\u003e\u003cspan\u003eطليطلة في يد بني ذي النون\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالجزية\u003c/b\u003e\u003cspan\u003eإتاوة سنوية لقشتالة وليون\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمملكة\u003c/th\u003e\u003cth\u003eالأسرة\u003c/th\u003e\u003cth\u003eملاحظة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eإشبيلية\u003c/td\u003e\u003ctd\u003eبنو عباد\u003c/td\u003e\u003ctd\u003eأقوى الطوائف ومركز الأدب\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eطليطلة\u003c/td\u003e\u003ctd\u003eبنو ذي النون\u003c/td\u003e\u003ctd\u003eمكتبة عظيمة وسياسة تحالف مع قشتالة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eسرقسطة\u003c/td\u003e\u003ctd\u003eبنو هود\u003c/td\u003e\u003ctd\u003eمملكة ثغرٍ تحارب أراغون وقشتالة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eغرناطة\u003c/td\u003e\u003ctd\u003eبنو زيري\u003c/td\u003e\u003ctd\u003eمملكة بربرية في الجنوب\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eبطليوس\u003c/td\u003e\u003ctd\u003eبنو الأفطس\u003c/td\u003e\u003ctd\u003eمملكة الغرب وأرض الحدود\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمرية\u003c/td\u003e\u003ctd\u003eبنو صمادح\u003c/td\u003e\u003ctd\u003eميناء ودار صناعة للسفن\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eوَلَا تَنَازَعُوا فَتَفْشَلُوا وَتَذْهَبَ رِيحُكُمْ\u003c/p\u003e\u003ccite\u003eسورة الأنفال، الآية ٤٦\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eقامت مكان الخلافة عشرون مملكة صغيرة، لكل واحدة بلاطٌ وشاعر وجيشٌ لا يكفي لحربٍ كبيرة. وقد اشترت هذه الممالك سلامها بالمال من عدوّها، فصار المال الذي يُفترض أن يُبني به الجيش يُموّل جيش خصمها.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"taifa-culture","n":"ثقافة الطوائف: العلم في زمن الانقسام","ic":"🖋️","part":"القسم الثالث: الفتنة وملوك الطوائف","h":"\u003carticle class=\"ch3\" id=\"taifa-culture\" data-toc=\"ثقافة الطوائف: العلم في زمن الانقسام\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الثالث: الفتنة وملوك الطوائف\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٣ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٣\u003ci\u003e.\u003c/i\u003e٣\u003c/span\u003e\n            \u003ch3\u003e🖋️ ثقافة الطوائف: العلم في زمن الانقسام\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي القرن الخامس الهجري، والبلاد تُقسَّم وتُحارب، كُتبت في الأندلس أعظم كتبها: طوق الحمامة لابن حزم، والمحكم لابن سيدة، والذخيرة لابن بسّام. وهذه مفارقةٌ يُفسّرها شيء واحد: أن البلاطات الصغيرة كانت تُنفق على الأدب أكثر من الدولة الكبيرة.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان لكل ملكٍ من ملوك الطوائف بلاطٌ يُنفق عليه، وكان البلاط يحتاج إلى شاعرٍ يُمدحه وإلى كاتبٍ يُحرّر رسائله وإلى عالمٍ يُجالسه. وقد كان هذا الإنفاق صادرًا عن حاجةٍ سياسية: فالملك الذي لا يملك شرعية الخلافة يحتاج إلى من يُعطي حكمه لغةً وجمالًا، ويحتاج إلى قصيدةٍ تجعل اسمه يبقى. ولهذا صار الشاعر في هذا العصر أقرب إلى الوزير من الشاعر في العصور الكبيرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ظهر في هذا العصر ابن حزم الأندلسي، وكان من قرطبة، وقد عاش الفتنة ورأى خرابها، وكان وزيرًا في شبابه ثم ترك السياسة وانصرف إلى العلم. وقد كتب في الفقه على مذهب الظاهر، وكتب في الأنساب والأخلاق والتاريخ والمقالات، وكان كتابه في الأهواء والنحل من أدقّ ما كُتب في وصف مذاهب الآخرين، وكان كتابه في الحبّ من أجمل ما كُتب في العربية في هذا الباب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان ابن حزم نموذجًا لعالِمٍ يعمل في زمن انهيار: فقد كان يرى أن البلاد تتفكك وأن الناس يتركون العلم، فكان يكتب بسرعةٍ ويكثر من التصنيف، وكان يرى أن حفظ العلم في الكتب أبقى من حفظه في المجالس. وقد مات سنة ١٠٦٤م في قريةٍ من قرى إشبيلية، ولم يكن له في آخر عمره تلاميذ كثيرون، ثم صار بعد قرونٍ من أكثر العلماء ذكرًا في تاريخ الفكر الإسلامي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا العصر أيضًا ابن سيدة، وكان أعمى، وكتب في اللغة كتابه المحكم والمحيط الأعظم، وكان يُصنّف في اللغة على طريقةٍ جديدة تجمع بين المعجم والاشتقاق. وكان في هذا العصر ابن عبد البرّ في قرطبة ثم في شاطبة، وكان من كبار المحدّثين، وكتابه في الصحابة وفي العلم من أهمّ ما كُتب في بابه، وقد كان هؤلاء جميعًا يعملون في مدنٍ تُحاصر وتُغيّر حكّامها، والعلم يسير معهم حيث ساروا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ازدهر الشعر في هذا العصر ازدهارًا خاصًّا، وكان من أشهره شعر الحبّ في قرطبة، حيث كانت ولادة بنت المستكفي تُقيم مجلسًا أدبيًّا في بيتها، وكان ابن زيدون يُعاصرها وقد كتب فيها أشهر قصائده، وكان بينهما ما يُشبه قصة حبٍّ سياسية، لأن كليهما كان من بيتٍ له شأن في المدينة. وقد بقي من شعر ابن زيدون ما يُنشد إلى اليوم، وفيه من الرقّة والحزن ما يجعل القارئ ينسى أنه كُتب في مدينةٍ تتفكك.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا العصر أيضًا تطوّر في النثر الفني، فصارت الرسائل تُكتب بمحسناتٍ بديعة وتُجمع في دواوين، وكان من أشهر من جمعها ابن بسّام في كتابه الذخيرة في محاسن أهل الجزيرة، وهو كتابٌ جمع أخبار الشعراء والكتّاب في الأندلس، ولو لم يُكتب لضاع كثير من أسماء هذا العصر. وقد كان في هذا الجمع وعيٌ تاريخي: أن الكاتب يعرف أن عصره يمرّ، وأنه يريد أن يحفظ منه ما يستحق الحفظ.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان هذا الازدهار في ظلّ انهيارٍ سياسي، وهذا ما يُسمّى في التاريخ الثقافي بالازدهار المتأخر: أن تُنتج الثقافة أعظم أعمالها في اللحظة التي تنهار فيها الدولة التي تحميها. وقد فسّره المؤرخون بأسباب: أن المال صار موزّعًا على بلاطات كثيرة فكثر الرعاة، وأن المنافسة بين البلاطات رفعت سعر الشعر والعلم، وأن العلماء الذين فقدوا الأمن في مدينةٍ وجدوه في مدينةٍ أخرى، وأن الحزن نفسه صار مادةً للكتابة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد انتقل هذا الإنتاج بعد ذلك إلى المغرب وإلى المشرق، فحمل المهاجرون كتبهم معهم، وكان من هؤلاء من درّس في فاس وتلمسان والقاهرة، وكان في هذا الانتقال حفظٌ للتراث الأندلسي، لأن الكتب التي بقيت في الأندلس تعرّضت للضياع في الحروب، والكتب التي خرجت مع أهلها بقيت. وهذا درسٌ في تاريخ الثقافة: أن الهجرة قد تكون طريقةً لحفظ التراث، وأن المدينة التي تُخرج علماءها تُخرج معهم ذاكرتها.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eابن حزم: العالِم في زمن الفتنة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان ابن حزم من أسرةٍ ذات مكانة في قرطبة، وقد دخل السياسة في شبابه ثم خرج منها بعد أن رأى ما رأى، وكان في تفكيره حادًّا لا يُجامل، ولهذا لم يكن له أتباع كثيرون في عصره. وقد كتب في الأخلاق كتابًا سمّاه الأخلاق والسير، وفيه يرى أن الفضائل تُطلب لذاتها لا لجزاءٍ دنيوي، وهذا رأيٌ قريب من الفلسفة الأخلاقية المستقلة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان منهجه في الفقه ظاهريًّا، أي أنه يقف عند النص ولا يتوسّع في القياس، وكان هذا المنهج يُغضب الفقهاء المالكيين في الأندلس، وكانوا يُحذّرون منه. وقد بقي كتابه المحلّى مرجعًا في الفقه الظاهري، وبقي كتابه في الملل والنحل مرجعًا في وصف المذاهب، وهذا أثرٌ عجيب لرجلٍ لم يكن له في بلده سلطان.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالشعر والمجالس\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت المجالس الأدبية في هذا العصر تُشبه الصحافة في عصرنا: فيها أخبار وأشعار ونقد وتهجّم على الخصوم، وكانت تُعقد في بيوت الأعيان وفي قصور الملوك. وقد كانت ولادة بنت المستكفي تُقيم مجلسًا في قرطبة يُجتمع فيه الشعراء، وكانت تُنشد وتُعارض، وقد بقي من شعرها ما يدل على شخصيةٍ قوية لا على امرأةٍ في الظلّ.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان ابن زيدون في هذا المجلس، وكان شاعرًا وكاتبًا وسياسيًّا، وقد سُجن ثم هرب ثم صار وزيرًا في إشبيلية، وكانت قصائده في الحنين إلى قرطبة من أجمل ما كُتب في هذا الباب. وقد صار شعره بعد ذلك مادةً للغناء في المشرق والمغرب، وهذا يدل على أن الأدب الأندلسي لم يكن محليًّا بل صار جزءًا من الذوق الإسلامي العام.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالذخيرة والوعي بالتاريخ\u003c/h4\u003e\u003cp class=\"ap\"\u003eجمع ابن بسّام كتابه الذخيرة في محاسن أهل الجزيرة، وهو كتابٌ في أربعة أقسام، وقد كتب مقدمته وهو يشكو من ضياع العلم في زمانه، ويقول إنه يكتب ليحفظ ما بقي. وقد كان في هذا الوعي شيءٌ من الحزن المنهجي: أن يعرف الكاتب أن ما يجمعه سيكون شهادةً على عصرٍ ذهب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت هذه الكتب هي التي حفظت أسماء الشعراء والكتّاب الأندلسيين، لأن الدواوين نفسها ضاعت في الحروب. ولهذا يُقال إن تاريخ الأدب الأندلسي وصلنا بفضل كتبٍ جُمعت في عصر الضعف لا في عصر القوة، وهذا ما يجعل عصر الطوائف عصرًا مركزيًّا في الثقافة الأندلسية لا مجرّد عصر انقسام سياسي.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eابن حزم\u003c/b\u003e\u003cspan\u003e٩٩٤ – ١٠٦٤م، ظاهريٌّ وصاحب طوق الحمامة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eابن سيدة\u003c/b\u003e\u003cspan\u003eالمحكم والمحيط الأعظم في اللغة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eابن زيدون\u003c/b\u003e\u003cspan\u003eشاعر قرطبة ووزير إشبيلية\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eولادة\u003c/b\u003e\u003cspan\u003eبنت المستكفي وصاحبة المجلس الأدبي\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eابن بسّام\u003c/b\u003e\u003cspan\u003eالذخيرة في محاسن أهل الجزيرة\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالعالِم\u003c/th\u003e\u003cth\u003eالمجال\u003c/th\u003e\u003cth\u003eأثره\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eابن حزم\u003c/td\u003e\u003ctd\u003eالفقه والأخلاق والملل\u003c/td\u003e\u003ctd\u003eالمحلّى وطوق الحمامة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eابن سيدة\u003c/td\u003e\u003ctd\u003eاللغة والمعجم\u003c/td\u003e\u003ctd\u003eالمحكم والمحيط الأعظم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eابن عبد البرّ\u003c/td\u003e\u003ctd\u003eالحديث والتراجم\u003c/td\u003e\u003ctd\u003eالاستيعاب في الصحابة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eابن زيدون\u003c/td\u003e\u003ctd\u003eالشعر والنثر\u003c/td\u003e\u003ctd\u003eقصائد الحنين والسياسة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eابن بسّام\u003c/td\u003e\u003ctd\u003eالأدب والتاريخ\u003c/td\u003e\u003ctd\u003eالذخيرة وحفظ أسماء العصر\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eوَلَقَدْ كَرَّمْنَا بَنِي آدَمَ\u003c/p\u003e\u003ccite\u003eسورة الإسراء، الآية ٧٠\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eازدهرت الثقافة في عصر الطوائف لأن البلاطات الكثيرة كثّرت الرعاة، ولأن الحزن صار مادةً للكتابة. وقد حفظت كتب هذا العصر أسماء من ضاعت دواوينهم، فصار عصر الانقسام السياسي عصرًا مركزيًّا في ذاكرة الأندلس الثقافية.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"murabitun","n":"المرابطون: الإنقاذ الذي صار ضمًّا","ic":"🐫","part":"القسم الثالث: الفتنة وملوك الطوائف","h":"\u003carticle class=\"ch3\" id=\"murabitun\" data-toc=\"المرابطون: الإنقاذ الذي صار ضمًّا\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الثالث: الفتنة وملوك الطوائف\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٤ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٣\u003ci\u003e.\u003c/i\u003e٤\u003c/span\u003e\n            \u003ch3\u003e🐫 المرابطون: الإنقاذ الذي صار ضمًّا\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eد\u003c/span\u003eخل يوسف بن تاشفين الأندلس سنة ١٠٨٦م ليُنقذ ملوك الطوائف من قشتالة، فأنقذهم في معركةٍ واحدة، ثم عاد إلى المغرب، ثم رجع بعد أربع سنوات ليضمّ ممالكهم إلى دولته. وهذا هو مصير من يستعين بقوةٍ أكبر منه.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eقامت دولة المرابطين في المغرب على يد عبد الله بن ياسين ويحيى بن إبراهيم الجدالي، ثم صار قائدها العسكري يوسف بن تاشفين، وقد بنى مدينة مراكش سنة ١٠٦٢م، ووحّد المغرب الأقصى تحت سلطانٍ واحد، وكانت دولته دولةً صحراوية قوية الجيش بسيطة الإدارة، تعتمد على قبائل لمتونة وعلى فقهاء يُشرعون لها. وقد كانت هذه الدولة تُشبه الدول التي تقوم في الصحاري: جيشٌ قوي وإدارةٌ بسيطة ودينٌ صارم، وقدرةٌ على الحركة السريعة، وضعفٌ في إدارة المدن والحواضر الكبيرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان المعتمد بن عباد أول من كتب إلى يوسف بن تاشفين يستنجد به بعد سقوط طليطلة سنة ١٠٨٥م، وقد وافق يوسف بعد تردّدٍ ومشورةٍ من فقهائه، وعبر المضيق سنة ١٠٨٦م بجيشٍ كبير، وكان معه المعتمد وملوك آخرون. وقد التقى الجيشان في موضع يُعرف بالزلاقة قرب بطليوس، وكانت المعركة في رمضان سنة ٤٧٩هـ، وقد انتصر المسلمون انتصارًا كاملًا، وكانت هذه المعركة من أهمّ معارك الأندلس في تاريخها كله.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا الانتصار معنى سياسي عميق: أن الأندلس لم تكن عاجزة عن الانتصار بل كانت عاجزة عن التوحّد، وأن جيشًا واحدًا يقوده قائدٌ واحد يستطيع أن يصنع في يومٍ ما لم تصنعه عشرون مملكة في عشرين سنة. وقد قال المؤرخون إن ألفونسو السادس نجا بصعوبة، وإنه لم يُهزم في معركةٍ مثلها قبلها ولا بعدها، وهذا ما جعل الزلاقة تُذكر في التاريخ الأوروبي أيضًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد عاد يوسف بن تاشفين إلى المغرب بعد المعركة، لأن عادةً في دولته أن يعود القائد بعد الحملة، ولأنه لم يكن يريد أن يحتلّ الأندلس في تلك السنة. ثم عبر مرة أخرى سنة ١٠٨٨م، ثم في سنة ١٠٩٠م حصل على فتوى من فقهاء الأندلس والمغرب بأن ملوك الطوائف لا يصلحون للحكم، لأنهم يدفعون الجزية للمشركين ويستعينون بهم على المسلمين، وكانت هذه الفتوى هي الغطاء الشرعي للضمّ.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد سقطت الممالك واحدةً بعد أخرى: فسقطت غرناطة وقرطبة وإشبيلية في سنواتٍ قليلة، ونُفي المعتمد إلى أغمات، وسقطت بلنسية سنة ١١٠٢م بعد موت السيد القشتالي الذي كان يحكمها، وسقطت سرقسطة سنة ١١١٠م. وقد صارت الأندلس كلها ولايةً في دولة المرابطين يحكمها عاملٌ من قبل أمير المسلمين في مراكش، وكانت العاصمة الفعلية هي إشبيلية أو قرطبة بحسب العهد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت سياسة المرابطين في الأندلس سياسة فقهاء أكثر من سياسة ملوك: فقد شدّدوا في المذاهب، وأحرقوا كتب الفلسفة والجدل، وضيّقوا على أهل الذمة، وكان هذا انقلابًا في المزاج الثقافي بعد قرنٍ من التسامح النسبي في عصر الطوائف. وقد كان في هذا التشديد ردّ فعلٍ على ما رأوه من انحلالٍ سياسي في الطوائف، لكنه أضرّ بالحياة العلمية في الأندلس، وهاجر بسببها بعض العلماء إلى المشرق.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في دولة المرابطين ضعفٌ بنيوي: أنها دولة قبائل، وأن جيشها لا يستطيع أن يُقيم في الأندلس دائمًا، وأن إدارتها لم تكن مُعدّة لبلدٍ بحريٍّ ذي مدنٍ كبيرة. وقد بدأ ضعفها في القرن السادس الهجري، وقام في المغرب خصمٌ جديد هو ابن تومرت وأتباعه الموحدون، وقد سقطت مراكش سنة ١١٤٧م، وسقط معها حكم المرابطين في الأندلس، ودخلت البلاد في عهدٍ جديد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بقي من عهد المرابطين أثرٌ في العمارة وفي القانون: فبنوا المساجد والقباب، ونظّموا القضاء، وأدخلوا في الأندلس مذهبًا فقهيًّا صارمًا في التطبيق. وبقي أيضًا أثرٌ في الوعي السياسي: أن الأندلس تعلّمت أن تنظر إلى المغرب كقوةٍ تُنقذها، وصار هذا النظر جزءًا من تفكيرها في القرون التالية، حتى صار الاستنجاد بالخارج عادةً، وكانت هذه العادة من أسباب سقوطها الأخير.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالزلاقة: معركة الفصل\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الزلاقة معركةً بين جيشٍ نظاميٍّ كبير وجيشٍ مملكيٍّ صغير، وكانت نتيجةً للتوحّد أكثر منها نتيجةً للسلاح. وقد استعمل يوسف بن تاشفين خطةً تقليدية في الصحراء: أن يُطيل الجيش أمام العدو حتى يتقدّم ويُنهك نفسه، ثم يُطبق عليه من الجانبين بفرسانٍ صبروا في المؤخّرة، وكانت هذه الخطة هي التي حسمت المعركة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان أثرها السياسي أكبر من أثرها العسكري: فقد أوقفت التقدّم القشتالي نحو الجنوب سنوات، وأعطت الأندلس فرصةً للبقاء أربعة قرونٍ أخرى، لكنها أيضًا فتحت بابًا للضمّ المرابطي. ولهذا يُقال إن الزلاقة أنقذت الأندلس من قشتالة وسلّمتها إلى مراكش، وهذا مثالٌ على أن النصر قد يكون له ثمنٌ لا يُرى في ميدانه.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالفتوى والشرعية\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يكن ضمّ الأندلس ممكنًا بلا غطاءٍ شرعي، لأن المسلمين لا يقبلون أن يُقاتل بعضهم بعضًا بلا سبب. وقد جاء هذا الغطاء في فتوى فقهاء قرطبة وغيرهم بأن ملوك الطوائف لا يصلحون للحكم، لأنهم استعانوا بالمشركين وأدّوا لهم الجزية، وأن من لا يحكم بما أنزل الله فليس له طاعة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت هذه الفتوى سلاحًا سياسيًّا في يد المرابطين، وقد استعملوها استعمالًا دقيقًا: نشروها في المساجد، وقرأوها على المنابر، وجعلوا منها أساسًا لخلع الملوك. وهذا يُظهر علاقة الفقه بالسياسة في هذا العصر: أن الفتوى لم تكن تعليقًا على الحدث بل كانت أداةً في صنعه، وأن من يملك الشرعية يملك ما هو أقوى من الجيش.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالأثر الثقافي للضمّ\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان المرابطون أهل جهادٍ أكثر من أهل علم، وكان فقهاؤهم يخشون الفلسفة والجدل، وقد أحرقوا في عهدهم كتبًا في المنطق والفلسفة، وضيّقوا على من يُشتغل بعلم الكلام. وقد كان في هذا خسارةٌ للأندلس، لأنها كانت قد بلغت في عصر الطوائف درجةً عالية في التأليف الحرّ.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد هاجر بسبب ذلك عددٌ من العلماء إلى المشرق، وكان منهم من درّس في بغداد ودمشق والقاهرة، وهذا ما جعل التراث الأندلسي ينتشر في المشرق قبل أن ينتشر في أوروبا. وقد بقي في الأندلس علمٌ قوي في الفقه والحديث واللغة، لأن هذه العلوم كانت مقبولةً عند المرابطين، وهذا ما يُفسّر ازدهار المالكية في الغرب الإسلامي بعد ذلك.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالعبور الأول\u003c/b\u003e\u003cspan\u003eسنة ١٠٨٦م لنجدة الطوائف\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالزلاقة\u003c/b\u003e\u003cspan\u003eرمضان ٤٧٩هـ قرب بطليوس\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالضمّ\u003c/b\u003e\u003cspan\u003eفتوى ١٠٩٠م ثم سقوط الممالك\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eنهاية المعتمد\u003c/b\u003e\u003cspan\u003eالنفي إلى أغمات ووفاته ١٠٩٥م\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسقوط دولتهم\u003c/b\u003e\u003cspan\u003eسنة ١١٤٧م على يد الموحدين\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e١٠٦٢م\u003c/td\u003e\u003ctd\u003eبناء مراكش\u003c/td\u003e\u003ctd\u003eعاصمة دولة المرابطين\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٠٨٥م\u003c/td\u003e\u003ctd\u003eسقوط طليطلة\u003c/td\u003e\u003ctd\u003eاستنجاد المعتمد بالمرابطين\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٠٨٦م\u003c/td\u003e\u003ctd\u003eمعركة الزلاقة\u003c/td\u003e\u003ctd\u003eهزيمة قشتالة وإنقاذ الأندلس\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٠٩٠م\u003c/td\u003e\u003ctd\u003eفتوى الفقهاء\u003c/td\u003e\u003ctd\u003eبداية ضمّ ممالك الطوائف\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٠٩١م\u003c/td\u003e\u003ctd\u003eسقوط إشبيلية\u003c/td\u003e\u003ctd\u003eنفي المعتمد إلى أغمات\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١١٤٧م\u003c/td\u003e\u003ctd\u003eسقوط مراكش\u003c/td\u003e\u003ctd\u003eقيام دولة الموحدين\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eوَاعْتَصِمُوا بِحَبْلِ اللَّهِ جَمِيعًا وَلَا تَفَرَّقُوا\u003c/p\u003e\u003ccite\u003eسورة آل عمران، الآية ١٠٣\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eأنقذ المرابطون الأندلس في معركةٍ واحدة، ثم ضمّوها بفتوى شرعية في أربع سنوات، لأن من يستعين بقوةٍ أكبر منه يُسلّمها أمره. وقد أوقف هذا الضمّ التقدّم القشتالي، لكنه أضرّ بالحياة العلمية وأدخل الأندلس في تبعيةٍ للمغرب.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-4","n":"القسم الرابع: معارك المصير","ic":"","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-4\" style=\"--c:#B0304A\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🛡️\u003c/div\u003e\n      \u003ch2\u003eالقسم الرابع: معارك المصير\u003c/h2\u003e\n      \u003cp\u003eبين سنة ١١٩٥م وسنة ١٣٤٠م خاضت الأندلس أربع معارك كبرى، فانتصرت في واحدة وانكسرت في ثلاث. وفي هذه المعارك لم يكن القتال على مدينةٍ بل على مصير شبه الجزيرة، ولهذا سُمّيت في المصادر الأوروبية حروب الاسترداد، وسُمّيت في المصادر العربية معارك الصليب.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#al-arak\"\u003eالأرك: انتصار الموحدين\u003c/a\u003e\u003ca href=\"#al-uqab\"\u003eالعقاب: اليوم الذي انكسرت فيه الأندلس\u003c/a\u003e\u003ca href=\"#fall-of-cities\"\u003eسقوط القواعد: قرطبة وبلنسية وإشبيلية\u003c/a\u003e\u003ca href=\"#marinids-and-strait\"\u003eبنو مرين والمضيق: آخر محاولة للإنقاذ\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"al-arak","n":"الأرك: انتصار الموحدين","ic":"⚔️","part":"القسم الرابع: معارك المصير","h":"\u003carticle class=\"ch3\" id=\"al-arak\" data-toc=\"الأرك: انتصار الموحدين\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الرابع: معارك المصير\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ١ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٤\u003ci\u003e.\u003c/i\u003e١\u003c/span\u003e\n            \u003ch3\u003e⚔️ الأرك: انتصار الموحدين\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي سنة ١١٩٥م عبر الخليفة الموحدي يعقوب المنصور إلى الأندلس بجيشٍ ضخم، والتقى بقشتالة عند حصن الأرك، فانتصر انتصارًا كاملًا، وعاد إلى مراكش بلقب المنصور. وكانت هذه آخر معركة كبيرة تنتصر فيها الأندلس على قشتالة في ميدانٍ مفتوح.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eقامت دولة الموحدين في المغرب على يد محمد بن تومرت، وكان قد أعلن نفسه مهديًّا ودعا إلى توحيد الله ونبذ ما رآه تشبيهًا، وقد مات سنة ١١٣٠م، فخلفه عبد المؤمن بن علي، وكان قائدًا سياسيًّا وعسكريًّا من طرازٍ عالٍ، وقد بنى جيشًا نظاميًّا من قبائل مختلفة ونظّم إدارته، وسقطت مراكش سنة ١١٤٧م، فصارت دولة الموحدين وارثةً لدولة المرابطين في المغرب والأندلس.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد دخل الموحدون الأندلس على مراحل: فدخلوا إشبيلية وقرطبة سنة ١١٤٧م و١١٤٨م، لكنهم واجهوا في الشرق مقاومةً طويلة من ابن مردنيش في مرسية وبلنسية، وقد استمرّت هذه المقاومة نحو خمسٍ وعشرين سنة، حتى استقرّت البلاد لهم في السبعينات من القرن الثاني عشر. وقد كانت هذه السنوات سنوات انقسامٍ آخر، فلم تكن الأندلس قد خرجت من عصر الطوائف إلا لدخول عصر مقاومةٍ محلية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت قشتالة في عهد ألفونسو الثامن قد صارت أقوى ممالك الشمال، وكان قد أخذ أراضي في الجنوب، وكان يرى أن الأندلس ضعيفة بعد انتقال الحكم من المرابطين إلى الموحدين. وفي سنة ١١٩٥م خرج في حملةٍ كبيرة إلى الجنوب، فدخل أراضي إشبيلية وخرّبها، وكان يريد أن يُثبت أن الموحدين لا يستطيعون حماية الأندلس، وكان هذا استفزازًا مقصودًا لجذبهم إلى معركة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد عبر يعقوب المنصور المضيق بجيشٍ كبير، وكان في جيشه عربٌ وبربر وأندلسيون ورماةٌ ونبالة، وكان قد أعدّ عدّةً كبيرة، والتقى الجيشان في موضع قريب من حصن الأرك في شهر شعبان سنة ٥٩١هـ. وقد استعمل الموحدون خطةً تُشبه خطة الزلاقة: أن يتحمّل الجيش الأول الهجوم ثم يفتح الطريق للفرسان، وقد انكسر جناح القشتالة وانفرط الجيش، وكانت الهزيمة كاملة، ونجا ألفونسو بجيشٍ صغير إلى طليطلة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان لهذا النصر أثرٌ كبير في الأندلس: فقد عادت الثقة إلى الناس، وصار الخليفة يُلقّب بالمنصور، وكُتبت فيه القصائد، وبُنيت في إشبيلية وفي مراكش منشآتٌ تُخلّد النصر، ومنها صومعة الكتبية في مراكش التي بُنيت في هذا العهد. وقد كان في النصر أيضًا معنى دينيًّا: أن الموحدين قدّموا أنفسهم حماةً للبلاد، وكان هذا يُبرّر وجودهم فيها بعد أن دخلوها بالقوة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان النصر محدود الأثر سياسيًّا: فلم يُستعد ما أُخذ من الأرض قبل المعركة، ولم تُسقط قشتالة، ولم يُوحّد الشمال، لأن ألفونسو استطاع أن يُعيد بناء قوّته بعد سنوات. وقد كان هذا هو الفرق بين الزلاقة والأرك: أن الأولى أوقفت تقدّمًا كبيرًا، والثانية أوقفت حملةً لا سياسة. وقد كان في هذا درسٌ: أن النصر في ميدانٍ لا يُغيّر ميزان القوى إذا لم يُتبعه بناءٌ سياسي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد مات يعقوب المنصور سنة ١١٩٩م، وخلفه ابنه محمد الناصر، وكانت الدولة قد بلغت أقصى اتساعها، وكانت مشكلاتها قد بدأت في الظهور: جيشٌ كبير يُكلّف مالًا كثيرًا، وولاياتٌ بعيدة، وسياسة دينية صارمة أثارت الفقهاء المالكيين في الأندلس، وكان في هذا كله ما سيظهر في معركة العقاب بعد ثلاث عشرة سنة. وقد كان في هذا التأجيل فرصةٌ ضاعت، لأن الدولة الموحدية لم تُعمّر طويلًا بعد صاحبها، ودخلت في صراعٍ داخلي أضعفها قبل أن تُواجه قشتالة في معركةٍ كبرى.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بقي في الذاكرة الشعبية أن الأرك كانت نصرًا لم يُستثمر، وأن الناس في الأندلس قالوا بعدها إن النصر الذي لا يُتبعه صلحٌ عادل ولا فتحٌ دائم إنما هو تأجيل. وقد كان هذا الكلام صحيحًا في جوهره: فبين ١١٩٥م و١٢١٢م لم تتغيّر خريطة الحدود كثيرًا، لكن قوّة قشتالة تضاعفت لأنها استفادت من درس الهزيمة وتعلّمت أن تُوحّد ممالك الشمال في حربٍ واحدة.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالموحدون: دولة الدعوة والجيش\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت دولة الموحدين دولةً تقوم على دعوةٍ دينية وعلى جيشٍ قبلي منظم في الوقت نفسه، وكان عبد المؤمن قد بنى جيشًا من قبائل مختلفة وأدخله في نظامٍ واحد، وكان يرى أن الدولة تحتاج إلى عقيدةٍ تُوحّد الجند وإلى إدارةٍ تُحصّل المال. وقد كانت هذه التركيبة قويةً في الفتح، ضعيفةً في الإدارة، لأن الجيش الذي بُني للحركة لا يستقرّ في مدينة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان الموحدون يُسمّون أنفسهم أهل التوحيد، وكانوا يُشدّدون في العقيدة، وقد أحرقوا كتبًا وناقشوا الفقهاء، وكان هذا يُولّد معارضةً في الأندلس التي كانت مالكيةً في فقهها. وقد ظهر أثر هذه المعارضة في أزمنة الضعف، حين لم يجد الموحدون في المدن الأندلسية من يُدافع عنهم.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eألفونسو الثامن ودرس الأرك\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان ألفونسو الثامن ملكًا طموحًا، وقد بنى سياسته على استغلال انقسام الأندلس، وكان يرى أن الحرب مع المسلمين مسألة وقتٍ لا مسألة قوّة. وقد جرّب في الأرك أن يستفزّ الموحدين إلى معركةٍ في أرضٍ يعرفها، فخسر المعركة، لكنه لم يخسر الحرب، لأنه عاد بعد سنواتٍ ليُعيد تنظيم جيشه ويطلب الدعم من البابا ومن ممالك الشمال.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد تعلّم من الهزيمة أن الحرب لا تُخاض بجيش مملكةٍ واحدة، فبدأ يعمل على تحالفٍ يجمع قشتالة وأراغون ونافارا، وكان هذا التحالف هو الذي صنع النصر في العقاب سنة ١٢١٢م. ولهذا يُقال إن الأرك كانت هزيمةً تعليمية لقشتالة، وإن انتصار المسلمين فيها كان انتصارًا في ميدانٍ وخسارةً في ميدانٍ آخر: ميدان بناء التحالفات.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eلماذا لم يُستثمر النصر\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يُستثمر النصر لأن الدولة الموحدية كانت دولةً عسكرية لا إدارية، وكانت تحتاج إلى سنواتٍ طويلة لتبني في الأندلس نظام حكمٍ مستقرًّا. وقد كان يعقوب المنصور يعرف هذا، فبنى في إشبيلية وفي مراكش، وأقام أسطولًا، وحاول أن يُنظّم الولايات، لكنه مات بعد أربع سنوات من المعركة، فلم يكتمل ما بدأه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الأندلس أيضًا مشكلةٌ داخلية: أن الأندلسيين لم يكونوا يُحبّون الموحدين حبًّا وطنيًّا، لأنهم جاؤوا من الخارج وفرضوا عقيدتهم وفقهاءهم، وكانوا يرون فيهم حكّامًا لا حماة. وهذا ما جعل المدن تستسلم بعد العقاب بسرعةٍ نسبية، لأنها لم تكن تُدافع عن دولةٍ تخصّها بل عن حكمٍ غريبٍ عنها.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمعركة\u003c/b\u003e\u003cspan\u003eشعبان ٥٩١هـ / يوليو ١١٩٥م\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالطرفان\u003c/b\u003e\u003cspan\u003eيعقوب المنصور وألفونسو الثامن\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالموضع\u003c/b\u003e\u003cspan\u003eحصن الأرك قرب قلعة رباح\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالنتيجة\u003c/b\u003e\u003cspan\u003eهزيمة قشتالة هزيمةً كاملة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالأثر\u003c/b\u003e\u003cspan\u003eانتصارٌ لم يُستثمر سياسيًّا\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e١١٣٠م\u003c/td\u003e\u003ctd\u003eموت ابن تومرت\u003c/td\u003e\u003ctd\u003eعبد المؤمن يقود الموحدين\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١١٤٧م\u003c/td\u003e\u003ctd\u003eسقوط مراكش\u003c/td\u003e\u003ctd\u003eنهاية دولة المرابطين\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١١٤٧م\u003c/td\u003e\u003ctd\u003eدخول إشبيلية\u003c/td\u003e\u003ctd\u003eبداية الحكم الموحدي في الأندلس\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١١٩٥م\u003c/td\u003e\u003ctd\u003eمعركة الأرك\u003c/td\u003e\u003ctd\u003eنصرٌ كبير ولقب المنصور\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١١٩٩م\u003c/td\u003e\u003ctd\u003eموت يعقوب المنصور\u003c/td\u003e\u003ctd\u003eبداية تراجع الدولة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eإِن يَنصُرْكُمُ اللَّهُ فَلَا غَالِبَ لَكُمْ\u003c/p\u003e\u003ccite\u003eسورة آل عمران، الآية ١٦٠\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eانتصر الموحدون في الأرك انتصارًا كاملًا، لكنهم لم يُترجموه إلى نظامٍ سياسي في الأندلس، لأن دولتهم كانت دولة جيشٍ لا دولة إدارة. وقد تعلّمت قشتالة من هزيمتها أن تُوحّد ممالك الشمال، فكان ذلك النصر مقدمةً للعقاب.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"al-uqab","n":"العقاب: اليوم الذي انكسرت فيه الأندلس","ic":"🌑","part":"القسم الرابع: معارك المصير","h":"\u003carticle class=\"ch3\" id=\"al-uqab\" data-toc=\"العقاب: اليوم الذي انكسرت فيه الأندلس\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الرابع: معارك المصير\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٢ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٤\u003ci\u003e.\u003c/i\u003e٢\u003c/span\u003e\n            \u003ch3\u003e🌑 العقاب: اليوم الذي انكسرت فيه الأندلس\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي السادس عشر من يوليو سنة ١٢١٢م التقى ثلاثة ملوكٍ من الشمال بجيش الخليفة الموحدي في سهلٍ يُقال له حصن العقاب، فانكسر الجيش المسلم انكسارًا لم يُجبَر بعدها. ولم تسقط مدينةٌ في ذلك اليوم، لكن الأندلس سقطت بعده.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eبعد الأرك بدأت قشتالة تُعِدّ حربًا من نوعٍ آخر: فقد أعلن البابا إنوسنت الثالث أن الحرب في الأندلس حربٌ صليبية، وأعطى من يشارك فيها غفرانًا، فوفد على قشتالة فرسانٌ من فرنسا وإيطاليا وألمانيا. وكان في هذا معنى جديد: أن الحرب لم تكن بين ملكين على أرض، بل صارت بين عالَمين لهما خطابٌ واحد هو الحرب المقدّسة. وقد كان في هذا التحوّل خطرٌ على الأندلس، لأن الحرب التي تُخاض باسم الدين لا تنتهي بمعاهدة، ولا يعرف فيها الناس متى يتوقّف القتال ولا على أي أرضٍ يقف.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد نجح ألفونسو الثامن في جمع ملوك الشمال في تحالفٍ واحد: فجاءه بيدرو الثاني ملك أراغون، وسانشو السابع ملك نافارا، وكان هذا التحالف هو الذي لم يكن في الأرك. وقد سار الجيش المتحالف إلى الجنوب سنة ١٢١٢م، فدخل حصونًا في الطريق، ثم وقف أمام حصنٍ يُقال له حصن العقاب في سهلٍ واسع، وكان الجيش الموحدي بقيادة الخليفة محمد الناصر قد نزل قريبًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الجيش الموحدي أعدادٌ كبيرة، وكان في مؤخّرته جنودٌ من القبائل العربية والبربرية والأندلسية، وكانت الخطّة أن يتحمّل الجيش الهجوم ثم يردّ بفرسانه. لكن في المعركة انفرط الجيش من مؤخّرته أولًا، وقيل إن الخليفة نفسه انسحب في أثناء القتال، وقيل إنه لم يثبت في موضعه، وكان انسحابه إعلانًا بالهزيمة قبل أن تُحسم المعركة. وكان الجيش المتحالف يسير على خطٍّ واحد ويُقاتل بخطةٍ واحدة، وكانت هذه هي ميزته الكبرى في هذا اليوم، لأن الجيش المقابل كان أكبر عددًا لكنه لم يكن يعمل كوحدةٍ واحدة في اللحظة الحاسمة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت الهزيمة كاملة: قُتل من الجيش المسلم أعدادٌ كبيرة، وترك المعسكر بكل ما فيه، ودخل المتحالفون إلى خيام الخليفة وغنموا ما فيها. وقد توقّف الجيش المتحالف بعد النصر، ولم يتقدّم إلى قرطبة أو إشبيلية، لأن الطريق كان طويلًا ولأن الجيش كان قد أنهك، ولأن التحالف كان سيتفرّق بعد انتهاء الحملة، وقد كان في هذا التوقّف نجاةٌ مؤقتة للأندلس.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان الأثر السياسي أسرع من الأثر العسكري: فقد مات الخليفة الناصر سنة ١٢١٣م، ودخلت الدولة الموحدية في صراعٍ على الخلافة، وتفرّقت جيوشها، واستقلّ الولاة في الأندلس بأنفسهم، وصارت المدن تُدير شؤونها بنفسها. وقد كان في هذا تكرارٌ لما جرى بعد سقوط الخلافة الأموية: أن الدولة تنكسر في معركة ثم تتفكك في السنوات التي تليها. وقد كان هذا التوقّف محلّ نقاشٍ بين المؤرخين، فمنهم من قال إنه كان خطأً استراتيجيًّا ضيّع فرصة إسقاط الأندلس في سنةٍ واحدة، ومنهم من قال إنه كان ضرورةً لأن الجيش لم يكن قادرًا على حصار مدينةٍ كبيرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بدأ سقوط القواعد بعد العقاب بسنوات: فسقطت بياسة وأبدة، ثم قرطبة سنة ١٢٣٦م، ثم بلنسية سنة ١٢٣٨م، ثم مرسية، ثم إشبيلية سنة ١٢٤٨م. ولم يكن سقوط هذه المدن نتيجة معركةٍ واحدة بل نتيجة عشرين سنة من الضعف، وقد كانت كل مدينةٍ تُسقط وحدها، لأن الدولة التي كانت تجمعها قد ذهبت. وقد صار كل والٍ في مدينةٍ يرى أنه صاحبها بالغلبة لا بالحق، وكانت هذه هي الحالة التي تُنتج عصر طوائفٍ ثانيًا، وقد حدث ذلك فعلًا في السنوات التي تلت العقاب مباشرةً.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بقي في المصادر الإسلامية وصفٌ لهذه المعركة بلغةٍ حزينة، وذُكر فيها أن الناس في الأندلس صاروا يسمّونها يوم العقاب، وأن الفقهاء كتبوا فيها رسائل يطلبون من الناس أن يتوبوا، وأن الشعراء رثوا فيها البلاد لا الجيش. وقد كان في هذا الرثاء شيءٌ مهم: أن الهزيمة لم تُفهم كخسارة عسكرية بل كعقابٍ إلهي، وهذا الفهم جعل الناس يبحثون عن سببٍ في أنفسهم لا في خطط قادتهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان درس العقاب في التاريخ العسكري واضحًا: أن الجيش الكبير لا يكفي إذا لم يكن له مركزٌ يثبت، وأن التحالف المتنازع لا يُقاتل، وأن الحرب التي تُخاض بلا هدفٍ سياسي محدّد تنتهي إلى خرابٍ لا إلى سلام. وقد كتب المؤرخون بعد قرون أن العقاب كانت بداية النهاية لا النهاية، وأن من أراد أن يفهم سقوط غرناطة سنة ١٤٩٢م فعليه أن يبدأ من سنة ١٢١٢م.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالحرب المقدّسة في الجانبين\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت العقاب أول معركة في الأندلس يُعلن فيها البابا حربًا صليبية بمعنى الكلمة: غفرانٌ لمن يشارك، ووعظٌ في الكنائس، وفرسانٌ من بلادٍ بعيدة. وقد كان في هذا تحوّلٌ في طبيعة الحرب: أن تصير الحرب عملاً دينيًّا لا عملاً سياسيًّا، وأن يصير الجنودُ حجّاجًا لا مرتزقة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الجانب المسلم خطابٌ مشابه، لكنه لم يكن مُنظّمًا تنظيمًا واحدًا: فكانت الدعوة إلى الجهاد تُطلق في المساجد، وكان الناس يُستنفرون في المدن، لكن لم تكن هناك مؤسسةٌ واحدة تُدير الحرب كما أدارها البابا. وهذا فرقٌ في التنظيم أكثر منه فرقًا في العقيدة، وقد ظهر أثره في الميدان: أن الجيش المتحالف كان أكثر انسجامًا من الجيش المسلم.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eانسحاب الخليفة\u003c/h4\u003e\u003cp class=\"ap\"\u003eأكثر ما أُخذ على الخليفة الناصر في هذه المعركة أنه انسحب في أثناء القتال، وأن انسحابه كان إعلانًا بالهزيمة لكل من رآه. وقد دافع عنه بعض المؤرخين بأنه أراد أن يُعيد تنظيم الجيش، لكن الروايات الأقرب أنه لم يثبت، وأن الجيش لمّا رأى الخليفة ينسحب تفرّق. وقد كان هذا الانسحاب يُذكر في المصادر الأندلسية بحزنٍ شديد، لأن الجيش الذي يرى قائده ينسحب يفقد سببًا من أسباب الثبات، ولا يعود إليه بعد ذلك.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا درسٌ في القيادة: أن القائد في المعركة لا يُقاس بعدد جنده بل بثباته في موضعه، وأن الجيش الذي يعتمد على شخصٍ واحد ينهار إذا تحرّك هذا الشخص من مكانه. وقد كان هذا الفرق بين العقاب والأرك: أن المنصور في الأرك ثبت، والناصر في العقاب لم يثبت، فتغيّرت النتيجة مع تغيّر موقف رجلٍ واحد.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eما بعد العقاب\u003c/h4\u003e\u003cp class=\"ap\"\u003eبعد العقاب لم تكن الأندلس قد سقطت، لكنها صارت بلادًا بلا دولة: فالموحدون في المغرب كانوا يتقاتلون على الخلافة، والولاة في الأندلس كانوا يستقلّون بمدنهم، وقشتالة كانت تتقدّم سنةً بعد سنة. وقد ظهر في هذه السنوات ما يُشبه عصر الطوائف مرةً ثانية، لكن بلا ثقافة الطوائف ولا مالها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه السنوات رجلٌ سيظهر بعد قليل هو محمد بن الأحمر، وكان من أسرةٍ عربية في أرجدونة، وقد استطاع أن يجمع ما تبقّى من البلاد في مملكةٍ واحدة في غرناطة، وأن يعقد مع قشتالة عهدًا يكون فيه تابعًا لها في الظاهر ومستقلًّا في الباطن. وهذا هو الذي جعل غرناطة تعيش قرنين ونصفًا بعد سقوط إشبيلية.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالتاريخ\u003c/b\u003e\u003cspan\u003e١٦ يوليو ١٢١٢م / صفر ٦٠٩هـ\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمكان\u003c/b\u003e\u003cspan\u003eحصن العقاب في سهلٍ جنوبي قشتالة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمتحالفون\u003c/b\u003e\u003cspan\u003eقشتالة وأراغون ونافارا\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالخليفة\u003c/b\u003e\u003cspan\u003eمحمد الناصر الموحدي\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالأثر\u003c/b\u003e\u003cspan\u003eتفكّك الدولة وسقوط القواعد\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e١٢٠٩م\u003c/td\u003e\u003ctd\u003eإعلان البابا الحرب المقدّسة\u003c/td\u003e\u003ctd\u003eفرسانٌ من أوروبا إلى قشتالة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٢١٢م\u003c/td\u003e\u003ctd\u003eمعركة العقاب\u003c/td\u003e\u003ctd\u003eانهيار الجيش الموحدي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٢١٣م\u003c/td\u003e\u003ctd\u003eموت الناصر\u003c/td\u003e\u003ctd\u003eصراعٌ على الخلافة في المغرب\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٢٢٤م\u003c/td\u003e\u003ctd\u003eاستقلال بعض الولاة\u003c/td\u003e\u003ctd\u003eعودة الانقسام إلى الأندلس\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٢٣٦م\u003c/td\u003e\u003ctd\u003eسقوط قرطبة\u003c/td\u003e\u003ctd\u003eانكشاف وسط البلاد\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eوَلَا تَكُونُوا كَالَّذِينَ تَفَرَّقُوا وَاخْتَلَفُوا مِن بَعْدِ مَا جَاءَهُمُ الْبَيِّنَاتُ\u003c/p\u003e\u003ccite\u003eسورة آل عمران، الآية ١٠٥\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eفي العقاب اجتمع ثلاثة ملوكٍ من الشمال بجيشٍ واحد، وتفرّق الجيش المسلم من مؤخّرته، فانكسرت الدولة التي كانت تحمي الأندلس. ولم تسقط مدينةٌ في ذلك اليوم، لكن الطريق إلى قرطبة وإشبيلية صار مفتوحًا بعد عشرين سنة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"fall-of-cities","n":"سقوط القواعد: قرطبة وبلنسية وإشبيلية","ic":"🏳️","part":"القسم الرابع: معارك المصير","h":"\u003carticle class=\"ch3\" id=\"fall-of-cities\" data-toc=\"سقوط القواعد: قرطبة وبلنسية وإشبيلية\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الرابع: معارك المصير\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٣ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٤\u003ci\u003e.\u003c/i\u003e٣\u003c/span\u003e\n            \u003ch3\u003e🏳️ سقوط القواعد: قرطبة وبلنسية وإشبيلية\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي اثنتين وعشرين سنة سقطت أعظم ثلاث مدنٍ في الأندلس: قرطبة سنة ١٢٣٦م، وبلنسية سنة ١٢٣٨م، وإشبيلية سنة ١٢٤٨م. ولم تُقاتل هذه المدن وحدها بل سقطت واحدةً بعد واحدة، لأن الدولة التي كانت تجمعها لم تكن موجودة.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eبعد العقاب صارت الأندلس مجموعة مدنٍ تُدير نفسها: قرطبة وإشبيلية ومرسية وبلنسية ولورقة وغرناطة، وكان في كل مدينةٍ حاكمٌ محلي يرى أنه يستطيع أن يُدافع عن مدينته. وقد كان هذا وهمًا في معظم الحالات، لأن المدينة الواحدة لا تستطيع أن تُقاوم مملكةً كاملة لها جيشٌ دائم وقاعدةٌ في الشمال. وقد كان في هذه المدن جيوشٌ محلية صغيرة، وكانت أسوارها قوية، لكنها كانت تفتقد إلى ما هو أهمّ من السور والجيش: إلى قيادةٍ واحدة تعرف متى تُقاتل ومتى تُفاوض.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان فرديناند الثالث ملك قشتالة هو الذي قاد الموجة الأولى: فقد وحّد قشتالة وليون في شخصه، وبنى جيشًا قويًّا، واستعمل سياسةً ذكية: أنه كان يقبل استسلام المدن بعقود، فيُعطي أهلها أمانًا على أنفسهم وأموالهم وكنائسهم، وكان هذا يُشجّع المدن الأخرى على التسليم. وقد دخل قرطبة سنة ١٢٣٦م بعد أن سقطت أسوارها أو بعد أن دخلها بعض أهلها، وكان سقوطها صدمةً لأنها كانت عاصمة الأندلس القديمة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد سقطت بلنسية سنة ١٢٣٨م في يد خايمي الأول ملك أراغون، وكان قد حاصرها أشهرًا، وقد استعمل أيضًا سياسة العقود، وكان في المدينة من فاوض على التسليم، وكانت المدينة قد صارت مملكةً صغيرة بعد أن استقلّ بها ابن مردنيش ثم ورثها عنه من بعده. وقد كان سقوط بلنسية نهاية الإسلام في الشرق الأندلسي، ولم يبقَ بعدها في تلك الناحية إلا مدنٌ صغيرة سقطت في سنوات.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان سق
