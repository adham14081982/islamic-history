<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="description" content="تمتد هذه الحقبة من سنة 711م حين عبر طارق بن زياد مضيق جبل طارق، إلى سنة 1492م حين سلم آخر أمراء المسلمين مفاتيح غرناطة، أي نحو ثمانية قرون. وعرفت في ه">
<title>الأندلس | موسوعة تاريخ الإسلام</title>
<link rel="preload" href="assets/fonts/amiri-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/amiri-700.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* ===== موسوعة تاريخ الإسلام — التنسيق المشترك ===== */

/* الخطوط محليّة (Subset عربي): لا شبكة، ولا اختلاف في القياس بين تشغيل وتشغيل */
@font-face{font-family:'Amiri';font-style:normal;font-weight:400;font-display:block;
  src:url(assets/fonts/amiri-400.woff2) format('woff2')}
@font-face{font-family:'Amiri';font-style:normal;font-weight:700;font-display:block;
  src:url(assets/fonts/amiri-700.woff2) format('woff2')}
@font-face{font-family:'Cairo';font-style:normal;font-weight:200 1000;font-display:block;
  src:url(assets/fonts/cairo-var.woff2) format('woff2')}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --gold:#B8942F;--gold2:#8B6914;--cream:#FBF4E4;--paper:#FFFDF8;
  --ink:#2E2A24;--muted:#7C7364;--line:#E7DCC3;
  --green:#1E6B3A;--blue:#155E9C;
  --shadow:0 4px 18px rgba(80,60,20,.08);
  --c:#B8942F;
}
body{font-family:'Cairo',sans-serif;background:var(--cream);color:var(--ink);
  min-height:100vh;line-height:1.9;transition:.3s}

body.dark{--paper:#201E1A;--cream:#161512;--ink:#E8E1D2;--muted:#A79E8B;
  --line:#3A362C;--shadow:0 4px 18px rgba(0,0,0,.35)}

main{max-width:820px;margin:0 auto;padding:1.2rem 1.1rem 5rem}

/* ---------- الترويسة ---------- */
header.top{position:sticky;top:0;z-index:60;display:flex;align-items:center;
  justify-content:space-between;gap:.6rem;padding:.55rem 1rem;
  background:var(--paper);border-bottom:2px solid var(--gold)}
.brand{font-family:'Amiri',serif;font-weight:700;font-size:1.02rem;color:var(--ink);
  text-decoration:none;display:flex;align-items:center;gap:.4rem}
.tools{display:flex;align-items:center;gap:.5rem}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
  background:transparent;color:var(--ink);font-size:1.05rem;cursor:pointer;
  display:grid;place-items:center;transition:.2s}
.ib:hover{background:var(--gold);color:#fff;border-color:var(--gold)}
.ib:active{transform:scale(.9)}

/* ---------- قبة التقدم ---------- */
.dome{width:38px;height:44px;position:relative;cursor:default}
.dome svg{width:100%;height:100%;display:block}
.dome .fill{fill:var(--gold);opacity:.85;transition:.4s}

/* ---------- شارات ---------- */
.badge{display:inline-flex;align-items:center;gap:.3rem;font-size:.72rem;
  background:var(--gold);color:#fff;border-radius:50px;padding:.15rem .6rem;
  font-weight:700}

/* ---------- المسار ---------- */
.crumbs{font-size:.82rem;color:var(--muted);margin-bottom:.8rem;
  display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.crumbs a{color:var(--muted);text-decoration:none}
.crumbs a:hover{color:var(--gold2)}

/* ---------- الترويسة البطلة ---------- */
.hero{position:relative;background:var(--paper);border:1px solid var(--line);
  border-top:6px solid var(--c);border-radius:20px;padding:1.6rem 1.3rem 1.4rem;
  text-align:center;box-shadow:var(--shadow);margin-bottom:1.4rem;overflow:hidden}
.hero .ic{font-size:2.6rem;line-height:1}
.hero h1{font-family:'Amiri',serif;font-size:1.9rem;color:var(--c);margin:.3rem 0 .1rem}
.hero .period{color:var(--gold2);font-size:.85rem;font-weight:600;margin-bottom:.6rem}
.hero .intro{color:var(--muted);font-size:.96rem;line-height:2;max-width:620px;margin:0 auto}

/* ---------- زخرفة SVG ---------- */
.orn{display:block;margin:1.2rem auto;opacity:.55}
.orn line,.orn path,.orn circle{stroke:var(--gold);stroke-width:1.1;fill:none}

/* ---------- العناوين ---------- */
h2.sec{font-family:'Amiri',serif;font-size:1.35rem;color:var(--c);
  margin:2rem 0 .9rem;display:flex;align-items:center;gap:.6rem}
h2.sec:before{content:"";width:6px;height:22px;background:var(--gold);
  border-radius:3px;flex:0 0 auto}
h2.sec .n{margin-right:auto;font-family:'Cairo';font-size:.75rem;color:var(--muted);font-weight:400}

/* ---------- الخط الزمني ---------- */
.tlwrap{position:relative;margin-bottom:.4rem}
.tl{display:flex;gap:.6rem;overflow-x:auto;padding:.6rem .2rem 1rem;
  scroll-snap-type:x mandatory;scrollbar-width:thin}
.tl::-webkit-scrollbar{height:5px}
.tl::-webkit-scrollbar-thumb{background:var(--gold);border-radius:9px}
.tli{flex:0 0 150px;scroll-snap-align:center;background:var(--paper);
  border:1px solid var(--line);border-right:4px solid var(--c);
  border-radius:14px;padding:.6rem .7rem;cursor:pointer;text-align:right;
  transition:.22s;font-family:'Cairo'}
.tli:hover,.tli.on{transform:translateY(-3px);box-shadow:var(--shadow);border-right-color:var(--gold)}
.tli b{display:block;color:var(--c);font-size:.9rem}
.tli span{display:block;color:var(--muted);font-size:.76rem;line-height:1.6}
.tlnav{display:flex;justify-content:space-between;margin-top:-.5rem}

/* ---------- الأحداث ---------- */
.ev{background:var(--paper);border:1px solid var(--line);border-radius:16px;
  padding:1rem 1.1rem;margin-bottom:.9rem;box-shadow:var(--shadow);
  opacity:0;transform:translateY(14px);transition:.45s}
.ev.in{opacity:1;transform:none}
.ev-head{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;margin-bottom:.5rem}
.ev-y{background:var(--c);color:#fff;font-size:.74rem;font-weight:700;
  padding:.15rem .55rem;border-radius:6px;white-space:nowrap}
.ev h3{font-family:'Amiri',serif;font-size:1.18rem;color:var(--ink)}
.ev p{font-family:'Amiri',serif;font-size:1.08rem;line-height:2.05;text-align:justify}
.ev .res{margin-top:.7rem;padding:.55rem .8rem;border-right:4px solid var(--gold);
  background:linear-gradient(135deg,rgba(184,148,47,.10),rgba(184,148,47,.04));
  border-radius:10px;font-size:.9rem;color:var(--gold2);font-weight:600}
.ev .res:before{content:"◀ النتيجة  "}

/* ---------- الشخصيات ---------- */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.6rem}
.pc{background:var(--paper);border:1px solid var(--line);border-radius:14px;
  padding:.65rem .8rem;border-top:3px solid var(--c)}
.pc b{display:block;color:var(--ink);font-size:.95rem}
.pc span{display:block;color:var(--muted);font-size:.78rem;line-height:1.65}

/* ---------- النتائج ---------- */
.outs{list-style:none}
.outs li{position:relative;padding:.5rem 1.5rem .5rem 0;border-bottom:1px dashed var(--line);
  font-size:.95rem}
.outs li:before{content:"◆";position:absolute;right:0;color:var(--gold);font-size:.8rem}

/* ---------- المصادر ---------- */
.src{background:var(--paper);border:1px solid var(--line);border-radius:16px;
  padding:.9rem 1.1rem;margin-top:2.2rem}
.src li{font-size:.86rem;color:var(--muted);padding:.25rem 1.2rem .25rem 0;
  position:relative;line-height:1.8}
.src li:before{content:"❋";position:absolute;right:0;color:var(--gold)}
.src li cite{font-style:normal;color:var(--ink);font-weight:600}

/* ---------- التنقل بين الصفحات ---------- */
.pager{display:flex;gap:.6rem;margin-top:1.6rem}
.pager a{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:14px;
  padding:.7rem .9rem;text-decoration:none;color:var(--ink);transition:.22s}
.pager a:hover{border-color:var(--gold);box-shadow:var(--shadow)}
.pager a small{display:block;color:var(--muted);font-size:.7rem}
.pager a b{font-size:.92rem;color:var(--c)}
.pager a.next{text-align:left}
.pager a.empty{visibility:hidden}

/* ---------- الانتقال بين الصفحات ---------- */
main{animation:pageIn .4s ease}
@keyframes pageIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}

/* ---------- فهرس الصفحة الرئيسية ---------- */
.eg{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:.8rem}
.ec{position:relative;background:var(--paper);border:1px solid var(--line);
  border-top:5px solid var(--c);border-radius:18px;padding:1rem .8rem .9rem;
  text-align:center;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);
  transition:.25s;overflow:hidden}
.ec:hover{transform:translateY(-4px);box-shadow:0 10px 26px rgba(80,60,20,.16)}
.ec .ic{font-size:2.1rem;line-height:1.2}
.ec b{display:block;color:var(--c);font-size:.98rem;margin:.25rem 0 .15rem}
.ec small{display:block;color:var(--muted);font-size:.72rem;line-height:1.55}
.ec .pg{height:5px;background:var(--line);border-radius:9px;margin-top:.55rem;overflow:hidden}
.ec .pg i{display:block;height:100%;background:var(--c);width:0;transition:.4s}
.ec .done{position:absolute;top:.4rem;left:.5rem;font-size:.95rem;color:var(--gold)}

/* ---------- البحث ---------- */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;display:none}
.ov.on{display:block}
.panel{position:fixed;inset:0;background:var(--paper);z-index:95;display:none;flex-direction:column}
.panel.on{display:flex}
.sh{display:flex;gap:.6rem;padding:.8rem;border-bottom:2px solid var(--gold)}
.sh input{flex:1;border:0;background:transparent;font-family:'Cairo';
  font-size:1.05rem;color:var(--ink);outline:none}
.sb{flex:1;overflow-y:auto;padding:.8rem}
.res{background:transparent;border:1px solid var(--line);border-radius:12px;
  padding:.7rem .9rem;margin-bottom:.5rem;cursor:pointer}
.res b{display:block;color:var(--c);font-size:.95rem}
.res small{color:var(--muted);font-size:.78rem;line-height:1.6}
.res em{font-style:normal;background:rgba(184,148,47,.22);border-radius:3px;padding:0 2px}

@media(max-width:420px){
  main{padding:.9rem .8rem 4rem}
  .hero h1{font-size:1.5rem}
  .tli{flex:0 0 132px}
}

/* ========== ١) الإطار المزخرف — حواشي المخطوطات (زوايا ثابتة الحجم) ========== */
.frame{position:relative;border:1px solid var(--gold);border-radius:6px;padding:1.6rem 1.35rem}
.frame:before{content:"";position:absolute;inset:5px;border:1px solid var(--gold);
  opacity:.28;border-radius:3px;pointer-events:none}
.crn{position:absolute;width:26px;height:26px;pointer-events:none;color:var(--gold);opacity:.75}
.crn svg{width:100%;height:100%;display:block;stroke:currentColor;fill:none;stroke-width:1.1}
.crn.tl{top:-1px;right:-1px}.cn-tr{}
.crn.tr{top:-1px;left:-1px}
.crn.bl{bottom:-1px;right:-1px}
.crn.br{bottom:-1px;left:-1px}
.frame>*:not(.crn){position:relative;z-index:1}

/* ========== ٢) الخط الزمني الكبير ========== */
.orn{width:210px;max-width:70%;height:18px;opacity:.55}
.bigtl{display:flex;gap:.55rem;overflow-x:auto;padding:1rem .3rem 1.3rem;
  scroll-snap-type:x mandatory;cursor:grab;scrollbar-width:thin;
  -webkit-overflow-scrolling:touch}
.bigtl:active{cursor:grabbing}
.bigtl::-webkit-scrollbar{height:6px}
.bigtl::-webkit-scrollbar-thumb{background:var(--gold);border-radius:9px}
.btl{flex:0 0 126px;scroll-snap-align:center;position:relative;
  display:flex;flex-direction:column;align-items:center;gap:.25rem;
  text-decoration:none;color:inherit;padding-top:1.1rem}
.btl:before{content:"";position:absolute;top:.4rem;right:-.3rem;left:-.3rem;height:2px;
  background:var(--line)}
.btl:after{content:"";position:absolute;top:0;right:calc(50% - 9px);
  width:18px;height:18px;border-radius:50%;background:var(--paper);
  border:3px solid var(--c);z-index:2;transition:.25s}
.btl:hover:after{transform:scale(1.25)}
.btl .ic{font-size:1.6rem;line-height:1;z-index:2}
.btl .nm{font-family:'Amiri',serif;font-size:.86rem;color:var(--c);text-align:center;line-height:1.5}
.btl .yr{font-size:.65rem;color:var(--muted)}
.btl .st{font-size:.6rem;color:var(--gold2);font-weight:700}

/* ========== ٣) تقليب الصفحة ========== */
.flip{position:fixed;inset:0;background:var(--cream);z-index:200;pointer-events:none;opacity:0}
.flip.go{animation:flipA .5s ease forwards}
@keyframes flipA{
  0%{opacity:.95;transform:perspective(1200px) rotateY(0)}
  55%{opacity:.95;transform:perspective(1200px) rotateY(-38deg)}
  100%{opacity:1;transform:perspective(1200px) rotateY(0)}
}
main.flip-out{animation:flipB .3s ease forwards}
@keyframes flipB{to{opacity:0;transform:perspective(1200px) translateX(-45px)}}

/* ========== ٤) تقدّم على شكل سيف ========== */
.sword{position:fixed;bottom:14px;right:50%;transform:translateX(50%);
  z-index:70;pointer-events:none;display:flex;align-items:center;gap:.5rem;
  background:var(--paper);border:1px solid var(--line);border-radius:50px;
  padding:.3rem .85rem;box-shadow:var(--shadow);font-size:.72rem;color:var(--muted)}
.sword svg{height:11px;width:118px}
.sword .bl{fill:var(--gold);opacity:.9}

/* ========== ٥) الأوسمة ========== */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:.55rem;margin-top:.8rem}
.bg{border:1px dashed var(--line);border-radius:14px;padding:.7rem .5rem;text-align:center;
  background:var(--paper);opacity:.4;filter:grayscale(1);transition:.35s}
.bg.on{opacity:1;filter:none;border:1px solid var(--gold);
  box-shadow:0 0 0 1px rgba(184,148,47,.22),var(--shadow)}
.bg .bi{font-size:1.9rem;line-height:1.2}
.bg b{display:block;font-size:.82rem;color:var(--ink);margin-top:.15rem}
.bg small{display:block;color:var(--muted);font-size:.64rem;line-height:1.5}

/* ========== ٦) شريط علوي رفيع ========== */
.topbar{position:fixed;top:0;right:0;left:0;height:3px;z-index:80}
.topbar i{display:block;height:100%;width:0;
  background:linear-gradient(90deg,var(--gold),#E8CE7C);transition:width .1s linear}

/* ==========================================================
   واجهة الصفحات العميقة (فصول متعددة)
   ========================================================== */

/* الفهرس */
.toc{margin-bottom:1.4rem;padding:1.2rem 1.3rem 1.4rem}
.toclist{list-style:none}
.toclist li{margin:0}
.toclist a{display:flex;align-items:center;gap:.6rem;padding:.42rem .3rem;
  border-bottom:1px dashed var(--line);text-decoration:none;color:var(--ink);
  font-size:.92rem;transition:.2s}
.toclist a:hover{color:var(--c);padding-right:.8rem;background:rgba(184,148,47,.07)}
.toclist b{background:var(--c);color:#fff;border-radius:6px;min-width:24px;
  text-align:center;font-size:.72rem;padding:.1rem .3rem;flex:0 0 auto}
.toclist .ttl{flex:1 1 auto;min-width:0}
.toclist .tpg{margin-inline-start:auto;flex:0 0 auto;font-size:.74rem;color:var(--muted);
  background:rgba(184,148,47,.1);border-radius:6px;padding:.05rem .4rem;min-width:26px;text-align:center}

/* عنوان القسم */
.part{margin-bottom:2.6rem}
.part-h{position:relative;text-align:center;margin:2.4rem 0 1.6rem;
  padding:1.1rem .9rem;border-top:1px solid var(--gold);border-bottom:1px solid var(--gold)}
.part-ic{font-size:2rem;line-height:1}
.part-h h2{font-family:'Amiri',serif;font-size:1.5rem;color:var(--c);margin:.2rem 0}
.part-h p{color:var(--muted);font-size:.92rem;max-width:640px;margin:.4rem auto 0;line-height:1.95}

/* الفصل */
.ch3{position:relative;background:var(--paper);border:1px solid var(--line);
  border-radius:16px;padding:1.3rem 1.2rem;margin-bottom:1.1rem;box-shadow:var(--shadow)}
.ch3-h{display:flex;align-items:flex-start;gap:.6rem;margin-bottom:.7rem;
  padding-bottom:.6rem;border-bottom:1px solid var(--line)}
.ch3-n{background:var(--c);color:#fff;font-size:.72rem;font-weight:700;
  padding:.18rem .5rem;border-radius:6px;flex:0 0 auto;margin-top:.25rem}
.ch3 h3,.rbody h3{font-family:'Amiri',serif;font-size:1.35rem;color:var(--ink);line-height:1.6}

/* افتتاحية الفصل: تميّز فصلًا عن آخر داخل القارئ */
.cho-top{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;
  font-family:'Cairo';font-size:.7rem;color:var(--muted);margin-bottom:.45rem}
.cho-part{font-weight:700;color:var(--c);opacity:.9}
.cho-cnt{margin-inline-start:auto;background:rgba(184,148,47,.13);color:var(--gold2);
  border-radius:20px;padding:.12rem .6rem;font-weight:700;white-space:nowrap}
.cho-mid{display:flex;align-items:flex-start;gap:.6rem}
.cho-num{font-family:'Amiri',serif;font-weight:700;font-size:1.45rem;color:var(--gold2);
  line-height:1.25;flex:0 0 auto;padding-top:.1rem}
.cho-num i{font-style:normal;opacity:.5;margin:0 .04rem}
.cho-rule{display:flex;align-items:center;gap:.5rem;margin-top:.65rem}
.cho-rule i{flex:1 1 auto;height:1px}
.cho-rule i:first-child{background:linear-gradient(to right,var(--gold),rgba(184,148,47,.06))}
.cho-rule i:last-child{background:linear-gradient(to left,var(--gold),rgba(184,148,47,.06))}
.cho-rule b{color:var(--gold);font-size:.68rem;font-weight:400;line-height:1}
.ch3 .lead,.rbody .lead{font-family:'Amiri',serif;font-size:1.12rem;line-height:2.05;
  color:var(--c);font-weight:700;margin-bottom:.7rem;text-align:right}
.ch3 .ap,.rbody .ap{font-family:'Amiri',serif;font-size:1.1rem;line-height:2.15;
  text-align:justify;margin-bottom:.75rem}
.ch3 .sub,.rbody .sub{font-family:'Amiri',serif;font-size:1.15rem;color:var(--c);
  margin:1.2rem 0 .5rem;padding-right:.6rem;border-right:4px solid var(--gold)}

/* صندوق الخلاصة */
.kbox{margin-top:1rem;background:linear-gradient(135deg,rgba(184,148,47,.09),rgba(184,148,47,.03));
  border:1px solid var(--line);border-radius:12px;padding:.8rem .9rem}
.kbox .bt{font-family:'Amiri',serif;color:var(--gold2);font-size:1rem;margin-bottom:.5rem}
.kgrid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.55rem}
.kb{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:.5rem .6rem}
.kb b{display:block;color:var(--blue);font-size:.88rem;margin-bottom:.1rem}
.kb span{font-size:.78rem;color:var(--muted);line-height:1.6;display:block}

/* جدول */
.tblwrap{overflow-x:auto;margin-top:1rem;border:1px solid var(--line);border-radius:12px}
.tblwrap table{border-collapse:collapse;width:100%;min-width:380px}
.tblwrap th{background:var(--c);color:#fff;font-size:.82rem;font-weight:700;
  padding:.55rem .7rem;text-align:right;white-space:nowrap}
.tblwrap td{padding:.55rem .7rem;font-size:.84rem;border-bottom:1px solid var(--line);
  line-height:1.8;vertical-align:top}
.tblwrap tr:last-child td{border-bottom:0}
.tblwrap tbody tr:nth-child(odd){background:rgba(184,148,47,.045)}

/* اقتباس */
.ch3 blockquote,.rbody blockquote{margin:1rem 0;padding:.8rem 1rem;border-right:5px solid var(--gold);
  background:rgba(184,148,47,.07);border-radius:0 12px 12px 0}
.ch3 blockquote p,.rbody blockquote p{font-family:'Amiri',serif;font-size:1.08rem;line-height:2;color:var(--gold2)}
.ch3 blockquote cite,.rbody blockquote cite{display:block;margin-top:.4rem;font-size:.78rem;
  color:var(--muted);font-style:normal}

/* خلاصة الفصل */
.ch3 .res,.rbody .res{margin-top:1rem;padding:.6rem .9rem;border-right:4px solid var(--gold);
  background:linear-gradient(135deg,rgba(184,148,47,.12),rgba(184,148,47,.04));
  border-radius:10px;font-size:.9rem;color:var(--gold2);font-weight:600}
.ch3 .up{display:block;text-align:left;margin-top:.9rem;font-size:.78rem;
  color:var(--muted);text-decoration:none}
.ch3 .up:hover{color:var(--c)}

@media(max-width:420px){
  .ch3{padding:1rem .85rem}
  .ch3 .ap,.rbody .ap{font-size:1.05rem}
  .kgrid3{grid-template-columns:1fr 1fr}
}


/* ==========================================================
   COMFORT — راحة القراءة والزخرفة
   ========================================================== */

/* عرض مريح للسطر: يمنع الإرهاق البصري */
main{max-width:760px}
.ch3 .ap,.ch3 .lead{max-width:100%}

.porn{width:280px;max-width:80%;height:38px;margin:0 auto .6rem;display:block}
.porn .ln{stroke:var(--gold);stroke-width:1.1;fill:none;opacity:.7}

/* فهرس الأقسام داخل رأس القسم */

.part-list a{font-size:.76rem;text-decoration:none;color:var(--muted);
  border:1px solid var(--line);border-radius:50px;padding:.2rem .7rem;transition:.2s}
.part-list a:hover{color:var(--c);border-color:var(--gold);background:rgba(184,148,47,.08)}

/* فهرس متشعّب */
.toclist>li{padding:0}
.toc-part{list-style:none;margin-bottom:.9rem}
.toc-part>b{display:inline-block;margin-left:.4rem}
.toc-part>a{font-weight:700;font-size:.98rem;color:var(--c);display:flex;align-items:center;gap:.45rem}
.toc-part>ul{list-style:none;margin:.35rem 0 0;padding-right:.9rem;
  border-right:1px dashed var(--line)}
.toc-part>ul>li{margin:0}
.toc-part>ul a{padding:.32rem .3rem;font-size:.88rem;border:0;gap:.45rem}
.toc-part>ul a i{width:6px;height:6px;border-radius:50%;background:var(--line);

.toc-part>li.here a,.toc-part>ul>li.here a{color:var(--c);background:rgba(184,148,47,.1)}
.toc-part>ul>li.here a i{background:var(--gold);box-shadow:0 0 0 3px rgba(184,148,47,.2)}

.chnav{display:flex;gap:.5rem;align-items:stretch;margin-top:1.1rem;
  padding-top:.9rem;border-top:1px dashed var(--line)}

/* ==========================================================
   القارئ — كتاب بلا تمرير عمودي
   ========================================================== */

/* الصفحة كلها: شريط علوي + مسرح + شريط سفلي */
body.reading{height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
body.reading .top{flex:0 0 auto}
body.reading .flip,body.reading .sword,body.reading .railbar,body.reading .crumbs{display:none}

main.reader{max-width:none;margin:0;padding:0;flex:1;min-height:0;
  display:flex;flex-direction:column;animation:none}

/* الشريط العلوي يحمل اسم الفصل */
.top.reading .brand{flex:1;min-width:0;gap:.35rem}
.top.reading .btxt{display:none}
.rbrand{font-family:'Amiri',serif;font-size:.92rem;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* المسرح */
.rstage{position:relative;flex:1;min-height:0;overflow:hidden;
  perspective:2200px;perspective-origin:50% 50%;touch-action:pan-y}

/* الصفحة */
.rpage{position:absolute;display:flex;flex-direction:column;overflow:hidden;
  background:var(--paper);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 6px 22px rgba(80,60,20,.12)}
.rbody{flex:1;min-height:0;overflow:hidden;padding:12px 20px}
.rpfoot{flex:0 0 auto;height:26px;display:flex;align-items:center;justify-content:center;
  font-size:.72rem;color:var(--muted);border-top:1px solid var(--line);
  direction:ltr;unicode-bidi:isolate}

/* حاوية القياس (خارج الشاشة) */
.rmeas{position:absolute;left:-99999px;top:0;visibility:hidden;pointer-events:none}
.rmeas .rbody{height:auto!important;padding:0;overflow:hidden}

/* ورقة التقليب */
.rleaf{position:absolute;display:none;transform-style:preserve-3d;
  will-change:transform;z-index:20;pointer-events:none}
.rleaf.on{display:block}
.rface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--paper);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);overflow:hidden}
.rback{transform:rotateY(180deg);
  background:linear-gradient(270deg,var(--paper) 55%,var(--cream) 100%)}
.rleaf::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to left,rgba(0,0,0,.30),rgba(0,0,0,0) 45%);
  opacity:calc(var(--a,0)*.95)}
.rleaf.prev::after{background:linear-gradient(to right,rgba(0,0,0,.30),rgba(0,0,0,0) 45%)}

/* الشريط السفلي */
.rfoot{flex:0 0 auto;display:flex;align-items:center;gap:.6rem;
  padding:.35rem .8rem;min-height:56px;border-top:1px solid var(--line);background:var(--paper)}
.rnav{min-height:48px;min-width:66px;padding:.35rem .9rem;border:1px solid var(--line);
  border-radius:12px;background:transparent;color:var(--ink);font-family:'Cairo';
  font-size:.9rem;font-weight:600;cursor:pointer;transition:.2s}
.rnav:hover:not(:disabled){border-color:var(--gold);background:rgba(184,148,47,.07)}
.rnav:disabled{opacity:.3;cursor:default}
.rprog{flex:1;height:9px;min-width:60px;border:0;padding:0;border-radius:9px;
  background:var(--line);overflow:hidden;cursor:pointer;display:block}
.rprog i{display:block;height:100%;width:0;
  background:linear-gradient(90deg,var(--gold),#E3C56A);transition:width .25s}

/* لوحة الفهرس والذهاب إلى صفحة */
.rpanel{position:fixed;top:0;right:0;bottom:0;width:min(86vw,360px);z-index:120;
  background:var(--paper);border-left:1px solid var(--line);display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .28s ease;
  box-shadow:-6px 0 24px rgba(0,0,0,.14)}
.rpanel.on{transform:translateX(0)}
.rphead{display:flex;align-items:center;justify-content:space-between;
  padding:.65rem .9rem;border-bottom:2px solid var(--gold);
  font-family:'Amiri';font-size:1.05rem;color:var(--c)}

.rpgo{min-height:46px;padding:0 1rem;border:0;border-radius:10px;background:var(--gold);
  color:#fff;font-family:'Cairo';font-weight:700;cursor:pointer}
.rpfont{display:flex;align-items:center;gap:.45rem;padding:.55rem .9rem;

.rpfont span{margin-left:auto}

  background:transparent;color:var(--ink);font-family:'Cairo';font-size:.92rem;cursor:pointer}

ef=\"#part-3\"\u003e\u003cspan class=\"ttl\"\u003eالقسم الثالث: الفتنة وملوك الطوائف\u003c/span\u003e\u003c/a\u003e\n      \u003cul\u003e\u003cli\u003e\u003ca href=\"#collapse\"\u003e\u003ci\u003e\u003c/i\u003e\u003cspan class=\"ttl\"\u003eسقوط الخلافة\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href=\"#taifas\"\u003e\u003ci\u003e\u003c/i\u003e\u003cspan class=\"ttl\"\u003eملوك الطوائف\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href=\"#taifa-culture\"\u003e\u003ci\u003e\u003c/i\u003e\u003cspan class=\"ttl\"\u003eثقافة الطوائف: العلم في زمن الانقسام\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href=\"#murabitun\"\u003e\u003ci\u003e\u003c/i\u003e\u003cspan class=\"ttl\"\u003eالمرابطون: الإنقاذ الذي صار ضمًّا\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\u003c/ul\u003e\n    \u003c/li\u003e\u003cli class=\"toc-part\"\u003e\u003cb\u003e🛡️\u003c/b\u003e\n      \u003ca href=\"#part-4\"\u003e\u003cspan class=\"ttl\"\u003eالقسم الرابع: معارك المصير\u003c/span\u003e\u003c/a\u003e\n      \u003cul\u003e\u003cli\u003e\u003ca href=\"#al-arak\"\u003e\u003ci\u003e\u003c/i\u003e\u003cspan class=\"ttl\"\u003eالأرك: انتصار الموحدين\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href=\"#al-uqab\"\u003e\u003ci\u003e\u003c/i\u003e\u003cspan class=\"ttl\"\u003eالعقاب: اليوم الذي انكسرت فيه الأندلس\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href=\"#fall-of-cities\"\u003e\u003ci\u003e\u003c/i\u003e\u003cspan class=\"ttl\"\u003eسقوط القواعد: قرطبة وبلنسية وإشبيلية\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href=\"#marinids-and-strait\"\u003e\u003ci\u003e\u003c/i\u003e\u003cspan class=\"ttl\"\u003eبنو مرين والمضيق: آخر محاولة للإنقاذ\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\u003c/ul\u003e\n    \u003c/li\u003e\u003cli class=\"toc-part\"\u003e\u003cb\u003e🏰\u003c/b\u003e\n      \u003ca href=\"#part-5\"\u003e\u003cspan class=\"ttl\"\u003eالقسم الخامس: غرنا  14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e⚔️\u003c/div\u003e\n      \u003ch2\u003eالقسم الأول: الفتح والإمارة\u003c/h2\u003e\n      \u003cp\u003eدخل الإسلام الأندلس في سنة ٧١١م بجيش صغير عبر المضيق، وفي أقل من أربعين سنة صارت قرطبة عاصمة دولة مستقلة. هذه الفصول الثلاثة تحكي العبور الأول، وقيام الإمارة الأموية، والحدود الشمالية التي ظلّت ساحة حرب ثمانية قرون.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#the-crossing\"\u003eالفتح: عبور المضيق\u003c/a\u003e\u003ca href=\"#the-emirate\"\u003eالإمارة الأموية في قرطبة\u003c/a\u003e\u003ca href=\"#frontier-and-north\"\u003eالثغور والشمال\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"the-crossing","n":"الفتح: عبور المضيق","ic":"⛵","part":"القسم الأول: الفتح والإمارة","h":"\u003carticle class=\"ch3\" id=\"the-crossing\" data-toc=\"الفتح: عبور المضيق\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الأول: الفتح والإمارة\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ١ من ٣\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e١\u003ci\u003e.\u003c/i\u003e١\u003c/span\u003e\n            \u003ch3\u003e⛵ الفتح: عبور المضيق\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي ربيع سنة ٧١١م عبر جيش من سبعة آلاف رجل مضيقًا لا يتجاوز عرضه أربعة عشر كيلومترًا، فسقطت في يديه مملكة عمرها ثلاثة قرون في أقل من سنة. ولم يكن ذلك سحرًا، بل كان مملكةً منقسمةً على نفسها استقبلت من جاءها.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكانت إسبانيا في أوائل القرن الثامن الميلادي مملكة قوطية غربية، عاصمتها طليطلة، ودينها النصرانية الآرية ثم الكاثوليكية، ونظامها الملكي انتخابي لا وراثي. وقد كانت المملكة في تلك السنين تعاني صراعًا حادًّا بين بيوت النبلاء، وكان الملك لذريق قد بلغ العرش بعد خلاف، وكان أبناء الملك السابق ومناصروه يرونه مغتصبًا. وفي مثل هذا الموضع لا تحتاج الدولة إلى جيش كبير لهدمها، بل إلى انقسام في صفّها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان المسلمون قد بلغوا المغرب الأقصى في أواخر القرن الأول الهجري، وكان موسى بن نصير واليًا على إفريقية والمغرب، وكانت مدينة سبتة على الضفة الجنوبية للمضيق في يد رجل يُقال له يليان، وكان على صلة بالبلاد الأندلسية وبأخبارها. وقد جرت بينه وبين موسى مراسلات واتفاقات، وتذكر الروايات أن سببًا شخصيًا دفع يليان إلى تسهيل العبور، غير أن الأهم من السبب هو النتيجة: أن المضيق صار مفتوحًا أمام المسلمين.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأنفذ موسى بن نصير حملةً استطلاعية بقيادة طريف بن مالك سنة ٧١٠م، فعبرت في أربع سفن ونزلت في موضع سُمّي باسمه جزيرة طريف، ثم عادت بخبر الطريق. وفي السنة التالية أرسل جيشًا أكبر بقيادة طارق بن زياد، وكان مولى له، فعبر في رجب سنة ٩٢هـ الموافق أبريل سنة ٧١١م، ونزل عند الجبل الذي صار يُعرف بجبل طارق. وتذكر الروايات أنه أحرق السفن أو خطب في جنده خطبةً يحثّهم فيها على الثبات، والروايات في ذلك متفاوتة في الثبوت.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالتقى الجيشان في وادي لكة قرب شذونة في رمضان سنة ٩٢هـ، وكان جيش لذريق أكبر عددًا وأثقل عتادًا، لكنه كان جيشًا من نبلاء متحاسدين. وقد انهزم القوط هزيمةً كاملة، وغاب لذريق عن الأخبار بعد المعركة فلم يُعرف مصيره، وتفرّق الجيش وتفرّقت معه المملكة. وكانت هذه المعركة هي الباب الذي دخل منه الإسلام إلى شبه الجزيرة، ولم يبقَ بعدها جيش يقف في وجه الفاتحين.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سنة ٧١٢م عبر موسى بن نصير بنفسه بجيش آخر، فسلك طريقًا مختلفًا عن طريق طارق، ودخل إشبيلية ومريدة وطليطلة، ولقي طارقًا في موضع يُقال له طلبيرة، وقد كان طارق قد بلغ طليطلة قبله. ثم انطلقا معًا نحو الشمال حتى بلغا سرقسطة ونهراسة، ووقفا على حدود الجبال الشمالية. وكان هذا التقدم السريع يدل على أن المقاومة المنظمة كانت قد انهارت، وأن المدن كانت تُسلّم أو تُصالح أكثر مما تُقاتل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان سرعة الفتح سببًا في دهشة المؤرخين، وفسّروها بأسباب عدة: انقسام النبلاء القوط على الملك، وثقل الضرائب على الفلاحين، واضطهاد اليهود بعد قرارات الملك إركا القاسية، وضعف التنظيم العسكري القوطي. وكان الفاتحون يعرضون على أهل المدن ثلاثة خيارات: الإسلام، أو الجزية مع البقاء على الدين، أو القتال. وكان الأمان يُكتب ويُحفظ، ولهذا بقيت مدن كثيرة بلا حرب.\u003c/p\u003e\u003cp class=\"ap\"\u003eومن أشهر هذه العقود عقد تدمير على مدينة تدمير في شرق الأندلس، وفيه أمانٌ للناس على أنفسهم وأموالهم وكنائسهم، مقابل الجزية وعدم إيواء العدو. وهذا النوع من العقود هو الذي جعل الفتح مستقرًّا، لأن أهل البلاد عرفوا ما لهم وما عليهم، ولم يكن الأمر غزوًا عشوائيًا بل دخولًا بنظام عقدي معروف في الفقه الإسلامي. وقد بقي نص هذا العقد محفوظًا في كتب النوازل، لأن الفقهاء احتاجوا إليه في فتاوى معاملة أهل الذمة، وهذا الحفظ هو الذي يجعلنا نعرف تفاصيل الإدارة لا خطوطها العامة فقط.\u003c/p\u003e\u003cp class=\"ap\"\u003eوبعد الفتح صارت الأندلس ولاية تابعة لولاية إفريقية، وتابعة في الأصل لخلافة دمشق، وكان يولي عليها الولاة ويُعزلون بحسب سياسة المركز. وقد ظلّت على هذا الحال أربعين سنة، حتى قامت الإمارة الأموية في قرطبة سنة ٧٥٦م، فبدأت مرحلة جديدة في تاريخ البلاد. وفي سنة ٧٣٢م توقف الزحف نحو الشمال في موضع عُرف في المصادر العربية ببلاط الشهداء، وهو الذي يُعرف في المصادر الأوروبية بمعركة تور، فثبتت بذلك حدود الشمال قرونًا.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eلماذا سقطت المملكة القوطية\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم تسقط المملكة القوطية في معركة واحدة فقط، بل سقطت في بنيتها قبل أن تسقط في ميدانها. فالملك كان انتخابيًّا، وكان كل نبل يريد أن يكون الملك من بيته، وكان أبناء الملوك السابقين يعيشون في البلاد كقوة معارضة دائمة. وقد كان لذريق نفسه موضع شك عند فريق كبير من النبلاء، وهذا الفريق هو الذي لم يقاتل معه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوإلى هذا كان ثقل الضرائب على العامة، وكانت سياسة الدولة الدينية قاسية على اليهود، فكان في البلاد من لا يرى في تغيّر الحكم خسارة. وقد عامل الفاتحون كل هؤلاء معاملة العقد والأمان، فلم يكن عندهم سبب للقتال. ولهذا لم يكن الفتح انتصار جيش على جيش، بل انتقال سلطة في بلاد لم تكن متماسكة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eطارق وموسى: حساب القيادة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان طارق بن زياد مولى لموسى بن نصير، وكان عبر بأمره، ثم تابع الفتح على غير انتظار حتى بلغ طليطلة. وقد غضب موسى من ذلك في الروايات، لأنه أراد أن يكون الفتح تحت قيادته المباشرة، فعبر بنفسه سنة ٧١٢م ولحق به. وقد كان هذا الخلاف بين القائد وواليـه خلافًا في الحساب لا في الهدف.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد استدعى الخليفة الوليد بن عبد الملك كليهما إلى دمشق، فسارا إليها، وتوفي الوليد قبل وصولهما أو في أثنائه، فحبسهما سليمان بن عبد الملك ثم أطلقهما. وهذا التفصيل يدل على أن الفتح كان عملًا دولةً لا عملًا فرديًا، وأن ما جرى في الأندلس كان يُتابع من دمشق مباشرة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eعقود الأمان\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان العقد هو أداة الفتح الأولى، وهو ما يجعل هذه الفتوح مختلفة عن الغزوات القديمة. فالعقد يحدّد الجزية والخراج، ويضمن الكنائس، ويحدّد ما على أهل البلاد من ضيافة الجيوش وعدم الإعانة على العدو. وبهذا صار الفتح إدارةً لا نهبًا، وصار أهل البلاد رعيةً لها حقوق لا غنيمةً تُقسم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد حفظت المصادر نصوصًا من هذه العقود، ومنها عقد تدمير، وهي نصوص تُشبه المعاهدات الحديثة في تحديد الالتزامات. ولهذا بقيت مدن كثيرة على دينها قرونًا، ودخل الإسلام فيها بالتدريج لا بالسيف، وهذا هو ما جعل الأندلس بلادًا ذات ثلاثة أديان لا بلادًا خاليةً من أهلها.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالعبور\u003c/b\u003e\u003cspan\u003eأبريل سنة ٧١١م، رجب سنة ٩٢هـ\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمعركة\u003c/b\u003e\u003cspan\u003eوادي لكة قرب شذونة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالقائدان\u003c/b\u003e\u003cspan\u003eطارق بن زياد ثم موسى بن نصير\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسنة ٧٣٢م\u003c/b\u003e\u003cspan\u003eتوقف الزحف في بلاط الشهداء\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالنظام\u003c/b\u003e\u003cspan\u003eولاية تابعة لإفريقية ثم لدمشق\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e٧١٠م\u003c/td\u003e\u003ctd\u003eحملة طريف بن مالك\u003c/td\u003e\u003ctd\u003eمعرفة الطريق والمواضع\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٧١١م\u003c/td\u003e\u003ctd\u003eعبور طارق ووقعة وادي لكة\u003c/td\u003e\u003ctd\u003eانهيار المملكة القوطية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٧١٢م\u003c/td\u003e\u003ctd\u003eعبور موسى ودخول طليطلة\u003c/td\u003e\u003ctd\u003eتثبيت الفتح في الوسط\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٧١٣م إلى ٧١٤م\u003c/td\u003e\u003ctd\u003eالتقدم إلى الشمال الشرقي\u003c/td\u003e\u003ctd\u003eبلوغ سرقسطة ونهراسة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٧٣٢م\u003c/td\u003e\u003ctd\u003eبلاط الشهداء\u003c/td\u003e\u003ctd\u003eتوقف التوسع وثبات الحدود\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eوَاللَّهُ غَالِبٌ عَلَىٰ أَمْرِهِ وَلَٰكِنَّ أَكْثَرَ النَّاسِ لَا يَعْلَمُونَ\u003c/p\u003e\u003ccite\u003eسورة يوسف، الآية ٢١\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eعبر جيش صغير مضيقًا ضيقًا فسقطت مملكة منقسمة في أقل من سنة، لا بقوة السلاح بل بانقسام أهلها وحسن سياسة العقود. وبهذا صار الإسلام في الأندلس دولةً ذات رعية وأمان، لا غزوةً عابرة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"the-emirate","n":"الإمارة الأموية في قرطبة","ic":"🕌","part":"القسم الأول: الفتح والإمارة","h":"\u003carticle class=\"ch3\" id=\"the-emirate\" data-toc=\"الإمارة الأموية في قرطبة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الأول: الفتح والإمارة\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٢ من ٣\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e١\u003ci\u003e.\u003c/i\u003e٢\u003c/span\u003e\n            \u003ch3\u003e🕌 الإمارة الأموية في قرطبة\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي سنة ٧٥٦م وصل إلى شاطئ الأندلس رجل هارب من أكبر مذبحة في تاريخ بيته، فبنى في قرطبة دولةً بقيت نحو ثلاثة قرون، وجعل من الفرار بداية سلالة.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eقامت الدولة العباسية سنة ١٣٢هـ الموافق ٧٥٠م على أنقاض الدولة الأموية، وقتلت من أبناء البيت الأموي من قدرت عليه، وكانت المذبحة في بعض الروايات مروّعة. وقد نجا منها عبد الرحمن بن معاوية بن هشام، وكان شابًّا في العشرين، فخرج من الشام هاربًا ومرّ بالعراق ومصر والمغرب، وتعقّبته جواسيس العباسيين سنوات. ثم عبر إلى الأندلس سنة ٧٥٥م، وكانت البلاد يومئذ في فوضى بين الولاة والقبائل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد وجد عبد الرحمن في الأندلس أنصارًا من الموالي الأمويين ومن القبائل اليمنية، فدخل قرطبة سنة ٧٥٦م وأعلن نفسه أميرًا، ولم يُلقّب بالخليفة لأنه لم يكن يريد أن يُعلن الخروج الكامل على العباسيين في أول أمره. وبهذا قامت إمارة أموية مستقلة في الأندلس، ولم تنقطع عن العالم الإسلامي في الدين واللغة، لكنها استقلّت في الحكم. وقد كانت بيعة قرطبة في أول الأمر محدودة، ثم اتسعت بعد أن انضم إليه موالي بني أمية وأشراف اليمنيين، وفي هذا تفصيل يفسّر كيف قامت الدولة بلا معركة فاصلة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد قضى عبد الرحمن سنواته الأولى في تثبيت سلطته، فقمع الثورات في المدن، وأخضع القبائل المتنازعة، وبنى جيشًا من الموالي والبربر لا يعتمد على قبيلة واحدة. وكان في هذا فقه سياسي عميق: أن الحاكم الجديد في بلد القبائل لا يستطيع أن يحكم بقبيلة، لأنه يصير أسيرها، فبنى جيشًا يخصّه. وقد كان هذا الجيش يُدفع له راتب منتظم من بيت المال، وكان ولاؤه للدولة لا للعشيرة، وهذا هو الفرق الجوهري بين جيش الدولة وجيش القبيلة في بلاد المغرب والأندلس.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بدأ في بناء جامع قرطبة الكبير، وكان في موضع كنيسة قديمة، فوسّعه وجعل منه أعظم مساجد الأندلس. وقد بلغ الجامع في عهود لاحقة ثمانية وعشرين بلاطًا، وصار مركزًا للعلم والعبادة، وبقي أثرًا من آثار الإسلام في الأندلس إلى اليوم. وقد كان البناء في هذا العهد إعلانًا سياسيًّا أيضًا، لأن العمارة تُعلن بقاء الدولة أكثر من الجيوش. وقد كانت المساحة تُقاس بعدد البلاط، وبلغت في أوسع توسعاته ما لم يبلغه مسجد آخر في الغرب الإسلامي، وهذا وحده يدل على حجم المدينة التي كان يخدمها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي عهد هشام الأول ثم الحكم الأول واجهت الإمارة ثورات متعددة، وأشهرها ثورة الربض في قرطبة سنة ٨١٨م، وهي ثورة أهلية قُمعت بعنف، وهاجر بعدها كثير من أهل قرطبة إلى الأندلس الشرقية وإلى المغرب. وقد أسّس هؤلاء المهاجرون في جزيرة كريت وفي الإسكندرية دولًا صغيرة، وهذا يدل على أن الأندلس كانت تُصدّر الناس كما تستقبلهم. وقد بلغ من هؤلاء المهاجرين من أسّس في جزيرة كريت إمارةً عربية بقيت أكثر من قرن، ومنهم من نزل الإسكندرية، وهذا يدل على أن أثر الأندلس خرج منها إلى البحر لا إلى داخلها فقط.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي عهد عبد الرحمن الثاني بلغت الإمارة درجة عالية من العمران والعلم، فازدهرت قرطبة وظهر فيها العلماء والشعراء، ووفدت عليها الوفود من المشرق. وقد واجه في أثناء ذلك غزوة الفايكنغ سنة ٨٤٤م، فدخلوا إشبيلية وأحرقوا فيها، ثم هُزموا بعد معارك، فبنت الإمارة أسطولًا لحماية السواحل، وكان هذا أول أسطول أندلسي كبير. وقد استقدم عبد الرحمن الثاني العلماء من المشرق، وأرسل من يشتري الكتب في العراق والحجاز، وكان هذا بداية نهضة علمية امتدّت إلى عهد الخلافة وصارت قرطبة تُضاهي بغداد في مجالسها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي أواخر القرن الثالث الهجري ظهرت في الجنوب ثورة عمر بن حفصون في جبل ببشتر، واستمرت سنوات طويلة، وأعلن صاحبها النصرانية في آخر أمره. وقد أنهكت هذه الثورة الدولة، وأظهرت أن سلطة الأمير في الأندلس كانت أضعف من أن تضبط الأطراف، وأن البلاد كانت تحتاج إلى مركز أقوى مما كان. وقد قُتل ابن حفصون سنة ٣٠٥هـ بعد أن أنهك البلاد نحو سبعين سنة، وكانت ثورته أطول ثورة داخلية في تاريخ الأندلس، وخلّفت أثرًا في ضعف المدن الجنوبية وفي هجرة كثير من أهلها إلى المدن المحصّنة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد انتهت هذه المرحلة في سنة ٩٢٩م حين أعلن عبد الرحمن الثالث نفسه خليفة، وكانت الدولة قد بلغت من القوة ما جعل هذا الإعلان ممكنًا. وبهذا انتقلت الأندلس من إمارة إلى خلافة، ودخلت عصرها الذهبي، وهو الذي تعرضه الفصول التالية. وقد كان هذا الانتقال خطوةً محسوبة لا ترفًا، لأن لقب الخليفة يعني دعوى الزعامة العامة على المسلمين، ولا يطلقه أمير إلا إذا كان يملك من القوة والمال ما يبرّر الدعوى ويدفع تبعاتها، وكان عبد الرحمن الثالث يملك ذلك فعلًا بعد أن أخضع الثغور وأمّن السواحل.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eعبد الرحمن الداخل: الفرار الذي صار دولة\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يكن عبد الرحمن الداخل يملك حين وصل الأندلس جيشًا ولا مالًا، بل كان يملك اسمًا ونسبًا وذاكرة. وقد استعمل هذا كله بذكاء: فاسمه الأموي جعل الموالي يلتفون حوله، ونسبه جعله بديلًا عن ولاةٍ لا يعرف أحد من أين جاءوا. وبهذا صار الفرار سياسةً لا هروبًا. وقد كانت قبيلة بني أمية في الشام تُعرَف بالملك لا بالدعوة، فكان اسمه عند الناس علامة على دولة قديمة لا على رجل جديد، وهذا ما جعل البيعة تسير أسرع مما تُسير السيوف.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد وصفه المؤرخون بالحزم والدهاء، وقال فيه الشاعر: بنو أمية في الأندلس كأنهم لم يغادروا الشام. وقد بنى دولةً لم تُسقطها الفتن ولا الثورات، لأنها قامت على جيشٍ يخصّ الأمير وعلى إدارةٍ تجمع المال، لا على قبيلة واحدة تُعين أو تخذل. وقد قال فيه مؤرخو الأندلس إنه كان إذا غضب غضب له الجيش وإذا رضي رضي الناس، وكان يجلس للناس فينظر في المظالم بنفسه، وهذا ما جعل سلطته راسخة على الرغم من قلة جنده.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eجامع قرطبة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الجامع في أصله كنيسة، ثم صار مسجدًا جامعًا، ثم توسّع في عهود عدة حتى صار من أكبر مساجد العالم. وقد استعمل في بنائه أعمدة من معابد قديمة، وعقودًا مزدوجة تُعطي ارتفاعًا يُساعد على الإضاءة والتهوية، وكان ذلك حلًّا معماريًّا بارعًا لمسجد واسع في بلاد حارة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد صار الجامع رمزًا للدولة، لأن السلطان الذي يوسّعه يُعلن أنه صاحب البلد وحامي دينه. وقد بقي بعد سقوط الخلافة، ثم حُوّل إلى كنيسة بعد سقوط قرطبة سنة ١٢٣٦م، وبقي بناؤه إلى اليوم شاهدًا على عمارة الأندلس في عصرها الأول. وقد كانت العقود المزدوجة تُرفع بها الأسقف، فتُتيح فتحات علوية للضوء والهواء فوق الأعمدة، وكان هذا حلًّا هندسيًّا بارعًا في زمن لم تكن فيه إضاءة صناعية، ولهذا صار نموذجًا تُقلّده المساجد بعد ذلك.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eثورة الربض وأثرها\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت ثورة الربض سنة ٨١٨م من أشد الثورات على الإمارة، وقد قام بها أهل قرطبة أنفسهم ضد جند الأمير وضد الضرائب، فقُمعت بالقوة وهُدمت فيها أحياء. وقد هاجر بعدها عدد من أهل قرطبة إلى المغرب وإلى الشرق، وكان منهم من أسّس دولًا صغيرة في البحر المتوسط. وقد كان في الربض سوقٌ وحمّامات ومسجد، وكان أهلها من التجار والحرفيين، فكانت الثورة ثورة مدينةٍ عامرة لا ثورة أطراف، وهذا ما جعل قمعها أشدّ أثرًا في الذاكرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت هذه الثورة درسًا في طبيعة الحكم في الأندلس: أن السلطة لا تستطيع أن تعتمد على القهر وحده، وأن المدينة التي تُقصى أهلها تُصدّر مشكلتها إلى الخارج. وقد تعلّم عبد الرحمن الثاني هذا الدرس، فبنى في عهده سياسةً من العمران والاستقطاب بدل القمع. وقد كان من نتائجها أن الأمراء بعدها تعلّموا أن يبنوا لأنفسهم قصورًا خارج المدينة، وأن يستقدموا جندًا من خارج الأندلس، لأن جند المدينة صار موضع شك عندهم.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالوصول\u003c/b\u003e\u003cspan\u003eسنة ٧٥٥م، والإمارة سنة ٧٥٦م\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمؤسس\u003c/b\u003e\u003cspan\u003eعبد الرحمن بن معاوية، الداخل\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالعاصمة\u003c/b\u003e\u003cspan\u003eقرطبة، وجامعها الكبير\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eثورة الربض\u003c/b\u003e\u003cspan\u003eسنة ٨١٨م في قرطبة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالفايكنغ\u003c/b\u003e\u003cspan\u003eغزوة سنة ٨٤٤م وبناء الأسطول\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالأمير\u003c/th\u003e\u003cth\u003eسنوات الحكم\u003c/th\u003e\u003cth\u003eأبرز ما في عهده\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eعبد الرحمن الداخل\u003c/td\u003e\u003ctd\u003e١٣٨ – ١٧٢هـ\u003c/td\u003e\u003ctd\u003eتأسيس الإمارة وبناء الجامع\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eهشام الأول\u003c/td\u003e\u003ctd\u003e١٧٢ – ١٨٠هـ\u003c/td\u003e\u003ctd\u003eتثبيت الدولة والفتوح\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالحكم الأول\u003c/td\u003e\u003ctd\u003e١٨٠ – ٢٠٦هـ\u003c/td\u003e\u003ctd\u003eثورة الربض وقمع الفتن\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eعبد الرحمن الثاني\u003c/td\u003e\u003ctd\u003e٢٠٦ – ٢٣٨هـ\u003c/td\u003e\u003ctd\u003eالعمران والعلم وغزوة الفايكنغ\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eمحمد الأول\u003c/td\u003e\u003ctd\u003e٢٣٨ – ٢٧٣هـ\u003c/td\u003e\u003ctd\u003eثورة ابن حفصون وضعف الأطراف\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eإِنَّ اللَّهَ لَا يُغَيِّرُ مَا بِقَوْمٍ حَتَّىٰ يُغَيِّرُوا مَا بِأَنفُسِهِمْ\u003c/p\u003e\u003ccite\u003eسورة الرعد، الآية ١١\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eوصل رجل هارب من مذبحة بيته فبنى في قرطبة دولةً بقيت ثلاثة قرون، لأنه حوّل اسمه إلى رأس مال سياسي وبنى جيشًا لا يخص قبيلة. وبهذا صارت الأندلس كيانًا مستقلًا في الحكم متصلًا بالعالم الإسلامي في الدين واللغة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"frontier-and-north","n":"الثغور والشمال","ic":"🏰","part":"القسم الأول: الفتح والإمارة","h":"\u003carticle class=\"ch3\" id=\"frontier-and-north\" data-toc=\"الثغور والشمال\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الأول: الفتح والإمارة\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٣ من ٣\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e١\u003ci\u003e.\u003c/i\u003e٣\u003c/span\u003e\n            \u003ch3\u003e🏰 الثغور والشمال\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eل\u003c/span\u003eم تكن الأندلس جزيرة معزولة، بل كانت لها حدود شمالية طويلة ظلّت ساحة حرب ثمانية قرون. وعلى هذه الحدود قامت مدنٌ وممالك وثقافةٌ خاصة، ولم تنقطع عنها الصوائف ولا الهدن.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكانت الحدود الشمالية للأندلس تبدأ من جبال البرتات في الشمال، وتمتدّ على طول نهر الإبرو وسهول الشمال الغربي، وكانت تُسمّى الثغور. وقد قسّمها الجغرافيون العرب إلى ثلاثة أقسام: الثغر الأعلى في الشمال الشرقي وعاصمته سرقسطة، والثغر الأوسط في الوسط وعاصمته طليطلة، والثغر الأدنى في الشمال الشرقي الساحلي وعاصمته برشلونة ثم طرطوشة. وكان لكل ثغر مدن وحصون وقواعد عسكرية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت هذه الثغور تُدار بنظام خاص، لأنها كانت في حالة حرب دائمة أو هدنة مؤقتة. فكان فيها حكامٌ لهم صلاحيات عسكرية أوسع، وكانت فيها حصون تُبنى على التلال لمراقبة الطرق، وكانت فيها أرضٌ خالية بين الجانبين تُسمّى أرض الصلح أو الأرض الخالية، تُترك بلا سكان لتكون حاجزًا بين الطرفين. وقد كان هذا النظام يحتاج إلى مال كثير، فكانت الثغور تُموّل من الخراج ومن الغنائم ومن الجزية، وكان انقطاع المال أول أسباب انهيار الحصون، لأن الحصن الذي لا يُدفع لجنده يفتح بابه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد قامت في الشمال ممالك نصرانية في الوقت نفسه، وأولها مملكة أستورياس في الجبال الشمالية الغربية، وقد تأسست في القرن الثامن الميلادي بعد معركة عُرفت في المصادر الأوروبية بكوفادونغا سنة ٧٢٢م. ثم توسّعت هذه المملكة حتى صارت مملكة ليون، وانفصلت عنها قشتالة، وقامت في الشرق نافارا وأراغون وكتالونيا. وقد كانت هذه المملكة في أول أمرها صغيرة وفقيرة، ولم يكن أحد يتوقّع أن تصير قشتالة بعد ثلاثة قرون أكبر قوة في شبه الجزيرة وأن تُسقط غرناطة سنة ١٤٩٢م.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت العلاقة بين الأندلس وهذه الممالك علاقة حرب وسلم متبادلين: فكانت الصوائف تُرسل في الصيف لضرب الحصون وجمع الغنائم، وكانت الهدن تُعقد لسنوات، وكانت الجزية تُدفع من الطرف الأضعف. وكان في هذه العلاقة أيضًا تجارة وتبادل أسرى ورسائل، وكانت الحدود في سنوات الهدنة أسواقًا لا خنادق. وقد كانت الهدنة تُعقد لثلاث سنوات أو خمس أو عشر، وكانت تُجدّد بمبعوثين وهدايا، وكان نقضها يُعلن بحملة، ولهذا عرف الناس في الثغور تقويمًا للحرب والسلم لا تقويمًا للسنوات فقط.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت طليطلة أهم مدن الثغر الأوسط، وكانت قاعدةً للعلم والترجمة في القرون الأولى، وفيها من العلماء والكتب ما جعلها تُشبه قرطبة في مكانتها الثقافية. وقد سقطت في يد قشتالة سنة ١٠٨٥م، وكان سقوطها صدمةً كبرى في الأندلس، لأنها كانت بوابة الوسط لا مجرد مدينة. وقد بقيت في طليطلة بعد سقوطها مكتباتٌ ضخمة، وفيها من كتب الطب والفلك والمنطق ما لم يكن في أوروبا مثله، فكانت المدينة بعد سقوطها أهمّ مما كانت قبله في تاريخ العلم، وهذا من مفارقات التاريخ.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت سرقسطة قاعدة الثغر الأعلى، وكانت مملكةً قوية في عصر ملوك الطوائف، وقد سقطت في يد أراغون سنة ١١١٨م. وقد كان سقوطها بداية انحسار الإسلام في الشمال الشرقي، ثم توالى سقوط المدن بعد ذلك حتى لم يبقَ في القرن الثالث عشر إلا مملكة غرناطة في الجنوب. وقد صمدت سرقسطة في وجه أراغون سنوات، ثم سقطت سنة ١١١٨م بعد حصار طويل، وكان سقوطها فتحًا للطريق نحو الجنوب، ثم توالى سقوط بلنسية وشاطبة ولورقة في العقود التالية، حتى انحسر الإسلام إلى غرناطة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان على هذه الحدود مجتمع خاص: عرب وبربر ومستعربون ونصارى ويهود، وكانت اللغة العربية لغة الثقافة والإدارة حتى في المدن التي تحتكم إلى ملوك نصرانيين. وكان في طليطلة بعد سقوطها مدرسة للترجمة نقلت الفلسفة والعلوم العربية إلى اللاتينية، وكان هذا من أعظم آثار الأندلس على أوروبا. وقد كان هؤلاء المستعربون يُترجمون للنصارى ويُعلّمونهم العربية، وكان منهم من رحل إلى الشمال فعمل في بلاطات الملوك، وكان هذا الانتقال للناس قبل الكتب سببًا في انتقال العلوم نفسها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان لهذه الحدود أثر في تشكيل الدولة الأندلسية نفسها. فالحرب الدائمة جعلت الجيش أهم مؤسسة، وجعلت الضرائب ثقيلة، وجعلت الحكام يستعينون بالبربر والموالي أكثر من العرب. ولهذا كان تاريخ الأندلس تاريخ جبهة لا تاريخ جزيرة، وكان سقوطها في آخره سقوطًا لجبهة لا لمدينة. وقد كان هذا الأثر ظاهرًا في نظام الحكم نفسه: فالحاكم الذي يعيش على جبهة يحتاج إلى جيش دائم، والجيش الدائم يحتاج إلى مال دائم، والمال الدائم يحتاج إلى ضرائب، والضرائب تُورث السخط، فكانت الجبهة تُنتج الدولة وتُنهكها في الوقت نفسه.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eأقسام الثغور\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الثغر الأعلى أوسع الثغور وأكثرها حصونًا، لأنه كان يواجه مملكتي نافارا وأراغون وكتالونيا، وكانت سرقسطة عاصمته ثم صارت مملكة مستقلة. وأما الثغر الأوسط فكان يواجه قشتالة وليون، وكانت طليطلة عاصمته، وكان أخطر الثغور لأنه أقربها إلى قرطبة. وقد كانت سرقسطة في القرن الخامس الهجري عاصمة مملكة بني هود، وكانت فيها مكتبة عظيمة، ثم صارت بعد سقوطها مركزًا للترجمة أيضًا، وهذا يدل على أن مدن الثغور كانت مدن علم لا حصونًا فقط.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما الثغر الأدنى فكان على الساحل الشرقي، وكانت مدنه تعيش على التجارة والبحر، وكانت برشلونة أول ما سقط منه. وقد كان لكل ثغر والٍ وقائد وجيش، وكانت السلطة المركزية تراقبهم بحذر لأنهم كانوا بعيدين عنها. وقد كان كل ثغر يُدار من قبل والٍ يجمع بين القيادة العسكرية وجباية المال، وكان هذا الجمع خطرًا على المركز، لأن الوالي الذي يملك الجيش والمال يملك الاستقلال، وقد استقلّ بعضهم فعلًا في عهود الضعف.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالصوائف والهدن\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الصائفة حملةً تُرسل في الصيف، لأن الطرق تكون جافة والمحاصيل قد نضجت، فيسهل على الجيش التحرك ويصعب على الفلاحين حماية أرضهم. وكانت الصوائف تُنظَّم من قرطبة، وكانت تُعدّ سنويًّا تقريبًا في عهود القوة، ثم انقطعت في عهود الضعف. وقد كانت الصائفة تُعدّ من قرطبة بأمر الأمير، وكانت تُخرج في رجب أو شعبان، وكانت تعود قبل الشتاء، وكانت الغنائم تُقسم على الجند، ولهذا كانت الصوائف مصدر رزق للجيش لا مجرّد عمل عسكري.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما الهدن فكانت عقودًا مؤقتة تُعقد لسنوات، وكانت تُحدّد فيها الحدود والجزية وتبادل الأسرى. وقد كان في هذه العقود اعتراف متبادل بالوجود، وهذا ما يجعل العلاقة بين الطرفين علاقة دول لا علاقة عصابات، على الرغم من الحرب المستمرة. وقد كانت الهدنة تُكتب في صكّ ويُشهد عليها، وكانت تُحدّد ما يُبنى من حصون وما لا يُبنى، وكانت تُنظّم رعي الماشية وقطع الحطب، وهي تفاصيل تبدو صغيرة لكنها كانت مادة الخلاف في كل سنة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالمستعربون وطليطلة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان النصارى الذين يعيشون في الأندلس يُسمّون المستعربين، لأنهم تعلّموا العربية وتبنّوا كثيرًا من عادات العرب في اللباس والطعام والبناء. وكان منهم من بلغ مناصب عالية في الإدارة، وكانت لغتهم في الكتابة هي العربية حتى في الكنائس. وقد كان المستعربون يكتبون بالعربية الحروف اللاتينية أحيانًا، ويُسمّى ذلك الخَطّ المُستعرب، وقد بقي منه نصوص تُظهر أن العربية صارت لغة الكتابة اليومية لا لغة الدين فقط.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بقي هذا المجتمع بعد سقوط طليطلة، فصارت المدينة مركزًا للترجمة، وانتقل منها إلى أوروبا ما لم يكن يعرفه الغرب من فلسفة وطب ورياضيات. وبهذا كانت الحدود نفسها جسرًا ثقافيًّا، وهذا من أعجب ما في تاريخ الأندلس: أن الحرب والتبادل كانا في المكان نفسه. وقد كان في طليطلة بعد سقوطها فريق من العلماء المسلمين والنصارى واليهود يعملون معًا في الترجمة، وكان هذا التعاون هو الذي نقل أرسطو وابن رشد والرازي إلى اللاتينية، ومنها إلى جامعات أوروبا.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالثغور\u003c/b\u003e\u003cspan\u003eالأعلى والأوسط والأدنى\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eقواعدها\u003c/b\u003e\u003cspan\u003eسرقسطة وطليطلة وبرشلونة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالحرب\u003c/b\u003e\u003cspan\u003eالصوائف في الصيف والهدن في السلم\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالممالك الشمالية\u003c/b\u003e\u003cspan\u003eأستورياس وليون وقشتالة ونافارا وأراغون\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسقوط طليطلة\u003c/b\u003e\u003cspan\u003eسنة ١٠٨٥م، وكان صدمة كبرى\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالثغر\u003c/th\u003e\u003cth\u003eقاعدته\u003c/th\u003e\u003cth\u003eما يواجهه\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالأعلى\u003c/td\u003e\u003ctd\u003eسرقسطة\u003c/td\u003e\u003ctd\u003eنافارا وأراغون وكتالونيا\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالأوسط\u003c/td\u003e\u003ctd\u003eطليطلة\u003c/td\u003e\u003ctd\u003eقشتالة وليون\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالأدنى\u003c/td\u003e\u003ctd\u003eبرشلونة ثم طرطوشة\u003c/td\u003e\u003ctd\u003eكتالونيا والساحل الشرقي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eأرض الصلح\u003c/td\u003e\u003ctd\u003eبين الجانبين\u003c/td\u003e\u003ctd\u003eحاجز خالٍ من السكان\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمدن الحدودية\u003c/td\u003e\u003ctd\u003eمريدة وقورية وشذونة\u003c/td\u003e\u003ctd\u003eحصون ومراقبة طرق\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eوَجَعَلْنَا بَيْنَهُمْ وَبَيْنَ الْقُرَى الَّتِي بَارَكْنَا فِيهَا قُرًى ظَاهِرَةً\u003c/p\u003e\u003ccite\u003eسورة سبأ، الآية ١٨\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eكانت للأندلس حدود شمالية طويلة عاشت عليها الحرب والسلم ثمانية قرون، وقامت عليها مدنٌ وممالك ومجتمع مختلط. ولهذا كان تاريخ الأندلس تاريخ جبهة، لا تاريخ جزيرة منعزلة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-2","n":"القسم الثاني: خلافة قرطبة","ic":"","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-2\" style=\"--c:#B0304A\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🌙\u003c/div\u003e\n      \u003ch2\u003eالقسم الثاني: خلافة قرطبة\u003c/h2\u003e\n      \u003cp\u003eفي سنة ٩٢٩م أعلن أمير قرطبة نفسه خليفة، فصار في العالم الإسلامي ثلاثة خلفاء لا واحد. وفي العقود التالية بنت الأندلس مدينةً ملكية وقصرًا وحرمًا وأسطولًا ومكتبة، وبلغت قرطبة في عهدها الخلافي ما لم تبلغه مدينة أوروبية في ذلك القرن.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#abd-al-rahman-iii\"\u003eعبد الرحمن الثالث: من إمارة مأزومة إلى خلافة\u003c/a\u003e\u003ca href=\"#al-zahra\"\u003eالمدينة الزهراء: العمارة إعلانًا\u003c/a\u003e\u003ca href=\"#learning-in-cordoba\"\u003eالعلم والأدب في قرطبة\u003c/a\u003e\u003ca href=\"#al-mansur\"\u003eابن أبي عامر: الحاجب الذي حكم باسم الخليفة\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"abd-al-rahman-iii","n":"عبد الرحمن الثالث: من إمارة مأزومة إلى خلافة","ic":"👑","part":"القسم الثاني: خلافة قرطبة","h":"\u003carticle class=\"ch3\" id=\"abd-al-rahman-iii\" data-toc=\"عبد الرحمن الثالث: من إمارة مأزومة إلى خلافة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الثاني: خلافة قرطبة\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ١ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٢\u003ci\u003e.\u003c/i\u003e١\u003c/span\u003e\n            \u003ch3\u003e👑 عبد الرحمن الثالث: من إمارة مأزومة إلى خلافة\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eو\u003c/span\u003eرث عبد الرحمن الثالث سنة ٩١٢م إمارةً منقسمة على نفسها، ثائرٌ في الجنوب، وثائرٌ في الغرب، وثغورٌ تتفلّت، فقضى سبعة عشر عامًا في إعادة البلاد إلى يدها، ثم أعلن الخلافة سنة ٩٢٩م لأنه صار يملك ما يبرّر الدعوى.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eتولّى عبد الرحمن بن محمد سنة ٩١٢م وأمره في يديه لا يبلغ قرطبة، فقد كانت ثورة عمر بن حفصون في جبال الجنوب قائمةً منذ نحو ثلاثين سنة، وكانت مدينة ماردة في الغرب في يد أسرة بني مروان، وكانت الثغور تُدير نفسها، وكانت قرطبة نفسها مسرحًا لاضطراب بين العامة والجند. وقد بدأ صاحبنا بخطة بسيطة: أن يخرج بنفسه في كل سنة إلى ناحية، فبدأ بوسط البلاد ثم الشرق ثم الجنوب، وكان يقرأ في كل موضع ما يُكتب له من كتب الأمان قبل أن يقرأ في سيوفه، فعادت إليه إستجة وأرشذونة ولورة وبجانة في سنوات قليلة بلا معركة كبيرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت ثورة ابن حفصون هي العقبة الكبرى، وقد صمدت في جبل ببشتر سنوات طويلة، فلما ضاقت عليه الأرض بنى حصنًا أعلى في جبل يُقال له ببشتر ثم انتقل إليه، وكان يشنّ الغارات على قرى قرطبة نفسها، فبنى عبد الرحمن حصنًا مقابلًا اسمه حصن المنتلون وأقام فيه جندًا دائمًا يُلاحق الخارجين. وفي سنة ٩٢٨م سقطت ببشتر بعد حصار، ووُجد فيها جسد ابن حفصون وقد مات قبل ذلك، فأُخرج رأسه وحُمل إلى قرطبة، وكان ذلك إعلانًا بأن أطول ثورة في تاريخ الأندلس قد انتهت.\u003c/p\u003e\u003cp class=\"ap\"\u003eوبعد أن استقرّ الجنوب توجّه إلى الغرب، فدخل ماردة سنة ٩٢٨م بعد أن استسلم صاحبها، ثم سار إلى بطليوس فأخضع بني مروان سنة ٩٣٠م، ثم توجّه إلى الثغور فأعاد تنظيمها وبنى فيها حصونًا جديدة، وكان في كل ذلك يبني سلطةً مركزية بعد أن كانت السلطة في الأندلس اسمًا على ولايات لا تسمع. وفي هذه السنوات نفسها عبر إلى المغرب الأقصى، فدخل سبتة سنة ٩٣١م وطنجة، وتحرّك في بلاد البربر ليجد لنفسه حلفاء في وجه الفاطميين الذين كانوا قد قاموا في إفريقية سنة ٩١٠م.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سنة ٩٢٩م أعلن نفسه أمير المؤمنين، وكان في الإعلان حسابٌ سياسي دقيق: فالفاطميون في القيروان كانوا قد أعلنوا الخلافة، والعباسيون في بغداد كانوا خلفاء منذ قرنين، وكانت الأندلس ولايةً في نظر المشرق لا دولةً. فإعلان الخلافة في قرطبة كان ردًّا على الفاطميين في الغرب، واستقلالًا رمزيًّا عن بغداد في الشرق، وإعلانًا للداخل بأن الإمارة صارت دولةً كاملة الأهلية، وقد استُعمل في الإعلان لقب الناصر لدين الله، وهو لقبٌ يُشبه ألقاب الخلفاء العباسيين.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان هذا العهد أوسع عهود الأندلس في البناء، فبُني في سنة ٩٣٦م مدينة الزهراء على سفح جبل في غرب قرطبة، وجُدّد الجامع، وأُنشئت دار للسكة، ونُظّم الأسطول في المرية، ووفدت السفارات من بيزنطة ومن ألمانيا ومن فرنسا ومن إفريقية. وقد كتب الجغرافيون أن قرطبة في هذا العهد بلغت من العمران ما جعل الرحّالة يعدّونها إحدى عجائب الدنيا، وأن فيها حمّاماتٍ ومكتباتٍ وأسواقًا مبلّطة على طول نهرها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سنة ٩٣٩م خرج بنفسه في حملة إلى الشمال، فالتقى بجيش قشتالة وليون في موضع يُقال له الخندق، وكانت الهزيمة عليه هو، وقد نُقل في الروايات أنه نجا بنفسه بعد أن كاد يُقتل، وأنه بعد هذه الوقعة لم يخرج في حملة بنفسه، بل صار يبعث قوّاده ويقعد في الزهراء يُدير. وهذا التفصيل الصغير في حياة رجل يدل على شيء كبير: أن الدولة التي قامت على شخصٍ واحد تحتاج إلى مؤسسةٍ قبل أن يحتاج الشخص إلى بديل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد مات الناصر سنة ٩٦١م بعد خمسين سنة من الحكم، وترك دولةً موحّدة وجيشًا دائمًا وخزانةً مملوءة، وترك أيضًا مشكلةً لم تُحلّ: أن الجيش الذي بناه من الصقالبة والبربر والموالي كان جيشًا لا يخصّ أحدًا من أهل البلاد، فكان قويًّا في يد السلطان ضعيفًا بعد موته. وقد ظهر أثر ذلك بعد أربعين سنة فقط، حين صار هذا الجيش نفسه هو الذي يُدخل الوزراء ويُخرج الخلفاء.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eلماذا أعلن الخلافة سنة ٩٢٩م\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يكن إعلان الخلافة قرارًا عاطفيًّا من رجل أراد لقبًا أكبر، بل كان قرارًا في مواجهة خطرين في وقت واحد: خطر الفاطميين الذين كانوا يتحركون في المغرب ويرسلون الدعاة إلى الأندلس، وخطر العباسيين الذين كانوا يعدّون الأندلس ولايةً من ولاياتهم. فلقب أمير المؤمنين كان يعني أن قرطبة صارت مركزًا مستقلًّا للشرعية، وأنها لا تقبل أن يكون لها والٍ من بغداد ولا داعٍ من القيروان.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في الإعلان أيضًا حسابٌ داخلي: فالثورات التي قُمعت في الجنوب والغرب كانت ثوراتٍ قامت باسم الخلافة أحيانًا، أو باسم المهدي، وكان الناس في الأندلس يرون أن الأمير أقلّ من خليفة. فإعلان الخلافة كان يُغلق هذا الباب، ويجعل من يخرج على قرطبة خارجًا على خليفةٍ لا على أمير، وهذا فرق في الشرعية يُساوي جيشًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد استُكمل الإعلان بالعمل لا بالكلام: فصُكّت النقود باسم الخليفة، وخُطب له على المنابر بذلك اللقب، وكُتبت الرسائل إلى الملوك باسمه الجديد، ووُضعت له علامات ومظاهر تُشبه مظاهر المشرق. وبهذا صار اللقب مؤسسةً لا كلمة، وهذا هو الفرق بين دولةٍ تُعلن نفسها ودولةٍ تُبنى.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالمغرب في سياسة قرطبة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان المغرب الأقصى في هذا العهد ساحة صراع بين ثلاث قوى: الفاطميون القادمون من إفريقية، وأمويو الأندلس، وزعماء القبائل الزناتية والصنهاجية. وقد دخل عبد الرحمن الثالث في هذا الصراع لا ليفتح أرضًا بل ليُبعد الخطر عن مضيق جبل طارق، لأن من يملك سبتة وطنجة يملك باب الأندلس، ومن يملك الباب يستطيع أن يُدخل جيشًا أو يقطع تجارة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد اعتمد في ذلك على سياسة الحلفاء لا على سياسة الجيوش: فكان يُرسل المال والسلاح إلى زعماء القبائل الذين يقفون في وجه الفاطميين، وكان يقبل ولاءهم ويُثبتهم على مدنهم، وكان يُرسل الأسطول إلى السواحل ليمنع النزول. وقد كانت هذه السياسة تُكلّف خزانته مالًا كثيرًا، لكنها كانت أرخص من حربٍ في الجنوب، وأقلّ خطرًا من أسطولٍ فاطمي في المرية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ظهر أثر هذه السياسة بعد موته: فالمغرب بقي مجالًا أندلسيًّا حتى قيام المرابطين في القرن الخامس الهجري، ثم صار المجال نفسه هو الذي دخل الأندلس فأنقذها من ملوك الطوائف. وهكذا كانت سياسة عبد الرحمن الثالث في المغرب بذرةً نمت في اتجاه لم يكن يتوقّعه، وهذا شأن السياسات الطويلة: تُثمر في يد من يأتي بعد صاحبها.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالجيش والصقالبة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الجيش في عهد الخلافة جيشًا نظاميًّا يُدفع له راتب من الخزانة، وكانت أعداده تُقدّر بمئات الآلاف في روايات المؤرخين، وهي أعداد يُبالغ فيها عادةً، لكن الثابت أن الدولة صارت تُنفق على جيش دائم لا على قبائل تُستنفر عند الحاجة. وقد كان في هذا الجيش عناصر من البربر ومن العرب ومن الموالي، وكان فيه من أسرى الحرب ومن المشترين من أسواق أوروبا الشرقية، وكان هؤلاء يُسمّون الصقالبة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد صار الصقالبة طبقةً عسكرية وإدارية في الدولة، وكان منهم القادة والحجّاب وحرّاس القصر، وكان ولاؤهم للخليفة شخصيًّا لا لقبيلة ولا لأرض، وهذا هو سرّ قوّتهم وسرّ خطرهم في الوقت نفسه. فالجيش الذي لا يخصّ أحدًا يطيع من يدفع له، فإذا ضعفت الخزانة أو مات الذي يدفع، صار هذا الجيش قوةً مستقلة تُدير الدولة بنفسها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ظهر هذا في القرن الرابع الهجري ظهورًا صريحًا، حين صار الحاجب ابن أبي عامر هو الحاكم الفعلي، وحين صار الصقالبة هم الذين يُنصّبون الخلفاء ويُخلعون. ولهذا يُقال إن خلافة قرطبة لم تسقط بغزوٍ خارجي، بل سقطت لأن جيشها كان أقوى من مؤسساتها، وهذا درسٌ في تاريخ الدول لا في تاريخ الأندلس وحدها.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالحكم\u003c/b\u003e\u003cspan\u003e٩١٢م أميرًا، ثم خليفةً سنة ٩٢٩م\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eاللقب\u003c/b\u003e\u003cspan\u003eالناصر لدين الله\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسقوط ببشتر\u003c/b\u003e\u003cspan\u003eسنة ٩٢٨م ونهاية ثورة ابن حفصون\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالوقعة\u003c/b\u003e\u003cspan\u003eالخندق سنة ٩٣٩م ثم ترك القيادة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالوفاة\u003c/b\u003e\u003cspan\u003eسنة ٩٦١م بعد خمسين سنة من الحكم\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e٩١٢م\u003c/td\u003e\u003ctd\u003eتولّي الإمارة\u003c/td\u003e\u003ctd\u003eبلادٌ منقسمة وثلاث ثورات\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٩٢٨م\u003c/td\u003e\u003ctd\u003eسقوط ببشتر وماردة\u003c/td\u003e\u003ctd\u003eإخضاع الجنوب والغرب\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٩٢٩م\u003c/td\u003e\u003ctd\u003eإعلان الخلافة\u003c/td\u003e\u003ctd\u003eقرطبة مركز شرعية مستقل\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٩٣١م\u003c/td\u003e\u003ctd\u003eدخول سبتة وطنجة\u003c/td\u003e\u003ctd\u003eتأمين باب المضيق\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٩٣٦م\u003c/td\u003e\u003ctd\u003eبدء بناء الزهراء\u003c/td\u003e\u003ctd\u003eعاصمة ملكية جديدة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٩٣٩م\u003c/td\u003e\u003ctd\u003eوقعة الخندق\u003c/td\u003e\u003ctd\u003eترك الخليفة قيادة الحملات\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eقُلِ اللَّهُمَّ مَالِكَ الْمُلْكِ تُؤْتِي الْمُلْكَ مَن تَشَاءُ وَتَنزِعُ الْمُلْكَ مِمَّن تَشَاءُ\u003c/p\u003e\u003ccite\u003eسورة آل عمران، الآية ٢٦\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eأعاد عبد الرحمن الثالث بلادًا منقسمة إلى دولة موحّدة في سبعة عشر عامًا، ثم أعلن الخلافة لأن القوة صارت في يده لا لأن اللقب أعجبه. وقد ترك دولةً قوية بجيشٍ دائم، لكنه ترك أيضًا جيشًا أقوى من مؤسسات دولته، وهذا ما سيظهر بعد أربعين سنة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"al-zahra","n":"المدينة الزهراء: العمارة إعلانًا","ic":"🏛️","part":"القسم الثاني: خلافة قرطبة","h":"\u003carticle class=\"ch3\" id=\"al-zahra\" data-toc=\"المدينة الزهراء: العمارة إعلانًا\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الثاني: خلافة قرطبة\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٢ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٢\u003ci\u003e.\u003c/i\u003e٢\u003c/span\u003e\n            \u003ch3\u003e🏛️ المدينة الزهراء: العمارة إعلانًا\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eع\u003c/span\u003eلى سفح جبل في غرب قرطبة بُنيت مدينةٌ كاملة في ثلاثين سنة، ليس فيها سوقٌ للعامة ولا حصنٌ للجيش، بل قصورٌ وحدائق وقاعةُ عرشٍ تُستقبل فيها السفارات. كانت الزهراء بيانًا سياسيًّا مكتوبًا بالحجر.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eبدأ بناء المدينة الزهراء سنة ٩٣٦م في موضع يبعد نحو خمسة كيلومترات غرب قرطبة، على سفح جبل يُشرف على النهر، وقد سُمّيت باسم زوجة الخليفة أو باسم إحدى بناته في روايات مختلفة، والأرجح أنها سُمّيت باسمٍ من أسماء النساء في بيته. وقد استمرّ البناء ثلاثين سنة، وكان يعمل فيه في بعض السنوات عشرة آلاف رجل، وكان يُجلب لها الرخام من قرطاج ومن بلاد الروم، وتُجلب الأعمدة من معابد قديمة في أنحاء الأندلس وإفريقية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت المدينة تُبنى على مدرّجات، فيبدأ الزائر من الأسفل فيمرّ على الحدائق والأحواض ثم يصعد إلى القصور، وكان في أعلاها قاعةٌ للعرش تُسمّى قاعة الخلافة، وكانت تُستقبل فيها السفارات الأجنبية، وقد وُصف فيها ما يُشبه الصحن الكبير الذي تُعرض فيه القوّة قبل الكلام. وكان في المدينة مسجدٌ وحمّامات ودورٌ للجند ودوائر للإدارة ودورٌ لسكّانها، وكانت مدينةً كاملة لا قصرًا منفردًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت الزهراء تُؤدّي وظيفة سياسية دقيقة: فقرطبة كانت مدينةً قديمة ذات أسواق وأحياء وقبائل لا يضبطها الخليفة كما يريد، وكان يحتاج إلى مكانٍ يبتعد فيه عن ضغط المدينة وعن أعين أهلها، ويستقبل فيه من يفد عليه استقبالًا يُشبه استقبال بغداد. وفي هذا معنى مهم: العمارة في الدولة الإسلامية لم تكن زينة، بل كانت لغةً تُخاطب الداخل والخارج في وقتٍ لم تكن فيه صحف ولا إذاعات.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان الماء هو محور التصميم، فقد جُلب إلى المدينة بقنوات من الجبل، وكانت الحدائق تُروى ببِرَك وأحواض، وكان في القاعات أحواضٌ من الزئبق في روايات المؤرخين، وكان في بعض القاعات نوافذٌ تُطلّ على الحدائق لتُدخل الضوء والهواء. وقد كان هذا التخطيط يُشبه تخطيط المدن الملكية في الشرق، لكنه كان أوسع مساحةً وأكثر انفتاحًا على الطبيعة، وهذا ما يُعطي العمارة الأندلسية شخصيتها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد وصفت المصادر وفودًا عجيبة على المدينة: سفارةٌ من الإمبراطور البيزنطي، وسفارةٌ من الإمبراطور الألماني أوتو الأول سنة ٩٥٣م، وكان في الأولى هدايا وكتب، وكان في الثانية رجلٌ يُسمّى يوحنا الغوري، وقد ذكر أخبار السفارة بالتفصيل، وفيها ما يدل على أن المدينة كانت تُستعمل استعمالًا دعائيًّا: أن يُرى من الداخل ما يُقنعه، وأن يُرى من الخارج ما يُرهبه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت نهاية المدينة سريعةً كبدايتها، فقد سقطت الخلافة سنة ١٠٠٩م وما بعدها، وفي سنوات الفتنة دخلها البربر فخرّبوها، ثم تُركت فصارت أطلالًا، ولم يبقَ منها اليوم إلا أجزاء من القصور والأسوار والأساسات، وهي اليوم متحف. وهذا مصير مدن البلاط في التاريخ: تُبنى لتُرى، فإذا ذهب من تُبنى له ذهبت معه، بخلاف المدن التي تُبنى للتجارة فإنها تعيش بعد الدول.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بقي أثر الزهراء في العمارة الأندلسية بعدها، فالعقود المزدوجة والزخارف النباتية والفتحات المقوّسة كلها صارت لغةً مشتركة في مساجد الأندلس وقصورها، ثم انتقلت مع المهاجرين إلى المغرب، ثم ظهرت في قصر الحمراء بعد ثلاثة قرون. وبهذا صارت المدينة التي لم تبقَ أكثر من ثلاثين سنة أثرًا في ثلاث قارات، وهذا أطول عمرٍ نالته مدينةٌ ملكية في الغرب الإسلامي.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالعمارة كخطاب سياسي\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت قاعة العرش في الزهراء تُخطّط بحيث يدخل الزائر في مسارٍ طويل يمرّ فيه على الحدائق والأحواض والحرّاس، فيصل إلى القاعة وقد امتلأ قلبه بما رأى قبل أن يسمع كلمةً واحدة. وكان الخليفة يجلس في موضعٍ يُرى فيه ولا يُرى منه، وهذا ترتيبٌ معماري يُنتج هيبةً بالمسافة لا بالصوت، وهو ما يفعله كل بلاط في التاريخ بطرق مختلفة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في المدينة أيضًا ما يُشبه الأحياء الإدارية: دوائر للكتابة وللخراج وللجيش، وكانت هذه الدوائر تُنظّم العمل اليومي للدولة. ولهذا كانت الزهراء مدينةً كاملة لا متحفًا: فيها من يعمل ومن يسكن ومن يكتب ومن يحرس، وهذا هو الفرق بين قصرٍ ومدينة، وهو فرقٌ يُدركه من يزور الأطلال فيرى أحجام الأساسات لا القاعات وحدها.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالماء والحدائق\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الماء في الأندلس مادةً للسياسة قبل أن يكون مادةً للجمال، فمن يملك الماء يملك الأرض الزراعية، ومن يُوصل الماء إلى مدينةٍ يملك سكّانها. وقد بُنيت الزهراء على نهر يُروى منه، وعلى قنوات تُجلب من الجبل، وكان في المدينة نظامٌ لتوزيع الماء على الحدائق والحمّامات والنافورات، وهذا يحتاج إلى هندسةٍ وإدارة لا إلى ثروة وحدها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد انتقل هذا التقليد إلى مدن الأندلس كلها، فصارت الحمّامات والأحواض والبِرَك علامةً على المدينة الإسلامية في الغرب، ثم انتقلت مع المهاجرين إلى فاس ومراكش وتلمسان. ولهذا يُقال إن أعظم ما صدّرته الأندلس إلى المغرب لم يكن الكتب ولا الفلسفة، بل نظام الماء والحمّام والبستان، وهذا إرثٌ لا يُذكر في كتب التاريخ السياسي عادة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالخراب والذاكرة\u003c/h4\u003e\u003cp class=\"ap\"\u003eفي سنة ١٠١٠م دخل البربر المدينة في أثناء الفتنة فنهبوها وخرّبوها، وكان الخراب سياسيًّا لا عسكريًّا: فقد أرادوا أن يُدمروا رمز الدولة الأموية لا أن يحتلّوا موقعًا. وقد بقي بعد ذلك ما بقي من الجدران، ثم صارت الأرض زراعية، ثم صارت في القرن العشرين موقعًا أثريًّا يُحفر فيه ويُرمّم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد صار اسم الزهراء في الشعر الأندلسي رمزًا للدولة التي ذهبت، وكُتبت فيها قصائد الرثاء بعد سقوط الخلافة، وفيها يُبكي الشعراء على القصور لا على الملوك. وهذا تحوّل في الوعي: أن يتحوّل البناء إلى ذكرى، وأن تصير المدينة نفسها نصًّا يُقرأ، وهذا ما يجعل العمارة جزءًا من التاريخ الثقافي لا من التاريخ الفني فقط.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eبدء البناء\u003c/b\u003e\u003cspan\u003eسنة ٩٣٦م، واستمرّ ثلاثين سنة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالموقع\u003c/b\u003e\u003cspan\u003eخمسة كيلومترات غرب قرطبة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالعناصر\u003c/b\u003e\u003cspan\u003eقصور وحدائق ومسجد وحمّامات\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالسفارات\u003c/b\u003e\u003cspan\u003eبيزنطة وألمانيا وفرنسا وإفريقية\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالخراب\u003c/b\u003e\u003cspan\u003eسنة ١٠١٠م في الفتنة\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالعنصر\u003c/th\u003e\u003cth\u003eوظيفته\u003c/th\u003e\u003cth\u003eما بقي منه\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eقاعة العرش\u003c/td\u003e\u003ctd\u003eاستقبال السفارات وإعلان الهيبة\u003c/td\u003e\u003ctd\u003eأساسات وزخارف وأقواس\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالحدائق والأحواض\u003c/td\u003e\u003ctd\u003eإظهار السيطرة على الماء\u003c/td\u003e\u003ctd\u003eبِرَك وقنوات\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمسجد\u003c/td\u003e\u003ctd\u003eصلاة البلاط والجند\u003c/td\u003e\u003ctd\u003eصحن وأساسات\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eدواوير الإدارة\u003c/td\u003e\u003ctd\u003eالكتابة والخراج والجيش\u003c/td\u003e\u003ctd\u003eجدران وأرضيات\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالأسوار والأبراج\u003c/td\u003e\u003ctd\u003eالحراسة والفصل عن المدينة\u003c/td\u003e\u003ctd\u003eأجزاء من السور\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eوَتِلْكَ الْقُرَىٰ أَهْلَكْنَاهُمْ لَمَّا ظَلَمُوا وَجَعَلْنَا لِمَهْلِكِهِم مَّوْعِدًا\u003c/p\u003e\u003ccite\u003eسورة الكهف، الآية ٥٩\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eبُنيت الزهراء لتُرى لا لتُسكن فقط، وكانت العمارة فيها خطابًا سياسيًّا يُخاطب السفارات والرعية معًا. وقد ذهبت في الفتنة كما ذهبت الدولة التي بَنَتها، وبقي من أثرها لغةٌ معمارية عاشت في الأندلس والمغرب قرونًا.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"learning-in-cordoba","n":"العلم والأدب في قرطبة","ic":"📚","part":"القسم الثاني: خلافة قرطبة","h":"\u003carticle class=\"ch3\" id=\"learning-in-cordoba\" data-toc=\"العلم والأدب في قرطبة\"\u003
