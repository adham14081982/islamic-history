le=\"--c:#8B1A3A\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🕊️\u003c/div\u003e\n      \u003ch2\u003eأبو بكر الصديق (١١–١٣هـ)\u003c/h2\u003e\n      \u003cp\u003eسنتان وثلاثة أشهر فقط جلسها أبو بكر على كرسي الخلافة، لكنها كانت كافية لإنقاذ الأمة من ارتداد يعصف بها، وفتح الطريق أمام أكبر حركة فتح في التاريخ. هذا القسم يتتبع الرجل من نسبه وصفاته، إلى إيمانه وتضحيته، إلى بيعته وبيانه، ثم جيش أسامة وقضاء المرتدين وجمع القرآن، وينتهي بفتوح الفرس والروم ووفاته وهو يستخلف عمر.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#abubakr-nasab\"\u003eالنسب والصفات والمكانة\u003c/a\u003e\u003ca href=\"#abubakr-iman\"\u003eالإيمان والتضحية وفضل الرسول\u003c/a\u003e\u003ca href=\"#abubakr-bayaa\"\u003eالبيعة وبيان الخلافة\u003c/a\u003e\u003ca href=\"#abubakr-usama-ridda\"\u003eجيش أسامة وقضاء المرتدين\u003c/a\u003e\u003ca href=\"#abubakr-quran\"\u003eجمع القرآن الكريم\u003c/a\u003e\u003ca href=\"#abubakr-futuh\"\u003eالفتوحات: جبهة الفرس وجبهة الروم\u003c/a\u003e\u003ca href=\"#abubakr-wafat\"\u003eالمرض والوفاة واستخلاف عمر\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"abubakr-nasab","n":"النسب والصفات والمكانة","ic":"🌿","part":"أبو بكر الصديق (١١–١٣هـ)","h":"\u003carticle class=\"ch3\" id=\"abubakr-nasab\" data-toc=\"النسب والصفات والمكانة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e١.١\u003c/span\u003e\n          \u003ch3\u003e🌿 النسب والصفات والمكانة\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eم\u003c/span\u003eن هو الرجل الذي شهد له النبي ﷺ بأنه أصدق الناس لهجة، وكيف صنعته مكة قبل الإسلام؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eهو عبد الله بن عثمان بن عامر بن عمرو بن كعب بن سعد بن تيم بن مرة بن كعب بن لؤي، وأبو قحافة كنية أبيه عثمان بن عامر، وأمه أم الخير سلمى بنت صخر بن عامر بن عمرو بن كعب بن سعد بن تيم، فهو قرشي تيمي، يلتقي مع النبي ﷺ في مرة بن كعب، ويجتمع معه في الجدّ السادس. نشأ في بيت شرف وثراء، وكان من أعيان مكة وأهل الرأي والمشورة فيها قبل البعثة، يعرف أنساب العرب وأخبارها وأيامها، ويحفظ من الشعر ما يجعله مرجعًا لقومه في المنازعات والخصومات.\u003c/p\u003e\u003cp class=\"ap\"\u003eولُقّب بالصدّيق لأنه أسرع الناس إلى تصديق رسول الله ﷺ، وأول من آمن به من غير أهل بيته، فلم ينتظر آية ولا معجزة، بل كفاه خلق النبي ﷺ ودعوته. ويروي ابن سعد عن أبي هريرة أن النبي ﷺ قال: «أتاني جبريل فقال: إني أُرسلت إلى قومك، قلت: إن قومي لا يصدقوني، قال: يصدقك أبو بكر وهو الصديق». ويروي هشام بن الحسن البصري أن أبا بكر قال حين وصف له النبي ﷺ بيت المقدس في ليلة الإسراء: «صدقت»، فسُمّي الصديق من يومئذ، وفي هذا الخبر دلالة على أن اللقب لصق به من كثرة تصديقه، لا من حادثة واحدة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما العتيق فمعناه الجميل في الجود والخير، وقيل بل هو لقب لقّبه به النبي ﷺ؛ روى ابن سعد أن عائشة رضي الله عنها سألت: يا رسول الله، لم سُمّي أبو بكر عتيقًا؟ فقال: «هذا عتيق الله من النار». وأما الأوّاه فهو كثير التأوه والترحم، وقد فسّره أهل التفسير بالرحيم الرقيق القلب، وكان أبو بكر رفيقًا بأصحابه، رحيمًا بهم، يقضي حوائجهم ويخفف عنهم، فكأنه اقتبس هذا الخلق من نبيه ﷺ، فصار رحمة لمن حوله في بيته وفي السوق وفي ساعة الحرب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوصفَته ابنته عائشة رضي الله عنها فقالت: رجل أبيض، خفيف، خفيف العارضين، أجنأ لا يستمسك إزاره لشدة نحافته، معروق الوجه، قليل لحم الوجه، غائر العينين، ناتئ الجبهة، عاري الأشاجع. وهذه الصورة تدل على جسم نحيف خفيف الحركة، لا على قوة البنية وضخامة الخلق، ومع ذلك كان أشد الناس احتمالًا وأثبتهم قلبًا في المواقف الحرجة، فالقوة عنده كانت في النفس لا في الجسد، وفي اليقين لا في العضلات.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما صفاته الخُلقية فكان صدّيقًا أوّاهًا، شديد الحياء، كثير الورع، حازمًا مع رحمة، تاجرًا يحفظ شرفه وكرامته، غنيًا بماله عن أموال الناس. ولم يؤثر عنه شرب الخمر في جاهلية ولا إسلام، ولا سجود لصنم، ولا كذب في جد ولا هزل، حتى قال أهل السير: إنه لم يعبد صنمًا قط ولم يشرب خمرًا قط. وكان صديقًا حميمًا للنبي ﷺ قبل البعثة، فقد كانت الصحبة بينهما تقاربًا في المظهر والمسلك، وسلامةً في الفطرة، وبُعدًا في النظر، ورجاحةً في العقل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في قومه محبوبًا موثوقًا، أنسب قريش لقريش وأعلمها بأنسابها وأخبارها، حليمًا كريم النفس، يجود بماله ووقته، فنال حب الناس وتقديرهم، وكانوا يأتونه في مهماتهم ويستشيرونه في أمورهم، ويستودعونه أموالهم ومصالحهم. وقد كانت إليه في الجاهلية الأشناك، وهي الديّات التي تحملها العشيرة عن القاتل، فكان يقرب بذلك من العشيرة ويحمل عن الناس أعباءهم، فإذا سأل في دية قومه أمضوا حمالته ومدحوه، وإن حملها غيره لم يصدّقوه.\u003c/p\u003e\u003cp class=\"ap\"\u003eفكان سيدًا في الجاهلية وسيدًا في الإسلام، وشريفًا في الجاهلية وشريفًا في الإسلام، لم تغيّر الإسلامَ سطوته ولا أفسدته الجاهليةُ ببقاياها. وهذا المعنى هو ما جعل النبي ﷺ يقدّمه على غيره في مواطن كثيرة، ويقول فيه ما لم يقله في أحد من أصحابه، فقد جمع بين شرف النسب وشرف النفس، وبين علم الدنيا وعلم الدين، فاجتمعت له في قومه المكانة الرفيعة والثقة الكاملة، وكان أهل مكة يسمونه قبل الإسلام أميرَ قريش.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eبيته ونشأته في مكة\u003c/h4\u003e\u003cp class=\"ap\"\u003eنشأ أبو بكر في بني تيم، وهم حيّ من قريش لهم مكانة في التجارة والرأي، وكان بيت أبيه من بيوت اليسار، فتعلم التجارة صغيرًا، وخرج إلى أسواق العرب في الموسم، واتصل بأشراف القبائل وتجار الشام واليمن، فربح مالًا كثيرًا حتى بلغت تجارته ما جعله من أغنياء مكة. ولم يُلهه المال عن مروءة ولا عن حق، بل كان يعين الضعيف ويصل الرحم ويحمل عن العشيرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eولم يكن في شبابه من أهل اللهو والعبث، بل كان من أهل الحفظ والرواية، يعرف الأنساب والأخبار، ويجلس إلى أهل العلم بالكتب القديمة، فكان أقربَ قريش إلى معرفة ما جاءت به الرسل. فلما بُعث النبي ﷺ وجد في نفسه أرضًا خصبة، فلم يحتج إلى طول نظر ولا إلى جدال، لأن ما سمعه وافق ما كان يعرفه من أخبار الأنبياء وصفاتهم، ولأن قلبه كان سليمًا من الشرك لم يتدنس بعبادة حجر.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eألقابه ودلالتها\u003c/h4\u003e\u003cp class=\"ap\"\u003eاجتمع لأبي بكر ثلاثة ألقاب، كل واحد منها يصف جانبًا من شخصه: الصدّيق يصف صدق خبره ويقينه، والعتيق يصف عتقه من النار وكرامته عند ربه، والأوّاه يصف رقته ورحمته. وهذه الألقاب لم تكن ألقاب شهرة في السوق، بل كانت شهادات من النبي ﷺ وأصحابه على خلق راسخ في الرجل، فصارت أعلامًا تُعرف بها شخصيته قبل اسمه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد تنازع أهل السير في سبب تسميته بالصدّيق: فمنهم من قال لأنه صدّق النبي ﷺ في الإسراء حين كذّبه الناس، ومنهم من قال لأنه لم يكذب قط، ومنهم من قال لأن النبي ﷺ لقّبه بذلك. والأقوال لا تتعارض، فكلها ترجع إلى معنى واحد: رجل لا يفارق الصدق قولًا وعملًا، ولا يتقدمه أحد في تصديق رسول الله ﷺ، حتى صار الصدق وصفًا لازمًا له لا يفارقه في حال.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eبين الجاهلية والإسلام\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يكن إسلام أبي بكر انقطاعًا عن ماضيه، بل كان تتويجًا له؛ فقد كان في الجاهلية على شمائل أهل الإسلام من العفة والصدق والجود، فما إن دعاه النبي ﷺ حتى أسلم في الحال، ولم يسأل عن دليل ولا طلب معجزة، لأن قلبه كان مهيأ للإيمان، وقد قال فيه النبي ﷺ: «ما دعوت أحدًا إلى الإسلام إلا كانت عنده كبوة ونظر وتردد، إلا ما كان من أبي بكر».\u003c/p\u003e\u003cp class=\"ap\"\u003eومكانته في قريش هي التي جعلت إسلامه ذا أثر عظيم؛ فقد أسلم على يديه خمسة من العشرة المبشرين بالجنة: عثمان بن عفان، والزبير بن العوام، وعبد الرحمن بن عوف، وسعد بن أبي وقاص، وطلحة بن عبيد الله، فكان أول من دعا إلى الإسلام بعد النبي ﷺ، وأول من جمع الناس على الإيمان في مكة، وأول من بنى مسجدًا يُذكر فيه اسم الله.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالنسب\u003c/b\u003e\u003cspan\u003eقرشي تيمي، يجتمع مع النبي ﷺ في مرة بن كعب\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eاللقب الأشهر\u003c/b\u003e\u003cspan\u003eالصدّيق، لتصديقه النبي ﷺ قبل الناس\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأول من أسلم\u003c/b\u003e\u003cspan\u003eمن الرجال الأحرار البالغين\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأثر إسلامه\u003c/b\u003e\u003cspan\u003eأسلم على يديه خمسة من العشرة المبشرين بالجنة\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eألقاب أبي بكر ومعانيها\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eاللقب\u003c/th\u003e\u003cth\u003eمعناه\u003c/th\u003e\u003cth\u003eسبب التلقيب\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالصدّيق\u003c/td\u003e\u003ctd\u003eكثير التصديق\u003c/td\u003e\u003ctd\u003eأسرع الناس إلى تصديق النبي ﷺ في كل ما جاء به\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالعتيق\u003c/td\u003e\u003ctd\u003eالجميل في الجود والخير\u003c/td\u003e\u003ctd\u003eقال له النبي ﷺ: هذا عتيق الله من النار\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالأوّاه\u003c/td\u003e\u003ctd\u003eالرحيم الرقيق القلب\u003c/td\u003e\u003ctd\u003eكان رفيقًا بأصحابه يقضي حوائجهم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eأبو بكر\u003c/td\u003e\u003ctd\u003eكنية غلبت عليه\u003c/td\u003e\u003ctd\u003eكنية ابنه بكر بن أبي بكر\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eما دعوت أحدًا إلى الإسلام إلا كانت عنده كبوة ونظر وتردد، إلا ما كان من أبي بكر بن أبي قحافة، ما أحجم عن شيء ذكرته له وما تردد فيه\u003c/p\u003e\u003ccite\u003eابن هشام، السيرة النبوية ١/٢٣١، عن القضاة ص١٤\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eجمع أبو بكر بين شرف النسب وشرف النفس، فكان سيدًا في الجاهلية وسيدًا في الإسلام. وألقابه الثلاثة شهادات على صدق ويقين ورحمة لم تكن عنده ادعاءً بل خلقًا راسخًا.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"abubakr-iman","n":"الإيمان والتضحية وفضل الرسول","ic":"🤍","part":"أبو بكر الصديق (١١–١٣هـ)","h":"\u003carticle class=\"ch3\" id=\"abubakr-iman\" data-toc=\"الإيمان والتضحية وفضل الرسول\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e١.٢\u003c/span\u003e\n          \u003ch3\u003e🤍 الإيمان والتضحية وفضل الرسول\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eم\u003c/span\u003eا الذي جعل النبي ﷺ يقول إن أبا بكر أمنّ الناس عليه في صحبته وماله؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان أبو بكر أشجع الصحابة قلبًا وأكملهم إيمانًا، شهد له القرآن في مواضع كثيرة، منها قوله تعالى: «فأما من أعطى واتقى وصدّق بالحسنى فسنيسره لليسرى»، وقوله: «وسيجنبها الأتقى الذي يؤتي ماله يتزكى وما لأحد عنده من نعمة تجزى إلا ابتغاء وجه ربه الأعلى ولسوف يرضى». وقال تعالى فيه وفي النبي ﷺ: «ثاني اثنين إذ هما في الغار إذ يقول لصاحبه لا تحزن إن الله معنا»، وهي أعلى شهادة نزلت في صحابي، وقد قرأها العلماء على أنها تنصيص على فضله وثباته في أحرج ساعة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوظهر يقينه في حادثة الإسراء والمعراج أظهر ما يكون؛ فقد جاء مشركو مكة إلى أبي بكر يقولون: أتنظر ما يقول صاحبك؟ يزعم أنه جاء هذه الليلة بيت المقدس ورجع إلى مكة، فقال: «والله لئن كان قال ذلك لقد صدق»، قالوا: وتصدقه في هذا؟ قال: «إني أخبرني أنه يأتيه الخبر من السماء إلى الأرض في ساعة من ليل أو نهار فأصدقه». فمن هنا لُقّب بالصدّيق، لأن تصديقه لم يكن على قدر العقل والحساب، بل على قدر اليقين، فما تردد لحظة واحدة في خبر لا يشهد له الحس.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي بدر ظهر إيمانه في أحرج ساعة؛ فقد وقف النبي ﷺ يدعو ربه ويُلحّ في الدعاء حتى سقط الرداء عن كتفيه وهو يقول: «اللهم إن تهلك هذه العصابة فلن تُعبد بعدُ في الأرض، اللهم أنجز لي ما وعدتني»، فأتاه أبو بكر فرفع الرداء عن كتفيه وقال: «يا رسول الله، إن الله منجز لك ما وعد، والله لن يخزيك الله أبدًا». فكان إيمانه في تلك اللحظة سندًا للنبي ﷺ نفسه، وليس سندًا لنفسه فقط، وفي هذا أدب عظيم في مواجهة الخطر: تثبيت القائد لا زيادة الهمّ عليه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي يوم الحديبية ظهر الفرق بين من ينظر إلى ظاهر الأمر ومن ينظر إلى حقيقته؛ فقد رأى عمر أن المسلمين على حق وأن المشركين منعوهم، فذهب إلى أبي بكر يجادله، فقال له أبو بكر: «الزم أمره فإنه رسول الله ولن يضيعه الله أبدًا». ولم يكن ذلك توقفًا عن السؤال، بل كان تسليمًا لعلم النبوة، وهو التسليم الذي جعل أبا بكر يرى في الصلح فتحًا قبل أن يراه الناس، فكان من ثمار هذا اليقين أن جاء الفتح الأعظم بعد سنتين.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأعظم مواقفه يوم وفاة النبي ﷺ، حين اضطربت النفوس وزلزلت القلوب، فخرج على الناس وقال: «أيها الناس، من كان يعبد محمدًا فإن محمدًا قد مات، ومن كان يعبد الله فإن الله حي لا يموت»، ثم تلا: «وما محمد إلا رسول قد خلت من قبله الرسل أفإن مات أو قُتل انقلبتم على أعقابكم». قال عمر: ما سمعت أبا بكر تلاها حتى وقعت إلى الأرض ما تحملني رجلاي. فكان ثباته سدًّا أمام ارتداد كان يمكن أن يجرف الأمة كلها في ساعتها الأولى.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما تضحيته بنفسه فبدأت في مكة قبل الهجرة؛ فقد حاولت قريش الاعتداء على النبي ﷺ يومًا، فقام أبو بكر يدفع عنهم ويقول: «أَتَقْتُلون رجلًا أن يقول ربي الله»، فتحاملوا عليه وضربوه حتى أُغمي عليه، فلما أفاق قال: «ما فعل رسول الله؟» قالوا: خير، فقال: «والله لا أذوق طعامًا ولا شرابًا حتى أرى رسول الله»، فلم تهدأ نفسه حتى اطمأن على النبي ﷺ. وفي الهجرة بلغت التضحية حدًّا لا يُتصور؛ فقريش تبحث عنهما وجعلت جائزة عظيمة لمن يأتي بهما، فعرض أبو بكر نفسه للقتل والهلاك رجاء أن يفوز بصحبة النبي ﷺ، ولما أراد النبي ﷺ دخول غار ثور دخل أبو بكر قبله يفتش الغار مخافة أن تكون فيه دابة تؤذيه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما ماله فكان كله في خدمة الدعوة؛ اشترى سبع رقاب فأعتقهم، فقال أبوه: يا بني إني أراك تعتق رقابًا ضعافًا، فلو أنك أعتقت رجالًا أشداء يساعدونك، فقال: «يا أبت إني أريد وجه الله عز وجل». ثم جاء يوم الهجرة فأخذ معه ماله كله، وحين ندب النبي ﷺ للتبرع لجيش العسرة في تبوك جاء بماله كله، فقال له النبي ﷺ: «ما أبقيت لأهلك؟» قال: «أبقيت لهم الله ورسوله». وقال النبي ﷺ: «ما نفعني مال ما نفعني مال أبي بكر»، وقال: «إن أمنّ الناس عليّ في صحبته وماله أبو بكر». وقد أسلم وله أربعون ألف درهم، فأنفقها كلها في سبيل الله، وحين ولي الخلافة جعل ما بيده في بيت مال المسلمين.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eتضحيته بنفسه\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم تكن تضحية أبي بكر كلامًا في مجلس، بل مواقف حقيقية عرض فيها نفسه للضرب والتشريد والقتل؛ في مكة كان درعه بجسده دون النبي ﷺ، وفي الهجرة كان أمامه في الغار ينظر ما فيه، وفي كل موطن كان يقدّم النبي ﷺ على نفسه وأهله وولده، فما سُئل عن نفسه في لحظة خطر إلا سأل عن النبي ﷺ أولًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوهذه التضحية لم تكن حماسة عابرة تُطفئها الشدة، بل كانت خلقًا ثابتًا لازمه إلى آخر عمره؛ ففي الخلافة كان يجاهد بنفسه وماله، ويركب في الحر والبرد، ويقف في الصف الأول، ويقول: «وما لي لا أُغبّر قدميّ في سبيل الله» يوم مشى في وداع جيش أسامة وهو خليفة المسلمين.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eتضحيته بماله\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان أبو بكر من أغنياء قريش، فأنفق ماله في تحرير المستضعفين من الرقيق الذين كانوا يُعذَّبون في مكة، وفي تجهيز الجيوش، وفي سدّ حاجة الفقراء، حتى لم يبقَ في يده شيء يُذكر. ولم يكن يرى في المال إلا وسيلة لخدمة الدين، لا زينة ولا سلطانًا، فما جمعه للتجارة أنفقه للدعوة.\u003c/p\u003e\u003cp class=\"ap\"\u003eولما ولي الخلافة كان له عيشه من التجارة، فلما رآه عمر يحمل ثيابه إلى السوق قال له: إنك وليت أمر المسلمين فيُفرض لك في أموالهم ما يكفيك. ففرضوا له كفايته، وقال: «إني كنت أحترف لعيالي فأكتسب قوتهم، وأنا الآن أحترفت لله». ومات وما ترك دينارًا ولا درهمًا، كما قالت عائشة رضي الله عنها، فكان غناه في قلبه لا في صندوقه.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eإشارات النبي إلى تفضيله\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يعيّن النبي ﷺ خليفة بعده، لأن طبيعة الدعوة وتطبيق مبدأ الشورى يقتضيان أن يختار المسلمون أمرهم، ولكن ذلك لا يعني ترك الأمر دون هداية؛ فقد قدّم النبي ﷺ أبا بكر في مواطن فهم منها الصحابة تقديمه على غيره. من ذلك أمره له بالصلاة بالناس في مرضه: «مروا أبا بكر فليصل بالناس»، وقد قالت عائشة: إن أبا بكر إذا قام مقامك لم يُسمع الناس من البكاء، فقال: «إنكن لأنتن صواحب يوسف، مروا أبا بكر فليصل بالناس».\u003c/p\u003e\u003cp class=\"ap\"\u003eومنها أمره بإغلاق الأبواب الشارعة إلى المسجد إلا باب أبي بكر، فقال: «انظروا هذه الأبواب اللافطة في المسجد فسدّوها، إلا بيت أبي بكر، فإني لا أعلم أحدًا كان أفضل في الصحبة عندي يدًا منه». ومنها قوله في الخطبة: «إن عبدًا من عباد الله خيّره الله بين الدنيا وبين ما عنده، فاختار ما عنده»، فبكى أبو بكر، فقال: «لو كنت متخذًا من العباد خليلًا لاتخذت أبا بكر خليلًا، ولكن صحبة وإخاء إيمان حتى يجمع الله بيننا عنده».\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eشهادة القرآن\u003c/b\u003e\u003cspan\u003eثاني اثنين إذ هما في الغار\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eيوم الوفاة\u003c/b\u003e\u003cspan\u003eمن كان يعبد محمدًا فإن محمدًا قد مات\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eماله\u003c/b\u003e\u003cspan\u003eأربعون ألف درهم أنفقها كلها\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eقول النبي ﷺ\u003c/b\u003e\u003cspan\u003eإن أمنّ الناس عليّ في صحبته وماله أبو بكر\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eمواقف كشف فيها إيمان أبي بكر\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالموقف\u003c/th\u003e\u003cth\u003eقوله أو فعله\u003c/th\u003e\u003cth\u003eأثره\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالإسراء\u003c/td\u003e\u003ctd\u003eوالله لئن كان قال ذلك لقد صدق\u003c/td\u003e\u003ctd\u003eلُقّب بالصدّيق\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eبدر\u003c/td\u003e\u003ctd\u003eوالله لن يخزيك الله أبدًا\u003c/td\u003e\u003ctd\u003eثبّت النبي ﷺ في أحرج ساعة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالحديبية\u003c/td\u003e\u003ctd\u003eالزم أمره فإنه رسول الله\u003c/td\u003e\u003ctd\u003eردّ حيرة المسلمين إلى التسليم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eوفاة النبي ﷺ\u003c/td\u003e\u003ctd\u003eمن كان يعبد محمدًا فإن محمدًا قد مات\u003c/td\u003e\u003ctd\u003eأوقف موجة الارتداد\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eتبوك\u003c/td\u003e\u003ctd\u003eأبقيت لهم الله ورسوله\u003c/td\u003e\u003ctd\u003eأنفق ماله كله\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eلو كنت متخذًا من العباد خليلًا لاتخذت أبا بكر خليلًا، ولكن صحبة وإخاء إيمان حتى يجمع الله بيننا عنده\u003c/p\u003e\u003ccite\u003eرواه البخاري ومسلم، عن القضاة ص٢٦\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eكان إيمان أبي بكر يقينًا لا يعرف التردد، وتضحيته نفسًا ومالًا في كل موطن. وقد شهد له النبي ﷺ بما لم يشهد به لأحد، فكان أمنّ الناس عليه في صحبته وماله.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"abubakr-bayaa","n":"البيعة وبيان الخلافة","ic":"🤝","part":"أبو بكر الصديق (١١–١٣هـ)","h":"\u003carticle class=\"ch3\" id=\"abubakr-bayaa\" data-toc=\"البيعة وبيان الخلافة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e١.٣\u003c/span\u003e\n          \u003ch3\u003e🤝 البيعة وبيان الخلافة\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eك\u003c/span\u003eيف اختار المسلمون خليفةً في ساعاتٍ كانت فيها الأمة على حرف؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eلم يكد يُقضَ نحب النبي ﷺ حتى اجتمع الأنصار في سقيفة بني ساعدة يتشاورون في الأمر، ولا يدرون ما يفعل إخوانهم من المهاجرين، فرأوا أن يرسلوا إليهم، فقال أبو بكر: «بل نمشي إليهم»، فسار المهاجرون إليهم فيهم أبو بكر وعمر وأبو عبيدة بن الجراح. وكان في المجلس همّ واحد: من يحمل عبء هذه الدعوة بعد صاحبها؟ ولم يكن في نفوسهم طمع في منصب، بل كانوا يدركون أن الإمارة كما وصفها نبيهم ﷺ «فنعم المرضعة وبئست الفاطمة».\u003c/p\u003e\u003cp class=\"ap\"\u003eفتباحث القوم، وقال بعض الأنصار: «منا أمير ومنكم أمير»، فقام أبو بكر فتكلم فأتى على الأنصار فأثنى عليهم بما هم أهله، ثم بيّن وجه الحق فقال: «نحن الأمراء وأنتم الوزراء»، واحتج بأن العرب لا تعرف هذا الأمر إلا لقريش، وأن النبي ﷺ قال: «الأئمة من قريش». ثم قال: «إني أرضى لكم هذين الرجلين، عمر وأبا عبيدة، فأيّهم شئتم فبايعوا»، فكان في هذا الطرح تنازل عن حظ النفس وتقديم لمصلحة الجماعة على ما سواها.\u003c/p\u003e\u003cp class=\"ap\"\u003eفقال عمر: «من يتقدم عليك وقد رضيك رسول الله ﷺ لديننا، أفلا نرضاك لدنيانا؟» ثم قال: «ابسط يدك يا أبا بكر»، فبسط يده فبايعه، ثم بايعه أبو عبيدة وهو يقول: «إنك أفضل المهاجرين وثاني اثنين إذ هما في الغار، وخليفة رسول الله ﷺ»، ثم بايع الناس، وبايعه المهاجرون ثم الأنصار. قال عمر: «وبذلك حسمت الفتنة»، فكانت البيعة في يوم واحد، ولم يبقَ في المدينة من يطمع في الأمر أو يزاحم عليه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان هذا الخلاف خلافًا في الرأي لا في الهوى؛ فما اختلف القوم على منصب يبتغونه لأنفسهم، بل اختلفوا فيمن يحمل أثقل مسؤولية، والأنصار يدلون بجهودهم ونصرتهم، والمهاجرون بسابقتهم وصحبتهم. فلما تبيّن وجه الحق رجعوا إلى كلمة واحدة، لأن قلوبهم كانت صافية، واختلافهم كان لله لا على الله، فكان حبهم لله وافتراقهم لله، وهذا هو السر في أن الخلاف لم يترك جرحًا في الأمة.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم وقف أبو بكر في الناس يلقي بيان خلافته، وهو أول بيان سياسي في تاريخ الدولة الإسلامية، فقال: «إني قد وُليت عليكم ولست بخيركم، فإن أحسنت فأعينوني، وإن أسأت فقوّموني، الصدق أمانة، والكذب خيانة، والضعيف فيكم قوي عندي حتى آخذ له الحق، والقوي فيكم ضعيف عندي حتى آخذ منه الحق، لا يدع قوم الجهاد في سبيل الله إلا ضربهم الله بالذل، ولا تشيع الفاحشة في قوم قط إلا عمهم الله بالبلاء، أطيعوني ما أطعت الله ورسوله، فإذا عصيت الله ورسوله فلا طاعة لي عليكم». وهذه الكلمات لم تكن شعارات تُقال في يوم الفرح ثم تُنسى، بل كانت دستورًا عمليًا سار عليه في سنتي خلافته؛ فقد ردّ الحقوق إلى أهلها، وأقام العدل بين القوي والضعيف، وبدأ بنفسه فلم يستثنها من المساءلة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما مخصصاته المالية فلم تكن استثناءً عن هذا المنهج؛ فقد كان يعيش من التجارة، فلما ولي أمر المسلمين خرج يومًا إلى السوق يحمل ثيابه، فلقيه عمر فقال: «ما هذا؟ وإلى أين؟» قال: «إلى السوق»، فقال عمر: «إنك وليت أمر المسلمين، فيُفرض لك في أموالهم ما يكفيك وبيتك». ثم نادى عمر في الناس حتى اجتمعوا، فقام أبو بكر فقال: «أيها الناس، إني كنت أحترف لعيالي فأكتسب قوتهم، وأنا الآن أحترفت لله، فافرضوا لي من بيت المال».\u003c/p\u003e\u003cp class=\"ap\"\u003eفقال أبو عبيدة: «أفرض لك قوت رجل من المسلمين، ليس بأعلاهم ولا بدناهم، وكسوة الشتاء، وكسوة الصيف، وركوبة تركها»، ففرضوا له من بيت المال ما يكفيه، ثم زادوه حين رأوا حاجته وكثرة أعماله. وكان ذلك أول تنظيم لمال الخليفة في الإسلام: كفاية لا ترف، وحاجة لا سرف، ورقابة من الأمة على من يحكمها، فلم يكن الخليفة يملك من المال إلا ما يكفيه ليؤدي عمله، ولم يستفد من الخلافة درهمًا واحدًا.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eسقيفة بني ساعدة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان اجتماع السقيفة فورَ وفاة النبي ﷺ، قبل أن يُدفن، لأن الأمر لا يحتمل فراغًا، والخطر يهدد الدولة من كل جانب. وقد فهم الأنصار أنهم أصحاب الفضل في نصرة الإسلام، فطلبوا لأنفسهم نصيبًا في الأمر، ولم يكن طلبهم خروجًا على الجماعة، بل حرصًا على ألا يُستبدّ بهم في أمر يخصهم وحدهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد حُلّ الخلاف بحجة وبرهان، لا بغلبة ولا سيف؛ فساق أبو بكر الدليل من قول النبي ﷺ في قريش، ثم تنازل عن حقه في الاختيار حين رشّح عمر وأبا عبيدة، فكان تنازله عن الترشيح سببًا في استقرار الأمر. وهكذا انتهى أول خلاف سياسي في الإسلام إلى بيعة عامة في يوم واحد، بلا دم ولا سيف، وبلا ضغينة بقيت في القلوب.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eبيان الخلافة ودستورها\u003c/h4\u003e\u003cp class=\"ap\"\u003eيُعدّ بيان أبي بكر أول وثيقة تحدد علاقة الحاكم بالمحكوم في الإسلام؛ فيه إقرار بأن الخليفة ليس معصومًا، وأن الرعية تملك تقويمه، وأن الضعفاء يجدون عند الحاكم ما لا يجدونه عند غيره، وأن الطاعة ليست مطلقة بل مقيدة بالمعروف، وأن الجهاد إذا تُرك ضرب الله الأمة بالذل، وأن الفاحشة إذا شاعت عمّ البلاء الجميع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد جعل أبو بكر معيار الشرعية واضحًا: الطاعة ما أطاع الله ورسوله، فإذا خالف فليس له طاعة. وهذا المعيار هو الذي حوّل الخلافة من ملك يتوارث إلى أمانة تُؤدّى وتُسأل عنها، وهو الأساس الذي بنى عليه عمر بن الخطاب من بعده حين وسّع الشورى والمساءلة، فصار البيان سنة يُقتدى بها في كل عهد.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eمخصصات الخليفة المالية\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت سابقة عمر بن الخطاب في فرض كفاية الخليفة من بيت المال سابقةً مهمة في تنظيم الدولة؛ فالحاكم الذي ينشغل بأمر المسلمين لا يستطيع أن ينشغل بتجارته، ولا يصح أن يبقى عالة على أحد، ولا أن يثري من منصبه، فوجب أن يكون له من بيت المال ما يكفيه ويكفي بيته، وأن يكون ذلك معلومًا للناس لا سرًّا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد قبل أبو بكر الفرض على مضض، وحدّده أبو عبيدة بقوت رجل متوسط من المسلمين وكسوة الشتاء والصيف وركوبة، فكان ذلك حدًّا أدنى للكفاية لا للترف. ولم يزل أبو بكر على هذا الحال حتى مات، وقد جعل ما بيده من مال في بيت مال المسلمين، فكان أول خليفة يردّ على الأمة ما أخذ منها.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمكان البيعة\u003c/b\u003e\u003cspan\u003eسقيفة بني ساعدة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأول من بايع\u003c/b\u003e\u003cspan\u003eعمر بن الخطاب ثم أبو عبيدة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمبدأ البيان\u003c/b\u003e\u003cspan\u003eأطيعوني ما أطعت الله ورسوله\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمخصصه\u003c/b\u003e\u003cspan\u003eكفاية رجل متوسط، لا ترف ولا سرف\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eخطوات انعقاد البيعة\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمرحلة\u003c/th\u003e\u003cth\u003eما جرى فيها\u003c/th\u003e\u003cth\u003eالنتيجة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eاجتماع الأنصار\u003c/td\u003e\u003ctd\u003eتشاوروا في الأمر وطلبوا أميرًا منهم\u003c/td\u003e\u003ctd\u003eالحاجة إلى إجماع\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eمسير المهاجرين\u003c/td\u003e\u003ctd\u003eأبو بكر وعمر وأبو عبيدة إلى السقيفة\u003c/td\u003e\u003ctd\u003eتوحيد المجلس\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eطرح الحق\u003c/td\u003e\u003ctd\u003eنحن الأمراء وأنتم الوزراء\u003c/td\u003e\u003ctd\u003eبيان وجه الحق بالدليل\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالترشيح\u003c/td\u003e\u003ctd\u003eعمر وأبو عبيدة\u003c/td\u003e\u003ctd\u003eتنازل أبي بكر عن الاختيار\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالبيعة\u003c/td\u003e\u003ctd\u003eبايعه عمر ثم أبو عبيدة ثم الناس\u003c/td\u003e\u003ctd\u003eانعقاد الخلافة وحسم الفتنة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eإني قد وُليت عليكم ولست بخيركم، فإن أحسنت فأعينوني، وإن أسأت فقوّموني، الصدق أمانة، والكذب خيانة\u003c/p\u003e\u003ccite\u003eتاريخ الخلفاء للسيوطي ص٦٩، عن القضاة ص٢٩\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eانعقدت البيعة في سقيفة بني ساعدة بالحجة والتنازل، لا بالغلبة والسيف. وحدّد بيان أبي بكر معنى الخلافة: أمانة تُسأل عنها، وطاعة مقيدة بطاعة الله ورسوله.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"abubakr-usama-ridda","n":"جيش أسامة وقضاء المرتدين","ic":"⚔️","part":"أبو بكر الصديق (١١–١٣هـ)","h":"\u003carticle class=\"ch3\" id=\"abubakr-usama-ridda\" data-toc=\"جيش أسامة وقضاء المرتدين\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e١.٤\u003c/span\u003e\n          \u003ch3\u003e⚔️ جيش أسامة وقضاء المرتدين\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eم\u003c/span\u003eاذا يفعل خليفة في أول يوم له، وجيشٌ في خارج المدينة ينتظر أمرًا، وقبائل تتربص بالدولة؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان النبي ﷺ قد جهّز جيشًا تحت إمرة أسامة بن زيد، وهو شاب لم يبلغ العشرين، وأمره أن يوطئ الخيل تُخوم البلقاء والداروم من أرض فلسطين، وعقد له الراية بيده. ثم اشتد به المرض، فمكث الجيش خارج المدينة ينتظر أمره، فلما قُضي نحبه وتولى أبو بكر الخلافة قال كلمته: «أنفذوا أمر رسول الله ﷺ»، فكان أول قرار في خلافته إنفاذَ أمر النبي ﷺ لا إلغاءَه ولا تأجيله.\u003c/p\u003e\u003cp class=\"ap\"\u003eوخرج أبو بكر يودّع الجيش ومعه كبار الصحابة، وهو يمشي على قدميه وأسامة راكب، فقال له أسامة: «لتركب أو لأنزل»، فقال أبو بكر: «وما لي لا أُغبّر قدميّ في سبيل الله؟» ثم استأذنه أسامة في أن يترك عمر بن الخطاب في المدينة يستعين به على أمور المسلمين، فأذن له. وغاب الجيش نحو أربعين يومًا وقيل سبعين، ثم عاد يؤدي مهمته وقد رفع رأس الدولة في عيون القبائل المترددة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان إنفاذ هذا الجيش نظرًا بعيدًا من أبي بكر؛ فبعض قبائل العرب كانت قد دخلت الإسلام حديثًا، وبعضها لم يدخل بعد، وظنّت أن الفرصة سانحة بعد وفاة النبي ﷺ وقبل استتاب الأمر، فكان عزم الخليفة على إنفاذ الجيش إعلانًا بأن مركز الدولة في قوة لا في ضعف. ويُذكر أن أسامة كان لا يمرّ بقبيلة تريد الارتداد إلا قالوا: لولا أن بنا قوة لما أرسلوا هذا الجيش، فكفّوا عن كثير مما كانوا يريدون أن يفعلوه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوما كاد أبو بكر يتسلم زمام المسؤولية حتى بدأت الفتنة تطل برأسها؛ فبعد أن مضى جيش أسامة في طريقه إلى شرق الأردن، جعلت وفود القبائل تتوارد على المدينة تناقش قضية الزكاة، وتزعم أنها لم تعد مشروعة بعد وفاة النبي ﷺ، محتجين بقوله تعالى: «خذ من أموالهم صدقة تطهرهم وتزكيهم بها وصلّ عليهم إن صلاتك سكن لهم»، فقالوا: إن الزكاة تُدفع لمن كانت صلاته سكنًا لنا، وهو النبي ﷺ، وقد انقطع ذلك بوفاته، فسقطت بموته.\u003c/p\u003e\u003cp class=\"ap\"\u003eوتوسعت الفتنة وأبو بكر ينظر رأي أصحابه فلا يجد إلا من يقول له: اتركهم وما هم عليه من منع الزكاة وتألفهم حتى يتمكن الإيمان من قلوبهم، حتى عمر بن الخطاب وهو الرجل الشديد الحازم يقول له: إذا منعك العرب فاصبر عليهم. فأجاب أبو بكر بجوابه المشهور: «والله لو منعوني عقالًا كانوا يؤدونه إلى رسول الله ﷺ لقاتلتهم عليه، والله لأقاتلن من فرّق بين الصلاة والزكاة».\u003c/p\u003e\u003cp class=\"ap\"\u003eثم التفت إلى عمر فقال: «يا عمر، أجبار في الجاهلية، خوّار في الإسلام؟» ولما قيل له: مع من تقاتلهم وقد مات الناس عنك؟ قال: «وحدي حتى تنفرد سالفتي». فعزم على قتال المرتدين رغم أنه لم يبق معه إلا أهل المدينة ومكة والطائف، وهذه وقفة من أشد مواقفه؛ فهو الرقيق القلب كما تقول ابنته، لكنه كان جبارًا في الحق، حازمًا في نشر الدعوة، قويًا في الدفاع عن الإسلام.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم عقد أبو بكر أحد عشر لواء لأحد عشر قائدًا، كلهم من خيار أصحاب رسول الله ﷺ، منهم خالد بن الوليد، وعمرو بن العاص، وشرحبيل بن حسنة، وسارت الجيوش لقتال أهل الردة، فنصر الله الإسلام، وتفرّقت كلمة العدو، وكُسرت شوكتهم. وقد قال السباعي في هذا الموقف: إنه أعظم ما يؤثر عن الرجال من الحزم المصمم والإرادة الحازمة، ولولا أن ثبّت الله قلب أبي بكر على الحق لطوّحت الفتنة بصرح الإسلام الفتي. وبهذا القضاء الحاسم ثبتت الدولة في أخطر سنة من عمرها، فما تنازل أبو بكر عن شبر من الدين في أول يوم، وكان ذلك أصلح سياسة للدولة على المدى الطويل.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eإنفاذ جيش أسامة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان في الجيش من كبار الصحابة من هو أسنّ من قائده، ومع ذلك لم يعترض أحد على إمارة أسامة لأن النبي ﷺ عقد له الراية. وفي إصرار أبي بكر على إنفاذه درسان: أن أمر النبي ﷺ لا يُنسخ بموته، وأن الشاب قد يكون أهلًا للقيادة إذا اختاره من يعرف، فالعبرة بالكفاءة لا بالسن ولا بالسابقة وحدها.\u003c/p\u003e\u003cp class=\"ap\"\u003eولم يكن خروج الجيش إلى فلسطين مجازفة، بل كان رسالة سياسية إلى القبائل المترددة وإلى الروم في الوقت نفسه: أن الدولة قائمة، وأن جيشها لم يتوقف بموت صاحبه. وقد تحققت الفائدة قبل أن يصل الجيش إلى هدفه، فكفّت قبائل كثيرة عن الارتداد خوفًا من قوة الدولة، فكان الجيش يفتح بمسيره ما لم يفتحه بسيفه.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eقضية الزكاة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت حجة القبائل ظاهرة الضعف، لكنها كانت ذريعة لرفض الدولة الوليدة؛ فالزكاة في الإسلام عبادة وليست ضريبة، وربطها بالصلاة في القرآن جعل التفريق بينهما خروجًا على الدين لا مسألة إدارية. ولذلك رأى أبو بكر أن التنازل عنها في أول الأمر يعني التنازل عن أصل الدين، وأن التأليف لا يكون بإسقاط ركن.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان رأي الصحابة أول الأمر رأي تأليف ومجاملة، فخالفهم أبو بكر إلى رأي الحسم، ثم تبين لهم صوابه. وفي هذا دليل على أن الخليفة قد يرى ما لا يراه غيره، وأن الشورى لا تُلزمه بما يراه خطأً في أصل الدين، وأن الحزم في موضعه رحمة بالأمة لا قسوة عليها، وأن التأخير في الحق يفتح أبوابًا لا تُسدّ.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eأحد عشر لواء\u003c/h4\u003e\u003cp class=\"ap\"\u003eقسّم أبو بكر المرتدين إلى جبهات، وعقد لكل جبهة لواءً وقائدًا، فكان ذلك أول تنظيم عسكري شامل في الإسلام؛ فلم يواجه الردة بجيش واحد في معركة واحدة، بل وزّع القوة على القبائل حتى لا تتجمع عليه في وقت واحد، فحارب كل جماعة بما يصلح لها وبمن هو أعرف بها. فكان التوزيع نفسه خطة لا مجرد تقسيم إداري، لأن كل قبيلة تعرف قائدها وتخافه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان أعظم هذه الألوية أثرًا لواء خالد بن الوليد، فقد قصد طليحة بن خويلد في بزاخة حتى انهزم، ثم سار إلى مسيلمة في اليمامة فكانت الوقعة الفاصلة التي قُتل فيها مسيلمة، وعادت اليمامة إلى الإسلام. وبعد أن فرغت الجبهات عادت الجيوش إلى المدينة، وأصبحت الجزيرة كلها تحت راية واحدة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوبهذا التنظيم انتهت الردة في أقل من سنة، وعادت الجزيرة إلى الإسلام، وتفرّغت الدولة لمواجهة الفرس والروم في الخارج. وكان هذا الحسم هو الذي جعل الفتوح ممكنة، لأن الدولة لا تستطيع أن تفتح خارج حدودها وهي تحارب في داخلها، فكان ثمرة الحزم في الداخل فتحًا في الخارج.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eقائد الجيش\u003c/b\u003e\u003cspan\u003eأسامة بن زيد، شاب في العشرين\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eوجهته\u003c/b\u003e\u003cspan\u003eالبلقاء والداروم من أرض فلسطين\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمدة الغياب\u003c/b\u003e\u003cspan\u003eنحو أربعين يومًا وقيل سبعين\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eعدد الألوية\u003c/b\u003e\u003cspan\u003eأحد عشر لواء لأحد عشر قائدًا\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eأولويات أبي بكر في سنته الأولى\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالأولوية\u003c/th\u003e\u003cth\u003eالإجراء\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eإنفاذ أمر النبي ﷺ\u003c/td\u003e\u003ctd\u003eتسيير جيش أسامة إلى فلسطين\u003c/td\u003e\u003ctd\u003eهيبة الدولة أمام القبائل\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eحفظ الدين\u003c/td\u003e\u003ctd\u003eقتال مانعي الزكاة\u003c/td\u003e\u003ctd\u003eإبقاء الزكاة ركنًا لا يسقط\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eتنظيم القوة\u003c/td\u003e\u003ctd\u003eعقد أحد عشر لواء\u003c/td\u003e\u003ctd\u003eتفريق قوة المرتدين\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eضبط القيادة\u003c/td\u003e\u003ctd\u003eاختيار الأكفاء من الصحابة\u003c/td\u003e\u003ctd\u003eسرعة الحسم في الردة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eوالله لو منعوني عقالًا كانوا يؤدونه إلى رسول الله ﷺ لقاتلتهم عليه، والله لأقاتلن من فرّق بين الصلاة والزكاة\u003c/p\u003e\u003ccite\u003eالعواصم من القواصم ص٤٦، عن القضاة ص٣٣\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eأنفذ أبو بكر أمر النبي ﷺ فسيّر جيش أسامة رغم الخطر، ثم قاتل مانعي الزكاة وحده حتى دانت الجزيرة. وبذلك ثبتت الدولة في أول سنة، وعادت الجزيرة إلى الإسلام.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"abubakr-quran","n":"جمع القرآن الكريم","ic":"📖","part":"أبو بكر الصديق (١١–١٣هـ)","h":"\u003carticle class=\"ch3\" id=\"abubakr-quran\" data-toc=\"جمع القرآن الكريم\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e١.٥\u003c/span\u003e\n          \u003ch3\u003e📖 جمع القرآن الكريم\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eك\u003c/span\u003eيف حُفظ القرآن في صحف مكتوبة، ومن الذي أشار بذلك أول مرة؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eإن أشرف النهضات هي التي جاء بها الرسل، لأنها موقوفة على صلاح النفس الإنسانية، والنهضة الإسلامية قامت على وحي هو القرآن الكريم، الذي يعلق بالنفس ويتصل بها أوثق اتصال، ويطبعها طبعًا جديدًا وينشئها نشأة جديدة. فمن هنا كان حفظ القرآن في صحف مجموعة أول قاعدة من قواعد بناء الأمة، وأول عمل من أعمال أبي بكر بعد قضاء الردة، لأن الدولة لا تقوم إلا على كتاب محفوظ مجموع لا يتطرق إليه الضياع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان سبب الجمع حادثة اليمامة؛ فقد استُحرّ القتل يومها بقرّاء القرآن، وخشي عمر بن الخطاب أن يستمر القتل بالقراء في المواطن فيذهب كثير من القرآن، فأتى أبا بكر فقال: «إن القتل قد استحرّ يوم اليمامة بقرّاء القرآن، وإني أخشى إن استمر القتل بالقراء بالمواطن فيذهب كثير من القرآن، وإني أرى أن تأمر بجمع القرآن». وكان في هذا النظر إدراك أن الحفظ في الصدور وحده عرضة للفقد بموت الحفاظ في يوم واحد.\u003c/p\u003e\u003cp class=\"ap\"\u003eفقال أبو بكر: «كيف نفعل شيئًا لم يفعله رسول الله ﷺ؟» فقال عمر: «هذا والله خير»، فلم يزل عمر يراجعه حتى شرح الله صدره لذلك، ورأى في ذلك الذي رأى عمر. وهكذا كان القرار اجتهادًا جماعيًا لا فتوًّا فرديًّا؛ بدأ بفكرة من عمر، ثم اقتنع بها أبو بكر بعد مراجعة، ثم أُسند تنفيذها إلى من هو أهل لها، فاجتمعت المشورة والخبرة والتنفيذ في مسار واحد لم يتعجل خطوة.\u003c/p\u003e\u003cp class=\"ap\"\u003eفدعا أبو بكر زيد بن ثابت فقال له: «إنك رجل شاب عاقل لا نتهمك، وقد كنت تكتب الوحي لرسول الله ﷺ، فتتبع القرآن فاجمعه». فقال زيد: «فوالله لو كلفوني نقل جبل من الجبال ما كان أثقل عليّ مما أمرني به من جمع القرآن»، قال: «كيف تفعلون شيئًا لم يفعله رسول الله ﷺ؟» قال أبو بكر: «هو والله خير»، فلم يزل يراجعه حتى شرح الله صدره للذي شرح له صدر أبي بكر وعمر. فكان تردد زيد ورعًا، وكان إقدامه بعد ذلك يقينًا، وما أقدم على عمل إلا بعد أن اطمأن قلبه.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم تتبع زيد القرآن يجمعه من العسب واللخاف وصدور الرجال، أي من سعف النخل والرقاع والحجارة البيضاء الرقيقة، ومن حفظ الرجال الذين تلقّوه عن النبي ﷺ. ولم يعتمد على مصدر واحد، بل جمع بين المكتوب والمحفوظ، وهو أدق ما يمكن أن يُصنع في التوثيق؛ فالكتابة تحفظ اللفظ، والصدور تحفظ الأداء، وبهما معًا يُصان النص من التحريف والنسيان، وقد كان هذا المنهج هو الذي حصّن القرآن بعد ذلك.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بلغت الدقة أن زيدًا لم يقبل شيئًا حتى وجد عليه شاهدين، فلم يجد آخر سورة التوبة إلا مع أبي خزيمة الأنصاري، وهي قوله تعالى: «لقد جاءكم رسول من أنفسكم عزيز عليه ما عنتم» حتى خاتمة براءة، فأثبتها بشهادة أبي خزيمة. وفي هذا دليل على أن الجمع لم يكن تسجيلًا عشوائيًا، بل كان توثيقًا منضبطًا بمنهج الشهود، فما كُتب حرف إلا بشهادة تحفظه، ولا قُبل خبر منفرد في كتاب الله.\u003c/p\u003e\u003cp class=\"ap\"\u003eفكانت الصحف عند أبي بكر حتى توفاه الله، ثم عند عمر في حياته، ثم عند حفصة بنت عمر رضي الله عنها. وهذه الصحف هي الأصل الذي اعتمد عليه عثمان بن عفان بعد ذلك في نسخ المصاحف وإرسالها إلى الأمصار، فكان جمع أبي بكر مقدمة ضرورية لحفظ القرآن من الضياع، وأساسًا لوحدة المصحف بعد ذلك، ودرعًا دون اختلاف الأمة في كتابها، فما اختلف المسلمون في حرف من كتابهم بعده.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eسبب الجمع\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان القتل في اليمامة فادحًا في صفوف القرّاء، وهم الذين يحملون القرآن في صدورهم ويعلمونه الناس. ومثل هذا النقص لا يُستدرك إذا ذهب، لأن الحفظ في الصدور وحده عرضة للفقد بموت الحفاظ، فكان لا بد من تدوين شامل يجمع المتفرق ويحفظ الأصل قبل أن يضيع، ويجعل الأمة تستند إلى كتاب مكتوب لا إلى ذاكرة رجال.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أدرك عمر هذا الخطر قبل غيره، فكانت فكرته استجابةً لحاجة الأمة لا رغبة في تدوين جديد. وتردد أبي بكر كان ورعًا لا توانيًا؛ فما فعله النبي ﷺ لا يُزاد عليه إلا إذا دعت الضرورة، فلما تبيّن أن الضرورة قائمة أقدم على الجمع، فكان اجتهاده في محله، وكان تردده أولًا ثم إقدامه آخرًا دليل فقه لا دليل تردد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في موقف عمر درس في أدب المشورة: رأى رأيًا فلم يفرضه، بل راجع صاحبه مرة بعد مرة حتى اقتنع أو أقنع، فما استعمل سلطته ولا لجأ إلى إلزام. وهذا هو الفرق بين مشورة تُطلب للبركة ومشورة تُطلب للحقيقة، وبين رأي يُطرح للنقاش ورأي يُفرض بالقوة، فما كل رأي يُلزم به صاحبه، وما كل اختلاف يُعدّ خروجًا.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eزيد بن ثابت ومنهجه\u003c/h4\u003e\u003cp class=\"ap\"\u003eاختير زيد بن ثابت لثلاث خصال: شبابه وعقله، وأمانته التي لا تُتهم، وكتابته الوحي لرسول الله ﷺ. وهذه الخصال هي التي جعلته أهلًا لأخطر مهمة في تاريخ الأمة، فجمع بين القدرة التقنية في الكتابة والثقة الأخلاقية التي تجعل الناس يقبلون عمله بلا جدال ولا مراء.\u003c/p\u003e\u003cp class=\"ap\"\u003eومن منهجه أنه جمع بين المصدرين: المكتوب المحفوظ بين أيدي الناس، والمحفوظ في صدور الرجال، ولم يقبل رواية منفردة إلا بشهادة. وقد استمر الجمع على هذا المنهج زمنًا، حتى صار القرآن كله في صحف مرتبة محفوظة عند الخليفة، لا يضيع منه حرف، ولا يختلط فيه شيء بغيره، فكان عمله أساسًا لكل ما جاء بعده.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالصحف ومصيرها\u003c/h4\u003e\u003cp class=\"ap\"\u003eانتقلت الصحف من أبي بكر إلى عمر، وكان عمر يقرأ فيها ويعتمد عليها، ثم صارت إلى حفصة بنت عمر بعد وفاته. فكانت هذه الصحف وديعة الخلافة، يحفظها الخليفة في بيته كما يحفظ أمن الدولة، ويوصي بها من بعده، لأنها أصل الدين وأساس وحدته، فكانت أمانة لا تُترك لورثة.\u003c/p\u003e\u003cp class=\"ap\"\u003eولما أراد عثمان نسخ المصاحف أخذ هذه الصحف أساسًا لعمله، فكان جمع أبي بكر السبب المباشر في وحدة النص القرآني في الأمصار. وهكذا أثمر اجتهادُ خليفةٍ واحد حفظَ القرآن للأمة إلى آخر الدهر، فصار عملًا يُذكر له ما دام القرآن يُقرأ في المساجد والبيوت، وما دامت الأمة تتلو كتاب ربها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد حفظت هذه الصحف في بيت الخليفة لا في خزانة خاصة، لأنها ملك الأمة لا ملك الأسرة. ولذلك لما طلب عثمان الصحف من حفصة أرسلت بها إليه، فلما فرغ من نسخ المصاحف ردّها إليها، وبقيت عندها حتى ماتت، فكانت سيرة الصحف سيرة الأمانة في الأمة كلها، يتوارثها الخلفاء كما يتوارثون المسؤولية لا الميراث.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eصاحب الفكرة\u003c/b\u003e\u003cspan\u003eعمر بن الخطاب\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمنفذ\u003c/b\u003e\u003cspan\u003eزيد بن ثابت الأنصاري\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالسبب\u003c/b\u003e\u003cspan\u003eمقتل قرّاء القرآن يوم اليمامة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمصير الصحف\u003c/b\u003e\u003cspan\u003eأبو بكر ثم عمر ثم حفصة\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eمراحل جمع القرآن في عهد أبي بكر\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمرحلة\u003c/th\u003e\u003cth\u003eمن قام بها\u003c/th\u003e\u003cth\u003eما تم فيها\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالاقتراح\u003c/td\u003e\u003ctd\u003eعمر بن الخطاب\u003c/td\u003e\u003ctd\u003eخشية ذهاب القرآن بموت القرّاء\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالقرار\u003c/td\u003e\u003ctd\u003eأبو بكر الصديق\u003c/td\u003e\u003ctd\u003eمراجعة ثم اقتناع ثم أمر بالجمع\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالتنفيذ\u003c/td\u003e\u003ctd\u003eزيد بن ثابت\u003c/td\u003e\u003ctd\u003eتتبع القرآن من المكتوب والصدور\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالتوثيق\u003c/td\u003e\u003ctd\u003eزيد مع الشهود\u003c/td\u003e\u003ctd\u003eإثبات آخر التوبة بشهادة أبي خزيمة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالحفظ\u003c/td\u003e\u003ctd\u003eأبو بكر ثم عمر ثم حفصة\u003c/td\u003e\u003ctd\u003eبقاء الصحف أصلًا لنسخ عثمان\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eإنك رجل شاب عاقل لا نتهمك، وقد كنت تكتب الوحي لرسول الله ﷺ، فتتبع القرآن فاجمعه\u003c/p\u003e\u003ccite\u003eصحيح البخاري ٩/١٠، عن القضاة ص٣٥\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eبدأ جمع القرآن بفكرة عمر، ونُفّذ بأمر أبي بكر، وبتوثيق زيد بن ثابت من المكتوب والصدور. فحُفظ النص، وصارت الصحف أساسًا لوحدة المصحف في عهد عثمان.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"abubakr-futuh","n":"الفتوحات: جبهة الفرس وجبهة الروم","ic":"🗺️","part":"أبو بكر الصديق (١١–١٣هـ)","h":"\u003carticle class=\"ch3\" id=\"abubakr-futuh\" data-toc=\"الفتوحات: جبهة الفرس وجبهة الروم\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e١.٦\u003c/span\u003e\n          \u003ch3\u003e🗺️ الفتوحات: جبهة الفرس وجبهة الروم\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eل\u003c/span\u003eماذا خرج المسلمون من جزيرتهم إلى العراق والشام في سنة واحدة؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكانت دائرة الدعوة تتوسع شيئًا فشيئًا لنشر هذا الدين، وتمكين الدعوة بعد إعادة الأمر إلى نصابه، ثم تمكين الفكرة والاطمئنان عليها وعلى العلم وجمع القرآن. ولا يكون ذلك إلا بتحدي القوى العالمية آنذاك، المتمثلة في الإمبراطوريتين الفارسية والرومانية، وكان النبي ﷺ قد بدأ ذلك حين عقد الراية لجيش أسامة لحرب الروم، فكانت الفتوحات امتدادًا لسنة نبوية لا بدعةً في الدين.\u003c/p\u003e\u003cp class=\"ap\"\u003eوهكذا اتجه أبو بكر إلى منازلة الدولتين الكبيرتين: الفرس والروم، ولم يتطلع إلى ذلك حبًّا في توسيع ملكه، ولا رغبة في السلطان والوجاهة، ولا طمعًا في ريف العراق وجمال الشام، ولا إشباعًا لشهوة التسلط؛ فكل ذلك لم يخطر على باله. وإنما كان شأن المسلمين أن لا يرفعوا سيفًا ولا رمحًا حتى يبينوا للناس ما نزل إليهم، فكان البيان قبل القتال، والدعوة قبل الجيش.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت السياسة التي سار عليها الجيوش أن تُعطي العدو فرصة كافية ليختار أحد أمرين: الدخول في الإسلام، أو إعطاء الجزية التي تساوي أجر الحماية، فمحاسبة المسلمين هناك تأخذ على عاتقها حمايتهم. وبدليل صدق هذه السياسة أنهم كانوا إذا سحبوا الحماية ردّوا الجزية إلى أصحابها، كما حصل معهم في حمص حين اضطروا إلى الانسحاب منها أمام جموع الروم، فشهد لهم أعداؤهم بالعدل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي جبهة الفرس ندب أبو بكر لقيادة الجيوش الإسلامية سيف الله خالد بن الوليد، وكان ذلك في شهر محرم من السنة الثانية عشرة للهجرة، واستطاعت الجيوش الفاتحة أن تفتح معظم بلاد العراق من مملكة فارس في عهد الصديق. وكان فتح العراق في هذه السنة هو الذي أوقف خطر الفرس عن الجزيرة، وحوّل الحدود إلى خارجها، فصار القتال بعيدًا عن بيوت المسلمين وحقولهم وأولادهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي جبهة الروم في الشمال وجّه أبو بكر خالد بن سعيد بن العاص على رأس جيش من الدعاة الفاتحين إلى مشارف الشام، فعسكر بتيماء والتقى بالروم، ثم كتب إلى أبي بكر يطلب المدد والعون، فجهّز أبو بكر أربعة جيوش: الأول قائده عمرو بن العاص ووجهته فلسطين، والثاني قائده شرحبيل بن حسنة ووجهته الأردن، والثالث قائده يزيد بن أبي سفيان ووجهته البلقاء، والرابع قائده أبو عبيدة عامر بن الجراح ووجهته حمص، فكان لكل جيش طريق ومهمة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوجمعت الروم همّهم، فأشار عمرو بن العاص على الأمراء بالاجتماع، فاجتمعوا باليرموك، وكل واحد أمير على جيشه والروم أمامهم، وبين الفريقين خندق، فكان الروم يقاتلون باختيارهم وإن شاءوا احتجزوا بخندقهم، وبقي الأمر على هذا الحال ثلاثة أشهر. فكتب الأمراء إلى أبي بكر يطلبون المدد، فكتب إلى خالد بن الوليد في العراق يوجّهه إلى الشام، فوصل خالد والمسلمون في وقت قصير، وكان الروم قد وصلهم في الوقت نفسه مدد آخر.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم رأى المسلمون أن يجتمعوا جميعًا تحت قيادة خالد، فكانت معركة اليرموك التي انتصر فيها المسلمون انتصارًا ما زال التاريخ يذكره. وقد وقعت اليرموك في سفوح جبال الجولان، تلك الجبال التي استُشهد فيها ما يقرب من ثلاثة آلاف رجل من أصحاب رسول الله ﷺ، لينشروا في أطرافها الإسلام وتعلوها راية الحق والتوحيد. وهكذا وضع أبو بكر أساس الفتح الكبير الذي أكمله عمر من بعده، فانتقلت الأمة من الدفاع إلى الفتح المنظم، ومن حفظ البيوت إلى نشر الدعوة.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eمنطق الفتح وسياسته\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم تكن الفتوحات حركة غزو تقوم على السلب والنهب، بل كانت امتدادًا لدعوة تُبيّن للناس ما نزل إليهم، وتترك لهم الخيار بعد البيان. ولذلك سبق السيفَ البلاغُ، وتقدّمت الدعوةُ القتالَ في كل جبهة، فكان القائد داعية قبل أن يكون مقاتلًا، وكان الكتاب قبل الرمح.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالدليل العملي على صدق هذه السياسة أن المسلمين ردّوا الجزية حين لم يقدروا على الحماية في حمص، فكان ذلك اعترافًا بأن الجزية أجر خدمة لا إتاوة قهر. وهذا الفهم هو الذي جعل أهل البلاد يستقبلون الفاتحين استقبالًا حسنًا في كثير من المدن، ويفتحون لهم أبوابها، ويرون في عدلهم خيرًا من ظلم من كان قبلهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان أبو بكر يوصي قواده بما يضبط أخلاق الجند في أرض الفتح: لا يقتلون صبيًا ولا امرأة ولا شيخًا كبيرًا، ولا يقطعون شجرًا مثمرًا، ولا يذبحون دابة إلا للأكل. فكانت هذه الوصايا إعلانًا بأن الفتح رسالة لا انتقام، وأن القوة تُضبط بالأخلاق ولا تُطلق بلا قيد، فحفظت للأمة سمعتها في البلاد المفتوحة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eجبهة الفرس في الشرق\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان خالد بن الوليد أنسب القادة لهذه الجبهة لحربه المديدة في العراق ومعرفته بطرقها وقبائلها، وقد بدأ عمله في محرم سنة اثنتي عشرة للهجرة. وفي أقل من سنة استطاع أن يفتح معظم بلاد العراق من مملكة فارس، فكان فتحًا سريعًا دلّ على حسن القيادة وقوة الجند وصدق السياسة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت هذه الجبهة هي التي أمنت ظهر الدولة الإسلامية، لأن الفرس كانوا أقرب الخطر إلى الجزيرة وأكثر استعدادًا لاستعادة نفوذهم. فلما انكسرت قوتهم في العراق تحوّل الجهد إلى الشام، وانتقل خالد بجيشه إلى اليرموك، فكان لفتح العراق أثر مباشر في نصر الشام، لأن الجبهتين كانتا جبهة واحدة في حس القيادة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eجبهة الروم واليرموك\u003c/h4\u003e\u003cp class=\"ap\"\u003eقسّم أبو بكر جبهة الشام على أربعة جيوش بأربعة قادة ووجهات محددة، وهذا التقسيم يدل على تصور استراتيجي واضح: كل جيش يعمل في إقليم، ثم تجتمع الجيوش عند الضرورة تحت قيادة واحدة. وقد حدث ذلك فعلًا في اليرموك حين اجتمعت الجيوش كلها تحت راية خالد بن الوليد، فما اختلفوا فيمن يقود.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان اجتماع المسلمين تحت قيادة خالد قرارًا حكيمًا في ساعة الخطر، إذ وحّد القيادة في معركة فاصلة، فما بقي مجال لاختلاف يوهن الصف. وبهذا النصر انفتح الشام كله، وانتقلت الدولة من مرحلة الدفاع إلى مرحلة الفتح المنظم، وصارت اليرموك درسًا في القيادة والثبات وحسن الاستعداد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان الانتظار ثلاثة أشهر على الخندق امتحانًا لصبر الجند، فما استعجلوا ولا تفرّقوا، حتى جاء المدد من العراق في وقت كان الروم فيه ينتظرون مددهم. فكانت هذه الأشهر درسًا في أن الفتح يحتاج صبرًا كما يحتاج سيفًا، وأن القائد الذي يعرف متى يقاتل ومتى ينتظر هو الذي يُنتصر به.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eجبهة الفرس\u003c/b\u003e\u003cspan\u003eخالد بن الوليد، محرم ١٢هـ\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eجبهة الشام\u003c/b\u003e\u003cspan\u003eأربعة جيوش بأربعة قادة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eموقع اليرموك\u003c/b\u003e\u003cspan\u003eسفوح جبال الجولان\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالشهداء\u003c/b\u003e\u003cspan\u003eنحو ثلاثة آلاف من الصحابة\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجيوش الشام الأربعة\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالجيش\u003c/th\u003e\u003cth\u003eقائده\u003c/th\u003e\u003cth\u003eوجهته\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالأول\u003c/td\u003e\u003ctd\u003eعمرو بن العاص\u003c/td\u003e\u003ctd\u003eفلسطين\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالثاني\u003c/td\u003e\u003ctd\u003eشرحبيل بن حسنة\u003c/td\u003e\u003ctd\u003eالأردن\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالثالث\u003c/td\u003e\u003ctd\u003eيزيد بن أبي سفيان\u003c/td\u003e\u003ctd\u003eالبلقاء\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالرابع\u003c/td\u003e\u003ctd\u003eأبو عبيدة عامر بن الجراح\u003c/td\u003e\u003ctd\u003eحمص\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eيا أيها الذين آمنوا قاتلوا الذين يلونكم من الكفار وليجدوا فيكم غلظة واعلموا أن الله مع المتقين\u003c/p\u003e\u003ccite\u003eسورة التوبة، الآية ١٢٣، عن القضاة ص٣٦\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eخرجت الفتوحات من منطق البلاغ قبل القتال، فسبق البيانُ السيفَ في كل جبهة. وفي أقل من سنتين فُتح العراق، وانتصر المسلمون في اليرموك، فانتقلت الدولة من الدفاع إلى الفتح.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"abubakr-wafat","n":"المرض والوفاة واستخلاف عمر","ic":"🕯️","part":"أبو بكر الصديق (١١–١٣هـ)","h":"\u003carticle class=\"ch3\" id=\"abubakr-wafat\" data-toc=\"المرض والوفاة واستخلاف عمر\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e١.٧\u003c/span\u003e\n          \u003ch3\u003e🕯️ المرض والوفاة واستخلاف عمر\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eك\u003c/span\u003eيف ودّع أبو بكر الأمة بعد سنتين وثلاثة أشهر غيّرت وجه التاريخ؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان أول مرض أبي بكر أنه اغتسل في يوم بارد فأصيب بحمّى، فلبث خمسة عشر يومًا لا يخرج إلى الصلاة، وكان يأمر عمر بن الخطاب أن يصلي بالناس. فكان هذا التقديم إشارة عملية إلى من يصلح للأمر بعده، وقد فهم الصحابة ذلك، لأن الإمامة في الصلاة كانت أعظم منصب يُقدَّم فيه الرجل في حياة النبي ﷺ، فكان تقديمه في الصلاة تقديمًا في الأمر كله عند من يفقه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان الناس يدخلون إليه يزورونه وهو في بيته، وكان عثمان بن عفان ألزمهم له في مرضه، يخرج في حوائجه ويقضي ما يحتاج إليه، ويبلغه أخبار الناس. وقد جمع أبو بكر في مرضه بين إدارة الدولة من فراشه، وبين النظر في أمر من يخلفه، فلم يترك الأمة هملاً في ساعة حرجة، ولم يغب عن أمرها حتى آخر نفس من عمره، فكان يدير ما يحتاج إلى إدارة وهو على فراش المرض، ويوصي من يثق به في كل صغيرة وكبيرة، ويوصد بابًا قد يُفتح للفتنة بعده.\u003c/p\u003e\u003cp class=\"ap\"\u003eولم يكن اختياره لعمر اختيارًا ارتجاليًا، بل كان عن مشاورة لكبار الصحابة ومراجعة لهم، لأن عمر كان أشدّ الصحابة في الحق وأقواه في الأمر، وكانت الدولة في حاجة إلى قوة تحفظ ما بُني، وكان عمر قد جُرّب في الشدة والرخاء فعُرف بالثبات والعدل. وقد لقي اختياره قبولًا من أهل الحل والعقد، فتمت البيعة لعمر بعد وفاة أبي بكر بإجماع من حضر، فلم يقع في المدينة خلاف ولا اضطراب، ولا احتاج الأمر إلى سيف ولا إلى جدال.\u003c/p\u003e\u003cp class=\"ap\"\u003eوتوفي أبو بكر رضي الله عنه مساء ليلة الثلاثاء لثمان ليالٍ بقين من جمادى الآخرة سنة ثلاث عشرة للهجرة، فكانت خلافته سنتين وثلاثة أشهر وعشر ليالٍ، وهو في الثالثة والستين من عمره على المشهور. وهذه المدة القصيرة لم تكن قصيرة في أثرها؛ فقد قضى فيها الردة، وجمع القرآن، وبدأ الفتوح الكبرى، وثبّت الدولة التي كادت تُجرف في أول يوم من أيامها، فما ترك للأمة فراغًا يُملأ بالخلاف، ولا ثغرة يدخل منها الطامع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أوصى أن تغسله زوجته أسماء بنت عميس رضي الله عنها، وكُفّن في ثوبين مستعملين وقيل ثلاثة، وصلى عليه عمر بن الخطاب، ودُفن ليلًا إلى جانب صاحبه بين المنبر وقبر رسول الله ﷺ، فجُعل رأسه محاذيًا كتفي رسول الله ﷺ. فكان في حياته ثاني اثنين في الغار، وفي مماته جارًا لصاحبه في القبر، لم يفارقه حيًّا ولا ميتًا، ولا في الشدة ولا في الرخاء.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد رثاه المسلمون بقولهم: «رحمك الله يا أبا بكر، ورضي عنك، فلقد خلفت الحبيب ﷺ فكنت خير خلف لخير سلف، وبلغت ونشرت الدعوة، وحملت الأمانة وأدّيتها وقمت بها خير قيام». وهذه الكلمات تلخص سيرته: خليفةٌ لم يبتغِ ملكًا، وأمينٌ لم يخن، وقائدٌ لم يتخلّ عن أمانة في يوم من أيامه، وقد شهد له النبي ﷺ بما لم يشهد به لأحد من أصحابه، فكان أمنّ الناس عليه في صحبته وماله.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت وفاته نهاية مرحلة التأسيس الأولى، وبداية مرحلة البناء والتوسع على يد عمر بن الخطاب، الذي حمل الأمانة بعده فوسّع الدولة، وأقام الدواوين، ووضع أسس نظام الحكم، فكان امتدادًا طبيعيًا لسيرة صاحبه. وهكذا لم ينقطع خط الراشدين بموت أحدهم، بل كان كل خليفة يكمل ما بدأه من قبله، فكانت الخلافة فيهم كالبناء يُشدّ بعضه ببعض، وكالسيل لا يتوقف عند حجر، ودرسًا في أن الأمم لا تموت بموت رجالها إذا بنت مؤسساتها.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالمرض وأيامه الأخيرة\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يكن مرض أبي بكر طويلًا، لكنه كان كافيًا لاختبار الدولة الفتية: هل تستطيع أن تعمل بلا خليفة قادر على الخروج؟ وقد أثبتت الأمة أنها تستطيع، لأن الأمر كان مؤسسة لا شخصًا، فاستمرت الصلاة والجند والعمل الإداري في أثناء مرضه، فلم يتوقف شيء من شؤون الناس.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان يخرج من بيته إلى المسجد ما استطاع، فإذا اشتد به المرض أمر عمر بالصلاة، ثم اشتدّ المرض حتى لزم الفراش، فكان الناس يزورونه ويسمعون منه التوجيه. ولم تنقطع أعمال الدولة في هذه الأيام، حتى إذا مات وجد عمر الدولة قائمة تعمل، لا تحتاج إلى تأسيس من جديد، فكان ذلك من حسن تدبيره في آخر عمره.\u003c/p\u003e\u003cp class=\"ap\"\u003eوإذا كان المرض قد منعه من الخروج، فإنه لم يمنعه من التفكير في مصير الأمة؛ فكان يجمع بين التداوي والتدبير، ويوصي أهله بما يجب عليهم، ويرى الناس في بيته كما كانوا يرونه في المسجد. فلم يكن انقطاعه عن الخروج انقطاعًا عن الأمة، وهذا هو الفرق بين من يحكم بجسده ومن يحكم بعقله وأمانته.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالاستخلاف\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان أبو بكر يرى أن ترك الأمر دون تحديد خطر على الأمة، لأن الفتنة لا تحتاج إلا إلى ساعة فراغ، فشاور أهل الرأي من الصحابة في عمر، ووجد منهم قبولًا، فعهد إليه بالأمر. وقد كان عمر أهلًا لذلك بشدته وعدله وعلمه، فما ولاّه أبو بكر إلا وهو يعلم ثقله وقدرته على حمله.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أحسن أبو بكر حين لم يجعل الأمر ميراثًا لأهل بيته، وحين لم يتركه عرضة للتنازع، بل جمع بين الشورى والحسم: شاور ثم عزم. وهذا هو المنهج الذي صار قاعدة في اختيار الخلفاء بعده، وإن اختلفت صورته من عهد إلى عهد، فالشورى أصل والحسم عند الحاجة فرعه، وما أخطأ من جمع بينهما في موضعهما.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد يُسأل: لماذا لم يولّ أبو بكر أحدًا من أهل بيته وهو يعلم أنهم من صالحي المسلمين؟ والجواب أن الخلافة عنده أمانة لا ملك، وأن الأفضلية في الإسلام ليست بالنسب بل بالتقوى والعلم، فما نظر إلى بيته ولا إلى قومه، بل نظر إلى من يصلح لحمل الأمانة، فكان اختياره لعمر اختيار مصلحة لا قرابة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالوفاة والدفن\u003c/h4\u003e\u003cp class=\"ap\"\u003eتوفي أبو بكر في مساء ليلة الثلاثاء لثمان ليالٍ بقين من جمادى الآخرة سنة ثلاث عشرة للهجرة، وكانت خلافته سنتين وثلاثة أشهر وعشر ليالٍ. وغسّلته زوجته أسماء بنت عميس، وكُفّن في ثوبين مستعملين، وصلى عليه عمر، ودُفن ليلًا بجانب رسول الله ﷺ، فكان قبره ملاصقًا لقبر من أحبه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان دفنه إلى جانب صاحبه تعبيرًا عن منزلته، كما كان في حياته رفيقه في الغار والهجرة. وبموته انطوى عهد التأسيس، وبدأ عهد التوسع والتنظيم، فبقيت سيرته مثالًا للحاكم الذي لا يملك من الدنيا شيئًا إلا كفايته، ولا يترك لأهله إلا ما يكفيهم، ولا يذكر الناس منه إلا العدل والصدق.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمدة الخلافة\u003c/b\u003e\u003cspan\u003eسنتان وثلاثة أشهر وعشر ليالٍ\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eتاريخ الوفاة\u003c/b\u003e\u003cspan\u003eجمادى الآخرة سنة ١٣هـ\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالخليفة بعده\u003c/b\u003e\u003cspan\u003eعمر بن الخطاب\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eموضع الدفن\u003c/b\u003e\u003cspan\u003eإلى جانب رسول الله ﷺ\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eحصيلة خلافة أبي بكر\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالعمل\u003c/th\u003e\u003cth\u003eالأثر المباشر\u003c/th\u003e\u003cth\u003eالأثر البعيد\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eقضاء الردة\u003c/td\u003e\u003ctd\u003eوحدة الجزيرة\u003c/td\u003e\u003ctd\u003eبقاء الزكاة ركنًا\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eجمع القرآن\u003c/td\u003e\u003ctd\u003eحفظ النص في صحف\u003c/td\u003e\u003ctd\u003eأساس مصحف عثمان\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eفتح العراق\u003c/td\u003e\u003ctd\u003eإبعاد خطر الفرس\u003c/td\u003e\u003ctd\u003eبداية الفتوح الكبرى\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eاليرموك\u003c/td\u003e\u003ctd\u003eانفتاح الشام\u003c/td\u003e\u003ctd\u003eسقوط الروم عن الشام\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eاستخلاف عمر\u003c/td\u003e\u003ctd\u003eاستقرار الأمر\u003c/td\u003e\u003ctd\u003eنموذج الشورى والحسم\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eرحمك الله يا أبا بكر، ورضي عنك، فلقد خلفت الحبيب ﷺ فكنت خير خلف لخير سلف\u003c/p\u003e\u003ccite\u003eتاريخ الطبري ٣/٤٢١–٤٢٢، عن القضاة ص٤٠\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eفي سنتين وثلاثة أشهر قضى أبو بكر الردة وجمع القرآن وبدأ الفتوح، ثم استخلف عمر ومات. فكانت خلافته القصيرة أطول أثرًا من ممالك طويلة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"f","one":true,"id":"people","n":"أهم الشخصيات","ic":"","part":"","h":"\u003csection class=\"rsec\"\u003e\n      \u003ch2 class=\"sec\"\u003eأهم الشخصيات\u003c/h2\u003e\n      \u003cdiv class=\"people\"\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eأبو بكر بن أبي قحافة\u003c/b\u003e\u003cspan\u003eالصديق، أوّل الخلفاء الراشدين، بايعة أهل المدينة وبدأ حروب الردة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eعمر بن الخطاب\u003c/b\u003e\u003cspan\u003eالفاروق، ثاني الخلفاء، فتح الشام والعراق ومصر وجمع المصاحف سنة ١٣هـ.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eعثمان بن عفان\u003c/b\u003e\u003cspan\u003eذو النورين، ثالث الخلفاء، أتمّ الفتح نحو خراسان وسواحل البحر.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eعلي بن أبي طالب\u003c/b\u003e\u003cspan\u003eرابع الخلفاء، قاتل معاوية في صفين واشتُهد في مسجد النبي سنة ٤٠هـ.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eخالد بن الوليد\u003c/b\u003e\u003cspan\u003eسيف الله المسلول، قاد جيوش الشام وحروب الردة، وأول من كثر عليه الكلام.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eعمرو بن العاص\u003c/b\u003e\u003cspan\u003eقائد الفتح في مصر، وهو أوّل من أرسل إلى عمر تقريراً مفصلاً عن الأقاليم.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eالحسن بن علي\u003c/b\u003e\u003cspan\u003eتنازل عن الخلافة سنة ٣٩هـ، فعهدت الخلافة لمعاوية وانتهت حقبة الراشدين.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\n    \u003c/section\u003e"},{"u":"f","one":true,"id":"outcomes","n":"النتائج والآثار","ic":"","part":"","h":"\u003csection class=\"rsec\"\u003e\n      \u003ch2 class=\"sec\"\u003eالنتائج والآثار\u003c/h2\u003e\n      \u003cul class=\"outs\"\u003e\u003cli\u003eانتشرت الدولة الإسلامية من حدود المدينة إلى الشام والعراق ومصر وخراسان في نحو ثلاثين عاماً.\u003c/li\u003e\u003cli\u003eدُوّنت المصاحف الأولى في عهد أبي بكر، فصار للقرآن نصّ واحد تواترت به القراءة.\u003c/li\u003e\u003cli\u003eأقرّ عمر أهل الذمة بذمة العمرية، فبقي لأهل الكتاب نظام حماية في الدولة.\u003c/li\u003e\u003cli\u003eقُسّمت الأقاليم إلى ولايات وعُمّرت الدواوين والكُتّاب، فاكتسبت الدولة جهاز إدارة مستقراً.\u003c/li\u003e\u003cli\u003eانتهت حقبة الراشدين بانعقاد البيعة إلى بني أمية، وهو مدخل الدولة الأموية.\u003c/li\u003e\u003c/ul\u003e\n    \u003c/section\u003e"},{"u":"f","one":true,"id":"sources","n":"المصادر والمراجع","ic":"","part":"","h":"\u003cdiv class=\"src frame\" style=\"--c:#8B1A3A\"\u003e\n    \u003cspan class=\"crn tl\"\u003e\u003csvg viewBox=\"0 0 26 26\"\u003e\n\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\"/\u003e\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\" transform=\"rotate(90 13 13)\" opacity=\".5\"/\u003e\u003c/svg\u003e\u003c/span\u003e\u003cspan class=\"crn tr\"\u003e\u003csvg viewBox=\"0 0 26 26\"\u003e\n\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\"/\u003e\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\" transform=\"rotate(90 13 13)\" opacity=\".5\"/\u003e\u003c/svg\u003e\u003c/span\u003e\u003cspan class=\"crn bl\"\u003e\u003csvg viewBox=\"0 0 26 26\"\u003e\n\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\"/\u003e\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\" transform=\"rotate(90 13 13)\" opacity=\".5\"/\u003e\u003c/svg\u003e\u003c/span\u003e\u003cspan class=\"crn br\"\u003e\u003csvg viewBox=\"0 0 26 26\"\u003e\n\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\"/\u003e\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\" transform=\"rotate(90 13 13)\" opacity=\".5\"/\u003e\u003c/svg\u003e\u003c/span\u003e\n    \u003ch2 class=\"sec\" style=\"margin-top:0\"\u003eالمصادر والمراجع\u003c/h2\u003e\n    \u003cul\u003e\u003cli\u003e\u003ccite\u003eابن هشام\u003c/cite\u003e — السيرة النبوية (وفاة النبي ﷺ وبيعة أبي بكر وأخبار بيعته)\u003c/li\u003e\u003cli\u003e\u003ccite\u003eالطبري\u003c/cite\u003e — تاريخ الرسل والملوك (أخبار الخلفاء الراشدين ومعارك الفتح)\u003c/li\u003e\u003cli\u003e\u003ccite\u003eابن الأثير\u003c/cite\u003e — الكامل في التاريخ (قادة الخلفاء وفتوح الشام والعراق ومصر)\u003c/li\u003e\u003cli\u003e\u003ccite\u003eابن كثير\u003c/cite\u003e — البداية والنهاية (الراشدون والفتنة ووقائعها)\u003c/li\u003e\u003c/ul\u003e\n  \u003c/div\u003e"},{"u":"f","one":true,"id":"pager","n":"الحقب الأخرى","ic":"","part":"","h":"\u003cnav class=\"pager\"\u003e\n    \u003ca class=\"prev\" href=\"seerah.html\"\u003e\u003csmall\u003e← الحقبة السابقة\u003c/small\u003e\u003cb\u003e🌟 محطات من السيرة النبوية\u003c/b\u003e\u003c/a\u003e\n    \u003ca class=\"next\" href=\"umayyad.html\"\u003e\u003csmall\u003eالحقبة التالية →\u003c/small\u003e\u003cb\u003e🏛️ الدولة الأموية\u003c/b\u003e\u003c/a\u003e\n  \u003c/nav\u003e"}]}</script>
<script>
/* ===== موسوعة تاريخ الإسلام — منطق الواجهة + قارئ الكتاب =====
   يعمل على صفحات «الكتاب» (التي تحمل <script id="book">) وبقية الصفحات كما هي. */

/* هل هذه صفحة قارئ؟ يُحدَّد قبل أي تهيئة */
window.__READER__ = !!document.getElementById('book');

(function () {
  'use strict';
  var STORE = 'ti_bookmarks', THEME = 'ti_theme', PROG = 'ti_progress';

  /* ---------- تحويل الأرقام إلى هندية (وقت التشغيل) ---------- */
  function arDigits(s) {
    return String(s == null ? '' : s).replace(/\d/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'[d]; });
  }
  window.arDigits = arDigits;

  /* ---------- الوضع الليلي ---------- */
  function applyTheme(d) {
    document.body.classList.toggle('dark', d);
    var b = document.getElementById('themeBtn');
    if (b) b.textContent = d ? '☀️' : '🌙';
  }
  var th = document.getElementById('themeBtn');
  if (th) th.addEventListener('click', function () {
    var d = !document.body.classList.contains('dark');
    applyTheme(d); localStorage.setItem(THEME, d ? '1' : '0');
  });
  applyTheme(localStorage.getItem(THEME) === '1');

  /* ---------- التقدّم: مشترك بين التمرير والقارئ ---------- */
  function setProgress(id, frac) {
    if (!id || id === 'home') return;
    var pr = JSON.parse(localStorage.getItem(PROG) || '{}');
    if ((pr[id] || 0) < frac) { pr[id] = frac; localStorage.setItem(PROG, JSON.stringify(pr)); }
    if (frac > 0.92) {
      var bm = JSON.parse(localStorage.getItem(STORE) || '[]');
      if (bm.indexOf(id) < 0) {
        bm.push(id); localStorage.setItem(STORE, JSON.stringify(bm));
        if (window.refreshBadges) window.refreshBadges();
      }
    }
  }
  window.__setProgress = setProgress;

  var domeFill = document.querySelector('.dome .fill');
  var topBar = document.querySelector('.topbar i');
  var swordBl = document.querySelector('.sword .bl');
  var swordTx = document.querySelector('.sword span');

  function paintProgress(pct) {
    if (domeFill) domeFill.style.opacity = (0.12 + pct * 0.88).toFixed(2);
    if (topBar) topBar.style.width = Math.round(pct * 100) + '%';
    if (swordBl) swordBl.style.clipPath = 'inset(0 ' + (100 - pct * 100) + '% 0 0)';
    if (swordTx) swordTx.textContent = 'القراءة ' + arDigits(Math.round(pct * 100)) + '٪';
  }
  window.__paintProgress = paintProgress;

  /* ---------- نظام الأوسمة ---------- */
  var BADGES = [
    { id: 'start', ic: '🌱', n: 'نَبتُ الطريق', d: 'ابدأ أول حقبة' },
    { id: 'prophets', ic: '📜', n: 'وسام النبوة', d: 'أنبياء' },
    { id: 'seerah', ic: '🕊️', n: 'وسام الرحمة', d: 'السيرة' },
    { id: 'rashidun', ic: '⚔️', n: 'وسام الفاروق', d: 'الراشدون' },
    { id: 'umayyad', ic: '🏛️', n: 'وسام البناء', d: 'الأمويه' },
    { id: 'andalus', ic: '🏰', n: 'وسام الأندلس', d: 'الأندلس' },
    { id: 'abbasid', ic: '📚', n: 'وسام الفجر', d: 'العباسيه' },
    { id: 'crusades', ic: '🛡️', n: 'وسام حطين', d: 'الصليبيون' },
    { id: 'mamluk', ic: '🐎', n: 'وسام النصر', d: 'المماليك' },
    { id: 'ottoman', ic: '🕌', n: 'وسام السلطان', d: 'العثمانيون' },
    { id: 'civilization', ic: '🔬', n: 'وسام العقل', d: 'الحضاره' },
    { id: 'modern', ic: '🕰️', n: 'وسام التاريخ', d: 'العصر الحديث' },
    { id: 'all', ic: '👑', n: 'تاج المؤرخ', d: 'كل الحقب' }
  ];
  window.refreshBadges = function () {
    var bm = JSON.parse(localStorage.getItem(STORE) || '[]');
    var host = document.getElementById('badges');
    if (!host) return;
    var done = BADGES.filter(function (b) {
      return b.id === 'start' ? bm.length >= 1
        : b.id === 'all' ? bm.length >= 12 : bm.indexOf(b.id) >= 0;
    }).map(function (b) { return b.id; });
    var pct = Math.round(done.length / BADGES.length * 100);
    document.querySelectorAll('#badges .bg').forEach(function (el) {
      el.classList.toggle('on', done.indexOf(el.dataset.b) >= 0);
    });
    var c = document.getElementById('bcnt');
    if (c) c.textContent = arDigits(done.length) + ' من ' + arDigits(BADGES.length);
    var pb = document.getElementById('bprog');
    if (pb) pb.style.width = pct + '%';
  };
  window.refreshBadges();

  /* ---------- إخفاء المفضلة ---------- */
  var f = document.getElementById('favBtn');
  if (f) {
    f.textContent = JSON.parse(localStorage.getItem(STORE) || '[]')
      .indexOf(document.body.dataset.page) >= 0 ? '★' : '☆';
    f.addEventListener('click', function () {
      var id = document.body.dataset.page;

  }

/* ==========================================================
   قارئ الكتاب — تقسيم المحتوى إلى صفحات بلا تمرير عمودي

(function () {

  var R = {

  /* ---------- ١) التهيئة ---------- */
  function setup() {

    R.pageH = Math.floor(R.stageH - 8);

  /* ---------- ٣) تحويل HTML إلى كتل ---------- */
  function buildUnits() {

      return { ui: ui, u: u.u, id: u.id, n: u.n, ic: u.ic || '', blocks: blocks };
    });
