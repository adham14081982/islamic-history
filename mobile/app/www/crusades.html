علهم يُخطئون في القرار. وكان في هذا الجيش ما جعل الصليبيين يثقون بأنهم يستطيعون أن يهزموا صلاح الدين في ميدانٍ مفتوح، وكان في هذه الثقة ما جعلهم يخرجون من مدنهم ويتركون حصونهم، وكان في هذا ما جعل صلاح الدين يستدرجهم إلى حيثُ يُريد، وأن من أراد أن يهزم عدوّاً فليُقنعه أولاً أنه أقوى منه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان صلاح الدين قد اختار موقع حطين بعناية، فقد كان قرنانِ يُطوّقان ساحةً ضيّقة، وكان في هذا الموقع ما جعل الصليبيين لا يستطيعون أن ينشروا فرسانهم على اتساع. وكان في هذا ما يُبيّن أن اختيار الأرض قد يكون أهم من عدد الجنود، وأن من أراد أن يهزم جيشاً مدرّعاً فليُقاتله في مكانٍ لا يُتيح له حركته. وكان في هذا الموقع ما جعل الفرسان المدرّعين لا يستطيعون أن ينتشروا، وكان في هذا ما جعل تفوّقهم في السلاح بلا قيمة، وأن من أراد أن يُواجه قوةً مدرّعة فليختر أرضاً لا تُناسبها لا أن يواجهها في أرضٍ تُناسبها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد استدرج صلاح الدين الصليبيين إلى الموقع، فقد كانوا في حرارة يوليو بلا ماء، وكان الجيش الصليبي قد سار في يومٍ حارّ حتى وصل إلى ساحة المعركة وهو مُنهك، وكان في هذا ما جعل المعركة تُحسم قبل أن تبدأ. وكان في هذا ما يُبيّن أن الحرب ليست قتالاً فقط بل إدارة تعبٍ وعطشٍ ووقت. وكان في هذا الاستدراج ما جعل الجيش الصليبي يقطع مسافةً طويلةً في حرارةٍ شديدة، وكان في هذا ما جعل رجاله يصلون إلى المعركة وهم لا يستطيعون الوقوف، وكان في هذا ما يُبيّن أن الحرب تُحسم أحياناً بالتعب لا بالسيف، وأن من أراد أن يهزم جيشاً فليُنهكه قبل أن يُقاتله.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي الرابع من يوليو ١١٨٧ بدأت المعركة، وكان صلاح الدين قد أشعل النار في الأعشاب الجافة حول الجيش الصليبي، وكان في هذا ما جعل الدخان يُخنقهم والعطش يقتلهم. وكان في هذا التكتيك ما يُبيّن أن العقل قد يغلب العدد، وأن من عرف نقطة ضعف عدوّه لا يحتاج إلى قوةٍ أكبر منه. وكان في هذا التكتيك ما جعل الجيش الصليبي يفقد قدرته على الرؤية والتنفّس، وكان في هذا ما جعل صفوفه تتصدّع بلا قتالٍ مباشر، وكان في هذا ما يُبيّن أن العقل قد يغلب العدد، وأن من عرف نقطة ضعف عدوّه لا يحتاج إلى قوةٍ أكبر منه، بل يحتاج إلى أن يستخدم ما يعرفه في الوقت المناسب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد انهار الجيش الصليبي في ساعات، وقُتل منه عددٌ كبير، وأُسر الباقي، وكان في هذه الهزيمة ما جعل مملكة القدس تفقد جيشها كله في يومٍ واحد. وكان في هذا ما يُبيّن أن الجيش إذا دُمّر في معركةٍ واحدةٍ لا يُمكن إعادة بنائه إلا بجيلٍ جديد، وأن المعركة الحاسمة تُنهي حرباً لا تُنهي معركة. وكان في هذه الهزيمة ما جعل مملكة القدس تفقد جيشها كله في يومٍ واحد، وكان في هذا ما جعل المدن التي كانت تُدافع عنها بلا حاميةٍ تُصبح لقمةً سائغة، وكان في هذا ما يُبيّن أن الجيش إذا دُمّر في معركةٍ واحدةٍ لا يُمكن إعادة بنائه إلا بجيلٍ جديد، وأن المعركة الحاسمة تُنهي حرباً لا معركة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أُسر الملك غي دي لوزينيان، وأُسر أرناط، وقد أمر صلاح الدين بقتل أرناط بيده أو بأمره، لأنه كان قد قتل المسلمين في قافلته، وكان في هذا القتل ما جعل صلاح الدين يفي بقسمه. وكان في هذا ما يُبيّن أن العفو في موضع القدرة شجاعة، ولكنه لا يشمل من قتل بلا حقٍّ وأصرّ على عدائه. وكان في أسر الملك غي ما جعل الصليبيين يفقدون قائدهم الأعلى، وكان في هذا ما جعل مملكة القدس بلا رأسٍ يُديرها، وكان في هذا ما يُبيّن أن أسر القائد قد يكون أخطر من قتله، لأن القتيل يُخلّف وريثاً والأسير يُخلّف فراغاً، وأن من أراد أن يُنهي دولةً فليأسر من يُديرها لا من يُقاتل فيها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في معاملة صلاح الدين للأسرى ما جعل سمعته تنتشر في أوروبا نفسها: فقد أكرم الملك غي، وأرسل له الماء البارد، وقال «الملِك لا يُقتل»، وكان في هذا الكرم ما جعل بعض الأوروبيين يكتبون عنه بإعجاب. وكان في هذا ما يُبيّن أن الكرم في الحرب سلاحٌ نفسي قد يكون أقوى من السيف. وكان في هذا القتل ما جعل صلاح الدين يفي بقسمه، وكان في هذا ما يُبيّن أن العفو في موضع القدرة شجاعة، ولكنه لا يشمل من قتل بلا حقٍّ وأصرّ على عدائه، وأن الرحمة التي تُطلق القاتل تُشجّع القتل، وأن العدل قد يكون في القتل كما يكون في العفو.\u003c/p\u003e\u003cp class=\"ap\"\u003eوبعد حطين لم تكن هناك قوةٌ صليبية قادرة على المقاومة، فسقطت عكا ويافا وصيدا وبيروت ونابلس، وكان في هذا السقوط السريع ما جعل القدس في متناول اليد. وكان في هذا ما يُبيّن أن النصر الكبير يُغيّر الخريطة بسرعة، وأن من أراد أن يستفيد من نصره فليُسرع قبل أن يُعيد العدوّ تنظيم نفسه. وكان في هذا الكرم ما جعل بعض الأسرى الصليبيين يُسلمون أو يُعجبون، وكان في هذا ما جعل سيرة صلاح الدين تصل إلى أوروبا في حياته، وكان في هذا ما يُبيّن أن السمعة تُبنى في ساحة المعركة لا في البلاط، وأن من أراد أن ينتصر على عدوّه في التاريخ فليكن أفضل منه في الأخلاق.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي أكتوبر ١١٨٧ سُلّمت القدس إلى صلاح الدين، وكان قد حاصرها أياماً، وكان أهلها قد طلبوا الأمان، فأعطاهم الأمان على أن يدفعوا فديةً عن أنفسهم، وكان في هذا التسليم ما جعل المدينة تسقط بلا مذبحة. وكان في هذا ما يُبيّن أن صلاح الدين أراد أن يكون تحريره نقيضاً لفتح الصليبيين، وأن من أراد أن يُصحّح ظلماً فليفعل عكس ما فعله الظالم. وكان في هذا السقوط السريع ما جعل مملكة القدس تفقد مدنها في أسابيع، وكان في هذا ما جعل الصليبيين لا يستطيعون أن يُعيدوا تنظيم أنفسهم إلا في صور وعكا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في تسليم القدس ما جعل المسلمين يفرحون فرحاً لم يعرفوه منذ قرن، وكان في هذا ما جعل صلاح الدين يُصبح أعظم شخصيةٍ في العالم الإسلامي. وكان في هذا ما يُبيّن أن الرمز قد يكون أقوى من الأرض، وأن من يُحرّر مكاناً مقدّساً يحكم قلوب الناس أكثر مما يحكم البلاد. وكان في هذا التسليم ما جعل صلاح الدين يُصبح أعظم شخصيةٍ في العالم الإسلامي، وكان في هذا ما جعل الخلافة العباسية تُقرّه على ما فعل، وكان في هذا ما يُبيّن أن من يُحرّر مكاناً مقدّساً يحكم قلوب الناس أكثر مما يحكم البلاد، وأن الرمز قد يكون أقوى من الأرض، وأن من أراد أن يبقى في الذاكرة فليُحرّر ما في القلوب لا ما على الخرائط.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eلماذا انتُصر في حطين؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eانتُصر صلاح الدين في حطين لأنه جاء بجيشٍ موحّد بعد ثلاث عشرة سنة من بناء الوحدة، ولأنه اختار الأرض التي تُقيّد الفرسان المدرّعين، ولأنه استدرج العدوّ إلى موقعٍ بلا ماء في يومٍ حارّ. وكان في هذه العوامل ما يُبيّن أن النصر لم يكن معجزةً بل نتيجة إعدادٍ طويل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في المعركة عاملٌ رابع: أن الصليبيين كانوا مُنقسمين، فمنهم من أراد القتال ومنهم من أراد الانتظار، وكان في هذا الانقسام ما جعل قرارهم ضعيفاً. وكان في هذا ما يُبيّن أن العدوّ المُنقسم أضعف من العدوّ القليل، وأن من أراد أن ينتصر فليُراقب خلافات خصومه لا عددهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في المعركة عاملٌ خامس: أن صلاح الدين كان يعرف أنه لا يُريد أن يُقاتل معركةً أخرى، فقد كان جيشه كل ما يملك، وكان في هذا ما جعل قراره حاسماً. وكان في هذا ما يُبيّن أن من يُقاتل بكل ما يملك يُقاتل بحكمةٍ لا بتهوّر، وأن من عرف قيمة ما يملك حافظ عليه.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالقدس: تحريرٌ بلا مذبحة\u003c/h4\u003e\u003cp class=\"ap\"\u003eلمّا سُلّمت القدس لم تقع فيها مذبحة، بل أُعطي أهلها الأمان على فدية، وكان في هذا ما جعل صلاح الدين يُصبح مثالاً في التسامح حتى عند خصومه. وكان في هذا ما يُبيّن أن من أراد أن يُصحّح ظلماً فليفعل عكس ما فعله الظالم، وأن العفو في موضع القدرة يُعطي صاحبه سلطةً أخلاقيةً لا تُشترى.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في تسليم القدس ما جعل بعض المسلمين يلومون صلاح الدين على اللين، وكان في هذا اللوم ما يُبيّن أن الرحمة قد لا تُفهم في لحظة الانتصار. وكان في هذا ما يُبيّن أن القائد قد يُواجه نقداً من أتباعه على أخلاقه لا على أخطائه، وأن من أراد أن يبقى إنساناً في الحرب فليتحمّل لوم من لا يفهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في تحرير القدس ما جعل المدينة تعود إلى المسلمين بعد ثمانٍ وثمانين سنة، وكان في هذا ما جعل صلاح الدين يُصبح رمزاً في الوجدان الإسلامي. وكان في هذا ما يُبيّن أن الرمز قد يكون أقوى من الأرض، وأن من يُحرّر مكاناً مقدّساً يحكم قلوب الناس أكثر مما يحكم البلاد.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالكرم في موضع القدرة\u003c/h4\u003e\u003cp class=\"ap\"\u003eأكرم صلاح الدين الملك الأسير وأرسل له الماء البارد، وقال «الملِك لا يُقتل»، وكان في هذا الكرم ما جعل سمعته تنتشر في أوروبا نفسها. وكان في هذا ما يُبيّن أن الكرم في الحرب سلاحٌ نفسي قد يكون أقوى من السيف، وأن من أراد أن يُهزم عدوّه فليُعطه صورةً عن نفسه لا يستطيع أن يكرهها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في معاملته للأسرى ما جعل بعض الأوروبيين يكتبون عنه بإعجاب، وكان في هذا ما جعل صورته في المصادر الأوروبية أفضل من صورة كثيرٍ من قادة أوروبا. وكان في هذا ما يُبيّن أن الأخلاق قد تُغيّر رأي العدوّ فيك، وأن من أراد أن ينتصر على عدوّه في التاريخ فليكن أفضل منه في الأخلاق.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا الكرم أيضاً ما جعل بعض المسلمين يقولون إنه أضعف من أن ينتقم، وكان في هذا القول ما يُبيّن أن الرحمة قد تُفهم ضعفاً. وكان في هذا ما يُبيّن أن من أراد أن يكون رحيماً فليتحمّل أن يُوصف بالضعف، وأن التاريخ يحفظ الرحمة وينسى اللوم. وكان في هذا اللوم ما جعل صلاح الدين يُبيّن أن ما فعله كان لحفظ الأرواح لا للضعف، وكان في هذا ما يُبيّن أن القائد قد يُواجه نقداً على أخلاقه لا على أخطائه.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eحطين\u003c/b\u003e\u003cspan\u003e٤ يوليو ١١٨٧، تدمير الجيش الصليبي وأسر الملك غي\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأرناط\u003c/b\u003e\u003cspan\u003eقُتل بأمر صلاح الدين لأنه قتل المسلمين في قافلة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمدن\u003c/b\u003e\u003cspan\u003eعكا ويافا وصيدا وبيروت ونابلس سقطت بعد المعركة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالقدس\u003c/b\u003e\u003cspan\u003eسُلّمت في أكتوبر ١١٨٧ بأمانٍ وفدية، بلا مذبحة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمدة\u003c/b\u003e\u003cspan\u003eثمانٍ وثمانون سنة بين سقوطها ١٠٩٩ وتحريرها ١١٨٧\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالعامل\u003c/th\u003e\u003cth\u003eأثره في حطين\u003c/th\u003e\u003cth\u003eالدرس\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالوحدة\u003c/td\u003e\u003ctd\u003eجيشٌ من مصر والشام والجزيرة\u003c/td\u003e\u003ctd\u003eالمعركة تُحسم قبل أن تبدأ\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالأرض\u003c/td\u003e\u003ctd\u003eقرنان يُقيّدان الفرسان\u003c/td\u003e\u003ctd\u003eاختيار الموقع أهم من العدد\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالعطش والحرارة\u003c/td\u003e\u003ctd\u003eالجيش الصليبي وصل مُنهكاً\u003c/td\u003e\u003ctd\u003eالحرب إدارة تعبٍ ووقت\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eانقسام الصليبيين\u003c/td\u003e\u003ctd\u003eقرارٌ ضعيف ومتأخّر\u003c/td\u003e\u003ctd\u003eخلاف الخصم سلاحٌ لك\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالكرم بعد النصر\u003c/td\u003e\u003ctd\u003eسمعةٌ انتشرت في أوروبا\u003c/td\u003e\u003ctd\u003eالأخلاق تُغيّر رأي العدوّ\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eالملِك لا يُقتل.\u003c/p\u003e\u003ccite\u003eصلاح الدين في معاملته الملك غي دي لوزينيان بعد حطين سنة ١١٨٧\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eفي الرابع من يوليو ١١٨٧ دُمّر الجيش الصليبي في حطين: جيشٌ موحّد، وأرضٌ مُختارة، وعطشٌ وحرارة، واستدراجٌ إلى موقعٍ بلا ماء. وأُسر الملك غي وقُتل أرناط، ثم سقطت المدن واحدةً واحدةً، وسُلّمت القدس في أكتوبر ١١٨٧ بأمانٍ وفديةٍ بلا مذبحة، فانتهت ثمانٍ وثمانون سنة. وكان في الكرم بعد النصر ما جعل سمعة صلاح الدين تنتشر في أوروبا نفسها.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"third-crusade","n":"الحملة الثالثة ووفاة صلاح الدين","ic":"🌊","part":"القسم الثالث: صلاح الدين والتحرير","h":"\u003carticle class=\"ch3\" id=\"third-crusade\" data-toc=\"الحملة الثالثة ووفاة صلاح الدين\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٣.٤\u003c/span\u003e\n          \u003ch3\u003e🌊 الحملة الثالثة ووفاة صلاح الدين\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eل\u003c/span\u003eم يمرّ عامٌ على تحرير القدس حتى أعلنت أوروبا حملةً ثالثة، خرج فيها ثلاثة ملوك: فريدريك بربروسا الذي غرق في الطريق، وفيليب أغسطس الذي عاد إلى بلاده، وريتشارد قلب الأسد الذي قاتل صلاح الدين سنتين ولم يسترد القدس. وانتهت الحملة بصلح الرملة سنة ١١٩٢، ثم مات صلاح الدين في دمشق سنة ١١٩٣.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eلمّا بلغ أوروبا خبر سقوط القدس، كان الأثر أشدّ من أثر سقوط الرها قبل أربعين سنة، وكان في هذا الأثر ما جعل البابا يُعلن حملةً ثالثة، وكان في هذا ما جعل ثلاثة ملوكٍ يخرجون في وقتٍ واحد. وكان في هذا ما يُبيّن أن الفقدان الكبير يُحرّك أوروبا أكثر من الخسائر الصغيرة، وأن الرمز إذا سقط تحرّكت الأمم. وكان في هذا الأثر ما جعل أوروبا تُعيد تجربة الحملة الأولى بعد قرنٍ تقريباً، وكان في هذا ما يُبيّن أن الذاكرة الدينية في أوروبا كانت أقوى من الحسابات السياسية، وأن من أراد أن يفهم الحملات الصليبية فليفهم أولاً قوة الرمز في الوجدان.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان أول من خرج فريدريك بربروسا إمبراطور ألمانيا، وكان أكبرهم سناً وأقواهم جيشاً، وكان في خروجه ما جعل المسلمين يخافون، ولكن فريدريك غرق في نهرٍ في آسيا الصغرى سنة ١١٩٠، فتفرّق جيشه. وكان في هذا ما يُبيّن أن التاريخ قد يُغيّر مساره بحادثٍ عابر، وأن من أراد أن يحسب حساب كل شيءٍ لا يستطيع أن يحسب الموت. وكان في موت فريدريك في النهر ما جعل الحملة تفقد قائدها الأكبر في الطريق، وكان في هذا ما يُبيّن أن التاريخ قد يُغيّر مساره بحادثٍ عابر، وأن من أراد أن يحسب حساب كل شيءٍ لا يستطيع أن يحسب الموت.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان فيليب أغسطس ملك فرنسا قد خرج مع ريتشارد، وكانا مُتنازعين قبل الخروج، وكان في هذا التنازع ما جعل الحملة تبدأ بانقسام. وكان في هذا ما يُبيّن أن التحالفات التي تُبنى على كراهيةٍ متبادلة لا تبقى، وأن من أراد أن ينتصر فليكن فريقه متّحداً قبل أن يكون عدوّه ضعيفاً. وكان في هذا التنازع ما جعل الحملة تبدأ بانقسامٍ لا يُشفى، وكان في هذا ما جعل ريتشارد يُقاتل بلا حليفٍ قوي، وكان في هذا ما يُبيّن أن التحالفات التي تُبنى على كراهيةٍ متبادلة لا تبقى، وأن من أراد أن ينتصر فليكن فريقه متّحداً قبل أن يكون عدوّه ضعيفاً، وأن الخلاف الداخلي يأكل من قوة الجيش أكثر مما يأكل العدوّ.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان ريتشارد قلب الأسد أعظم قادة الحملة، وكان شجاعاً إلى حدّ التهوّر، وكان في شخصيته ما جعل المسلمين يُعجبون به، وكان في هذا ما يُبيّن أن الشجاعة قد تُكسب صاحبها احترام عدوّه، وأن الحرب قد تُنتج علاقاتٍ غريبة بين الخصوم. وكان في شخصية ريتشارد ما جعل المسلمين يخشونه ويُعجبون به في الوقت نفسه، وكان في هذا ما يُبيّن أن الشجاعة قد تُكسب صاحبها احترام عدوّه، وأن الحرب قد تُنتج علاقاتٍ غريبة بين الخصوم، وأن القائد الذي يُقاتل بشرفٍ يُصبح محترماً حتى عند من يُقاتله، وأن التاريخ قد يُنصف الخصمين معاً إذا كانا أهلًا للإنصاف.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد حاصر الصليبيون عكا، وكان حصارها طويلاً، وكان صلاح الدين يُحاول أن يفكّ الحصار ويُشتبك معهم في معارك صغيرة، وكان في هذا الحصار ما جعل الطرفين يستهلكان قوتهما. وكان في هذا ما يُبيّن أن الحصار قد يكون أشدّ من المعركة، وأن من أراد أن يُقاوم حصاراً فليكن لديه ما يُطيل صبره. وكان في هذا الحصار ما جعل الطرفين يستهلكان قوتهما في مكانٍ واحد، وكان في هذا ما جعل صلاح الدين لا يستطيع أن يُقاتل معركةً حاسمةً في مكانٍ آخر، وكان في هذا ما يُبيّن أن الحصار قد يكون أشدّ من المعركة، وأن من أراد أن يُقاوم حصاراً فليكن لديه ما يُطيل صبره، وأن الصبر في الحصار سلاحٌ لا يقلّ عن السيف في الميدان.\u003c/p\u003e\u003cp class=\"ap\"\u003eوسقطت عكا سنة ١١٩١، وكان في سقوطها ما جعل الصليبيين يستعيدون قاعدةً ساحلية، وكان في هذا ما جعل الحرب تطول. وكان في سقوطها أيضاً ما جعل ريتشارد يُخطئ خطأً فادحاً: فقد أمر بقتل أسرى المسلمين بعد أن تأخّر صلاح الدين في دفع الفدية، وكان في هذا ما جعل صورته تهتزّ حتى عند من كان يُعجب به. وكان في قتل الأسرى ما جعل سمعة ريتشارد تتلوّث في الشرق والغرب معاً، وكان في هذا ما جعل بعض الأوروبيين ينتقدونه، وكان في هذا ما يُبيّن أن القتل في الحرب لا يُبرّره الغضب، وأن من أراد أن يبقى محترماً فليحفظ عهده ولو كان خصمه مُتباطئاً، وأن الفظائع تُسجّل على صاحبها لا على من استفزّه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت معركة أرسوف في سبتمبر ١١٩١، وكان ريتشارد قد انتصر فيها على جيش صلاح الدين، وكان في هذا الانتصار ما جعل الصليبيين يستعيدون زخمهم، وكان في هذا ما يُبيّن أن صلاح الدين لم يكن معصوماً من الهزيمة، وأن من يُقاتل عشرة أعوامٍ لا بد أن يخسر بعض المعارك. وكان في هذا الانتصار ما جعل الصليبيين يستعيدون زخمهم، وكان في هذا ما جعل ريتشارد يفكّر في الزحف إلى القدس، وكان في هذا ما يُبيّن أن صلاح الدين لم يكن معصوماً من الهزيمة، وأن من يُقاتل عشرة أعوامٍ لا بد أن يخسر بعض المعارك، وأن العبرة ليست في ألا تُهزم بل في أن تُعيد ترتيب نفسك بعد الهزيمة، وأن من عرف كيف يخسر لم يخسر كل شيء.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان صلاح الدين بعد أرسوف قد غيّر أسلوبه: فبدل أن يُقاتل معركةً مفتوحةً، بدأ يُدمّر الحصون ويُفرّغ المدن ويستنزف الصليبيين، وكان في هذا الأسلوب ما جعل ريتشارد لا يستطيع أن يتقدّم إلى القدس. وكان في هذا ما يُبيّن أن من لا يستطيع أن ينتصر في الميدان قد ينتصر بالصبر، وأن الأرض قد تُدافع عنها بالخراب لا بالسيف. وكان في هذا التحوّل ما جعل ريتشارد يفقد ما انتصر به، لأن الأرض التي دمّرها لم تكن له، وكان في هذا ما يُبيّن أن الانتصار في الميدان لا يُغني إذا لم يكن له ما يُثبّته على الأرض.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا الأسلوب ما جعل ريتشارد يصل إلى مشارف القدس مرتين ولا يدخلها، لأنه كان يعلم أن جيشه لا يستطيع أن يحاصر مدينةً محصّنةً وهو بعيد عن ساحله. وكان في هذا ما يُبيّن أن الحرب ليست شجاعةً فقط بل حساباً لخطوط الإمداد، وأن من أطال خطوطه فقد خسر نصف معركته. وكان في هذا الحساب ما جعل ريتشارد يتراجع مرتين، وكان في هذا ما يُبيّن أن الحرب ليست شجاعةً فقط بل حساباً لخطوط الإمداد، وأن من أطال خطوطه فقد خسر نصف معركته، وأن القائد الذي لا يفهم الجغرافيا قد ينتصر في كل معركةٍ ويخسر الحرب، وأن الحكمة أحياناً في ألا تُقاتل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سنة ١١٩٢ جرى صلح الرملة بين صلاح الدين وريتشارد، وكان في هذا الصلح ما جعل الحرب تنتهي بلا فتحٍ كاملٍ لأحد الطرفين: فقد بقي القدس في يد المسلمين، وبقيت المدن الساحلية في يد الصليبيين، وأُذن للحجّاج المسيحيين بزيارة القدس. وكان في هذا الصلح ما يُبيّن أن الحروب الطويلة تنتهي غالباً بتسويةٍ لا بنصرٍ حاسم. وكان في هذا الصلح ما جعل الطرفين يُقرّان بأن الحرب لا تُحسم، وكان في هذا ما جعل صلاح الدين يحفظ القدس، وريتشارد يحفظ وجهه، وكان في هذا ما يُبيّن أن الصلح قد يكون نصراً للطرفين إذا كان كلٌّ منهما قد وصل إلى حدّ طاقته.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا الصلح ما جعل بعض المسلمين يغضبون، لأنهم أرادوا أن يُطرد الصليبيون من الساحل أيضاً، وكان في هذا الغضب ما جعل صلاح الدين يُوضّح أن جيشه قد أنهكته الحرب. وكان في هذا ما يُبيّن أن القائد قد يُضطر إلى صلحٍ لا يُرضي كل الناس، وأن من أراد أن يحكم فليتحمّل لوم من لا يرى الخريطة كلها. وكان في هذا الغضب ما جعل صلاح الدين يُدرك أن الناس لا يرون الخريطة كلها، وكان في هذا ما جعل بعضهم يقول إنه ضيّع ما كسبه في حطين، وكان في هذا ما يُبيّن أن القائد قد يُلام على حكمته أكثر مما يُلام على أخطائه، وأن من أراد أن يحكم فليتحمّل لوم من لا يرى ما يرى.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد مات صلاح الدين في دمشق في مارس ١١٩٣، وكان في الخامسة والخمسين، وكان قد أنفق ما في خزينته، فلم يجدوا ما يكفي لتكفينه، وكان في هذا ما جعل صورته في الوجدان الإسلامي صورة الزاهد لا صورة الملك. وكان في هذا ما يُبيّن أن من أعطى كل شيءٍ في حياته لا يترك شيئاً عند موته، وأن الزهد الحقيقي هو الذي يُرى في الخزينة لا في الكلام. وكان في هذا ما جعل صورته في الوجدان الإسلامي صورة الزاهد لا صورة الملك، وكان في هذا ما جعل بعض الناس يقولون إنه كان أعظم من أن يجمع المال، وكان في هذا ما يُبيّن أن الزهد الحقيقي هو الذي يُرى في الخزينة لا في الكلام.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في موته ما جعل الدولة الأيوبية تتصدّع بين أبنائه وإخوته، وكان في هذا ما جعل الصليبيين يبقون على الساحل قرناً آخر، وكان في هذا ما يُبيّن أن الوحدة التي تُبنى على شخصٍ واحدٍ لا تبقى بعده، وأن صلاح الدين نفسه لم يُؤسّس نظاماً يمنع الاقتسام بعد موته. وكان في هذا التصدّع ما جعل الصليبيين يبقون على الساحل قرناً آخر، وكان في هذا ما جعل الأيوبيين يتنازعون على العرش بعد أن كانوا يُوحّدون الجبهة، وكان في هذا ما يُبيّن أن الوحدة التي تُبنى على شخصٍ واحدٍ لا تبقى بعده، وأن صلاح الدين نفسه لم يُؤسّس نظاماً يمنع الاقتسام، وأن أعظم ما يتركه القائد ليس ما بناه بل النظام الذي يمنع ما بناه من الانهيار.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eثلاثة ملوك وحملة واحدة\u003c/h4\u003e\u003cp class=\"ap\"\u003eخرج في الحملة الثالثة ثلاثة ملوكٍ من أكبر ملوك أوروبا، وكان في هذا الخروج ما جعل الحملة تبدو أعظم من كل ما سبقها، ولكنها في الحقيقة كانت أضعف من أن تُحقّق هدفها. وكان في هذا ما يُبيّن أن العدد الكبير لا يُغني إذا لم يكن هناك قائدٌ واحدٌ وهدفٌ واضح. وكان في هذا الخروج ما جعل الحملة تبدو أعظم من كل ما سبقها، ولكنها كانت أضعف من أن تُحقّق هدفها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوغرق فريدريك بربروسا في الطريق، ففقدت الحملة أكبر جيوشها، وكان في هذا ما يُبيّن أن المصادفة قد تُغيّر مسار التاريخ أكثر من الخطط. وكان في هذا ما جعل الألمان يعودون إلى بلادهم، وكان في هذا ما جعل الحملة تعتمد على الإنجليز والفرنسيين وحدهم. وكان في هذا الغرق ما جعل الألمان يعودون إلى بلادهم، وكان في هذا ما جعل الحملة تعتمد على الإنجليز والفرنسيين وحدهم، وأن من خطّط لجيشٍ كبيرٍ قد يفقده في نهرٍ صغير.\u003c/p\u003e\u003cp class=\"ap\"\u003eوتنازع فيليب وريتشارد، فعاد فيليب إلى بلاده بعد سقوط عكا، وكان في هذا ما جعل الحملة تفقد نصف قوّتها، وكان في هذا ما جعل ريتشارد يُقاتل وحده. وكان في هذا ما يُبيّن أن التحالف الذي لا يقوم على مصلحةٍ مشتركةٍ واضحةٍ لا يبقى إذا طال، وأن من أراد أن يُقاتل مع حليفٍ فليُحدّد معه الهدف قبل الطريق.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eاستنزاف ريتشارد\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يستطع صلاح الدين أن يهزم ريتشارد في معركةٍ مفتوحة، فغيّر أسلوبه: بدأ يُدمّر الحصون ويُفرّغ المدن ويقطع الإمداد، وكان في هذا الأسلوب ما جعل ريتشارد لا يستطيع أن يتقدّم إلى القدس. وكان في هذا ما يُبيّن أن من لا يستطيع أن ينتصر في الميدان قد ينتصر بالصبر، وأن الأرض قد تُدافع عنها بالخراب لا بالسيف.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا الأسلوب كلفةٌ كبيرة: فقد دُمّرت مدنٌ وحصونٌ كانت للمسلمين، وكان في هذه الكلفة ما جعل بعض المؤرّخين ينتقدون صلاح الدين. وكان في هذا ما يُبيّن أن كل استراتيجية لها ثمن، وأن من أراد أن يُدافع عن أرضٍ فقد يُضطر إلى تخريب جزءٍ منها. وكان في هذه الكلفة ما جعل بعض المؤرّخين ينتقدون صلاح الدين، وكان في هذا ما يُبيّن أن كل استراتيجية لها ثمن، وأن من أراد أن يُدافع عن أرضٍ فقد يُضطر إلى تخريب جزءٍ منها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا الأسلوب ما جعل ريتشارد يصل إلى مشارف القدس ولا يدخلها، لأنه كان يعلم أن جيشه لا يستطيع أن يحاصر مدينةً محصّنةً وهو بعيد عن ساحله. وكان في هذا ما يُبيّن أن الحرب ليست شجاعةً فقط بل حساباً لخطوط الإمداد، وأن من أطال خطوطه فقد خسر نصف معركته.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eصلح الرملة وموت صلاح الدين\u003c/h4\u003e\u003cp class=\"ap\"\u003eانتهت الحملة الثالثة بصلح الرملة سنة ١١٩٢، وبقي القدس في يد المسلمين، وبقيت المدن الساحلية في يد الصليبيين، وأُذن للحجّاج بزيارة القدس. وكان في هذا الصلح ما يُبيّن أن الحروب الطويلة تنتهي غالباً بتسويةٍ لا بنصرٍ حاسم، وأن من أراد كل شيءٍ قد لا يحصل على شيء.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في الصلح ما جعل بعض المسلمين يغضبون، وكان في هذا الغضب ما جعل صلاح الدين يُوضّح أن جيشه قد أنهكته الحرب. وكان في هذا ما يُبيّن أن القائد قد يُضطر إلى صلحٍ لا يُرضي كل الناس، وأن من أراد أن يحكم فليتحمّل لوم من لا يرى الخريطة كلها. وكان في هذا الغضب ما جعل صلاح الدين يُوضّح أن جيشه قد أنهكته الحرب، وكان في هذا ما يُبيّن أن القائد قد يُضطر إلى صلحٍ لا يُرضي كل الناس.\u003c/p\u003e\u003cp class=\"ap\"\u003eومات صلاح الدين سنة ١١٩٣ ولم يترك ما يكفي لتكفينه، وكان في هذا ما جعل صورته في الوجدان صورة الزاهد لا صورة الملك. وكان في موته ما جعل الدولة تتصدّع بين ورثته، وكان في هذا ما يُبيّن أن من بنى وحدةً على شخصه لم يبنِ نظاماً يمنع اقتسامها بعده. وكان في هذا الموت ما جعل الدولة تتصدّع بين ورثته، وكان في هذا ما يُبيّن أن من بنى وحدةً على شخصه لم يبنِ نظاماً يمنع اقتسامها بعده.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالحملة الثالثة\u003c/b\u003e\u003cspan\u003e١١٨٩–١١٩٢، فريدريك وريتشارد وفيليب\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eبربروسا\u003c/b\u003e\u003cspan\u003eغرق في آسيا الصغرى ١١٩٠، فتفرّق جيشه\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eعكا\u003c/b\u003e\u003cspan\u003eسقطت ١١٩١، وأُعدم أسرى المسلمون بأمر ريتشارد\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأرسوف\u003c/b\u003e\u003cspan\u003eسبتمبر ١١٩١، انتصارٌ صليبي أوقفه صلاح الدين بالاستنزاف\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eصلح الرملة\u003c/b\u003e\u003cspan\u003e١١٩٢، القدس للمسلمين، والساحل للصليبيين، وحجٌّ مأذون\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالنتيجة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eخروج الحملة الثالثة\u003c/td\u003e\u003ctd\u003e١١٨٩\u003c/td\u003e\u003ctd\u003eثلاثة ملوك، وهدفٌ واحد، وقادةٌ متنازعون\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eغرق بربروسا\u003c/td\u003e\u003ctd\u003e١١٩٠\u003c/td\u003e\u003ctd\u003eفقدان أكبر الجيوش، وعودة الألمان\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eسقوط عكا\u003c/td\u003e\u003ctd\u003e١١٩١\u003c/td\u003e\u003ctd\u003eقاعدةٌ ساحلية للصليبيين، وإعدام أسرى المسلمين\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eأرسوف\u003c/td\u003e\u003ctd\u003e١١٩١\u003c/td\u003e\u003ctd\u003eانتصارٌ صليبي، ثم تحوّل صلاح الدين إلى الاستنزاف\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eصلح الرملة\u003c/td\u003e\u003ctd\u003e١١٩٢\u003c/td\u003e\u003ctd\u003eتسويةٌ لا نصرٌ حاسم لأحد الطرفين\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eما وجدوا في خزانته ما يكفي لتكفينه.\u003c/p\u003e\u003ccite\u003eمن روايات موت صلاح الدين سنة ١١٩٣ في دمشق\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eالحملة الثالثة خرجت بثلاثة ملوك، فغرق أعظمهم في الطريق، وتنازع الباقيان، فقاتل ريتشارد وحده سنتين. انتصر في أرسوف، لكن صلاح الدين تحوّل إلى الاستنزاف فتدمّر الحصون وأُفرغت المدن، فلم يصل ريتشارد إلى القدس. وانتهت الحرب بصلح الرملة سنة ١١٩٢: القدس للمسلمين، والساحل للصليبيين، وحجٌّ مأذون. ثم مات صلاح الدين سنة ١١٩٣ ولم يترك ما يكفي لتكفينه.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-4","n":"القسم الرابع: الحملات اللاحقة والنهاية","ic":"","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-4\" style=\"--c:#8B1A1A\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🌊\u003c/div\u003e\n      \u003ch2\u003eالقسم الرابع: الحملات اللاحقة والنهاية\u003c/h2\u003e\n      \u003cp\u003eبعد صلاح الدين لم تتوقّف الحملات، بل تغيّر طابعها: صارت أقلّ عدداً وأكثر انحرافاً، حتى انتهت الحملة الرابعة إلى تدمير القسطنطينية بدل تحرير القدس. وفي الشرق كان الأيوبيون يتنازعون، ثم جاء المغول فدمّروا بغداد، ثم انتصر المماليك في عين جالوت، ثم أُغلقت صفحة الصليبيين بسقوط عكا سنة ١٢٩١.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#fourth\"\u003eالحملة الرابعة وتدمير القسطنطينية\u003c/a\u003e\u003ca href=\"#ayyubid-fall\"\u003eسقوط الأيوبيين وصعود المماليك\u003c/a\u003e\u003ca href=\"#mongols-mamluks\"\u003eالمغول وعين جالوت\u003c/a\u003e\u003ca href=\"#acre-1291\"\u003eسقوط عكا ونهاية الوجود الصليبي\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"fourth","n":"الحملة الرابعة وتدمير القسطنطينية","ic":"⛵","part":"القسم الرابع: الحملات اللاحقة والنهاية","h":"\u003carticle class=\"ch3\" id=\"fourth\" data-toc=\"الحملة الرابعة وتدمير القسطنطينية\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٤.١\u003c/span\u003e\n          \u003ch3\u003e⛵ الحملة الرابعة وتدمير القسطنطينية\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي سنة ١٢٠٢ خرجت الحملة الرابعة لتحرير القدس، فانتهت سنة ١٢٠٤ إلى اقتحام القسطنطينية وتدميرها، وإلى إقامة دولةٍ لاتينية على أنقاض بيزنطة. وكان في هذه الحملة ما جعل الصليبيين يُقاتلون المسيحيين، وكشف أن المشروع الصليبي كان مشروعاً دنيوياً أكثر مما كان دينياً.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eبعد موت صلاح الدين سنة ١١٩٣ توقّفت الحملات الصليبية عشر سنوات، لأن أوروبا كانت مشغولةً بصراعاتها الداخلية، ولأن فشل الحملة الثالثة جعل الكثيرين يفقدون الثقة في جدوى الحملات. وكان في هذه الفترة ما جعل البابا إنوسنت الثالث يُعلن حملةً رابعة سنة ١٢٠٢، وكان في إعلانه ما جعل الحملة تخرج بجيشٍ أقلّ من سابقاته لكنه أكثر تنظيماً في نيّته الأولى.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت الحملة الرابعة قد اتّفقت مع البندقية على نقل الجيش بالسفن، وكانت البندقية مدينةً تجاريةً تُسيطر على شرق البحر المتوسط، وكان في هذا الاتفاق ما جعل الحملة رهينةً في يد تجارٍ لا في يد كنيسة. وكان في هذا ما يُبيّن أن من يُموّل الحرب قد يُوجّهها، وأن الجيوش التي تُشترى سفنها قد تُشترى وجهتها أيضاً. وكانت البندقية في ذلك الوقت قوةً بحريةً لا تُنافس، وكان دوجها إنريكو داندولو شيخاً أعمى لكنه كان من أذكى سياسيي عصره، وكان في هذا التحالف ما جعل مصير الحملة في يد رجلٍ لا في يد كنيسة.\u003c/p\u003e\u003cp class=\"ap\"\u003eولم يستطع الصليبيون أن يدفعوا ثمن السفن كاملاً، فاقترح البندقيون أن يدفعوا دينهم بمساعدةٍ عسكرية في استعادة مدينة زادار على البحر الأدرياتيكي، وكانت زادار مدينةً مسيحيةً تابعةً لملك المجر، وكان في هذا الاقتراح ما جعل الحملة تُقاتل مسيحيين قبل أن تُقاتل مسلمين. وكان في هذا ما يُبيّن أن الدين قد يكون غلافاً، وأن المصلحة التجارية قد تسبق العقيدة عند الحاجة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد حاصر الصليبيون زادار وفتحوها سنة ١٢٠٢، وكان في هذا الفتح ما جعل البابا يُصدر قراراً بحرمانهم، ثم رفع الحرمان بعد ذلك، وكان في هذا ما جعل السلطة الدينية تتراجع أمام المصالح السياسية. وكان في هذا ما يُبيّن أن من يُعلن الحرمان قد لا يستطيع أن يُنفّذه إذا كان المحرومون يملكون الجيوش. وكان في هذا الحرمان ما جعل بعض الصليبيين يُغادرون الحملة، وكان في هذا ما جعل الباقين أكثر ارتباطاً بالبندقية لأنهم لم يجدوا من ينقلهم غيرها، وأن من يحتاج إلى من يُموّله يخسر استقلاله.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم جاء إلى الحملة أميرٌ بيزنطيٌّ لاجئ يُسمّى ألكسيوس، وطلب منهم أن يُعيدوه إلى عرش القسطنطينية، ووعدهم بمالٍ وجيش، وكان في هذا الطلب ما جعل الحملة تنحرف انحرافاً كاملاً عن هدفها. وكان في هذا ما يُبيّن أن الحملة التي أُعلنت لتحرير مكانٍ مقدّس قد تُصبح أداةً في صراعٍ داخلي على عرشٍ في مدينةٍ مسيحية. وكان في هذا الطلب ما جعل الحملة تُقاتل من أجل عرشٍ لا من أجل عقيدة، وكان في هذا ما يُبيّن أن الحملة التي فقدت هدفها الأصلي تصبح أداةً في يد أول من يُقدّم لها هدفاً بديلاً، ولو كان هدفاً لا علاقة له بالدين.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سنة ١٢٠٣ وصل الصليبيون إلى أسوار القسطنطينية، ودخلوها، ثم حدثت اضطراباتٌ بين السكان والجيش، فانسحب الصليبيون ثم عادوا سنة ١٢٠٤ وهاجموها هجوماً شاملاً. وكان في هذا الهجوم ما جعل أعظم مدينةٍ مسيحيةٍ في العالم تُسقط في يد جيشٍ خرج ليُحرّر مدينةً أخرى، وكان في هذا ما جعل التاريخ يُسجّل مفارقةً لا تُنسى. وكان في هذا الاقتحام ما جعل المدينة تُسقط بعد حصارٍ قصير، وكان في هذا ما يُبيّن أن أعظم المدن قد تسقط إذا كانت حاميتها ضعيفةً وسكانها مُنقسمين، وأن السور لا يحمي مدينةً أهلها غير متّفقين.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد دخل الصليبيون القسطنطينية في أبريل ١٢٠٤، ووقعت فيها مذبحةٌ ونهبٌ استمرّ أياماً، ولم تُستثنَ الكنائس ولا الأديرة ولا القصور، وكان في هذا النهب ما جعل المدينة تفقد ما جمعه أهلها في تسعة قرون. وكان في هذا ما يُبيّن أن الجيش الذي يُقاتل من أجل الغنيمة لا يُفرّق بين مقدّسٍ وغيره، وأن من أراد أن يحفظ مقدّساً فليحفظه في القلوب قبل أن يحفظه في الجدران.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في نهب القسطنطينية ما جعل بعض المؤرّخين الأوروبيين يكتبون عنه بحرجٍ شديد، وكان في هذا الحرج ما يُبيّن أن الفظائع لا تُبرّرها النيّة، وأن من يُدين مذبحة القدس لا يستطيع أن يُبرّر مذبحة القسطنطينية. وكان في هذا ما جعل بعض الغربيين يُسمّون الحملة الرابعة «العار»، وأن يُعتبر تدمير القسطنطينية جرحاً في الذاكرة المسيحية الشرقية لم يُشفَ بعد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أُقيمت بعد سقوط القسطنطينية دولةٌ لاتينية على أنقاض بيزنطة، وكانت تتكوّن من إمبراطوريةً لاتينية في القسطنطينية، ومملكة تسالونيكي، وإمارة أخايا، ودوقية الأرخبيل، وكان في هذا التقسيم ما جعل الشرق المسيحي يُقسّم كما قُسّم الشرق الإسلامي. وكان في هذا ما يُبيّن أن الضعف الداخلي يُغري الطامعين، وأن من كان في خطرٍ داخلي لا يجد من يُدافع عنه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في سقوط القسطنطينية ما جعل بيزنطة تفقد قوّتها إلى الأبد، فقد تقسّمت أراضيها بين اللاتين والبلغار والصرب، ولم تستعد المدينة إلا سنة ١٢٦١، وكانت عند استعادتها مدينةً مُدمّرةً لا عاصمةً. وكان في هذا ما يُبيّن أن الدولة قد تبقى بعد سقوط عاصمتها، ولكنها لا تعود كما كانت، وأن الجرح الكبير لا يُشفى بالاستعادة. وكان في هذا التقسيم ما جعل الحكم اللاتيني في الشرق هشّاً، لأن الإمارات كانت تتنازع كما تنازع المسلمون قبل ذلك، وكان في هذا ما يُبيّن أن الفاتحين إذا اقتسموا الفتح تنازعوا عليه كما تنازع عليه المفتوحون.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في الحملة الرابعة ما جعل فكرة الحملة الصليبية تفقد قدسيتها في نظر كثيرين، فقد صارت الحركة التي أُعلنت لتحرير القدس أداةً لتدمير مدينةٍ مسيحية، وكان في هذا ما جعل بعض الأوروبيين يُشكّكون في نيّة من يُعلن الحملات. وكان في هذا ما يُبيّن أن الفكرة إذا استُخدمت في غير موضعها فقد تفقد قوّتها، وأن الشعار لا يبقى إذا لم يُصدّقه الناس.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في الحملة الرابعة أيضاً ما جعل المسلمين يُدركون أن الخطر الصليبي لا يُقاتلهم فقط بل يُقاتل كل من حولهم، وكان في هذا ما جعل بعض الأمراء المسلمين يُعيدون النظر في تحالفاتهم مع الصليبيين. وكان في هذا ما يُبيّن أن العدوّ الذي لا يُفرّق بين خصومه قد يجعل خصومه يُدركون أنهم في خطرٍ واحد. وكان في هذا ما جعل بعض الأوروبيين يقولون إن الحملات لم تكن يوماً مشروعاً دينياً، وإنما كانت مشروعاً للتوسّع والغنيمة، وأن الدين كان غلافاً يُبرّر ما لا يُبرَّر.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eكيف انحرفت الحملة؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eانحرفت الحملة الرابعة لأنها كانت مدينةً للبندقية، ولم يكن لديها مالٌ تدفعه، وكان في هذا الدين ما جعل البندقيين يُوجّهونها إلى زادار، وكان في هذا التوجيه ما جعلها تُقاتل مدينةً مسيحية. وكان في هذا ما يُبيّن أن من يقترض لتمويل حربٍ قد يخسر وجهة حربه، وأن التمويل ليس وسيلةً محايدة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوانحرفت بعد ذلك لأن أميراً بيزنطياً وعدها بالمال إذا أعادته إلى العرش، وكان في هذا الوعد ما جعلها تُغيّر هدفها مرةً أخرى، وكان في هذا ما يُبيّن أن الحملة التي بلا قيادةٍ سياسيةٍ واضحةٍ تكون عرضةً لكل من يُقدّم لها عرضاً. وكان في هذا الوعد ما جعل الحملة تُغيّر وجهتها مرةً أخرى، وكان في هذا ما يُبيّن أن الحملة التي بلا قيادةٍ سياسيةٍ واضحةٍ تكون عرضةً لكل من يُقدّم لها عرضاً، وأن العرض المُغري قد يكون أخطر من السيف.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا الانحراف ما جعل الحملة الرابعة تُصبح عبرةً في أن الحركات الكبرى قد تُخطف من أصحابها، وأن من يُطلق مشروعاً لا يتحكّم في مساره إذا لم يُحدّد له قيادةً وأهدافاً واضحة. وكان في هذا ما جعل البابا نفسه يُحاول أن يُوقف الحملة ولم يستطع، وأن يُعلن الحرمان ولم يُنفّذه.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eنهب القسطنطينية\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان نهب القسطنطينية من أعظم الفظائع في العصور الوسطى، فقد دُمّرت كنائس وأُخذت آثار، وقُتل من السكان عددٌ كبير، وكان في هذا النهب ما جعل المدينة تفقد ما جمعته في تسعة قرون. وكان في هذا ما يُبيّن أن الجيش الذي يُقاتل من أجل الغنيمة لا يُفرّق بين مقدّسٍ وغيره.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا النهب ما جعل بعض المؤرّخين الأوروبيين يكتبون عنه بحرج، وكان في هذا الحرج ما يُبيّن أن الفظائع لا تُبرّرها النيّة، وأن من يُدين مذبحةً لا يستطيع أن يُبرّر أخرى. وكان في هذا ما جعل بعضهم يُسمّون الحملة الرابعة «العار»، وأن يُعتبر تدمير القسطنطينية جرحاً في الذاكرة المسيحية الشرقية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا أيضاً ما جعل العلاقة بين الشرق المسيحي والغرب المسيحي تتدهور قروناً، وكان في هذا ما يُبيّن أن العداء بين من يُشتركون في الدين قد يكون أشدّ من العداء بين من يختلفون فيه، وأن السياسة قد تُغلب الدين في أشدّ المواضع دينية. وكان في هذا ما جعل بعض المؤرّخين يقولون إن الحملة الرابعة أضرّت بالمسيحية أكثر مما أضرّت بالإسلام، لأنها دمّرت مدينةً مسيحيةً كانت تُدافع عن أوروبا من الشرق.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالإمبراطورية اللاتينية\u003c/h4\u003e\u003cp class=\"ap\"\u003eأُقيمت بعد سقوط القسطنطينية إمبراطوريةٌ لاتينية، وقُسّمت بيزنطة إلى إماراتٍ عدة، وكان في هذا التقسيم ما جعل الشرق المسيحي يُقسّم كما قُسّم الشرق الإسلامي. وكان في هذا ما يُبيّن أن الضعف الداخلي يُغري الطامعين، وأن من كان في خطرٍ داخلي لا يجد من يُدافع عنه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذه الإمارات ما جعل الحكم اللاتيني غير مستقرّ، لأن السكان لم يقبلوه، وكان في هذا ما جعل بيزنطة تُعيد تنظيم نفسها في نيقية، وكان في هذا ما يُبيّن أن الاحتلال لا يبقى إذا لم يكن له قبولٌ عند السكان. وكان في هذه الإمارات ما جعل السكان يعيشون تحت حكمٍ لا يقبلونه، وكان في هذا ما جعل المقاومة الداخلية تُضعف الحكم اللاتيني، وأن الاحتلال لا يبقى إذا لم يكن له قبولٌ عند من يحكمهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في استعادة القسطنطينية سنة ١٢٦١ ما جعل بيزنطة تعود ولكنها لا تعود كما كانت، وكان في هذا ما يُبيّن أن الدولة قد تبقى بعد سقوط عاصمتها ولكنها لا تعود كما كانت، وأن الجرح الكبير لا يُشفى بالاستعادة، وأن من أراد أن يُعيد ما فقد فليعلم أن الاستعادة قد تكون صورةً لا حقيقة.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالإعلان\u003c/b\u003e\u003cspan\u003e١٢٠٢، البابا إنوسنت الثالث\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eزادار\u003c/b\u003e\u003cspan\u003eمدينةٌ مسيحية على الأدرياتيكي، فُتحت ١٢٠٢ لدفع دين البندقية\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالقسطنطينية\u003c/b\u003e\u003cspan\u003eاقتُحمت في أبريل ١٢٠٤، ونهبت أياماً\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالإمبراطورية اللاتينية\u003c/b\u003e\u003cspan\u003eأُقيمت على أنقاض بيزنطة، وعاشت نحو ٥٧ سنة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالاستعادة\u003c/b\u003e\u003cspan\u003e١٢٦١، عادت المدينة ولكنها لم تعُد عاصمةً قوية\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمحطة\u003c/th\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eما جرى\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالاتفاق مع البندقية\u003c/td\u003e\u003ctd\u003e١٢٠١\u003c/td\u003e\u003ctd\u003eنقل الجيش بسفن، ودينٌ لم يُدفع\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eزادار\u003c/td\u003e\u003ctd\u003e١٢٠٢\u003c/td\u003e\u003ctd\u003eفتح مدينةٍ مسيحية لدفع الدين، وحرمانٌ بابوي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eألكسيوس\u003c/td\u003e\u003ctd\u003e١٢٠٣\u003c/td\u003e\u003ctd\u003eوعدٌ بالمال مقابل إعادة عرشٍ بيزنطي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالقسطنطينية\u003c/td\u003e\u003ctd\u003e١٢٠٤\u003c/td\u003e\u003ctd\u003eاقتحامٌ ونهب، وسقوط الإمبراطورية البيزنطية\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eلم يُترك في المدينة شيءٌ من المقدّسات.\u003c/p\u003e\u003ccite\u003eمن أوصاف نهب القسطنطينية سنة ١٢٠٤ في المصادر البيزنطية\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eالحملة الرابعة خرجت لتحرير القدس فانتهت إلى تدمير القسطنطينية: دينٌ للبندقية دفعها إلى زادار، ثم وعدٌ بيزنطي دفعها إلى عاصمةٍ مسيحية، فاقتُحمت في أبريل ١٢٠٤ ونُهبت. وأُقيمت إمبراطوريةٌ لاتينية على أنقاض بيزنطة، ولم تعُد المدينة إلى أهلها إلا سنة ١٢٦١ وهي مُدمّرة. وكان في هذه الحملة ما جعل فكرة الحملة الصليبية تفقد قدسيتها، وأن الصليبيين يُقاتلون المسيحيين بدل المسلمين.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"ayyubid-fall","n":"سقوط الأيوبيين وصعود المماليك","ic":"🔻","part":"القسم الرابع: الحملات اللاحقة والنهاية","h":"\u003carticle class=\"ch3\" id=\"ayyubid-fall\" data-toc=\"سقوط الأيوبيين وصعود المماليك\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٤.٢\u003c/span\u003e\n          \u003ch3\u003e🔻 سقوط الأيوبيين وصعود المماليك\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eب\u003c/span\u003eعد صلاح الدين تقاسم أبناؤه وإخوته الدولة، فضعفت، ثم جاءت الحملة الخامسة إلى دمياط، ثم اشترى الملك الصالح مماليك أشدّاء، فانتصر بهم في المنصورة سنة ١٢٥٠ على لويس التاسع، ثم قتلهم له، فصار المماليك أصحاب السلطة الحقيقية في مصر.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eبعد موت صلاح الدين سنة ١١٩٣ تقاسم الدولة أبناؤه وإخوته، وكان في هذا الاقتسام ما جعل الدولة الأيوبية تضعف بعد أن كانت قويةً في عهده، وكان في هذا ما يُبيّن أن الوحدة التي تُبنى على شخصٍ واحدٍ لا تبقى بعده. وقد حكم مصر ابنه العزيز، ثم ابنه المنصور، ثم عمّه العادل، وكان في هذه الانتقالات ما جعل الدولة تُصبح مجموعةً من إماراتٍ متنازعة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا التنازع ما جعل الصليبيين يجدون فرصةً جديدة، فخرجت الحملة الخامسة سنة ١٢١٧ إلى دمياط في مصر، وكان في اختيار مصر ما جعل الصليبيين يُغيّرون استراتيجيتهم: فبدل أن يُهاجموا القدس من الشام، هاجموا مصر لأنها مركز القوة الإسلامية. وكان في هذا ما يُبيّن أن العدوّ قد يُغيّر خططه إذا رأى أن الطريق القديم لا يُوصله. وكان في هذا التحوّل ما جعل الصليبيين يُعيدون النظر في استراتيجيتهم كلها، وأن من فشل في مكانٍ مراتٍ عديدةٍ فليجرّب مكاناً آخر، وأن التجربة الفاشلة قد تُعلّم أكثر من النجاح.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد سقطت دمياط في أيدي الصليبيين سنة ١٢١٩، وكان في سقوطها ما جعل مصر في خطرٍ حقيقي، وكان في هذا ما جعل السلطان الكامل يعرض على الصليبيين صلحاً يُعطيهم القدس مقابل انسحابهم من دمياط. وكان في هذا العرض ما يُبيّن أن الحكام قد يُقدّمون تنازلاتٍ كبيرة في أوقات الخطر، وأن من أراد أن يحفظ كل شيءٍ قد يفقد كل شيء. وكان في هذا العرض ما جعل بعض المسلمين يغضبون، لأنهم رأوا فيه تفريطاً في القدس، وكان في هذا الغضب ما جعل السلطان يُتراجع، وأن من أراد أن يُفاوض فليُهيّئ الناس للتنازل قبل أن يُعلنه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد رفض الصليبيون العرض، وكان في هذا الرفض ما جعلهم يخسرون فرصةً لم تُعِد، وكان في هذا ما يُبيّن أن الطمع قد يُضيّع ما كان يمكن الحصول عليه، وأن من أراد أكثر مما يستطيع فقد لا يحصل على شيء. ثم هُزم الصليبيون في المنصورة سنة ١٢٢١ وانسحبوا من دمياط، وكان في هذه الهزيمة ما جعل الحملة الخامسة تفشل فشلاً كاملاً. وكان في هذه الهزيمة ما جعل الحملة الخامسة تفشل فشلاً كاملاً، وكان في هذا ما جعل أوروبا تفقد الثقة في جدوى الحملات، وأن من خرج بجيشٍ كبيرٍ وعاد بلا شيءٍ يخسر أكثر من جيشه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في الحملة الخامسة ما جعل المسلمين يُدركون أن مصر هي الهدف الحقيقي، وكان في هذا ما جعل الأيوبيين يُعيدون تحصين دمياط والمنصورة، وكان في هذا ما جعل الحملة السابعة بعد ذلك تفشل أيضاً. وكان في هذا ما يُبيّن أن من فهم نيّة العدوّ يستطيع أن يُهيّئ له ما يُفشل خطته قبل أن يبدأ. وكان في هذا الفهم ما جعل الأيوبيين يُعيدون تحصين دمياط والمنصورة، وكان في هذا ما جعل الحملة السابعة بعد ذلك تفشل أيضاً، وأن من فهم نيّة العدوّ يستطيع أن يُهيّئ له ما يُفشل خطته قبل أن يبدأ.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت الحملة السادسة قد جاءت سنة ١٢٢٨ بقيادة فريدريك الثاني إمبراطور ألمانيا، وقد كان رجلاً مثقّفاً يعرف العربية، وكان في شخصيته ما جعل الحملة تختلف عن كل ما سبقها. وكان في هذا ما يُبيّن أن القائد الذي يعرف عدوّه أكثر قد ينتصر بالتفاوض أكثر مما ينتصر بالسيف. وكان في هذا الاختلاف ما جعل الحملة السادسة تُشبه زيارةً أكثر من حرب، وكان في هذا ما جعل بعض الصليبيين ينتقدون فريدريك لأنه لم يُقاتل، وكان في هذا ما يُبيّن أن الناس قد يُفضّلون الحرب على التفاوض ولو كان التفاوض أنفع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد فاوض فريدريك السلطان الكامل، وتوصّلا إلى اتفاقٍ في يافا سنة ١٢٢٩ يُعيد القدس إلى الصليبيين مع بقاء الحرم في يد المسلمين، وكان في هذا الاتفاق ما جعل القدس تعود بلا قتال، وكان في هذا ما يُبيّن أن الحروب لا تُحسم دائماً بالسيف، وأن الدبلوماسية قد تُحقّق ما لا تُحقّقه الجيوش. وكان في هذا الاتفاق ما جعل القدس تعود إلى الصليبيين بعد أن خرجوا منها، وكان في هذا ما جعل بعض المؤرّخين يقولون إن الدبلوماسية حقّقت في سنةٍ ما لم تُحقّقه الجيوش في أربعين سنة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أثار هذا الاتفاق غضباً في الشرق والغرب معاً: فقد غضب المسلمون لأن القدس سُلّمت بلا حرب، وغضب المسيحيون لأن فريدريك لم يُقاتل، وكان في هذا الغضب ما جعل الاتفاق هشّاً. وكان في هذا ما يُبيّن أن التسويات التي لا تُقنع الناس لا تبقى، وأن من أراد صلحاً فليُقنع به من يحكمهم لا من يُوقّعه فقط. وكان في هذا الغضب ما جعل الاتفاق هشّاً من البداية، وكان في هذا ما يُبيّن أن التسويات التي لا تُقنع الناس لا تبقى، وأن من أراد صلحاً فليُقنع به من يحكمهم لا من يُوقّعه فقط.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد استعاد المسلمون القدس سنة ١٢٤٤ على يد الخوارزميين، وكان في هذا الاستعادة ما جعل الاتفاق يزول، وكان في هذا ما يُبيّن أن ما يُؤخذ بالتفاوض قد يُفقد بالقوة، وأن الاتفاق الذي لا يسنده توازن قوى لا يبقى. وكان في هذا ما جعل الصليبيين يُدركون أن الطريق الوحيد هو القوة، فخرجت الحملة السابعة. وكان في هذا الاستعادة ما جعل الصليبيين يُدركون أن الطريق الوحيد هو القوة، وكان في هذا ما جعل الحملة السابعة تخرج بعد خمس سنوات، وأن من فقد ما أخذه بالتفاوض يُحاول أن يستعيده بالقوة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سنة ١٢٤٩ خرج لويس التاسع ملك فرنسا بحملةٍ كبيرة إلى مصر، وسقطت دمياط في يده، ثم تقدّم إلى المنصورة، وكان في هذا التقدّم ما جعل المسلمين في خطرٍ شديد. وكان في هذا ما جعل السلطان الصالح أيوب يُجهّز جيشه وهو مريض، ثم مات في أثناء الحملة، وكان في هذا ما جعل الموقف في غاية الصعوبة. وكان في هذا التقدّم ما جعل المسلمين في خطرٍ شديد، وكان في هذا ما جعل السلطان الصالح يُجهّز جيشه وهو مريض، وكان في هذا ما يُبيّن أن القائد قد يُقاتل وهو يحتضر إذا كان يعرف أن الهزيمة تعني نهاية بلده.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان السلطان الصالح قد اشترى مماليك أشدّاء من الترك وجعلهم في جيشه، وكان يقودهم في المنصورة فخر الدين، ثم ظهر في المعركة قادةٌ مثل الظاهر بيبرس، وكان في هؤلاء المماليك ما جعل المعركة تنقلب. وكان في هذا ما يُبيّن أن الجيش الذي يُدرَّب جيداً قد يكون أقوى من الجيش الكبير، وأن من أراد أن ينتصر فليستثمر في جودة جنوده لا في عددهم. وكان في هذا التدريب ما جعل المماليك قادرين على أن يُقاتلوا في أزقّة المدن، وأن من أراد أن يُقاتل في المدن فليُدرّب جنوده على المدن لا على الميادين المفتوحة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي فبراير ١٢٥٠ جرت معركة المنصورة، وكان فيها هجومٌ صليبي مباغت قُتل فيه فخر الدين، ثم انقلبت المعركة على الصليبيين في أزقّة المدينة، وكان في هذا ما جعل جيش لويس يُدمّر. وكان في هذا ما يُبيّن أن المدينة قد تكون حصناً لا يُخترق، وأن من أراد أن يحتمي فليبْنِ مدينته لا سوره فقط. وكان في هذا الانقلاب ما جعل المعركة تنقلب على الصليبيين، وكان في هذا ما جعل لويس يفقد جيشه في أزقّة مدينةٍ لا في ميدانٍ مفتوح، وأن من أراد أن ينتصر على جيشٍ مدرّعٍ فليُقاتله في مكانٍ لا يستطيع أن ينتشر فيه.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم جرى حصارٌ وهجومٌ في فارسكور، وأُسر لويس التاسع مع كثيرٍ من جيشه، وكان في هذا الأسر ما جعل الحملة السابعة تفشل فشلاً كاملاً، وكان في هذا ما جعل مكانة مصر تُرتفع في العالم الإسلامي. وكان في هذا ما يُبيّن أن النصر في أرضك أقوى من النصر في أرض العدوّ، وأن من قاتل على أرضه يعرف ما لا يعرفه الغريب. وكان في هذا الأسر ما جعل مكانة مصر تُرتفع في العالم الإسلامي، وكان في هذا ما جعل لويس يُصبح ملكاً أسيراً في بلدٍ خرج ليحتلّه، وأن من أراد أن يُقاتل في أرض بعيدةٍ فليحسب ثمن الفشل لا ثمن النصر فقط.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أُطلق سراح لويس مقابل فديةٍ كبيرة وتسليم دمياط، وكان في هذا الإطلاق ما جعل الحملة تنتهي بلا فائدة، وكان في هذا ما جعل أوروبا تفقد الثقة في جدوى الحملات. وكان في هذا ما يُبيّن أن الفدية قد تكون أغلى من الغنيمة، وأن من أراد أن يُقاتل في أرض بعيدةٍ فليحسب ثمن الفشل لا ثمن النصر فقط. وكان في هذا الإطلاق ما جعل الحملة تنتهي بلا فائدة، وكان في هذا ما جعل أوروبا تفقد الثقة في جدوى الحملات، وأن من دفع فديةً كبيرةً ليعود بلا شيءٍ فقد دفع مرتين: مرةً في الحرب ومرةً في الصلح.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه الفترة ما جعل المماليك يُصبحون القوة الحقيقية في مصر: فقد قتلوا السلطان توران شاه بعد انتصار المنصورة، ثم صاروا هم من يُعيّن السلاطين، وكان في هذا التحوّل ما جعل الدولة الأيوبية تنتهي عملياً. وكان في هذا ما يُبيّن أن من يملك الجيش يملك السلطة في النهاية، وأن الدولة التي تعتمد على مماليك قد تُصبح ملكاً لهم. وكان في هذا القتل ما جعل الدولة الأيوبية تنتهي عملياً، وكان في هذا ما يُبيّن أن من يعتمد على مماليك في حروبه قد يجدهم أصحاباً للسلطة بعدها، وأن السلطة قد تنتقل إلى من يحمل السلاح لا إلى من يحمل النسب.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالحملة الخامسة ومصر\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الحملة الخامسة أول حملةٍ تُوجّه إلى مصر مباشرةً، وكان في هذا التوجيه ما جعل الصليبيين يُغيّرون استراتيجيتهم بعد قرنٍ من الفشل في الشام. وكان في هذا ما يُبيّن أن العدوّ يتعلّم من أخطائه، وأن من ظنّ أن عدوّه سيُكرّر خطأه فقد أخطأ في حسابه. وكان في هذا التوجيه ما جعل الحملة تُصبح أكثر خطورةً من سابقاتها، لأنها ضربت مركز القوة الإسلامية لا طرفها، وأن من أراد أن يُسقط دولةً فليضرب قلبها لا أطرافها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد سقطت دمياط، وكان في سقوطها ما جعل مصر في خطرٍ حقيقي، وكان في هذا ما جعل السلطان الكامل يعرض صلحاً يُعطي القدس مقابل الانسحاب. وكان في هذا العرض ما يُبيّن أن الحكام قد يُقدّمون تنازلاتٍ كبيرة في أوقات الخطر، وأن من أراد أن يحفظ كل شيءٍ قد يفقد كل شيء.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد رفض الصليبيون العرض، وكان في رفضهم ما جعلهم يخسرون فرصةً لم تُعِد، وكان في هذا ما يُبيّن أن الطمع قد يُضيّع ما كان يمكن الحصول عليه. وكان في هذا ما جعل الحملة تفشل في المنصورة، وأن من رفض صلحاً في وقت قوّته قد يُضطر إلى صلحٍ أسوأ في وقت ضعفه. وكان في هذا الرفض ما جعل الصليبيين يخسرون فرصةً لم تُعِد، وكان في هذا ما يُبيّن أن الطمع قد يُضيّع ما كان يمكن الحصول عليه، وأن من رفض صلحاً في وقت قوّته قد يُضطر إلى صلحٍ أسوأ في وقت ضعفه.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالحملة السادسة والتفاوض\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الحملة السادسة مختلفةً عن كل ما سبقها، فقد قادها إمبراطورٌ مثقّف يعرف العربية، وكان في شخصيته ما جعل الحملة تتحوّل من حربٍ إلى تفاوض. وكان في هذا ما يُبيّن أن القائد الذي يعرف عدوّه أكثر قد ينتصر بالكلام أكثر مما ينتصر بالسيف. وكان في هذا الاختلاف ما جعل الحملة السادسة تُشبه زيارةً أكثر من حرب، وأن من أراد أن يُحقّق هدفاً فليُجرّب أكثر من وسيلة، وأن النصر بالكلام قد يكون أنفع من النصر بالسيف.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد توصّل فريدريك والكامل إلى اتفاقٍ يُعيد القدس للصليبيين مع بقاء الحرم للمسلمين، وكان في هذا الاتفاق ما جعل القدس تعود بلا قتال. وكان في هذا ما يُبيّن أن الحروب لا تُحسم دائماً بالسيف، وأن الدبلوماسية قد تُحقّق ما لا تُحقّقه الجيوش، وأن من أراد أن يُحقّق هدفاً فليُجرّب أكثر من وسيلة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أثار الاتفاق غضباً في الشرق والغرب، وكان في هذا الغضب ما جعل الاتفاق هشّاً، وكان في هذا ما يُبيّن أن التسويات التي لا تُقنع الناس لا تبقى. وكان في هذا ما جعل القدس تُستعاد بالقوة سنة ١٢٤٤، وأن الاتفاق الذي لا يسنده توازن قوى لا يبقى. وكان في هذا الغضب ما جعل القدس تُستعاد بالقوة سنة ١٢٤٤، وأن الاتفاق الذي لا يسنده توازن قوى لا يبقى، وأن من أراد صلحاً فليبْنِ له ما يُبقيه لا ما يُوقّعه.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالمنصورة وصعود المماليك\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت معركة المنصورة نقطة تحوّلٍ في تاريخ مصر، فقد دُمّر فيها جيش لويس التاسع وأُسر الملك، وكان في هذا النصر ما جعل مصر تُصبح القوة الأولى في العالم الإسلامي. وكان في هذا ما يُبيّن أن النصر في أرضك أقوى من النصر في أرض العدوّ، وأن من قاتل على أرضه يعرف ما لا يعرفه الغريب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذه المعركة ما جعل المماليك يظهرون كقوةٍ عسكريةٍ حقيقية، فقد كانوا هم من قاتلوا في الأزقّة وهم من أسروا الملك، وكان في هذا ما جعلهم يطالبون بالسلطة بعد النصر. وكان في هذا ما يُبيّن أن من يحمل السيف في لحظة الخطر يطلب الحكم في لحظة الأمن. وكان في هذا الظهور ما جعل المماليك يطالبون بالسلطة بعد النصر، وأن من يحمل السيف في لحظة الخطر يطلب الحكم في لحظة الأمن.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد قتل المماليك السلطان توران شاه بعد النصر، وكان في هذا القتل ما جعل الدولة الأيوبية تنتهي عملياً، وكان في هذا ما يُبيّن أن من يعتمد على مماليك في حروبه قد يجدهم أصحاباً للسلطة بعدها. وكان في هذا ما جعل دولة المماليك تُولد من رحم الدولة الأيوبية، وأن السلطة قد تنتقل إلى من يحمل السلاح لا إلى من يحمل النسب.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eبعد صلاح الدين\u003c/b\u003e\u003cspan\u003e١١٩٣، اقتسام الدولة بين الأبناء والإخوة، وضعفٌ تدريجي\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالحملة الخامسة\u003c/b\u003e\u003cspan\u003e١٢١٧–١٢٢١، دمياط، ثم هزيمةٌ في المنصورة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالحملة السادسة\u003c/b\u003e\u003cspan\u003e١٢٢٨–١٢٢٩، فريدريك الثاني، والقدس بالتفاوض\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eاستعادة القدس\u003c/b\u003e\u003cspan\u003e١٢٤٤ على يد الخوارزميين\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمنصورة\u003c/b\u003e\u003cspan\u003eفبراير ١٢٥٠، تدمير جيش لويس التاسع وأسره\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالحملة\u003c/th\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالهدف والنتيجة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالخامسة\u003c/td\u003e\u003ctd\u003e١٢١٧–١٢٢١\u003c/td\u003e\u003ctd\u003eدمياط ومصر، ثم فشلٌ كامل في المنصورة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالسادسة\u003c/td\u003e\u003ctd\u003e١٢٢٨–١٢٢٩\u003c/td\u003e\u003ctd\u003eتفاوضٌ لا قتال، والقدس تعود باتفاق\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالسابعة\u003c/td\u003e\u003ctd\u003e١٢٤٨–١٢٥٤\u003c/td\u003e\u003ctd\u003eدمياط والمنصورة، وأسر لويس التاسع وفدية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eصعود المماليك\u003c/td\u003e\u003ctd\u003e١٢٥٠\u003c/td\u003e\u003ctd\u003eقتل توران شاه، ونهاية الدولة الأيوبية عملياً\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eإن كنتم تطلبون القدس فقد أُعطيتموها، فلماذا تُريقون الدماء؟\u003c/p\u003e\u003ccite\u003eمن معنى عرض السلطان الكامل على الصليبيين في الحملة الخامسة\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eبعد صلاح الدين تقاسم ورثته الدولة فضعفت، فجاءت الحملة الخامسة إلى دمياط فعرض الكامل القدس مقابل الانسحاب فرفضوا ففشلوا. ثم جاءت السادسة فعادت القدس بالتفاوض سنة ١٢٢٩، ثم استُعيدت بالقوة ١٢٤٤. ثم جاءت السابعة فدُمّر جيش لويس في المنصورة سنة ١٢٥٠ وأُسر. وفي هذه المعركة ظهر المماليك، فقتلوا توران شاه، وانتهت الدولة الأيوبية عملياً.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"mongols-mamluks","n":"المغول وعين جالوت","ic":"🏇","part":"القسم الرابع: الحملات اللاحقة والنهاية","h":"\u003carticle class=\"ch3\" id=\"mongols-mamluks\" data-toc=\"المغول وعين جالوت\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٤.٣\u003c/span\u003e\n          \u003ch3\u003e🏇 المغول وعين جالوت\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي سنة ١٢٥٨ سقطت بغداد في يد المغول، وقُتل الخليفة، ودُمّرت المدينة التي كانت مركز العالم الإسلامي خمسة قرون. ثم تقدّم المغول إلى الشام، فخرج إليهم جيش المماليك بقيادة قطز وبيبرس، فانتصروا في عين جالوت سنة ١٢٦٠، وكان في هذا النصر ما جعل العالم الإسلامي يبقى بعد أن كاد يزول.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان المغول قد بنوا إمبراطوريةً هي الأكبر في التاريخ في أقلّ من نصف قرن، وكانوا قد دمّروا خوارزم وبخارى وسمرقند، وكان في هذا التدمير ما جعل العالم الإسلامي يفقد مراكز العلم والحضارة في الشرق. وكان في هذا ما جعل الخطر المغولي أخطر من الخطر الصليبي، لأن الصليبيين أرادوا مدناً والمغول أرادوا إبادة. وكان في هذا التدمير ما جعل مراكز العلم في الشرق تُفقد، وكان في هذا ما جعل العالم الإسلامي يُصبح أضعف مما كان، وأن الخطر الذي يُدمّر العلم أخطر من الخطر الذي يُدمّر الجيوش.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سنة ١٢٥٨ خرج هولاكو بجيشٍ كبير إلى بغداد، وكان الخليفة المستعصم بالله قد أهمل جيشه ونظامه، وكان في هذا الإهمال ما جعل المدينة تُسقط بسرعة. وكان في هذا ما يُبيّن أن الخلافة التي بقيت رمزاً خمسمئة سنة لم تستطع أن تُدافع عن نفسها في أسبوع، وأن الرمز بلا قوةٍ لا يحمي صاحبه. وكان في هذا الإهمال ما جعل المدينة تُسقط بسرعة، وكان في هذا ما يُبيّن أن الخلافة التي بقيت رمزاً خمسمئة سنة لم تستطع أن تُدافع عن نفسها في أسبوع، وأن الرمز بلا قوةٍ لا يحمي صاحبه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد سقطت بغداد في فبراير ١٢٥٨، ووقعت فيها مذبحةٌ عظيمة، وقُتل الخليفة، ودُمّرت المساجد والمدارس والمكتبات، ورُميت الكتب في نهر دجلة حتى قيل إن ماءه اسودّ من الحبر. وكان في هذا التدمير ما جعل بغداد تفقد مكانتها إلى الأبد، وكان في هذا ما يُبيّن أن المدن لا تموت بالسيف فقط بل بموت العلم فيها. وكان في هذا التدمير ما جعل بغداد تفقد مكانتها إلى الأبد، وكان في هذا ما يُبيّن أن المدن لا تموت بالسيف فقط بل بموت العلم فيها، وأن من أراد أن يُعيد مدينةً فليبْنِ علمها قبل سورها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في سقوط بغداد ما جعل المسلمين يُدركون أن الخطر الجديد لا يُفاوض ولا يُهادن، وأن المغول لا يُريدون جزيةً ولا صلحاً بل خضوعاً كاملاً. وكان في هذا ما جعل المقاومة تتّجه إلى مصر، لأنها كانت الدولة الوحيدة القادرة على أن تُجمّع قوةً، وكان في هذا ما يُبيّن أن الأمة إذا فقدت مركزها بحثت عن مركزٍ آخر. وكان في هذا ما جعل المقاومة تتّجه إلى مصر، لأنها كانت الدولة الوحيدة القادرة على أن تُجمّع قوةً، وكان في هذا ما يُبيّن أن الأمة إذا فقدت مركزها بحثت عن مركزٍ آخر، وأن الفراغ لا يبقى إذا كان هناك من يستطيع أن يملأه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد قتل المماليك السلطان توران شاه بعد المنصورة، ثم اضطربت الدولة، حتى ولّوا قطز، وكان رجلاً حازماً، وكان في تولّيه ما جعل مصر تُصبح مركز المقاومة. وكان في هذا ما يُبيّن أن القيادة الحازمة قد تُغيّر مسار أمةٍ في أشهر، وأن من أراد أن يُقاوم خطراً وجودياً فليبدأ بقيادةٍ لا تتردّد. وكان في هذا ما يُبيّن أن القيادة الحازمة قد تُغيّر مسار أمةٍ في أشهر، وأن من أراد أن يُقاوم خطراً وجودياً فليبدأ بقيادةٍ لا تتردّد، وأن التردّد في لحظة الخطر قد يكون أخطر من الخطر نفسه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان هولاكو قد أرسل إلى قطز رسالةً يُهدّده فيها، وكان في هذه الرسالة ما جعل قطز يجمع القادة ويستشيرهم، فقرّروا القتال. وكان في هذا القرار ما جعل مصر تخرج من موقع الدفاع إلى موقع الهجوم، وكان في هذا ما يُبيّن أن من ينتظر العدوّ في داره قد يخسر داره، وأن من أراد أن ينجو فليخرج إليه. وكان في هذا القرار ما جعل مصر تخرج من موقع الدفاع إلى موقع الهجوم، وكان في هذا ما يُبيّن أن من ينتظر العدوّ في داره قد يخسر داره، وأن من أراد أن ينجو فليخرج إليه قبل أن يدخل عليه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان هولاكو قد اضطر إلى العودة إلى الشرق بسبب موت الخان الأكبر، فترك في الشام جيشاً بقيادة كتبغا، وكان في هذا الانسحاب ما جعل الجيش المغولي في الشام أقلّ عدداً. وكان في هذا ما يُبيّن أن الأحداث في مكانٍ قد تُغيّر المعركة في مكانٍ آخر، وأن من أراد أن يفهم معركةً فليقرأ ما جرى في العواصم. وكان في هذا الانسحاب ما جعل الجيش المغولي في الشام أقلّ عدداً، وكان في هذا ما يُبيّن أن الأحداث في مكانٍ قد تُغيّر المعركة في مكانٍ آخر، وأن من أراد أن يفهم معركةً فليقرأ ما جرى في العواصم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سبتمبر ١٢٦٠ التقى الجيشان في عين جالوت في فلسطين، وكان الجيش المملوكي أقلّ عدداً، وكان في هذا التفاوت ما جعل المعركة صعبة، ولكن قطز وبيبرس استخدما خطةً ذكية: فقد أخفيا جزءاً من الجيش في التلال، ثم استدرجا المغول إلى كمين. وكان في هذه الخطة ما يُبيّن أن العقل قد يغلب العدد، وأن من عرف أرض المعركة أفضل من عدوّه يملك سلاحاً لا يُقاوَم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد انتصر المسلمون في عين جالوت، وكان في هذا النصر ما جعل أسطورة المغول الذين لا يُغلبون تنكسر، وكان في هذا ما جعل العالم الإسلامي يتنفّس بعد أن كان على شفا الزوال. وكان في هذا النصر ما يُبيّن أن الهزائم المتتالية لا تعني النهاية، وأن من بقي قادراً على أن يُجمّع قوةً قد يُغيّر التاريخ في يومٍ واحد. وكان في هذا النصر ما جعل العالم الإسلامي يتنفّس بعد أن كان على شفا الزوال، وكان في هذا ما يُبيّن أن الهزائم المتتالية لا تعني النهاية، وأن من بقي قادراً على أن يُجمّع قوةً قد يُغيّر التاريخ في يومٍ واحد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا النصر ما جعل مصر تُصبح مركز العالم الإسلامي، وكان في هذا ما جعل المماليك يُصبحون حماة الإسلام في نظر الناس، وكان في هذا ما جعل شرعيتهم تُبنى على الجهاد لا على النسب. وكان في هذا ما يُبيّن أن الشرعية قد تُبنى بالنصر، وأن من حمى أمةً من خطرٍ وجودي حكمها بلا سؤال. وكان في هذا النصر ما جعل المماليك يُصبحون حماة الإسلام في نظر الناس، وكان في هذا ما جعل شرعيتهم تُبنى على الجهاد لا على النسب، وأن من حمى أمةً من خطرٍ وجودي حكمها بلا سؤال.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد قُتل قطز بعد النصر بقليل على يد بيبرس، وكان في هذا القتل ما جعل بيبرس يُصبح سلطاناً، وكان في هذا ما يُبيّن أن من أنقذ أمةً قد لا يُنقذه أتباعه، وأن السلطة قد تُؤخذ من المنقذ نفسه. وكان في هذا ما جعل المماليك يُصبحون دولةً قائمةً بذاتها، وأن دولتهم ستستمرّ قرنين ونصفاً. وكان في هذا القتل ما جعل بيبرس يُصبح سلطاناً، وكان في هذا ما يُبيّن أن من أنقذ أمةً قد لا يُنقذه أتباعه، وأن السلطة قد تُؤخذ من المنقذ نفسه، وأن من أراد أن يبقى فليحكم لا ليُنقذ فقط.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بدأ بيبرس بعد ذلك يُهاجم إمارات الصليبيين على الساحل، ففتح أنطاكية سنة ١٢٦٨، وكان في فتحها ما جعل إمارةً صليبيةً عمرها ١٧٠ سنة تزول، وكان في هذا ما جعل الصليبيين يفقدون الشمال. وكان في هذا ما يُبيّن أن من انتصر على الخطر الأكبر يستطيع أن يُنهي الخطر الأصغر، وأن من أراد أن يُنهي حرباً قديمةً فليبدأ بعد أن يُؤمّن نفسه. وكان في فتح أنطاكية ما جعل الصليبيين يفقدون الشمال، وكان في هذا ما يُبيّن أن من انتصر على الخطر الأكبر يستطيع أن يُنهي الخطر الأصغر، وأن من أراد أن يُنهي حرباً قديمةً فليبدأ بعد أن يُؤمّن نفسه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذه المرحلة ما جعل الصليبيين يُدركون أن وجودهم في الشرق صار مهدّداً، وكان في هذا ما جعلهم يُحاولون التحالف مع المغول ضد المماليك، وكان في هذا ما يُبيّن أن من أضعفه الخطر قد يتحالف مع من هو أخطر منه، وأن التحالف مع الأقوى قد يكون أسرع طريقٍ إلى الزوال. وكان في هذا التحالف ما جعل المماليك يُواجهون تحالفاً من الشرق والغرب، وكان في هذا ما جعلهم يُسرعون بإنهاء الوجود الصليبي، وأن من أراد أن يبقى فليكن قادراً على أن يُقاتل على جبهتين، وأن يُنهي أضعف الجبهتين أولاً.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eسقوط بغداد\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان سقوط بغداد سنة ١٢٥٨ صدمةً لم يعرف العالم الإسلامي مثلها، فقد كانت بغداد مركز الخلافة والعلم خمسة قرون، وكان في سقوطها ما جعل المسلمين يفقدون مرجعيتهم الرمزية. وكان في هذا ما يُبيّن أن الرمز إذا فقد قوّته لا يستطيع أن يحمي نفسه، وأن الخلافة التي بقيت بلا جيشٍ لم تبقَ إلا بالاسم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في تدمير بغداد ما جعل العلم نفسه يُقتل: فقد دُمّرت المكتبات ورُميت الكتب في النهر، وكان في هذا ما يُبيّن أن من أراد أن يُدمّر أمةً فليُدمّر علمها لا سورها. وكان في هذا ما جعل بعض المؤرّخين يقولون إن ما ضاع في بغداد لم يُعوّض، وأن الحضارة تُبنى قروناً وتُدمّر أياماً.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا السقوط ما جعل المسلمين يُدركون أن الخطر الجديد لا يُفاوض، وكان في هذا ما جعل المقاومة تتّجه إلى مصر لأنها الدولة الوحيدة القادرة على أن تُجمّع قوةً. وكان في هذا ما يُبيّن أن الأمة إذا فقدت مركزها بحثت عن مركزٍ آخر، وأن الفراغ لا يبقى إذا كان هناك من يستطيع أن يملأه.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eعين جالوت\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت عين جالوت معركةً فاصلةً، لأنها أوقفت تقدّم المغول غرباً، وكان في هذا التوقّف ما جعل مصر والشام والشمال الأفريقي يبقى في يد المسلمين. وكان في هذا ما يُبيّن أن المعركة الواحدة قد تُغيّر خريطة العالم، وأن من انتصر في ساعةٍ حرجة قد يُنجي أمةً بأكملها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذه المعركة ما جعل أسطورة المغول تنكسر، فقد كان الناس يُصدّقون أن المغول لا يُغلبون، وكان في هذه الأسطورة ما جعل الهزيمة أمامهم أسهل من المقاومة. وكان في كسرها ما يُبيّن أن الأسطورة قد تكون سلاحاً، وأن من كسرها أعاد للناس ثقتهم في أنفسهم. وكان في كسر هذه الأسطورة ما جعل الناس يُصدّقون أن المغول يُمكن أن يُهزموا، وأن الأسطورة قد تكون سلاحاً، وأن من كسرها أعاد للناس ثقتهم في أنفسهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذه المعركة ما جعل المماليك يُصبحون حماة الإسلام، وكان في هذا ما جعل شرعيتهم تُبنى على الجهاد لا على النسب. وكان في هذا ما يُبيّن أن الشرعية قد تُبنى بالنصر، وأن من حمى أمةً من خطرٍ وجودي حكمها بلا سؤال، وأن الناس يُطيعون من أنقذهم أكثر مما يُطيعون من ورثهم.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eبيبرس وفتح أنطاكية\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان بيبرس من أعظم سلاطين المماليك، وقد بنى دولةً قويةً ونظّماً للإدارة والبريد والجيش، وكان في هذا البناء ما جعل المماليك يبقون قرنين ونصفاً. وكان في هذا ما يُبيّن أن النصر في معركةٍ لا يكفي، وأن من أراد أن تبقى دولته فليبْنِ مؤسساتها لا جيوشها فقط. وكان في هذا البناء ما جعل المماليك يبقون قرنين ونصفاً، وأن النصر في معركةٍ لا يكفي، وأن من أراد أن تبقى دولته فليبْنِ مؤسساتها لا جيوشها فقط.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد فتح أنطاكية سنة ١٢٦٨، وكان في فتحها ما جعل إمارةً صليبيةً عمرها ١٧٠ سنة تزول، وكان في هذا ما جعل الصليبيين يفقدون الشمال. وكان في هذا ما يُبيّن أن من انتصر على الخطر الأكبر يستطيع أن يُنهي الخطر الأصغر، وأن من أراد أن يُنهي حرباً قديمةً فليبدأ بعد أن يُؤمّن نفسه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في سياسة بيبرس ما جعل الصليبيين يُحاولون التحالف مع المغول ضده، وكان في هذا التحالف ما يُبيّن أن من أضعفه الخطر قد يتحالف مع من هو أخطر منه. وكان في هذا ما جعل المماليك يُواجهون تحالفاً من الشرق والغرب، وأن من أراد أن يبقى فليكن قادراً على أن يُقاتل على جبهتين.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eبغداد\u003c/b\u003e\u003cspan\u003eسقطت في فبراير ١٢٥٨، وقُتل الخليفة ودُمّرت المدينة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eهولاكو\u003c/b\u003e\u003cspan\u003eعاد إلى الشرق لموت الخان الأكبر، فترك جيشاً في الشام\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eعين جالوت\u003c/b\u003e\u003cspan\u003eسبتمبر ١٢٦٠، انتصارٌ مملوكي أوقف المغول\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eقطز\u003c/b\u003e\u003cspan\u003eقاد المعركة، ثم قُتل بعد النصر على يد بيبرس\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأنطاكية\u003c/b\u003e\u003cspan\u003eفتحها بيبرس ١٢٦٨، فزالت إمارةٌ عمرها ١٧٠ سنة\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eسقوط بغداد\u003c/td\u003e\u003ctd\u003e١٢٥٨\u003c/td\u003e\u003ctd\u003eنهاية الخلافة العباسية، وتدمير مركز العلم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eانسحاب هولاكو\u003c/td\u003e\u003ctd\u003e١٢٦٠\u003c/td\u003e\u003ctd\u003eضعف الجيش المغولي في الشام\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eعين جالوت\u003c/td\u003e\u003ctd\u003e١٢٦٠\u003c/td\u003e\u003ctd\u003eكسر أسطورة المغول، وإنقاذ العالم الإسلامي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eفتح أنطاكية\u003c/td\u003e\u003ctd\u003e١٢٦٨\u003c/td\u003e\u003ctd\u003eزوال إمارةٍ صليبية عمرها ١٧٠ سنة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eإن ماء دجلة اسودّ من حبر الكتب.\u003c/p\u003e\u003ccite\u003eمن أوصاف سقوط بغداد سنة ١٢٥٨ في المصادر\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eسقطت بغداد في فبراير ١٢٥٨، وقُتل الخليفة ودُمّرت المكتبات، فكانت صدمةً لم يعرف المسلمون مثلها. ثم تقدّم المغول إلى الشام، فخرج إليهم قطز وبيبرس، فانتصرا في عين جالوت في سبتمبر ١٢٦٠ بخطة كمينٍ محكمة، فانكسرت أسطورة المغول وبقي العالم الإسلامي. ثم قُتل قطز، وصار بيبرس سلطاناً، ففتح أنطاكية سنة ١٢٦٨ وأنهى إمارةً عمرها ١٧٠ سنة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"acre-1291","n":"سقوط عكا ونهاية الوجود الصليبي","ic":"🏚️","part":"القسم الرابع: الحملات اللاحقة والنهاية","h":"\u003carticle class=\"ch3\" id=\"acre-1291\" data-toc=\"سقوط عكا ونهاية الوجود الصليبي\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٤.٤\u003c/span\u003e\n          \u003ch3\u003e🏚️ سقوط عكا ونهاية الوجود الصليبي\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eب\u003c/span\u003eعد عين جالوت بدأ المماليك يُنهون إمارات الصليبيين واحدةً واحدةً: قيسارية وأرسوف ويافا وأنطاكية، ثم حصن الأكراد، ثم طرابلس سنة ١٢٨٩، ثم عكا سنة ١٢٩١. وبسقوط عكا انتهى الوجود الصليبي في الشرق بعد ١٩٢ سنة من الحملة الأولى، ولم تبقَ لهم قدمٌ في الأرض.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eبعد انتصار عين جالوت صار المماليك هم القوة الأولى في المنطقة، وكان الصليبيون قد أدركوا أن وجودهم في الشرق صار مهدّداً، وكان في هذا الإدراك ما جعلهم يُحاولون التحالف مع المغول ضد المماليك. وكان في هذا التحالف ما جعل المماليك يُقرّرون أن يُنهوا الوجود الصليبي في الساحل قبل أن يُواجهوا المغول في الشرق. وكان في هذا التحالف ما جعل المماليك يُقرّرون أن يُنهوا الوجود الصليبي في الساحل قبل أن يُواجهوا المغول في الشرق، وأن من يُواجه خطرين فليبدأ بأقربهما وأضعفهما، وأن يُنهيه بسرعةٍ قبل أن يجتمعا عليه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان بيبرس قد بدأ سياسةً واضحةً: أن يفتح الحصون الساحلية واحداً واحداً حتى لا يبقى للصليبيين ميناء، وكان في هذه السياسة ما جعل الصليبيين يفقدون خطوط إمدادهم من أوروبا. وكان في هذا ما يُبيّن أن من أراد أن يُنهي وجود عدوٍّ في أرضٍ فليقطع عنه البحر، وأن المدن الساحلية تعيش على ما يأتيها من الخارج. وكان في هذه السياسة ما جعل الصليبيين يفقدون خطوط إمدادهم من أوروبا، وكان في هذا ما يُبيّن أن من أراد أن يُنهي وجود عدوٍّ في أرضٍ فليقطع عنه البحر، وأن المدن الساحلية تعيش على ما يأتيها من الخارج.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد فتح بيبرس قيسارية وأرسوف سنة ١٢٦٥، ثم صفد وحصن الأكراد، ثم يافا وأنطاكية سنة ١٢٦٨، وكان في هذه الفتوحات ما جعل الصليبيين يفقدون معظم مدنهم. وكان في هذا ما يُبيّن أن الفتح التدريجي أضمن من الفتح الشامل، وأن من أراد أن يُنهي عدواً فليأخذ منه ما يستطيع في كل عام. وكان في هذه الفتوحات ما جعل الصليبيين يفقدون معظم مدنهم في ثلاث سنوات، وكان في هذا ما يُبيّن أن الفتح التدريجي أضمن من الفتح الشامل، وأن من أراد أن يُنهي عدواً فليأخذ منه ما يستطيع في كل عام، وأن الصبر على هدفٍ واحدٍ قد يُحقّقه أسرع من حملةٍ كبيرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد استمرّ قلاوون في السياسة نفسها، ففتح حصن المرقب سنة ١٢٨٥، ثم اللاذقية، ثم طرابلس سنة ١٢٨٩، وكان في سقوط طرابلس ما جعل الصليبيين يفقدون آخر إمارةٍ كبيرةٍ في الشمال. وكان في هذا ما جعل عكا هي الهدف الأخير، لأنها كانت العاصمة الفعلية للصليبيين وأقوى حصونهم. وكان في سقوط طرابلس ما جعل الصليبيين يفقدون آخر إمارةٍ كبيرةٍ في الشمال، وكان في هذا ما جعل عكا هي الهدف الأخير، لأنها كانت العاصمة الفعلية للصليبيين وأقوى حصونهم وأغنى مدنهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد مات قلاوون قبل أن يُهاجم عكا، فخلفه ابنه الأشرف خليل، وكان شاباً في العشرين، وكان في هذا ما جعل بعض الناس يُشكّكون في قدرته، ولكنه أثبت أنه قادر. وكان في هذا ما يُبيّن أن الشباب قد يُنجز ما لا يُنجزه من انتظر طويلاً، وأن من أُعطي السلطة مبكراً قد يُفاجئ الناس. وكان في هذا التولية ما جعل بعض الناس يُشكّكون في قدرة الأشرف خليل، لأنه كان شاباً لم يُجرّب في الحروب الكبيرة، ولكنّه أثبت أنه قادر، وأن من أُعطي السلطة مبكراً قد يُفاجئ الناس، وأن الشباب قد يُنجز ما لا يُنجزه من انتظر طويلاً.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي أبريل ١٢٩١ حاصر الأشرف خليل عكا بجيشٍ كبير، وكان معه نحو مئتي ألفٍ ومنجنيقات كثيرة، وكان في هذا الحصار ما جعل المدينة تُسقط بعد أربعة وأربعين يوماً. وكان في هذا ما يُبيّن أن الحصار إذا كان منظّماً بآلاته وصبره فقد يُسقط أقوى الحصون، وأن من أراد مدينةً فليُعدّ لها عدّةً لا حملةً. وكان في هذا الحصار ما جعل المدينة تُسقط بعد أربعة وأربعين يوماً، وكان في هذا ما يُبيّن أن الحصار إذا كان منظّماً بآلاته وصبره فقد يُسقط أقوى الحصون، وأن من أراد مدينةً فليُعدّ لها عدّةً لا حملةً.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد سقطت عكا في مايو ١٢٩١، ووقعت فيها مذبحة، ودُمّرت المدينة، وكان في هذا السقوط ما جعل الوجود الصليبي في الشرق ينتهي، وكان في هذا ما جعل المسلمين يفرحون فرحاً عظيماً. وكان في هذا ما يُبيّن أن النهاية قد تكون سريعةً بعد سنواتٍ من التقدّم البطيء، وأن من صبر على هدفٍ طويلاً قد يراه يتحقّق في يومٍ واحد. وكان في هذا السقوط ما جعل المسلمين يفرحون فرحاً عظيماً، وكان في هذا ما يُبيّن أن النهاية قد تكون سريعةً بعد سنواتٍ من التقدّم البطيء، وأن من صبر على هدفٍ طويلاً قد يراه يتحقّق في يومٍ واحد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في سقوط عكا ما جعل الصليبيين يُخلون بقية المدن الساحلية: صور وصيدا وبيروت وطرطوس، وكان في هذا الإخلاء ما جعل الساحل خالياً منهم، وكان في هذا ما يُبيّن أن سقوط العاصمة يُسقط ما حولها، وأن من أراد أن يُنهي كياناً فليضرب مركزه لا أطرافه. وكان في هذا الإخلاء ما جعل الساحل خالياً منهم في أشهر، وكان في هذا ما يُبيّن أن سقوط العاصمة يُسقط ما حولها، وأن من أراد أن يُنهي كياناً فليضرب مركزه لا أطرافه، وأن الأطراف تسقط بلا قتالٍ إذا سقط المركز.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا الانتهاء ما جعل بعض المؤرّخين يُسمّون سنة ١٢٩١ نهاية «الحروب الصليبية»، وكان في هذا التسمية ما جعل الناس يظنّون أن الحملات توقّفت، ولكنها في الحقيقة استمرّت في شكلٍ آخر. وكان في هذا ما يُبيّن أن التاريخ لا ينتهي بتواريخ، وأن ما يُسمّى نهايةً قد يكون تحوّلاً في الشكل لا في الجوهر. وكان في هذا ما جعل بعض المؤرّخين يُسمّون ١٢٩١ نهاية «الحروب الصليبية»، وكان في هذه التسمية ما جعل الناس يظنّون أن الحملات توقّفت، ولكنها في الحقيقة استمرّت في شكلٍ آخر، وأن ما يُسمّى نهايةً قد يكون تحوّلاً في الشكل لا في الجوهر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا الانتهاء ما جعل أوروبا تفقد الطريق البري إلى الشرق، فبدأت تبحث عن طريقٍ بحري، وكان في هذا البحث ما جعل الرحلات البحرية الكبرى تبدأ بعد قرنين. وكان في هذا ما يُبيّن أن الهزيمة قد تُغيّر اتجاه التاريخ، وأن من أُغلق أمامه بابٌ فتح باباً آخر، وأن الحروب الصليبية لم تنتهِ بل تحوّلت إلى استعمارٍ من نوعٍ آخر. وكان في هذا البحث ما جعل الرحلات البحرية الكبرى تبدأ بعد قرنين، وكان في هذا ما يُبيّن أن الهزيمة قد تُغيّر اتجاه التاريخ، وأن من أُغلق أمامه بابٌ فتح باباً آخر، وأن الحروب الصليبية لم تنتهِ بل تحوّلت إلى استعمارٍ من نوعٍ آخر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في سقوط عكا ما جعل المماليك يُصبحون القوة الأولى في شرق المتوسط، وكان في هذا ما جعل دولتهم تُسيطر على الساحل والشام والحجاز، وكان في هذا ما جعل القاهرة مركز العالم الإسلامي لقرنين. وكان في هذا ما يُبيّن أن من أنقذ أمةً قد يحكمها قروناً، وأن الشرعية التي تُبنى على الجهاد تبقى أطول من الشرعية التي تُبنى على النسب. وكان في هذا ما جعل القاهرة مركز العالم الإسلامي لقرنين، وكان في هذا ما يُبيّن أن من أنقذ أمةً قد يحكمها قروناً، وأن الشرعية التي تُبنى على الجهاد تبقى أطول من الشرعية التي تُبنى على النسب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذه النهاية ما جعل بعض الصليبيين يُحاولون العودة بعد ذلك، فقد خرجت حملاتٌ صغيرة إلى الشام في القرن الرابع عشر، ولكنها لم تُحقّق شيئاً، وكان في هذا ما يُبيّن أن الظروف إذا تغيّرت لا تعود كما كانت، وأن من أراد أن يُعيد ما فقد فليعلم أن الزمن لا يعود. وكان في هذه الحملات ما جعلها تفشل بلا أثر، وكان في هذا ما يُبيّن أن الظروف إذا تغيّرت لا تعود كما كانت، وأن من أراد أن يُعيد ما فقد فليعلم أن الزمن لا يعود، وأن التاريخ لا يُكرّر نفسه بالضبط.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذه النهاية أيضاً ما جعل المسلمين يُدركون أن النصر لم يأتِ من حملةٍ واحدة بل من سلسلةٍ من الخطوات: توحيد مصر والشام، ثم بناء جيشٍ قوي، ثم فتح الحصون واحداً واحداً. وكان في هذا ما يُبيّن أن الأهداف الكبيرة تُحقّق بالصبر الطويل لا بالحماسة القصيرة، وأن من أراد أن يُنهي ظلماً مستمراً فليخطّط له سنواتٍ لا أياماً. وكان في هذا ما يُبيّن أن الأهداف الكبيرة تُحقّق بالصبر الطويل لا بالحماسة القصيرة، وأن من أراد أن يُنهي ظلماً مستمراً فليخطّط له سنواتٍ لا أياماً، وأن النصر الذي يبدو مفاجئاً في نهايته كان يُبنى في بدايته.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eاستراتيجية الحصون\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت استراتيجية المماليك تقوم على فتح الحصون الساحلية واحداً واحداً، وكان في هذه الاستراتيجية ما جعل الصليبيين يفقدون موانئهم تدريجياً، وكان في هذا ما يُبيّن أن من أراد أن يُنهي وجود عدوٍّ في أرضٍ فليقطع عنه البحر. وكان في هذه الاستراتيجية ما جعل الصليبيين يفقدون موانئهم تدريجياً، وكان في هذا ما يُبيّن أن من أراد أن يُنهي وجود عدوٍّ في أرضٍ فليقطع عنه البحر، وأن الحرب الاقتصادية قد تكون أقوى من الحرب العسكرية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذه الاستراتيجية صبرٌ طويل، فقد استمرّت من ١٢٦٥ إلى ١٢٩١، أي ستةً وعشرين سنة، وكان في هذا الصبر ما جعل النصر ممكناً. وكان في هذا ما يُبيّن أن الأهداف الكبيرة تحتاج إلى وقتٍ طويل، وأن من أراد نتيجةً سريعة قد يخسر كل شيء. وكان في هذا الصبر ما جعل النصر ممكناً، وكان في هذا ما يُبيّن أن الأهداف الكبيرة تحتاج إلى وقتٍ طويل، وأن من أراد نتيجةً سريعة قد يخسر كل شيء، وأن الصبر في الحرب سلاحٌ لا يقلّ عن السيف.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذه الاستراتيجية أيضاً ما جعل الصليبيين يُحاولون التحالف مع المغول، وكان في هذا التحالف ما جعل المماليك يُسرعون بإنهاء الوجود الصليبي قبل أن يُواجهوا خطراً أكبر. وكان في هذا ما يُبيّن أن الخطرين إذا اجتمعا وجب على من يُواجههما أن يبدأ بأضعفهما وأقربهما.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eسقوط عكا ١٢٩١\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت عكا أقوى حصون الصليبيين وأغناها، وكانت عاصمتهم الفعلية، وكان في سقوطها ما جعل الوجود الصليبي في الشرق ينتهي. وكان في هذا ما يُبيّن أن سقوط العاصمة يُسقط ما حولها، وأن من أراد أن يُنهي كياناً فليضرب مركزه لا أطرافه. وكان في سقوطها ما جعل الوجود الصليبي في الشرق ينتهي، وكان في هذا ما يُبيّن أن سقوط العاصمة يُسقط ما حولها، وأن من أراد أن يُنهي كياناً فليضرب مركزه لا أطرافه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد حاصرها الأشرف خليل بجيشٍ كبيرٍ ومنجنيقات، وسقطت بعد أربعة وأربعين يوماً، وكان في هذا الحصار ما جعل المدينة تُدمّر تدميراً كاملاً. وكان في هذا ما يُبيّن أن الحصار إذا كان منظّماً بآلاته وصبره فقد يُسقط أقوى الحصون، وأن من أراد مدينةً فليُعدّ لها عدّةً لا حملةً.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في سقوط عكا ما جعل الصليبيين يُخلون بقية المدن بلا قتال، وكان في هذا ما جعل الساحل خالياً منهم في أشهر، وكان في هذا ما يُبيّن أن النهاية قد تكون سريعةً بعد سنواتٍ من التقدّم البطيء، وأن من صبر على هدفٍ طويلاً قد يراه يتحقّق في يومٍ واحد. وكان في هذا ما جعل الساحل خالياً منهم في أشهر، وكان في هذا ما يُبيّن أن النهاية قد تكون سريعةً بعد سنواتٍ من التقدّم البطيء.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eما بعد النهاية\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم تنتهِ الحروب الصليبية سنة ١٢٩١ بالمعنى الحقيقي، فقد استمرّت في شكلٍ آخر: حملاتٌ صغيرة إلى الشام، ثم استعمارٌ في القرون التالية، وكان في هذا ما يُبيّن أن التاريخ لا ينتهي بتواريخ، وأن ما يُسمّى نهايةً قد يكون تحوّلاً في الشكل لا في الجوهر. وكان في هذا ما يُبيّن أن التاريخ لا ينتهي بتواريخ، وأن ما يُسمّى نهايةً قد يكون تحوّلاً في الشكل لا في الجوهر، وأن من أراد أن يفهم حرباً فليقرأ ما بعدها لا ما فيها فقط.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في سقوط عكا ما جعل أوروبا تفقد الطريق البري إلى الشرق، فبدأت تبحث عن طريقٍ بحري، وكان في هذا البحث ما جعل الرحلات البحرية الكبرى تبدأ بعد قرنين. وكان في هذا ما يُبيّن أن الهزيمة قد تُغيّر اتجاه التاريخ، وأن من أُغلق أمامه بابٌ فتح باباً آخر. وكان في هذا البحث ما جعل الرحلات البحرية الكبرى تبدأ بعد قرنين، وأن من أُغلق أمامه بابٌ فتح باباً آخر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذه النهاية ما جعل المماليك يُصبحون القوة الأولى في شرق المتوسط، وكان في هذا ما جعل القاهرة مركز العالم الإسلامي لقرنين. وكان في هذا ما يُبيّن أن من أنقذ أمةً قد يحكمها قروناً، وأن الشرعية التي تُبنى على الجهاد تبقى أطول من الشرعية التي تُبنى على النسب.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالاستراتيجية\u003c/b\u003e\u003cspan\u003eفتح الحصون الساحلية واحداً واحداً من ١٢٦٥ إلى ١٢٩١\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eبيبرس\u003c/b\u003e\u003cspan\u003eقيسارية وأرسوف ويافا وأنطاكية ١٢٦٥–١٢٦٨\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eقلاوون\u003c/b\u003e\u003cspan\u003eالمرقب واللاذقية وطرابلس ١٢٨٥–١٢٨٩\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eعكا\u003c/b\u003e\u003cspan\u003eحاصرها الأشرف خليل، وسقطت في مايو ١٢٩١ بعد ٤٤ يوماً\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمدة\u003c/b\u003e\u003cspan\u003e١٩٢ سنة بين الحملة الأولى ١٠٩٩ وسقوط عكا ١٢٩١\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمدينة\u003c/th\u003e
