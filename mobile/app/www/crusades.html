 إسلامي» بالمعنى السياسي، بل كان هناك خلافةٌ رمزية في بغداد، وسلطنةٌ سلجوقية متشظّية، وإماراتٌ في الشام تتنازع على المدن، ودولةٌ فاطمية في مصر تُعاني صراعاً على الوزارة. وكان في هذا التشرّد ما جعل الحملة الصليبية تنجح بجيشٍ لا يزيد على خمسة عشر ألفاً.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eفي سنة ١٠٩٩ كانت الخلافة العباسية في بغداد قد فقدت سلطتها الفعلية منذ أكثر من قرنين، وكان الخليفة المستظهر بالله يجلس على عرشٍ لا يملك من أمره شيئاً، وكان السلاجقة هم من يُديرون الدولة باسمه. وكان في هذا الوضع ما جعل بغداد عاصمةً رمزيةً لا مركز قرار، وأن من أراد أن يُحرّك جيشاً فليس عليه أن يستأذن الخليفة بل أن يُقنع السلطان. وكان في هذا ما جعل بغداد تُصبح مركز شرعيةٍ لا مركز قرار، وأن من أراد أن يتحرّك فليجد سلطةً أخرى غير الخلافة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت السلطنة السلجوقية نفسها قد تشظّت بعد موت السلطان ملكشاه سنة ١٠٩٢، فقد اقتسم أبناؤه وإخوته الدولة، وصار لكلٍّ منهم سلطنةٌ صغيرة، وكان في هذا التشرّد ما جعل السلاجقة عاجزين عن أن يُوجّهوا قوةً واحدة إلى الشام. وكان في هذا ما جعل الحملة الصليبية تمرّ من آسيا الصغرى إلى الشام بلا جيشٍ مركزي يُواجهها، وأن الدولة التي كانت تُهدّد بيزنطة قبل ثلاثين سنة لم تكن قادرةً على حماية مدنها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت الشام في أسوأ حالاتها: فقد كانت دمشق تحت حكم دقاق بن تتش، وحلب تحت حكم رضوان بن تتش، وكان الأخوان يتنازعان، وكان في هذا التنازع ما جعل كل واحدٍ منهما يُحالف الصليبيين ضد أخيه. وكان في هذا ما يُبيّن أن الخطر الخارجي لا يكون خطيراً إلا إذا وجد داخلاً مُتشظّياً، وأن من يُحالف عدوّه ضد أخيه يُهيّئ لنفسه هزيمةً مؤجّلة. وكان في هذا التنازع بين الأخوين ما جعل الصليبيين يجدون في كل واحدٍ منهما حليفاً محتملاً، وأن من أراد أن يفتح بلداً فليبدأ بتأجيج خلاف أهله.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت المدن الشامية الأخرى موزّعةً بين إماراتٍ صغيرة: حمص، وحماة، وشيزر، وطرابلس، وأنطاكية، والرها، وكان لكلٍّ منها أميرٌ يُقاتل جاره، وكان في هذا التشتّت ما جعل الصليبيين يتقدّمون بلا مقاومةٍ جماعية، وأنهم فتحوا المدن واحدةً واحدةً لأن كل مدينةٍ كانت تُقاتل وحدها. وكان في هذا ما جعل المسلمين يخسرون الساحل كله في جيلٍ واحد. وكان في هذا التشتّت ما جعل كل مدينةٍ تُدافع عن نفسها وحدها، وأن الصليبيين لم يحتاجوا إلى جيشٍ كبيرٍ بل إلى صبرٍ على حصار كل واحدةٍ على حدة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت الدولة الفاطمية في مصر في صراعٍ دائمٍ على الوزارة: فقد كان الوزراء يتوالون ويُقتلون، وكان الجيش ينقسم بين فصائلَ تتنازع، وكان في هذا الصراع ما جعل مصر عاجزةً عن أن تُدافع عن فلسطين. وكان في هذا ما جعل القدس تسقط بجيشٍ صغير، لأن حاميتها كانت ضعيفةً بفعل الصراع على القاهرة لا بفعل قوة الصليبيين. وكان في هذا الصراع ما جعل الجيش المصري يُقاتل نفسه لا عدوّه، وأن القدس تسقط بجيشٍ لا يزيد على خمسة عشر ألفاً لأن من كان يُدافع عنها كان مشغولاً بالقاهرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا التشرّد ما جعل المسلمين يُدركون بعد فوات الأوان أنهم خسروا لأنهم لم يكونوا أمةً واحدة، وكان في هذا ما جعل الخطاب الإسلامي بعد ذلك يبدأ من فكرة الوحدة لا من فكرة الحرب. وكان في هذا ما يُبيّن أن أول ما يجب أن يُبنى في مواجهة الخطر هو وحدة القرار، وأن الجيوش لا تُغني إذا لم يكن هناك من يُوجّهها إلى هدفٍ واحد. وكان في هذا ما جعل الخطاب بعد ذلك يبدأ من الداخل: أن يُصلح الحاكم نفسه قبل أن يُطالب الناس بالجهاد، وأن الوحدة شرطٌ لا شعار.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا الوضع أيضاً ما جعل الردّ يأتي من الأطراف لا من المراكز: فبغداد لم تُرسل جيشاً، والقاهرة لم تُرسل جيشاً، وكان الردّ من الموصل وحلب ودمشق، من أمراءٍ صغارٍ صعدوا بالمصادفة والكفاءة. وكان في هذا ما يُبيّن أن الأمة قد تُنجب منقذيها من حيث لا تتوقّع، وأن المراكز التي فقدت وظيفتها تُصبح عاجزةً حتى عن الدفاع عن نفسها. وكان في هذا ما جعل الموصل وحلب ودمشق تُصبح مراكز قرارٍ فعلي بعد أن كانت بغداد والقاهرة مراكز شرعيةٍ فقط، وأن التاريخ قد يُغيّر مركزه بلا إعلان.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا الوضع ما جعل العلماء يلعبون دوراً مركزياً: فقد كانوا يُحرّضون على الجهاد ويُبيّنون للناس أن ترك الجهاد هو سبب الهزيمة، وكان في هذا الخطاب ما جعل الردّ يبدأ فكرياً قبل أن يبدأ عسكرياً. وكان في هذا ما يُبيّن أن من أراد أن يُغيّر واقعاً فليبدأ بتغيير الفكرة التي يقبل بها الناس هذا الواقع. وكان في هذا ما جعل العلماء يُصبحون قادة رأيٍ عام، وأن من يملك المنبر يستطيع أن يُحرّك الناس أكثر ممن يملك الجيش، وأن الفكرة تسبق السيف دائماً.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كتب الإمام أبو الحسن السُّلمي كتابه في الجهاد سنة ١١٠٥، أي بعد ست سنواتٍ من سقوط القدس، وكان في هذا الكتاب ما جعل الخطاب الجهادي يُصاغ صياغةً جديدة تُخاطب الحكّام وتُحرّضهم على الاستنصار. وكان في هذا ما يُبيّن أن الكتابة قد تكون فعلاً سياسياً، وأن القلم قد يسبق السيف في إيقاظ الأمة. وكان في هذا الكتاب ما جعل الخطاب يُخاطب الحكّام بأسمائهم ويُوبّخهم على التقصير، وكان في هذا ما جعل بعضهم يغضب وبعضهم يستجيب، وأن الكلمة قد تُحرّك أكثر مما تُحرّك الجيوش.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في حال الشرق أيضاً ما جعل بعض الأمراء يُدركون الخطر ويحاولون التنسيق، ولكن محاولاتهم كانت محدودةً لأنها لم تكن مبنيةً على قاعدةٍ من الوحدة. وكان في هذا ما يُبيّن أن التنسيق بين المتفرّقين لا يُنتج وحدة، وأن من أراد أن يجمع الناس فليبدأ ببناء قاعدةٍ تُجمع عليها لا بنداءٍ يُطلق من فوق. وكان في هذه المحاولات ما جعل بعض الأمراء يتّفقون مؤقتاً على مقاومة الصليبيين، ولكن الاتفاقات كانت تُنقض بعد أول خلافٍ على مدينةٍ أو غنيمة، وأن التحالف بلا قاعدةٍ لا يبقى.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا الوضع ما جعل المسلمين يخسرون المدن الساحلية واحدةً بعد أخرى في العقود التالية: فسقطت طرابلس سنة ١١٠٩، وصيدا سنة ١١١٠، وبيروت سنة ١١١٠، وصور سنة ١١٢٤، وكان في هذا التقدّم البطيء ما جعل الصليبيين يُصبحون دولةً ساحليةً ذات موانئ وتجارة. وكان في هذا ما جعل الردّ بعد ذلك أصعب، لأن العدوّ صار له اقتصادٌ وأسطولٌ وحصون. وكان في هذا التقدّم ما جعل الصليبيين يُنشئون موانئ تُصدّر السكر والزيت والقطن إلى أوروبا، وكان في هذا ما جعل لهم مصلحةً اقتصاديةً في البقاء، وأن الحرب صارت تجارةً أيضاً.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eخلافة بلا سلطة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الخليفة العباسي في بغداد يُخطب له على المنابر من خراسان إلى الشام، ولكن لم يكن يملك جيشاً ولا مالاً ولا قراراً. وكان في هذا الوضع ما جعل الخلافة مؤسسةً رمزيةً تُعطي الشرعية لمن يحكم ولا تُعطي الحكم لمن يُريد، وكان في هذا ما جعل من أراد أن يُحرّك الأمة بحاجةٍ إلى سلطةٍ أخرى غير الخلافة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا الوضع ما جعل بغداد تفقد وظيفتها السياسية وتحتفظ بوظيفتها الرمزية، وكان في هذا ما جعل المدن الأخرى تُصبح مراكز قرارٍ فعلي: القاهرة، وأصفهان، والموصل، ودمشق. وكان في هذا التعدّد ما جعل الأمة بلا مركزٍ واحد، وأن من أراد أن يُوحّدها فليبنِ مركزاً جديداً لا أن ينتظر من المركز القديم أن يعود.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا ما يُبيّن أن المؤسسات إذا فقدت وظيفتها بقيت أشكالها، وأن الشكل بلا وظيفةٍ يصبح عبئاً لا سنداً. وكان في هذا ما جعل الإصلاح في القرون التالية يبدأ من بناء مؤسساتٍ جديدة لا من إحياء القديمة، وكان في هذا درسٌ في أن الأسماء لا تُغني عن الوظائف.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eإماراتٌ تتنازع\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الشام سنة ١٠٩٩ مجموعةً من الإمارات الصغيرة، وكان بينها من العداء أكثر مما بينها وبين الصليبيين. وكان في هذا ما جعل بعض الأمراء يُحالف الصليبيين ضد أخيه المسلم، وكان في هذا ما جعل الحملة تتقدّم بلا مقاومةٍ جماعية، وأن المدن تسقط واحدةً واحدةً لأن كل مدينةٍ كانت تُقاتل وحدها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا التنازع ما جعل الصليبيين يُصبحون طرفاً في السياسة الشامية لا عدواً خارجياً فقط، وكان في هذا ما جعل بعض الأمراء يُعاهدونهم ويُجارونهم ويُمرّرون لهم المؤن. وكان في هذا ما يُبيّن أن العدوّ قد يُصبح شريكاً إذا كان التنازع الداخلي أشدّ من الخطر الخارجي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا ما جعل الوحدة تُصبح شرطاً للبقاء لا ترفاً سياسياً، وأن من أراد أن يطرد العدوّ فليبدأ بإنهاء التنازع الداخلي. وكان في هذا ما جعل الزنكيين بعد ذلك يبدأون بالشام لا بالقدس، لأنهم فهموا أن الطريق إلى القدس يمرّ بتوحيد الشام أولاً. وكان في هذا ما جعل الزنكيين يبدأون بتوحيد الشام لا بتحرير القدس، لأنهم فهموا أن الطريق إلى الجنوب يمرّ بتوحيد الشمال.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eمصر والصراع على الوزارة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الدولة الفاطمية في مصر تُعاني صراعاً دائماً على الوزارة، وكان الوزراء يتوالون ويُقتلون، وكان الجيش ينقسم بين فصائل تتنازع. وكان في هذا الصراع ما جعل مصر عاجزةً عن الدفاع عن فلسطين، وأن القدس تسقط بجيشٍ صغير لأن حاميتها كانت ضعيفةً بفعل الصراع في القاهرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا الصراع ما جعل الفاطميين يُحاولون الاستعانة بالصليبيين في بعض الأحيان ضد خصومهم الداخليين، وكان في هذا ما يُبيّن أن الخطر الخارجي قد يُستدعى لحلّ مشكلةٍ داخلية، وأن من يستدعي عدوّه ليقضي له حاجةً يجد نفسه بعد ذلك تحت رحمته. وكان في هذا ما جعل مصر تُصبح ساحةً مفتوحةً للتدخّل الخارجي، وأن من أضعف نفسه بطلب العون من الخارج لم يعد قادراً على أن يمنع الداخل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا الضعف ما جعل مصر هدفاً بعد ذلك لكل من أراد أن يُوحّد الجبهة: فقد أراد نور الدين أن يُسيطر عليها ليُطوّق الصليبيين من الجنوب، وقد تحقّق ذلك على يد صلاح الدين سنة ١١٦٩. وكان في هذا ما يُبيّن أن الفراغ في مصر كان أخطر من الفراغ في الشام، لأن مصر كانت أكبر قوةٍ بشريةٍ واقتصادية في المنطقة.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eبغداد\u003c/b\u003e\u003cspan\u003eخلافةٌ رمزية بلا جيشٍ ولا مال، والسلاجقة يُديرون الدولة باسمها\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالسلاجقة\u003c/b\u003e\u003cspan\u003eتشظّوا بعد موت ملكشاه سنة ١٠٩٢ إلى سلطناتٍ صغيرة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالشام\u003c/b\u003e\u003cspan\u003eدمشق وحلب وحمص وشيزر وطرابلس وأنطاكية والرها إماراتٌ متنازعة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمصر\u003c/b\u003e\u003cspan\u003eصراعٌ دائم على الوزارة، وعجزٌ عن حماية فلسطين\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالساحل\u003c/b\u003e\u003cspan\u003eسقوط طرابلس ١١٠٩ وصور ١١٢٤، وصليبيون صاروا دولةً ساحلية\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمركز\u003c/th\u003e\u003cth\u003eحال السلطة\u003c/th\u003e\u003cth\u003eالأثر على مواجهة الخطر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eبغداد\u003c/td\u003e\u003ctd\u003eخلافةٌ رمزية وسلطنةٌ متشظّية\u003c/td\u003e\u003ctd\u003eلا جيشٌ مركزي، ولا قرارٌ موحّد\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eدمشق وحلب\u003c/td\u003e\u003ctd\u003eتنازعٌ بين الأخوين دقاق ورضوان\u003c/td\u003e\u003ctd\u003eتحالفاتٌ مع الصليبيين ضد بعضهم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالقاهرة\u003c/td\u003e\u003ctd\u003eصراعٌ على الوزارة\u003c/td\u003e\u003ctd\u003eضعفٌ في حامية القدس وفلسطين\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالموصل\u003c/td\u003e\u003ctd\u003eإمارةٌ صاعدة على الحدود\u003c/td\u003e\u003ctd\u003eستُصبح مركز الردّ بعد أربعين سنة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eإنما سُلّط عليكم العدوّ بذنوبكم، ولو أطعتم الله لسلّطكم عليهم.\u003c/p\u003e\u003ccite\u003eمن خطاب العلماء في القرن السادس الهجري عن أسباب سقوط المدن\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eسنة ١٠٩٩ لم يكن هناك عالم إسلامي بالمعنى السياسي: خلافةٌ رمزية في بغداد، وسلاجقة متشظّون، وشامٌ تُقاسمه إماراتٌ متنازعة تتحالف مع الصليبيين ضد بعضها، ومصر في صراعٍ على الوزارة. وكان في هذا التشرّد ما جعل الحملة تنجح بجيشٍ صغير، وأن الساحل يسقط مدينةً مدينة. وقد بدأ الردّ فكرياً بالكتابة في الجهاد، ثم جاء من أطراف الشام لا من مراكزها.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"zangi","n":"عماد الدين زنكي والرها","ic":"🏹","part":"القسم الثاني: الرد الإسلامي","h":"\u003carticle class=\"ch3\" id=\"zangi\" data-toc=\"عماد الدين زنكي والرها\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٢.٢\u003c/span\u003e\n          \u003ch3\u003e🏹 عماد الدين زنكي والرها\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي سنة ١١٢٧ تولّى عماد الدين زنكي أتابكية الموصل، وفي سبعة عشر عاماً بنى قوةً جمعت الموصل والجزيرة وحلب، ثم فتح الرها في ديسمبر ١١٤٤، فكان أول فتحٍ كبيرٍ للمسلمين منذ سقوط القدس، وأول إشارةٍ إلى أن التيار قد بدأ ينعكس.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان عماد الدين زنكي بن آقسنقر من قادة السلاجقة، وكان أبوه آقسنقر والياً على حلب فقُتل وهو صغير، فنشأ في كنف القادة السلاجقة وتعلّم الحرب والسياسة في بيئةٍ تُقاتل على كل شيء. وكان في نشأته هذه ما جعل منه رجلاً يعرف أن السلطة تُؤخذ ولا تُعطى، وأن من أراد أن يبقى فليكن أقوى من جيرانه. وكان في هذه النشأة ما جعل زنكي يعرف أن الدولة تُبنى بالجيش قبل أن تُبنى بالخطابة، وأن من فقد أباه في صغره يتعلّم أن يحمي نفسه بنفسه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سنة ١١٢٧ عيّنه السلطان السلجوقي محمود أتابكاً على الموصل، وكانت الموصل في ذلك الوقت إمارةً على حدود الجزيرة، وكان في هذا التعيين ما جعل زنكي يبدأ من قاعدةٍ صغيرةٍ لكنها في موقعٍ استراتيجي: على الطريق بين بغداد والشام، وعلى مقربةٍ من إمارات الصليبيين الشمالية. وكان في هذا الموقع ما جعل الموصل قادرةً على أن تُصبح مركز تجميعٍ للقوة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بدأ زنكي يبني قوته بالتدريج: فوسّع سلطته على الجزيرة الفراتية، وضمّ سنجار والموصل ونصيبين، ثم توجّه إلى الشام فضمّ حلب سنة ١١٢٨، وكان في هذا الضمّ ما جعل له قاعدةً في قلب الشام لا في أطرافها. وكان في هذا التوسّع ما جعل بعض الأمراء المسلمين يخافونه أكثر مما يخافون الصليبيين، وكان في هذا ما جعل الوحدة تُبنى بالقوة لا بالرضا. وكان في هذا التوسّع ما جعل الموصل وحلب في يدٍ واحدة، وكان في هذا ما جعل زنكي قادراً على أن يُهدّد إمارات الصليبيين من الشمال والشرق في وقتٍ واحد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في أسلوب زنكي ما جعل المؤرّخين يختلفون فيه: فمنهم من يراه بطلاً مُوحّداً، ومنهم من يراه قاسياً في معاملة خصومه من المسلمين، وقد كان يُعاقب من يعصيه بقسوةٍ شديدة. وكان في هذا ما يُبيّن أن من يُوحّد أمةً في وقتٍ متأزم قد يضطر إلى وسائل قاسية، وأن الحكم على الشخص يحتاج إلى وزن ما بناه وما كلّفه بناؤه. وكان في هذا الاختلاف ما جعل كل مؤرّخٍ يقرأ زنكي بحسب موقعه: من كتب في حلب رأى فيه مُوحّداً، ومن كتب في دمشق رأى فيه مُهدّداً، وأن التاريخ يُكتب من مواقع الكُتّاب لا من فوق.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان أهم ما فعله زنكي أنه لم يبدأ بالقدس، بل بدأ بالرها، وكانت الرها إمارةً صليبية في أقصى الشمال، وكانت أضعف الإمارات وأبعدها عن مركز الصليبيين. وكان في اختيار هذا الهدف ما جعل زنكي يُحقّق نصراً نفسياً كبيراً بأقلّ تكلفة، وأن من أراد أن ينتصر فليبدأ بالهدف الذي يمكن الوصول إليه لا بالهدف الذي يُريد الجميع الوصول إليه. وكان في هذا الاختيار ما جعل زنكي يُحقّق نصراً كبيراً بتكلفةٍ صغيرة، وأن من أراد أن يبدأ فليبدأ بما يستطيع لا بما يشتهي، وأن النصر الصغير يفتح باب النصر الكبير.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي ديسمبر ١١٤٤ حاصر زنكي الرها وفتحها بعد شهرٍ من الحصار، وكان في سقوطها ما جعل المسلمين يفرحون فرحاً عظيماً، لأنها كانت أول مدينةٍ كبيرةٍ تُستردّ بعد خمسٍ وأربعين سنة من سقوط أنطاكية. وكان في هذا الفتح ما جعل الأمة تُدرك أن الصليبيين ليسوا قوةً لا تُغلب، وأن التيار قد بدأ ينعكس. وكان في هذا الفتح ما جعل المسلمين يُدركون أن الصليبيين ليسوا قوةً لا تُغلب، وأن خمساً وأربعين سنة من الهزائم لا تعني أن التيار لا ينعكس، وأن أول خطوةٍ في الانعكاس نصرٌ صغير.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في سقوط الرها أيضاً ما جعل أوروبا تُفزع، فقد كان سقوط إمارةٍ صليبية نذيراً بأن المشروع كله في خطر، وكان في هذا ما جعل البابا يُعلن حملةً ثانية بعد نصف قرنٍ من الأولى. وكان في هذا ما يُبيّن أن الفتح الإسلامي كان له أثرٌ في أوروبا أكبر من حجمه العسكري، وأن الهزيمة الصليبية كانت دافعاً لحملةٍ جديدة لا لتراجع. وكان في هذا ما جعل البابا يُعلن الحملة الثانية سنة ١١٤٧، وكان في هذا ما يُبيّن أن الفتح الإسلامي كان له أثرٌ في أوروبا أكبر من حجمه، وأن الهزيمة الصليبية تُولّد حملةً جديدة لا تراجعاً.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في فتح الرها ما جعل زنكي يُصبح أعظم شخصيةٍ في الشرق، وكان في هذا ما جعل سلطان الموصل يخاف من قوّته، وكان في هذا ما جعل بعض الأمراء يُحالفون الصليبيين ضده. وكان في هذا ما يُبيّن أن النجاح قد يُولّد أعداءً من الأصدقاء قبل الأعداء، وأن من يكبر في نظامٍ متشظٍّ يُصبح خطراً على من فوقه كما على من دونه. وكان في هذا ما جعل بعض الأمراء يُحالفون الصليبيين ضد زنكي، وكان في هذا ما يُبيّن أن النجاح قد يُولّد أعداءً من الأصدقاء قبل الأعداء، وأن من يكبر في نظامٍ متشظٍّ يُصبح خطراً على الجميع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سنة ١١٤٦ قُتل زنكي في قلعة جعبر على الفرات، قتله أحد مماليكه في ليل، وكان في مقتله ما جعل الدولة التي بناها تنتقل إلى ابنه محمود، وكان ابنه الأكبر سيف الدين غازي في الموصل، ومحمود في حلب. وكان في هذا الاقتسام ما جعل الوحدة التي بناها زنكي تتصدّع بعد موته، وكان في هذا ما جعل ابنه نور الدين يُعيد بناءها في الشام. وكان في هذا الاقتسام ما جعل الدولة تنقسم إلى قسمين، وكان في هذا ما جعل الصليبيين يُحاولون استغلال الفراغ، وكان في هذا ما جعل نور الدين يبدأ من حلب لا من الموصل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في تجربة زنكي ما جعل درساً واضحاً: أن الوحدة يمكن أن تُبنى بالقوة في جيلٍ واحد، ولكنها لا تبقى إذا لم تكن مبنيةً على مؤسسةٍ لا على شخص. وكان في هذا ما جعل نور الدين بعد ذلك يبني المدارس والأوقاف والقضاء، لأنه فهم أن ما بناه أبوه بالسيف قد يضيع بالسيف، وأن ما يُبنى بالمؤسسة يبقى بعد صاحبه. وكان في هذا الدرس ما جعل نور الدين يبني المدارس والأوقاف والقضاء، لأنه فهم أن ما بناه أبوه بالسيف قد يضيع بالسيف، وأن ما يُبنى بالمؤسسة يبقى بعد صاحبه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في شخصية زنكي ما جعل بعض المؤرّخين يُلاحظون أنه لم يكن يُظهر التديّن الظاهر كما فعل ابنه، وكان في هذا ما جعل بعض العلماء يقتربون من نور الدين أكثر منه. وكان في هذا ما يُبيّن أن الشرعية الدينية صارت في ذلك العصر شرطاً للقيادة، وأن من أراد أن يجمع الناس على مشروعٍ مقدّس فليكن مظهره مناسباً للمشروع. وكان في هذا ما جعل العلماء يقتربون من نور الدين أكثر من أبيه، وكان في هذا ما يُبيّن أن الشرعية الدينية صارت شرطاً للقيادة في ذلك العصر، وأن المشروع المقدّس يحتاج إلى صورةٍ مقدّسة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في فتح الرها ما جعل المسلمين يُدركون أن الفتح لا يكفي، لأن الرها لم تكن القدس، وكان في هذا ما جعل الخطاب الجهادي يتوجّه بعد ذلك إلى الهدف الأكبر. وكان في هذا ما يُبيّن أن النصر الجزئي قد يكون مقدمةً للنصر الكامل إذا استُثمر، وأن من ينتصر في مكانٍ صغيرٍ يجب أن يُثبّت نصره قبل أن ينتقل إلى مكانٍ أكبر. وكان في هذا ما جعل الخطاب الجهادي يتوجّه بعد ذلك إلى الهدف الأكبر، وكان في هذا ما جعل المسلمين يُدركون أن استرداد مدينةٍ لا يعني استرداد الأرض، وأن النصر يحتاج إلى استثمارٍ ليُصبح فتحاً كاملاً.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eلماذا الرها أولاً؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الرها أضعف الإمارات الصليبية وأبعدها عن مركز الثقل في القدس وعكا، وكانت في أقصى الشمال على حدود الجزيرة التي كان زنكي يُسيطر عليها. وكان في هذا الموقع ما جعلها هدفاً قريباً وقابلاً للفتح، وكان في هذا ما جعل زنكي يبدأ بفتحٍ ممكنٍ لا بفتحٍ مُستحيل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في اختيار الرها ما جعل زنكي يُحقّق نصراً نفسياً كبيراً بأقلّ تكلفة: فسقوط إمارةٍ كاملةٍ أثرٌ أكبر من سقوط حصنٍ في الجنوب. وكان في هذا ما يُبيّن أن اختيار الهدف ليس مسألة عسكرية فقط بل مسألة نفسية، وأن من أراد أن يرفع معنويات أمةٍ فليختر نصراً واضحاً لا نصراً صغيراً.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في سقوط الرها ما جعل إمارة أنطاكية وطرابلس في خطرٍ مباشر، وكان في هذا ما جعل الصليبيين يُعيدون ترتيب صفوفهم، وكان في هذا ما جعل الحملة الثانية تتوجّه إلى الشام. وكان في هذا ما يُبيّن أن الفتح الصغير قد يُحرّك ردّ فعلٍ كبير، وأن من يفتح باباً لا يعرف من سيدخل منه.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالوحدة بالقوة\u003c/h4\u003e\u003cp class=\"ap\"\u003eبنى زنكي وحدته بالقوة لا بالرضا، فقد ضمّ حلب وسنجار والجزيرة بأسلوبٍ عسكري، وكان يُعاقب من يعصيه بقسوة. وكان في هذا الأسلوب ما جعل بعض الأمراء المسلمين يخافونه أكثر مما يخافون الصليبيين، وكان في هذا ما جعل الوحدة هشّةً لأنها كانت مبنيةً على الخوف لا على القبول.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا الأسلوب ما جعل الدولة تتصدّع بعد موته، فقد اقتسم ابناه الموصل وحلب، وكان في هذا الاقتسام ما جعل ما بناه بالسيف يضيع بالسيف. وكان في هذا ما يُبيّن أن الوحدة التي تُبنى على شخصٍ لا تبقى بعد الشخص، وأن من أراد أن يبني وحدةً دائمة فليبنيها على مؤسسة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في تجربة زنكي ما جعل نور الدين يتعلّم الدرس، فقد بنى بعد ذلك المدارس والأوقاف والقضاء، وكان في هذا ما جعل الوحدة تُبنى على مؤسسةٍ لا على شخص. وكان في هذا ما يُبيّن أن الابن قد يُصلح ما أفسده الأب، وأن التجربة الفاشلة قد تكون مدرسةً لمن جاء بعدها.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eمقتله وأثره\u003c/h4\u003e\u003cp class=\"ap\"\u003eقُتل زنكي سنة ١١٤٦ في قلعة جعبر على الفرات، قتله أحد مماليكه في ليل، وكان في مقتله ما جعل الدولة تنتقل إلى ابنيه، وكان في هذا الانتقال ما جعل الوحدة تتصدّع. وكان في هذا ما يُبيّن أن القائد الكبير قد يكون أسير شخصه، وأن دولةً تُبنى على رجلٍ واحدٍ تموت بمقتل رجلٍ واحد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في مقتله أيضاً ما جعل بعض المؤرّخين يقولون إنه قُتل بسبب قسوته، وكان في هذا ما جعل العبرة في أن القسوة قد تُحقّق نصراً وتُهيّئ هزيمةً في الوقت نفسه. وكان في هذا ما يُبيّن أن الحكم على القادة لا يكون بما حقّقوه فقط بل بما تركوه من بنيةٍ بعدهم. وكان في هذا ما جعل ابنه نور الدين يبدأ ببناء مؤسساتٍ لا ببناء جيشٍ فقط، وأن من رأى دولة أبيه تتصدّع فهم أن الشخص لا يكفي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في انتقال السلطة إلى نور الدين ما جعل الشام تُصبح مركز الردّ الجديد، وكان في هذا ما جعل مسار التاريخ يتغيّر بموت رجلٍ في قلعة. وكان في هذا ما يُبيّن أن الأحداث الكبرى قد تُصنع بالمصادفة، وأن من أراد أن يفهم التاريخ فليقرأ الحوادث الصغيرة التي غيّرت المسار.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالتعيين\u003c/b\u003e\u003cspan\u003e١١٢٧، أتابكاً على الموصل من السلطان السلجوقي محمود\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eحلب\u003c/b\u003e\u003cspan\u003eضُمّت سنة ١١٢٨، فصار لزنكي قاعدةٌ في قلب الشام\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالرها\u003c/b\u003e\u003cspan\u003eديسمبر ١١٤٤، أول فتحٍ كبيرٍ للمسلمين منذ سقوط القدس\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأثر الرها\u003c/b\u003e\u003cspan\u003eأفزع أوروبا وأدى إلى إعلان الحملة الثانية\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمقتله\u003c/b\u003e\u003cspan\u003e١١٤٦ في قلعة جعبر، وانتقلت الدولة إلى ابنيه\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e١١٢٧\u003c/td\u003e\u003ctd\u003eتعيينه أتابكاً على الموصل\u003c/td\u003e\u003ctd\u003eقاعدةٌ في موقعٍ استراتيجي بين بغداد والشام\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١١٢٨\u003c/td\u003e\u003ctd\u003eضمّ حلب\u003c/td\u003e\u003ctd\u003eقاعدةٌ في قلب الشام لا في أطرافه\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١١٤٤\u003c/td\u003e\u003ctd\u003eفتح الرها\u003c/td\u003e\u003ctd\u003eأول فتحٍ كبير، ورفعٌ للمعنويات بعد ٤٥ سنة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١١٤٦\u003c/td\u003e\u003ctd\u003eمقتله في قلعة جعبر\u003c/td\u003e\u003ctd\u003eاقتسام الدولة بين ابنيه، وتصدّع الوحدة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eلو لم يكن في الدنيا إلا الرها لكانت كافية.\u003c/p\u003e\u003ccite\u003eمن أثر فرحة المسلمين بسقوط الرها سنة ١١٤٤ كما تُصوّرها المصادر\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eبدأ زنكي من الموصل سنة ١١٢٧، وبنى قوةً جمعت الجزيرة وحلب، ثم فتح الرها في ديسمبر ١١٤٤ فكان أول فتحٍ كبيرٍ بعد خمسٍ وأربعين سنة. وقد اختار أضعف الإمارات وأبعدها ليُحقّق نصراً ممكناً، وكان لسقوطها أثرٌ في أوروبا أكبر من حجمها العسكري. لكن وحدته بُنيت على القوة لا على المؤسسة، فتصدّعت بعد مقتله سنة ١١٤٦، وكان في هذا درساً تعلّمه ابنه نور الدين.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"nur-al-din","n":"نور الدين محمود والوحدة","ic":"🕌","part":"القسم الثاني: الرد الإسلامي","h":"\u003carticle class=\"ch3\" id=\"nur-al-din\" data-toc=\"نور الدين محمود والوحدة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٢.٣\u003c/span\u003e\n          \u003ch3\u003e🕌 نور الدين محمود والوحدة\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eب\u003c/span\u003eعد مقتل زنكي ورث ابنه نور الدين محمود حلب، وكان أصغر من أن يُتوقّع له شيء، فبنى في ثلاثين عاماً وحدةً في الشام لم يعرفها من قبل، وضمّ دمشق سنة ١١٥٤، ومدّ يده إلى مصر، وترك لصلاح الدين أساساً جاهزاً لم يكن صلاح الدين وحده قادراً على بنائه.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eلمّا قُتل زنكي سنة ١١٤٦ كان ابنه محمود في حلب، وكان شاباً في الثامنة عشرة، ولم يكن أحدٌ يتوقّع أن يُصبح أعظم باني وحدةٍ في الشام منذ قرون. وكان في صعوده المفاجئ ما يُبيّن أن التاريخ لا يسير بحساب الأعمار، وأن من يُعطى مسؤوليةً في وقتٍ مبكرٍ قد يُنجح فيها أكثر ممن انتظرها طويلاً. وكان في هذا الصعود ما جعل بعض الأمراء يستخفّون به في البداية، وكان في هذا الاستخفاف ما جعلهم يُفاجؤون بعد ذلك بقوّته، وأن من يُستهان به في بدايته قد يكون أخطر ما في نهايته.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بدأ نور الدين بتثبيت سلطته في حلب، ثم وسّع نفوذه على حماة وحمص وبعلبك، وكان في هذا التوسّع ما جعل له قاعدةً في وسط الشام لا في طرفه. وكان في أسلوبه ما جعله يختلف عن أبيه: فقد كان يُفضّل التوسّع بالتفاهم والزواج والتحالف قبل السيف، وكان في هذا ما جعل وحدته أقلّ كلفةً من وحدة أبيه وأكثر ثباتاً. وكان في هذا الأسلوب ما جعل وحدته أقلّ كلفةً من وحدة أبيه، لأن الناس كانوا يقبلون حكمه أكثر مما كانوا يقبلون حكم أبيه، وأن الوحدة المقبولة تبقى أطول من الوحدة المفروضة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان أهمّ ما فعله نور الدين ضمّ دمشق سنة ١١٥٤، وكانت دمشق هي المدينة الكبرى في الشام، وكانت تحت حكم أسرةٍ من البوريين، وكانت تُهادن الصليبيين وتدفع لهم أتاوة. وكان في ضمّ دمشق ما جعل الشام الجنوبي يدخل في وحدةٍ واحدة مع الشام الشمالي، وكان في هذا ما جعل مواجهة الصليبيين ممكنةً بعد أن كانت مستحيلة. وكان في ضمّ دمشق ما جعل الشام كله في يدٍ واحدة للمرة الأولى منذ سنواتٍ طويلة، وكان في هذا ما جعل نور الدين أقوى من أي أميرٍ في المنطقة، وأن الوحدة بدأت تُثمر عسكرياً.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في ضمّ دمشق ما جعل نور الدين يُصبح أقوى شخصيةٍ في الشام، وكان في هذا ما جعل الصليبيين يُدركون أن خطراً جديداً قد ظهر. وكان في هذا ما جعل الحملة الثانية تتوجّه إلى دمشق سنة ١١٤٨، أي قبل الضمّ بست سنوات، وكان في فشلها ما جعل الصليبيين يفقدون القدرة على الهجوم ويُصبحون في موقع الدفاع. وكان في فشل الحملة الثانية ما جعل الصليبيين يفقدون الثقة في قدرتهم على التوسّع، وكان في هذا ما جعل الشام هي الطرف المهاجم بعد نصف قرنٍ من الدفاع، وأن التوازن قد انقلب بلا معركةٍ كبيرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان للحملة الثانية أثرٌ كبير في ميزان القوى: فقد خرجت بأعدادٍ كبيرة من أوروبا، وحاصرت دمشق أياماً، ثم انسحبت بعد أن فشلت، وكان في هذا الفشل ما جعل الصليبيين يفقدون الثقة في قدرتهم على التوسّع. وكان في هذا ما جعل نور الدين يتقدّم بعد ذلك بلا خوفٍ من حملةٍ أوروبية جديدة، وكان في هذا ما جعل الشام تُصبح هي الطرف المهاجم بعد نصف قرنٍ من الدفاع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في سياسة نور الدين ما جعل الوحدة تُبنى على مؤسسةٍ لا على شخص: فقد بنى المدارس في حلب ودمشق والموصل، وأوقف عليها الأوقاف، وكان في هذا ما جعل العلماء والفقها، يُصبحون جزءاً من الدولة لا خصوماً لها. وكان في هذا ما جعل الشرعية الدينية تُبنى بالعلم لا بالسيف، وكان في هذا ما جعل الدولة تبقى بعد صاحبها. وكان في هذه المدارس ما جعل الفقه يُصبح علماً له مناهج وإجازات، وكان في هذا ما جعل الدولة تُخرّج كوادرها بنفسها، وأن الشرعية الدينية صارت تُبنى بالتعليم لا بالسيف.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان نور الدين يهتمّ بالعدل اهتماماً ظاهراً: فقد جلس بنفسه للنظر في المظالم أياماً في الأسبوع، وبُنيت له دار العدل في دمشق، وكان في هذا ما جعل الناس يرون في الدولة حامياً لا جابياً فقط. وكان في هذا ما جعل القاعدة الشعبية للجهاد تتكوّن، لأن الناس يُقاتلون مع من يُنصفهم لا مع من يظلمهم. وكان في جلوسه للمظالم ما جعل الناس يُدركون أن الدولة ليست جابياً فقط، وكان في هذا ما جعل القاعدة الشعبية للجهاد تتكوّن، لأن الناس يُقاتلون مع من يُنصفهم لا مع من يظلمهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في سياسته الاقتصادية ما جعل الدولة قادرةً على تمويل الجهاد: فقد أُلغيت بعض الضرائب غير الشرعية، وقُوّيت الأوقاف، وكان في هذا ما جعل الجيش يُموّل من موارد ثابتة لا من الغنائم. وكان في هذا ما يُبيّن أن الحرب تحتاج إلى اقتصادٍ قبل أن تحتاج إلى جنود، وأن من أراد أن يُقاتل فليُعدّ المال قبل السلاح. وكان في هذا ما جعل الجيش لا يعتمد على الغنائم، وكان في هذا ما جعل القتال من أجل الدولة لا من أجل المال، وأن الجيش الذي يُقاتل من أجل الغنيمة يفترق بعدها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان أهمّ ما فعله نور الدين في آخر حياته أنه مدّ يده إلى مصر: فقد كان يرى أن مصر هي الجناح الجنوبي للصليبيين، وأن من يُسيطر عليها يُطوّقهم من الجهتين. وكان في هذا التفكير الاستراتيجي ما جعل نور الدين يختلف عن كل من سبقه، لأنه لم يكن يُقاتل في مكانٍ واحد بل كان يُفكّر في الخريطة كلها. وكان في هذا التفكير ما جعل نور الدين يقرأ الخريطة كلها لا المدينة التي أمامه، وكان في هذا ما جعل مشروعه أكبر من مشروع أبيه، وأن من أراد أن ينتصر فليقرأ الخريطة لا الميدان.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أرسل نور الدين قائده شيركوه إلى مصر ثلاث مرات، وكان معه ابن أخيه صلاح الدين، وكان في هذه الحملات ما جعل مصر تدخل في الصراع، وكان في هذا ما جعل الصليبيين يُحاولون التدخّل أيضاً. وكان في هذا التنافس على مصر ما جعلها تُصبح ساحة الصراع الكبرى، وكان في هذا ما جعل من يُسيطر عليها يُسيطر على مستقبل المنطقة. وكان في هذا التنافس ما جعل مصر تُصبح ساحة الصراع الكبرى، وكان في هذا ما جعل من يُسيطر عليها يُسيطر على مستقبل المنطقة، وأن الصراع على الجناح قد يكون أهم من الصراع على القلب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سنة ١١٦٩ نجح شيركوه في السيطرة على مصر، ثم مات بعد شهرين، فخلفه صلاح الدين في الوزارة، وكان في هذا الخلافة ما جعل مصر تنتقل إلى يدٍ شابةٍ من أسرةٍ صاعدة. وكان في هذا ما جعل نور الدين يرى أن مشروعه يكبر أكثر مما توقّع، وكان في هذا ما جعل العلاقة بينه وبين صلاح الدين تتوتّر بعد ذلك. وكان في هذا الانتقال ما جعل مصر تخرج من يد الفاطميين وتدخل في مشروع الزنكيين، وكان في هذا ما جعل صلاح الدين يبدأ من موقعٍ لم يكن يتوقّعه، وأن التاريخ قد يُعطي الشاب ما لم يُخطّط له.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد مات نور الدين سنة ١١٧٤، وكان قد بنى وحدةً في الشام ومصر لم يعرفها المسلمون منذ قرون، وكان في موته ما جعل هذه الوحدة تُصبح في يد صلاح الدين. وكان في هذا ما يُبيّن أن من يبني الأساس قد لا يُكمل البناء، وأن التاريخ يُعطي كل جيلٍ مهمةً قد لا يراها مُكتملة. وكان في موته ما جعل الوحدة التي بناها تنتقل إلى صلاح الدين، وكان في هذا ما يُبيّن أن من يبني الأساس قد لا يُكمل البناء، وأن التاريخ يُعطي كل جيلٍ مهمةً قد لا يراها مُكتملة، وأن الأجيال تتسالم العمل لا النتائج.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eضمّ دمشق ١١٥٤\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت دمشق أهم مدينةٍ في الشام، وكانت تحت حكم أسرةٍ من البوريين، وكانت تُهادن الصليبيين وتدفع لهم أتاوة سنوية مقابل ألا يُهاجموها. وكان في هذا الوضع ما جعل دمشق جزءاً من نظام الصليبيين لا خصماً لهم، وكان في هذا ما جعل ضمّها ضرورةً لا خياراً. وكان في هذه الأتاوة ما جعل دمشق تُموّل جيش من تُقاتله، وكان في هذا ما يُبيّن أن الهدنة التي تُشترى بالمال لا تُنهي الخطر بل تُؤجّله.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ضمّها نور الدين سنة ١١٥٤ بأسلوبٍ يجمع بين القوة والتفاهم، ودخلها بلا مذبحةٍ ولا تدمير، وكان في هذا ما جعله يكسب أهلها لا يخسرهم. وكان في هذا ما يُبيّن أن الفتح الحكيم هو الذي يجعل المفتوحين يُدافعون عن الفاتح، وأن من دخل مدينةً بالقتل لم يدخلها إلا بجيشٍ يُقيم فيها أبداً.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في ضمّ دمشق ما جعل الشام الجنوبي والشمالي في يدٍ واحدة، وكان في هذا ما جعل مواجهة الصليبيين ممكنةً بعد أن كانت مستحيلة. وكان في هذا ما جعل نور الدين يُصبح الطرف القادر على المبادرة، وكان في هذا ما جعل صلاح الدين بعد ذلك قادراً على أن يُوحّد الجبهة كلها.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالمدرسة والوقف\u003c/h4\u003e\u003cp class=\"ap\"\u003eبنى نور الدين المدارس في حلب ودمشق والموصل، وأوقف عليها الأوقاف، وكان في هذا ما جعل الفقهاء والعلماء جزءاً من الدولة لا خصوماً لها. وكان في هذا ما جعل الشرعية الدينية تُبنى بالعلم لا بالسيف، وكان في هذا ما جعل الدولة تبقى بعد صاحبها. وكان في بناء المدارس ما جعل حلب تُصبح مركز علمٍ يُنافس بغداد، وكان في هذا ما جعل الشرعية تُبنى بالعلم لا بالسيف، وأن الدولة التي تُعلّم الناس تبقى في ذاكرتهم أطول من التي تحكمهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في نظام الوقف ما جعل التعليم مستقلّاً عن ميزانية الدولة: فالأوقاف تُنتج دخلاً ثابتاً يُصرف على المدرّسين والطلاب، وكان في هذا ما جعل المدارس تعمل حتى في أزمنة الأزمات. وكان في هذا ما يُبيّن أن المؤسسة التي تُموّل نفسها تبقى، وأن ما يعتمد على سخاء الحاكم يزول بزواله.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذه المدارس ما جعل الخطاب الجهادي يُصاغ صياغةً منظمة: فقد كان الفقهاء يُعلّمون الناس فضائل الجهاد وأحكامه، وكان في هذا ما جعل الحرب تُقبل في الوجدان العام، وكان في هذا ما جعل الجيش يُقاتل وهو يعرف لماذا يُقاتل. وكان في نظام الوقف ما جعل التعليم مستقلّاً عن مزاج الحاكم، وكان في هذا ما جعل المدارس تعمل حتى في أزمنة الفتنة، وأن المؤسسة التي تُموّل نفسها لا تسقط بسقوط من بناها.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eمصر والطريق إلى صلاح الدين\u003c/h4\u003e\u003cp class=\"ap\"\u003eأدرك نور الدين أن مصر هي الجناح الجنوبي للصليبيين، وأن من يُسيطر عليها يُطوّقهم من الجهتين، وكان في هذا التفكير ما جعله يختلف عن كل من سبقه. وكان في هذا ما جعل الصراع ينتقل من الشام إلى مصر، وكان في هذا ما جعل صلاح الدين يدخل التاريخ من بابٍ لم يكن يتوقّعه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أرسل شيركوه ثلاث مرات، وفي المرة الثالثة نجح سنة ١١٦٩، ثم مات شيركوه فخلفه صلاح الدين، وكان في هذا الخلافة ما جعل مصر تنتقل إلى يدٍ شابة. وكان في هذا ما جعل نور الدين يرى مشروعه يكبر أكثر مما توقّع، وكان في هذا ما جعل العلاقة بينهما تتوتّر بعد ذلك.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في انتقال مصر إلى صلاح الدين ما جعل الوحدة تُصبح ممكنةً على نطاقٍ أوسع: فقد صار له جناحان شماليٌّ وجنوبي، وكان في هذا ما جعل تحرير القدس ممكناً بعد ذلك. وكان في هذا ما يُبيّن أن الفتح الكبير لا يأتي من معركةٍ واحدة بل من سلسلةٍ من الخطوات التي يبدو كلٌّ منها صغيراً في وقته.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالوراثة\u003c/b\u003e\u003cspan\u003e١١٤٦، حلب، وابنٌ في الثامنة عشرة لا يُتوقّع له شيء\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eدمشق\u003c/b\u003e\u003cspan\u003eضُمّت ١١٥٤، فاتّحد الشام الجنوبي والشمالي\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالحملة الثانية\u003c/b\u003e\u003cspan\u003e١١٤٨، فشلت في حصار دمشق، فانتقل الصليبيون إلى الدفاع\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمؤسسات\u003c/b\u003e\u003cspan\u003eمدارس وأوقاف ودار عدل في دمشق\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمصر\u003c/b\u003e\u003cspan\u003eثلاث حملاتٍ لشيركوه، ثم سيطرتها ١١٦٩ على يد صلاح الدين\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالأثر في ميزان القوى\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e١١٤٦\u003c/td\u003e\u003ctd\u003eنور الدين في حلب\u003c/td\u003e\u003ctd\u003eقيادةٌ جديدة في الشام الشمالي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١١٤٨\u003c/td\u003e\u003ctd\u003eفشل الحملة الثانية في دمشق\u003c/td\u003e\u003ctd\u003eالصليبيون ينتقلون من الهجوم إلى الدفاع\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١١٥٤\u003c/td\u003e\u003ctd\u003eضمّ دمشق\u003c/td\u003e\u003ctd\u003eوحدة الشام الجنوبي والشمالي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١١٦٩\u003c/td\u003e\u003ctd\u003eالسيطرة على مصر\u003c/td\u003e\u003ctd\u003eتطويق الصليبيين من الجنوب\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١١٧٤\u003c/td\u003e\u003ctd\u003eوفاة نور الدين\u003c/td\u003e\u003ctd\u003eانتقال الوحدة إلى صلاح الدين\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eإنما نُصرنا بالعدل، ولولا العدل ما نُصرنا.\u003c/p\u003e\u003ccite\u003eمن أثر سياسة نور الدين في العدل ودار العدل بدمشق كما تُصوّرها المصادر\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eورث نور الدين حلب شاباً، فبنى في ثلاثين عاماً وحدةً في الشام لم يعرفها من قبل: ضمّ دمشق سنة ١١٥٤، وبنى المدارس والأوقاف ودار العدل، ثم مدّ يده إلى مصر فسيطر عليها سنة ١١٦٩ على يد شيركوه ثم صلاح الدين. وكانت وحدته مبنيةً على مؤسسةٍ لا على شخص، فبقيت بعد موته. وقد ترك لصلاح الدين أساساً جاهزاً، وأثبت أن الفتح الكبير يأتي من سلسلة خطواتٍ لا من معركةٍ واحدة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"state-building","n":"مؤسسات الرد: المدرسة والوقف والخطاب","ic":"📚","part":"القسم الثاني: الرد الإسلامي","h":"\u003carticle class=\"ch3\" id=\"state-building\" data-toc=\"مؤسسات الرد: المدرسة والوقف والخطاب\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٢.٤\u003c/span\u003e\n          \u003ch3\u003e📚 مؤسسات الرد: المدرسة والوقف والخطاب\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eل\u003c/span\u003eم يكن الرد على الصليبيين حرباً فقط، بل كان بناءً مؤسسياً: مدارس تُخرّج الفقهاء والوعّاظ، وأوقاف تُموّل التعليم والجيش، ودار عدلٍ تُنصف المظلوم، وخطابٌ جديد للجهاد يُعيد صياغة الفكرة. هذا القسم يقرأ البنية التي جعلت الرد ممكناً، وهي التي بقيت بعد أن ذهب القادة.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eلا تُخاض الحروب الكبرى بالجيوش وحدها، بل بالأفكار والمؤسسات التي تُنتج الجيوش وتُموّلها وتُعطيها سبباً للقتال. وقد أدرك الزنكيون هذا، فبنوا في القرن السادس الهجري شبكةً من المدارس والأوقاف ودور العدل، وكان في هذا البناء ما جعل الرد على الصليبيين ممكناً بعد أن كان مستحيلاً. وكان في هذا البناء ما جعل الردّ يستمرّ بعد موت القادة، وكان في هذا ما يُبيّن أن الحرب الطويلة تُحسم بالبنية لا بالمعركة، وأن من أراد أن يُقاوم قرناً فليبْنِ ما يبقى قرناً.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت المدرسة هي المؤسسة المركزية في هذا البناء، وكانت تُسمّى باسم بانيها أو باسم غرضها، وكانت تُدرّس فيها علوم الدين واللغة والفقه، وكان في انتشارها ما جعل التعليم يخرج من المساجد إلى مؤسساتٍ متخصصة. وكان في هذا ما جعل الفقه يُصبح علماً منظّماً له مناهج وإجازات، وكان في هذا ما جعل الدولة تُخرّج كوادرها بنفسها. وكان في هذا الانتشار ما جعل التعليم يخرج من المساجد إلى مؤسساتٍ متخصصة، وكان في هذا ما جعل الفقه يُصبح علماً منظّماً له مناهج وإجازات، وأن الدولة تُخرّج كوادرها بنفسها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان نظام الوقف هو الآلية التي جعلت هذه المؤسسات تعمل: فالحاكم أو التاجر يُوقف أرضاً أو دكاناً أو بستاناً، ويُحدّد أن يُصرف ريعها على مدرسةٍ أو مستشفى أو رباط، وكان في هذا النظام ما جعل التعليم والطبّ والخدمات الاجتماعية تُموّل من أصولٍ ثابتة لا من ميزانيةٍ سنوية. وكان في هذا ما جعل المؤسسة تعمل حتى في أزمنة الفتنة والانقطاع. وكان في هذا النظام ما جعل المؤسسة تعمل حتى في أزمنة الفتنة والانقطاع، وكان في هذا ما جعل التعليم والطبّ خدمةً دائمةً لا مشروعاً مؤقتاً، وأن الأصل الثابت أقوى من الميزانية المتغيّرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في نظام الوقف ما جعل الطبقة التجارية تُشارك في بناء الدولة: فالتجار كانوا يُوقفون الأوقاف ويُموّلون المدارس، وكان في هذا ما جعل لهم مكانةً اجتماعيةً ودوراً سياسياً. وكان في هذا ما يُبيّن أن الدولة لا تُبنى بالسلطان وحده، وأن من أراد أن يُقاوم عدوّاً فليُوسّع قاعدة من يُشارك في التمويل. وكان في هذا ما جعل التجار يُصبحون شركاء في المشروع الجهادي بلا سلاح، وكان في هذا ما وسّع قاعدة المشاركة، وأن من أراد أن يُقاوم فليُوسّع من يُشارك في التمويل لا من يحمل السيف فقط.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت المدارس تُنتج نوعاً جديداً من العلماء: عالماً يعرف الفقه والحديث والتفسير، ويعرف أيضاً الخطابة والكتابة، ويكون قادراً على أن يُخاطب الناس والحكّام. وكان في هذا النوع ما جعل الخطاب الجهادي ينتشر في المدن والقرى، وكان في هذا ما جعل الحرب تُصبح قضيةً عامةً لا قراراً في بلاط. وكان في هذا النوع ما جعل الخطاب ينتشر في المدن والقرى، وكان في هذا ما جعل الحرب تُصبح قضيةً عامةً لا قراراً في بلاط، وأن من يملك المنبر يستطيع أن يُحرّك ما لا يُحرّكه الجيش.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في الخطاب الجهادي في هذا العصر تحوّلٌ مهم: فقد كان الجهاد في القرون الأولى جهاد فتحٍ وتبليغ، وصار في هذا العصر جهاد دفاعٍ واسترداد، وكان في هذا التحوّل ما جعل الفقه يُطوّر أحكاماً جديدة في الاستنصار والصلح والهُدنة. وكان في هذا ما يُبيّن أن الفقه الحيّ هو الذي يُجيب على أسئلة عصره لا على أسئلة قرونٍ مضت. وكان في هذا التحوّل ما جعل الفقه يُطوّر أحكاماً في الاستنصار والهُدنة والصلح، وكان في هذا ما يُبيّن أن الفقه الحيّ يُجيب على أسئلة عصره، وأن الأحكام تتغيّر بتغيّر الأحوال لا بتغيّر النصوص.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان من أبرز من كتب في هذا الباب الإمام أبو الحسن السُّلمي، الذي كتب كتابه في الجهاد بعد سقوط القدس بست سنوات، وكان في كتابه ما جعل الخطاب يُخاطب الحكّام مباشرةً ويُطالبهم بالاستنصار. وكان في هذا ما يُبيّن أن الكتابة قد تكون فعلاً سياسياً، وأن من أراد أن يُحرّك حاكماً فليكتب له ما يُخيفه من التاريخ. وكان في كتابه ما جعل الخطاب يُخاطب الحكّام بأسمائهم، وكان في هذا ما جعل بعضهم يغضب وبعضهم يستجيب، وأن الكلمة قد تُحرّك أكثر مما تُحرّك الجيوش، وأن القلم قد يسبق السيف في إيقاظ الأمة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان من أبرز من كتب في هذا العصر أيضاً ابن عساكر في «تاريخ دمشق»، وكان كتابه في فضائل المدينة وتاريخها، وكان في هذا الكتاب ما جعل دمشق تُصبح مركزاً رمزياً للجهاد لا مجرد مدينة. وكان في هذا ما جعل التاريخ نفسه سلاحاً، وأن من أراد أن يُقنع الناس بأن مكاناً يستحقّ القتال فليكتب له تاريخاً. وكان في هذا الكتاب ما جعل دمشق تُصبح مركزاً رمزياً للجهاد لا مجرد مدينة، وكان في هذا ما جعل التاريخ نفسه سلاحاً، وأن من أراد أن يُقنع الناس بأن مكاناً يستحقّ القتال فليكتب له تاريخاً.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت دور العدل مؤسسةً أخرى في هذا البناء: فقد كان الحاكم يجلس بنفسه للنظر في مظالم الناس أياماً في الأسبوع، وكان في هذا ما جعل الناس يرون في الدولة حامياً لا جابياً. وكان في هذا ما جعل القاعدة الشعبية للجهاد تتكوّن، لأن الناس يُقاتلون مع من يُنصفهم لا مع من يظلمهم. وكان في هذا المجلس ما جعل الناس يرون الحاكم بنفسه لا من وراء حجاب، وكان في هذا ما جعل الشرعية تُبنى بالإنصاف لا بالخطابة، وأن من أراد أن يحكم فليبدأ بأن يُنصف.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت المستشفيات والبيمارستانات جزءاً من هذا البناء: فقد بُنيت في دمشق وحلب والقاهرة، وكانت تُعالج المرضى بلا مقابل، وكان في هذا ما جعل الدولة تُقدّم خدمةً للناس لا تُطلب منهم مقابلاً. وكان في هذا ما جعل الشرعية تُبنى بالخدمة لا بالخطابة، وكان في هذا ما جعل الناس يُدافعون عن نظامٍ يعرفون أنه يُعالجهم. وكان في هذه المستشفيات ما جعل الدولة تُقدّم خدمةً بلا مقابل، وكان في هذا ما جعل الناس يُدافعون عن نظامٍ يعرفون أنه يُعالجهم، وأن الشرعية الحقيقية تُبنى بالخدمة لا بالشعار.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا البناء كله ما جعل الجيش يُقاتل بلا حاجةٍ إلى غنائم: فقد كان يُموّل من الأوقاف والخراج والتجارة، وكان في هذا ما جعل القتال من أجل الدولة لا من أجل المال. وكان في هذا ما يُبيّن أن الجيش الذي يُقاتل من أجل الغنيمة يفترق بعدها، والجيش الذي يُقاتل من أجل مشروعٍ يبقى. وكان في هذا ما جعل الجيش لا يفترق بعد الغنيمة، وكان في هذا ما جعل القتال من أجل مشروعٍ لا من أجل مال، وأن الجيش الذي يُقاتل من أجل الغنيمة يفترق بعدها، والذي يُقاتل من أجل مشروعٍ يبقى.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا البناء ما جعل الردّ يستمرّ بعد موت القادة: فقد مات زنكي ومات نور الدين ومات صلاح الدين، ولكن المدارس والأوقاف ودور العدل بقيت، وكان في هذا ما جعل الأمة قادرةً على أن تُعيد بناء نفسها بعد كل هزيمة. وكان في هذا ما يُبيّن أن المؤسسة أقوى من الشخص، وأن من أراد أن يبقى أثره فليبني ما يبقى بعده. وكان في هذا ما جعل الأمة قادرةً على أن تُعيد بناء نفسها بعد كل هزيمة، وكان في هذا ما يُبيّن أن المؤسسة أقوى من الشخص، وأن من أراد أن يبقى أثره فليبني ما يبقى بعده لا ما يموت بموته.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالمدرسة كمؤسسة سلطة\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم تكن المدرسة مكاناً للتعليم فقط، بل كانت مؤسسةً تُنتج الشرعية للدولة: فالحاكم الذي يبني مدرسةً يُصبح حامياً للعلم، والعالم الذي يُدرّس فيها يُصبح موظفاً في نظامٍ لا مستقلاً عنه. وكان في هذا ما جعل العلاقة بين الدولة والعلماء تتغيّر، وكان في هذا ما جعل الخطاب الديني أقرب إلى السلطة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا ما جعل المدرسة أداةً في الصراع المذهبي: فقد كانت المدارس تُبنى على مذهبٍ معيّن، وكان في هذا ما جعل المذاهب تنتشر بحسب من يبني المدارس. وكان في هذا ما يُبيّن أن المؤسسة التعليمية قد تكون أداةً سياسية، وأن من أراد أن يُغيّر مذهب بلدٍ فليبْنِ فيه مدارس.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا النظام ما جعل العلم يُصبح مهنةً لها راتبٌ ومكانة، وكان في هذا ما جعل طلاب العلم يتوافدون من كل مكان. وكان في هذا ما جعل المدن التي فيها مدارس تُصبح مراكز جذبٍ للعلماء، وكان في هذا ما جعل حلب ودمشق والقاهرة تُنافس بغداد بعد أن كانت بغداد وحدها.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالوقف كاقتصاد مقاومة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الوقف أذكى أداةٍ اقتصادية في هذا العصر، لأنه حوّل المال من صدقةٍ عابرة إلى أصلٍ دائم يُنتج خدمةً مستمرة. وكان في هذا ما جعل المدارس والمستشفيات تعمل بلا اعتماد على مزاج الحاكم، وكان في هذا ما جعل المؤسسة أقوى من الشخص الذي بناها. وكان في هذا ما جعل العلماء يُصبحون موظفين في نظامٍ لا مستقلين عنه، وكان في هذا ما جعل الخطاب الديني أقرب إلى السلطة، وأن من يُموّل العالم يستطيع أن يُوجّه كلامه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في نظام الوقف ما جعل الطبقة التجارية تُشارك في المشروع الجهادي بلا سلاح: فالتاجر الذي يُوقف بستاناً على مدرسةٍ يُشارك في تكوين الفقيه الذي يُحرّض على الجهاد. وكان في هذا ما جعل الجهاد مشروعاً جماعياً لا مشروعاً عسكرياً فقط، وكان في هذا ما وسّع قاعدة المشاركة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في الوقف أيضاً ما جعل الأوقاف تتراكم عبر القرون وتُصبح ثروةً هائلة، وكان في هذا ما جعل الدولة تُحاول السيطرة عليها بعد ذلك. وكان في هذا ما يُبيّن أن المؤسسة المستقلة قد تُصبح قوةً تُنافس الدولة، وأن من يبني مؤسسةً لا يتحكّم في مستقبلها. وكان في هذا ما جعل المدن التي فيها مدارس تُصبح مراكز جذبٍ للعلماء، وكان في هذا ما جعل حلب ودمشق والقاهرة تُنافس بغداد بعد أن كانت بغداد وحدها.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالخطاب الجديد للجهاد\u003c/h4\u003e\u003cp class=\"ap\"\u003eتحوّل الجهاد في هذا العصر من فتحٍ وتبليغ إلى دفاعٍ واسترداد، وكان في هذا التحوّل ما جعل الفقه يُطوّر أحكاماً جديدة في الاستنصار والهُدنة والصلح. وكان في هذا ما يُبيّن أن الفقه الحيّ يُجيب على أسئلة عصره، وأن الأحكام تتغيّر بتغيّر الأحوال لا بتغيّر النصوص.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في الخطاب الجديد ما جعل القدس تُصبح مركزاً للفكرة: فقد كانت المدينة في الخلفية قبل سقوطها، وصارت في المقدمة بعده، وكان في هذا ما جعل الخطاب يُوحّد الناس على رمزٍ واحد. وكان في هذا ما يُبيّن أن الرمز قد يكون أقوى من المصالح في تحريك الجماهير. وكان في هذا ما جعل الجهاد مشروعاً جماعياً لا مشروعاً عسكرياً فقط، وكان في هذا ما جعل من لا يستطيع أن يحمل السيف يُشارك فيه بماله، وأن الجهاد قد يكون بالوقف كما يكون بالرمح.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا الخطاب ما جعل العلماء يُصبحون قادةً للرأي العام: فقد كانوا يُحرّضون الحكّام ويُوبّخونهم على التقصير، وكان في هذا ما جعل للرأي العام سلطةً على الحاكم. وكان في هذا ما يُبيّن أن من يملك المنبر يملك ما لا يملكه من يملك السيف، وأن الخطاب قد يُحرّك الجيوش بلا أمرٍ من أحد.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمدرسة\u003c/b\u003e\u003cspan\u003eمؤسسةٌ تُخرّج الفقهاء وتُنتج الشرعية للدولة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالوقف\u003c/b\u003e\u003cspan\u003eأصلٌ دائم يُنتج دخلاً يُموّل التعليم والطبّ والجيش\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eدار العدل\u003c/b\u003e\u003cspan\u003eالحاكم يجلس للمظالم، فتُبنى الشرعية بالإنصاف\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالخطاب\u003c/b\u003e\u003cspan\u003eتحوّل الجهاد من فتحٍ وتبليغ إلى دفاعٍ واسترداد\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالسُّلمي\u003c/b\u003e\u003cspan\u003eكتب في الجهاد سنة ١١٠٥، بعد سقوط القدس بست سنوات\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمؤسسة\u003c/th\u003e\u003cth\u003eالوظيفة\u003c/th\u003e\u003cth\u003eالأثر البعيد\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالمدرسة\u003c/td\u003e\u003ctd\u003eتعليم الفقه واللغة وإنتاج الشرعية\u003c/td\u003e\u003ctd\u003eكوادر تُدير الدولة وتُصوغ الخطاب\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالوقف\u003c/td\u003e\u003ctd\u003eتمويلٌ دائم من أصولٍ ثابتة\u003c/td\u003e\u003ctd\u003eاستقلال المؤسسة عن ميزانية الحاكم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eدار العدل\u003c/td\u003e\u003ctd\u003eالنظر في مظالم الناس\u003c/td\u003e\u003ctd\u003eقاعدةٌ شعبية تُقاتل مع الدولة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالبيمارستان\u003c/td\u003e\u003ctd\u003eعلاجٌ مجاني\u003c/td\u003e\u003ctd\u003eشرعيةٌ تُبنى بالخدمة لا بالخطابة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالخطاب الجهادي\u003c/td\u003e\u003ctd\u003eتحريك الرأي العام والحكّام\u003c/td\u003e\u003ctd\u003eالقدس رمزاً جامعاً للأمة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eالوقف حبس الأصل وتسبيل المنفعة.\u003c/p\u003e\u003ccite\u003eقاعدة الفقه في الوقف، وهي التي جعلت مدارس الزنكيين تعمل قروناً\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eلم يكن الرد على الصليبيين حرباً فقط، بل بناءً مؤسسياً: مدارس تُخرّج الفقهاء وتُنتج الشرعية، وأوقاف تُموّل التعليم والطبّ من أصولٍ ثابتة، ودور عدلٍ تُنصف الناس، وخطابٌ جديد للجهاد حوّله من فتحٍ إلى دفاعٍ واسترداد. وكان في هذا البناء ما جعل الردّ يستمرّ بعد موت القادة، وأن المؤسسة تبقى حيث يزول الشخص.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-3","n":"القسم الثالث: صلاح الدين والتحرير","ic":"","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-3\" style=\"--c:#8B1A1A\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e⚔️\u003c/div\u003e\n      \u003ch2\u003eالقسم الثالث: صلاح الدين والتحرير\u003c/h2\u003e\n      \u003cp\u003eلم يكن صلاح الدين يوسف بن أيوب أعظم قائدٍ في عصره من حيث الموهبة العسكرية، لكنه كان أعظم من فهم أن الوحدة تسبق المعركة. هذا القسم يتبع مسيره من تكريت إلى وزارة مصر، ثم توحيده مصر والشام في دولةٍ واحدة، ثم حطين التي دمّرت جيش الصليبيين، ثم تحرير القدس بعد ثمانٍ وثمانين سنة، ثم الحملة الثالثة التي كادت تُعيد ما فُقد، ثم موته وتركه ما لا يتركه الملوك.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#rise-egypt\"\u003eمن تكريت إلى وزارة مصر\u003c/a\u003e\u003ca href=\"#unification\"\u003eتوحيد مصر والشام\u003c/a\u003e\u003ca href=\"#hattin\"\u003eحطين وتحرير القدس\u003c/a\u003e\u003ca href=\"#third-crusade\"\u003eالحملة الثالثة ووفاة صلاح الدين\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"rise-egypt","n":"من تكريت إلى وزارة مصر","ic":"🌍","part":"القسم الثالث: صلاح الدين والتحرير","h":"\u003carticle class=\"ch3\" id=\"rise-egypt\" data-toc=\"من تكريت إلى وزارة مصر\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٣.١\u003c/span\u003e\n          \u003ch3\u003e🌍 من تكريت إلى وزارة مصر\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eوُ\u003c/span\u003eلد صلاح الدين في تكريت سنة ١١٣٧ في أسرةٍ كرديةٍ من قادة السلاجقة، ونشأ في دمشق في كنف نور الدين، وخرج إلى مصر ثلاث مرات مع عمّه شيركوه، ثم وجد نفسه سنة ١١٦٩ والياً على مصر بعد موت عمّه، وهو في الثانية والثلاثين. وكان في هذا الطريق ما جعل من شابٍّ مغمورٍ سيّداً على أغنى ولايةٍ في الشرق.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eوُلد يوسف بن أيوب، المعروف بصلاح الدين، في تكريت سنة ١١٣٧، وكان أبوه نجم الدين أيوب والياً عليها، وكان في هذه الولاية ما جعل الأسرة قريبةً من السلطة السلجوقية، وأن من ينشأ في بيت والٍ يتعلّم السياسة قبل أن يتعلّم الحرب. وقد انتقلت الأسرة بعد ذلك إلى الموصل ثم إلى دمشق، وكان في هذا الانتقال ما جعل صلاح الدين ينشأ في بيئةٍ تُقاتل على كل شيء.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت أسرته من الأكراد الذين خدموا السلاجقة، وكان عمّه أسد الدين شيركوه من أقرب قادة نور الدين، وكان في هذه القرابة ما جعل صلاح الدين يدخل الخدمة العسكرية من بابٍ قريب. وكان في هذا ما يُبيّن أن الصعود في الدول القديمة كان يبدأ من القرابة والولاء، وأن الموهبة وحدها لا تكفي إذا لم يكن هناك من يُقدّمك. وكان في هذا الانتساب ما جعل صلاح الدين يدخل الحياة العامة من بابٍ عسكري لا من بابٍ علمي، وأن الأسرة التي تخدم السلطان تُورّث أبناءها الخدمة كما تُورّثهم الاسم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان صلاح الدين في شبابه أقرب إلى العلم والقراءة من الحرب، وقد رُوي أنه كان يُحبّ الفقه والحديث، وكان في هذا ما جعل بعض من عرفه لا يتوقّع له شأناً عسكرياً. وكان في هذا ما يُبيّن أن التاريخ لا يسير بحسب ما يُتوقّع للناس، وأن من لم يُعدّ نفسه للقيادة قد يُصبح قائداً إذا أُعطي الفرصة. وقد بقي فيه أثر هذه النشأة بعد أن صار سلطاناً، فقد كان يجلس مع العلماء ويُقرّب الفقهاء، وكان في هذا ما جعل بلاطه يختلف عن بلاطات الملوك الذين لا يعرفون إلا السيف.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سنة ١١٦٤ خرج شيركوه إلى مصر بأمرٍ من نور الدين، وكان صلاح الدين معه، وكانت مصر في ذلك الوقت في صراعٍ بين وزيرين يتنازعان، وكان في هذا الصراع ما جعل الأمراء الخارجيين يُدعون للتدخّل. وكان في هذا ما جعل مصر تُصبح ساحةً مفتوحةً للصراع بين الزنكيين والصليبيين، وأن من كان يُقاتل في الشام وجد نفسه يُقاتل على النيل. وكان في هذا الخروج الأول ما جعل صلاح الدين يرى مصر للمرة الأولى، وكانت مصر في ذلك الوقت ولايةً غنيةً بمواردها وفقيرةً بأمنها، وكان في هذا التناقض ما جعلها هدفاً لكل طامع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد خرج صلاح الدين إلى مصر ثلاث مرات مع عمّه، وفي هذه الحملات تعلّم الحرب والسياسة معاً: تعلّم أن الجيوش لا تكفي بلا مال، وأن المال لا يكفي بلا شرعية، وأن الشرعية لا تُبنى إلا بالعدل والكرم. وكان في هذه التجارب ما جعل صلاح الدين يختلف عن كثيرٍ من قادة عصره، لأنه كان يُفكّر في الدولة لا في المعركة فقط. وكان في هذه الحملات ما جعل صلاح الدين يتعلّم أن الجيش الذي لا يُدفع له لا يُقاتل، وأن المال الذي لا يُوزّع بعدلٍ لا يبقى، وأن من أراد أن يحكم مصر فليعرف أولاً من يُطعم الناس.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سنة ١١٦٩ نجح شيركوه في السيطرة على مصر، وأصبح وزيراً للخليفة الفاطمي، ثم مات بعد شهرين، فاختار الخليفة الفاطمي صلاح الدين وزيراً مكانه، وكان في هذا الاختيار ما جعل صلاح الدين يُصبح والياً على مصر وهو في الثانية والثلاثين. وكان في هذا ما يُبيّن أن المناصب الكبرى قد تأتي بموتٍ مفاجئٍ أكثر مما تأتي بتخطيطٍ طويل. وكان في موت شيركوه المفاجئ ما جعل صلاح الدين يتولّى مكانه بلا ترتيبٍ مسبق، وكان في هذا ما يُبيّن أن القدر قد يُعطي المنصب لمن لم يُعدّ له عدّة، وأن من أُعطي منصباً بغتةً يحتاج إلى حكمةٍ أكثر من خبرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في تولّيه الوزارة ما جعل نور الدين يرى أن مشروعه يكبر أكثر مما توقّع، وكان في هذا ما جعل العلاقة بينهما تتوتّر، لأن نور الدين أراد أن يكون صلاح الدين تابعاً له في مصر، وصلاح الدين وجد نفسه سيّداً على ولايةٍ لا تُقارن بالشام في ثروتها. وكان في هذا ما يُبيّن أن التابع إذا كبر قد لا يبقى تابعاً. وكان في هذا التوتر ما جعل صلاح الدين يُدرك أن التابع إذا كبر قد يُصبح ندّاً، وأن العلاقة بين الأستاذ والتلميذ تتغيّر بتغيّر المواقع لا بتغيّر النيات، وأن من أراد أن يحفظ تابعاً فليُبقِه محتاجاً.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان أول ما فعله صلاح الدين في مصر أن أعاد تنظيم الجيش والأمن، وأصلح حال الفاطميين المالي، وكان في هذا ما جعل له قاعدةً في مصر لا تُزعزع. وكان في هذا ما يُبيّن أن من أراد أن يحكم بلداً فليبدأ بأمنه واقتصاده قبل أن يبدأ بحروبه، وأن الاستقرار الداخلي شرطٌ للعمل الخارجي. وكان في هذا التنظيم ما جعل مصر تُصبح ولايةً مستقرّةً بعد سنواتٍ من الفوضى، وكان في هذا ما جعل صلاح الدين قادراً على أن يُفكّر في الشام بعد أن أمّن قاعدته في الجنوب، وأن من أراد أن يتوسّع فليُثبّت ما في يده أولاً.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سنة ١١٧١ أقدم صلاح الدين على خطوةٍ كبرى: فقد أعلن الدعاء للخليفة العباسي في مصر، وأنهى بذلك الدولة الفاطمية التي حكمت قرنين، وكان في هذه الخطوة ما جعل مصر تعود إلى الخلافة السنّية. وكان في هذا ما يُبيّن أن صلاح الدين كان يفهم أن الشرعية الدينية أساس الحكم، وأن من أراد أن يُوحّد المسلمين فليبدأ بتوحيد خطبتهم. وكان في هذه الخطوة ما جعل صلاح الدين يُواجه خطر الفتنة من أنصار الفاطميين، وكان في هذا ما جعل بعضهم يُحاولون قتله، ولكنه صبر ونظّم، وكان في صبره ما جعل الخطر يزول بلا مذبحةٍ كبيرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في إسقاط الدولة الفاطمية ما جعل بعض أهل مصر يغضبون، لأن الفاطميين كانوا يُعمّرون المساجد ويُوزّعون المال، وكان في هذا الغضب ما جعل صلاح الدين يُسرع ببناء المدارس والمساجد والمستشفيات ليُعطي الناس ما كانوا يجدونه عند الفاطميين. وكان في هذا ما يُبيّن أن من أراد أن يُغيّر نظاماً فليقدّم للناس بديلاً لا شعاراً. وكان في هذا البناء ما جعل أهل مصر يجدون في الدولة الجديدة ما كانوا يجدونه في القديمة، وكان في هذا ما جعل التحوّل المذهبي يمرّ بسلام، وأن من أراد أن يُغيّر مذهب بلدٍ فليبْنِ فيه ما يُقنع أهله قبل أن يُطالبهم بالطاعة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في بنائه في مصر ما جعل القاهرة تُصبح مركزاً سنّياً كبيراً، فقد بنى المدرسة الناصرية، وأصلح الأزهر وحوّله إلى مركزٍ سنّي، وبنى المستشفيات والأسوار، وكان في هذا البناء ما جعل مصر قادرةً على أن تكون قاعدةً لمشروعٍ أكبر. وكان في هذا ما يُبيّن أن الفتح الحقيقي هو الذي يبني لا الذي يهدم. وكان في هذه المؤسسات ما جعل القاهرة تُصبح مركزاً للفقه والحديث، وكان في هذا ما جعل مصر تُخرّج جيلاً من العلماء الذين سيحملون المشروع بعد ذلك، وأن الدولة التي تُعلّم الناس تبقى في ذاكرتهم أطول من التي تحكمهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان صلاح الدين في هذه المرحلة قد أصبح أقوى من أن يكون تابعاً، وكان نور الدين قد طلب منه أن يُعيد الدعاء باسمه في الخطبة وأن يُرسل له المال، وكان في هذا الطلب ما جعل العلاقة بينهما في توترٍ دائم. وكان في هذا ما جعل بعض المؤرّخين يقولون إن صلاح الدين كان يستقلّ بمصر، وإن نور الدين كان يُريد أن يضمّها إليه بالقوة، وأن الموت جاء قبل أن يقع الصدام.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eلماذا أُرسل إلى مصر؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الصليبيون يُهدّدون مصر منذ سنوات، وكان الفاطميون عاجزين عن الدفاع عنها، وكان في هذا الضعف ما جعل نور الدين يخشى أن تقع مصر في يد الصليبيين فيُطوّقوه من الجنوب. وكان في هذا الخوف ما جعل إرسال الجيش إلى مصر ضرورةً استراتيجية لا مغامرة. وكان في هذا التهديد ما جعل نور الدين يرى أن مصر هي الباب الجنوبي للشام، وأن من أراد أن يحفظ الشام فليحفظ مصر، وأن الخطر إذا جاء من الجنوب لا يُوقف في الشمال.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في مصر أيضاً صراعٌ بين وزيرين يتنازعان، وكان كلٌّ منهما يستعين بأطرافٍ خارجية، وكان في هذا الصراع ما جعل التدخّل الخارجي ممكناً بلا حربٍ كبيرة. وكان في هذا ما يُبيّن أن البلد الذي يتنازع أهله يُدعى إليه الغرباء، وأن من أراد أن يحفظ بلده فليبدأ بإنهاء خلافه الداخلي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في إرسال شيركوه وصلاح الدين ما جعل الزنكيين يدخلون مصر لا كفاتحين بل كمدافعين عن الخلافة السنّية، وكان في هذه الصورة ما جعل دخولهم مقبولاً عند بعض أهل مصر. وكان في هذا ما يُبيّن أن الشرعية تُسهّل الدخول، وأن من أراد أن يدخل بلداً فليجد له عذراً يُقبله أهله.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eإسقاط الدولة الفاطمية\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان إسقاط الدولة الفاطمية قراراً خطيراً، لأن الفاطميين كانوا يحكمون مصر قرنين، وكان لهم جيشٌ وأنصارٌ ومذهبٌ. وكان في هذا القرار ما جعل صلاح الدين يُخاطر بفتنةٍ داخلية، وكان في هذا ما يُبيّن أن القرارات الكبرى تحتاج إلى شجاعةٍ لا إلى حسابٍ فقط. وكان في هذا الخطر ما جعل صلاح الدين يُنفّذ القرار بالتدريج لا بالصدمة، وأن من أراد أن يُغيّر نظاماً في يومٍ واحدٍ قد يُغيّر نفسه لا النظام.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد نفّذ صلاح الدين القرار بالتدريج: فقد بدأ بتقليص نفوذ الفاطميين في الجيش، ثم أعلن الدعاء للعباسيين في الخطبة، ثم ألغى المظاهر الفاطمية، وكان في هذا التدريج ما جعل الفتنة لا تقع. وكان في هذا ما يُبيّن أن التغيير الكبير يُنفّذ بخطواتٍ صغيرة، وأن من أراد أن يُغيّر نظاماً في يومٍ واحدٍ قد يُغيّر نفسه لا النظام.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في إسقاط الفاطميين ما جعل مصر تدخل في وحدةٍ سنّية مع الشام والعراق، وكان في هذا ما جعل المشروع الصليبي في خطرٍ أكبر، لأن الجناح الجنوبي صار في يد قوةٍ تُقاتل. وكان في هذا ما يُبيّن أن التوحيد المذهبي قد يكون مقدمةً للتوحيد السياسي، وأن من أراد أن يُوحّد أمةً فليبدأ بما يُوحّد خطبتها.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eبناء القاهرة السنّية\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يكتفِ صلاح الدين بإسقاط الفاطميين، بل بنى ما يُعوّض الناس عمّا فقدوه: فبنى المدارس والمساجد والمستشفيات، وأصلح الأزهر وحوّله إلى مركزٍ سنّي، وكان في هذا البناء ما جعل الناس يقبلون النظام الجديد. وكان في هذا ما يُبيّن أن من أراد أن يُغيّر نظاماً فليقدّم بديلاً لا شعاراً.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في بناء القلعة والأسوار ما جعل القاهرة مدينةً محصّنةً لا مجرد عاصمة، وكان في هذا ما جعل مصر قادرةً على أن تُقاوم أي هجومٍ صليبي. وكان في هذا ما يُبيّن أن الاستثمار في الدفاع ليس ترفاً، وأن من أراد أن يهاجم غيره فليؤمّن داره أولاً. وكان في هذه القلعة ما جعل القاهرة مدينةً محصّنةً لا مجرد عاصمة، وكان في هذا ما جعل صلاح الدين قادراً على أن يُدافع عن مصر ضد أي حملةٍ صليبية بعد ذلك.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذه المؤسسات ما جعل مصر تُصبح مركز جذبٍ للعلماء من كل مكان، وكان في هذا ما جعل القاعدة العلمية للمشروع السني تتكوّن. وكان في هذا ما يُبيّن أن الهجرة العلمية تتبع الأمن والمال، وأن من أراد أن يجمع العلماء فليبْنِ لهم ما يُقيمهم لا ما يُخيفهم. وكان في هذه المؤسسات ما جعل العلماء يقصدون القاهرة من كل مكان، وكان في هذا ما جعل مصر تُصبح مركزاً للفقه والحديث بعد أن كانت مركزاً للسياسة فقط.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمولد\u003c/b\u003e\u003cspan\u003e١١٣٧ في تكريت، أسرةٌ كردية من قادة السلاجقة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالحملات\u003c/b\u003e\u003cspan\u003eثلاث حملاتٍ إلى مصر مع عمّه شيركوه من ١١٦٤\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالوزارة\u003c/b\u003e\u003cspan\u003e١١٦٩، وزيراً للفاطميين بعد موت شيركوه، وهو في ٣٢\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eإسقاط الفاطميين\u003c/b\u003e\u003cspan\u003e١١٧١، الدعاء للعباسيين، ونهاية دولةٍ حكمت قرنين\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالبناء\u003c/b\u003e\u003cspan\u003eالمدرسة الناصرية، وإصلاح الأزهر، والقلعة والأسوار\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e١١٣٧\u003c/td\u003e\u003ctd\u003eالمولد في تكريت\u003c/td\u003e\u003ctd\u003eأسرةٌ في خدمة السلاجقة، ونشأةٌ في دمشق\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١١٦٤\u003c/td\u003e\u003ctd\u003eأول حملةٍ إلى مصر\u003c/td\u003e\u003ctd\u003eتعلّم الحرب والسياسة معاً\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١١٦٩\u003c/td\u003e\u003ctd\u003eوزيراً للفاطميين\u003c/td\u003e\u003ctd\u003eسيطرةٌ على أغنى ولايةٍ في الشرق\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١١٧١\u003c/td\u003e\u003ctd\u003eإسقاط الدولة الفاطمية\u003c/td\u003e\u003ctd\u003eمصر تعود إلى الخلافة العباسية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١١٧١–١١٧٤\u003c/td\u003e\u003ctd\u003eبناء القاهرة السنّية\u003c/td\u003e\u003ctd\u003eقاعدةٌ علمية وعسكرية للمشروع\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eكيف يهنأ لي النوم وأنا أعلم أن المسجد الأقصى في يد الأعداء؟\u003c/p\u003e\u003ccite\u003eكلمةٌ تُنسب إلى صلاح الدين في تعليل مشروعه، وهي تُصوّر دافعه لا لفظه\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eوُلد صلاح الدين في تكريت سنة ١١٣٧، ونشأ في دمشق، وخرج إلى مصر ثلاث مرات مع عمّه شيركوه، ثم صار وزيراً للفاطميين سنة ١١٦٩ وهو في الثانية والثلاثين. وفي سنة ١١٧١ أسقط الدولة الفاطمية وأعاد مصر إلى الخلافة العباسية، ثم بنى المدارس والمساجد والقلعة، فجعل مصر قاعدةً لمشروعٍ أكبر. وكان في هذا الطريق ما يُبيّن أن الصعود يبدأ بالقرابة ثم يُثبّته البناء.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"unification","n":"توحيد مصر والشام","ic":"🔗","part":"القسم الثالث: صلاح الدين والتحرير","h":"\u003carticle class=\"ch3\" id=\"unification\" data-toc=\"توحيد مصر والشام\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٣.٢\u003c/span\u003e\n          \u003ch3\u003e🔗 توحيد مصر والشام\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eب\u003c/span\u003eعد موت نور الدين سنة ١١٧٤ وجد صلاح الدين نفسه أمام فرصةٍ لم يُخطّط لها: الشام بلا قائدٍ قوي، والورثة صغار، والأمراء يتنازعون. فدخل دمشق، ثم حمص وحماة، ثم حلب سنة ١١٨٣، ثم الموصل سنة ١١٨٦، وبنى دولةً واحدةً من النيل إلى الفرات، وكان في هذا البناء ما جعل حطين ممكنة.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eفي سنة ١١٧٤ مات نور الدين في دمشق، وكان ابنه الصالح إسماعيل طفلاً في الحادية عشرة، وكان في هذا الفراغ ما جعل أمراء الشام يتنازعون على الوصاية، وكان في هذا ما جعل صلاح الدين يجد فرصةً لم يكن يُخطّط لها. وكان في هذا ما يُبيّن أن التاريخ قد يُعطي الفرصة لمن كان مُستعداً لها لا لمن كان ينتظرها. وكان في هذا الفراغ ما جعل صلاح الدين يجد نفسه أمام خيارين: أن يبقى والياً على مصر ينتظر، أو أن يدخل الشام ويُوحّدها تحت سلطته، وكان في اختياره الثاني ما جعل مشروعه يكبر بعد أن كان محدوداً.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد دخل صلاح الدين دمشق في السنة نفسها، ودخلها بلا قتالٍ يُذكر، لأن أهلها كانوا يخافون من الفوضى، وكان في هذا الدخول ما جعل له قاعدةً في الشام الجنوبي. وكان في هذا ما يُبيّن أن المدينة التي تخاف الفوضى تُسلّم نفسها لمن يُعطيها أمناً، وأن الأمن أول ما يُطلب في أوقات الاضطراب. وكان في هذا الدخول ما جعل صلاح الدين يُصبح حاكماً على أهم مدينتين في الشام ومصر معاً، وكان في هذا ما جعل ميزان القوى يتغيّر لصالحه، وأن من أراد أن يُوحّد فليبدأ بالمدينة التي تُفتح له بلا حرب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في دخوله دمشق ما جعل بعض أمراء الشام يخافون، لأنهم رأوا فيه تابعاً خرج على سيّده، وكان في هذا الخوف ما جعلهم يُشكّلون تحالفاً ضده. وكان في هذا ما جعل صلاح الدين يُواجه مشكلةً سياسيةً أكبر من مشكلةٍ عسكرية: كيف يُقنع الناس بأنه باني وحدةٍ لا خارجٌ على الدولة؟ وكان في هذا التحالف ما جعل صلاح الدين يُقاتل على جبهتين: جبهة الصليبيين في الساحل، وجبهة أمراء الشام في الداخل، وكان في هذا ما جعل مشروعه أصعب مما توقّع، وأن من أراد أن يُوحّد أمةً فليستعدّ لمقاومة أهلها قبل مقاومة عدوّها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بنى صلاح الدين شرعيته على أساسين: الأول أنه حامي بيت نور الدين ووصيٌّ على ابنه، والثاني أنه المُوحّد الذي يجمع المسلمين لتحرير القدس. وكان في هذين الأساسين ما جعل له قبولاً عند بعض الناس، وكان في هذا ما يُبيّن أن من أراد أن يحكم فليجد شرعيةً لا تكفي فيها القوة وحدها. وكان في هذين الأساسين ما جعل له قبولاً عند العلماء والناس، وكان في هذا ما يُبيّن أن الشرعية لا تُبنى بالقوة وحدها، وأن من أراد أن يحكم فليجد سبباً يُقنع به الناس غير السيف، وأن الحكم بلا شرعيةٍ يحتاج إلى جيشٍ في كل شارع.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم ضمّ حمص وحماة وبعلبك، وكان في هذا الضمّ ما جعل له سيطرةً على وسط الشام لا على طرفه، وكان في هذا ما جعل الطريق إلى الشمال مفتوحاً. وكان في هذا ما يُبيّن أن السيطرة على الوسط أهم من السيطرة على الأطراف، لأن الوسط يربط الأطراف ويقطع الطرق. وكان في هذا الضمّ ما جعل الطريق بين مصر والشام مفتوحاً في يدٍ واحدة، وكان في هذا ما جعل الجيشين يستطيعان أن يلتقيا في وقتٍ قصير، وكان في هذا ما جعل صلاح الدين قادراً على أن يُقاتل في الشام وهو مطمئنّ على مصر، وأن من أراد أن يُوحّد جبهتين فليُؤمّن الطريق بينهما أولاً.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في توسّعه ما جعل الصليبيين يُدركون الخطر، وكان في هذا ما جعلهم يُحاولون التحالف مع أمراء الشام ضده، وكان في هذا ما جعل صلاح الدين يُواجه تحالفاً من المسلمين والصليبيين معاً. وكان في هذا ما يُبيّن أن من يُوحّد أمةً قد يُواجه من أبناء أمته أكثر مما يُواجه من عدوّه. وكان في هذا التحالف ما جعل صلاح الدين يُدرك أن الوحدة لا تُبنى بالخطابة بل بالصبر على من يُقاومها من أبناء جلدته، وأن من أراد أن يجمع الناس على هدفٍ كبيرٍ فليتحمّل أن يُوصف بالطمع من الذين فقدوا مصالحهم الصغيرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سنة ١١٧٥ أعلن صلاح الدين نفسه سلطاناً، وكان في هذا الإعلان ما جعل له سلطةً مستقلّةً لا سلطة وصيٍّ، وكان في هذا ما جعل الخلافة العباسية تُقرّه على ذلك. وكان في هذا ما يُبيّن أن الشرعية تحتاج إلى إقرارٍ من مركزٍ رمزي، وأن من أراد أن يحكم فليطلب الشرعية من حيث تُمنح لا من حيث تُؤخذ. وكان في هذا الإعلان ما جعل له سلطةً على الجيوش والولايات لا على مصر وحدها، وكان في هذا ما جعل الدولة الأيوبية تُولد رسمياً، وأن من أراد أن يُؤسّس دولةً فليطلب لها اعترافاً من المؤسسة التي يُصدّقها الناس.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان أهمّ ما تبقّى هو حلب، وكانت في يد ابنٍ صغيرٍ من أبناء نور الدين، وكانت أقوى مدينةٍ في الشام وأكثرها تحصيناً، وكان صلاح الدين قد حاصرها أكثر من مرة ولم يفتحها. وكان في هذا الفشل ما جعل بعض الناس يقولون إنه لا يستطيع أن يُوحّد الشام، وكان في هذا ما جعل صلاح الدين يُغيّر أسلوبه. وكان في هذا الفشل ما جعل صلاح الدين يُراجع أسلوبه، فبدل أن يُحاصر حلب بالقوة بدأ يُضيّق عليها بالسياسة ويقطع عنها الإمداد ويُقنع أهلها، وكان في هذا ما جعل فتحها بعد سنواتٍ ممكناً، وأن من أراد مدينةً فليحاصرها بالصبر لا بالرجال فقط.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سنة ١١٨٣ فتح صلاح الدين حلب، وكان في فتحها ما جعل الشام الشمالي يدخل في وحدته، وكان في هذا ما جعل مشروعه يقترب من الاكتمال. وكان في هذا ما يُبيّن أن الصبر على هدفٍ واحدٍ قد يُحقّقه بعد سنوات، وأن من أراد شيئاً فليُعِد له عدّةً طويلةً لا حملةً واحدة. وكان في فتح حلب ما جعل الشام كله في يدٍ واحدة، وكان في هذا ما جعل الجيش الذي سيُقاتل في حطين ممكناً، وكان في هذا ما جعل صلاح الدين قادراً على أن يجمع من الشام ومصر والجزيرة جيشاً واحداً، وأن من أراد معركةً كبيرةً فليبْنِ جيشاً كبيراً قبلها بسنوات.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في فتح حلب ما جعل بعض الأمراء يخافون أكثر، وكان في هذا ما جعل صلاح الدين يُواجه تحالفاً في الجزيرة، وكان في هذا ما جعل الموصل هدفه التالي. وكان في هذا ما يُبيّن أن الوحدة لا تكتمل إلا بضمّ الأطراف، وأن من يترك طرفاً قد يجد فيه عدوّاً في وقت الحاجة. وكان في هذا التحالف ما جعل صلاح الدين يُواجهه بالسياسة قبل السيف، فقد صالح بعض الأمراء وأبقى عليهم في ولاياتهم، وكان في هذا ما جعل الوحدة تُبنى بلا حروبٍ داخلية كبيرة، وأن من أراد أن يضمّ طرفاً فليُبقِ له ما يُقنعه لا ما يُذلّه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سنة ١١٨٦ صالح صلاح الدين أهل الموصل، ودخلت في طاعته، وكان في هذا الصلح ما جعل وحدته تكتمل من النيل إلى الفرات، وكان في هذا ما جعل الصليبيين في مواجهة دولةٍ واحدةٍ لا إماراتٍ متفرقة. وكان في هذا ما يُبيّن أن الوحدة قد تُبنى بالصلح كما تُبنى بالسيف، وأن الصلح الذي يُحفظ خيرٌ من نصرٍ يُنقض. وكان في هذا الصلح ما جعل الجزيرة تدخل في الدولة بلا حرب، وكان في هذا ما جعل جيش حطين قادراً على أن يضمّ فرقاً من الموصل والجزيرة، وأن من أراد أن يجمع الناس لمعركةٍ فليُنهِ خلافاته الداخلية قبلها، وإلا جاء المعركة وفي ظهره عدوّ.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه الوحدة ما جعل حطين ممكنة، لأن الجيش الذي قاتل في حطين كان من مصر والشام والجزيرة معاً، وكان في هذا ما يُبيّن أن المعركة الكبرى تُحسم قبل أن تبدأ، وأن من يبني الوحدة يُحقّق نصف النصر قبل أن يُقاتل. وكان في هذه الوحدة ما جعل صلاح الدين قادراً على أن يختار زمان المعركة ومكانها لا أن ينتظرها، وكان في هذا ما جعل الصليبيين هم من يُفاجؤون لا هو، وكان في هذا ما يُبيّن أن الوحدة لا تُعطي جيشاً أكبر فقط بل تُعطي قراراً أسرع، وأن من وحّد القرار وحّد الجيش.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في سياسة صلاح الدين في هذه المدن ما جعل الناس يقبلون حكمه: فقد كان يُبقي على الحكام المحليين إذا أطاعوه، وكان يُوزّع الأموال على العلماء والفقراء، وكان في هذا ما جعل وحدته أقلّ كلفةً من وحداتٍ سابقة. وكان في هذا ما يُبيّن أن من أراد أن يجمع الناس فليُعطهم ما يُريدون من الأمن والعدل قبل أن يُطالبهم بالطاعة. وكان في هذه السياسة ما جعل المدن تُسلّم نفسها بلا قتال، وكان في هذا ما جعل الوحدة تُبنى بأقلّ خسائر ممكنة، وأن من أراد أن يجمع الناس فليُعطهم الأمن والعدل، فإن أعطاهم إياهما أطاعوه بلا سيف.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالفراغ بعد نور الدين\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان موت نور الدين سنة ١١٧٤ حدثاً فاصلاً، لأنه ترك دولةً كبيرةً وابناً صغيراً، وكان في هذا الترك ما جعل الأمراء يتنازعون على الوصاية، وكان في هذا ما جعل الشام في حالة فراغٍ سياسي. وكان في هذا ما يُبيّن أن الدولة التي تُبنى على شخصٍ واحدٍ لا تجد من يُكملها إذا مات.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا الفراغ ما جعل صلاح الدين يدخل دمشق بلا قتال، لأن أهلها كانوا يخافون من الفوضى أكثر مما يخافون من الحاكم الجديد. وكان في هذا ما يُبيّن أن الأمن أول ما يُطلب في أوقات الاضطراب، وأن من يُعطي الناس أمناً يحكمهم بلا حاجةٍ إلى سيف. وكان في هذا الفراغ ما جعل بعض المدن تُسلّم نفسها لأول من يُعطيها أمناً، وكان في هذا ما جعل صلاح الدين يدخل الشام بأقلّ خسائر ممكنة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا الفراغ أيضاً ما جعل بعض الأمراء يُفضّلون الفوضى على الوحدة، لأن الوحدة تُلغي مكانتهم، وكان في هذا ما جعل صلاح الدين يُواجه مقاومةً من المسلمين أكثر مما يُواجه من الصليبيين. وكان في هذا ما يُبيّن أن أكبر عقبةٍ في طريق الوحدة هي المصالح الصغيرة لا الأعداء الكبار.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالشرعية بين الوصاية والسلطنة\u003c/h4\u003e\u003cp class=\"ap\"\u003eبدأ صلاح الدين بشرعية الوصي على ابن نور الدين، ثم انتقل إلى شرعية السلطان سنة ١١٧٥، وكان في هذا الانتقال ما جعل له سلطةً مستقلّة. وكان في هذا ما يُبيّن أن الشرعية تُبنى على أساسٍ ثم تُغيّر مع تغيّر الحاجة، وأن من يُريد أن يحكم يحتاج إلى صورةٍ مقبولةٍ عند الناس لا إلى قوةٍ فقط.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في إعلانه السلطنة ما جعل الخلافة العباسية تُقرّه، وكان في هذا الإقرار ما جعل حكمه شرعياً في نظر كثيرٍ من الناس. وكان في هذا ما يُبيّن أن السلطة الرمزية للمركز القديم تبقى لها قيمة، وأن من أراد أن يحكم فليطلب شرعيته من المؤسسة التي يُصدّقها الناس.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا أيضاً ما جعل بعض الناس يقولون إن صلاح الدين خرج على بيت نور الدين، وكان في هذا القول ما جعل صورته في بعض المصادر غير مُشرقة. وكان في هذا ما يُبيّن أن كل وحدةٍ لها ثمن، وأن التاريخ يُسجّل ما بُني وما كُسر في الوقت نفسه. وكان في هذا ما جعل بعض المؤرّخين يُنصفونه بأنه لم يجد طريقاً آخر، لأن الشام كان سيقع في يد الصليبيين لو لم يُوحّده أحد، وأن الحكم على القادة يحتاج إلى معرفة الخيارات التي كانت متاحة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eحلب والموصل\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت حلب أصعب المدن الشامية، لأنها كانت الأقوى تحصيناً والأكثر وفاءً لبيت نور الدين، وكان صلاح الدين قد حاصرها مراتٍ ولم يفتحها. وكان في هذا الصبر ما جعل فتحها سنة ١١٨٣ نصراً كبيراً، وكان في هذا ما يُبيّن أن الهدف الذي يُقاوم طويلاً قد يُفتح إذا لم يُترك.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في فتح حلب ما جعل الشام الشمالي يدخل في الوحدة، وكان في هذا ما جعل الموصل هي الحلقة الأخيرة، وكان في هذا ما جعل صلاح الدين يُواجه تحالفاً في الجزيرة. وكان في هذا ما يُبيّن أن الوحدة لا تكتمل إلا بضمّ الأطراف، وأن من يترك طرفاً قد يجد فيه عدوّاً في وقت الحاجة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد صالح أهل الموصل سنة ١١٨٦ بدل أن يُقاتلهم، وكان في هذا الصلح ما جعل وحدته تكتمل بلا حربٍ داخلية، وكان في هذا ما يُبيّن أن الصلح قد يكون أنفع من النصر، وأن من أراد أن يحفظ وحدته فليُبقي على كرامة من يضمّه لا على إذلاله. وكان في هذا الصلح ما جعل أهل الموصل يُقبلون حكمه بعد أن أبقى عليهم، وكان في هذا ما جعل جيشه يكبر بلا حرب، وأن من أراد أن يضمّ قوماً فليُبقِ عليهم كرامتهم ومناصبهم.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eموت نور الدين\u003c/b\u003e\u003cspan\u003e١١٧٤، وابنٌ في الحادية عشرة، وفراغٌ سياسي في الشام\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eدمشق\u003c/b\u003e\u003cspan\u003eدخلها ١١٧٤ بلا قتالٍ يُذكر\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالسلطنة\u003c/b\u003e\u003cspan\u003e١١٧٥، أعلن نفسه سلطاناً وأقرّته الخلافة العباسية\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eحلب\u003c/b\u003e\u003cspan\u003eفُتحت ١١٨٣ بعد حصاراتٍ سابقة فاشلة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالموصل\u003c/b\u003e\u003cspan\u003eصالحها ١١٨٦، فاكتملت الوحدة من النيل إلى الفرات\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالمدينة\u003c/th\u003e\u003cth\u003eالطريقة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e١١٧٤\u003c/td\u003e\u003ctd\u003eدمشق\u003c/td\u003e\u003ctd\u003eدخولٌ بلا قتال، بدافع الأمن\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١١٧٥\u003c/td\u003e\u003ctd\u003eحمص وحماة وبعلبك\u003c/td\u003e\u003ctd\u003eضمٌّ عسكري وسياسي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١١٨٣\u003c/td\u003e\u003ctd\u003eحلب\u003c/td\u003e\u003ctd\u003eفتحٌ بعد حصاراتٍ متعددة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١١٨٦\u003c/td\u003e\u003ctd\u003eالموصل والجزيرة\u003c/td\u003e\u003ctd\u003eصلحٌ لا حرب\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eإنما نطلب البلاد لتُعان بها على استنقاذ القدس.\u003c/p\u003e\u003ccite\u003eمن تعليل صلاح الدين لتوسّعه في الشام، كما تُصوّره المصادر\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eموت نور الدين سنة ١١٧٤ فتح لصلاح الدين فرصةً لم يُخطّط لها، فدخل دمشق بلا قتال، ثم ضمّ حمص وحماة وبعلبك، وأعلن السلطنة سنة ١١٧٥، ثم فتح حلب سنة ١١٨٣، وصالح الموصل سنة ١١٨٦، فبنى وحدةً من النيل إلى الفرات. وكان في هذه الوحدة ما جعل حطين ممكنة، لأن المعركة الكبرى تُحسم قبل أن تبدأ.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"hattin","n":"حطين وتحرير القدس","ic":"🏆","part":"القسم الثالث: صلاح الدين والتحرير","h":"\u003carticle class=\"ch3\" id=\"hattin\" data-toc=\"حطين وتحرير القدس\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٣.٣\u003c/span\u003e\n          \u003ch3\u003e🏆 حطين وتحرير القدس\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي الرابع من يوليو ١١٨٧ التقى جيش صلاح الدين بجيش الصليبيين عند قرون حطين، فكانت معركةً حاسمةً دُمّر فيها الجيش الصليبي عن آخره، وأُسر ملك القدس، وقُتل أرناط. وبعدها سقطت المدن واحدةً واحدةً، ثم سُلّمت القدس في أكتوبر ١١٨٧، فانتهت ثمانٍ وثمانون سنة.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eفي سنة ١١٨٧ كان التوتر بين صلاح الدين والصليبيين قد بلغ ذروته، وكان أرناط صاحب الكرك قد أغار على قافلةٍ للمسلمين وقتل من فيها، وكان في هذه الإغارة ما جعل صلاح الدين يُقسم أن يقتله. وكان في هذا ما يُبيّن أن الأعمال الفردية قد تُشعل حروباً كبيرة، وأن من أراد أن يحفظ هدنةً فليُلزم بها أتباعه لا نفسه فقط. وكان في هذه الإغارة ما جعل صلاح الدين يجد ذريعةً لبدء الحرب في وقتٍ كان يُريدها فيه، وكان في هذا ما يُبيّن أن القائد قد ينتظر حدثاً يُبرّر ما يُريد فعله، وأن الحرب تحتاج إلى سببٍ يُقنع الناس لا إلى قوةٍ فقط.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد جمع صلاح الدين جيشه في حرّان ثم تحرّك إلى الشام، وكان جيشه من مصر والشام والجزيرة، وكان في هذا التجمع ما جعل المعركة ممكنةً بجيشٍ موحّد. وكان في هذا ما يُبيّن أن الوحدة التي بُنيت في ثلاث عشرة سنة كانت هي السلاح الحقيقي في حطين، وأن المعركة كانت ثمرةً لا بداية. وكان في هذا الجيش ما جعل صلاح الدين يُقاتل بقوةٍ لا تُقارن بما كان معه في حملاته الأولى، وكان في هذا ما جعل حطين معركةً بين دولتين لا بين إمارةٍ وحملة، وأن من أراد أن يُقاتل دولةً فليبْنِ دولةً قبلها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان الصليبيون قد جمعوا جيشهم أيضاً، وكان يقوده ملك القدس غي دي لوزينيان، ومعه أرناط، ومعهما فرسان المعبد والإسبتارية، وكان الجيش كبيراً ومدرّعاً. وكان في هذا الجيش ما جعل الصليبيين يثقون بقوتهم، وكان في هذه الثقة ما ج
