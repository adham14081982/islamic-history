<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="description" content="تمتد هذه الحقبة من سنة 1096م حين خرجت جيوش أوروبا بأمر البابا أوربان الثاني، إلى سنة 1291م حين سقطت عكا آخر معاقل الصليبيين في الشام. وهي نحو قرن ونصف">
<title>الحروب الصليبية | موسوعة تاريخ الإسلام</title>
<link rel="preload" href="assets/fonts/amiri-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/amiri-700.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* ===== موسوعة تاريخ الإسلام — التنسيق المشترك ===== */

/* الخطوط محليّة (Subset عربي): لا شبكة، ولا اختلاف في القياس بين تشغيل وتشغيل */
@font-face{font-family:'Amiri';font-style:normal;font-weight:400;font-display:block;
  src:url(assets/fonts/amiri-400.woff2) format('woff2')}
@font-face{font-family:'Amiri';font-style:normal;font-weight:700;font-display:block;
  src:url(assets/fonts/amiri-700.woff2) format('woff2')}
@font-face{font-family:'Cairo';font-style:normal;font-weight:200 1000;font-display:block;
  src:url(assets/fonts/cairo-var.woff2) format('woff2')}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --gold:#B8942F;--gold2:#8B6914;--cream:#FBF4E4;--paper:#FFFDF8;
  --ink:#2E2A24;--muted:#7C7364;--line:#E7DCC3;
  --green:#1E6B3A;--blue:#155E9C;
  --shadow:0 4px 18px rgba(80,60,20,.08);
  --c:#B8942F;
}
body{font-family:'Cairo',sans-serif;background:var(--cream);color:var(--ink);
  min-height:100vh;line-height:1.9;transition:.3s}

body.dark{--paper:#201E1A;--cream:#161512;--ink:#E8E1D2;--muted:#A79E8B;
  --line:#3A362C;--shadow:0 4px 18px rgba(0,0,0,.35)}

main{max-width:820px;margin:0 auto;padding:1.2rem 1.1rem 5rem}

/* ---------- الترويسة ---------- */
header.top{position:sticky;top:0;z-index:60;display:flex;align-items:center;
  justify-content:space-between;gap:.6rem;padding:.55rem 1rem;
  background:var(--paper);border-bottom:2px solid var(--gold)}
.brand{font-family:'Amiri',serif;font-weight:700;font-size:1.02rem;color:var(--ink);
  text-decoration:none;display:flex;align-items:center;gap:.4rem}
.tools{display:flex;align-items:center;gap:.5rem}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
  background:transparent;color:var(--ink);font-size:1.05rem;cursor:pointer;
  display:grid;place-items:center;transition:.2s}
.ib:hover{background:var(--gold);color:#fff;border-color:var(--gold)}
.ib:active{transform:scale(.9)}

/* ---------- قبة التقدم ---------- */
.dome{width:38px;height:44px;position:relative;cursor:default}
.dome svg{width:100%;height:100%;display:block}
.dome .fill{fill:var(--gold);opacity:.85;transition:.4s}

/* ---------- شارات ---------- */
.badge{display:inline-flex;align-items:center;gap:.3rem;font-size:.72rem;
  background:var(--gold);color:#fff;border-radius:50px;padding:.15rem .6rem;
  font-weight:700}

/* ---------- المسار ---------- */
.crumbs{font-size:.82rem;color:var(--muted);margin-bottom:.8rem;
  display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.crumbs a{color:var(--muted);text-decoration:none}
.crumbs a:hover{color:var(--gold2)}

/* ---------- الترويسة البطلة ---------- */
.hero{position:relative;background:var(--paper);border:1px solid var(--line);
  border-top:6px solid var(--c);border-radius:20px;padding:1.6rem 1.3rem 1.4rem;
  text-align:center;box-shadow:var(--shadow);margin-bottom:1.4rem;overflow:hidden}
.hero .ic{font-size:2.6rem;line-height:1}
.hero h1{font-family:'Amiri',serif;font-size:1.9rem;color:var(--c);margin:.3rem 0 .1rem}
.hero .period{color:var(--gold2);font-size:.85rem;font-weight:600;margin-bottom:.6rem}
.hero .intro{color:var(--muted);font-size:.96rem;line-height:2;max-width:620px;margin:0 auto}

/* ---------- زخرفة SVG ---------- */
.orn{display:block;margin:1.2rem auto;opacity:.55}
.orn line,.orn path,.orn circle{stroke:var(--gold);stroke-width:1.1;fill:none}

/* ---------- العناوين ---------- */
h2.sec{font-family:'Amiri',serif;font-size:1.35rem;color:var(--c);
  margin:2rem 0 .9rem;display:flex;align-items:center;gap:.6rem}
h2.sec:before{content:"";width:6px;height:22px;background:var(--gold);
  border-radius:3px;flex:0 0 auto}
h2.sec .n{margin-right:auto;font-family:'Cairo';font-size:.75rem;color:var(--muted);font-weight:400}

/* ---------- الخط الزمني ---------- */
.tlwrap{position:relative;margin-bottom:.4rem}
.tl{display:flex;gap:.6rem;overflow-x:auto;padding:.6rem .2rem 1rem;
  scroll-snap-type:x mandatory;scrollbar-width:thin}
.tl::-webkit-scrollbar{height:5px}
.tl::-webkit-scrollbar-thumb{background:var(--gold);border-radius:9px}
.tli{flex:0 0 150px;scroll-snap-align:center;background:var(--paper);
  border:1px solid var(--line);border-right:4px solid var(--c);
  border-radius:14px;padding:.6rem .7rem;cursor:pointer;text-align:right;
  transition:.22s;font-family:'Cairo'}
.tli:hover,.tli.on{transform:translateY(-3px);box-shadow:var(--shadow);border-right-color:var(--gold)}
.tli b{display:block;color:var(--c);font-size:.9rem}
.tli span{display:block;color:var(--muted);font-size:.76rem;line-height:1.6}
.tlnav{display:flex;justify-content:space-between;margin-top:-.5rem}

/* ---------- الأحداث ---------- */
.ev{background:var(--paper);border:1px solid var(--line);border-radius:16px;
  padding:1rem 1.1rem;margin-bottom:.9rem;box-shadow:var(--shadow);
  opacity:0;transform:translateY(14px);transition:.45s}
.ev.in{opacity:1;transform:none}
.ev-head{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;margin-bottom:.5rem}
.ev-y{background:var(--c);color:#fff;font-size:.74rem;font-weight:700;
  padding:.15rem .55rem;border-radius:6px;white-space:nowrap}
.ev h3{font-family:'Amiri',serif;font-size:1.18rem;color:var(--ink)}
.ev p{font-family:'Amiri',serif;font-size:1.08rem;line-height:2.05;text-align:justify}
.ev .res{margin-top:.7rem;padding:.55rem .8rem;border-right:4px solid var(--gold);
  background:linear-gradient(135deg,rgba(184,148,47,.10),rgba(184,148,47,.04));
  border-radius:10px;font-size:.9rem;color:var(--gold2);font-weight:600}
.ev .res:before{content:"◀ النتيجة  "}

/* ---------- الشخصيات ---------- */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.6rem}
.pc{background:var(--paper);border:1px solid var(--line);border-radius:14px;
  padding:.65rem .8rem;border-top:3px solid var(--c)}
.pc b{display:block;color:var(--ink);font-size:.95rem}
.pc span{display:block;color:var(--muted);font-size:.78rem;line-height:1.65}

/* ---------- النتائج ---------- */
.outs{list-style:none}
.outs li{position:relative;padding:.5rem 1.5rem .5rem 0;border-bottom:1px dashed var(--line);
  font-size:.95rem}
.outs li:before{content:"◆";position:absolute;right:0;color:var(--gold);font-size:.8rem}

/* ---------- المصادر ---------- */
.src{background:var(--paper);border:1px solid var(--line);border-radius:16px;
  padding:.9rem 1.1rem;margin-top:2.2rem}
.src li{font-size:.86rem;color:var(--muted);padding:.25rem 1.2rem .25rem 0;
  position:relative;line-height:1.8}
.src li:before{content:"❋";position:absolute;right:0;color:var(--gold)}
.src li cite{font-style:normal;color:var(--ink);font-weight:600}

/* ---------- التنقل بين الصفحات ---------- */
.pager{display:flex;gap:.6rem;margin-top:1.6rem}
.pager a{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:14px;
  padding:.7rem .9rem;text-decoration:none;color:var(--ink);transition:.22s}
.pager a:hover{border-color:var(--gold);box-shadow:var(--shadow)}
.pager a small{display:block;color:var(--muted);font-size:.7rem}
.pager a b{font-size:.92rem;color:var(--c)}
.pager a.next{text-align:left}
.pager a.empty{visibility:hidden}

/* ---------- الانتقال بين الصفحات ---------- */
main{animation:pageIn .4s ease}
@keyframes pageIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}

/* ---------- فهرس الصفحة الرئيسية ---------- */
.eg{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:.8rem}
.ec{position:relative;background:var(--paper);border:1px solid var(--line);
  border-top:5px solid var(--c);border-radius:18px;padding:1rem .8rem .9rem;
  text-align:center;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);
  transition:.25s;overflow:hidden}
.ec:hover{transform:translateY(-4px);box-shadow:0 10px 26px rgba(80,60,20,.16)}
.ec .ic{font-size:2.1rem;line-height:1.2}
.ec b{display:block;color:var(--c);font-size:.98rem;margin:.25rem 0 .15rem}
.ec small{display:block;color:var(--muted);font-size:.72rem;line-height:1.55}
.ec .pg{height:5px;background:var(--line);border-radius:9px;margin-top:.55rem;overflow:hidden}
.ec .pg i{display:block;height:100%;background:var(--c);width:0;transition:.4s}
.ec .done{position:absolute;top:.4rem;left:.5rem;font-size:.95rem;color:var(--gold)}

/* ---------- البحث ---------- */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;display:none}
.ov.on{display:block}
.panel{position:fixed;inset:0;background:var(--paper);z-index:95;display:none;flex-direction:column}
.panel.on{display:flex}
.sh{display:flex;gap:.6rem;padding:.8rem;border-bottom:2px solid var(--gold)}
.sh input{flex:1;border:0;background:transparent;font-family:'Cairo';
  font-size:1.05rem;color:var(--ink);outline:none}
.sb{flex:1;overflow-y:auto;padding:.8rem}
.res{background:transparent;border:1px solid var(--line);border-radius:12px;
  padding:.7rem .9rem;margin-bottom:.5rem;cursor:pointer}
.res b{display:block;color:var(--c);font-size:.95rem}
.res small{color:var(--muted);font-size:.78rem;line-height:1.6}
.res em{font-style:normal;background:rgba(184,148,47,.22);border-radius:3px;padding:0 2px}

@media(max-width:420px){
  main{padding:.9rem .8rem 4rem}
  .hero h1{font-size:1.5rem}
  .tli{flex:0 0 132px}
}

/* ========== ١) الإطار المزخرف — حواشي المخطوطات (زوايا ثابتة الحجم) ========== */
.frame{position:relative;border:1px solid var(--gold);border-radius:6px;padding:1.6rem 1.35rem}
.frame:before{content:"";position:absolute;inset:5px;border:1px solid var(--gold);
  opacity:.28;border-radius:3px;pointer-events:none}
.crn{position:absolute;width:26px;height:26px;pointer-events:none;color:var(--gold);opacity:.75}
.crn svg{width:100%;height:100%;display:block;stroke:currentColor;fill:none;stroke-width:1.1}
.crn.tl{top:-1px;right:-1px}.cn-tr{}
.crn.tr{top:-1px;left:-1px}
.crn.bl{bottom:-1px;right:-1px}
.crn.br{bottom:-1px;left:-1px}
.frame>*:not(.crn){position:relative;z-index:1}

/* ========== ٢) الخط الزمني الكبير ========== */
.orn{width:210px;max-width:70%;height:18px;opacity:.55}
.bigtl{display:flex;gap:.55rem;overflow-x:auto;padding:1rem .3rem 1.3rem;
  scroll-snap-type:x mandatory;cursor:grab;scrollbar-width:thin;
  -webkit-overflow-scrolling:touch}
.bigtl:active{cursor:grabbing}
.bigtl::-webkit-scrollbar{height:6px}
.bigtl::-webkit-scrollbar-thumb{background:var(--gold);border-radius:9px}
.btl{flex:0 0 126px;scroll-snap-align:center;position:relative;
  display:flex;flex-direction:column;align-items:center;gap:.25rem;
  text-decoration:none;color:inherit;padding-top:1.1rem}
.btl:before{content:"";position:absolute;top:.4rem;right:-.3rem;left:-.3rem;height:2px;
  background:var(--line)}
.btl:after{content:"";position:absolute;top:0;right:calc(50% - 9px);
  width:18px;height:18px;border-radius:50%;background:var(--paper);
  border:3px solid var(--c);z-index:2;transition:.25s}
.btl:hover:after{transform:scale(1.25)}
.btl .ic{font-size:1.6rem;line-height:1;z-index:2}
.btl .nm{font-family:'Amiri',serif;font-size:.86rem;color:var(--c);text-align:center;line-height:1.5}
.btl .yr{font-size:.65rem;color:var(--muted)}
.btl .st{font-size:.6rem;color:var(--gold2);font-weight:700}

/* ========== ٣) تقليب الصفحة ========== */
.flip{position:fixed;inset:0;background:var(--cream);z-index:200;pointer-events:none;opacity:0}
.flip.go{animation:flipA .5s ease forwards}
@keyframes flipA{
  0%{opacity:.95;transform:perspective(1200px) rotateY(0)}
  55%{opacity:.95;transform:perspective(1200px) rotateY(-38deg)}
  100%{opacity:1;transform:perspective(1200px) rotateY(0)}
}
main.flip-out{animation:flipB .3s ease forwards}
@keyframes flipB{to{opacity:0;transform:perspective(1200px) translateX(-45px)}}

/* ========== ٤) تقدّم على شكل سيف ========== */
.sword{position:fixed;bottom:14px;right:50%;transform:translateX(50%);
  z-index:70;pointer-events:none;display:flex;align-items:center;gap:.5rem;
  background:var(--paper);border:1px solid var(--line);border-radius:50px;
  padding:.3rem .85rem;box-shadow:var(--shadow);font-size:.72rem;color:var(--muted)}
.sword svg{height:11px;width:118px}
.sword .bl{fill:var(--gold);opacity:.9}

/* ========== ٥) الأوسمة ========== */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:.55rem;margin-top:.8rem}
.bg{border:1px dashed var(--line);border-radius:14px;padding:.7rem .5rem;text-align:center;
  background:var(--paper);opacity:.4;filter:grayscale(1);transition:.35s}
.bg.on{opacity:1;filter:none;border:1px solid var(--gold);
  box-shadow:0 0 0 1px rgba(184,148,47,.22),var(--shadow)}
.bg .bi{font-size:1.9rem;line-height:1.2}
.bg b{display:block;font-size:.82rem;color:var(--ink);margin-top:.15rem}
.bg small{display:block;color:var(--muted);font-size:.64rem;line-height:1.5}

/* ========== ٦) شريط علوي رفيع ========== */
.topbar{position:fixed;top:0;right:0;left:0;height:3px;z-index:80}
.topbar i{display:block;height:100%;width:0;
  background:linear-gradient(90deg,var(--gold),#E8CE7C);transition:width .1s linear}

/* ==========================================================
   واجهة الصفحات العميقة (فصول متعددة)
   ========================================================== */

/* الفهرس */
.toc{margin-bottom:1.4rem;padding:1.2rem 1.3rem 1.4rem}
.toclist{list-style:none}
.toclist li{margin:0}
.toclist a{display:flex;align-items:center;gap:.6rem;padding:.42rem .3rem;
  border-bottom:1px dashed var(--line);text-decoration:none;color:var(--ink);
  font-size:.92rem;transition:.2s}
.toclist a:hover{color:var(--c);padding-right:.8rem;background:rgba(184,148,47,.07)}
.toclist b{background:var(--c);color:#fff;border-radius:6px;min-width:24px;
  text-align:center;font-size:.72rem;padding:.1rem .3rem;flex:0 0 auto}
.toclist .ttl{flex:1 1 auto;min-width:0}
.toclist .tpg{margin-inline-start:auto;flex:0 0 auto;font-size:.74rem;color:var(--muted);
  background:rgba(184,148,47,.1);border-radius:6px;padding:.05rem .4rem;min-width:26px;text-align:center}

/* عنوان القسم */
.part{margin-bottom:2.6rem}
.part-h{position:relative;text-align:center;margin:2.4rem 0 1.6rem;
  padding:1.1rem .9rem;border-top:1px solid var(--gold);border-bottom:1px solid var(--gold)}
.part-ic{font-size:2rem;line-height:1}
.part-h h2{font-family:'Amiri',serif;font-size:1.5rem;color:var(--c);margin:.2rem 0}
.part-h p{color:var(--muted);font-size:.92rem;max-width:640px;margin:.4rem auto 0;line-height:1.95}

/* الفصل */
.ch3{position:relative;background:var(--paper);border:1px solid var(--line);
  border-radius:16px;padding:1.3rem 1.2rem;margin-bottom:1.1rem;box-shadow:var(--shadow)}
.ch3-h{display:flex;align-items:flex-start;gap:.6rem;margin-bottom:.7rem;
  padding-bottom:.6rem;border-bottom:1px solid var(--line)}
.ch3-n{background:var(--c);color:#fff;font-size:.72rem;font-weight:700;
  padding:.18rem .5rem;border-radius:6px;flex:0 0 auto;margin-top:.25rem}
.ch3 h3,.rbody h3{font-family:'Amiri',serif;font-size:1.35rem;color:var(--ink);line-height:1.6}
.ch3 .lead,.rbody .lead{font-family:'Amiri',serif;font-size:1.12rem;line-height:2.05;
  color:var(--c);font-weight:700;margin-bottom:.7rem;text-align:right}
.ch3 .ap,.rbody .ap{font-family:'Amiri',serif;font-size:1.1rem;line-height:2.15;
  text-align:justify;margin-bottom:.75rem}
.ch3 .sub,.rbody .sub{font-family:'Amiri',serif;font-size:1.15rem;color:var(--c);
  margin:1.2rem 0 .5rem;padding-right:.6rem;border-right:4px solid var(--gold)}

/* صندوق الخلاصة */
.kbox{margin-top:1rem;background:linear-gradient(135deg,rgba(184,148,47,.09),rgba(184,148,47,.03));
  border:1px solid var(--line);border-radius:12px;padding:.8rem .9rem}
.kbox .bt{font-family:'Amiri',serif;color:var(--gold2);font-size:1rem;margin-bottom:.5rem}
.kgrid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.55rem}
.kb{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:.5rem .6rem}
.kb b{display:block;color:var(--blue);font-size:.88rem;margin-bottom:.1rem}
.kb span{font-size:.78rem;color:var(--muted);line-height:1.6;display:block}

/* جدول */
.tblwrap{overflow-x:auto;margin-top:1rem;border:1px solid var(--line);border-radius:12px}
.tblwrap table{border-collapse:collapse;width:100%;min-width:380px}
.tblwrap th{background:var(--c);color:#fff;font-size:.82rem;font-weight:700;
  padding:.55rem .7rem;text-align:right;white-space:nowrap}
.tblwrap td{padding:.55rem .7rem;font-size:.84rem;border-bottom:1px solid var(--line);
  line-height:1.8;vertical-align:top}
.tblwrap tr:last-child td{border-bottom:0}
.tblwrap tbody tr:nth-child(odd){background:rgba(184,148,47,.045)}

/* اقتباس */
.ch3 blockquote,.rbody blockquote{margin:1rem 0;padding:.8rem 1rem;border-right:5px solid var(--gold);
  background:rgba(184,148,47,.07);border-radius:0 12px 12px 0}
.ch3 blockquote p,.rbody blockquote p{font-family:'Amiri',serif;font-size:1.08rem;line-height:2;color:var(--gold2)}
.ch3 blockquote cite,.rbody blockquote cite{display:block;margin-top:.4rem;font-size:.78rem;
  color:var(--muted);font-style:normal}

/* خلاصة الفصل */
.ch3 .res,.rbody .res{margin-top:1rem;padding:.6rem .9rem;border-right:4px solid var(--gold);
  background:linear-gradient(135deg,rgba(184,148,47,.12),rgba(184,148,47,.04));
  border-radius:10px;font-size:.9rem;color:var(--gold2);font-weight:600}
.ch3 .up{display:block;text-align:left;margin-top:.9rem;font-size:.78rem;
  color:var(--muted);text-decoration:none}
.ch3 .up:hover{color:var(--c)}

@media(max-width:420px){
  .ch3{padding:1rem .85rem}
  .ch3 .ap,.rbody .ap{font-size:1.05rem}
  .kgrid3{grid-template-columns:1fr 1fr}
}


/* ==========================================================
   COMFORT — راحة القراءة والزخرفة
   ========================================================== */

/* عرض مريح للسطر: يمنع الإرهاق البصري */
main{max-width:760px}
.ch3 .ap,.ch3 .lead{max-width:100%}

/* سطر استهلالي كبير (حرف Headline) */
.ch3 .lead .drop,.rbody .lead .drop{float:right;font-family:'Amiri',serif;font-size:3.4rem;line-height:.82;
  color:var(--c);margin:.18rem 0 0 .45rem;font-weight:700;opacity:.9;
  border-right:3px solid var(--gold);padding:.1rem .45rem 0 0}

/* فاصل زخرفي بين الأقسام */
.porn{width:280px;max-width:80%;height:38px;margin:0 auto .6rem;display:block}
.porn .ln{stroke:var(--gold);stroke-width:1.1;fill:none;opacity:.7}
.porn .dm{stroke:var(--gold);stroke-width:.9;fill:none;opacity:.5}

/* فهرس الأقسام داخل رأس القسم */
.part-list{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin-top:.7rem}
.part-list a{font-size:.76rem;text-decoration:none;color:var(--muted);
  border:1px solid var(--line);border-radius:50px;padding:.2rem .7rem;transition:.2s}
.part-list a:hover{color:var(--c);border-color:var(--gold);background:rgba(184,148,47,.08)}

/* فهرس متشعّب */
.toclist>li{padding:0}
.toc-part{list-style:none;margin-bottom:.9rem}
.toc-part>b{display:inline-block;margin-left:.4rem}
.toc-part>a{font-weight:700;font-size:.98rem;color:var(--c);display:flex;align-items:center;gap:.45rem}
.toc-part>ul{list-style:none;margin:.35rem 0 0;padding-right:.9rem;
  border-right:1px dashed var(--line)}
.toc-part>ul>li{margin:0}
.toc-part>ul a{padding:.32rem .3rem;font-size:.88rem;border:0;gap:.45rem}
.toc-part>ul a i{width:6px;height:6px;border-radius:50%;background:var(--line);

.toc-part>ul a:hover i{background:var(--gold)}
.toc-part>li.here a,.toc-part>ul>li.here a{color:var(--c);background:rgba(184,148,47,.1)}
.toc-part>ul>li.here a i{background:var(--gold);box-shadow:0 0 0 3px rgba(184,148,47,.2)}

/* تنقّل بين الفصول */
.chnav{display:flex;gap:.5rem;align-items:stretch;margin-top:1.1rem;
  padding-top:.9rem;border-top:1px dashed var(--line)}
.chnav a{flex:1;background:transparent;border:1px solid var(--line);border-radius:12px;
  padding:.5rem .7rem;text-decoration:none;transition:.22s;min-width:0}

/* ==========================================================
   القارئ — كتاب بلا تمرير عمودي
   ========================================================== */

/* الصفحة كلها: شريط علوي + مسرح + شريط سفلي */
body.reading{height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
body.reading .top{flex:0 0 auto}
body.reading .flip,body.reading .sword,body.reading .railbar,body.reading .crumbs{display:none}

main.reader{max-width:none;margin:0;padding:0;flex:1;min-height:0;
  display:flex;flex-direction:column;animation:none}

/* الشريط العلوي يحمل اسم الفصل */
.top.reading .brand{flex:1;min-width:0;gap:.35rem}
.top.reading .btxt{display:none}
.rbrand{font-family:'Amiri',serif;font-size:.92rem;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* المسرح */
.rstage{position:relative;flex:1;min-height:0;overflow:hidden;
  perspective:2200px;perspective-origin:50% 50%;touch-action:pan-y}

/* الصفحة */
.rpage{position:absolute;display:flex;flex-direction:column;overflow:hidden;
  background:var(--paper);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 6px 22px rgba(80,60,20,.12)}
.rbody{flex:1;min-height:0;overflow:hidden;padding:12px 20px}
.rpfoot{flex:0 0 auto;height:26px;display:flex;align-items:center;justify-content:center;
  font-size:.72rem;color:var(--muted);border-top:1px solid var(--line);
  direction:ltr;unicode-bidi:isolate}

/* حاوية القياس (خارج الشاشة) */
.rmeas{position:absolute;left:-99999px;top:0;visibility:hidden;pointer-events:none}
.rmeas .rbody{height:auto!important;padding:0;overflow:hidden}

/* ورقة التقليب */
.rleaf{position:absolute;display:none;transform-style:preserve-3d;
  will-change:transform;z-index:20;pointer-events:none}
.rleaf.on{display:block}
.rface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--paper);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);overflow:hidden}
.rback{transform:rotateY(180deg);
  background:linear-gradient(270deg,var(--paper) 55%,var(--cream) 100%)}
.rleaf::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to left,rgba(0,0,0,.30),rgba(0,0,0,0) 45%);
  opacity:calc(var(--a,0)*.95)}
.rleaf.prev::after{background:linear-gradient(to right,rgba(0,0,0,.30),rgba(0,0,0,0) 45%)}

/* الشريط السفلي */
.rfoot{flex:0 0 auto;display:flex;align-items:center;gap:.6rem;
  padding:.35rem .8rem;min-height:56px;border-top:1px solid var(--line);background:var(--paper)}
.rnav{min-height:48px;min-width:66px;padding:.35rem .9rem;border:1px solid var(--line);
  border-radius:12px;background:transparent;color:var(--ink);font-family:'Cairo';
  font-size:.9rem;font-weight:600;cursor:pointer;transition:.2s}
.rnav:hover:not(:disabled){border-color:var(--gold);background:rgba(184,148,47,.07)}
.rnav:disabled{opacity:.3;cursor:default}
.rprog{flex:1;height:9px;min-width:60px;border:0;padding:0;border-radius:9px;
  background:var(--line);overflow:hidden;cursor:pointer;display:block}
.rprog i{display:block;height:100%;width:0;
  background:linear-gradient(90deg,var(--gold),#E3C56A);transition:width .25s}

/* لوحة الفهرس والذهاب إلى صفحة */
.rpanel{position:fixed;top:0;right:0;bottom:0;width:min(86vw,360px);z-index:120;
  background:var(--paper);border-left:1px solid var(--line);display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .28s ease;
  box-shadow:-6px 0 24px rgba(0,0,0,.14)}
.rpanel.on{transform:translateX(0)}
.rphead{display:flex;align-items:center;justify-content:space-between;
  padding:.65rem .9rem;border-bottom:2px solid var(--gold);
  font-family:'Amiri';font-size:1.05rem;color:var(--c)}
.rpjump{display:flex;gap:.5rem;padding:.7rem .9rem;border-bottom:1px solid var(--line)}
.rpjump input{flex:1;min-width:0;min-height:46px;border:1px solid var(--line);border-radius:10px;
  background:var(--cream);color:var(--ink);font-family:'Cairo';font-size:1rem;padding:0 .7rem}
.rpgo{min-height:46px;padding:0 1rem;border:0;border-radius:10px;background:var(--gold);
  color:#fff;font-family:'Cairo';font-weight:700;cursor:pointer}
.rpfont{display:flex;align-items:center;gap:.45rem;padding:.55rem .9rem;
  border-bottom:1px solid var(--line);font-size:.85rem;color:var(--muted)}
.rpfont span{margin-left:auto}
.rpfont button{min-width:44px;min-height:42px;border:1px solid var(--line);border-radius:9px;
  background:transparent;color:var(--ink);font-family:'Cairo';font-size:.92rem;cursor:pointer}
.rpfont button.on{border-color:var(--gold);background:rgba(184,148,47,.12);color:var(--c);font-weight:700}
.rplist{flex:1;overflow-y:auto;padding:.4rem .6rem;-webkit-overflow-scrolling:touch}
.rpitem{display:flex;align-items:center;gap:.55rem;padding:.45rem .5rem;
  border-bottom:1px dashed var(--line);text-decoration:none;color:var(--ink);font-size:.9rem}
.rpitem i{background:var(--gold);color:#fff;border-radius:6px;min-width:32px;text-align:center;
  font-size:.72rem;font-style:normal;padding:.15rem .2rem;flex:0 0 auto}
.rpitem:hover{color:var(--c);background:rgba(184,148,47,.07)}
.rphome{display:block;text-align:center;padding:.85rem;border-top:1px solid var(--line);
  color:var(--c);text-decoration:none;font-weight:700;font-size:.9rem}

/* داخل الصفحة: إزالة إطار الفصل، وتوسيط الجدول بلا تمرير أفقي */
.rbody .ch3{border:0;background:transparent;box-shadow:none;padding:0;margin:0 0 .5rem}

.rbody .part-h{margin:0 0 .6rem;padding-top:.4rem}
/* غلاف الحقبة داخل القارئ: مضغوط ليدخل في صفحة واحدة بلا تمرير */
.rbody .hero{padding:.9rem .8rem .7rem;margin:0;border-top-width:4px}
.rbody .hero .ic{font-size:1.7rem}
.rbody .hero h1{font-size:1.42rem;margin:.15rem 0 0}
.rbody .hero .period{font-size:.78rem;margin-bottom:.35rem}
.rbody .hero .intro{font-size:.86rem;line-height:1.72}
.rbody .hero .orn{margin:.5rem auto;height:14px}
/* غلاف القسم داخل القارئ: مضغوط ليدخل في صفحة واحدة بلا قصّ */
.rbody .part-h .part-list{gap:.22rem;margin-top:.45rem}
.rbody .part-h .part-list a{font-size:.66rem;padding:.1rem .5rem}
.rbody .part-h p{font-size:.84rem;line-height:1.72;margin-top:.3rem}
.rbody .part-h h2{font-size:1.28rem}
.rbody .part-ic{font-size:1.5rem}
.rpfoot span:nth-child(2){margin:0 .22rem}
.rbody .tblwrap{overflow:hidden}
.rbody .tblwrap table{min-width:0;width:100%;table-layout:auto}
/* كسر الكلمات عند حدودها فقط: overflow-wrap:anywhere كان يقصّ «المرحلة» إلى «المر/حلة» */
.rbody .tblwrap th,.rbody .tblwrap td{word-break:normal;overflow-wrap:break-word;white-space:normal;hyphens:none}
.rbody .people{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.rbody mark{background:rgba(184,148,47,.38);color:inherit;border-radius:3px;padding:0 2px}
/* فهرس أكثف داخل القارئ: أقسام أكثر في الصفحة */
.rbody .toc-part{margin-bottom:.5rem}
.rbody .toclist a{padding:.26rem .3rem}
.rbody .toc-part>ul{margin-top:.2rem}
/* كتلة أطول من الصفحة (الغلاف مثلًا): تمرير داخلي بدل قصّ المحتوى */
.rbody.rflow{overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}

  .rnav{min-width:56px;font-size:.82rem;padding:.3rem .55rem}

\u003eسقوط عكا ونهاية الوجود الصليبي\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\u003c/ul\u003e\n    \u003c/li\u003e\u003cli class=\"toc-part\"\u003e\u003cb\u003e🔄\u003c/b\u003e\n      \u003ca href=\"#part-5\"\u003e\u003cspan class=\"ttl\"\u003eالقسم الخامس: الآثار والتبادل\u003c/span\u003e\u003c/a\u003e\n      \u003cul\u003e\u003cli\u003e\u003ca href=\"#trade\"\u003e\u003ci\u003e\u003c/i\u003e\u003cspan class=\"ttl\"\u003eالتجارة والمدن الساحلية\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href=\"#knowledge\"\u003e\u003ci\u003e\u003c/i\u003e\u003cspan class=\"ttl\"\u003eانتقال العلم إلى أوروبا\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href=\"#image-of-other\"\u003e\u003ci\u003e\u003c/i\u003e\u003cspan class=\"ttl\"\u003eصورة الآخر في الكتابتين\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href=\"#legacy\"\u003e\u003ci\u003e\u003c/i\u003e\u003cspan class=\"ttl\"\u003eالإرث والذاكرة\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\u003c/ul\u003e\n    \u003c/li\u003e\u003c/ol\u003e\n  \u003c/div\u003e"},{"u":"p","one":true,"id":"part-1","n":"القسم الأول: الأسباب والبداية","ic":"","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-1\" style=\"--c:#8B1A1A\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e⛪\u003c/div\u003e\n      \u003ch2\u003eالقسم الأول: الأسباب والبداية\u003c/h2\u003e\n      \u003cp\u003eكيف وُلدت فكرة الحملة الصليبية في أوروبا القرن الحادي عشر؟ هذا القسم يقرأ الأسباب التي جمعت الإقطاع والكنيسة والفقر والنمو السكاني في مشروعٍ واحد، ثم يتبع الحملة الأولى من خطبة كليرمون إلى أسوار القدس، وينتهي إلى المذبحة التي جرت في يوليو ١٠٩٩، والتي ظلّت في ذاكرة الشرق تسعة قرون.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#europe-11c\"\u003eأوروبا في القرن الحادي عشر\u003c/a\u003e\u003ca href=\"#clermont\"\u003eدعوة كليرمون والحملة الشعبية\u003c/a\u003e\u003ca href=\"#first-crusade\"\u003eالحملة الأولى: من نيقية إلى أنطاكية\u003c/a\u003e\u003ca href=\"#jerusalem-1099\"\u003eسقوط القدس ١٠٩٩\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"europe-11c","n":"أوروبا في القرن الحادي عشر","ic":"🏰","part":"القسم الأول: الأسباب والبداية","h":"\u003carticle class=\"ch3\" id=\"europe-11c\" data-toc=\"أوروبا في القرن الحادي عشر\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e١.١\u003c/span\u003e\n          \u003ch3\u003e🏰 أوروبا في القرن الحادي عشر\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eل\u003c/span\u003eم تكن الحملة الصليبية حدثاً مفاجئاً، بل كانت نتيجةً لتحوّلاتٍ عميقة في أوروبا: نموٌّ سكاني، وإقطاعٌ يبحث عن أرض، وكنيسةٌ تُريد أن تُثبت سلطتها، وطرقٌ للحجّ صارت خطراً بعد سقوط بيت المقدس في يد السلاجقة. ولم يكن الشرق الإسلامي في تلك اللحظة في وضعٍ يسمح له بأن يقرأ الخطر قبل وقوعه.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eفي القرن الحادي عشر كانت أوروبا تخرج من قرونٍ من الركود والانحطاط، فقد انتهت موجات الهجوم الخارجي التي ضربتها في القرنين التاسع والعاشر: هجمات النورمان في الشمال، والمجريون في الشرق، والمسلمون في الجنوب. ولمّا استقرّت هذه الجبهات، بدأ السكان يتزايدون تزايداً لم تعرفه أوروبا من قبل، وكان في هذا النمو ما جعل الأرض لا تكفي، وأن الإقطاع الذي يقوم على توزيع الأرض على الفرسان لا يستطيع أن يُطعم من لم يبقَ له أرض.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا النمو السكاني ما جعل أوروبا تُفرّغ طاقتها إلى الخارج: فالأبناء غير الأوائل من النبلاء لم يكن لهم نصيبٌ في الأرض بحكم نظام الإرث، وكانوا يبحثون عن أرضٍ أو غنيمة، وكان في هذا ما جعلهم يُصبحون وقوداً جاهزاً لأي مشروعٍ عسكري يفتح أمامهم باباً للثراء والمكانة. وقد كان هؤلاء الفرسان الفقراء أخطر ما في أوروبا في ذلك الوقت، لأنهم كانوا يحملون السلاح بلا عمل، ويعرفون القتال بلا سبب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت الكنيسة في تلك الفترة في صراعٍ طويل مع السلطة الدنيوية: فقد كان الباباوات يُحاولون فرض سلطتهم على الملوك والأمراء، فيما يُسمّى صراع التنصيب، وهو الصراع على من يُعيّن الأساقفة والرهبان. وكان في هذا الصراع ما جعل البابا يبحث عن مشروعٍ جامعٍ يُثبت به زعامته على العالم المسيحي كله، وأن يُوحّد أوروبا المتحاربة في هدفٍ واحدٍ يُخرجها من صراعاتها الداخلية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد وجد البابا أوربان الثاني في فكرة الحرب المقدسة ما يُحقّق هذا كله: فالحرب التي تُشنّ باسم الله تُحوّل الفرسان المتقاتلين إلى جنودٍ في خدمة الكنيسة، وتُعطي البابا زعامةً لا تُنازعه فيها السلطة الدنيوية، وتُفتح أمام الفقراء باباً للأرض والغنيمة. وكان في هذا ما جعل المشروع الصليبي مشروعاً سياسياً في ثوبٍ ديني، وأن الدين فيه كان اللغة التي تُقال بها المصالح لا المصالح نفسها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان للحجّ إلى بيت المقدس أثرٌ كبير في تهيئة الوجدان الأوروبي: فقد كان الحجّ تقليداً قديماً في المسيحية، وكان الحجّاج يذهبون من أوروبا إلى القدس عبر طرقٍ طويلة، وكانوا يعودون بأخبار الأماكن المقدسة. وكان في هذا الحجّ ما جعل القدس حاضرةً في الخيال الأوروبي لا مدينةً بعيدةً مجهولة، وأن من يُريد أن يُحرّك الناس فليبدأ من مكانٍ يعرفونه وإن لم يروه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت الأخبار التي تصل إلى أوروبا عن اضطهاد الحجّاج قد بدأت تتكاثر منذ القرن العاشر، وكانت تُضخّم في الروايات الشعبية حتى صارت صورةً عن شرقٍ يُعذّب المسيحيين ويمنعهم من زيارة الأماكن المقدسة. وكان في هذه الصورة ما جعل الأوروبي يتصوّر أن الحرب على الشرق ليست عدواناً بل دفاعاً عن إخوانه، وأن من يُقاتل فيها فهو شهيد، وكان في هذا التحريك ما جعل الحرب تُقبل في الضمير العام بلا سؤال.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم جاء الحدث الذي غيّر التوازن: ففي سنة ١٠٧١ هزم السلاجقة الجيش البيزنطي في معركة ملاذكرد، وأسروا الإمبراطور رومانوس الرابع، وكان في هذه الهزيمة ما جعل بيزنطة تفقد معظم آسيا الصغرى، وتصبح عاجزةً عن حماية طرق الحجّ. وكان في هذا التحوّل ما جعل الإمبراطور البيزنطي ألكسيوس الأول يُرسل إلى البابا يطلب المساعدة، وكان طلبه مساعدةً عسكرية محدودة لا دعوةً لحربٍ مقدسة، لكن البابا قرأ الطلب قراءةً أخرى.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في تحويل طلب المساعدة إلى مشروع فتحٍ شامل ما جعل أوروبا تُقبل على الشرق لا لمساعدة بيزنطة بل لبناء إماراتٍ لها في الشرق. وكان في هذا ما يُبيّن أن الأحداث الكبرى لا تُصنع بالنية وحدها بل بتفسير النوايا: أن طلباً محدوداً قد يُقرأ قراءةً تُوسّعه، وأن من يُريد مشروعاً كبيراً يجد في كل حدثٍ صغيرٍ مبرراً له. وكان في هذا الطلب ما جعل أوروبا تُعيد تعريف نفسها: من مدافعٍ عن حدودها إلى فاتحٍ يطلب أرضاً في الشرق.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان الشرق الإسلامي في تلك اللحظة في أسوأ حالاته السياسية: فالخلافة العباسية في بغداد كانت سلطةً رمزية لا تُسيطر على شيء، والسلاجقة كانوا قد تشظّوا إلى إماراتٍ متنازعة بعد موت ملكشاه سنة ١٠٩٢، والفاطميون في مصر كانوا في صراعٍ داخلي على الوزارة، وكانت مدن الشام مقسّمة بين إماراتٍ صغيرة تتنازع: دمشق، وحلب، وحمص، وطرابلس، وأنطاكية، والرها. وكان في هذا التشرذم ما جعل الشام لقمةً سائغة لجيشٍ موحّد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا التشرذم ما جعل المسلمين لا يقرأون الخطر قبل وصوله: فقد كانت الحروب بين الإمارات الشامية أكثر من اهتمامها بما يجري في أوروبا، وكان بعض الأمراء يُحالف الصليبيين ضد أخيه المسلم إذا اقتضت مصلحته. وكان في هذا ما جعل الحملة الأولى تنجح لا بقوتها بل بضعف من جاءت إليهم، وأن الدرس الأول من الحروب الصليبية هو أن التشرّد الداخلي هو الذي يفتح الأبواب للخارج.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا القرن أيضاً تحوّلٌ في التقنية العسكرية الأوروبية: فقد تطوّرت الدروع والرماح والنشّابيات، وصار الفارس الأوروبي المدرّع قوةً هائلة في الميدان، وكان في هذا ما جعل الأوروبيين يتقدّمون في المعارك المفتوحة على جيوشٍ أخفّ تسليحاً. وكان في هذا التفوق التقني ما جعل الثقة الأوروبية بنفسها تتزايد، وأن من يملك تفوقاً في السلاح يبحث عن مكانٍ يُستخدم فيه.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالإقطاع والبحث عن أرض\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الإقطاع نظاماً يقوم على الأرض: يُعطي السيد قطعة أرضٍ لفارسٍ مقابل خدمته العسكرية، فتصبح الأرض أساس الثروة والمكانة. وكان في هذا النظام ما جعل الأرض كل شيء، وأن من لا أرض له لا مكانة له، وأن الأبناء غير الأوائل يخرجون من النظام بلا شيء. وكان في هذا النظام ما جعل الأرض تُورَّث للأكبر، وأن من لا أرض له يبقى بلا مكانةٍ في نظامٍ لا يعرف إلا الأرض.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا ما جعل أوروبا تُنتج طبقةً كاملة من الفرسان بلا أرضٍ ولا عمل، وكان هؤلاء يُشكّلون خطراً على السلام الداخلي، لأنهم كانوا يتقاتلون بينهم ويُغيرون على أملاك الكنيسة. وكان في هذا ما جعل الكنيسة تُحاول أن تُوجّه عنفهم إلى الخارج، وأن تُعلن «هدنة الله» التي تمنع القتال في أيامٍ معينة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في توجيه هذا العنف إلى الشرق حلٌّ لثلاث مشكلاتٍ في وقتٍ واحد: أن يُخرج الفرسان الزائدين من أوروبا، وأن يُوقف حروبهم الداخلية، وأن يُفتح أمامهم باب أرضٍ جديدة. وكان في هذا ما يُبيّن أن المشروع الصليبي كان أيضاً مشروعاً اجتماعياً، وأن الدين كان غلافاً لمشكلاتٍ داخلية أوروبية.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالكنيسة والزعامة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان البابا في القرن الحادي عشر يُريد أن يكون أعلى سلطةٍ في العالم المسيحي، وكان في صراعٍ مع الإمبراطور الألماني على تعيين الأساقفة. وكان في هذا الصراع ما جعل البابا يحتاج إلى مشروعٍ يُثبت به أنه قادرٌ على قيادة العالم المسيحي كله، لا أن يكون سلطةً روحية فقط.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت الحملة الصليبية أنسب مشروعٍ لهذا: فهي تُخرج الحروب الداخلية من أوروبا، وتُعطي البابا قيادةً عسكرية، وتُحوّل الطاعة الدينية إلى طاعةٍ سياسية. وكان في هذا ما جعل البابا يُصدر قراره بأن من يخرج للحرب يُغفر له، وأن من يموت فيها فهو شهيد، وكان في هذا أعظم حافزٍ يمكن أن يُقدّم لإنسانٍ في ذلك العصر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا ما جعل الحملة الصليبية أول مشروعٍ أوروبيٍّ جامعٍ بعد سقوط الإمبراطورية الرومانية، وأن أوروبا تعلّمت من خلاله أن تُوحّد طاقاتها في هدفٍ واحد. وكان في هذا ما جعل الكنيسة تكسب زعامةً لم تعرفها من قبل، وأن الحرب الدينية تصبح أداةً سياسيةً في يد من يُعلنها.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eملاذكرد وطلب بيزنطة\u003c/h4\u003e\u003cp class=\"ap\"\u003eفي سنة ١٠٧١ انتصر السلاجقة على البيزنطيين في ملاذكرد، وأسروا الإمبراطور، وكان في هذه الهزيمة ما جعل بيزنطة تفقد آسيا الصغرى، وتصبح عاجزةً عن حماية الطرق التي يمرّ بها الحجّاج. وكان في هذا ما جعل البيزنطيين يطلبون مساعدةً عسكرية من أوروبا، وكان طلبهم محدوداً في نطاقه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان ألكسيوس الأول يطلب مرتزقةً يُقاتلون لحسابه، لا جيوشاً تُقيم في الشرق وتُقيم إماراتٍ لها. وكان في هذا الطلب ما جعل البابا يقرأه قراءةً توسّعية، ويُحوّله إلى مشروع فتحٍ شامل، وكان في هذا ما يُبيّن أن الطلب الصغير قد يُصبح كبيراً إذا وجد من يُريده كبيراً.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا التحويل ما جعل بيزنطة نفسها في خطرٍ لم تتوقّعه: فقد جاء من طلبت مساعدتهم ليُقيموا إماراتٍ على حدودها، وكان في هذا ما جعل العلاقة بين الشرق المسيحي والغرب المسيحي تتدهور بعد ذلك، وأن الحملة الرابعة بعد قرنٍ ستُدمّر القسطنطينية نفسها. وكان في هذا ما جعل بيزنطة تدفع ثمن طلبها أغلى مما توقّعت، وأن من استعان بمن هو أقوى منه فقد أعدّ لنفسه خطراً مؤجّلاً.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالنمو السكاني\u003c/b\u003e\u003cspan\u003eأوروبا تخرج من الركود، والأرض لا تكفي الأبناء غير الأوائل\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالإقطاع\u003c/b\u003e\u003cspan\u003eالأرض أساس المكانة، فطبقة فرسان بلا أرضٍ ولا عمل\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eصراع التنصيب\u003c/b\u003e\u003cspan\u003eالبابا يُريد زعامة العالم المسيحي ضد الإمبراطور\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eملاذكرد ١٠٧١\u003c/b\u003e\u003cspan\u003eهزيمة بيزنطة أمام السلاجقة، وفقدان آسيا الصغرى\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eتشرذم الشام\u003c/b\u003e\u003cspan\u003eدمشق وحلب وحمص وطرابلس وأنطاكية والرها إماراتٌ متنازعة\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالعامل\u003c/th\u003e\u003cth\u003eالأثر في أوروبا\u003c/th\u003e\u003cth\u003eالأثر في الشرق\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالنمو السكاني\u003c/td\u003e\u003ctd\u003eضغطٌ على الأرض، وهجرةٌ إلى الخارج\u003c/td\u003e\u003ctd\u003eلا أثرٍ مباشر، فالخطر لم يُقرأ بعد\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالإقطاع\u003c/td\u003e\u003ctd\u003eفرسانٌ بلا أرضٍ يبحثون عن غنيمة\u003c/td\u003e\u003ctd\u003eقوةٌ عسكرية مدرّعة لم يعرفها الشرق\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eزعامة الكنيسة\u003c/td\u003e\u003ctd\u003eتوحيد أوروبا في مشروعٍ واحد\u003c/td\u003e\u003ctd\u003eشرعيةٌ دينية لحربٍ تُسمّى مقدسة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eملاذكرد ١٠٧١\u003c/td\u003e\u003ctd\u003eطلب بيزنطة للمساعدة\u003c/td\u003e\u003ctd\u003eضعفٌ في حماية طرق الشام الشمالية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eتشرّد الإمارات\u003c/td\u003e\u003ctd\u003eبابٌ مفتوح للتوغّل\u003c/td\u003e\u003ctd\u003eحروبٌ داخلية تُسهّل سقوط المدن\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eإن أرضكم ضيّقة، وثرواتكم لا تكفي أعدادكم المتزايدة.\u003c/p\u003e\u003ccite\u003eمن خطبة أوربان الثاني في كليرمون، كما تُروى في المصادر اللاتينية\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eالحملة الصليبية لم تكن مفاجأة، بل نتيجة تحوّلاتٍ في أوروبا: نموٌّ سكاني يضغط على الأرض، وإقطاعٌ يُنتج فرساناً بلا عمل، وكنيسةٌ تبحث عن زعامة، وحجٌّ جعل القدس حاضرةً في الخيال الأوروبي. وقد جاء طلب بيزنطة للمساعدة بعد ملاذكرد فقرأه البابا قراءةً توسّعية، فتحوّل الطلب المحدود إلى مشروع فتحٍ شامل. وفي المقابل كان الشرق الإسلامي متشرّداً سياسياً، لا يقرأ الخطر قبل وصوله.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"clermont","n":"دعوة كليرمون والحملة الشعبية","ic":"📜","part":"القسم الأول: الأسباب والبداية","h":"\u003carticle class=\"ch3\" id=\"clermont\" data-toc=\"دعوة كليرمون والحملة الشعبية\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e١.٢\u003c/span\u003e\n          \u003ch3\u003e📜 دعوة كليرمون والحملة الشعبية\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي نوفمبر ١٠٩٥ وقف أوربان الثاني أمام مجمعٍ من رجال الدين والنبلاء في كليرمون بفرنسا، فخطب خطبةً أشعلت أوروبا، ودعا فيها إلى حربٍ مقدسة لتحرير بيت المقدس، ووعد من يخرج فيها بغفران الذنوب. ولم تمرّ أشهر حتى خرجت جيوشٌ لم تُنظّمها كنيسة ولا ملك.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eفي شهر نوفمبر من سنة ١٠٩٥ عُقد مجمعٌ كنسيٌّ في بلدة كليرمون في وسط فرنسا، وكان المجمع في الأصل مجمعاً إصلاحياً يُناقش شؤون الكنيسة الفرنسية، ولم يكن أحدٌ يتوقّع أن يخرج منه قرارٌ يُغيّر تاريخ العالم. وقد حضر المجمع عددٌ كبير من الأساقفة والرهبان والنبلاء، وكان في هذا الحضور ما جعل الخطبة تُنقل بسرعةٍ إلى كل أنحاء أوروبا. وكان في اختيار هذه البلدة الصغيرة ما جعل الحدث يُنسب إليها إلى الأبد، وأن القرارات الكبرى لا تُتخذ في العواصم دائماً.\u003c/p\u003e\u003cp class=\"ap\"\u003eووقف أوربان الثاني في اليوم الرابع من المجمع وخطب في الناس خطبةً طويلة، رُويت بعد ذلك بصيغٍ مختلفة، واتفقت الروايات على أنها كانت خطبةً مؤثّرة إلى حدٍّ جعل الناس يهتفون «الله يُريد ذلك». وكان في هذه الهتفة ما جعل الشعار يتجاوز الخطبة نفسها، وأن الناس خرجوا من المجمع وهم يُردّدونه في الطرق، وكان في هذا ما جعل الدعوة تنتشر بلا تنظيفٍ ولا تنظيم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد قال البابا في خطبته إن أرض الشرق التي فيها الأماكن المقدسة قد احتلها غير المسيحيين، وإن الحجّاج يُعذّبون ويُمنعون، وإن أوروبا ضيّقةٌ بأهلها وأرضها لا تكفي، وإن من يخرج إلى هذه الحرب تُغفر له ذنوبه، وإن من يموت فيها فهو شهيد. وكان في هذا الوعد الأخير ما جعل الحرب تُقبل بلا خوف، لأن الموت فيها لم يكن نهايةً بل بداية، وكان في هذا ما جعل الجندي الأوروبي يُقاتل بيقينٍ لا يعرفه جنديٌ آخر في زمانه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في خطبة كليرمون ما جعل الحرب تُصبح «حجّاً مسلّحاً»: فقد ربط البابا بين الحجّ والقتال، فصار من يخرج للقتال حاجّاً، ومن يموت فيه شهيداً. وكان في هذا الربط ما جعل الحرب تُقبل في الضمير الديني بلا إشكال، وأن من كان يُحرّم القتل في المسيحية يجد في هذه الحرب استثناءً يُبيحه، وكان في هذا ما يُبيّن كيف يُعاد تشكيل الدين لخدمة مشروعٍ سياسي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الخطبة أيضاً ما جعل البابا يطلب من النبلاء أن يُوقفوا حروبهم الداخلية، وأن يُوجّهوا سلاحهم إلى الخارج، وقال إن من كان يُقاتل أخاه فليُقاتل العدوّ الأجنبي. وكان في هذا الطلب ما جعل الكنيسة تُحقّق هدفين في وقتٍ واحد: أن تُوقف العنف الداخلي الذي كان يُدمّر أوروبا، وأن تُوجّهه إلى هدفٍ خارجي تُسيطر عليه. وقد أُعلنت في المجمع نفسه «هدنة الله» التي تمنع القتال بين المسيحيين في أيامٍ محدّدة، وكان في هذا ما جعل الداخل يُهادن ليُقاتل الخارج.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في استجابة الناس ما جعل الحركة تتجاوز ما خطّط له البابا: فقد خرج في الحملة الأولى جيوشٌ من أمراءٍ كبار، ولكن خرج قبلهم جيشٌ شعبيٌّ لم يكن في حسابات أحد. وكان في هذا الانفلات ما جعل الحملة الصليبية تتحوّل من مشروعٍ كنيسيٍّ منظّمٍ إلى حركةٍ شعبيةٍ جارفة، وكان في هذا ما جعل الكنيسة تفقد السيطرة على ما أطلقت. وكان في هذا الانفلات ما جعل البابا يُحاول بعد ذلك أن يُعيد السيطرة، فأنفذ جيوشاً منظّمةً تحت قيادة أساقفة، وكان في هذا ما جعل الحملة الرسمية تبدأ بعد أن سبقتها الفوضى.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد خرجت «الحملة الشعبية» في ربيع ١٠٩٦ بقيادة بطرس الناسك، وكان رجلاً زاهداً يُلقي المواعظ في الطرق، وكان يزعم أن له رسالةً من السماء، وقد جمع حوله آلافاً من الفقراء والفلاحين بلا سلاحٍ ولا تدريب. وكان في هذا الجيش ما جعل الحركة تُصبح حركةً اجتماعية لا عسكرية، وأن من خرج فيها لم يكن يبحث عن أرضٍ بل عن الخلاص. وكان بطرس الناسك يُبشّر بأن الفقراء هم الذين سيُحرّرون القدس، لأن الأغنياء والنبلاء فشلوا، وكان في هذا الخطاب ما جعل الحركة تأخذ طابعاً شعبياً يُعادل بين الفقر والتقرّب إلى الله.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه الحملة الشعبية ما جعل الفوضى تعمّ من بدايتها: فقد بدأ الجيش بقتل اليهود في مدن أوروبا التي مرّ بها، وكان في هذا ما يُبيّن أن الحرب المقدسة تُفرّغ العنف على من هو أقرب لا على من هو أبعد، وأن من أراد أن يقتل فسيجد ضحيةً قريبةً قبل أن يجد عدوّاً بعيداً. وقد كان في هذه المذابح ما جعل بعض الأساقفة يُحاولون حماية اليهود، وكان في هذا ما جعل الكنيسة نفسها في موقفٍ حرج.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم وصلت الحملة الشعبية إلى آسيا الصغرى، فلمّا دخلت أراضي السلاجقة أُبيدت في معركةٍ واحدةٍ قرب نيقية، ولم ينجُ منها إلا نفرٌ قليل. وكان في هذه النهاية ما جعل الحملة الشعبية عبرةً في أن الحماسة وحدها لا تُقاتل، وأن من أراد أن يُحرّر مكاناً فليكن قادراً على الوصول إليه، وكان في هذا ما جعل البابا يُدرك أن المشروع يحتاج إلى تنظيمٍ لا إلى عاطفة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في فشل الحملة الشعبية ما جعل الحملة الرسمية تُنظّم تنظيماً دقيقاً: فقد خرجت بقيادة أمراءٍ لهم خبرةٌ عسكرية، وسلكت طريقاً واحداً، وارتبطت ببيزنطة باتفاقٍ يُلزمها بإعادة ما تُحرّره إلى الإمبراطور. وكان في هذا التنظيم ما جعل الحملة الأولى أنجح الحملات كلها، وكان في هذا ما يُبيّن أن الفارق بين النجاح والفشل ليس في الإيمان بل في الإدارة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في كليرمون أيضاً ما جعل الحركة تُصبح ظاهرةً أوروبية لا فرنسية: فقد خطب البابا في فرنسا، لكن الدعوة انتشرت في ألمانيا وإيطاليا وإنكلترا وإسبانيا، وخرج في الحملة الأولى أمراءٌ من مناطق مختلفة. وكان في هذا الانتشار ما جعل الحملة الصليبية أول تجربةٍ أوروبيةٍ مشتركة، وأن أوروبا تكتشف نفسها كوحدةٍ في مواجهة الشرق. وكان في هذا ما جعل «الصليبي» يصبح هويةً تجمع من لا تجمعهم لغةٌ ولا دولة، وأن أوروبا تكتشف نفسها في مرآة الشرق لا في مرآة نفسها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في وعد الغفران ما جعل الحملة تُصبح باباً للتوبة بلا كلفة: فقد كان الغفران يُنال بالصلاة والصوم والصدقة، وصار يُنال بالسيف، وكان في هذا ما جعل الحرب أرخص طريقٍ للخلاص، وأن من أراد أن يتوب فليقتل. وكان في هذا التحوّل ما جعل أخلاق الحرب تتغيّر في أوروبا، وأن القتل يُصبح عملاً دينياً إذا كان في الاتجاه الصحيح. وكان في هذا التحوّل ما جعل أخلاق الحرب في أوروبا تتغيّر قروناً، وأن يُنشأ فكرٌ يُقدّس العنف إذا كان موجّهاً إلى الخارج، وهو ما بقي أثره في أوروبا بعد أن زالت الحملات.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003e«الله يُريد ذلك»\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت هذه الهتفة أعظم شعارٍ في تاريخ الحروب الصليبية، لأنها حوّلت قراراً باباوياً إلى إرادةٍ إلهية في نظر الناس. وكان في هذا ما جعل الاعتراض على الحملة يُصبح اعتراضاً على الله، وأن من لم يخرج فقد تخلّف عن إرادةٍ سماوية، وكان في هذا ما جعل الضغط الاجتماعي يُكمل ما بدأته الخطبة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في الشعار أيضاً ما جعل الحركة تُفلت من صاحبها: فالبابا أراد جيوشاً منظّمة، وجاءه شعبٌ لا يُنظّم، وأراد حرباً سياسية وجاءته حركةٌ دينية. وكان في هذا ما يُبيّن أن الشعارات الجامعة تُنتج ما لا يُتوقّع، وأن من يُطلق شعاراً لا يملك أن يُحدّد من سيحمله وإلى أين سيذهب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بقي هذا الشعار يُردّد في أوروبا قروناً، وكان في كل حملةٍ جديدةٍ يُعاد إحياؤه، وكان في هذا ما جعل الحروب الصليبية تُصبح جزءاً من هوية أوروبا لا حدثاً عابراً، وأن الذاكرة الجماعية تحفظ الشعار أطول مما تحفظ الأسباب. وكان في بقائه ما جعل كل حملةٍ جديدةٍ تُقدّم نفسها كإعادةٍ لأصلٍ قديم، وأن الحركات الكبرى تحتاج إلى شعارٍ قديمٍ أكثر من حاجتها إلى فكرةٍ جديدة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالحملة الشعبية ومذابح اليهود\u003c/h4\u003e\u003cp class=\"ap\"\u003eخرجت الحملة الشعبية بلا تنظيمٍ ولا سلاح، وكان أكثر من فيها من الفلاحين والفقراء الذين لم يحملوا سيفاً في حياتهم. وكان في هذا ما جعل الحركة تُشبه هجرةً أكثر من حملةٍ عسكرية، وأن الناس خرجوا بأهليهم وأمتعتهم لا بجيوشهم، وكان في هذا ما جعل نهايتها محتومة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بدأت بمذابح اليهود في مدن الراين، وكان في هذا ما يُبيّن أن العنف الذي يُطلق باسم الدين يجد ضحاياه الأقرب أولاً: فمن لا يستطيع أن يصل إلى القدس يقتل من يجده في طريقه، وأن الحماسة إذا لم تُنظّم تحوّلت إلى همجية. وكان في هذه المذابح ما جعل بعض الأساقفة يُخفون اليهود في كنائسهم، وكان في هذا ما يُبيّن أن الكنيسة لم تكن موحّدة الموقف.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أُبيدت الحملة الشعبية في آسيا الصغرى، وكان في نهايتها ما جعل الحملة الرسمية تُدرك أن الحماسة لا تكفي. وكان في هذا الدرس ما جعل الأمراء يُنظّمون جيوشهم تنظيماً دقيقاً، وأن الحملة الأولى نجحت لأنها تعلّمت من فشل من سبقها، وكان في هذا ما يُبيّن أن التجربة الفاشلة قد تكون مقدمةً للنجاح إذا قرأها من جاء بعدها.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالغفران وتحويل الحرب إلى عبادة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الغفران أعظم سلاحٍ استخدمه البابا، لأنه حوّل الحرب من عملٍ دنيوي إلى عملٍ يُنجي من النار. وكان في هذا ما جعل الناس يُقبلون على الحملة بلا خوفٍ من الموت، بل برغبةٍ فيه، لأن الموت في هذه الحرب كان أعلى من الحياة في أوروبا. وكان في هذا السلاح ما جعل البابا يملك ما لم يملكه ملك: أن يُحرّك الناس بلا جيشٍ ولا مال، وأن يُرسلهم إلى حيث يُريد بكلمةٍ واحدة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا التحويل ما جعل أخلاق الحرب تتغيّر: فمن كان يُحرّم القتل صار يُقدّسه، ومن كان يخشى الموت صار يطلبه، ومن كان يبحث عن السلام صار يبحث عن الشهادة. وكان في هذا ما يُبيّن أن الإنسان إذا أُقنع بأن الموت بابٌ للخلاص صار أخطر ما في الأرض، لأنه لا شيء يردعه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا الغفران أيضاً ما جعل الحملة تجذب من لا يُريد أرضاً ولا غنيمة: الفقراء والمجرمين والمرضى، وكان في هذا ما جعل الحملات الصليبية تُصبح ملجأً لمن لا مكان له في أوروبا. وكان في هذا ما يُبيّن أن المشروع الذي يُقدّم الخلاص يجذب كل من فقد الأمل، وأن الحاجة إلى المعنى أقوى من الحاجة إلى المال.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمجمع كليرمون\u003c/b\u003e\u003cspan\u003eنوفمبر ١٠٩٥، خطبة أوربان الثاني أمام النبلاء ورجال الدين\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالشعار\u003c/b\u003e\u003cspan\u003e«الله يُريد ذلك» — حوّل القرار البابوي إلى إرادةٍ إلهية\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eوعد الغفران\u003c/b\u003e\u003cspan\u003eمن يخرج تُغفر ذنوبه، ومن يمت فهو شهيد\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالحملة الشعبية\u003c/b\u003e\u003cspan\u003eربيع ١٠٩٦، بطرس الناسك، فقراءٌ بلا سلاحٍ ولا تدريب\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eنهايتها\u003c/b\u003e\u003cspan\u003eأُبيدت قرب نيقية، ولم ينجُ إلا نفرٌ قليل\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالوعد\u003c/th\u003e\u003cth\u003eما يعنيه للناس\u003c/th\u003e\u003cth\u003eالأثر على الحركة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eغفران الذنوب\u003c/td\u003e\u003ctd\u003eبابٌ للخلاص بلا كلفة\u003c/td\u003e\u003ctd\u003eجذب الفقراء والمجرمين والمرضى\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالشهادة عند الموت\u003c/td\u003e\u003ctd\u003eالموت في الحرب أعلى من الحياة\u003c/td\u003e\u003ctd\u003eإقدامٌ بلا خوف، وحربٌ بلا رادع\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالأرض والغنيمة\u003c/td\u003e\u003ctd\u003eمكانةٌ لمن لا أرض له\u003c/td\u003e\u003ctd\u003eجذب الفرسان الفقراء والأبناء غير الأوائل\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eإيقاف الحروب الداخلية\u003c/td\u003e\u003ctd\u003eسلامٌ داخل أوروبا\u003c/td\u003e\u003ctd\u003eتوجيه العنف إلى الخارج بدل الداخل\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eالله يُريد ذلك.\u003c/p\u003e\u003ccite\u003eهتف به الحاضرون في مجمع كليرمون بعد خطبة أوربان الثاني سنة ١٠٩٥\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eفي مجمع كليرمون حوّل أوربان الثاني طلباً بيزنطياً للمساعدة إلى مشروع حربٍ مقدسة، وربط بين الحجّ والقتال، ووعد بالغفران والشهادة، فجعل الحرب أرخص طريقٍ للخلاص. وقد هتف الناس «الله يُريد ذلك»، فخرجت الحركة عن سيطرة من أطلقها: حملةٌ شعبية بلا تنظيم بدأت بمذابح اليهود وانتهت بالإبادة قرب نيقية. وكان فشلها مقدمةً لتنظيم الحملة الأولى تنظيماً دقيقاً.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"first-crusade","n":"الحملة الأولى: من نيقية إلى أنطاكية","ic":"🐎","part":"القسم الأول: الأسباب والبداية","h":"\u003carticle class=\"ch3\" id=\"first-crusade\" data-toc=\"الحملة الأولى: من نيقية إلى أنطاكية\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e١.٣\u003c/span\u003e\n          \u003ch3\u003e🐎 الحملة الأولى: من نيقية إلى أنطاكية\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي صيف ١٠٩٦ خرجت الحملة الأولى بقيادة أربعة أمراء كبار، وسلكت طريقاً واحداً عبر آسيا الصغرى، وانتصرت في معركة دوريليوم، وحاصرت أنطاكية ثمانية أشهر، وفتحتها بعد أن كادت تُفنى. وكان في هذه الحملة ما جعلها أنجح الحملات كلها وأطولها أثراً.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eفي صيف سنة ١٠٩٦ خرجت الحملة الأولى من أوروبا، وكانت تتكوّن من أربع فرقٍ رئيسية بقيادة أربعة أمراء: غودفري دي بويون في اللورين، وبوهيموند في جنوب إيطاليا، وريمون دي سان جيل في تولوز، وروبرت النورماندي في الشمال. وكان في هذا التعدّد ما جعل الحملة أقوى من أي جيشٍ واحد، وكان في غياب قائدٍ أعلى ما جعل القرارات تُتخذ بالتشاور والتنازع معاً.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا التعدّد أيضاً ما جعل الحملة تُنتج إماراتٍ متعددة لا دولةً واحدة: فكل أميرٍ أراد أن يُقيم إمارةً لنفسه، وكان في هذا ما جعل الشرق الصليبي يُصبح مجموعةً من الإمارات المتنازعة لا كتلةً واحدة. وكان في هذا ما جعل المسلمين بعد ذلك قادرين على أن يفتحوا الإمارات واحدةً واحدةً، لأنها لم تكن مُتحصّنةً في وحدةٍ سياسية. وكان في هذا ما جعل الحملة الأولى تنجح عسكرياً وتفشل سياسياً، لأن النجاح العسكري لا يُنتج دولة إذا لم يكن هناك من يُوحّد الأجزاء بعد الفتح.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد مرّت الحملة ببيزنطة أولاً، وكان الإمبراطور ألكسيوس قد اشترط أن تُعاد إليه المدن التي تُفتح، وأن يُقسم الأمراء له بالولاء. وكان في هذا الشرط ما جعل العلاقة بين الصليبيين والبيزنطيين متوتّرة من البداية، لأن الأمراء أرادوا إماراتٍ لأنفسهم لا مدناً للإمبراطور، وكان في هذا ما جعل بيزنطة تُساعدهم بحذرٍ وتُراقبهم بخوف. وكان في هذا القسم ما جعل بيزنطة تُشارك في الحملة بمراقبةٍ لا بجيش، وأنها كانت تُريد أن تُستعاد لها المدن لا أن تُقيم لها حروب.\u003c/p\u003e\u003cp class=\"ap\"\u003eولمّا وصلت الحملة إلى نيقية، حاصرتها وفتحتها، ولكن البيزنطيين دخلوا المدينة أولاً وتسلّموها بحكم الاتفاق، فلم يجد الصليبيون غنائم، وكان في هذا ما جعل العداء بينهم وبين بيزنطة يزداد. وكان في هذا الموقف ما يُبيّن أن التحالفات التي تُبنى على المصالح تتصدّع عند أول غنيمة، وأن من أراد أن يحفظ تحالفاً فليُحدّد من يأخذ ماذا قبل أن يبدأ.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم كانت معركة دوريليوم في يوليو ١٠٩٧، وقد لقي الصليبيون جيشاً سلجوقياً كبيراً بقيادة قلج أرسلان، وكان الجيش السلجوقي أخفّ حركةً وأسرع من الصليبيين، وكان يُقاتل بأسلوب المناورة والسهام. وكان في هذه المعركة ما جعل الصليبيين ينتصرون بثباتهم لا بحركتهم، لأن الدروع الثقيلة جعلتهم يُصمدون أمام السهام، وكان في هذا ما يُبيّن أن أسلوب القتال الذي يناسب الصحراء لا يناسب كل أرض.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في دوريليوم درسٌ عسكري مهم: أن الصليبيين لم يكونوا يتعلّمون من المسلمين أسلوبهم، بل فرضوا أسلوبهم على الأرض، وكان في هذا ما جعلهم ينتصرون في المعارك المفتوحة، وأن من أراد أن يهزمهم فليتجنّب المعركة المفتوحة ويستخدم الحصار والاستنزاف. وكان في هذا ما جعل صلاح الدين بعد قرنٍ يُحقّق ما لم يُحقّقه غيره، لأنه قاتلهم بالحصار والإنهاك لا بالمواجهة.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم وصلت الحملة إلى أنطاكية في أكتوبر ١٠٩٧، وكانت مدينةً عظيمةً مُحصّنة لا تُفتح بسهولة، فحاصرها الصليبيون ثمانية أشهر، واشتدّ عليهم الجوع والبرد والمرض، حتى أكلوا الدوابّ والجلود. وكان في هذا الحصار ما جعل الحملة تُفقد نصف عددها بلا قتال، وكان في هذا ما يُبيّن أن الحصار قد يكون أشدّ من المعركة، وأن الجيوش تموت من الجوع أكثر مما تموت من السيف.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي أثناء الحصار وصل جيشٌ إسلامي كبير بقيادة كربوغا حاكم الموصل لنجدة المدينة، فحاصر الصليبيين في معسكرهم، وصار المُحاصِر مُحاصَراً. وكان في هذا التحوّل ما جعل الحملة على شفا الإبادة، وكان في هذا ما يُبيّن أن المسلمين كانوا قادرين على إفناء الحملة الأولى لو أنهم استمرّوا في الضغط، وأن نجاة الحملة كانت بفارقٍ ضئيل. وكان في هذا التحوّل ما جعل الصليبيين يُدركون أنهم قد يموتون في الحصار لا في المعركة، وأن من أراد أن ينجو فليخرج من موضعه ولو كان ضعيفاً.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد نجا الصليبيون بحدثٍ غريب: فقد اكتشف أحدهم في كنيسةٍ بأنطاكية ما قيل إنه رمحٌ مقدّس، فانتشر الخبر وتغيّرت معنويات الجيش، وخرجوا في هجومٍ مفاجئٍ على جيش كربوغا فهزموه. وكان في هذا الحدث ما يُبيّن أن الحرب في ذلك العصر كانت تُحسم أحياناً بالمعنويات لا بالسلاح، وأن من يُقنع جيشه بأن الله معه يمنحه قوةً لا تُقاس بالعدد. وكان في هذا الحدث ما جعل بعض القادة يتشكّكون في صدق الرؤيا، وكان في هذا الشكّ ما جعل الصف الصليبي ينقسم بين مؤمنٍ بها ومُرتابٍ فيها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد فُتحت أنطاكية في يونيو ١٠٩٨ بتسليم أحد حرّاس الأسوار، وكان في هذا التسليم ما جعل المدينة تسقط بلا معركة، وأن الخيانة الداخلية قد تكون أخطر من الحصار الخارجي. وكان في هذا ما جعل الصليبيين يُقيمون إمارة أنطاكية بقيادة بوهيموند، وكان في هذا أول إمارةٍ صليبية في الشرق، وكان في تأسيسها ما جعل الحملة تتحوّل من حجٍّ مسلّح إلى استيطانٍ دائم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في تأسيس الإمارات ما غيّر طبيعة الحملة: فالصليبيون لم يعودوا يُريدون الوصول إلى القدس فقط، بل أرادوا أن يُقيموا دولاً، وكان في هذا ما جعل الحملة تتوقّف عن الزحف وتُوزّع قواها على المدن التي فتحتها. وكان في هذا ما يُبيّن أن الفتح قد يُبطئ صاحبه إذا أراد أن يحفظ ما فتح، وأن الطموح إلى الدولة قد يُؤجّل الطموح إلى الهدف. وكان في هذا ما جعل الصليبيين يُصبحون جزءاً من سياسة الشرق لا قوةً خارجه، وأنهم بدأوا يُعاهدون الإمارات المسلمة ويُحالفونها ضد بعضها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه المرحلة من الحملة ما جعل المسلمين في الشام يُدركون حجم الخطر، ولكنهم لم يتوحّدوا: فقد كانوا يتنازعون على المدن، وكان بعضهم يُحالف الصليبيين ضد غيره، وكان في هذا ما جعل الحملة تتقدّم بلا مقاومةٍ جماعية. وكان في هذا ما جعل الحملة الأولى تصل إلى القدس بعد ثلاث سنواتٍ من خروجها، وأن المسافة التي قطعتها كانت أقل من المسافة التي قطعها المسلمون في تنازعهم.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eأمراء بلا قائد\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم تكن للحملة الأولى قيادةٌ موحّدة، وكان كل أميرٍ يقود فرقته ويُقرّر بنفسه، وكان في هذا ما جعل القرارات تُتخذ بالتشاور والتنازع. وكان في هذا ما جعل الحملة بطيئةً في حركتها، لأن كل خطوةٍ تحتاج إلى موافقة أربعة، وكان في هذا أيضاً ما جعلها مرنةً، لأن كل أميرٍ كان يُقاتل بجديةٍ لأنه يُقاتل لنفسه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في غياب القائد الواحد ما جعل الحملة تُنتج إماراتٍ بدل دولة: فلم يكن هناك من يُوزّع الفتوحات، فكان كل أميرٍ يأخذ ما يقدر عليه. وكان في هذا ما جعل الشرق الصليبي مجموعةً من الإمارات المتفرقة، وكان في هذا ما سهّل على المسلمين فتحها واحداً واحداً بعد ذلك.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا ما يُبيّن أن الوحدة قد لا تكون شرطاً للنصر في البداية، لكنها شرطٌ للبقاء. فالحملة الأولى انتصرت لأنها كانت متفرقةً في القيادة موحّدةً في الهدف، ولم تلبث أن ضعفت لأنها بقيت متفرقةً بعد أن تحقّق الهدف، وكان في هذا درسٌ في أن الأهداف المؤقتة تُوحّد، والأملاك الدائمة تُفرّق.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eحصار أنطاكية والرمح المقدّس\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان حصار أنطاكية أطول حصارٍ في الحملة الأولى وأشدّه، وقد دام ثمانية أشهر، ومات فيه من الجوع والبرد والمرض عددٌ أكبر ممن مات في المعارك. وكان في هذا الحصار ما جعل الصليبيين يُدركون أن الشرق لا يُفتح بالمعارك وحدها، وأن الحصون تحتاج إلى صبرٍ لا إلى شجاعة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد جاء جيش كربوغا فحاصر المُحاصِرين، وكان في هذا التحوّل ما جعل الحملة على شفا الإبادة، وكان في هذا ما يُبيّن أن المسلمين كانوا قادرين على إفناء الحملة لو أنهم واصلوا الضغط. وكان في نجاة الصليبيين ما جعلهم يُفسّرونها بأنها معجزة، وكان في هذا التفسير ما زاد من ثقتهم بأن الله معهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في قصة الرمح المقدّس ما جعل المعنويات تتغيّر في لحظة، وكان في هذا ما يُبيّن أن الحرب في ذلك العصر كانت تُحسم أحياناً بالأسطورة لا بالسلاح. وكان في هذا أيضاً ما جعل بعض القادة يُشكّكون في القصة، وكان في هذا الشكّ ما جعل الحملة تُنقسم إلى من يُصدّق ومن يُرتاب، وكان في هذا الانقسام ما جعل الوحدة الصليبية تتصدّع من الداخل.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eمن حجٍّ إلى إمارات\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الحملة الأولى في نيّتها الأولى حجّاً مسلّحاً إلى القدس، ولكنها في مسيرها صارت مشروع استيطان: فبعد أن فُتحت الرها وأنطاكية، أُقيمت إمارتان، وكان في هذا ما جعل الأمراء يُعيدون النظر في أهدافهم. وكان في هذا التحوّل ما جعل الحملة تُصبح مشروعاً لإقامة دولةٍ لا لزيارة مكان.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا التحوّل ما جعل الصليبيين يتعاملون مع الأرض لا مع الطريق: فبدأوا يُنظّمون الزراعة والتجارة والعلاقات مع السكان المحليين، وكان في هذا ما جعل الشرق الصليبي يُصبح كياناً له مصالح لا مجرد جيشٍ عابر. وكان في هذا ما جعل المسلمين يُدركون أن الخطر ليس حملةً ستعود بل وجوداً سيبقى.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا ما يُبيّن أن الفتح قد يُغيّر الفاتح: فمن جاء ليُحرّر مكاناً مقدساً صار يُدير مدناً وأراضي وفلاحين، وأن من أراد أن يحفظ ما فتح فليهتمّ بالإدارة لا بالقتال فقط. وكان في هذا ما جعل إمارات الصليبيين تضعف بعد جيلٍ لأنها لم تبنِ مؤسساتٍ تُدير المجتمع الذي فتحته.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالخروج\u003c/b\u003e\u003cspan\u003eصيف ١٠٩٦، أربعة أمراء: غودفري، بوهيموند، ريمون، روبرت\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eنيقية\u003c/b\u003e\u003cspan\u003eفُتحت ١٠٩٧، وتسلّمها البيزنطيون بحكم الاتفاق\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eدوريليوم\u003c/b\u003e\u003cspan\u003eيوليو ١٠٩٧، انتصارٌ على قلج أرسلان بالثبات لا بالمناورة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأنطاكية\u003c/b\u003e\u003cspan\u003eحصارٌ ثمانية أشهر، ثم سقوطها يونيو ١٠٩٨\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأول إمارة\u003c/b\u003e\u003cspan\u003eإمارة أنطاكية بقيادة بوهيموند\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمحطة\u003c/th\u003e\u003cth\u003eالتاريخ\u003c/th\u003e\u003cth\u003eما جرى فيها\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالقسطنطينية\u003c/td\u003e\u003ctd\u003e١٠٩٦–١٠٩٧\u003c/td\u003e\u003ctd\u003eقسم الأمراء للبيزنطي بإعادة المدن المفتوحة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eنيقية\u003c/td\u003e\u003ctd\u003eيونيو ١٠٩٧\u003c/td\u003e\u003ctd\u003eسقوطها، وتسلّم البيزنطيين لها، وغياب الغنائم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eدوريليوم\u003c/td\u003e\u003ctd\u003eيوليو ١٠٩٧\u003c/td\u003e\u003ctd\u003eانتصارٌ صليبي على السلاجقة، وتأمين طريق آسيا الصغرى\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالرها\u003c/td\u003e\u003ctd\u003e١٠٩٨\u003c/td\u003e\u003ctd\u003eأول إمارةٍ صليبية، بقيادة بلدوين\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eأنطاكية\u003c/td\u003e\u003ctd\u003eأكتوبر ١٠٩٧ – يونيو ١٠٩٨\u003c/td\u003e\u003ctd\u003eحصارٌ طويل، ثم نجاةٌ من جيش كربوغا، ثم سقوط المدينة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eإن أرضكم ضيّقة بكم، ولا تكفي زرعاً لأعدادكم، ولذلك تفتكون ببعضكم وتأكلون بعضكم.\u003c/p\u003e\u003ccite\u003eمن خطبة كليرمون، وقد صارت وصفاً لحال من خرجوا في الحملة الأولى\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eالحملة الأولى خرجت بأربعة أمراء بلا قائدٍ واحد، فأنتجت أربع إماراتٍ بدل دولة. انتصرت في دوريليوم بالثبات، وحاصرت أنطاكية ثمانية أشهر حتى كادت تُفنى، ونجت بفارقٍ ضئيل حين جاء جيش كربوغا. وفي مسيرها تحوّلت من حجٍّ مسلّح إلى مشروع استيطان، وكان في هذا التحوّل ما جعل الخطر على الشرق دائماً لا عابراً، وما جعل المسلمين يُدركون أن التشرّد الداخلي هو الذي فتح الأبواب.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"jerusalem-1099","n":"سقوط القدس ١٠٩٩","ic":"🩸","part":"القسم الأول: الأسباب والبداية","h":"\u003carticle class=\"ch3\" id=\"jerusalem-1099\" data-toc=\"سقوط القدس ١٠٩٩\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e١.٤\u003c/span\u003e\n          \u003ch3\u003e🩸 سقوط القدس ١٠٩٩\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي الخامس عشر من يوليو ١٠٩٩ اقتحم الصليبيون القدس بعد حصارٍ ستة أسابيع، وقتلوا من أهلها ما يُقدّر بعشرات الآلاف، حتى رُوي أن الدم سال في الطرق. وكان في هذا اليوم ما جعل الشرق يُدرك أن ما جاء ليس حملةً عابرة، وأن المدينة التي تُحرَّر بعد ثمانٍ وثمانين سنة بقيت في الذاكرة جرحاً لم يُنسَ.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eبعد سقوط أنطاكية تأخّرت الحملة عن مسيرها، فقد كان الأمراء يتنازعون على المدن التي فتحوها، وكان في هذا التنازع ما جعل المسير إلى القدس يتأخّر أشهراً. وكان في هذا التأخير ما جعل المسلمين في الشام يُتيح لهم الوقت ليتوحّدوا، ولكنهم لم يفعلوا، وكان في هذا ما جعل الحملة تصل إلى هدفها بلا مقاومةٍ جماعية. وكان في هذا التأخير ما جعل بعض المؤرّخين يقول إن الحملة لو أسرعت لبلغت القدس قبل أن يُحصّنها أحد، وكان في هذا ما يُبيّن أن الوقت في الحرب قد يكون أغلى من السلاح.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي يونيو ١٠٩٩ وصل الصليبيون إلى القدس، وكان عددهم لا يزيد على خمسة عشر ألفاً، وكانت المدينة في يد الفاطميين، وكانت حاميتها ضعيفةً لأن الفاطميين كانوا في صراعٍ داخلي على الوزارة. وكان في هذا الموقف ما جعل المدينة تُحاصر بجيشٍ صغيرٍ أمام مدينةٍ لم تُحصّن تحصيناً كافياً، وكان في هذا ما جعل النتيجة محتومة. وكان في هذا التفاوت بين الجيش الصغير والمدينة الكبيرة ما جعل بعض القادة يُشكّكون في إمكان الفتح، وكان في هذا ما جعل قرار الهجوم قراراً صعباً لا بديهياً.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد حاصر الصليبيون المدينة ستة أسابيع، وكانوا يُعانون من العطش والجوع، وكانت المدينة تُمتنع عليهم. وكان في هذا الحصار ما جعلهم يبنون أبراجاً خشبية ويُهاجمون بها الأسوار، وكان في هذا ما جعلهم ينجحون في الاقتحام في الخامس عشر من يوليو، وكان في هذا ما يُبيّن أن الحصار إذا طال على المُحاصِر أيضاً، فإن من يصبر أكثر يفوز. وكان في بناء الأبراج الخشبية ما جعل الحصار يتحوّل من انتظارٍ إلى هجوم، وأن من أراد أن يتجاوز سوراً فليبنِ ما يُعادله ارتفاعاً.\u003c/p\u003e\u003cp class=\"ap\"\u003eولمّا دخل الصليبيون المدينة، وقعت مذبحةٌ عظيمة، وقد اختلفت الروايات في عدد القتلى، فبعضها يقول عشرة آلاف، وبعضها يقول سبعون ألفاً، والروايات اللاتينية نفسها تتحدّث عن دمٍ بلغ رُكب الخيل. وكان في هذه المذبحة ما جعل صورة الصليبي في الذاكرة الشرقية صورة قاتلٍ لا مُحارب، وكان في هذا ما جعل الحرب بعد ذلك تأخذ طابع الثأر لا طابع الصراع السياسي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في المذبحة ما جعل حتى بعض المؤرّخين الأوروبيين يُسجّلونها بحرج، وكان في هذا ما يُبيّن أن الفظائع لا تُبرَّر بالدين، وأن من يُقتل باسم الله لا يُشرّف الله. وكان في هذه المذبحة ما جعل القدس تُصبح رمزاً في الوجدان الإسلامي لا مدينةً فقط، وكان في هذا ما جعل تحريرها بعد ذلك هدفاً لكل من أراد أن يُوحّد المسلمين. وكان في هذا الحرج ما جعل بعض المؤرّخين يُحاولون تفسير المذبحة بأنها كانت عرفاً حربياً في ذلك العصر، وكان في هذا التفسير ما يُبيّن أن الأعراف قد تُبرّر ما لا يُبرَّر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في سقوط القدس ما جعل المسلمين يُدركون حجم الكارثة، وقد رُوي أن بعض العلماء بكى حين بلغه الخبر، وأن الناس في بغداد ودمشق خرجوا يصرخون. وكان في هذا الصدمة ما جعل الخطاب الإسلامي يتغيّر من خطاب الدفاع عن الحدود إلى خطاب استرداد المقدسات، وكان في هذا ما جعل القدس تدخل في صلب السياسة لا في هامشها. وكان في هذه الصدمة ما جعل الناس يسألون عن السبب لا عن العدوّ فقط، وكان في هذا ما جعل النقد يتوجّه إلى الحكّام لا إلى الصليبيين وحدهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه الكارثة أيضاً ما جعل المسلمين يسألون: كيف سقطت القدس؟ وكان الجواب الذي قدّمه العلماء والمؤرّخون هو التشرّد السياسي والتقاتل الداخلي، وكان في هذا الجواب ما جعل الإصلاح يبدأ من الداخل لا من الخارج. وكان في هذا ما جعل بعض العلماء يُؤلّفون كتباً في «فضائل الجهاد» ويُحرّضون على الوحدة، وكان في هذا ما جعل الردّ يبدأ فكرياً قبل أن يبدأ عسكرياً.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أُقيمت بعد سقوط القدس مملكة القدس اللاتينية، وكانت تتكوّن من أربع إمارات: مملكة القدس، وإمارة أنطاكية، وإمارة الرها، وكونتية طرابلس. وكان في هذا التقسيم ما جعل الشرق الصليبي هيكلاً هشّاً، لأن هذه الإمارات كانت تتنازع على النفوذ، وكان في هذا ما جعل المسلمين قادرين على أن يفتحوها واحدةً واحدةً بعد ذلك. وكان في هذا الهيكل ما جعل مملكة القدس دولةً بلا عاصمةٍ قوية، لأن القدس كانت فقيرةً وضعيفةً بالمقارنة مع صور وعكا، وكان في هذا ما جعل مركز الثقل في الساحل لا في الداخل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه الإمارات ما جعل الصليبيين يُواجهون مشكلةً لم يتوقّعوها: أنهم قلّةٌ في أرضٍ كثيرة السكان، وأنهم لم يستطيعوا أن يُحكموا بلا تعاونٍ مع السكان المحليين. وكان في هذا ما جعلهم يُقيمون نظاماً إقطاعياً على النمط الأوروبي، وكان في هذا ما جعل الفلاحين المسلمون يُعانون من ضرائب جديدة، وكان في هذا ما جعل المقاومة الشعبية تبدأ قبل المقاومة الرسمية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في سقوط القدس ما جعل المسلمين يُعيدون النظر في مفهوم الجهاد: فقد كان الجهاد في القرون الأولى جهاد فتحٍ وتبليغ، وصار بعد ذلك جهاد دفاعٍ واسترداد. وكان في هذا التحوّل ما جعل الفقه يُطوّر أحكاماً جديدة، وأن يُبيّن أن الأحكام تتغيّر بتغيّر الأحوال، وأن الفقه الحيّ هو الذي يُجيب على أسئلة عصره. وكان في هذا التحوّل ما جعل الفقه يُطوّر أحكاماً في الدفاع والاستنصار والصلح مع العدوّ، وأن يُبيّن أن الفقه الحيّ يُجيب على أسئلة عصره لا على أسئلة قرونٍ مضت.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في المذبحة ما جعل بعض المؤرّخين المسلمين يكتبون عنها بتفصيلٍ شديد، وكان في هذا ما جعل الذاكرة الجمعية تحفظ الحدث لا كخبرٍ بل كجرح، وكان في هذا ما يُبيّن أن التاريخ لا يُكتب بالأرقام فقط بل بالألم. وكان في هذا ما جعل القدس في الوجدان الإسلامي أعلى من كونها مدينة، وأن من أراد أن يفهم الشرق فليفهم ما تعنيه هذه المدينة. وكان في هذا ما جعل القدس تُذكر في الشعر والخطابة والدعاء، وأن الحدث لا يُحفظ في الكتب فقط بل في الوجدان.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالمذبحة وأرقامها\u003c/h4\u003e\u003cp class=\"ap\"\u003eاختلفت الروايات في عدد قتلى القدس اختلافاً كبيراً: فرواية تتحدّث عن عشرة آلاف، وأخرى عن سبعين ألفاً، وبعضها يقول إن الدم سال في الطرق حتى بلغ رُكب الخيل. وكان في هذا الاختلاف ما جعل المؤرّخين يتعاملون مع الأرقام بحذر، وكان في هذا ما يُبيّن أن الرواية في الحرب تُضخّم دائماً، وأن الرقم قد يكون سلاحاً في الحرب النفسية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في المذبحة ما جعل حتى بعض المصادر الأوروبية تُسجّلها بحرج، وكان في هذا ما يُبيّن أن الفظائع لا تُبرَّر بالدين، وأن من يقتل باسم الله لا يُشرّف الله. وكان في هذه المذبحة ما جعل صورة الصليبي في الشرق صورة قاتلٍ لا محارب، وكان في هذا ما جعل الحرب بعد ذلك تأخذ طابع الثأر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في المذبحة أيضاً ما جعل اليهود والمسلمين يُقتلون معاً في المدينة، وكان في هذا ما يُبيّن أن العنف الديني لا يُفرّق بين ضحاياه، وأن من يُطلق منطق «المقدّس» لا يستطيع أن يُحدّد من هو العدوّ. وكان في هذا ما جعل بعض العلماء المسلمين يكتبون عن الحدث بوصفه كارثةً إنسانية لا هزيمةً عسكرية فقط.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eلماذا سقطت القدس؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eسقطت القدس لأن الشام كان متشرّداً سياسياً: فقد كانت دمشق وحلب وحمص وطرابلس وأنطاكية إماراتٍ متنازعة، وكان بعضها يُحالف الصليبيين ضد غيره. وكان في هذا التشرّد ما جعل الحملة تتقدّم بلا مقاومةٍ جماعية، وكان في هذا ما جعل الدرس الأول من الكارثة أن التشرّد الداخلي يفتح الأبواب للخارج.\u003c/p\u003e\u003cp class=\"ap\"\u003eوسقطت أيضاً لأن الفاطميين في مصر كانوا في صراعٍ داخلي على الوزارة، وكانت حامية القدس ضعيفةً بسبب هذا الصراع. وكان في هذا ما جعل المدينة تُسقط بجيشٍ لا يزيد على خمسة عشر ألفاً، وكان في هذا ما يُبيّن أن الخطر الخارجي لا يكون خطيراً إلا إذا وجد داخلاً مُتشظّياً.\u003c/p\u003e\u003cp class=\"ap\"\u003eوسقطت ثالثاً لأن المسلمين لم يقرأوا الخطر قبل وصوله: فقد كانت الحروب بين الإمارات الشامية أكثر من اهتمامها بما يجري في أوروبا، وكان في هذا ما جعل الحملة تصل إلى هدفها بعد ثلاث سنوات من خروجها. وكان في هذا ما يُبيّن أن من لا يقرأ الخطر مبكراً يدفع ثمن قراءته متأخراً.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eأثر الكارثة في الوجدان\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان لسقوط القدس أثرٌ في الوجدان الإسلامي أكبر من أثره العسكري، فقد تحوّلت المدينة من مكانٍ يُزار إلى رمزٍ يُقاتل من أجله. وكان في هذا التحوّل ما جعل الخطاب الإسلامي يتغيّر من الدفاع عن الحدود إلى استرداد المقدسات، وكان في هذا ما جعل القدس تدخل في صلب السياسة لا في هامشها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد رُوي أن بعض العلماء بكى حين بلغه الخبر، وأن الناس في بغداد ودمشق خرجوا يصرخون، وكان في هذا ما جعل الصدمة تُصبح دافعاً للإصلاح. وكان في هذا ما يُبيّن أن الأمة قد تنام طويلاً ثم تستيقظ بضربةٍ واحدة، وأن الضربة قد تكون رحمةً إذا أيقظت من نومٍ طويل. وكان في هذا ما جعل بعض الناس يقول إن القدس سقطت لأن المسلمين تركوا الجهاد، وكان في هذا القول ما جعل الإصلاح يبدأ بالنفس.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا الأثر ما جعل العلماء يُؤلّفون كتباً في «فضائل الجهاد» ويُحرّضون على الوحدة، وكان في هذا ما جعل الردّ يبدأ فكرياً قبل أن يبدأ عسكرياً. وكان في هذا ما يُبيّن أن الحروب لا تُخاض بالسيوف وحدها بل بالأفكار التي تُهيّئ لها، وأن من أراد أن يهزم عدوّاً فليبدأ ببناء الفكرة التي تُوحّد الناس عليه.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالحصار\u003c/b\u003e\u003cspan\u003eيونيو–يوليو ١٠٩٩، ستة أسابيع، بجيشٍ لا يزيد على خمسة عشر ألفاً\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالاقتحام\u003c/b\u003e\u003cspan\u003e١٥ يوليو ١٠٩٩، بعد بناء أبراجٍ خشبية\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمذبحة\u003c/b\u003e\u003cspan\u003eأرقامٌ متضاربة بين عشرة آلاف وسبعين ألفاً\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمملكة القدس\u003c/b\u003e\u003cspan\u003eأربع إمارات: القدس، أنطاكية، الرها، طرابلس\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسبب السقوط\u003c/b\u003e\u003cspan\u003eتشرّدٌ سياسي في الشام، وصراعٌ داخلي عند الفاطميين\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالعامل\u003c/th\u003e\u003cth\u003eالحال سنة ١٠٩٩\u003c/th\u003e\u003cth\u003eالنتيجة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالشام\u003c/td\u003e\u003ctd\u003eإماراتٌ متنازعة تتحالف مع الصليبيين ضد بعضها\u003c/td\u003e\u003ctd\u003eتقدّمٌ صليبي بلا مقاومةٍ جماعية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eمصر\u003c/td\u003e\u003ctd\u003eصراعٌ على الوزارة عند الفاطميين\u003c/td\u003e\u003ctd\u003eضعفٌ في حامية القدس\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالخلافة العباسية\u003c/td\u003e\u003ctd\u003eسلطةٌ رمزية في بغداد\u003c/td\u003e\u003ctd\u003eلا استجابةً مركزية للخطر\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمقاومة الشعبية\u003c/td\u003e\u003ctd\u003eبدأت قبل المقاومة الرسمية\u003c/td\u003e\u003ctd\u003eأساسٌ للردّ بعد جيلين\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eسال الدم في شوارع المدينة حتى بلغ رُكب الخيل.\u003c/p\u003e\u003ccite\u003eمن الروايات اللاتينية عن مذبحة القدس في يوليو ١٠٩٩\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eسقطت القدس في يوليو ١٠٩٩ بعد حصارٍ ستة أسابيع، ووقعت فيها مذبحةٌ اختلفت الروايات في أرقامها. وكان سبب السقوط تشرّد الشام السياسي وصراع الفاطميين الداخلي، لا قوة الحملة وحدها. وقد حوّلت الكارثة القدس من مكانٍ يُزار إلى رمزٍ يُقاتل من أجله، وأدخلت الخطاب الإسلامي في مرحلة استرداد المقدسات، وجعلت الردّ يبدأ فكرياً قبل أن يبدأ عسكرياً.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-2","n":"القسم الثاني: الرد الإسلامي","ic":"","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-2\" style=\"--c:#8B1A1A\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🛡️\u003c/div\u003e\n      \u003ch2\u003eالقسم الثاني: الرد الإسلامي\u003c/h2\u003e\n      \u003cp\u003eلم يأتِ الرد على الحملة الصليبية من بغداد ولا من القاهرة، بل من أطراف الشام: من الموصل وحلب ودمشق، على يد أسرةٍ تركية صاعدة هي الزنكية. هذا القسم يقرأ حال الشرق سنة ١٠٩٩، ثم يتبع عماد الدين زنكي وهو يفتح الرها سنة ١١٤٤، ثم نور الدين محمود وهو يُوحّد الشام ويمدّ يده إلى مصر، ثم البنية التي جعلت هذا الرد ممكناً: المدرسة والوقف والخطاب الجديد للجهاد.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#fragmentation\"\u003eالشرق الإسلامي سنة ١٠٩٩\u003c/a\u003e\u003ca href=\"#zangi\"\u003eعماد الدين زنكي والرها\u003c/a\u003e\u003ca href=\"#nur-al-din\"\u003eنور الدين محمود والوحدة\u003c/a\u003e\u003ca href=\"#state-building\"\u003eمؤسسات الرد: المدرسة والوقف والخطاب\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"fragmentation","n":"الشرق الإسلامي سنة ١٠٩٩","ic":"🧩","part":"القسم الثاني: الرد الإسلامي","h":"\u003carticle class=\"ch3\" id=\"fragmentation\" data-toc=\"الشرق الإسلامي سنة ١٠٩٩\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٢.١\u003c/span\u003e\n          \u003ch3\u003e🧩 الشرق الإسلامي سنة ١٠٩٩\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي السنة التي سقطت فيها القدس لم يكن هناك «عالم
