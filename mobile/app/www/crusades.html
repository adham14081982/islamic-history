\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eعلى يد من\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eقيسارية وأرسوف\u003c/td\u003e\u003ctd\u003e١٢٦٥\u003c/td\u003e\u003ctd\u003eالظاهر بيبرس\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eأنطاكية\u003c/td\u003e\u003ctd\u003e١٢٦٨\u003c/td\u003e\u003ctd\u003eالظاهر بيبرس\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمرقب واللاذقية\u003c/td\u003e\u003ctd\u003e١٢٨٥\u003c/td\u003e\u003ctd\u003eالمنصور قلاوون\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eطرابلس\u003c/td\u003e\u003ctd\u003e١٢٨٩\u003c/td\u003e\u003ctd\u003eالمنصور قلاوون\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eعكا\u003c/td\u003e\u003ctd\u003e١٢٩١\u003c/td\u003e\u003ctd\u003eالأشرف خليل\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eلم يبقَ للساحل من أهل الصليب حصنٌ يُؤوى إليه.\u003c/p\u003e\u003ccite\u003eمن معنى ما جرى بعد سقوط عكا سنة ١٢٩١ في المصادر\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eبعد عين جالوت بدأ المماليك يُنهون الوجود الصليبي بالتدريج: بيبرس فتح قيسارية وأرسوف وأنطاكية، وقلاوون فتح المرقب واللاذقية وطرابلس، ثم حاصر الأشرف خليل عكا فسقطت في مايو ١٢٩١ بعد أربعة وأربعين يوماً، فأُخليت بقية المدن. وبسقوط عكا انتهى الوجود الصليبي بعد ١٩٢ سنة، ولم تبقَ لهم قدمٌ في الأرض، وتحوّلت الحروب الصليبية بعد ذلك إلى شكلٍ آخر.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-5","n":"القسم الخامس: الآثار والتبادل","ic":"","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-5\" style=\"--c:#8B1A1A\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🔄\u003c/div\u003e\n      \u003ch2\u003eالقسم الخامس: الآثار والتبادل\u003c/h2\u003e\n      \u003cp\u003eالحروب الصليبية لم تنتهِ سنة ١٢٩١ في نفوس الناس، ولا في الاقتصاد، ولا في العلم، ولا في الصورة التي رسمها كل طرفٍ للآخر. هذا القسم يقرأ ما بقي بعد أن ذهبت الجيوش: مدناً ساحلية صارت مراكز تجارة، وعوائد نقلها الصليبيون إلى أوروبا، وصورةً للآخر لا تزال تُشكّل الوعي حتى اليوم، وذاكرةً تُستدعى في كل أزمة.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#trade\"\u003eالتجارة والمدن الساحلية\u003c/a\u003e\u003ca href=\"#knowledge\"\u003eانتقال العلم إلى أوروبا\u003c/a\u003e\u003ca href=\"#image-of-other\"\u003eصورة الآخر في الكتابتين\u003c/a\u003e\u003ca href=\"#legacy\"\u003eالإرث والذاكرة\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"trade","n":"التجارة والمدن الساحلية","ic":"⚖️","part":"القسم الخامس: الآثار والتبادل","h":"\u003carticle class=\"ch3\" id=\"trade\" data-toc=\"التجارة والمدن الساحلية\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٥.١\u003c/span\u003e\n          \u003ch3\u003e⚖️ التجارة والمدن الساحلية\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eل\u003c/span\u003eم تكن المدن الساحلية التي أقامها الصليبيون حصوناً فقط، بل كانت مراكز تجارةٍ ربطت أوروبا بالشرق: عكا وصور وطرابلس وبيروت صارت موانئ تُصدّر السكر والقطن والزيت والتوابل، ومدناً إيطالية كجنوة والبندقية وبيزا صارت شركاء في الربح. وكان في هذه التجارة ما جعل الحرب نفسها تجارةً.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكانت المدن الساحلية في الشام قبل الحملات الصليبية موانئ إسلامية تُصدّر إلى أوروبا، وكانت تجارتها قائمةً على السكر والزيت والقطن والصابون والتوابل، وكان في هذه التجارة ما جعل الشرق مصدراً لمواد لا تُنتج في أوروبا. وكان في هذا ما جعل أوروبا تعرف الشرق قبل أن تُقاتله، وأن تعرف ما فيه من ثروة قبل أن تعرف ما فيه من عقيدة. وكان في هذا ما جعل الشرق معروفاً في أوروبا بالثروة قبل أن يُعرف بالعقيدة، وأن من أراد أن يفهم الحملات فليبدأ بقراءة أسواقها لا خطبها فقط.\u003c/p\u003e\u003cp class=\"ap\"\u003eولمّا أُقيمت الإمارات الصليبية على الساحل، لم تُلغِ التجارة بل أعادت تنظيمها: فقد صارت عكا وصور وطرابلس وبيروت مراكز تجاريةً تحت حكم الصليبيين، ولكن التجار المسلمين واليهود والمسيحيين الشرقيين بقوا فيها يعملون. وكان في هذا ما يُبيّن أن الحرب لا تُوقف الاقتصاد، وأن من أراد أن يحكم مدينةً تجاريةً فليُبقِ تجارها لا أن يُطردهم. وكان في هذا البقاء ما جعل المدن الساحلية تحتفظ بطابعها التجاري رغم تغيّر الحاكم، وأن من أراد أن يحكم مدينةً تجاريةً فليُبقِ أسواقها عامرةً لا أن يُغلقها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت المدن الإيطالية هي الرابح الأكبر من هذه التجارة: فجنوة والبندقية وبيزا كانت تُموّل الحملات، وتنقل الجيوش، وتُسيطر على الموانئ، وكان في هذا التمويل ما جعل لها امتيازاتٌ تجارية في المدن الصليبية. وكان في هذا ما يُبيّن أن من يُموّل الحرب قد يربح منها أكثر من الذين يُقاتلون فيها، وأن السفن قد تكون أقوى من السيوف. وكان في هذه الامتيازات ما جعل بعض المدن الإيطالية تُصبح دولاً داخل دول، وكان في هذا ما يُبيّن أن المال قد يُشتري ما لا يُشتريه السيف، وأن من أراد أن يُسيطر على ميناءٍ فليُقرض من يُحكمه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذه التجارة ما جعل المدن الساحلية تُصبح مراكز تبادلٍ ثقافي أيضاً: فقد كان التجار يتعلّمون اللغات، ويعرفون العادات، ويتزوّجون من أهل البلد، وكان في هذا ما جعل الحدود الثقافية أقلّ حِدّةً مما تُصوّره الحروب. وكان في هذا ما يُبيّن أن التجارة تُقرّب بين الناس أكثر مما تُقرّبهم العقائد، وأن من أراد أن يعرف الآخر فليُتاجر معه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذه التجارة ما جعل الشرق يُصدّر إلى أوروبا منتجاتٍ صارت جزءاً من الحياة اليومية: السكر الذي كان دواءً صار طعاماً، والقطن الذي كان نادراً صار ثياباً، والتوابل التي كانت تُحفظ بها اللحوم صارت ضرورة. وكان في هذا ما جعل أوروبا تعتمد على الشرق في أشياء لا تستطيع أن تُنتجها، وأن من يملك ما يحتاجه غيره يملك سلطةً عليه. وكان في هذا الاعتماد ما جعل أوروبا تُصبح سوقاً لا تُنتج ما تستهلكه، وكان في هذا ما جعل الشرق يملك سلاحاً اقتصادياً لا يحتاج إلى جيش.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذه التجارة أيضاً ما جعل أوروبا تُصدّر إلى الشرق منتجاتٍ أقلّ قيمة: الصوف والخشب والحديد والعبيد، وكان في هذا التبادل غير المتكافئ ما جعل الشرق يخسر أكثر مما يكسب. وكان في هذا ما يُبيّن أن التبادل التجاري قد يكون استنزافاً إذا كان أحد الطرفين يُصدّر المواد الخام ويستورد المصنّعة، وأن من أراد أن يستفيد من التجارة فليُصنّع لا يستورد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذه التجارة ما جعل بعض المدن الساحلية تنمو نمواً سريعاً، فقد صارت عكا مدينةً كبيرةً في القرن الثالث عشر، وكان فيها أسواقٌ ومستودعاتٌ وقنصليات، وكان في هذا النمو ما جعلها هدفاً عسكرياً مهماً. وكان في هذا ما يُبيّن أن الثروة تجذب الطامعين، وأن من أراد أن يحفظ مدينته الغنية فليكن قادراً على حمايتها. وكان في هذا النمو ما جعل عكا تُصبح مدينةً عالميةً فيها لغاتٌ وأديانٌ وقنصليات، وكان في هذا ما يُبيّن أن التجارة تُنشئ مدناً منوّعةً أكثر من أي مشروعٍ سياسي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذه التجارة ما جعل المماليك بعد فتح الساحل يُعيدون تنظيم التجارة لصالحهم: فقد أُغلقت الموانئ الصليبية، وتوجّهت التجارة إلى الإسكندرية ودمياط، وكان في هذا التحوّل ما جعل مصر تُصبح مركز التجارة الشرقية. وكان في هذا ما يُبيّن أن من يفتح أرضاً لا يفتح حجراً فقط بل يفتح اقتصاداً، وأن الحرب الاقتصادية قد تكون أهم من الحرب العسكرية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذه التجارة ما جعل أوروبا تكتشف أن الشرق ليس كما تُصوّره الحكايات، فقد كان فيه مدنٌ منظّمة وأسواقٌ كبيرة ومستشفياتٌ ومدارس، وكان في هذا الاكتشاف ما جعل بعض الأوروبيين يُعيدون النظر في فكرة التفوّق. وكان في هذا ما يُبيّن أن السفر يُغيّر الرأي أكثر من القراءة، وأن من أراد أن يعرف شعباً فليُسافر إليه لا أن يقرأ عنه. وكان في هذا الاكتشاف ما جعل بعض الأوروبيين يُعيدون النظر في فكرة التفوّق، وكان في هذا ما يُبيّن أن السفر يُغيّر الرأي أكثر من القراءة، وأن من أراد أن يعرف شعباً فليُسافر إليه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذه التجارة ما جعل بعض المؤرّخين يقولون إن الحملات الصليبية كانت في جوهرها مشروعاً تجارياً، وإن الدين كان غلافاً لمصالح جنوة والبندقية، وكان في هذا القول ما جعل تفسير الحملات يتغيّر. وكان في هذا ما يُبيّن أن التفسير الاقتصادي قد يكون صحيحاً في بعضه، ولكنّه لا يُفسّر كل شيء، لأن الناس قد يُقاتلون من أجل ما يُصدّقونه لا من أجل ما يربحونه فقط.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذه التجارة ما جعل الشرق يتأثّر بأوروبا في بعض المظاهر: فقد دخلت بعض الأقمشة والعادات الأوروبية إلى مدن الساحل، وكان في هذا التأثير ما جعل الثقافة المحلية تتغيّر قليلاً. وكان في هذا ما يُبيّن أن التأثير لا يكون في اتجاهٍ واحد، وأن الحرب قد تنقل الثقافة في الاتجاهين معاً. وكان في هذا التأثير المتبادل ما جعل الثقافة المحلية تتغيّر قليلاً في المظاهر لا في الجوهر، وكان في هذا ما يُبيّن أن التأثير لا يكون في اتجاهٍ واحد، وأن الحرب قد تنقل الثقافة في الاتجاهين معاً، وأن الغالب لا يبقى غالباً في كل شيء.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذه التجارة ما جعل المدن الساحلية تفقد أهميتها بعد سقوط عكا، فقد تحوّلت التجارة إلى مصر، وصارت مدن الساحل قرى صغيرة بعد أن كانت مدناً عامرة. وكان في هذا ما يُبيّن أن المدن تعيش على ما حولها، وأن من دُمّر محيطها دُمّرت هي، وأن الاقتصاد لا يُبنى في مكانٍ إذا لم يكن له طريق. وكان في هذا ما يُبيّن أن المدن تعيش على ما حولها، وأن من دُمّر محيطها دُمّرت هي، وأن الاقتصاد لا يُبنى في مكانٍ إذا لم يكن له طريق، وأن من أراد أن يُعمّر مدينةً فليبْنِ طرقها لا أسوارها فقط.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالمدن الإيطالية والربح\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت جنوة والبندقية وبيزا هي القوى البحرية التي نقلت الجيوش وأمدّت المدن الصليبية، وكان في هذه الخدمة ما جعل لها امتيازاتٌ تجاريةً كبيرة في الشرق. وكان في هذا ما يُبيّن أن من يُموّل الحرب قد يربح منها أكثر من الذين يُقاتلون فيها، وأن السفن قد تكون أقوى من السيوف.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت هذه المدن تتنازع على الامتيازات، وكان في هذا التنازع ما جعل بعضها يُحالف المسلمين ضد بعض، وكان في هذا ما يُبيّن أن المصالح التجارية قد تتجاوز الانتماء الديني، وأن التاجر قد يُفضّل الربح على العقيدة إذا وجد أن الربح أعلى. وكان في هذا التنازع ما يُبيّن أن المصالح التجارية قد تتجاوز الانتماء الديني، وأن التاجر قد يُفضّل الربح على العقيدة إذا وجد أن الربح أعلى.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذه الامتيازات ما جعل بعض المدن الإيطالية تُسيطر على أحياء كاملة في عكا وصور، وكان فيها قنصليات ومحاكم خاصة، وكان في هذا ما جعل السيادة على المدينة مُقسّمةً بين أمراء ومستثمرين. وكان في هذا ما يُبيّن أن السيادة قد تُشترى بالمال لا بالسيف فقط.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالسكر والقطن والتوابل\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان السكر أهمّ سلعةٍ نقلها الصليبيون من الشرق إلى أوروبا، فقد كان يُستخدم في الشرق منذ قرون، وكان في أوروبا دواءً نادراً، ثم صار طعاماً بعد أن عرفته الأسر الغنية. وكان في هذا التحوّل ما جعل السكر يُصبح صناعةً كبيرة في أوروبا بعد ذلك، وأن من نقل تقنيةً نقل ثروة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان القطن أيضاً من السلع المهمة، فقد كان يُزرع في الشام ويُصنع في مدنها، وكان في أوروبا نادراً، وكان في نقل القطن ما جعل صناعة النسيج تتطوّر في أوروبا بعد ذلك. وكان في هذا ما يُبيّن أن التقنية إذا انتقلت من مكانٍ إلى مكانٍ تُنتج ثروةً في المكانين، وأن من أغلق باب التقنية على نفسه أغلق باب ثروته.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت التوابل من أهم السلع لأنها كانت تُستخدم في حفظ اللحوم وفي الطب، وكانت تأتي من الهند واليمن عبر الشام ومصر، وكان في هذه التجارة ما جعل الشرق يُسيطر على سوقٍ لا بديل له. وكان في هذا ما يُبيّن أن من يملك ما لا بديل له يملك قوةً اقتصاديةً لا تُقاوَم بالسيف.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eنهاية المدن الساحلية\u003c/h4\u003e\u003cp class=\"ap\"\u003eبعد سقوط عكا سنة ١٢٩١ أُخليت المدن الساحلية ودُمّرت، وكان في هذا التدمير ما جعل الساحل خالياً من العمران لسنوات، وكان في هذا ما جعل التجارة تتحوّل إلى مصر. وكان في هذا ما يُبيّن أن الحرب إذا انتهت بالتدمير لا تُنتج سلاماً بل تُنتج فراغاً، وأن من أراد أن يحكم أرضاً فليبْنِها لا يُخرّبها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا التدمير ما جعل بعض المؤرّخين يقولون إن المماليك دمّروا الساحل خوفاً من عودة الصليبيين، وكان في هذا التفسير ما يُبيّن أن الأمن قد يُقدّم على الاقتصاد في بعض الأحيان. وكان في هذا ما يُبيّن أن القرار الأمني قد يكون مُكلّفاً اقتصادياً، وأن من أراد أن يحفظ أرضه قد يُخسر ثروتها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا ما جعل مصر تُصبح المركز التجاري الوحيد في شرق المتوسط، وكان في هذا ما جعل القاهرة والإسكندرية تنمو نمواً كبيراً في القرن الرابع عشر. وكان في هذا ما يُبيّن أن المدن لا تموت بل تنتقل، وأن من أغلق ميناءً فتح آخر، وأن الاقتصاد يبحث عن طريقه إذا أُغلق عليه.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمدن الإيطالية\u003c/b\u003e\u003cspan\u003eجنوة والبندقية وبيزا: تمويلٌ ونقلٌ وامتيازاتٌ تجارية\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eعكا\u003c/b\u003e\u003cspan\u003eأكبر ميناء صليبي، ومركز تجارة الشرق في القرن الثالث عشر\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالسلع\u003c/b\u003e\u003cspan\u003eالسكر والقطن والتوابل والصابون والزيت\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالتحوّل\u003c/b\u003e\u003cspan\u003eبعد ١٢٩١ انتقلت التجارة إلى الإسكندرية ودمياط\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالتأثير\u003c/b\u003e\u003cspan\u003eالسكر والقطن نقلا صناعتين إلى أوروبا بعد قرون\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمدينة\u003c/th\u003e\u003cth\u003eالدور التجاري\u003c/th\u003e\u003cth\u003eالمصير\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eعكا\u003c/td\u003e\u003ctd\u003eأكبر ميناء صليبي وأسواقٌ وقنصليات\u003c/td\u003e\u003ctd\u003eسقطت ١٢٩١ ودُمّرت\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eصور\u003c/td\u003e\u003ctd\u003eميناءٌ ومركز صناعة زجاج\u003c/td\u003e\u003ctd\u003eأُخليت بعد عكا\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eطرابلس\u003c/td\u003e\u003ctd\u003eمركز تجارةٍ في الشمال\u003c/td\u003e\u003ctd\u003eسقطت ١٢٨٩\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالإسكندرية\u003c/td\u003e\u003ctd\u003eالبديل بعد سقوط الساحل\u003c/td\u003e\u003ctd\u003eصارت مركز التجارة الشرقية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالبندقية وجنوة\u003c/td\u003e\u003ctd\u003eنقلٌ وتمويلٌ وامتيازات\u003c/td\u003e\u003ctd\u003eبقيت قواها البحرية قروناً\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eكان السكر في الشرق دواءً، فصار في أوروبا طعاماً.\u003c/p\u003e\u003ccite\u003eمن أثر نقل السلع والتقنيات من الشرق إلى أوروبا بعد الحملات\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eالمدن الساحلية لم تكن حصوناً فقط بل مراكز تجارةٍ ربطت أوروبا بالشرق، وكانت جنوة والبندقية وبيزا الرابح الأكبر لأنها موّلت ونقلت وأخذت الامتيازات. ونقلت أوروبا من الشرق السكر والقطن والتوابل، فنقلت معها تقنياتٍ وثروات. وبعد سقوط عكا ١٢٩١ دُمّر الساحل وانتقلت التجارة إلى مصر، فصار للاقتصاد طريقٌ آخر.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"knowledge","n":"انتقال العلم إلى أوروبا","ic":"🔬","part":"القسم الخامس: الآثار والتبادل","h":"\u003carticle class=\"ch3\" id=\"knowledge\" data-toc=\"انتقال العلم إلى أوروبا\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٥.٢\u003c/span\u003e\n          \u003ch3\u003e🔬 انتقال العلم إلى أوروبا\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eل\u003c/span\u003eم تكن الحملات الصليبية هي الطريق الأول لانتقال العلم، فالأندلس وصقلية كانتا أسبق، لكن مدن الساحل وطرق التجارة فتحت قناةً أخرى: نصوصٌ وأدواتٌ وأطباء ومهندسون انتقلوا إلى أوروبا، فدخلت الفلسفة والطبّ والرياضيات إلى جامعاتها الأولى، وكان في هذا الانتقال ما غيّر مسار الفكر الأوروبي.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان انتقال العلم من العالم الإسلامي إلى أوروبا قد بدأ قبل الحملات الصليبية بقرنين: فقد كانت طليطلة في الأندلس مركزاً للترجمة منذ القرن الحادي عشر، وكانت صقلية في الجنوب الإيطالي مركزاً للتبادل الثقافي، وكان في هذين المركزين ما جعل النصوص العربية تُترجم إلى اللاتينية. وكان في هذا ما يُبيّن أن الحملات لم تكن الطريق الأول، وأن ما يُنسب إلى الحرب قد يكون ثمرة سلامٍ سابق.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت مدن الساحل الصليبية قناةً أخرى: فقد كان فيها أطباء ومهندسون وصيادلة من المسلمين والمسيحيين الشرقيين، وكان في هذا الوجود ما جعل الأوروبيين يرون ممارساتٍ طبيةً لم يعرفوها. وكان في هذا ما جعل بعض الأوروبيين يتعلّمون العربية ليقرأوا النصوص الأصلية، وأن من أراد أن يتعلّم من قومٍ فليتعلّم لغتهم أولاً. وكان في هذا الوجود ما جعل بعض الأوروبيين يتعلّمون العربية ليقرأوا النصوص الأصلية، وأن من أراد أن يتعلّم من قومٍ فليتعلّم لغتهم أولاً، وأن الترجمة لا تُغني عن الأصل في كل شيء.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان الطبّ أهمّ ما انتقل: فقد كان في العالم الإسلامي مستشفياتٌ منظّمة، وكتبٌ في التشريح والأدوية والجراحة، وكان في هذه الكتب ما جعل الطبّ الأوروبي يتغيّر. وكان في هذا ما يُبيّن أن العلم لا يُنقل بالكلام بل بالنصوص والمناهج، وأن من أراد أن يتقدّم في علمٍ فليبنِ له مدارس ومستشفيات لا أن ينتظر عبقرياً. وكان في هذه الكتب ما جعل الطبّ الأوروبي يتغيّر من ممارسةٍ قائمة على التجربة إلى علمٍ له مناهج، وكان في هذا ما يُبيّن أن العلم لا يُنقل بالكلام بل بالنصوص والمناهج والمؤسسات.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان ابن سينا أهمّ من انتقلت كتبه، فقد تُرجم «القانون في الطب» إلى اللاتينية وصار مرجعاً في جامعات أوروبا قروناً، وكان في هذا الكتاب ما جعل الطبّ يُدرّس تنظيماً لا تجربةً فقط. وكان في هذا ما يُبيّن أن التأليف المنظّم قد يكون أعظم من الاكتشاف الفردي، وأن من جمع العلم في كتابٍ نشره في الأمم. وكان في هذا الكتاب ما جعل الطبّ يُدرّس تنظيماً لا تجربةً فقط، وكان في هذا ما يُبيّن أن التأليف المنظّم قد يكون أعظم من الاكتشاف الفردي، وأن من جمع العلم في كتابٍ نشره في الأمم، وأن الكتاب قد يُعمّر أكثر من صاحبه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان الرازي وابن النفيس والزهراوي من الأسماء التي انتقلت أيضاً، وكان في كتبهم ما جعل الجراحة والصيدلة تتطوّر، وكان في هذا ما يُبيّن أن العلم تراكميّ، وأن كل عالمٍ يبني على من قبله. وكان في هذا ما جعل أوروبا تقف على أكتاف من سبقها، وأن من أراد أن يبني فليبْنِ على ما بُني لا من الصفر. وكان في هذه الكتب ما جعل الجراحة والصيدلة تتطوّر، وكان في هذا ما يُبيّن أن العلم تراكميّ، وأن كل عالمٍ يبني على من قبله، وأن من أراد أن يبني فليبْنِ على ما بُني لا من الصفر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت الرياضيات والفلك تنتقلان أيضاً: فقد دخلت الأرقام العربية إلى أوروبا، ودخل علم الجبر، ودخلت الجداول الفلكية، وكان في هذه العلوم ما جعل الملاحة والتجارة والحساب تتغيّر. وكان في هذا ما يُبيّن أن العلم قد يكون أنفع في التطبيق من النظرية، وأن من أراد أن يقيس ثمرة العلم فلينظر إلى ما يُغيّره في الحياة اليومية. وكان في هذه العلوم ما جعل الحساب والملاحة يتغيّران، وكان في هذا ما يُبيّن أن العلم قد يكون أنفع في التطبيق من النظرية، وأن من أراد أن يقيس ثمرة العلم فلينظر إلى ما يُغيّره في الحياة اليومية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت الفلسفة من أهمّ ما انتقل: فقد تُرجمت كتب أرسطو من العربية إلى اللاتينية، ومعها شروح الفارابي وابن رشد، وكان في هذه الشروح ما جعل أوروبا تكتشف أرسطو من جديد. وكان في هذا ما يُبيّن أن الحضارات لا تنتقل النصوص فقط بل تنتقل قراءتها، وأن من يُفسّر نصاً قد يكون أهمّ من صاحب النص. وكان في هذه الشروح ما جعل أوروبا تكتشف أرسطو من جديد، وكان في هذا ما يُبيّن أن الحضارات لا تنتقل النصوص فقط بل تنتقل قراءتها، وأن من يُفسّر نصاً قد يكون أهمّ من صاحب النص في التأثير.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان ابن رشد أهمّ من أثّر في الفكر الأوروبي، فقد صار شروحه على أرسطو مرجعاً في جامعات باريس وأكسفورد، وكان في هذا التأثير ما جعل الفلسفة الأوروبية تتغيّر، وكان في هذا ما يُبيّن أن العالِم قد يُؤثّر في أمةٍ لم يزُرها، وأن الفكر لا يحتاج إلى جواز سفر. وكان في هذا التأثير ما جعل الفلسفة الأوروبية تتغيّر في مسائلها ومصطلحاتها، وكان في هذا ما يُبيّن أن العالِم قد يُؤثّر في أمةٍ لم يزُرها، وأن الفكر لا يحتاج إلى جواز سفر، وأن الحدود السياسية لا تحجب الأفكار.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في انتقال العلم ما جعل جامعات أوروبا تُنشأ في القرن الثاني عشر والثالث عشر: بولونيا وباريس وأكسفورد، وكان في هذه الجامعات ما جعل العلم يُنظّم في مؤسسات، وكان في هذا ما يُبيّن أن العلم لا يبقى إذا لم يكن له مؤسسة، وأن من أراد أن يحفظ علماً فليبْنِ له جامعةً لا مكتبةً فقط. وكان في هذه الجامعات ما جعل العلم يُنظّم في مؤسسات، وكان في هذا ما يُبيّن أن العلم لا يبقى إذا لم يكن له مؤسسة، وأن من أراد أن يحفظ علماً فليبْنِ له جامعةً لا مكتبةً فقط، وأن المؤسسة تُعمّر أكثر من العالم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا الانتقال ما جعل أوروبا تتقدّم في القرون التالية تقدّماً لم يكن ممكناً بلا هذا الأساس، وكان في هذا ما يُبيّن أن النهضة الأوروبية لم تبدأ من الصفر بل من تراكمٍ سبقها. وكان في هذا ما جعل بعض المؤرّخين يقولون إن أوروبا ورثت العلم الإسلامي كما ورثت من قبلها علوم اليونان، وأن الحضارات تُتوارث لا تُبتدع. وكان في هذا الأساس ما جعل النهضة الأوروبية ممكنةً بعد ذلك، وكان في هذا ما يُبيّن أن النهضة لم تبدأ من الصفر بل من تراكمٍ سبقها، وأن من أراد أن ينهض فليقرأ ما بناه غيره قبل أن يبدأ.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا الانتقال ما جعل بعض العلماء المسلمين يُنبّهون إلى أن العلم لا يُملَك بل يُشارك، وكان في هذا ما يُبيّن أن من كتم علماً فقد خسر أكثر مما كسب، وأن من نشر علماً صار له أثرٌ في أمةٍ لم يعرفها. وكان في هذا ما جعل العلم أعظم من الحرب في تأثيره، لأن الحرب تُغيّر الخريطة والعلم يُغيّر العقل. وكان في هذا التنبيه ما جعل بعض العلماء يُنبّهون إلى أن العلم لا يُملَك بل يُشارك، وكان في هذا ما يُبيّن أن من كتم علماً فقد خسر أكثر مما كسب، وأن من نشر علماً صار له أثرٌ في أمةٍ لم يعرفها، وأن العلم أعظم من الحرب في تأثيره.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا الانتقال أيضاً ما جعل أوروبا تُعيد قراءة تراثها اليوناني من خلال العرب، وكان في هذا ما يُبيّن أن الوسيط قد يُغيّر المعنى، وأن ما يقرأه إنسانٌ في نصٍّ مترجم قد يختلف عمّا قرأه صاحبه. وكان في هذا ما جعل الفلسفة الأوروبية تحمل أثراً إسلامياً في مصطلحاتها ومسائلها قروناً. وكان في هذا الوسيط ما جعل الفلسفة الأوروبية تحمل أثراً إسلامياً في مصطلحاتها ومسائلها قروناً، وكان في هذا ما يُبيّن أن الوسيط قد يُغيّر المعنى، وأن ما يقرأه إنسانٌ في نصٍّ مترجم قد يختلف عمّا قرأه صاحبه.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eطليطلة وصقلية قبل الحملات\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت طليطلة في الأندلس مركزاً للترجمة منذ فتحها المسيحيون سنة ١٠٨٥، وكان فيها علماء مسلمون ويهود ومسيحيون يعملون معاً، وكان في هذا العمل ما جعل النصوص العربية تُترجم إلى اللاتينية. وكان في هذا ما يُبيّن أن الترجمة تحتاج إلى تعاونٍ لا إلى صراع، وأن من أراد أن ينقل علماً فليجمع أهله لا أن يُفرّقهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت صقلية في الجنوب الإيطالي مركزاً آخر، فقد كانت تحت حكم النورمان وكان فيها بلاطٌ يجمع علماء من كل الأديان، وكان في هذا البلاط ما جعل الترجمة من العربية إلى اللاتينية تتوسّع. وكان في هذا ما يُبيّن أن التسامح قد يكون شرطاً للعلم، وأن من أغلق بابه على المخالف أغلق باب علمه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذين المركزين ما جعل الحملات الصليبية أقلّ أهميةً في نقل العلم مما يُتصوّر، وكان في هذا ما يُبيّن أن الحرب ليست الطريق الوحيد للتبادل، وأن السلام قد ينقل أكثر مما تنقل المعركة. وكان في هذا ما جعل المؤرّخين يقولون إن أوروبا تعلّمت من المسلمين في الأندلس وصقلية أكثر مما تعلّمت في الشام.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eابن سينا وابن رشد\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان ابن سينا أعظم من انتقلت كتبه إلى أوروبا، فقد صار «القانون في الطب» مرجعاً في جامعاتها قروناً، وكان في هذا الكتاب ما جعل الطبّ يُدرّس تنظيماً لا تجربةً فقط. وكان في هذا ما يُبيّن أن التأليف المنظّم قد يكون أعظم من الاكتشاف الفردي. وكان في هذا الكتاب ما جعل الطبّ يُدرّس في جامعات أوروبا قروناً، وكان في هذا ما يُبيّن أن التأليف المنظّم قد يكون أعظم من الاكتشاف الفردي في التأثير.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان ابن رشد أعظم من أثّر في الفلسفة، فقد صار شروحه على أرسطو مرجعاً في باريس وأكسفورد، وكان في هذا التأثير ما جعل الفلسفة الأوروبية تتغيّر. وكان في هذا ما يُبيّن أن العالِم قد يُؤثّر في أمةٍ لم يزُرها، وأن الفكر لا يحتاج إلى جواز سفر. وكان في هذا التأثير ما جعل الفلسفة الأوروبية تتغيّر، وكان في هذا ما يُبيّن أن العالِم قد يُؤثّر في أمةٍ لم يزُرها، وأن الفكر لا يحتاج إلى جواز سفر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذين الاسمين ما جعل أوروبا تكتشف أن العلم ليس حكراً على أحد، وكان في هذا ما جعل بعض الأوروبيين يُعيدون النظر في فكرة التفوّق. وكان في هذا ما يُبيّن أن العلم يُقنع أكثر مما تُقنع الحرب، وأن من أراد أن يُغيّر رأي أمةٍ فيه فليُعطها علماً لا خطبة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالجامعات الأوروبية\u003c/h4\u003e\u003cp class=\"ap\"\u003eأُنشئت جامعات أوروبا في القرن الثاني عشر والثالث عشر، وكانت بولونيا وباريس وأكسفورد أولها، وكان في هذه الجامعات ما جعل العلم يُنظّم في مؤسسات. وكان في هذا ما يُبيّن أن العلم لا يبقى إذا لم يكن له مؤسسة، وأن من أراد أن يحفظ علماً فليبْنِ له جامعةً لا مكتبةً فقط.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت مناهج هذه الجامعات تقوم على نصوصٍ مترجمةٍ من العربية، وكان في هذا ما جعل الطلاب الأوروبيين يقرأون ابن سينا وابن رشد وهم لا يعرفون العربية. وكان في هذا ما يُبيّن أن الترجمة قد تكون جسراً لا يُرى، وأن من نقل نصاً نقل حضارةً كاملة معه. وكان في هذا ما جعل الطلاب الأوروبيين يقرأون ابن سينا وابن رشد وهم لا يعرفون العربية، وكان في هذا ما يُبيّن أن الترجمة قد تكون جسراً لا يُرى، وأن من نقل نصاً نقل حضارةً كاملة معه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذه الجامعات ما جعل أوروبا تتقدّم في القرون التالية، وكان في هذا ما يُبيّن أن النهضة الأوروبية لم تبدأ من الصفر بل من تراكمٍ سبقها. وكان في هذا ما جعل بعض المؤرّخين يقولون إن أوروبا ورثت العلم الإسلامي كما ورثت من قبلها علوم اليونان، وأن الحضارات تُتوارث لا تُبتدع.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eطليطلة\u003c/b\u003e\u003cspan\u003eمركز ترجمةٍ منذ ١٠٨٥، أسبق من الحملات\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eصقلية\u003c/b\u003e\u003cspan\u003eبلاطٌ نورماني يجمع علماء من كل الأديان\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eابن سينا\u003c/b\u003e\u003cspan\u003e«القانون في الطب» مرجعٌ في جامعات أوروبا قروناً\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eابن رشد\u003c/b\u003e\u003cspan\u003eشروح أرسطو مرجعٌ في باريس وأكسفورد\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالجامعات\u003c/b\u003e\u003cspan\u003eبولونيا وباريس وأكسفورد في القرنين ١٢ و١٣\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمجال\u003c/th\u003e\u003cth\u003eما انتقل\u003c/th\u003e\u003cth\u003eالأثر في أوروبا\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالطب\u003c/td\u003e\u003ctd\u003eالقانون لابن سينا، وكتب الرازي والزهراوي\u003c/td\u003e\u003ctd\u003eمناهج جامعية ومنظومة مستشفيات\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالفلسفة\u003c/td\u003e\u003ctd\u003eأرسطو بشروح الفارابي وابن رشد\u003c/td\u003e\u003ctd\u003eتأسيس الفلسفة المدرسية — الفلسفة المدرسية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالرياضيات\u003c/td\u003e\u003ctd\u003eالأرقام والجبر والخوارزميات\u003c/td\u003e\u003ctd\u003eتطوّر الحساب والملاحة والتجارة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالفلك\u003c/td\u003e\u003ctd\u003eالجداول والأسطرلاب\u003c/td\u003e\u003ctd\u003eتطوّر الملاحة البحرية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالكيمياء\u003c/td\u003e\u003ctd\u003eالتقطير والعقاقير\u003c/td\u003e\u003ctd\u003eأساس الصيدلة الأوروبية\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eإن الحكمة ضالّة المؤمن، فحيث وجدها فهو أحقّ بها.\u003c/p\u003e\u003ccite\u003eمن أثر الحديث في نقل العلم، وقد صار شعاراً لحركة الترجمة\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eانتقال العلم إلى أوروبا بدأ قبل الحملات بطليطلة وصقلية، ثم صارت مدن الساحل قناةً أخرى. وانتقل الطبّ بابن سينا، والفلسفة بابن رشد، والرياضيات والفلك بالأرقام والجداول، وكان في هذا الانتقال ما جعل جامعات أوروبا تُنشأ على نصوصٍ مترجمةٍ من العربية. وكان في هذا ما يُبيّن أن النهضة الأوروبية لم تبدأ من الصفر بل من تراكمٍ سبقها.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"image-of-other","n":"صورة الآخر في الكتابتين","ic":"🪞","part":"القسم الخامس: الآثار والتبادل","h":"\u003carticle class=\"ch3\" id=\"image-of-other\" data-toc=\"صورة الآخر في الكتابتين\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٥.٣\u003c/span\u003e\n          \u003ch3\u003e🪞 صورة الآخر في الكتابتين\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eل\u003c/span\u003eم تُنتج الحروب الصليبية أرضاً ولا مالاً فقط، بل أنتجت صوراً: صورة المسلم في الكتابة الأوروبية، وصورة الصليبي في الكتابة العربية. وكانت كل صورة تُبنى على ما رآه الكاتب لا على ما هو موجود، وكان في هذه الصور ما جعل العلاقة بين الشرق والغرب تُورّث العداء قروناً.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان الأوروبيون قبل الحملات يعرفون الشرق معرفةً قليلة، وكانت معرفتهم مبنيةً على حكايات الحجّاج وعلى ما يسمعونه من قصص، وكان في هذه المعرفة القليلة ما جعل الصورة تتكوّن من الخيال أكثر مما تتكوّن من الواقع. وكان في هذا ما يُبيّن أن من لا يعرف شعباً يُسهل عليه أن يخاف منه، وأن الخوف يُولّد العداء قبل أن يُولّده الفعل. وكان في هذا الخوف ما جعل الصورة تتكوّن قبل اللقاء، وكان في هذا ما يُبيّن أن من بنى رأيه على السماع بنى على أساسٍ رخو، وأن اللقاء المباشر قد يُغيّر ما لم تُغيّره الحجج.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت الكتابة الأوروبية عن المسلمين في القرن الثاني عشر مليئةً بالوصف السلبي: فكان المسلم يُصوّر وثنياً أو مُنحرفاً أو وحشاً، وكان في هذا التصوير ما جعل قتله أسهل في الضمير الأوروبي. وكان في هذا ما يُبيّن أن الكلمة قد تُهيّئ للسيف، وأن من أراد أن يُبرّر حرباً فليبدأ بتشويه من يُقاتله. وكان في هذا التصوير ما جعل قتله أسهل في الضمير الأوروبي، لأن من يُصوّر وحشاً لا يُقتل كإنسان، وكان في هذا ما يُبيّن أن الكلمة قد تُهيّئ للسيف، وأن من أراد أن يُبرّر حرباً فليبدأ بتشويه من يُقاتله.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت «أغنية رولان» من أشهر النصوص التي صوّرت المسلمين تصويراً مشوّهاً، وكان فيها أن المسلمين يعبدون أصناماً وأنهم خونة، وكان في هذا النص ما جعل الصورة تنتقل إلى العامة لا إلى النخبة فقط. وكان في هذا ما يُبيّن أن الأدب قد يكون أقوى من التاريخ في تكوين الصور، لأن الناس يقرأون الحكايات أكثر مما يقرأون الوقائع. وكان في هذا النص ما جعل الصورة تنتقل إلى العامة لا إلى النخبة فقط، وكان في هذا ما يُبيّن أن الأدب قد يكون أقوى من التاريخ في تكوين الصور، لأن الناس يقرأون الحكايات أكثر مما يقرأون الوقائع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في الكتابة الأوروبية أيضاً نصوصٌ أخرى أكثر إنصافاً: فقد كتب بعض من زار الشرق أو عاش فيه وصفاً أكثر دقّة، وكان في هذه النصوص ما جعل الصورة ليست واحدة. وكان في هذا ما يُبيّن أن الصورة الجماعية تخفي صوراً فرديةً كثيرة، وأن من أراد أن يعرف الحقيقة فليقرأ أكثر من صوت. وكان في هذه النصوص ما جعل الصورة ليست واحدة، وكان في هذا ما يُبيّن أن الصورة الجماعية تخفي صوراً فرديةً كثيرة، وأن من أراد أن يعرف الحقيقة فليقرأ أكثر من صوت، وأن الشهادة المباشرة قد تختلف عن الرواية الشائعة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت الكتابة العربية عن الصليبيين في البداية أقلّ اهتماماً: فقد كان المؤرّخون المسلمون يرون الحملات حدثاً في الشام لا خطراً على الأمة كلها، وكان في هذا ما جعل الوصف قليلاً في القرن الأول. وكان في هذا ما يُبيّن أن الأمة قد لا تُدرك حجم الخطر إلا بعد أن يتمكّن، وأن من أراد أن يُنبّه الناس فليبدأ مبكراً. وكان في هذا الوصف القليل ما جعل الصورة العربية عن الصليبيين أقلّ تفصيلاً في البداية، وكان في هذا ما يُبيّن أن الأمة قد لا تُدرك حجم الخطر إلا بعد أن يتمكّن، وأن من أراد أن يُنبّه الناس فليبدأ مبكراً.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في الكتابة العربية بعد ذلك وصفٌ للصليبيين بأنهم «الإفرنج»، وكانت الكلمة تُشير إلى القوم لا إلى الدين، وكان في هذا الاستخدام ما جعل الوصف سياسياً لا دينياً. وكان في هذا ما يُبيّن أن تسمية العدوّ تُحدّد نوع الحرب: فمن يُسمّيه «إفرنجاً» يُقاتله على الأرض، ومن يُسمّيه «كفاراً» يُقاتله على العقيدة. وكان في هذا الاستخدام ما جعل الوصف سياسياً لا دينياً، وكان في هذا ما يُبيّن أن تسمية العدوّ تُحدّد نوع الحرب: فمن يُسمّيه «إفرنجاً» يُقاتله على الأرض، ومن يُسمّيه «كفاراً» يُقاتله على العقيدة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان ابن الأثير من أهمّ من كتب عن الحملات، وقد كتب في «الكامل في التاريخ» وصفاً للفظائع الصليبية في القدس، وكان في وصفه ما جعل الذاكرة تحفظ الحدث. وكان في هذا ما يُبيّن أن المؤرّخ لا ينقل الحدث فقط بل يُشكّل الذاكرة، وأن من كتب التاريخ كتب جزءاً من المستقبل. وكان في وصفه ما جعل الذاكرة تحفظ الحدث، وكان في هذا ما يُبيّن أن المؤرّخ لا ينقل الحدث فقط بل يُشكّل الذاكرة، وأن من كتب التاريخ كتب جزءاً من المستقبل، وأن الذاكرة تُبنى بالكلمات كما تُبنى بالوقائع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في الكتابة العربية أيضاً إعجابٌ ببعض صفات الصليبيين: فقد وصف بعض المؤرّخين شجاعتهم ونظامهم، وكان في هذا الإعجاب ما جعل الصورة ليست سلبيةً بالكامل. وكان في هذا ما يُبيّن أن العدوّ قد يُعجب به من يُقاتله، وأن الإنصاف في الحرب علامةٌ على قوّةٍ لا على ضعف. وكان في هذا الإعجاب ما جعل الصورة ليست سلبيةً بالكامل، وكان في هذا ما يُبيّن أن العدوّ قد يُعجب به من يُقاتله، وأن الإنصاف في الحرب علامةٌ على قوّةٍ لا على ضعف، وأن من أنصف خصمه لم يُضعف نفسه بل أظهر عدله.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في الكتابتين ما جعل كل طرفٍ يرى نفسه في مركز التاريخ ويرى الآخر على الهامش، وكان في هذا ما جعل الحوار مستحيلاً. وكان في هذا ما يُبيّن أن الصورة لا تتغيّر بالوقائع بل بالتعليم، وأن من أراد أن يُصحّح صورةً فليبدأ بالمناهج لا بالخطب. وكان في هذا ما جعل الحوار مستحيلاً، وكان في هذا ما يُبيّن أن الصورة لا تتغيّر بالوقائع بل بالتعليم، وأن من أراد أن يُصحّح صورةً فليبدأ بالمناهج لا بالخطب، وأن الجيل الجديد يُبنى بالكتب لا بالشعارات.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذه الصور ما جعل العلاقة بين الشرق والغرب تُورّث العداء قروناً: فقد بقي في الوجدان الأوروبي أن الشرق عدوّ، وبقي في الوجدان الشرقي أن الغرب مُعتدٍ، وكان في هذا التوريث ما جعل كل أزمةٍ تُستدعى فيها الحملات. وكان في هذا ما يُبيّن أن الحروب لا تنتهي بتوقيعٍ بل بتنقية الذاكرة، وأن من أراد سلاماً فليُصلح ما في الكتب المدرسية. وكان في هذا التوريث ما جعل كل أزمةٍ تُستدعى فيها الحملات، وكان في هذا ما يُبيّن أن الحروب لا تنتهي بتوقيعٍ بل بتنقية الذاكرة، وأن من أراد سلاماً فليُصلح ما في الكتب المدرسية، وأن العداء يُورَّث كما تُورَّث الأرض.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذه الصور أيضاً ما جعل بعض المستشرقين في القرون التالية يُعيدون إنتاج الصور القديمة، وكان في هذا ما جعل الاستشراق يحمل أثر الحملات في مناهجه. وكان في هذا ما يُبيّن أن العلم قد يحمل أيديولوجيا إذا لم يُراجع نفسه، وأن من أراد أن يعرف شعباً فليقرأ عنه بعينٍ ناقدةٍ لا بعينٍ وارثة. وكان في هذا ما جعل الاستشراق يحمل أثر الحملات في مناهجه، وكان في هذا ما يُبيّن أن العلم قد يحمل أيديولوجيا إذا لم يُراجع نفسه، وأن من أراد أن يعرف شعباً فليقرأ عنه بعينٍ ناقدةٍ لا بعينٍ وارثة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذه الصور ما جعل بعض المفكّرين المسلمين يُعيدون بناء صورةٍ للغرب على أساس الحملات فقط، وكان في هذا ما جعل الحكم على الغرب كله حكماً على حدثٍ واحد. وكان في هذا ما يُبيّن أن من حكم على أمةٍ بماضٍ واحدٍ فقد ظلمها، وأن من أراد أن يفهم حاضراً فليقرأه لا أن يقرأ ماضيه فقط. وكان في هذا ما جعل الحكم على الغرب كله حكماً على حدثٍ واحد، وكان في هذا ما يُبيّن أن من حكم على أمةٍ بماضٍ واحدٍ فقد ظلمها، وأن من أراد أن يفهم حاضراً فليقرأه لا أن يقرأ ماضيه فقط، وأن التعميم أسرع طريقٍ إلى الخطأ.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003e«أغنية رولان» والتصوير\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت «أغنية رولان» أشهر نصٍّ أوروبي صوّر المسلمين تصويراً مشوّهاً، وكان فيها أن المسلمين يعبدون أصناماً وأنهم خونة، وكان في هذا النص ما جعل الصورة تنتقل إلى العامة. وكان في هذا ما يُبيّن أن الأدب قد يكون أقوى من التاريخ في تكوين الصور، لأن الناس يقرأون الحكايات أكثر مما يقرأون الوقائع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا النص ما جعل قتل المسلم أسهل في الضمير الأوروبي، لأن من يُصوّر وحشاً لا يُقتل كإنسان، وكان في هذا ما يُبيّن أن الكلمة قد تُهيّئ للسيف. وكان في هذا ما جعل بعض المؤرّخين يقولون إن الأدب كان سلاحاً في الحملات كما كان السيف. وكان في هذا النص ما جعل قتل المسلم أسهل في الضمير الأوروبي، لأن من يُصوّر وحشاً لا يُقتل كإنسان، وأن الكلمة قد تُهيّئ للسيف.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا النص أيضاً ما جعل الصورة تبقى قروناً، فقد بقي في الوجدان الأوروبي أن الشرق أرضٌ غريبةٌ وخطرة، وكان في هذا البقاء ما جعل العلاقة بين الشرق والغرب تُورّث العداء. وكان في هذا ما يُبيّن أن الصور لا تُبنى في يومٍ ولا تُهدَم في يوم. وكان في هذا البقاء ما جعل العلاقة بين الشرق والغرب تُورّث العداء، وكان في هذا ما يُبيّن أن الصور لا تُبنى في يومٍ ولا تُهدَم في يوم.\u003c/p\u003e\u003ch4 class=\"sub\"\u003e«الإفرنج» في الكتابة العربية\u003c/h4\u003e\u003cp class=\"ap\"\u003eاستخدم المؤرّخون المسلمون كلمة «الإفرنج» للدلالة على الصليبيين، وكانت الكلمة تُشير إلى القوم لا إلى الدين، وكان في هذا الاستخدام ما جعل الوصف سياسياً لا دينياً. وكان في هذا ما يُبيّن أن تسمية العدوّ تُحدّد نوع الحرب: فمن يُسمّيه «إفرنجاً» يُقاتله على الأرض، ومن يُسمّيه «كفاراً» يُقاتله على العقيدة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في الكتابة العربية وصفٌ للفظائع الصليبية في القدس، وكان في هذا الوصف ما جعل الذاكرة تحفظ الحدث، وكان في هذا ما يُبيّن أن المؤرّخ لا ينقل الحدث فقط بل يُشكّل الذاكرة. وكان في هذا ما جعل القدس تبقى في الوجدان رمزاً لا مدينةً فقط. وكان في هذا الوصف ما جعل الذاكرة تحفظ الحدث، وكان في هذا ما جعل القدس تبقى في الوجدان رمزاً لا مدينةً فقط.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في الكتابة العربية أيضاً إعجابٌ ببعض صفات الصليبيين، فقد وصف بعض المؤرّخين شجاعتهم ونظامهم، وكان في هذا الإعجاب ما جعل الصورة ليست سلبيةً بالكامل. وكان في هذا ما يُبيّن أن العدوّ قد يُعجب به من يُقاتله، وأن الإنصاف في الحرب علامةٌ على قوّةٍ لا على ضعف.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eأثر الصور في الحاضر\u003c/h4\u003e\u003cp class=\"ap\"\u003eبقيت الصور التي بُنيت في القرون الوسطى حيّةً في الوجدان، فقد بقي في الوجدان الأوروبي أن الشرق عدوّ، وبقي في الوجدان الشرقي أن الغرب مُعتدٍ، وكان في هذا التوريث ما جعل كل أزمةٍ تُستدعى فيها الحملات. وكان في هذا ما يُبيّن أن الحروب لا تنتهي بتوقيعٍ بل بتنقية الذاكرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذه الصور ما جعل بعض المستشرقين في القرون التالية يُعيدون إنتاج الصور القديمة، وكان في هذا ما جعل الاستشراق يحمل أثر الحملات في مناهجه. وكان في هذا ما يُبيّن أن العلم قد يحمل أيديولوجيا إذا لم يُراجع نفسه، وأن من أراد أن يعرف شعباً فليقرأ عنه بعينٍ ناقدةٍ لا بعينٍ وارثة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذه الصور ما جعل بعض المفكّرين المسلمين يُعيدون بناء صورةٍ للغرب على أساس الحملات فقط، وكان في هذا ما جعل الحكم على الغرب كله حكماً على حدثٍ واحد. وكان في هذا ما يُبيّن أن من حكم على أمةٍ بماضٍ واحدٍ فقد ظلمها، وأن من أراد أن يفهم حاضراً فليقرأه لا أن يقرأ ماضيه فقط.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eقبل الحملات\u003c/b\u003e\u003cspan\u003eمعرفةٌ قليلة بالشرق، مبنيّة على الحكايات لا على المشاهدة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأغنية رولان\u003c/b\u003e\u003cspan\u003eأشهر نصٍّ صوّر المسلمين تصويراً مشوّهاً\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003e«الإفرنج»\u003c/b\u003e\u003cspan\u003eتسميةٌ سياسية لا دينية في الكتابة العربية\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eابن الأثير\u003c/b\u003e\u003cspan\u003eوصف الحملات في «الكامل في التاريخ» وشكّل الذاكرة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالإرث\u003c/b\u003e\u003cspan\u003eصورٌ تُستدعى في كل أزمة بين الشرق والغرب\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالطرف\u003c/th\u003e\u003cth\u003eكيف صوّر الآخر\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالكتابة الأوروبية\u003c/td\u003e\u003ctd\u003eمسلمٌ وثنيٌّ أو خائن\u003c/td\u003e\u003ctd\u003eتبريرٌ أخلاقي للقتل\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالكتابة العربية\u003c/td\u003e\u003ctd\u003e«إفرنج» غازٍ، مع إعجابٍ ببعض الصفات\u003c/td\u003e\u003ctd\u003eوصفٌ سياسيّ أكثر منه دينيّاً\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالأدب الشعبي\u003c/td\u003e\u003ctd\u003eحكاياتٌ تُضخّم الخوف\u003c/td\u003e\u003ctd\u003eانتقال الصورة إلى العامة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمؤرّخون\u003c/td\u003e\u003ctd\u003eوصفٌ للفظائع وللشجاعة معاً\u003c/td\u003e\u003ctd\u003eذاكرةٌ تحفظ الجرح والإعجاب\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eمن رأى ما فعل الإفرنج بالقدس لم يستطع أن يصفه.\u003c/p\u003e\u003ccite\u003eمن معنى ما كتبه ابن الأثير عن مذبحة القدس سنة ١٠٩٩\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eالحملات لم تُنتج أرضاً ومالاً فقط بل صوراً: صورة المسلم في الكتابة الأوروبية بُنيت على الخيال والتشويه، وصورة الصليبي في الكتابة العربية بُنيت على الوصف السياسي مع إعجابٍ ببعض الصفات. وقد بقي هذا التوريث في الوجدانين، فصار كل حدثٍ يُقرأ في ضوء الحملات. وكان في هذا ما يُبيّن أن الحروب لا تنتهي بتوقيعٍ بل بتنقية الذاكرة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"legacy","n":"الإرث والذاكرة","ic":"🧭","part":"القسم الخامس: الآثار والتبادل","h":"\u003carticle class=\"ch3\" id=\"legacy\" data-toc=\"الإرث والذاكرة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٥.٤\u003c/span\u003e\n          \u003ch3\u003e🧭 الإرث والذاكرة\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eم\u003c/span\u003eاذا بقي من الحروب الصليبية بعد سبعة قرون؟ بقي إرثٌ مزدوج: في الشرق ذاكرة جرحٍ ورمزية تحرير، وفي الغرب أسطورة فارسٍ وحكايات بطولة، وفي الاقتصاد طرق تجارةٍ ومدن، وفي العلم جامعات. وهذا القسم يقرأ ما بقي، ويسأل: كيف يُقرأ هذا التاريخ اليوم بلا انتقامٍ ولا تبرير؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eبعد سبعة قرون من سقوط عكا، لا يزال اسم «الحروب الصليبية» حيّاً في اللغتين العربية والأوروبية، ولكنه لا يعني الشيء نفسه في الاثنتين. ففي العربية يُستدعى للدلالة على عدوانٍ خارجي، وفي الأوروبية يُستدعى للدلالة على بطولةٍ ومغامرة، وكان في هذا الاختلاف ما جعل الكلمة نفسها سلاحاً في الجدل. وكان في هذا ما يُبيّن أن التاريخ لا يُحفظ في الكتب فقط بل في المفردات، وأن من أراد أن يفهم حاضراً فليقرأ معجمه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في الذاكرة الشرقية ما جعل الحملات تُقرأ في ضوء الحاضر دائماً: فكل احتلالٍ يُقارن بالحملات، وكل تدخّلٍ خارجيٍّ يُسمّى صليبياً، وكان في هذا ما جعل الذاكرة تُصبح إطاراً للفهم لا مجرد خبرٍ في كتاب. وكان في هذا ما يُبيّن أن الذاكرة قد تُعين على الفهم وقد تُعيقه، وأن من أراد أن يفهم حدثاً جديداً فليقرأه في نفسه لا في ماضيه. وكان في هذا الإطار ما جعل الذاكرة قد تُعين على الفهم وقد تُعيقه، وأن من أراد أن يفهم حدثاً جديداً فليقرأه في نفسه لا في ماضيه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في الذاكرة الغربية ما جعل الحملات تُقرأ قراءةً رومانسية: فقد صارت في الأدب والفن موضوعاً للبطولة، وصار صلاح الدين نفسه بطلاً في بعض الحكايات الأوروبية، وكان في هذا ما يُبيّن أن الصورة قد تنقلب إذا مرّ عليها الزمن. وكان في هذا ما جعل بعض المؤرّخين يقولون إن الأسطورة أقوى من الواقع في تكوين الوعي. وكان في هذه القراءة ما جعل بعض المؤرّخين يقولون إن الأسطورة أقوى من الواقع في تكوين الوعي، وأن من أراد أن يفهم وعياً جمعياً فليقرأ حكاياته لا وثائقه فقط.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في الوجدان الإسلامي ما جعل صلاح الدين يُصبح رمزاً لا شخصاً: فكل من أراد أن يُحرّض على الجهاد استدعاه، وكل من أراد أن يُوحّد الأمة ذكّره، وكان في هذا ما جعل الرمز يُستخدم في سياقاتٍ مختلفة. وكان في هذا ما يُبيّن أن الرموز تُبنى لخدمة الحاضر لا لوصف الماضي، وأن من أراد أن يفهم رمزاً فليسأل من يستخدمه لا من صنعه. وكان في هذا الاستخدام ما جعل الرموز تُبنى لخدمة الحاضر لا لوصف الماضي، وأن من أراد أن يفهم رمزاً فليسأل من يستخدمه لا من صنعه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في الإرث المعماري ما جعل الحملات حاضرةً في الحجر: فقلعة عكا وأسوارها، وكنيسة القيامة، وحصون الساحل، وكانت هذه الآثار تُذكّر بأن الحرب تركت في الأرض ما لم تتركه في الكتب. وكان في هذا ما يُبيّن أن العمارة أصدق من الرواية، لأنها لا تُجمّل ولا تُخفي، وأن من أراد أن يعرف تاريخ مكانٍ فلينظر إلى حجارته. وكان في هذه الآثار ما جعل الحرب حاضرةً في الأرض بعد أن غابت عن الكتب، وأن العمارة أصدق من الرواية لأنها لا تُجمّل ولا تُخفي، وأن من أراد أن يعرف تاريخ مكانٍ فلينظر إلى حجارته.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في الإرث القانوني ما جعل بعض المؤرّخين يقولون إن الحملات ساعدت في تكوين فكرة الحرب العادلة في الفكر الأوروبي، وكان في هذا ما جعل القانون الدولي يحمل أثراً من جدل الحملات. وكان في هذا ما يُبيّن أن الحروب تُنتج أفكاراً حتى حين تخسر، وأن من أراد أن يفهم قانوناً فليقرأ الحروب التي سبقته. وكان في هذا الأثر ما جعل القانون الدولي يحمل شيئاً من جدل الحملات، وكان في هذا ما يُبيّن أن الحروب تُنتج أفكاراً حتى حين تخسر، وأن من أراد أن يفهم قانوناً فليقرأ الحروب التي سبقته.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في الإرث الاقتصادي ما جعل بعض المدن الأوروبية تنمو نمواً لم تعرفه قبل الحملات، وكانت البندقية وجنوة من أثرى مدن أوروبا في القرن الرابع عشر، وكان في هذا النمو ما جعل رأس المال يتراكم ويموّل نهضةً بعد ذلك. وكان في هذا ما يُبيّن أن الحرب قد تُنتج ثروةً لمن لا يُقاتل فيها، وأن من أراد أن يفهم نهضةً فليقرأ تجارتها. وكان في هذا النمو ما جعل رأس المال يتراكم ويموّل نهضةً بعد ذلك، وكان في هذا ما يُبيّن أن الحرب قد تُنتج ثروةً لمن لا يُقاتل فيها، وأن من أراد أن يفهم نهضةً فليقرأ تجارتها لا جيوشها فقط.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في الإرث العلمي ما جعل جامعات أوروبا تُنشأ على نصوصٍ عربية، وكان في هذا ما جعل النهضة الأوروبية تقف على أساسٍ لم تصنعه. وكان في هذا ما يُبيّن أن الحضارات لا تُبتدع من الصفر بل تتوارث، وأن من أراد أن يتقدّم فليعترف بما أخذه من غيره، وأن الاعتراف ليس ضعفاً بل صدقاً. وكان في هذا الأساس ما جعل النهضة الأوروبية تقف على ما لم تصنعه، وكان في هذا ما يُبيّن أن الحضارات لا تُبتدع من الصفر بل تتوارث، وأن الاعتراف بما أُخذ من الغير ليس ضعفاً بل صدقاً.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في الإرث الإنساني ما جعل الحملات تُصبح موضوعاً للأسئلة الأخلاقية: كيف يُقتل إنسانٌ باسم الله؟ كيف يُبرّر الفقهاء الحرب؟ كيف تُصنع صورة العدوّ؟ وكان في هذه الأسئلة ما جعل الحملات تُدرّس في الفلسفة والأخلاق لا في التاريخ العسكري فقط. وكان في هذا ما يُبيّن أن التاريخ لا يُقرأ للفخر بل للفهم، وأن من قرأه للفخر لم يقرأه. وكان في هذه الأسئلة ما جعل الحملات تُدرّس في الفلسفة والأخلاق لا في التاريخ العسكري فقط، وكان في هذا ما يُبيّن أن التاريخ لا يُقرأ للفخر بل للفهم، وأن من قرأه للفخر لم يقرأه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في الإرث الثقافي ما جعل الحملات تُنتج أدباً وفناً في الطرفين: قصائد وأغانٍ في أوروبا، وقصائد ومدائح في الشرق، وكان في هذا الإنتاج ما جعل الحرب تُصبح ذاكرةً جمالية. وكان في هذا ما يُبيّن أن الإنسان قد يُحوّل جرحه إلى فن، وأن الفن قد يُخفّف الألم ولكنه لا يُغيّر الواقع. وكان في هذا الإنتاج ما جعل الحرب تُصبح ذاكرةً جمالية، وكان في هذا ما يُبيّن أن الإنسان قد يُحوّل جرحه إلى فن، وأن الفن قد يُخفّف الألم ولكنه لا يُغيّر الواقع، وأن الجمال لا يُغني عن العدل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في قراءة الحملات اليوم ما جعل بعض المؤرّخين يُحاولون أن يُقدّموا قراءةً بلا انتقامٍ ولا تبرير: أن يقرأوا الدوافع كما هي، وأن يُسمّوا الفظائع بأسمائها، وأن يُفرّقوا بين ما فعله الأفراد وما تقتضيه العقائد. وكان في هذه القراءة ما جعل التاريخ علماً لا سلاحاً. وكان في هذا ما يُبيّن أن من أراد أن يُصالح حاضراً فليبدأ بتاريخٍ صادق.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا كله ما جعل الحملات الصليبية درساً في أن الحروب لا تُنهي الحروب، وأن النصر العسكري لا يُنتج سلاماً إذا لم يُنتج عدلاً. وكان في هذا ما جعل الأمة التي انتصرت في حطين لا تزال تسأل عن القدس بعد ثمانية قرون، وأن الأمة التي خسرت في عكا لا تزال تحلم بأسطورة الفارس. وكان في هذا ما يُبيّن أن التاريخ لا يُقاس بالانتصارات بل بما بقي في النفوس.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eصلاح الدين رمزاً\u003c/h4\u003e\u003cp class=\"ap\"\u003eصار صلاح الدين في الوجدان الإسلامي رمزاً لا شخصاً، فكل من أراد أن يُحرّض على الجهاد استدعاه، وكل من أراد أن يُوحّد الأمة ذكّره، وكان في هذا ما جعل الرمز يُستخدم في سياقاتٍ مختلفة. وكان في هذا ما يُبيّن أن الرموز تُبنى لخدمة الحاضر لا لوصف الماضي. وكان في هذا ما جعل الرمز يُستخدم في سياقاتٍ مختلفة، وأن من أراد أن يفهم رمزاً فليسأل من يستخدمه لا من صنعه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا الاستدعاء ما جعل بعض المؤرّخين يُنبّهون إلى أن صلاح الدين كان رجلاً في سياقٍ تاريخي لا نموذجاً يُنقل بلا سياقه، وكان في هذا التنبيه ما جعل القراءة التاريخية أصعب وأصدق. وكان في هذا ما يُبيّن أن من أراد أن يستفيد من التاريخ فليفهم سياقه لا أن يستنسخ شعاراته.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في صيرورته رمزاً ما جعل قصته تُروى في المساجد والمدارس والمسلسلات، وكان في هذا ما جعل الصورة تُبسّط أحياناً وتُضخّم أحياناً. وكان في هذا ما يُبيّن أن الرمز قد يُخفي الشخص، وأن من أراد أن يعرف رجلاً فليقرأ عنه في مصادره لا في مدائحه. وكان في هذا ما جعل الصورة تُبسّط أحياناً وتُضخّم أحياناً، وأن الرمز قد يُخفي الشخص، وأن من أراد أن يعرف رجلاً فليقرأ عنه في مصادره لا في مدائحه.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالأسطورة في الغرب\u003c/h4\u003e\u003cp class=\"ap\"\u003eصارت الحملات في الغرب موضوعاً رومانسياً، فقد كُتبت عنها قصائد وأُلّفت روايات، وصار الفارس الصليبي بطلاً في الخيال الأوروبي. وكان في هذه القراءة ما جعل الحرب تُقرأ مغامرةً لا مذبحة، وأن من أراد أن يُجمّل حرباً فليجعلها حكاية. وكان في هذه القراءة ما جعل الحرب تُقرأ مغامرةً لا مذبحة، وأن من أراد أن يُجمّل حرباً فليجعلها حكاية، وأن الحكاية قد تُميت الضحايا مرتين.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان صلاح الدين نفسه بطلاً في بعض الحكايات الأوروبية، فقد صوّرته بعض النصوص حكيماً كريماً، وكان في هذا التصوير ما يُبيّن أن الصورة قد تنقلب إذا مرّ عليها الزمن. وكان في هذا ما جعل بعض المؤرّخين يقولون إن الأسطورة أقوى من الواقع في تكوين الوعي. وكان في هذا التصوير ما يُبيّن أن الصورة قد تنقلب إذا مرّ عليها الزمن، وأن الأسطورة قد تكون أقوى من الواقع في تكوين الوعي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذه الأسطورة ما جعل بعض الأوروبيين في القرنين التاسع عشر والعشرين يستدعون الحملات في خطابهم الاستعماري، وكان في هذا الاستدعاء ما جعل الحملات تُصبح ذريعةً للتوسّع الحديث. وكان في هذا ما يُبيّن أن التاريخ قد يُستغل، وأن من أراد أن يُبرّر حاضراً فليبحث في الماضي عن شعار.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eكيف تُقرأ اليوم؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eيُحاول بعض المؤرّخين اليوم أن يقرأوا الحملات قراءةً بلا انتقامٍ ولا تبرير: أن يقرأوا الدوافع كما هي، وأن يُسمّوا الفظائع بأسمائها، وأن يُفرّقوا بين ما فعله الأفراد وما تقتضيه العقائد. وكان في هذه القراءة ما جعل التاريخ علماً لا سلاحاً. وكان في هذا ما يُبيّن أن من أراد أن يُصالح حاضراً فليبدأ بتاريخٍ صادق.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذه القراءة ما جعل بعض المؤرّخين يُشدّدون على أن الحملات لم تكن حرباً بين دينين فقط، بل كانت صراعاً على الأرض والتجارة والسلطة أيضاً. وكان في هذا التشديد ما جعل الفهم أدقّ، وأن من أراد أن يفهم حرباً فليقرأ مصالحها لا شعاراتها فقط. وكان في هذا التشديد ما جعل الفهم أدقّ، وأن من أراد أن يفهم حرباً فليقرأ مصالحها لا شعاراتها فقط.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذه القراءة ما جعل بعض المؤرّخين يقولون إن أعظم درسٍ من الحملات أن التشرّد الداخلي يفتح الأبواب للخارج، وأن من أراد أن يُقاوم خطراً خارجياً فليُصلح داخله أولاً. وكان في هذا ما جعل الحملات تُدرّس في السياسة لا في التاريخ فقط، وأن من قرأ التاريخ ليتعلّم لا ليفتخر فقد قرأه حقاً.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالذاكرة\u003c/b\u003e\u003cspan\u003eفي الشرق جرحٌ ورمزية تحرير، وفي الغرب أسطورة بطولة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eصلاح الدين\u003c/b\u003e\u003cspan\u003eصار رمزاً يُستدعى في كل دعوةٍ إلى الوحدة أو الجهاد\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالعمارة\u003c/b\u003e\u003cspan\u003eقلعة عكا وحصون الساحل تُذكّر بما لم تُذكّره الكتب\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالاقتصاد\u003c/b\u003e\u003cspan\u003eالبندقية وجنوة أثرى مدن أوروبا في القرن الرابع عشر\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالدرس\u003c/b\u003e\u003cspan\u003eالتشرّد الداخلي يفتح الأبواب للخارج\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمجال\u003c/th\u003e\u003cth\u003eما بقي\u003c/th\u003e\u003cth\u003eكيف يُقرأ اليوم\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالذاكرة\u003c/td\u003e\u003ctd\u003eصورتان متقابلتان للحدث نفسه\u003c/td\u003e\u003ctd\u003eتاريخٌ صادقٌ لا انتقامٌ ولا تبرير\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالرمز\u003c/td\u003e\u003ctd\u003eصلاح الدين في الشرق، والفارس في الغرب\u003c/td\u003e\u003ctd\u003eفهم السياق لا استنساخ الشعار\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالعمارة\u003c/td\u003e\u003ctd\u003eقلعة عكا وحصون الساحل\u003c/td\u003e\u003ctd\u003eشاهدٌ لا يُجمّل ولا يُخفي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالاقتصاد\u003c/td\u003e\u003ctd\u003eطرق تجارةٍ ومدنٌ نمت\u003c/td\u003e\u003ctd\u003eقراءة المصالح لا الشعارات فقط\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالدرس\u003c/td\u003e\u003ctd\u003eالتشرّد الداخلي يُغري الخارج\u003c/td\u003e\u003ctd\u003eإصلاح الداخل قبل مواجهة الخارج\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eالتاريخ لا يُقرأ للفخر بل للفهم، ومن قرأه للفخر لم يقرأه.\u003c/p\u003e\u003ccite\u003eخلاصة ما تُعلّمه الحروب الصليبية لقارئها اليوم\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eبقي من الحملات إرثٌ مزدوج: ذاكرة جرحٍ ورمزية تحرير في الشرق، وأسطورة فارسٍ وحكايات بطولة في الغرب، وعمارةٌ في الساحل، ومدنٌ نمت بالتجارة، وجامعاتٌ قامت على نصوصٍ عربية. وقد صار صلاح الدين رمزاً يُستدعى في كل دعوةٍ للوحدة، وصار الفارس الصليبي بطلاً في الحكايات الأوروبية. وأعظم درسٍ من هذا التاريخ أن التشرّد الداخلي يفتح الأبواب للخارج.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"f","one":true,"id":"people","n":"أهم الشخصيات","ic":"","part":"","h":"\u003csection class=\"rsec\"\u003e\n      \u003ch2 class=\"sec\"\u003eأهم الشخصيات\u003c/h2\u003e\n      \u003cdiv class=\"people\"\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eالبابا أوربان الثاني\u003c/b\u003e\u003cspan\u003eدعا إلى الحملة الصليبية الأولى في مجلس كليرمون سنة ١٠٩٥م.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eصلاح الدين الأيوبي\u003c/b\u003e\u003cspan\u003eوحّد مصر والشام وهزم الصليبيين في حطين وحرّر القدس سنة ١١٨٧م.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eريتشارد قلب الأسد\u003c/b\u003e\u003cspan\u003eملك إنجلترا قاد الحملة الثالثة وعقد صلح الرملة مع صلاح الدين.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eنور الدين محمود\u003c/b\u003e\u003cspan\u003eصاحب دمشق وحّد الشام وبدأ مشروع الجهاد ضد الصليبيين.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eالظاهر بيبرس\u003c/b\u003e\u003cspan\u003eسلطان مموليك قاد صدّ المغول في عين جالوت وحارب الصليبيين.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eالأشرف خليل\u003c/b\u003e\u003cspan\u003eسلطان مموليك فتح عكا سنة ١٢٩١م وأنهى الوجود الصليبي في الشام.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eأرناط\u003c/b\u003e\u003cspan\u003eصاحب الكرك، هاجم القوافل فاستفز صلاح الدين وقُتل في حطين.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\n    \u003c/section\u003e"},{"u":"f","one":true,"id":"outcomes","n":"النتائج والآثار","ic":"","part":"","h":"\u003csection class=\"rsec\"\u003e\n      \u003ch2 class=\"sec\"\u003eالنتائج والآثار\u003c/h2\u003e\n      \u003cul class=\"outs\"\u003e\u003cli\u003eتوحيد الجبهة الإسلامية تحت قيادة واحدة في عهد صلاح الدين.\u003c/li\u003e\u003cli\u003eتحرير القدس سنة ١١٨٧م بعد ثمانية وثمانين عاماً من الاحتلال الصليبي.\u003c/li\u003e\u003cli\u003eنهاية الوجود الصليبي في الشرق بعد سقوط عكا سنة ١٢٩١م.\u003c/li\u003e\u003cli\u003eتأسيس دولة المماليك التي تولت صدّ الصليبيين ثم المغول.\u003c/li\u003e\u003c/ul\u003e\n    \u003c/section\u003e"},{"u":"f","one":true,"id":"sources","n":"المصادر والمراجع","ic":"","part":"","h":"\u003cdiv class=\"src frame\" style=\"--c:#8B1A1A\"\u003e\n    \u003cspan class=\"crn tl\"\u003e\u003csvg viewBox=\"0 0 26 26\"\u003e\n\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\"/\u003e\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\" transform=\"rotate(90 13 13)\" opacity=\".5\"/\u003e\u003c/svg\u003e\u003c/span\u003e\u003cspan class=\"crn tr\"\u003e\u003csvg viewBox=\"0 0 26 26\"\u003e\n\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\"/\u003e\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\" transform=\"rotate(90 13 13)\" opacity=\".5\"/\u003e\u003c/svg\u003e\u003c/span\u003e\u003cspan class=\"crn bl\"\u003e\u003csvg viewBox=\"0 0 26 26\"\u003e\n\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\"/\u003e\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\" transform=\"rotate(90 13 13)\" opacity=\".5\"/\u003e\u003c/svg\u003e\u003c/span\u003e\u003cspan class=\"crn br\"\u003e\u003csvg viewBox=\"0 0 26 26\"\u003e\n\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\"/\u003e\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\" transform=\"rotate(90 13 13)\" opacity=\".5\"/\u003e\u003c/svg\u003e\u003c/span\u003e\n    \u003ch2 class=\"sec\" style=\"margin-top:0\"\u003eالمصادر والمراجع\u003c/h2\u003e\n    \u003cul\u003e\u003cli\u003e\u003ccite\u003eابن الأثير\u003c/cite\u003e — الكامل في التاريخ (أخبار الحملات الصليبية ومعركة حطين وتحرير القدس)\u003c/li\u003e\u003cli\u003e\u003ccite\u003eالمقريزي\u003c/cite\u003e — السلوك لمعرفة دول الملوك (سقوط عكا ونهاية الإمارات الصليبية في الشام)\u003c/li\u003e\u003cli\u003e\u003ccite\u003eابن خلدون\u003c/cite\u003e — تاريخ ابن خلدون (وقائع الحروب الصليبية وأخبار دولة المماليك)\u003c/li\u003e\u003cli\u003e\u003ccite\u003eابن قتيبة\u003c/cite\u003e — معرفة النسب (إشارات إلى أنساب القبائل وأخبار حروب الشام)\u003c/li\u003e\u003c/ul\u003e\n  \u003c/div\u003e"},{"u":"f","one":true,"id":"pager","n":"الحقب الأخرى","ic":"","part":"","h":"\u003cnav class=\"pager\"\u003e\n    \u003ca class=\"prev\" href=\"abbasid.html\"\u003e\u003csmall\u003e← الحقبة السابقة\u003c/small\u003e\u003cb\u003e📚 الدولة العباسية\u003c/b\u003e\u003c/a\u003e\n    \u003ca class=\"next\" href=\"mamluk.html\"\u003e\u003csmall\u003eالحقبة التالية →\u003c/small\u003e\u003cb\u003e🐎 المماليك وعالم الشرق\u003c/b\u003e\u003c/a\u003e\n  \u003c/nav\u003e"}]}</script>
<script>
/* ===== موسوعة تاريخ الإسلام — منطق الواجهة + قارئ الكتاب =====
   يعمل على صفحات «الكتاب» (التي تحمل <script id="book">) وبقية الصفحات كما هي. */

/* هل هذه صفحة قارئ؟ يُحدَّد قبل أي تهيئة */
window.__READER__ = !!document.getElementById('book');

(function () {
  'use strict';
  var STORE = 'ti_bookmarks', THEME = 'ti_theme', PROG = 'ti_progress';

  /* ---------- تحويل الأرقام إلى هندية (وقت التشغيل) ---------- */
  function arDigits(s) {
    return String(s == null ? '' : s).replace(/\d/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'[d]; });
  }
  window.arDigits = arDigits;

  /* ---------- الوضع الليلي ---------- */
  function applyTheme(d) {
    document.body.classList.toggle('dark', d);
    var b = document.getElementById('themeBtn');
    if (b) b.textContent = d ? '☀️' : '🌙';
  }
  var th = document.getElementById('themeBtn');
  if (th) th.addEventListener('click', function () {
    var d = !document.body.classList.contains('dark');
    applyTheme(d); localStorage.setItem(THEME, d ? '1' : '0');
  });
  applyTheme(localStorage.getItem(THEME) === '1');

  /* ---------- التقدّم: مشترك بين التمرير والقارئ ---------- */
  function setProgress(id, frac) {
    if (!id || id === 'home') return;
    var pr = JSON.parse(localStorage.getItem(PROG) || '{}');
    if ((pr[id] || 0) < frac) { pr[id] = frac; localStorage.setItem(PROG, JSON.stringify(pr)); }
    if (frac > 0.92) {
      var bm = JSON.parse(localStorage.getItem(STORE) || '[]');
      if (bm.indexOf(id) < 0) {
        bm.push(id); localStorage.setItem(STORE, JSON.stringify(bm));
        if (window.refreshBadges) window.refreshBadges();
      }
    }
  }
  window.__setProgress = setProgress;

  var domeFill = document.querySelector('.dome .fill');
  var topBar = document.querySelector('.topbar i');
  var swordBl = document.querySelector('.sword .bl');
  var swordTx = document.querySelector('.sword span');

  function paintProgress(pct) {
    if (domeFill) domeFill.style.opacity = (0.12 + pct * 0.88).toFixed(2);
    if (topBar) topBar.style.width = Math.round(pct * 100) + '%';
    if (swordBl) swordBl.style.clipPath = 'inset(0 ' + (100 - pct * 100) + '% 0 0)';
    if (swordTx) swordTx.textContent = 'القراءة ' + arDigits(Math.round(pct * 100)) + '٪';
  }
  window.__paintProgress = paintProgress;

  /* ---------- نظام الأوسمة ---------- */
  var BADGES = [
    { id: 'start', ic: '🌱', n: 'نَبتُ الطريق', d: 'ابدأ أول حقبة' },
    { id: 'prophets', ic: '📜', n: 'وسام النبوة', d: 'أنبياء' },
    { id: 'seerah', ic: '🕊️', n: 'وسام الرحمة', d: 'السيرة' },
    { id: 'rashidun', ic: '⚔️', n: 'وسام الفاروق', d: 'الراشدون' },
    { id: 'umayyad', ic: '🏛️', n: 'وسام البناء', d: 'الأمويه' },
    { id: 'andalus', ic: '🏰', n: 'وسام الأندلس', d: 'الأندلس' },
    { id: 'abbasid', ic: '📚', n: 'وسام الفجر', d: 'العباسيه' },
    { id: 'crusades', ic: '🛡️', n: 'وسام حطين', d: 'الصليبيون' },
    { id: 'mamluk', ic: '🐎', n: 'وسام النصر', d: 'المماليك' },
    { id: 'ottoman', ic: '🕌', n: 'وسام السلطان', d: 'العثمانيون' },
    { id: 'civilization', ic: '🔬', n: 'وسام العقل', d: 'الحضاره' },
    { id: 'modern', ic: '🕰️', n: 'وسام التاريخ', d: 'العصر الحديث' },
    { id: 'all', ic: '👑', n: 'تاج المؤرخ', d: 'كل الحقب' }
  ];
  window.refreshBadges = function () {
    var bm = JSON.parse(localStorage.getItem(STORE) || '[]');
    var host = document.getElementById('badges');
    if (!host) return;
    var done = BADGES.filter(function (b) {
      return b.id === 'start' ? bm.length >= 1
        : b.id === 'all' ? bm.length >= 12 : bm.indexOf(b.id) >= 0;
    }).map(function (b) { return b.id; });
    var pct = Math.round(done.length / BADGES.length * 100);
    document.querySelectorAll('#badges .bg').forEach(function (el) {
      el.classList.toggle('on', done.indexOf(el.dataset.b) >= 0);
    });
    var c = document.getElementById('bcnt');
    if (c) c.textContent = arDigits(done.length) + ' من ' + arDigits(BADGES.length);
    var pb = document.getElementById('bprog');
    if (pb) pb.style.width = pct + '%';
  };
  window.refreshBadges();

  /* ---------- إخفاء المفضلة ---------- */
  var f = document.getElementById('favBtn');
  if (f) {
    f.textContent = JSON.parse(localStorage.getItem(STORE) || '[]')
      .indexOf(document.body.dataset.page) >= 0 ? '★' : '☆';
    f.addEventListener('click', function () {
      var id = document.body.dataset.page;
      var bm = JSON.parse(localStorage.getItem(STORE) || '[]');
      var i = bm.indexOf(id);
      i >= 0 ? bm.splice(i, 1) : bm.push(id);
      localStorage.setItem(STORE, JSON.stringify(bm));
      f.textContent = i >= 0 ? '☆' : '★';
    });
  }
})();


/* ==========================================================
   قارئ الكتاب — تقسيم المحتوى إلى صفحات بلا تمرير عمودي
   ========================================================== */
(function () {
  'use strict';
  var dataEl = document.getElementById('book');
  if (!dataEl) return;

  var BOOK;
  try { BOOK = JSON.parse(dataEl.textContent); } catch (e) { return; }

  var PGID = BOOK.id;
  var PADX = 20, PADY = 12, FOOT = 26, GAP = 12;
  var SPREAD = false;   /* وضع الكتاب المفتوح (صفحتان متقابلتان) — يُفعَّل لاحقًا */
  var R = {
    cur: 0, total: 0, pages: [], units: [], chaps: [],
    pageW: 0, pageH: 0, cw: 0, ch: 0, stageW: 0, stageH: 0,
    spread: false, fs: 1, busy: false, dir: 0, drag: null,
    rendered: {}, plan: null, index: null
  };
  window.__R = R; /* مرجع للتشخيص فقط */

  var stage, meas, measBody, leaf, leafFront, leafBack, chapEl, progEl, prevBtn, nextBtn;

  /* ---------- أدوات ---------- */
  function arD(s) { return window.arDigits(s); }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  /* ---------- ١) التهيئة ---------- */
  function setup() {
    stage = document.getElementById('rStage');
    if (!stage) return;
    leaf = document.getElementById('rLeaf');
    leafFront = document.getElementById('rFront');
    leafBack = document.getElementById('rBack');
    chapEl = document.getElementById('rBrand');
    progEl = document.getElementById('rProg');
    prevBtn = document.getElementById('rPrev');
    nextBtn = document.getElementById('rNext');

    meas = document.createElement('div');
    meas.className = 'rmeas';
    meas.innerHTML = '<div class="rbody"></div>';
    stage.appendChild(meas);
    measBody = meas.firstChild;

    R.fs = parseFloat(localStorage.getItem('ti_font') || '1') || 1;
    applyFont();

    /* القياس قبل استقرار الخطوط يعطي عدد صفحات مختلفًا في كل تحميل (٢٧٥ / ٢٧٩ / ٢٨١)،
       فنؤجّل أول ترقيم حتى تنتهي محاولة تحميل الخطوط (نجاحًا أو فشلًا). */
    var booted = false;
    function boot() {
      if (booted) return;
      booted = true;

      layout();
      buildUnits();

      var ok = loadPlan();
      if (!ok) { paginate(); savePlan(); }

      var saved = parseInt(localStorage.getItem('ti_pos_' + PGID) || '0', 10);
      R.cur = (saved > 0 && saved <= R.total) ? saved - 1 : 0;

      /* قفزة مباشرة إلى صفحة (للاختبار): seerah.html?p=12 */
      var m = /[?&#]p=(\d+)/.exec(location.href);
      if (m) { var jp = parseInt(m[1], 10); if (jp >= 1 && jp <= R.total) R.cur = jp - 1; }

      render();
      buildPanel();
      wire();
      document.body.classList.add('rready');
    }

    var fontsReady = Promise.resolve();
    if (document.fonts && document.fonts.load) {
      fontsReady = Promise.all([
        document.fonts.load('1em Amiri'),
        document.fonts.load('1em Cairo')
      ]).catch(function () { });
    }
    /* مهلة أمان: لو علِق الطلب لا نُجمّد القارئ */
    var safety = new Promise(function (res) { setTimeout(res, 2500); });
    Promise.race([fontsReady, safety]).then(function () {
      /* نفس طفيف: حتى بعد list/ready قد يحتاج المتصفح لحظة لتطبيق القياسات الجديدة */
      setTimeout(boot, 50);
    });
  }

  function applyFont() {
    document.documentElement.style.fontSize = (16 * R.fs) + 'px';
  }

  /* ---------- ٢) المقاسات ---------- */
  function layout() {
    var r = stage.getBoundingClientRect();
    R.stageW = r.width; R.stageH = r.height;
    R.spread = SPREAD && (window.innerWidth >= 820) && (window.innerWidth > window.innerHeight);
    R.pageW = R.spread ? Math.floor((R.stageW - 24 - GAP) / 2) : Math.min(R.stageW - 16, 700);
    R.pageH = Math.floor(R.stageH - 8);
    R.cw = R.pageW - PADX * 2;
    R.ch = R.pageH - PADY * 2 - FOOT;
    stage.style.setProperty('--pw', R.pageW + 'px');
    stage.style.setProperty('--ph', R.pageH + 'px');
    stage.style.setProperty('--ch', R.ch + 'px');
    meas.style.width = R.cw + 'px';
  }

  /* ---------- ٣) تحويل HTML إلى كتل ---------- */
  function buildUnits() {
    R.units = BOOK.units.map(function (u, ui) {
      var tpl = document.createElement('template');
      tpl.innerHTML = u.h;
      var root = tpl.content.firstElementChild;
      var blocks = u.one ? [root] : Array.prototype.slice.call(root.children)
        .filter(function (el) { return !(el.matches && el.matches('.crn,.orn,.porn,svg')); });
      return { ui: ui, u: u.u, id: u.id, n: u.n, ic: u.ic || '', blocks: blocks };
    });
  }

  /* ---------- ٤) القياس ---------- */
  function measureAll(nodes) {
    measBody.innerHTML = '';
    var fr = document.createDocumentFragment(), i;
    for (i = 0; i < nodes.length; i++) fr.appendChild(nodes[i].cloneNode(true));
    measBody.appendChild(fr);
    measBody.appendChild(document.createElement('div'));
    var kids = measBody.children, n = nodes.length, hs = [];
    for (i = 0; i < n; i++) hs.push(kids[i + 1].offsetTop - kids[i].offsetTop);
    measBody.innerHTML = '';
    return hs;
  }
  function measureOne(node) {
    measBody.innerHTML = '';
    measBody.appendChild(node.cloneNode(true));
    measBody.appendChild(document.createElement('div'));
    var k = measBody.children;
    var h = k[1].offsetTop - k[0].offsetTop;
    measBody.innerHTML = '';
    return h;
  }

  /* ---------- ٥) تصنيف الكتل ---------- */
  function kindOf(el) {
    if (!el) return 'other';
    var t = el.tagName;
    if (t === 'P') return 'tx';
    if (t === 'BLOCKQUOTE') return 'qt';
    if (t === 'UL' || t === 'OL') return 'ls';
    if (el.classList.contains('tblwrap')) return 'tb';
    if (el.classList.contains('kbox')) return 'kb';
    if (el.classList.contains('res')) return 'tx';
    if (el.classList.contains('people')) return 'ls';
    if (el.classList.contains('toclist')) return 'ls';
    if (el.querySelector && el.querySelector('.toclist,.people,ul,ol')) return 'ls';
    if (t === 'H2' || t === 'H3' || t === 'H4' || t === 'H5') return 'hd';
    return 'other';
  }

  /* الحاوية التي أبناؤها عناصر القائمة (قد تكون داخل إطار) */
  function listHost(el) {
    if (el.matches && el.matches('ul,ol,.people,.toclist')) return el;
    return (el.querySelector && el.querySelector('.toclist,.people,ul,ol')) || el;
  }
  function isHeading(el) {
    if (!el) return false;
    var t = el.tagName;
    if (t === 'H2' || t === 'H3' || t === 'H4' || t === 'H5') return true;
    if (el.classList.contains('ch3-h')) return true;
    return false;
  }

  /* مدى الكتلة القابل للتقسيم: [بداية، نهاية) */
  function rangeOf(el, kind) {
    if (kind === 'tx' || kind === 'qt') return [0, textOf(el).length];
    if (kind === 'ls') return [0, listHost(el).children.length];
    if (kind === 'tb') return [0, el.querySelectorAll('tbody tr').length];
    if (kind === 'kb') {
      var g = el.querySelector('.kgrid3');
      return [0, g ? g.children.length : 0];
    }
    return [0, 0];
  }

  /* ---------- ٦) نصوص الكتلة ---------- */
  function textOf(el) {
    if (el.tagName === 'BLOCKQUOTE') {
      var p = el.querySelector('p');
      return p ? p.textContent : el.textContent;
    }
    return el.textContent;
  }
  function cloneWithText(el, text, keepDrop) {
    var c = el.cloneNode(true);
    var drop = c.querySelector('.drop');
    var kids = Array.prototype.slice.call(c.childNodes);
    for (var i = 0; i < kids.length; i++) {
      var k = kids[i];
      if (k.nodeType === 3) c.removeChild(k);
      else if (k.nodeType === 1 && !(keepDrop && k === drop)) c.removeChild(k);
    }
    var body = text;
    if (keepDrop && drop) body = text.slice(drop.textContent.length);
    c.appendChild(document.createTextNode(body));
    return c;
  }
  function makeText(el, a, e, keepDrop) {
    if (el.tagName === 'BLOCKQUOTE') {
      var c = el.cloneNode(true);
      var p = c.querySelector('p');
      p.textContent = el.querySelector('p').textContent.slice(a, e);
      var cite = c.querySelector('cite');
      if (cite && a > 0) cite.remove();
      return c;
    }
    return cloneWithText(el, el.textContent.slice(a, e), keepDrop);
  }
  function snapSentence(text, pos) {
    var marks = ['.', '؟', '!', '۔', '،', '؛', ':'];
    for (var i = pos; i > pos - 220 && i > 40; i--) {
      if (marks.indexOf(text[i - 1]) >= 0) return i;
    }
    return pos;
  }

  /* ---------- ٧) تقسيم الكتل ---------- */
  function splitBlock(el, kind, a, e, avail) {
    if (avail < 70) return null;
    if (kind === 'tx' || kind === 'qt') {
      var full = textOf(el);
      /* عتبة منخفضة: كان ٢٤٠/٢٠٠ حرفًا فيترك فراغًا كبيرًا في أسفل الصفحات
         حين تأتي فقرة متوسطة لا تسع كاملة. نسمح بالقسمة ما دامت البقية سطرًا معتبرًا. */
      if (e - a < 90) return null;
      var hasDrop = !!el.querySelector('.drop');
      /* تقدير نسبي ثم تصحيحان على الأكثر — أسرع بكثير من البحث الثنائي على الجوال */
      var span = e - a;
      var fullH = measureOne(el);
      if (!(fullH > avail)) return null;
      var guess = a + Math.max(60, Math.min(span - 60, Math.round(span * (avail / fullH) * 0.97)));
      var best = -1;
      for (var it = 0; it < 3; it++) {
        var h = measureOne(makeText(el, a, guess, a === 0 && hasDrop));
        if (h <= avail) {
          best = guess;
          var room = avail - h;
          if (room < 24) break;
          var step = Math.max(24, Math.round(span * room / fullH));
          if (guess + step > e - 50) break;
          guess += step;
        } else {
          var back = Math.max(24, Math.round(span * (h - avail) / fullH));
          if (guess - back <= a + 50) break;
          guess -= back;
        }
      }
      if (best < 0) return null;
      var cut = snapSentence(full, best);
      if (cut <= a || cut >= e) cut = best;
      /* لا نُبقِي ذيلًا قصيرًا جدًا (سطرًا مبتورًا) ولا رأسًا قصيرًا جدًا */
      if ((cut - a) < 70 || (e - cut) < 50) return null;
      var p1 = makeText(el, a, cut, a === 0 && hasDrop);
      var p2 = makeText(el, cut, e, false);
      return [
        { d: { k: kind === 'qt' ? 'qt' : 'tx', a: a, e: cut, dp: (a === 0 && hasDrop) ? 1 : 0 }, node: p1 },
        { d: { k: kind === 'qt' ? 'qt' : 'tx', a: cut, e: e, dp: 0 }, node: p2 }
      ];
    }
    if (kind === 'tb') return splitTable(el, a, e, avail);
    if (kind === 'ls') return splitList(el, a, e, avail);
    if (kind === 'kb') return splitKbox(el, a, e, avail);
    return null;
  }

  /* جدول: يُقسَّم بالصفوف مع تكرار صف العناوين */
  function splitTable(el, a, e, avail) {
    var rows = el.querySelectorAll('tbody tr');
    if (!rows.length) return null;
    function build(r0, r1) {
      var w = el.cloneNode(true);
      var rs = w.querySelectorAll('tbody tr');
      for (var i = 0; i < rs.length; i++) {
        if (i < r0 || i >= r1) w.querySelector('tbody').removeChild(rs[i]);
      }
      if (r0 > 0) { var cap = w.querySelector('.tblcap'); if (cap) cap.remove(); }
      return w;
    }
    var lo = a + 1, hi = e - 1, best = -1;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      if (measureOne(build(a, mid)) <= avail) { best = mid; lo = mid + 1; } else hi = mid - 1;
    }
    if (best < 0 || best <= a) return null;
    return [
      { d: { k: 'tb', a: a, b: best }, node: build(a, best) },
      { d: { k: 'tb', a: best, b: e }, node: build(best, e) }
    ];
  }

  /* قائمة أو شبكة: تُقسَّم بعناصرها */
  function splitList(el, a, e, avail) {
    var host = listHost(el);
    var kids = host.children;
    if (kids.length < 3) return null;
    function build(c0, c1) {
      var c = el.cloneNode(true);
      var h = listHost(c);
      var ch = Array.prototype.slice.call(h.children);
      for (var i = 0; i < ch.length; i++) if (i < c0 || i >= c1) h.removeChild(ch[i]);
      return c;
    }
    var lo = a + 1, hi = e - 1, best = -1;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      if (measureOne(build(a, mid)) <= avail) { best = mid; lo = mid + 1; } else hi = mid - 1;
    }
    if (best < 0 || best <= a) return null;
    return [
      { d: { k: 'ls', a: a, b: best }, node: build(a, best) },
      { d: { k: 'ls', a: best, b: e }, node: build(best, e) }
    ];
  }

  /* شبكة البطاقات */
  function splitKbox(el, a, e, avail) {
    var grid = el.querySelector('.kgrid3');
    if (!grid) return null;
    var cards = grid.children;
    if (cards.length < 3) return null;
    function build(c0, c1) {
      var k = el.cloneNode(true);
      var g = k.querySelector('.kgrid3');
      var ch = Array.prototype.slice.call(g.children);
      for (var i = 0; i < ch.length; i++) if (i < c0 || i >= c1) g.removeChild(ch[i]);
      if (c0 > 0) { var t = k.querySelector('.bt'); if (t) t.remove(); }
      return k;
    }
    var lo = a + 1, hi = e - 1, best = -1;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      if (measureOne(build(a, mid)) <= avail) { best = mid; lo = mid + 1; } else hi = mid - 1;
    }
    if (best < 0 || best <= a) return null;
    return [
      { d: { k: 'kb', a: a, b: best }, node: build(a, best) },
      { d: { k: 'kb', a: best, b: e }, node: build(best, e) }
    ];
  }

  /* ---------- ٨) بناء كتلة من واصف (لاسترجاع الخطة) ---------- */
  function buildNode(u, b, d) {
    var el = R.units[u].blocks[b];
    if (d.k === 'tx' || d.k === 'qt') return makeText(el, d.a, d.e, !!d.dp);
    if (d.k === 'tb') {
      var w = el.cloneNode(true);
      var rs = w.querySelectorAll('tbody tr');
      for (var i = 0; i < rs.length; i++) if (i < d.a || i >= d.b) w.querySelector('tbody').removeChild(rs[i]);
      if (d.a > 0) { var cap = w.querySelector('.tblcap'); if (cap) cap.remove(); }
      return w;
    }
    if (d.k === 'ls') {
      var c = el.cloneNode(true);
      var h = listHost(c);
      var ch = Array.prototype.slice.call(h.children);
      for (var j = 0; j < ch.length; j++) if (j < d.a || j >= d.b) h.removeChild(ch[j]);
      return c;
    }
    if (d.k === 'kb') {
      var k = el.cloneNode(true);
      var g = k.querySelector('.kgrid3');
      if (g) {
        var gc = Array.prototype.slice.call(g.children);
        for (var q = 0; q < gc.length; q++) if (q < d.a || q >= d.b) g.removeChild(gc[q]);
      }
      if (d.a > 0) { var tt = k.querySelector('.bt'); if (tt) tt.remove(); }
      return k;
    }
    return el;
  }

  /* ---------- ٩) الترقيم ---------- */
  function paginate() {
    var pages = [], cur = { items: [], ch: '' }, curH = 0;
    R.chaps = []; R.partPages = {};

    function flush() {
      if (cur.items.length) pages.push(cur);
      cur = { items: [], ch: cur.ch }; curH = 0;
    }
    function add(u, b, d, node) { cur.items.push({ u: u, b: b, d: d, node: node }); curH += measureOne(node); }

    for (var ui = 0; ui < R.units.length; ui++) {
      var unit = R.units[ui];
      flush();
      cur.ch = unit.n;
      if (unit.u === 'c') R.chaps.push({ id: unit.id, n: unit.n, ic: unit.ic, page: pages.length + 1 });
      if (unit.u === 'p') R.partPages[unit.id] = pages.length + 1;

      var hs = measureAll(unit.blocks);
      var q = [], i;
      for (i = 0; i < unit.blocks.length; i++) {
        var k = kindOf(unit.blocks[i]);
        var rg = rangeOf(unit.blocks[i], k);
        q.push({ b: i, orig: unit.blocks[i], node: unit.blocks[i], h: hs[i], d: null, a: rg[0], e: rg[1], kind: k });
      }
      var qi = 0;
      while (qi < q.length) {
        var it = q[qi];

        /* عنوان: لا يبقى وحيدًا في آخر صفحة */
        if (isHeading(it.node) && cur.items.length) {
          var nx = q[qi + 1];
          var nh = nx ? Math.min(nx.h, 100) : 0;
          if (curH + it.h + nh > R.ch) { flush(); cur.ch = unit.n; continue; }
        }

        if (curH + it.h <= R.ch) {
          /* it.d موجود إذا كان هذا الجزء بقية كتلة قُسِّمت: نحفظ وصفه لا 'full'
             وإلا أعاد بناءُ الخطة عند التحميل التالي الكتلةَ كاملة (تكرار النص) */
          cur.items.push({ u: ui, b: it.b, d: it.d || { k: 'full' }, node: it.node });
          curH += it.h; qi++; continue;
        }

        /* لا يسع: قسّم إن أمكن */
        if (cur.items.length) {
          var sp = splitBlock(it.orig, it.kind, it.a, it.e, R.ch - curH);
          if (sp) {
            cur.items.push({ u: ui, b: it.b, d: sp[0].d, node: sp[0].node });
            flush(); cur.ch = unit.n;
            q[qi] = { b: it.b, orig: it.orig, node: sp[1].node, h: measureOne(sp[1].node),
              d: sp[1].d, a: sp[1].d.a, e: (sp[1].d.e !== undefined ? sp[1].d.e : sp[1].d.b), kind: it.kind };
            continue;
          }
          flush(); cur.ch = unit.n; continue;
        }

        /* صفحة فارغة ولا زال لا يسع */
        var sp2 = splitBlock(it.orig, it.kind, it.a, it.e, R.ch);
        if (sp2) {
          cur.items.push({ u: ui, b: it.b, d: sp2[0].d, node: sp2[0].node });
          flush(); cur.ch = unit.n;
          q[qi] = { b: it.b, orig: it.orig, node: sp2[1].node, h: measureOne(sp2[1].node),
