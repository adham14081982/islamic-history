c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالكتاتيب\u003c/b\u003e\u003cspan\u003eنظام التعليم التقليدي القائم على حفظ القرآن، وكان محرمًا على الفتيات في الغالب.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالبعثات الأوروبية\u003c/b\u003e\u003cspan\u003eأرسلها محمد علي والعثمانيون إلى فرنسا وإيطاليا فأخرجت جيل الرواد من التعليم الحديث.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eحقوق المرأة\u003c/b\u003e\u003cspan\u003eتعليم ثم تصويت ثم عمل ثم مسؤولية سياسية؛ صراعٌ طويل ما زال ناقصًا في قوانين الأحوال الشخصية.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأزمة التعليم\u003c/b\u003e\u003cspan\u003eالحفظ بدل التفكير والهجرة وضعف البنية الرقمية أهم تحديات التعليم العربي اليوم.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمحطة\u003c/th\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eمدارس البعوث\u003c/td\u003e\u003ctd\u003e١٨١٠-١٨٣٠م\u003c/td\u003e\u003ctd\u003eبعثات محمد علي إلى أوروبا\u003c/td\u003e\u003ctd\u003eنقل العلوم الحديثة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eجامعة القاهرة\u003c/td\u003e\u003ctd\u003e١٩٠٨م\u003c/td\u003e\u003ctd\u003eأول جامعة أهلية حديثة في مصر\u003c/td\u003e\u003ctd\u003eنموذج للتعليم العالي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eتعليم الفتيات\u003c/td\u003e\u003ctd\u003e١٩٢٠-١٩٣٠م\u003c/td\u003e\u003ctd\u003eفتح مدارس البنات في المدن\u003c/td\u003e\u003ctd\u003eظهور المثقفات\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالتعليم المجاني\u003c/td\u003e\u003ctd\u003e١٩٥٠-١٩٦٠م\u003c/td\u003e\u003ctd\u003eالدول تجعله حقًا للجميع\u003c/td\u003e\u003ctd\u003eانخفاض الأمية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eحقوق المرأة\u003c/td\u003e\u003ctd\u003e١٩٥٠-١٩٧٠م\u003c/td\u003e\u003ctd\u003eالتصويت والعمل الوظيفي\u003c/td\u003e\u003ctd\u003eمشاركة سياسية واجتماعية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمسابقات العالمية\u003c/td\u003e\u003ctd\u003e٢٠١٠م-الآن\u003c/td\u003e\u003ctd\u003eشباب عرب في الابتكار\u003c/td\u003e\u003ctd\u003eعودة الثقة بالقدرات\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eعلموا رجلًا واحدًا تُنار به الدنيا من حوله، فالجهل عدو نفسه أولًا.\u003c/p\u003e\u003ccite\u003eحسن البنا\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eانتقل العرب في قرنٍ واحد من الأمية العامة إلى الجامعات والمدارس، وحصلت المرأة على حقوق لم تكن تحلم بها جداتها. لكن التعليم ما زال يحتاج إصلاحًا من الحفظ إلى التفكير، والمرأة ما زالت تحتاج إلى قوانين عادلة. وهما معًا مفتاح أي مستقبل حقيقي.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"media-digital","n":"الإعلام والرقمنة","ic":"📱","part":"الحاضر","h":"\u003carticle class=\"ch3\" id=\"media-digital\" data-toc=\"الإعلام والرقمنة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالحاضر\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٢ من ٧\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٥\u003ci\u003e.\u003c/i\u003e٢\u003c/span\u003e\n            \u003ch3\u003eالإعلام والرقمنة\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eمن المطبعة اليدوية إلى الصحافة الوطنية، ومن المذياع إلى الفضائيات والعالم الرقمي. لقد تغير الإعلام العربي تغيرًا جذريًا في القرن الأخير، وأصبح سلاحًا في يد من يملك المال والتكنولوجيا. وهو اليوم أداة وعيٍ أو أداة تضليلٍ حسب من يحمله.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eبدأت الصحافة العربية الحديثة في ظل الحملة الفرنسية على مصر حين أنشأ نابليون أول مطبعة عربية. ثم انتشرت الصحف في بيروت والقاهرة والإسكندرية، وصارت صوت الحركة الوطنية ضد الاستعمار. وقد أسس رفاعة الطهطاوي وأحمد فارس الشدياق وجورجي زيدان صحفًا علميةً وأدبيةً فتحت العقول على الفكر الحديث، وأصبحت الصحافة في القرن التاسع عشر أهم منبرٍ للنهضة.\u003c/p\u003e\u003cp class=\"ap\"\u003eومع الاستقلالات، رافق الإعلام الدولة: إذاعات وطنية وأجهزة إعلام رسمية تصوغ الرواية الوطنية. وكانت الإذاعة في الخمسينيات والستينيات أهم وسيلة وصلت إلى القرى النائية، وسمع الناس عبر إذاعة صوت العرب أخبار الثورات والاستقلالات. لكن الإعلام بقي خاضعًا لسيطرة الدولة ومعتمدًا على الخطاب الرسمي، لا يجرؤ على نقد الحكام ولا كشف الحقائق المتعلقة بالفقر والبطالة والقمع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوجاءت الفضائيات في التسعينيات فغيرت المعادلة تمامًا. فقد انطلقت الجزيرة والعربية والجزيرة الوثائقية والشروق وغيرها، وأصبح الناس يشاهدون قبلاتٍ إعلامية متعددة. ومعها انفتح النقاش العام وظهرت برامج الحوار المباشر، وبدأ الصحفيون يطرحون قضايا كانت محرّمة. وبرز في الوقت نفسه تأثيرٌ بارز للفضائيات الصغيرة على هوية الشعوب، وأصبح الإعلام جزءًا من السياسة أكثر منه مصدرًا للمعلومة.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالصحافة والفضائيات\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الصحافة العربية في القرن التاسع عشر جزءًا من النهضة؛ فجريدة الأهرام والوقائع المصرية والحديثة السورية وغيرها نشرت الفكر العقلاني وأخبار العلم والتقدم. وقد واجه الصحفيون الرقابة والمنع والمعتقلات لأنهم طبعوا الحقيقة، لكنهم كسروا حاجز الخوف وفتحوا الطريق أمام الصحافة الحديثة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي القرن العشرين، رافق المذياع الصحافة. فقد حملت إذاعة صوت العرب نداءات عبد الناصر إلى كل بيت عربي، وسمع الناس في صنعاء والدار البيضاء ودمشق الخطابات والقصائد الثورية. وكان صوت فيروز وعبد الوهاب وفيروز من راديو بيروت يوحّد المشاعر في فترة كانت الأمية فيها مرتفعة، فصار المذياع أداة تعليمٍ وترفيهٍ وسياسة في الوقت نفسه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوجاء التلفزيون في الستينيات والسبعينيات فأضاف الصورة. وشاهد العرب حروبهم وثوراتهم على الشاشة، وارتبطوا بأخبار المساء وبرامج المنوعات. ثم انفجرت الفضائيات في التسعينيات ففتحت الأفق على العالم، وأصبح المواطن العربي يشاهد ما يحدث في بلده من قناة معارضة في الخارج. وهكذا فقدت الدولة احتكارها للمعلومة، وصار المواطن نفسه قادرًا على الحكم على الأحداث.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالرقمنة والإعلام الجديد\u003c/h4\u003e\u003cp class=\"ap\"\u003eمع انتشار الإنترنت في السنوات الأخيرة من القرن العشرين، دخل الإعلام العربي عصرًا جديدًا تمامًا. فقد ظهرت المنتديات والمواقع الإلكترونية أولًا، ثم مواقع التواصل الاجتماعي بعد سنة ٢٠٠٥م، فصار كل مواطن قادرًا على نشر ما يشاء. وتحول الهاتف المحمول إلى كاميرا ومحرر صحفي في يد كل شخص، وظهر ما يُسمى بالأخبار الشعبية التي تنقل الحدث في لحظته.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان لمواقع التواصل أثرٌ مزدوج. فمن جهة، ساعدت في تنظيم احتجاجات وفضح انتهاكات ومعرفة حقائق كانت الدولة تخفيها. ومن جهة أخرى، أصبحت ساحة للأخبار الزائفة والخطاب المتطرف والحروب الإلكترونية التي تُدار من غرف مغلقة. وصارت هناك حسابات وهمية تروّج لروايات جماعية دون مصدر موثوق، واستُخدمت المنصات لتشويه السمعة وترويج الكراهية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ظهرت صناعة محتوى عربي على الإنترنت ومدونات صوتية ومرئية بلغة عربية سليمة. وهؤلاء الشباب هم جيل الإعلام الجديد، وهم اليوم ينافسون المؤسسات الإعلامية القديمة. والتحدي الكبير هو بناء إعلام رقمي موثوق يجمع بين أصالة اللغة العربية وسرعة الانتشار وصدق المعلومة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالإعلام العربي بين الحرية والسيطرة\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يزل الإعلام العربي يواجه تحديات بنيوية. ففي كثير من الدول، هناك قيود على حرية الصحافة وسجن للصحفيين وحجب للمواقع الإخبارية. وفي دول أخرى، تحول الإعلام إلى ساحة تجارية تبيع الإثارة والتصريحات المثيرة بدل المعلومة الموثوقة. وهذا ضعفٌ في الاحترافية وأزمة ثقة بين الجمهور والإعلام.\u003c/p\u003e\u003cp class=\"ap\"\u003eومع ذلك، ما زال في الإعلام العربي أصوات محترمة. فهناك صحفيون استقصائيون يكشفون الفساد والمخالفات رغم المخاطر، ومنابر رقمية مستقلة تصمد بالموارد القليلة، وأكاديميون يدرّبون الإعلاميين على المسؤولية. وهؤلاء يبنون يومًا بعد يوم مصداقية الإعلام العربي التي تراجعت في العقدين الماضيين بسبب التحيز والتضليل.\u003c/p\u003e\u003cp class=\"ap\"\u003eومستقبل الإعلام العربي يعتمد على دمج التقنية بالمسؤولية. فلم يعد مقبولًا أن يبقى الإعلام إما بوقًا رسميًا أو ساحة للفوضى. والمطلوب هو إعلام يحترم الذكاء ويحمل المعلومة الصادقة، ويحمي اللغة العربية من الانهيار في عصر الرموز والاختصارات. وأي إعلامٍ لا يحترم لغته لا يمكنه أن يحترم جمهوره.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمطبعة نابليون\u003c/b\u003e\u003cspan\u003eأول مطبعة عربية حديثة حملت أفكار النهضة إلى مصر وبلاد الشام.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eصوت العرب\u003c/b\u003e\u003cspan\u003eإذاعة عبد الناصر التي وصلت نداءاتها إلى كل بيت عربي في الخمسينيات.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالفضائيات\u003c/b\u003e\u003cspan\u003eغيرت المشهد الإعلامي في التسعينيات وكسرت احتكار الدولة للمعلومة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالإعلام الشعبي\u003c/b\u003e\u003cspan\u003eوسائل التواصل حولت كل مواطن إلى ناقل للحدث، لكنها فتحت باب الأخبار الزائفة.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمحطة\u003c/th\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eمطبعة مصر\u003c/td\u003e\u003ctd\u003e١٨٢٠م\u003c/td\u003e\u003ctd\u003eأول مطبعة عربية حديثة\u003c/td\u003e\u003ctd\u003eانطلاق الصحافة العربية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالأهرام\u003c/td\u003e\u003ctd\u003e١٨٧٥م\u003c/td\u003e\u003ctd\u003eصحيفة وطنية عريقة\u003c/td\u003e\u003ctd\u003eرقي مستوى الصحافة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eصوت العرب\u003c/td\u003e\u003ctd\u003e١٩٥٣م\u003c/td\u003e\u003ctd\u003eإذاعة الثورة المصرية\u003c/td\u003e\u003ctd\u003eتوحيد الوجدان العربي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالتلفزيون العربي\u003c/td\u003e\u003ctd\u003e١٩٦٠م\u003c/td\u003e\u003ctd\u003eبداية البث المرئي\u003c/td\u003e\u003ctd\u003eالصورة تدخل البيوت\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالفضائيات\u003c/td\u003e\u003ctd\u003e١٩٩٠-٢٠٠٠م\u003c/td\u003e\u003ctd\u003eالجزيرة والعربية وغيرها\u003c/td\u003e\u003ctd\u003eكسر احتكار الدولة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eوسائل التواصل\u003c/td\u003e\u003ctd\u003e٢٠١٠م-الآن\u003c/td\u003e\u003ctd\u003eفيسبوك وتويتر وإنستغرام\u003c/td\u003e\u003ctd\u003eإعلام بيد كل مواطن\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eالصحافة رسالةٌ قبل أن تكون تجارة، وصدقها في حقائقها لا في عناوينها.\u003c/p\u003e\u003ccite\u003eمحمد حسنين هيكل\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eمن الصحافة الوطنية إلى الفضائيات إلى الإعلام الرقمي، قطع الإعلام العربي مشوارًا طويلًا وكسر احتكار الدولة للمعلومة. لكنه اليوم يواجه أزمة مصداقية وحروب أخبار زائفة. والمطلوب هو إعلام حر ومحترف يحمل المعلومة الصادقة ويحرس لغته.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"identity-belonging","n":"الهوية والانتماء","ic":"🕌","part":"الحاضر","h":"\u003carticle class=\"ch3\" id=\"identity-belonging\" data-toc=\"الهوية والانتماء\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالحاضر\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٣ من ٧\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٥\u003ci\u003e.\u003c/i\u003e٣\u003c/span\u003e\n            \u003ch3\u003eالهوية والانتماء\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eمن أسئلة القرن الحادي والعشرين الأصعب: من نحن؟ عالمي أم عربي؟ مسلم أم قبلي؟ مواطن أم طائفي؟ فالهوية في عالم اليوم ليست مسلمة واحدة ثابتة، بل هي مجموعة طبقاتٍ تتزاحم في الفرد نفسه.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eفي القرن العشرين كانت الهوية واضحة نسبيًا: مواطن في دولة واحدة، ولغة واحدة، ودين غالب. لكن انهيار الخلافة وتقسيم المشرق والهجرات والعولمة جعلت السؤال معقدًا. فصار المواطن العربي يعيش بين هوية وطنية رسمية وهوية قومية وهوية دينية وهوية قبلية أو إثنية. وكلٌ منها يطالب بأولوية على الأخرى، والنتيجة صراعٌ داخلي في كل مجتمع. وقد أثبتت التجربة أن فرض هوية واحدة بالقوة لا يقتل الهويات الأخرى، بل يضمرها فتخرج لاحقًا أقوى وأعنف.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ظهر هذا الصراع بوضوح في تجارب الوحدة العربية التي فشلت، وفي الحروب الأهلية التي حملت أسماء طوائف وأقليات. فحين يعلو الولاء للطائفة على الولاء للوطن، تتحول الدولة إلى ساحة. وحين ينقسم المجتمع إسلاميون وعلمانيون، تصبح السياسة صراعًا وجوديًا لا برنامجًا. وقد دفع العالم العربي ثمنًا باهظًا من كل هذه الصراعات، وما زال يدفعه حتى الآن.\u003c/p\u003e\u003cp class=\"ap\"\u003eلكن التاريخ يعلمنا أن الهوية ليست متحفًا مغلقًا، بل هي ديناميكية تتطور. فالعربي في الأندلس كان يسبح أيضًا في الإسلام واللاتينية والأمازيغية. والمطلوب اليوم هو هوية جامعة تحترم التنوع ولا تُذوّبه، وتحتضن الانتماء الوطني دون أن تكفر الأصول. هويةٌ تجمع ولا تفرّق، وتفتح ولا تُغلق. وهي ليست حلولًا سحرية، بل هي عملٌ يومي يحتاج إلى تعليمٍ حقيقيٍ وإعلامٍ مسؤولٍ وسياسةٍ عادلة.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eطبقات الهوية\u003c/h4\u003e\u003cp class=\"ap\"\u003eتتكون هوية الفرد العربي اليوم من طبقات متعددة. هناك الانتماء للأسرة والقبيلة والوطن واللغة والدين والأمة والقارة والعالم. وهي طبقات تتراكم عبر الحياة ولا تلغي بعضها. والصحية هي التي يستطيع فيها الإنسان أن يجمع بينها دون صراع، فيقول أنا ابن قريتي ومواطن بلدي وناطق بلغتي ومؤمن بديني ومنفتح على العالم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ساعدت الهجرات في تعقيد هذه الطبقات. فالملايين من العرب يعيشون اليوم في أوروبا وأمريكا وأستراليا، وأبناؤهم يولدون بين لغتين وثقافتين. وهؤلاء ليسوا أقل عروبةً ولا أقل انتماءً، بل هم جسرٌ بين حضارات. وأظهرت الدراسات أن الهوية المزدوجة ليست مرضًا، بل هي ثراء عندما يديرها الإنسان بوعي.\u003c/p\u003e\u003cp class=\"ap\"\u003eكما أن الأقليات القومية والدينية في العالم العربي تطرح تساؤلاتها الخاصة. فقد يريد الأكراد والأمازيغ في دولهم الاعتراف بلغتهم وثقافتهم داخل الدولة الوطنية. والنصارى العرب يطالبون بمواطنة كاملة دون تمييز. والتحدي هو كيف تُدير الدولة التنوع دون أن تفقد وحدتها.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالقومية والدين والوطن\u003c/h4\u003e\u003cp class=\"ap\"\u003eطوال القرن العشرين، سادت ثلاث رؤى للهوية: القومية العربية التي صنعها العروبيون، والدين الإسلامي الذي حمله الإخوان المسلمون والحركات الإسلامية، والوطنية التي دافعت عنها الدول المستقلة. وقد تصارعت هذه الرؤى مرارًا، وفشلت كل محاولة لفرض رؤية واحدة على الجميع بالقوة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت تجربة عبد الناصر مثال القومية العربية في أوجها، وكذلك كانت تجربة المملكة العربية السعودية مثال الدولة الوطنية الدينية. لكن السنوات كشفت أن الإنسان يحتاج أكثر من شعار. فهو يريد مدرسةً لأبنائه ومستشفىً ورزقًا وأمناً. وأي هوية لا تقدم له هذه الخدمات الحقيقية تصبح مجرد خطاب.\u003c/p\u003e\u003cp class=\"ap\"\u003eواليوم يتجه الشباب العربي إلى هوياتٍ مركّبة ومفتوحة. فهو يستمتع بالمسلسلات التركية والكورية والعالمية، ويتعلم اللغات الأجنبية، ويوظف التقنية، ومع ذلك يبقى متشبعًا بقيم عائلته وذكرياته الأولى. وهذه الهوية المختلطة هي مستقبل المنطقة لا شك، لأنها تسمح بالعيش معًا دون أن يفرض أحد هويته على الآخر.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالهوية في عصر العولمة\u003c/h4\u003e\u003cp class=\"ap\"\u003eأمام موجة العولمة التي تجرف كل شيء، يخاف كثيرون على هويتهم ولغتهم وتراثهم. فالعربية اليوم في مواجهة منافسة شرسة مع الإنجليزية على الإنترنت ووسائل التواصل. وقد بدأت تظهر الكتابة العربية بالحروف اللاتينية في المحادثات الرقمية، وهي ظاهرة تثير قلق اللغويين على المدى البعيد.\u003c/p\u003e\u003cp class=\"ap\"\u003eلكن التاريخ يظهر أن الثقافات لا تموت بانفتاحها، بل تموت بانكمامها. فالعربية امتصت الفارسية والتركية من قبل وأثّرت فيها. والتحدي الآن ليس إغلاق الأبواب، بل تجديد الخطاب العربي ليواكب العالم دون أن يفقد روحه. وهذا يتطلب استثمارًا في التعليم والإعلام والفنون لا مجرد شعارات.\u003c/p\u003e\u003cp class=\"ap\"\u003eوهكذا تصبح الهوية في القرن الحادي والعشرين ليست سؤالًا نظريًا بل سؤالًا عمليًا: هل نستطيع أن نربي أبناءنا على لغتهم وتراثهم وثقتهم بأنفسهم ونفتحهم على العالم؟ من يفعل ذلك، سيصنع هويةً حقيقية لا كرتونية. ومن يفشل، سيضيع بين عولمة لا تحترمه وماضٍ لا يفهمه.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eطبقات الهوية\u003c/b\u003e\u003cspan\u003eأسرة وقبيلة ووطن ودين وأمة وعالم؛ طبقاتٌ متعددة لا يلغي بعضها بعضًا.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eصراع الهويات\u003c/b\u003e\u003cspan\u003eطوال القرن العشرين تصارعت القومية والدين والوطنية، وفشلت كل محاولة لفرض رؤية واحدة بالقوة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالهجرة والهوية المزدوجة\u003c/b\u003e\u003cspan\u003eملايين العرب في الخارج يبنون هويات مزدوجة، وهي ثراءٌ لا مرض حين تُدار بوعي.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالعولمة\u003c/b\u003e\u003cspan\u003eاللغة العربية تواجه تحديات العولمة، والحل هو التجديد لا الانكماش.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالرؤية\u003c/th\u003e\u003cth\u003eالمرجع\u003c/th\u003e\u003cth\u003eالسؤال\u003c/th\u003e\u003cth\u003eمصيرها\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالقومية العربية\u003c/td\u003e\u003ctd\u003eميشيل عفلق وساطع الحصري\u003c/td\u003e\u003ctd\u003eمن نحن؟ عرب\u003c/td\u003e\u003ctd\u003eأضعفتها الأحزاب والدول\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالهوية الإسلامية\u003c/td\u003e\u003ctd\u003eالحركات الإسلامية\u003c/td\u003e\u003ctd\u003eأنا مسلم\u003c/td\u003e\u003ctd\u003eتحولت قضية سياسية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالوطنية\u003c/td\u003e\u003ctd\u003eالدول المستقلة\u003c/td\u003e\u003ctd\u003eأنا مواطن\u003c/td\u003e\u003ctd\u003eالأقرب إلى الاستمرار\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالهوية المزدوجة\u003c/td\u003e\u003ctd\u003eالعرب في المهجر\u003c/td\u003e\u003ctd\u003eأنا الاثنان\u003c/td\u003e\u003ctd\u003eتتزايد بالملايين\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالهوية المفتوحة\u003c/td\u003e\u003ctd\u003eجيل الشباب الرقمي\u003c/td\u003e\u003ctd\u003eأنا مركّب\u003c/td\u003e\u003ctd\u003eمستقبل المنطقة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eالانتماء الذي يُبنى على كراهية الآخرين ليس وطنية، بل هو مرضٌ يتخفى في ثوب الحرص.\u003c/p\u003e\u003ccite\u003eعبد الوهاب المسيري\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eالهوية العربية اليوم طبقات متعددة تتزاحم في الإنسان نفسه، ولا يمكن فرض واحدة على الآخرين. والصحيح هو هوية جامعة تحترم التنوع وتحتضن الوطن دون أن تذوب الأصول. ومن ينجح في هذا، يبني مستقبلًا حقيقيًا لا يخاف على نفسه.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"arab-spring","n":"الربيع العربي ومستقبل المنطقة","ic":"✊","part":"الحاضر","h":"\u003carticle class=\"ch3\" id=\"arab-spring\" data-toc=\"الربيع العربي ومستقبل المنطقة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالحاضر\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٤ من ٧\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٥\u003ci\u003e.\u003c/i\u003e٤\u003c/span\u003e\n            \u003ch3\u003eالربيع العربي ومستقبل المنطقة\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eفي سنة ٢٠١١م اهتزت المنطقة كلها من تونس إلى صنعاء، وخرج الملايين يطالبون بالكرامة والحرية والديمقراطية. كانت ثورات فريدة في التاريخ العربي، لكن نتائجها المختلطة تظل أكبر درس في العصر الحديث.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eبدأت الثورة التونسية في ١٧ ديسمبر سنة ٢٠١٠م حين أحرق محمد البوعزيزي نفسه احتجاجًا على الظلم والبطالة. وانتقلت الشرارة إلى كل المدن، فأُسقط نظام زين العابدين بن علي في أسابيع. ثم انتقلت إلى مصر فخرج الملايين إلى ميدان التحرير، وأُسقط حسني مبارك في ١١ فبراير ٢٠١١م. وستبقى هاتان الثورتان أكبر ما شهده التاريخ العربي الحديث، لأنهما أثبتتا أن الحاكم المستبد يمكن أن يسقط بأيدي شعبه.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم انتقل العدوى إلى ليبيا واليمن وسوريا والبحرين. اختلفت النتائج من بلد لآخر: فتونس بنت ديمقراطيةً دستورية، وليبيا غرقت في فوضى الميليشيات، واليمن انغمس في حربٍ أهليةٍ مفتوحة، وسوريا تحولت إلى أكبر كارثة إنسانية في تاريخها. أما البحرين فقد قمع الاحتجاج بدعم خارجي، وبقيت الأمور كما كانت تقريبًا. ولكل منها حكايةٌ مختلفةٌ علّمتها شعوبها دروسًا لا تُنسى من نفسها ومن أخواتها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوعلى مدى السنوات التالية، كشف الربيع العربي عن جمود الدولة العربية العميق: جيش لا يقبل التحرك، واقتصاد لا يتحمل الإصلاح، وجهاز أمني يعتقل من ينتقد. وهذه هي الدرسة الأكبر التي ما زالت المنطقة تتعلم منها. فالثورات تُسقط الأنظمة بسهولة، لكنها لا تبني بديلًا إلا إذا كان هناك نضج أهلي ومؤسسي حقيقي. وهذا هو الفرق بين ثورة ناجحةٍ تُنتج دولة، وثورةٌ فاشلةٌ تُنتج فوضى.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eتونس ومصر ومهد الثورة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الاحتجاج التونسي أول شرارة. فقد جاء شباب الإنترنت إلى الشوارع بالمطالبة بالعمل والحرية، وسقط النظام في أقل من شهر. وقد نجحت تونس وحدها في الانتقال إلى نظام ديمقراطي دستوري، وأنشأت انتخابات حرة وبرلمانًا دستوريًا ونقابات حرة. وهي اليوم أكبر نجاح للربيع العربي رغم الصعوبات الاقتصادية.\u003c/p\u003e\u003cp class=\"ap\"\u003eأما مصر فكانت الثورة الثانية. ففي يوم ٢٥ يناير خرج الملايين إلى الميدان، ووافق الجيش على إسقاط مبارك. لكن بعد سنة واحدة، عاد الجيش ليقلب المشهد كله ويعيد ما يشبه النظام القديم. وهكذا خسر المصريون فرصة التحول الديمقراطي التي وعدوا بها، وبقيت البلاد على نمط التنمية والاستقرار الأمني بدل الحرية الحقيقية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوهذا لا يعني أن الثورات كانت عبثًا. فقد كسرت الثورة حاجز الخوف، وأثبتت أن الملايين قادرة على إسقاط نظام بالقوة الشعبية وحدها. وكانت هذه أهم مفاجأة في القرن العربي الجديد: أن الشعب ليس أبدًا مجرد أداةٍ بيد السلطة، بل هو فاعلٌ يصعب تجاهله. وهذا الدرس وحده يستحق كل ما دفعه شعب من أجل التغيير من ثمن.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eليبيا واليمن وسوريا\u003c/h4\u003e\u003cp class=\"ap\"\u003eفي ليبيا، قُتل القذافي على يد الثوار بعد صراع طويل مع تدخل حلف الأطلسي. لكن البلاد دخلت حربًا أهليةً بين الميليشيات والإمارات والحكومات المتنازعة. وما زالت ليبيا اليوم دولة فاشلة بسلاحين ونفط وحدود مفتوحة، وهي أكبر خسارة للربيع العربي بسبب الفوضى التي أعقبت النظام.\u003c/p\u003e\u003cp class=\"ap\"\u003eأما اليمن فقد بدأت الثورة سلمية كما تونس ومصر. لكن صالح ترك السلطة لدولة حكمتها الميليشيات الحوثية التي تحالفت مع الجيش. وبعد سنوات، اندلعت حرب مدمرة بين الحكومة المعترف بها والحوثيين المدعومين إيرانيًا. وقد أدت هذه الحرب إلى واحدة من أسوأ الأزمات الإنسانية في العالم المعاصر، بمجاعة وكوليرا وموت آلاف الأطفال.\u003c/p\u003e\u003cp class=\"ap\"\u003eوسوريا هي الأفظع. فقد قوبلت الثورة بإطلاق النار والتعذيب والبراميل المتفجرة. وتحول النزاع إلى حرب إقليمية ودولية، وقتل فيها أكثر من نصف مليون شخص وشرد أكثر من نصف السكان. وصارت سوريا دولة محطمة تحت قواعد روسية وإيرانية وتركية، وأعادها النظام إلى الجامعة العربية بعد سنوات من العزلة. وما زال مصير سوريا معلقًا بين إعادة توحيد وطني وبقاء التقسيم.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eمستقبل المنطقة بين الأمل واليأس\u003c/h4\u003e\u003cp class=\"ap\"\u003eاليوم، وبعد أكثر من عشر سنوات على الربيع العربي، يعيش العالم العربي مرحلةً جديدة. فثوراته لم تصل إلى ما كانت تطمح إليه في معظم البلدان، لكنها غيرت المجتمع إلى الأبد. فالناس لم يعد أحد يخافون من قول كلمة الحق علنًا، وأصبح الرأي العام لاعبًا لا يمكن تجاهله حتى في الحالات التي أخمدت التغيير السياسي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوتواجه المنطقة تحديات هائلة: أزمات اقتصادية، نزاعات إقليمية، تغير مناخي، وبطالة بين الشباب. لكن هناك مؤشرات أمل أيضًا: تونس التي تحاول الحفاظ على دستورها، والمغرب بطريقته الخاصة في الإصلاح التدريجي، والخليج الذي يحاول تنويع اقتصاده وتغيير صورة مجتمعه. والجيل العربي الجديد أكثر تعليمًا ووعيًا من أي وقت مضى.\u003c/p\u003e\u003cp class=\"ap\"\u003eولن يكون مستقبل المنطقة نسخة من أمريكا أو أوروبا. سيكون مزيجًا من التراث والحداثة والخصوصية العربية، حيث تلعب المرأة والشباب دورها الكامل. والمهم أن يتعلم الجميع دروس الربيع: أن التغيير الحقيقي يحتاج إلى بناء مؤسسات لا الاكتفاء بإسقاط أنظمة. فبدون ذلك، لن تتحول الأحداث إلا إلى مواسم جديدة من الفوضى والإحباط.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالبوعزيزي\u003c/b\u003e\u003cspan\u003eإحراق محمد البوعزيزي لنفسه سنة ٢٠١٠م أشعل الثورة في العالم العربي كله.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eميدان التحرير\u003c/b\u003e\u003cspan\u003eأكثر أيقونات الربيع العربي حضورًا، وكان يحلم بمصر ديمقراطية حقيقية.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالربيع والمآسي\u003c/b\u003e\u003cspan\u003eتونس نجحت نسبيًا، وسوريا واليمن وليبيا غرقت في الكارثة بعد الثورة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eدروس الربيع\u003c/b\u003e\u003cspan\u003eالتغيير الحقيقي يحتاج بناء مؤسسات لا مجرد إسقاط أنظمة؛ هذا أهم ما تعلمته المنطقة.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالبلد\u003c/th\u003e\u003cth\u003eبداية الثورة\u003c/th\u003e\u003cth\u003eالنتيجة\u003c/th\u003e\u003cth\u003eالمصير\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eتونس\u003c/td\u003e\u003ctd\u003eديسمبر ٢٠١٠م\u003c/td\u003e\u003ctd\u003eسقوط بن علي\u003c/td\u003e\u003ctd\u003eديمقراطية دستورية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eمصر\u003c/td\u003e\u003ctd\u003eيناير ٢٠١١م\u003c/td\u003e\u003ctd\u003eسقوط مبارك\u003c/td\u003e\u003ctd\u003eعودة النظام العسكري\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eليبيا\u003c/td\u003e\u003ctd\u003eفبراير ٢٠١١م\u003c/td\u003e\u003ctd\u003eسقوط القذافي\u003c/td\u003e\u003ctd\u003eدولة فاشلة وميليشيات\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eاليمن\u003c/td\u003e\u003ctd\u003eفبراير ٢٠١١م\u003c/td\u003e\u003ctd\u003eرحيل صالح\u003c/td\u003e\u003ctd\u003eحرب أهلية وكارثة إنسانية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eسوريا\u003c/td\u003e\u003ctd\u003eمارس ٢٠١١م\u003c/td\u003e\u003ctd\u003eثورة شعبية\u003c/td\u003e\u003ctd\u003eأكبر كارثة في التاريخ العربي الحديث\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالبحرين\u003c/td\u003e\u003ctd\u003eفبراير ٢٠١١م\u003c/td\u003e\u003ctd\u003eاحتجاج شعبي\u003c/td\u003e\u003ctd\u003eقمع وتباطؤ إصلاحي\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eالربيع العربي لم يكن وهمًا، لكن الذين جاؤوا بعده لم يكونوا قادرين على بناء ما حلم به الناس.\u003c/p\u003e\u003ccite\u003eعادل الخميسي\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eكان الربيع العربي أكبر حركة شعبية في تاريخ العالم العربي، وأسقطت أنظمةً صمدت لعقود. لكنها في معظم البلدان لم تبني بديلًا ديمقراطيًا، وغرقت ليبيا وسوريا واليمن في الكارثة. والدرس الأكبر أن التغيير يحتاج مؤسسات لا مجرد احتجاجات.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"economy-rentier","n":"الاقتصاد: من الريع إلى التنويع","ic":"🏗️","part":"الحاضر","h":"\u003carticle class=\"ch3\" id=\"economy-rentier\" data-toc=\"الاقتصاد: من الريع إلى التنويع\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالحاضر\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٥ من ٧\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٥\u003ci\u003e.\u003c/i\u003e٥\u003c/span\u003e\n            \u003ch3\u003eالاقتصاد: من الريع إلى التنويع\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eكيف تحوّل اقتصاد المنطقة بعد النفط، وما ثمن الاعتماد على مصدر واحد للدخل؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eقبل النفط كان اقتصاد المنطقة زراعياً وتجارياً في أغلبه: نخيل في العراق والخليج، وحبوب في الشام والجزيرة، وقوافل تعبر الصحراء بين موانئ البحر المتوسط والبحر الأحمر. ثم تغيّر كل شيء في نصف قرن. فبعد أول بئر تجاري في مسجد سليمان بإيران سنة ١٩٠٨، ثم حقول كركوك والدمام والبرقان في العقود التالية، صارت المنطقة أكبر مصدر للنفط في العالم، وتحوّلت دولٌ كانت تعيش على الرعي والتجارة إلى دولٍ تملك ميزانيات تفوق ميزانيات دول أوروبية بعدد سكان أقل، وإلى مجتمعاتٍ تغيّرت فيها المدن والطرق والمدارس والجامعات في جيل واحد لا أكثر.\u003c/p\u003e\u003cp class=\"ap\"\u003eهذا التحوّل أنتج نمطاً اقتصادياً يُعرف بالدولة الريعية: دولة لا تعتمد على الضرائب التي يدفعها مواطنوها، بل على عائدات تصدير مادة أولية واحدة. ومن هنا تتغيّر علاقة الدولة بالمجتمع: فحين لا تُجبى الضرائب، يضعف الارتباط بين المشاركة السياسية والتمثيل، ويصبح التوزيع الاجتماعي يمرّ عبر الوظائف العامة والدعم والأجور لا عبر الخدمات المقابلة للضريبة. وهذا ليس حكماً أخلاقياً على أحد، بل وصفٌ لبنية مالية تنعكس على كل شيء: على الإدارة، وعلى سوق العمل، وعلى ثقافة العمل نفسها، وعلى الطريقة التي يُفكّر بها الناس في الدولة ودورها.\u003c/p\u003e\u003cp class=\"ap\"\u003eومنذ السبعينيات بدأت محاولات التنويع: صناعات بتروكيماوية وألمنيوم وأسمدة تعتمد على الطاقة الرخيصة، ثم مدن صناعية وموانئ ومناطق حرة، ثم سياحة ولوجستيات وخدمات مالية. وفي السنوات الأخيرة صار التنويع مشروعاً رسمياً معلناً في أكثر من دولة، تُرجم إلى خططٍ مثل رؤية المملكة ٢٠٣٠، وصناديق سيادية ضخمة تستثمر الفائض في أصول خارجية وداخلية، وخصخصة لقطاعات كانت حكراً على الدولة، وبرامج لدعم المشاريع الصغيرة وتوطين الوظائف. والهدف المعلن واحد في كل التجارب: أن يصبح النفط مورداً مساعداً لا مورداً وحيداً.\u003c/p\u003e\u003cp class=\"ap\"\u003eلكن ثمن الاعتماد على مصدر واحد يظهر سريعاً: كل هبوط في أسعار النفط يتحوّل إلى عجز في الموازنة، وكل صعود يخفي مشكلات الإنتاجية. وتضاف إلى ذلك بطالة الشباب، والفجوة بين مخرجات التعليم ومتطلبات السوق، وهجرة الكفاءات إلى أوروبا وأمريكا الشمالية، واعتماد كبير على العمالة الوافدة في القطاع الخاص. وهذه الأربعة معاً هي امتحان التنويع الحقيقي: ليس في بناء المصانع والمباني، بل في بناء إنسانٍ يستطيع أن يعمل فيها ويبدع، وفي مؤسساتٍ تُحاسب وتُنفّذ لا تُعلن وتنسى.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي مقابل الصورة الكبيرة، ظهر في السنوات الأخيرة قطاعٌ صغير سريع الحركة: شركات تقنية ومتاجر إلكترونية وخدمات مالية عبر الهاتف، يعمل فيها شباب بأقل رأس مال وأكثر مهارة. وقد أثبت هذا القطاع أن الطلب موجود، وأن العقبة ليست في الأفكار بل في التمويل والتنظيم والثقة. ولذلك تتسابق الدول الآن على تسهيل تأسيس الشركات، وتخفيف الإجراءات، وإدخال الدفع الإلكتروني، لأن الوظيفة التي تُخلق في شركةٍ صغيرة أرخص على الخزينة من وظيفةٍ في القطاع العام، وأكثر إنتاجاً منها على المدى الطويل.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eكيف يعمل الريع؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eالعائد الريعي يأتي من الخارج مباشرة إلى خزينة الدولة، لا من جهدٍ موزّع على ملايين المنتجين. وهذا يعني أن القرار الاقتصادي يتركز في مركز واحد، وأن القطاع الخاص ينمو في الغالب حول الإنفاق الحكومي لا حول السوق. فحين تكون الدولة هي المشتري الأكبر والمشغّل الأكبر، يصبح النجاح في التجارة مرتبطاً بالقرب من الدولة أكثر من ارتباطه بالكفاءة والإبداع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوللريع وجه آخر لا يُذكر كثيراً: إنه يمنح الدولة قدرةً هائلة على الاستجابة السريعة للأزمات، فتبني البنية التحتية في سنوات، وتدعم أسعار الغذاء والوقود، وتستورد الدواء عند الحاجة بلا انتظار. وهذا ما يجعل بعض الدراسات تصف الريع بأنه «نعمة تُعطّل»: يعطي موارد ضخمة، ويُضعف في الوقت نفسه الحوافز التي تصنع الاقتصادات المنتجة على المدى الطويل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد جرّبت دولٌ عربية الخروج من هذا النمط بطرق مختلفة: بعضها عبر التصنيع الثقيل، وبعضها عبر الخدمات المالية والسياحة، وبعضها عبر تصدير الكفاءات وتحويلاتها، وبعضها عبر التجارة وإعادة التصدير. والنتيجة المشتركة أن التنويع ينجح حين يقوم على مؤسساتٍ تحاسب وتُنفّذ، لا حين يقوم على مشاريع تُعلن ولا تُتابع، ولا حين يُقاس النجاح بعدد الاتفاقيات الموقّعة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالصناديق السيادية\u003c/h4\u003e\u003cp class=\"ap\"\u003eأُنشئت أول الصناديق السيادية في المنطقة في الخمسينيات، ثم تكاثرت بعد طفرة النفط الأولى، لتحويل الفائض المالي إلى أصول تُدرّ دخلاً للأجيال القادمة. وهي اليوم من أكبر المستثمرين في العالم، وتملك حصصاً في شركات وبنوك وموانئ وتقنية في أربع قارات، وتُدار من مكاتب في لندن ونيويورك وسنغافورة لا تقلّ خبرتها عن أكبر مؤسسات الاستثمار العالمية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوظيفتها المعلنة ثلاثية: استقرار المالية العامة عند تقلّب الأسعار، وتنويع مصادر الدخل عبر عوائد الاستثمار، وتمويل التحوّل الاقتصادي داخلياً. لكن وظيفتها غير المعلنة أهم: أنها تفصل بين الإيراد النفطي والإنفاق الجاري، فتحفظ جزءاً من الثروة من الضغط السياسي والاجتماعي المباشر، وتُتيح للدولة أن تقول «لا» لبعض المطالب اليومية بحجّة أن المال للأجيال القادمة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالسؤال الذي يواجه هذه الصناديق ليس حجم أصولها، بل أثرها الداخلي: هل تموّل صناعاتٍ جديدة أم تكتفي بشراء أصول قائمة في الخارج؟ وهل تبني قدرة إدارية محلية أم تستوردها بعقود إدارة؟ وهل شفافيتها وحوكمتها تكفي لتحويلها من صندوق دولة إلى مؤسسة وطنية تُحاسب أمام الناس؟ والإجابة عن هذه الأسئلة هي الفرق بين ثروةٍ تُدار وثروةٍ تُخزَّن.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eسؤال الإنتاجية\u003c/h4\u003e\u003cp class=\"ap\"\u003eالإنتاجية هي حاصل قسمة الناتج على ساعة العمل، وهي المقياس الحقيقي لثراء الأمم على المدى الطويل. وفي معظم اقتصادات المنطقة ما زالت الإنتاجية أقل من متوسط العالم، والسبب ليس نقص رأس المال ولا نقص المشاريع، بل ضعف الربط بين الأجر والعمل، واتساع القطاع العام، وسيادة أنماط عمل لا تُقاس بالنتيجة بل بالحضور والاستمرار في الوظيفة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوتظهر المشكلة أوضح ما تكون في التعليم: عدد الخريجين يتزايد كل عام، لكن كثيراً منهم يخرج إلى سوق لا يجد فيه ما دُرّب عليه، فتقع البطالة في تخصصاتٍ يوجد فيها شغفٌ في تخصصات أخرى. وهذا ما يسميه الاقتصاديون «فجوة المهارات»، وهي أخطر من فجوة الدخل لأنها تُنتج البطالة مع وجود وظائف شاغرة في الوقت نفسه، فيُستقدم العامل الأجنبي وتُترك اليد المحلية عاطلة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالحل ليس في مزيد من الشهادات ولا في مزيد من المؤتمرات، بل في ربط التدريب بالسوق، وفي تعليمٍ يُعلّم التفكير والتحليل لا الحفظ والتلقين، وفي قطاعٍ خاص يُحاسب لا يُدعَم، وفي ثقافةٍ تُقدّر العمل المهني كما تُقدّر الوظيفة المكتبية. وهذه كلها إصلاحاتٌ مؤسسية وثقافية، لا مشاريعُ افتتاحية، ولذلك تحتاج وقتاً أطول من عمر الحملات الإعلامية والاحتفالات.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالدولة الريعية\u003c/b\u003e\u003cspan\u003eاقتصاد يعتمد على عائد مادة أولية واحدة تصل إلى الخزينة من الخارج، لا على ضرائب المواطنين.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمسجد سليمان\u003c/b\u003e\u003cspan\u003eأول بئر نفط تجاري في المنطقة، سنة ١٩٠٨ في إيران.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالصناديق السيادية\u003c/b\u003e\u003cspan\u003eمؤسسات تستثمر الفائض النفطي في أصول داخلية وخارجية لحماية الأجيال القادمة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eفجوة المهارات\u003c/b\u003e\u003cspan\u003eاختلال بين ما يخرجه التعليم وما يطلبه سوق العمل، يُنتج بطالة مع وظائف شاغرة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالتنويع\u003c/b\u003e\u003cspan\u003eتحويل الاقتصاد من مصدر دخل واحد إلى قطاعات متعددة منتجة، وهو مشروع طويل لا حملة.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمرحلة\u003c/th\u003e\u003cth\u003eالاقتصاد الغالب\u003c/th\u003e\u003cth\u003eالتحدي\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eقبل النفط\u003c/td\u003e\u003ctd\u003eزراعة وتجارة عبور\u003c/td\u003e\u003ctd\u003eقلة رأس المال والبنية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eبعد الاكتشاف\u003c/td\u003e\u003ctd\u003eتصدير خام\u003c/td\u003e\u003ctd\u003eالاعتماد على مصدر واحد\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالتصنيع الأولي\u003c/td\u003e\u003ctd\u003eبتروكيماويات وأسمدة\u003c/td\u003e\u003ctd\u003eالقيمة المضافة المنخفضة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالتنويع الحالي\u003c/td\u003e\u003ctd\u003eخدمات ولوجستيات وسياحة\u003c/td\u003e\u003ctd\u003eالمهارات والإنتاجية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمرحلة القادمة\u003c/td\u003e\u003ctd\u003eتقنية ومعرفة\u003c/td\u003e\u003ctd\u003eالبحث والتطوير والتعليم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالخطر الدائم\u003c/td\u003e\u003ctd\u003eعودة الريع\u003c/td\u003e\u003ctd\u003eتقلّب أسعار النفط\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eالاقتصاد الذي يقوم على مصدر واحد لا يُقاس بعدد مصانعه، بل بعدد العاملين فيه الذين يستطيعون البقاء بلا دعم.\u003c/p\u003e\u003ccite\u003eخلاصة تحليلية — قسم الحاضر\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eانتقلت المنطقة في نصف قرن من اقتصاد القوافل إلى اقتصاد النفط، وصارت ميزانياتها من الأكبر في العالم. لكن الريع أعطى الموارد وأضعف الحوافز، فبقي سؤال التنويع معلّقاً على الإنتاجية والتعليم لا على المشاريع. والدرس أن الثروة تُبنى بالمؤسسات، لا بالعائد وحده.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"cities-migration","n":"المدن والهجرة والتوسع الحضري","ic":"🏙️","part":"الحاضر","h":"\u003carticle class=\"ch3\" id=\"cities-migration\" data-toc=\"المدن والهجرة والتوسع الحضري\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالحاضر\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٦ من ٧\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٥\u003ci\u003e.\u003c/i\u003e٦\u003c/span\u003e\n            \u003ch3\u003eالمدن والهجرة والتوسع الحضري\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eكيف انتقلت المنطقة من الريف إلى المدينة في جيلين، وما الذي تغيّر في الأسرة والعمل والهوية؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eفي منتصف القرن العشرين كان أكثر من ثلثي سكان المنطقة يعيشون في القرى ويعملون في الزراعة والرعي. واليوم تجاوزت نسبة الحضر ستين في المائة في معظم الدول، وبلغت في بعضها تسعين. وقد نمت مدنٌ عربية من مئات الآلاف إلى عشرات الملايين في أقل من جيلين: القاهرة وبغداد والدار البيضاء والرياض وإستانبول، وصارت المنطقة من أسرع مناطق العالم تحضراً، وصار أكثر ما يعرفه الإنسان المعاصر فيها أنه ابن مدينة، حتى إن أصوله الريفية تحوّلت إلى ذاكرةٍ تُروى لا إلى واقعٍ يُعاش.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالسبب في هذا الانفجار الحضري مركّب: هجرة من الريف بسبب ضعف الزراعة وتفتّت الحيازات وتقلّب الأمطار، وطفرة سكانية خفّضت وفيات الأطفال وبقيت الولادات مرتفعة، وفرص عمل في المدن مع توسّع الدولة والإدارة والخدمات والجيش والتعليم. وهكذا انفصلت الأسر عن أرضها في جيل واحد، وانتقلت من علاقةٍ بالأرض والماء والموسم إلى علاقةٍ بالراتب والوظيفة والتقويم الإداري، وهو تحوّلٌ في العقل قبل أن يكون في المكان.\u003c/p\u003e\u003cp class=\"ap\"\u003eواستقبلت المدن هذا النمو ببنيةٍ تحتية لم تُصمّم له: شبكات مياه وصرف قديمة، ونقل عام ضعيف، ومساكن لا تكفي، ومدارس ومستشفيات تُبنى بعد أن يمتلئ الحي. فنشأت حول المدن أحياء غير مخططة تُسمّى عشوائيات، يسكنها في بعض العواصم ملايين، وتفتقد الملكية الموثقة والخدمات المنتظمة والطرق الواسعة. وهي ليست شذوذاً في المدينة، بل هي الطريقة التي استجابت بها المدينة لنموٍّ أسرع من تخطيطها ومن قدرة الدولة على البناء.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم جاءت الهجرة الخارجية: ملايين العمال من مصر والشام والمغرب إلى الخليج وأوروبا، وملايين اللاجئين في العقود الأخيرة من مناطق الحروب. وأصبحت التحويلات المالية من المغتربين ركناً في ميزان المدفوعات لعدد من الدول، تتفوق أحياناً على عائدات السياحة والتصدير. وفي هذا كله تتغيّر الأسرة: أبوةٌ عن بُعد، وتربيةٌ بالهاتف والتحويلات، وجيلٌ ثانٍ يعيش بين لغتين وثقافتين، ويعود إلى بلد أبيه زائراً لا مقيماً.\u003c/p\u003e\u003cp class=\"ap\"\u003eوثمّة أثر لا يُقاس بالأرقام: تغيّر معنى الجيرة. ففي القرية كان الجار قريباً في النسب والمسافة والعمل، وفي المدينة صار الجار مجهولاً يسكن خلف بابٍ مغلق، وانتقلت شبكة الأمان الاجتماعي من الحارة إلى الدولة ثم إلى الهاتف. ومن هنا جاءت المجمعات السكنية المغلقة، وهي محاولة لاستعادة «الحارة» بثمنٍ يُدفع، فتحوّلت المدينة إلى طبقاتٍ منعزلة بدل أن تكون فضاءً مشتركاً يجمع الفقير والغني في شارعٍ واحد ومدرسةٍ واحدة.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالعشوائيات: مدينة داخل المدينة\u003c/h4\u003e\u003cp class=\"ap\"\u003eالأحياء غير المخططة تُبنى بالجهد الذاتي، بلا ترخيص ولا تخطيط مسبق، وتنمو طابقاً فوق طابق كلما كبرت الأسرة واحتاجت ابناً إلى غرفة. وهي تقدّم حلاً سكنياً رخيصاً لملايين لا يستطيعون سعر السوق، وتقدّم في الوقت نفسه مشكلةً في البنية والسلامة والملكية والخدمات، فلا تُمدّ إليها الشبكة بسهولة ولا يُوثّق فيها بيت.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد جرّبت دولٌ عربية حلولاً متباينة: الإزالة والنقل إلى مدن بديلة، أو التطوير في المكان بتسوية الملكية وإدخال المرافق وتوسيع الطرق. والتجربة تُظهر أن التطوير في المكان أقل كلفةً اجتماعياً واقتصادياً من الإزالة، لأنه يحفظ شبكات الجيرة والعمل والمدارس القريبة، وهي أشياء لا تُعوّض بشقةٍ جديدة في أطراف بعيدة عن كل شيء.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالمشكلة الحقيقية أن العشوائيات ليست سبب الأزمة بل عرضها: أزمة سكنٍ ناتجة عن سوق عقار لا يُنتج مسكناً رخيصاً، وعن تخطيطٍ يمنح الأرض للمشاريع الكبرى ويترك الفقراء يبنون لأنفسهم على أطراف المدينة بلا عون ولا تنظيم. ومعالجة السبب تبدأ من سياسة أرضٍ وسكنٍ تُنتج للفقراء قبل الأغنياء.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالتحويلات المالية\u003c/h4\u003e\u003cp class=\"ap\"\u003eتحويلات المغتربين مبلغٌ لا يُرى في الميزانية ولا في الجمارك، لكنه يدخل بيوتاً بالملايين ويُنفق على الطعام والتعليم والعلاج والبناء والزواج. وهو أكثر استقراراً من الاستثمار الأجنبي، لأنه لا يهرب عند أول أزمة سياسية، بل يزيد أحياناً لأن الأسر تحتاج المزيد، ويُعدّ لذلك من أكثر مصادر النقد الأجنبي ثباتاً في أوقات الاضطراب.\u003c/p\u003e\u003cp class=\"ap\"\u003eلكن الاعتماد عليه له كلفة لا تُحسب عادة: فقدان الكفاءات من البلد الأصل، وارتفاع الأجور في قطاعات معينة بسبب تدفق المال، واعتماد أسرٍ كاملة على مصدر خارجي لا تتحكم فيه، وتحوّل جزء من الشباب إلى انتظار الوظيفة في الخارج بدل بناء شيء في الداخل. وفي بعض البلدان صارت التحويلات أكبر من الصادرات كلها، وهو مؤشرٌ على هشاشة لا على قوة.\u003c/p\u003e\u003cp class=\"ap\"\u003eولهذا اتجهت بعض الدول إلى تحويل التحويلات من استهلاك إلى استثمار، عبر حسابات ادخار ومشاريع صغيرة ومبادرات للمغتربين وروابط للكفاءات في الخارج. والنجاح في ذلك يحتاج ثقةً في المصارف وسيولةً في الإجراءات وضماناتٍ حقيقية، لا خطاباتٍ عاطفية عن الحنين إلى الوطن تُقال في المؤتمرات ثم تُنسى.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالمدن الجديدة والنقل\u003c/h4\u003e\u003cp class=\"ap\"\u003eمن مدنٍ اقتصادية في الصحراء إلى عواصم إدارية جديدة، أنفقت المنطقة مليارات على مدنٍ تُبنى من الصفر: مخططاتٌ واسعة، وأبراج، ومطارات، وطرقٌ سريعة. والمنطق المعلن هو تخفيف الضغط عن العواصم المزدحمة، وجذب الاستثمار، وإيجاد مساحة للتوسع المستقبلي بعيداً عن الأحياء المتضخمة والطرق المسدودة.\u003c/p\u003e\u003cp class=\"ap\"\u003eلكن المدن الجديدة تواجه سؤالاً واحداً لا جواب له في المخططات: من يسكنها؟ فحين تُبنى للسكن الراقي تبقى شبه فارغة سنوات، وحين تُبنى بلا وظائف تتحول إلى أحياء نومٍ بعيدة عن العمل، يقطع سكانها كل يوم ساعتين في الطريق. والمدينة الحيّة تنشأ من اقتصادٍ وخدماتٍ وحياةٍ يومية ومقاهٍ ومدارس، لا من مخططٍ هندسي جميل يُصوَّر من الجو.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالمكمّل الضروري هو النقل العام: فمدينةٌ بلا مترو أو حافلات منظّمة تتحول إلى زحامٍ دائم وملوثاتٍ وأمراض. وقد بدأت عواصم عربية عدة مشاريع نقلٍ كبيرة، وهي من أنفع الاستثمارات لأن أثرها يصل إلى الفقير قبل الغني، وإلى المرأة العاملة والطالب والموظف الصغير، بخلاف الطرق السريعة التي تخدم من يملك سيارة.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالتحضر السريع\u003c/b\u003e\u003cspan\u003eانتقال أغلبية السكان من الريف إلى المدينة في جيلين، من أسرع التحولات في العالم.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالعشوائيات\u003c/b\u003e\u003cspan\u003eأحياء بُنيت بالجهد الذاتي بلا تخطيط، تقدّم مسكناً رخيصاً وتخلق مشكلة بنية وملكية.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالتحويلات\u003c/b\u003e\u003cspan\u003eأموال المغتربين، وهي مصدر مستقر للنقد الأجنبي في دول كثيرة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمدن الجديدة\u003c/b\u003e\u003cspan\u003eمدن تُبنى من الصفر لتخفيف الضغط، ونجاحها معلّق على الوظائف لا على المباني.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالنقل العام\u003c/b\u003e\u003cspan\u003eأكثر الاستثمارات الحضرية إنصافاً، لأن نفعه يصل إلى محدودي الدخل أولاً.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالنمط\u003c/th\u003e\u003cth\u003eالاتجاه\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eريف إلى مدينة\u003c/td\u003e\u003ctd\u003eداخل البلد\u003c/td\u003e\u003ctd\u003eتضخم العواصم وضغط الخدمات\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eعمل مؤقت\u003c/td\u003e\u003ctd\u003eإلى الخليج وأوروبا\u003c/td\u003e\u003ctd\u003eتحويلات مالية وكفاءات مفقودة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eلجوء\u003c/td\u003e\u003ctd\u003eمن مناطق الحروب\u003c/td\u003e\u003ctd\u003eمخيمات وضغط على المدن المضيفة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eهجرة الكفاءات\u003c/td\u003e\u003ctd\u003eإلى أمريكا وأوروبا\u003c/td\u003e\u003ctd\u003eخسارة رأس المال البشري\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eعودة المغتربين\u003c/td\u003e\u003ctd\u003eإلى البلد الأصل\u003c/td\u003e\u003ctd\u003eنقل خبرة ورأس مال\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eهجرة موسمية\u003c/td\u003e\u003ctd\u003eبين الأرياف والمدن\u003c/td\u003e\u003ctd\u003eعمل زراعي وبناء غير منتظم\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eالمدينة لا تُبنى بالخرسانة، بل بالوظائف والخدمات والحياة اليومية. وحين تُبنى بغيرها تبقى مخططاً على ورق.\u003c/p\u003e\u003ccite\u003eخلاصة تحليلية — قسم الحاضر\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eتحوّلت المنطقة من مجتمع ريفي إلى مجتمع حضري في جيلين، فانتقلت الأسرة من الأرض إلى الراتب، ونشأت عشوائيات وأحياء جديدة وملايين من المغتربين. والدرس أن التوسع الحضري ليس مشكلة عدد، بل مشكلة تخطيط ونقل وسكنٍ يُنتج للفقراء قبل الأغنياء.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"water-food-climate","n":"الماء والغذاء وتغيّر المناخ","ic":"💧","part":"الحاضر","h":"\u003carticle class=\"ch3\" id=\"water-food-climate\" data-toc=\"الماء والغذاء وتغيّر المناخ\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالحاضر\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٧ من ٧\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٥\u003ci\u003e.\u003c/i\u003e٧\u003c/span\u003e\n            \u003ch3\u003eالماء والغذاء وتغيّر المناخ\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eلماذا تُعدّ المنطقة أشدّ مناطق العالم شحاً في الماء، وكيف تُطعم سكاناً يتزايدون؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eالمنطقة من أشدّ مناطق العالم شحاً في المياه العذبة: فيها أقل من واحد في المائة من مياه العالم، ويعيش عليها أكثر من خمسة في المائة من سكانه. وقد انخفض نصيب الفرد من الماء إلى ما دون خط الفقر المائي في معظم الدول، بعد أن تضاعف السكان ثلاث مرات في نصف قرن، وارتفع الاستهلاك مع تحسّن مستوى المعيشة، ودخلت في الحساب مدنٌ جديدة ومساحاتٌ خضراء ومزارعُ تستهلك أكثر مما تحتمل الأرض.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالزراعة تستهلك نحو سبعين في المائة من المياه في المنطقة، وهي تنتج جزءاً محدوداً من الغذاء. وهذا هو جوهر المعضلة: أن نستخدم أغلى موردٍ طبيعي في إنتاجٍ منخفض القيمة، بينما نستورد الحبوب من الخارج بأسعارٍ أقل من كلفة إنتاجها محلياً. ولذلك صارت كل دول المنطقة تقريباً من أكبر مستوردي القمح في العالم، وأصبح أمنها الغذائي معلّقاً بسلاسل إمداد بعيدة وبأسعار عالمية لا تتحكم فيها ولا تضمن استمرارها.\u003c/p\u003e\u003cp class=\"ap\"\u003eومع الشح جاءت الحلول المكلفة: السدود لتخزين الأمطار الموسمية، والتحلية لتحويل ماء البحر إلى شرب، وإعادة استخدام المياه المعالجة في الزراعة والمساحات الخضراء. وقد صارت دول الخليج من أكبر منتجي المياه المحلاة في العالم، لكن التحلية تستهلك طاقة هائلة وتترك ملوحةً في البحر، فتحوّلت إلى مشكلة طاقة قبل أن تكون مشكلة ماء، وإلى عبءٍ مالي يزيد كلما ارتفعت أسعار الوقود.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم أضيف عامل ثالث ثقيل: تغيّر المناخ. فدرجات الحرارة في المنطقة ترتفع بمعدل أعلى من المتوسط العالمي، وتتزايد موجات الحرّ والعواصف الغبارية، ويزحف التصحر على الأراضي الزراعية، وترتفع ملوحة المياه الجوفية في السواحل. وكل ذلك يضغط على ثلاثة أشياء في وقت واحد: الماء، والمحصول، وصحة الناس، ويجعل ما كان مستقراً في الماضي غير مضمون في المستقبل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي العمق، تبقى مسألة الوعي أصعب من مسألة السدود. فالماء في كثير من الدول يُقدَّم بسعرٍ رمزي لا يعكس كلفته، فيستهلك الناس بلا حساب، ويُزرع محصولٌ كثيف الاستهلاك في أرضٍ لا تحتمله. والتسعير العادل المدروس، مع دعمٍ مباشر للفقراء، هو الأداة الأنجع لترشيد الاستهلاك، وهو أيضاً الأصعب سياسياً لأن الناس يرون فيه مسّاً بحقٍ مكتسب. وقد جاء في النصوص النهي عن الإسراف في الماء حتى عند الوضوء، وهو أصلٌ ثقافي يمكن البناء عليه.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالأنهار العابرة للحدود\u003c/h4\u003e\u003cp class=\"ap\"\u003eأهم أنهار المنطقة لا تنبع فيها: النيل والدجلة والفرات والأردن تأتي من خارجها أو تعبرها قبل أن تصل إلى البحر. وهذا يجعل سياسة الماء مسألة سيادية قبل أن تكون مسألة زراعية، وحين يبني بلدٌ سداً في أعلى النهر يشعر البلد الأدنى مباشرةً بأثره في الكهرباء والزراعة والملاحة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد طوّرت المنطقة عبر قرنٍ كامل منظومة معاهدات ومفاوضات حول الأنهار، بعضها نجح وبعضها تعطّل، وبعضها بقي حبراً على ورق. والدرس المتكرر أن الاتفاق يُصاغ على أساس الحصص والبيانات المشتركة والقياس الفعلي للتدفق، لا على أساس الحقوق التاريخية وحدها، لأن الماء مورد متغيّر لا ثابت، ولأن الجفاف يضغط على الجميع.\u003c/p\u003e\u003cp class=\"ap\"\u003eومع ذلك، فإن أكثر ما يوفّر الماء ليس الاتفاق بل الكفاءة: نقلٌ مبطّن لا يسرّب، وريٌّ بالتنقيط بدل الغمر، ومحاصيل أقل استهلاكاً، وقياسٌ للاستهلاك يمنع الهدر. فالدولة التي تصلح شبكتها وتُسعّر الماء تسعيراً عادلاً توفّر أكثر مما تكسبه من جولة مفاوضات، وتوفّر قبل أن تحتاج إلى المفاوضة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالأمن الغذائي\u003c/h4\u003e\u003cp class=\"ap\"\u003eالأمن الغذائي لا يعني أن تُنتج كل ما تأكله، بل أن تضمن وصول الغذاء إلى الناس في كل الأحوال وبأسعارٍ يقدرون عليها. والمنطقة تستورد معظم حبوبها، ولذلك تتأثر أسعار الخبز فيها بالحرب والجفاف والملاحة البحرية وأسعار الشحن في بلاد بعيدة، وبقراراتٍ تُتخذ في أسواق السلع العالمية لا في عواصمها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كشف تقلّب الأسعار في السنوات الأخيرة هشاشة هذا النموذج: فحين ترتفع أسعار القمح عالمياً تظهر أزمات خبز وطوابير في دولٍ لا تنتج قمحاً، وتتأثر الدول المستوردة قبل غيرها. والحلّ الذي اتجهت إليه دولٌ عدة هو تخزين احتياطي استراتيجي يكفي شهوراً، وتنويع مصادر الاستيراد بين قارات، والاستثمار الزراعي في الخارج.\u003c/p\u003e\u003cp class=\"ap\"\u003eلكن الاستثمار الزراعي الخارجي أثار جدلاً واسعاً: فحين تشتري دولةٌ أرضاً في بلد فقير لتؤمّن قمحها، قد تحرم سكان البلد من أرضه ومائه، وهو ما يُعرف في التقارير الدولية بـ«الاستحواذ على الأرض». ولذلك تُطرح بدائل أكثر استدامة: تحسين إنتاجية الأرض المحلية، وتقليل الفاقد من الطعام، وتغيير أنماط الاستهلاك المفرطة، والاعتماد على التجارة المنظّمة لا على التخزين وحده.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالتكيّف لا التخفيف\u003c/h4\u003e\u003cp class=\"ap\"\u003eالمنطقة ليست من أكبر مصادر الانبعاثات في العالم، لكنها من أكثر من يتأثر بها. ولذلك انتقل النقاش فيها من «التخفيف» أي تقليل الانبعاثات، إلى «التكيّف» أي الاستعداد للضرر الذي وقع بالفعل وصار واقعاً يُقاس بالدرجات والغبار والمحصول، لا احتمالاً يُناقش في المؤتمرات.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالتكيّف يعني أشياء عملية لا شعارات: مدنٌ مظلّلة وأسطحٌ عاكسة للحرارة، ومبانٍ أقل استهلاكاً للكهرباء، ومحاصيل مقاومة للملوحة والحرارة، وإنذار مبكر للعواصف الغبارية والفيضانات المفاجئة، وتأمين المدن الساحلية المنخفضة، وحماية الفلاحين بتأمينٍ ضد الجفاف بدل انتظار التعويض بعد الخسارة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي هذا المجال بدأت مشاريع عربية كبيرة للطاقة الشمسية وطاقة الرياح، وهي لا تُخفّض الانبعاثات فقط بل تُنوّع الكهرباء وتُقلّل الاعتماد على الوقود المصدَّر، وتخلق صناعةً ووظائف. وهكذا يلتقي المناخ بالاقتصاد في نقطة واحدة: أن الطاقة النظيفة صارت مسألة أمنٍ قومي وفرصةٍ اقتصادية، لا رفاهيةً بيئية يتحملها الأغنياء.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالفقر المائي\u003c/b\u003e\u003cspan\u003eانخفاض نصيب الفرد من الماء إلى ما دون الحدّ الآمن، مع تزايد السكان والاستهلاك.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالزراعة والماء\u003c/b\u003e\u003cspan\u003eتستهلك نحو سبعين في المائة من المياه وتنتج جزءاً محدوداً من الغذاء.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالتحلية\u003c/b\u003e\u003cspan\u003eتحويل ماء البحر إلى شرب، حلٌّ مكلف يستهلك طاقة هائلة ويترك ملوحة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالأنهار العابرة\u003c/b\u003e\u003cspan\u003eالنيل والدجلة والفرات والأردن تنبع خارج المنطقة أو تعبرها، فتصبح مسألة سيادية.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالتكيّف\u003c/b\u003e\u003cspan\u003eالاستعداد للضرر المناخي الواقع: مدن أبرد، ومحاصيل مقاومة، وإنذار مبكر.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمصدر\u003c/th\u003e\u003cth\u003eالاستخدام\u003c/th\u003e\u003cth\u003eالتحدي\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالأمطار والسدود\u003c/td\u003e\u003ctd\u003eشرب وريّ\u003c/td\u003e\u003ctd\u003eتقلّب سنوي كبير\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمياه الجوفية\u003c/td\u003e\u003ctd\u003eريّ وشرب\u003c/td\u003e\u003ctd\u003eاستنزاف وملوحة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eتحلية البحر\u003c/td\u003e\u003ctd\u003eشرب ومدن\u003c/td\u003e\u003ctd\u003eكلفة طاقة عالية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eإعادة الاستخدام\u003c/td\u003e\u003ctd\u003eريّ ومساحات خضراء\u003c/td\u003e\u003ctd\u003eالحاجة إلى معالجة آمنة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالأنهار العابرة\u003c/td\u003e\u003ctd\u003eزراعة وكهرباء\u003c/td\u003e\u003ctd\u003eحصص وتوترات بين الدول\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالاستيراد الغذائي\u003c/td\u003e\u003ctd\u003eحبوب ولحوم\u003c/td\u003e\u003ctd\u003eتعرّض لأسعار العالم\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eأغلى ما تملكه المنطقة ليس النفط بل الماء، وأسوأ استخدامٍ له أن يُبذَر في محصولٍ يُستورد أرخص مما يُنتج.\u003c/p\u003e\u003ccite\u003eخلاصة تحليلية — قسم الحاضر\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eتعيش المنطقة على أقل من واحد في المائة من مياه العالم، وتستهلك زراعتها سبعين في المائة منها، وتستورد معظم حبوبها. ومع ارتفاع الحرارة وزحف التصحر، صار الأمن المائي والغذائي مسألة أمنٍ لا مسألة تنمية. والحلّ في الكفاءة والتخزين والتكيّف، لا في مزيد من السدود وحدها.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"f","one":true,"id":"people","n":"أهم الشخصيات","ic":"","part":"","h":"\u003csection class=\"rsec\"\u003e\n      \u003ch2 class=\"sec\"\u003eأهم الشخصيات\u003c/h2\u003e\n      \u003cdiv class=\"people\"\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eمحمد علي باشا\u003c/b\u003e\u003cspan\u003eمؤسس دولة مصر الحديثة وباني الجيش النظامي في عصره.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eإسماعيل باشا\u003c/b\u003e\u003cspan\u003eخديوي مصر الذي افتتحت في عهده قناة السويس سنة ١٨٦٩م.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eأحمد عرابي\u003c/b\u003e\u003cspan\u003eقائد عسكري مصري وثورة على التدخل البريطاني انتهت سنة ١٨٨٢م.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eسعد زغلول\u003c/b\u003e\u003cspan\u003eزعيم الحركة الوطنية المصرية وكبير مفاوضي استقلال مصر أمام بريطانيا.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eكمال أتاتورك\u003c/b\u003e\u003cspan\u003eقائد الحركة الإصلاحية في تركيا وألغى الخلافة سنة ١٩٢٤م.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eفيصل بن عبد العزيز\u003c/b\u003e\u003cspan\u003eقائد الثورة العربية الكبرى وملك العراق في العشرينيات.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eجمال عبد الناصر\u003c/b\u003e\u003cspan\u003eقائد الثورة المصرية وأول رئيس لجمهورية مصر سنة ١٩٥٣م.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\n    \u003c/section\u003e"},{"u":"f","one":true,"id":"outcomes","n":"النتائج والآثار","ic":"","part":"","h":"\u003csection class=\"rsec\"\u003e\n      \u003ch2 class=\"sec\"\u003eالنتائج والآثار\u003c/h2\u003e\n      \u003cul class=\"outs\"\u003e\u003cli\u003eقسم المشرق العربي بين بريطانيا وفرنسا بعد خروج المنطقة من الحكم العثماني.\u003c/li\u003e\u003cli\u003eبدأ بناء الدول العربية الحديثة على أسس جيش وإدارة وقانون كما فعل محمد علي.\u003c/li\u003e\u003cli\u003eربطت قناة السويس مصر بأوروبا وجعلتها محط أنظار الدول الكبرى.\u003c/li\u003e\u003cli\u003eخرج العالم العربي من الحكم العثماني فبدأ عصر الدول المستقلة.\u003c/li\u003e\u003cli\u003eألغيت الخلافة العثمانية وانتقلت تركيا إلى نظام الجمهورية الحديثة.\u003c/li\u003e\u003cli\u003eظهرت القضية الفلسطينية سنة ١٩٤٨م وصارت من أكبر مسائل العالم العربي.\u003c/li\u003e\u003c/ul\u003e\n    \u003c/section\u003e"},{"u":"f","one":true,"id":"sources","n":"المصادر والمراجع","ic":"","part":"","h":"\u003cdiv class=\"src frame\" style=\"--c:#37474F\"\u003e\n    \u003cspan class=\"crn tl\"\u003e\u003csvg viewBox=\"0 0 26 26\"\u003e\n\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\"/\u003e\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\" transform=\"rotate(90 13 13)\" opacity=\".5\"/\u003e\u003c/svg\u003e\u003c/span\u003e\u003cspan class=\"crn tr\"\u003e\u003csvg viewBox=\"0 0 26 26\"\u003e\n\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\"/\u003e\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\" transform=\"rotate(90 13 13)\" opacity=\".5\"/\u003e\u003c/svg\u003e\u003c/span\u003e\u003cspan class=\"crn bl\"\u003e\u003csvg viewBox=\"0 0 26 26\"\u003e\n\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\"/\u003e\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\" transform=\"rotate(90 13 13)\" opacity=\".5\"/\u003e\u003c/svg\u003e\u003c/span\u003e\u003cspan class=\"crn br\"\u003e\u003csvg viewBox=\"0 0 26 26\"\u003e\n\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\"/\u003e\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\" transform=\"rotate(90 13 13)\" opacity=\".5\"/\u003e\u003c/svg\u003e\u003c/span\u003e\n    \u003ch2 class=\"sec\" style=\"margin-top:0\"\u003eالمصادر والمراجع\u003c/h2\u003e\n    \u003cul\u003e\u003cli\u003e\u003ccite\u003eآن لافلاو\u003c/cite\u003e — خرائط العالم العربي الحديث (أطلس تاريخي يكشف مصير البلاد العربية في العصر الحديث)\u003c/li\u003e\u003cli\u003e\u003ccite\u003eفيليب خوري هتي\u003c/cite\u003e — تاريخ العرب (مراحل التاريخ العربي الحديث وعلاقته بأوروبا)\u003c/li\u003e\u003cli\u003e\u003ccite\u003eجورج أنطونيوس\u003c/cite\u003e — حضارة العرب (أحوال البلاد العربية في مرحلة الضعف والانحلال)\u003c/li\u003e\u003cli\u003e\u003ccite\u003eشكيب أرسلان\u003c/cite\u003e — تاريخ الدولة العثمانية (العهد العثماني الأخير وأحداث المشكل مع أوروبا)\u003c/li\u003e\u003c/ul\u003e\n  \u003c/div\u003e"},{"u":"f","one":true,"id":"pager","n":"الحقب الأخرى","ic":"","part":"","h":"\u003cnav class=\"pager\"\u003e\n    \u003ca class=\"prev\" href=\"civilization.html\"\u003e\u003csmall\u003e← الحقبة السابقة\u003c/small\u003e\u003cb\u003e🔬 الحضارة الإسلامية والعلوم\u003c/b\u003e\u003c/a\u003e\n    \u003ca class=\"next empty\"\u003e\u003c/a\u003e\n  \u003c/nav\u003e"}]}</script>
