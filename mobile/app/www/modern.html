ne":true,"id":"part-1","n":"عصر الاستعمار","ic":"⛵","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-1\" style=\"--c:#37474F\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e⛵\u003c/div\u003e\n      \u003ch2\u003eعصر الاستعمار\u003c/h2\u003e\n      \u003cp\u003eيشكّل الاستعمار الأوروبي للعالم الإسلامي الفصلَ الأكثرِ إيلامًا في العصر الحديث. بدأ بغزو نابليون لمصر سنة ١٧٩٨م، وانتهى بإنهاء الانتدابات بعد الحرب العالمية الثانية. خلال هذا القرن والنصف، دخل الأوروبي إلى المنطقة باسم الحضارة والدين والتجارة، لكنه خرج بثرواتها وفرّق دولها وزرع بذور صراعاتٍ ما زالت مستمرة حتى اليوم.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#napoleon-egypt\"\u003eحملة نابليون وتغيير المشرق\u003c/a\u003e\u003ca href=\"#maghreb-colonization\"\u003eالجزائر وتونس: قرن من الاحتلال\u003c/a\u003e\u003ca href=\"#levant-division\"\u003eتقسيم المشرق ووعد بلفور\u003c/a\u003e\u003ca href=\"#resistance-movements\"\u003eحركات المقاومة والصحوة\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"napoleon-egypt","n":"حملة نابليون وتغيير المشرق","ic":"⚔️","part":"عصر الاستعمار","h":"\u003carticle class=\"ch3\" id=\"napoleon-egypt\" data-toc=\"حملة نابليون وتغيير المشرق\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eعصر الاستعمار\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ١ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e١\u003ci\u003e.\u003c/i\u003e١\u003c/span\u003e\n            \u003ch3\u003eحملة نابليون وتغيير المشرق\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eكيف غيّرت الحملة الفرنسية على مصر موازين القوى في العالم الإسلامي؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eحملة نابليون بونابرت على مصر سنة ١٧٩٨م لم تكن مجرد غزوٍ عسكريٍّ، بل كانت صدمةً حضاريةً عنيفةً. كان العالم الإسلامي قد اعتاد على الصراعات الداخلية بين دوله، فجاءه الأوروبي بأسطولٍ حديثٍ وعلمٍ متقدمٍ وجيشٍ منظّمٍ على أساسٍ وطنيٍّ لا دينيٍّ. هذا الأسلوب الجديد في الحرب أظهر للعالم الإسلامي حجم التفوق العسكري الذي بلغته أوروبا بعد الثورة الصناعية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد صحب نابليون في حملته نخبةً من العلماء الفرنسيين في مختلف التخصصات، فارتقت البعثة العلمية كلَّ أركان مصر ودرستها دراسةً وصفيةً دقيقة. أدى ذلك النشاط إلى نشر كتاب وصف مصر الذي كشف عن ثقافة مصر وتراثها للعالم الغربي، وأشعل المنافسة الاستعمارية على الشرق. لكنه أسّس أيضًا لعلم المصريات، وهو الوجه الآخر للمشروع الاستعماري الذي ادّعى اكتشاف حضارةٍ ظنها غاربة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أثّرت الحملة في مصر وفي الشرق الإسلامي كله تأثيرًا عميقًا. سقطت الدولة المملوكية سريعًا، وظهرت فراغًا في السلطة حاول محمد علي ملأه. كما أظهرت الحملة ضعف الدولة العثمانية وعجزها عن حماية أراضيها من دول أوروبية بعيدة. هذا الضعف لم يمرَّ دون ملاحظة، فأثار شهية الدول الأوروبية الأخرى للتوسع في المنطقة. وقد سارعت بريطانيا وروسيا إلى احتساب المتغيرات من جديد، فصار الشرق ساحةً للتنافس الاستعماري لا ساحةً للخلافة الإسلامية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت الحملة أيضًا بدايةً للتقنية الحديثة والحكم الإداري في مصر. دخلت المطابع الحديثة، وأُنشئت المدارس الحربية، وتأسست جريدة التجديف. لكن التقنية لم تُستخدم لخدمة المصريين، بل لخدمة الحكم الاستعماري الذي جاء بعد ذلك. وهكذا صار التحديث سلاحًا ذا حدّين: يحمل معه التطور، لكنه يحمل أيضًا الهيمنة. وقد يتعلّم من هذا الدرس أن التقنية حين تأتي من الخارج دون مشروعٍ وطنيٍّ شامل، تكون أداة هيمنةٍ أكثر منها أداةً للتحرر.\u003c/p\u003e\u003cp class=\"ap\"\u003eومن النتائج المهمة للحملة أنها غيرت مفهوم الغرب عن نفسه وعن الآخر. صار الشرق الشرقي موضوعًا للدراسة والاستكشاف والاستلاب، وظهر الاستشراق كمنهجٍ لفهم الشرق من منظورٍ أوروبيٍّ مركزي. هذا الفهم لم يكن حياديًا، بل كان مشروعًا معرفيًا يخدم مصالح أوروبا السياسية والاقتصادية. وقد تتطلّب مواجهة هذا التصوير قرونًا من العمل العلمي والدبلوماسي حتى تستعيد المنطقة سرديتها عن نفسها.\u003c/p\u003e\u003cp class=\"ap\"\u003eولم تستطع بريطانيا الوقوف متفرجةً على الحملة، فتصدّت لها عسكريًا وحاصرت فرنسا. وقد أدى ذلك إلى انسحاب الجيش الفرنسي سنة ١٨٠١م، وبقي الأثر الثقافي والعلمي. لكن بريطانيا فهمت الدرس: من يسيطر على مصر يسيطر على الطريق إلى الهند، وصار التنافس الاستعماري على المشرق أشبه ما يكون بصراعٍ وجوديٍّ للقوى الأوروبية. وهذا ما جعل البحر المتوسط منطقة توترٍ دائمة، وسيبقى كذلك حتى نال الشرق استقلاله السياسي في منتصف القرن العشرين.\u003c/p\u003e\u003cp class=\"ap\"\u003eوما يجدر الانتباه إليه أن الحملة لم تكن حدثًا منفصلًا، بل كانت إشارة البدء لقرنٍ كامل من التدخل الأوروبي. بعدها جاء الإنكليز إلى مصر، ثم الفرنسيون إلى الجزائر، ثم الانتداب البريطاني على فلسطين، ثم تقسيم سوريا ولبنان. كلها حلقاتٌ في سلسلةٍ طويلةٍ من السيطرة الخارجية التي أعادت رسم خريطة العالم الإسلامي. وقد أثبتت التجربة التاريخية أن التدخل الخارجي إذا بدأ، فإنه لا يتوقف عند الحدود المرسومة في الاتفاقيات السرية.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالبعثة العلمية: العلم في خدمة السيطرة\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يرافق نابليون جيشه فقط، بل رافقه علماء في الرياضيات والفلك والكيمياء والآثار. هدفوا إلى دراسة مصر دراسةً علميةً دقيقةً، فنقلوا رسمها ووصفوا آثارها وحللوا ترابها ومواردها. هذه الدراسة لم تكن بريئة، بل كانت تهدف إلى تمكين فرنسا من إدارة مستعمرتها مستقبلًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أثمرت البعثة عن أعمالٍ هائلة، أبرزها كتاب وصف مصر الذي نُشر في أوروبا وأثار إعجاب الأوساط العلمية والفكرية. لكنه ظهر أيضًا صورة مصر القديمة كحضارةٍ مفارقةٍ لحضارة المسلمين، وكأن الحضارة الحقيقية في مصر بدأت وانتهت، وما بعدها دخيل. وقد خدم هذا التصوير أهدافًا استعماريةً واضحة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد تركت البعثة أيضًا إرثًا مزدوجًا في مصر: من جهة، أضاءت على تراث مصر القديمة وأسست لعلم المصريات. ومن جهةٍ أخرى، جعلت المصري الحديث يشعر بأن حضارته منقطعة، وأن إنجازاته القديمة لا تمتّ إليه بصلة. وهذا الشعور بالنقص الحضاري ظل يطارد الفكر العربي قرونًا.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eمحمد علي وإعادة بناء مصر\u003c/h4\u003e\u003cp class=\"ap\"\u003eبعد انسحاب الفرنسيين، برز محمد علي، الضابط الألباني في الجيش العثماني، فسيطر على مصر وبدأ مشروع تحديثٍ واسع. بنى مصانع للجيش، وأرسل البعوث التعليمية إلى أوروبا، وأنشأ مدارس عسكرية وإدارية، وفرض ضرائب لتوسيع الدولة. هذا المشروع جعل من مصر دولةً حديثةً قوية، ثم بدأ يتوسع في السودان والشام والجزيرة العربية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد حقق محمد علي إصلاحاتٍ حقيقية في الصناعة والزراعة والتعليم، لكنها بقيت رهينة الحكم الفردي. لم يبنِ مؤسساتٍ دستوريةً أو نيابيةً، وظلّ يحكم بأمره الشخصي. هذه النتيجة أظهرت أن التحديث من الأعلى يمكن أن يبني دولةً قوية، لكنه لا يصنع مواطنًا حرًّا. وهذا يعني أن بناء الدولة الحديثة لا يتحقق بالمصانع والجند فحسب، بل بالعدل والدستور والمحاسبة بين الحاكم والمحكوم.\u003c/p\u003e\u003cp class=\"ap\"\u003eومع ذلك، فإن إصلاحات محمد علي كانت أساسًا لنهضةٍ مصريةٍ لاحقةٍ في الأدب والتعليم والصحافة. خرج من مدارسه علماءٌ وأدباءٌ ومفكرون قادوا الحياة الفكرية في القرن التاسع عشر. لكن المشروع توقف بعد تولية عباس الأول وخوفه من النفوذ الأوروبي، فدخلت مصر مرحلةً جديدةً من الضعف والمديونية التي انتهت بالاحتلال البريطاني.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالدرس الأول في العلاقة مع الغرب\u003c/h4\u003e\u003cp class=\"ap\"\u003eعلّمت الحملة الفرنسية العالم الإسلامي درسًا قاسيًا: لا يمكن مواجهة أوروبا بالتفوق العددي أو بالشجاعة وحدها، بل لا بدَّ من تحديث العلم والجيش والإدارة. هذا الوعي دفع قادة المنطقة إلى إرسال بعثاتٍ لأوروبا، وإلى جعل التقنية جزءًا من الخطة الوطنية. وقد ينطلق من هذا الوعي مشروعٌ نهضويٌّ حقيقيٌّ يربط بين العلوم الحديثة والقيم الأصيلة في وحدةٍ متكاملةٍ لا تقسم.\u003c/p\u003e\u003cp class=\"ap\"\u003eلكن الدرس كان أكثر قسوة: التحديث الذي لا يُصاحبه تمكين سياسي للمواطنين، وبناء مؤسسات تحاسب الحاكم، لا يصنع إلا دولةً قويةً في الظاهر، هشةً في الباطن. وهكذا عانت المنطقة قرنًا من محاولات إصلاحٍ فشلت متى اعتمدت على الفرد لا على المؤسسة. وهكذا يبقى السؤال مطروحًا في كل بلدٍ عربيٍّ: هل نبني نظامنا السياسي أولًا أم حداثتنا المادية؟ والتاريخ يقول إن الأول شرط الثاني.\u003c/p\u003e\u003cp class=\"ap\"\u003eوهذا الدرس لم يُدرَّس جيدًا في المدارس العربية. غالبًا ما يقتصر الكتاب المدرسي على ذكر تواريخ المعارك والاتفاقيات، دون النظر إلى البنية المؤسسية التي جعلت من بعض الدول قادرة على مواجهة الاستعمار، ومنها أخرى لم تقدر إلا على الاستجابة بالتخلّف والتفرقة.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eصدمة حضارية\u003c/b\u003e\u003cspan\u003eالحملة الفرنسية كشفت ضعف الدولة العثمانية وحجم التفوق العسكري الأوروبي، فأشعلت التنافس الاستعماري.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eعلم في خدمة السيطرة\u003c/b\u003e\u003cspan\u003eالبعثة العلمية رافقت الجيش لتسهيل السيطرة، لكنها أسست لعلم المصريات وفتحت الباب أمام الاستشراق.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمحمد علي\u003c/b\u003e\u003cspan\u003eحاول بناء دولة حديثة بالمصانع والمدارس والجيش، لكن مشروعه ظل رهين الحكم الفردي فلم يستمر كما أراد.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eدرس قاسٍ\u003c/b\u003e\u003cspan\u003eلا تحديث بلا تمكين سياسي ومؤسسات دستورية، وهكذا تعلّم الناس أن القوة الحقيقية في التكامل لا في التسلح.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالجانب\u003c/th\u003e\u003cth\u003eقبل الحملة\u003c/th\u003e\u003cth\u003eبعد الحملة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالجيش\u003c/td\u003e\u003ctd\u003eمماليك وفرق تقليدية\u003c/td\u003e\u003ctd\u003eجيش نظامي وثكنات حديثة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالتعليم\u003c/td\u003e\u003ctd\u003eكتاتيب وحلقات مساجد\u003c/td\u003e\u003ctd\u003eمدارس عسكرية وبعثات أوروبية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالإعلام\u003c/td\u003e\u003ctd\u003eمخطوطات ومراسلات رسمية\u003c/td\u003e\u003ctd\u003eمطابع وجرائد رسمية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالاقتصاد\u003c/td\u003e\u003ctd\u003eنظام إقطاعي وضرائب بسيطة\u003c/td\u003e\u003ctd\u003eزراعات نقدية وديون أوروبية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالفكر\u003c/td\u003e\u003ctd\u003eقرار محلي بنهُج تقليدية\u003c/td\u003e\u003ctd\u003eتساؤلات معاصرة عن الحداثة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eالشعوب التي تُدار بها حملات العلم لا تُحرَّر بسهولة، لأنها تُستعبَد بعقول أبنائها قبل أجسادهم.\u003c/p\u003e\u003ccite\u003eطه حسين\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eحملة نابليون على مصر كانت صدمةً حضاريةً كشفت ضعف الدولة العثمانية والتفوق الأوروبي، وأدّت إلى مشروع تحديث محمد علي الذي بقي رهين الحكم الفردي، وعلمت المنطقة أن التقدم الحقيقي لا يقوم على التسلح بل على التمكين والمؤسسة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"maghreb-colonization","n":"الجزائر وتونس: قرن من الاحتلال","ic":"🏴","part":"عصر الاستعمار","h":"\u003carticle class=\"ch3\" id=\"maghreb-colonization\" data-toc=\"الجزائر وتونس: قرن من الاحتلال\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eعصر الاستعمار\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٢ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e١\u003ci\u003e.\u003c/i\u003e٢\u003c/span\u003e\n            \u003ch3\u003eالجزائر وتونس: قرن من الاحتلال\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eكيف احتلت فرنسا الجزائر سنة ١٨٣٠م، وكيف امتدّ نفوذها إلى تونس والمغرب؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eبدأ الغزو الفرنسي للجزائر سنة ١٨٣٠م بذريعة إهانة القنصل الفرنسي من طرف الداي حسين، لكنه كان مخططًا استعماريًا مدروسًا منذ سنوات. استولت فرنسا على مدينة الجزائر، ثم بدأت تتوسع في الداخل بحملاتٍ وحشيةٍ دمرت القرى وقتلت مئات الآلاف. وقد استُخدمت الأرض لاستيطان المزارعين الفرنسيين، وصار الجزائريون في بلادهم أجانب. وقد دفع الجزائريون ثمنًا بشريًا وبشعبيًا فادحًا، ولم تُعطَ لهم الجنسية الفرنسية إلا في حالاتٍ نادرةٍ تخدم المصالح الاستعمارية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد تميّز الاحتلال الفرنسي للجزائر بوحشيته وطوله في الوقت نفسه: استمر نحو قرنٍ وثلاثة عقود كاملة، ولم ينتهِ إلا سنة ١٩٦٢م. خلال هذه الفترة، لم تكن الجزائر مستعمرةً عادية، بل كانت جزءًا رسميًا من فرنسا، يُسمّى الأقاليم الفرنسية الجنوبية. هذا الوضع جعل الجزائريين يُحكمون بقوانين استثنائية لا تُطبق على الفرنسيين. وهذا يعني أن الإنسان نفسه صار سلعةً في وطنه، يعمل لحساب مستعمرٍ بعيدٍ بلا حقوقٍ ولا حماية.\u003c/p\u003e\u003cp class=\"ap\"\u003eأما تونس فقد وقعت تحت النفوذ الفرنسي سنة ١٨٨١م، عندما أجبر الفرنسيون الباي على توقيع معاهدة باردو التي جعلت تونس تحت الحماية الفرنسية. كان الاحتلال أكثر نعومةً من الاحتلال الجزائري، لكنه كان احتلالًا اقتصاديًا بشكلٍ أساسي: فرضت الديون، وسُيّطر على المالية، وطُوّرت البنية لخدمة المصالح الفرنسية. وقد تعلّم التونسيون في هذه المرحلة أن الاستعمار الناعم لا يقل خطورةً عن الغزو المباشر، لأنه يقتل الهوية ببطءٍ وبلا ضجيج.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد تجاوز الاحتلال المادي إلى الثقافة والعقل. فرضت اللغة الفرنسية في الإدارة والتعليم العالي، وصُوّر الأوروبي كنموذج الحضارة الوحيد، وصار الجزائري التونسي غريبًا في بلاده. هذه الهزيمة الثقافية هي أخطر ما تركه الاستعمار، لأنها تجعل المستعمَر يحكم نفسه بمعايير مستعمِره دون أن يحتاج مستعمرًا حاضرًا. وهذه هي أخطر أنواع الاستعمار، لأنه يبقى في العقل بعد أن يغادر الجندي، وهو ما جعل التحرير الحقيقي أصعب كثيرًا من التحرير السياسي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوظهرت في كلتا الدولتين حركات مقاومةٍ بطولية: الأمير عبد القادر في الجزائر الذي جمع بين الجهاد والسياسة لسنوات، ومقاومة قبائل القبائل بقيادة لالة فاطمة نسومر، وفي تونس ثورة علي بن غذاهم سنة ١٨٦٤م. هذه الحركات لم تستطع التحرير بسبب التفوق العسكري والمدفعي، لكنها حفظت كرامة الشعوب وأنشأت ذاكرة وطنية بقيت تُلهم الأجيال. وقد حفظت هذه الذاكرة الوطنية حقّ الشهداء، وجعلت من كل جيلٍ يحمل مسؤولية الحفاظ على المكاسب التي حققها السابقون.\u003c/p\u003e\u003cp class=\"ap\"\u003eولم يكن الاحتلال الفرنسي للمغرب متأخرًا إلا قليلًا، فقد جاء سنة ١٩١٢م بتوقيع معاهدة فاس التي جعلت المغرب تحت الحماية الفرنسية والإسبانية. وقد جمع المغرب بين النفوذين الأوروبي والإسلامي والبربري، مما جعل تجربته الاستعمارية أكثر تعقيدًا من جيرانه. واستمر حتى سنة ١٩٥٦م حين نال استقلاله. وقد عانى المغرب من الاستيطان الأوروبي في سهوله ومراعيه، لكن جباله وظفاره بقيت ذات طابعٍ محليٍّ لم تستسلم للنفوذ الأجنبي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوما يجدر الانتباه إليه أن الاحتلال في المغرب العربي لم يكن حدثًا عسكريًا فقط، بل كان عمليةً ديموغرافيةً واقتصاديةً وثقافيةً عميقة. المستوطنون الفرنسيون سيطروا على أفضل الأراضي، وأنظمة التعليم فصلت بين أبناء المستعمرين وأبناء البلاد، وبقيت آثار هذا التمييز قائمةً حتى بعد الاستقلال بسنواتٍ طويلة. وهذه البنيات الوراثية هي التي تجعل الحديث عن ما بعد الاستعمار أكثر تعقيدًا من الاحتفال باستقلال.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالأمير عبد القادر: رمز المقاومة\u003c/h4\u003e\u003cp class=\"ap\"\u003eالأمير عبد القادر الجزائري هو واحدٌ من أعظم رموز المقاومة العربية في القرن التاسع عشر. جمع بين العلم والحكم والجهاد، فأقام دولةً صغيرةً في غرب الجزائر، ونظّم جيشًا منظّمًا، وأرسى قواعد العدل بين مواطنيه. وقد قاتل الفرنسيين قرابة خمسة عشر عامًا، ولجأ إلى المغرب حين ضاقت به السبل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد عُرف عبد القادر بأخلاقه النبيلة في الحرب: كان يعامل الأسرى برحمة، ويحمي المدنيين، ويرفض قتل النساء والأطفال. وقد اعترف الفرنسيون أنفسهم بشجاعته واستقامته، فأُطلق سراحه بعد أسره سنة ١٨٤٧م وعاش في دمشق حتى وفاته. هذه الشهادة من العدو هي أعظم تكريمٍ للرمز الوطني.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بقى الأمير عبد القادر مصدر إلهامٍ لكل حركات التحرر في العالم، إذ أثبت أن المقاومة المسلحة المنظمة يمكن أن تستمر لعقود، وأن الكرامة ليست مرتبطة بالنصر بل بالثبات على المبدأ. وهو بالنسبة للجزائريين رمزٌ جامعٌ يجمع بين الدين والوطن والمقاومة. وهذا يعني أن الرمز الوطني ليس مجرد ذكرى، بل هو طاقةٌ تدفع الأجيال الجديدة لمواجهة تحدياتها الحالية بكبرياء ووعي.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالحماية في تونس: الاستعمار الناعم\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم تكن الحماية الفرنسية في تونس احتلالًا عسكريًا مباشرًا في بدايتها، بل كانت سيطرةً اقتصاديةً وقانونية. فرض الفرنسيون على تونس ديونًا ثقيلة، وسيطروا على الموارد المالية، ثم أسسوا إدارةً فرنسيةً تُدير البلاد من وراء ستار. وظلّ الباي موجودًا شكليًا، لكنه فقد كل سلطته الفعلية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد تطوّر التعليم في تونس في العهد الفرنسي، لكنه تعليمٌ للطبقة المتردية: الفرنسية لغة الحضارة، والعربية لغة التراث. هذا التفرقة اللغوية أنتجت مجتمعًا منقسمًا بين متغربين ينتمون لفرنسا أكثر من بلادهم، وبين شعبٍ مهمشٍ لا يجد فرصًا. وقد أورث هذا الانقسام تونس أزمة هويةٍ ما زالت آثارها قائمة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد نجحت تونس في نيل استقلالها سنة ١٩٥٦م بثورةٍ سلميةٍ قادها الحبيب بورقيبة، لكنها لم تتمكن من التخلص تمامًا من الارتباط الفرنسي الاقتصادي والثقافي. وهذا يُظهر أن الاستقلال السياسي لا يكفي، بل لا بد من استقلال اقتصادي وثقافي يُمكّن الدولة من اتخاذ قراراتها بنفسها.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالآثار التي لم تُمحَ\u003c/h4\u003e\u003cp class=\"ap\"\u003eخلف الاستعمار في المغرب العربي آثارًا عميقة لم تُمحَ بسهولة: الحدود المرسومة بعجلٍ والتي تقطع القبائل والأسر، والمدن المستوطنة التي حملت أسماءً فرنسيةً، والاقتصاد الذي اعتاد على تصدير المواد الأولية واستيراد المصنوعات. وقد ورثت الدول المستقلة بنيةً اقتصاديةً معتمدةً على الخارج.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد خلّف الاستعمار أيضًا أزمةً في الهوية: اللغة الفرنسية بقيت لغة الإدارة والعلوم في كثير من الدول، والعربية لغة الشارع والإعلام. وهذه الازدواجية اللغوية تُنتج طبقةً مثقفةً منفصلةً عن شعبها، وأخرى تشعر بالدونية. وقد حاولت بعض الدول التعريب لكنها واجهت مقاومةً من النخب المثقفة بالفرنسية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوهذه الآثار ما زالت تُشكّل تحديًا للمغرب العربي اليوم. فكلما حاولت دولةٌ إصلاح نظامها التعليمي، اصطدمت بالسؤال القديم: بأي لغةٍ نُعلّم أبناءنا؟ وكلما حاولت بناء اقتصادها، وجدت نفسها أسيرةً لعلاقاتٍ تجاريةٍ مع باريس أكثر من علاقاتها مع جيرانها. وهذا الاستعمار البنيوي هو أخطر ما تركه الاستعمار.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003e١٨٣٠ غزو الجزائر\u003c/b\u003e\u003cspan\u003eبدأ الغزو الفرنسي للجزائر بدعوى إهانة القنصل، واستمر نحو قرنٍ وثلاثة عقود من القمع والاستيطان.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eعبد القادر\u003c/b\u003e\u003cspan\u003eرمز المقاومة الجزائرية الذي جمع بين الجهاد والسياسة وأخلاق كريمة في الحرب، وأثبت أن الكرامة في الثبات لا في النصر.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالحماية التونسية\u003c/b\u003e\u003cspan\u003eسيطرة فرنسية اقتصادية وقانونية أنتجت مجتمعًا منقسمًا لغويًا وثقافيًا، وأورثت أزمة هويةٍ مستمرة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eاستعمار بنيوي\u003c/b\u003e\u003cspan\u003eاقتصادٌ مصدِّر للمواد الأولية وحدودٌ مصطنعة وازدواجية لغوية، كلها بقايا صعبة التجاوز بعد الاستقلال.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالدولة\u003c/th\u003e\u003cth\u003eبداية الاحتلال\u003c/th\u003e\u003cth\u003eطبيعته\u003c/th\u003e\u003cth\u003eنهاية الاستعمار\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالجزائر\u003c/td\u003e\u003ctd\u003e١٨٣٠م\u003c/td\u003e\u003ctd\u003eاحتلال عسكري واستيطاني مباشر\u003c/td\u003e\u003ctd\u003e١٩٦٢م بعد حرب تحرير طويلة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eتونس\u003c/td\u003e\u003ctd\u003e١٨٨١م\u003c/td\u003e\u003ctd\u003eحماية اقتصادية وقانونية\u003c/td\u003e\u003ctd\u003e١٩٥٦م بثورة سلمية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمغرب\u003c/td\u003e\u003ctd\u003e١٩١٢م\u003c/td\u003e\u003ctd\u003eحماية فرنسية وإسبانية مشتركة\u003c/td\u003e\u003ctd\u003e١٩٥٦م بعد نضال وطني\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eليبيا\u003c/td\u003e\u003ctd\u003e١٩١١م\u003c/td\u003e\u003ctd\u003eاحتلال إيطالي مباشر\u003c/td\u003e\u003ctd\u003e١٩٥١م بعد الحرب العالمية الثانية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eمصر\u003c/td\u003e\u003ctd\u003e١٨٨٢م\u003c/td\u003e\u003ctd\u003eاحتلال بريطاني غير مباشر\u003c/td\u003e\u003ctd\u003e١٩٢٢م استقلال شكلي\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eنحن لا نحمل السلاح لننتصر بالضرورة، بل لنُعلّم العالم أننا لم نستسلم بعد.\u003c/p\u003e\u003ccite\u003eالأمير عبد القادر الجزائري\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eالاحتلال الفرنسي للمغرب العربي جمع بين العنف العسكري والهيمنة الاقتصادية والغزو الثقافي. أنتج مقاوماتٍ بطولية كالأمير عبد القادر ولالة فاطمة نسومر، لكنه ترك أيضًا استعمارًا بنيويًا قائمًا على الحدود المصطنعة والازدواجية اللغوية والاقتصاد المعتمد على الخارج.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"levant-division","n":"تقسيم المشرق ووعد بلفور","ic":"📜","part":"عصر الاستعمار","h":"\u003carticle class=\"ch3\" id=\"levant-division\" data-toc=\"تقسيم المشرق ووعد بلفور\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eعصر الاستعمار\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٣ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e١\u003ci\u003e.\u003c/i\u003e٣\u003c/span\u003e\n            \u003ch3\u003eتقسيم المشرق ووعد بلفور\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eكيف قُسّمت بلاد الشام بعد الحرب العالمية الأولى؟ وما هي قصة وعد بلفور؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eخلال الحرب العالمية الأولى، تحالفت بريطانيا وفرنسا مع العرب ضد العثمانيين عبر مراسلات الحسين-مكماهون التي وعدت فيها بريطانيا بدولةٍ عربيةٍ مستقلة. لكن هذه الوعود كانت مجرد مناورةً سياسيةً مؤقتةً، إذ كانت بريطانيا تتفاوض في السر مع فرنسا على تقاسم الأراضي العثمانية. وقد وُلدت من هذا التقاطع اتفاقيتان متناقضتان: اتفاقية سايكس-بيكو السرية، ووعد بلفور العلني.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد قسمت اتفاقية سايكس-بيكو السرية سنة ١٩١٦م بلاد الشام والعراق بين فرنسا وبريطانيا، دون استشارة سكانها. اقتسمت فرنسا سوريا ولبنان، وأخذت بريطانيا العراق وفلسطين والأردن. هذه الحدود ارتُسمت على خرائط في مكاتب لندن وباريس، ولم تكن تعرف القبائل ولا الطوائف ولا المصالح المشتركة للشعب. وصارت هذه الحدود مصدرًا لكل النزاعات اللاحقة. وهذه الحدود لم تُعطِ الشعب حقًا في تقرير مصيره، بل قسّمته إلى شعوبٍ صغيرةٍ تُدار من عواصم الغرب.\u003c/p\u003e\u003cp class=\"ap\"\u003eأما وعد بلفور سنة ١٩١٧م فقد كان وعدًا من وزير خارجية بريطانيا بإنشاء وطن قومي لليهود في فلسطين. كان الهدف استعماريًا واضحًا: ضمان نفوذ بريطانيا في المنطقة بمشروعٍ استيطانيٍّ يكون حليفًا دائمًا. ولم يحترم هذا الوعد أن فلسطين بلدٌ عربيٌّ يشكل المسلمون أكثر من ٩٠٪ من سكانه في ذلك الوقت. وهذا يعني أن فلسطين لم تُنزع بمعركةٍ واحدة، بل بتدابير استعمارية متعاقبة بين اتفاقيات سرية وقرارات دولية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوبعد انتهاء الحرب، فرضت عصبة الأمم نظام الانتداب على المنطقة، فأصبحت فلسطين تحت الانتداب البريطاني، وسوريا ولبنان تحت الانتداب الفرنسي. كان هذا النظام استعمارًا مُستحدثًا يغطي بالشرعية الدولية ما هو في الحقيقة سيطرة أجنبية. وقد وعدت بريطانيا في الوقت نفسه العرب واليهود بأشياء متناقضة، وهي ازدواجيةٌ يدفع ثمنها الفلسطينيون حتى اليوم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بدأت الهجرة اليهودية المنظمة إلى فلسطين في العقد المنتهي إلى الحرب العالمية الثانية، واشترت فيها الحركة الصهيونية الأراضي وبنيت المستوطنات. كان ردّ الفلسطينيين الطبيعي هو المقاومة، فانطلقت ثوراتٌ شعبيةٌ متعددة كالثورة الفلسطينية الكبرى سنة ١٩٣٦م، لكن التنسيق العربي كان ضعيفًا، والتخطيط البريطاني كان أكبر. وقد دفع الفلسطينيون ثمنًا باهظًا من دمائهم وديارهم حتى يُدرك العالم أن الخطط البريطانية كانت تخدم أطرافًا أخرى.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سنة ١٩٤٧م، أصدرت الأمم المتحدة قرار التقسيم الذي يقسم فلسطين إلى دولتين: عربية ويهودية، مع تدويل القدس. رفض الفلسطينيون والعرب القرار لأنه يُنزع من أصحاب الأرض أكثر من نصف فلسطين مقابل ٣٣٪ من السكان. وفي سنة ١٩٤٨م أُعلنت دولة إسرائيل، ووقعت النكبة التي شردت أكثر من ٧٠٠ ألف فلسطيني. وهذه النكبة لم تُنهِ القضية، بل جعلتها قضيةً دائمةً لا تنسى، تنتقل من جيلٍ إلى جيلٍ مع كل لاجئٍ وكل مفتاح بيتٍ محفوظ.\u003c/p\u003e\u003cp class=\"ap\"\u003eوما يجدر الانتباه إليه أن تقسيم المشرق لم يكن كارثةً سياسيةً فقط، بل كان كارثةً اجتماعيةً أيضًا. قُطعت العلاقات التجارية والعائلية بين سوريا ولبنان والأردن وفلسطين، وصارت الحدود جدرانًا تفصل شعبًا واحدًا. وهذه الجروح المفتوحة هي التي تفسر لماذا ما زالت القضية الفلسطينية قلب العالم العربي حتى اليوم. وهذا يعني أن الحدود المرسومة في المكاتب الأجنبية لم تُنتج سوى دولٍ هشةٍ وشعوبٍ مفكّكةٍ تعاني صراعاتٍ داخليةً مستمرة.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eسايكس-بيكو: خريطة تُرسَم بالقلم\u003c/h4\u003e\u003cp class=\"ap\"\u003eاتفاقية سايكس-بيكو كانت نموذجًا صارخًا على الاستعمار الذي لا يُبالي بالشعوب. رسم مارك سايكس البريطاني وجورج بيكو الفرنسي الحدود على خريطة، فرسمّا خطًا مستقيمًا من عكا إلى كركوك. لم يضعوا في حسابهما أن هذا الخط يقطع قبائلَ تعيش من قرونٍ معًا، وأنه يفصل سكانًا يتكلمون لغةً واحدة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد استخدمت بريطانيا هذه الاتفاقية مع العرب أولًا وعدًا بالاستقلال، ثم مع فرنسا وعدًا بالتقسيم. وعندما انتصر الحلفاء، طُبّق التقسيم لا الوعد. وقد استمر هذا النمط في السياسة الغربية: الوعود للضعيف، والمصالح للقوي. وهي قاعدةٌ ما زالت تُذكّر نفسها في العلاقات الدولية اليوم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أنتج التقسيم دولًا هشةً لم تنشأ عن تطورٍ داخليٍّ طبيعيٍّ، بل عن قرارٍ خارجيٍّ. سوريا والعراق ولبنان والأردن كلها دولٌ اصطناعيةٌ التكوين، تجمع بين طوائف وقوميات لم تجتمع تاريخيًا في دولة واحدة. وقد حاول كلٌّ منها أن يبني هويةً وطنيةً تتجاوز هذه الطوائف، لكنه واجه صعوباتٍ جسيمة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eوعد بلفور: وعد بماليس عليه\u003c/h4\u003e\u003cp class=\"ap\"\u003eوعد بلفور كان وعدًا من لا يملك لغيرٍ من لا يستحق، فقد وعد وزير بريطاني أرض عربية لحركة صهيونية أجنبية. وقد كان الهدف البريطاني استراتيجيًا: ضمان وجود دولة صديقة في المنطقة تحمي مصالحها في قناة السويس والطريق إلى الهند، خاصةً مع تصاعد التنافس مع ألمانيا والروس.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أوضح الوعد التناقض الاستعماري في أبشع صوره: بريطانيا تُقاتل العثمانيين باسم حرية العرب، وتَعِد العرب بالاستقلال، وفي الوقت نفسه تعِد الصهاينة بإقامة وطنٍ لهم على حساب العرب. وهذه الازدواجية جعلت فلسطين قضيةً دوليةً معقدةً قبل أن تكون قضيةً عربيةً بسيطة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد جاء نص الوعد بلفور حذرًا في بدايته: وطن قومي لليهود، لا دولة. لكن الإجراءات على الأرض — الهجرة، شراء الأراضي، التسليح، المستوطنات — كانت تهدف إلى دولة. وقد فهم الفلسطينيون ذلك منذ البداية، فقاوموا، لكن العالم لم يكن ليسمع صوتهم في ظل التحالف الاستعماري من الصهيونية.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالثورة الفلسطينية والذاكرة\u003c/h4\u003e\u003cp class=\"ap\"\u003eالثورة الفلسطينية الكبرى سنة ١٩٣٦م كانت نقطة تحولٍ في الوعي الوطني الفلسطيني. استمرت ثلاث سنوات، وشملت كل فلسطين، وطالبت بوقف الهجرة اليهودية وإقامة حكومةٍ وطنيةٍ تمثّل الأغلبية العربية. وقد قمعتها بريطانيا بوحشية، واعتُقل أو قُتل عشرات الآلاف. وقد ظل وعي الفلسطينيين الوطني ينمو مع كل عام، إلى أن تحول إلى ثورةٍ مسلحةٍ ومنظمةٍ بعد النكبة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أنتجت الثورة قياداتٍ فلسطينيةً وطنيةً استمرت في العمل السياسي والمسلح بعد النكبة. لكن الاجتياح الأجنبي والانقسامات العربية حالت دون بناء دولة فلسطينية مستقلة، فكانت النتيجة أن فلسطين ضاعت سياسيًا سنة ١٩٤٨م، وصار شعبها لاجئًا في الدول المجاورة. وهذه التجربة المريرة هي التي جعلت قضية اللاجئين الفلسطينيين جوهر الصراع، لأنها تمسّ شعبًا كاملًا لا مجرد دولة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بقيت القضية الفلسطينية في الذاكرة العربية رمزًا للظلم الاستعماري والصهيوني، ومحورًا للهوية العربية المعاصرة. كل عربيٍّ نشأ في الخمسين عامًا الأخيرة تربّى على صور اللاجئين والقدس والأقصى، وصارت القضية اختبارًا لكل الأنظمة والحكومات. وهذا ما يفسر لماذا لم تجد أيّ تسويةٍ سلميةٍ شعبيةً واسعةً حتى اليوم.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسايكس-بيكو\u003c/b\u003e\u003cspan\u003eاتفاقية سرية قسمت المشرق بين بريطانيا وفرنسا بخطوطٍ ترسمها الأقلام لا التاريخ، وأنتجت دولًا اصطناعية.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eوعد بلفور\u003c/b\u003e\u003cspan\u003eوعد بريطاني بوطن قومي لليهود في فلسطين عام ١٩١٧م، خدم مشروعًا استعماريًا على حساب أهل الأرض.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالانتداب\u003c/b\u003e\u003cspan\u003eنظام عصبة الأمم غطّى الاستعمار بشرعية دولية، وخدع العرب بوعود الاستقلال بينما كانت تُنفّذ الخطط السرية.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالنكبة\u003c/b\u003e\u003cspan\u003eقرار التقسيم ١٩٤٧م ثم إعلان إسرائيل ١٩٤٨م شرد ٧٠٠ ألف فلسطيني، وصارت القضية قلب العالم العربي.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالاتفاقية\u003c/th\u003e\u003cth\u003eالتاريخ\u003c/th\u003e\u003cth\u003eالطرفان\u003c/th\u003e\u003cth\u003eالنتيجة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eمراسلات الحسين-مكماهون\u003c/td\u003e\u003ctd\u003e١٩١٥م\u003c/td\u003e\u003ctd\u003eبريطانيا وشريف مكة\u003c/td\u003e\u003ctd\u003eوعد باستقلال عربي لم يُنفَّذ\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eسايكس-بيكو\u003c/td\u003e\u003ctd\u003e١٩١٦م\u003c/td\u003e\u003ctd\u003eبريطانيا وفرنسا\u003c/td\u003e\u003ctd\u003eتقسيم المشرق سرًا بينهما\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eوعد بلفور\u003c/td\u003e\u003ctd\u003e١٩١٧م\u003c/td\u003e\u003ctd\u003eبريطانيا والصهيونية\u003c/td\u003e\u003ctd\u003eوطن قومي لليهود في فلسطين\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eاتفاقية سيفر\u003c/td\u003e\u003ctd\u003e١٩٢٠م\u003c/td\u003e\u003ctd\u003eالحلفاء وتركيا\u003c/td\u003e\u003ctd\u003eتفكيك الدولة العثمانية رسميًا\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eقرار التقسيم\u003c/td\u003e\u003ctd\u003e١٩٤٧م\u003c/td\u003e\u003ctd\u003eالأمم المتحدة\u003c/td\u003e\u003ctd\u003eدولتان في فلسطين والقدس دولية\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eما أخطر من الاستعمار أنه يُنتج خريطةً تبقى حربًا دائمة بين من لم يُسألوا عنها.\u003c/p\u003e\u003ccite\u003eعبد الرحمن الكواكبي\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eتقسيم المشرق عبر اتفاقية سايكس-بيكو ووعد بلفور والانتداب، فرّد شعبًا واحدًا إلى دولٍ اصطناعيةٍ قائم على طوائف وفتح بابًا للقضية الفلسطينية. وقد ترك هذا التقسيم جرحًا لم يندمل، ما يفسّر استمرار الصراع حتى اليوم.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"resistance-movements","n":"حركات المقاومة والصحوة","ic":"✊","part":"عصر الاستعمار","h":"\u003carticle class=\"ch3\" id=\"resistance-movements\" data-toc=\"حركات المقاومة والصحوة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eعصر الاستعمار\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٤ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e١\u003ci\u003e.\u003c/i\u003e٤\u003c/span\u003e\n            \u003ch3\u003eحركات المقاومة والصحوة\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eكيف قاومت الشعوب الإسلامية الاحتلال؟ وكيف نشأت الأفكار التي أنهت الاستعمار؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eلم يكن الاستعمار مرحلةً ساكنةً في تاريخ المسلمين، بل كان قرنًا كاملًا من المقاومة المتواصلة. قاوم الناس بالسلاح في الجزائر وليبيا والسودان، وقاوموا بالفكر في مصر وسوريا، وقاوموا بالسياسة في تركيا وإيران. وقد تعددت أشكال المقاومة لكنها تشترك في هدفٍ واحد: استعادة الكرامة والسيادة. وقد تدرّجت هذه الأشكال من الدفاع عن الأرض إلى المطالبة بالاستقلال، وهو ما صنع الوعي الذي أنهى الاستعمار في النهاية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت المقاومة المسلحة الشكل الأول والأكثر تكلفةً. الأمير عبد القادر في الجزائر، والسنوسية في ليبيا، والمهديين في السودان، كلهم قادوا ثوراتٍ كبرى ضد الاحتلال الأوروبي. وقد سحق الاحتلال معظم هذه الحركات بالتكنولوجيا العسكرية، لكنها أنتجت رموزًا وطنيةً باقيةً في الذاكرة الجمعية. وهذه الرموز الوطنية ظلت تُلهم الأجيال، وتُذكّرهم بأن الكرامة لا تُهزم بالمدفع بل بإرادةٍ لا تنكسر.\u003c/p\u003e\u003cp class=\"ap\"\u003eأما المقاومة الفكرية فقد كانت أعمق أثرًا. جمال الدين الأفغاني ومحمد عبده في مصر، وأحمد خان في الهند، وأفغانيته واجتهاداته، كلهم دعوا إلى إصلاح التعليم والعلوم وإعادة قراءة التراث بمنطق العصر. وقد فهم هؤلاء أن التحرر الحقيقي يبدأ من تحرير العقل المسلم من التقليد والجمود. وقد أدرك هؤلاء المصلحون أن الأمة لا تتقدم بتقليد الحداثة شكلًا فقط، بل بإعادة بناء منظومتها المعرفية والأخلاقية من الداخل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ظهرت في هذه الفترة أيضًا الحركات الصحفية والمجلات الأدبية التي ناضلت ضد الاستعمار. جريدة العروة الوثقى لمحمد القدسي، والأهرام لسليم النقاش، واللواء لمصطفى كامل، وغيرها. هذه الصحف كانت أحزابًا سياسيةً مقنّعةً، تزرع الوعي وتنتقد الاحتلال وتُعلّم الناس معنى الوطنية. وهذا يعني أن الصحافة كانت تُشكّل رأيًا عامًا مقاومًا للاحتلال، قبل أن تكون وسيلةً لنقل الأخبار والتسلية.\u003c/p\u003e\u003cp class=\"ap\"\u003eومن أهم الحركات السياسية التي ظهرت: حزب الوفد المصري بقيادة سعد زغلول سنة ١٩١٨م، والحزب الوطني في سوريا، والجمعيات السرية في فلسطين. وقد انتقلت الأحزاب العربية من العمل الخيري إلى العمل السياسي المنظم، وصار مطلب الاستقلال هدفًا واضحًا لا شعارًا. وهذا الانتقال من العمل الخيري إلى السياسة هو الذي ميّز العصر الحديث عن كل العصور السابقة في المنطقة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ساعدت الحربان العالميتان في تعزيز روح المقاومة. سقطت الدولة العثمانية بعد الحرب الأولى، فظهر الفراغ الذي ملأته الدول الوطنية. وخلال الحرب الثانية، انتقلت فكرة حق تقرير المصير من ميثاق الأطلسي إلى العالم العربي، فصار الاستقلال مطمعًا ممكنًا لا مجرد حلم. وقد فهم قادة المنطقة أن الفرصة التاريخية للتحرر تأتي بالنضال لا بالتسول، وأن حكومات الاحتلال لا تفعل شيئًا مجانًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eولم تكن المقاومة الإسلامية موحدةً دائمًا: انتشرت فيها تياراتٌ متعددة، إسلامية ووطنية ويسارية وليبرالية. وقد تنافست هذه التيارات على قيادة العالم العربي بعد الاستقلال، وهي منافسةٌ ما زالت مستمرةً بصيغٍ مختلفةٍ حتى اليوم. وقد ظلّ التنافس بين هذه التيارات سمةً للسياسة العربية الحديثة، وهو ما أضعف أحيانًا القدرة على مواجهة التحديات المشتركة.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eجمال الدين الأفغاني: الصحوة الفكرية\u003c/h4\u003e\u003cp class=\"ap\"\u003eالسيد جمال الدين الأفغاني هو رائد حركة الإصلاح الفكري في العالم الإسلامي الحديث. جاب عواصم الإسلام من بغداد ودمشق إلى القاهرة وإستانبول، يدعو إلى الوحدة الإسلامية وإصلاح التعليم ونقد التقليد. وقد فهم الاستعمار في صورته الحقيقية: ليس احتلالًا عسكريًا فقط، بل احتلالًا فكريًا يحوّل الشعوب إلى أسرى له.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد رفض الأفغاني فكرة أن التخلف مصدره الإسلام، بل اعتبره نتيجة الجمود عن المبادئ الإسلامية الأولى. دعا إلى التجديد والاجتهاد وإعادة قراءة النص في ضوء العقل، ودعم استخدام العقل كأداةٍ للفهم والتنمية. وقد جمع بين العلم والفلسفة والسياسة في مشروعٍ واحدٍ لتحديث الأمة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ترك الأفغاني تلاميذًا نهضوا بفكره، أبرزهم محمد عبده في مصر الذي واصل مشروع الإصلاح التعليمي والديني. وقد ظل فكره مصدر إلهامٍ لكل الحركات الإصلاحية الإسلامية حتى اليوم، لأنه حذّر مبكرًا من خطر الاستلاب الثقافي الذي يصيب الشعوب قبل المستعمر. وهذا يعني أن المشروع الإصلاحي ليس نسخةً مستوردةً من الغرب، بل هو إعادة نشاطٍ لمبادئ الأمة في ضوء واقعها الجديد.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eثورة ١٩١٩ المصرية\u003c/h4\u003e\u003cp class=\"ap\"\u003eثورة ١٩١٩ في مصر كانت أول ثورةٍ شعبيةٍ شعبيةٍ واسعةٍ في العالم العربي ضد الاستعمار. انطلقت بعد نفي الزعيم سعد زغلول، وشارك فيها المسلمون والأقباط معًا، وشملت القرى والمدن، وأعلنت عصيانًا مدنيًا عامًا. وقد أسقطت مفهوم أن الاستعمار قوةٌ لا تُقهر. وقد أعلنت الثورة أن العزل أو الاستسلام لم يعد خيارًا، وأن الشعب حين يصطفّ خلف قضيته لا يمكن كسره.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد وحدت الثورة المصريين خلف قضية واحدة، وأنتجت قياداتٍ سياسيةً واعيةً، وأسست لمفهوم الوطني الجامع الذي يجمع مختلف الأطياف. وقد اضطرت بريطانيا بعدها إلى الاعتراف باستقلال مصر الشكلي سنة ١٩٢٢م، مع الاحتفاظ بشؤون الدفاع والعلاقات الخارجية والأمن. وهذا يعني أن بريطانيا فهمت أن السيطرة بالقوة المطلقة صارت مكلفةً سياسيًا، فاختارت التراجع الجزئي للحفاظ على مصالحها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بقيت الثورة درسًا للسود: المقاومة المدنية الشاملة قد تُنتج نتائج لا تُنتجها الجيوش وحدها، والوحدة الوطنية هي أقوى أداة في مواجهة الاحتلال. وقد ألهمت ثورة ١٩١٩ كل الثورات العربية اللاحقة، من ثورة يوليو إلى حركات التحرر في المغرب العربي. وهذه التجربة هي التي جعلت المقاومة المدنية خيارًا استراتيجيًا في العالم العربي، لأنها تُظهر أن الشعب نفسه هو الفاعل.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eحركة تركيا الفتاة\u003c/h4\u003e\u003cp class=\"ap\"\u003eبعد سقوط الدولة العثمانية وسعي الحلفاء لتقسيم تركيا نفسها، برز مصطفى كمال أتاتورك وأسّس الجمهورية التركية سنة ١٩٢٣م. هذا الحدث كان الأبرز في العالم الإسلامي لأنه أثبت أن الدولة الإسلامية يمكن أن تغيّر نفسها من الداخل بالكامل وتنتقل إلى الحداثة دون أن تفقد سيادتها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد طبّق أتاتورك إصلاحاتٍ جذرية: تغيير الأبجدية من العربية إلى اللاتينية، وإلغاء الخلافة الإسلامية سنة ١٩٢٤م، وإعلان العلمانية، ومنح المرأة حق التصويت. هذه القرارات كانت صدمةً للعالم الإسلامي، لكنها انتجت تركيا قويةً مستقلةً لم تُستعمر قط. وهذه القرارات الجذرية ظلّت محلّ جدلٍ حتى اليوم، إذ يراها بعضهم انفصالًا عن الهوية وآخرون ضرورةً للتقدم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد فهم العالم الإسلامي درس تركيا على مستويين: أولًا، أن الإصلاح الجذري ممكنٌ وأن السلفية السياسية ليست قدرًا. ثانيًا، أن فصل الدولة عن الدين مسألة خلافية كبرى في العالم الإسلامي، وأن النموذج التركي لم يُقبل كما هو في بلاد العرب. وهذه المفارقة ما زالت تُشكّل جدلًا حتى اليوم.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمقاومة متعددة\u003c/b\u003e\u003cspan\u003eقاوم الشعب بالسلاح والفكر والسياسة معًا، وأنتجت رموزًا وطنيةً أنارت الطريق نحو الاستقلال.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالأفغاني ومحمد عبده\u003c/b\u003e\u003cspan\u003eأسلّسا العقل المسلم على فكرة الإصلاح والاجتهاد، وحذّرا من الاستلاب الثقافي قبل الاستلاب السياسي.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eثورة ١٩١٩\u003c/b\u003e\u003cspan\u003eالثورة الشعبية المصرية أسّست لمفهوم الوطنية الجامعة، وأثبتت أن المقاومة المدنية الشاملة تنتج نتائج.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eتركيا الفتاة\u003c/b\u003e\u003cspan\u003eأصلحت تركيا نفسها من الداخل فصلًا جذريًا، وأنتجت نموذجًا علمانيًا حديثًا لم يتقبله العالم العربي بالكامل.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالحركة\u003c/th\u003e\u003cth\u003eالقائد\u003c/th\u003e\u003cth\u003eالأداة\u003c/th\u003e\u003cth\u003eالنتيجة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالمقاومة الجزائرية\u003c/td\u003e\u003ctd\u003eالأمير عبد القادر\u003c/td\u003e\u003ctd\u003eالجهاد المسلح\u003c/td\u003e\u003ctd\u003eشكلت رمزًا وطنيًا باقيًا\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالإصلاح الفكري\u003c/td\u003e\u003ctd\u003eجمال الدين الأفغاني\u003c/td\u003e\u003ctd\u003eالتعليم والكتابة\u003c/td\u003e\u003ctd\u003eأسّس لصحوة فكرية عربية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eثورة ١٩١٩\u003c/td\u003e\u003ctd\u003eسعد زغلول\u003c/td\u003e\u003ctd\u003eالعصيان المدني\u003c/td\u003e\u003ctd\u003eاستقلال مصر الشكلي ١٩٢٢م\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eتركيا الفتاة\u003c/td\u003e\u003ctd\u003eمصطفى كمال\u003c/td\u003e\u003ctd\u003eالإصلاح الجذري\u003c/td\u003e\u003ctd\u003eتأسيس الجمهورية التركية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالحركة الوطنية\u003c/td\u003e\u003ctd\u003eمصطفى كامل\u003c/td\u003e\u003ctd\u003eالصحافة والحزب\u003c/td\u003e\u003ctd\u003eتكوين الوعي السياسي الحديث\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eالاحتلال لا يُبنى على السلاح فقط، بل على قناعة المحتل بقدرته. فإذا زالت هذه القناعة، فقد انتهى الاحتلال.\u003c/p\u003e\u003ccite\u003eجمال الدين الأفغاني\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eقاومت الشعوب الإسلامية الاستعمار بأشكال متعددة: السلاح والفكر والسياسة. أنجبت هذه المقاومة رموزًا كالأفغاني ومحمد عبده وسعد زغلول وكمال أتاتورك، وأسّست لوعيٍ وطنيٍّ جامعٍ أنهى الاستعمار السياسي، لكنه لم يُنهِ تحديات الاستقلال الحقيقي.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-2","n":"عصر الإصلاح والنهضة","ic":"🏭","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-2\" style=\"--c:#37474F\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🏭\u003c/div\u003e\n      \u003ch2\u003eعصر الإصلاح والنهضة\u003c/h2\u003e\n      \u003cp\u003eمع تزايد الضغط الاستعماري وتراكم أخطاء الدولة العثمانية، بدأ المسلمون يفكرون في مصيرهم ويبحثون عن طريقٍ للنجاة. لم يكن الاستعمار حدثًا عسكريًا فقط، بل كان تحديًا حضاريًا: كيف نحافظ على هويتنا ورثائنا ونواكب العصر؟ هذا القسم يتناول محاولات الإصلاح في مصر والدولة العثمانية، والنهضة الفكرية التي أنتجتها، والبدايات الأولى لتحرّر المرأة وتعليمها.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#muhammad-ali-modernization\"\u003eمحمد علي وبناء الدولة الحديثة\u003c/a\u003e\u003ca href=\"#ottoman-tanzimat\"\u003eالتنظيمات العثمانية ومحاولات الإصلاح\u003c/a\u003e\u003ca href=\"#intellectual-renaissance\"\u003eالنهضة الفكرية والصحافة\u003c/a\u003e\u003ca href=\"#women-awakening\"\u003eتعليم المرأة وبدايات تحرّرها\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"muhammad-ali-modernization","n":"محمد علي وبناء الدولة الحديثة","ic":"🏗️","part":"عصر الإصلاح والنهضة","h":"\u003carticle class=\"ch3\" id=\"muhammad-ali-modernization\" data-toc=\"محمد علي وبناء الدولة الحديثة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eعصر الإصلاح والنهضة\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ١ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٢\u003ci\u003e.\u003c/i\u003e١\u003c/span\u003e\n            \u003ch3\u003eمحمد علي وبناء الدولة الحديثة\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eكيف بنى محمد علي دولة حديثة في مصر؟ وما دروس نجاحه وفشله؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eمحمد علي باشا هو مؤسس الدولة المصرية الحديثة، وقد حكم من سنة ١٨٠٥م حتى ١٨٤٨م. لم يكن مصريًا، بل كان ألبانيًا في الجيش العثماني، لكنه فهم مبكرًا أن مصر لا يمكنها البقاء تحت الإدارة العثمانية المتخلفة. بدأ بتصفية المماليك في قلعة القاهرة سنة ١٨١١م، ثم فرض سيطرته على البلاد، وأنشأ حكمًا وراثيًا استمر في أسرته حتى منتصف القرن العشرين.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أنشأ محمد علي جيشًا حديثًا على النموذج الأوروبي، وأرسل البعوث إلى فرنسا وإنجلترا ليتعلم الضباط الفنون العسكرية. بنى المصانع الحربية في بولاق، وأنشأ ترسانة بحرية، واشترى السفن الحديثة. وقد بلغ جيشه في ذروته أكثر من مئة ألف جندي، وسيطر على بلاد الشام والحجاز والسودان. وقد أثبت هذا الجيش قدرة مصر على مواجهة العثمانيين والأوروبيين معًا، لكنه أيضًا ثبّت قاعدة الاعتماد على القوة العسكرية بدل المؤسسات.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد اهتم أيضًا بالزراعة ووسّع الري وأدخل محاصيل جديدة كالقطن طويل التيل الذي صار أهم صادرات مصر إلى أوروبا. وقد حوّل محمد علي الفلاحين إلى مزارعين إجباريين يزرعون ما تطلبه الدولة لا ما يحتاجونه، فاستفادت مصر ماليًا لكن الفلاح عانى كثيرًا من هذا النظام. وهذه التجربة تُعلّمنا أن النمو الاقتصادي القسري يمكن أن يُنتج ثروة للدولة، لكنه يُنتج فقرًا اجتماعيًا إن لم يصحبه عدلٌ في التوزيع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي التعليم، أنشأ محمد علي مدارس عسكرية وإدارية وطبية، وأرسل البعوث التعليمية إلى أوروبا في بعثة رفاعة الطهطاوي. وقد أنشئت مطبعة بولاق التي نشرت الكتب العلمية والترجمات، وصارت مركزًا نهضةٍ حقيقية. وقد خرجت من هذه المدارس طبقة مثقفة جديدة أصبحت نواة النهضة الأدبية والفكرية في مصر. وقد ظلّت المطبعة تصدر الكتب لعقودٍ طويلة، فأصبحت أهم منبرٍ لنشر العلم والمعرفة في مصر والعالم العربي كله.\u003c/p\u003e\u003cp class=\"ap\"\u003eلكن التجربة محمد علي انتهت بالفشل النسبي، لأنها بقيت رهن الإدارة الفردية. ورث حفيده عباس الأول وخلفه السعيد فولد الخديوي إسماعيل، وقد تورطت مصر في ديون ضخمة لمشروعات إسماعيل الكبرى كقناة السويس وعمارة القاهرة، واضطرت لبيع أسهم القناة لبريطانيا سنة ١٨٧٥م، ودخلت تحت الاحتلال المالي ثم البريطاني المباشر سنة ١٨٨٢م. وهكذا يُقدّم تاريخ مصر درسًا عمليًا في الترابط بين الدين الخارجي وخسارة السيادة السياسية والاقتصادية معًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eومع ذلك، فإن إرث محمد علي أساسيٌّ للعالم العربي: أثبت أن الدولة الإسلامية يمكنها تحديث نفسها من الداخل، وأن التربية والتعليم هما أساس التقدم. وقد فهم العرب من بعده أن التحديث ليس استيرادًا للسلع فقط، بل هو بناء إنسانٍ جديدٍ قادر على إدارة مصنعه وجيشه وزراعته بنفسه. وهذا يعني أن التقدم لا يُقاس بعدد المصانع والمدافع، بل بقدرة الأمة على إنتاج المعرفة وتطبيقها بنفسها.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eرفاعة الطهطاوي: الجسر بين الحضارتين\u003c/h4\u003e\u003cp class=\"ap\"\u003eرفاعة الطهطاوي هو أحد أعظم العلماء المصريين في العصر الحديث، وقد رافق بعثة محمد علي التعليمية إلى باريس سنة ١٨٢٦م. درس الفرنسية والعلوم الحديثة، وترجم كتبًا كثيرة، وكتب عن فرنسا وصفًا دقيقًا نشر الثقافة العربية في أوروبا. وبعد عودته أسّس مدرسة الألسن في أبو زعبل، وترجم فيها كتب العلوم والفلسفة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد سعى الطهطاوي إلى التوفيق بين التراث العربي والفكر الأوروبي، فلم يكن غربيًا ولا تقليديًا متشددًا. كتب في التربية ووجوب تعليم المرأة، وفي ضرورة تحديث العلوم الشرعية من داخلها. وقد فتح بترجماته وبعثاته بابًا واسعًا للتعرف على الحضارة الحديثة بلغتها الأصلية دون وسيط.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أسهم الطهطاوي في نهضة فكريةٍ شملت الأدب والمقالة والصحة والتعليم. خرج من مدرسته أحمد كامل وقاسم أمين وأعلام آخرون شكّلوا النهضة المصرية التي اكتملت في أواخر القرن التاسع عشر. وظل إرثه حاضرًا في كل مشروعات الإصلاح الفكري التي تلته. وهذا يعني أن التجديد الحقيقي يبدأ من الإنسان المثقف لا من الأدوات المستوردة التي قد تُطوَّر ولا تُثمِّر.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eقناة السويس: حلم ومخاطر\u003c/h4\u003e\u003cp class=\"ap\"\u003eقناة السويس هي المشروع الأعظم في تاريخ مصر الحديث، فقد شقّها الخديوي إسماعيل بنظام المشاركة مع شركة فرنسية، وافتُتحت سنة ١٨٦٩م. كانت القناة حلمًا حضاريًا يربط البحرين الأبيض والأحمر، ويقصّر طريق التجارة بين أوروبا وآسيا. وقد كلّفت المشروع ملايين الجنيهات ودم آلاف الأرواح من الفلاحين المصريين.\u003c/p\u003e\u003cp class=\"ap\"\u003eلكن القناة كانت أيضًا سبب دمار الخزانة المصرية، فقد استدان إسماعيل من المصارف الأوروبية لإنهاء المشروع ولمرافق أخرى، فتراكمت الديون حتى باع أسهم مصر في القناة لبريطانيا. وقد أصبح هذا البيع بداية تراجع السيادة المصرية، إذ صارت القناة شريانًا استراتيجيًا لأوروبا لا لمصر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ظلت القناة مصدر توترٍ دائم في السياسة المصرية: احتلها البريطانيون سنة ١٨٨٢م، وحاول ناصر تأميمها سنة ١٩٥٦م فكان ذلك ذروة كفاحه الوطني. وهكذا تجسد القناة تاريخ الاستقلال المصري بكل تعقيده: مشروع ينبوع ثروة، لكنه أيضًا بوابة التدخل الأجنبي. وهذا يعني أن المشاريع الكبرى قد تكون مصدر قوةٍ أو سبب ضعف، حسب طريقة تمويلها ومن يملك التحكم في مواردها.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eدروس تجربة محمد علي\u003c/h4\u003e\u003cp class=\"ap\"\u003eالتجربة محمد علي في التحديث تقدّم دروسًا متعددة. أولاً: التحديث الحقيقي يأتي من فهم أعمق لبنية المجتمع وليس بالتقليد السطحي. ثانيًا: التعليم هو الأداة الأساسية لأي تقدم حقيقي، وقد أثبت ذلك البعثات التي أرسلها. ثالثًا: الاقتصاد القوي هو أساس السيادة، وقد أثبت ذلك الديون التي تسببت في الاحتلال المالي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد يبدو أن محمد علي نجح في بناء دولة الحديثة، لكنه فشل في بناء مواطن حرّ. استمر حكمه وورثته وفق نظامٍ أوتوقراطيٍّ مطلق، بلا دستورٍ وبلا تمثيلٍ شعبي. وهذا ما يجعل التحديث السياسي شرطًا لكل تقدم مستدام، وهو الدرس الأكثر أهمية في تجربته. وهذا يعني أن التحديث الذي يُبني مؤسساتٍ دائمةً هو وحده الذي يصمد أمام الأزمات ويُورَّث للأجيال اللاحقة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد فهم العالم العربي من تجربة محمد علي أن التحديث ليس خيارًا بل ضرورة، وأن الفرصة لا تُفوَّت إلا على حساب الاستقلال نفسه. وهذا ما دفع قادة المنطقة من بعد محمد علي لمحاكاة نموذجه، لكنهم لم يتخلصوا من عيوبه: الاعتماد على الفرد وبناء البنية التحتية قبل الإنسان.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eتأسيس الدولة الحديثة\u003c/b\u003e\u003cspan\u003eمحمد علي أسّس دولة مركزية حديثة في مصر بجيش نظامي ومصانع ومدارس وزراعة متطورة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالطهطاوي والبعوث\u003c/b\u003e\u003cspan\u003eبعثة تعليمية إلى أوروبا أسست للتعرف على الحضارة الحديثة، وأنجبت جيل النهضة المصرية.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eقناة السويس\u003c/b\u003e\u003cspan\u003eمشروع حضاري عظيم لكنه استنزف الخزانة، وببيع أسهمه لبريطانيا فقدت مصر سيادتها.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eتحديث بلا حرية\u003c/b\u003e\u003cspan\u003eمحمد علي بوى دولة قوية لكنه لم يبنِ مواطنًا حرًا، وهذه هي المعضلة التي واجهت المنطقة.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمجال\u003c/th\u003e\u003cth\u003eإنجاز محمد علي\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالجيش\u003c/td\u003e\u003ctd\u003eجيش حديث وثكنات ومدفعية\u003c/td\u003e\u003ctd\u003eالسيطرة على الشام والسودان\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالتعليم\u003c/td\u003e\u003ctd\u003eمدارس عسكرية وبعوث أوروبية\u003c/td\u003e\u003ctd\u003eنهضة فكرية مصرية وسورية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالصناعة\u003c/td\u003e\u003ctd\u003eمصانع الحربية والمنسوجات\u003c/td\u003e\u003ctd\u003eالاكتفاء والتوسع الاقتصادي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالزراعة\u003c/td\u003e\u003ctd\u003eالري والقطن طويل التيل\u003c/td\u003e\u003ctd\u003eصادرات ضخمة وفقر الفلاح\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالإعلام\u003c/td\u003e\u003ctd\u003eمطبعة بولاق والجرائد\u003c/td\u003e\u003ctd\u003eنشر العلم والوعي السياسي\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eأبناءنا ليسوا ملكًا لنا، بل هم أمانةُ المستقبل التي نُحاسب عليها.\u003c/p\u003e\u003ccite\u003eمحمد علي باشا\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eمحمد علي أسّس أول دولة حديثة في العالم الإسلامي، لكن تجربته بقيت رهن الإدارة الفردية والاعتماد على الديون الخارجية. وقد علّمت المنطقة أن التحديث الشامل لا يقوم إلا على تعليم المواطن وبناء الاقتصاد وتمكينه من السياسة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"ottoman-tanzimat","n":"التنظيمات العثمانية ومحاولات الإصلاح","ic":"📋","part":"عصر الإصلاح والنهضة","h":"\u003carticle class=\"ch3\" id=\"ottoman-tanzimat\" data-toc=\"التنظيمات العثمانية ومحاولات الإصلاح\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eعصر الإصلاح والنهضة\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٢ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٢\u003ci\u003e.\u003c/i\u003e٢\u003c/span\u003e\n            \u003ch3\u003eالتنظيمات العثمانية ومحاولات الإصلاح\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eما هي التنظيمات الخيرية؟ ولماذا فشلت في إنقاذ الدولة العثمانية؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eعندما دخلت الدولة العثمانية القرن التاسع عشر، كانت قد فقدت معظم أراضيها الأوروبية وتبحث عن وسيلةٍ للنجاة من التجزئة. أصدر السلطان محمود الثاني سنة ١٨٢٦م مرسومه بإلغاء الإنكشارية وتأسيس جيش حديث، وكان ذلك بداية عصر التنظيمات أو الإصلاحات الكبرى. وقد اتخذ محمود الثاني أيضًا ملابس أوروبية وشرع في تحديثات إدارية وعسكرية واسعة. وقد فهم السلطان محمود أن بقاء الدولة يتوقف على قدرتها على مجاراة أوروبا في التقنية والتنظيم العسكري والإداري.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم جاء عصر التنظيمات الخيرية سنة ١٨٣٩م، التي أعلنها السلطان عبد المجيد الأول في خط شريف جاء في متنٍ دينيٍّ ليضمن قبول الرأي العام. ضمنت هذه التنظيمات حماية الحياة والملك والكرامة للجميع، ومساواة في الضرائب والخدمة العسكرية، وتأسيس محاكم نظامية. وقد مثّلت أول دستور عثماني حديث في العالم الإسلامي. وقد جاء هذا الخط الشريف مستجيبًا لضغوط أوروبية داخلية، لكنه مثّل في النهاية أول اعتراف رسمي بحقوق الفرد في الدولة العثمانية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد توسعت التنظيمات في العهد التالي لتشمل إصلاح التعليم بتأسيس جامعة دار الفنون، وإصلاح القضاء بتأسيس المحاكم النظامية، وإصلاح الإدارة بتقليد النظام الفرنسي المركزي. وأُنشئت البلديات الحديثة وأول برلمان عثماني سنة ١٨٧٦م في عهد السلطان عبد الحميد الثاني، لكنه أُغلق بعد عامين عندما علّق الدستور. وهذا يعني أن الإصلاحات ظلّت هشةً لأنها لم تُترجم إلى ثقافةٍ سياسيةٍ راسخةً في المجتمع العثماني نفسه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوسميت التنظيمات بالخيرية لأنها جاءت باسم العدالة والإصلاح، لكنها في جوهرها كانت محاولةً لإنقاذ الدولة من الانهيار. وقد اعتمدت على استقدام الخبرات الأوروبية، وإرسال الطلاب إلى باريس ولندن، واعتماد الفرنسية كلغة إدارية عليا. وهذا التحديث لم يكن يجذر نفسه في المجتمع التركي، بل بقي نخبويًا على قمة هرم اجتماعي رفضه. وهذا يعني أن التحديث النخبوي يحتاج إلى قاعدة شعبية واسعة، وإلا بقي كما بدأ: قشرةً على سطحٍ لم يتغير.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد فشلت التنظيمات في ثلاثة مجالات أساسية. أولاً: ركزت على الدولة لا المجتمع، فلم تُنشئ طبقة وسطى قوية. ثانيًا: جلبت الديون والقروض الأوروبية لتمويل مشروعاتها، ففقدت الدولة سيادتها الاقتصادية. ثالثًا: لم تُعالج القضية القومية، فبقيت شعوب الدولة تتطلع إلى الاستقلال عن الدولة لا المشاركة فيها. وهذا يعني أن الدولة التي لا تُوّزع سلطتها على مكوناتها، تفقدها الواحدة تلو الأخرى حتى تنتهي إلى التجزئة الكاملة.\u003c/p\u003e\u003cp class=\"ap\"\u003eومع ذلك، فإن التنظيمات العثمانية تركت إرثًا مهمًا في العالم الإسلامي. أسسّت لمفهوم المواطنة والمساواة أمام القانون، وأول تجربة دستورية في الدولة العثمانية. وقد أصبح هذا الإرث أساس الجمهورية التركية التي قامت بعد الحرب العالمية الأولى، وأيضًا مثالًا لما يمكن أن تكون عليه الإصلاحات في المنطقة. وهذه التجربة ما زالت تُدرَّس كأنموذجٍ للإصلاح الذي يفشل عندما يبقى ناقصًا وغير مصحوبٍ بشرعيةٍ سياسية.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eإلغاء الإنكشارية: إصلاحٌ بأيّ ثمن\u003c/h4\u003e\u003cp class=\"ap\"\u003eإلغاء الإنكشارية سنة ١٨٢٦م كان ضرورة عسكرية بعد أن أصبحت قوة عسكرية تقليدية عاجزة أمام الجيوش الأوروبية. لكنه كان أيضًا ثورةً اجتماعية، فقد أنهى سلطة طبقة عسكرية عريقة كانت تشارك في الحكم منذ قرون. وقد قابل الإنكشارية الإلغاء بالتمرد فسحقهم محمود الثاني في ست سنوات عرفت بواقعة الميمنة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد حلّ محل الإنكشارية جيش نظامي حديث يُسمّى العساكر النظامية، وله ثكنات زي موحد وتدريب على الأسلحة الحديثة. هذا الجيش أصبح أداة الدولة المركزية، لكنه أيضًا أداة قمعٍ داخليّ في مواجهة القوميات التي طالبت بالاستقلال. وهذا يعني أن التحديث العسكري لم يكن يحمل بالضرورة تحديثًا سياسيًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد فهم العرب في الولايات العثمانية أن إلغاء الإنكشارية لا يعني تحديثًا لصالحهم، بل يعني استبدال قوة بسلطة أخرى أكثر مركزية وطُموحًا. وهذا أثار مشاعر معادية للتنظيمات في بعض الولايات، وخاصة في مصر التي استقلت بحكم محمد علي. وهذا يعني أن إلغاء القوى القديمة وحده لا يكفي لبناء دولة حديثة، بل لا بد من إشراك الجميع في هذا البناء.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالمساواة: قانونٌ على الورق\u003c/h4\u003e\u003cp class=\"ap\"\u003eضمنت التنظيمات المساواة بين المسلمين والمسيحيين واليهود في الحقوق والواجبات، وألغت النظام التقليدي الذي يميّز بين أهل الذمة وغيرهم. وقد استقبلت الأقليات غير المسلمة هذا التغيير بالترحيب، لأنه أزال التمييز القانوني الضريبي والعسكري ودخول مراكز الإدارة.\u003c/p\u003e\u003cp class=\"ap\"\u003eلكن هذه المساواة بقيت ناقصة في التطبيق، إذ بقي المسلمون في القمة العسكرية والسياسية، وبقي غير المسلمين في التجارة والمهن. وقد اعتبر بعضهم أن التنظيمات كانت تخدم فرنسا وبريطانيا في الضغط على الدولة، لأن الدول الأوروبية كانت تضغط باسم حماية الأقليات. وهكذا صار قانون المساواة أداة تدخل خارجيٍّ أكثر من كونه تحولًا داخليًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد حاول العرب في الولايات السورية والعراقية الاستفادة من هذه التنظيمات، فبدأ بعضهم بالمشاركة في المجالس البلدية والإدارة. لكنهم اكتشفوا أن المركزية العثمانية لا تُتيح لهم نفوذًا حقيقيًا، وأيضًا أن التوازن الطائفي في الولايات كان يحكم الإدارة أكثر من المساواة المدنية. وهذه التركة بقيت تؤثر في سياسة المنطقة حتى اليوم.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eعبد الحميد الثاني: سلطة الاستبداد الشرقي\u003c/h4\u003e\u003cp class=\"ap\"\u003eحكم السلطان عبد الحميد الثاني نحو ثلاثين عامًا، وكان عهده مليئًا بالتناقضات. من جهة، دعم مشروعات التحديث: سكك حديد الحجاز، وخطوط التلغراف، ومؤسسة التعليم. من جهة أخرى، علّق الدستور وأغلق البرلمان، وأسّس نظام بولس سري، وقمع المعارضة، وسجن المصلحين، وطارد الصحف.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد استخدم عبد الحميد الدين كأداة شرعية لحكمه، فत्वّس بلقب الخليفة ودعم الجامعة الإسلامية، وروج لفكرة الجامعة الإسلامية ليجذب العرب ضد القوميين الأتراك. لكن العرب لم يشعروا بولاء حقيقي لحكمه، بل رأوه استبدادًا دينيًا يُخفي ضعف الدولة عن طريق التشدّق بالمبادئ.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سنة ١٩٠٨م، أطاح الاتحاد والترقي بعبد الحميد في ثورة تركيا الفتاة الثانية، وأعادوا الدستور. لكنهم لم يحكموا طويلًا قبل أن تقع الدولة في الحرب العالمية الأولى وتنهار. وهكذا يبقى درس عبد الحميد: أن السلطة الذاتية وإن طوّلت عمرها، فإنها لا تُنقذ دولة من الانهيار إذا لم تؤسس شرعيةً حقيقيةً.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eإلغاء الإنكشارية\u003c/b\u003e\u003cspan\u003eمحمود الثاني قضى على قوة عسكرية تقليدية ليؤسس جيشًا حديثًا، لكنه لم يُحدث تغييرًا سياسيًا.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالتنظيمات الخيرية\u003c/b\u003e\u003cspan\u003eأول دستور عثماني ١٨٣٩م ضمن المساواة والمواطنة، لكن تطبيقه بقي ناقصًا وأداةً للتدخل الأوروبي.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأول برلمان\u003c/b\u003e\u003cspan\u003eأُنشئ برلمان عثماني ١٨٧٦م ثم أُغلق بعد سنتين، وتركت التجربة إرثًا دستوريًا مهمًا.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eعبد الحميد\u003c/b\u003e\u003cspan\u003eاستخدم الإسلام لشرعية استبداده، فحاول توحيد المسلمين بالجامعة الإسلامية لكنه فشل في إنقاذ الدولة.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمرحلة\u003c/th\u003e\u003cth\u003eالسلطان\u003c/th\u003e\u003cth\u003eأهم إصلاح\u003c/th\u003e\u003cth\u003eالنتيجة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالبداية\u003c/td\u003e\u003ctd\u003eمحمود الثاني\u003c/td\u003e\u003ctd\u003eإلغاء الإنكشارية والجيش الحديث\u003c/td\u003e\u003ctd\u003eبناء دولة مركزية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالتنظيمات\u003c/td\u003e\u003ctd\u003eعبد المجيد الأول\u003c/td\u003e\u003ctd\u003eخط شريف ومساواة ومحاكم\u003c/td\u003e\u003ctd\u003eاعتراف قانوني بالمواطنة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالإصلاحات\u003c/td\u003e\u003ctd\u003eعزيز\u003c/td\u003e\u003ctd\u003eإنشاء جامعة دار الفنون\u003c/td\u003e\u003ctd\u003eجيل مثقف حديث\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالاستبداد\u003c/td\u003e\u003ctd\u003eعبد الحميد الثاني\u003c/td\u003e\u003ctd\u003eتعليق الدستور والجامعة الإسلامية\u003c/td\u003e\u003ctd\u003eتراكم الأزمات وسقوط الدولة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالثورة\u003c/td\u003e\u003ctd\u003eالاتحاد والترقي\u003c/td\u003e\u003ctd\u003eإعادة الدستور ١٩٠٨م\u003c/td\u003e\u003ctd\u003eسلطة جديدة قصيرة العمر\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eلا تصلح الدولة إذا بقي الاستبداد، ولا تتحرّر الأمة إذا بقي التجهيل.\u003c/p\u003e\u003ccite\u003eنامق كمال\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eالتنظيمات العثمانية كانت محاولة جادة للإصلاح ضمنت المساواة والمواطنة وأول دستور، لكنها بقيت نخبوية ومركزية ومُثقلة بالديون. وقد فشلت في خلق طبقة وسطى قوية أو معالجة القضية القومية، فلم تُنقذ الدولة من الانهيار.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"intellectual-renaissance","n":"النهضة الفكرية والصحافة","ic":"✍️","part":"عصر الإصلاح والنهضة","h":"\u003carticle class=\"ch3\" id=\"intellectual-renaissance\" data-toc=\"النهضة الفكرية والصحافة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eعصر الإصلاح والنهضة\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٣ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٢\u003ci\u003e.\u003c/i\u003e٣\u003c/span\u003e\n            \u003ch3\u003eالنهضة الفكرية والصحافة\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eكيف أصبحت الصحافة والمقالة سلاح الأمة في مواجهة الاستعمار والاستبداد؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eشهد العالم العربي في النصف الثاني من القرن التاسع عشر نهضةً فكريةً وأدبيةً غير مسبوقة. ظهرت الصحف والمجلات بأعدادٍ متزايدة، وانتشرت المطابع، وتأسست النوادي الأدبية، وبدأ المثقفون يكتبون باللغة العربية الفصحى المبسطة بدلًا من التكلّف القديم. وقد كانت القاهرة وبيروت ودمشق مراكز هذه النهضة، وخاصةً بعد إنشاء المطبعة الأميرية في القاهرة والمطبعة الكاثوليكية في بيروت.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد لعبت الصحافة دورًا سياسيًا وثقافيًا في آن. كانت منبرًا لانتقاد الاستبداد، ومنبرًا للتوعية الوطنية، ومنبرًا لنقل الأفكار الحديثة في السياسة والاجتماع والتربية. ومن أشهر الصحف: الأهرام التي أسسها سليم النقاش سنة ١٨٧٥م، والمقطم ليعقوب صروف والهلال لجرجي زيدان، ولسان الحال لأديب إسحاق. هذه الصحافة كانت جامعةً شعبيةً للعرب قبل الجامعات.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ظهر في هذه الفترة تياران فكريان متنافسان: التيار التقليدي الذي يرى أن الإصلاح يجب أن يكون من داخله الدين، والتيار العلماني الليبرالي الذي يرى أن التقدم يستلزم الاقتباس من أوروبا. وقد انتقل الجدل بينهما إلى صفحات الصحف، وأثرى الحياة الفكرية العربية بها أفكارٍ ومقولاتٍ ما زالت تُناقش حتى اليوم. وهذا يعني أن الصحافة كانت تُشكّل الرأي العام العربي وتُوجّهه، قبل أن تكون مجرد وسيلةً لنقل الأخبار والترفيه.\u003c/p\u003e\u003cp class=\"ap\"\u003eومن الشخصيات البارزة في هذه النهضة: جرجي زيدان الذي أسس مجلة الهلال وكتب روايات تاريخية سهلت المعرفة، ومحمد فريد وجدي صاحب المطبوعات العلمية، وأحمد لطفي السيد الذي قاد الحركة الوطنية المصرية، وقاسم أمين الذي رفع راية تحرير المرأة. هؤلاء وغيرهم شكلوا جيلاً مثقفًا أسّس للنهضة العربية الحديثة. وقد خرج من هذا الجيل أيضًا علماء قانون واجتماع وفلك، أسهموا في تحديث المناهج الدراسية في الجامعات العربية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد تطورت الرواية العربية في هذه الفترة أيضًا: من شعر البارودي والتجديد في القصيدة، إلى روايات زيدان والمازني والمنفلوطي، إلى مقالات مصطفى لطفي المنفلوطي في النقد والأخلاق. وقد أصبح الأدب العربي أكثر تعبيرًا عن قضايا المجتمع وهمومه، وأبعد عن التكلاف اللفظي الذي كان يسود قبله. وهذا التحول البلاغي هو ما جعل الأدب العربي في العصر الحديث قادرًا على التعبير عن قضايا العصر بصدقٍ ومتعةٍ معًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eومع بداية القرن العشرين، انتقل الوعي السياسي من الصالونات والصحف إلى الأحزاب والمنظمات. أُسّس الحزب الوطني في مصر سنة ١٩٠٧م، وأطلق زعماء سوريا والعراق جمعيات سرية وعلنية تطالب بالاستقلال. وقد أسهمت الصحافة في تكوين وعيٍ جامعٍ جمع المسلمين والمسيحيين العرب في مشروعٍ وطنيٍّ واحدٍ معارض للاستعمار والاستبداد. وهذه الأحزاب التي أسّست لاحقًا للحركات الوطنية العربية، كانت تتعلم من تجارب أوروبا في التنظيم السياسي.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eقاسم أمين وقضية تحرير المرأة\u003c/h4\u003e\u003cp class=\"ap\"\u003eقاسم أمين هو رائد حركة تحرير المرأة في العالم العربي، وقد نشر كتابه «تحرير المرأة» سنة ١٨٩٩م ثم كتاب «المرأة الجديدة» سنة ١٩٠١م. طالب فيهما بتعليم المرأة ومشاركتها في الحياة العامة، وأرجع ذلك إلى الفهم الصحيح للإسلام لا إلى الاقتباس من الغرب. وقد أثار كتاباه جدلًا واسعًا في الأوساط الدينية والاجتماعية، لكنهما فتحا بابًا لم يكن يُغلق.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد رأى قاسم أمين أن الأم المتعلمة هي التي تربي جيلًا واعيًا، وأن حجب المرأة عن التعليم يعرقل تقدم الأمة كلها. دفع بوجوب إلغاء الحجاب المقيد لحركتها، ونقد التعدد الذي يجعل المرأة سلعة، وشجع على خروج المرأة للعمل والعلم. كانت آراؤه جذرية في زمنها، لكنها أصبحت مقبولة بعد جيلٍ واحد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بنى قاسم أمين حجاجه على النصوص الإسلامية لا ضدها، مستشهدًا بأمثال خديجة وعائشة في العلم والسياسة. هذا الأسلوب كان حاسمًا في إقناع المتشككين، وأسّس لتيار إصلاحي نسوي داخل الإسلام. وقد استمر أثره حتى حركات تحرير المرأة اللاحقة في القرن العشرين. وهذا يعني أن الاجتهاد النصي القائم على العقل والتاريخ، هو أقوى سلاحٍ في مواجهة الرفض التقليدي للأفكار الجديدة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eجرجي زيدان والرواية التاريخية\u003c/h4\u003e\u003cp class=\"ap\"\u003eجرجي زيدان هو أحد أعظم كتاب النهضة العربية، وقد أسس مجلة «الهلال» سنة ١٨٩٢م التي صارت أرقى منبرٍ للثقافة العربية. كتب روايات تاريخية تُشكّل للقارئ العربي صورة عن ماضيه الإسلامي بأسلوبٍ روائيٍّ ممتع، ومن أشهر رواياته «الأمين والمأمون» و«أرسلان» و«مصرع كليولا». وقد نجح في الجمع بين التاريخ والأدب والتعليم في إطارٍ واحد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كتب زيدان أيضًا مقالات في الثقافة والسياسة والاجتماع، ودعا إلى التسامح بين الأديان والأعراق. كان يؤمن بأن النهضة العربية تحتاج إلى معرفة التاريخ وإلى تعليمٍ حديثٍ ومنهجٍ عقلانيٍّ في النظر. وقد قدّم في مجلته ترجماتٍ ونقدًا ومناقشات فكرية أثرت في أوساط المثقفين.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أُخذ على زيدان أنه لبناني مسيحي يكتب عن تاريخ المسلمين بروحٍ عاميةٍ غير عميقة، وأنه بالغ في التبسيط. لكن الجميع يقرّون بأنه فتح باب الرواية العربية التاريخية، وأسّس لتيارٍ أدبيٍّ كبيرٍ تابعته أجيال بعده، وكان له الفضل في تعليم العرب تاريخهم بأسلوبٍ محبب.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eاللغوية والهوية: بين التقليد والحداثة\u003c/h4\u003e\u003cp class=\"ap\"\u003eنهضت في هذه الفترة لغة عربية فصحى جديدة تتحرر من التكلاف البلاغي القديم وتقترب من الحياة. ساهم في ذلك شعراء كالبخاري ومحمود سامي البارودي، وكتّاب كالعظم والزين والمازني. وهذا التطوير لأداتهم جعل الخطاب الفكري أكثر وصولًا إلى الناس، وأكد هذا التحول في الصحافة والتربية والسياسة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ثار جدلٌ حول العامية والفصحى: هل تكون اللغة المشتركة عربية فصحى موحدةً لكل العرب، أم لهجة كل قطر؟ وقد انتصرت الفصحى بفضل الصحافة والتعليم، لكن العامية بقيت لغة الأدب والمسرح والحياة اليومية. وهذه الازدواجية اللغوية بقيت سمةً للعالم العربي حتى اليوم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أصبحت اللغة العربية في هذه المرحلة رمزًا للهوية العربية الجامعة التي تتجاوز الدول والطوائف. وهذا ما ساعد على قيام الحركة القومية العربية التي توّجت بثورات الاستقلال في منتصف القرن العشرين. فاللغة لم تكن أداة تواصل فقط، بل كانت مشروع سياسة وثقافة وهويات.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالصحافة سلاحًا\u003c/b\u003e\u003cspan\u003eالصحف صارت جامعات شعبية تنقل الفكر الحديث وتنقد الاستبداد والاستعمار.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eقاسم أمين\u003c/b\u003e\u003cspan\u003eطالب بتحرير المرأة مستندًا على الفهم الصحيح للإسلام، ففتح بابًا لحركة نسوية داخل الأمة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eجرجي زيدان\u003c/b\u003e\u003cspan\u003eمؤسس الهلال وكاتب الرواية التاريخية، علم العرب تاريخهم بأسلوب أدبي ممتع.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eاللغة والهوية\u003c/b\u003e\u003cspan\u003eالفصحى انتصرت كلغة جامعة بفضل الصحافة والتعليم، وصارت رمزًا للهوية العربية.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالشخصية\u003c/th\u003e\u003cth\u003eالمجال\u003c/th\u003e\u003cth\u003eأهم عمل\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eقاسم أمين\u003c/td\u003e\u003ctd\u003eالاجتماع\u003c/td\u003e\u003ctd\u003eتحرير المرأة\u003c/td\u003e\u003ctd\u003eفتح باب تحرر المرأة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eجرجي زيدان\u003c/td\u003e\u003ctd\u003eالأدب والصحافة\u003c/td\u003e\u003ctd\u003eالرواية التاريخية والهلال\u003c/td\u003e\u003ctd\u003eتعليم التاريخ بأسلوب روائي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eمحمود سامي البارودي\u003c/td\u003e\u003ctd\u003eالشعر\u003c/td\u003e\u003ctd\u003eإحياء القصيدة العربية\u003c/td\u003e\u003ctd\u003eتجديد الشعر الكلاسيكي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eأحمد لطفي السيد\u003c/td\u003e\u003ctd\u003eالسياسة والتربية\u003c/td\u003e\u003ctd\u003eالأمة المصرية والجامعة\u003c/td\u003e\u003ctd\u003eالحركة الوطنية والتعليم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eمحمد عبده\u003c/td\u003e\u003ctd\u003eالفكر والإصلاح\u003c/td\u003e\u003ctd\u003eرسالة التوحيد\u003c/td\u003e\u003ctd\u003eتجديد الفكر الإسلامي\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eالأمة التي لا تقرأ لا تُحسن الاختيار، والتي لا تكتب لا تُحسن التغيير.\u003c/p\u003e\u003ccite\u003eجرجي زيدان\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eالنهضة الفكرية في العالم العربي قامت على الصحافة والرواية والمقالة والسعي الإصلاحي. أنجبت قاسم أمين وجرجي زيدان ومحمد عبده وغيرهم، وأسّست لوعيٍ وطنيٍّ ولغويٍّ انطلق لاحقًا في ثورات الاستقلال.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"women-awakening","n":"تعليم المرأة وبدايات تحرّرها","ic":"👩","part":"عصر الإصلاح والنهضة","h":"\u003carticle class=\"ch3\" id=\"women-awakening\" data-toc=\"تعليم المرأة وبدايات تحرّرها\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eعصر الإصلاح والنهضة\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٤ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٢\u003ci\u003e.\u003c/i\u003e٤\u003c/span\u003e\n            \u003ch3\u003eتعليم المرأة وبدايات تحرّرها\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eكيف فُتحت أبواب التعليم للمرأة المسلمة؟ ومن الرائدات اللواتي صنعن التغيير؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eظلّ تعليم المرأة المسلمة قرونًا طويلةً محصورًا في الكتاتيب والبيوت، حيث تتعلّم الفتاة القراءة والكتابة وعلوم الشرع في بيتها لا في مدرسة عامة. ومع دخول الدولة العثمانية عصر التنظيمات، أُنشئت أول المدارس النظامية للبنات في القرن التاسع عشر، لكنها كانت محدودةً في المدن الكبرى وللطبقات الغنية. وقد بدأ التحول الحقيقي مع الصحوة الفكرية التي أثبتت أن الأمة لا تتقدم بلا تعليم نسائها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أصر محمد علي على تعليم الفتيات في المستشفيات والمدارس التي أنشأها، وأرسل بعضهن إلى فرنسا ليتعلّمن التمريض. وفي عصر إسماعيل، أُنشئت مدرسة السنية في القاهرة سنة ١٨٧٣م وهي أول مدرسة نظامية للبنات في مصر. ثم تعددت المدارس النسائية في القاهرة والإسكندرية وبيروت ودمشق، وأصبحت مدارس البعثات الأجنبية بديلًا لمن لم يجد مكانًا في المدارس الحكومية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان لجرجي زيدان وقاسم أمين وسواهما من مفكري النهضة أثرٌ كبيرٌ في تغيير النظرة إلى تعليم المرأة. رفض قاسم أمين حصر المرأة في البيت، وطالب بتعليمها لتكون أمًّا وزوجةً ومواطنةً صالحة. وقد أكد في كتابيه «تحرير المرأة» و«المرأة الجديدة» أن المرأة التي لا تُعلّم، لا تستطيع أن تُعلّم أبناءها ولا أن تساهم في نهضة بلادها. وهذا يعني أن تعليم المرأة ليس تفصيلًا اجتماعيًا، بل هو أساس بناء الأمة الذي تتوقف عليه نهضة المجتمع كله.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد برزت في هذه الفترة نساءٌ رائداتٍ غيرن واقع النساء بمثلهن. ملك حفني ناصف التي كتبت في الأدب والاجتماع ونادت بحقوق المرأة، وودّيعة صالح شهاب التي أفنت عمرها في تعليم البنات في لبنان وفلسطين، وهدى شعراوي التي أسّست الاتحاد النسائي المصري سنة ١٩٢٣م، وأصبحت أول رئيسةٌ لاتحاد نسائيٍّ عربيٍّ منظم. هؤلاء النسوة لم يطلبن حقوقًا نظرية بل بنين تعليمًا ومؤسساتٍ حقيقية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أسهمت هذه الرائدات في كسر حاجز الخوف من تعليم الفتاة، وفي إثبات أن المرأة المسلمة قادرة على الجمع بين دينها ودورها العلمي. كما نشرن الصحف النسائية الأولى، كمجلة «الفتاة» التي أصدرتها لطيفة النادي، ومجلة «السيدات والبنات» لودّيعة صالح شهاب، وكتبن في كل قضايا المجتمع من الزواج إلى السياسة. وهذا يعني أن قضية المرأة انتقلت من البيت إلى الشارع، وصارت قضية رأي عامٍ تهمّ كل فرد في المجتمع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ساعدت الحربان العالميتان في تحرير المرأة عمليًا، إذ اضطرّت النساء للعمل في مصانع الحرب والزراعة والتمريض، فأثبتن قدرةً على العمل خارج البيت. وقد جاءت ثورات الاستقلال والأنظمة الحديثة لترسخ مبدأ المساواة في التعليم والعمل، وإن بقى التفاوت واقعًا في كثيرٍ من الأقطار العربية. وهكذا صار تعليم المرأة أحد أهم علامات التقدم في العصر الحديث.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eهدى شعراوي: أول ناشطة نسائية\u003c/h4\u003e\u003cp class=\"ap\"\u003eهدى شعراوي هي أيقونة الحركة النسائية العربية، وقد ولدت سنة ١٨٧٩م في أسرة ثرية في مصر. وقد تأثرت بحركة تحرير المرأة الفرنسية، لكنها تفاعلت معها من منطلقٍ إسلاميٍّ ووطنيٍّ. أسست الاتحاد النسائي المصري سنة ١٩٢٣م بعد عودتها من مؤتمر النساء الدولي في روما، وعملت على تحسين أوضاع المرأة في التعليم والصحة والعمل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد قادت هدى شعراوي مظاهرات نسائية عام ١٩١٩م ضد الاحتلال البريطاني، وشاركت في الثورة الوطنية مع سعد زغلول. وقد خلعت حجابها في محطة القطار بمصر عام ١٩٢٣م في حادثة شهيرة أثارت جدلًا كبيرًا، لكنها كانت إعلانًا عن تحرر المرأة من القيود الاجتماعية أكثر من مجرد قضية زي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد عملت هدى شعراوي في كل المجالات: مكافحة الأمية، وتمريض المرأة في الريف، والدفاع عن الطلاق وحضانة الأطفال، ومحاربة تعدد الزوجات غير المبرر. أسست مستوصفات ومراكز اجتماعية، ودعمت التعليم حتى صار الاتحاد النسائي في عهدها مؤسسةً مؤثرةً في الحياة المصرية.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eودّيعة صالح شهاد: معلّمة الأجيال\u003c/h4\u003e\u003cp class=\"ap\"\u003eودّيعة صالح شهاب كانت معلّمةٌ عظيمةٌ من لبنان، أسهمت في تعليم البنات في بيروت ودمشق ويافا والقدس. أسست مدارس عديدة للبنات المسلمات والمسيحيات، وعملت على مناهجٍ حديثةٍ تجمع بين العربية والفرنسية والعلوم الطبيعية في زمنها. وقد رفضت أن يكون التعليم النسائي تقليدًا للأجانب، بل أرادته عربيًا أصيلًا يخدم المجتمع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد نشرت مجلة «السيدات والبنات» التي كانت منبرًا للقضايا النسائية والأسرية في نهاية القرن التاسع عشر. كتبت فيها عن التربية والأخلاق والعمل ودور المرأة في الإسلام، واستشهدت بتاريخ المرأة المسلمة في الخلافة الأولى. كانت رسالتها أن المرأة المسلمة لها في تراثها ما تجعلها متعلمةً ومنتجة، دون حاجةٍ لاستيراد نموذج غربي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد واجهت ودّيعة مقاومةً كبيرةً في مجتمعها، لكنها صبرت وأثبتت نجاحها. خرجت من مدارسها أجيالٌ من المعلمات والطبيبات والكاتبات، وصارت مدارسها نواةً لنظام تعليمي نسائي في بلاد الشام. وهي مثالٌ على أن التغيير الاجتماعي يحتاج صبرًا ونموذجًا حيًا لا مجرد شعارات.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالصحافة النسائية الأولى\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الصحافة النسائية إحدى أهم أدوات تغيير صورة المرأة في العالم العربي. فبعد أن كانت المرأة موضوعًا للكتابة، صارت هي كاتبةً ومحررةً. وقد ظهرت مجلات نسائية في القاهرة وبيروت ودمشق، كتبن في التربية والسياسة والعلوم والرواية، وناقشن قضايا الزواج والطلاق والعمل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد نجحت هذه المجلات في الوصول إلى جمهور أوسع من كتب الرجال، لأنها خاطبت المرأة في بيتها بلغتها ومخاوفها. ومن أشهر هذه المجلات: «الفتاة» للطيفة النادي، و«السيدات والبنات» لودّيعة صالح، و«نساء الشرق» لدُرّية شفيق، و«الشعب النسائي» لهدى شعراوي. وهذه المجلات كانت بمثابة الجامعة الأولى للمرأة العربية التي لم يكن لها سهل الوصول إلى التعليم العالي في تلك الفترة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد مثّلت هذه الصحافة بداية الصحافة النسائية العربية الحديثة التي استمرت حتى اليوم. وقد علّمت المرأة أن تكتب عن نفسها، لا أن يكتب عنها الرجل، وأن تقود قضاياها بدلًا من أن تكون ساكنةً لها. وهذا التحول في زمنٍ كان الرجل فيه يملك السلطة الإعلامية والمعرفية، هو في حد ذاته ثورة صامتة.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eتعليم المرأة\u003c/b\u003e\u003cspan\u003eمن الكتاتيب إلى المدارس النسائية
