، أصبح التعليم حقًا وعنوانًا للتقدم في العالم العربي.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eقاسم أمين\u003c/b\u003e\u003cspan\u003eربط تحرر المرأة بالفهم الصحيح للإسلام، فأثبت أن الأمة لا تتقدم بلا تعليم نسائها.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eهدى شعراوي\u003c/b\u003e\u003cspan\u003eأسست الاتحاد النسائي المصري، وربطت قضية المرأة بقضية الوطن والاستقلال.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eودّيعة صالح شهاب\u003c/b\u003e\u003cspan\u003eبنَت مدارس للبنات في الشام، وأثبتت أن التعليم النسائي العربي يمكن أن يكون أصيلًا وعصريًا.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالرائدة\u003c/th\u003e\u003cth\u003eالبلد\u003c/th\u003e\u003cth\u003eإسهامها\u003c/th\u003e\u003cth\u003eأثرها\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eهدى شعراوي\u003c/td\u003e\u003ctd\u003eمصر\u003c/td\u003e\u003ctd\u003eالاتحاد النسائي والمظاهرات\u003c/td\u003e\u003ctd\u003eربط قضية المرأة بالوطنية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eودّيعة صالح شهاب\u003c/td\u003e\u003ctd\u003eلبنان وفلسطين\u003c/td\u003e\u003ctd\u003eمدارس البنات ومجلة السيدات\u003c/td\u003e\u003ctd\u003eتعليم أجيال من المعلّمات\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eمالك حفني ناصف\u003c/td\u003e\u003ctd\u003eمصر\u003c/td\u003e\u003ctd\u003eالكتابة والأدب والاجتماع\u003c/td\u003e\u003ctd\u003eرفع سقف الطموح النسائي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eدُرّية شفيق\u003c/td\u003e\u003ctd\u003eمصر\u003c/td\u003e\u003ctd\u003eمجلة نساء الشرق\u003c/td\u003e\u003ctd\u003eصحافة نسائية سياسية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eلطيفة النادي\u003c/td\u003e\u003ctd\u003eمصر\u003c/td\u003e\u003ctd\u003eمجلة الفتاة\u003c/td\u003e\u003ctd\u003eبداية الصحافة النسائية العربية\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eعلّموا المرأة فتُعلّم جيلًا، ولا تكتفوا بتعليم الرجل فتورثوه نصف أمّة.\u003c/p\u003e\u003ccite\u003eقاسم أمين\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eتعليم المرأة في العالم العربي انتقل بهمّة المصلحين والرائدات من الكتاتيب إلى المدارس والجامعات. أنجبت هدى شعراوي وودّيعة صالح شهاب وقاسم أمين ومثلهن، وأسّست الصحافة النسائية لأجيالٍ من المعلّمات والكاتبات. وقد صار تعليم المرأة مقياسًا لتقدم كلّ أمّة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-3","n":"الدول الوطنية والصراعات","ic":"🏛️","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-3\" style=\"--c:#37474F\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🏛️\u003c/div\u003e\n      \u003ch2\u003eالدول الوطنية والصراعات\u003c/h2\u003e\n      \u003cp\u003eبعد الاستقلال، ورثت الدول العربية حدودًا مصطنعة واقتصادات أحادية ومؤسسات هشة. حاولت كل دولة بناء نموذجها الخاص: بين الاشتراكية القومية والرأسمالية النفطية، وبين الوحدة العربية والانغلاق الوطني. كما عانت العالم العربي من صراعات أيديولوجية طبقية وطائفية إقليمية، من حروب اليمن ولبنان إلى الثورة الإيرانية والربيع العربي. هذا القسم يحكي قصة بناء الدولة وهزائمها وانتفاضاتها المتجددة.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#independence-wave\"\u003eموجة الاستقلالات العربية\u003c/a\u003e\u003ca href=\"#nation-building\"\u003eبناء الدولة الوطنية الحديثة\u003c/a\u003e\u003ca href=\"#arab-nationalism\"\u003eالوحدة القومية ومشروعها\u003c/a\u003e\u003ca href=\"#coups-ideologies\"\u003eالانقلابات والصراع الأيديولوجي\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"independence-wave","n":"موجة الاستقلالات العربية","ic":"🕊️","part":"الدول الوطنية والصراعات","h":"\u003carticle class=\"ch3\" id=\"independence-wave\" data-toc=\"موجة الاستقلالات العربية\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالدول الوطنية والصراعات\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ١ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٣\u003ci\u003e.\u003c/i\u003e١\u003c/span\u003e\n            \u003ch3\u003eموجة الاستقلالات العربية\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eكيف نالت الدول العربية استقلالها؟ وما الذي ميّز تجربة كلّ قطر؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان الاستقلال في العالم العربي نتاجًا لتراكم نضالٍ طويلٍ جمع بين العمل المسلح والعمل السياسي، بالإضافة إلى الضعف الدولي الذي أصاب القوى الاستعمارية بعد الحرب العالمية الثانية. فقد خرجت بريطانيا وفرنسا منتصرتين لكنهما منهكتان اقتصاديا، وصعدت الولايات المتحدة والاتحاد السوفيتي كقوتين معاديتين للاستعمار التقليدي. هذه المعطيات الدولية صنعت فرصة تاريخية للعرب لنيل استقلالهم في فترة قصيرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد اختلفت طرق الاستقلال بين دولةٍ وأخرى. فقد نال بعضها استقلالًا تدريجيًا عبر اتفاقياتٍ كاستقلال مصر الشكلي سنة ١٩٢٢م واستقلال العراق سنة ١٩٣٢م. وقاد بعضها الآخر ثوراتٍ مسلحةً كالجزائر التي دفع ثمنها مليون شهيد. بينما نال البعض الآخر استقلاله بثوراتٍ سياسيةٍ سلميةٍ كتونس والمغرب. وهذا التنوع يعكس الاختلاف في بنية كل مجتمع وفي طبيعة الاستعمار فيه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت سوريا ولبنان من أوائل الدول التي نالت استقلالها الكامل سنة ١٩٤٦م بعد انسحاب القوات الفرنسية، لكنهما واجها تحديات الوحدة والانفصال معًا فنشأت دولةٌ واحدةٌ عاشت تجربة الوحدة بين ١٩٥٨ و١٩٦١م. أما الأردن فقد نال استقلاله سنة ١٩٤٦م لكنه بقي تحت نفوذ بريطاني قويّ، ثم غيّر اسمه من شرق الأردن إلى المملكة الأردنية الهاشمية. وهذا الاسم الجديد كان يعكس هيمنة العائلة الهاشمية التي جاءت بها بريطانيا لتحكم شرق الأردن قبل الاستقلال بسنوات.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد اشتهرت ليبيا بكونها أول دولةٍ أفريقيةٍ تنال استقلالها عبر قرار أممي سنة ١٩٥١م، لتعلن مملكةً دستوريةً بقيادة إدريس السنوسي. لكن النظام الملكي سقط بسرعة أعلنت بعدها ثورة الفاتح في سبتمبر سنة ١٩٦٩م بقيادة معمر القذافي الذي حكم لبلاده أربعين عامًا بحكمٍ ثوريٍّ انتهى بمقتله سنة ٢٠١١م في ثورة شعبية دعمها حلف شمال الأطلسي. وهذه التجربة أظهرت أن الثورات الشعبية قد تكون أسرع طريق لإسقاط أنظمة التوريث، لكنها أيضًا قد تُنتج فراغًا يستغله بعضهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد مثّلت حركة عدم الانحياز التي تأسّست في بلغراد سنة ١٩٦١م ملتقىً للدول المستقلة حديثًا، وشاركت فيها مصر والهند ويوغوسلافيا وإندونيسيا. وقد سعى قادتها إلى تجنب الاصطفاف بين الشرق والغرب، لكن هذه الحياد كان صعبًا في عالمٍ ثنائي القطبية. ومع ذلك، فقد منح الحركة العالم العربي حضورًا سياسيًا لم يكن له قبل ذلك، وأسّس لسياسة خارجية عربية مستقلة نسبيًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد جاء الاستقلال السياسي محمّلاً بتحدياته: الحدود المرسومة استعماريًا، والاقتصاد الأحادي، وضعف المؤسسات، وغياب نخبٍ إداريةٍ مدربة. وقد اضطرّت كل دولةٍ إلى بناء جيشها وإدارتها واقتصادها في ظروفٍ صعبة. هذه التحديات جعلت الاستقلال بدايةً لصراعٍ جديدٍ حول طبيعة الدولة وعلاقتها بمجتمعها، لا نهايةً للتاريخ كما وعدت الشعارات. وهذا يعني أن الاستقلال ليس نهاية الطريق، بل بداية بناء الدولة الحقيقية التي لا تكتمل إلا بالعدالة والتنمية والمشاركة.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالجزائر: ثمن الاستقلال بالمليون شهيد\u003c/h4\u003e\u003cp class=\"ap\"\u003eالجزائر هي الدولة التي دفع شعبها الثمن الأغلى في سبيل الاستقلال. دامت حرب التحرير الجزائرية سبع سنوات ونصفًا، من سنة ١٩٥٤م حتى ١٩٦٢م، وسقط فيها أكثر من مليون شهيد مدني، وشُرّد ملايين آخرين في مخيمات اللجوء في تونس والمغرب. وقد جمعت هذه الثورة الوطنية بين العمل المسلح والفدائي وبين الدبلوماسية الدولية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد قادت جبهة التحرير الوطنية هذه الثورة، ونظّمت المقاومة في الجبال والمدن، وأسّست الحكومة الجزائرية المؤقتة في تونس سنة ١٩٥٨م لتمثّل الثورة دوليًا. وقد نجحت الثورة في تعرية فرنسا أمام الرأي العام العالمي، وفي إجبارها على التفاوض في إيفيان سنة ١٩٦٢م، لينال الشعب الاستقلال الذي طال انتظاره.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بنى الجزائريون بعد الاستقلال دولةً اشتراكيةً بقيادة أحمد بن بلة ثم هواري بومدين، فقامت الصناعة وثروة النفط والغاز، وصار البلد قوةً إقليميةً لا يستهان بها. لكن النظام السياسي بقي عسكريًا أحادي الحزب لعقود، ثم انفتح على التعددية في أواخر الثمانينيات وسط صراعاتٍ داخليةٍ عاشها لسنوات.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eمصر والعراق: استقلالٌ مزدوج\u003c/h4\u003e\u003cp class=\"ap\"\u003eحالة مصر والعراق تشبهان من حيث الاستقلال التدريجي، لكنهما اختلفتا في النتيجة. نالت مصر استقلالًا شكليًا سنة ١٩٢٢م بعد ثورة ١٩١٩م، لكنه استقلالٌ ناقص بقي البريطانيون يحتلون قناة السويس ويؤثرون في السياسة. وقد جاءت ثورة يوليو سنة ١٩٥٢م لتُعلن استقلالًا حقيقيًا، وأعلنت الجمهورية بعد أقل من عام، وأخرجت الملك فاروق.\u003c/p\u003e\u003cp class=\"ap\"\u003eأما العراق فقد نال استقلاله سنة ١٩٣٢م عن طريق عصبة الأمم، لكن بريطانيا بقيت تؤثر في السياسة عبر معاهدات عسكرية واقتصادية. وقد شهد العراق ثوراتٍ متعددة، مات الملك فيصل الثاني سنة ١٩٥٨م ثم ثورة الضباط الأحرار التي أسّست الجمهورية. وقد تأرجح العراق بين الأنظمة الجمهورية والعسكرية حتى سقوط بغداد سنة ٢٠٠٣م.\u003c/p\u003e\u003cp class=\"ap\"\u003eوهذه التجربتان تُظهران أن الاستقلال الشكلي لا يكفي لبناء دولة حديثة مستقرة. ففي الحالتين، بقيت القوى الأجنبية تتدخل عبر الاقتصاد والدبلوماسية والجيش. وقد جاءت الثورات العسكرية والقومية لتحقيق استقلالٍ أعمق، لكن الرهان على العسكر أنتج أنظمةً استبداديةً عرقلت التطور السياسي في البلدين.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eحركة عدم الانحياظ ودورها\u003c/h4\u003e\u003cp class=\"ap\"\u003eحركة عدم الانحياز كانت تجمعًا للدول المستقلة حديثًا التي رفضت الاصطفاف في الحرب الباردة بين واشنطن وموسكو. وقد جمعت بلغراد سنة ١٩٦١م خمسًا وعشرين دولة بقيادة تيتو ونهرو وعبد الناصر وسوكارنو، وتبنّت سياسة التعاون الدولي ومحاربة الاستعمار والعنصرية. وقد أثبتت الحركة أن استقلال بلدٍ مثل غانا وتنزانيا قد يُلهم بلدانًا أخرى، وأن تضامن الجنوب هو أقوى سلاحٍ لدى المستضعفين.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد لعبت الحركة دورًا مهمًا في دعم حركات التحرر في أفريقيا وآسيا، وأوجدت منبرًا للعالم النامي على المسرح الدولي. مصر تحت قيادة عبد الناصر كانت حالة قيادية فيها، ونجحت في جمع العرب والأفارقة الآسيويين في إطارٍ واحد. لكن الحركة ضعفت في السبعينيات والثمانينيات مع تفكك الحرب الباردة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ورث العالم العربي من هذه الحركة فكرة أن له مصالح مشتركة مع الجنوب، وأن التعاون الإقليمي هو أداته لمواجهة الهيمنة. هذه الفكرة بقيت حاضرةً في سياسات الجامعة العربية ومنظمة التعاون الإسلامي وحركة عدم الانحياز التي تستمر حتى اليوم، وإن تغيّرت الأولويات والأدوار.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eاستقلال متعدد المسالك\u003c/b\u003e\u003cspan\u003eنال العرب استقلالهم بسُبلٍ مختلفة: ثوراتٍ مسلحةٍ كالجزائر، وسياسيةٍ كتونس، وتدريجيًا كمصر والعراق.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eفرصة دولية\u003c/b\u003e\u003cspan\u003eضعف القوى الأوروبية بعد الحرب العالمية الثانية ونشوء القطبين صنع فرصة تاريخية للعرب.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالجزائر الثمن الأغلى\u003c/b\u003e\u003cspan\u003eحرب التحرير الجزائرية كلفت مليون شهيد مدني، لكنها أسقطت الأسطورة الاستعمارية في أفريقيا.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eاستقلال شكلي\u003c/b\u003e\u003cspan\u003eمصر والعراق نالا استقلالًا شكلًا فقط، فبقيت بريطانيا تؤثر في السياسة الداخلية.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالدولة\u003c/th\u003e\u003cth\u003eسنة الاستقلال\u003c/th\u003e\u003cth\u003eالطريقة\u003c/th\u003e\u003cth\u003eأول رئيس\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eلبنان\u003c/td\u003e\u003ctd\u003e١٩٤٣م\u003c/td\u003e\u003ctd\u003eاتفاقية وطنيّة\u003c/td\u003e\u003ctd\u003eبشارة الخوري\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eسوريا\u003c/td\u003e\u003ctd\u003e١٩٤٦م\u003c/td\u003e\u003ctd\u003eانسحاب فرنسي وثورات\u003c/td\u003e\u003ctd\u003eشكري القوتلي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eمصر\u003c/td\u003e\u003ctd\u003e١٩٢٢م شكلية\u003c/td\u003e\u003ctd\u003eثورة ١٩١٩ وتدريجيًا\u003c/td\u003e\u003ctd\u003eمحمد نجيب\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالعراق\u003c/td\u003e\u003ctd\u003e١٩٣٢م\u003c/td\u003e\u003ctd\u003eعصبة الأمم ومعاهدات\u003c/td\u003e\u003ctd\u003eالملك فيصل الأول\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالجزائر\u003c/td\u003e\u003ctd\u003e١٩٦٢م\u003c/td\u003e\u003ctd\u003eحرب تحرير مسلحة\u003c/td\u003e\u003ctd\u003eأحمد بن بلة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eلا يُنال الاستقلال بثورةٍ واحدة، بل بحريةٍ متجددةٍ كلّ جيل.\u003c/p\u003e\u003ccite\u003eأحمد بن بلة\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eموجة الاستقلالات العربية جاءت بتراكم النضال الداخلي وتغيّر القوة الدولية بعد الحرب العالمية الثانية. لكن الاستقلال السياسي لم يكن كافيًا لبناء دولة حديثة، فقد بقيت التحديات الاقتصادية والمؤسسية تطارد كل قطرٍ عربي.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"nation-building","n":"بناء الدولة الوطنية الحديثة","ic":"🏛️","part":"الدول الوطنية والصراعات","h":"\u003carticle class=\"ch3\" id=\"nation-building\" data-toc=\"بناء الدولة الوطنية الحديثة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالدول الوطنية والصراعات\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٢ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٣\u003ci\u003e.\u003c/i\u003e٢\u003c/span\u003e\n            \u003ch3\u003eبناء الدولة الوطنية الحديثة\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eما هي تجارب بناء الدول الوطنية بعد الاستقلال؟ ولماذا نجحت بعضها وفشلت أخرى؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eورثت الدول العربية بعد استقلالها دولًا استعماريةً شبه جاهزة في بنيتها الإدارية، لكنها افتقرت إلى الإرادة السياسية التي تُحوّل هذه البنية إلى مشروعٍ وطنيٍّ جامع. فكانت الخطوة الأولى في كل بلدٍ هي بناء الجيش الوطني وتوحيد المرافق التعليمية والصحية والإعلامية. وقد نجحت دولٌ في بناء هوية وطنيةٍ فوق القبيلة والطائفة، وفشلت أخرى في إدارة التنوع فانزلقت في حروبٍ أهلية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد اتخذت الدول العربية نماذج اقتصاديةٍ مختلفة. اتبعت مصر وسوريا والعراق والجزائر النهج الاشتراكي القومي بتأميم القطاعات الرئيسية وإصلاح زراعي، فحقق نموًا في الصناعة والدخل لكنه أثقل الدولة بأعباء بيروقراطية. بينما اختارت السعودية والخليج نهجًا رأسماليًا ملكيًا بالاعتماد على النفط وريع البترودولار، فبنى ثروةً سريعةً لكنه أنشأ مجتمعاتٍ استهلاكيةٍ معتمدةً على العمالة الأجنبية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد اختلفت تجارب التعليم أيضًا. فقد تبنت تونس والمغرب النظام الفرنسي بالفرنسية لغة تعليم، وبقيت مصر وسوريا والعراق على العربية. وقد أدّى هذا الاختلاف إلى ازدواجيةٍ لغويةٍ في بعض الدول تُنتج طبقتين: مثقفة غربية وطبقة شعبية عربية. أصبحت قضية لغة التعليم عنوانًا لأزمة هويةٍ عميقةٍ في العديد من الأقطار العربية. وقد أظهرت سياسات التعريب في الجزائر أن تغيير لغة التعليم مهمة تستغرق جيلًا كاملًا، وأن الانتقال التدريجي أجدى من القفزات المفاجئة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد مثّلت تجربة كوريا الجنوبية وتايوان في آسيا نموذجًا مثيرًا للإعجاب: دولتان فقيرتان بعد الحرب صارتا قوتين اقتصاديتين في جيلٍ واحد. هذا النموذج أثبت أن التنمية السريعة ممكنة بأيدي وطنية مدربة وبإصلاح زراعي ونهضة صناعية موجهة. لكن معظم الدول العربية لم تتبع هذا المسار، ربما بسبب الاعتماد على ريع النفط أو بسبب الفساد والبيروقراطية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أثرت العولمة في تسعينيات القرن الماضي على كل هذه التجارب. فقد أجبرت البنوك الدولية الدول العربية على الخصخصة وإلغاء الدعم وإصلاح القطاع العام، وهو ما أثّر سلبًا على الطبقات الفقيرة وأثار احتجاجاتٍ اجتماعية. وقد بدا أن الحداثة العالمية تُعيد رسم خريطة المنطقة، فانفتحت اقتصاداتها لكنها أيضًا فقدت جزءًا من سيادتها على قرارها الوطني.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بقيت إشكالية بناء الدولة الحديثة في العالم العربي تراوح بين أمرين: الدولة الأمنية المركزية التي تخدم النخبة، والدولة الحديثة التي تخدم المجتمع. الأولى سهلة الإنشاء لكنها غير مستدامة، والثانية تحتاج عملًا طويلًا على المؤسسات والقانون والمشاركة. وقد اتضح أن كل تقدم حقيقي في المنطقة يقترن بتقدم في المشاركة السياسية والحريات العامة.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالتأميم والاشتراكية العربية\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان التأميم أشهر القرارات الاقتصادية في الخمسينيات والستينيات، وأبرزها تأميم قناة السويس في مصر سنة ١٩٥٦م. وقد جاء هذا القرار ردًا على سحب تمويل السد العالي من قبل البنك الدولي، وأثار موجة حماسٍ وطنيةٍ في العالم العربي كله. كما شهدت الجزائر تأميم النفط والبنوك سنة ١٩٧١م، والعراق تأميمه النفط سنة ١٩٧٢م.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أنجز التأميم بعض أهدافه: رفع رأس المال الوطني، وتمويل الصناعات الأساسية، وتقليل سيطرة الأجانب على الموارد. لكنه في الوقت نفسه قضى على المشاريع الخاصة والمبادرة الفردية، وأسّس لقطاعٍ عامٍ بيروقراطيٍّ مثقلٍ بالعمالة الزائدة والفساد. وقد تراجع معظم هذا المسار في الثمانينيات والتسعينيات تحت ضغط الإفلاس والعولمة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوهذا يعني أن الدولة التي تدير الاقتصاد يجب أن تكون قويةٍ ونزيهةً وفعّالة، وإلا فمن الأفضل أن تُترك بعض القطاعات للقطاع الخاص مع رقابة الدولة. هذه القاعدة تُظهِر أن الاختيار بين القطاع العام والخاص ليس اختيارًا أيديولوجيًا، بل هو سؤالٌ عن الكفاءة والنزاهة في الإدارة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالنفط واقتصاد الريع\u003c/h4\u003e\u003cp class=\"ap\"\u003eأدّى اكتشاف النفط في الجزيرة العربية والخليج إلى تحولٍ جذري في الاقتصاد والسياسة العربية. فالسعودية والكويت والإمارات وقطر والعراق وليبيا والجزائر صارت دولًا نفطية تعتمد على تصدير النفط لتغطية وارداتها واستيراد كل شيء. وقد أطلق على هذه الدول «دول الريع» لأن دخلها لا يحتاج إنتاجًا حقيقيًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أنشأ النفط مجتمعات استهلاكيةً هائلة: مدن حديثة، وعمالة أجنبية بالملايين، وخدمات مجانية للمواطنين من تعليم وصحة وإسكان. لكنه أنشأ أيضًا هياكل اقتصادية هشة، تعتمد على سعر سلعةٍ واحدةٍ تتأرجح حسب السوق العالمية. وقد أثبتت أزمة ٢٠١٤م في أسعار النفط هشاشة هذا النموذج.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد فرضت اقتصاديات الريع أيضًا تحديًا سياسيًا: الدولة التي لا تحتاج لضرائب شعبها لا تحتاج ديمقراطيًا، فكثيرًا ما تصدر عن تلك الأنظمة الحكم الفردي المطلق. وهذا ما يفسّر لماذا عانت دول الخليج من تأخر المشاركة السياسية رغم ثرائها، ولماذا كانت أول ما طالب به الشباب في الربيع العربي هو الإصلاح السياسي لا الاقتصادي.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالأزمة اللغوية والهوية\u003c/h4\u003e\u003cp class=\"ap\"\u003eمن أخطر إرث الاستعمار في العالم العربي هي الازدواجية اللغوية: الفرنسية أو الإنجليزية في الجامعات والإدارة، والعربية في الشارع والمدرسة. وقد أنشأت هذه الازدواجية طبقتين اجتماعيتين: مثقفة تستعمل اللغات الأجنبية وتنظر إلى نفسها كجزء من الحضارة الغربية، وشعبية عربية تشعر بالإقصاء من مؤسسات دولتها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد حاولت دولٌ حلّ هذه الأزمة بالتعريب: فقوّمت الجزائر والعراق وسوريا التعليم بالعربية منذ الستينيات. لكن الدول المغربية بقيت على الفرنسية في العلوم والاقتصاد والإدارة العليا. ونتج عن ذلك أنه في المغرب العربي مثقفٌ فرنسيٌّ لا يستطيع التواصل مع شعب بلغته، بينما في المشرق مثقفٌ عربيٌّ يواجه صعوبة في التواصل مع العالم المتقدم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوهذه الأزمة اللغوية هي في العمق أزمة هوية: من نحن؟ هل نحن جزء من الأمة العربية، أم جزء من حوض البحر المتوسط، أم جزء من العالم الإسلامي؟ وقد أثرت هذه الأسئلة في كل مجالات الحياة من التعليم إلى الاقتصاد إلى السياسة الخارجية. ولم تجد الدول العربية جوابًا نهائيًا عليها، لكنها بقيت تبحث في كل جيلٍ عن توليفةٍ تناسبها.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eنماذج اقتصادية\u003c/b\u003e\u003cspan\u003eاختلفت الدول بين الاشتراكية القومية في مصر والجزائر والعراق، والرأسمالية النفطية في الخليج.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالتأميم\u003c/b\u003e\u003cspan\u003eقرارات وطنية رفعت رأس المال لكنها أنشأت بيروقراطية وفسادًا، ومعظمها تراجع في التسعينيات.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eاقتصاد الريع\u003c/b\u003e\u003cspan\u003eالنفط بنى ثروة سريعة لكنه أنشأ هشاشة اقتصادية وسياسية في دوله.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأزمة لغوية\u003c/b\u003e\u003cspan\u003eازدواجية العربية والأجنبية أنتجت طبقتين من المثقفين، وهي في العمق أزمة هوية قومية.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالدولة\u003c/th\u003e\u003cth\u003eالنموذج الاقتصادي\u003c/th\u003e\u003cth\u003eأهم قرار\u003c/th\u003e\u003cth\u003eالنتيجة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eمصر\u003c/td\u003e\u003ctd\u003eاشتراكية قومية\u003c/td\u003e\u003ctd\u003eتأميم القناة ١٩٥٦م\u003c/td\u003e\u003ctd\u003eتصنيع سريع ثم تراجع\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالجزائر\u003c/td\u003e\u003ctd\u003eاشتراكية + نفط\u003c/td\u003e\u003ctd\u003eتأميم النفط ١٩٧١م\u003c/td\u003e\u003ctd\u003eدولة صناعية قوية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالسعودية\u003c/td\u003e\u003ctd\u003eرأسمالية نفطية\u003c/td\u003e\u003ctd\u003eالاعتماد على البترودولار\u003c/td\u003e\u003ctd\u003eثروة واستهلاكية وهشاشة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eتونس\u003c/td\u003e\u003ctd\u003eاقتصاد مختلط\u003c/td\u003e\u003ctd\u003eإصلاحات التربية والتعليم\u003c/td\u003e\u003ctd\u003eنمو متوسطي مستقر\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالعراق\u003c/td\u003e\u003ctd\u003eاشتراكية + نفط\u003c/td\u003e\u003ctd\u003eتأميم النفط ١٩٧٢م\u003c/td\u003e\u003ctd\u003eحرب وفساد وحصار\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eالبلاد لا تُبنى بقرارٍ عظيم، بل بقرارات صغيرة متكررة في الإصلاح والتعليم والنزاهة.\u003c/p\u003e\u003ccite\u003eمحمد نجيب\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eبناء الدولة الوطنية الحديثة كان تحديًا واسعًا واجه كل الدول العربية. تجارب التأميم والاقتصاد الريعي والتعريب والفرنسة أنتجت نماذج مختلفة، لكنها اشتركت في عدم استكمال المشاركة السياسية والحريات. وهذا ما جعل الدولة الحديثة رهانًا مفتوحًا.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"arab-nationalism","n":"الوحدة القومية ومشروعها","ic":"🤝","part":"الدول الوطنية والصراعات","h":"\u003carticle class=\"ch3\" id=\"arab-nationalism\" data-toc=\"الوحدة القومية ومشروعها\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالدول الوطنية والصراعات\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٣ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٣\u003ci\u003e.\u003c/i\u003e٣\u003c/span\u003e\n            \u003ch3\u003eالوحدة القومية ومشروعها\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eما هو مشروع الوحدة العربية؟ ولماذا انتقل من الحلم إلى الانفصال؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكانت فكرة الوحدة العربية حلمًا سعى إليه المفكرون والسياسيون منذ أواخر الدولة العثمانية. رأى القوميون العرب أن العرب أمة واحدة يجمعها اللغة والتاريخ والمصير، وأن تفريقهم في دول استعمارية خدمةً للمصالح الأجنبية. وقد تجسّدت هذه الفكرة في حركة الجامعة العربية التي تأسست سنة ١٩٤٥م، والتي كانت أول منظمة سلامٍ عربيةٍ رسميةٍ جامعةٍ للأقطار المستقلة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بلغ مشروع الوحدة ذروته مع قيام الوحدة المصرية السورية سنة ١٩٥٨م في ظل سيطرة عبد الناصر على المشهد العربي. وقد دامت هذه الوحدة ثلاث سنوات فقط، ثم انفصلت بسبب النزاعات بين القيادتين والخلافات حول الجيش والاقتصاد. وقد أثّر هذا الفشل تأثيرًا سلبيًا عميقًا في مشروع الوحدة كلها، فأصبح الحلم القومي مشكوكًا في إمكانية تحققه. وقد دُرّس هذا الفشل في المدارس والسياسة كتحذيرٍ من الاندفاع العاطفي نحو الوحدات الشكلية التي لا تخدم الشعب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ظهرت محاولات أخرى للوحدة: الوحدة بين الأردن والعراق في اتحاد الهلالين سنة ١٩٥٨م، واتحاد الجمهوريات العربية بين مصر وليبيا وسوريا سنة ١٩٧١م، واتحاد المغرب العربي سنة ١٩٨٩م. لكن معظم هذه المحاولات بقيت شكليةً أو سرعان ما انهارت، بسبب غياب الإرادة السياسية الحقيقية والاختلاف في الأنظمة والمصالح. وهذا يعني أن غياب القيادة السياسية الشعبية هو العامل المشترك في كل إخفاقات الوحدة العربية منذ جامعة الدول وحتى اتحاد المغرب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد مثّلت القضية الفلسطينية عامل جمعٍ للأمة العربية، فقامت حروب ١٩٤٨ و١٩٦٧ و١٩٧٣ في سياق النضال ضد إسرائيل. وقد أسّست منظمة التحرير الفلسطينية سنة ١٩٦٤م، وأخذ الكفاح المسلح الفلسطيني منحى عربيًا ودوليًا. لكن السلام المنفرد بين مصر وإسرائيل سنة ١٩٧٩م ثم اتفاقات أوسلو سنة ١٩٩٣م أعادا تقسيم العالم العربي إلى مخيمين، وأضعافا فكرة الوحدة أكثر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوما يجدر الانتباه إليه أن فشل الوحدة العربية لم يكن فشلًا للفكرة في ذاتها، بل فشلًا في تنفيذها. فالوحدة تحتاج إلى إرادة سياسية شعبية ونظام ديمقراطي يسمح بتداول السلطة على مستوى القرار. لكن معظم الأنظمة العربية كانت ديكتاتورية عسكرية، فكانت تخشى الوحدة لأنها تُفقدها سلطتها المطلقة، وتفضل بقاء الدول المنفصلة. وهذا يعني أن الاستبداد الداخلي هو العدو الأول للوحدة، لأنه يهدد أنظمة العالم العربي أكثر مما تهددها إسرائيل أو الغرب نفسه.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالوحدة المصرية السورية: حلم ونهاية\u003c/h4\u003e\u003cp class=\"ap\"\u003eقرار الوحدة بين مصر وسوريا في فبراير سنة ١٩٥٨م جاء بدعمٍ شعبيٍّ هائلٍ في الشارعين. فقد اعتقد العرب أن الحلم صار ممكنًا، وأن العالم العربي يستعيد مجده. وقد أطلق على الدولة الجديدة اسم الجمهورية العربية المتحدة، واختير عبد الناصر رئيسًا لها، وذابت سوريا في النظام السياسي المصري مركزيًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eلكن الدولة الجديدة واجهت تحديات اقتصادية وسياسية جمّة. فسوريا لم تكن لها خبرة المؤسسات المصرية، والعسكر السوريون خشوا ذوبانهم في الجيش المصري الكبير. وقد فُرض التأميم والإصلاح الزراعي على سوريا بسرعة، فأثار غضب النخب التجارية والعسكرية. وفي سبتمبر سنة ١٩٦١م، أعلن الجيش السوري الانفصال في انقلابٍ مفاجئ، وعادت سوريا دولةً مستقلة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد علّم فشل الوحدة درسين مهمين: الأول أن الوحدة العربية لا تُفرض من فوق بل تحتاج إلى قناعة شعبية وتوافقٍ سياسي. والثاني أن الوحدة بين نظامين مختلفين في الحجم والخبرة والبنية الاقتصادية هي وحدةٌ غير متكافئة. وقد بقيت هذه الدروس مطروحةً حتى اليوم، مع كل دعوةٍ جديدةٍ للوحدة في العالم العربي.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eمنظمة التحرير الفلسطينية والإطار العربي\u003c/h4\u003e\u003cp class=\"ap\"\u003eأسّست جامعة الدول العربية منظمة التحرير الفلسطينية سنة ١٩٦٤م لتكون ممثلًا للشعب الفلسطيني في نضاله ضد الاحتلال الإسرائيلي. وقد باشرت المنظمة عملها الفعلي بعد حرب ١٩٦٧م التي فقد فيها العرب القدس والضفة الغربية وغزة، فصار الكفاح المسلح الفلسطيني محورًا للسياسة العربية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد قاد ياسر عرفات منظمة التحرير منذ سنة ١٩٦٩م، واتخذ من الأردن ولبنان قواعد للعمل العسكري. وقد شهدت تلك الفترة عملياتٍ فدائيةً شهيرةً ضد إسرائيل، لكنها شهدت أيضًا صداماتٍ بين الفلسطينيين والدول المضيفة. وقد أُخرج الفلسطينيون من الأردن سنة ١٩٧٠م فيما عُرف بالمناخ الأسود، ثم خاضوا حربًا أهليةً في لبنان سنة ١٩٧٥م.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد انتقلت المنظمة لاحقًا إلى العمل السياسي والدبلوماسي، واعترفت بإسرائيل في اتفاقات أوسلو سنة ١٩٩٣م، وأنشأت السلطة الوطنية الفلسطينية. لكن هذا المسار لم يحقق للفلسطينيين دولتهم المستقلة، وبقيت القضية مفتوحةً حتى اليوم، وعادت الجماعات الإسلامية والفصائل لتقود المقاومة بمنطقٍ مختلف.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eلماذا لم تتحقق الوحدة؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eفشل مشروع الوحدة العربية لم يكن عبثًا، بل كان له أسبابه العميقة. أولاً: الأنظمة العربية المستبدة تخاف الوحدة لأنها تُفقدها سلطتها الفردية. ثانيًا: الدول العربية ورثت حدودًا استعماريةً فاختلفت مصالحها الاقتصادية والسياسية. ثالثًا: تدخلت القوى الأجنبية لإفشال أي وحدةٍ تهدد مصالحها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد تُضاف إلى ذلك عوامل داخلية: غياب الديمقراطية، وضعف المشاريع الاقتصادية المشتركة، وطغيان الولاءات القبلية والطائفية على الانتماء القومي. كل هذه العوامل جعلت الوحدة تبقى شعارًا جميلًا في الخطب، لا مشروعًا عمليًا في السياسة. وهذا يعني أن الوحدة لا تُصنع في القمم الرسمية، بل في المدارس والاقتصاد والثقافة والإعلام التي تبني شعورًا مشتركًا حقيقيًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوهذا يعني أن أي وحدةٍ مستقبليةٍ في العالم العربي يجب أن تبدأ من قاعدة شعبية: ديمقراطية، واقتصاد مشترك حر، وتكامل تعليمي وثقافي. فـإنما الوحدات بين الشعوب الحرة لا بين الأنظمة المستبدة، والوحدة التي تُفرض من فوق تبقى وهمًا. وهذا الدرس هو أهم إرثٍ لتجربة القرن الماضي في العالم العربي.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالجامعة العربية\u003c/b\u003e\u003cspan\u003eتأسست ١٩٤٥م كأول منظمة عربية رسمية، لكنها بقيت إطارًا ضعيفًا للتعاون لا للوحدة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالوحدة السورية المصرية\u003c/b\u003e\u003cspan\u003eمشروع حي دام ثلاث سنوات ١٩٥٨-١٩٦١م وفشل بسبب عدم التكافؤ وغياب القناعة السياسية.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمنظمة التحرير\u003c/b\u003e\u003cspan\u003eأسست ١٩٦٤م لتقود الكفاح الفلسطيني، وانتقلت من العمل المسلح إلى العمل السياسي بأوسلو.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأسباب الفشل\u003c/b\u003e\u003cspan\u003eأنظمة مستبدة وحدود استعمارية ومصالح متناقضة وتدخل أجنبي أفشلت أي وحدة حقيقية.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمحاولة\u003c/th\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالدول\u003c/th\u003e\u003cth\u003eالنتيجة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالجامعة العربية\u003c/td\u003e\u003ctd\u003e١٩٤٥م\u003c/td\u003e\u003ctd\u003eكل الدول العربية\u003c/td\u003e\u003ctd\u003eتعاون سياسي محدود\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالوحدة المصرية السورية\u003c/td\u003e\u003ctd\u003e١٩٥٨م\u003c/td\u003e\u003ctd\u003eمصر وسوريا\u003c/td\u003e\u003ctd\u003eانفصال بعد ٣ سنوات\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eاتحاد الهلالين\u003c/td\u003e\u003ctd\u003e١٩٦١م\u003c/td\u003e\u003ctd\u003eالأردن والعراق\u003c/td\u003e\u003ctd\u003eانهيار سريع\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eاتحاد الجمهوريات\u003c/td\u003e\u003ctd\u003e١٩٧١م\u003c/td\u003e\u003ctd\u003eمصر وليبيا وسوريا\u003c/td\u003e\u003ctd\u003eفشل وخيبة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eاتحاد المغرب العربي\u003c/td\u003e\u003ctd\u003e١٩٨٩م\u003c/td\u003e\u003ctd\u003eالمغرب والجزائر وتونس وليبيا وموريتانيا\u003c/td\u003e\u003ctd\u003eجمود شبه كامل\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eالوحدة بين الأنظمة المستبدة وهم، وبين الشعوب الحرة قيام.\u003c/p\u003e\u003ccite\u003eمحمد المهدي المنجرة\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eمشروع الوحدة العربية كان حلم الأمة في القرن العشرين، لكنه فشل بسبب الأنظمة المستبدة والحدود الاستعمارية والمصالح المتناقضة والتدخل الأجنبي. بقيت الوحدة تطلعًا شعبيًا يحتاج إلى ديمقراطية واقتصاد مشترك ليصبح ممكنًا.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"coups-ideologies","n":"الانقلابات والصراع الأيديولوجي","ic":"🎖️","part":"الدول الوطنية والصراعات","h":"\u003carticle class=\"ch3\" id=\"coups-ideologies\" data-toc=\"الانقلابات والصراع الأيديولوجي\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالدول الوطنية والصراعات\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٤ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٣\u003ci\u003e.\u003c/i\u003e٤\u003c/span\u003e\n            \u003ch3\u003eالانقلابات والصراع الأيديولوجي\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eكيف حكم العسكر العالم العربي؟ ولماذا انتصرت التيارات الإسلامية لاحقًا؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eمن أبرز سمات العالم العربي بعد الاستقلال هو تكرار الانقلابات العسكرية. فقد سيطر الضباط على الحكم في مصر سنة ١٩٥٢م وسوريا سنة ١٩٤٩م والعراق سنة ١٩٥٨م والجزائر سنة ١٩٦٥م والسودان وليبيا واليمن. وقد علل العسكر انقلاباتهم بأنهم يُخلصون البلاد من الفساد والاستعمار، لكنهم في النهاية أسسوا أنظمةً استبداديةً مستمرة لعقود. وهذه الدورة الحزبية تسرّعت مع العسكر، فكانت النتيجة أن الجيش صار المؤسسة الوحيدة القادرة على حسم الصراعات في هذه الدول.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد انتشرت في تلك الفترة أيديولوجيات متنافسة على قيادة العالم العربي. القومية العربية بقيادة عبد الناصر، والاشتراكية العلمانية في جنوب اليمن والعراق وسوريا، والتيارات الإسلامية التي اكتوت بنار الاستبداد والقمع. وقد ادّعى كل تيارٍ أنه الممثل الحقيقي لطموحات الأمة، فكان الصراع بينها قاسيًا على مدار العقود. وقد دفع الشعب العربي ثمن هذا الصراع أيديولوجيًا من قمعه واستبعاده، فلم ينجح تيار في حكمه ديمقراطيًا دون أن يُقمع أو يُهمّش.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أدّى الصراع الأيديولوجي إلى استقطابٍ حادٍ وأزماتٍ إقليمية: حرب اليمن الأهلية في الستينيات بين النظام الملكي المدعوم سعوديًا والنظام الجمهوري المدعوم مصريًا، وأزمة الأردن سنة ١٩٧٠م بين الفلسطينيين وحكم الملك حسين بمساعدة إسرائيل الضغط، والحرب الأهلية في لبنان سنة ١٩٧٥م التي جمعت كل الطوائف والقوى الخارجية. وهذه الحروب بالوكالة جعلت العالم العربي ساحةً لصراع القوى الدولية أكثر من كونه فاعلًا مستقلًا في قراراته.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد مثلت حرب أكتوبر سنة ١٩٧٣م لحظة مهمة: نجح الجيش المصري السوري في عبور قناة السويس وخطوط بارليف وكسر أسطورة جيش إسرائيل الذي لا يُهزم. وقد جاءت هذه الحرب بعد حرب ١٩٦٧م التي خسر فيها العرب القدس والجولان وسيناء. لكن النصر النسبي في ١٩٧٣م أعاد للعرب بعض كرامتهم، وفتح الطريق أمام مسار التفاوض الذي انتهى بكامب ديفيد. وهذا النصر النسبي فتح باب المفاوضات التي أنهت الحرب رسميًا، وأعادت سيناء لمصر سنة ١٩٨٢م بمعاهدة السلام المنفردة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد سقطت معظم الأنظمة العسكرية في الثمانينيات والتسعينيات، وصعدت الحركات الإسلامية في فراغ المعارضة العلمانية. فقد استطاعت جماعات مثل الإخوان المسلمين في مصر والسودان والجزائر أن تقدم نفسها كبديلٍ نظيفٍ للاستبداد العسكري. وقد ربحت في انتخابات الجزائر سنة ١٩٩١م فأُلغيت نتائجها، فاندلعت حربٌ أهليةً دمويةً دامت عقدًا. وهذه الأزمة الجزائرية أظهرت أن الإسلاميين قد يحكمون بالانتخابات، وأن غياب المسار الديمقراطي يقود حتمًا إلى العنف والاقتتال.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أنهى الربيع العربي سنة ٢٠١١م أنظمةً عمرها عقودًا في تونس ومصر وليبيا واليمن. لكن الحماس الثوري سرعان ما اصطدم بالتعقيدات: عاد العسكر إلى مصر في سنة ٢٠١٣م، وتحولت ليبيا وسوريا واليمن إلى ساحات حربٍ بالوكالة. وهكذا يبقى العالم العربي يتطلع إلى نظامٍ يجمع بين الديمقراطية والاستقرار، دون أن يجد توازنه حتى الآن. وهذا يعني أن الثورات تتوقف عند إسقاط رموز السلطة، لكنها لا تكتمل إلا ببناء بديلٌ ديمقراطيٍّ قادر على إدارة البلاد.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eعبد الناصر: زعيم الأمة والنظام\u003c/h4\u003e\u003cp class=\"ap\"\u003eجمال عبد الناصر هو الشخصية الأكثر تأثيرًا في العالم العربي الحديث. جاء إلى السلطة في ثورة يوليو سنة ١٩٥٢م، وأسّس نظامًا قوميًا اشتراكيًا جذب الجماهير بخطاباته الوطنية. وقد أمّم قناة السويس، وأصدر إصلاحات زراعية وصناعية، ودعم حركات التحرر في فلسطين والجزائر وكل أفريقيا.\u003c/p\u003e\u003cp class=\"ap\"\u003eلكن عبد الناصر أسّس أيضًا نظامًا سلطويًا أحاديًا: حلّ الأحزاب، وأخضع الصحافة، وسجن معارضيه، وبنى دولة بوليسية. وقد حكم مصر بقبضةٍ من حزب واحد هو الاتحاد الاشتراكي العربي، حتى وفاته سنة ١٩٧٠م. وقد ورّث مصر والوطن العربية نظامًا عسكريًا دام عقودًا. وهذه التجربة أثبتت أن الحكم الفردي وإن حقق إنجازات ملموسة، فإنه يُنتج فراغًا بعد رحيله لأنه لا يبني مؤسسات تدوم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوهذا يعني أن عبد الناصر كان ظاهرةً مزدوجة: رمزًا للكرامة العربية والاستقلال الوطني، وأيضًا مؤسسًا لحكم الفرد الذي عرقل التطور السياسي. وصلاحه وفساده ظلّا موضع جدلٍ حتى اليوم، ويُعلّمنا أن الزعيم الفردي لا يمكن أن يُبني عليه نظامٌ ديمقراطي. وهذا يعني أن أي زعيمٍ عربيًا كبيرًا يجب أن يُسأل: هل بنى نظامًا أم بنى ذاتًا؟ وهذا هو الفارق بين القائد والمؤسس.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eثورة ١٩٧٩ في إيران وأثرها\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم تكن ثورة إيران سنة ١٩٧٩م في العالم العربي، لكنها أثّرت فيه تأثيرًا عميقًا. فقد أعلن الخميني جمهورية إسلامية شيعية، وأسقط حكم الشاه المدعوم أمريكيًا. وقد مثّل هذا الحدث صدمة للمنطقة: ثورة شعبية تُسقط نظامًا قويًا باسم الإسلام لا باسم الشيوعية أو القومية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أثارت هذه الثورة مخاوف الأنظمة العربية السنية التي رأت فيها تهديدًا لنمط حكمها. خاصةً بعد احتلال السفارة الأمريكية في طهران سنة ١٩٧٩م، والحرب العراقية الإيرانية التي دامت ثماني سنوات. وقد دفعت هذه الثورة بعض الأنظمة العربية إلى تبنّي خطاب ديني للتنافس معها، فانتشرت السلفية المدعومة سعوديًا في مواجهة النفوذ الشيعي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوهذا يعني أن الشرق الأوسط بعد ١٩٧٩م دخل مرحلة صراع طائفي وسياسي بين إيران الثورية والدول العربية السنية. وقد تفاقم هذا الصراع بعد سنة ٢٠٠٣م مع سقوط صدام حسين وصعود قوى شيعية في العراق. وما زالت المنطقة تعيش تداعيات هذا الصراع حتى اليوم. وهذا يعني أن إيران صارت قوة إقليمية لا يُستهان بها، وأي صراعٍ عربيًا مؤثرًا لا بد أن يراعي هذا البعد الشيعي والإسلامي.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالربيع العربي: الأمل والإحباط\u003c/h4\u003e\u003cp class=\"ap\"\u003eبدأ الربيع العربي في ديسمبر سنة ٢٠١٠م من تونس حين أحرق محمد البوعزيزي نفسه احتجاجًا على الظلم والبطالة. انتشرت الثورة في مصر وليبيا واليمن وسوريا والبحرين. وسقط بن علي ومبارك والقذافي وصالح، لكن كل حالة كانت لها خصوصيتها ونتائجها المختلفة. وقد انتشرت الثورة بالتقليد لا بالتخطيط، فكانت كل دولة تُسقط استبدادها بطريقتها الخاصة، لكنها تشابهت في الحلم بالحرية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أعادت مصر استقرارًا نسبيًا مع عودة العسكريين إلى الحكم في ٢٠١٣م، بينما تحولت ليبيا إلى فوضى مسلحة. وتحولت سوريا إلى حربٍ أهليةٍ طاحنةٍ شردت ملايين السوريين ودمرت البلاد. أما اليمن فقد انقسم إلى مواجهةٍ بين الحوثيين والحكومة المدعومة سعوديًا. وهذه النتائج المتباينة تُظهر أن الربيع العربي لم يكن حدثًا واحدًا، بل كان موجة ثوراتٍ مختلفة السياقات والأدوات والمصير.\u003c/p\u003e\u003cp class=\"ap\"\u003eوهذا يعني أن الثورات العربية لم تستطع بناء أنظمة ديمقراطية راسخة، غالبًا لأن الجيوش والمصالح الخارجية والانقسامات الطائفية حالت دون ذلك. ومع ذلك، فقد غيّر الربيع العربي الوعي السياسي في المنطقة إلى الأبد: الشعب اكتشف قدرته على الحراك، وأصبح على الحكام أن يحكموا بإذنٍ من شعوبهم لا بالحديد والنار.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eحكم العسكر\u003c/b\u003e\u003cspan\u003eالانقلابات المتكررة أنشأت أنظمة عسكرية استبدادية بقيت في الحكم لعقود بذريعة الإنقاذ والتصحيح.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eصراع أيديولوجي\u003c/b\u003e\u003cspan\u003eقومية وشيوعية وإسلامية تنافست على قيادة الأمة، وأدّت إلى استقطابٍ وحروبٍ أهليةٍ إقليمية.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eثورة إيران ١٩٧٩\u003c/b\u003e\u003cspan\u003eأعادت الاعتبار للخطاب الإسلامي، وأشعلت صراعًا طائفيًا وسياسيًا لا يزال مستمرًا.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالربيع العربي\u003c/b\u003e\u003cspan\u003eحراك شعبي ضخم أسقط أنظمة لكنه لم يُكمل بناء ديمقراطي، فتوزعت النتائج بين الاستقرار والاحتراب.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالنتيجة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eثورة يوليو في مصر\u003c/td\u003e\u003ctd\u003e١٩٥٢م\u003c/td\u003e\u003ctd\u003eجمهورية عسكرية قومية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eحرب ١٩٦٧م\u003c/td\u003e\u003ctd\u003e١٩٦٧م\u003c/td\u003e\u003ctd\u003eخسارة القدس وسيناء والجولان\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eحرب أكتوبر\u003c/td\u003e\u003ctd\u003e١٩٧٣م\u003c/td\u003e\u003ctd\u003eعبور القناة واستعادة الكرامة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالثورة الإيرانية\u003c/td\u003e\u003ctd\u003e١٩٧٩م\u003c/td\u003e\u003ctd\u003eجمهورية إسلامية وصدمة إقليمية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالربيع العربي\u003c/td\u003e\u003ctd\u003e٢٠١١م\u003c/td\u003e\u003ctd\u003eسقوط أنظمة وحروب أهلية\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eالشعوب لا تُحكم بالحديد والنار طويلًا، فإذا جاء الربيع لم يُطفئه أحد.\u003c/p\u003e\u003ccite\u003eطاهر بن جلون\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eالانقلابات والأيديولوجيات المتصارعة شكلت العالم العربي الحديث، أنشأت أنظمة استبدادية وحروبًا استعمارية بالوكالة. لكن الشعب ظل يحمل روحًا ثورية، انفجرت في الربيع العربي سنة ٢٠١١م، فأسقطت أنظمةً لكنها لم تكمل بناء الديمقراطية.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-4","n":"الصراعات الإقليمية","ic":"💥","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-4\" style=\"--c:#37474F\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e💥\u003c/div\u003e\n      \u003ch2\u003eالصراعات الإقليمية\u003c/h2\u003e\n      \u003cp\u003eبعد الاستقلال لم تدخل المنطقة عصر الاستقرار، بل دخلت عصر الصراعات: القضية الفلسطينية التي ما زالت مفتوحة، وحروب إقليمية بالوكالة، والنفط الذي جمع المال والحرب معًا. وهذه هي الصراعات التي رسمت وجه الشرق الأوسط في القرن الحادي والعشرين وما زالت تحدد مصيره.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#palestine-conflict\"\u003eالقضية الفلسطينية من ١٩٤٨ إلى اليوم\u003c/a\u003e\u003ca href=\"#regional-wars\"\u003eالحروب الإقليمية والتدخل الأجنبي\u003c/a\u003e\u003ca href=\"#oil-economy\"\u003eالنفط والاقتصاد السياسي\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"palestine-conflict","n":"القضية الفلسطينية من ١٩٤٨ إلى اليوم","ic":"🕋","part":"الصراعات الإقليمية","h":"\u003carticle class=\"ch3\" id=\"palestine-conflict\" data-toc=\"القضية الفلسطينية من ١٩٤٨ إلى اليوم\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالصراعات الإقليمية\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ١ من ٣\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٤\u003ci\u003e.\u003c/i\u003e١\u003c/span\u003e\n            \u003ch3\u003eالقضية الفلسطينية من ١٩٤٨ إلى اليوم\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eكيف تطورت القضية الفلسطينية؟ ولماذا بقيت الصراع العربي الإسرائيلي مفتوحًا؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eبدأت القضية الفلسطينية الحديثة سنة ١٩٤٨م بإعلان دولة إسرائيل على ٧٨٪ من فلسطين التاريخية، وشُرّد أكثر من ٧٠٠ ألف فلسطيني من بيوتهم في ما عُرف بالنكبة. وقد رفض العرب قرار التقسيم، لكن التنظيم العسكري العربي لم يكن في مستوى جيش الهاغاناه المدرب والمجهز. وقد خاضت مصر وسوريا ولبنان والأردن حروبًا مع إسرائيل في ١٩٤٨م و١٩٦٧م و١٩٧٣م، لكن النتائج كانت متباينة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد مثلت حرب ١٩٦٧م كارثة كبرى للعرب: سقطت القدس والضفة الغربية وغزة والجولان وسيناء في ستة أيام. وقد ولّدت هذه الهزيمة صدمة عميقة في الوجدان العربي، دفعت إلى إعادة النظر في كل مقولات الزعامة والنظام. وأدّت إلى ظهور حركات المقاومة الفلسطينية الجديدة كفتح والجبهة الشعبية والجبهة الديمقراطية التي رفعت سلاح الكفاح المسلح. وقد خاضت هذه الحركات معارك خاطفة ضد الاحتلال، وحولت القضية من قضية لاجئين إلى قضية تحررٍ وطني.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد غيّرت حرب أكتوبر سنة ١٩٧٣م المشهد: نجح الجيشان المصري والسوري في العبور وكسر الخطوط الدفاعية الإسرائيلية. وهذا النصر المعنوي أوقف مسار الهزائم، وفتح الباب أمام المفاوضات التي أنتجت اتفاقية كامب ديفيد سنة ١٩٧٨م وعودة سيناء لمصر سنة ١٩٨٢م. لكن الفلسطينيين لم يكونوا جزءًا من هذا الاتفاق، وظلوا دون أرضٍ ولا دولة. وهكذا صنعت مصر سلامها المنفرد، وبقي الفلسطينيون وحدهم أمام الاحتلال والقمع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد انطلقت الانتفاضة الفلسطينية الأولى سنة ١٩٨٧م في الضفة وغزة، وكانت انتفاضة شعبية سلمية بالحجارة والإضرابات، قادها الشباب لا الأحزاب التقليدية. وقد ضغطت الانتفاضة على إسرائيل دوليًا، ودفعتها إلى طاولة المفاوضات. وفي سنة ١٩٨٨م اعترفت منظمة التحرير بإسرائيل ضمن حل الدولتين، وفي سنة ١٩٩٣م وقّع اتفاق أوسلو الذي أنشأ السلطة الوطنية الفلسطينية.\u003c/p\u003e\u003cp class=\"ap\"\u003eلكن مسار أوسلو فشل في تحقيق دولة فلسطينية مستقلة. فقد تعثرت المفاوضات حول القدس واللاجئين والحدود والاستيطان، وقتل رئيس الوزراء رابين سنة ١٩٩٥م، ووصل نتانياهو إلى السلطة ورفض تطبيق الاتفاق. وانفجرت الانتفاضة الثانية سنة ٢٠٠٠م، وأعادت المنطقة إلى دوامة العنف التي قطعت التفاوض سنوات. وهكذا ماتت أحلام الدولة المستقلة، وعادت القضية إلى نقطة الصفر تقريبًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eواليوم، لا تزال القضية الفلسطينية أبعد ما تكون عن حلّها. فقد ضاعفت إسرائيل عدد المستوطنات في الضفة بعد أوسلو، وأبقت القدس والغزة تحت السيطرة العسكرية. وأعادت حروب غزة المتكررة وضمّ إسرائيل للجولان وهجوم الولايات المتحدة على فلسطين وصفقة القرن، القضية إلى الواجهة مرة أخرى. وما زالت فلسطين المفتاح الذي لا يُحلّ الشرق الأوسط بدونه.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالنكبة وسيلة الإسقاط\u003c/h4\u003e\u003cp class=\"ap\"\u003eالنكبة ليست حدثًا عسكريًا فقط، بل هي كارثة إنسانية أخرجت شعبًا كاملًا من أرضه ليلةً واحدة في ليلةٍ قدرية. وقد شُرّدت أسرٌ بأكملها في لبنان وسوريا والأردن ولدى مخيمات دولية، وما زال الملايين يحملون المفتاح كرمزٍ للبيت الذي ولدوا فيه ولم يعيشوا فيه. ولم يُعترف بحق العودة رسميًا حتى اليوم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بنت إسرائيل سرديتها على أن الأرض أرض بلا شعب، وأن اليهود عادوا إلى وطنٍ قديمٍ لا سكان له. لكن الحقيقة كانت غير ذلك: فلسطين كانت بلدًا عربيًا مزدهرًا في الزراعة والتجارة والثقافة، وحارب شعبها بشراسة ضد قرار التقسيم. وقد قاومت عصابات الهاغاناه وغيرها، لكنها لم تستطع الوقوف أمام جيشٍ منظّمٍ وتسليحٍ متقدم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد مثّلت قرية دير ياسين رمزًا لهذه المأساة: مذبحة راح ضحيتها أكثر من مئة فلسطيني مدني، نفذتها جماعة الإرغون الصهيونية سنة ١٩٤٨م. وقد نشرت هذه المذبحة الرعب بين الفلسطينيين، ففرّوا بالملايين خوفًا من تكرارها. وفي المقابل، بنت إسرائيل مجدها على هذا الفراغ البشري المفروض.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eمقاومة الكفاح المسلح\u003c/h4\u003e\u003cp class=\"ap\"\u003eبعد نكسة ١٩٦٧م، تحوّل الكفاح الفلسطيني من عمل سياسي إلى عمل مسلح. فبعد أن أسقط العرب مقولة أن الهزيمة عسكرية، رفع الفلسطينيون سلاحهم ضد الاحتلال الإسرائيلي. وقد أسس ياسر عرفات حركة فتح في الخمسينيات، وشهد تصاعد العمل الفدائي ضد أهداف إسرائيلية في الداخل والخارج.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بلغ العمل الفدائي ذروته بعد معركة الكرامة سنة ١٩٦٨م التي نجح فيها مقاتلو فتح في صدّ هجومٍ إسرائيليٍّ كبيرٍ على قرية الكرامة في الأردن. وقد ضاعفت هذه المعركة شهرة عرفات والمقاومة الفلسطينية، وأعادت للعرب بعضًا من كرامتهم. لكنها أيضًا أثارت غضب الأردن من العمليات التي كانت تنطلق من أرضه، فانتهت بأيلول أسود سنة ١٩٧٠م وطرد الفلسطينيين من الأردن.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد انتقلت المقاومة إلى لبنان، لكنها اصطدمت بالحرب الأهلية اللبنانية سنة ١٩٧٥م التي خاضتها الفصائل الفلسطينية ضد الموارنة وحلفائهم. وقد انتهت الحرب باجتياح إسرائيل لبيروت سنة ١٩٨٢م وخروج المقاومة إلى تونس. وهكذا خسر الفلسطينيون قواعدهم في الأردن ولبنان معًا، وبقي الكفاح السياسي هو الخيار الأخير.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eغزة والاحتلال المستمر\u003c/h4\u003e\u003cp class=\"ap\"\u003eقطاع غزة هو الحصار الأطول في التاريخ الحديث. فقد انسحبت إسرائيل من غزة سنة ٢٠٠٥م ظاهريًا، لكنها أبقت السيطرة على المعابر والحدود والأجواء. ثم فازت حماس في انتخابات ٢٠٠٦م، ففرضت إسرائيل حصارًا بريًا وجويًا وبحريًا على القطاع منذ سنة ٢٠٠٧م، وشنت عليه عدة حروب مدمرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد شهدت غزة حروبًا متعددة: ٢٠٠٨م و٢٠١٢م و٢٠١٤م و٢٠٢١م و٢٠٢٣م، خلفت آلاف القتلى والجرحى والمشردين، ودمّرت أحياءً كاملة ودمرت بنيتها التحتية. وقد رفعت كل حرب الرقم القتلى، وكشفت عن أن القضية لم تعد صراع حدودٍ بين دولتين، بل صراع بقاءٍ لشعبٍ محاصرٍ دون دولة ولا قرار.\u003c/p\u003e\u003cp class=\"ap\"\u003eومع ذلك، بقيت غزة رمزًا للمقاومة والصمود الفلسطيني. فشعبها رفض الخروج أو الاستسلام، وحافظ على هويته وإنسانيته في ظروف غير إنسانية. وهذه الصورة هي التي حرّكت الرأي العام العالمي لصالح فلسطين، وجعلت قضيتها قضية إنسانية لا سياسية فقط. لكن المأساة مستمرة حتى اليوم دون أفقٍ واضحٍ للحل.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالنكبة ١٩٤٨\u003c/b\u003e\u003cspan\u003eشُرّد ٧٠٠ ألف فلسطيني ووُلدت أزمة لاجئين ما زالت مفتوحة بعد سبعين عامًا.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eنكسة ١٩٦٧\u003c/b\u003e\u003cspan\u003eخسارة القدس والضفة والجولان وسيناء في ستة أيام، أنجبت مقاومة مسلحة فلسطينية.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأوسلو وفشله\u003c/b\u003e\u003cspan\u003eاتفاق سلام أنشأ سلطة فلسطينية لكنه فشل في تحقيق دولة، بسبب الاستيطان ورفض نتانياهو.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eحصار غزة\u003c/b\u003e\u003cspan\u003eحروب متكررة وحصار مستمر منذ ٢٠٠٧م يجعل القضية الفلسطينية أطول صراع مفتوح في المنطقة.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالحرب\u003c/th\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالنتيجة\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eحرب ١٩٤٨م\u003c/td\u003e\u003ctd\u003e١٩٤٨م\u003c/td\u003e\u003ctd\u003eفوز إسرائيلي وتوسع\u003c/td\u003e\u003ctd\u003eالنكبة واللجوء\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالعدوان الثلاثي\u003c/td\u003e\u003ctd\u003e١٩٥٦م\u003c/td\u003e\u003ctd\u003eانسحاب مصري والسويس\u003c/td\u003e\u003ctd\u003eعودة تامر للقناة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالنكسة\u003c/td\u003e\u003ctd\u003e١٩٦٧م\u003c/td\u003e\u003ctd\u003eهزيمة عربية كبرى\u003c/td\u003e\u003ctd\u003eالقدس والضفة والجولان\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eحرب أكتوبر\u003c/td\u003e\u003ctd\u003e١٩٧٣م\u003c/td\u003e\u003ctd\u003eعبور القناة والنصر\u003c/td\u003e\u003ctd\u003eطريق كامب ديفيد\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eاجتياح لبنان\u003c/td\u003e\u003ctd\u003e١٩٨٢م\u003c/td\u003e\u003ctd\u003eخروج المقاومة لتونس\u003c/td\u003e\u003ctd\u003eانهيار قواعد لبنان\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eلن أسلّم مفتاح بيتي لأحد، حتى يعود إليّ أو يُدفن معي.\u003c/p\u003e\u003ccite\u003eلاجئ فلسطيني\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eالقضية الفلسطينية كانت المحور الأول للعالم العربي منذ ١٩٤٨م. بين النكسة والانتفاضة وأوسلو وحصار غزة، بقيت القضية مفتوحة دون حل. وما زال السلام العادل بعيدًا لأن الاستيطان والاحتلال والحصار لم يتوقفا.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"regional-wars","n":"الحروب الإقليمية والتدخل الأجنبي","ic":"💥","part":"الصراعات الإقليمية","h":"\u003carticle class=\"ch3\" id=\"regional-wars\" data-toc=\"الحروب الإقليمية والتدخل الأجنبي\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالصراعات الإقليمية\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٢ من ٣\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٤\u003ci\u003e.\u003c/i\u003e٢\u003c/span\u003e\n            \u003ch3\u003eالحروب الإقليمية والتدخل الأجنبي\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eكيف تحولت المنطقة إلى ساحة لحروب بالوكالة بين القوى الدولية؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eلم تكن الحروب في الشرق الأوسط دائمًا صراعاتٍ حدوديةٌ أو وطنية، بل كانت في كثير منها حروبًا بالوكالة بين قوى دولية وإقليمية متنافسة. من حرب اليمن في الستينيات إلى الحرب السورية بعد ٢٠١١م، شاركت فيها كل من السعودية وإيران وتركيا وروسيا وأمريكا بأذرعٍ مختلفة. وهذا التدخل الدولي يُفسّر لماذا استمرّت هذه النزاعات سنواتٍ طويلةٍ رغم فداحتها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بدأت هذه النمط من الحروب بالصراع السعودي المصري على اليمن في الستينيات. فقد دعمت مصر النظام الجمهوري الاشتراكي بقيادة عبد الله السلال، بينما دعمت السعودية والأردن النظام الملكي بقيادة الإمام البدر. وقد انتهت الحرب بانسحاب مصر سنة ١٩٦٧م بعد هزيمتها في النكسة، ووضمنت استمرار جمهورية اليمن الشمالي. وقد أدخلت هذه الحرب مصر في حرب استنزافٍ أنهت جيشها وأضرت باقتصادها سنوات.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد جاءت الحرب الأهلية في لبنان سنة ١٩٧٥م لتجمع كل التدخلات: شاركت فيها سوريا بجيشها، وإسرائيل باحتلالها الجنوب، وفلسطين بالفلسطينيين، وأمريكا بقوات البحرية. وقد تحولت الحرب إلى تجربة مريرة قتل فيها أكثر من ١٠٠ ألف شخص، وانتهت باتفاق الطائف سنة ١٩٨٩م. لكنها تركت لبنان منقسمًا طائفيًا، وتركّت سوريا تحكمه لعقود. وصار لبنان أشبه بمركز تجاربٍ لكل من يريد ضرب جاره.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد مثّلت الحرب العراقية الإيرانية سنة ١٩٨٠م نموذجًا آخر للحروب بالوكالة: دعمت الدول العربية السنية بقيادة السعودية والخليج العراق ضد إيران الثورية. وقد استمرت الحرب ثماني سنوات، وقتل فيها أكثر من مليون شخص. وقد انتهت بلا فائزٍ واضح، لكنها أنهت طموح الخميني في تصدير الثورة إلى العالم العربي. ولم تتعلم الأطراف منها درسًا، فعادت المنطقة إلى حروبها بعد سنوات.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد شكّل غزو العراق سنة ٢٠٠٣م نقطة انعطاف في تاريخ المنطقة. فقد أنهى نظام صدام حسين بغطاءٍ أمريكيٍّ بريطاني، وفتح الباب أمام صراعٍ طائفيٍّ مدمر. كما أنهى التوازن الإقليمي القائم على العراق القوي والحاضر في مواجهة إيران. وقد مكّن هذا الاجتياح إيران من بسط نفوذها في العراق ولبنان واليمن لاحقًا عبر الميليشيات الشيعية. بعد مرور ثمانية عشر عاما على الغزو، ما زالت المنطقة تعيش تداعياته.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eحرب اليمن: نموذج الصراع بالوكالة\u003c/h4\u003e\u003cp class=\"ap\"\u003eاليمن هو النموذج الأوضح للصراع الدولي في المنطقة. فقد شهد في ستينيات القرن الماضي حربًا أهلية بين الملكيين والجمهوريين، كانت مصر والسعودية طرفين رئيسين فيها. وبعد خمسين عامًا، عادت البلاد إلى حربٍ أهليةٍ أخرى سنة ٢٠١٤م بين الحوثيين والحكومة الشرعية المدعومة سعوديًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد تدخلت السعودية الإمارات في الحرب اليمنية بتحالفٍ عسكريٍّ مباشرٍ منذ سنة ٢٠١٥م، بهدف استعادة حكومة عبد ربه منصور هادي. لكن التدخل أدى إلى كارثة إنسانية: ملايين النازحين، ومجاعة شاملة، وكوليرا وأوبئة. وقد أثبتت الحرب أن التدخل العسكري الخارجي في بلدٍ فقيرٍ هشٍّ لا يُنتج نصرًا، بل يُنتج دمارًا وكرهًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eواليوم، ما زال اليمن منقسمًا: شمال تحت الحوثيين، وجنوب تحت المجلس الانتقالي المدعوم إماراتيًا، وساحل تحت الصراع الدولي. وهذا يعني أن اليمن لم يعد بلدًا واحدًا، بل أصبح ساحةً لملفات إقليميةٍ أكبر من قدرته على الاستقرار. والقضية اليمنية اليوم هي من أكبر كوارث العالم الإنسانية المنسية.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eلبنان: ساحة الحروب الصغيرة\u003c/h4\u003e\u003cp class=\"ap\"\u003eلبنان هو النموذج الآخر للتدخل الدولي في العصر الحديث. فقد شهد حربًا أهليةً مدمرةً بين ١٩٧٥ و١٩٩٠م، شاركت فيها سوريا وفلسطين وإسرائيل وأمريكا والقوى اللبنانية الطائفية. ثم احتلته سوريا عسكريًا حتى سنة ٢٠٠٥م، ثم خضع لنفوذ حزب الله الشيعي المدعوم إيرانيًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد اكتوت لبنان بحروب إسرائيل المتكررة: اجتياح ١٩٨٢م، وحرب ٢٠٠٦م التي خاضها حزب الله، ومواجهات متكررة على الحدود. وقد خرج لبنان من كل هذه الحروب منهكًا اقتصاديًا ومنقسمًا سياسيًا. كما شهد في سنة ٢٠٢٠م انفجار مرفأ بيروت الذي قتل أكثر من ٢٠٠ شخص ودُمر نصف المدينة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوهذا يعني أن لبنان ما زال يعيش أخطر لحظاته: أزمة اقتصادية خانقة، وانقسام طائفي حاد، ونفوذ إيراني مستمر، وانهيار المؤسسات. وقد تحول البلاد من نموذج التعددية والتنوع في الشرق الأوسط إلى رمز للفشل. وهذا يُظهر أن التدخلات الإقليمية لا تبني بلدًا، بل تهدم تجربة كانت فريدة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eسوريا: الحرب التي غيرت المنطقة\u003c/h4\u003e\u003cp class=\"ap\"\u003eالحرب السورية التي بدأت سنة ٢٠١١م كانت الأكبر في تاريخ العالم العربي الحديث. فقد طالب السوريون بالحرية والإصلاح، فقابلهم نظام بشار الأسد بعنفٍ دموي. وتحولت الثورة إلى حربٍ أهليةٍ مدمرةٍ شردت أكثر من نصف السكان، وقتلت مئات الآلاف، ودمّرت مدنًا كاملة. وأصبحت أكبر كارثة إنسانية في القرن الحادي والعشرين.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد تدخلت في هذه الحرب كل القوى: روسيا بغطاء جوي لنظام الأسد، وإيران بميليشياتها، وتركيا بدعمها للفصائل السنية والمعارضة، وأمريكا بدعم الأكراد ومقاتليها. كما ظهرت جماعات متطرفة كداعش والنصرة التي استغلت الفراغ الأمني وسيطرت على مساحات واسعة. وهكذا صارت أرض سوريا ساحةً لجميع القوى دون شعبها.\u003c/p\u003e\u003cp class=\"ap\"\u003eواليوم، ما زالت سوريا منقسمة: نظام الأسد في دمشق، وأكراد في شمال شرق البلاد، ومدن تحت نفوذ تركي، ومعارضة في الشمال الغربي. وقد عادت دمشق إلى الجامعة العربية سنة ٢٠٢٣م بعد سنوات من العزلة. لكن الحقيقة أن سوريا لم تعد الدولة التي كانت، بل صارت دولة فاشلة تحت وصاية دولية.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eحروب بالوكالة\u003c/b\u003e\u003cspan\u003eالمنطقة كانت ساحة لصراع القوى: مصر والسعودية في اليمن، سوريا وإسرائيل في لبنان، العرب وإيران في العراق.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eحرب اليمن\u003c/b\u003e\u003cspan\u003eحرب أهلية متكررة منذ ستينيات القرن الماضي، واليوم كارثة إنسانية كبرى بفعل التدخل السعودي الإماراتي.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eلبنان\u003c/b\u003e\u003cspan\u003eمن نموذج التعددية إلى ساحة نفوذ، شهد حربًا أهلية واحتلال سوري وحروب إسرائيل وانهيارًا اقتصاديًا.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسوريا بعد ٢٠١١\u003c/b\u003e\u003cspan\u003eأكبر حرب في التاريخ العربي الحديث، شردت نصف السكان وحولت الدولة إلى فاعل ضعيف تحت وصاية دولية.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالصراع\u003c/th\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالأطراف\u003c/th\u003e\u003cth\u003eالنتيجة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eحرب اليمن الأولى\u003c/td\u003e\u003ctd\u003e١٩٦٢-١٩٧٠م\u003c/td\u003e\u003ctd\u003eمصر والسعودية بالوكالة\u003c/td\u003e\u003ctd\u003eانتصار الجمهوريين\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالحرب الأهلية اللبنانية\u003c/td\u003e\u003ctd\u003e١٩٧٥-١٩٩٠م\u003c/td\u003e\u003ctd\u003eسوريا وفلسطين وإسرائيل\u003c/td\u003e\u003ctd\u003eاتفاق الطائف وانقسام\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالحرب العراقية الإيرانية\u003c/td\u003e\u003ctd\u003e١٩٨٠-١٩٨٨م\u003c/td\u003e\u003ctd\u003eالخليج ضد إيران\u003c/td\u003e\u003ctd\u003eبلا فائز ومليون قتيل\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eحرب لبنان الثانية\u003c/td\u003e\u003ctd\u003e٢٠٠٦م\u003c/td\u003e\u003ctd\u003eحزب الله ضد إسرائيل\u003c/td\u003e\u003ctd\u003eوقف نار وخسائر كبيرة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالحرب السورية\u003c/td\u003e\u003ctd\u003e٢٠١١م-الآن\u003c/td\u003e\u003ctd\u003eروسيا وإيران وتركيا وأمريكا\u003c/td\u003e\u003ctd\u003eدولة فاشلة ومنقسمة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eالشرق الأوسط لا يحتاج حروبًا بالوكالة، بل إلى شعبه أن يقرر بنفسه.\u003c/p\u003e\u003ccite\u003eعبد الله الغذاري\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eحولت التدخلات الدولية والإقليمية الشرق الأوسط إلى ساحة لحروبٍ استمرت لعقود. من اليمن إلى لبنان إلى سوريا، كانت الشعوب هي الضحية والقوى الأجنبية هي الفاعل. ولم تنتج هذه الصراعات أي نصر حقيقي لأي طرف.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"oil-economy","n":"النفط والاقتصاد السياسي","ic":"🛢️","part":"الصراعات الإقليمية","h":"\u003carticle class=\"ch3\" id=\"oil-economy\" data-toc=\"النفط والاقتصاد السياسي\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالصراعات الإقليمية\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٣ من ٣\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٤\u003ci\u003e.\u003c/i\u003e٣\u003c/span\u003e\n            \u003ch3\u003eالنفط والاقتصاد السياسي\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eلم يغيّر النفط وجه الشرق الأوسط وحده، بل غيّر سياساته واقتصاداته ومجتمعاته. فقد أصبحت دولٌ بأكملها تقف على بحارٍ من الذهب الأسود، وبنيت نهضاتٌ على ريعه، واشتعلت حروبٌ من أجله. وهو سلاحٌ ونعمةٌ وعبءٌ في الوقت نفسه.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان اكتشاف النفط في إيران سنة ١٩٠٨م ثم في السعودية والعراق والكويت بعد ذلك نقطة تحولٍ تاريخية في تاريخ المنطقة. فقبل النفط كانت دول الخليج قبائلَ ومدنًا تجاريةً فقيرةً تعيش على الغوص على اللؤلؤ والتجارة والزراعة المحدودة. وبعده صارت دول الخليج من أغنى دول العالم، وانتقل سكانها من البيوت الطينية إلى ناطحات السحاب وحرّموا الفقر في جيلٍ واحد.\u003c/p\u003e\u003cp class=\"ap\"\u003eلكن النفط لم يكن نعمةً مجانية، بل أصبح مصدرًا للصراع منذ اللحظة الأولى. فقد تأسست الشركات الأجنبية على حساب إيرادات الدول المنتجة، وسُمّيت اتفاقية الخط الأحمر التي قسمتها بين البريطانيين والأمريكيين والفرنسيين تمثيلًا للسيطرة. ثم جاءت موجة التأميم في سبعينيات القرن الماضي فاسترجعت الدول سيادتها على ثروتها، ورفعت أسعار النفط، وحولت الاقتصاد العالمي رأسًا على عقب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوهكذا أثر النفط على كل مناحي الحياة: اختفت أشجار النخيل أمام الأسفلت، وجاء العمال من كل قارات الأرض، وصارت الخطابات السياسية تدور حول حصة كل دولة من الأوبك. وتحولت المدن إلى مدن عالمية في عشرين سنة، بينما بقيت الزراعة والصناعة والخدمات المعرفية ضعيفةً لا تُذكر في معظم هذه الدول. فرحلة النفط كانت قصة نجاحٍ هائلٍ أهلت المنطقة للاقتصادات العالمية، لكنها في الوقت نفسه أنتجت اعتمادًا مستحيلًا على مصدرٍ واحدٍ لا يدوم.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eاكتشاف النفط وتغيير الخريطة\u003c/h4\u003e\u003cp class=\"ap\"\u003eبدأ حفر أول بئر نفط في الشرق الأوسط بمنطقة مسجد سليمان جنوب غرب إيران سنة ١٩٠٨م على يد الشركة الأنجلو-فارسية التي عُرفت لاحقًا باسم بي بي. وكان هذا الاكتشاف أول انطلاق لصناعة النفط في المنطقة التي تحولت بعدها إلى مركز الطاقة في العالم كله. ومن هناك انتشر الحفر إلى باطن الجزيرة العربية والهلال الخصيب، وصار النفط أهم صادرات المنطقة ومحط أنظار العالم.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم جاء اكتشاف بئر الدمام في السعودية سنة ١٩٣٨م بمعدلات ضخمة أفصحت عن حقول جابر والخفجي. وتلا ذلك اكتشاف حقل كركوك في العراق وحقول البرقان في الكويت. وقد انتقلت المنطقة بذلك من كونها سوقًا هامشيةً إلى المنطقة الأهم في اقتصاد الطاقة العالمي، وراح المستعمرون والشركات يتنافسون على الامتيازات والنفوذ.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقبل اكتشاف النفط بزمن، كانت تجارة اللؤلؤ مصدر الرزق الرئيس لساحل الخليج. وكان الغوص يستمر أشهرًا في البحر، وتحمل السفن اللؤلؤ إلى بومباي وأوروبا. ثم جاء اللؤلؤ الصناعي الياباني في ثلاثينيات القرن الماضي فانهار هذا الاقتصاد التقليدي، وفقد الآلاف عملهم. فجاء النفط ليعوضهم، لكنه حوّل المنطقة إلى عالمٍ آخر لا يشبه ما عرفوه.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالدول الريعية واقتصاد الريع\u003c/h4\u003e\u003cp class=\"ap\"\u003eمع تدفق النفط نشأت ما يُسمى الدول الريعية، وهي دول تعتمد على إيرادات النفط أكثر من الضرائب على مواطنيها. وبينما تدفع الضرائب للإيرادات في الدول العادية حق المساءلة الشعبية، فإن دخل النفط جعل الحكومات الخليجية مستقلةً عن شعبها ماليًا، وصارت توزع الخدمات والإسكان والوظائف بدلًا من الحاجة إلى شرعية انتخابية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان لهذا الاقتصاد مزايا جليلة: بناء مدن حديثة، مجانية التعليم والعلاج، توفير الوظائف، وشبكات مواصلات وطيران متطورة. لكنه أنتج أيضًا مشكلات بنيوية: اعتماد على العمالة الأجنبية بأعداد تفوق السكان في بعض دول الخليج، وضعف في الصناعة والزراعة، وبطالة مقنّعة في صفوف الشباب بسبب تكلفة العمالة الوافدة المنخفضة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد حاولت دول عديدة التنويع اقتصاديًا. فالمغرب والأردن ومصر عملت على السياحة والصناعة والخدمات، بينما قامت السعودية والإمارات بمشاريع ضخمة مثل نيوم ورؤية ٢٠٣٠. لكن التحول الحقيقي يحتاج عقودًا من التعليم والتقنية والإصلاح المؤسسي، لا مجرد مشاريع استعراضية. وهو التحدي الكبير الذي يواجه دول المنطقة كلها في القرن الحادي والعشرين.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eحروب النفط والصدمات الاقتصادية\u003c/h4\u003e\u003cp class=\"ap\"\u003eلما قررت العرب استخدام النفط كسلاح في حرب أكتوبر سنة ١٩٧٣م، فرضوا حظرًا على تصديره للدول الغربية المؤيدة لإسرائيل. فارتفعت الأسعار أربعة أضعاف خلال أشهر، ودخل الاقتصاد العالمي في أزمةٍ غير مسبوقة. وكانت هذه أول مرة يستخدم فيها العرب هذه الورقة بهذا الشكل، وأثبتت أن الطاقة سلاحٌ استراتيجي.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم جاءت الثورة الإيرانية سنة ١٩٧٩م فانخفض الإنتاج الإيراني، وارتفعت الأسعار مرة أخرى، وتدفقت الأموال على دول الخليج التي لم تكن متحمسة للثورة. وبينما جلس العراق بجيشه الضخم على ثروةٍ زائلة، هاجم إيران سنة ١٩٨٠م. وقد أنفقت دول الخليج مليارات على تمويل تلك الحرب التي دامت ثماني سنوات بدون فائز.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان الغزو العراقي للكويت سنة ١٩٩٠م أشهر حروب النفط؛ فقد ادعى صدام أن الكويت تسرق نفطه بإفراطها في الإنتاج. وتجمع العالم كله ضده في تحالفٍ دوليٍّ حرر الكويت في مئة ساعة. لكن العراق خرج من الحرب مدمّرًا ومحاطًا بالحصار لعقدٍ كامل. وهكذا كان النفط دائمًا سببًا للثراء وسببًا للحرب في الوقت نفسه.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eما بعد النفط وتحديات المستقبل\u003c/h4\u003e\u003cp class=\"ap\"\u003eمع تصاعد التحذيرات من تغيّر المناخ وارتفاع حركة الطاقة المتجددة، يواجه اقتصاد النفط مستقبلًا غير مضمون. وأعلنت دول أوروبية والعالم أجمع مواعيد للتخلص من المحركات العاملة بالبنزين، وصارت الشركات العالمية تبيع أصولها النفطية. وقد أدركت دول الخليج هذا التحول فبدأت تخطط لاقتصاد المعرفة والسياحة والطاقة النظيفة.\u003c/p\u003e\u003cp class=\"ap\"\u003eومن أبرز هذه المشاريع رؤية السعودية ٢٠٣٠ التي تهدف إلى تنويع الاقتصاد وجذب الاستثمار الأجنبي وتطوير السياحة والترفيه. وكذلك رؤية الإمارات الاقتصادية التي حولت دبي إلى مركزٍ مالي وتجاري عالمي. لكن هذه المشاريع تحتاج إلى إصلاحات سياسية واجتماعية عميقة، لا مجرد بناء أبراج ومنتجعات.\u003c/p\u003e\u003cp class=\"ap\"\u003eوستظل المنطقة محتاجة إلى نموذج جديد يربط بين اقتصاداتها المختلفة: نفط في الخليج، صناعة وسياحة في مصر والمغرب، زراعة وتجارة في وادي النيل والهلال الخصيب، وخدمات رقمية في كل مكان. والمستقبل يعود إلى من يبني الإنسان لا من يستخرج الأرض؛ فالنفط مالٌ يزول، والمعرفة رأسمالٌ يدوم.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eاكتشاف مسجد سليمان\u003c/b\u003e\u003cspan\u003eأول بئر نفط في الشرق الأوسط سنة ١٩٠٨م في إيران، فتح عصر النفط في المنطقة بأسرها.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالدول الريعية\u003c/b\u003e\u003cspan\u003eدول تعتمد على دخل النفط وتوزع الخدمات بدل الضرائب، فتفقد مواطنيها حق المساءلة المالية.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eحظر النفط ١٩٧٣\u003c/b\u003e\u003cspan\u003eاستخدام النفط كسلاح في حرب أكتوبر، فارتفعت الأسعار أربعة أضعاف ودخل العالم في أزمة طاقة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eما بعد النفط\u003c/b\u003e\u003cspan\u003eالتنويع الاقتصادي وبناء اقتصاد المعرفة هو التحدي الكبرى لدول المنطقة في القرن الحادي والعشرين.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمحطة\u003c/th\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eأول بئر نفط\u003c/td\u003e\u003ctd\u003e١٩٠٨م\u003c/td\u003e\u003ctd\u003eمسجد سليمان في إيران\u003c/td\u003e\u003ctd\u003eانطلاق صناعة النفط\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eبئر الدمام\u003c/td\u003e\u003ctd\u003e١٩٣٨م\u003c/td\u003e\u003ctd\u003eالسعودية تكتشف حقولًا ضخمة\u003c/td\u003e\u003ctd\u003eتغير خرائط الاقتصاد\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eحظر النفط\u003c/td\u003e\u003ctd\u003e١٩٧٣م\u003c/td\u003e\u003ctd\u003eالعرب يقطعون التصدير\u003c/td\u003e\u003ctd\u003eصدمة أسعار عالمية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالثورة الإيرانية\u003c/td\u003e\u003ctd\u003e١٩٧٩م\u003c/td\u003e\u003ctd\u003eضعف الإنتاج\u003c/td\u003e\u003ctd\u003eارتفاع ثانٍ للأسعار\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eغزو الكويت\u003c/td\u003e\u003ctd\u003e١٩٩٠م\u003c/td\u003e\u003ctd\u003eالعراق يهاجم جاره\u003c/td\u003e\u003ctd\u003eحرب الخليج الثانية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eرؤية ٢٠٣٠\u003c/td\u003e\u003ctd\u003e٢٠١٦م\u003c/td\u003e\u003ctd\u003eتنويع الاقتصاد السعودي\u003c/td\u003e\u003ctd\u003eبداية ما بعد النفط\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eالنفط نعمةٌ إن أُدير بحكمة، ونقمةٌ إن أُدار بجهل. والميزان هو الإدارة لا الثروة.\u003c/p\u003e\u003ccite\u003eمحمد البرادعي\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eحول النفط المنطقة إلى مركز الاقتصاد العالمي، وبنى مدنًا عظيمة في جيلٍ واحد. لكنه أنتج اعتمادًا على مصدرٍ واحد، ودولًا لا تحتاج مواطنيها مالياً، وحروبًا من أجل الحصص والأسعار. والمستقبل يعتمد على التنويع وبناء اقتصاد المعرفة قبل أن ينضب الذهب الأسود.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-5","n":"الحاضر","ic":"🌐","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-5\" style=\"--c:#37474F\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🌐\u003c/div\u003e\n      \u003ch2\u003eالحاضر\u003c/h2\u003e\n      \u003cp\u003eكيف يعيش العرب اليوم؟ في التعليم والمرأة والإعلام والرقمنة والهوية والربيع العربي. فوجه العالم العربي في القرن الحادي والعشرين رسمته هذه القوى الخمسة، وسيرسمه في العقود القادمة جيلٌ جديدٌ لم يعرف الاستعمار ولا الحرب الباردة.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#education-women\"\u003eالتعليم ونهضة المرأة\u003c/a\u003e\u003ca href=\"#media-digital\"\u003eالإعلام والرقمنة\u003c/a\u003e\u003ca href=\"#identity-belonging\"\u003eالهوية والانتماء\u003c/a\u003e\u003ca href=\"#arab-spring\"\u003eالربيع العربي ومستقبل المنطقة\u003c/a\u003e\u003ca href=\"#economy-rentier\"\u003eالاقتصاد: من الريع إلى التنويع\u003c/a\u003e\u003ca href=\"#cities-migration\"\u003eالمدن والهجرة والتوسع الحضري\u003c/a\u003e\u003ca href=\"#water-food-climate\"\u003eالماء والغذاء وتغيّر المناخ\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"education-women","n":"التعليم ونهضة المرأة","ic":"👩‍🎓","part":"الحاضر","h":"\u003carticle class=\"ch3\" id=\"education-women\" data-toc=\"التعليم ونهضة المرأة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالحاضر\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ١ من ٧\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٥\u003ci\u003e.\u003c/i\u003e١\u003c/span\u003e\n            \u003ch3\u003eالتعليم ونهضة المرأة\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eفي القرن العشرين تغيّر وجهان من أوجه المجتمع العربي تغيرًا عميقًا: التعليم الذي خرج من الكتاتيب إلى الجامعات، والمرأة التي خرجت من بيتها إلى المدرسة والمحكمة والبرلمان. وهما قصة نضالٍ طويل لا زال مستمرًا.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eعندما نزل الاستعمار في القرن التاسع عشر كانت الأمية هي القاعدة في العالم العربي؛ فنسبة القادرين على القراءة والكتابة لم تتجاوز أعدادًا قليلة في المدن الكبرى. وكان التعليم محصورًا في الكتاتيب وحلقات المساجد التي تُخرّج حافظين للقرآن لا قارئين للعصر. وبدأت النهضة التعليمية في ظل محمد علي في مصر والسلطان عبد الحميد في استانبول، فأنشئت المدارس الحديثة والمعاهد والبعوث إلى أوروبا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي القرن العشرين توسع التعليم انتشارًا واسعًا. فبعد الاستقلال جعلت الدول التعليم المجاني حقًا لكل مواطن، وفتحت الجامعات الأزهر والقاهرة وبغداد ودمشق وجامعة الدول العربية أبوابها للجميع. وقد تحولت الأمية من حالة عامة إلى ظاهرة محدودة في الأرياف والمناطق المهمشة خلال جيلين فقط. وقد أنشئت في هذه المرحلة الجامعات الوطنية في الجزائر والرباط والرياض وعمان، وصارت كل دولة عربية تملك جامعة أو أكثر تدرّب أبناءها بنفسها.\u003c/p\u003e\u003cp class=\"ap\"\u003eلكن التعليم بقي يواجه تحديين كبيرين: الاول هو الحفظ والاستظهار بدل التفكير النقدي، والثاني هو تباعد المناهج عن متطلبات سوق العمل. فرغم وجود ملايين الطلاب في الجامعات، بقيت نسبة البطالة بين الخريجين مرتفعة. ومع ذلك يبقى التعليم أقوى ما حققه العرب في العصر الحديث، لأنه سلاح التغيير الحقيقي في أي مجتمع. فكل ثورة علمية في التاريخ بدأت من مدرسة، وكل نهضةٍ حقيقيةٍ قامت على تعليم.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eمن الكتاتيب إلى الجامعات\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان النظام التعليمي التقليدي يقوم على الكتاتيب التي يتعلم فيها الطفل القرآن ومبادئ الحساب. وكانت الفتيات في معظم المناطق محرومات من هذا التعليم الأساسي، فلا يخرجن من البيت إلا لزواج. وبقيت الأمية بين النساء أعلى بكثير منها بين الرجال حتى منتصف القرن العشرين، وهو ما رسخ أنماطًا اجتماعيةً بقيت عقودًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوجاءت النهضة التعليمية في القرن التاسع عشر بإصلاحاتٍ كبيرة. فقد أنشأ محمد علي مدارس المهندسين والأطباء والترجمة، وأرسل البعوث إلى فرنسا وإيطاليا. وكذلك فعل العثمانيون بإصلاح التعليم وتأسيس جامعة استانبول. وهكذا انتقل التعليم من الحفظ إلى المنهج الحديث الذي يجمع بين العلوم واللغات والرياضيات.\u003c/p\u003e\u003cp class=\"ap\"\u003eوبعد الاستقلالات، صار التعليم المجاني حقًا دستوريًا في معظم الدول العربية. وارتفعت نسبة الملتحقين بالتعليم الأساسي إلى ما يقارب التسعين في المئة، وفتحت الجامعات أبوابها لطبقاتٍ لم يكن أحد يسمح لها بالتعليم العالي قبل ذلك. وقد أنتج هذا جيلًا جديدًا من الأطباء والمهندسين والمعلمين الذين بنوا دولهم.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالمرأة بين البيت والمجتمع\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت المرأة في أوائل القرن العشرين تعيش في نطاق ضيق: لا تعليم، ولا عمل، ولا رأي في الزواج أو الطلاق أو الرعاية. وكانت نسبة كبيرة من الزيجات تتم بمباركة الأهل دون موافقة الفتاة نفسها. لكن بدايات القرن العشرين شهدت أولى الصرخات النسوية التي دعت إلى تعليم المرأة وإخراجها من العزلة، وقادتها رواديات مثل هدى شعرهائي ولبنى شرف ونجيب العتومي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ناضلت المرأة العربية طويلًا من أجل حقوقها. فحصلت على التعليم في العشرينيات من القرن الماضي في مصر وسوريا والعراق وتونس، ثم على حق التصويت في الخمسينيات والستينيات. وانتقلت من التعليم إلى الوظائف: ممرضة ومعلمة وطبيبة ومحامية وقاضية ووزيرة. ودخلت البرلمان والجامعة والإعلام، وصارت طبقةً فاعلةً في المجتمع لم يعد أحد يستطيع تجاهلها.\u003c/p\u003e\u003cp class=\"ap\"\u003eومع ذلك بقيت عقبات كثيرة: قوانين الأحوال الشخصية التي تميّز في الميراث والزواج والطلاق، والعنف الأسري، والتقاليد التي تحد من حركتها وعملها. وقد اختلفت الدول العربية في سرعة الإصلاح؛ فتونس والمغرب تقدّما بقوانين أسرة حديثة، بينما بقيت دول أخرى عالقة في الجدل التقليدي. والمرأة العربية اليوم أقوى من أي وقت مضى، لكن طريقها إلى المساواة الكاملة ما زال طويلًا.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eتحديات التعليم في القرن الحادي والعشرين\u003c/h4\u003e\u003cp class=\"ap\"\u003eرغم كل هذا التقدم، يواجه التعليم العربي أزمة حقيقية في القرن الحادي والعشرين. فمناهج معظم الدول ما زالت تعتمد على الحفظ والاستظهار بدلًا من التفكير النقدي والإبداع. وتُصنف جامعات عربية قليلة في المراتب العالمية الأولى، بينما تهاجر العقول العربية إلى الخارج بحثًا عن بيئات علمية أفضل. وهذه هجرة العقول خسارة حقيقية للأمة.\u003c/p\u003e\u003cp class=\"ap\"\u003eكما أن الفجوة الرقمية بين المدن والأرياف وبين الطبقات الغنية والفقيرة تضيّق فرص التعليم الجيد. فقد أثبتت جائحة كورونا أن كثيرين من الطلاب العرب لا يملكون حاسوبًا ولا إنترنتًا جيدًا. وظلت التعليم عن بعد تجربةً صعبةً في مجتمعاتٍ تفتقر إلى البنية التحتية.\u003c/p\u003e\u003cp class=\"ap\"\u003eلكن هناك بصيص أمل: فعدد الجامعات والمعاهد المتخصصة في التكنولوجيا يتزايد، وشبابٌ عرب يفوزون في مسابققات البرمجة والابتكار العالمية. ومشاريع مثل التعليم الإلكتروني والتعليم المدمج بدأت تثبت أن المنطقة قادرة على تجديد نفسها إذا ما قررت ذلك بصدق. فالجيل القادم هو الذي سيقرر مستقبل هذا التعليم لا الجيل الذي سبقه.\u003
