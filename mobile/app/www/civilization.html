الإرث الحضاري\u003c/span\u003e\n      \u003cspan class=\"tcnt\"\u003e٤ فصول\u003c/span\u003e\u003c/a\u003e\n    \u003c/li\u003e\u003c/ol\u003e\n  \u003c/div\u003e"},{"u":"p","one":true,"id":"part-1","n":"القسم الأول: العلوم","ic":"🔬","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-1\" style=\"--c:#6A3D9A\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🔬\u003c/div\u003e\n      \u003ch2\u003eالقسم الأول: العلوم\u003c/h2\u003e\n      \u003cp\u003eلم تكن حضارة المسلمين حضارة نقلٍ فقط، بل حضارة سؤالٍ وقياسٍ وتجربة. هذا القسم يقرأ الطب والفلك والرياضيات والكيمياء، ثم يقرأ المؤسسة التي احتوتها: البيمارستان، والمنهج الذي حكمها: الشك والملاحظة.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#medicine\"\u003eالطب والأطباء\u003c/a\u003e\u003ca href=\"#math-astronomy\"\u003eالرياضيات والفلك\u003c/a\u003e\u003ca href=\"#chemistry-physics\"\u003eالكيمياء والفيزياء\u003c/a\u003e\u003ca href=\"#hospitals-method\"\u003eالبيمارستان والمنهج\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"medicine","n":"الطب والأطباء","ic":"🏥","part":"القسم الأول: العلوم","h":"\u003carticle class=\"ch3\" id=\"medicine\" data-toc=\"الطب والأطباء\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الأول: العلوم\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ١ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e١\u003ci\u003e.\u003c/i\u003e١\u003c/span\u003e\n            \u003ch3\u003eالطب والأطباء\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eمن الرازي إلى ابن النفيس: كيف تحوّل الطب من ترجمةٍ لليونان إلى علمٍ له مستشفياته وسجلاته وأدويته المجرَّبة؟ هذا الفصل يقرأ ستة قرونٍ من العمل الطبي.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eبدأ الطب الإسلامي بالترجمة، لكنه لم يتوقف عندها. ففي القرن الثاني الهجري نُقلت كتب أبقراط وجالينوس إلى العربية، ونُقلت معها كتبٌ فارسية وهندية في الأدوية والسموم. وكان المترجمون أطباء في الغالب، مثل حنين بن إسحاق الذي ترجم وألّف وصحّح، فلم يكن النقل حرفيًّا بل كان مراجعةً وتقويمًا. ومن هذه الطبقة الأولى خرج جيلٌ لم يكتفِ بالشرح بل بدأ يسأل: هل ما قاله جالينوس صحيحٌ دائمًا؟\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان الرازي (توفي سنة ٣١٣هـ) هو أول من حوّل هذا السؤال إلى منهج. فقد كان يرى المريض، ويسجّل الأعراض، ويقارن بين الحالات، ثم يستنتج. وكتابه في الجدري والحصبة من أدق ما كُتب في وصف المرضين سريريًّا، حتى إن وصفه للمراحل والعلامات الفارقة بينهما ظلّ يُستشهد به قرونًا. وقد قيل إنه اختار موضعًا لبناء المستشفى في بغداد بتعليق قطع لحمٍ في أماكن مختلفة ورصد أسرعها فسادًا، وهي حكايةٌ تُروى كثيرًا، وأصلها غير مؤكد، لكنها تعبّر عن روحٍ تجريبية كانت حاضرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما ابن سينا (توفي سنة ٤٢٨هـ) فكان مشروعًا مختلفًا: أن يجمع الطب كله في نظامٍ منطقي. فكتب «القانون في الطب» في خمسة كتب: الكليات، والأدوية المفردة، والأمراض الجزئية، والأمراض التي لا تُحصر في عضو، والأدوية المركّبة. وقد كان الكتاب منهجًا دراسيًّا أكثر منه معجمًا، ولهذا صار المرجع الأول في مدارس الطب من بخارى إلى مونبلييه، ودُرّس في أوروبا حتى القرن السابع عشر الميلادي. ولم يكن ابن سينا طبيبًا تجريبيًّا بقدر ما كان منظّرًا، وهذا سبب قوّته وضعفه في الوقت نفسه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي الجراحة كان الزهراوي (توفي نحو ٤٠٤هـ) هو المؤسس الحقيقي. فقد كتب «التصريف لمن عجز عن التأليف» وفيه قسمٌ كامل في الجراحة، وصف فيه العمليات والأدوات التي اخترعها بنفسه: آلات لرتق الجروح، ومشارط، ومكاوي، وأدوات للتوليد. وكان يحذّر من الجراحة بلا ضرورة، ويشدّد على التشريح والمعرفة قبل الإقدام. وقد بقي كتابه مرجعًا في أوروبا قرونًا، وتُرجم إلى اللاتينية، وكانت أدواته تُرسم في كتب الجراحين الأوروبيين كما هي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما اكتشاف الدورة الدموية الصغرى فمرتبط باسم ابن النفيس (توفي سنة ٦٨٧هـ). فقد لاحظ في شرحه على تشريح القانون لابن سينا أن الدم لا ينتقل من البطين الأيمن إلى الأيسر عبر الحاجز كما كان يُظن، بل يمرّ بالرئتين. وكان هذا اعتراضًا على جالينوس نفسه، وهو اعتراضٌ جسور في زمانه، وقد بقي مجهولًا في أوروبا حتى قُرنٍ متأخر. والمهم فيه ليس النتيجة فقط، بل المنهج: أن يشكّ طبيبٌ في نصٍّ معتمد لأن التشريح لا يوافقه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان الطب في هذه الحضارة مرتبطًا بالصيدلة ارتباطًا وثيقًا. فقد تطوّرت معرفة الأدوية المفردة والمركّبة، وظهرت كتبٌ مثل «الجامع في المفردات» لابن البيطار، وصف فيه مئات النباتات والمعادن ومواضعها وأسمائها بلغات مختلفة. وكان الصيدلي يُسمّى «العطّار» أو «الصيدلاني»، وله دكّانه وقواعد في الوزن والخلط وحفظ الدواء. وقد ربطت الحضارة بين الطب النظري والمواد العملية، وهذا ما جعل العلاج ممكنًا لا مجرّد كلامٍ عن الأمراض.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان للطب مكانةٌ اجتماعية عالية، لكنها لم تكن بلا رقابة. فمنذ القرن الرابع الهجري ظهر نظام «امتحان الأطباء»: أن يُختبر الطبيب أمام رئيس الأطباء أو المحتسب قبل أن يُسمح له بالعمل. وقد صدرت أوامر في بغداد بمنع من لا يعرف الطب من الممارسة، وسُجّلت أسماء الممارسين في دفاتر. وكان هذا أول تنظيمٍ للمهنة في التاريخ الوسيط، وهدفه حماية الناس من الدجالين، وإن كان تطبيقه متفاوتًا بين مدينةٍ وأخرى.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان الطب العربي في العصور المتأخرة يتراجع في بعض المراكز ويتقدّم في غيرها. ففي الأندلس كان ابن رشد يكتب «الكليات» في الطب، وفي مصر كان ابن النفيس يشرّح، وفي الشام كانت المستشفيات تُدار بأوقافٍ كبيرة. لكن بعد القرن الثامن الهجري بدأ الجمود: صار التعليم شرحًا للمتون لا بحثًا، وقلّت التشريح، وتوقّف الابتكار. ومع ذلك بقيت المؤسسة تعمل، وبقي الأطباء يمارسون، وبقي الناس يُعالجون، لأن العلم لا يموت دفعةً واحدة بل يذوي ببطء.\u003c/p\u003e\u003cp class=\"ap\"\u003eوإذا أردنا أن نُقيّم هذا الإرث بصدق، فلا يصحّ أن نقول إن المسلمين اخترعوا الطب الحديث، ولا يصحّ أن نقول إنهم مجرّد ناقلين. الصحيح أنهم جمعوا تراثًا ثلاثيًا — يوناني وفارسي وهندي — ثم أضافوا إليه منهجًا في الملاحظة، ومؤسسةً في الرعاية، وتنظيمًا في المهنة، وتصنيفًا في الأدوية. وهذه الإضافات هي التي جعلت الطب في العالم الإسلامي علمًا حيًّا لا مجرّد مكتبةٍ مترجمة.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالرازي: الطبيب الذي شكّ\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الرازي طبيبًا عمليًّا أكثر من كونه مؤلفًا نظريًّا، وقد ترك في الطب ما يشبه المدرسة: أن تبدأ من الحالة لا من الكتاب. وكان يكتب ملاحظاته عن مرضى المستشفى، ويسجّل ما نجح وما فشل، ويعود إلى النص القديم ليسأله لا ليتبعه. ولهذا صار كتابه «الحاوي في الطب» مجموعةً من تجاربه وملاحظاته أكثر من كونه شرحًا لجالينوس.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالأهم أن الرازي كان يقول صراحةً إن من رأى حالةً تخالف ما في الكتب فعليه أن يثق بما رأى. وهذه الجملة، على بساطتها، هي الفارق بين علمٍ يتراكم وعلمٍ يُعاد نسخه. ولهذا يعدّه كثير من مؤرخي العلم أول من وضع بذور المنهج السريري في الطب الإسلامي. ومن هنا جاء لقبه في بعض المصادر القديمة: «طبيبٌ لا يُسلّم»، أي أنه لا يُسلّم للقول السابق بلا دليل. وقد كان هذا اللقب مدحًا في زمانه، وصار بعده منهجًا.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالقانون: لماذا دام ألف سنة؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eلا يمكن فهم شهرة «القانون» بلا فهم وظيفته التعليمية. فابن سينا لم يكتب كتابًا للطبيب الممارس بل كتابًا للطالب: يبدأ بالكليات، ثم ينتقل إلى الأدوية، ثم إلى الأمراض، ثم إلى ما لا يختص بعضو. وهذا الترتيب المنطقي جعله سهل التدريس، وسهل الاختبار، وسهل الحفظ.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد دام الكتاب في أوروبا لأن الجامعات كانت تحتاج مرجعًا منظمًا لا مجموعةَ ملاحظات. وهذا يبيّن أن نجاح الكتاب ليس دليلًا على صحّة كل ما فيه، بل دليل على قدرته على التنظيم. وقد انتقده الأطباء لاحقًا في مواضع كثيرة، لكن أحدًا لم يستطع أن يستغني عنه حتى ظهر التشريح الحديث.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالتشريح: الحدّ الذي لم يُعبر\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان التشريح هو الحدّ الأصعب. فالمجتمع كان يتحرّج من تشريح جسد الإنسان، وكان الأطباء يعتمدون على تشريح الحيوان وعلى نصوص جالينوس. ولهذا بقيت أخطاء جالينوس تتكرر قرونًا: في عظام الفك، وفي تجاويف القلب، وفي مسار الدم. وكانت الحيلة أن يُشرَّح القرد أو الخنزير ثم يُقاس على الإنسان، وهذا خطأ منهجي كبير، لأن التشريح المقارن لا يُغني عن التشريح البشري في تفاصيل كثيرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوابن النفيس كان استثناءً لأنه اعتمد على الملاحظة والتشريح، ولأنه كان يقرأ النص بعينٍ ناقدة. لكن استثناءه يبيّن القاعدة: أن التشريح لم يكن مؤسسةً في التعليم، بل اجتهادًا فرديًّا. ولهذا لم تتحوّل ملاحظته إلى مدرسة، وبقيت مكتوبةً في هامش شرحٍ لا في كتابٍ يُدرَّس.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالحاوي\u003c/b\u003e\u003cspan\u003eموسوعة الرازي الطبية، بُنيت على ملاحظاته السريرية لا على الشرح\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالقانون\u003c/b\u003e\u003cspan\u003eخمسة كتب نظّم بها ابن سينا الطب، ودُرّست في أوروبا حتى القرن السابع عشر\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالتصريف\u003c/b\u003e\u003cspan\u003eكتاب الزهراوي في الجراحة وأدواتها، تُرجم ودرس في أوروبا\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالدورة الصغرى\u003c/b\u003e\u003cspan\u003eابن النفيس يصحّح جالينوس في مسار الدم عبر الرئتين\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالطبيب\u003c/th\u003e\u003cth\u003eالمجال\u003c/th\u003e\u003cth\u003eأثره\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالرازي\u003c/td\u003e\u003ctd\u003eالطب السريري والأمراض المعدية\u003c/td\u003e\u003ctd\u003eوصفٌ دقيق للجدري والحصبة ومنهجٌ في الملاحظة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eابن سينا\u003c/td\u003e\u003ctd\u003eالتنظيم والتصنيف\u003c/td\u003e\u003ctd\u003eالقانون مرجعٌ دراسي في الشرق والغرب\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالزهراوي\u003c/td\u003e\u003ctd\u003eالجراحة والأدوات\u003c/td\u003e\u003ctd\u003eأدواتٌ وصفها ورسمها الجراحون بعده\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eابن النفيس\u003c/td\u003e\u003ctd\u003eالتشريح ووظائف الأعضاء\u003c/td\u003e\u003ctd\u003eتصحيح مسار الدم بين القلب والرئتين\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eابن البيطار\u003c/td\u003e\u003ctd\u003eالأدوية المفردة\u003c/td\u003e\u003ctd\u003eتصنيفٌ نباتي ودوائي بأسماءٍ متعددة اللغات\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003e«إذا خالف القول ما نراه في المرضى فالحقّ مع ما نراه، لا مع ما قاله القدماء»\u003c/p\u003e\u003ccite\u003eخلاصة ما يكرره الرازي في مقدمات كتبه الطبية\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eبدأ الطب بالترجمة ثم صار علمًا له منهج. الرازي علّم الأطباء أن يبدأوا من الحالة لا من الكتاب، وابن سينا نظّم المعرفة في قانون دام قرونًا، والزهراوي أسّس الجراحة وأدواتها، وابن النفيس شكّ في جالينوس فصحّحه. وقد ربطت الصيدلة بين النظرية والعلاج، ونظّم الامتحان المهنة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"math-astronomy","n":"الرياضيات والفلك","ic":"🔭","part":"القسم الأول: العلوم","h":"\u003carticle class=\"ch3\" id=\"math-astronomy\" data-toc=\"الرياضيات والفلك\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الأول: العلوم\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٢ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e١\u003ci\u003e.\u003c/i\u003e٢\u003c/span\u003e\n            \u003ch3\u003eالرياضيات والفلك\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eمن الجبر إلى الزيج، ومن الإسطرلاب إلى المراصد: كيف بنى علماء المسلمين لغةً رياضية للعالم، ثم قاسوا بها الأرض والسماء؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكانت الرياضيات في الحضارة الإسلامية هي اللغة التي جعلت العلوم ممكنة. فالفلك يحتاجها، والمواريث تحتاجها، والمساحة تحتاجها، والتجارة تحتاجها، وأوقات الصلاة والقبلة تحتاجانها. ولهذا لم تكن الرياضيات علمًا نخبويًّا في هذه الحضارة، بل كانت علمًا نافعًا يُدرَّس لأن الدولة والمجتمع يحتاجانه كل يوم. وهذا هو الفارق بين علمٍ يُكتب للفخر وعلمٍ يُكتب للعمل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأهم تحوّل في تاريخ الرياضيات ارتبط باسم الخوارزمي (توفي نحو ٢٣٢هـ). ففي كتابه «الجبر والمقابلة» قدّم منهجًا لحلّ المعادلات بخطواتٍ مرتبة: نقل الحدود، والموازنة بين الطرفين، والاختزال. ولم يكن الكتاب في نظر مؤلفه بحثًا نظريًّا بل كتابًا عمليًّا في المواريث والوصايا والمساحة والتجارة، وهذا ما جعله ينتشر. ومن اسمه اشتُقّ في اللاتينية مصطلح «الخوارزمية»، أي طريقة الحساب المنظمة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد انتقلت الأرقام الهندية إلى العالم الإسلامي ثم إلى أوروبا، ومعها الصفر والنظام الموضعي للقيمة العددية. وهذه ليست تفصيلًا تقنيًّا بل ثورة: فالحساب بالحروف أو بالعداد كان بطيئًا ومحدودًا، أما الحساب بالأرقام العشرية فصار سريعًا وقابلًا للتوسع. وقد كتب الخوارزمي في هذا أيضًا، فصار كتابه في الحساب أحد أهم الكتب التي غيّرت طريقة حساب البشر، لا في الشرق فقط بل في العالم كله.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما الفلك فقد كان أكبر مشروع علمي في هذه الحضارة. وكان دافعه دينيًّا في الأساس: تحديد أوقات الصلوات، واتجاه القبلة، ورؤية الهلال، وحساب التقويم. ثم صار دافعه معرفيًّا: فهم حركة الكواكب وتفسير الظواهر. وقد بُنيت المراصد، وصُنعت الإسطرلابات، وكُتبت الأزياج، وهي جداول فلكية دقيقة تُحسب بها مواضع الأجرام. وكان زيادتها ودقّتها معيار تقدّم كل مرصد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان البتاني (توفي نحو ٣١٧هـ) من أدقّ من عمل في هذا الميدان، فقد صحّح أرصاد بطليموس في مواضع كثيرة، وحسب طول السنة الشمسية بدقة عالية، ووصف حركة الشمس والقمر وصفًا رياضيًّا دقيقًا. وكان عمله كله قائمًا على الرصد المتكرر لا على قبول النص، وهذا هو الفرق بين عالمٍ ينسخ وعالمٍ يقيس. وقد ظلّت جداوله تُستعمل في الأندلس والمغرب قرونًا، ونُقلت إلى اللاتينية في القرن السادس الهجري، فصارت أحد الأعمدة التي بُني عليها فلك أوروبا في العصور الوسطى.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما البيروني (توفي سنة ٤٤٠هـ) فهو أعجب شخصية علمية في هذا التاريخ. فقد قاس محيط الأرض بطريقة هندسية من قمة جبل، فخرج برقمٍ قريب جدًّا من الرقم الصحيح، وقاس الكثافة النوعية لعددٍ من المعادن والأحجار، وكتب عن الهند كتابًا يُعدّ من أوائل الدراسات المقارنة في الأديان والعادات. وكان يقول إن العلم لا يُبنى على الثقة بالأقوال بل على التجربة والقياس، وهذا كلامٌ يسبق زمانه بقرون.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي القرن الرابع الهجري تطوّرت المراصد إلى مؤسسات. فقد أُنشئ مرصدٌ في بغداد في عهد شرف الدولة، وعمل فيه ابن سينا وأبو الريحان وغيرهما، ورُصد فيه ما لم يُرصد من قبل. ثم جاء مرصد مراغة في القرن السابع الهجري بقيادة نصير الدين الطوسي، وكان مشروعًا ضخمًا فيه بنايات وأدوات وفريقٌ دائم، وأخرج «الزيج الإلخاني». ثم جاء مرصد سمرقند في القرن التاسع بقيادة ألغ بك، وأخرج زيحًا بلغت دقته حدًّا لم يُتجاوز قرونًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت هذه المراصد تعمل كمنظومة: رصد، ثم تسجيل، ثم جدولة، ثم مقارنة، ثم تصحيح. وهذا العمل الجماعي هو ما ميّز الفلك الإسلامي عن عمل الفلكي الفرد. فبطليموس كان رجلًا واحدًا، أما مراغة فكانت مؤسسة فيها عشرات العاملين والأدوات والتمويل. وهذا الانتقال من الفرد إلى المؤسسة هو أحد أهم ما قدّمته الحضارة الإسلامية للعلم. وهذا يعني أن الإنجاز العلمي في هذه الحضارة كان في أحيانٍ كثيرة إنجازًا جماعيًّا لا فرديًّا، وأن اسم المدير لم يكن سوى قمة جبلٍ من العمل المتراكم تحته.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد انتقل هذا الفلك إلى أوروبا بطرقٍ مختلفة، وأشهرها ما يقال عن تأثير نماذج ابن الشاطر ومرصد مراغة في أعمال كوبرنيكوس. وقد اختلف المؤرخون في درجة هذا التأثير: بعضهم يرى أن كوبرنيكوس وصل إلى نماذجه باستقلال، وبعضهم يرى أن المخطوطات كانت متاحةً في إيطاليا وأوروبا في زمانه. والأرجح أن التأثير كان حقيقيًّا في الأدوات والجداول والملاحظات، أما الانقلاب الكبير — أن تكون الشمس في المركز — فهو إسهامٌ أوروبي أصيل، ولا يصحّ أن يُنسب لغيره.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالجبر: كيف وُلدت لغة المعادلات؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eقبل الجبر كان الحساب يعمل بالأعداد المحسوسة: كم درهمًا، وكم ذراعًا، وكم يومًا. والجبر جاء ليعمل بالمجهول: أن نضع رمزًا لما لا نعرفه، ثم نعمل عليه كما نعمل على المعلوم. وهذه الخطوة هي التي فتحت بابًا لم يكن مفتوحًا: أن تُحلّ مسائل لم تُذكر فيها الأعداد صريحة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت بداية الخوارزمي متواضعة في الشكل: معادلات من الدرجة الأولى والثانية، وحلولٌ هندسية تُرسم بالمسطرة والفرجار. لكن الأثر تراكم: جاء من بعده من وسّع الدرجات، ومن وضع قواعد الجذور، ومن أدخل الصفر في المعادلات. وهكذا صار الجبر لغةً كاملة، لا مجموعة قواعد.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eقياس الأرض: البيروني على قمة جبل\u003c/h4\u003e\u003cp class=\"ap\"\u003eطريقة البيروني في قياس محيط الأرض تعتمد على زاويتين ومثلث: ينظر إلى الأفق من قمة جبل فيقيس زاوية انخفاضه، ثم يقيس ارتفاع الجبل، ثم يستخرج نصف قطر الأرض. وقد أعطته هذه الطريقة رقمًا قريبًا من الرقم الحديث بفارقٍ لا يكاد يذكر، وهذا في زمانٍ لا توجد فيه أرصاد فضائية ولا أدوات دقيقة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأهم من الرقم هو المنهج: أن يُقاس شيءٌ لا يمكن الإحاطة به بأدواتٍ صغيرة. وقد قال البيروني إن الأرض كروية بناءً على أدلةٍ حسّية وهندسية، لا على تقليد. وهذا هو العلم في أصفى صوره: أن تُبنى النتيجة من الملاحظة والرياضيات، لا من الشهرة ولا من النص. وقد كان البيروني شديد الحذر في التمييز بين ما رصده وما نقله، وكتب في مقدمات كتبه ما يشبه قائمةً بأخطاء من سبقه، وهذا في ذاته عملٌ علمي نادر في زمانه.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالمرصد كمؤسسة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان المرصد في مراغة وسمرقند أشبه بمركز بحثٍ حديث: بناياتٌ مخصّصة، وأدواتٌ كبيرة، ورواتب للعاملين، ودفاتر أرصاد، وأوقاتٌ محددة للعمل. وكان يُدار بوقفٍ أو بتمويلٍ من السلطان، ويعمل فيه فريقٌ من الراصدين والحاسبين وصانعي الأدوات. وكانت الأدوات نفسها تُصنع في ورشةٍ ملحقة بالمرصد، لأن دقة الرصد تعتمد على دقة الآلة أكثر من اعتمادها على مهارة الراصد، وهذا إدراكٌ هندسي متقدّم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوهذا الشكل المؤسسي هو ما جعل الأرصاد تتراكم. فالفلكي الفرد يرصد سنواتٍ ثم يموت، أما المرصد فيُرصد فيه كل ليلة، وتُجمع البيانات، وتُقارن، وتُصحّح. وهذا يبيّن أن العلم يحتاج مؤسسةً بقدر ما يحتاج عبقريًّا، وأن الحضارة التي تبني مرصدًا تُنتج علمًا أكثر من الحضارة التي تُنتج عباقرة فقط.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالخوارزمي\u003c/b\u003e\u003cspan\u003eالجبر والمقابلة، ومن اسمه اشتُقّ مصطلح الخوارزمية\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالصفر والأرقام\u003c/b\u003e\u003cspan\u003eنظامٌ عشري انتقل إلى أوروبا وغيّر طريقة حساب البشر\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالبيروني\u003c/b\u003e\u003cspan\u003eقياس محيط الأرض من قمة جبل بدقةٍ تقارب الحديث\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمرصد مراغة\u003c/b\u003e\u003cspan\u003eأول مرصدٍ مؤسسي بفريقٍ وأدواتٍ وزيجٍ شامل\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالعالم\u003c/th\u003e\u003cth\u003eالإسهام\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالخوارزمي\u003c/td\u003e\u003ctd\u003eالجبر والحساب العشري\u003c/td\u003e\u003ctd\u003eلغة المعادلات ونظام الأرقام\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالبتاني\u003c/td\u003e\u003ctd\u003eأرصاد الشمس والقمر\u003c/td\u003e\u003ctd\u003eتصحيح بطليموس وحساب السنة بدقة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالبيروني\u003c/td\u003e\u003ctd\u003eقياس الأرض والكثافة النوعية\u003c/td\u003e\u003ctd\u003eمنهجٌ قياسي في الجغرافيا والفيزياء\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eنصير الدين الطوسي\u003c/td\u003e\u003ctd\u003eمرصد مراغة والزيج الإلخاني\u003c/td\u003e\u003ctd\u003eفلكٌ مؤسسي بجداول دقيقة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eألغ بك\u003c/td\u003e\u003ctd\u003eمرصد سمرقند\u003c/td\u003e\u003ctd\u003eزيج بلغت دقته حدًّا لم يُتجاوز قرونًا\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003e«العلم لا يُدرك بالتقليد، وإنما يُدرك بالحسّ والعقل معًا»\u003c/p\u003e\u003ccite\u003eمن منهج البيروني في مقدمة آثاره\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eالرياضيات كانت لغة الحضارة: الجبر عند الخوارزمي، والأرقام العشرية، والحساب العملي. والفلك كان أكبر مشروعٍ علمي فيها، بدأ من حاجة الصلاة والقبلة ثم صار بحثًا في حركة الأجرام. وقد انتقل العلم من الفرد إلى المؤسسة في مراغة وسمرقند، وهذا الانتقال هو أهم ما قدّمته هذه الحضارة للعلم.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"chemistry-physics","n":"الكيمياء والفيزياء","ic":"⚗️","part":"القسم الأول: العلوم","h":"\u003carticle class=\"ch3\" id=\"chemistry-physics\" data-toc=\"الكيمياء والفيزياء\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الأول: العلوم\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٣ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e١\u003ci\u003e.\u003c/i\u003e٣\u003c/span\u003e\n            \u003ch3\u003eالكيمياء والفيزياء\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eمن التكليس والتقطير إلى غرفةٍ مظلمة تُفسّر الإبصار: كيف انتقلت الكيمياء من السحر إلى المختبر، والبصريات من الفلسفة إلى القياس؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eالكيمياء في الحضارة الإسلامية بدأت من سؤالٍ قديم: ما جوهر المواد؟ وهل يمكن تحويل بعضها إلى بعض؟ وكان هذا السؤال مزيجًا من الفلسفة والصنعة والسحر. وكان الخيميائي يعمل في مختبره على التسخين والتبخير والتقطير والتبلير، ويحفظ أسراره برموزٍ غامضة. ومن هذا العالم الغامض خرج علمٌ آخر: أن تُوصف العمليات وصفًا يمكن تكراره، وأن تُوزن المواد، وأن تُسجّل النتائج.\u003c/p\u003e\u003cp class=\"ap\"\u003eوارتبط هذا التحول باسم جابر بن حيان (القرن الثاني الهجري)، وقد نُسبت إليه مصنفاتٌ كثيرة يصعب التحقق من صحة نسبتها كلها، وهذا أمرٌ يعرفه الباحثون. لكن المؤكد أن المدرسة الجابرية أدخلت في الكيمياء أفكارًا جديدة: أن المادة تتكوّن من عناصر تُخلط بنسبٍ معينة، وأن التجربة هي الطريق، وأن الوزن مقياسٌ أساسي. وقد كان لهذه الأفكار أثرٌ في الكيمياء لاحقًا حتى عند من رفض نظريتها عن العناصر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما الرازي فقد أعطى الكيمياء شكلها العملي. فكتابه «الأسرار» يقسّم المواد إلى أقسام، ويصف الأدوات والأجهزة، ويشرح العمليات خطوةً بخطوة: التقطير، والتكليس، والتصعيد، والترشيح، والتبلير. وهذا التنظيم هو ما جعل الكيمياء قابلةً للتعليم والتكرار، لا فنًّا فرديًّا يعتمد على موهبة صاحبه. وقد انتقل هذا الكتاب إلى اللاتينية وبقي مرجعًا في المختبرات قرونًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان الكيميائيون المسلمون قد اكتشفوا موادّ ما زالت تُستعمل إلى اليوم: الكحول من التقطير، والقلويات من الرماد، والأحماض المعدنية، ومركّبات الزئبق، وأملاح الفضة. ولم تكن هذه الاكتشافات نتيجة صدفة بل نتيجة تجربةٍ منظمة: أن يُسخَّن شيء، ويُقطَّر، ويُوزن، ويُوصف. وهذا هو الفرق الجوهري بين الخيمياء القديمة والكيمياء العملية. ومن هذه المواد جاءت صناعاتٌ كاملة: الصابون من القلويات، والعطور من التقطير، والزجاج الملوّن من أكاسيد المعادن، والورق من معالجة الألياف. أي أن الكيمياء خرجت من المختبر إلى السوق.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما الفيزياء فكانت في البداية جزءًا من الفلسفة، حتى جاء ابن الهيثم (توفي نحو ٤٣٠هـ) فحوّلها إلى علمٍ رياضي تجريبي. فكتابه «المناظر» ليس كتاب فلسفةٍ في الإبصار بل كتاب هندسةٍ للضوء: كيف ينتقل الشعاع، وكيف ينعكس، وكيف ينكسر، وكيف تتكوّن الصورة. وقد استعمل فيه غرفةً مظلمة وأجسامًا مضيئة، وقياسًا للزوايا، واستنتاجًا رياضيًّا، فأثبت أن الإبصار يحدث بدخول الضوء إلى العين لا بخروج شعاعٍ منها كما كان يُظن.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت تجربة الغرفة المظلمة هي النموذج. فابن الهيثم لاحظ أن الضوء إذا دخل من ثقبٍ صغير في جدارٍ مظلم رسم صورةً مقلوبة للشيء الخارجي على الجدار المقابل. ومن هذه الملاحظة البسيطة بنى نظريةً كاملة في الإبصار والانعكاس والانكسار. وهذا هو المنهج الذي سيُسمّى لاحقًا «المنهج التجريبي»: أن تُلاحظ، ثم تفترض، ثم تختبر، ثم تُعمّم. وقد صاغ ابن الهيثم هذا المنهج في مقدمة كتابه صياغةً صريحة، فذكر أنه يبدأ بفحص المبصرات، ثم يستخرج القوانين، ثم يختبر النتائج، وهذه خطواتٌ أربع تُشبه ما نسمّيه اليوم «المنهج العلمي».\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان للفيزياء التطبيقية حضورٌ قويّ في هذه الحضارة. فبنو موسى كتبوا في «الحيل» ووصفوا آلاتٍ ميكانيكية، والجزري كتب «الجامع بين العلم والعمل النافع في صناعة الحيل» ووصف فيه ساعاتٍ مائية وآلاتٍ ذاتية الحركة ومضخّات. وكانت هذه الآلات تُبنى وتُجرَّب وتُعدَّل، فكانت الفيزياء تُمارَس في الورشة كما تُمارَس في الكتاب. وهذا الربط بين النظرية والصنعة هو ما جعل الحضارة الإسلامية قادرة على بناء ما تصفه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان للبصريات أثرٌ خاص في أوروبا. فكتاب «المناظر» تُرجم إلى اللاتينية، ودرسه روجر باكون، وأثّر في كبلر الذي وصل إلى قوانين الصورة والعدسة. ومعظم ما نسمّيه اليوم «البصريات الهندسية» قد وُضع أساسه في ذلك الكتاب: الشعاع، والسطح، والزاوية، والصورة، والانعكاس، والانكسار. وهذه ليست مبالغةً في تقدير الحضارة، بل وصفٌ لما تقوله المخطوطات والمقارنات.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالمفارقة أن هذا العلم لم يستمر في العالم الإسلامي بالوتيرة نفسها. فبعد القرن الثامن الهجري قلّ الاهتمام بالفيزياء والكيمياء، وصار التعليم يركّز على الفقه واللغة، وقلّ تمويل المراصد والمختبرات. وفي الوقت نفسه بدأت أوروبا تبني جامعاتها ومختبراتها على هذه النصوص. وهكذا انتقل مركز العلم لا لأنه هُزم بل لأنه تُرك، وهذا درسٌ في أن الحضارة لا تحتفظ بمكانتها بالذاكرة بل بالعمل المستمر.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eمن الخيمياء إلى الكيمياء\u003c/h4\u003e\u003cp class=\"ap\"\u003eالفارق بين الخيمياء والكيمياء ليس في المواد بل في المنهج. فالخيميائي يبحث عن الحجر الذي يُحوّل المعدن، ويحفظ عمله سرًّا، ويفسّر فشله بخطأٍ في الطلاسم. والكيميائي يبحث عن قانون التحول، وينشر عمله، ويفسّر فشله بخطأٍ في التجربة. وهذا التحول حدث في الحضارة الإسلامية ببطء، لكنه حدث.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ساعد على ذلك أمرٌ عملي: أن الصيدلة كانت تحتاج موادّ نقية، وأن الصناعات كانت تحتاج معادن مخلوطة، وأن الطب كان يحتاج أدويةً مقننة. فدفعت الحاجة العملية الكيمياء إلى الدقة. وهذا يبيّن أن العلم لا يتقدّم بالفضول وحده، بل بالحاجة أيضًا. وهكذا فإن الحرفة سبقت العلم في كثير من الأحيان: أن يعمل الصانع بيده، ثم يأتي من يُنظّر لما عمله، فيتحوّل العمل إلى قاعدة. وهذا مسارٌ معروف في تاريخ كل العلوم التطبيقية.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eابن الهيثم: كيف نرى؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eالسؤال الذي أجاب عنه ابن الهيثم كان مطروحًا منذ اليونان: هل يخرج من العين شعاعٌ يلمس الأشياء، أم يدخل الضوء إلى العين؟ وكان الرأي السائد هو الأول، وهو رأيٌ يقود إلى نتائج لا تُفسّر: كيف نرى الشيء البعيد فجأة، وكيف لا نرى في الظلام؟ وكان الرأي الأول يفسّر الرؤية باللمس، وهو تفسيرٌ لا يصمد أمام سؤالٍ بسيط: كيف نرى الشمس وهي بعيدةٌ إلى هذا الحد؟ وكان لا بد من تفسيرٍ آخر يبدأ من الضوء لا من العين.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد حسم ابن الهيثم السؤال بالتجربة: غرفةٌ مظلمة، ثقبٌ صغير، صورةٌ مقلوبة على الجدار. ثم بنى على ذلك نظريةً كاملة في الانعكاس والانكسار. وهذا هو معنى أن تكون عالمًا: أن تُحوّل سؤالًا فلسفيًّا إلى تجربةٍ قابلة للتكرار، ثم إلى رياضياتٍ تُحسب. وقد كان ابن الهيثم يكتب نتائجه بلغةٍ رياضية صارمة، ويحسب الزوايا بدقة، ويُجرّب على موادّ مختلفة: الماء، والزجاج، والهواء. وهذا تنويعٌ في التجربة يسبق فكرة «الضبط» في العلوم الحديثة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالآلات: فيزياء الورشة\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم تكن الفيزياء في هذه الحضارة نظريةً مجرّدة، بل كانت تُبنى في الورش. والجزري في كتابه عن الحيل وصف ساعاتٍ مائية تعمل بفعل الأثقال والعوامات، وآلاتٍ لرفع الماء، ونوافير تتبدّل أشكالها، وأبوابًا تُفتح بآلية. وكان يشرح كل آلةٍ برسمٍ وأجزاءٍ وطريقة تركيب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوهذه الكتب تدلّ على أن في هذه الحضارة معرفةٌ بالميكانيكا العملية: الروافع، والتوازن، وضغط الماء، والتروس. ولم تكن هذه المعرفة في الجامعات بل في دواوين الصناعة والورش، وهذا يبيّن أن العلم كان موزّعًا في المجتمع لا محصورًا في طبقةٍ واحدة. وقد كان في المدن الإسلامية نظامٌ للصناعات المرتبطة بالدولة: دور صناعة السفن، ومعامل الورق، ودور سكّ النقود، ومعامل النسيج. وفي هذه الدور تطوّرت معرفةٌ عملية بالمعادن والوقود والحركة.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eكتاب الأسرار\u003c/b\u003e\u003cspan\u003eالرازي يقسّم مواد الكيمياء وعملياتها وأدواتها بشكلٍ قابل للتعليم\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالكحول والقلويات\u003c/b\u003e\u003cspan\u003eموادٌ اكتُشفت بالتقطير والرماد، وما زالت تُستعمل بأسمائها العربية\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمناظر ١٠٢١م\u003c/b\u003e\u003cspan\u003eابن الهيثم يؤسس البصريات الهندسية ويصحّح نظرية الإبصار\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالجزري\u003c/b\u003e\u003cspan\u003eآلاتٌ ميكانيكية موصوفة بالرسم والتركيب، فيزياء الورشة\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالعالم\u003c/th\u003e\u003cth\u003eالمجال\u003c/th\u003e\u003cth\u003eالإسهام\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eجابر بن حيان\u003c/td\u003e\u003ctd\u003eالكيمياء\u003c/td\u003e\u003ctd\u003eالتجربة والوزن وتصنيف المواد\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالرازي\u003c/td\u003e\u003ctd\u003eالكيمياء العملية\u003c/td\u003e\u003ctd\u003eتقسيم العمليات والأدوات ووصفها\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eابن الهيثم\u003c/td\u003e\u003ctd\u003eالبصريات\u003c/td\u003e\u003ctd\u003eنظرية الإبصار والانعكاس والانكسار\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eبنو موسى\u003c/td\u003e\u003ctd\u003eالميكانيكا\u003c/td\u003e\u003ctd\u003eآلاتٌ وحيلٌ هندسية موصوفة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالجزري\u003c/td\u003e\u003ctd\u003eالهندسة التطبيقية\u003c/td\u003e\u003ctd\u003eساعاتٌ مائية ومضخّات وآليات حركة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003e«إنّي لا أُثبت شيئًا إلا بعد أن أُبصره بعيني، وأتحقق منه بالقياس»\u003c/p\u003e\u003ccite\u003eمن مقدمة ابن الهيثم في كتاب المناظر (بالمعنى)\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eتحوّلت الكيمياء من السحر إلى المختبر حين صار الوزن والتكرار جزءًا من العمل، والرازي أعطاها شكلًا تعليميًّا. وفي الفيزياء صنع ابن الهيثم القطيعة: غرفةٌ مظلمة وقياسٌ هندسي أسّسا البصريات الحديثة. وفي الورشة بُنيت الآلات، فكان العلم يُمارَس باليد لا بالكتاب فقط.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"hospitals-method","n":"البيمارستان والمنهج","ic":"🏛️","part":"القسم الأول: العلوم","h":"\u003carticle class=\"ch3\" id=\"hospitals-method\" data-toc=\"البيمارستان والمنهج\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الأول: العلوم\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٤ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e١\u003ci\u003e.\u003c/i\u003e٤\u003c/span\u003e\n            \u003ch3\u003eالبيمارستان والمنهج\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eلم يكن البيمارستان مستشفى فقط، بل جامعةً ومختبرًا ودار رعاية. وهذا الفصل يقرأ المؤسسة العلمية والمنهج الذي جعلها تعمل: الشك، والملاحظة، والسجل، والرحلة.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eالبيمارستان كلمة فارسية تعني «دار المرضى»، وقد صارت في الحضارة الإسلامية اسمًا لمؤسسةٍ أعقد من مستشفى. ففيه أقسامٌ للرجال والنساء، وأقسامٌ للأمراض المختلفة، وصيدلية، ومخزن أدوية، ومطبخ، وقاعة محاضرات، ومكتبة، وسكنٌ للأطباء والطلبة. وكان العلاج مجانيًّا في الأغلب، ويُموّل من الوقف أو من الخزانة، لا من المريض. وهذا يعني أن الرعاية الصحية كانت خدمةً عامة قبل أن تصير مفهومًا حديثًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بُني أول بيمارستان منظّم في بغداد في عهد هارون الرشيد، ثم توسّعت المؤسسة في كل المدن الكبرى. وكان أشهرها البيمارستان النوري في دمشق، والبيمارستان المنصوري في القاهرة الذي بناه السلطان قلاوون في القرن السابع الهجري، وكان من أكبر مؤسسات عصره: أربعة أجنحة، وقاعات محاضرات، ومكتبة، ومطبخ، وقسمٌ للأمراض العقلية، وسجلٌ لكل مريض. وقد كان في بعض المدن أكثر من بيمارستان: واحدٌ للعامة، وآخر للجيش، وثالث للأمراض المزمنة. وهذا التنوّع يدل على أن الرعاية كانت نظامًا متعدد المستويات لا مؤسسةً واحدة معزولة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في البيمارستان نظامٌ للسجلات. فيُكتب اسم المريض، وتاريخ دخوله، وأعراضه، وتشخيصه، وما أُعطي من دواء، ونتيجة العلاج. وهذا السجل هو ما جعل الطب قادرًا على التعلّم من التجربة: أن يعرف الطبيب ما نجح وما فشل، وأن يعرف زملاؤه ذلك. وقد كانت هذه السجلات أداة تعليمٍ أيضًا، لأن الطلبة يتعلّمون من الحالات المسجّلة كما يتعلّمون من الحاضرين.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان التعليم في البيمارستان عمليًّا. فكان الطالب يمرّ على الأقسام مع أستاذه، ويشاهد الحالات، ويشارك في العلاج تحت إشراف، ثم يُمنح إجازةً في الطب بعد أن يُثبت معرفته. وكانت هذه الإجازة نظامًا للترخيص، أي أن من لا يملكها لا يحقّ له الممارسة. وقد عُرفت في المصادر حالاتٌ لممارسين دجّالين عوقبوا، وهذا يدل على أن النظام كان يعمل أحيانًا على الأقل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان البيمارستان يؤدي وظائف أخرى غير العلاج. ففيه رعاية المسنين والعجزة، وفيه إيواء من لا أهل له، وفيه قسمٌ للمرضى النفسيين يُعالجون فيه بالموسيقى والحدائق والكلام لا بالقيود فقط. وكان في بعض المدن بيمارستانات متنقلة تُرسل إلى القرى والأرياف، ومعها أطباء وأدوية. وهذه الوظائف تجعل المؤسسة أقرب إلى نظام صحيّ متكامل منها إلى مستشفى واحد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما المنهج العلمي الذي حكم هذه المؤسسات فلم يكن مكتوبًا في كتابٍ واحد، بل كان ممارسةً متكررة في ثلاثة أشياء. الأول الشك: أن لا يُقبل القول لأنه قديم، كما فعل الرازي وابن النفيس. والثاني الملاحظة: أن يُسجّل ما يُرى لا ما يُتوقّع، كما في سجلات المرضى وأرصاد الفلكيين. والثالث القياس: أن تُحوّل الملاحظة إلى رقمٍ أو نسبة، كما فعل البيروني في قياس الأرض وابن الهيثم في زوايا الانعكاس.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت الرحلة العلمية جزءًا من هذا المنهج. فقد كان العالم يرحل ليجمع الكتب، ويلتقي الشيوخ، ويشاهد الظواهر بنفسه. والبيروني رحل إلى الهند، وابن بطوطة رحل ثلاثين سنة، وابن رشد قرأ في مراكش وقرطبة، والمقدسي كتب جغرافيته بعد أن طاف البلاد. وكانت الرحلة تعني أن العلم لا يُبنى في مكانٍ واحد، بل يتغذّى من التجربة الميدانية والاختلاف. وكانت المكتبات تُصنّف كتبها بفهارس، وأشهرها «الفهرست» لابن النديم الذي سجّل فيه آلاف الكتب ومؤلفيها. وهذا العمل الببليوغرافي هو ما يجعل تراثًا بهذا الحجم قابلًا للبحث إلى اليوم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان للمكتبات دورٌ موازٍ. فدار الحكمة في بغداد، ومكتبة الحكم المستنصر في قرطبة، ومكتبات المساجد والمدارس، كانت تجمع المخطوطات وترتّبها وتُعيرها. وكان النسخ مهنةً لها ورّاقون، وكانت الكتب تُجلَّد وتُزخرف وتُصحّح. وهذا يعني أن الحضارة كانت تستثمر في حفظ المعرفة لا في إنتاجها فقط، وأن المكتبة كانت مؤسسةً علمية بمعنى الكلمة. ومن هنا يصحّ القول إن الإسهام الإسلامي في الطب كان مؤسسيًّا أكثر منه نظريًّا: أن يُبنى مكانٌ يُعالج فيه الناس، ويُسجَّل فيه ما يجري، ويُعلَّم فيه من يأتي بعد. وهذا هو ما يبني حضارةً علمية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالمؤرخ اليوم ينظر إلى هذه المؤسسات بحذرٍ مفيد. فهي لم تكن مثالية: كانت تعتمد على تمويلٍ متقلب، وكانت تخضع لسياسة السلطان، وكان فيها تفاوتٌ كبير بين مدينةٍ وأخرى. لكنها في المقارنة مع أوروبا في العصور الوسطى كانت متقدّمة بشكلٍ واضح: مستشفى مجاني، وسجل مريض، وامتحان للمهنة، وتعليمٌ سريري. وهذه ليست تفاصيل صغيرة، بل هي بنية نظامٍ صحيّ كامل.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالبيمارستان: مستشفى أم جامعة؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان البيمارستان في بعض المدن أكبر من مستشفى: كان مجمّعًا فيه مسجد، ومدرسة طب، ومكتبة، وصيدلية، ومطبخ، وسكن للطلبة. وهذا يعني أن العلاج والتعليم والبحث كانت في مكانٍ واحد، وأن الطالب يتعلّم من الحالة الحقيقية لا من الكتاب فقط. وكان فيه قسمٌ يُسمّى «المحاضرة» يجلس فيه الأستاذ على كرسيٍّ ويقرأ على الطلبة، ثم ينزل بهم إلى الأجنحة ليروا الحالات. وهذا الجمع بين النظري والعملي هو ما تفتقده كثير من مدارس الطب القديمة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان هذا الشكل فعالًا لأنه يربط المعرفة بالحاجة. فالمريض يجد من يعالجه، والطالب يجد من يُعلّمه على حالةٍ حقيقية، والطبيب يجد مادةً للتجربة والتسجيل. وهذا الربط هو ما نسمّيه اليوم «المستشفى التعليمي»، وقد كان قائمًا في القاهرة ودمشق قبل أن يُعرف في أوروبا.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eامتحان الأطباء\u003c/h4\u003e\u003cp class=\"ap\"\u003eأول تنظيمٍ للمهنة في التاريخ الوسيط كان في بغداد، حين صدر أمرٌ بأن لا يمارس الطب إلا من اجتاز امتحانًا أمام رئيس الأطباء، وأن تُسجَّل أسماء الناجحين. وكان الهدف حماية الناس من الدجالين، لأن الطب مهنةٌ يمكن أن تقتل إن أُسيء استعمالها. وقد كان الامتحان يشمل معرفة الأمراض والأدوية والجراحة، وكان يُشترط أن يعرف الطبيب حدود صنعته، أي أن يُحيل إلى غيره ما لا يُحسنه. وهذا أدبٌ مهني قبل أن يكون قانونًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان هذا النظام متقطعًا: يعمل في عهدٍ ويتوقف في آخر، ويُطبَّق في مدينةٍ ولا يُطبَّق في جارتها. لكن وجوده يدل على وعيٍ مبكر بأن المهنة تحتاج ضبطًا. وهذا الوعي هو أساس كل نظامٍ صحيّ حديث، حتى لو اختلفت أدواته. وقد كان المحتسب هو من يُنفّذ هذا الضبط، وهو موظف السوق في الدولة الإسلامية: يمرّ على الدكاكين، ويفحص الموازين، ويمنع الغش، ويستمع شكاوى الناس. ومن هنا كان الطب جزءًا من نظام الحسبة لا من نقابةٍ مستقلة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالمنهج: ثلاثة أعمدة\u003c/h4\u003e\u003cp class=\"ap\"\u003eالشك، والملاحظة، والقياس: هذه ثلاثة أعمدة يمكن تتبّعها في كل العلوم الإسلامية تقريبًا. الرازي يشكّ في جالينوس، وابن الهيثم يشكّ في نظرية الشعاع، وابن النفيس يشكّ في الحاجز بين البطينين. وكل واحدٍ منهم لم يتوقف عند الشك بل ذهب إلى الملاحظة والقياس. وقد كان هؤلاء جميعًا يعملون في سياقٍ يقدّر النصّ تقديرًا كبيرًا، وهذا يجعل شكّهم أعجب: أن يشكّ عالمٌ في كتابٍ يُقدّسه تلاميذه، ويقول إن الواقع أولى بالاتباع. وهذا يحتاج جرأةً لا تقلّ عن الحاجة إلى العقل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالمهم أن هذا المنهج لم يُصغ في قواعد منهجية كما صاغه فرانسيس باكون بعد قرون. كان ممارسةً لا نظرية، ولهذا لم يتحوّل إلى مؤسسةٍ مستقلة، وظلّ مرتبطًا بالأفراد. وهذا هو الفرق بين حضارةٍ أنتجت علمًا وحضارةٍ أنتجت منهجًا للعلم: الأولى تعطي النتائج، والثانية تعطي القدرة على إنتاج النتائج.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالبيمارستان\u003c/b\u003e\u003cspan\u003eعلاجٌ مجاني وتعليمٌ وسجلٌّ ومكتبة في مؤسسةٍ واحدة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمنصوري\u003c/b\u003e\u003cspan\u003eأكبر بيمارستان في القاهرة، بأجنحةٍ ومحاضراتٍ وسجلٍّ لكل مريض\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eامتحان الأطباء\u003c/b\u003e\u003cspan\u003eأول ترخيصٍ للمهنة في التاريخ الوسيط، بدأ في بغداد\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالرحلة\u003c/b\u003e\u003cspan\u003eالبيروني وابن بطوطة والمقدسي: العلم يُبنى في الميدان\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمؤسسة\u003c/th\u003e\u003cth\u003eالوظيفة\u003c/th\u003e\u003cth\u003eالتمويل\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالبيمارستان\u003c/td\u003e\u003ctd\u003eعلاجٌ ورعايةٌ وتعليم\u003c/td\u003e\u003ctd\u003eوقفٌ وخزانة، والعلاج مجاني\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمدرسة\u003c/td\u003e\u003ctd\u003eتدريس الفقه والطب والرياضيات\u003c/td\u003e\u003ctd\u003eوقفٌ غالبًا\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمكتبة\u003c/td\u003e\u003ctd\u003eجمع المخطوطات ونسخها وإعارتها\u003c/td\u003e\u003ctd\u003eوقفٌ وخاصّة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمرصد\u003c/td\u003e\u003ctd\u003eرصدٌ وجداول فلكية\u003c/td\u003e\u003ctd\u003eتمويل سلطاني ووقف\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003e«الطب مهنةٌ لا تحتمل التجربة على الناس، فمن لم يعرف فليس له أن يداوي»\u003c/p\u003e\u003ccite\u003eمن نصوص الحسبة الطبية في بغداد والقاهرة\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eكان البيمارستان مؤسسةً متكاملة: علاجٌ مجاني، وتعليمٌ سريري، وسجلٌّ لكل مريض، وصيدلية، ومكتبة. وإلى جانبه عملت المدارس والمكتبات والمراصد بتمويل الأوقاف. وقد حكم هذا كله منهجٌ من ثلاثة أعمدة: الشك، والملاحظة، والقياس — ممارسةً لا نظرية، ولهذا بقي مرتبطًا بالأفراد لا بالمؤسسة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-2","n":"القسم الثاني: الفكر","ic":"🧠","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-2\" style=\"--c:#6A3D9A\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🧠\u003c/div\u003e\n      \u003ch2\u003eالقسم الثاني: الفكر\u003c/h2\u003e\n      \u003cp\u003eالحضارة التي أنتجت الجبر أنتجت أيضًا أسئلةً لا تُحلّ بالحساب: ما العدل؟ وما الحرية؟ وكيف نقرأ النص؟ هذا القسم يقرأ علم الكلام والفقه والتصوف والتاريخ: أربعة طرقٍ بحث بها المسلمون عن المعنى.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#kalam\"\u003eالكلام والفلسفة\u003c/a\u003e\u003ca href=\"#fiqh\"\u003eالفقه وأصوله\u003c/a\u003e\u003ca href=\"#sufism\"\u003eالتصوف والأخلاق\u003c/a\u003e\u003ca href=\"#historiography\"\u003eالتاريخ والمؤرخون\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"kalam","n":"الكلام والفلسفة","ic":"🗣️","part":"القسم الثاني: الفكر","h":"\u003carticle class=\"ch3\" id=\"kalam\" data-toc=\"الكلام والفلسفة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الثاني: الفكر\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ١ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٢\u003ci\u003e.\u003c/i\u003e١\u003c/span\u003e\n            \u003ch3\u003eالكلام والفلسفة\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eمن المعتزلة إلى ابن رشد: كيف جرت أكبر معركةٍ فكرية في تاريخ الإسلام، وما الذي بقي منها في طريقة تفكيرنا إلى اليوم؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eبدأ علم الكلام من سؤالٍ سياسي تحوّل إلى سؤالٍ عقلي: إذا كان الحاكم ظالمًا فهل هو مسلم؟ ومن يحقّ له أن يحكم؟ وقد وُلدت فرقٌ في القرن الأول الهجري تتنازع هذه الأسئلة، ثم تحوّلت إلى مسائل عقدية كبرى: هل الإنسان حرّ في فعله أم مجبور؟ وهل صفات الله قديمة أم حادثة؟ وهل القرآن مخلوق أم غير مخلوق؟ وهذه الأسئلة تبدو مجرّدة، لكنها كانت في جوهرها أسئلةً عن السلطة والمسؤولية والحرية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان المعتزلة أول من صاغ هذه الأسئلة في نظام. فقد أقاموا مذهبهم على خمسة أصول: التوحيد، والعدل، والوعد والوعيد، والمنزلة بين المنزلتين، والأمر بالمعروف والنهي عن المنكر. وكان أهم أصلين عندهم هما «العدل» و«خلق القرآن»، لأن الأول يعني أن الله لا يظلم وأن الإنسان مسؤول عن فعله، والثاني يعني أن النصّ يمكن أن يُفهم ويُؤول لا أن يُتعبّد بحروفه فقط.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد صار المعتزلة مذهب الدولة في عهد المأمون، ثم حدثت «المحنة»: أن يُختبر العلماء في القول بخلق القرآن، وأن يُعاقب من يرفض. وكان هذا أول اختبارٍ في التاريخ الإسلامي لحرية العالم أمام السلطة، وأحد أشدّ المواقف إثارةً للجدل، لأن الفريق الذي كان يدعو إلى العقل هو نفسه من استعمل السيف لإلزام الناس برأيه. وهذا الدرس سيتكرر في التاريخ كله: أن من يُدافع عن الحرية قد يستعمل القمع إن أُعطي السلطة.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم جاء أبو الحسن الأشعري، فبنى مذهبًا وسطًا: أن يستعمل أدوات العقل في الدفاع عن العقيدة السنية، بلا انحيازٍ كامل للمعتزلة ولا رفضٍ كامل للعقل. وقد صار المذهب الأشعري هو السائد في العالم الإسلامي السنّي، وأصبح له أعلام كبار مثل الباقلاني والجويني والغزالي. وفي المقابل قام مذهبٌ آخر قريب منه هو الماتريدي في الشرق، وانتشر في بلاد ما وراء النهر وتركيا. وكان هذان المذهبان هما الجواب السني على سؤال: كيف نُدافع عن الدين بعقلٍ لا يهدمه؟\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما الفلسفة فقد دخلت من باب الترجمة. ففي القرن الثالث الهجري تُرجمت كتب أرسطو وأفلاطون وأفلوطين، وظهر فلاسفة مسلمون حاولوا التوفيق بين الفلسفة والدين. وكان الكندي أولهم، ثم الفارابي الذي بنى نظريةً كاملة في المدينة الفاضلة، ثم ابن سينا الذي جمع بين الطب والفلسفة في نظامٍ واحد. وقد كان هؤلاء يريدون شيئًا واحدًا: أن يُثبتوا أن العقل لا يناقض الوحي، وأن الفلسفة ليست كفرًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان الغزالي هو نقطة التحول الكبرى. فقد درس الفلسفة دراسةً عميقة، ثم كتب «تهافت الفلاسفة» ليبطل دعوى أن الفلسفة تُعطي يقينًا، وكتب «المنقذ من الضلال» ليحكي رحلته من الشك إلى التصوف. وكان هدفه ليس إلغاء العقل بل تحديد حدوده: أن العقل يُثبت، لكنه لا يستطيع أن يُعطي الطمأنينة. وقد كان لأعماله أثرٌ مزدوج: أنها أنهت هيمنة الفلسفة المشائية في الشرق، وأنها في الوقت نفسه أدخلت المنطق والأدوات العقلية في علم الكلام وفي أصول الفقه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوجاء ابن رشد في الأندلس ليُجيب. فكتب «تهافت التهافت» ردًّا على الغزالي، و«فصل المقال» ليقول إن بين الحكمة والشريعة وفاقًا لا خلافًا، وإن هناك طبقاتٍ من الناس: من يقتنع بالخطابة، ومن يقتنع بالجدل، ومن يقتنع بالبرهان. وكان موقفه أن الفلسفة ليست للجميع، لكنها ليست كفرًا لمن يقدر عليها. وقد كان لابن رشد أثرٌ هائل في أوروبا أكثر من أثره في الشرق، حيث صار «المعلّم الثاني» بعد أرسطو، وبُنيت على كتبه مدرسةٌ لاتينية كاملة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالمفارقة أن هذه المعركة الفكرية الكبرى لم تُحسم لطرفٍ واحد. فالفلسفة المشائية تراجعت في الشرق بعد الغزالي، لكن منطقها وأدواتها دخلت في أصول الفقه، وفي علم الكلام، وفي النحو. والكلام الأشعري لم يُلغِ العقل بل حوّله إلى أداة دفاع. والتصوف لم يُلغِ الفقه بل أعطاه بُعدًا وجدانيًّا. والنتيجة أن الفكر الإسلامي بعد القرن السابع الهجري صار مركّبًا من هذه الطبقات كلها، لا مذهبًا واحدًا صافيًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوإذا أردنا أن نقرأ هذا الإرث اليوم، فلا يصحّ أن نقرأه كمعركةٍ بين «عقل» و«نقل». فكل الأطراف كانت تستعمل العقل، والخلاف كان في حدوده لا في قيمته. والمشكلة الحقيقية التي تركتها هذه المعركة هي مسألة «الاجتهاد والتقليد»: من يحقّ له أن يستنبط؟ وما شروط ذلك؟ وهل يمكن أن يُعاد فتح باب البحث في مسائل اعتُبرت محسومة؟ وهذا سؤالٌ ما زال مطروحًا في كل مجتمعٍ إسلامي إلى اليوم.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالمحنة: عندما صار العقل سيفًا\u003c/h4\u003e\u003cp class=\"ap\"\u003eالمحنة هي الحادثة التي اختُبر فيها العلماء في مسألة خلق القرآن، واستمرت نحو عشرين سنة، وسُجن فيها أحمد بن حنبل وضُرب، وثبت على رأيه حتى صار رمزًا للعالم الذي لا يبيع دينه لسلطان. وقد انتهت بتخلّي المتوكل عن مذهب المعتزلة وإعادة الاعتبار لمن رفض. ومن هنا صارت المحنة تُذكر في كتب التاريخ كأول جرحٍ في العلاقة بين العلماء والسلطة، وأول دليل على أن الدولة قد تُقاتل الفكر باسم الفكر نفسه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالدرس هنا ليس في المسألة العقدية نفسها، بل في العلاقة بين الدولة والعلم. فحين تستعمل الدولة سلطتها لإلزام الناس برأيٍ فكري، تتحوّل المسألة العلمية إلى مسألة سلطة، ويصير العالم إما مواليًا أو مهدَّدًا. وقد ترك هذا أثرًا عميقًا: أن صار الفكر السني حذرًا من الدولة، وأن صار التدخل في العقائد يُذكر كسابقةٍ سوداء.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالغزالي وابن رشد: خصمان أم متكاملان؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eيُصوّر كثيرون الغزالي وابن رشد كخصمين: الأول أطفأ الفلسفة، والثاني حاول إحياءها. والحقيقة أدقّ من ذلك. فالغزالي لم يرفض المنطق بل جعله مقدمةً لأصول الفقه، ولم يرفض العقل بل حدّد وظيفته. وابن رشد لم يُدافع عن الفلسفة ضد الدين، بل دافع عن حقّ الفيلسوف في أن يقرأ النص قراءةً رمزية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالفرق بينهما في الجمهور لا في الحقيقة: الغزالي كان يخاطب جمهورًا واسعًا في الشرق، وابن رشد يخاطب نخبةً في الأندلس. ولهذا انتصر الأول في الشرق وخسر الثاني فيه، ثم انتصر الثاني في أوروبا وخسر في بلده. وهذا يبيّن أن مصير الأفكار لا يحدّده صحّتها بل يحدّده السياق الذي تُطرح فيه.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eما بقي من المعركة؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eبقي منها شيءٌ مهم: أن العلم الإسلامي تعلّم أن يُميّز بين «ما يُعتقد» و«ما يُبرهن». ففي أصول الفقه صار هناك بابٌ للمنطق، وفي الكلام صار هناك بحثٌ في الدليل، وفي التفسير صار هناك تمييزٌ بين المحكم والمتشابه. وهذه كلها أدوات عقلية ناتجة عن هذه المعركة. وقد تعلّم الفقه من الكلام دقّة العبارة، وتعلّم الكلام من الفلسفة صرامة البرهان، وتعلّم التصوف من الكلام حدود الكلام. وهذا التلاقح هو ما أنتج الموسوعات الكبرى في القرن الثامن والتاسع الهجري.\u003c/p\u003e\u003cp class=\"ap\"\u003eوبقي منها أيضًا شيءٌ سلبي: أن كثيرًا من الأسئلة أُغلقت لا لأنها حُلّت بل لأنها صارت خطرًا. والفرق بين سؤالٍ أُغلق بالدليل وسؤالٍ أُغلق بالخوف كبير، لأن الأول يُنتج علمًا والثاني يُنتج صمتًا. وهذا هو ما يفسّر جزءًا من جمود الفكر بعد القرن الثامن الهجري.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمعتزلة\u003c/b\u003e\u003cspan\u003eخمسة أصول، وأهمها العدل وخلق القرآن، وأدوات عقلية جسورة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمحنة\u003c/b\u003e\u003cspan\u003eاختبارٌ للعلماء في العقيدة، وسابقةٌ في استعمال السلطة في الفكر\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eتهافت الفلاسفة\u003c/b\u003e\u003cspan\u003eالغزالي يحدّد حدود العقل، ويُدخل المنطق في العلوم الشرعية\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eفصل المقال\u003c/b\u003e\u003cspan\u003eابن رشد يرى وفاقًا بين الحكمة والشريعة، وأثره الأكبر كان في أوروبا\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمذهب\u003c/th\u003e\u003cth\u003eأبرز أعلامه\u003c/th\u003e\u003cth\u003eالفكرة المركزية\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالمعتزلة\u003c/td\u003e\u003ctd\u003eواصل بن عطاء، الجاحظ\u003c/td\u003e\u003ctd\u003eالعدل والمسؤولية وخلق القرآن\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالأشعرية\u003c/td\u003e\u003ctd\u003eالأشعري، الباقلاني، الجويني\u003c/td\u003e\u003ctd\u003eالعقل في خدمة العقيدة السنية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالماتريدية\u003c/td\u003e\u003ctd\u003eالماتريدي\u003c/td\u003e\u003ctd\u003eتوسّطٌ أشبه بالأشعري في الشرق\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمشائية\u003c/td\u003e\u003ctd\u003eالكندي، الفارابي، ابن سينا\u003c/td\u003e\u003ctd\u003eالتوفيق بين الفلسفة والوحي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالرشدية\u003c/td\u003e\u003ctd\u003eابن رشد\u003c/td\u003e\u003ctd\u003eالبرهان للخاصة والخطابة للعامة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003e«الحكمة هي صاحبة الشريعة، والأخت الرضيعة لها»\u003c/p\u003e\u003ccite\u003eابن رشد، فصل المقال في ما بين الحكمة والشريعة من الاتصال\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eبدأ الكلام سؤالًا عن الحكم والحرية، ثم صار نظامًا عقليًّا عند المعتزلة، ثم جوابًا سنيًّا عند الأشعري. ودخلت الفلسفة بالترجمة، فحاول الكندي والفارابي وابن سينا التوفيق، فردّ الغزالي بحدودٍ للعقل، فأجاب ابن رشد بوفاقٍ بين الحكمة والشريعة. وما بقي من المعركة أدواتٌ عقلية، وبعض أسئلةٍ أُغلقت بالخوف لا بالدليل.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"fiqh","n":"الفقه وأصوله","ic":"📖","part":"القسم الثاني: الفكر","h":"\u003carticle class=\"ch3\" id=\"fiqh\" data-toc=\"الفقه وأصوله\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الثاني: الفكر\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٢ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٢\u003ci\u003e.\u003c/i\u003e٢\u003c/span\u003e\n            \u003ch3\u003eالفقه وأصوله\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eكيف تحوّل الوحي إلى قانونٍ يُحكم به في مدنٍ وولايات وقارات؟ هذا الفصل يقرأ علم أصول الفقه: أعظم إنجازٍ منهجي في الحضارة الإسلامية.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eالفقه هو العلم الذي يحوّل النصوص إلى أحكام. وأصول الفقه هو العلم الذي يضع قواعد هذا التحويل: كيف نستخرج حكمًا من نصّ؟ وما شروط الاستدلال؟ وما قيمة القياس والإجماع والعرف والمصلحة؟ وهذا العلم هو أعظم إنجازٍ منهجي في الحضارة الإسلامية، لأنه لا يُنتج حكمًا واحدًا بل يُنتج آلةً تُنتج أحكامًا لا نهائية. ولهذا فإن تاريخ الفقه ليس تاريخ فتاوى فقط، بل تاريخ عقلٍ يبحث عن قواعد تُطبَّق على ما لا يتناهى من الوقائع، وهذا هو ما يجعله قريبًا من منطق القانون في أي حضارة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان الشافعي (توفي سنة ٢٠٤هـ) هو من صاغ هذا العلم في كتابه «الرسالة». وقد كان إنجازه أنه فصل بين «الفقه» أي الفروع و«الأصول» أي القواعد، وأن وضع ترتيبًا للأدلة: الكتاب، ثم السنة، ثم الإجماع، ثم القياس. وهذا الترتيب لم يكن مجرّد تنظيم بل كان موقفًا: أن العقل يعمل داخل النصّ لا بمعزلٍ عنه، وأن الاجتهاد ليس رأيًا حرًّا بل استدلالًا منضبطًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد تكوّنت المذاهب الأربعة في القرنين الثاني والثالث الهجري: الحنفي في العراق على يد أبي حنيفة وأصحابه، والمالكي في المدينة على يد مالك، والشافعي في مصر، والحنبلي في بغداد على يد أحمد. ولم تكن هذه المذاهب في الأصل أحزابًا بل مدارس في طريقة الاستدلال: الحنفي يوسّع القياس والاستحسان، والمالكي يعتمد عمل أهل المدينة والمصلحة، والشافعي يُحكم الأصول، والحنبلي يُقلّل التوسع في الرأي. ثم صارت هذه المدارس هوياتٍ مستقرة على مدى قرون.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت «المقاصد» أعلى تطورٍ في هذا العلم. فقد تطوّر التفكير من البحث في اللفظ إلى البحث في الغاية: ما الذي جاءت الشريعة لحفظه؟ فصاغ الغزالي والشاطبي نظريةً في الضروريات الخمس: الدين، والنفس، والعقل، والنسل، والمال. وهذا يعني أن الحكم لا يُفهم من لفظه فقط بل من غايته، وأن الفقيه يسأل: أيّ ضرورةٍ يحمي هذا الحكم؟ وهذا فتحٌ كبير أمام الفقه ليتعامل مع الوقائع الجديدة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان للفقه حياةٌ يومية لا تُرى في الكتب. فالقاضي يحكم في البيوع والإجارات والشركات والوصايا، والمفتي يُسأل في الطلاق والرضاع والنفقة، والمحتسب يفصل في الغشّ والموازين، والفقيه يُستشار في الوقف والوصية. وقد وصلت إلينا آلاف الفتاوى والوثائق، وهي تُظهر أن الفقه كان يُمارس في السوق والبيت والمحكمة، لا في حلقةٍ مغلقة. وقد كشف تحقيق دفاتر المحاكم في القرون الأخيرة أن الناس كانوا يستعملون الفقه في تفاصيل صغيرة: في عقد إجارة دكان، وفي وصيةٍ بثلث التركة، وفي خلافٍ على حقّ المرور، وفي نزاعٍ على ماء ساقية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان «العرف» عنصرًا مهمًّا في هذا النظام، ولو لم يُعترف به صريحًا في كل مذهب. فالعادات المحلية في الزواج واللباس والأسواق كانت تُراعى في الفتوى، وهذا هو ما جعل الفقه قادرًا على العمل في بلادٍ مختلفة الأعراف: من بخارى إلى فاس إلى دلهي. وكانت القاعدة التي تُذكر كثيرًا: «العادة محكّمة»، أي أن العرف يُعتبر إن لم يخالف نصًّا صريحًا. ومن هنا يقول الأصوليون إن «العرف» ليس دليلًا مستقلًّا بل هو قرينةٌ تُفهم بها النصوص، ولهذا لا يُعمل به في المنصوص الصريح، وإنما يُعمل به في المسكوت عنه، وهو أكثر أبواب المعاملات.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت المدارس هي مؤسسة نقل هذا العلم. فالمدرسة تُبنى بوقفٍ، ويُعيَّن فيها مدرّس، ويُدرس فيها متنٌ معيّن، ويُجاز الطالب بعد سنوات. وكان نظام «الإجازة» هو الشهادة، وهي ليست شهادةً رسمية بل إقرارٌ من شيخٍ بأن هذا الطالب أهلٌ للرواية أو الفتوى. وكان هذا النظام مرنًا: يمكن أن تُطلب الإجازة في أي عمر، ومن أي شيخ، وفي أي بلد. لكنه كان أيضًا شخصيًّا، يعتمد على سمعة الشيخ أكثر من اعتماده على منهجٍ موحّد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان من أثر هذا النظام أنه حفظ العلم من الانقطاع: فالسند المتصل بالسلف صار قيمةً في ذاته، حتى صار الإسناد جزءًا من العلم. وفي الوقت نفسه أنتج هذا النظام مشكلة: أن يصير الحفظ والتلقين أهم من البحث، وأن يُقدَّم «قال فلان» على «ما الدليل؟». وقد لاحظ ابن خلدون هذه المشكلة في مقدمته، وكتب فصلًا في «العلوم وأصنافها» يشرح فيه كيف تُدرَّس العلوم ولماذا تتوقف.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالمؤرخ المنصف يرى في هذا الإرث وجهين. فالوجه الأول أنه أنتج نظامًا قانونيًّا متماسكًا عمل قرونًا في بلادٍ شاسعة، ووضع أدواتٍ للاستدلال ما زالت تُدرَّس في كليات الحقوق والشريعة. والوجه الثاني أن هذا النظام أُغلق تدريجيًّا: صار التقليد هو الغالب، وقلّ الاجتهاد، وضاقت مساحة الاختلاف. والنتيجة أن الفقه الذي كان قادرًا على استيعاب الوقائع الجديدة في القرن الرابع الهجري صار في القرن الثالث عشر يجد صعوبةً في التعامل مع البنك والتأمين والشركة المساهمة، فظهرت فتاوى متأخرة ومتسرعة، وظهرت في المقابل مدارس إصلاحٍ حاولت أن تُعيد للفقه مرونته.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالرسالة: كيف تُصنع آلة الاستدلال؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eكتاب «الرسالة» للشافعي هو أول كتابٍ منظّم في أصول الفقه، وفيه بحثٌ في البيان والناسخ والمنسوخ والعام والخاص والإجماع والقياس. وأهم ما فيه أنه يُعلّم القارئ كيف يسأل: ما دلالة هذا اللفظ؟ وهل هو عامٌّ أم خاص؟ وهل هو محكمٌ أم متشابه؟ وهل هناك معارض؟ وقد كان الشافعي يستعمل أمثلةً من القرآن والسنة ثم يستخرج منها القاعدة، فيتعلّم القارئ القاعدة والمثال معًا. وهذا التعليم بالمثال هو ما جعل الكتاب مقروءًا في الأقاليم كلها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوهذه الأسئلة هي ما جعل الفقه علمًا لا مجموعةً من الآراء. فمن يعرف الأصول يستطيع أن يحكم في مسألةٍ لم يجدها في كتاب، ومن لا يعرفها لا يستطيع إلا أن ينقل. ولهذا قال العلماء إن «الفقيه من يعرف الأصول»، أي إن الفقه ليس حفظًا للفروع بل معرفةً بطريقة استخراجها.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالمقاصد: الفقه حين يسأل عن الغاية\u003c/h4\u003e\u003cp class=\"ap\"\u003eنظرية المقاصد نقلت الفقه من السؤال «ما حكم هذا الفعل؟» إلى السؤال «لماذا شُرع هذا الحكم؟». وهذا السؤال الأخير فتح بابًا للفهم لا للتحليل فقط: أن تُفهم الشريعة كنسقٍ يحمي خمس ضرورات، وأن تُقاس الوقائع الجديدة على هذه الضرورات لا على ألفاظها. وقد كانت هذه النظرة تحمي الفقيه من الجمود على اللفظ، لأنها تسمح له أن يفهم الحكم في سياقه، وأن يميّز بين ما هو مقصودٌ في كل حال وما هو وسيلةٌ تتغير بتغير الزمان.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد استُعملت هذه النظرية في قضايا كثيرة: في تنظيم الأسواق، وفي الوقف النقدي، وفي المعاملات المستحدثة. لكنها استُعملت أيضًا استعمالًا واسعًا حتى صارت ذريعةً عند بعض المتأخرين لتغيير أحكامٍ ثابتة. ولهذا يقول الباحثون إن المقاصد أداةٌ خطيرة إن لم تُضبط بمنهج، كالسكين التي تُقطع بها الخبز أو يُقتل بها إنسان.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالمذاهب الأربعة: تنوّع أم انقسام؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eفي الأصل كان الاختلاف بين المذاهب اختلافًا في طريقة الاستدلال، لا في أصول الدين. وكان الفقهاء يقرأون كتب بعضهم، ويختلفون في المجلس ثم يفترقون على احترام. وقد كان هذا التنوّع ثروةً، لأنه أعطى الناس خياراتٍ في مسائل كثيرة، وأعطى القاضي مرونةً في التعامل مع أعراف بلده.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم تحوّل التنوّع إلى انقسام في العصور المتأخرة، حين صار الانتساب إلى مذهبٍ جزءًا من الهوية، وحين صار الترجيح بين المذاهب مسألةً سياسية. والنتيجة أن الأمة فقدت جزءًا من مرونة فقهها، وبدأت الخلافات الصغيرة تُعظَّم على حساب المسائل الكبرى التي تجمعها. وقد ظهرت في التاريخ الإسلامي محاولاتٌ كثيرة للتقريب بين المذاهب، من كتب «الخلاف» إلى مجامع التقريب في القرن العشرين، وكلها انطلقت من فكرةٍ صحيحة: أن الاختلاف في الفروع لا يستوجب العداء.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالرسالة\u003c/b\u003e\u003cspan\u003eالشافعي يؤسس أصول الفقه: بيانٌ وقياسٌ وإجماع\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمقاصد الخمس\u003c/b\u003e\u003cspan\u003eالدين والنفس والعقل والنسل والمال: غايات الشريعة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالإجازة\u003c/b\u003e\u003cspan\u003eشهادةٌ شخصية من شيخٍ تُنقل بها الرواية والفتوى\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالعادة محكّمة\u003c/b\u003e\u003cspan\u003eقاعدةٌ جعلت الفقه قادرًا على العمل في بلادٍ مختلفة الأعراف\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمذهب\u003c/th\u003e\u003cth\u003eالموطن\u003c/th\u003e\u003cth\u003eسمته في الاستدلال\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالحنفي\u003c/td\u003e\u003ctd\u003eالعراق ثم الدولة العثمانية\u003c/td\u003e\u003ctd\u003eتوسّعٌ في القياس والاستحسان\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمالكي\u003c/td\u003e\u003ctd\u003eالمدينة ثم الأندلس والمغرب\u003c/td\u003e\u003ctd\u003eعمل أهل المدينة والمصلحة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالشافعي\u003c/td\u003e\u003ctd\u003eمصر والشام واليمن\u003c/td\u003e\u003ctd\u003eضبطٌ صارم للأصول\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالحنبلي\u003c/td\u003e\u003ctd\u003eبغداد ثم الشام\u003c/td\u003e\u003ctd\u003eتحرّجٌ من التوسع في الرأي\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003e«العلم ليس حفظ المسائل، بل معرفة كيف تُستخرج المسائل»\u003c/p\u003e\u003ccite\u003eمن تقريرات الأصوليين في بيان معنى الفقه\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eأصول الفقه هو أعظم إنجازٍ منهجي في الحضارة الإسلامية: آلةٌ تُنتج أحكامًا لا حكمًا واحدًا. الشافعي وضع ترتيب الأدلة، والمذاهب الأربعة تنوّعت في طرق الاستدلال، والمقاصد نقلت الفقه من اللفظ إلى الغاية. ثم أُغلق النظام تدريجيًّا بالتقليد، فصار يجد صعوبةً في التعامل مع وقائع القرن الثالث عشر.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"sufism","n":"التصوف والأخلاق","ic":"🕯️","part":"القسم الثاني: الفكر","h":"\u003carticle class=\"ch3\" id=\"sufism\" data-toc=\"التصوف والأخلاق\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الثاني: الفكر\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٣ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٢\u003ci\u003e.\u003c/i\u003e٣\u003c/span\u003e\n            \u003ch3\u003eالتصوف والأخلاق\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eليس التصوف زهدًا فقط، بل كان حركةً اجتماعية وتربوية وفنًّا وشعرًا. وهذا الفصل يقرأ كيف صار طريقًا للسلوك، ومؤسسةً في الدولة، وموضوعًا للجدل.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eالتصوف في أصله ليس مذهبًا فقهيًّا ولا فرقةً عقدية، بل هو اسمٌ لطريقةٍ في السلوك: أن يُطهّر الإنسان قلبه، ويُقلّل تعلّقه بالدنيا، ويُراقب الله في كل حال. وقد ظهر هذا الاتجاه مبكرًا في الإسلام، في الزهد والورع، ثم تطوّر في القرن الثالث الهجري إلى مدرسةٍ لها مصطلحاتها وأدبها وشيوخها. وكان أول من صاغه في نظامٍ هو الجنيد البغدادي، الذي جمع بين الفقه والسلوك، وقال إن «التصوف هو أن تكون مع الله بلا وسيط».\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان للتصوف بعدان: بعدٌ فردي وبعدٌ اجتماعي. أما الفردي فهو المجاهدة والذكر والخلوة ومحاسبة النفس. وأما الاجتماعي فهو الزاوية والخانقاه، حيث يجتمع المريدون حول شيخٍ يربّيهم، ويعيشون في مكانٍ واحد، ويعملون ويتعلّمون. وقد انتشرت هذه المؤسسات في العالم الإسلامي من المغرب إلى الهند، وصارت جزءًا من نسيج المدينة، لها أوقافها ومطبخها ومدرسةٌ صغيرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان الغزالي هو من أعطى التصوف شرعيةً واسعة داخل السنّة. فبعد رحلته الفكرية كتب «إحياء علوم الدين»، وفيه حاول أن يُعيد للعبادات معناها الباطني، وأن يجعل السلوك جزءًا من الدين لا زيادةً عليه. وقد قُبل الكتاب قبولًا هائلًا في الأمة، حتى قيل إنه «كاد يكون قرآنًا»، وإن كان قد لقي نقدًا من بعض الفقهاء على بعض ما فيه من أحاديث لا تثبت.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان للتصوف وجهٌ فني وشعري عظيم. فالشعر الصوفي أنتج أجمل ما في العربية والفارسية والتركية، من قصائد ابن الفارض وابن عربي في العربية، إلى مثنوي الرومي في الفارسية، إلى شعر يونس إمره في التركية. وكان هذا الشعر يعبّر عن الحبّ الإلهي بلغةٍ بشرية، ويستعمل الرمز والخمر والجمال، فصار له أثرٌ في الشعر العالمي كله، حتى إن الرومي صار في القرن العشرين أكثر شاعرٍ تُرجم في أمريكا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان للتصوف أثرٌ اجتماعي مباشر في أوقات الأزمات. فالزوايا كانت تُطعم الفقراء، وتُسكن الغرباء، وتُعلّم الأطفال، وتُداوي المرضى. وفي فترات الغزو والانهيار كان الشيخ الصوفي هو المرجع الذي يلجأ إليه الناس حين تغيب الدولة. وهذا يفسّر لماذا كان للتصوف شعبية هائلة، ولماذا حاولت الدولة أن تُدمجه في نظامها بدل أن تُلغيه، فصار للطريقة شيخٌ معترف به، وللزاوية وقفٌ مسجّل.\u003c/p\u003e\u003cp class=\"ap\"\u003eلكن التصوف لم يكن بلا نقد. فقد انتقده الفقهاء في مواضع: في الغلوّ في تعظيم الشيخ، وفي بعض الممارسات التي لا أصل لها، وفي الدعاوى التي تُخالف العقيدة. وقد كتب ابن الجوزي «تلبيس إبليس» ليبيّن ما دخل في التصوف من بدع، وكتب ابن تيمية نقدًا مشابهًا. وكان هذا النقد في كثير من الأحيان نقدًا داخليًّا من متصوفة أنفسهم، لأن التصوف لم يكن كتلةً واحدة بل طرقًا متباينة، بعضها شديد الانضباط وبعضها انحرف.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان من أخطر ما دخل على التصوف في العصور المتأخرة هو «التسلسل» و«الوراثة»: أن يصير منصب الشيخ وراثيًّا في عائلة، وأن تصير الطريقة مؤسسةً لها مصالحها. وهذا حوّل التربية الروحية إلى وظيفة، والمريد إلى تابع، والزاوية إلى شبكة نفوذ. وقد كان لهذا أثرٌ سلبي في الحياة الدينية، لكنه لا يُلغي أن التصوف في أصله أنتج أخلاقًا وتربيةً وفنًّا لا يمكن إنكاره.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالمؤرخ يقف من التصوف موقفًا مركّبًا: لا يقبله جملةً ولا يرفضه جملة. فهو حركةٌ أنتجت أدبًا عظيمًا وأخلاقًا عملية وتماسكًا اجتماعيًّا في أزمات كثيرة، وفي الوقت نفسه أنتجت غلوًّا وخرافةً وتسلسلًا. والحكم عليه يجب أن يكون بالتفصيل لا بالجملة، وهذا هو أصل المشكلة في كل قراءةٍ سريعة للتاريخ: أن تُؤخذ الظاهرة كلها بحكم واحد، فتُفقد الحقيقة في كلا الطرفين.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالزاوية: مؤسسةٌ في المدينة\u003c/h4\u003e\u003cp class=\"ap\"\u003eالزاوية أو الخانقاه كانت في كثير من المدن مركزًا اجتماعيًّا حقيقيًّا: فيها مسجدٌ صغير، وغرفٌ للمريدين، ومطبخٌ يُطعم الفقراء، وأحيانًا مدرسةٌ وحمّام. وكانت تُموّل من وقفٍ، وكان لها شيخٌ له مكانة عند الناس وعند السلطان. وكانت الزاوية تُبنى عادةً في حيٍّ سكني لا في قلب السوق، فتصير مركز الحي: يُصلّى فيها، ويُقرأ فيها القرآن، ويُعلَّم فيها الأطفال مبادئ القراءة، ويُستقبل فيها الغريب الذي لا يجد بيتًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أدّت هذه المؤسسة وظائف لا تُؤدّيها الدولة: رعاية الغريب، وإطعام الفقير، وتربية الطفل، ودفن الميت، وتعليم الأمّيّ. ولهذا لم يكن غريبًا أن تكون الزاوية هي الملجأ الأول في فترات الغزو، وأن يكون شيوخها في مقدمة من قاوم الاحتلال في بلادٍ كثيرة. وفي المغرب العربي كان للزاوية دورٌ سياسي أيضًا: أنها كانت مركز تعليمٍ وتجنيدٍ في آن، وأن شيوخها توسطوا بين القبائل والدولة، وأن بعضهم قاد حركات إصلاحٍ دينية واجتماعية.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eابن عربي والرومي: لغةٌ واحدة وعالمان\u003c/h4\u003e\u003cp class=\"ap\"\u003eابن عربي وُلد في الأندلس ومات في دمشق، وكتب «الفتوحات المكية» و«فصوص الحكم»، وهي كتبٌ غاية في التعقيد، وقد أثارت جدلًا لم ينتهِ. ولهجته في «وحدة الوجود» فهمها بعضهم على ظاهرها فكفّروه، وأوّلها آخرون على معانٍ عرفانية. وهذا الجدل نفسه دليل على أن اللغة الصوفية كانت لغةً رمزية لا تُقرأ قراءةً حرفية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالرومي وُلد في بلخ ومات في قونية، وكتب «المثنوي» بالفارسية في ستة دفاتر، وهو شعرٌ تعليمي وحكائي في الوقت نفسه. وقد كان الرومي أكثر تواضعًا في التعبير وأكثر قربًا من الناس، ولهذا انتشر شعره انتشارًا هائلًا. والفرق بينهما أن الأول كان فيلسوفًا للعرفان، والثاني كان حكّاءً للعرفان.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالنقد الداخلي\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يكن نقد التصوف دائمًا من خارجه. فقد كتب متصوفةٌ نقدًا لبعضهم، وكتب فقهاءُ صوفةٌ تحذيرًا من الغلوّ في الشيخ. وكان ابن الجوزي في «تلبيس إبليس» يجمع الأمثلة على ما دخل في الدين من بدع، ويضع التصوف في قلبها لا في هامشها. وكان من أشدّ نقده ما يتعلق بالشطحات: أن يقول الصوفي في حال الوجد كلامًا يُفهم على غير وجهه، فيُحاكم عليه. وقد دفع بعضهم حياته ثمنًا لكلمةٍ قالها في حالٍ لا يُحتكم فيها إلى العقل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوهذا النقد الداخلي هو ما أعطى التصوف قدرةً على الإصلاح في فتراتٍ كثيرة: أن تظهر طريقةٌ جديدة أكثر انضباطًا، فتُعيد التوازن. وهكذا نجد في التاريخ الإسلامي موجاتٍ من التصوف الصارم تعقب موجاتٍ من التصوف المتراخي، وكأن الحركة تُصحّح نفسها بنفسها حين تجد من يقول كلمة الحق.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالجنيد\u003c/b\u003e\u003cspan\u003eأول من صاغ التصوف في نظامٍ يجمع الفقه والسلوك\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالإحياء\u003c/b\u003e\u003cspan\u003eالغزالي يمنح التصوف شرعيةً واسعة داخل السنّة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمثنوي\u003c/b\u003e\u003cspan\u003eالرومي يُحوّل العرفان إلى شعرٍ حكائي انتشر في العالم\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالزاوية\u003c/b\u003e\u003cspan\u003eمؤسسةٌ اجتماعية تُطعم وتُعلّم وتُسكن، بتمويل الوقف\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمرحلة\u003c/th\u003e\u003cth\u003eالسمة\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالزهد المبكر\u003c/td\u003e\u003ctd\u003eورعٌ فردي بلا تنظيم\u003c/td\u003e\u003ctd\u003eبذور السلوك الصوفي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eمدرسة بغداد\u003c/td\u003e\u003ctd\u003eمصطلحاتٌ وأدبٌ وشيخٌ ومريد\u003c/td\u003e\u003ctd\u003eتحوّل التصوف إلى علم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالإحياء\u003c/td\u003e\u003ctd\u003eدمجٌ بين الفقه والسلوك\u003c/td\u003e\u003ctd\u003eقبولٌ واسع داخل السنّة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالطرق\u003c/td\u003e\u003ctd\u003eأورادٌ وسلاسل وزوايا\u003c/td\u003e\u003ctd\u003eمؤسسةٌ اجتماعية ذات وقف\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالنقد\u003c/td\u003e\u003ctd\u003eتلبيس إبليس وردود الفقهاء\u003c/td\u003e\u003ctd\u003eتصحيحٌ داخلي وخارجي متكرر\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003e«التصوف هو أن تكون مع الله بلا وسيط، وأن يكون خُلُقك القرآن»\u003c/p\u003e\u003ccite\u003eما يُروى عن الجنيد في تعريف التصوف\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eالتصوف بدأ زهدًا فرديًّا ثم صار مدرسةً لها شيخ ومريد وأدب. والغزالي أعطاه شرعيةً واسعة، والرومي وابن عربي حوّلاه إلى شعرٍ وعرفان، والزاوية جعلته مؤسسةً اجتماعية تُطعم وتُعلّم. وقد نُقد من الداخل والخارج، وبقي أثره في الأخلاق والفن والتماسك الاجتماعي، مع ما دخل عليه من غلوٍّ وتسلسل.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"historiography","n":"التاريخ والمؤرخون","ic":"📜","part":"القسم الثاني: الفكر","h":"\u003carticle class=\"ch3\" id=\"historiography\" data-toc=\"التاريخ والمؤرخون\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الثاني: الفكر\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٤ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٢\u003ci\u003e.\u003c/i\u003e٤\u003c/span\u003e\n            \u003ch3\u003eالتاريخ والمؤرخون\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eمن الطبري إلى ابن خلدون: كيف صار التاريخ علمًا له منهجٌ ونقد، ثم كيف تحوّل إلى مقدمةٍ تشرح قيام الدول وسقوطها؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eلم يكن التاريخ في الحضارة الإسلامية مجرّد سردٍ للحوادث، بل كان له منهجٌ في الرواية والنقد. فالمؤرخ يبدأ بسند، ثم يذكر الروايات المتعارضة، ثم يُرجّح أو يسكت. وهذا الشكل — السند والمقارنة — هو ما يجعل كتب التاريخ الإسلامي مادةً خامًّا للباحث الحديث، لأنها تحفظ الاختلاف لا تُلغيه. ولهذا نجد في كتب التاريخ الإسلامي صفحاتٍ كاملة تُروى فيها الحادثة الواحدة بثلاث روايات متعارضة، ويُترك للقارئ أن يحكم، وهذا في ذاته موقفٌ منهجي متقدّم في زمانه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان الطبري (توفي سنة ٣١٠هـ) هو مؤسس هذا النمط في «تاريخ الرسل والملوك». وقد بدأ من بدء الخلق، ثم سار سنةً سنة، وذكر في كل حادثةٍ رواياتٍ متعددة بأسانيدها، ولم يُرجّح في كثير من المواضع. وهذا الاختيار جعل كتابه موسوعةً لا رأيًا، وصار مصدرًا لكل من جاء بعده، حتى إن أكثر كتب التاريخ اللاحقة تنقل عنه بلا إشارة. وقد كان الطبري يقول في مقدمة كتابه إنه إنما ينقل ما وصل إليه، وإن العهدة على الرواة لا عليه. وهذه صيغةٌ تُشبه ما نسمّيه اليوم «الإحالة إلى المصدر»، وهي أمانةٌ علمية تستحق التقدير.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان المسعودي (توفي سنة ٣٤٦هـ) مختلفًا: كان رحّالةً وفيلسوفًا، وكتب «مروج الذهب» بأسلوبٍ أدبي، وأدخل في التاريخ الجغرافيا والعادات والعلوم. وكان يرى أن التاريخ ليس حوادث الملوك فقط، بل أحوال الأمم وطبائعها. وهذا النظر قريبٌ من فكرة «الحضارة» بالمعنى الحديث، وإن لم يستعمل المصطلح. وقد كان المسعودي يسأل عن أسباب الاختلاف بين الأمم في العادات والأديان، ويُرجعه إلى الجغرافيا والتاريخ لا إلى الطبع. وهذا نظرٌ مبكر في علم الاجتماع المقارن، ولو لم يُصغ في نظرية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان ابن الأثير (توفي سنة ٦٣٠هـ) مؤرخًا ناقدًا. فقد كتب «الكامل في التاريخ» على نمط الطبري، لكنه كان يُرجّح ويُعلّق ويُصحّح أخطاء من سبقه. وقد شهد زحف المغول وكتب عنه وصفًا مؤثرًا، وهو من أهم المصادر عن تلك الكارثة. وكان يرى أن التاريخ يجب أن يُعلّم لا أن يُسلّي، وأن العبرة في الحوادث لا في تفاصيلها. وقد كان ابن الأثير شديد الحذر في رواية الأرقام، ويقول إن المبالغات في أعداد القتلى والجيوش تُشوّه التاريخ، وإن على المؤرخ أن يُقارب بين الروايات ليصل إلى ما يُعقل. وهذا نقدٌ داخلي مبكر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان ابن خلدون (توفي سنة ٨٠٨هـ) هو القطيعة الكبرى. ففي «المقدمة» لم يكتب تاريخًا بل كتب نظريةً في التاريخ: لماذا تقوم الدول؟ ولماذا تسقط؟ وما دور العصبية؟ وما الفرق بين البداوة والحضارة؟ وقد قال إن التاريخ الظاهر يُخفي باطنًا، وإن المؤرخ يجب أن يحكم على الخبر بالعقل وبقوانين العمران، لا أن ينقله. وهذا الكلام يجعله مؤسسًا لعلم الاجتماع قبل أن يوجد المصطلح.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد صاغ ابن خلدون نظريته في «دورة الدول»: أن الدولة تبدأ بالعصبية والخشونة، ثم تنتقل إلى الملك والحضارة، ثم إلى الترف والانحلال، ثم تُغلب من عصبيةٍ جديدة. وهذه النظرية ليست صحيحةً في كل حالة، لكنها تُفسّر حالاتٍ كثيرة، وهي أول محاولةٍ لوضع قانونٍ للتاريخ لا مجرّد سرد. وقد كان يقول إنه كتب المقدمة لأنه رأى المؤرخين يكرّرون الروايات بلا نقد، فأراد أن يضع «قانونًا» يُعرف به الصحيح من السقيم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان ابن بطوطة (توفي سنة ٧٧٩هـ) يمثّل نمطًا آخر: الرحّالة الذي يكتب ما يرى. وقد طاف ثلاثين سنة في مصر والشام والحجاز والعراق وفارس والهند والصين والسودان، وكتب «تحفة النظار» بلغةٍ حيّة فيها العجيب والغريب. وقد نقد الباحثون بعض ما فيها، لكنها تبقى من أهم مصادر الحياة اليومية في القرن الثامن الهجري، لأنها تصف الناس لا الملوك. وقد وصفت الرحلة أسواقًا وأثمانًا وطرقًا وحمّامات ومطاعم، وذكرت أسماء قضاةٍ ومدرسين، وهي تفاصيل لا تُوجد في كتب السلاطين. ولهذا يقول الباحثون إن تاريخ الحياة اليومية في القرن الثامن الهجري يُكتب من هذه الرحلة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان للمؤرخين في العصور المتأخرة وظيفةٌ سياسية. فبعضهم كان مؤرخًا رسميًّا يكتب لسلطانٍ فيُجمّل صورته، وبعضهم كان معارضًا يكتب من المنفى. ومن هنا تختلف الروايات اختلافًا حادًّا حول الحوادث نفسها. وهذا يعطي الباحث المعاصر درسًا: أن كل تاريخٍ مكتوب هو تاريخٌ من موقع، وأن قراءة المصادر تحتاج إلى سؤال: من كتب؟ ولمن؟ ولماذا الآن؟ وقد كان المؤرخون الرسميون يتقاضون رواتب، وكانوا يكتبون بحسابٍ دقيق لما يُقال وما يُسكت عنه. ولهذا فإن غياب حدثٍ من كتابٍ رسمي ليس دليلًا على أنه لم يقع، بل قد يكون دليلًا على أنه وقع وكان محرجًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالمفارقة أن هذا التراث التاريخي الهائل لم يُستثمر في التعليم العربي الحديث كما ينبغي. فالتاريخ في المدارس صار سردًا للحوادث والتواريخ، لا تدريبًا على نقد الرواية. والكتب القديمة تُقرأ للاستشهاد لا للتحليل. ولهذا يبقى ابن خلدون في المقدمة معروفًا بالاسم ومجهولًا في المنهج، وهذا خسارةٌ كبيرة، لأن أدواته — العصبية، والعمران، ودورة الدول — ما زالت قادرة على تفسير ما يجري اليوم.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالسند: منهجٌ قبل أن يكون علمًا\u003c/h4\u003e\u003cp class=\"ap\"\u003eمنهج السند جاء من علم الحديث، حيث يُشترط اتصال السلسلة وعدالة الرواة. ثم انتقل إلى التاريخ، فصار المؤرخ يذكر سنده كما يذكر الخبر. وهذا أعطى التاريخ الإسلامي ميزةً نادرة: أن يُحفظ الاختلاف لا أن يُلغى، فيستطيع الباحث أن يقارن ويستنتج. وكان هذا المنهج ثمرة علم الحديث، حيث وُضعت قواعد الجرح والتعديل لتمييز الصحيح من الضعيف. ثم انتقلت هذه القواعد إلى التاريخ، فصار المؤرخ يفحص الراوي كما يفحص الخبر، وهذا دقّةٌ لا تُوجد في كثير من التواريخ القديمة.\u003c/p\u003e\u003cp class=\"ap\"\u003eلكن السند وحده لا يكفي، لأن السند يُثبت أن الخبر وصل لا أنه صحيح. ولهذا جاء النقد الداخلي: أن يُقارن الخبر بالواقع والعقل والقوانين. وهذا ما فعله ابن خلدون حين قال إن الخبر إذا خالف طبيعة العمران فلا يُقبل، ولو صحّ سنده. وقد كانت هذه الفكرة جذرية في زمانها: أن يُحكم على الخبر بالعقل، لا بالشهرة ولا بكثرة الناقلين. وقد طبّقها ابن خلدون على أخبار كثيرة، فردّ منها ما يُخالف طبيعة العمران، ولو كان مشهورًا في الكتب.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالمقدمة: أول قانونٍ للتاريخ\u003c/h4\u003e\u003cp class=\"ap\"\u003eالمقدمة ليست مقدمةً لكتاب تاريخ، بل كتابٌ مستقل في أصول العمران. وفيها بحثٌ في البداوة والحضارة، وفي أطوار الدولة، وفي الصنائع والعلوم والأسواق والأموال. وقد كان ابن خلدون يسأل سؤالًا جديدًا: ما القوانين التي تحكم الاجتماع البشري؟ وقد كان سؤاله ينطلق من ملاحظةٍ بسيطة: أن الدول تشبه الأحياء، لها شبابٌ وشيخوخة، وأن أسباب الصعود هي نفسها أسباب الهبوط في كثير من الأحيان. ومن هذه الملاحظة بنى نظريته في العصبية والترف.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد سبق بذلك علم الاجتماع والاقتصاد السياسي بقرون، لكنه لم يُؤسّس مدرسة. والسبب أنه كتب في زمن انهيار، وأن كتابه لم يُدرَّس في المدارس، وأنه لم يجد من يُكمل مشروعه. وهذه مفارقةٌ متكررة: أن يُنتج فكرٌ عظيم في لحظةٍ لا تستطيع
