 أن تحمله. وقد كتب ابن خلدون مقدمته في قلعةٍ في تونس بعد أن اعتزل السياسة، بعد أن كان وزيرًا وسفيرًا وسجينًا. وهذا يعني أن نظريته في الدولة وُلدت من تجربةٍ مباشرة في السلطة، لا من قراءةٍ في الكتب فقط.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eابن بطوطة: التاريخ من الأسفل\u003c/h4\u003e\u003cp class=\"ap\"\u003eأهمية رحلة ابن بطوطة أنها تصف الحياة اليومية: طعام الناس، ولباسهم، وأسواقهم، وأعيادهم، وقضاتهم، وطرق السفر، وأثمان الأشياء. وهذا ما لا تجده في كتب التاريخ الرسمية التي تهتم بالسلاطين والحروب. وقد وصف في رحلته الطعام واللباس والأعياد والحمّامات والأسواق، وذكر أسماء قضاةٍ ومتصوفةٍ وتجار، وسجّل أسعار بعض الأشياء. وهذه التفاصيل هي التي تجعل الرحلة مصدرًا لا حكاية.\u003c/p\u003e\u003cp class=\"ap\"\u003eولهذا صارت الرحلة مصدرًا أساسيًّا للتاريخ الاجتماعي والاقتصادي، لا مجرّد كتابٍ مسلٍّ. وهي تبيّن أن الحضارة الإسلامية كانت عالمًا متصلًا: أن مسافرًا من طنجة يستطيع أن يجد في دلهي قاضيًا يُدرّس المذهب المالكي، وأن يجد في الصين مسلمين لهم مساجدهم وأسواقهم.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eتاريخ الطبري\u003c/b\u003e\u003cspan\u003eروايةٌ بأسانيدها بلا ترجيح، صارت أساسًا لكل تاريخٍ لاحق\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالكامل\u003c/b\u003e\u003cspan\u003eابن الأثير ينتقد ويُرجّح، ويكتب عن زحف المغول\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمقدمة\u003c/b\u003e\u003cspan\u003eابن خلدون يضع قانونًا للعمران ودورة الدول\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالرحلة\u003c/b\u003e\u003cspan\u003eابن بطوطة يوثّق الحياة اليومية في ثلاثين سنة سفر\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمؤرخ\u003c/th\u003e\u003cth\u003eالكتاب\u003c/th\u003e\u003cth\u003eسمته\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالطبري\u003c/td\u003e\u003ctd\u003eتاريخ الرسل والملوك\u003c/td\u003e\u003ctd\u003eسردٌ بالسند بلا ترجيح\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمسعودي\u003c/td\u003e\u003ctd\u003eمروج الذهب\u003c/td\u003e\u003ctd\u003eتاريخٌ مع الجغرافيا والعادات\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eابن الأثير\u003c/td\u003e\u003ctd\u003eالكامل في التاريخ\u003c/td\u003e\u003ctd\u003eنقدٌ وترجيحٌ ووعيٌ بالعبرة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eابن خلدون\u003c/td\u003e\u003ctd\u003eالمقدمة\u003c/td\u003e\u003ctd\u003eنظريةٌ في قيام الدول وسقوطها\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eابن بطوطة\u003c/td\u003e\u003ctd\u003eتحفة النظار\u003c/td\u003e\u003ctd\u003eتاريخٌ اجتماعي من أسفل\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003e«التاريخ خبرٌ عن الاجتماع الإنساني، وهو خبرٌ يُحتاج فيه إلى النظر والتحقيق لا إلى النقل»\u003c/p\u003e\u003ccite\u003eابن خلدون، المقدمة (بالمعنى)\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eبدأ التاريخ بالسند ثم صار نقدًا. الطبري حفظ الروايات، وابن الأثير رجّح وصحّح، وابن خلدون نقل التاريخ من السرد إلى القانون. وابن بطوطة كتب الحياة اليومية لا حياة السلاطين. وهذا التراث ما زال قادرًا على تعليمنا، لكنه يُقرأ للاستشهاد لا للتحليل.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-3","n":"القسم الثالث: الفنون","ic":"🎨","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-3\" style=\"--c:#6A3D9A\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🎨\u003c/div\u003e\n      \u003ch2\u003eالقسم الثالث: الفنون\u003c/h2\u003e\n      \u003cp\u003eالحضارة تُعرف بما تبنيه وبما تكتبه وبما تُغنّيه. هذا القسم يقرأ العمارة والزخرفة، والخطّ والكتاب، والموسيقى والأدب، والصناعات التي صارت فنًّا: أربعة أبوابٍ يدخل منها القارئ إلى جمال هذه الحضارة.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#architecture\"\u003eالعمارة والزخرفة\u003c/a\u003e\u003ca href=\"#calligraphy-book\"\u003eالخط العربي والكتاب\u003c/a\u003e\u003ca href=\"#music-literature\"\u003eالموسيقى والأدب\u003c/a\u003e\u003ca href=\"#crafts\"\u003eالصناعات والفنون التطبيقية\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"architecture","n":"العمارة والزخرفة","ic":"🕌","part":"القسم الثالث: الفنون","h":"\u003carticle class=\"ch3\" id=\"architecture\" data-toc=\"العمارة والزخرفة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الثالث: الفنون\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ١ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٣\u003ci\u003e.\u003c/i\u003e١\u003c/span\u003e\n            \u003ch3\u003eالعمارة والزخرفة\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eمن قبة الصخرة إلى قصر الحمراء: كيف صاغت الحضارة الإسلامية مكانًا يُصلّى فيه ويُحكم فيه ويُتعلّم فيه، بلغةٍ بصرية واحدة تتنوّع بتنوّع الأقاليم؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eالعمارة الإسلامية بدأت من حاجةٍ بسيطة: مكانٌ يجتمع فيه الناس للصلاة. وكان المسجد الأول في المدينة صحنًا محاطًا بجذوع نخيل، لا قبةً ولا مئذنة ولا زخرفة. ثم تحوّل هذا المكان البسيط إلى أعظم برنامجٍ معماري في التاريخ، لأن المسجد لم يبقَ مكان صلاة فقط بل صار مركز المدينة: فيه يُعلَّم، ويُقضى، ويُجمع المال، ويُستقبل الوفد، ويُحتمى بالغريب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد استعار المسلمون من الحضارات التي فتحوا بلادها: من البيزنطيين القبة والفسيفساء، ومن الفرس الإيوان والطاق، ومن الأقباط والروم الأعمدة والتيجان. لكنهم لم ينقلوا نقلًا حرفيًّا، بل أعادوا تركيب هذه العناصر في نظامٍ جديد. فأصبح المسجد في دمشق وبغداد والقيروان وقرطبة نوعًا معماريًّا له قواعده: صحنٌ مكشوف، وظلالٌ تحيط به، وقبلةٌ تُشعرك بالاتجاه، وزخرفةٌ لا تُشغل عن الصلاة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت القبة هي العنصر الأهم في هذه اللغة. فالقبة تُشير إلى السماء بلا صورة، وتُغطي أكبر فراغ بأقل مادة، وتُعطي المكان مركزًا بصريًّا واحدًا. وقد تطوّرت هندستها من قبة الصخرة إلى قبة قرطبة إلى قباب السلاجقة إلى قبة السليمية. وكل تطوّر كان يحلّ مشكلةً هندسية: كيف تُحمل قبةٌ كبيرة على جدرانٍ رقيقة؟ وكيف تُوزّع الأحمال؟ وكيف يدخل الضوء؟\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت المئذنة هي العنصر الثاني. فالأذان يحتاج ارتفاعًا، والارتفاع يحتاج برجًا، والبرج صار علامةً على المدينة. وقد اختلفت أشكالها اختلافًا هائلًا: مربّعة في المغرب والأندلس، وأسطوانية في العراق وإيران، ونحيلة متعددة الشرفات في مصر والشام، وقلمية رفيعة في الدولة العثمانية. ولهذا يمكن للباحث أن يعرف من أين جاء المسجد من شكل مئذنته قبل أن يقرأ لوحته.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت الزخرفة عالَمًا قائمًا بذاته. فالإسلام لم يُشجّع تصوير الكائنات الحيّة في المساجد، فتحوّل الفنّان إلى البديل: الهندسة والنبات والخط. فظهر «الأرابيسك» وهو تعشيقٌ نباتي لا نهائي، وظهرت «المقرنصات» وهي حلّ هندسي لتحويل المربع إلى دائرة، وظهرت الفسيفساء والجصّ المنقوش والخزف الملوّن والرخام المطعّم. وكانت هذه الزخرفة تُغطّي كل سطحٍ متاح، لأن الفراغ في هذا الفنّ يُعدّ نقصًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان القصر مجالًا آخر للتعبير. فقصر الحمراء في غرناطة بُني على فكرةٍ مختلفة عن المسجد: بركٌ وحدائق ونوافير وأقواس، وشعرٌ منقوش على الجدران، وضوءٌ يتغيّر مع ساعات النهار. وقد قيل إنه «قصرٌ يشرح نفسه بنفسه»، لأن كل جدارٍ فيه يحمل قصيدة. وكان هذا القصر هو الذروة الجمالية للأندلس، وآخر ما بقي منها بعد سقوطها. وتظلّ هذه العلاقة بين الفن والسياسة نموذجًا لكل حضارة تبني مدنها على قيمةٍ جماليةٍ لا تُقاس بالحجم فقط.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت المدارس والخانات والحمّامات جزءًا من هذه اللغة. فالمدرسة نظّمت التعليم في مكانٍ واحد، والخان استقبل التجار والمسافرين، والحمّام جمع النظافة والاجتماع. وكانت هذه المباني تُبنى بأوقافٍ، ولهذا كانت منتشرةً في المدن انتشارًا كبيرًا، وكانت تُصمَّم لتكون قريبةً من الجامع والسوق، فتتشكّل بذلك شبكة المدينة الإسلامية. وبهذا تتكامل البنية التحتية للمدينة مع بُعدها الروحي، فلا يُنظر إلى الشارع كمجرّد طريق بل كمسارٍ نحو المعنى.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت المواد والعمالة تحدّد الشكل بقدر ما يحدّده الذوق. فالطوب في العراق وإيران لأن الحجر قليل، والحجر الجيري في مصر والشام، والرخام في البلقان، والطين والجصّ في المغرب. ولهذا نجد أن القباب العراقية من الطوب، وأن قباب الأندلس من الحجر، وأن قباب العثمانيين من الحجر والرصاص. وهذا يعني أن العمارة الإسلامية ليست طرازًا واحدًا بل عائلةً من الطرازات تشترك في الروح وتختلف في المادة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالمؤرخ المعماري اليوم يقف أمام هذا التراث بمنهجٍ مزدوج: يقرأ الوثيقة والوقف ليُحدّد من بنى ومتى وبكم، ويقرأ المبنى نفسه ليُحدّد كيف بُني ولماذا. وقد كشفت الدراسات أن كثيرًا من المباني التي نُسبت إلى سلاطين كانت في الحقيقة من تمويل نساءٍ ووزراء وتجار، وأن الأوقاف كانت تُحدّد تفاصيل البناء حتى ألوان الطلاء. وهذا يُظهر أن العمارة في هذه الحضارة كانت مشروعًا اجتماعيًّا لا ترفًا فرديًّا.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالمسجد: من الصحن إلى القبة\u003c/h4\u003e\u003cp class=\"ap\"\u003eأول مسجدٍ في المدينة كان صحنًا بسيطًا، ثم تطوّر إلى «مسجد الجامع» وهو المسجد الذي تُقام فيه الجمعة ويجتمع فيه أهل المدينة. وكان هذا المسجد هو مركز الحياة العامة، ولهذا كان يُبنى في قلب المدينة، وتُبنى حوله الأسواق والمدارس ودور القضاء. وبهذه المراحل صار المسجد ليس مجرد مكان للصلاة، بل مركزًا حضاريًّا يجمع العلم والتجارة والقضاء والاجتماع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد تطوّرت خطته من «الصحن والظلال» في الأمصار الأولى إلى «القبة والإيوان» في العصر العباسي والسلجوقي، ثم إلى «القبة المركزية» في العهد العثماني. وكل شكل كان يعبّر عن مفهومٍ مختلف للجماعة: صفوفٌ متوازية في الأول، وأربعة إيوانات في الثاني، وفراغٌ واحد تحت قبة في الثالث.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالمقرنص: حلٌّ هندسي صار زينة\u003c/h4\u003e\u003cp class=\"ap\"\u003eالمقرنصات هي ذلك التعشيق المتدرّج الذي يملأ الزوايا في القباب والمآذن والأبواب. وقد وُلدت لحلّ مشكلةٍ هندسية: كيف ننتقل من قاعدةٍ مربّعة إلى قبةٍ دائرية بلا فراغٍ ميت؟ فابتكر المعماريون صفوفًا من الخلايا المتدرّجة تُغطّي الانتقال. وما زالت هذه التقنية شاهدةً على قدرة المهندسين الإسلاميين على حلّ مشكلات بنائية معقّدة بأدوات هندسية متواضعة.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم صارت هذه الحلّة زينةً في ذاتها، فاستُعملت في الأبواب والمحاريب والواجهات، وتنوّعت من بلدٍ إلى بلد. وهذا مثالٌ واضح على أن الزخرفة في هذه الحضارة لم تكن تُضاف بعد البناء، بل كانت تُولد من إنشاء المبنى نفسه، وهذا هو الفرق بين زخرفةٍ تحمل معنى وزخرفةٍ تُخفي عيبًا.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالأندلس والمغرب: لغةٌ أخرى\u003c/h4\u003e\u003cp class=\"ap\"\u003eالعمارة في الغرب الإسلامي لها شخصيةٌ مختلفة: واجهاتٌ بسيطة من الخارج، وفراغاتٌ غنية من الداخل، وحدائق وبرك، وأقواسٌ حدوية، وزخرفةٌ من الجصّ المنقوش والزليج. والسبب أن المدن هناك كانت مكتظّة، فلم يكن للمبنى أن يظهر من الخارج، فانتقل الجمال إلى الداخل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقصر الحمراء هو النموذج الأكمل: من خارجه قلعةٌ حمراء لا تُغري، ومن داخله قصورٌ من ضوءٍ وماء وشعر. وهذه المفارقة بين الخارج والداخل هي في نظر بعض الباحثين تعبيرٌ عن حياةٍ في ظلّ حدودٍ ضيقة، يُعوّض فيها الداخل ما مُنع في الخارج. ومن هنا تظهر العلاقة الوثيقة بين الطبيعة والبناء في الفن الإسلامي، حيث لا يُفرّق الجمالي عن الوظيفي.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالقبة\u003c/b\u003e\u003cspan\u003eتغطية أكبر فراغ بأقل مادة، ورمزٌ للسماء بلا صورة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمئذنة\u003c/b\u003e\u003cspan\u003eبرجٌ للأذان صار علامةً على المدينة، وأشكاله تدلّ على إقليمه\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالأرابيسك\u003c/b\u003e\u003cspan\u003eتعشيقٌ نباتي لا نهائي، بديلٌ عن تصوير الكائنات\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالحمراء\u003c/b\u003e\u003cspan\u003eقصرٌ تُكتب عليه القصائد، وذروة الجمال الأندلسي\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالطراز\u003c/th\u003e\u003cth\u003eالسمة\u003c/th\u003e\u003cth\u003eمثاله\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالأموي\u003c/td\u003e\u003ctd\u003eفسيفساء ومساحات واسعة\u003c/td\u003e\u003ctd\u003eالجامع الأموي في دمشق\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالعباسي\u003c/td\u003e\u003ctd\u003eطوبٌ وزخرفةٌ جصية\u003c/td\u003e\u003ctd\u003eمسجد سامراء الملويّة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالسلجوقي\u003c/td\u003e\u003ctd\u003eإيواناتٌ وقبابٌ مخروطية\u003c/td\u003e\u003ctd\u003eالمساجد الجامعة في إصفهان\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمملوكي\u003c/td\u003e\u003ctd\u003eحجرٌ منقوشٌ ومآذن متعددة الشرفات\u003c/td\u003e\u003ctd\u003eمساجد القاهرة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالعثماني\u003c/td\u003e\u003ctd\u003eقبةٌ مركزية ومآذن قلمية\u003c/td\u003e\u003ctd\u003eالسليمانية والسليمية\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003e«العمارة هي ديوان الأمة المرئي، تكتب فيه ما لا تقدر أن تقوله»\u003c/p\u003e\u003ccite\u003eمن مقدمة دراسة عربية حديثة في العمارة الإسلامية\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eبدأت العمارة من صحنٍ بسيط ثم صارت لغةً كاملة: قبةٌ ومئذنة وصحنٌ وزخرفة. واستعارت الحضارة من جيرانها ثم أعادت تركيب العناصر في نظامٍ جديد، وتنوّعت الطرازات بتنوّع المواد والأقاليم. والزخرفة فيها لم تكن تُضاف بل تُولد من الإنشاء، وهذا سرّ تماسكها.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"calligraphy-book","n":"الخط العربي والكتاب","ic":"✒️","part":"القسم الثالث: الفنون","h":"\u003carticle class=\"ch3\" id=\"calligraphy-book\" data-toc=\"الخط العربي والكتاب\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الثالث: الفنون\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٢ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٣\u003ci\u003e.\u003c/i\u003e٢\u003c/span\u003e\n            \u003ch3\u003eالخط العربي والكتاب\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eكيف صار الخطّ فنًّا أعلى من التصوير، والكتاب تحفةً تُنسخ وتُذهَّب وتُوقَّف؟ هذا الفصل يقرأ الحضارة من صفحةٍ مخطوطة.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eالخطّ في الحضارة الإسلامية لم يكن وسيلة تسجيل فقط، بل كان فنًّا قائمًا بذاته. والسبب أن الزخرفة الإسلامية تجنّبت تصوير الكائنات في الفضاء الديني، فانتقلت الطاقة الجمالية إلى الحرف. فصار الخطّ يُزيّن المحاريب والقباب والأبواب والمنابر، وصار الخطّاط من أعلى الطبقات الفنية مكانةً، حتى قيل «الخطّ هندسةٌ روحانية». وقد صار الخطّ لذلك أكثر من كتابة: هو تجسيدٌ للنظام الكوني الذي يؤمن به المسلمون، حيث يتناغم الشكل مع المعنى في وحدةٍ لا تتجزأ.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان الخطّ الكوفي هو الأول: خطٌّ هندسي مستقيم الزوايا، يُناسب النقش على الحجر والرخام والزجاج، وله أنواعٌ كثيرة: كوفيٌّ بسيط، ومورّق، ومشجّر، ومضفّر. وكان يُستعمل في المصاحف الأولى وفي النقوش المعمارية. ثم ظهرت الخطوط اللينة، لأن الكوفي لم يكن مناسبًا لكتابة النصوص الطويلة بسرعة، فظهر النسخ والثلث والرقعة والديواني. ومع ظهور هذه الأنواع، تنوّعت الاستخدامات من المصاحف إلى المراسلات الرسمية، ومن المخطوطات العلمية إلى الدواوين الأدبية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان ابن البواب (توفي سنة ٤١٣هـ) نقطة تحوّل في هذا الفن. فقد وضع قواعد للخطّ الثلث والنسخ، وربط بين الهندسة والحرف، وأعطى الخطّ نظامًا يمكن تعليمه لا موهبةً فردية. ثم جاء ياقوت المستعصمي (توفي سنة ٦٩٨هـ) فبلغ بالخطّ ذروته، وصار مرجعًا لكل من جاء بعده، حتى إن الخطّاطين يقولون إن «الخطّ انتهى إلى ياقوت». وقد احتفظ الخطّ الإسلامي بهذه المكانة حتى اليوم، فهو يُدرَّس في المعاهد ويُستخدم في العمارة والتصميم الحديث.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان الكتاب في هذه الحضارة تحفةً كاملة. فالورق يُصنع ويُلوَّن ويُصقل، والخطّ يُكتب بقلمٍ من القصب يُبرى بزاويةٍ معيّنة، والحبر يُصنع من العفص والصمغ، والزخرفة تُذهَّب بأوراق الذهب، والتجليد يُصنع من الجلد المضغوط بزخارف هندسية. وكانت الصفحة الأولى «السرلوح» تُزيَّن بالألوان والذهب، وكانت علامات الأحزاب والفواصل تُرسم بدقّة. وبهذا أصبحت تلك العلامات لغةً بصريةً تُكمل النص وتجعل القراءة تجربةً جماليةً لا مجرّد استقبال معلومات.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت صناعة الورق هي الثورة الصامتة. فقد انتقلت من الصين إلى سمرقند في القرن الثاني الهجري، ثم إلى بغداد ودمشق والقاهرة وفاس والأندلس. والورق كان أرخص من الرقّ وأسهل في الصنع، وهذا يعني أن الكتب صارت أكثر وأرخص، وأن عدد القرّاء زاد، وأن المكتبات كبرت. فالتقنية الصغيرة — ورقة رخيصة — غيّرت تاريخ العلم كله. فالورق ليس خلفيةً للكتابة بل هو أداة للتفكير، فقد سمح للعلماء بالمراجعة والتصحيح والتعليق، مما خلق ثقافةً نقديةً جديدةً.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت المكتبات مؤسسةً في هذه الحضارة. فدار الحكمة في بغداد، ومكتبة الحكم المستنصر في قرطبة التي قيل إنها ضمّت مئات الآلاف من المجلدات، ومكتبات المساجد والمدارس والزوايا، وكانت تُعير الكتب وتُنسخ. وكان النسخ مهنةً لها ورّاقون، وكان الورّاق ينسخ ويبيع ويصحّح ويُترجم أحيانًا. وهذا يعني أن الكتاب كان سلعةً ووسيلة علمٍ في الوقت نفسه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان المصحف أعلى تجلٍّ لهذا الفن. فالمصحف يُنسخ بخطٍّ فخم، ويُذهَّب، ويُجلَّد، ويُوقف على مسجد. وكانت المصاحف الكبرى تُكتب في سنوات، وتُزيَّن بزخارف لا تتكرر. وهذا يعني أن المجتمع كان يضخّ موارد كبيرة في الكتاب لا في البناء فقط، وأن الكتاب كان رمزًا للهوية كما هو أداةً للمعرفة. وفي هذا يتجاوز الكتاب حدود المادة ليصير رمز هويةٍ يجمع بين المعرفة والانتماء والجمال في آنٍ واحد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالمفارقة الكبرى أن هذه الحضارة التي بلغت في الكتاب ذروته لم تدخل عصر الطباعة إلا متأخرة جدًّا. فقد ظهرت المطبعة في أوروبا في القرن الخامس عشر، ودخلت الدولة العثمانية في القرن الثامن عشر، وقاومها بعض العلماء خوفًا من تحريف المصاحف ومن فقدان هيبة الخطّ. والنتيجة أن الكتاب بقي نادرًا وغاليًا، وأن المعرفة بقيت محصورةً في طبقةٍ تقدر على الاقتناء. وهذا التأخر يُعدّ اليوم أحد أكبر أسباب التراجع العلمي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوإذا أردنا أن نقرأ هذا الإرث، فإن أهم درس فيه أن الفنّ لا يُقاس بحجمه بل بدقّته. فصفحةٌ واحدة من مصحفٍ مملوكي تحمل من الهندسة والصبر ما لا تحمله لوحةٌ كبيرة. وهذا يبيّن أن الحضارة الإسلامية عبّرت عن نفسها في التفاصيل الصغيرة بقدر ما عبّرت في القباب الكبيرة، وأن من يريد أن يفهمها يجب أن ينظر إلى الورق كما ينظر إلى الحجر. وقد أثبتت التجربة الإسلامية أن الورق كان أساسًا لثورةٍ معرفيةٍ لا تقلّ أهميةً عن اختراع الحروف المطبعية فيما بعد.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eلماذا صار الخطّ فنًّا؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eلأن الخطّ في هذه الحضارة كان يحمل كلام الله، فاكتسب حرمةً جمالية. ولم يكن مسموحًا أن يُكتب النصّ بأي شكل، بل كان الشكل نفسه جزءًا من التعظيم. ولهذا تنافس الخطّاطون في تجويد الحرف كما يتنافس المقرئون في تجويد الصوت. وبذلك تحوّل الكتابة من وظيفة إلى فنّ، وصار الخطّاط قائدًا بصريًا يُوجّه عين القارئ عبر الصفحة بإيقاعٍ موسيقيٍّ.\u003c/p\u003e\u003cp class=\"ap\"\u003eوهناك سببٌ ثانٍ: أن الزخرفة النباتية والهندسية كانت قادرة على ملء الفراغ، لكنها لم تكن تحمل معنى. والخطّ كان الشكل الوحيد الذي يجمع الجمال والمعنى في وقتٍ واحد، فصار هو العنصر الذي يربط الزخرفة بالنصّ. وهكذا صار الخطّ ليس زينةً جانبيةً بل عنصرًا مركزيًّا في التصميم الإسلامي، يتساوى مع الزخرفة الهندسية والنباتية.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالورق: تقنيةٌ غيّرت التاريخ\u003c/h4\u003e\u003cp class=\"ap\"\u003eقبل الورق كان الكتاب يُكتب على الرقّ وهو جلد الحيوان، أو على البردي. والرقّ غالٍ وثقيل، والبردي لا يعيش طويلًا في الأقاليم الرطبة. فكان الكتاب نادرًا، والمكتبة الصغيرة ثروةً. ثم جاء الورق فغيّر المعادلة كلها. وقد أدّى هذا التغيير إلى ظهور مكتباتٍ ضخمةٍ ومدارس علميةٍ وحركة ترجمةٍ لم تكن ممكنةً على الرق أو الجلد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد انتقلت صناعته إلى سمرقند ثم إلى بغداد، فظهرت مصانع ورقٍ في المدن الكبرى. ومع رخص الورق ظهر الورّاقون، وكثرت الكتب، واتسعت المدارس، وكبرت المكتبات. وهذا يبيّن أن بعض التحولات الكبرى في تاريخ العلم لا تبدأ من فكرةٍ بل من مادة. وبهذا يصير الورق مثالًا واضحًا على كيف يمكن لتقنيةٍ بسيطةٍ أن تُغيّر مسار الحضارة بأكملها من خلال تقليل كلفة المعرفة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالتذهيب والتجليد\u003c/h4\u003e\u003cp class=\"ap\"\u003eالتذهيب هو فنّ تزيين الصفحات بأوراق الذهب واللازورد، وكان يُستعمل في المصاحف والكتب السلطانية. والتجليد هو فنّ آخر: جلدٌ يُضغط بزخارف هندسية، وأحيانًا يُطعَّم بالذهب أو بالجلد الملوّن. وكانت هذه الفنون تُمارَس في ورشٍ ملحقة بالبلاط أو بالمساجد. وما زالت هذه الكتب تُعرض في المتاحف شواهد على مدى الاهتمام الذي أُولي للمعرفة في الحضارة الإسلامية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأهمية هذه الفنون أنها تُظهر أن الكتاب كان يُعامل كقطعةٍ فنية لا كوعاء معلومات. وهذا يعني أن المجتمع كان يرى في المعرفة قيمةً جمالية، وأن حفظها كان يستحقّ التكلّف. وهذه النظرة هي ما جعل تراثًا بهذا الحجم يصل إلينا. فالتذهيب ليس ترفًا بل تأكيدٌ على أن المعرفة تستحقّ أرقى ما يمكن أن يُبدعه الإنسان من جمالٍ ودقةٍ وصبر.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالكوفي\u003c/b\u003e\u003cspan\u003eخطٌّ هندسي للنقوش والمصاحف الأولى، وله أنواعٌ كثيرة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eابن البواب\u003c/b\u003e\u003cspan\u003eوضع قواعد الثلث والنسخ، فصار الخطّ قابلًا للتعليم\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالورق\u003c/b\u003e\u003cspan\u003eتقنيةٌ رخيصة غيّرت حجم الكتب وعدد القرّاء\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالتذهيب\u003c/b\u003e\u003cspan\u003eالصفحة كتحفة: ذهبٌ ولازورد وجلدٌ مضغوط\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالخط\u003c/th\u003e\u003cth\u003eالاستعمال\u003c/th\u003e\u003cth\u003eسمته\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالكوفي\u003c/td\u003e\u003ctd\u003eالنقوش والمصاحف الأولى\u003c/td\u003e\u003ctd\u003eزوايا مستقيمة وهندسة صارمة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالنسخ\u003c/td\u003e\u003ctd\u003eنسخ الكتب والمصاحف\u003c/td\u003e\u003ctd\u003eوضوحٌ وسرعةٌ في الكتابة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالثلث\u003c/td\u003e\u003ctd\u003eالعناوين والزخارف\u003c/td\u003e\u003ctd\u003eمرونةٌ وفخامة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالديواني\u003c/td\u003e\u003ctd\u003eالوثائق الرسمية العثمانية\u003c/td\u003e\u003ctd\u003eانسيابٌ وزخرفة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمغربي\u003c/td\u003e\u003ctd\u003eمصاحف الغرب الإسلامي\u003c/td\u003e\u003ctd\u003eحروفٌ مستديرة ومسافاتٌ واسعة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003e«الخطّ هندسةٌ روحانية، تظهر بالآلة الجسمانية»\u003c/p\u003e\u003ccite\u003eمن أقوال الخطّاطين في تعريف صناعتهم\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eصار الخطّ فنًّا لأن الزخرفة الدينية تجنّبت التصوير، ولأنه الشكل الوحيد الذي يجمع الجمال والمعنى. وقد تطوّر من الكوفي إلى النسخ والثلث، وقنّنه ابن البواب وياقوت. والورق غيّر حجم المعرفة، والتذهيب جعل الكتاب تحفة. أما تأخر الطباعة فكان أحد أسباب التراجع.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"music-literature","n":"الموسيقى والأدب","ic":"🎼","part":"القسم الثالث: الفنون","h":"\u003carticle class=\"ch3\" id=\"music-literature\" data-toc=\"الموسيقى والأدب\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الثالث: الفنون\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٣ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٣\u003ci\u003e.\u003c/i\u003e٣\u003c/span\u003e\n            \u003ch3\u003eالموسيقى والأدب\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eبين المتنبي والمثنوي وألف ليلة وليلة: كيف عبّرت هذه الحضارة عن نفسها بالصوت والكلمة، وما الذي بقي من ذلك في أذننا اليوم؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eالموسيقى في الحضارة الإسلامية كانت علمًا وفنًّا في الوقت نفسه. أما العلم فله نظرية في النغم والإيقاع، وأما الفنّ فله أداءٌ ومجالس وآلات. وقد كتب الفارابي «الموسيقى الكبير» وهو من أهم كتب النظري الموسيقي في التاريخ، وفيه بحثٌ في الأصوات والنغم والأجناس والإيقاعات، وشرحٌ للآلات. وكان يرى أن الموسيقى تُؤثر في النفس، وأن لها وظيفةً في العلاج والتربية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت «المقامات» هي النظام الذي يقوم عليه هذا الفن. فالمقام سلسلةٌ من النغمات لها مسارٌ وذوقٌ خاص، ولكل مقام انطباعٌ نفسي مختلف. وقد انتقل هذا النظام إلى الموسيقى التركية والفارسية واليونانية، وبقي حيًّا في الموسيقى العربية إلى اليوم. وهذا يعني أن النظرية الموسيقية الإسلامية لم تندثر بل انتقلت وتحوّلت. وبهذا لم تكن الموسيقى مجرد تسلية، بل لغةً تاريخيةً تحمل ذاكرةً مشتركةً بين الشرق والغرب عبر القرون.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت الآلات جزءًا من هذا العالم: العود سيّد الآلات، والقانون، والناي، والرباب، والدفّ، والصنج. وكانت مجالس الطرب في القصور والأسواق، وكان المغني يُسمّى «المغنّي» وله مكانةٌ عند الخلفاء. وقد كانت هناك نقاشاتٌ فقهية حول السماع، وبين من يُجيزه بشروط ومن يمنعه، وهذا الجدل نفسه يدل على أن الموسيقى كانت حاضرةً بقوة في الحياة. وقد أثّرت هذه الممارسات الموسيقية في تطوير النظرية الموسيقية الأوروبية لاحقًا، خاصةً في الأندلس والمشرق.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما الأدب فهو أوسع باب في هذه الحضارة. فالشعر العربي بلغ ذروته في العصر العباسي مع أبي نواس في الخمر والمجون، والمتنبي في الحكمة والفخر، وأبي العلاء المعري في الفلسفة والتشاؤم. وكانت القصيدة تُحفظ وتُروى وتُتعلَّم، وكان الشاعر يُقاس بمكانته عند الخليفة. وقد صار الشعر ديوان العرب كما قيل، أي أرشيفهم في القيم والتاريخ والعادات. ومن هنا يمكن فهم لماذا كان الشاعر في الإسلام أكثر من كاتب قصائد: كان مؤرّخًا وفيلسوفًا وسياسيًا في آنٍ واحد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان النثر أيضًا عظيمًا. فالجاحظ كتب في «الحيوان» و«البيان والتبيين» بلغةٍ ساخرةٍ عالمة، والحريري كتب «المقامات» بلغةٍ صعبةٍ بديعة، وابن المقفع ترجم «كليلة ودمنة» بأسلوبٍ عربيٍّ خالص. وكان النثر أداةً للعلم والأدب والترجمة، وكان الكاتب يُسمّى «الكاتب» وله مرتبةٌ في الدولة أعلى من الشاعر في كثير من الأحيان. وقد أثّر هذا التمييز في بناء صورةٍ للشاعر كسلطةٍ ثقافيةٍ تتجاوز حدود المهنة إلى حدود التأثير الاجتماعي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت «ألف ليلة وليلة» عالمًا آخر. فهي مجموعة قصص شعبية تراكمت عبر قرون، وفيها الهند وفارس والعراق ومصر، وفيها الجنّ والملوك والتجار. وقد كانت تُروى في المقاهي والأسواق، ولذلك كانت لغةً بسيطةً لا لغة النخبة. وقد تُرجمت إلى الفرنسية في القرن الثامن عشر فغيّرت صورة الشرق في أوروبا، وأثّرت في الأدب العالمي كله. ولم يقتصر هذا التأثير على النقل الأدبي، بل شمل أيضًا أساليب السرد والحوار والتكييف الثقافي للقصص المستوردة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان للأدب الفارسي والتركي حضورٌ موازٍ. فالفردوسي كتب «الشاهنامه» في ستين ألف بيت، والرومي كتب «المثنوي»، وسعدي وحافظ كتبا الغزل والحكمة، ونظامي كتب «خمسة» في الحبّ والملاحم. وفي التركية العثمانية كان «الديوان» نمطًا شعريًّا راقيًا، وكان الشعراء يتنافسون في المدائح والغزل. وهذا يعني أن الحضارة الإسلامية كانت متعددة اللغات أدبيًّا، لا لغةً واحدة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان للأدب وظيفة اجتماعية. فالشاعر يمدح فيُعطى، ويهجو فيُخاف، ويرثي فيُبكى. وكانت القصيدة تُستعمل في السياسة: مدحُ سلطانٍ شرعيةٌ، وهجاءُ وزيرٍ سهمٌ. وكان الأدب أيضًا نقدًا: فالجاحظ يسخر من البخلاء، والمعري يسخر من التكفير، وأبو نواس يسخر من الزهد المزيف. وهذا يعني أن الأدب كان مساحة حريةٍ في مجتمعٍ محدود. وبهذا يصير الأدب مساحةً للتفكير النقدي والاجتهاد، لا مجرّد تكرارٍ للمألوف أو تبجيلٍ للسلطة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالمؤرخ الأدبي اليوم يقرأ هذا التراث بمنهجٍ مزدوج: يقرأ النصّ لجماله، ويقرأ سياقه لمعناه. فالقصيدة التي تبدو غزلًا قد تكون سياسة، والرسالة التي تبدو نصيحةً قد تكون تهديدًا. وهذا يبيّن أن الأدب في هذه الحضارة لم يكن ترفًا بل كان لغةً ثانية للحياة العامة، وأن من يقرأه بلا سياقه يقرأ نصفه فقط. وقد صارت «ألف ليلة» نموذجًا لكيف يمكن للأدب الشعبي أن يحمل فكرًا عميقًا بلباسٍ ترفيهيٍّ لا يُرهق القارئ.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالمقام: نظريةٌ في التأثير\u003c/h4\u003e\u003cp class=\"ap\"\u003eالمقام ليس سلّمًا موسيقيًّا فقط، بل مسارٌ له بدايةٌ وصعودٌ وقرار. ولكل مقام ذوقٌ خاص: بعضها فرح، وبعضها حزن، وبعضها وقار. وقد وصف الفارابي هذه الأنواع وربطها بالحالات النفسية، وهو ما يُشبه اليوم فكرة «الطابع الموسيقي». وبهذا يصير المقام نظامًا موسيقيًا كاملًا يحمل فلسفةً في العلاقة بين الصوت والنفس والوجود.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد انتقل نظام المقامات إلى الموسيقى التركية والفارسية واليونانية، وبقي في الموسيقى العربية أساسًا للتأليف. وهذا يبيّن أن النظرية الموسيقية الإسلامية لم تكن ترفًا فكريًّا بل كانت نظامًا عمليًّا يُؤدّى ويُدرَّس، وأن تأثيرها تجاوز حدود اللغة والدين. وقد ترك هذا النظام أثرًا واضحًا في الموسيقى العالمية، حيث تُشبه نظرياته الموسيقية الحديثة في التحليل النفسي للألحان.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالمتنبي: الشعر كسلطة\u003c/h4\u003e\u003cp class=\"ap\"\u003eالمتنبي حالةٌ نادرة في تاريخ الشعر: رجلٌ صنع من الكلمة سلطةً، فمدح فصار ممدوحوه أكبر، وهجا فصار مهجوّوه أصغر. وقد عاش في القرن الرابع الهجري في بلاطات الشام والعراق وفارس، وجرّب السياسة فخسر، وبقي شعره. وبهذا يبقى شعره حاضرًا في الذاكرة العربية، ليس فقط كأدب بل كأرشيفٍ للصراعات والآمال التي عاشها العصر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأهمية المتنبي أنه رفع الشعر من الوصف إلى الحكمة. فأبياته في النفس والحياة والموت تُقرأ اليوم كما قُرئت قبل ألف سنة، وهذا يعني أن بعض الشعر لا يتقادم لأنه يتكلّم عن الإنسان لا عن حدثه. ولهذا بقي المتنبي أكثر شاعرٍ يُستشهد به في العربية. ومن هنا يمكن فهم لماذا صار المتنبي أكثر شاعرٍ يُدرَّس ويُحفظ ويُستشهد به في الثقافة العربية حتى اليوم.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eألف ليلة: الأدب من الأسفل\u003c/h4\u003e\u003cp class=\"ap\"\u003eألف ليلة وليلة ليست كتابًا واحدًا بل طبقاتٌ تراكمت: نواةٌ فارسية، ثم حكاياتٌ عراقية ومصرية، ثم إضافاتٌ متأخرة. ولهذا تختلف نسخها اختلافًا كبيرًا، وهذا الاختلاف نفسه دليلٌ على أنها كانت تُروى لا تُقرأ، وأن كل راوٍ كان يُضيف ويحذف. وهذا التنوّع في الأساليب والمصادر هو ما جعل «ألف ليلة» أثرًا حضاريًا لا مجرّد كتابٍ للتسلية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد صارت الكتاب أشهر كتابٍ عربي في العالم بعد ترجمته، لكن شهرته في أوروبا بُنيت على ترجمةٍ منقّحة حذفت كثيرًا وأضافت كثيرًا. وهذا يبيّن أن صورة الشرق في الغرب تشكّلت جزئيًّا من نصٍّ مُعاد الصياغة، وأن الأدب يمكن أن يصنع صورةً سياسيةً لا مجرّد متعة. وقد أثبتت هذه القصص أن الأدب الشعبي يمكن أن يكون أداةً سياسيةً وفكريةً قويةً عندما يحمل رسالةً عميقةً بأسلوبٍ شائق.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالموسيقى الكبير\u003c/b\u003e\u003cspan\u003eالفارابي يؤسس نظرية النغم والإيقاع وتأثير الموسيقى في النفس\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمقام\u003c/b\u003e\u003cspan\u003eنظامٌ نغمي انتقل إلى التركية والفارسية واليونانية\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمتنبي\u003c/b\u003e\u003cspan\u003eرفع الشعر إلى الحكمة، فبقي يُقرأ بعد ألف سنة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eألف ليلة\u003c/b\u003e\u003cspan\u003eأدبٌ شعبي تراكم من ثلاث ثقافات، وشكّل صورة الشرق في الغرب\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمجال\u003c/th\u003e\u003cth\u003eأبرز الأعلام\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالنظرية الموسيقية\u003c/td\u003e\u003ctd\u003eالفارابي، صفي الدين الأرموي\u003c/td\u003e\u003ctd\u003eنظام المقامات والآلات\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالشعر العربي\u003c/td\u003e\u003ctd\u003eالمتنبي، أبو نواس، المعري\u003c/td\u003e\u003ctd\u003eذروة القصيدة في العصر العباسي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالنثر\u003c/td\u003e\u003ctd\u003eالجاحظ، الحريري، ابن المقفع\u003c/td\u003e\u003ctd\u003eأسلوبٌ علمي وساخر ومقامات\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالأدب الفارسي\u003c/td\u003e\u003ctd\u003eالفردوسي، الرومي، حافظ\u003c/td\u003e\u003ctd\u003eملحمةٌ وغزلٌ وعرفان\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالحكاية الشعبية\u003c/td\u003e\u003ctd\u003eألف ليلة وليلة\u003c/td\u003e\u003ctd\u003eأدبٌ من الأسفل صار عالميًّا\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003e«الشعر ديوان العرب، به يُعرف نسبهم وأيامهم ومآثرهم»\u003c/p\u003e\u003ccite\u003eقولٌ متوارث في وصف مكانة الشعر عند العرب\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eالموسيقى كانت علمًا وفنًّا: نظريةٌ في المقامات عند الفارابي، وأداءٌ في المجالس. والأدب بلغ ذروته في الشعر العباسي والنثر والمقامات، وفي الفارسية والتركية. و«ألف ليلة» جمعت ثلاث ثقافات وصنعت صورة الشرق في الغرب. والأدب كان مساحة حريةٍ بقدر ما كان سلطة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"crafts","n":"الصناعات والفنون التطبيقية","ic":"🏺","part":"القسم الثالث: الفنون","h":"\u003carticle class=\"ch3\" id=\"crafts\" data-toc=\"الصناعات والفنون التطبيقية\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الثالث: الفنون\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٤ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٣\u003ci\u003e.\u003c/i\u003e٤\u003c/span\u003e\n            \u003ch3\u003eالصناعات والفنون التطبيقية\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eالنسيج والخزف والمعادن والزجاج: كيف صارت الحرفة فنًّا، وكيف انتقلت التقنية مع التجارة، وما الذي بقي منها في بيوتنا اليوم؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكانت الصناعات في الحضارة الإسلامية أعلى من كونها حرفًا معيشية، بل كانت فنًّا وصناعة تصدير. فالمدن الإسلامية كانت تُنتج الحرير والسجاد والخزف والزجاج والمعادن المطعّمة والورق والجلود، وكانت تُصدّرها إلى أوروبا وأفريقيا وآسيا. وكانت هذه الصناعات تُموّل المدن، وتُشغّل العمال، وتُعطي الدولة دخلاً من الرسوم. وبهذا صارت الصناعة ليست فقط مصدر رزق، بل أداةً للتماسك الاجتماعي والانتماء السياسي في آنٍ واحد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان النسيج أهمّ هذه الصناعات. فقد اشتهرت مصر بالكتّان، والشام بالحرير، والعراق بالديباج، وفارس بالسجاد. وكانت «دور الطراز» مصانع سلطانية تُنتج أقمشةً مكتوبًا عليها اسم الخليفة أو السلطان، وتُهدى إلى الملوك. وكانت هذه الأقمشة رمزًا سياسيًّا قبل أن تكون سلعة، لأن من يحمل قماش الطراز يكون في حماية السلطان. وقد أثّر هذا الارتباط في تشكيل هويةٍ اقتصاديةٍ للدولة العثمانية امتدّت لقرونٍ طويلةٍ قبل دخول الصناعة الحديثة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان السجاد فنًّا قائمًا بذاته. فالسجّاد الفارسي والتركي والقوقازي كان يُنسج بالعقدة، وكل منطقةٍ لها رسومها وألوانها. وكان السجاد يُعلَّق على الجدران ويُفرش في المساجد ويُهدى إلى البلاطات الأوروبية. وفي القرن التاسع عشر صار السجاد الشرقي موضةً في أوروبا، وتأسست في الشرق مصانع تُنتج للتصدير على أذواقٍ أوروبية، وهذا تحوّلٌ مهم في تاريخ الحرفة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان الخزف من أعظم إنجازات هذه الصناعة. فقد طوّر الخزّافون المسلمون تقنية «الطلاء المعدني اللامع» التي تُعطي سطحًا يشبه الذهب، وكانت تُستعمل في أواني الزينة. وقد انتقلت هذه التقنية إلى إيطاليا وإسبانيا، وصارت أساسًا لخزف الرينيسانس الأوروبي. وفي الدولة العثمانية اشتهر خزف إزنيق بألوانه الزرقاء والفيروزية والقرنفلية، وصار يُصدَّر إلى أوروبا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت المعادن مجالًا للتخصّص. فالنحاس والبرونز كانا يُطرقان ويُطعّمان بالفضة والذهب، وتُصنع منهما الأبواب والمشربيات والصواني والأباريق. وقد اشتهر «النحاس الدمشقي» بزخرفته الدقيقة، وكان يُصدَّر إلى أوروبا حيث صار يُعرف باسم «دمشقي». وكانت هذه الصناعة تعتمد على مهارةٍ عالية، لأن الطرق والتنزيل والزخرفة يحتاج ثلاث حرفٍ مختلفة تعمل معًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان الزجاج صناعةً متقدّمة أيضًا. فمصر والشام اشتهرتا بالزجاج الملوّن المذهَّب، وكانت القناديل الزجاجية تُصنع للمساجد وتُزيَّن بأسماء السلاطين. وقد انتقلت هذه الصناعة إلى البندقية في العصور الوسطى، وصارت أساسًا لزجاج البندقية الذي ما زال مشهورًا. وهذا يعني أن التقنية سافرت مع التجار والحرفيين، لا مع الجيوش فقط. وبهذا كان التأثير الحضاري للصناعة الإسلامية يتجاوز السلع إلى نقل القيم والأذواق والتقاليد عبر القارات.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت هذه الصناعات منظّمة في «الأصناف» أي النقابات. ولكل صنفٍ شيخٌ وقواعد: من يُقبل، وكيف يُدرَّب المبتدئ، وما معيار الجودة، وما جزاء الغشّ. وكان في بعض الصناعات توقيعٌ على المنتج: اسم الصانع أو المدينة. وهذا التوقيع هو أقدم شكلٍ للعلامة التجارية، وهو دليل على أن الحرفي كان يفتخر بصنعته ويضمنها. وقد أدّى هذا النظام إلى ظهور علاماتٍ تجاريةٍ مبكرةٍ في الحضارة الإسلامية، حيث صار اسم الحرفي ضمانةً للجودة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت هذه الصناعات في تراجعٍ تدريجي بعد القرن العاشر الهجري. فالمنافسة الأوروبية في النسيج والخزف، والتبدّل في أذواق السوق، وتجمّد النقابات، وقلّة الابتكار التقني، كلها أدّت إلى تراجعٍ بطيء. وفي القرن التاسع عشر غزت البضائع الأوروبية أسواق الشرق، وانخفضت أسعار المنتجات المحلية، وانهارت حرفٌ كاملة. وهذا التراجع هو الوجه الاقتصادي للانحلال الذي يُوصف في كتب التاريخ.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالمؤرخ اليوم يعيد قراءة هذه الصناعات لا كتحفٍ في المتاحف بل كنظامٍ اقتصادي. فالسجاد والخزف والنحاس كانت تُنتج بكمياتٍ كبيرة، وتُصدَّر، وتُنافس، وتُقلَّد. وهذا يعني أن الحضارة الإسلامية كانت ذات قاعدة صناعية حقيقية، لا مجرّد مراكز علمٍ وزوايا. وأن فهمها بلا فهم اقتصادها يجعل الصورة ناقصةً إلى حدّ التشويه. وبهذا يصير فهم الصناعة في الإسلام ضرورةً لفهم بنية المجتمع الاقتصادية والثقافية بشكلٍ أعمق.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالطراز: قماشٌ يحمل اسم السلطان\u003c/h4\u003e\u003cp class=\"ap\"\u003eدور الطراز كانت مصانع سلطانية تُنتج أقمشةً فاخرة، وكان يُكتب عليها اسم الحاكم وشعاره. وكانت هذه الأقمشة تُهدى إلى الملوك والوزراء والقادة، فتصير وسيلةً دبلوماسية. ومن هنا كان الطراز رمزًا سياسيًّا قبل أن يكون تجارة. ومن هنا يمكن فهم الطراز كأداةٍ دبلوماسيةٍ واقتصاديةٍ قبل أن يكون مجرد قماشٍ فاخرٍ يُلبَس في الأعراس.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كشفت دراسات الأقمشة المحفوظة في المتاحف أن التقنية كانت عالية جدًّا: نسيجٌ مركّب، وكتابةٌ منسوجة لا مطبوعة، وألوانٌ ثابتة. وهذا يدل على أن الحرفة كانت قادرة على إنتاجٍ دقيق ومتكرر، وهذا هو أساس الصناعة بالمعنى الحديث. وقد أسهم هذا التكرار والتوحيد في بناء سمعةٍ عالميةٍ للصناعة الإسلامية امتدّت من الصين إلى البحر المتوسط.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eإزنيق: الخزف الذي صار علامة\u003c/h4\u003e\u003cp class=\"ap\"\u003eخزف إزنيق بدأ في القرن السادس عشر، وبلغ ذروته في عهد سليمان القانوني. وكان يتميّز بلونٍ أزرق عميق وفيروزي وأخضر، وبزخرفةٍ من زهور القرنفل والتيوليب والياسمين. وكان يُنتج للأواني والصحون وبلاط المساجد. وقد وصل هذا الخزف إلى أوروبا عبر التجارة، وأثّر في تطوير صناعة البورسلين هناك لاحقًا بشكلٍ مباشرٍ.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد صار هذا الخزف علامةً على الفن العثماني، ويُشترى اليوم في المزادات بأسعارٍ عالية. لكن صناعته انهارت في القرن الثامن عشر بسبب المنافسة الصينية والأوروبية، وضياع أسرار الألوان. وهذه قصةٌ متكررة: أن الحرفة تُقتل ببطء حين يتوقف الابتكار ولو بقي الحرفيّون.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالنقابة: تنظيمٌ يحمي ويُجمّد\u003c/h4\u003e\u003cp class=\"ap\"\u003eالنقابة كانت تنظّم السوق وتحمي الحرفي من المنافسة الهدّامة، وتضمن للمستهلك الجودة. وكانت تُحدّد عدد الورش، وتمنع الغشّ، وتُحاسب من يخالف. وهذا في زمانه كان نظامًا عادلًا وناجحًا، لأنه لم يكن هناك قانونٌ عام يحمي المستهلك. وبهذا كانت النقابة تؤدي وظيفةً مزدوجةً: الحماية من الداخل والحصار من الخارج، في نظامٍ اقتصاديٍّ متكامل.\u003c/p\u003e\u003cp class=\"ap\"\u003eلكن النقابة نفسها صارت عائقًا حين منعت التوسّع، وحدّت عدد العاملين، وقاومت التقنيات الجديدة. وهذا هو الثمن الذي تدفعه كل مؤسسةٍ تحمي مصالحها: أن تتحوّل من حمايةٍ للسوق إلى حمايةٍ لأصحابها. والنتيجة أن الصناعة الشرقية بقيت صغيرةً حين كبرت الصناعة الأوروبية.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eدار الطراز\u003c/b\u003e\u003cspan\u003eقماشٌ سلطاني مكتوبٌ عليه اسم الحاكم، رمزٌ سياسي وسلعة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالسجاد\u003c/b\u003e\u003cspan\u003eفنٌّ بالعقدة، لكل منطقةٍ رسومها وألوانها\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالطلاء اللامع\u003c/b\u003e\u003cspan\u003eتقنية خزفٍ تُعطي سطحًا ذهبيًّا، انتقلت إلى إيطاليا\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالنحاس الدمشقي\u003c/b\u003e\u003cspan\u003eطرقٌ وتطعيمٌ بالفضة، صار اسمًا على نوعٍ من الصناعة\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالصناعة\u003c/th\u003e\u003cth\u003eالمركز\u003c/th\u003e\u003cth\u003eالأثر الباقي\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالنسيج\u003c/td\u003e\u003ctd\u003eمصر والشام والعراق\u003c/td\u003e\u003ctd\u003eأقمشة الطراز والمصنوعات الحريرية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالسجاد\u003c/td\u003e\u003ctd\u003eفارس والأناضول والقوقاز\u003c/td\u003e\u003ctd\u003eفنٌّ محليٌّ صار سلعةً عالمية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالخزف\u003c/td\u003e\u003ctd\u003eالعراق وإيران وإزنيق\u003c/td\u003e\u003ctd\u003eتقنية الطلاء اللامع وخزف الرينيسانس\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالزجاج\u003c/td\u003e\u003ctd\u003eمصر والشام\u003c/td\u003e\u003ctd\u003eقناديل المساجد وزجاج البندقية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمعادن\u003c/td\u003e\u003ctd\u003eدمشق والموصل\u003c/td\u003e\u003ctd\u003eالنحاس المطعّم والأبواب والصواني\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003e«من أتقن صنعته كتب اسمه عليها، ومن أخفى عيبها لم يكن حرفيًّا»\u003c/p\u003e\u003ccite\u003eمن قواعد الأصناف في المدن الإسلامية\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eكانت الحضارة الإسلامية ذات قاعدة صناعية حقيقية: نسيجٌ وخزفٌ وزجاجٌ ومعادنٌ وسجاد. وقد نظّمتها النقابات، ووقّع عليها الصانع، وصدّرتها إلى أوروبا. ثم تراجعت بالمنافسة والتجمّد، وهذا التراجع هو الوجه الاقتصادي للانحلال، لا مجرّد حكايةٍ عن ضعف السلاطين.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-4","n":"الحياة اليومية","ic":"🏘️","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-4\" style=\"--c:#6A3D9A\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🏘️\u003c/div\u003e\n      \u003ch2\u003eالحياة اليومية\u003c/h2\u003e\n      \u003cp\u003eالحضارة ليست فقط ما يُكتب في الكتب وما يُبنى في القصور، بل هي أيضًا ما يأكله الناس وما يلبسونه وكيف يتزوّجون ويُربّون أطفالهم وكيف يُنظّمون وقت فراغهم. هذا القسم يغوص في الحياة اليومية في العالم الإسلامي عبر العصور: المدينة والبيت، الطعام واللباس، الأسرة والأعراف، والأعياد والاحتفالات التي أعطت الناس إيقاعًا سنويًا للذاكرة الجماعية.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#city-home\"\u003eالمدينة والبيت\u003c/a\u003e\u003ca href=\"#food-dress\"\u003eالطعام واللباس\u003c/a\u003e\u003ca href=\"#family-customs\"\u003eالأسرة والأعراف\u003c/a\u003e\u003ca href=\"#festivals-rituals\"\u003eالأعياد والاحتفالات\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"city-home","n":"المدينة والبيت","ic":"🏠","part":"الحياة اليومية","h":"\u003carticle class=\"ch3\" id=\"city-home\" data-toc=\"المدينة والبيت\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالحياة اليومية\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ١ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٤\u003ci\u003e.\u003c/i\u003e١\u003c/span\u003e\n            \u003ch3\u003eالمدينة والبيت\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eكيف عاش الناس في المدن الإسلامية؟ ما الذي يميّز البيت الإسلامي عن غيره؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eالمدينة الإسلامية لم تُبنَ عشوائيًّا، بل على مبدأٍ مركزي: المسجد الجامع. منه تتفرّع الشوارع الرئيسية، وتحيط به الأسواق، وتتوزّع الأحياء السكنية في حلقاتٍ حوله. هذا التخطيط ليس جماليًا فقط، بل عملي: يسهل الوصول إلى المركز، ويُتيح للجميع معرفة مواقيت الصلاة من المئذنة، ويخلق مجالًا عامًا يجمع الناس مهما اختلفت طبقاتهم. وهذا التخطيط يجعل المدينة ليست مجرد تجمعٍ سكنيٍّ، بل كيانًا حيًا يتفاعل فيه الناس مع بعضهم ومع فضائهم المشترك بشكلٍ يوميٍّ مستمر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان البيت الإسلامي يتميّز بخاصيةٍ واحدةٍ هي الأهم: الخصوصية. لا نوافذ تطلّ على الشارع مباشرة، بل فناء داخلي مفتوح على السماء هو قلب البيت. فيه تُزرع الأشجار وتُنسَب المياه، وإليه تفتح كل الغرف. هذا التصميم يجعل البيت عالمًا منفصلًا عن الخارج، يحترم الفضاء العائلي ويحميه من أعين الغرباء. وبهذا يتحقق التوازن بين الانتماء إلى المجتمع والحفاظ على حرمة العائلة، وهو مبدأٌ ظلّ حاضرًا في العمارة الإسلامية قرونًا طويلة.\u003c/p\u003e\u003cp class=\"ap\"\u003eولم تكن المدينة مقسّمة حسب الطبقة الاقتصادية فقط، بل حسب المهنة أيضًا. كل حيٍّ كان يضمّ حرفيّين من نوعٍ واحد: حيّ النحاسين، حيّ الخزّافين، سوق الصياغة. هذا التقسيم يسهل التنظيم ويخلق روابط اجتماعية قويّة بين الجيران، فصار الحيّ ليس مكان سكنٍ فقط بل نقابةً اجتماعيةً واقتصاديةً. وقد أسهم هذا النظام في بناء مجتمعٍ متماسكٍ يعرف أفراده بعضهم البعض، ويتحملون المسؤولية المشتركة عن أمن الحيّ ونظافته وسلامة سوقه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان للمدينة أبوابٌ يُغلق بعضها ليلًا، وأسواقٌ يُفتَح بعضها في أوقاتٍ معينة، وحمّاماتٌ عامةٌ تُشكّل مركزًا اجتماعيًّا للنساء والرجال على حدٍّ سواء. وقد احتلّ الحمّام مكانةً خاصةً في الحياة اليومية، فهو ليس للنظافة فقط بل للاجتماع والنميمة وإتمام الصفقات. وقد ظلّ الحمّام رمزًا من رموز المدينة الإسلامية، يُشير إليه الرحّالة في وصفاتهم كدليلٍ على التقدم الاجتماعي والاهتمام بالنظافة الشخصية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالحيّ الجامعيّ، أو المدينة الجامعية، كان نموذجًا فريدًا يجمع بين السكن والتعليم والعبادة. الطلاب يعيشون في خلايا صغيرة حول مدرسةٍ واحدةٍ، يتقاسمون الطعام والمياه والمكتبة. هذا النموذج خلق حركةً علميةً مستمرةً لم تعرفها أوروبا قبل القرون الوسطى المتأخرة. وبهذا يصير التعليم ليس نشاطًا منفصلًا عن الحياة، بل هو الحياة نفسها في إيقاعها اليومي وعلاقاتها الاجتماعية المتشابكة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي العصر العثماني تطوّرت المدينة لتشمل الساحات العامة والأسواق المسقوفة والجسور والقنوات. وقد أدّى هذا التطوير إلى زيادة التفاعل الاجتماعي، حيث صار السوق ليس مكان بيعٍ فقط بل مكان لقاءٍ وتبادلٍ للأخبار والآراء. وقد أثّر هذا التطوير في تشكيل هويةٍ حضاريةٍ للمدن العثمانية جمعت بين الوظيفة والجمال في بنيةٍ متناغمةٍ لا تزال شاهدةً حتى اليوم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوما يجدر الانتباه إليه أن المدينة الإسلامية لم تكن مكانًا للسكن فقط، بل كانت فضاءً روحيًا. كل شارعٍ يحمل اسمًا يربطه بالتاريخ أو العلم أو الدين، وكل زاويةٍ فيها مسجدٌ صغيرٌ أو مدرسةٌ أو سبيلٌ ماء. وهذا يعني أن العيش في المدينة الإسلامية كان تجربةً روحيةً مستمرةً لا تنفصل عن الحياة اليومية. ومن هنا يمكن فهم لماذا كان المسافرون يدخلون المدينة الإسلامية فيشعرون بأنهم دخلوا عالمًا مختلفًا، حيث يحيط بهم الجمال والنظام والمعنى من كلّ جانب.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالفناء: قلب البيت العربي\u003c/h4\u003e\u003cp class=\"ap\"\u003eالفناء هو المساحة التي تدور حولها بقية أجزاء البيت. فيه تُزرع الورود والأشجار المثمرة، وبه تُنسَب قنوات المياه، وإليه تفتح نوافذ الغرف لتستقبل الضوء والهواء. وهو فضاءٌ مغلقٌ على الخارج مفتوحٌ على الداخل، مما يحقق التوازن بين الخصوصية والانفتاح. وبهذا يصير الفناء ليس فضاءً فارغًا، بل هو روح البيت الذي تدور حوله الحياة العائلية بكلّ تفاصيلها اليومية ومناسباتها الخاصة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان الفناء في البيوت الكبيرة يضمّ حوض ماءٍ أو نافورة صغيرة، لأن صوت الماء يُبرد الجو ويُهدّئ الأعصاب. وقد ورد في التراث الإسلامي أن النبي ﷺ قال: 'لا تُمنعوا إماء الله مساجد الله'، وهذا يعكس أن الفضاء الداخلي كان مخصصًا للعائلة بينما الفضاء العام مفتوح للجميع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد حافظ البيت الإسلامي على هذه البنية حتى دخول التخطيط الحديث، حيث بدأت المدن تُبنى على طراز أوروبي يفضل الشقق العلوية والنوافذ على الشارع. وهذا التغيير أدّى إلى تدهورٍ في العلاقات الاجتماعية داخل الحيّ، وإلى فقدانٍ لإحساس العائلة بالأمان والخصوصية.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالحمّام: مجتمعٌ تحت البخار\u003c/h4\u003e\u003cp class=\"ap\"\u003eالحمّام العام في الإسلام ليس مجرد مكانٍ للاستحمام، بل كان مركزًا اجتماعيًّا وثقافيًّا. النساء يذهبن إلى حمّام النساء في أوقاتٍ محددة، ويتحدثن في أمورهن، ويُتمِّن الصفقات، ويُرتِّبن الزيجات. والرجال يفعلون المثل في حمّام الرجال. وقد حمل الحمّام أيضًا وظيفةً تربويةً، حيث كانت الأمهات يُعلّمن بناتهن آداب الاجتماع وأسرار الزواج في جوٍّ من الألفة والثقة البعيد عن رقابة الرجال.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد وصف الرحّالة الأجانب الحمّامات الإسلامية بإعجابٍ شديد، لافتين إلى نظافتها وترتيبها ووسائل تدفئتها. وكان الحمّام يضمّ أقسامًا متدرجة الحرارة: باردٌ ودافئٌ وساخنٌ، ولكلّ منها وظيفته في تنظيف الجسم والاسترخاء. وقد انتشرت الحمّامات في كلّ مدينةٍ إسلاميةٍ بأحجامٍ متفاوتة، من الحمّامات البسيطة في الأحياء الشعبية إلى القصور الملكية التي كانت تُزيّن بالرخام والفسيفساء.\u003c/p\u003e\u003cp class=\"ap\"\u003eوهناك أدبٌ كاملٌ كُتب عن الحمّام: من الشعر إلى النصائح الطبية إلى الأدب الاجتماعي. وقد صار الحمّام رمزًا للثقافة الإسلامية في أعين الأوروبيين، حتى إن كلمة 'الاستحمام' في الإنجليزية اشتقت أصلها من تجربتهم للحمّامات الشرقية. وقد حفرت هذه التجربة أعماقًا في الذاكرة الأوروبية، حتى إن الرسامين والكتاب كانوا يصفون الحمّام الشرقي كرمزٍ للاسترخاء والحكمة والرفاهية المفقودة في أوروبا.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالأسواق: شريان المدينة\u003c/h4\u003e\u003cp class=\"ap\"\u003eالسوق في المدينة الإسلامية ليس مكان بيعٍ فقط، بل فضاءٌ عامٌّ يُشكّل جزءًا من البنية الاجتماعية. كل سوقٍ كان يضمّ حرفةً واحدةً: سوق البزازين، سوق الصياغة، سوق العطارين. وهذا التخصص يسهل على المشتري المقارنة والتفاوض، ويخلق تنافسًا بين الحرفيين. وبهذا يصير السوق ليس مجرد مكانٍ للتبادل التجاري، بل مدرسةً اجتماعيةً يتعلّم فيها الناس قيم العدالة والثقة والاحترام المتبادل بين مختلف الطبقات.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان للسوق قوانينه الخاصة: لا بيعٌ قبل وقتٍ محدد، لا غشّ، لا احتكار. وكان هناك 'محتسب' يتجوّل في السوق ليضمن تطبيق هذه القوانين. وهذا النظام أدّى إلى ظهور ثقةٍ عامةٍ بين البائع والمشتري لم تكن موجودةً في أسواق أوروبا الوسطى. وقد ساهم هذا النظام في خلق ثقافةٍ استهلاكيةٍ مسؤولةٍ، حيث كان الغشّ خيانةً للأمانة وللمهنة معًا، وكان التاجر الصادق هو الذي يبني سمعته عبر الأجيال.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد تطوّرت الأسواق في العصور المتأخرة لتشمل خاناتٍ للتجار القادمين من بعيد، وفسقياتٍ تزوّد المارة بالماء، ومساجد صغيرةٍ لأداء الصلاة. وهكذا صار السوق مؤسسةً اجتماعيةً متكاملةً تلبّي حاجات الناس المادية والروحية معًا. وبهذا تتكامل الوظائف الروحية والمدنية والاجتماعية في فضاءٍ واحدٍ، مما يجعل السوق تجسيدًا حيًا للمدينة الإسلامية بكلّ أبعادها.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالتخطيط المركزي\u003c/b\u003e\u003cspan\u003eالمسجد الجامع مركز المدينة، وتتفرع منه الشوارع والأسواق والأحياء في حلقاتٍ منظمة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eخصوصية البيت\u003c/b\u003e\u003cspan\u003eالفناء الداخلي المفتوح على السماء هو قلب البيت، والنوافذ تفتح عليه لا على الشارع.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالحمّام الاجتماعي\u003c/b\u003e\u003cspan\u003eليس للنظافة فقط، بل مركزٌ للقاء والحديث وإتمام الصفقات بين النساء والرجال على حدة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eتخصص الأسواق\u003c/b\u003e\u003cspan\u003eكل سوقٍ لحرفةٍ واحدةٍ، مع نظام رقابةٍ وقوانين أخلاقيةٍ تضمن الثقة بين التاجر والمشتري.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالعنصر\u003c/th\u003e\u003cth\u003eالوظيفة الاجتماعية\u003c/th\u003e\u003cth\u003eالوظيفة الروحية\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالمسجد الجامع\u003c/td\u003e\u003ctd\u003eمركز المدينة والتجمع\u003c/td\u003e\u003ctd\u003eالصلاة الجماعة وتوحيد الإيقاع\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالفناء الداخلي\u003c/td\u003e\u003ctd\u003eخصوصية العائلة والتبريد\u003c/td\u003e\u003ctd\u003eالانفتاح على السماء والنور\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالحمّام العام\u003c/td\u003e\u003ctd\u003eاللقاء الاجتماعي والتبادل\u003c/td\u003e\u003ctd\u003eالطهارة والنظافة الشرعية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالسوق المخصص\u003c/td\u003e\u003ctd\u003eالتجارة والتنافس المهني\u003c/td\u003e\u003ctd\u003eالعدل والرقابة الأخلاقية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالحيّ المهني\u003c/td\u003e\u003ctd\u003eالتضامن النقابي والتدريب\u003c/td\u003e\u003ctd\u003eالانتماء والهوية المحلية\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eالبيت الذي فيه فناءٌ مفتوحٌ على السماء، لن يُصيب ساكنيه ضيقٌ مهما ضاقت الأرض حوله.\u003c/p\u003e\u003ccite\u003eابن خلدون\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eالمدينة الإسلامية كانت منظمةً حول المسجد، وتحترم الخصوصية العائلية عبر الفناء الداخلي، وتنشط اجتماعيًا في الحمّامات والأسواق المهنية المتخصصة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"food-dress","n":"الطعام واللباس","ic":"🍽️","part":"الحياة اليومية","h":"\u003carticle class=\"ch3\" id=\"food-dress\" data-toc=\"الطعام واللباس\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالحياة اليومية\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٢ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٤\u003ci\u003e.\u003c/i\u003e٢\u003c/span\u003e\n            \u003ch3\u003eالطعام واللباس\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eما الذي أكلَه الناس في الحضارة الإسلامية؟ وكيف عبّروا عن هويتهم من خلال لباسهم؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eالطعام في الإسلام ليس مجرد تغذية، بل هو جزء من الهوية الدينية والثقافية. الأضحية في عيد الأضحى، الإفطار في رمضان، الطعام المشترك عند الضيافة — كلها ممارسات تحمل معنًى روحيًا واجتماعيًا. وقد أدّى هذا إلى ظهور مطبخٍ إسلاميٍّ غنيٍّ يمتزج فيه الشرقي بالغربي والبري بالبحري. وقد أدّى هذا الامتزاج إلى ظهور أطباقٍ ومأكولاتٍ فريدةٍ في كلّ منطقةٍ، حتى صار المطبخ الإسلامي ميراثًا مشتركًا بين شعوبٍ متعددةٍ تجمعها قيمٌ روحيةٌ واحدةٌ.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالحضارة الإسلامية هي التي نقلت كثيرًا من المحاصيل الأساسية إلى أوروبا: الأرز من آسيا، القمح من بلاد الشام، السكر من بلاد الهند، القهوة من اليمن. ومع كل محصولٍ جاءت تقنيات زراعته وطبخه، فتغيّرت المائدة الأوروبية بشكلٍ جذري. وبهذا تغيّرت عادات الأكل في أوروبا بشكلٍ جذري، حيث انتقلت من نظامٍ بسيطٍ يعتمد على الخبز واللحم إلى مائدةٍ غنيةٍ تضمّ الأرز والبهارات والحلويات الشرقية.\u003c/p\u003e\u003cp class=\"ap\"\u003eأما اللباس فكان يعبّر عن الهوية: القفطان في المغرب، الثوب الأبيض في الجزيرة العربية، السراويل الواسعة في بلاد فارس، العمامة في مصر والشام. وكان اللون والقماش يدلّان على الطبقة الاجتماعية والمهنة والمنطقة الجغرافية. وقد ظلّ اللباس في الإسلام يحمل هذه الدلالات حتى العصر الحديث، حيث يمكن للمرء أن يتعرّف على أصل الشخص ومهنته من زيه التقليدي في كثير من المناسبات.\u003c/p\u003e\u003cp class=\"ap\"\u003eولم يكن اللباس في الإسلام ترفًا فقط، بل كان أيضًا نظامًا للحماية من الحرّ والبرد والرمال. الصوف في الشتاء، القطن في الصيف، الحرير للمناسبات. وقد أدّى هذا التنوّع إلى ظهور صناعات نسيجية متطورة في كل مدينةٍ إسلامية. وقد ساهم هذا التنوّع في رفع مستوى الصناعة النسيجية، حيث تفوّقت مدنٌ مثل دمشق والقاهرة وإزنيق في إنتاج أقمشة عالميةٍ يتهافت عليها التجار من كلّ حدبٍ وصوب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالطعام كان له آدابه: البدء باسم الله، الأكل باليمين، عدم الإسراف، مشاركة الآخرين. وقد ورد في الحديث: 'ما ملأ ابن آدم وعاءً شرًّا من بطنه'، وهذا يعكس النظرة الإسلامية إلى الطعام كنعمةٍ يجب شكرها لا كشهوةٍ تُشبع بلا حدود. وبهذا يصير الطعام في الإسلام نعمةً تُشكر لا شهوةً تُستعبد، ويتحوّل الأكل من غريزةٍ حيوانيةٍ إلى طقسٍ إنسانيٍّ يحمل المعنى والقيمة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان للنساء دورٌ خاصٌّ في المطبخ، لكن الطبخ لم يكن حكرًا عليهن. الرجال أيضًا كانوا يطبخون، خاصةً في السفر والغزوات. وقد وردت كتبٌ طبخٍ كتبها رجالٌ، مثل كتاب 'الطباخ' للبغدادي، الذي يُعدّ من أوائل كتب الطبخ المُتخصصة في التاريخ. وقد أدّى هذا الاهتمام إلى تدوين وصفاتٍ وطرق طبخٍ تُشكّل اليوم جزءًا هامًا من التراث الغذائي العالمي، خاصةً في مجال الحلويات والمشروبات والبهارات.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد تطوّر المطبخ الإسلامي مع التوسع الجغرافي. المطبخ الأندلسي امتزج بالمأكولات البربرية والرومانية، والمطبخ العراقي استفاد من المطبخ الفارسي، والمطبخ المصري أضاف إليه النيل والخضروات الاستوائية. وهكذا صار المطبخ الإسلامي مرآةً للتنوع الجغرافي والثقافي للحضارة. وبهذا يصير المطبخ الإسلامي شاهدًا على قدرة الحضارة على استيعاب الآخر والتأثير فيه دون أن تفقد هويتها أو تذوب في ثقافاته المتنوعة.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالقهوة: شرابٌ غيّر العادات\u003c/h4\u003e\u003cp class=\"ap\"\u003eالقهوة أصلها من اليمن، حيث كان الصوفيون يشربونها ليلًا للبقاء مستيقظين في أذكارهم. ثم انتقلت إلى مكة والمدينة، ومنهما إلى القاهرة واسطنبول، ومن ثم إلى أوروبا عبر البندقية. وقد غيّرت القهوة عادات الناس: ظهرت المقاهي كأماكن للقاء والنقاش. وقد تحوّلت المقاهي من مجرّد أماكن لشرب القهوة إلى مؤسساتٍ فكريةٍ تُشكّل حلقةً وصلٍ بين المجتمع والسلطة، وبين التقليد والحداثة في آنٍ واحد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت المقاهي في القاهرة ودمشق وبغداد مراكزًا ثقافيةً يجتمع فيها الشعراء والفلاسفة والتجار. وقد وصفها الرحّالة الأجانب بأنها 'مدارس للفكر الحر'، حيث يمكن لأيّ أحدٍ أن يُعبّر عن رأيه بلا خوفٍ من الرقابة السلطانية. وقد لعبت هذه المقاهي دورًا هامًا في نشر الأفكار الجديدة، حيث كانت تُقرأ فيها الصحف وتُناقش فيها القضايا السياسية بجرأةٍ نادرةٍ في ذلك العصر.\u003c/p\u003e\u003cp class=\"ap\"\u003eولم يقتصر أثر القهوة على الاجتماع، بل وصل إلى الاقتصاد أيضًا. صارت القهوة سلعةً تجاريةً رئيسيةً، وظهرت مزارعها في اليمن والحبشة ثم في العالم الجديد. وقد أدّى هذا الطلب المتزايد إلى تطوير طرق تجاريةٍ جديدةٍ عبر المحيط الهندي. وبهذا يصير تأثير القهوة ليس محليًا فقط، بل عالميًا، حيث غيّرت الاقتصاد والسياسة والثقافة في قاراتٍ لم تكن تزرع فيها شجرة القهوة يومًا.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالعمامة: رمزٌ ووظيفة\u003c/h4\u003e\u003cp class=\"ap\"\u003eالعمامة في الإسلام ليست زينةً فقط، بل كانت تحمل دلالاتٍ اجتماعيةً ومهنيةً. لونها وطريقة لفّها يدلّان على المنطقة والمهنة والطبقة. العمامة البيضاء للعلماء، الخضراء للسادة، السوداء للقضاة. وفي بعض المناطق كان حجم العمامة يدلّ على الثراء. وقد ظلّت هذه الرموز حيةً في الذاكرة الجمعية، حيث ما زالت العمامة تُلبَس في المناسبات الدينية والوطنية كتأكيدٍ على الاستمرارية والانتماء.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ورد في السنة النبوية أن النبي ﷺ كان يلبس العمامة، وقد كانت تُلفّ فوق القلنسوة في الشتاء للدفء. وهذا يعكس الوظيفة العملية للعمامة: حماية الرأس من الشمس والبرد، وكذلك الاحتشام. وبهذا يصير اللباس في الإسلام نظامًا متكاملًا يجمع بين الوظيفة والرمزية والجمال، لا مجرد غطاءً للجسد يخضع للموضة المتغيرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eومع دخول الحداثة، بدأت العمامة تختفي من الحياة اليومية في المدن، لتصبح زيًا تقليديًا يلبس في المناسبات الدينية والأعراس. لكنها بقيت رمزًا قويًّا للهوية الإسلامية في الذاكرة الجماعية، خاصةً في المناطق الريفية التي حافظت على لباسها التقليدي. وقد حافظت بعض المجتمعات الريفية والبدوية على هذه الأزياء حتى اليوم، مما يجعلها شواهد حيةً على تاريخٍ طويلٍ من الحرفية والذوق والهوية.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالطعام والطقوس\u003c/h4\u003e\u003cp class=\"ap\"\u003eالطعام في المناسبات الدينية كان يحمل معنًى رمزيًا عميقًا. في رمضان، يُفطر الناس معًا، ويُرسلون الطعام إلى الجيران، ويُدعون الفقراء. وفي عيد الأضحى، يُذبح كلّ من استطاع ويُوزّع اللحم على المحتاجين، مما يُعيد التوازن الاجتماعي. وبهذا يصير الطعام في المناسبات الدينية ليس مجرد إشباعٍ للجوع، بل أداةً للتقرّب إلى الله وإعادة الروابط الاجتماعية التي قد تضعفها مشاغل الحياة اليومية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت الولائم علامةً على الكرم والمكانة الاجتماعية. يُعدّ المضيف أطعمةً متنوعةً ويُقدّمها بترتيبٍ معين، ويُكرّم الضيوف بأجود ما عنده. وقد ورد في الحديث: 'من كان يؤمن بالله واليوم الآخر فليكرم ضيفه'، فصار الكرم واجبًا دينيًا لا ترفًا اجتماعيًا. وقد أدّى هذا المبدأ إلى ظهور ثقافةٍ ضيافةٍ فريدةٍ في الإسلام، حيث يُعتبر إكرام الضيف واجبًا دينيًا يتقدّم على الراحة الشخصية والظروف الاقتصادية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوهناك أطباقٌ ارتبطت بأماكنَ محددةٍ وصارت رموزًا لها: الكسكس في المغرب، البرياني في الهند، الكباب في بلاد فارس، الفول في مصر. كلّ طبقٍ يحمل تاريخًا من التبادل الثقافي والتأقلم مع البيئة المحلية، ويُعبّر عن هويةٍ محليةٍ ضمن الإطار الإسلامي الأوسع. وبهذا يصير المطبخ الإسلامي مرآةً صادقةً لتنوّع الأرض وجمالها، حيث يحمل كلّ طبقٍ في طياته قصةً من التنقل واللقاء والابتكار عبر القرون.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالطعام كهوية\u003c/b\u003e\u003cspan\u003eالأضحية والإفطار والضيافة تحمل معانٍ روحيةً، والمطبخ الإسلامي امتزج بمحاصيلٍ وأساليبٍ من الشرق والغرب.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eاللباس كرمز\u003c/b\u003e\u003cspan\u003eالعمامة والقفطان والثوب يدلّان على المهنة والمنطقة والطبقة، وتحمل ألوانها دلالاتٍ اجتماعيةً واضحةً.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالقهوة والمجتمع\u003c/b\u003e\u003cspan\u003eانتقلت من اليمن إلى العالم، وخلقت المقاهي كفضاءاتٍ عامةٍ للفكر والنقاش والتبادل الثقافي.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالكرم دينيًّا\u003c/b\u003e\u003cspan\u003eالضيافة والولائم وإرسال الطعام للجيران واجباتٌ دينيةٌ تعيد التوازن الاجتماعي وتُقوّي الروابط المجتمعية.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالعنصر\u003c/th\u003e\u003cth\u003eالأصل\u003c/th\u003e\u003cth\u003eالدلالة الاجتماعية\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالقهوة\u003c/td\u003e\u003ctd\u003eاليمن\u003c/td\u003e\u003ctd\u003eالمقاهي كمراكز للفكر واللقاء\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالعمامة\u003c/td\u003e\u003ctd\u003eالجزيرة العربية\u003c/td\u003e\u003ctd\u003eالهوية المهنية والمنطقية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالكسكس\u003c/td\u003e\u003ctd\u003eالمغرب العربي\u003c/td\u003e\u003ctd\u003eالطقس الجماعي والضيافة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالحرير\u003c/td\u003e\u003ctd\u003eالصين عبر طريق الحرير\u003c/td\u003e\u003ctd\u003eالثراء والمناسبات الخاصة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالبهارات\u003c/td\u003e\u003ctd\u003eالهند وجنوب شرق آسيا\u003c/td\u003e\u003ctd\u003eالثراء والقدرة على التجارة البعيدة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eإذا دعاكم أحدٌ إلى وليمةٍ فأجيبوا، وإن لم تكونوا صائمين فتصدّقوا.\u003c/p\u003e\u003ccite\u003eالنبي محمد ﷺ\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eالطعام واللباس في الحضارة الإسلامية كانا يحملان معانٍ روحيةً واجتماعيةً، وامتزج المطبخ بمحاصيلٍ من كلّ القارات، بينما عبّر اللباس عن الهوية المحلية والمهنية.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"family-customs","n":"الأسرة والأعراف","ic":"👨‍👩‍👧‍👦","part":"الحياة اليومية","h":"\u003carticle class=\"ch3\" id=\"family-customs\" data-toc=\"الأسرة والأعراف\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالحياة اليومية\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٣ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٤\u003ci\u003e.\u003c/i\u003e٣\u003c/span\u003e\n            \u003ch3\u003eالأسرة والأعراف\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eكيف كانت تتشكّل الأسرة في المجتمعات الإسلامية؟ وما هي الأعراف التي نظّمت العلاقات بين الناس؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eالأسرة في الإسلام ليست وحدة اجتماعيةً فقط، بل هي وحدةٌ دينيةٌ واقتصاديةٌ. الزواج عقدٌ مقدّس، والزوجان شريكان في البيت والمال والتربية. وقد ورد في القرآن: ﴿وَأَنكِحُوا الْأَيَامَىٰ مِنكُمْ﴾، مما يعكس النظرة الإسلامية إلى الزواج كواجبٍ اجتماعيٍّ وروحيٍّ. وبهذا يصير الزواج في الإسلام ليس رغبةً فرديةً فقط، بل بناءً لمجتمعٍ صالحٍ يقوم على التعاون والمسؤولية المشتركة بين الزوجين والعائلتين معًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت العائلة الممتدّة هي النموذج السائد: الجدّ والجدة يعيشان مع أبنائهما وأحفادهما في بيتٍ واحدٍ أو في أبنيةٍ متجاورة. هذا النموذج يضمن رعاية المسنين ويوفّر بيئةً غنيةً للأطفال ينمون فيها بين أجيالٍ متعددة. وقد أسهم هذا النموذج في خلق بيئةٍ عائليةٍ غنيةٍ، حيث ينمو الطفل محاطًا بالحبّ والرعاية من جيلٍ كاملٍ لا من أبوين فقط، مما يُعزّز استقراره النفسي والاجتماعي.\u003c/p\u003e\u003cp class=\"ap\"\u003eولم يكن الزواج في الإسلام ارتباطًا عاطفيًا فقط، بل كان أيضًا تحالفًا بين عائلتين. يتفاوض الوالدان على المهر والمؤخر وشروط العيش، ويُوقَّع العقد بحضور الشهود. وهذا النظام يحمي حقوق المرأة ويضمن استقرار الزواج بعقدٍ قانونيٍّ واضحٍ. وبهذا يضمن النظام الإسلامي أن الزواج ليس قرارًا عابرًا، بل التزامًا مدروسًا يحترم حقوق الجميع ويحمي المرأة من الاستغلال والتخلي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان للمرأة في الأسرة الإسلامية حقوقٌ ماليةٌ مستقلةٌ: المهر لها، والإرث نصيبها، والكسب إن عملت لها. وقد ورد في التاريخ نساءٌ كنّ تاجراتٍ أو عالماتٍ أو أرباب أملاك، ويديرن شؤونهن المالية باستقلالٍ تام. وقد أدّى هذا الاستقلال المالي إلى ظهور نساءٍ بارزاتٍ في مجالاتِ التجارة والعلم والأدب، لم تكن ممكنةً في مجتمعاتٍ تحرم المرأة من ملكية المال والتصرف فيه.\u003c/p\u003e\u003cp class=\"ap\"\u003eأما الأعراف الاجتماعية فكانت تحكم العلاقات بين الجيران والأصدقاء والزملاء. زيارة المريض، تقديم العزاء، مشاركة الأفراح، إكرام الضيف — كلها واجباتٌ اجتماعيةٌ يُنظَّر إليها على أنها جزءٌ من الدين. وقد قال النبي ﷺ: 'ما زال جبريل يُوصيني بالجار حتى ظننت أنه سيُورثه'. وبهذا يصير الإحسان إلى الجار ليس تفضّلًا بل واجبًا دينيًا، مما يخلق شبكةً اجتماعيةً قويّةً تتحمّل المسؤولية عن الضعفاء وتُعزّز التماسك المجتمعي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان تربية الأطفال مسؤوليةً مشتركةً بين الأب والأم والأجداد والأعمام. والتعليم لا يبدأ في المدرسة بل في البيت: تعليم القراءة والكتابة والأدب والآداب. وقد كانت الأم هي المعلّمة الأولى، خاصةً في المناطق التي لم تكن فيها مدارس للبنات. وقد أسهم هذا الدور في نشر المعرفة بين الفتيات قبل دخول المدارس الرسمية، حيث كانت الأم تنقل للبنات ما تعلّمته من أمّها في سلسلةٍ متصلةٍ من التربية الأسرية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد واجهت الأسرة الإسلامية تحدياتٍ مع التغيّرات الاقتصادية والاجتماعية. الحروب والأوبئة والمجاعات كانت تُفكّك العائلات وتُغيّر أدوار أفرادها. لكن البنية الأساسية — التضامن العائلي والرعاية المتبادلة — بقيت ثابتةً عبر القرون. وبهذا يظلّ مفهوم الأسرة في الإسلام صامدًا أمام الزلازل التاريخية، محافظًا على وظيفته الأساسية كملاذٍ أمنٍ ومصدرٍ للهوية والانتماء.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالزواج: عقدٌ وتحالف\u003c/h4\u003e\u003cp class=\"ap\"\u003eالزواج في الإسلام عقدٌ قانونيٌّ يُبرم بحضور الشهود، ويتضمّن شروطًا واضحةً: المهر، المؤخر، حقوق الزوجين. وقد كانت هذه الشروط تُسجَّل في وثائق رسميةٍ تحفظ حقوق الطرفين، خاصةً المرأة. وقد كانت هذه الوثائق تُحفظ في بيوت العائلات وفي أرشيفات القضاة، مما يضمن للمرأة حقها في المطالبة بما تستحقّه قانونيًا وشرعيًا في حال النزاع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان التفاوض على الزواج يتمّ بين العائلتين، لكن رضى الزوجين شرطٌ أساسيٌّ. وقد ورد في الحديث: 'لا تُنكح الأيمّ حتى تُستأمر'، مما يؤكد على أهمية رضى المرأة في العقد. وهذا النظام يجمع بين الحماية الاجتماعية للعائلة والاحترام الفردي للإرادة. وبهذا يجمع العقد بين الحكمة الاجتماعية في الحفاظ على استقرار الأسرة، والحكمة الفردية في احترام إرادة المرأة وعدم إجبارها على ما لا ترغب فيه.\u003c/p\u003e\u003cp class=\"ap\"\u003eومع ذلك، كانت هناك ممارسات اجتماعيةٌ تختلف باختلاف المنطقة والعصر. بعض المجتمعات كانت تفرض زواج الأقارب للحفاظ على الممتلكات، وبعضها كان يسمح بتعدد الزوجات بشروطٍ صارمةٍ. وهذه الممارسات كانت تتأثر بالعادات المحلية أكثر من النصّ الديني أحيانًا. وقد تنوّعت هذه الممارسات بشكلٍ كبيرٍ بين المدن والريف، وبين الطبقات الاجتماعية، مما يعكس المرونة التي تميّز بها الفقه الإسلامي في التعامل مع الواقع.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالمرأة: حقوقٌ وأدوار\u003c/h4\u003e\u003cp class=\"ap\"\u003eالمرأة في الإسلام تتمتع بحقوقٍ ماليةٍ مستقلةٍ منذ بداية التاريخ الإسلامي. المهر ملكٌ لها، والإرث نصيبها، والكسب إن عملت يعود إليها. وقد وردت في التاريخ نساءٌ كنّ تاجراتٍ كبيراتٍ، مثل خديجة بنت خويلد، أو عالماتٍ مثل أم الدهب والشافعي. وقد أسهم هذا الاستقلال في تمكين المرأة من المشاركة الفعّالة في الحياة الاقتصادية، حيث كانت تتبرّع وتُوقف وتُقرض باسمها الشخصي دون وصايةٍ من أحد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت المرأة تتولّى أيضًا أدوارًا اجتماعيةً مهمةً: رعاية الأطفال، تعليم البنات، إدارة البيت. وفي بعض المناطق، كانت النساء يملن الأراضي ويديرن الوقفيات. وقد وثّق المؤرخون نساءً كنّ يُشرفن على بناء المساجد والمدارس والخوانق. وبهذا تثبت المرأة في الإسلام حضورًا فاعلًا في بناء المجتمع، ليس كمتلقيةٍ للرعاية فقط، بل كشريكةٍ في التنمية والإعمار والعلم.\u003c/p\u003e\u003cp class=\"ap\"\u003eلكن الواقع الاجتماعي لم يكن موحّدًا. في بعض العصور والمناطق، كانت المرأة محصورةً في البيت، وفي أخرى كانت تشارك في الحياة العامة. الفرق يعتمد على العادات المحلية والظروف الاقتصادية أكثر من الفقه نفسه. وقد أدّى هذا التنوّع إلى ظهور نماذجَ متعددةٍ للمرأة المسلمة عبر التاريخ، تتحدّى الصورة النمطية التي تحاول حصرها في قالبٍ واحدٍ بلا تفاوت.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالجار والمجتمع\u003c/h4\u003e\u003cp class=\"ap\"\u003eمفهوم الجار في الإسلام يتجاوز الجار الجغرافي إلى الجار الإنساني. قال النبي ﷺ: 'ما زال جبريل يُوصيني بالجار حتى ظننت أنه سيُورثه'. وهذا يعكس أهمية العلاقة الجيرة في البناء الاجتماعي الإسلامي. وبهذا يصير مفهوم الجيرة في الإسلام أوسع بكثير من المجاورة الجغرافية، بل هو مفهومٌ أخلاقيٌّ يتجاوز الحدود إلى الإنسانية جمعاء.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت هناك واجباتٌ محددةٌ تجاه الجار: إكرامه، حمايته، مساعدته في الحاجة، إنكاذه إن أخطأ. وقد كانت هذه الواجبات تُنظَّم أحيانًا من خلال العرف أكثر من القانون، مما يعطي المجتمع مرونةً في التعامل مع الظروف المتغيرة. وقد أسهم هذا التنظيم في خلق مجتمعاتٍ متماسكةٍ تعرف أفرادها حقوق بعضهم وواجباتهم، مما يقلّل من الحاجة إلى تدخّل السلطة المركزية في الشؤون اليومية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد تطوّرت مفاهيم الجيرة مع التحول من المدن القديمة إلى الأحياء الحديثة. في المدن التقليدية، كانت الجيرة علاقةً يوميةً مستمرةً. أما في المدن الحديثة فقد ضعفت هذه العلاقة بسبب العمارات العالية والتنقل السريع. لكن مفهوم الجار بقي حاضرًا في الذاكرة الإسلامية كرمزٍ للتضامن.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالأسرة الوحدة\u003c/b\u003e\u003cspan\u003eالأسرة وحدةٌ دينيةٌ واقتصاديةٌ واجتماعيةٌ، والعائلة الممتدّة نموذجٌ يضمن الرعاية المتبادلة بين الأجيال.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eحقوق المرأة المالية\u003c/b\u003e\u003cspan\u003eالمهر والإرث والكسب ملكٌ للمرأة، ووردت في التاريخ نساءٌ تاجراتٌ وعالماتٌ وأرباب أملاك.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالجار كرمز\u003c/b\u003e\u003cspan\u003eالجار في الإسلام يستحقّ التوريث تقريبًا، وهو رمزٌ للتضامن الاجتماعي الذي يتجاوز الحدود الجغرافية.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالتربية في البيت\u003c/b\u003e\u003cspan\u003eتربية الأطفال مسؤوليةٌ مشتركةٌ، والتعليم يبدأ في البيت بالقراءة والأدب والآداب قبل المدرسة.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالعلاقة\u003c/th\u003e\u003cth\u003eالواجب\u003c/th\u003e\u003cth\u003eالدلالة الروحية\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالزواج\u003c/td\u003e\u003ctd\u003eعقدٌ قانونيٌّ بحضور شهود\u003c/td\u003e\u003ctd\u003eالاستقرار والحماية المشتركة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالجيرة\u003c/td\u003e\u003ctd\u003eإكرام الجار وحمايته ومساعدته\u003c/td\u003e\u003ctd\u003eالتضامن الاجتماعي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالضيافة\u003c/td\u003e\u003ctd\u003eإكرام الضيف بأجود الطعام\u003c/td\u003e\u003ctd\u003eالكرم كعبادةٍ واجتماعية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eتربية الأبناء\u003c/td\u003e\u003ctd\u003eتعليم القراءة والأخلاق\u003c/td\u003e\u003ctd\u003eالاستمرارية والحفاظ على الهوية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eرعاية المسنين\u003c/td\u003e\u003ctd\u003eالعيش مع الجدّ أو بجواره\u003c/td\u003e\u003ctd\u003eالبرّ والردّ على الجميل\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eخيركم خيركم لأهله، وأنا خيركم لأهله.\u003c/p\u003e\u003ccite\u003eالنبي محمد ﷺ\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eالأسرة الإسلامية كانت وحدةً متكاملةً تجمع بين الدين والاقتصاد والتضامن الاجتماعي، ومنحت المرأة حقوقًا ماليةً مستقلةً، وجعلت من الجيرة والضيافة ركائزَ للمجتمع.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"festivals-rituals","n":"الأعياد والاحتفالات","ic":"🎉","part":"الحياة اليومية","h":"\u003carticle class=\"ch3\" id=\"festivals-rituals\" data-toc=\"الأعياد والاحتفالات\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالحياة اليومية\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٤ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٤\u003ci\u003e.\u003c/i\u003e٤\u003c/span\u003e\n            \u003ch3\u003eالأعياد والاحتفالات\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eكيف احتفل الناس في العالم الإسلامي؟ ما هي المناسبات التي أعطت الحياة إيقاعًا ومعنًى؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eالعيد في الإسلام ليس يوم عطلةٍ فقط، بل هو إعادةٌ للتوازن الروحي والاجتماعي. عيد الفطر يأتي بعد شهرٍ من الصيام والصلاة والتقرّب إلى الله، فهو احتفالٌ بالنقاء الذي حقّقه الإنسان في نفسه. وعيد الأضحى يُذكّر بقصة إبراهيم وإسماعيل، فيه يتعلّم الناس التضحية والثقة بالله. وبهذا يصير العيد في الإسلام ليس مكافأةً ماديةً على الصيام، بل احتفالٌ روحيٌّ بتحقيق الإنسان لذاته وتقرّبه من خالقه بصدقٍ وإخلاص.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت الاحتفالات تبدأ من ليلة العيد: تزيين البيوت، شراء الملابس الجديدة، إعداد الحلوى. وفي صباح العيد، يتوجّه الناس إلى المصلى في أحسن ثيابهم، يُكبّرون ويُهلّلون في الطريق. ثم يعودون لزيارة الأقارب وتبادل الهدايا والتهاني. وقد أدّت هذه التحضيرات إلى خلق أجواءٍ من الفرح تسبق العيد بأيامٍ عدة، حيث تصير المدينة ككلّ مشاركةً في الاستعداد والترقب والتهيئة النفسية للمناسبة.\u003c/p\u003e\u003cp class=\"ap\"\u003eولم تقتصر الاحتفالات على العيدين الرسميين. هناك المولد النبوي، وليلة الإسراء والمعراج، وليالي رمضان، وليالي القدر. كل مناسبةٍ لها طقوسها الخاصة: الإضاءة، الأناشيد، توزيع الطعام، قراءة القصائد. وهذه الطقوس تُعطي السنة الإسلامية إيقاعًا روحيًا متجددًا. وبهذا يصير العام الإسلامي دائرةً روحيةً متكاملةً، لا يمرّ شهرٌ إلا وفيها مناسبةٌ تُذكّر الناس بقيمهم وتجمعهم على مشاعرَ مشتركةٍ.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان للأعياد المحلية مكانةٌ أيضًا: عيد النيروز في فارس، عيد شم النسيم في مصر، عيد الأضحى في المغرب. هذه الأعياد كانت تمتزج بالتقاليد الإسلامية لتخلق هويةً محليةً فريدةً. وقد وصف المؤرخون هذه الاحتفالات بأنها 'أيام تتوقف فيها الحياة العادية لتُكرّم الذاكرة'. وبهذا يصير الاحتفال ليس تقليدًا جماعيًا فارغًا، بل طقسًا يُعيد إنتاج الذاكرة الجماعية ويُحمّل الحاضر بمعنى الماضي وآمال المستقبل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت الاحتفالات أيضًا فرصةً للإحسان. في رمضان تُفتح خزائن الأغنياء للفقراء، وفي العيد يُذبح ويُوزّع اللحم، وفي المولد تُقام الموائد العامة. وهذا يعني أن الفرحة في الإسلام ليست فرديةً بل جماعيةً، وأن السعادة الحقيقية تكون بمشاركة الآخرين. وبهذا تظلّ الفرحة في الإسلام مرتبطةً بالغير، حيث لا يكتمل عيدُ أحدٍ إلا بمشاركة من حوله، مما يُضفي على الاحتفال بعدًا أخلاقيًا إضافيًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eولم تكن الاحتفالات حكرًا على الطبقات الغنية. الفقراء أيضًا كان لهم دورهم: يُغنّون، يُزيّنون الشوارع، يُحضّرون الطعام البسيط. وقد ورد في التاريخ أن بعض المدن كانت تُقيم احتفالاتٍ عامةً تموّلها الأوقاف، فتصبح الفرحة حقًّا للجميع لا للأثرياء فقط. وقد أدّى هذا المبدأ إلى خلق ثقافةٍ احتفاليةٍ شاملةٍ، ح
