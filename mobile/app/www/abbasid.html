003e\u003cspan class=\"ttl\"\u003eالقسم الخامس: الأزمات وسقوط بغداد\u003c/span\u003e\n      \u003cspan class=\"tcnt\"\u003e٣ فصول\u003c/span\u003e\u003c/a\u003e\n    \u003c/li\u003e\n    \u003cli class=\"toc-part toc-row\"\u003e\u003cb\u003e٦\u003c/b\u003e\n      \u003ca href=\"#part-6\"\u003e\u003cspan class=\"ttl\"\u003eالقسم السادس: إرث بغداد\u003c/span\u003e\n      \u003cspan class=\"tcnt\"\u003e٣ فصول\u003c/span\u003e\u003c/a\u003e\n    \u003c/li\u003e\u003c/ol\u003e\n  \u003c/div\u003e"},{"u":"p","one":true,"id":"part-1","n":"القسم الأول: الثورة وقيام الدولة","ic":"🔥","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-1\" style=\"--c:#3A3A3A\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🔥\u003c/div\u003e\n      \u003ch2\u003eالقسم الأول: الثورة وقيام الدولة\u003c/h2\u003e\n      \u003cp\u003eفي ثلاث سنوات انتهت دولةٌ عمرها تسعون سنة، وانتقل مركز العالم الإسلامي من دمشق إلى قريةٍ على دجلة لم يكن لها اسم. وقد كانت الثورة العباسية أطول ثورة أُعدّت في التاريخ الإسلامي وأكثرها تنظيماً؛ فقد عملت ثلاثين سنة في الظل، ثم ظهرت فارتفعت راياتها السوداء، ثم جلس الخليفة الأول على المنبر في الكوفة يخطب في الناس الذين أوصلوه إلى الحكم ولم يعرفوا من هو.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#dawa-to-dawla\"\u003eمن الدعوة إلى الدولة\u003c/a\u003e\u003ca href=\"#saffah\"\u003eالسفاح وتثبيت الدولة\u003c/a\u003e\u003ca href=\"#mansur\"\u003eالمنصور وبناء الدولة\u003c/a\u003e\u003ca href=\"#baghdad\"\u003eبغداد المدينة المدورة\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"dawa-to-dawla","n":"من الدعوة إلى الدولة","ic":"🕯️","part":"القسم الأول: الثورة وقيام الدولة","h":"\u003carticle class=\"ch3\" id=\"dawa-to-dawla\" data-toc=\"من الدعوة إلى الدولة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الأول: الثورة وقيام الدولة\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ١ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e١\u003ci\u003e.\u003c/i\u003e١\u003c/span\u003e\n            \u003ch3\u003eمن الدعوة إلى الدولة\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eلم تكن الثورة العباسية انفجاراً مفاجئاً، بل كانت مشروعاً أُعدّ لجيلين كاملين. وقد بدأت في قرية الحميمة في الأردن سنة مئة للهجرة، ومرّت بثلاث مراحل: مرحلة الدعوة السرية، ثم مرحلة الظهور في خراسان، ثم مرحلة الحسم العسكري في العراق. وفي كل مرحلة كان للحركة قائدٌ مختلف وأسلوبٌ مختلف.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eبدأت الدعوة سنة مئة للهجرة على يد محمد بن عليّ بن عبد الله بن العباس، وكان رجلاً هادئاً بعيداً عن الأضواء، وقد كان يعيش في الحميمة في الأردن في ضيعةٍ صغيرة، ولم يكن له جيشٌ ولا مال. وقد اختار لحركته شعاراً واسعاً هو «الرضا من آل محمد»، ولم يُحدّد فيه اسماً، وهذا الشعار كان يستوعب كل من كان غاضباً من بني أمية لأي سبب: الشيعة الذين يريدون علياً وأولاده، والزيدية الذين يريدون من يخرج بالسيف، وحتى من كان يرى أن الحكم يجب أن يكون في قريش فقط.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بُنيت الدعوة على نظامٍ سري دقيق: إمامٌ في الحميمة يعرف كل شيء، ونقباء في الأمصار يعرف كل منهم منطقته، ودعاة يتنقلون بين المدن والقرى. وكان الداعية لا يعرف اسم الإمام الأعلى، بل يعرف نقيبه فقط، فإذا أُسر أو قُتل لم يستطع أن يُفشي أكثر من اسم واحد. وقد كان هذا التنظيم هو الذي جعل الحركة تعيش ثلاثين سنة في بلدٍ فيه عيونٌ للدولة وجواسيس للولاة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان الدعاة يتظاهرون بأعمال التجارة والحج، وكانوا يجمعون الأموال من الأنصار باسم «حقّ الإمام»، وكانوا يزورون مكة في موسم الحج للقاء بعضهم سراً. وقد رُوي أن الدعاة كانوا يُلقّبون بألقابٍ لا تدل على حقيقتهم، وكانوا يكتبون رسائلهم بالرموز، وكانوا لا يجتمعون في مكان واحد أكثر من اثنين. وقد كان هذا الأسلوب في العمل هو ما جعل الحركة تُشبه التنظيمات الحديثة أكثر من كونها حركة قبلية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد اختار العباسيون خراسان لتكون مركز ثورتهم، والسبب في ذلك أن خراسان كانت أكثر الأمصار احتقاناً في ذلك الوقت. فقد كان فيها عربٌ من قبائل متنازعة، وفيها موالٍ من الفرس دخلوا الإسلام ولم يأخذوا حقوقهم، وفيها فلاحون يشتكون من الضرائب، وفيها ولاة يتغيّرون كل سنة أو سنتين. وقد كان في هذا كله أرضاً خصبة لأي حركة تُطالب بالعدل، وقد كان العباسيون يعرفون هذا واختاروا خراسان عن علمٍ لا عن صدفة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سنة خمسٍ وعشرين ومئة مات محمد بن عليّ، فخلفه ابنه إبراهيم، وكان رجلاً حازماً زاد في نشاط الدعوة. وفي سنة تسعٍ وعشرين أرسل إبراهيم أبا مسلم الخراساني إلى خراسان، وكان شاباً في نحو الثلاثين، وكان من الموالي الفرس، ولم يكن له نسبٌ ولا قبيلة. وقد كان هذا الاختيار ذكياً؛ لأن الرجل الغريب عن القبائل لا يكون طرفاً في صراعها، فيستطيع أن يُوازن بينها ويجمعها تحت راية واحدة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سنة تسعٍ وعشرين رفعت الرايات السوداء في مرو، وكان هذا إعلاناً ببداية المرحلة العلنية. وقد استطاع أبو مسلم في سنةٍ واحدة أن يُخرج الوالي الأموي من مرو، وأن يستولي على نيسابور وهراة وبلخ، ثم على سمرقند. وقد كان يتقدّم بمنهجٍ جديد: لا يقاتل حتى يُهيّئ الأرض بالدعاية، ويستعمل الرسائل لتحريض قوّاد الأمويين على الانضمام، ويقطع خطوط الإمداد قبل أن يلقى الجيش.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الحركة عنصرٌ ثالث لم يُذكر كثيراً في كتب التاريخ: أن جماعةً كبيرة من الشيعة والزيدية انضمّت إليها وهي تحسب أنها تعمل لآل البيت الحقيقيين، أي لولد عليّ وفاطمة، لا لولد العباس. وقد كان هذا غموضاً مقصوداً في الشعار، وقد انكشف الأمر بعد ذلك حين صار الحكم للعباسيين، فشعر كثير من الأنصار أنهم خُدعوا، وثاروا بعد ذلك في حركاتٍ متعددة، ومنها حركة محمد النفس الزكية سنة خمسٍ وأربعين ومئة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه الثورة درسٌ في السياسة: أن الحركة التي تُبنى على شعارٍ واسع تنجح في الجمع وتفشل في الوفاء، لأن الشعار الواسع لا يمكن أن يُرضي كل من انضمّ إليه. وقد كان العباسيون يعرفون هذا، ولذلك بدأوا بعد وصولهم إلى الحكم بتصفية حلفائهم واحداً واحداً: قتلوا أبا مسلم، ثم قتلوا من تبقّى من الشيعة، ثم بنوا شرعيةً جديدة لا تعتمد على الشعار القديم.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eشعار «الرضا من آل محمد»\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان هذا الشعار من أذكى الشعارات في التاريخ السياسي الإسلامي؛ لأنه لم يُحدّد شخصاً ولا فرعاً، فاستوعب كل الغاضبين من غير أن يُلزم أصحابه بتعهّدٍ واضح. وقد كان الناس يسمعون «آل محمد» فيفهم كل فريقٍ ما يريد: الشيعة يفهمون علياً وأولاده، والعباسيون يفهمون العباس وأولاده، والزيدية يفهمون من يخرج بالسيف.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا الغموض قوةً في المرحلة السرية، لأنه منع الدولة من معرفة المطالب الحقيقية للحركة، وكان في الوقت نفسه خطراً في المرحلة العلنية، لأنه خلق توقّعاتٍ لا يمكن الوفاء بها. وقد ظهر هذا الخطر بعد سنة اثنتين وثلاثين ومئة في ثورات العلويين المتتالية، وفي شعور كثير من الأنصار بأنهم قاتلوا من أجل رايةٍ ثم وجدوا رايةً أخرى.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالحميمة والنقباء الاثنا عشر\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الحميمة قريةً صغيرة في الأردن، وقد كانت ضيعةً لأبناء العباس بن عبد المطلب، وفيها عاش محمد بن عليّ ثم ابنه إبراهيم. وقد كانت هذه القرية بعيدة عن دمشق وعن عيون الدولة، وكانت في الوقت نفسه قريبة من طريق الحج، فكان الناس يمرّون بها في موسم الحج فيسهل اللقاء بهم من غير أن يثير ذلك شكاً.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الحركة اثنا عشر نقيباً موزّعين على الأمصار، وكان لكل نقيبٍ منطقةٌ معروفة، وكانوا يتواصلون مع الإمام بالرسائل والرسل. وقد كان من أشهر هؤلاء النقباء سليمان بن كثير الخزاعي وأبو مسلم الخراساني، وقد كان في اختيار العدد اثني عشر إشارةً إلى نقباء بني إسرائيل وإلى نقباء الأنصار في بيعة العقبة، وهذا يدل على أن الحركة كانت تُلبس نفسها لباساً دينياً مُحبّباً للناس.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eأبو مسلم: الرجل الذي صنع الدولة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان أبو مسلم من الموالي، وقيل إن اسمه كان بهزادان، وكان من قريةٍ في خراسان، وقد نشأ في الكوفة ثم عاد إلى خراسان. وقد كان شاباً حين أُرسل إليها سنة تسعٍ وعشرين، ولم يكن له جيشٌ ولا مال، ولكنه كان يعرف كيف يُخاطب الناس وكيف يُوازن بين القبائل، وكان في الوقت نفسه لا يتردّد في القتل إذا رأى في ذلك مصلحة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد استطاع في ثلاث سنوات أن يجمع خراسان كلها تحت رايته، ثم أن يزحف إلى العراق، ثم أن يهزم الجيش الأموي في الزاب. وقد كان في نجاحه دليلٌ على أن التنظيم الحركي أقوى من العصبية القبلية إذا أُحسن بناؤه، وكان في مقتله بعد ذلك سنة سبعٍ وثلاثين دليلاً على أن من يبني الدولة لا يملكها، وأن السلطة إذا استقرّت لم تعد تحتاج إلى بانيها.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eبداية الدعوة\u003c/b\u003e\u003cspan\u003eسنة ١٠٠هـ في الحميمة بالأردن، على يد محمد بن عليّ بن العباس.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالشعار\u003c/b\u003e\u003cspan\u003e«الرضا من آل محمد»، ولم يُحدّد فيه اسم الإمام.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأبو مسلم\u003c/b\u003e\u003cspan\u003eأُرسل إلى خراسان سنة ١٢٩هـ، ورفع الرايات السوداء في مرو.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسنة الظهور\u003c/b\u003e\u003cspan\u003e١٢٩هـ، وبعدها بثلاث سنوات سقطت دمشق.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمقتل أبي مسلم\u003c/b\u003e\u003cspan\u003eسنة ١٣٧هـ بأمر المنصور، بعد أن بنى الدولة للعباسيين.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمرحلة\u003c/th\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالوصف\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالدعوة السرية\u003c/td\u003e\u003ctd\u003e١٠٠–١٢٩هـ\u003c/td\u003e\u003ctd\u003eعملٌ في الظل بنقباء ودعاة وأموال\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالظهور في خراسان\u003c/td\u003e\u003ctd\u003e١٢٩هـ\u003c/td\u003e\u003ctd\u003eرفع الرايات السوداء في مرو\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالتوسع العسكري\u003c/td\u003e\u003ctd\u003e١٣٠–١٣١هـ\u003c/td\u003e\u003ctd\u003eسقوط نيسابور وهراة وبلخ وسمرقند\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالحسم\u003c/td\u003e\u003ctd\u003e١٣٢هـ\u003c/td\u003e\u003ctd\u003eمعركة الزاب وسقوط دمشق\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eبناء الدولة\u003c/td\u003e\u003ctd\u003e١٣٢–١٣٦هـ\u003c/td\u003e\u003ctd\u003eالسفاح ثم المنصور ثم بغداد\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eالرضا من آل محمد.\u003c/p\u003e\u003ccite\u003eشعار الدعوة العباسية في مرحلتها السرية\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eثلاثون سنة من العمل في الظل، وشعارٌ غامض يستوعب كل غاضب، ونظامٌ سري لا يعرف فيه العضو إلا من فوقه، ثم قائدٌ شاب من الموالي اختير لأنه لا قبيلة له. بهذه العناصر أُسقطت دولةٌ في ثلاث سنوات، ثم بدأ العباسيون يبنون شرعيةً جديدة لا تعتمد على الشعار القديم.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"saffah","n":"السفاح وتثبيت الدولة","ic":"🗡️","part":"القسم الأول: الثورة وقيام الدولة","h":"\u003carticle class=\"ch3\" id=\"saffah\" data-toc=\"السفاح وتثبيت الدولة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الأول: الثورة وقيام الدولة\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٢ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e١\u003ci\u003e.\u003c/i\u003e٢\u003c/span\u003e\n            \u003ch3\u003eالسفاح وتثبيت الدولة\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eفي سنة اثنتين وثلاثين ومئة جلس أبو العباس عبد الله بن محمد على المنبر في الكوفة، ولُقّب «السفاح»، أي كثير السفك للدماء. وقد حكم أربع سنوات فقط، لكنه في هذه السنوات وضع أساس الدولة: نقل المركز من الشام إلى العراق، وبنى جهازاً إدارياً جديداً، وصفّى خصومه من الأمويين والعلويين معاً.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eلمّا دخل العباسيون الكوفة، لم يكن لهم فيها قصرٌ ولا خزينة، وقد جلس أبو العباس في دار الإمارة، وخطب في الناس خطبةً ذكر فيها حقّه في الخلافة، وقال إنه من أهل البيت الذين وعدهم الله، وإنه سيطأ على من خالفه. وقد كان في خطبته ما يُشبه إعلان الحرب على كل من لم يُبايع، وقد كان في ذلك الوقت أن بني أمية لا يزالون في الشام، وأن مروان بن محمد لا يزال حياً يتحرك بجيشه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان أول ما فعله أن أرسل عمّه عبد الله بن عليّ إلى الشام، فالتقى بجيش مروان في الزاب وانتصر، ثم دخل دمشق، ثم تتبّع بني أمية في كل مكان. وقد كان في هذا التتبع قسوةٌ شديدة، فقد قُتل عددٌ كبير من أبناء الأسرة الحاكمة، وفُتحت قبور الخلفاء ونُبشت وأُحرقت، ولم يبقَ منها أثرٌ يُذكر. وقد نُعي على العباسيين هذا العمل في المصادر، حتى إن بعض المؤرخين قالوا إنهم فعلوا بالقتلى ما لم يفعله أحدٌ بأحد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان السفاح يعرف أن العلويين هم الخطر القادم، لأنهم كانوا شركاء في الثورة وسيُطالبون بالحكم بعد أن صار. وقد رُوي أنه في أول خطبةٍ له أشار إلى عمّه العباس وقال إنه صاحب الحقّ، ثم قال إن أبا بكر وعمر أخذا الأمر بغير حق، وإنما آل إلى العباس. وقد كان في هذا الكلام استفزازاً للشيعة، وكان بداية الخلاف الذي سيستمر قروناً. وقد كان في هذا التصريح خطرٌ على الدولة الجديدة، لأن الشيعة كانوا أكثر من ساعدها في خراسان، وقد كان فيهم من قاتل مع أبي مسلم، فلمّا سمعوا أن الحقّ في العباس لا في عليّ شعر كثير منهم بأنه خُدع، وهذا ما فتح باب الثورات العلوية بعد ذلك.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في عهده أن بدأ انتقال مركز الدولة إلى العراق. فقد كان العباسيون قد استقرّوا في الكوفة في البداية، وكانت الكوفة مدينةً قديمة فيها أحزاب وشيعة وقبائل متنازعة، ولم تكن صالحةً لتكون عاصمة. وقد كان السفاح يُقيم في الكوفة لكنه لم يبنِ فيها قصراً، وكان يُرسل عمّاله إلى الأمصار، ويجمع المال في بيت مالٍ مؤقت. وقد كان في هذا أيضاً سببٌ آخر: أن الكوفة كانت قد ثارت على الأمويين مراتٍ كثيرة، وكان أهلها يُخرجون على كل والٍ، فلم يكن من الحكمة أن يسكنها الخليفة نفسه، وقد كان العباسيون يعرفون هذا من تجربةٍ طويلة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في عهده أيضاً أن بدأت مصادرة أموال بني أمية، وكانت هذه المصادرة مورداً مهماً للخزينة الجديدة. وقد كان السفاح يُعطي الأموال لأنصاره بسخاء، وكان يُكافئ كل من شارك في الثورة، وكان هذا ضرورياً لأن الدولة الجديدة لم يكن لها خراجٌ منتظم بعد، وكانت تعيش على الغنائم والمصادرات والعطاءات. وقد كان في هذه السياسة خطرٌ بعيد المدى: أن الدولة بدأت حياتها بلا نظامٍ مالي ثابت، وأن المال الذي جاء من المصادرات لا يدوم، فلمّا نفدت أموال بني أمية احتاجت الدولة إلى خراجٍ منتظم، وهذا ما فعله المنصور بعد ذلك بالمسح والتنظيم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في عهده أن ظهرت أول الثورات على الدولة الجديدة. فقد ثار أهل البصرة، وثارت قبائل في الجزيرة، وخرج في الأندلس عبد الرحمن الداخل فأسّس دولةً مستقلة. وقد كان في هذه الثورات دليلٌ على أن سقوط الأمويين لم يكن نهاية الصراع بل بدايته، وأن الدولة الجديدة ستقضي سنواتٍ في تثبيت نفسها قبل أن تستقر. وقد كان في هذه الثورات دلالةٌ على أن الدولة العباسية لم ترث من الأمويين دولةً مستقرة، بل ورثت إمبراطوريةً منقسمة، وأن الشرعية التي حصلت عليها بالثورة تحتاج إلى سنواتٍ من الأمن والعدل حتى تصير شرعيةً مقبولة عند الناس.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد مات السفاح سنة ستٍّ وثلاثين ومئة في الأنبار، وكان في نحو الثلاثين من عمره، وقيل إنه مات بالجدري، وقيل سُمّ. وقد كان قد أوصى بالخلافة لأخيه أبي جعفر المنصور، وقد كان في هذا الوصية أثرٌ كبير في تاريخ الدولة، لأن المنصور هو الذي بنى بغداد وثبّت الدولة وقمع الثورات، وقد كان في وصية السفاح إشارة إلى أن الأسرة كانت تُدير الأمر بوصايا لا ببيعات.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eلماذا لُقّب بالسفاح؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eكلمة «السفاح» في العربية تعني كثير السفك للدماء، وقد لُقّب بها أبو العباس لأنه كان يتتبع بني أمية بالقتل، ولأنه في أول خطبةٍ له قال إنه «السفاح المبيح» أي الذي يُبيح الدم. وقد كانت الكلمة في الأصل لقباً يُخوّف به الخصوم، ثم صارت اسماً يُعرف به في كتب التاريخ.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا اللقب دلالة على طبيعة المرحلة: أن الدولة الجديدة قامت على القتل والتصفية، لا على المفاوضة والبيعة. وقد كان هذا مختلفاً عن قيام الدولة الأموية، التي قامت على صلحٍ وبيعةٍ في عام الجماعة، وكان في هذا فرقاً في الشرعية: أن الأمويين ورثوا دولةً قائمة، وأن العباسيين بنوا دولةً على أنقاض دولة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eنقل المركز إلى العراق\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الشام مركز الدولة الأموية، وكان العباسيون يكرهونها لأنها كانت معقل خصومهم، ولأن أهلها كانوا لا يزالون يُحبّون بني أمية. وقد كان في الشام أيضاً قبائل متنازعة، وكانت دمشق مدينةً قديمة لا تصلح لبناء عاصمةٍ جديدة عليها. وقد كان العراق أنسب مكان: فيه دجلة والفرات، وفيه زراعة وخراج، وفيه طرق التجارة إلى الشرق.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في العراق أيضاً الشيعة والموالي الذين ساعدوا العباسيين، وكان في الكوفة قاعدة الثورة. لكن الكوفة نفسها لم تكن صالحة، لأنها كانت مدينةً قديمة فيها أحزاب، وقد كان العباسيون يريدون مدينةً جديدة لا سابقة لها، فبنوا بغداد بعد ذلك. وقد كان انتقال المركز من الشام إلى العراق أعظم تحوّلٍ جغرافي في تاريخ الإسلام بعد الفتوح.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eتصفية الحلفاء\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم تكن تصفية العباسيين لخصومهم مقصورة على الأمويين، بل شملت أيضاً من ساعدهم من العلويين. فقد كان العباسيون يعرفون أن العلويين سيطالبون بالحكم، لأن الشعار كان «الرضا من آل محمد»، ولأن الناس كانوا يرون في عليّ وأولاده الأحقّ. وقد كان أول ما فعلوه أن أعلنوا أن الحقّ في العباس لا في عليّ، ثم بدأوا يُضايقون العلويين ويُراقبونهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان هذا الخلاف هو الذي أنتج حركاتٍ كثيرة في العهد العباسي: حركة محمد النفس الزكية سنة خمسٍ وأربعين، وحركة أخيه إبراهيم، وحركة الحسين بن عليّ صاحب فخ سنة تسعٍ وستين، ثم ثورة العلويين في طبرستان، ثم قيام الدولة الفاطمية في المغرب. وقد كان في هذا دليلٌ على أن الشعار الذي يجمع لا يكفي لبناء شرعيةٍ دائمة.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأول خليفة\u003c/b\u003e\u003cspan\u003eأبو العباس عبد الله، ولُقّب بالسفاح، وحكم ١٣٢–١٣٦هـ.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالزاب\u003c/b\u003e\u003cspan\u003eمعركة سنة ١٣٢هـ انتهت بسقوط الدولة الأموية.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمقر\u003c/b\u003e\u003cspan\u003eالكوفة ثم الأنبار، قبل بناء بغداد سنة ١٤٥هـ.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالوصية\u003c/b\u003e\u003cspan\u003eعهد بالخلافة لأخيه المنصور، فصار الحكم في عقب المنصور.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالخصوم\u003c/b\u003e\u003cspan\u003eبنو أمية بالقتل، والعلويون بالمراقبة والتضييق.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالخليفة\u003c/th\u003e\u003cth\u003eالمدة\u003c/th\u003e\u003cth\u003eأبرز ما في عهده\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالسفاح\u003c/td\u003e\u003ctd\u003e١٣٢–١٣٦هـ\u003c/td\u003e\u003ctd\u003eتثبيت الدولة وتصفية الأمويين\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمنصور\u003c/td\u003e\u003ctd\u003e١٣٦–١٥٨هـ\u003c/td\u003e\u003ctd\u003eبناء بغداد وقمع الثورات\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمهدي\u003c/td\u003e\u003ctd\u003e١٥٨–١٦٩هـ\u003c/td\u003e\u003ctd\u003eالاستقرار والفتوح والزندقة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالهادي\u003c/td\u003e\u003ctd\u003e١٦٩–١٧٠هـ\u003c/td\u003e\u003ctd\u003eسنة واحدة وصراع مع العلويين\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالرشيد\u003c/td\u003e\u003ctd\u003e١٧٠–١٩٣هـ\u003c/td\u003e\u003ctd\u003eذروة القوة والثروة والفتنة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eأنا السفاح المبيح.\u003c/p\u003e\u003ccite\u003eمن خطبة أبي العباس في أول خلافته\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eحكم السفاح أربع سنوات فقط، لكنه نقل مركز الدولة إلى العراق، وصفّى بني أمية، وبدأ التضييق على العلويين. وقد كان عهده مرحلة انتقالٍ بين ثورةٍ قامت على شعار، ودولةٍ ستقوم على جهازٍ إداري وعاصمةٍ جديدة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"mansur","n":"المنصور وبناء الدولة","ic":"🏗️","part":"القسم الأول: الثورة وقيام الدولة","h":"\u003carticle class=\"ch3\" id=\"mansur\" data-toc=\"المنصور وبناء الدولة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الأول: الثورة وقيام الدولة\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٣ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e١\u003ci\u003e.\u003c/i\u003e٣\u003c/span\u003e\n            \u003ch3\u003eالمنصور وبناء الدولة\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eيُعدّ أبو جعفر المنصور المؤسس الحقيقي للدولة العباسية؛ فقد حكم اثنتين وعشرين سنة، وبنى بغداد، وأنشأ الدواوين، وثبّت الخراج، وقمع الثورات، وقتل أبا مسلم. وقد كان رجلاً قاسياً في السياسة، حازماً في الإدارة، ولم يكن يتردّد في القتل إذا رأى في ذلك مصلحةً للدولة.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eوُلد المنصور سنة خمسٍ وتسعين للهجرة، وكان أخا السفاح من أبيه، وقد كان أكبر منه سناً، وقد كان في الثورة مسؤولاً عن الجانب العسكري في العراق. وقد كان رجلاً طويلاً نحيفاً، في وجهه أثرٌ من جدري، وقد كان يقول الشعر ويُجيد الخطابة، وكان يعرف الفقه والحساب، وكان في الوقت نفسه من أشدّ الناس بأساً في مواجهة خصومه. وقد كان في شخصيته ما يجمع بين الفقه والسياسة والحرب، وهذا نادر، وقد كان يستعمل كل هذه الأدوات في الوقت نفسه: يقرأ الفقه ليُبرّر قراراته، ويستعمل الشعر والخطابة ليُقنع الناس، ويستعمل الجيش حين لا يُقنع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان أول قرارٍ كبير في عهده هو قتل أبي مسلم الخراساني سنة سبعٍ وثلاثين. وقد كان أبو مسلم قد صار حاكماً فعلياً لخراسان، وكان له جيشٌ كبير وأنصارٌ كثيرون، وكان يستعمل سلطته دون أن يرجع إلى الخليفة في كثير من الأمور. وقد استدعاه المنصور إلى المدائن، ثم إلى بغداد، فحذّره بعض الناس، فلم يقبل، فقتله المنصور في مجلسٍ ثم أعلن للناس أنه فعل ذلك لأنه أراد أن يخرج على الخلافة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في قتل أبي مسلم خطرٌ كبير، لأن أنصاره في خراسان كانوا يستطيعون أن يثوروا، وقد ثاروا فعلاً في حركةٍ تُعرف بحركة «المقنّع» وبحركاتٍ أخرى. لكن المنصور كان يعرف أن الدولة لا تستقيم وفيها قائدٌ يملك جيشاً مستقلاً، وأن من بنى الدولة لا يمكن أن يكون شريكاً في الحكم. وقد كان في هذا القرار درسٌ في السياسة: أن الحلفاء الذين يصنعون الدول لا يجدون مكاناً فيها بعد أن تستقر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في عهده أن ثارت ثوراتٌ كثيرة: ثورة محمد النفس الزكية في المدينة سنة خمسٍ وأربعين، وثورة أخيه إبراهيم في البصرة، وثورة سنباد في خراسان، وثورة المقنّع في ما وراء النهر، وثورة الأستاذسيس، وحركة الراوندية. وقد قمع المنصور هذه الثورات كلها بالشدة، وقد كان في ذلك يُرسل جيوشاً كبيرة، ويستعمل الحيلة مع القوة، وكان لا يُبقي على أحدٍ من قادة الثورات.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان المنصور هو الذي أنشأ نظام الوزارة بشكلٍ منظم؛ فقد كان قبله الكاتب يُسمّى كاتب الخليفة، وصار في عهده وزيراً له سلطةٌ على الدواوين. وقد كان أول من استعمل هذا اللقب خالد بن برمك، وكان من الفرس، وقد صار بعده ابنه يحيى بن خالد. وقد كان في هذا بداية نفوذ أسرة البرامكة الذي بلغ ذروته في عهد الرشيد. وقد كان في صعود البرامكة دلالةً على تحوّلٍ في الدولة: أن الوزارة صارت منصباً وراثياً في أسرةٍ واحدة، وأن الفرس صاروا يُديرون الدواوين فعلاً، وقد كان في هذا ما سيُنتج أزمةً كبيرة في عهد الرشيد حين نكب البرامكة سنة سبعٍ وثمانين ومئة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان المنصور يهتم بالخراج اهتماماً خاصاً؛ فقد أمر بمسح الأراضي في العراق، وأعاد تنظيم نظام المقاطعة، وكان يُراقب الحسابات بنفسه، وكان يقول: «المال عدّة الحرب، والخراج عمود الملك». وقد كان في عهده أن زاد الخراج زيادةً كبيرة، وقد كان في هذا ثمنٌ دفعه الفلاحون في بعض الأحيان، وقد كانت هناك ثوراتٌ بسبب الضرائب في مصر وأرمينيا وخراسان.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان المنصور هو الذي بنى بغداد سنة خمسٍ وأربعين، وقد كان في بنائها قراراً استراتيجياً بالغ الأهمية، لأنها صارت مركز العالم في العصر العباسي كله. وقد كان يريد مدينةً جديدة لا سابقة لها، تُخطّط على شكلٍ دائري، ويكون قصر الخليفة والجامع في وسطها، وتكون فيها ثكنات الجيش وأسواق التجار، وتكون على دجلة لتتصل بالبصرة والخليج والهند. وقد كان في اختيار الموقع أيضاً بُعدٌ دفاعي: أن دجلة يحمي المدينة من الشرق، وأن الفرات وقنواته تحميها من الجنوب، وأن الطرق البرية تُسيطر على خراسان والجزيرة، فكانت المدينة في موقعٍ يصعب حصاره ويَسهُل ربطه بالأطراف.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد مات المنصور سنة ثمانٍ وخمسين ومئة في الطريق إلى مكة في الحج، وقد كان قد أوصى بالخلافة لابنه المهدي، وقد كان في وصيته تفصيلٌ دقيق لشؤون الدولة ومواردها ونفقاتها، وقد رُوي أن هذه الوصية تُشبه دستوراً للدولة. وقد كان في عهده أن استقرّت الدولة، وأن صارت لها عاصمةٌ ودواوين وجيشٌ نظامي، وأن صارت قادرةً على أن تُواجه الثورات والفتن.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eقتل أبي مسلم\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان أبو مسلم قد صار بعد الثورة حاكماً لخراسان، وكان له فيها جيشٌ وأنصار، وكان يستعمل سلطةً واسعة دون أن يرجع إلى الخليفة. وقد كان المنصور يعرف أنه لا يستطيع أن يبني دولةً مركزية وفيها قائدٌ مستقل، وأن أبا مسلم قد قال له مرة كلمةً تدل على استقلاله: «أنا الذي أخرجت لك هذا الملك».\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد استدعاه المنصور إلى الحضرة، فحذّره أنصاره من الذهاب، فذهب، وقد كان معه حرسٌ كثير، فلم يستطع القتل في المجلس العام. فدبّر المنصور الأمر بأن أرسل إليه في مجلسٍ خاص، ثم أمر غلمانه فقتلوه. وقد كان في هذا القتل غدرٌ لا يُبرّر، وقد قال المنصور للناس بعد ذلك كلمةً تُنسب إليه: «إنه أراد أن يُخرج الأمر مني»، وهذا تبريرٌ سياسي لا أخلاقي.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eثورة محمد النفس الزكية\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان محمد بن عبد الله بن الحسن من أحفاد الحسن بن عليّ، وكان يُلقّب «النفس الزكية»، وقد كان أهل المدينة يُحبّونه، وقد كان العباسيون يعرفون أنه سيُطالب بالحكم. وقد خرج في المدينة سنة خمسٍ وأربعين، وبايعه الناس، فبعث إليه المنصور جيشاً بقيادة عيسى بن موسى، فقاتله وقتله، ثم عُرض رأسه في المدن.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في مقتله أثرٌ كبير في العلاقة بين العباسيين والعلويين، فقد صارت العداوة بعد ذلك عداوةً دائمة، وصار كل علويٍّ يرى أن العباسيين غاصبون، وأن الشعار الذي رفعوه كان خدعة. وقد كان في هذا أيضاً سببٌ في أن الشيعة اتجهوا إلى فكرة الإمامة المنصوصة، لأنهم رأوا أن كل من خرج بالسيف يُقتل، فصاروا ينتظرون إماماً منصوصاً عليه.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالمنصور والإدارة\u003c/h4\u003e\u003cp class=\"ap\"\u003eأنشأ المنصور نظاماً إدارياً متكاملاً: ديوان الخراج، وديوان الجند، وديوان الرسائل، وديوان البريد، وديوان الزمام. وقد كان لكل ديوان رئيسٌ وكتّاب، وكان الخليفة يُشرف على الكبار ويترك التفاصيل للوزير. وقد كان في هذا النظام تقليدٌ ساساني واضح، لأن الفرس كانوا قد طوّروا إدارةً معقدة قبل الإسلام، وقد استفاد العباسيون من خبرتهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان المنصور يستعمل الفرس في الدواوين أكثر من العرب، لأنهم كانوا يعرفون الحساب والكتابة والتنظيم، وكان في هذا بداية تحوّلٍ في الدولة: أن السلطة صارت تعتمد على الكفاءة الإدارية لا على النسب العربي. وقد كان في هذا التحول ما سيُغيّر تركيبة الدولة في القرن الثالث، حين صار كتّاب الفرس هم من يُدير الدولة فعلاً.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمدة حكمه\u003c/b\u003e\u003cspan\u003e٢٢ سنة، من ١٣٦هـ إلى ١٥٨هـ، وهو المؤسس الحقيقي للدولة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eقتل أبي مسلم\u003c/b\u003e\u003cspan\u003eسنة ١٣٧هـ، لأنه صار حاكماً مستقلاً في خراسان.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eبغداد\u003c/b\u003e\u003cspan\u003eبُنيت سنة ١٤٥هـ على دجلة، وصارت عاصمة العالم الإسلامي.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالوزارة\u003c/b\u003e\u003cspan\u003eأول من نظّمها خالد بن برمك، ثم ابنه يحيى في عهد الرشيد.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالثورات\u003c/b\u003e\u003cspan\u003eالنفس الزكية وسنباد والمقنّع والراوندية، قمعها كلها بالشدة.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالثورة\u003c/th\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالمكان\u003c/th\u003e\u003cth\u003eالنتيجة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالنفس الزكية\u003c/td\u003e\u003ctd\u003e١٤٥هـ\u003c/td\u003e\u003ctd\u003eالمدينة\u003c/td\u003e\u003ctd\u003eقُتل وعُرض رأسه في المدن\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eإبراهيم بن عبد الله\u003c/td\u003e\u003ctd\u003e١٤٥هـ\u003c/td\u003e\u003ctd\u003eالبصرة\u003c/td\u003e\u003ctd\u003eقُتل بعد معركة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eسنباد\u003c/td\u003e\u003ctd\u003e١٣٧هـ\u003c/td\u003e\u003ctd\u003eخراسان\u003c/td\u003e\u003ctd\u003eقُمعت بعد تحركٍ سريع\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمقنّع\u003c/td\u003e\u003ctd\u003e١٦٠هـ تقريباً\u003c/td\u003e\u003ctd\u003eما وراء النهر\u003c/td\u003e\u003ctd\u003eحركة طويلة انتهت بالحصار\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالراوندية\u003c/td\u003e\u003ctd\u003e١٤١هـ\u003c/td\u003e\u003ctd\u003eبغداد\u003c/td\u003e\u003ctd\u003eقُمعت في العاصمة نفسها\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eالمال عدّة الحرب، والخراج عمود الملك.\u003c/p\u003e\u003ccite\u003eكلمة تُنسب إلى المنصور في سياسته المالية\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eكان المنصور باني الدولة الحقيقي: قتل أبا مسلم ليُفرد السلطة، وقمع الثورات ليُثبّت الأمن، وأنشأ الدواوين ونظّم الخراج، وبنى بغداد لتكون مركز العالم. وقد كان قاسياً في كل ذلك، لكن الدولة التي تركها كانت قادرةً على أن تعيش خمسة قرون.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"baghdad","n":"بغداد المدينة المدورة","ic":"🌐","part":"القسم الأول: الثورة وقيام الدولة","h":"\u003carticle class=\"ch3\" id=\"baghdad\" data-toc=\"بغداد المدينة المدورة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الأول: الثورة وقيام الدولة\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٤ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e١\u003ci\u003e.\u003c/i\u003e٤\u003c/span\u003e\n            \u003ch3\u003eبغداد المدينة المدورة\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eفي سنة خمسٍ وأربعين ومئة بدأ المنصور في بناء مدينةٍ جديدة على دجلة، وسُمّيت «مدينة السلام»، ثم عُرفت بغداد. وقد بُنيت على شكلٍ دائري، وفي وسطها قصر الخليفة والجامع، وحولها أربعة أحياء، وسورٌ وخندق. وقد صارت في قرنٍ واحدٍ أكبر مدينة في العالم، وأعظم مركزٍ للعلم والتجارة في الأرض.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eاختار المنصور موضع بغداد بعد بحثٍ طويل؛ فقد أرسل رجالاً يبحثون عن موضعٍ مناسب، وقيل إنه نظر إلى الموقع بنفسه، وقال: «هذا موضعٌ تُؤتي فيه السفن من الهند والصين، وتُحمل إليه الأموال من مصر والشام». وقد كان الموقع في نقطةٍ تتقارب فيها دجلة والفرات، وعلى طريقٍ بريٍّ يربط العراق بخراسان وفارس وأذربيجان، وكان في أرضٍ صالحة للزراعة وفي مناخٍ أقلّ رطوبةً من البصرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بُنيت المدينة على شكلٍ دائري، ولذلك تُسمّى «المدينة المدورة». وكان قطرها نحو كيلومترين، وفي وسطها قصر الخليفة «قصر الذهب» وجامع المدينة، وقد كان القصر ذا قبةٍ خضراء تُرى من بعيد. وكان حول القصر ساحةٌ واسعة تُسمّى «الرحبة»، وكانت الأبواب أربعة: باب خراسان في الشمال الشرقي، وباب الشام في الشمال الغربي، وباب الكوفة في الجنوب الغربي، وباب البصرة في الجنوب الشرقي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في كل بابٍ من الأبواب حرسٌ وديوان، وكان في المدينة ثكناتٌ للجيش، ومساكن للقادة، وأسواق في الأحياء المحيطة. وقد كان المنصور يريد أن تكون المدينة معسكراً منظمًا لا مدينةً عشوائية، ولذلك جعل لكل قبيلةٍ وقائدٍ موضعاً معروفاً، وكان يمنع البناء خارج السور في البداية. وقد كان في هذا التنظيم ما يُشبه المدن العسكرية الحديثة: أن لكل وحدةٍ موقعاً معروفاً، وأن الحركة داخل المدينة مُراقبة، وأن الأبواب تُغلق في الليل، وهذا كله كان يهدف إلى منع أي تحرّكٍ مفاجئ داخل العاصمة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان البناء في البداية بالطوب اللبن، ثم أمر المنصور بأن يُبنى بالآجرّ، وقد كان في هذا تكلفةً كبيرة. وقد استقدم للبناء مهندسين وحرفيين من الشام والموصل والكوفة والبصرة، وقيل إن عدد العمال بلغ مئة ألف، وأن النفقة بلغت أربعة ملايين درهم في السنة الأولى، وقد كانت هذه أرقاماً ضخمةً في ذلك الزمان. وقد كان في هذا الإنفاق دلالةً على حجم الخراج الذي وصلت إليه الدولة بعد إصلاحات المنصور، فقد كانت الدولة قادرةً على أن تُنفق مبالغ ضخمة على بناء مدينةٍ كاملة في وقتٍ واحد دون أن تتوقف نفقات الجيش والإدارة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد نمت المدينة بسرعةٍ تفوق التخطيط، فخرج الناس يسكنون خارج السور، ونشأت أسواقٌ في الكرخ وفي الجانب الشرقي، ثم بُنيت مدينة «المحمدية» في الجانب الشرقي، ثم اتصلت بها. وفي القرن الثالث صارت بغداد مدينةً على جانبَي دجلة، وبلغ طولها عدة كيلومترات، وكان فيها حمّاماتٌ كثيرة، وأسواقٌ متخصصة، ومحلّاتٌ لكل حرفة. وقد كان في هذا النمو السريع مشكلةٌ لم يُحلّها المنصور: أن المدينة صارت أكبر من سورها، وأن الأحياء الجديدة لم تكن مُخطّطة، وأن الأسواق خرجت إلى الكرخ في الجانب الغربي، وقد كان في هذا بداية تحوّلٍ من المدينة المدورة إلى مدينةٍ مفتوحة على ضفتَي النهر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد صارت بغداد مركز التجارة العالمية. فقد كانت السفن تأتي إليها من البصرة والأبلة، وكانت القوافل تأتي من خراسان والصين، وكان فيها سوقٌ يُسمّى «سوق الورّاقين» فيه مئات الدكاكين، وكان فيها سوقٌ للكتب، وسوقٌ للرقيق، وسوقٌ للبضائع الفاخرة. وقد قيل إن في بغداد في القرن الثالث عشر ستين ألف حمّام، وهذا رقمٌ مبالغ فيه، لكنه يدل على حجم المدينة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد صارت بغداد أيضاً مركز العلم. فقد بُني فيها بيت الحكمة في عهد الرشيد والمأمون، وكانت فيها مدارس ومساجد للدرس، وكان فيها مكتباتٌ خاصة عند الأغنياء والوزراء. وقد كان الطلاب يأتون إليها من خراسان والأندلس والمغرب ومصر، وكانت العربية لغة العلم فيها، وكانت الكتب تُنسخ وتُباع في الأسواق. وقد كان في هذا التجمع العلمي ما جعل بغداد تُشبه الجامعة الكبرى؛ فقد كان الطالب يجلس إلى شيخٍ في المسجد، ثم يذهب إلى مكتبةٍ في بيت وزير، ثم يشتري كتاباً في سوق الورّاقين، وكان في المدينة من يُترجم ومن يُنسخ ومن يُجلّد ومن يُبيع، وكانت هذه كلها حرفاً مرتبطة بالعلم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بقي لبغداد مكانةٌ خاصة في ذاكرة المسلمين، حتى بعد أن سقطت سنة ستٍّ وخمسين وستمئة. وقد قيل إنه لم تكن في العالم مدينةٌ مثلها في العصر العباسي، وأن الشعراء وصفوها في قصائد كثيرة، وأن الجغرافيين كتبوا عنها صفحاتٍ طويلة. وقد كان في سقوطها صدمةٌ لم تُنسَ، لأنها لم تكن مدينةً فقط بل كانت رمزاً لمركز العالم. وقد كان في هذا الحنين إلى بغداد ما يجعل سقوطها سنة ستٍّ وخمسين وستمئة حدثاً في الوجدان أكثر منه حدثاً عسكرياً، وقد قال عنها الشاعر في رثائها أبياتاً تُروى إلى اليوم، وقد كان في بكاء الناس عليها بكاءٌ على مركزٍ للعالم لا على مدينةٍ فقط.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eلماذا الشكل الدائري؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الشكل الدائري في تخطيط المدن معروفاً قبل الإسلام، وقد بُنيت مدنٌ دائرية في فارس وفي العراق القديم، وكان في هذا الشكل رمزٌ للكون وللمركز. وقد أراد المنصور أن تكون مدينةً تدور حول قصر الخليفة، لأن هذا يُعبّر عن تصوّرٍ سياسي: أن الخليفة هو المركز الذي تدور حوله الدولة كلها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الشكل الدائري أيضاً وظيفة دفاعية: أن السور يُحيط بالمدينة من كل الجهات، وأن الأبواب الأربعة تُسيطر على الداخل والخارج، وأن الخندق يمنع الوصول إلى السور. وقد كان في هذا الشكل ما يجعل المدينة معسكراً محصّناً في الوقت نفسه الذي تكون فيه عاصمةً إدارية.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eمدينة السلام\u003c/h4\u003e\u003cp class=\"ap\"\u003eسُمّيت المدينة في البداية «مدينة السلام»، وقيل إن المنصور اختار هذا الاسم لأنه أراد أن تكون مدينةً يسود فيها السلام بعد سنوات الفتن. وقد كان في الاسم أيضاً دلالة دينية، فقد كان «دار السلام» من أسماء الجنة، وكان في هذا إشارة إلى أن الدولة الجديدة جاءت لتُقيم العدل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بقي الاسم الرسمي «مدينة السلام» في الوثائق والنقود، لكن الناس سموها «بغداد»، وهو اسمٌ فارسي معناه «عطاء الصنم» أو «بستان العدل» على اختلاف في تفسيره. وقد كان في بقاء الاسم الفارسي دلالةً على أن المدينة لم تكن عربيةً خالصة، بل كانت مدينةً عالمية تجمع الفرس والعرب والترك والهنود.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eبغداد في وصف الرحّالين\u003c/h4\u003e\u003cp class=\"ap\"\u003eوصفها الرحّالون والجغرافيون في القرنين الثالث والرابع وصفاً يُشبه الخيال: قالوا إنها أوسع مدينة في العالم، وإن فيها أسواقاً لا تنتهي، وإن فيها من الحمّامات والمدارس والمكتبات ما لا يُحصى. وقد قال أحدهم إنه رأى في بغداد سوقاً للورق وحده فيه مئة دكان، وإن الكتب كانت تُباع بالأوزان لا بالعدد لكثرتها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في وصفهم مبالغة، لكنها مبالغة تدل على حقيقة: أن بغداد كانت في ذلك العصر أكبر مركز حضري في العالم، وأنها كانت تجمع بين التجارة والعلم والإدارة في مكان واحد. وقد كان في هذا ما جعلها تُشبه المدن العالمية الحديثة أكثر من كونها مدينةً وسيطة. وقد كان في هذا الوصف أيضاً إشارة إلى أن بغداد لم تكن مدينةً إسلامية بالمعنى الديني فقط، بل كانت مدينةً تجارية عالمية، وفيها من الأديان والألسنة ما لم يكن في دمشق ولا في المدينة المنورة، وقد كان في هذا ثراءً وقلقاً في الوقت نفسه.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسنة البناء\u003c/b\u003e\u003cspan\u003e١٤٥هـ في عهد المنصور، واستمر البناء سنوات.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالاسم الرسمي\u003c/b\u003e\u003cspan\u003eمدينة السلام، وعُرفت عند الناس ببغداد.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالشكل\u003c/b\u003e\u003cspan\u003eدائري، وقطره نحو كيلومترين، وفي وسطه القصر والجامع.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالأبواب\u003c/b\u003e\u003cspan\u003eأربعة: خراسان والشام والكوفة والبصرة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمكانة\u003c/b\u003e\u003cspan\u003eأكبر مدينة في العالم في القرن الثالث الهجري.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالعنصر\u003c/th\u003e\u003cth\u003eالوصف\u003c/th\u003e\u003cth\u003eالوظيفة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eقصر الذهب\u003c/td\u003e\u003ctd\u003eفي وسط المدينة بقبةٍ خضراء\u003c/td\u003e\u003ctd\u003eمقر الخليفة والسلطة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالجامع\u003c/td\u003e\u003ctd\u003eبجانب القصر\u003c/td\u003e\u003ctd\u003eالصلاة والخطبة والاجتماع العام\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالرحبة\u003c/td\u003e\u003ctd\u003eساحة واسعة حول القصر\u003c/td\u003e\u003ctd\u003eالحرس والاستقبالات\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالأبواب الأربعة\u003c/td\u003e\u003ctd\u003eعلى الجهات الأربع\u003c/td\u003e\u003ctd\u003eالسيطرة على الدخول والخروج\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالكرخ\u003c/td\u003e\u003ctd\u003eسوق في الجانب الغربي\u003c/td\u003e\u003ctd\u003eالتجارة والصناعة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eهذا موضعٌ تُؤتى فيه السفن من الهند والصين، وتُحمل إليه الأموال من مصر والشام.\u003c/p\u003e\u003ccite\u003eكلمة تُنسب إلى المنصور في وصف موضع بغداد\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eبغداد لم تكن مدينةً فقط، بل كانت مشروعاً سياسياً: مركزٌ يدور حوله كل شيء، وسورٌ يحمي، وأربعة أبواب تُسيطر، وأسواقٌ تربط العالم. وقد صارت في قرنٍ أكبر مدينة في الأرض، وبقيت رمزاً لمركز العالم الإسلامي حتى سقطت.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-2","n":"القسم الثاني: العهد الذهبي","ic":"📚","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-2\" style=\"--c:#3A3A3A\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e📚\u003c/div\u003e\n      \u003ch2\u003eالقسم الثاني: العهد الذهبي\u003c/h2\u003e\n      \u003cp\u003eبين سنة ثمانٍ وخمسين ومئة وسنة ثماني عشرة ومئتين عاشت الدولة العباسية أزهى عصورها: خراجٌ وفير، وجيوشٌ تصل إلى حدود الصين وأوروبا، وبغداد أكبر مدينة في العالم، وخزينةٌ تُنفق على العلم أكثر مما تُنفق على الحرب. وقد كان هذا العهد هو الذي أنتج الحضارة الإسلامية بالمعنى الكامل: بيت الحكمة، والترجمة، والجبر، والطب، والفلسفة.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#mahdi-hadi\"\u003eالمهدي والهادي\u003c/a\u003e\u003ca href=\"#harun-rashid\"\u003eهارون الرشيد\u003c/a\u003e\u003ca href=\"#barmakids\"\u003eالبرامكة ونكبتهم\u003c/a\u003e\u003ca href=\"#amin-mamun\"\u003eالأمين والمأمون\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"mahdi-hadi","n":"المهدي والهادي","ic":"🌤️","part":"القسم الثاني: العهد الذهبي","h":"\u003carticle class=\"ch3\" id=\"mahdi-hadi\" data-toc=\"المهدي والهادي\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الثاني: العهد الذهبي\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ١ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٢\u003ci\u003e.\u003c/i\u003e١\u003c/span\u003e\n            \u003ch3\u003eالمهدي والهادي\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eبعد المنصور جاء ابنه المهدي، فحكم عشر سنوات كانت سنوات استقرارٍ وثراء، ثم جاء الهادي فحكم سنة واحدة فقط، لكنه في هذه السنة دخل في صراعٍ حادّ مع العلويين ومع أمه الخيزران. وقد كانت هاتان الفترتان مرحلة انتقالٍ بين دولةٍ تُبنى ودولةٍ تبلغ ذروتها.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eبويع المهدي سنة ثمانٍ وخمسين ومئة، وكان أبوه المنصور قد أوصى له، وكان في نحو الخامسة والعشرين من عمره. وقد كان المهدي رجلاً كريماً جواداً، يُحبّ الشعر والغناء، ويُجزل العطاء، وكان على عكس أبيه في الشدة والاقتصاد. وقد كان في عهده أن استقرّت الدولة، وأن نقصت الثورات، وأن زاد الخراج، وأن عاشت بغداد سنواتٍ من الرفاهية. وقد كان في هذا الاستقرار سببٌ مباشر: أن المنصور ترك لابنه دولةً موحّدة وخزينةً ممتلئة وجهازاً إدارياً جاهزاً، فلم يكن على المهدي أن يبني، بل كان عليه أن يُدير ويُوسّع، وهذا أسهل بكثير في تاريخ الدول.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان من أهم ما فعله أنه بدأ حركة «الزندقة»، وهي حركة تُشير إلى من كان يُظهر الإسلام ويُبطن غيره، وقد كانت في ذلك الوقت تُستعمل أيضاً ضد الشعراء والأدباء الذين يُتّهمون بالإلحاد. وقد أنشأ المهدي ديواناً خاصاً لهذا الأمر يُسمّى «ديوان الزنادقة»، وكان يُحاكم فيه المتّهمون، وقد قُتل في عهده عددٌ من الشعراء، ومنهم بشار بن برد الذي قُتل سنة سبعٍ وستين ومئة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في عهد المهدي أن توقفت الفتوح الكبرى في الشرق، ثم استُؤنفت في آسيا الصغرى؛ فقد أرسل جيوشه إلى الروم، ووصلت إلى أنقرة، وأجبرت الإمبراطورة إيريني على أن تدفع جزيةً سنوية. وقد كان في هذا انقلاباً في العلاقة مع بيزنطة: أن الدولة العباسية صارت تفرض الجزية على الروم بعد أن كان الروم يفرضونها على المسلمين. وقد كان في هذه الحملة أثرٌ نفسي كبير: أن المسلمين صاروا يفرضون الجزية على الروم في عقر دارهم، وقد كان في هذا ما رفع مكانة الخليفة في أعين الناس، وجعل عهده يُذكر بأنه عهد عزٍّ بعد سنواتٍ من الفتن الداخلية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان المهدي أول خليفةٍ عباسي يُعهد بالخلافة لاثنين من بعده: لابنه موسى الهادي ثم لابنه هارون. وقد كان في هذا العهد ترتيباً خطيراً، لأنه جعل الأخوين في موضع التنافس، ولأن لكل واحدٍ منهما أنصاراً وأماً مختلفة. وقد كان في هذا ما سيُنتج الفتنة بين الأمين والمأمون بعد ذلك. وقد كان في هذا الترتيب خطرٌ واضح: أن الأمين والمأمون كانا أخوين من أمّين مختلفتين، وأن لكل واحدٍ منهما أنصاراً من قبائل وأقاليم مختلفة، فصار الخلافة في بيتٍ واحد وكأنها صراعٌ بين عربٍ وفرس، وهذا ما انفجر بعد ذلك.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد مات المهدي سنة تسعٍ وستين ومئة في أثناء حملةٍ إلى الحديقة، وقيل إنه مات في الصيد، وقد كان في نحو الثالثة والأربعين. وقد كان موته مفاجئاً، وقد رُوي أن امرأةً كانت معه في الحديقة، وأنها دفعته أو خنقته، وقد كانت هذه من القصص التي تتناقلها المصادر دون أن تُثبتها. وقد كان في موته المفاجئ أثرٌ سياسي كبير: أن الدولة كانت في حاجة إلى خليفةٍ ناضج، فجاء الهادي شاباً في الثالثة والعشرين، ولم يكن له من الخبرة ما لأبيه، وكان في الوقت نفسه في صراعٍ مع أمه، فكانت السنوات التالية سنوات اضطراب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد خلفه ابنه موسى الهادي، وكان في نحو الثالثة والعشرين، وقد كان شاباً قوياً شجاعاً، وقد كان في عهده أن خرج الحسين بن عليّ صاحب فخ في المدينة سنة تسعٍ وستين، فقاتله جيش العباسيين وقتله في موضعٍ يُسمّى فخّ قرب مكة. وقد كان في مقتله أثرٌ كبير في الوجدان، حتى قيل إن الإمام مالك بن أنس قال كلمةً في ذلك، وإن الناس في المدينة سموه «قتيل فخّ».\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في عهد الهادي صراعٌ مع أمه الخيزران، وكانت امرأةً قويةً ذات نفوذ، وقد كان أبوه المهدي قد أعطاها سلطةً في الدولة. وقد أراد الهادي أن يُخرجها من السياسة، فقالت له كلمةً تُروى: «ما لي ولك، أما تستحي؟»، وقد رُوي أن الهادي هدّدها، وأنها خشيت أن يُخرجها من القصر. وقد مات الهادي سنة سبعين ومئة بعد سنةٍ من خلافته، وقيل إن أمه دبّرت قتله، وقيل مات بالمرض.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في موت الهادي مفارقةٌ في تاريخ الدولة: أن خليفةً واحداً حكم سنةً واحدة فقط، وأن أخاه هارون وصل بعده إلى الحكم في سنٍّ مبكرة، فحكم ثلاثاً وعشرين سنة كانت أزهى عصور الدولة. وقد كان في هذا دلالة على أن تاريخ الدول لا يُقاس بطول العهود بل بأثرها، وأن سنةً واحدة قد تُنتج فتنةً، وقد تُنتج انتقالاً سلساً. وقد كان في هذا الانتقال السريع دلالة على أن الدولة كانت قد صارت مؤسسةً لها جهازٌ يستمر بعد موت الخليفة، وأن الخلافة لم تكن تتوقف على شخص، وهذا فرقٌ بين الدولة الناشئة والدولة المؤسسية.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eديوان الزنادقة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان «الزندقة» في الأصل مذهباً فارسياً قديماً، ثم صارت الكلمة تُطلق في العهد العباسي على كل من يُتّهم بالإلحاد أو بالقول بقدم العالم أو بإنكار النبوة. وقد أنشأ المهدي ديواناً خاصاً يُحاكم فيه المتّهمون، وكان هذا الديوان يُشبه محكمةً سياسية أكثر من كونه محكمةً دينية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه المحاكمات خطرٌ كبير على حرية الفكر، لأن الاتهام كان يستعمل أحياناً في تصفية الحسابات الشخصية والسياسية. وقد قُتل بشار بن برد، وكان من أعظم شعراء العربية، وقُتل غيره، وقد كان في هذا ما جعل بعض الأدباء يخافون من إظهار آرائهم في العقيدة والفلسفة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eمقتل الحسين صاحب فخّ\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الحسين بن عليّ بن الحسن من أحفاد الحسن، وقد خرج في المدينة سنة تسعٍ وستين ومئة، وكان معه عددٌ من العلويين والأنصار، وكان يريد أن يُعيد الأمر إلى أهل البيت. وقد أرسل إليه الهادي جيشاً كبيراً بقيادة موسى بن عيسى، فقاتله في موضعٍ يُسمّى فخّاً، وهو موضعٌ بين مكة والمدينة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد قُتل الحسين وأصحابه، ومُثّل بجسده، وقد كان في هذا العمل قسوةٌ زائدة، وقد رُوي أن بعض أهل المدينة غضبوا غضباً شديداً، وأن امرأةً من أهل البيت قالت كلمةً في ذلك تُروى في المصادر. وقد كان في مقتل فخّ استمراراً لسلسلةٍ من مقتل العلويين بدأت بمقتل محمد النفس الزكية سنة خمسٍ وأربعين.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالخيزران ونفوذ الأم\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الخيزران أمّ الهادي والرشيد، وكانت من أصلٍ يماني، وقد كانت زوجة المهدي، وقد أعطاها نفوذاً في الدولة حتى صارت تُوقّع على الوثائق. وقد كان في هذا سابقةً في تاريخ الدولة الإسلامية: أن تكون للمرأة سلطةٌ فعلية في القصر، وأن يُشار إليها في الخطبة أحياناً.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا النفوذ خطرٌ على الدولة، لأن القصر صار مركز صراعٍ بين الأم والابن، وبين أنصار كل منهما. وقد ظهر هذا الصراع في عهد الهادي، ثم في عهد الرشيد، حيث استمرت الخيزران ذات نفوذ حتى موتها سنة تسعٍ وسبعين ومئة، وبعد موتها استقلّ الرشيد بالحكم. وقد كان في موتها أيضاً نهاية مرحلةٍ من نفوذ النساء في القصر العباسي، فقد كانت الخيزران آخر امرأةٍ كان لها هذا النفوذ المباشر في القرار، ثم صار النفوذ بعدها للوزراء والقوّاد، ثم للأتراك بعد ذلك.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمهدي\u003c/b\u003e\u003cspan\u003eحكم ١٥٨–١٦٩هـ، وكان عهده عهد استقرار وثراء.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالهادي\u003c/b\u003e\u003cspan\u003eحكم سنة واحدة ١٦٩–١٧٠هـ، ودخل في صراعٍ مع أمه.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eديوان الزنادقة\u003c/b\u003e\u003cspan\u003eأنشأه المهدي لمحاكمة المتّهمين بالإلحاد.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eفخّ\u003c/b\u003e\u003cspan\u003eموضع قُتل فيه الحسين بن عليّ سنة ١٦٩هـ.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالخيزران\u003c/b\u003e\u003cspan\u003eأم الهادي والرشيد، وكان لها نفوذ كبير في القصر.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالخليفة\u003c/th\u003e\u003cth\u003eالمدة\u003c/th\u003e\u003cth\u003eأبرز ما في عهده\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالمهدي\u003c/td\u003e\u003ctd\u003e١٥٨–١٦٩هـ\u003c/td\u003e\u003ctd\u003eاستقرار وثراء وحملات على الروم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالهادي\u003c/td\u003e\u003ctd\u003e١٦٩–١٧٠هـ\u003c/td\u003e\u003ctd\u003eمقتل الحسين صاحب فخّ والصراع مع الخيزران\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالرشيد\u003c/td\u003e\u003ctd\u003e١٧٠–١٩٣هـ\u003c/td\u003e\u003ctd\u003eذروة القوة والثروة والفتنة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالأمين\u003c/td\u003e\u003ctd\u003e١٩٣–١٩٨هـ\u003c/td\u003e\u003ctd\u003eحربٌ داخلية وسقوط بغداد\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمأمون\u003c/td\u003e\u003ctd\u003e١٩٨–٢١٨هـ\u003c/td\u003e\u003ctd\u003eالترجمة والعلم والفتنة مع العلويين\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eما لي ولك، أما تستحي؟\u003c/p\u003e\u003ccite\u003eكلمة تُنسب إلى الخيزران في صراعها مع ابنها الهادي\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eكان عهد المهدي سنوات استقرارٍ وثراء، وعهد الهادي سنةً واحدة من الصراع. وفي هذين العهدين ظهر ديوان الزنادقة، وقُتل الحسين صاحب فخّ، وصعد نفوذ الخيزران، وترتّب الإرث بين الأخوين ترتيباً سيُنتج حرباً داخلية.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"harun-rashid","n":"هارون الرشيد","ic":"👑","part":"القسم الثاني: العهد الذهبي","h":"\u003carticle class=\"ch3\" id=\"harun-rashid\" data-toc=\"هارون الرشيد\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الثاني: العهد الذهبي\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٢ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٢\u003ci\u003e.\u003c/i\u003e٢\u003c/span\u003e\n            \u003ch3\u003eهارون الرشيد\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eصار هارون الرشيد خليفةً سنة سبعين ومئة، وكان في نحو الخامسة والعشرين، وحكم ثلاثاً وعشرين سنة. وفي عهده بلغت الدولة أقصى قوتها وثرائها، وصارت بغداد مدينةً لا نظير لها، وامتدّ سلطانها من المحيط إلى حدود الصين. وقد صار اسمه في أوروبا رمزاً للثروة والحكمة، حتى إن ملوك الفرنجة كانوا يُرسلون إليه الهدايا ويطلبون وده.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eوُلد هارون سنة ثمانٍ وأربعين ومئة، وكان أبوه المهدي قد ولاّه العهد بعد أخيه الهادي، وقد كان في شبابه قائداً عسكرياً؛ فقد أرسله أبوه سنة ثلاثٍ وستين على رأس حملةٍ إلى الروم، فبلغ البوسفور، وأجبر الإمبراطورة إيريني على الصلح وعلى دفع الجزية. وقد كان في هذه الحملة ما جعله معروفاً في الشام والروم قبل أن يصير خليفة. وقد كان في هذه الحملة تدريبٌ له على قيادة الجيوش وإدارة الأقاليم، وقد كان الرشيد أول خليفةٍ عباسي يقود بنفسه حملةً كبيرة، وقد كان في هذا ما جعله محبوباً عند الجند، لأنهم رأوا فيه قائداً لا مجرد وارثٍ للعرش.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في عهده أن بلغ الخراج أرقاماً لم تُعرف قبل ذلك، وقد رُوي أن خراج الدولة في سنة ستٍّ وسبعين ومئة بلغ نحو أربعمئة مليون درهم، وقد كان في هذا الرقم مبالغة، لكنه يدل على حجم الاقتصاد. وقد كان في بغداد في عهده أسواقٌ لا تُغلق، وكانت التجارة تصل إلى الصين والهند وإفريقية وأوروبا، وكانت الخزينة تُنفق على العمارة والجيش والعلم. وقد كان في هذا الثراء ما جعل بغداد مدينةً لا نظير لها في العالم، وقد كان في هذا أيضاً خطرٌ لم يُلحظ: أن الدولة صارت تُنفق بلا حساب، وأن الخراج الذي جاء من الزراعة والتجارة لم يكن كافياً لكل هذا البذخ في المدى الطويل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان الرشيد يُحبّ العلم والأدب، وكان يُجالس العلماء والشعراء، وكان يُجزل العطاء للمترجمين والأطباء والمنجمين. وقد كان في عهده أن بدأ الاهتمام المنظم بترجمة كتب اليونان والفرس والهند، وقد كان هذا الاهتمام هو الذي أنتج بعد ذلك بيت الحكمة في عهد المأمون. وقد كان في بلاطه من العلماء من يُعدّون من أكابر عصره، مثل أبي يوسف القاضي والكسائي النحوي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في عهده أن ازداد نفوذ البرامكة، وهم أسرةٌ من الفرس برزت في عهد المنصور، وصار يحيى بن خالد البرمكي وزيراً للرشيد، وكان له سلطةٌ واسعة، وكان أبناؤه الفضل وجعفر من أقرب الناس إلى الخليفة. وقد كان في هذا النفوذ خطرٌ على الدولة، لأن الوزير صار أقوى من كثير من الأمراء، ولأن أموال البرامكة صارت تُنافس أموال الخلافة. وقد كان في هذا النفوذ ما جعل البرامكة يُسيطرون على البريد أيضاً، وهذا يعني أنهم كانوا يعرفون أخبار الأمصار قبل الخليفة، وقد كان في هذا خطرٌ على السلطة لا يُحتمل في أي دولة، وقد كان هذا أحد أسباب النكبة بعد ذلك.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في عهده أيضاً أن بدأت الفتنة في الأطراف. فقد خرجت ثوراتٌ في مصر والشام واليمن، وخرجت حركةٌ في خراسان بقيادة رافع بن الليث، وخرجت حركاتٌ علوية في الحجاز واليمن. وقد كان الرشيد يُرسل الجيوش إلى هذه الثورات، وكان يُقمعها بالشدة، وكان في الوقت نفسه يُرسل العطاء إلى أهل الحرمين ليُبقي على ولائهم. وقد كان في هذه الثورات دلالة على أن الدولة كانت قويةً في المركز وضعيفةً في الأطراف، وأن الأطراف كانت تُثور كلما ضعف الجيش أو تأخرت الأعطيات، وأن قمع الثورة لم يكن يُعالج سببها بل يُؤجّل انفجارها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في عهده أن سقطت برقة في المغرب، ثم قامت دولة الأدارسة في المغرب الأقصى سنة اثنتين وسبعين ومئة، وقامت دولة الأغالبة في إفريقية سنة أربعٍ وثمانين. وقد كان في هذا بداية التشظي الذي سيتسع بعد ذلك، وقد كان الرشيد يعرف ذلك، ولذلك قسّم الدولة بين ابنيه في وصيةٍ مشهورة، فأعطى الأمين العراق والشام ومصر وإفريقية، وأعطى المأمون خراسان وما وراء النهر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان الرشيد في آخر حياته قد خرج إلى خراسان لقمع ثورة رافع بن الليث، فمرض في الطريق، ومات في طوس سنة ثلاثٍ وتسعين ومئة، وكان في نحو الخامسة والأربعين. وقد دُفن في طوس، وقبره معروف إلى اليوم، وقد كان موته بداية سلسلةٍ من الفتن، لأن ترتيب الإرث بين ابنيه لم يكن واضحاً بما يكفي، ولأن كل واحدٍ منهما كان له جيشٌ وأمٌّ مختلفة. وقد كان في هذا الترتيب مشكلةٌ لم تُحلّ: أن المأمون كان الأكبر سناً في بعض الروايات، وأنه كان أكفأ، لكن الأمين كان ابن زبيدة العربية، وكانت القبائل العربية في بغداد تُفضّله، فصار الإرث مسألة عصبيةٍ لا مسألة كفاءة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في شخصية الرشيد تناقضٌ ظاهر: فقد كان حاجاً كثير الحج، وكان يُصلّي في اليوم مئة ركعة، وكان يُبكي نفسه في الموعظة، وكان في الوقت نفسه قاسياً في قمع الثورات، وقد قتل في يومٍ واحدٍ عدداً كبيراً من العلويين. وقد كان في هذا التناقض ما يجعل المؤرخين يختلفون فيه: بين من يراه أعظم خلفاء بني العباس، ومن يراه بداية الانحدار. وقد كان في هذا التناقض ما يجعل الحكم عليه صعباً، لأن المؤرخ لا يستطيع أن يفصل بين الشخص وبين سياسته: فقد كان الرشيد رجلاً متديناً في حياته الخاصة، وكان في الوقت نفسه يُدير دولةً بالقتل والمصادرة، وقد كان في هذا ما يُشبه حياة كثير من الحكام في التاريخ.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالرشيد في الوجدان الأوروبي\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يكن اسم هارون الرشيد معروفاً في أوروبا من كتب التاريخ، بل من حكايات «ألف ليلة وليلة» التي تُرجمت في القرن الثامن عشر، وفيها صورة خليفةٍ عادل يطوف في الليل ليعرف أحوال الناس. وقد كانت هذه الصورة خياليةً في كثير من تفاصيلها، لكنها كانت مبنية على شهرةٍ حقيقية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في العلاقة بين الرشيد وشارلمان دليلٌ على مكانة الدولة: فقد أرسل شارلمان سفارةً إلى بغداد سنة سبعٍ وتسعين ومئة، وأرسل الرشيد سفارةً إلى آخن، وقد كان في الهدايا التي تبادلاها ساعةٌ مائية وفيلٌ ونسيجٌ فاخر. وقد كان في هذه العلاقة دلالة على أن الدولة العباسية كانت في ذلك الوقت قوةً عالمية لا تُقارن بممالك أوروبا.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eبركة الخراج وثروة الدولة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الخراج في عهد الرشيد يُقدّر بمئات الملايين من الدراهم، وكان يُحصّل من العراق ومصر والشام وخراسان وفارس، وكانت الخزينة تنفق منه على الجيش والبحرية والعمارة والعلم والبريد. وقد كان في هذا الثراء ما جعل بغداد مدينةً استثنائية في ذلك العصر. وقد كان في هذا الثراء أيضاً أثرٌ ثقافي: أن البلاط صار قادراً على أن يُنفق على الشعراء والعلماء والمغنين، وأن بغداد صارت مركزاً للفنون، وقد كان في هذا ما جعل الحياة الثقافية في العصر العباسي أغنى من كل ما سبقها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا الثراء خطرٌ أيضاً: أن الدولة صارت تُنفق أكثر مما يجب، وأن البلاط صار مركز بذخٍ لا مركز إدارة، وأن الفوارق بين الطبقات اتسعت. وقد كان في هذا ما يُفسّر لماذا انهارت الدولة بعد ذلك بسرعة: لأن الرفاهية التي بُنيت على الخراج لم تكن مبنيةً على إنتاجٍ حقيقي.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eتقسيم الإرث بين الأمين والمأمون\u003c/h4\u003e\u003cp class=\"ap\"\u003eفي سنة خمسٍ وثمانين ومئة كتب الرشيد وثيقةً تُعرف بـ«عهد الأمان»، وقد قسّم فيها الدولة بين ابنيه: أعطى الأمين الخلافة والعراق والشام ومصر وإفريقية، وأعطى المأمون خراسان وما وراء النهر وسجستان والري، وشرط أن يكون المأمون والياً للأمين، وأن يكون له استقلالٌ في إقليمه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه الوثيقة محاولةً لتفادي الحرب، لكنها كانت في الحقيقة سبباً فيها، لأنها أعطت المأمون جيشاً وإقليماً واسعاً، ثم جعلته تابعاً لأخيه. وقد كانت الحرب بينهما بعد ذلك نتيجةً حتمية، لأن السلطة لا تُقسّم بهذا الشكل، ولأن كل واحدٍ منهما كان يرى نفسه الأحقّ.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمدة حكمه\u003c/b\u003e\u003cspan\u003e٢٣ سنة، من ١٧٠هـ إلى ١٩٣هـ.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eحملته على الروم\u003c/b\u003e\u003cspan\u003eسنة ١٦٣هـ، وبلغت البوسفور وأجبرت إيريني على الجزية.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالبرامكة\u003c/b\u003e\u003cspan\u003eأسرة فارسية صار لها نفوذ كبير في عهده حتى نكبهم سنة ١٨٧هـ.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eعهد الأمان\u003c/b\u003e\u003cspan\u003eوثيقة قسم فيها الدولة بين الأمين والمأمون.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eوفاته\u003c/b\u003e\u003cspan\u003e١٩٣هـ في طوس، وقبره معروف هناك.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمجال\u003c/th\u003e\u003cth\u003eالحال في عهد الرشيد\u003c/th\u003e\u003cth\u003eالأثر البعيد\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالخراج\u003c/td\u003e\u003ctd\u003eمئات الملايين من الدراهم\u003c/td\u003e\u003ctd\u003eثراءٌ وبذخٌ ثم أزمة مالية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالتجارة\u003c/td\u003e\u003ctd\u003eطرقٌ إلى الصين والهند وأوروبا\u003c/td\u003e\u003ctd\u003eبغداد أكبر سوقٍ في العالم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالعلم\u003c/td\u003e\u003ctd\u003eبداية الترجمة المنظمة\u003c/td\u003e\u003ctd\u003eبيت الحكمة في عهد المأمون\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالوزارة\u003c/td\u003e\u003ctd\u003eنفوذ البرامكة\u003c/td\u003e\u003ctd\u003eنكبة البرامكة سنة ١٨٧هـ\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالأطراف\u003c/td\u003e\u003ctd\u003eثورات وقيام دول مستقلة\u003c/td\u003e\u003ctd\u003eبداية التشظي\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eإنّي رأيتُ الناس في طلب الدنيا كالسابح في البحر، لا يأمن الغرق حتى يبلغ الساحل.\u003c/p\u003e\u003ccite\u003eمن كلام يُنسب إلى بلاط الرشيد في وصف أحوال الناس\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eكان عهد الرشيد ذروة الدولة في القوة والثراء والشهرة، لكنه كان أيضاً بداية التشظي: ثوراتٌ في الأطراف، ودولٌ مستقلة في المغرب، ونفوذٌ متزايد للبرامكة، وتقسيمٌ للإرث بين ابنين. وقد مات في طوس وترك دولةً عظيمةً في الظاهر، هشّةً من الداخل.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"barmakids","n":"البرامكة ونكبتهم","ic":"⚖️","part":"القسم الثاني: العهد الذهبي","h":"\u003carticle class=\"ch3\" id=\"barmakids\" data-toc=\"البرامكة ونكبتهم\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الثاني: العهد الذهبي\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٣ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٢\u003ci\u003e.\u003c/i\u003e٣\u003c/span\u003e\n            \u003ch3\u003eالبرامكة ونكبتهم\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eلم تكن البرامكة مجرد أسرةٍ من الوزراء، بل كانوا دولةً داخل الدولة. فقد كانوا من أصلٍ فارسي من مدينة بلخ، وكانوا في الأصل سدنةً لمعبدٍ بوذي، ثم دخلوا الإسلام، ثم صاروا من أقوى أسر الدولة. وقد بلغ نفوذهم في عهد الرشيد حداً جعل الخليفة يشعر أن عرشه ليس له وحده.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eبدأ صعود البرامكة في عهد المنصور، حين صار خالد بن برمك وزيراً له، ثم في عهد المهدي حين صار ابنه يحيى مُعلّماً للرشيد ومربياً له. وقد كان يحيى بن خالد هو الذي دبّر للرشيد الخلافة بعد موت الهادي، وقد كان له فضلٌ عليه، وكان الرشيد يُسمّيه «أبي» من كثرة ما كان يُعظّمه. وقد كان في هذا الفضل ما جعل الرشيد يُعطي يحيى سلطةً واسعة، وقد كان يحيى يستعملها بكفاءة، لكنه كان يستعملها أيضاً لتمكين أسرته، وقد كان في هذا الجمع بين الكفاءة والتمكين ما يجعل النهاية مسألة وقتٍ لا مسألة سبب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في البرامكة كفاءةٌ إدارية عالية؛ فقد كانوا يعرفون الحساب والخراج والكتابة، وكانوا يُديرون الدواوين بكفاءة، وكانوا يُشرفون على البريد وعلى الخزينة. وقد كان الفضل بن يحيى والياً على خراسان، وكان جعفر بن يحيى نديمَ الخليفة وأخاه في المجلس، وكان موسى بن يحيى والياً على بعض الأمصار. وقد كان في هذا التوزيع ما يجعل الأسرة تسيطر على مفاصل الدولة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في نفوذهم ما يثير القلق: فقد كانوا يُعطون ويُمنعون دون أن يرجعوا إلى الخليفة، وكانت أموالهم تُنافس أموال الدولة، وكانت لهم شبكةٌ من العملاء في الأمصار. وقد كان في هذا ما جعل الرشيد يشعر بأنه صار ملكاً بلا سلطة، وأن الوزير صار هو الحاكم الفعلي. وقد كان في هذا الوضع ما يُشبه الدولة داخل الدولة، وقد كان الخليفة في مثل هذه الحالة أمام خيارين: إما أن يقبل أن يكون ملكاً بلا سلطة، وإما أن يُصفّي الوزير ولو كان أكفأ الناس، وقد اختار الرشيد الثاني كما اختار المنصور الأول حين قتل أبا مسلم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي ليلةٍ من ليالي سنة سبعٍ وثمانين ومئة، أمر الرشيد باعتقال البرامكة جميعاً. وقد قُتل جعفر، وسُجن يحيى والفضل وموسى، وصُودرت أموالهم، وقد كان في هذا الحدث ما يُشبه الانقلاب داخل القصر. وقد رُوي أن الرشيد كان قد أمر بقتل جعفر في مجلسٍ خاص، وأنه لم يُعلن السبب للناس، وأنه كتب إلى الأمصار بأن يُبايعوا على البراءة من البرامكة. وقد كان في هذه البيعة على البراءة من البرامكة إجراءً غير مسبوق: أن يُطلب من الناس أن يتبرّؤوا من أسرةٍ مسلمةٍ خدمت الدولة، وقد كان في هذا ما يدل على أن النكبة كانت سياسيةً لا دينية، وأن الخليفة أراد أن يجعل من التبرّؤ اختباراً للولاء.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد اختلفت الروايات في سبب النكبة اختلافاً كبيراً. فمنها ما يقول إن السبب هو علاقة جعفر بأخت الرشيد عباسة، وأن الرشيد غضب لذلك. ومنها ما يقول إن السبب هو محاولة البرامكة إطلاق سراح أحد العلويين، وأن الرشيد رأى في ذلك خروجاً عليه. ومنها ما يقول إن السبب هو أن الرشيد أراد أن يستعيد سلطته من وزيرٍ صار أقوى منه، وأن كل ما قيل غير ذلك كان تُبريراً.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالرأي الأرجح عند المؤرخين المعاصرين أن النكبة كانت قراراً سياسياً، وأن الرشيد أراد أن يُنهي نفوذ أسرةٍ صارت دولةً داخل دولته. وقد كان في هذا درسٌ في العلاقة بين الحاكم ووزيره: أن الوزير القوي يصير خطراً حين يملك من المال والرجال ما يجعله قادراً على الاستقلال، وأن الحاكم الذي يشعر بذلك يُبادره قبل أن يُبادره. وقد كان في هذا الدرس ما يتكرّر في تاريخ الدول: أن الوزير الذي يبلغ قوةً تُنازع الخليفة لا يبقى، وأن النكبة لا تكون بسبب خطأٍ واحد بل بسبب تراكم قوة، وأن الحاكم الذي يشعر بالخطر يُبادر قبل أن يُبادر، ولو كان في ذلك إضعافٌ لدولته.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في نكبة البرامكة أثرٌ كبير على إدارة الدولة؛ فقد فقدت الدولة كفاءاتٍ إدارية عالية، واضطرّ الرشيد إلى أن يستعمل وزراء أقلّ قدرة، وقد كان في هذا ما جعل الخراج ينقص في السنوات التالية. وقد كان في هذا درسٌ آخر: أن تصفية الكفاءات السياسية تُضعف الدولة حتى لو كانت ضروريةً للحفاظ على السلطة. وقد كان في هذا الإضعاف ما يظهر بعد سنوات: أن الدولة لم تجد بعد البرامكة من يُدير المال بكفاءتهم، وأن الخراج نقص، وأن الفساد الإداري زاد، وأن الخلافة صارت تعتمد على القوّاد أكثر من اعتمادها على الكتّاب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بقي ذكر البرامكة في الأدب العربي رمزاً للكرم والبلاغة وحسن الإدارة، وقد كتب الجاحظ عنهم، وروى الأخباريون أخبارهم، وقد صار يحيى بن خالد مثلاً للوزير العاقل، وجعفر مثلاً للنديم الظريف. وقد كان في بقاء ذكرهم بعد مقتلهم دلالةً على أن الناس يتذكرون الكفاءة أكثر مما يتذكرون السياسة. وقد كان في هذا البقاء الأدبي دلالة على أن الذاكرة الشعبية لا تُصدر أحكامها بالسياسة، بل بالأثر: فقد نسى الناس أن البرامكة كانوا يُنازعون الخليفة سلطته، وتذكّروا أنهم كانوا يُعطون ويكتبون ويُحسنون الإدارة.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eمن معبد بلخ إلى قصر بغداد\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان البرامكة في الأصل من سدنة معبد «نوبهار» في بلخ، وكان لهم مكانةٌ دينية واجتماعية في بلادهم، ثم أسلم جدّهم برمك في عهد عثمان أو بعده، ودخلوا في خدمة الدولة. وقد كان في هذا الأصل ما يُفسّر كفاءتهم: أنهم كانوا أسرةً لها تقاليد إدارية قديمة، وكانوا يعرفون الفارسية والعربية معاً.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد صعدوا في الدولة الأموية ثم في العباسية، وقد كان خالد بن برمك كاتباً في ديوان الجند، ثم صار وزيراً للمنصور، ثم صار ابنه يحيى مربياً للرشيد. وقد كان في هذا الصعود الطويل دلالة على أن الدولة العباسية كانت تُتيح للموالي أن يصلوا إلى أعلى المناصب، وهذا فرقٌ كبير عن الدولة الأموية.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eأسباب النكبة بين الرواية والسياسة\u003c/h4\u003e\u003cp class=\"ap\"\u003eالروايات التي تفسّر النكبة بعلاقةٍ عاطفية بين جعفر وأخت الخليفة لا تصمد للتحقيق، لأن مثل هذا الأمر لا يُفسّر تصفية أسرةٍ كاملة ومصادرة أموالها. والروايات التي تتحدث عن إطلاق سراح علويٍّ أقرب إلى الصحة، لأنها تُشير إلى سببٍ سياسي واضح: أن البرامكة صاروا يتصرفون في أمور الخلافة دون إذن.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالأرجح أن النكبة كانت نتيجة تراكم: أن الرشيد شعر بأن سلطته تُنازع، وأن البرامكة صاروا أقوى من أن يُعزلوا بسهولة، وأنهم يملكون جيشاً من العملاء في الأمصار. وقد كان في هذا ما يجعل النكبة قراراً حتمياً في منطق السلطة، لا ردّ فعلٍ على حادثةٍ واحدة. وقد كان في هذا التفسير ما يُفسّر أيضاً سرّ الإصرار على إخفاء الأسباب: أن الخليفة إذا أعلن أنه صفّى وزيراً لأنه صار قوياً لقال الناس إنه خاف منه، فكان الصمت أنفع في السياسة من البيان، وقد كان في هذا ما يجعل الروايات الشعبية تملأ الفراغ.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالبرامكة في الأدب\u003c/h4\u003e\u003cp class=\"ap\"\u003eصارت البرامكة في الأدب العربي مثلاً للكرم والبلاغة؛ فقد كان يحيى بن خالد يُضرب به المثل في حسن التدبير، وكان جعفر يُضرب به المثل في الظرف وحسن المجالسة، وكان الفضل يُضرب به المثل في الكفاءة في الولاية. وقد روى الجاحظ عنهم أخباراً كثيرة، وكتب الأدباء عن مجالسهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا الأدب مبالغةٌ في المدح أحياناً، لكنه كان يعبّر عن حقيقة: أن الناس فقدوا بعدهم كفاءةً وحسن إدارة. وقد قال شاعرٌ في رثائهم أبياتاً تُروى إلى اليوم، وقد صار اسم «البرامكة» في العربية كنايةً عن الوزراء الأقوياء الذين يُصادمون سلطة الحاكم. وقد كان في هذا الاسم أيضاً دلالةً على أن الوزارة في الدولة الإسلامية لم تكن منصباً محدود الصلاحيات، بل كانت سلطةً حقيقية قد تُنازع الخلافة، وقد كان في هذا ما يُفسّر كثرة نكبات الوزراء في التاريخ العباسي: من البرامكة إلى بني سهل إلى بني الفرات.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالأصل\u003c/b\u003e\u003cspan\u003eأسرة فارسية من بلخ، كانت سدنةً لمعبد نوبهار.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالصعود\u003c/b\u003e\u003cspan\u003eخالد بن برمك وزيراً للمنصور، ثم يحيى مربياً للرشيد.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالنكبة\u003c/b\u003e\u003cspan\u003eسنة ١٨٧هـ، قُتل جعفر وسُجن الباقون وصُودرت أموالهم.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالأثر\u003c/b\u003e\u003cspan\u003eفقدان كفاءات إدارية ونقصٌ في الخراج بعد النكبة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eفي الأدب\u003c/b\u003e\u003cspan\u003eصاروا مثلاً للكرم والبلاغة وحسن الإدارة.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالشخص\u003c/th\u003e\u003cth\u003eالمنصب\u003c/th\u003e\u003cth\u003eالمصير\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eخالد بن برمك\u003c/td\u003e\u003ctd\u003eوزير المنصور\u003c/td\u003e\u003ctd\u003eمات قبل النكبة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eيحيى بن خالد\u003c/td\u003e\u003ctd\u003eوزير الرشيد ومربيه\u003c/td\u003e\u003ctd\u003eسُجن ومات في السجن\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالفضل بن يحيى\u003c/td\u003e\u003ctd\u003eوالي خراسان\u003c/td\u003e\u003ctd\u003eسُجن ثم مات\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eجعفر بن يحيى\u003c/td\u003e\u003ctd\u003eنديم الخليفة\u003c/td\u003e\u003ctd\u003eقُتل سنة ١٨٧هـ\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eموسى بن يحيى\u003c/td\u003e\u003ctd\u003eوالي بعض الأمصار\u003c/td\u003e\u003ctd\u003eسُجن\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eكان يحيى بن خالد يقول: ما رأيتُ أحداً أحقّ بالوزارة من نفسي.\u003c/p\u003e\u003ccite\u003eمعنى ما رُوي في وصف ثقة البرامكة بأنفسهم\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eكانت البرامكة أكفأ أسرةٍ إدارية في الدولة العباسية، وأقواها نفوذاً، وقد صار نفوذهم أكبر من أن تحتمله السلطة. وقد نكبهم الرشيد سنة سبعٍ وثمانين ومئة، فخسرت الدولة كفاءتهم، وبقي ذكرهم في الأدب مثلاً للكرم والبلاغة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"amin-mamun","n":"الأمين والمأمون","ic":"💥","part":"القسم الثاني: العهد الذهبي","h":"\u003carticle class=\"ch3\" id=\"amin-mamun\" data-toc=\"الأمين والمأمون\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الثاني: العهد الذهبي\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٤ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٢\u003ci\u003e.\u003c/i\u003e٤\u003c/span\u003e\n            \u003ch3\u003eالأمين والمأمون\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eبعد موت الرشيد سنة ثلاثٍ وتسعين ومئة دخلت الدولة في حربٍ داخلية استمرت أربع سنوات، بين الأمين في بغداد والمأمون في مرو. وقد كانت هذه الحرب أخطر من كل الثورات التي سبقتها، لأنها لم تكن ثورةً على الخليفة بل كانت حرباً بين خليفتين، وقد انتهت بمحاصرة بغداد وتدمير أجزاءٍ منها، وبمقتل الأمين.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان الأمين محمد بن هارون قد بُويع بالخلافة في بغداد، وكانت أمه زبيدة من أسرةٍ عربية معروفة، وكان في نحو الخامسة والعشرين. وكان المأمون عبد الله بن هارون قد بُويع بولاية العهد وولاية خراسان، وكانت أمه فارسية، وكان في نحو الثالثة والعشرين. وقد كان في هذا الفرق في الأصل ما سيُستغل في الحرب: أن الأمين عربيٌّ من جهة أمه، وأن المأمون فارسيٌّ من جهة أمه، وأن لكل فريقٍ أنصاراً مختلفين.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بدأت الخلافات بعد سنةٍ من الخلافة؛ فقد أراد الأمين أن يُخرج اسم المأمون من الخطبة، وأن يجعل ولاية العهد لابنه موسى، وكان في هذا نقضٌ لعهد الأمان الذي كتبه الرشيد. وقد رفض المأمون ذلك، وكان في خراسان حيث يملك جيشاً وقاعدةً، وكان له قائدٌ ذكي هو طاهر بن الحسين وهرثمة بن أعين. وقد كان في هذا الفرق في الأصل ما جعل الحرب تأخذ طابعاً عرقياً، وقد كان في هذا خطرٌ على الدولة: أن الصراع على الخلافة صار صراعاً بين عربٍ وفرس، وأن كل فريقٍ صار يُقاتل من أجل أصله لا من أجل الدولة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سنة خمسٍ وتسعين ومئة بدأت الحرب؛ فقد أرسل الأمين جيشاً إلى خراسان بقيادة عليّ بن عيسى، فالتقى بطاهر بن الحسين في الريّ، فانتصر طاهر، وقُتل عليّ بن عيسى. وقد كان في هذه المعركة تحوّلٌ في مسار الحرب: أن المأمون صار في موضع الهجوم، وأن الأمين صار في موضع الدفاع. وقد كان في هذا الانتصار تحوّلٌ في موازين القوى: أن جيش خراسان صار هو الجيش الأقوى في الدولة، وأن قوّاده صاروا أصحاب القرار، وقد كان في هذا ما سيُنتج بعد ذلك نفوذاً عسكرياً في الخلافة، ثم سيطرة الأتراك بعد قرنٍ من ذلك.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد زحف طاهر بن الحسين نحو العراق، ودخل بغداد سنة ستٍّ وتسعين، وحاصرها أكثر من سنة. وقد كان الحصار قاسياً؛ فقد استُعملت فيه المجانيق، وتضرّرت أجزاءٌ من المدينة، وقلّ الطعام، وانتشرت الفوضى. وقد كان في هذا الحصار ما جعل بغداد تُفقد مكانتها لسنوات، وقد رُوي أن الشاعر أبا نواس رثى الخراب في أبياتٍ تُنسب إليه. وقد كان في هذا الحصار ما جعل بغداد تفقد بعض عمرانها، وقد كان في هذا مفارقة: أن المدينة التي بُنيت لتكون رمزاً للدولة صارت ساحةً لتدمير الدولة نفسها، وأن الخليفة الذي دافع عنها قُتل فيها، وأن أخاه الذي حاصرها صار خليفةً بعد ذلك.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سنة ثمانٍ وتسعين ومئة سقطت بغداد، وقُتل الأمين. وقد رُوي أن المأمون أمر بأن يُقتل، وأن رأسه حُمل إلى خراسان، وأن أخاه لم يرَ له وجهاً. وقد كان في مقتل الأمين حدثاً خطيراً في تاريخ الدولة: أن خليفةً شرعياً يُقتل بأمر أخيه، وأن الدم يصير فاصلاً في الخلافة. وقد كان في مقتله أثرٌ بعيد المدى: أن الخلافة صارت تُنال بالقوة أكثر مما تُنال بالعهد، وأن كل أميرٍ صار يعرف أن الطريق إلى العرش قد يمرّ بقتل أخيه، وقد كان في هذا ما يُفسّر كثرة الحروب الأهلية في القرن الثالث والرابع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه الحرب أثرٌ في توزيع القوى: أن طاهر بن الحسين صار قائداً كبيراً، وأن أسرته صارت ذات نفوذ في خراسان، وأن هذا النفوذ سيُنتج بعد ذلك الدولة الطاهرية التي ستستقلّ بخراسان فعلياً. وقد كان في هذا بداية ظاهرةٍ جديدة: أن قوّاد الجيش يصيرون ولاةً وراثيين، ثم يصيرون دولاً مستقلة. وقد كان في هذا الصعود بداية ظاهرةٍ ستهيمن على التاريخ العباسي بعد ذلك: أن القائد يصير والياً، وأن الوالي يصير مؤسس دولة، وأن الدولة المركزية تفقد أطرافها واحداً بعد الآخر، حتى تصير خلافةً بلا سلطة في القرن الرابع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في عهد المأمون أن استقرّت الدولة بعد الحرب، وأن بدأ عصر الترجمة والعلم، وأن صارت بغداد مرةً أخرى مركز العالم. لكن المأمون في الوقت نفسه دخل في صراعٍ مع أهل بغداد بسبب سياسةٍ مثيرة للجدل، وهي القول بخلق القرآن، وقد كان في هذا الصراع ما جعل بعض العلماء يُسجنون ويُضربون. وقد كان في هذا الصراع العقائدي أثرٌ في العلاقة بين الخلافة والعلماء: أن الخليفة أراد أن يُحدّد العقيدة بنفسه، وأن العلماء رفضوا أن يكون الحاكم هو المرجع في الدين، وقد كان في هذا الصراع بداية فصلٍ بين السلطة الدينية والسلطة السياسية في الفكر الإسلامي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه الحرب أيضاً درسٌ في ضعف نظام الإرث: أن تقسيم الدولة بين ابنين بجيشين وإقليمين لا يمكن أن يستمر، لأن السلطة لا تُقبل الشراكة. وقد كان في هذا ما يُفسّر تكرّر الحروب الأهلية في الدول الإسلامية: أن نظام الإرث لم يكن واضحاً، وأن كل أميرٍ كان يرى نفسه أحقّ. وقد كان في هذا الضعف ما جعل الدولة العباسية تعيش خمسة قرون مع أنها لم تكن قويةً إلا في قرنٍ ونصف، لأنها صارت دولةً رمزية تُدار بالوكالة، وقد كان في هذا ما يجعل بقاءها لغزاً في تاريخ الدول: أن الدولة قد تعيش بعد أن تفقد سلطتها إذا صار بقاؤها مصلحةً للجميع.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eعهد الأمان الذي لم يُحترم\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان عهد الأمان وثيقةً كُتبت سنة خمسٍ وثمانين ومئة، وفيها قسم الرشيد الدولة بين ابنيه، وأشهد عليها القضاة والعلماء، وعلّقها في الكعبة. وقد كان في هذا العهد محاولةً لتفادي الحرب، لكنه كان يقوم على فكرةٍ غير قابلة للتنفيذ: أن يكون للمأمون إقليمٌ واسع وجيشٌ قوي، ثم يكون تابعاً لأخيه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد نقض الأمين العهد سنة ثلاثٍ وتسعين بقراره إخراج اسم المأمون من الخطبة، وكان في هذا القرار بداية الحرب. وقد كان في نقض العهد ما جعل للمأمون حجةً شرعية، وقد استعملها في رسائله إلى الناس، وقد كان في هذا دليلاً على أن الوثائق السياسية لا تُنفّذ إلا إذا كان هناك من يُلزم بها.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eحصار بغداد\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان حصار بغداد سنة ستٍّ وتسعين من أقسى الحصارات في تاريخ المدينة؛ فقد استمر أكثر من سنة، واستُعملت فيه المجانيق، وسقطت أجزاءٌ من السور، واحترقت أحياء، وقلّ الطعام حتى أكل الناس ما لا يُؤكل. وقد كان في هذا الحصار ما جعل المدينة تفقد كثيراً من عمرانها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الحصار أيضاً دلالة سياسية: أن بغداد لم تكن مجرد عاصمةٍ إدارية، بل كانت مدينةً لها سكانٌ يدافعون عنها، وقد قاتل أهلها مع الأمين لأنهم رأوا أن ا
