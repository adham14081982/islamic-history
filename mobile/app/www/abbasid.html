لمأمون مدعومٌ من الفرس، وأن الأمين هو العربي. وقد كان في هذا استعمالٌ للعصبية في الحرب، وهو ما سيُضعف الدولة بعد ذلك.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eطاهر بن الحسين وصعود القوّاد\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان طاهر بن الحسين من قوّاد خراسان، وقد كان قائداً عسكرياً بارعاً، وقد قاد جيش المأمون في الحرب كلها، من الريّ إلى بغداد. وقد كان في هذا الصعود بداية ظاهرةٍ جديدة في الدولة العباسية: أن القائد العسكري يصير والياً على إقليمٍ ثم يورّث الولاية لأبنائه. وقد كان في هذا التوريث ما جعل الولايات تنفصل بسهولة: أن الوالي صار يرى الإقليم ملكاً لأسرته، وأن أهل الإقليم صاروا يخدمون أسرةً محلية لا دولةً بعيدة، وقد كان في هذا ما يجعل الخلافة تفقد سلطانها الحقيقي حتى لو بقي اسمها في الخطبة والنقود.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد صار طاهر والياً على خراسان بعد الحرب، وأسّس فيها دولةً طاهرية استمرت نحو خمسين سنة، وكانت في الظاهر تابعةً للخلافة وفي الحقيقة مستقلة. وقد كان في هذا بداية انفصال الأطراف، وقد تبعته دولٌ أخرى: الصفارية والسامانية والزيدية وغيرها، حتى صارت الخلافة في القرن الرابع مجرد رمز.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eبداية الحرب\u003c/b\u003e\u003cspan\u003eسنة ١٩٥هـ، بعد نقض الأمين لعهد الأمان.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمعركة الريّ\u003c/b\u003e\u003cspan\u003eانتصار طاهر بن الحسين وقتل عليّ بن عيسى.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eحصار بغداد\u003c/b\u003e\u003cspan\u003e١٩٦–١٩٨هـ، وانتهى بسقوط المدينة ومقتل الأمين.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eطاهر بن الحسين\u003c/b\u003e\u003cspan\u003eقائد الحرب، ثم والي خراسان ومؤسس الدولة الطاهرية.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالنتيجة\u003c/b\u003e\u003cspan\u003eانتصار المأمون وانتقال مركز الثقل إلى خراسان مؤقتاً.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالنتيجة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e١٩٣هـ\u003c/td\u003e\u003ctd\u003eموت الرشيد في طوس\u003c/td\u003e\u003ctd\u003eبداية عهد الأمين في بغداد\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٩٥هـ\u003c/td\u003e\u003ctd\u003eإخراج المأمون من الخطبة\u003c/td\u003e\u003ctd\u003eنقض عهد الأمان وبداية الحرب\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٩٥هـ\u003c/td\u003e\u003ctd\u003eمعركة الريّ\u003c/td\u003e\u003ctd\u003eانتصار طاهر وقتل عليّ بن عيسى\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٩٦هـ\u003c/td\u003e\u003ctd\u003eحصار بغداد\u003c/td\u003e\u003ctd\u003eتدمير أجزاء من المدينة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٩٨هـ\u003c/td\u003e\u003ctd\u003eسقوط بغداد\u003c/td\u003e\u003ctd\u003eمقتل الأمين وانتقال الخلافة إلى المأمون\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eما رأيتُ يوماً أسوأ من يوم دخلت فيه بغداد.\u003c/p\u003e\u003ccite\u003eمعنى ما يُروى في وصف أثر حصار بغداد\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eكانت حرب الأمين والمأمون أول حربٍ بين خليفتين في الدولة العباسية، وقد بدأت بنقض عهدٍ وانتهت بمقتل خليفةٍ وحصار عاصمة. وقد أنتجت ظاهرةً جديدة: صعود القوّاد إلى ولاياتٍ وراثية، وهو ما مهّد لتشظّي الدولة بعد ذلك.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-3","n":"القسم الثالث: بيت الحكمة والترجمة","ic":"🔬","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-3\" style=\"--c:#3A3A3A\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🔬\u003c/div\u003e\n      \u003ch2\u003eالقسم الثالث: بيت الحكمة والترجمة\u003c/h2\u003e\n      \u003cp\u003eفي القرن الثالث الهجري حدث في بغداد ما لم يحدث في مدينةٍ أخرى في ذلك العصر: أن أُنفقت أموال الدولة على ترجمة كتب اليونان والفرس والهند إلى العربية، وأن اشتُريت المخطوطات من القسطنطينية والهند، وأن جلس في بغداد مترجمون من النصارى واليهود والصابئة والفرس يعملون بأجرٍ من الخليفة. وقد كان هذا المشروع هو الذي جعل العربية لغة العلم في العالم لخمسة قرون.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#bayt-al-hikma\"\u003eبيت الحكمة\u003c/a\u003e\u003ca href=\"#mamun-translation\"\u003eالمأمون والعلم\u003c/a\u003e\u003ca href=\"#math-medicine\"\u003eالجبر والطب والبصريات\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"bayt-al-hikma","n":"بيت الحكمة","ic":"🏛️","part":"القسم الثالث: بيت الحكمة والترجمة","h":"\u003carticle class=\"ch3\" id=\"bayt-al-hikma\" data-toc=\"بيت الحكمة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الثالث: بيت الحكمة والترجمة\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ١ من ٣\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٣\u003ci\u003e.\u003c/i\u003e١\u003c/span\u003e\n            \u003ch3\u003eبيت الحكمة\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eبيت الحكمة اسمٌ يُطلق على مؤسسةٍ علمية في بغداد، فيها مكتبةٌ ومرصدٌ وقاعةٌ للترجمة، وقد بدأت في عهد الرشيد ثم توسّعت في عهد المأمون. وقد كان في هذا المكان ما يجعل بغداد تُشبه مجمعاً علمياً: أن يُدفع للمترجم أجرٌ بحسب وزن الكتاب، وأن تُطلب الكتب من كل مكان، وأن يُجلس العلماء من أديانٍ مختلفة إلى مائدةٍ واحدة.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان أصل بيت الحكمة مكتبةً خاصةً للخلفاء، وقد كانت الخلفاء تجمع الكتب منذ عهد المنصور، وكان المنصور قد طلب كتباً في الفلك والطب من الهند، وقد تُرجمت في عهده بعض كتب الفلك الهندية. ثم توسّعت المكتبة في عهد الرشيد، ثم صارت في عهد المأمون مؤسسةً كبيرةً لها نظامٌ وإدارة. وقد كان في هذا التطور دلالة على أن المؤسسة العلمية تحتاج إلى راعٍ قوي، وأن الخليفة كان يرى في العلم امتداداً لسلطته لا منافساً لها، وهذا ما جعل الإنفاق عليه يستمر سنوات طويلة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في بيت الحكمة أقسامٌ متعددة: قسمٌ للترجمة، وقسمٌ للنسخ والتجليد، وقسمٌ للحفظ والفهرسة، وكان فيها مرصدٌ فلكي يُراقب الأجرام ويُسجّل الأرصاد. وقد كان فيها أيضاً علماء يعملون على تصحيح الترجمات ومقارنة النسخ، وقد كان في هذا تنظيمٌ يشبه مراكز البحث الحديثة. وقد كان في هذا التنظيم ما يجعله أقرب إلى الجامعة: أن فيه نسخاً وحفظاً وفهرسةً وتدقيقاً، وأن فيه إدارةً تُوزّع العمل، وأن فيه مرتباتٍ تُدفع بانتظام، وهذا كله لم يكن مألوفاً في مؤسسةٍ علمية قبل ذلك.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان المأمون يُرسل البعثات لشراء المخطوطات، وقد رُوي أنه كتب إلى ملك الروم يطلب منه أن يُرسل إليه كتباً يونانية، وأنه أرسل إليه هدايا كثيرةً مقابل ذلك. وقد كان في هذا العمل ما يدل على أن الخليفة كان يرى في العلم قوةً للدولة لا ترفاً، وأنه كان يُنفق عليه من بيت المال. وقد كان في هذا الإنفاق ما يُخالف ما كان عليه كثير من الحكام في ذلك العصر: أن يُنفق على جمع الكتب بدلاً من جمع الذهب، وأن يرى في المخطوط اليوناني قيمةً أعلى من الهدية الفاخرة، وهذا كان قراراً ثقافياً بالمعنى الحديث.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان المترجمون في بيت الحكمة من أديانٍ وطوائف مختلفة: نصارى من السريان والنساطرة واليعاقبة، ويهود، وصابئة من حرّان، وفرس من الزرادشتيين الذين أسلموا. وقد كان في هذا تنوعاً لم يكن مألوفاً في مؤسسةٍ واحدة، وقد كان في هذا أيضاً دلالة على أن العلم كان مجالاً مشتركاً لا يعرف الحدود الدينية. وقد كان في هذا التنوع ثمنٌ أيضاً: أن بعض الفقهاء رأوا في استقدام نصارى وصابئة خطراً على العقيدة، وأن بعضهم رأى في الفلسفة اليونانية مدخلاً للإلحاد، وقد كان في هذا ما سيُنتج صراعاً بين العلماء أنفسهم بعد ذلك.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان أجر المترجمين مرتفعاً؛ فقد رُوي أن حنين بن إسحاق كان يُعطى ذهباً بوزن الكتاب الذي يُترجمه، وأن غيره كان يأخذ مبلغاً كبيراً لكل كتاب. وقد كان في هذا تشجيعاً هائلاً على الترجمة، وقد كان في الوقت نفسه سبباً في كثرة المترجمين وفي ظهور مدرسةٍ للترجمة في بغداد. وقد كان في هذا الأجر الكبير تشجيعٌ على المنافسة بين المترجمين، وقد كان في الوقت نفسه سبباً في ظهور ترجماتٍ متعددة للكتاب الواحد، وقد كان في هذا ما جعل النقّاد يُقارنون بين الترجمات ويُرجّحون بعضها على بعض.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في بيت الحكمة أيضاً عملٌ في الرياضيات والفلك والطب، لا مجرد ترجمة. فقد كان العلماء يُراجعون كتب اليونان ويُضيفون إليها، ويُجرون تجارب، ويُصحّحون أخطاء القدماء. وقد كان الخوارزمي في هذا العهد يعمل في بيت الحكمة، وقد وضع فيه كتابه في الجبر والمقابلة، وكان هذا بدايةً لعلمٍ جديدٍ لم يكن عند اليونان ولا عند الهنود. وقد كان في هذا العمل ما يُبيّن أن العلم في هذا العهد لم يكن مجرد استقبال: أن الخوارزمي أخذ أرقام الهند وحساب اليونان، ثم أنتج علماً جديداً لم يكن عند أحدٍ قبله، وهذا هو الفرق بين النقل والإبداع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان بيت الحكمة رمزاً لسياسةٍ ثقافية: أن الدولة تريد أن تكون مركز العلم في العالم، وأنها مستعدة أن تُنفق على ذلك. وقد كان في هذا ما جعل بغداد تجذب العلماء من كل الأمصار: من خراسان والأندلس ومصر والمغرب، وقد كان هؤلاء يأتون ليُعلّموا ويُتعلّموا، وكانت العربية لغة مشتركة بينهم. وقد كان في هذا التجمع العلمي ما جعل بغداد تُشبه عاصمةً للعالم: أن الطالب من الأندلس والمغربي من إفريقية والخراساني من الشرق يجدون في مدينةٍ واحدةٍ من يُعلّمهم بلغتهم المشتركة، وهذا لم يكن في أي مدينةٍ أخرى في ذلك الزمان.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان لبيت الحكمة أثرٌ في الحضارة الإنسانية كلها. فبفضل الترجمات التي أُنجزت فيه عُرفت في أوروبا كتب أرسطو وأبقراط وجالينوس وبطليموس وأقليدس، وقد تُرجمت هذه الكتب من العربية إلى اللاتينية بعد قرون، وكانت هي الأساس الذي قامت عليه النهضة الأوروبية. وقد كان في هذا دليل على أن نقل المعرفة بين الحضارات لا يكون بالصدفة بل بمشروعٍ ومؤسسة.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eماذا كان يُترجم؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الترجمة تشمل الفلسفة والطب والفلك والرياضيات والموسيقى والمنطق والكيمياء. وقد تُرجمت كتب أرسطو في المنطق والطبيعة والنفس، وكتب أفلوطين في الفلسفة، وكتب أبقراط وجالينوس في الطب، وكتب بطليموس في الفلك، وكتب أقليدس في الهندسة، وكتب أرخميدس في الميكانيكا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت الترجمة أيضاً من الفارسية والهندية، لا من اليونانية فقط؛ فقد تُرجمت كتب الأدب الفارسي مثل «كليلة ودمنة» و«سيرة أردشير»، وتُرجمة كتب الفلك الهندية مثل «السدهانتا»، وكان في هذا تنوعاً في المصادر جعل العلم العربي أكثر تركيباً من مجرد نقلٍ لليونان.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eحنين بن إسحاق ومدرسة الترجمة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان حنين بن إسحاق من أشهر المترجمين، وكان نصرانياً من النساطرة، وقد عاش في القرن الثالث الهجري، وكان يعرف اليونانية والسريانية والعربية والفارسية. وقد ترجم وحده عدداً كبيراً من كتب جالينوس، وكان يُراجع الترجمات القديمة ويُصحّحها، وكان له تلاميذُ عملوا معه في مدرسةٍ للترجمة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في منهجه دقةٌ لم تكن مألوفة: أنه كان يجمع النسخ اليونانية المختلفة ويُقارنها، ثم يُترجم، ثم يُراجع مع طبيبٍ آخر، ثم يكتب ملاحظات على المصطلحات. وقد كان في هذا المنهج ما يُشبه التحقيق العلمي الحديث، وقد كان في هذا ما جعل ترجماته تُعتمد في الشرق والغرب قروناً.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالمرصد الفلكي\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان في بيت الحكمة مرصدٌ فلكي، وقد أُجريت فيه أرصادٌ دقيقة في عهد المأمون، وقد كان في المرصد آلاتٌ لقياس ارتفاع الشمس وزوايا النجوم، وقد كان العلماء يُسجّلون الأرصاد يومياً. وقد كان في هذا العمل ما جعل الفلك الإسلامي أدقّ من الفلك اليوناني في بعض الجوانب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في المرصد أيضاً عملٌ على قياس محيط الأرض؛ فقد قاس العلماء في عهد المأمون طول درجةٍ من قوس خط الطول في صحراء سنجار، ثم حسبوا محيط الأرض بناءً عليها، وقد كان الناتج قريباً جداً من القياس الحديث. وقد كان في هذا دليلاً على أن العلم في هذا العهد لم يكن نقلاً بل تجربةً وقياساً.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالتأسيس\u003c/b\u003e\u003cspan\u003eبدأت مكتبةً خاصةً في عهد الرشيد، وتوسّعت مؤسسةً في عهد المأمون.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالأقسام\u003c/b\u003e\u003cspan\u003eترجمة ونسخ وتجليد وفهرسة ومرصد فلكي.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمترجمون\u003c/b\u003e\u003cspan\u003eنصارى وصابئة ويهود وفرس، يعملون بأجرٍ من الخليفة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eحنين بن إسحاق\u003c/b\u003e\u003cspan\u003eأشهر المترجمين، ترجم كتب جالينوس وراجع الترجمات القديمة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eقياس الأرض\u003c/b\u003e\u003cspan\u003eأُجري في عهد المأمون في صحراء سنجار، وجاء قريباً من القياس الحديث.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمجال\u003c/th\u003e\u003cth\u003eأهم ما تُرجم\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالمنطق\u003c/td\u003e\u003ctd\u003eكتب أرسطو\u003c/td\u003e\u003ctd\u003eأساس علم المنطق والفلسفة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالطب\u003c/td\u003e\u003ctd\u003eأبقراط وجالينوس\u003c/td\u003e\u003ctd\u003eالمدارس الطبية في العالم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالفلك\u003c/td\u003e\u003ctd\u003eبطليموس والسدهانتا\u003c/td\u003e\u003ctd\u003eزيجٌ ورصدٌ أدقّ من اليوناني\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالرياضيات\u003c/td\u003e\u003ctd\u003eأقليدس وأرخميدس\u003c/td\u003e\u003ctd\u003eالجبر والهندسة والحساب\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالأدب\u003c/td\u003e\u003ctd\u003eكليلة ودمنة وسيرة أردشير\u003c/td\u003e\u003ctd\u003eالنثر الفارسي في العربية\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eالعلم لا وطن له، ولا دين له، وإنما هو ميراث الإنسانية.\u003c/p\u003e\u003ccite\u003eمعنى ما يُعبّر عنه تنوع المترجمين وأديانهم في بيت الحكمة\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eبيت الحكمة لم يكن مكتبةً فقط، بل كان مشروعاً سياسياً وحضارياً: أن تُجمع معرفة الأمم في لغةٍ واحدة، وأن يُدفع للمترجمين من بيت المال، وأن يُضاف إلى المنقول ما يُنتجه العقل. وقد كان في هذا المشروع ما جعل العربية لغة العلم في العالم خمسة قرون.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"mamun-translation","n":"المأمون والعلم","ic":"🧠","part":"القسم الثالث: بيت الحكمة والترجمة","h":"\u003carticle class=\"ch3\" id=\"mamun-translation\" data-toc=\"المأمون والعلم\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الثالث: بيت الحكمة والترجمة\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٢ من ٣\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٣\u003ci\u003e.\u003c/i\u003e٢\u003c/span\u003e\n            \u003ch3\u003eالمأمون والعلم\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eكان المأمون أعلم خلفاء بني العباس وأكثرهم اهتماماً بالعلم؛ فقد كان يُجالس العلماء ويناظرهم، ويُصلّي بهم، ويُقرأ عليه في الفلك والطب، وقد رُوي أنه كان يحفظ القرآن ويكتب الشعر ويُجيد الحساب. وقد كان في عهده أن بلغت حركة الترجمة ذروتها، وأن صارت بغداد قبلة العلماء من كل الأمصار.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eوُلد المأمون سنة سبعين ومئة، وكانت أمه فارسية تُسمّى مراجل، وقد كان أبوه الرشيد قد ولاّه خراسان، وقد كان في خراسان أن تعرّف على ثقافة الفرس، وأن تعلّم منها ما لم يكن يعرفه من نشأ في بغداد. وقد كان في هذا الأصل ما جعله أكثر انفتاحاً على الفلسفة والعلوم من أخيه الأمين، وكان في الوقت نفسه ما جعله موضع شكٍّ عند العرب في بغداد. وقد كان في هذا الأصل ما جعله يُواجه بمقاومةٍ من العرب في بغداد، وقد ظهر ذلك في حرب الأمين، حيث قاتل أهل بغداد مع أخيه العربي ضد المأمون الفارسي الأصل، وقد كان في هذا ما جعل شرعيته تحتاج إلى تأكيدٍ دائم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان المأمون يُنفق على العلم إنفاقاً كبيراً، وقد رُوي أنه كان يجعل للعلماء مرتباتٍ من بيت المال، وأنه كان يُرسل البعثات لشراء الكتب، وأنه كان يستقدم العلماء من كل مكان. وقد كان في بلاطه من العلماء من لا يُحصى عددهم، ومنهم الخوارزمي والكندي وحنين بن إسحاق وبني موسى بن شاكر. وقد كان في هذا التجمع العلمي ما جعل بغداد مركزاً للعلم لا للمال فقط، وقد كان في هذا أيضاً ما جعل العلماء يستقلّون نسبياً عن السلطة، لأن الخليفة كان يحتاج إليهم أكثر مما كانوا يحتاجون إليه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في عهده أن أُنشئ «بيت الحكمة» بمفهومه المؤسسي، وأن صار له إدارةٌ ونظامٌ ومرتبات، وقد كان في هذا ما جعل الترجمة عملاً منظماً لا عملاً فردياً. وقد كان في هذا أيضاً ما جعل المترجمين طبقةً لها مكانة، وكان بعضهم يجلس في مجلس الخليفة فوق القوّاد والأمراء. وقد كان في هذا الارتفاع في المكانة ما جعل المترجمين والأطباء يُمثّلون طبقةً جديدةً في المجتمع، إلى جانب الفقهاء والكتّاب والقوّاد، وقد كان في هذا تحولاً في بنية النخبة العباسية: أن العلم صار طريقاً إلى المكانة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في عهده أن أُجريت أرصادٌ فلكيةٌ دقيقة في بغداد ودمشق، وقد كان في هذه الأرصاد ما جعل علم الفلك الإسلامي يتقدّم على اليوناني في بعض الجوانب. وقد كان في عهده أيضاً أن قِيس محيط الأرض، وأن صُنعت خرائط للأرض، وقد كان في هذا العمل ما يُشبه المشاريع العلمية الكبرى في العصور الحديثة. وقد كان في هذه الأعمال ما يُشبه المشاريع العلمية الكبرى في العصور الحديثة: أن تُجمع بياناتٌ من مواقع متعددة، وأن تُقارن النتائج، وأن تُستنتج قواعد عامة، وأن يُنفق على ذلك من المال العام، وهذا كله كان جديداً في تنظيمه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان المأمون يُحبّ المناظرة، وكان يجمع العلماء من فرقٍ مختلفة ليناظروا في مجلسه، وقد كان في هذا تشجيعاً على التفكير النقدي، لكنه كان في الوقت نفسه مدخلاً للصراع العقائدي. وقد كان أشهر ما جرى في عهده هو القول بخلق القرآن، وقد كان في هذا القول إعلاناً بأن الخليفة له سلطةٌ في تحديد العقيدة. وقد كان في هذا القول أثرٌ سياسي كبير: أن الخليفة صار له رأيٌ في العقيدة يُلزم به الناس، وهذا ما لم يكن في عهد الخلفاء الراشدين ولا في العهد الأموي، وقد كان في هذا تحولاً في مفهوم الخلافة نفسها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في سياسة المأمون العقائدية أثرٌ كبير في العلاقة بين العلماء والسلطة. فقد امتحن المأمون العلماء في مسألة خلق القرآن، وكان من رفض يُعزل أو يُسجن أو يُضرب، وقد كان الإمام أحمد بن حنبل من أشهر من رفض، وقد سُجن وجُلد في عهد المعتصم بعده. وقد كان في هذا الامتحان ما جعل العلماء يرون أن السلطة قد تتجاوز حدودها في الدين. وقد كان في هذا الامتحان ما جعل العلماء يُفرّقون بين الطاعة السياسية والطاعة الدينية، وأن يقولوا إن الحاكم يُطاع في المعروف لا في العقيدة، وقد كان في هذا الأساس الذي قامت عليه فكرة استقلال العلماء عن السلطة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في عهده أيضاً محاولةٌ سياسية مثيرة للجدل: أنه جعل الإمام عليّ بن موسى الرضا ولياً للعهد سنة إحدى ومئتين، وقد كان في هذا محاولةً لتقريب العلويين وإضعاف أنصارهم في خراسان، لكنها انتهت بموت الرضا سنة ثلاثٍ ومئتين في ظروفٍ غامضة، وقد كان في هذا ما زاد في الشكوك بين العباسيين والعلويين. وقد كان في هذا الحدث ما جعل العلاقة بين العباسيين والعلويين تدخل مرحلةً جديدة: أن التقريب لم يُقنع أحداً، وأن الشكوك زادت، وأن الثورات العلوية استمرت بعد ذلك في الحجاز وطبرستان واليمن، ثم في المغرب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد مات المأمون سنة ثماني عشرة ومئتين في طرسوس، وكان في نحو الثامنة والأربعين، وقد كان في أثناء حملةٍ على الروم. وقد كان في عهده أن استقرّت الدولة بعد حربٍ داخلية، وأن بلغ العلم ذروته، لكنه كان في الوقت نفسه بداية انفصال الأطراف، وبداية صراعٍ عقائدي سيبقى بعد ذلك قروناً. وقد كان في هذا أن الدولة العباسية بلغت ذروتها العلمية في الوقت الذي بدأت فيه تفقد أطرافها، وقد كان في هذا مفارقةً في تاريخ الدول: أن الثقافة تزدهر في اللحظة التي يبدأ فيها البناء السياسي بالتصدّع.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالمأمون والعلماء\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان المأمون يُجالس العلماء في مجلسٍ لا يُشبه مجالس الخلفاء؛ فقد كان يجلس معهم على الأرض أحياناً، وكان يُناقش ويُسأل ويُخطئ ويُصحّح. وقد رُوي أنه كان يُقرأ عليه كتاب بطليموس في الفلك، وأنه كان يسأل عن أدقّ التفاصيل، وأنه كان يُكافئ من يُجيب بإجابةٍ صحيحة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا السلوك ما جعل العلماء يقبلون عليه، وقد كان في الوقت نفسه ما جعل بعض الفقهاء ينقدونه، لأنهم رأوا أن الخليفة يجب أن يكون إماماً في الدين لا فيلسوفاً في العلم. وقد كان في هذا النقد بداية صراعٍ بين نمطين من الثقافة: ثقافة الفقه والحديث، وثقافة الفلسفة والعلوم.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eفتنة خلق القرآن\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت مسألة خلق القرآن من المسائل العقدية الكبرى، وقد كان المعتزلة يقولون إن القرآن مخلوق، أي إنه ليس صفةً قديمةً لله، وكان أهل الحديث يقولون إنه كلام الله غير مخلوق. وقد كان المأمون قد تبنّى قول المعتزلة سنة ثماني عشرة ومئتين، وأمر بأن يُمنتحن العلماء في ذلك.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا الامتحان ما جعل الدولة تُدخل نفسها في مسألةٍ عقدية، وأن تُعاقب من يُخالفها، وقد كان في هذا سابقةً في تاريخ الإسلام: أن يُسجن عالمٌ بسبب رأيٍ في العقيدة. وقد استمر هذا الامتحان في عهد المعتصم والواثق، ثم أوقفه المتوكل سنة أربعٍ وثلاثين ومئتين، وقد كان في إيقافه إعلاناً بانتصار أهل الحديث.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالرصد والقياس\u003c/h4\u003e\u003cp class=\"ap\"\u003eفي عهد المأمون أُجريت أرصادٌ فلكيةٌ دقيقة، وقد كان في بغداد ودمشق مرصدان، وقد كان العلماء يُسجّلون مواضع النجوم والكواكب، وقد صحّحوا كثيراً من أخطاء بطليموس. وقد كان في هذا العمل ما جعل الزيج الفلكي الإسلامي أدقّ من اليوناني، وقد اعتمد عليه علماء أوروبا بعد قرون.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في عهده أيضاً قياس محيط الأرض؛ فقد أرسل فريقين إلى صحراء سنجار، وقاس كل فريقٍ طول درجةٍ من قوس خط الطول، ثم حسبوا المحيط، وقد جاء الناتج قريباً جداً من القياس الحديث. وقد كان في هذا العمل ما يُبيّن أن العلم في هذا العهد كان تجريبياً لا نقلياً فقط.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمدة حكمه\u003c/b\u003e\u003cspan\u003e٢٠ سنة، من ١٩٨هـ إلى ٢١٨هـ.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأمه\u003c/b\u003e\u003cspan\u003eمراجل، وكانت فارسية، ولذلك اتُّهم بالانحياز إلى الفرس.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eبيت الحكمة\u003c/b\u003e\u003cspan\u003eتوسّع في عهده وصار مؤسسةً منظّمة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eفتنة خلق القرآن\u003c/b\u003e\u003cspan\u003eبدأت سنة ٢١٨هـ واستمرت إلى عهد المتوكل.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eولي العهد العلوي\u003c/b\u003e\u003cspan\u003eعليّ بن موسى الرضا سنة ٢٠١هـ، ومات سنة ٢٠٣هـ.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمجال\u003c/th\u003e\u003cth\u003eما جرى في عهد المأمون\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالترجمة\u003c/td\u003e\u003ctd\u003eتوسّع بيت الحكمة وارتفاع أجور المترجمين\u003c/td\u003e\u003ctd\u003eنقل معظم العلم اليوناني\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالفلك\u003c/td\u003e\u003ctd\u003eأرصادٌ في بغداد ودمشق\u003c/td\u003e\u003ctd\u003eتصحيح أخطاء بطليموس\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالجغرافيا\u003c/td\u003e\u003ctd\u003eقياس محيط الأرض\u003c/td\u003e\u003ctd\u003eنتيجة قريبة من القياس الحديث\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالعقيدة\u003c/td\u003e\u003ctd\u003eامتحان العلماء بخلق القرآن\u003c/td\u003e\u003ctd\u003eصراعٌ بين السلطة والعلماء\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالسياسة\u003c/td\u003e\u003ctd\u003eولاية عهد للرضا العلوي\u003c/td\u003e\u003ctd\u003eتقريبٌ ثم موتٌ غامض\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eلو عرف الناس ما في العلم من لذّة، لما اشتغلوا بغيره.\u003c/p\u003e\u003ccite\u003eمعنى ما يُنسب إلى مجلس المأمون في تقدير العلم\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eكان المأمون أعلم خلفاء بني العباس وأكثرهم إنفاقاً على العلم، وفي عهده بلغت الترجمة ذروتها وقِيس محيط الأرض. لكنه أدخل الدولة في مسألةٍ عقدية وامتحن العلماء، فأنتج صراعاً بين السلطة والدين لم ينتهِ بإيقاف الامتحان.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"math-medicine","n":"الجبر والطب والبصريات","ic":"⚗️","part":"القسم الثالث: بيت الحكمة والترجمة","h":"\u003carticle class=\"ch3\" id=\"math-medicine\" data-toc=\"الجبر والطب والبصريات\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الثالث: بيت الحكمة والترجمة\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٣ من ٣\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٣\u003ci\u003e.\u003c/i\u003e٣\u003c/span\u003e\n            \u003ch3\u003eالجبر والطب والبصريات\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eلم يقتصر عمل العلماء في هذا العهد على الترجمة، بل أضافوا إليها إضافاتٍ غيّرت مسار العلم في العالم. فقد وُضع الجبر، وصُنّف علم الجبر والمقابلة، وصحّحت جداول النجوم، ووُصف دوران الدم الصغير، ووُضعت أسس علم البصريات، وكانت هذه كلها إضافاتٍ لم تكن عند اليونان ولا عند الهنود.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان محمد بن موسى الخوارزمي من أعظم علماء هذا العهد، وقد عمل في بيت الحكمة في عهد المأمون، وقد كتب كتاب «الجبر والمقابلة» في نحو سنة عشرين ومئتين. وقد كان في هذا الكتاب ما لم يكن قبله: أنه لم يكتفِ بحل مسائل محددة، بل وضع قواعد عامة لحل معادلات من الدرجة الأولى والثانية، وقد كان في هذا تأسيساً لعلمٍ جديد. وقد كان في هذا المنهج ما يُخالف ما كان عند اليونان: أنهم كانوا يحلّون مسائل جزئية بالهندسة، وأن الخوارزمي جعل الحلّ عمليةً حسابيةً منظمة يمكن تطبيقها على أي معادلة من النوع نفسه، وهذا هو معنى الخوارزمية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في كتاب الخوارزمي أيضاً فصلٌ في «الوصايا» أي حساب المواريث، وفصلٌ في المساحة، وفصلٌ في المعاملات التجارية، وقد كان في هذا دلالة على أن العلم كان مرتبطاً بحاجات المجتمع: أن الفقه يحتاج إلى حسابٍ، وأن الخراج يحتاج إلى مساحة، وأن التجارة تحتاج إلى معاملات. وقد كان في هذا ما جعل الرياضيات علماً عملياً لا تجريدياً فقط. وقد كان في هذا الارتباط بالحاجات اليومية ما يُفسّر ازدهار الرياضيات في الدولة الإسلامية: أن الفقه والخراج والمساحة والتجارة كانت تُنتج أسئلةً حقيقية، وأن العلماء كانوا يُجيبون عنها، وهذا ما جعل العلم ينمو من الواقع لا من التجريد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان للخوارزمي أيضاً عملٌ في الجغرافيا؛ فقد أشرف على عمل خريطةٍ للعالم في عهد المأمون، وقد كتب كتاب «صورة الأرض» وفيه إحداثياتٌ لمئات المواضع. وقد كان في هذا العمل ما جعل الجغرافيا العربية أدقّ من الجغرافيا اليونانية في وصف آسيا وإفريقيا، لأن الرحّالين والتجار كانوا يُوصلون أخباراً جديدة. وقد كان في هذا العمل ما جعل الجغرافيا العربية ذات طابعٍ عملي: أن الرحّالين والتجار والبحّارة كانوا يُقدّمون معلوماتٍ دقيقة عن المدن والطرق والمسافات، وقد كان في هذا ما يجعل الخريطة أداةً للإدارة والتجارة لا مجرد صورةٍ للعالم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي الطب كان أبو بكر الرازي من أعظم الأطباء في التاريخ، وقد عاش في القرن الثالث والرابع، وقد كتب كتاب «الحاوي في الطب» الذي جمع فيه كل ما عُرف من طبّ اليونان والهند وفارس، وأضاف إليه ما رآه في المستشفيات. وقد كان في هذا الكتاب ما جعله مرجعاً في أوروبا قروناً، وقد تُرجم إلى اللاتينية وطُبع مراتٍ كثيرة. وقد كان في هذا الكتاب ما جعله مرجعاً في أوروبا: أنه جمع كل ما عُرف في ذلك العصر في مكانٍ واحد، وأنه رتّب الأمراض ووصف العلاج بأسلوبٍ يمكن تطبيقه، وقد كان في هذا ما يجعل الطبيب الأوروبي يجد فيه ما لا يجده في كتب جالينوس.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الطب أيضاً عملٌ في الجراحة والعيون؛ فقد وصف ابن الهيثم تشريح العين ووظائف أجزائها، وقد كان في هذا العمل ما يُخالف ما كان عند جالينوس، وقد كان في هذا دليلاً على أن العلماء لم يقبلوا القدماء قبولاً أعمى بل راجعوهم بالتجربة. وقد كان في هذا المنهج ما جعل العلم العربي علماً حقيقياً لا مجرد نقل. وقد كان في هذا المنهج ما جعل الطب الإسلامي يتقدّم في التشخيص والعلاج: أن الأطباء كانوا يُسجّلون الحالات ويُقارنون النتائج، وأنهم كانوا يُجرون اختباراتٍ على الأدوية، وأنهم كانوا يرفضون ما لا يُثبته الواقع ولو كان في كتب القدماء.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي البصريات كان ابن الهيثم أعظم من كتب في هذا العلم، وقد كتب «كتاب المناظر» في القرن الخامس الهجري، وقد كان في هذا الكتاب ما غيّر فهم العالم للرؤية: فقد قال إن الرؤية تحدث بانعكاس الضوء من الجسم إلى العين، لا بخروج شعاعٍ من العين كما كان يقول اليونان. وقد كان في هذا القول ثورةً في علم البصريات. وقد كان في هذا القول أثرٌ في كل ما جاء بعده: أن العدسات والنظارات والمناظير والتلسكوب بُنيت كلها على نظرية أن الضوء يأتي من الجسم إلى العين، وقد كان في هذا دليلاً على أن نظريةً صحيحةً واحدة قد تُغيّر مسار علمٍ كامل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان ابن الهيثم يعتمد على التجربة والقياس، وقد أجرى تجارب على انتشار الضوء وانكساره وانعكاسه، وقد كان في منهجه ما يُشبه المنهج التجريبي الحديث: أن يضع فرضاً، ثم يُجري تجربة، ثم يستنتج. وقد كان في هذا العمل ما جعل بعض المؤرخين يعتبرونه أول من وضع أساس المنهج العلمي الحديث. وقد كان في هذا المنهج ما جعله يُوصف بأنه أول من وضع أساس العلم التجريبي، وقد كان في هذا وصفاً فيه مبالغة أحياناً، لكنه يدل على حقيقة: أن ابن الهيثم كان يرفض القول بلا دليل، وأنه كان يبدأ من الحسّ لا من النصّ.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الكيمياء أيضاً عملٌ مهم؛ فقد حوّل جابر بن حيّان الكيمياء من صنعةٍ سحرية إلى علمٍ له تجارب ومصطلحات، وقد وصف عمليات التقطير والتصعيد والتبلور، وقد كان في هذا العمل ما جعل الكيمياء علماً له أدوات ومناهج. وقد كان في هذا العهد أيضاً أن ظهرت صناعة الأدوية والعقاقير، وصارت مهنة الصيدلة مهنةً منظمة. وقد كان في هذا التنظيم ما جعل الصيدلة مهنةً لها قواعد: أن يُعرف وزن الدواء ومقداره ومصدره، وأن يُمنع الغش، وأن يُراقب المحتسب الأسواق، وقد كان في هذا ما يجعل الطب منظومةً لا فرداً، وهذا فرقٌ كبير بين حضارةٍ وأخرى.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالخوارزمي والجبر\u003c/h4\u003e\u003cp class=\"ap\"\u003eكلمة «الجبر» في العربية تعني إعادة ما يُنقص، وقد استعملها الخوارزمي بمعنى نقل الحدود من طرفٍ إلى طرف في المعادلة. وقد كان في كتابه تعريفٌ للعدد والمجهول والقوة، ثم قواعدٌ لحل المعادلات، ثم تطبيقاتٌ في المواريث والمساحة والتجارة. وقد كان في هذا التنوّع في التطبيقات دلالةً على أن الجبر لم يكن علماً نظرياً، بل كان أداةً لحلّ مشكلاتٍ عملية، وأن الخوارزمي كان يعرف جمهوره: أنه يكتب لفقهاء وكتّابٍ ومسّاحين وتجار.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا الكتاب أثرٌ عالمي: فقد تُرجم إلى اللاتينية في القرن الثاني عشر، وكان أساس تعليم الجبر في أوروبا قروناً، وقد جاءت كلمة «الخوارزمية» في اللغات الأوروبية من اسم الخوارزمي، وصارت تعني الخوارزمية. وقد كان في هذا دليلاً على أن مصطلحاً علمياً عربياً قد دخل كل لغات العالم.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eابن الهيثم والمناظر\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان ابن الهيثم عالماً في الرياضيات والفلك والبصريات، وقد عاش في القرن الخامس الهجري، وقد كتب «كتاب المناظر» الذي يُعدّ أعظم كتاب في البصريات في العصور الوسطى. وقد كان في الكتاب نظريةٌ جديدة للرؤية، وتجاربٌ على الضوء والمرايا والعدسات. وقد كان في الكتاب أيضاً وصفٌ لتشريح العين، وقد كان في هذا الوصف ما صحّح أخطاء جالينوس، وقد كان في هذا دليلاً على أن التشريح كان يُمارس فعلاً لا أنه كان معروفاً من الكتب فقط.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في منهجه ما يُشبه المنهج التجريبي: أنه كان يضع فرضاً، ثم يُجري تجربةً مضبوطة، ثم يُسجّل النتيجة، ثم يُعيد التجربة. وقد كان في هذا ما جعل كتابه يُترجم إلى اللاتينية ويُدرّس في أوروبا، وقد اعتمد عليه علماء النهضة في تطوير المنظار والتلسكوب. وقد كان في هذا الانتقال أثرٌ في تاريخ العلم كله: أن أوروبا لم تبدأ من الصفر في البصريات، بل بدأت من كتابٍ عربي تُرجم إلى اللاتينية، وقد كان في هذا دليلاً على أن العلم لا يعرف حدوداً إذا وُجد من ينقله.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالطب والمستشفيات\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان في الدولة الإسلامية في هذا العهد مستشفياتٌ منظمة تُسمّى «البيمارستان»، وكان فيها أقسامٌ للرجال والنساء، وصيدلية، وقاعة للدرس، وكان فيها أطباء يتناوبون، وكان يُشترط في الطبيب أن يجتاز امتحاناً قبل أن يُعالج. وقد كان في هذا تنظيماً لم يكن في أوروبا في ذلك العصر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في المستشفيات تعليمٌ عملي: أن الطالب يتعلّم مع الأستاذ عند سرير المريض، وأن يُسجّل الحالات، وأن يُقارن النتائج. وقد كان في هذا ما جعل الطب الإسلامي علماً له مدارس ومناهج، وقد كان في هذا ما جعل الرازي وابن سينا يُصنّفان كتباً اعتمدت عليها أوروبا قروناً.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالخوارزمي\u003c/b\u003e\u003cspan\u003eواضع الجبر، وكتابه تُرجم إلى اللاتينية وأسّس تعليم الجبر في أوروبا.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالرازي\u003c/b\u003e\u003cspan\u003eصاحب «الحاوي في الطب»، وكان مرجعاً في أوروبا قروناً.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eابن الهيثم\u003c/b\u003e\u003cspan\u003eصاحب «كتاب المناظر»، وواضع نظرية الرؤية الحديثة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالبيمارستان\u003c/b\u003e\u003cspan\u003eمستشفى منظم فيه أقسام وصيدلية وتعليم وامتحان للأطباء.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eجابر بن حيّان\u003c/b\u003e\u003cspan\u003eحوّل الكيمياء إلى علمٍ له تجارب ومصطلحات.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالعالم\u003c/th\u003e\u003cth\u003eالمجال\u003c/th\u003e\u003cth\u003eأشهر ما تركه\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالخوارزمي\u003c/td\u003e\u003ctd\u003eالرياضيات والفلك والجغرافيا\u003c/td\u003e\u003ctd\u003eالجبر والمقابلة وصورة الأرض\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالرازي\u003c/td\u003e\u003ctd\u003eالطب والكيمياء\u003c/td\u003e\u003ctd\u003eالحاوي في الطب\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eابن الهيثم\u003c/td\u003e\u003ctd\u003eالبصريات والرياضيات\u003c/td\u003e\u003ctd\u003eكتاب المناظر\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eجابر بن حيّان\u003c/td\u003e\u003ctd\u003eالكيمياء\u003c/td\u003e\u003ctd\u003eوصف التقطير والتصعيد والتبلور\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eبنو موسى بن شاكر\u003c/td\u003e\u003ctd\u003eالميكانيكا والهندسة\u003c/td\u003e\u003ctd\u003eكتب الحيل والأجهزة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eإنّي لا أقبل قولاً إلا بشاهدٍ من العقل أو تجربةٍ من الحسّ.\u003c/p\u003e\u003ccite\u003eمعنى ما يُعبّر عنه منهج ابن الهيثم في كتاب المناظر\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eلم يكن علم هذا العهد نقلاً، بل كان إضافة: الجبر عند الخوارزمي، ونظرية الرؤية عند ابن الهيثم، والحاوي عند الرازي، والبيمارستان كنظامٍ طبي. وقد انتقل هذا كله إلى أوروبا عن طريق الترجمة، وكان أساساً للنهضة الحديثة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-4","n":"القسم الرابع: التشظّي وسيطرة الجند","ic":"🧩","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-4\" style=\"--c:#3A3A3A\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🧩\u003c/div\u003e\n      \u003ch2\u003eالقسم الرابع: التشظّي وسيطرة الجند\u003c/h2\u003e\n      \u003cp\u003eبين سنة ثماني عشرة ومئتين وسنة أربعٍ وأربعين وأربعمئة تقلّصت الدولة العباسية من إمبراطوريةٍ تحكم من المحيط إلى السند، إلى خلافةٍ لا تحكم إلا بغداد وما حولها. وقد لم يكن السبب في هذا التقليص عدوّاً خارجياً، بل كان السبب في الأغلب جنداً صار أقوى من الخليفة، وولاياتٍ صارت وراثية، ووزراءً صاروا هم الحكّام الحقيقيين.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#turks-samarra\"\u003eالأتراك وسامراء\u003c/a\u003e\u003ca href=\"#independent-states\"\u003eالدول المستقلة\u003c/a\u003e\u003ca href=\"#buwayhids-seljuks\"\u003eالبويهيون والسلاجقة\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"turks-samarra","n":"الأتراك وسامراء","ic":"🏇","part":"القسم الرابع: التشظّي وسيطرة الجند","h":"\u003carticle class=\"ch3\" id=\"turks-samarra\" data-toc=\"الأتراك وسامراء\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الرابع: التشظّي وسيطرة الجند\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ١ من ٣\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٤\u003ci\u003e.\u003c/i\u003e١\u003c/span\u003e\n            \u003ch3\u003eالأتراك وسامراء\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eفي عهد المعتصم بدأ الخلفاء يستقدمون جنوداً أتراكاً من آسيا الوسطى، وكان السبب في ذلك أن الجيش العربي والخراساني صار عصبيّاً ومتنازعاً، وأن الخليفة أراد جيشاً لا قبيلة له فيكون ولاؤه للخليفة وحده. وقد كان هذا القرار هو الذي أنتج بعد ذلك سيطرة الجند على الخلافة، ونقل العاصمة إلى سامراء.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان المعتصم بالله قد صار خليفةً سنة ثماني عشرة ومئتين بعد أخيه المأمون، وكانت أمه تركية تُسمّى ماردة، وكان قد نشأ بين الجنود الأتراك في خراسان. وقد كان في الجيش في ذلك الوقت مشكلةٌ كبيرة: أن الجيش كان مقسوماً بين عربٍ من مضر واليمن، وبين فرسٍ من خراسان، وأن كل فريقٍ كان يتنازع على الأعطيات والمناصب، وأن الفتنة بينهم كانت تُشلّ الدولة في كل أزمة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان حلّ المعتصم لهذه المشكلة أن يستقدم جنوداً من الأتراك من ما وراء النهر، وأن يُجنّدهم جيشاً خاصاً يُسمّى «الغلمان» أو «المماليك»، وأن يُعطيهم أعطياتٍ عالية، وأن يُخرجهم من كل ولاءٍ قبلي. وقد كان في هذا القرار منطقٌ واضح: أن الجندي الذي لا قبيلة له لا يستطيع أن يتحالف مع قبيلةٍ ضد الخليفة، وأن ولاءه يكون للذي يُطعمه ويُلبسه.\u003c/p\u003e\u003cp class=\"ap\"\u003eلكن هذا المنطق كان فيه خطأً لم يُلحظ في وقته: أن الجندي الذي لا ولاء له إلا للخليفة يصير قادراً على أن يستبدل الخليفة إذا أراد، لأن ولاءه ليس للدولة بل للشخص، وأن الجيش الذي لا يمثّل شعباً لا يخاف من غضب الناس. وقد ظهر هذا بعد عشرين سنة فقط، حين صار الأتراك هم من يُعيّنون الخلفاء ويعزلونهم ويقتلونهم. وقد كان في هذا الوضع خطرٌ على الخلافة نفسها: أنها صارت منصباً يُعطى لمن يُرضي القوّاد، وأن من يجلس على العرش لا يملك أن يحمي نفسه، وأن الخليفة الذي لا يملك جيشاً لا يستطيع أن يُعيّن وزيراً ولا والياً ولا قاضياً بغير إذنهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سنة إحدى وعشرين ومئتين بنى المعتصم مدينةً جديدةً على دجلة تُسمّى «سرّ من رأى»، وعُرفت بعد ذلك بسامراء، وقد كان السبب في بنائها أن بغداد صارت مدينةً مزدحمة، وأن الجند الأتراك لم يتأقلموا مع أهلها، وأن المعتصم أراد أن يكون بعيداً عن الفتن. وقد كانت المدينة واسعةً جداً، وقد بُنيت فيها قصورٌ ومساجدُ وأسواق، وكان فيها «الجامع الكبير» الذي له مئذنةٌ حلزونية تُعرف بالملوية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت سامراء عاصمةً للدولة نحو ستين سنة، من سنة إحدى وعشرين ومئتين إلى سنة ستٍّ وخمسين ومئتين، وقد تعاقب عليها ثمانية خلفاء. وقد كانت في هذه السنوات مركزاً للعمارة والفن، وقد بُنيت فيها قصورٌ ضخمة مثل قصر الجوسق وقصر المعشوق، وقد كان في هذا الإنفاق ما جعل الخزينة تُنفق مبالغ هائلة في وقتٍ كان الخراج فيه ينقص. وقد كان في هذا الإنفاق ما جعل سامراء مدينةً عظيمةً في العمارة، لكنه كان في الوقت نفسه استنزافاً للخزينة، وقد كان الخراج ينقص لأن الأطراف صارت تستقلّ، فصار الإنفاق يزيد والدخل ينقص، وهذا هو الطريق الذي تُسقط الدول.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه السنوات أن استُخدم الأتراك في قمع الثورات، وكان من أشهرها ثورة الزط في جنوب العراق، وثورة بابك الخرمي في أذربيجان، وقد كان بابك قد أقام حركةً دينيةً واسعةً سنوات، وقد أُخمدت ثورته سنة اثنتين وعشرين ومئتين على يد الأفشين، وهو قائدٌ تركي. وقد كان في هذه الثورات ما جعل الجيش التركي ضرورياً، وما جعل نفوذه يزداد في كل مرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في عهد المتوكل سنة اثنتين وثلاثين ومئتين أن أُوقف امتحان خلق القرآن، وكان في هذا انتصارٌ لأهل الحديث، وقد كان في هذا أيضاً تحوّلٌ في سياسة الدولة الدينية: أن الخلافة تخلّت عن فرض رأيٍ عقائدي، وأن العلماء صاروا أكثر استقلالاً. وقد كان في عهده أيضاً أن تسرّع انحدار الدولة، فقد كان يُنفق على البناء واللهو أكثر من إنفاقه على الجيش والإدارة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في سنة سبعٍ وأربعين ومئتين أن قُتل المتوكل على يد الأتراك في قصره، وكان هذا أول قتلٍ لخليفةٍ على يد جنده في الدولة العباسية. وقد كان بعده المستعين والمعتز والمهتدي والمعتمد، وكلهم كانوا يُعيّنون ويُعزلون بأمر القوّاد الأتراك، وقد كان في هذا ما جعل الخلافة منصباً بلا سلطة، وما جعل سامراء مدينةً يحكمها الجند لا الخليفة. وقد كان في نقل العاصمة إلى بغداد سنة ستٍّ وخمسين ومئتين إشارةً إلى أن الجند لم يعودوا بحاجة إلى الخليفة، بل صاروا يتحركون حيث تكون الخزينة، وقد كان في هذا ما يُبيّن أن السلطة انتقلت من القصر إلى المعسكر.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eلماذا الأتراك؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الأتراك في ذلك الوقت شعباً في آسيا الوسطى، وكانوا يُجاورون حدود الدولة الإسلامية في ما وراء النهر، وكانوا يُجيدون الفروسية والرمي بالقوس، وكانوا يُقاتلون في جيوشٍ قبلية. وقد كان في استقدامهم حلٌّ لمشكلةٍ مزدوجة: أن الدولة تحتاج جنوداً محترفين، وأنها تحتاج جيشاً لا يتدخل في صراع القبائل العربية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا الاستقدام أيضاً خطرٌ لم يُقدّره المعتصم: أن الجنود الأتراك كانوا يُؤخذون صغاراً من بلادهم، ويُربّون في بغداد وسامراء، ويُعلّمون العربية والفروسية، فيصيرون مسلمين لا يعرفون وطناً غير الجيش. وقد كان في هذا ما يجعل ولاءهم للقائد لا للدولة، وإذا كان القائد طامعاً صار الجيش أداةً في يده.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eسامراء: عاصمة الجند\u003c/h4\u003e\u003cp class=\"ap\"\u003eبُنيت سامراء سنة إحدى وعشرين ومئتين، وكانت في البداية معسكراً كبيراً للجند الأتراك، ثم صارت مدينةً كاملةً فيها قصورٌ ومساجد وأسواق وبساتين. وقد كان تخطيطها مختلفاً عن بغداد: لم تكن دائرةً محصّنة، بل كانت مدينةً ممتدةً على ضفة النهر، وقد كان فيها مساحاتٌ واسعة للتدريب والمراعي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في المدينة جامعٌ كبير تُسمّى مئذنته «الملوية»، وهي مئذنةٌ حلزونية يبلغ ارتفاعها نحو خمسين متراً، وقد كانت تُستخدم أيضاً للمراقبة. وقد كان في سامراء قصورٌ كثيرة، وقد كشفت الحفائر عن زخارف جصية ونقوشٍ تُعدّ من أهم ما وصلنا من الفن العباسي، وقد سُجّلت المدينة في قائمة التراث العالمي.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eقتل المتوكل وبداية سيطرة الجند\u003c/h4\u003e\u003cp class=\"ap\"\u003eقُتل المتوكل سنة سبعٍ وأربعين ومئتين في قصره في سامراء، وقيل إن ابنه المنتصر كان مشاركاً في التدبير، وقيل إن القوّاد الأتراك هم الذين دبّروا القتل. وقد كان في هذا الحدث ما لم يجرِ من قبل: أن خليفةً يُقتل في عاصمته على يد حرسه، وأن ابنه يجلس مكانه دون أن يُحاسَب أحد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا بداية مرحلةٍ جديدة في تاريخ الخلافة: أن الخليفة صار يُعيّن ويُعزل بأمر الجند، وأن الجيش صار هو السلطة الحقيقية، وأن الخلافة صارت منصباً رمزياً يُعطى لمن يدفع أكثر أو لمن يرضى به القوّاد. وقد استمر هذا الوضع حتى نقل المعتمد العاصمة إلى بغداد سنة ستٍّ وخمسين ومئتين، ثم استمر بعده في صورةٍ أخرى.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمعتصم\u003c/b\u003e\u003cspan\u003eأول من استقدم الأتراك جيشاً خاصاً، وحكم ٢١٨–٢٢٧هـ.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسامراء\u003c/b\u003e\u003cspan\u003eبُنيت سنة ٢٢١هـ، وكانت عاصمةً نحو ستين سنة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eقتل المتوكل\u003c/b\u003e\u003cspan\u003eسنة ٢٤٧هـ، أول خليفةٍ يُقتل على يد جنده.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eبابك الخرمي\u003c/b\u003e\u003cspan\u003eثورة في أذربيجان أُخمدت سنة ٢٢٢هـ على يد الأفشين.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالملوية\u003c/b\u003e\u003cspan\u003eمئذنة حلزونية في جامع سامراء، من أشهر آثار العمارة العباسية.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالخليفة\u003c/th\u003e\u003cth\u003eالمدة\u003c/th\u003e\u003cth\u003eالحدث الأبرز\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالمأمون\u003c/td\u003e\u003ctd\u003e١٩٨–٢١٨هـ\u003c/td\u003e\u003ctd\u003eالترجمة والعلم وفتنة خلق القرآن\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمعتصم\u003c/td\u003e\u003ctd\u003e٢١٨–٢٢٧هـ\u003c/td\u003e\u003ctd\u003eاستقدام الأتراك وبناء سامراء\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالواثق\u003c/td\u003e\u003ctd\u003e٢٢٧–٢٣٢هـ\u003c/td\u003e\u003ctd\u003eاستمرار الامتحان وثورات الأطراف\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمتوكل\u003c/td\u003e\u003ctd\u003e٢٣٢–٢٤٧هـ\u003c/td\u003e\u003ctd\u003eإيقاف الامتحان ثم قتله على يد الجند\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمستعين\u003c/td\u003e\u003ctd\u003e٢٤٧–٢٥٢هـ\u003c/td\u003e\u003ctd\u003eصراع القوّاد وعودة العاصمة إلى بغداد\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eإذا كان الجند لا يعرف إلا سيفه، فإنه لا يعرف إلا من يُشهره.\u003c/p\u003e\u003ccite\u003eمعنى ما يُستخلص من تجربة الأتراك في الدولة العباسية\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eاستقدم المعتصم الأتراك ليُخلّص الدولة من عصبية القبائل، فصار الجند هو السلطة بعد عشرين سنة. وقد بُنيت سامراء عاصمةً للجند، وقُتل المتوكل في قصره، وبدأت مرحلةٌ صار فيها الخليفة يُعيّن ويُعزل بأمر قوّاده.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"independent-states","n":"الدول المستقلة","ic":"🗺️","part":"القسم الرابع: التشظّي وسيطرة الجند","h":"\u003carticle class=\"ch3\" id=\"independent-states\" data-toc=\"الدول المستقلة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الرابع: التشظّي وسيطرة الجند\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٢ من ٣\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٤\u003ci\u003e.\u003c/i\u003e٢\u003c/span\u003e\n            \u003ch3\u003eالدول المستقلة\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eفي القرن الثالث الهجري بدأت الأطراف تنفصل واحداً بعد الآخر، ولم يكن الانفصال في الغالب حرباً على الخلافة بل كان استقلالاً فعلياً مع بقاء الاسم في الخطبة والنقود. وقد نشأت دولٌ في خراسان وفارس والمغرب ومصر والشام واليمن، وكان لكل دولةٍ سببها وطابعها، وقد كان في هذا ما جعل الخلافة العباسية تفقد سلطانها الحقيقي قبل أن تفقد اسمها.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eبدأ الانفصال في المغرب مبكراً؛ فقد قامت دولة الأدارسة في المغرب الأقصى سنة اثنتين وسبعين ومئة، وكان مؤسسها إدريس بن عبد الله من العلويين، وقد فرّ من معركة فخّ إلى المغرب، وبايعه البربر، وأسّس مدينة فاس. وقد كانت هذه أول دولةٍ علوية في التاريخ، وقد بقيت نحو قرنين، وكانت مستقلةً تماماً عن الخلافة. وقد كان في قيامها في أقصى الغرب دلالة على أن الخلافة لم تكن قادرةً على متابعة الأطراف البعيدة، وأن المسافة وحدها كانت عاملاً في الانفصال، وقد كان في هذا ما سيتكرّر في كل إقليم بعيد عن المركز.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقامت في إفريقية دولة الأغالبة سنة أربعٍ وثمانين ومئة، وكان مؤسسها إبراهيم بن الأغلب، وقد أرسله الرشيد والياً ثم صار الحكم وراثياً في أسرته. وقد كانت هذه الدولة قويةً بحرياً، وقد فتحت صقلية سنة اثنتين عشرة ومئتين، وقد كانت في الظاهر تابعةً للخلافة وفي الحقيقة مستقلة، وقد بقيت نحو قرن. وقد كان في فتح صقلية أثرٌ حضاري كبير: أن الجزيرة صارت جسراً لنقل العلم العربي إلى أوروبا، وأن فيها بعد ذلك مدرسةٌ للترجمة من العربية إلى اللاتينية، وقد كان في هذا ما جعل صقلية جزءاً من التاريخ الأوروبي والعربي في الوقت نفسه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي مصر قامت الدولة الطولونية سنة أربعٍ وخمسين ومئتين، وكان مؤسسها أحمد بن طولون، وكان تركي الأصل، وقد أرسله الخليفة والياً على مصر ثم استقلّ بها. وقد بنى مدينة القطائع ومسجد ابن طولون، وقد كان جيشه من الأتراك والروم والسودان، وقد كانت دولته أول انفصالٍ لمصر عن الخلافة، وقد بقيت نحو ثلاثين سنة. وقد كان في استقلال مصر أثرٌ اقتصادي كبير على الخلافة: أن مصر كانت تُرسل خراجاً كبيراً، وأن انفصالها قطع مورداً مهماً، وقد كان في هذا ما جعل الخلافة تعتمد على العراق وحده، والعراق كان قد بدأ يفقد خصوبته بسبب مشاكل الريّ.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي الشام ومصر قامت الدولة الإخشيدية سنة ثلاثٍ وعشرين وثلاثمئة، وكان مؤسسها محمد بن طغج الإخشيد، وكان تركي الأصل أيضاً، وقد حكمت نحو ثلاثين سنة، ثم جاءت الدولة الفاطمية سنة ثمانٍ وخمسين وثلاثمئة فسيطرت على مصر والشام، وأسّست القاهرة، وجعلت الخلافة فيها، وكانت هذه أخطر منافسةٍ للخلافة العباسية. وقد كان في قيام الدولة الفاطمية تحدٍّ جديد: أنها لم تكن دولةً منفصلة فقط بل كانت خلافةً منافسة، وكانت لها دعوةٌ في كل الأمصار، وكانت تُرسل الدعاة إلى خراسان واليمن والمغرب، وقد كان في هذا ما جعل الخلافة العباسية تُواجه خطراً عقائدياً لا عسكرياً فقط.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي خراسان قامت الدولة الطاهرية سنة خمسٍ ومئتين، وكان مؤسسها طاهر بن الحسين الذي قاد جيش المأمون في حرب الأمين، وقد صار والياً على خراسان ثم ورّثها لأبنائه. وقد كانت هذه الدولة في الظاهر تابعةً للخلافة، لكنها كانت مستقلةً في الحقيقة، وقد كانت من أول ما أظهر ضعف السلطة المركزية. وقد كان في قيام الدولة الطاهرية بداية نمطٍ جديد: أن القائد الذي يُساعد الخليفة على الوصول إلى العرش يطلب إقليماً مقابل ذلك، وأن الخليفة يُعطيه لأنه لا يستطيع أن يرفض، وقد كان في هذا ما جعل كل أزمةٍ داخلية تُنتج انفصالاً جديداً.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم قامت الدولة الصفارية سنة سبعٍ وأربعين ومئتين في سجستان، وكان مؤسسها يعقوب بن الليث الصفار، وكان في الأصل صانعاً للنحاس ثم صار قائداً عسكرياً. وقد كان جيشه من المتطوعين، وقد استولى على خراسان وفارس، وقد حاول أن يزحف إلى بغداد سنة اثنتين وستين ومئتين، فلم ينجح، لكنه أظهر ضعف الخلافة أمام الجميع. وقد كان في زحف يعقوب بن الليث إلى بغداد دلالةً على أن الخلافة صارت عاجزةً عن حماية نفسها، وقد كان في تراجعه عن الزحف دلالةً أخرى: أن الأطراف كانت تريد الاستقلال لا إسقاط الخلافة، لأن الخلافة كانت تُعطيهم شرعيةً يحتاجونها.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم قامت الدولة السامانية سنة أربعٍ وسبعين ومئتين في ما وراء النهر، وكانت من أقوى الدول في الشرق، وقد كانت في الظاهر تابعةً للخلافة، وقد كانت مركزاً للعلم والأدب؛ فقد عاش فيها ابن سينا والرودكي والفردوسي والبخاري في بيئتها. وقد كانت الدولة السامانية هي التي أوقفت الزحف التركي في الشرق سنوات، ثم سقطت أمام الدولة الغزنوية. وقد كان في ازدهار السامانيين دليلٌ على أن الاستقلال السياسي قد يكون مفيداً للثقافة، وأن الدولة الصغيرة قد تُنتج علماً أكثر من الدولة الكبيرة إذا كانت تُنفق على العلم وتُتيح حرية السؤال، وقد كان في هذا ما يجعل الحكم على التشظي حكماً مركّباً.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا كله نمطٌ متكرر: أن الوالي يرسله الخليفة، ثم يستقلّ بالإقليم، ثم يُورّثه لأبنائه، ثم يُرسل الخراج رمزياً أو لا يُرسله. وقد كان الخليفة يقبل هذا الوضع لأنه لا يملك جيشاً يُعيد به الأطراف، ولأن بقاء الاسم في الخطبة والنقود كان يحفظ له شرعيةً رمزية. وقد كان في هذا تحولاً في مفهوم الخلافة: من سلطةٍ فعلية إلى رمزٍ للوحدة.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالأدارسة والفاطميون: دولٌ علوية\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الدولة الإدريسية في المغرب أول دولةٍ علوية، وقد أسّسها إدريس بن عبد الله بعد فراره من معركة فخّ، وقد بايعه البربر سنة اثنتين وسبعين ومئة، وأسّس مدينة فاس سنة اثنتين وتسعين. وقد كان في قيامها دلالة على أن العلويين لم ييأسوا من الحكم، وأنهم وجدوا في الأطراف البعيدة ما لم يجدوه في المركز.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم قامت الدولة الفاطمية سنة سبعٍ وتسعين ومئتين في إفريقية، وكانت من أخطر الحركات في تاريخ الإسلام؛ فقد كانت حركةً سريةً إسماعيلية، وقد أسّست خلافةً منافسةً في المغرب ثم في مصر، وقد بُنيت القاهرة سنة ثمانٍ وخمسين وثلاثمئة، وقد بقيت الدولة نحو قرنين، وكانت تُهدّد الخلافة العباسية من الجنوب والغرب.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالطاهريون والصفاريون والسامانيون\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الطاهريون أول من أظهر الاستقلال الفعلي في الشرق، وكانوا من قوّاد المأمون، وقد حكموا خراسان نحو خمسين سنة. وقد كان في سقوطهم على يد الصفاريين دلالة على أن القوة العسكرية صارت هي المصدر الوحيد للسلطة، وأن من يملك الجيش يملك الإقليم. وقد كان في هذا النمط ما جعل الخلافة تفقد معناها السياسي تدريجياً: أن الوالي لم يعد موظفاً يُعيّنه الخليفة ويُعزله، بل صار ملكاً يُورّث ابنه، وأن الخليفة لم يعد يُعيّن إلا من يُبلّغه القوّاد أنه مرشّح، وقد كان في هذا نهاية الدولة بالمعنى الإداري.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم جاء السامانيون فأسّسوا دولةً أكثر تنظيماً، وقد كانت عاصمتهم بخارى، وقد ازدهرت فيها اللغة الفارسية والعلم، وقد كانت تُرسل الخراج إلى بغداد رمزياً. وقد كان في هذا النمط ما جعل الخلافة تعيش طويلاً: أنها لم تكن تُطالب بالسلطة الفعلية، بل كانت تكتفي بالاسم والدعاء.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eلماذا قبلت الخلافة هذا؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يكن للخليفة خيارٌ آخر في أكثر الأحيان؛ فقد كان جيشه من الأتراك، وكان هؤلاء يُطالبون بأعطياتهم، وكانت الخزينة لا تكفي لحربٍ في كل إقليم. وقد كان في قبول الاستقلال الرمزي حفظٌ للاسم والشرعية، وقد كان في محاولة استعادته خطرٌ على الخلافة نفسها، كما جرى حين حاول بعض الخلفاء أن يُرسلوا جيوشاً إلى الأطراف فلم تنجح.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا الوضع فائدةٌ للطرفين: أن الوالي المستقل يحصل على شرعيةٍ من الخليفة، وأن الخليفة يحصل على اسمه في الخطبة والنقود. وقد كان في هذا ما يجعل الخلافة العباسية تعيش خمسة قرون بعد أن فقدت سلطتها، وهذا لغزٌ في تاريخ الدول: أن الرمز قد يبقى أطول من السلطة.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالأدارسة\u003c/b\u003e\u003cspan\u003e١٧٢هـ في المغرب، أول دولة علوية، وأسّست فاس.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالأغالبة\u003c/b\u003e\u003cspan\u003e١٨٤هـ في إفريقية، وفتحوا صقلية سنة ٢١٢هـ.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالطولونية\u003c/b\u003e\u003cspan\u003e٢٥٤هـ في مصر، أول انفصالٍ لمصر عن الخلافة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالسامانية\u003c/b\u003e\u003cspan\u003e٢٧٤هـ في ما وراء النهر، ومركزٌ للعلم والفارسية.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالفاطميون\u003c/b\u003e\u003cspan\u003e٢٩٧هـ في إفريقية، ثم مصر سنة ٣٥٨هـ، وخلافة منافسة.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالدولة\u003c/th\u003e\u003cth\u003eالمكان\u003c/th\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالطابع\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالأدارسة\u003c/td\u003e\u003ctd\u003eالمغرب الأقصى\u003c/td\u003e\u003ctd\u003e١٧٢هـ\u003c/td\u003e\u003ctd\u003eعلوية، وأسّست فاس\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالأغالبة\u003c/td\u003e\u003ctd\u003eإفريقية\u003c/td\u003e\u003ctd\u003e١٨٤هـ\u003c/td\u003e\u003ctd\u003eقوية بحرياً، وفتحت صقلية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالطاهرية\u003c/td\u003e\u003ctd\u003eخراسان\u003c/td\u003e\u003ctd\u003e٢٠٥هـ\u003c/td\u003e\u003ctd\u003eقوّاد المأمون، استقلال فعلي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالصفارية\u003c/td\u003e\u003ctd\u003eسجستان وفارس\u003c/td\u003e\u003ctd\u003e٢٤٧هـ\u003c/td\u003e\u003ctd\u003eقوة عسكرية بلا تنظيم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالسامانية\u003c/td\u003e\u003ctd\u003eما وراء النهر\u003c/td\u003e\u003ctd\u003e٢٧٤هـ\u003c/td\u003e\u003ctd\u003eعلمٌ وأدبٌ فارسي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالطولونية\u003c/td\u003e\u003ctd\u003eمصر\u003c/td\u003e\u003ctd\u003e٢٥٤هـ\u003c/td\u003e\u003ctd\u003eأول انفصالٍ لمصر\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالفاطمية\u003c/td\u003e\u003ctd\u003eإفريقية ثم مصر\u003c/td\u003e\u003ctd\u003e٢٩٧هـ\u003c/td\u003e\u003ctd\u003eخلافة منافسة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eالدولة التي لا تملك جيشاً لا تملك أطرافها.\u003c/p\u003e\u003ccite\u003eمعنى ما تُظهره تجربة انفصال الولايات في القرن الثالث\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eفي قرنٍ واحد انفصلت المغرب وإفريقية ومصر وخراسان وفارس وما وراء النهر، ولم يكن الانفصال حرباً بل تحولاً تدريجياً: أن الوالي صار ملكاً، وأن الخليفة صار رمزاً. وقد بقيت الخلافة لأن أحداً لم يُرد إسقاطها، لا لأنها كانت قوية.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"buwayhids-seljuks","n":"البويهيون والسلاجقة","ic":"🐺","part":"القسم الرابع: التشظّي وسيطرة الجند","h":"\u003carticle class=\"ch3\" id=\"buwayhids-seljuks\" data-toc=\"البويهيون والسلاجقة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الرابع: التشظّي وسيطرة الجند\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٣ من ٣\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٤\u003ci\u003e.\u003c/i\u003e٣\u003c/span\u003e\n            \u003ch3\u003eالبويهيون والسلاجقة\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eفي القرن الرابع والخامس الهجري دخلت الخلافة العباسية مرحلةً جديدة: أن يحكم بغداد أميرٌ من خارجها، ويكون الخليفة تحت حمايته. وقد كان البويهيون من الديلم شيعةً، والسلاجقة من الترك سنةً، وقد حكما بغداد نحو قرنين، وكان الخليفة في هذه الفترة يملك الشرعية ولا يملك السلطة، وكان الأمير يملك السلطة ولا يملك الشرعية.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eقام البويهيون في فارس سنة اثنتين وعشرين وثلاثمئة، وكانوا من الديلم، وهم شعبٌ من جبال طبرستان، وكانوا شيعةً اثني عشرية. وقد استطاع معز الدولة البويهي أن يدخل بغداد سنة أربعٍ وثلاثين وثلاثئة، وأن يُسيطر على الخلافة، وقد كان في هذا الحدث ما لم يجرِ من قبل: أن يحكم بغداد أميرٌ شيعي، وأن يكون الخليفة السني تحت حمايته. وقد كان في هذا الوضع ما جعل الخليفة يعيش في وضعٍ غريب: أنه يُبارك من يحكم باسمه، وأنه يُصلّي على من يقتل أنصاره، وأنه يحتفظ بمظاهر السلطة من غير أن يملك شيئاً منها، وقد كان في هذا ما يُشبه الملكية الدستورية في العصور الحديثة بلا دستور.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في عهد البويهيين أن أُغلقت بعض المساجد، وأن مُنع بعض المظاهر السنية، وأن أُقيمت شعائر شيعية في بغداد، وقد كان في هذا ما أثار اضطراباتٍ طائفيةً كثيرة بين السنة والشيعة في المدينة، وقد كان في هذا ما جعل بغداد تفقد استقرارها سنوات طويلة، وقد كان في الوقت نفسه عصراً ازدهرت فيه الفلسفة والأدب. وقد كان في هذا الازدهار سببٌ مهم: أن التنافس بين الدول الصغيرة جعل كل دولةٍ تُنفق على العلم لتُظهر تفوّقها، وأن العلماء صاروا ينتقلون من بلاطٍ إلى بلاط، وقد كان في هذا ما جعل القرن الرابع يُسمّى عصر «نهضة العلوم» في التاريخ الإسلامي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا العهد أن ظهر الفارابي وابن سينا وابن الهيثم والبيروني، وأن ازدهرت الفلسفة الإسلامية، وأن نُقلت كتبٌ كثيرة، وأن صارت بغداد وفارس وخراسان مراكز للعلم. وقد كان في هذا مفارقة: أن السلطة السياسية كانت في أضعف حالاتها، وأن الثقافة كانت في أقوى حالاتها، وهذا ما يُظهر أن العلم لا يعتمد على قوة الدولة بقدر ما يعتمد على حرية السؤال.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم جاء السلاجقة سنة سبعٍ وأربعين وأربعمئة، وكانوا من الترك السنة، وقد استطاع طغرل بك أن يدخل بغداد سنة خمسٍ وأربعين وأربعمئة، وأن يُنهي حكم البويهيين، وأن يصير هو السلطان، وأن يترك الخليفة في مكانه. وقد كان في هذا ترتيباً جديداً: أن السلطان يملك الجيش والإدارة، وأن الخليفة يملك الشرعية والدعاء، وأن كلاً منهما يحتاج إلى الآخر. وقد كان في هذا الترتيب استقرارٌ نسبي: أن كل طرفٍ يعرف حدوده، وأن الخليفة لا يُحاول أن يستعيد الجيش، وأن السلطان لا يُحاول أن يستولي على الشرعية، وقد كان في هذا ما جعل بغداد تعيش قرناً من الهدوء النسبي بعد اضطراب البويهيين.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في العهد السلجوقي أن أُسست المدارس النظامية، وأشهرها مدرسة بغداد التي أسّسها نظام الملك سنة تسعٍ وخمسين وأربعمئة، وقد كان في هذه المدارس تعليمٌ منظم للفقه والشريعة، وقد كان في هذا تحولاً في التعليم: من حلقات المسجد إلى مدارس لها أوقاف ومناهج وشهادات. وقد كان في المدارس النظامية أثرٌ بعيد المدى: أنها ربطت التعليم بالدولة، وأنها جعلت الفقه دراسةً منظمةً لها مناهج وامتحانات، وأنها أنتجت طبقةً من العلماء يعملون في القضاء والتدريس والإفتاء، وقد كان في هذا ما جعل العلم مؤسسةً لا موهبةً فردية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا العهد أن ظهر الغزالي، وكان أستاذاً في المدرسة النظامية، وقد كتب «تهافت الفلاسفة» و«إحياء علوم الدين»، وقد كان في كتاباته ما غيّر مسار الفكر الإسلامي: أن ردّ على الفلاسفة ردّاً منهجياً، وأن أعاد التصوف إلى دائرة السنة. وقد كان في هذا العهد أيضاً أن ازدهرت النحو واللغة والتفسير والحديث. وقد كان في الغزالي أن جمع بين الفقه والكلام والتصوف، وأن كتب في كل هذه الميادين، وقد كان في كتاباته ما جعل التصوف مقبولاً عند أهل السنة بعد أن كان موضع شكٍّ عند كثير من الفقهاء، وقد كان في هذا أثرٌ في تاريخ الفكر الإسلامي لا يُقاس.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في العهد السلجوقي أن ظهرت قوة جديدة في الشرق: أن الإسماعيلية أسّست دولةً في ألموت سنة ثلاثٍ وثمانين وأربعمئة، وقد كان لها دعاةٌ في كل مكان، وقد كان في هذا ما جعل السلاجقة يعيشون في حالة حربٍ دائمة. وقد كان في هذا أيضاً بداية الخطر الصليبي الذي وصل سنة خمسٍ وتسعين وأربعمئة، ووجد الدولة منقسمة. وقد كان في هذا التزامن ما جعل الصليبيين يجدون أرضاً منقسمة: أن السلاجقة كانوا يُقاتلون الإسماعيلية في الداخل، وأن الخلافة كانت ضعيفة، وأن دولاً صغيرة كانت تحكم المدن الساحلية، وقد كان في هذا ما يُفسّر نجاح الحملة الأولى بهذه السرعة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه الفترة أن الخلافة العباسية حاولت أن تستعيد سلطتها، وقد نجح الخليفة القائم بأمر الله في أن يستعيد بعض النفوذ بعد موت السلطان ملكشاه سنة خمسٍ وثمانين وأربعمئة، ثم حاول الخليفة الناصر أن يُعيد بناء قوةٍ عسكرية في القرن السادس، وقد كان في هذا ما جعل الخلافة تعيش حتى سنة ستٍّ وخمسين وستمئة، حين جاء المغول. وقد كان في هذه المحاولات دلالةً على أن الخلافة لم تكن ميتةً تماماً، وأنها كانت قادرةً على أن تستعيد شيئاً من نفوذها إذا وجدت خليفةً حازماً، لكنها لم تكن قادرةً على أن تبني جيشاً يُعادل جيوش السلاطين، وقد كان في هذا ما جعل نهايتها مسألة وقت.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالبويهيون: حمايةٌ شيعية لخلافةٍ سنية\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان البويهيون من الديلم، وكانوا شيعةً اثني عشرية، وقد سيطروا على بغداد سنة أربعٍ وثلاثين وثلاثئة، وقد كان في هذا وضعاً غريباً: أن يكون الخليفة سنياً وأن يكون الحامي شيعياً. وقد كان في هذا ما جعل العلاقة بينهما متوترةً دائماً، وأن تكون هناك اضطراباتٌ طائفية في بغداد في كل أزمة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان البويهيون يُقيمون شعائر شيعية في بغداد مثل زيارة كربلاء والغدير، وقد كان في هذا ما أثار السنة، وقد كان في الوقت نفسه ما جعل بغداد مدينةً متعددة المذاهب بشكلٍ لم تعرفه من قبل. وقد كان في هذا العهد أن كُتبت كتبٌ شيعية كثيرة، وأن نُقلت كتبٌ سنية، وأن الحوار بين المذاهب صار أكثر من قبل.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالسلاجقة: سلطانٌ تركي وخليفةٌ عربي\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان السلاجقة من الترك السنة، وقد دخلوا بغداد سنة خمسٍ وأربعين وأربعمئة، وقد كانوا يُقدّمون أنفسهم حماةً للخليفة وللسنة، وقد كان في هذا ما أعاد للخليفة بعض المكانة، لكنه لم يُعده إلى السلطة. وقد كان في هذا الترتيب نموذجاً لعلاقةٍ سياسية سائدة في التاريخ الإسلامي: أن الشرعية عند الخليفة، والقوة عند السلطان.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان نظام الملك وزيراً لسلاطين السلاجقة، وكان من أعظم وزراء التاريخ، وقد أسّس المدارس النظامية في نيسابور وبغداد وأصفهان، وقد كان في هذه المدارس أوقافٌ تُنفق على الطلاب والأساتذة، وقد كان في هذا أول نظامٍ للتعليم الممنهج في الإسلام، وقد كان له أثرٌ في تكوين طبقة العلماء.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالغزالي ونقد الفلاسفة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الغزالي أستاذاً في المدرسة النظامية ببغداد، وقد كتب «تهافت الفلاسفة» سنة ثمانٍ وثمانين وأربعمئة، وقد كان في هذا الكتاب نقدٌ منهجي لفلسفة ابن سينا والفارابي، وقد كان في نقد ما قبلها من كتب الفلاسفة ما جعل بعض الناس يقولون إن الغزالي أنهى الفلسفة في الشرق.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا القول مبالغة، لأن الفلسفة استمرت بعده في الأندلس والمغرب، وقد ردّ عليها ابن رشد في «تهافت التهافت». لكن الغزالي كان قد غيّر مسار الفكر: أن جعل العقل تابعاً للنقل في المسائل الغيبية، وأن أعاد التصوف إلى دائرة السنة، وأن جعل الفقه علماً له أصولٌ ومناهج.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالبويهيون\u003c/b\u003e\u003cspan\u003eدخلوا بغداد سنة ٣٣٤هـ، وكانوا شيعةً من الديلم.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالسلاجقة\u003c/b\u003e\u003cspan\u003eدخلوا بغداد سنة ٤٤٥هـ، وكانوا سنةً من الترك.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمدرسة النظامية\u003c/b\u003e\u003cspan\u003eأسّسها نظام الملك سنة ٤٥٩هـ، وأول نظامٍ تعليمي ممنهج.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالغزالي\u003c/b\u003e\u003cspan\u003eصاحب «تهافت الفلاسفة» و«إحياء علوم الدين».\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eألموت\u003c/b\u003e\u003cspan\u003eدولة الإسماعيلية سنة ٤٨٣هـ، وأخطر تهديدٍ داخلي للسلاجقة.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالفترة\u003c/th\u003e\u003cth\u003eالقوة الحاكمة\u003c/th\u003e\u003cth\u003eموقع الخليفة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e٣٣٤–٤٤٧هـ\u003c/td\u003e\u003ctd\u003eالبويهيون\u003c/td\u003e\u003ctd\u003eتحت حمايةٍ شيعية، بلا سلطة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٤٤٧–٥٥٢هـ\u003c/td\u003e\u003ctd\u003eالسلاجقة\u003c/td\u003e\u003ctd\u003eشرعيةٌ رمزية تحت حمايةٍ سنية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٤٨٣هـ\u003c/td\u003e\u003ctd\u003eالإسماعيلية في ألموت\u003c/td\u003e\u003ctd\u003eتهديدٌ داخلي دائم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٤٩٠هـ\u003c/td\u003e\u003ctd\u003eالحملة الصليبية الأولى\u003c/td\u003e\u003ctd\u003eدولةٌ منقسمة أمام خطرٍ خارجي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالسادس الهجري\u003c/td\u003e\u003ctd\u003eالخليفة الناصر\u003c/td\u003e\u003ctd\u003eمحاولةٌ لاستعادة قوةٍ عسكرية\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eالخليفة يُعطي الشرعية، والسلطان يُعطي الأمن، ومن فقد أحدهما فقد الآخر.\u003c/p\u003e\u003ccite\u003eمعنى ما تُظهره العلاقة بين الخلافة والسلطنة في القرن الخامس\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eحكم بغداد البويهيون ثم السلاجقة، وكان الخليفة في الحالتين بلا سلطة، لكنه بقي محتفظاً بالشرعية. وفي هذا العهد ازدهر العلم، وأُسست المدارس، وظهر الغزالي، وبدأ الخطر الصليبي، وكانت الدولة منقسمةً في اللحظة التي احتاجت فيها إلى الوحدة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-5","n":"القسم الخامس: الأزمات وسقوط بغداد","ic":"🏴","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-5\" style=\"--c:#3A3A3A\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🏴\u003c/div\u003e\n      \u003ch2\u003eالقسم الخامس: الأزمات وسقوط بغداد\u003c/h2\u003e\n      \u003cp\u003eفي القرنين الرابع والخامس الهجري تراكمت على الخلافة العباسية أزماتٌ لم تكن من نوعٍ واحد: قرامطةٌ يُغيرون على الحجاج ويأخذون الحجر الأسود، وصليبيون يحتلون الساحل، وإسماعيليةٌ تُدبّر الاغتيالات، وخوارزميون ينهبون، ثم مغولٌ يأتون من الشرق بما لم يأتِ به أحد. وقد كانت الدولة في كل أزمةٍ تخرج أضعف، حتى جاءت الضربة الأخيرة سنة ستٍّ وخمسين وستمئة فلم يكن هناك ما يُحتملها.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#qaramita\"\u003eالقرامطة وتهديد الحرمين\u003c/a\u003e\u003ca href=\"#crusades-and-ismailis\"\u003eالصليبيون والإسماعيلية\u003c/a\u003e\u003ca href=\"#mongol-storm\"\u003eالعاصفة المغولية وسقوط بغداد\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"qaramita","n":"القرامطة وتهديد الحرمين","ic":"🕳️","part":"القسم الخامس: الأزمات وسقوط بغداد","h":"\u003carticle class=\"ch3\" id=\"qaramita\" data-toc=\"القرامطة وتهديد الحرمين\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الخامس: الأزمات وسقوط بغداد\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ١ من ٣\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٥\u003ci\u003e.\u003c/i\u003e١\u003c/span\u003e\n            \u003ch3\u003eالقرامطة وتهديد الحرمين\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eفي سنة ستٍّ وثمانين ومئتين ظهرت في العراق حركةٌ إسماعيلية تُسمّى القرامطة، وقد كانت في البداية حركةً فلاحيةً ضد الضرائب، ثم صارت دولةً في البحرين لها جيشٌ وأسواقٌ وعملة. وقد بلغت من القوة أن هاجمت مكة في موسم الحج، وقتلت الحجاج، وأخذت الحجر الأسود، وبقي عندها نحو عشرين سنة.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eبدأت الحركة في منطقة السواد في العراق سنة ستٍّ وثمانين ومئتين، وكانت بقيادة رجلٍ يُسمّى حمدان قرمط، وقد كان في الأصل من دعاة الإسماعيلية، ثم انفصل عنهم وبنى حركته الخاصة. وقد كانت الحركة في بدايتها ذات طابعٍ اجتماعي: أنها كانت تُطالب بالعدل، وتُهاجم الأغنياء، وتُقيم نظاماً مشتركاً في الأموال، وقد كان في هذا ما جعل الفلاحين والفقراء يلتفّون حولها.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم انتقلت الحركة إلى البحرين سنة ستٍّ وثمانين، وأسّست فيها دولةً لها جيشٌ من الفلاحين والبدو، وقد كانت تُغير على قوافل الحجاج والقوافل التجارية، وقد كانت تُرسل السرايا إلى الشام واليمن وعمان. وقد كان في هذا ما جعل طريق الحج العراقي خطراً، وأن كثيراً من الناس توقفوا عن الحج، وأن أعداد الحجاج نقصت نقصاً كبيراً. وقد كان في هذا النقص أثرٌ اقتصادي كبير: أن تجارة الحج والعطور والهدايا التي كانت تمرّ في الطريق العراقي توقفت، وأن مدناً كثيرةً عاشت على الحجاج فقدت موردها، وقد كان في هذا ما زاد في ضعف العراق قبل أن يأتي البويهيون.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سنة سبعٍ وسبعةٍ وثلاثئة — في موسم الحج — هاجم القرامطة مكة، وقد كان الحجاج في المشاعر، فقتلوا عدداً كبيراً منهم، وأخذوا الحجر الأسود من الكعبة، وألقوا القتلى في بئر زمزم، وقد كان في هذه الحادثة ما لم يجرِ في تاريخ الإسلام من قبل: أن يُنتهك الحرم في موسم الحج، وأن يُسرق الحجر الأسود من مكانه. وقد كان في هذا العمل تحدٍّ صريح لكل المسلمين: أن الحركة لم تكتفِ بالسيطرة على الطريق بل دخلت الحرم نفسه، وأنها أرادت أن تقول إنها لا تعترف بشرعية الخلافة ولا بمكانة مكة عند من يُخالفها، وهذا ما جعل الحادثة تُذكر في التاريخ باسم «يوم الحجر».\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا الهجوم صدمةٌ للأمة كلها، ولم تكن صدمةً سياسية فقط بل كانت صدمةً دينية، لأن الحرم كان المكان الذي لا يُقاتل فيه أحد، وكان الناس يحجّون من كل الأمصار مطمئنين. وقد كتب الشعراء في رثاء الحادثة، وقد رُوي أن أبا الطيب المتنبي كتب أبياتاً في ذلك، وقد كان في هذا دليلاً على أن الخلافة لم تكن قادرةً على حماية مقدّسات المسلمين.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بقي الحجر الأسود عند القرامطة نحو عشرين سنة، ثم أعادوه سنة تسعٍ وثلاثين وثلاثئة بعد ضغوطٍ ووساطات، وقيل إنهم أعادوه مقابل مبلغٍ كبير من المال. وقد كان في إعادته دلالةً على أن الحركة كانت تُدرك أن الحجر لا قيمة له عندها، وأنها استعملته أداةً سياسيةً للضغط لا هدفاً في نفسه. وقد كان في هذا التفسير ما يُفسّر أيضاً سرعة انهيارهم بعد ذلك: أن الحركة التي تعيش على النهب لا تبني مؤسسات، وأنها إذا توقفت عن الغزو فقدت موردها، وأن أتباعها تفرّقوا حين لم يجدوا ما يُوزّع عليهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت نهاية القرامطة تدريجية؛ فقد ضعفت دولتهم في البحرين بعد سنوات، ثم انتهت على يد قبيلةٍ من البصرة سنة ستٍّ وستين وثلاثئة. وقد كان في نهايتهم دلالةً على أن الحركة التي تقوم على العنف والنهب لا تدوم، وأن الدولة التي لا تُنتج ولا تُنظّم لا تبقى حتى لو كانت قويةً في الحرب. وقد كان في هذا الدرس ما يتكرّر في التاريخ: أن الحركة الثورية قد تُسقط دولةً ولا تستطيع أن تبني دولة، لأن البناء يحتاج إلى إدارةٍ وقانونٍ وصبرٍ طويل، وهذه أمور لا تُنتجها الحماسة وحدها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه الأزمة درسٌ في معنى الشرعية: أن الخلافة التي عجزت عن حماية الحرمين فقدت كثيراً من هيبتها في القلوب، وأن الناس بدأوا يسألون: ما فائدة خليفةٍ لا يحمي الحجاج؟ وقد كان في هذا السؤال ما سيُضعف الخلافة أكثر في القرون التالية، حتى صارت مجرد رمزٍ لا يُنتظر منه حماية. وقد كان في هذا السؤال ما سيبقى في الوجدان السياسي للمسلمين: أن الحاكم مسؤول عن حماية الناس، وأن فقدان هذه القدرة يُسقط شرعيته حتى لو كان نسبه من أهل البيت أو من قريش، وقد كان في هذا ما يُفسّر قبول الناس لدولٍ جديدة بعد ذلك.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eمن حركةٍ فلاحية إلى دولة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الحركة في بدايتها ذات مطالب اجتماعية واضحة: أن تُخفّف الضرائب، وأن يُعاد توزيع الأرض، وأن يكون المال مشتركاً بين الأتباع. وقد كان في هذا ما جعلها تجذب الفلاحين في منطقة السواد التي كانت تعاني من ضغوط الخراج ومن تعسّف الجباة. وقد كان في هذا الطابع الاجتماعي ما جعل الحركة تنتشر بسرعة في القرى، لأن الفلاح كان يجد فيها ما لم يجده في الدولة: أن يُعترف به، وأن يُخفّف عنه، وأن يُعطى مكاناً في جماعةٍ جديدة، وقد كان في هذا ما يُشبه ما يجري في الحركات الاجتماعية في كل العصور.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم تحوّلت الحركة إلى دولةٍ لها جيشٌ وعملة وأسواق، وقد كان في هذا تحولاً في طبيعتها: أنها لم تبقَ حركةً احتجاجية بل صارت سلطةً تُمارس القهر بدورها، وقد كان في هذا ما يُشبه ما جرى في حركاتٍ كثيرة في التاريخ: أن الحركة التي تبدأ بالعدل قد تنتهي إلى القهر إذا لم تبنِ مؤسسات.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالحجر الأسود عشرين سنة\u003c/h4\u003e\u003cp class=\"ap\"\u003eبقي الحجر الأسود عند القرامطة نحو عشرين سنة، وقد كان في هذا أطول انقطاعٍ للحجر عن مكانه في تاريخ الحرم، وقد كان المسلمون يحجّون في هذه السنوات إلى مكانٍ خالٍ من الحجر، وقد كان في هذا ما زاد في حسّ الفقد عند الناس. وقد كان في هذه السنوات العشرين ما جعل الحج يتغيّر: أن الناس صاروا يحجّون بأعدادٍ أقلّ، وأن بعضهم فضّل طريق مصر والشام على طريق العراق، وقد كان في هذا تحوّلاً في جغرافية الحج استمرّ بعد ذلك قروناً.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أعادوه سنة تسعٍ وثلاثين وثلاثئة، وقد رُوي أنهم أعادوه بأنفسهم في موسم الحج، وأنهم قالوا كلمةً تُنسب إليهم: «أخذناه بأمرٍ وأعدناه بأمر». وقد كان في هذا القول ادّعاءً لعلمٍ غيبي، وقد كان في الوقت نفسه دليلاً على أن الحركة كانت تُدرك أهمية الرمز في الصراع السياسي.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eأثر الحادثة في هيبة الخلافة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الخلافة العباسية في القرن الرابع قد فقدت سلطتها الفعلية، وكانت بغداد تحت حكم البويهيين، وقد كان في هذا ما جعلها عاجزةً عن حماية الحجاج، وقد كان في هذا ما جعل الناس يلومونها على العجز أكثر مما يلومون القرامطة على العدوان. وقد كان في هذا اللوم ما جعل الخلافة تفقد ما تبقّى من هيبتها، وقد كان الناس يقولون: ما فائدة خليفةٍ يجلس في بغداد ولا يستطيع أن يحمي الحجاج؟ وقد كان في هذا السؤال ما سيُستعمل بعد ذلك في الدعاية لكل حركةٍ تُريد أن تُسقط الخلافة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا الدرس ما يتكرّر في تاريخ الدول: أن الشرعية لا تُبنى بالدعاء والنسب فقط، بل بالقدرة على حماية الناس، وأن الدولة التي تفقد هذه القدرة تفقد شرعيتها تدريجياً، حتى لو بقيت مظاهرها قائمةً قروناً. وقد كان في هذا ما يجعلنا نُفرّق بين بقاء الدولة وبقاء شرعيتها: فقد بقيت الخلافة العباسية ثلاثة قرون بعد هذه الحادثة، لكنها لم تستعد هيبتها أبداً، وقد كان في هذا دليلاً على أن الشرعية تُفقد في لحظةٍ واحدة ولا تُستعاد في قرون.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eبداية الحركة\u003c/b\u003e\u003cspan\u003e٢٨٦هـ في السواد بالعراق، بقيادة حمدان قرمط.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالدولة\u003c/b\u003e\u003cspan\u003eأسّست في البحرين، وكان لها جيشٌ وعملة وأسواق.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eهجوم مكة\u003c/b\u003e\u003cspan\u003e٣١٧هـ في موسم الحج، ومقتل حجاج وأخذ الحجر الأسود.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمدة الاحتفاظ بالحجر\u003c/b\u003e\u003cspan\u003eنحو ٢٠ سنة، حتى ٣٣٩هـ.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالنهاية\u003c/b\u003e\u003cspan\u003eضعفت دولتهم ثم انتهت سنة ٣٦٦هـ.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e٢٨٦هـ\u003c/td\u003e\u003ctd\u003eظهور الحركة في السواد\u003c/td\u003e\u003ctd\u003eاحتجاجٌ اجتماعي على الضرائب\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٢٨٦هـ\u003c/td\u003e\u003ctd\u003eالانتقال إلى البحرين\u003c/td\u003e\u003ctd\u003eقيام دولةٍ لها جيشٌ وعملة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٣١٧هـ\u003c/td\u003e\u003ctd\u003eهجوم مكة\u003c/td\u003e\u003ctd\u003eمقتل حجاج وأخذ الحجر الأسود\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٣٣٩هـ\u003c/td\u003e\u003ctd\u003eإعادة الحجر\u003c/td\u003e\u003ctd\u003eبعد وساطاتٍ وضغوط\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٣٦٦هـ\u003c/td\u003e\u003ctd\u003eنهاية الدولة\u003c/td\u003e\u003ctd\u003eضعفٌ داخلي ثم انهيار\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eأخ
