ذناه بأمرٍ وأعدناه بأمر.\u003c/p\u003e\u003ccite\u003eكلمة تُنسب إلى القرامطة عند إعادة الحجر الأسود سنة ٣٣٩هـ\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eبدأت القرامطة حركةً فلاحيةً ضد الضرائب، ثم صارت دولةً في البحرين، ثم هاجمت مكة وأخذت الحجر الأسود عشرين سنة. وقد كان في هذه الحادثة أعظم انتهاكٍ للحرم في تاريخ الإسلام، وكشفت عجز الخلافة عن حماية مقدّسات المسلمين.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"crusades-and-ismailis","n":"الصليبيون والإسماعيلية","ic":"⚔️","part":"القسم الخامس: الأزمات وسقوط بغداد","h":"\u003carticle class=\"ch3\" id=\"crusades-and-ismailis\" data-toc=\"الصليبيون والإسماعيلية\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الخامس: الأزمات وسقوط بغداد\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٢ من ٣\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٥\u003ci\u003e.\u003c/i\u003e٢\u003c/span\u003e\n            \u003ch3\u003eالصليبيون والإسماعيلية\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eفي القرن الخامس الهجري وصلت إلى العالم الإسلامي قوتان جديدتان: قوةٌ خارجية من أوروبا، وقوةٌ داخلية من الإسماعيلية. وقد كانت الأولى تُقاتل بالجيوش، وكانت الثانية تُقاتل بالاغتيال. وقد كان في هذا التزامن ما جعل الشام والعراق في حالة حربٍ دائمة، وأن تنشغل الدولة عن خطرها الأكبر.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eوصلت الحملة الصليبية الأولى سنة خمسٍ وتسعين وأربعمئة، وكانت قد بدأت بدعوة البابا أوربان الثاني في مجمع كليرمون سنة خمسٍ وتسعين، وقد كانت استجابةً لطلبٍ من الإمبراطور البيزنطي الذي كان يخشى الزحف السلجوقي. وقد كان في هذه الحملة ما لم يكن في غيرها: أنها كانت حركةً شعبيةً ودينيةً في الوقت نفسه، وأنها جمعت فرساناً من كل أوروبا. وقد كان في هذه الحملة عنصرٌ شعبي لم يكن في الحملات التالية: أن كثيراً من الفقراء خرجوا معها بلا سلاحٍ ولا مؤونة، وأنهم ماتوا في الطريق، وأنها كانت في نظرهم حجاً مسلحاً، وقد كان في هذا ما جعلها حركةً دينيةً أكثر من كونها عمليةً عسكرية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد استولى الصليبيون على أنطاكية سنة ستٍّ وتسعين بعد حصارٍ طويل، ثم على القدس سنة تسعٍ وتسعين، وقد كان في سقوط القدس مقتلةٌ كبيرة، وقد روى المؤرخون أن الدماء بلغت ركب الخيل، وقد كان في هذا ما أثار الأمة كلها. وقد أسّس الصليبيون دولاً في الرها وأنطاكية وطرابلس والقدس، وقد بقيت نحو قرنين. وقد كان في بقاء هذه الدول قرنين دلالةً على أن المسلمين لم يكونوا قادرين على توحيد قوتهم، وقد كان في هذا ما جعل الشام ساحةً لتجارب سياسية متعددة: إماراتٌ صغيرة، وتحالفاتٌ متغيرة، ومعاهداتٌ مع الصليبيين أنفسهم، وقد كان في هذا ما يُشبه حالة الدول الضعيفة في أي عصر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا الوقت أن الخلافة العباسية كانت تحت حكم السلاجقة، وأن السلاجقة كانوا يُقاتلون في الداخل حركة الإسماعيلية، وكانوا في الوقت نفسه يُحاولون صدّ الصليبيين. وقد كان في هذا التشتت ما جعل الصليبيين يستقرّون سنوات دون أن يُواجهوا جيشاً موحّداً، وقد كان في هذا ما يُفسّر نجاحهم السريع. وقد كان في هذا التشتت ما جعل بعض الأمراء يُحالف الصليبيين ضد أمراء مسلمين آخرين، وقد كان في هذا أشدّ ما نُعي على تلك المرحلة، وقد كان في الوقت نفسه نتيجةً منطقية لغياب سلطةٍ مركزية قادرة على فرض الأمن ومنع التحالفات المنفردة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت الحركة الإسماعيلية قد أسّست دولةً في ألموت سنة ثلاثٍ وثمانين وأربعمئة، وكانت في جبال الديلم، وقد كان لها دعاةٌ في كل الأمصار، وقد كان سلاحها الأول هو الاغتيال. فقد كان الإسماعيليون يُرسلون رجلاً واحداً ليقتل قائداً أو وزيراً، وقد قتلوا نظام الملك سنة خمسٍ وثمانين وأربعمئة، وقتلوا خلفاء ووزراء وأمراء. وقد كان في هذا الاغتيال أثرٌ في إدارة الدولة: أن الوزراء صاروا يخافون من إصلاحٍ يُغضب أحداً، وأن السلاطين صاروا يُحيطون أنفسهم بالحرس، وأن الحكم صار أضعف لأن من يُدير الدولة يُفكّر في نجاته قبل قراراته، وقد كان في هذا خسارةً لا تُقاس.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا السلاح أثرٌ نفسي هائل؛ فقد كان الأمراء والوزراء يخافون على أنفسهم في بيوتهم، وكان السلاجقة يُرسلون حملاتٍ إلى ألموت فلا يستطيعون الوصول إليها لأنها في قمة جبل. وقد كان في هذا ما جعل الإسماعيلية قوةً لا تُقاس بجيشها بل بقدرتها على الإرهاب السياسي. وقد كان في هذا السلاح ما جعل الإسماعيلية تُعوّض ضعفها العسكري، وأن تُصبح طرفاً في كل صراعٍ بين السلاجقة والخلافة، وقد كان في هذا ما يُشبه ما تفعله الجماعات المسلحة في العصور الحديثة: أن القوة الصغيرة المنظمة قد تُربك دولةً كبيرة إذا استهدفت رموزها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا العهد أن ظهرت حركاتٌ تُحاول توحيد الشام لمواجهة الصليبيين. فقد جاء عماد الدين زنكي في الموصل سنة اثنتين وعشرين وخمسمئة، واستولى على الرها سنة أربعٍ وثلاثين، ثم جاء ابنه نور الدين محمود فوحّد الشام، ثم جاء صلاح الدين فوحّد مصر والشام، وقد كان في هذا ما سيُعالج في عصرٍ لاحق، لكنه كان بداية الردّ. وقد كان في هذه الحركات بدايةُ مسارٍ طويل انتهى بتحرير القدس سنة ثلاثٍ وثمانين وخمسمئة، وقد كان في هذا دليلاً على أن الردّ على الخطر الخارجي يحتاج إلى جيلين أو ثلاثة، وأن النجاح لا يأتي من خطبةٍ بل من بناء دولةٍ قادرة على جمع الأطراف.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا العهد أيضاً أن بغداد عاشت اضطراباتٍ طائفيةً كثيرة، وأن الخلافة كانت عاجزةً عن ضبط المدينة، وأن الوزراء كانوا يتنازعون على السلطة، وأن كل وزيرٍ كان يستعين بأحد الأطراف. وقد كان في هذا ما جعل بغداد في القرن السادس مدينةً مضطربةً رغم أنها كانت مركزاً للعلم، وقد كان في هذا تناقضاً بين الازدهار الثقافي والانهيار السياسي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا كله ما جعل الأمة أمام تحدٍّ مزدوج: أن تُواجه خطراً خارجياً يأتي من أوروبا، وخطراً داخلياً يأتي من الجبال. وقد كان في هذا ما جعل الاستجابة بطيئة، وأن تأتي النجاحات من أطرافٍ لا من المركز، وأن تكون الدولة العباسية في بغداد آخر من يُشارك في المعركة، لأنها لم تكن تملك جيشاً. وقد كان في هذا العجز ما جعل بغداد تفقد دورها السياسي قبل أن تفقد وجودها، وقد كان في هذا مفارقة: أن المدينة التي كانت مركز العالم صارت في القرن السادس مدينةً تُدار من خارجها، وأن اسمها بقي في الخطبة والنقود بعد أن خرجت السلطة منها تماماً.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالحملة الأولى وسقوط القدس\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الحملة الأولى قد سارت على طريق البرّ عبر الأناضول، وقد هزمت جيوش السلاجقة في معارك عدة، وقد كان في هذا دليلاً على أن الدولة كانت منقسمة، لأن جيوش السلاجقة كانت تُقاتل في أطرافٍ متعددة ولم تكن قادرةً على جمع قوتها في مكانٍ واحد. وقد كان في هذا الانقسام ما جعل الجيوش السلجوقية تُقاتل في ثلاث جبهات في وقتٍ واحد: في الشام أمام الصليبيين، وفي الجبال أمام الإسماعيلية، وفي الشرق أمام الأتراك الآخرين، وقد كان في هذا ما يجعل أي انتصارٍ موضعياً بلا أثرٍ استراتيجي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد سقطت القدس سنة تسعٍ وتسعين بعد حصارٍ قصير، وقد كان في سقوطها مقتلةٌ كبيرة، وقد روى المؤرخون المسلمون والمسيحيون أرقاماً مختلفة، لكنهم اتفقوا على أن الدماء كانت كثيرة. وقد كان في هذا ما جعل القدس رمزاً في الوجدان الإسلامي، وأن تُكتب فيها قصائد كثيرة بعد ذلك.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eألموت والاغتيال السياسي\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت ألموت قلعةً في جبال الديلم، وقد استولى عليها حسن الصباح سنة ثلاثٍ وثمانين وأربعمئة، وقد كانت في قمة جبلٍ يصعب الوصول إليه، وقد بُنيت فيها حدائق ومكتبة، وقد كان فيها دعاةٌ يُعلّمون العقيدة الإسماعيلية. وقد كان في موقع ألموت ما جعلها حصناً طبيعياً: أنها في قمة جبلٍ يبلغ ارتفاعه نحو ألفَي متر، وأن الطريق إليها ضيق، وأن الجيش لا يستطيع أن يحاصرها بسهولة، وقد كان في هذا ما جعلها تصمد قرنين أمام كل حملات السلاجقة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان سلاحهم الأول هو الاغتيال؛ فقد كانوا يُرسلون «الفدائيين» وهم شبابٌ يُدرّبون على القتل، وقد قتلوا نظام الملك سنة خمسٍ وثمانين، وقتلوا عدداً من الأمراء والوزراء. وقد كان في هذا السلاح ما جعل كلمة «الحشاشين» تنتشر في اللغات الأوروبية بعد ذلك، وقد كان في هذا دليلاً على أن الإرهاب السياسي ليس جديداً.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eلماذا لم تتوحّد الأمة؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم تتوحّد الأمة لعدة أسباب: أن الخلافة كانت بلا جيش، وأن السلاجقة كانوا يُقاتلون في الداخل، وأن الشام كانت مقسومةً بين إماراتٍ صغيرة، وأن مصر كانت في يد الفاطميين الذين كانوا يُنافسون العباسيين، وأن كل طرفٍ كان يخشى الآخر أكثر مما يخشى الصليبيين. وقد كان في هذه الأسباب ما يُفسّر لماذا جاء التحرير من مصر والشام لا من بغداد: أن القاهرة كانت مركز دولةٍ قوية، وأن دمشق وحلب كانتا أقرب إلى ساحة المعركة، وأن بغداد كانت بعيدةً وضعيفة، وقد كان في هذا ما جعل مركز الثقل ينتقل غرباً.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا الدرس ما يتكرّر في التاريخ: أن الخطر الخارجي لا يُوحّد الأمة إذا كانت الانقسامات الداخلية أعمق من الخوف الخارجي، وأن الوحدة تحتاج إلى قائدٍ يملك قوةً وشرعية، وأن هذا القائد لا يظهر إلا بعد أن تنضج تجربةٌ طويلة من الفشل. وقد كان في هذا الانتظار ما يُشبه قانوناً في تاريخ الأزمات: أن الأمة لا تُنتج قائداً موحّداً إلا بعد أن تجرّب الفشل مراتٍ كثيرة، وأن القائد الذي ينجح هو الذي يجمع بين الشرعية والقوة، وأن من يملك واحدةً بلا الأخرى لا يستطيع أن يُوحّد.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالحملة الأولى\u003c/b\u003e\u003cspan\u003e٤٩٥هـ، ودعا إليها البابا أوربان الثاني.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسقوط القدس\u003c/b\u003e\u003cspan\u003e٤٩٩هـ، ومقتلةٌ كبيرة، وبقيت في يد الصليبيين ٨٨ سنة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eألموت\u003c/b\u003e\u003cspan\u003eقلعة الإسماعيلية سنة ٤٨٣هـ، ومركز الاغتيال السياسي.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eنظام الملك\u003c/b\u003e\u003cspan\u003eوزير سلجوقي قُتل سنة ٤٨٥هـ على يد الإسماعيلية.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالردّ\u003c/b\u003e\u003cspan\u003eزنكي ثم نور الدين ثم صلاح الدين في القرن السادس.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالنتيجة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e٤٨٣هـ\u003c/td\u003e\u003ctd\u003eاستيلاء الإسماعيلية على ألموت\u003c/td\u003e\u003ctd\u003eقوةٌ داخلية بالاغتيال\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٤٨٥هـ\u003c/td\u003e\u003ctd\u003eمقتل نظام الملك\u003c/td\u003e\u003ctd\u003eضعفٌ في إدارة السلاجقة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٤٩٥هـ\u003c/td\u003e\u003ctd\u003eالحملة الصليبية الأولى\u003c/td\u003e\u003ctd\u003eدخول قوةٍ أوروبية إلى الشام\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٤٩٦هـ\u003c/td\u003e\u003ctd\u003eسقوط أنطاكية\u003c/td\u003e\u003ctd\u003eقيام إمارةٍ صليبية في الشمال\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٤٩٩هـ\u003c/td\u003e\u003ctd\u003eسقوط القدس\u003c/td\u003e\u003ctd\u003eقيام مملكة القدس الصليبية\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eالعدوّ الذي في الداخل يُشغل عن العدوّ الذي في الخارج.\u003c/p\u003e\u003ccite\u003eمعنى ما تُظهره أزمة القرن الخامس بين الصليبيين والإسماعيلية\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eفي قرنٍ واحد واجهت الأمة خطرين: صليبياً من أوروبا، وإسماعيلياً من الجبال. وقد كان الخطران يعملان بأسلوبين مختلفين: الجيوش والاغتيال. وقد كانت الخلافة عاجزةً، والسلاجقة مشغولين، والشام مقسومة، فاستقرّ الصليبيون قرنين، ولم يأتِ الردّ إلا من أطرافٍ لا من المركز.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"mongol-storm","n":"العاصفة المغولية وسقوط بغداد","ic":"🔥","part":"القسم الخامس: الأزمات وسقوط بغداد","h":"\u003carticle class=\"ch3\" id=\"mongol-storm\" data-toc=\"العاصفة المغولية وسقوط بغداد\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الخامس: الأزمات وسقوط بغداد\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٣ من ٣\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٥\u003ci\u003e.\u003c/i\u003e٣\u003c/span\u003e\n            \u003ch3\u003eالعاصفة المغولية وسقوط بغداد\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eفي سنة ستٍّ وعشرين وستمئة ظهر المغول على حدود الدولة الخوارزمية، وفي ثلاثين سنة كانوا قد أسقطوا خوارزم وبخارى وسمرقند وخراسان وأذربيجان وبغداد. وقد كانوا قبائل رُحّل بلا مدنٍ ولا صناعة، لكنهم هزموا دولاً عمرها قرون، لأنهم كانوا موحّدين وكانت الدولة الإسلامية منقسمة.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان المغول قبائل رُحّل في منغوليا، وكانوا يعيشون على الرعي والصيد والغزو، وقد وحّدهم جنكيز خان سنة اثنتين وستمئة، وقد بنى جيشاً منظماً مقسوماً على عشراتٍ ومئاتٍ وآلاف، وقد كان في هذا التنظيم ما جعل الجيش المغولي أسرع وأكثر انضباطاً من جيوش الدول المستقرة. وقد كان في هذا التنظيم ما جعل الجيش المغولي قادراً على التحرك في مساحاتٍ واسعة بسرعةٍ عالية، وأن يُقاتل في الشتاء والصيف، وأن يُطبق على المدن من جهاتٍ متعددة، وقد كان في هذا ما يُفسّر سرعة سقوط المدن الكبرى أمامه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سنة خمسَ عشرة وستمئة بدأ جنكيز خان حملته على الدولة الخوارزمية، وقد كان السبب المباشر في ذلك أن والي مدينة «أوترار» قتل تجاراً مغولاً، وأن السلطان محمد الخوارزمي رفض أن يُسلّم الوالي. وقد كان في هذا الخطأ ما جعل دولةً كبيرةً تُواجه جيشاً لا تعرفه، وقد كان في هذا درسٌ في السياسة الخارجية: أن الاستهانة بقوةٍ جديدة قد تُكلّف الدولة وجودها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد استولى المغول على بخارى وسمرقند سنة سبعٍ وعشرين وستمئة، وقد كان في سقوطهما صدمةٌ كبيرة، لأن سمرقند كانت من أعظم مدن العلم في الإسلام، وقد قُتل فيها عددٌ كبير من العلماء، وأُحرقت مكتباتها. ثم استولوا على خراسان، وهدموا مرو ونيسابور وهراة، وقد قُتل في هذه المدن من الناس ما لم يُحصَ. وقد كان في هذه المذابح ما جعل خراسان تفقد سكانها وعلماءها، وقد كان في هذا خسارةً لا تُعوّض، لأن خراسان كانت من أهم مراكز العلم في الإسلام، وقد كان في هذا ما جعل الشرق الإسلامي يفقد مكانته الثقافية لصالح الغرب الإسلامي ومصر.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم جاء هولاكو سنة خمسٍ وخمسين وستمئة، وكان حفيد جنكيز خان، وقد أُرسل إلى الغرب بأمر الخان الأكبر، وقد كان هدفه الأول الإسماعيلية في ألموت، وقد استولى على قلاعهم سنة أربعٍ وخمسين، ثم توجّه إلى بغداد. وقد كان في هذا التحوّل دلالةً على أن الإسماعيلية التي قاومت السلاجقة قرنين لم تستطع أن تقاوم المغول شهراً. وقد كان في هذا التحول دلالةً على أن الحصون لا تحمي أصحابها إذا لم يكن هناك من يدافع عنها، وأن الإسماعيلية التي قاومت السلاجقة بالاغتيال لم تستطع أن تُقاوم جيشاً لا يخاف من الاغتيال لأنه لا يعتمد على قادةٍ محدودين.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أرسل هولاكو إلى الخليفة المستعصم يطلب منه أن يهدم أسوار بغداد، وأن يُرسل جيشاً يُشارك في حملته، وأن يأتي بنفسه أو يُرسل وزيره. وقد كان الخليفة قد أرسل هدايا ورسائل، وقد كان في جوابه ما يدل على أنه لم يُدرك حجم الخطر، وقد رُوي أنه قال كلمةً تُنسب إليه: «إن بغداد تُغضب الله على من يُريدها»، وقد كان في هذا الكلام اعتماداً على الحماية الإلهية بدلاً من الاستعداد العسكري.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد حاصر المغول بغداد في محرم سنة ستٍّ وخمسين وستمئة، وقد كان معهم خبراء من الصين وفارس في نصب المجانيق، وقد كانوا يرمون المدينة بالحجارة والنار، وقد كان الجيش العباسي قليلاً، وقد كان الوزير مؤيد الدين ابن العلقمي على تواصلٍ مع المغول، وقد كان في هذا الخيانة التي جعلت الدفاع مستحيلاً. وقد كان في هذه الخيانة ما جعل الدفاع مستحيلاً، لأن الوزير كان يعرف أسرار المدينة ومواضع الضعف فيها، وقد كان في هذا درسٌ في أمن الدولة: أن الخطر الداخلي قد يكون أشدّ من الخطر الخارجي، وأن من يُدير المال والإدارة يستطيع أن يُسقط مدينةً بلا جيش.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد سقطت بغداد في صفر سنة ستٍّ وخمسين، ودخلها المغول، وقتلوا الخليفة، وقتلوا من أهل المدينة عدداً كبيراً، وقد قدّر بعض المؤرخين القتلى بمئات الآلاف، وقد أُحرقت المساجد والمدارس والمكتبات، وقد رُوي أن ماء دجلة اسودّ من حبر الكتب. وقد كان في هذه الحادثة نهاية الخلافة العباسية في بغداد بعد نحو خمسة قرون. وقد كان في هذه النهاية ما جعل بغداد تبقى في الوجدان رمزاً للفقد، وقد كتب المؤرخون عنها صفحاتٍ كثيرة، وقد رثاها الشعراء، وقد صارت الحادثة نقطةً فاصلة في التاريخ الإسلامي: ما قبلها وما بعدها، وقد كان في هذا دليلاً على أن المدن قد تكون أكبر من عمرها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في سقوط بغداد درسٌ في معنى القوة: أن الدولة التي تعتمد على رمزٍ بلا جيشٍ لا تحمي رمزها، وأن الشرعية التي لا تُسندها قوةٌ تصير عاجزةً عن حماية الناس. وقد كان في هذا أيضاً درسٌ في التنظيم: أن المغول كانوا أقلّ عدداً من أهل بغداد، لكنهم كانوا موحّدين، وكانت المدينة منقسمةً بين وزيرٍ يخون وخليفةٍ لا يُدرك، وجيشٍ لا يكفي. وقد كان في هذا الدرس ما يُلخّص كل ما سبق: أن الدولة التي تُهمل جيشها وتُهمل وحدتها الداخلية لا تحميها أسوارها، وأن الحضارة التي لا تحميها قوةٌ قد تُحرق في أسبوعين، وأن ما بُني في خمسة قرون قد يُدمّر في أيام.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eمن أوترار إلى بغداد\u003c/h4\u003e\u003cp class=\"ap\"\u003eبدأت الحملة المغولية بسبب حادثةٍ صغيرة: أن والي أوترار قتل تجاراً مغولاً، وأن السلطان الخوارزمي رفض تسليمه. وقد كان في هذا الخطأ ما جعل دولةً كبيرةً تُواجه جيشاً منظماً لا تعرفه، وقد كان في هذا درساً في تقدير القوى: أن الدولة لا تُقاس بعدد سكانها بل بقدرتها على التنظيم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي ثلاثين سنة انتقل المغول من حدود الصين إلى العراق، وقد كان في هذا أسرع توسّعٍ عسكري في التاريخ في ذلك العصر، وقد كان في هذا ما يجعلنا نُعيد النظر في فكرة أن الحضارة تحمي أصحابها: فقد كانت الدولة الإسلامية في أوج ثقافتها، ومع ذلك سقطت أمام قبائل بلا مدن.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالخيانة والدفاع\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الوزير مؤيد الدين ابن العلقمي من كبار وزراء الدولة، وقد اتُّهم بالتواصل مع المغول وبتحريضهم على الخلافة، وقد كان في هذا الاتهام خلافٌ بين المؤرخين: فمنهم من رآه خائناً، ومنهم من رآه رجلاً حاول أن يُنقذ المدينة بالتفاوض فلم يستطع. وقد كان في هذا الخلاف ما يُبيّن أن التاريخ لا يُصدر أحكامه بسهولة: أن الرجل قد يُتّهم بالخيانة لأنه تفاوض، وقد يُتّهم بالتفاوض لأنه رأى أن المقاومة مستحيلة، وقد كان في هذا ما يجعل الحكم على الأشخاص في لحظات الانهيار أمراً صعباً.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الدفاع عن بغداد ضعفٌ واضح: أن الجيش كان قليلاً، وأن الأسوار لم تكن في حالة جيدة، وأن الأهالي لم يكونوا مُدرّبين، وأن القادة لم يكونوا متفقين. وقد كان في هذا كله ما جعل الحصار لا يستمر أكثر من أسبوعين، وقد كان في هذا دليلاً على أن المدينة كانت قد فقدت قدرتها على الدفاع قبل أن يأتي المغول.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eما بعد السقوط\u003c/h4\u003e\u003cp class=\"ap\"\u003eبعد سقوط بغداد انتقل مركز العالم الإسلامي إلى القاهرة، حيث كان المماليك قد أقاموا دولتهم، وقد انتصر المماليك على المغول في عين جالوت سنة تسعٍ وخمسين وستمئة، وقد كان في هذا أول هزيمةٍ للمغول في التاريخ، وقد كان في هذا ما جعل القاهرة مركزاً جديداً للخلافة بعد أن أقام المماليك خليفةً عباسياً فيها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا الانتقال دلالةً على أن الحضارة لا تموت بسقوط مدينة، وأن العلم الذي كان في بغداد كان قد انتقل إلى دمشق والقاهرة ومراكش وطليطلة، وأن الكتب التي أُحرقت في بغداد كانت لها نسخٌ في الأمصار. وقد كان في هذا ما يُبيّن أن تعدد المراكز هو الضمانة الحقيقية لبقاء الحضارة.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eجنكيز خان\u003c/b\u003e\u003cspan\u003eوحّد المغول سنة ٦٠٢هـ، وبنى جيشاً منظماً.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأوترار\u003c/b\u003e\u003cspan\u003eالحادثة التي بدأت بها الحملة على الدولة الخوارزمية.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eهولاكو\u003c/b\u003e\u003cspan\u003eقاد الحملة على الغرب، وأسقط ألموت ثم بغداد.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسقوط بغداد\u003c/b\u003e\u003cspan\u003eصفر ٦٥٦هـ، ومقتل المستعصم وحرق المكتبات.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eعين جالوت\u003c/b\u003e\u003cspan\u003e٦٥٩هـ، أول هزيمةٍ للمغول على يد المماليك.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالنتيجة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e٦٠٢هـ\u003c/td\u003e\u003ctd\u003eتوحيد المغول\u003c/td\u003e\u003ctd\u003eقيام جيشٍ منظم وسريع\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٦٢٧هـ\u003c/td\u003e\u003ctd\u003eسقوط بخارى وسمرقند\u003c/td\u003e\u003ctd\u003eضياع مركز العلم في الشرق\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٦٥٤هـ\u003c/td\u003e\u003ctd\u003eسقوط ألموت\u003c/td\u003e\u003ctd\u003eنهاية الإسماعيلية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٦٥٦هـ\u003c/td\u003e\u003ctd\u003eسقوط بغداد\u003c/td\u003e\u003ctd\u003eنهاية الخلافة العباسية فيها\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٦٥٩هـ\u003c/td\u003e\u003ctd\u003eعين جالوت\u003c/td\u003e\u003ctd\u003eإيقاف الزحف المغولي\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eإنّ بغداد تُغضب الله على من يُريدها.\u003c/p\u003e\u003ccite\u003eكلمة تُنسب إلى المستعصم في جوابه لهولاكو\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eفي ثلاثين سنة أسقط المغول دولةً عمرها قرون، وكان سقوط بغداد سنة ستٍّ وخمسين وستمئة أعظم صدمةٍ في تاريخ المسلمين. وقد كان السبب في هذا السقوط انقساماً داخلياً وجيشاً صغيراً ووزيراً مُتواطئاً، لا قوة المغول وحدها.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-6","n":"القسم السادس: إرث بغداد","ic":"🏛️","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-6\" style=\"--c:#3A3A3A\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🏛️\u003c/div\u003e\n      \u003ch2\u003eالقسم السادس: إرث بغداد\u003c/h2\u003e\n      \u003cp\u003eسقطت بغداد سنة ستٍّ وخمسين وستمئة، ولم يسقط ما بُنِي فيها. فقد بقي الجبر والطب والبصريات والفلسفة، وبقيت الكتب التي نُسخت في أسواقها، وبقيت اللغة التي صارت لغة العلم في العالم خمسة قرون. وقد كان في هذا الإرث ما يجعل الحكم على الدولة العباسية حكماً مركّباً: أنها سقطت سياسياً، وبقيت حضارياً.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#waraqin\"\u003eالوراقة والكتب\u003c/a\u003e\u003ca href=\"#adab\"\u003eالأدب والشعر في العصر العباسي\u003c/a\u003e\u003ca href=\"#civilization\"\u003eأثر بغداد في الحضارة الإنسانية\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"waraqin","n":"الوراقة والكتب","ic":"📖","part":"القسم السادس: إرث بغداد","h":"\u003carticle class=\"ch3\" id=\"waraqin\" data-toc=\"الوراقة والكتب\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم السادس: إرث بغداد\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ١ من ٣\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٦\u003ci\u003e.\u003c/i\u003e١\u003c/span\u003e\n            \u003ch3\u003eالوراقة والكتب\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eلم تكن الحضارة العباسية حضارة قصورٍ ومساجد فقط، بل كانت حضارة كتب. فقد نشأت في بغداد مهنة «الورّاق»، وكان له سوقٌ كامل، وكانت الكتب تُنسخ وتُجلّد وتُصحّح وتُباع، وكان في المدينة مكتباتٌ عامة وخاصة. وقد كان في هذا ما جعل المعرفة قابلةً للانتشار بشكلٍ لم تعرفه الحضارات القديمة.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان الورّاق في العصر العباسي أكثر من ناسخ؛ كان يُشبه الناشر والمحرر معاً. فقد كان يستنسخ الكتاب، ويُصحّح نسخته على نسخة المؤلف إن أمكن، ويُجلّدها، ويُعرضها في دكانه، وكان في بعض الأحيان يُؤجّر النسخ لمن يريد القراءة فقط. وقد كان في بغداد سوقٌ يُسمّى «سوق الورّاقين» فيه مئات الدكاكين، وكان في الكرخ سوقٌ آخر للكتب، وكان الناس يقصدونهما كما يقصدون أسواق الطعام والقماش.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا السوق حركةٌ ثقافية كاملة: أن الكاتب يُلقي كتابه في المسجد أو في مجلسه، فيسمعه الورّاقون، ثم ينسخونه، ثم يُبيعونه، وقد كان في هذا ما جعل الكتاب ينتشر في أشهرٍ قليلة. وقد كان في هذا ما جعل المؤلفين يكتبون للناس لا للخزائن، وأن يُراعوا الوضوح والترتيب، وقد كان في هذا فرقاً كبيراً بين الحضارة الإسلامية والحضارات التي حصرت العلم في المعابد والقصور.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت المكتبات في العصر العباسي نوعين: مكتبات عامة مرتبطة بالمساجد والمدارس، ومكتبات خاصة عند الخلفاء والوزراء والأغنياء. وقد كان من أشهر المكتبات العامة مكتبة بيت الحكمة، ومكتبة المدرسة النظامية، ومكتبات المساجد الكبرى مثل جامع المنصور وجامع القصر، وقد كانت هذه المكتبات تُعير الكتب أحياناً، وكان فيها فهارس وقوائم، وكان فيها موظفون يُسمّون «خُزّان الكتب».\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت المكتبات الخاصة أعجب من ذلك؛ فقد كان بعض الوزراء يجمعون آلاف المجلدات، وكان بعضهم يبني مبنىً خاصاً للكتب، وكان في بعض المكتبات فهارس مرتبة بالحروف، وقد رُوي عن مكتبة الوزير ابن الفرات أنها كانت تحتاج إلى عددٍ كبير من الحمالين لنقلها، وهذا رقمٌ يدل على حجمها لا على دقته. وقد كان في هذه المكتبات كتبٌ في كل فن: في الفقه والطب والفلك والأدب والجغرافيا والمنطق.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا العهد أن انتشرت صناعة الورق، وكانت قد انتقلت من الصين إلى سمرقند سنة إحدى وثلاثين ومئة، ثم إلى بغداد في عهد البرامكة، وقد كان الورق أرخص من الرقّ بكثير، وكان في هذا ما جعل الكتب في متناول عددٍ أكبر من الناس. وقد أُنشئت في بغداد مصانع للورق، وكان الورق البغدادي من أجود أنواع الورق في العالم، وكان يُصدَّر إلى الأمصار.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا كله ما جعل عدد الكتب في العالم الإسلامي أكبر من عددها في أوروبا بأضعاف، وقد قدّر بعض المؤرخين أن مكتبات الأندلس وحدها كانت تحتوي على مئات الآلاف من المجلدات، وقد كان في هذا ما جعل المعرفة الإسلامية تُصبح تراثاً إنسانياً لا ملكاً لطائفةٍ أو دولة، وقد كان في هذا أيضاً ما جعل العلماء ينتقلون بين الأمصار ويجدون في كل مدينةٍ كتباً لم يروها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في سقوط بغداد سنة ستٍّ وخمسين وستمئة أن أُحرقت مكتباتٌ كثيرة، وقد رُوي أن ماء دجلة اسودّ من حبر الكتب، وقد كان في هذا خسارةً لا تُعوّض. لكن المعرفة لم تذهب كلها، لأن نسخاً كثيرة كانت في دمشق والقاهرة وقرطبة وسمرقند وفاس، وقد كان في هذا دليلاً على أن تعدد المراكز يحمي التراث من الضياع، وأن الحضارة التي تُوزّع نفسها على مدنٍ كثيرة لا تموت بموت مدينة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا التراث أثرٌ في أوروبا بعد ذلك؛ فقد انتقلت الكتب العربية إلى أوروبا عن طريق صقلية والأندلس والحروب الصليبية، وتُرجمت في طليطلة وغيرها إلى اللاتينية، وكانت هذه الكتب هي التي أعادت إلى أوروبا أرسطو وبطليموس وجالينوس، ومعهم الجبر والكيمياء والبصريات. وقد كان في هذا ما يُبيّن أن الحضارة لا تموت إذا بقيت كتبها، وأن الكتاب هو أنجح وسيلةٍ عرفها الإنسان لحفظ تجربته عبر القرون.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالورّاق: ناشر العصر\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الورّاق يجمع بين مهنتين: النسخ والبيع. وكان في دكانه نسخٌ من كتبٍ كثيرة، وكان ينسخ ما يُطلب منه، وكان يُصحّح النسخ على الأصل إن أمكن، وكان في بعض الأحيان يُؤلّف أو يُختصر أو يُرتّب. وقد كان بعض الورّاقين علماء، وكان بعضهم مجرد نُسّاخ، وقد كان في هذا تفاوتٌ كبير في المكانة والكسب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه المهنة خطرٌ أيضاً: أن النسخ قد يقع فيه الخطأ والتحريف، وأن بعض الورّاقين كانوا يُدخلون في النص ما ليس منه، أو يُغيّرون الأسماء والأسانيد. وقد كان في هذا ما جعل العلماء يُدقّقون في الأسانيد والنسخ، وأن يكتبوا «سمعتُ» و«قرأتُ» و«أخبرنا» و«قُرئ على فلان وأنا أسمع»، وقد كان في هذا بداية علم التحقيق عند المسلمين، وهو علمٌ لا يقوم به إلا من عرف قيمة الدقة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالورق وتغيّر تاريخ المعرفة\u003c/h4\u003e\u003cp class=\"ap\"\u003eقبل الورق كان الناس يكتبون على الرقّ والبردي، وكان الرقّ غالياً لأنه من جلد الحيوان، وكان الكتاب الواحد يحتاج إلى مئات الجلود، وكان في هذا ما جعل الكتب قليلةً وغالية، وأن تكون المكتبات محصورة في القصور والمعابد، وأن يكون العلم ميراثاً لطبقةٍ دون أخرى.\u003c/p\u003e\u003cp class=\"ap\"\u003eولمّا انتقل الورق إلى بغداد صار الكتاب أرخص، وصار في متناول الطلاب والتجار والعلماء، وقد كان في هذا ما جعل عدد الكتب يتضاعف، وأن تظهر حرفة الوراقة، وأن يصير في بغداد سوقٌ للكتب. وقد كان في هذا تحولاً في تاريخ المعرفة يشبه ما حدث في أوروبا بعد اختراع الطباعة، لأن كلاهما جعل نسخ المعرفة أرخص وأسرع، فتغيّر شكل المجتمع.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالمكتبات بين العامة والخاصة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت المكتبات العامة تُلحق بالمساجد والمدارس، وكان فيها كتبٌ موقوفة، وكان الطالب يستطيع أن يقرأ فيها ويستعير منها أحياناً، وكان بعضها مفتوحاً لكل من يدخل. وقد كان في هذا ما جعل العلم متاحاً لمن لا يملك ثمن الكتاب، وقد كان في هذا فرقاً عن أوروبا في العصور الوسطى حيث كانت الكتب محفوظةً في الأديرة ولا يصل إليها إلا رجال الدين.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت المكتبات الخاصة أعظم حجماً، وكان بعض الأغنياء يتنافسون في جمع الكتب، وكان في هذا ما جعل نسخاً كثيرة من الكتب تُحفظ في أماكن متعددة. وقد كان في سقوط بغداد أن ضاعت مكتبات كثيرة، لكن المكتبات الخاصة في دمشق والقاهرة حفظت كثيراً من التراث، وقد كان في هذا ما جعل النهضة العلمية ممكنةً بعد ذلك، لأن من يريد أن يبني يحتاج إلى ما بُني قبله.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسوق الورّاقين\u003c/b\u003e\u003cspan\u003eسوق في بغداد فيه مئات الدكاكين للنسخ والبيع.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالورق\u003c/b\u003e\u003cspan\u003eانتقل من الصين إلى سمرقند سنة ١٣١هـ ثم إلى بغداد.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأثر الورق\u003c/b\u003e\u003cspan\u003eأرخص من الرقّ، فكثرت الكتب وانتشرت المكتبات.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمكتبات\u003c/b\u003e\u003cspan\u003eعامة في المساجد والمدارس، وخاصة عند الخلفاء والوزراء.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسنة ٦٥٦هـ\u003c/b\u003e\u003cspan\u003eأُحرقت مكتبات بغداد، لكن نسخاً كثيرة بقيت في الأمصار.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالعنصر\u003c/th\u003e\u003cth\u003eقبل الورق\u003c/th\u003e\u003cth\u003eبعد الورق\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eمادة الكتابة\u003c/td\u003e\u003ctd\u003eالرقّ والبردي\u003c/td\u003e\u003ctd\u003eالورق المصنوع محلياً\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالسعر\u003c/td\u003e\u003ctd\u003eغالٍ جداً\u003c/td\u003e\u003ctd\u003eفي متناول الطلاب\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eعدد الكتب\u003c/td\u003e\u003ctd\u003eقليل\u003c/td\u003e\u003ctd\u003eكثير ومنتشر\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمكتبات\u003c/td\u003e\u003ctd\u003eقصور ومعابد\u003c/td\u003e\u003ctd\u003eمساجد ومدارس وأسواق\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالحرفة\u003c/td\u003e\u003ctd\u003eنسخٌ فردي\u003c/td\u003e\u003ctd\u003eوراقة ونشرٌ وتجليد\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eالكتب هي الذاكرة التي لا تموت بموت أصحابها.\u003c/p\u003e\u003ccite\u003eمعنى ما تُظهره حركة الوراقة في الحضارة العباسية\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eلم تكن الحضارة العباسية حضارة بناءٍ فقط، بل حضارة ورقٍ وحبر. فقد صار الكتاب سلعةً رخيصة، ونشأت مهنة الوراقة، وكثرت المكتبات، وانتشر العلم بين من لا يملكون. وقد حمى هذا التراث من الضياع حين سقطت بغداد، لأن النسخ كانت في أمصارٍ كثيرة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"adab","n":"الأدب والشعر في العصر العباسي","ic":"🖋️","part":"القسم السادس: إرث بغداد","h":"\u003carticle class=\"ch3\" id=\"adab\" data-toc=\"الأدب والشعر في العصر العباسي\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم السادس: إرث بغداد\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٢ من ٣\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٦\u003ci\u003e.\u003c/i\u003e٢\u003c/span\u003e\n            \u003ch3\u003eالأدب والشعر في العصر العباسي\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eتغيّر الشعر في العصر العباسي تغيّراً جذرياً: من شعرٍ يُقال في البادية عن الحرب والفراق، إلى شعرٍ يُقال في المدينة عن الحب والخمر والفلسفة والمدن. وقد ظهر في هذا العهد شعراءٌ كبار مثل أبي نواس والمتنبي وأبي تمام والبحتري، وظهر النثر الفني على يد ابن المقفع والجاحظ، ووُضعت علوم اللغة كلها.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان الشعر في العصر الأموي لا يزال قريباً من البادية في موضوعه ولغته، وكان أكثر ما يُقال فيه في المدح والهجاء والرثاء والفخر. وفي العصر العباسي تغيّر هذا: فقد صارت بغداد مدينةً كبيرة فيها أسواق وقصور وحمّامات ومجالس خمر، وصار الشاعر ابن المدينة لا ابن البادية، وقد كان في هذا ما غيّر الموضوعات والألفاظ والصور. وقد كان في هذا التحول ما جعل الشعر العباسي أكثر تنوعاً من الشعر الأموي، وأكثر تعبيراً عن الفرد، لأن الشاعر في المدينة صار يُخاطب نفسه وقارئه أكثر مما يُخاطب قبيلته، وقد كان في هذا بداية الشعر الذاتي في العربية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان بشار بن برد من أوائل من كتبوا الشعر الجديد، وقد كان أعمى، وقد كان يُجيد الغزل والهجاء، وقد قُتل سنة سبعٍ وستين ومئة في عهد المهدي بسبب شعره. وقد كان أبو نواس أشهر شعراء الخمر في العربية، وقد كان يُجيد الغزل أيضاً، وقد تاب في آخر حياته وكتب شعراً في الزهد، وقد كان في شعره ما يجمع بين المجون والندم. وقد كان في شعره ما جعل النقاد يختلفون فيه: فمنهم من رآه مجدداً صادقاً في تصوير حياته، ومنهم من رآه ماجناً يُفسد الذوق، وقد كان الخلاف نفسه دليلاً على أن الشعر صار مسألةً فكرية لا مجرد صنعة لفظية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان أبو تمام من أعظم من جدّد في الصور الشعرية، وقد كان يُكثّر من الاستعارات والبديع، وقد كان في شعره ما جعل بعض النقاد يقولون إنه يُغرّد خارج السرب. وقد كان البحتري في المقابل أكثر فصاحةً وأقرب إلى الأسلوب القديم، وقد كان في شعره وصفٌ للقصور والبساتين والمعارك، وقد كان مدّاحاً للخلفاء والوزراء. وقد كان في هذا الاختلاف بين الشاعرين دلالةً على أن العصر كان يتسع لأكثر من ذوق، وأن النقد الأدبي صار علماً له قواعد، وقد كان في هذا ما جعل العربية تُنتج نقداً أدبياً قبل أن تُنتج كثير من اللغات نقداً لها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان المتنبي أعظم شعراء العربية في نظر كثير من النقاد، وقد عاش في القرن الرابع الهجري، وقد كان في شعره فخرٌ بالنفس وحكمةٌ وتجربةٌ سياسية عميقة. وقد كان يتنقّل بين بلاطات الأمراء، وقد كان في شعره ما جعله يُقال إلى اليوم، وقد كان في شخصيته ما جعل له أعداءً كثيرين، وقد قُتل في الطريق سنة أربعٍ وخمسين وثلاثئة. وقد كان في شعره ما جعله يُقال في كل عصر: أن الفخر بالنفس والحكمة والتجربة أمورٌ لا تتغير بتغير الزمان، وقد كان في هذا ما جعل المتنبي أكثر شعراء العربية اقتباساً في الحياة اليومية، حتى صارت أبياته أمثالاً يتكلم بها الناس.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في النثر تغيّرٌ أكبر. فقد ترجم ابن المقفع «كليلة ودمنة» من الفارسية إلى العربية في القرن الثاني، وقد كان في أسلوبه ما جعله أساساً للنثر العربي: أن يكون واضحاً منظماً مُحكماً، وأن يكون في خدمة المعنى لا الزخرفة. وقد كان في كتابه حكاياتٌ على ألسنة الحيوان فيها نقدٌ سياسي واجتماعي، وقد كان في هذا أسلوباً جديداً في النثر العربي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان الجاحظ أعظم ناثرٍ في العصر العباسي، وقد كتب «الحيوان» و«البيان والتبيين» و«البخلاء» و«العثمانية»، وقد كان في أسلوبه ما لم يكن قبله: أن يُدخل الفكاهة والجدّ في نصٍّ واحد، وأن يستعمل الحكاية والشاهد، وأن يُخاطب القارئ كأنه يُحادثه. وقد كان في كتبه معلوماتٌ في الحيوان والنبات والناس، وقد كان في هذا ما يجعله أقرب إلى موسوعةٍ أدبية منها إلى كتاب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا العهد أن وُضعت علوم اللغة: النحو على يد سيبويه والكسائي والفراء، والبلاغة على يد عبد القاهر الجرجاني بعد ذلك، والعروض على يد الخليل بن أحمد، والمعاجم على يد الخليل أيضاً في «العين». وقد كان في هذا ما جعل العربية قادرةً على أن تكون لغة علمٍ ودولةٍ وأدب، وأن تُضبط قواعدها حتى لا يفسد المعنى. وقد كان في هذه العلوم ما جعل العربية قادرةً على أن تُقاوم اللحن والتحريف، وأن تحفظ نص القرآن من التغيير، وأن تبقى لغةً واحدةً في مساحةٍ تمتد من المحيط إلى السند رغم اختلاف الألسنة واللهجات.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الأدب العباسي انفتاحٌ على ثقافات أخرى: أن الفرس أدخلوا الحكمة والأمثال، وأن اليونان أدخلوا المنطق والفلسفة، وأن الهنود أدخلوا الحكايات والرياضيات. وقد كان في هذا ما جعل الأدب العربي غنياً بموضوعاتٍ جديدة، وأن يظهر ما يُسمّى «أدب المجالس» و«أدب السلطان» و«أدب الفكاهة»، وقد كان في هذا ما جعل الأدب مرآةً لمجتمعٍ متغيّر. وقد كان في هذا الانفتاح ما جعل الأدب العربي يتجاوز موضوعات القبيلة إلى موضوعات الإنسان: العدل والزهد والحب والموت والسخرية من السلطة، وقد كان في هذا ما جعله قابلاً لأن يُترجم ويُقرأ خارج حدود اللغة العربية بعد ذلك.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eمن البادية إلى المدينة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الشاعر الجاهلي يصف الصحراء والناقة والسيف، وكان الشاعر الأموي يصف الخلافة والقبيلة والمعركة. أما الشاعر العباسي فقد صار يصف المدينة: الحمّام، والسوق، والقصر، والبستان، والقارب في دجلة، والمجلس مع الندماء. وقد كان في هذا تحولاً في الذوق: أن يُصبح الوصف الدقيق للأشياء اليومية مادةً للشعر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا التحول أثرٌ في اللغة أيضاً: أن دخلت كلماتٌ جديدة من الفارسية واليونانية، وأن صار الشاعر يستعمل مصطلحاتٍ لم يعرفها من قبله، وأن تطوّرت الصورة الشعرية لتُصبح أكثر تعقيداً. وقد كان في هذا ما جعل بعض النقاد يرون في الشعر العباسي انحطاطاً، وبعضهم يراه تطوراً، والخلاف في هذا لم يُحسم إلى اليوم.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالجاحظ ومدرسة النثر\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الجاحظ من أصلٍ أفريقي، وقد كان في وجهه جُدريّ، وقد كان يُقال إنه كان دميماً، لكنه كان من أذكى الناس وأكثرهم قراءة. وقد كان يعيش على بيع الكتب أحياناً، وكان يقضي الليل في القراءة، وقد رُوي أنه مات في مكتبته حين سقطت عليه الكتب. وقد كان في هذا الخبر ما يُصوّر حياة الجاحظ: أن الرجل عاش بين الكتب حتى مات بينها، وأنه لم يكن يملك مالاً ولا جاهاً بقدر ما كان يملك مكتبةً وعقلاً، وقد كان في هذا ما جعله مثالاً للكاتب الذي يصنع مكانته بقلمه لا بنسبه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في أسلوبه ما جعله إماماً للنثر العربي: أن يبدأ بالفكرة ثم يُدعّمها بالحكاية ثم يُعلّق عليها، وأن يُخالف بين الجدّ والهزل، وأن يستعمل اللغة الفصيحة مع شيءٍ من السخرية. وقد كان في كتبه ما يُشبه الصحافة الحديثة: أن فيها خبراً وتحليلاً وتعليقاً، وأن فيها ما يهمّ الناس في حياتهم اليومية.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eعلوم اللغة\u003c/h4\u003e\u003cp class=\"ap\"\u003eوُضع النحو في البصرة ثم في الكوفة، وكان السبب في وضعه أن الناس دخلوا في الإسلام من غير العرب، فبدأ اللحن في القرآن، فخشي العلماء أن يفسد المعنى. وقد كان سيبويه في «الكتاب» قد وضع نظاماً كاملاً للنحو، وقد كان في هذا العمل ما جعله مرجعاً لكل من جاء بعده.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد وضع الخليل بن أحمد العروض، وهو علم الأوزان الشعرية، وقد كان في هذا العمل ما جعل الشعر العربي قابلاً للتحليل والتقويم، وأن يُعرف المكسور من الموزون. وقد وضع أيضاً أول معجم عربي هو «العين»، وقد كان في هذا ما جعل العربية قادرةً على أن تُحفظ ألفاظها، وأن تُعرف معانيها بدقة.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأبو نواس\u003c/b\u003e\u003cspan\u003eشاعر الخمر والغزل، وتاب في آخر حياته وكتب الزهد.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمتنبي\u003c/b\u003e\u003cspan\u003eأعظم شعراء العربية عند كثير من النقاد، قُتل سنة ٣٥٤هـ.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eابن المقفع\u003c/b\u003e\u003cspan\u003eترجم «كليلة ودمنة»، وأسّس النثر العربي المنظّم.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالجاحظ\u003c/b\u003e\u003cspan\u003eصاحب «الحيوان» و«البيان والتبيين» و«البخلاء».\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسيبويه\u003c/b\u003e\u003cspan\u003eواضع النحو في «الكتاب»، وهو المرجع الأول للنحو العربي.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمجال\u003c/th\u003e\u003cth\u003eأبرز الأعلام\u003c/th\u003e\u003cth\u003eما أضافه\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالشعر\u003c/td\u003e\u003ctd\u003eأبو نواس وأبو تمام والبحتري والمتنبي\u003c/td\u003e\u003ctd\u003eموضوعاتٌ وصورٌ جديدة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالنثر\u003c/td\u003e\u003ctd\u003eابن المقفع والجاحظ\u003c/td\u003e\u003ctd\u003eأسلوبٌ منظّم وحكايةٌ وتحليل\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالنحو\u003c/td\u003e\u003ctd\u003eسيبويه والكسائي والفراء\u003c/td\u003e\u003ctd\u003eضبط قواعد العربية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالعروض\u003c/td\u003e\u003ctd\u003eالخليل بن أحمد\u003c/td\u003e\u003ctd\u003eعلم الأوزان الشعرية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمعاجم\u003c/td\u003e\u003ctd\u003eالخليل بن أحمد\u003c/td\u003e\u003ctd\u003eأول معجم عربي هو «العين»\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eأنا الذي نظر الأعمى إلى أدبي، وأسمعت كلماتي من به صمم.\u003c/p\u003e\u003ccite\u003eمن شعر أبي الطيب المتنبي\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eتغيّر الشعر من البادية إلى المدينة، وظهر أبو نواس والمتنبي وأبو تمام، ووُضع النثر الفني على يد ابن المقفع والجاحظ، ووُضعت علوم اللغة كلها. وقد كان في هذا العهد ما جعل العربية لغةً قادرة على أن تحمل العلم والأدب والدولة معاً.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"civilization","n":"أثر بغداد في الحضارة الإنسانية","ic":"🌍","part":"القسم السادس: إرث بغداد","h":"\u003carticle class=\"ch3\" id=\"civilization\" data-toc=\"أثر بغداد في الحضارة الإنسانية\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم السادس: إرث بغداد\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٣ من ٣\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٦\u003ci\u003e.\u003c/i\u003e٣\u003c/span\u003e\n            \u003ch3\u003eأثر بغداد في الحضارة الإنسانية\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eلا يمكن فهم النهضة الأوروبية دون فهم ما جرى في بغداد بين القرنين الثاني والخامس الهجري. فقد انتقل إلى أوروبا عن طريق العربية: أرسطو وبطليموس وجالينوس وأقليدس، ومعهم الجبر والخوارزميات والبصريات والكيمياء والطب. وقد كان في هذا ما يجعل الحضارة العباسية جزءاً من تاريخ الإنسانية لا من تاريخ المسلمين فقط.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eبدأ انتقال العلم العربي إلى أوروبا من الأندلس وصقلية، ثم من طليطلة التي سقطت سنة ثمانٍ وسبعين وأربعمئة، وقد كان فيها مكتباتٌ عظيمة، وقد اجتمع فيها مترجمون من المسلمين والنصارى واليهود، وقد تُرجمت فيها كتبٌ كثيرة إلى اللاتينية. وقد كان من أشهر المترجمين فيها جيرارد الكريموني الذي ترجم كتاب بطليموس «المجسطي» وغيره من كتب الفلك والطب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا الانتقال أثرٌ في كل علم: في الرياضيات دخلت الأرقام الهندية عن طريق العربية وصارت تُسمّى «الأرقام العربية»، ودخل الصفر، ودخل الجبر، ودخلت الخوارزميات. وفي الفلك دخلت جداول النجوم والزيج والأسطرلاب، وفي الطب دخلت كتب الرازي وابن سينا، وفي الكيمياء دخلت أدوات التقطير والتصعيد، وفي البصريات دخل كتاب المناظر. وقد كان في كل علمٍ من هذه العلوم أثرٌ يمكن تتبّعه في كتب أوروبية بعينها: أن كتاب المناظر ظهر في ترجمةٍ لاتينية في القرن الثالث عشر، وأن القانون في الطب دُرّس في مونبلييه وبادوا، وأن المجسطي لم يُعرف في أوروبا إلا من العربية في أول الأمر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الفلسفة أثرٌ أعمق؛ فقد عرف الأوروبيون أرسطو من خلال شروح ابن رشد وابن سينا والفارابي، وقد صار ابن رشد يُسمّى في اللاتينية «المعلّق»، وكانت شروحه تُدرّس في جامعات باريس وأكسفورد وبادوا. وقد كان في هذا ما جعل الفلسفة الأوروبية في القرن الثالث عشر تُبنى على أساسٍ إسلامي، وقد كان توما الأكويني نفسه يستشهد بابن رشد ويُسمّيه «المعلّق».\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الطب أثرٌ مباشر: أن كتب ابن سينا والرازي كانت تُدرّس في جامعات أوروبا حتى القرن السابع عشر، وأن «القانون في الطب» تُرجم إلى اللاتينية وطُبع أكثر من ثلاثين مرة. وقد كان في الجراحة أثرٌ كذلك؛ فقد انتقلت أدواتٌ عربية إلى أوروبا، ومنها أدوات القطب والجبس والمراهم، وقد كان في الصيدلة أثرٌ في تنظيم مهنة الصيدلي ومراقبة الأدوية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في العلوم الطبيعية أثرٌ أيضاً؛ فقد انتقلت إلى أوروبا فكرة التجربة والقياس، وقد كان ابن الهيثم أول من وضع منهجاً تجريبياً في البصريات، وقد اعتمد عليه روجر باكون وفرانسيس باكون بعد قرون. وقد كان في هذا ما يجعل الثورة العلمية الأوروبية مدينةً للعلم العربي في منهجها لا في نتائجها فقط، وقد كان في هذا ما يُغيّر صورة العصر الوسيط في التاريخ الأوروبي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في اللغة أثرٌ كذلك؛ فقد دخلت في اللغات الأوروبية كلماتٌ عربية كثيرة، ومنها: الجبر، والكحل، والقلوي، والزئبق، والقطن، والسكر، والليمون، والبرتقال، والأرز، والموز، والقيثارة، والمنارة، والقبة، والمخزن، والديوان، والبركة، والشراب. وقد كان في هذا دليلاً على أن التبادل الحضاري يترك أثره في اللغة قبل أن يتركه في الفكر، وأن الكلمات تسافر حيث لا تسافر الجيوش.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في العمارة أثرٌ أيضاً؛ فقد انتقلت إلى أوروبا القبّة والقوس المدبّب والزخرفة الهندسية والنافذة المزدوجة والحديقة المنظمة، وقد ظهر ذلك في العمارة القوطية وفي عمارة صقلية والأندلس. وقد كان في هذا ما جعل مدناً أوروبيةً كثيرةً تحمل في مبانيها أثراً عربياً، ومنها إشبيلية وطليطلة وفينيسيا وباليرمو، وقد كان في هذا ما يجعل الحضارة تُقرأ من الحجر كما تُقرأ من الكتب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا كله درسٌ في التاريخ: أن الحضارة لا تُقاس بمن انتصر في الحروب، بل بمن أنتج ما انتفع به الناس بعد قرون. وقد سقطت بغداد سنة ستٍّ وخمسين وستمئة، ولم يكن في ذلك نهاية علمها، لأن علمها كان قد انتقل إلى القاهرة ودمشق ومراكش وطليطلة، ومنها إلى أوروبا، ومنها إلى العالم كله، وقد كان في هذا ما يجعل الحكم على الدولة العباسية حكماً مركّباً: أنها سقطت سياسياً وبقيت حضارياً.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eطليطلة وصقلية: بوابتان\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت طليطلة أهم مركز ترجمة في أوروبا في القرن الثاني عشر؛ فقد سقطت سنة ثمانٍ وسبعين وأربعمئة، وكان فيها مكتباتٌ عظيمة، وقد اجتمع فيها مترجمون يعرفون العربية واللاتينية، وكان كثير منهم من اليهود والنصارى، وقد ترجموا في قرنٍ واحد أكثر مما تُرجم في أوروبا قبله كله.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت صقلية بوابةً أخرى؛ فقد حكمها المسلمون قرنين، ثم حكمها النورمان، وقد بقي فيها علماء عرب، وقد تُرجم في بلاط روجر الثاني كتاب «نزهة المشتاق» للإدريسي، وقد كان في هذا دليلاً على أن العلم يمكن أن ينتقل حتى في ظل حكمٍ مختلف، وأن المدن التي تُجاور حضارتين تصير جسراً بينهما.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eابن رشد في جامعات أوروبا\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان ابن رشد من أكبر شرّاح أرسطو، وقد كتب «تهافت التهافت» رداً على الغزالي، وقد كانت شروحه تُرجمت إلى اللاتينية في القرن الثالث عشر، وقد صار يُسمّى «المعلّق» لأن شروحه كانت تُقرأ مع نص أرسطو. وقد كان في هذا ما جعل الفلسفة الأوروبية تجد طريقاً إلى أرسطو لا يمرّ باليونانية وحدها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في جامعة باريس في القرن الثالث عشر تيارٌ يُسمّى «الرشدية اللاتينية»، وكان من أتباعه سيجر البارانتي، وقد أدانه الأساقفة مراتٍ، وقد كان في هذا دليلاً على أن فكر ابن رشد كان قوياً بما يكفي ليُثير جدلاً في أوروبا بعد قرنٍ من موته، وأن الأفكار لا تحتاج إلى جيوشٍ لتنتشر.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eلماذا نُسي هذا الأثر؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eنُسي الأثر العربي في أوروبا لسببين: أن كثيراً من الكتب تُرجمت ثم نُسبت إلى أصحابها اليونانيين أو نُسبت إلى مترجميها اللاتين، وأن المؤرخين الأوروبيين في القرنين الثامن عشر والتاسع عشر كتبوا تاريخاً للعلم يبدأ من اليونان ثم يقفز إلى النهضة، ويجعل العصر الوسيط «عصوراً مظلمة» بلا إسهامٍ من أحد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بدأ تصحيح هذا في القرن العشرين، حين نُشرت دراساتٌ عن الترجمة في طليطلة وعن أثر ابن الهيثم وابن رشد والخوارزمي، وقد صار من المُسلّم به اليوم أن النهضة الأوروبية لم تكن بدايةً من الصفر، بل كانت استئنافاً لمسارٍ لم ينقطع، وأن العربية كانت حلقةً أساسية فيه، وأن الاعتراف بذلك لا يُنقص من أوروبا بل يُصحّح التاريخ.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eطليطلة\u003c/b\u003e\u003cspan\u003eسقطت سنة ٤٧٨هـ، وصارت أهم مركز ترجمة في أوروبا.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eصقلية\u003c/b\u003e\u003cspan\u003eبوابةٌ ثانية، وفيها تُرجمت كتبٌ في الجغرافيا والفلك.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eابن رشد\u003c/b\u003e\u003cspan\u003eشروحه تُرجمت إلى اللاتينية، وقامت عليها الرشدية اللاتينية.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eابن سينا\u003c/b\u003e\u003cspan\u003e«القانون في الطب» دُرّس في أوروبا حتى القرن السابع عشر.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالكلمات\u003c/b\u003e\u003cspan\u003eالجبر والكحل والقلوي والقطن والسكر والليمون، كلها من العربية.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمجال\u003c/th\u003e\u003cth\u003eما انتقل إلى أوروبا\u003c/th\u003e\u003cth\u003eالوسيلة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالرياضيات\u003c/td\u003e\u003ctd\u003eالأرقام والصفر والجبر والخوارزميات\u003c/td\u003e\u003ctd\u003eطليطلة وصقلية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالفلك\u003c/td\u003e\u003ctd\u003eالجداول والزيج والأسطرلاب\u003c/td\u003e\u003ctd\u003eالترجمة اللاتينية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالطب\u003c/td\u003e\u003ctd\u003eالقانون والحاوي والجراحة والصيدلة\u003c/td\u003e\u003ctd\u003eجامعات إيطاليا وفرنسا\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالفلسفة\u003c/td\u003e\u003ctd\u003eأرسطو بشروح ابن رشد وابن سينا\u003c/td\u003e\u003ctd\u003eالرشدية اللاتينية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالبصريات\u003c/td\u003e\u003ctd\u003eنظرية الرؤية والمنهج التجريبي\u003c/td\u003e\u003ctd\u003eكتاب المناظر\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالعمارة\u003c/td\u003e\u003ctd\u003eالقبة والقوس المدبّب والزخرفة\u003c/td\u003e\u003ctd\u003eالأندلس وصقلية\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eإنّ العرب لم يكونوا ناقلين للعلم اليوناني فقط، بل كانوا معلّميه في أوروبا.\u003c/p\u003e\u003ccite\u003eمعنى ما أثبته البحث التاريخي الحديث في أثر العلم العربي\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eانتقل علم بغداد إلى أوروبا عن طريق طليطلة وصقلية، فدخلت الأرقام والجبر والفلك والطب والفلسفة والبصريات، ودخلت كلماتٌ عربية كثيرة في اللغات الأوروبية. وقد نُسي هذا الأثر قروناً، ثم أعاد البحث الحديث الاعتراف به، فصار واضحاً أن النهضة لم تبدأ من الصفر.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"f","one":true,"id":"people","n":"أهم الشخصيات","ic":"","part":"","h":"\u003csection class=\"rsec\"\u003e\n      \u003ch2 class=\"sec\"\u003eأهم الشخصيات\u003c/h2\u003e\n      \u003cdiv class=\"people\"\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eأبو جعفر المنصور\u003c/b\u003e\u003cspan\u003eثاني الخلفاء العباسيين، بنى بغداد سنة ٧٦٢م وأدار دواوين الدولة وقمع الفتن.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eهارون الرشيد\u003c/b\u003e\u003cspan\u003eخليفة بغداد من ٧٨٦م إلى ٨٠٩م، أتمّ بيت الحكمة وحرّك الترجمة وأسّس بلاطاً علمياً.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eالمأمون\u003c/b\u003e\u003cspan\u003eخليفة من ٨١٣م إلى ٨٣٣م، أيّد بيت الحكمة وازدهرت الترجمة في عهده.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eمحمد بن موسى الخوارزمي\u003c/b\u003e\u003cspan\u003eصاحب كتاب الجبر والمقاييس، وهو أوّل من جعل الجبر علماً مستقلاً باسمه.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eابن سينا\u003c/b\u003e\u003cspan\u003eحكيم وطبيب، ألف القانون في الطب الذي ظل مرجع مدارس العالم قروناً.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eابن الهيثم\u003c/b\u003e\u003cspan\u003eعالم البصريات، وضع كتاب المناظير ودرس انكسار الضوء وانتشار الأشعة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eهولاكو\u003c/b\u003e\u003cspan\u003eقائد المغول، دخل بغداد سنة ١٢٥٨م وقتل المستعصم وسقطت الدولة العباسية.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\n    \u003c/section\u003e"},{"u":"f","one":true,"id":"outcomes","n":"النتائج والآثار","ic":"","part":"","h":"\u003csection class=\"rsec\"\u003e\n      \u003ch2 class=\"sec\"\u003eالنتائج والآثار\u003c/h2\u003e\n      \u003cul class=\"outs\"\u003e\u003cli\u003eنُقلت علوم اليونان وفارس إلى العربية وحُفظت من الضياع.\u003c/li\u003e\u003cli\u003eصارت بغداد أعظم مدن العالم خمسة قرون في التجارة والعلم.\u003c/li\u003e\u003cli\u003eانتقل العلم إلى دمشق والقاهرة والأندلس بعد سقوط بغداد.\u003c/li\u003e\u003cli\u003eانتهت الخلافة العباسية في بغداد سنة ١٢٥٨م.\u003c/li\u003e\u003c/ul\u003e\n    \u003c/section\u003e"},{"u":"f","one":true,"id":"sources","n":"المصادر والمراجع","ic":"","part":"","h":"\u003cdiv class=\"src frame\" style=\"--c:#3A3A3A\"\u003e\n    \u003cspan class=\"crn tl\"\u003e\u003csvg viewBox=\"0 0 26 26\"\u003e\n\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\"/\u003e\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\" transform=\"rotate(90 13 13)\" opacity=\".5\"/\u003e\u003c/svg\u003e\u003c/span\u003e\u003cspan class=\"crn tr\"\u003e\u003csvg viewBox=\"0 0 26 26\"\u003e\n\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\"/\u003e\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\" transform=\"rotate(90 13 13)\" opacity=\".5\"/\u003e\u003c/svg\u003e\u003c/span\u003e\u003cspan class=\"crn bl\"\u003e\u003csvg viewBox=\"0 0 26 26\"\u003e\n\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\"/\u003e\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\" transform=\"rotate(90 13 13)\" opacity=\".5\"/\u003e\u003c/svg\u003e\u003c/span\u003e\u003cspan class=\"crn br\"\u003e\u003csvg viewBox=\"0 0 26 26\"\u003e\n\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\"/\u003e\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\" transform=\"rotate(90 13 13)\" opacity=\".5\"/\u003e\u003c/svg\u003e\u003c/span\u003e\n    \u003ch2 class=\"sec\" style=\"margin-top:0\"\u003eالمصادر والمراجع\u003c/h2\u003e\n    \u003cul\u003e\u003cli\u003e\u003ccite\u003eالطبري\u003c/cite\u003e — تاريخ الرسل والملوك (دعوة العباسين في خراسان ومعركة الزب وسقوط بني أمية)\u003c/li\u003e\u003cli\u003e\u003ccite\u003eابن الأثير\u003c/cite\u003e — الكامل في التاريخ (أخبار السفاح والمنصور وهارون الرشيد والدولة العباسية)\u003c/li\u003e\u003cli\u003e\u003ccite\u003eالمسعودي\u003c/cite\u003e — مروج الذهب ومعادن الجوهر (أحوال الخلفاء العباسيين ودواوينهم وحياتهم العلمية)\u003c/li\u003e\u003cli\u003e\u003ccite\u003eابن خلدون\u003c/cite\u003e — تاريخ ابن خلدون (مغول هولاكو وسقوط بغداد وما بعدها)\u003c/li\u003e\u003c/ul\u003e\n  \u003c/div\u003e"},{"u":"f","one":true,"id":"pager","n":"الحقب الأخرى","ic":"","part":"","h":"\u003cnav class=\"pager\"\u003e\n    \u003ca class=\"prev\" href=\"andalus.html\"\u003e\u003csmall\u003e← الحقبة السابقة\u003c/small\u003e\u003cb\u003e🏰 الأندلس\u003c/b\u003e\u003c/a\u003e\n    \u003ca class=\"next\" href=\"crusades.html\"\u003e\u003csmall\u003eالحقبة التالية →\u003c/small\u003e\u003cb\u003e🛡️ الحروب الصليبية\u003c/b\u003e\u003c/a\u003e\n  \u003c/nav\u003e"}]}</script>
