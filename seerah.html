03c/li\u003e\u003c/ol\u003e\n  \u003c/div\u003e"},{"u":"p","one":true,"id":"part-1","n":"القسم الأول: المولد والبعثة","ic":"🕋","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-1\" style=\"--c:#1E6B3A\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🕋\u003c/div\u003e\n      \u003ch2\u003eالقسم الأول: المولد والبعثة\u003c/h2\u003e\n      \u003cp\u003eفي سنة إحدى وخمسين قبل الهجرة وُلد محمد بن عبد الله في مكة، وفي السنة الرابعة عشرة قبل الهجرة نزل عليه الوحي في غار حراء. وبين هذين التاريخين أربعون سنة لم يكن فيها نبيٌّ يُوحى إليه، بل كان فيها راعٍ يتيم، وتاجر أمين، ورجلٌ يُتحاكم إليه الناس في خصوماتهم، ثم رجلٌ يخلو في جبلٍ ليتفكّر. وقد كانت هذه السنوات الأربعون هي المقدمة التي جعلت الناس يصدّقونه حين قال إنه رسول الله.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#mawlid\"\u003eالمولد والنشأة\u003c/a\u003e\u003ca href=\"#batha\"\u003eالبعثة والوحي\u003c/a\u003e\u003ca href=\"#secret-dawa\"\u003eالدعوة السرية\u003c/a\u003e\u003ca href=\"#public-dawa\"\u003eالجهر بالدعوة\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"mawlid","n":"المولد والنشأة","ic":"🌱","part":"القسم الأول: المولد والبعثة","h":"\u003carticle class=\"ch3\" id=\"mawlid\" data-toc=\"المولد والنشأة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الأول: المولد والبعثة\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ١ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e١\u003ci\u003e.\u003c/i\u003e١\u003c/span\u003e\n            \u003ch3\u003eالمولد والنشأة\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eوُلد محمد بن عبد الله في مكة في عام الفيل، وهو العام الذي حاول فيه أبرهة الأشرم هدم الكعبة، وكان ذلك في نحو سنة إحدى وخمسين قبل الهجرة. وقد مات أبوه عبد الله وهو حملٌ في بطن أمه، فصار يتيماً قبل أن يُولد، ثم ماتت أمه آمنة بنت وهب وهو في السادسة، ثم مات جدّه عبد المطلب وهو في الثامنة، فكفله عمّه أبو طالب.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكانت مكة في ذلك الوقت مدينةً صغيرةً في وادٍ غير ذي زرع، لكنها كانت مركزاً دينياً وتجارياً مهماً؛ فيها الكعبة التي يحجّ إليها العرب، وفيها أسواقٌ موسمية مثل سوق عكاظ ومجنة وذي المجاز، وفيها قبيلة قريش التي كانت تسدّن البيت وتُدير الحج. وقد كان في هذا الوضع ما جعل مكة مدينةً لا تُقاس بحجمها، لأن مكانتها كانت من مكانة البيت لا من الأرض والزرع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان عبد الله بن عبد المطلب من أوسط قريش نسباً، وكان أبوه عبد المطلب سيد بني هاشم وسادن البيت، وكان له في قريش مكانةٌ لا تُنازع. وقد تزوّج عبد الله آمنة بنت وهب من بني زهرة، وهي من أشرف نساء قريش، ولم يلبث أن خرج في تجارةٍ إلى الشام، فمرض في المدينة ومات فيها، ودُفن عند أخواله من بني النجار، ولم يكن قد رأى ابنه. وقد كان في موته في المدينة على طريق الشام أثرٌ في أسرة بني هاشم: أنها فقدت رجلاً في ريعان شبابه، وأن عبد المطلب كبر بعده، وأن الطفل بقي بلا أبٍ في قبيلةٍ تُقدّر الأب لأنه هو الذي يحمي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد وُلد النبيّ يتيماً، وكان في هذا ما ذكرّه القرآن بعد ذلك في سورة الضحى: «ألم يجدك يتيماً فآوى». وقد أُرضع في بادية بني سعد بن بكر عند حليمة السعدية، وكان ذلك عادةً عند قريش ليكون الطفل أقوى في البادية وأفصح لساناً، وقد نشأ في البادية سنواتٍ ثم عاد إلى أمه، وقد رُوي في هذه السنوات من الأخبار ما يُشير إلى آثارٍ ظهرت عليه في صغره.\u003c/p\u003e\u003cp class=\"ap\"\u003eولمّا ماتت أمه آمنة في الأبواء — وهو موضع بين مكة والمدينة — وهو في السادسة، صار في كفالة جدّه عبد المطلب، وكان جدّه يُقرّبه ويُدني مجلسه، وقد رُوي أنه كان يُجلسه على فراشه في ظل الكعبة. ثم لمّا مات جدّه وهو في الثامنة، انتقل إلى كفالة عمّه أبي طالب، وكان أبو طالب رجلاً فقيراً كثير الأولاد، لكنه كان شريفاً في قومه، وقد أحسن إلى ابن أخيه إحساناً لم يُقطع حتى مات.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان النبيّ في شبابه يرعى الغنم لأهل مكة على قراريط، وقد قال بعد ذلك: «ما بعث الله نبيًّا إلا رعى الغنم»، وقد كان في هذا العمل ما يُعلّمه الصبر والرعاية ومراقبة الأفراد، وقد كان في حياته بعد ذلك أثرٌ من هذا: أنه كان يعرف أحوال الناس البسطاء لأنهم كانوا مثله. ثم خرج مع عمّه في تجارةٍ إلى الشام وهو في الثانية عشرة، وقد رُوي في هذه الرحلة أخبارٌ عن بحيرى الراهب، وقد كان فيها تعرّفه على أسفار القوافل وطرق التجارة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد عُرف في مكة بين قومه بالصادق الأمين، وكان هذا لقباً حقيقياً لا مجازاً، لأنه لم يُعرف عنه كذبٌ ولا خيانة قبل النبوة. وقد شهد حرب الفجار — وهي حربٌ بين قريش وهوازن — وهو شاب، وقد شهد أيضاً حلف الفضول الذي تعاقدت فيه قبائل قريش على أن يردّوا المظالم وينصروا المظلوم في مكة، وقد كان يقول بعد ذلك: «لو دُعيت به في الإسلام لأجبت». وقد كان في هذا الحلف أثرٌ في تكوين فكرة العدل عنده: أن الناس إذا تعاقدوا على نصرة المظلوم صار العقد قوةً، وأن العدل لا يقوم بالنيات وحدها بل بالتعاون بين من يُريدونه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد شارك في بناء الكعبة حين أعادت قريش بناءها وهو في الخامسة والثلاثين، وقد كان في ذلك أنهم اختلفوا في من يضع الحجر الأسود، فاتفقوا على أن يحكّموا أول من يدخل من باب الصفا، فكان هو، فوضع الحجر بيده في ثوبٍ ورفعته القبائل معه، وقد كان في هذا الحل ما جعل الناس يذكرون حكمته قبل النبوة. وقد كان في هذا الحكم قبولٌ من جميع القبائل، لأنهنّ رأين فيه رجلاً لا ينتمي إلى واحدةٍ منهنّ، فلم يكن في اختياره انتصاراً لقبيلةٍ على أخرى، وقد كان في هذا أول درسٍ في السياسة: أن من لا مصلحة له في النزاع يستطيع أن يحلّه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد عمل في تجارة خديجة بنت خويلد، وكانت امرأةً ذات مالٍ وشرف، وكانت تُعطي قريشاً مالها مُضاربةً، فلمّا سمعت بأمانته طلبت منه أن يخرج لها بمالٍ إلى الشام، فخرج ومعه غلامها ميسرة، فرجع بربحٍ كبير، ثم خطبها وتزوّجها وهو في الخامسة والعشرين وهي في الأربعين. وقد كانت خديجة زوجته الوحيدة حتى ماتت، وكان لها في حياته أثرٌ عظيم. وقد كانت خديجة أول من آمن به بعد البعثة، وكانت سنداً له في أشدّ السنوات، وقد ماتت في السنة العاشرة من البعثة، وكان عامها يُسمّى «عام الحزن» مع موت أبي طالب، وقد كان في فقدها ما جعل النبيّ يشعر أنه فقد بيته وسنده في وقتٍ واحد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت حياته قبل النبوة حياة عملٍ وتجارة وأسرة، لا حياة انقطاعٍ وخلوة، وقد كان في هذا ما يُبيّن أن النبوة لم تُغيّر طبيعة الرجل بل أكملت ما كان فيه: أن الصدق صار رسالة، وأن الأمانة صارت منهجاً، وأن الحكمة صارت شريعة. وقد كان في هذه الأربعين سنة إعدادٌ خفيّ، لا يُعرف إلا بعد أن نزل الوحي. وقد كان في هذه الأربعين سنة أيضاً أن النبيّ لم يكن معروفاً بالزهد المنقطع ولا بالترهب، بل كان رجلاً يعمل ويتزوج ويُشارك قومه في حياتهم، وقد كان في هذا ما جعل رسالته قريبةً من الناس، لأنهم رأوا فيها رجلاً مثلهم يُكلّمهم بما يعرفونه.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eعام الفيل\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان عام الفيل هو العام الذي قدم فيه أبرهة الأشرم من اليمن بجيشٍ فيه فيلٌ يريد هدم الكعبة، فلمّا وصل إلى مكة خرج إليه عبد المطلب جدّ النبيّ، فسأله أن يردّ عليه إبله التي أُخذت، فقال له أبرهة: أتكلمني في إبلٍ أُخذت منك ولا تتكلم في البيت الذي هو دينك ودين آبائك؟ فقال عبد المطلب كلمةً تُروى: «أنا ربّ الإبل، وللبيت ربّ يحميه».\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد هلك أبرهة وجيشه في الطريق، وقد ذكر القرآن ذلك في سورة الفيل: «ألم تر كيف فعل ربك بأصحاب الفيل». وقد كان في هذه الحادثة أثرٌ في الوجدان العربي: أن الكعبة محفوظةٌ بحفظٍ إلهي، وأنها لا تحتاج إلى جيشٍ يحميها، وقد كانت قريش بعد ذلك تُعظّم هذا العام وتُؤرّخ به.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eحليمة السعدية والرضاع\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت عادة قريش أن تُرسل أطفالها إلى مُرضعاتٍ في البادية، ليكون الطفل أقوى في الهواء والطعام، وأفصح في اللسان، وأبعد عن أخلاق المدينة. وقد جاءت حليمة السعدية إلى مكة مع نساء بني سعد، فلم تجد طفلاً إلا النبيّ، لأنه كان يتيماً فلم يُرغب فيه أحدٌ من أجله.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أخذته حليمة، وقد رُوي أنها وجدت في بيتها بعد ذلك بركةً لم تعرفها من قبل، وأن دابتها التي كانت لا تُدرّ صارت تُدرّ، وقد كانت هذه الروايات مشهورةً عند أهل السير. وقد كان في رضاعه في بني سعد أثرٌ في لسانه بعد ذلك، فقد كان أفصح العرب، وكان في شبابه يقول: «أنا أفصح من نطق بالضاد، بيد أني من قريش، ونشأت في بني سعد بن بكر».\u003c/p\u003e\u003ch4 class=\"sub\"\u003eحلف الفضول وشهادة الحرب\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان حلف الفضول اتفاقاً بين قبائل من قريش على أن يردّوا المظالم في مكة، وأن ينصروا المظلوم على الظالم ولو كان من غير أهل مكة. وقد كان سببه أن رجلاً من زبيد قدم مكة ببضاعة، فظلمه رجلٌ من بني سهم، فاستنصر الأحلاف، فاجتمعوا وتعاقدوا في دار ابن جدعان. وقد كان في هذا الحلف ما يُشبه المؤسسة المدنية في مجتمعٍ لا دولة فيه: أن قبائل متفرقة تتعاقد على قانونٍ واحد، وأن تُلزم نفسها بتنفيذه، وأن يكون العقد أقوى من العصبية، وقد كان في هذا دليلاً على أن العرب كانوا قادرين على التنظيم حين تُوجد الإرادة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد شهد النبيّ هذا الحلف قبل النبوة، وقال فيه كلمةً تُروى: «لو دُعيت به في الإسلام لأجبت». وقد كان في هذا دليلاً على أن الإسلام لم يأتِ بنظامٍ جديد في العدل بين الناس، بل جاء يُقرّ ما كان صحيحاً في الأعراف ويُكمله، وأن النبيّ كان يُحبّ العدل قبل أن يُوحى إليه.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمولد\u003c/b\u003e\u003cspan\u003eعام الفيل، نحو ٥١ قبل الهجرة، في مكة من بني هاشم.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eاليُتم\u003c/b\u003e\u003cspan\u003eمات أبوه قبل ولادته، وأمه في السادسة، وجدّه في الثامنة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالكفالة\u003c/b\u003e\u003cspan\u003eعبد المطلب ثم أبو طالب، وكان أبو طالب فقيراً لكنه شريف.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالزواج بخديجة\u003c/b\u003e\u003cspan\u003eفي الخامسة والعشرين، وكانت في الأربعين، ولم يتزوج غيرها حتى ماتت.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eبناء الكعبة\u003c/b\u003e\u003cspan\u003eشارك فيه في الخامسة والثلاثين، وحكّم في وضع الحجر الأسود.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمرحلة\u003c/th\u003e\u003cth\u003eالسن\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالمولد\u003c/td\u003e\u003ctd\u003eعام الفيل\u003c/td\u003e\u003ctd\u003eفي مكة، ويتيماً من أبيه\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالرضاع\u003c/td\u003e\u003ctd\u003eأول سنتين\u003c/td\u003e\u003ctd\u003eعند حليمة السعدية في بادية بني سعد\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eوفاة الأم\u003c/td\u003e\u003ctd\u003eالسادسة\u003c/td\u003e\u003ctd\u003eفي الأبواء، ثم كفالة الجدّ\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eوفاة الجدّ\u003c/td\u003e\u003ctd\u003eالثامنة\u003c/td\u003e\u003ctd\u003eثم كفالة أبي طالب\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالتجارة\u003c/td\u003e\u003ctd\u003eالثانية عشرة\u003c/td\u003e\u003ctd\u003eخروجه مع عمّه إلى الشام\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالزواج\u003c/td\u003e\u003ctd\u003eالخامسة والعشرون\u003c/td\u003e\u003ctd\u003eخديجة بنت خويلد\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eبناء الكعبة\u003c/td\u003e\u003ctd\u003eالخامسة والثلاثون\u003c/td\u003e\u003ctd\u003eتحكيمه في وضع الحجر الأسود\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eأنا ربّ الإبل، وللبيت ربّ يحميه.\u003c/p\u003e\u003ccite\u003eكلمة تُنسب إلى عبد المطلب لموفد أبرهة في عام الفيل\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eنشأ النبيّ يتيماً في مكة، ورعى الغنم، وتاجر، وعُرف بالصادق الأمين، وتزوّج خديجة، وحكّم في بناء الكعبة. وقد كانت هذه الأربعون سنة إعداداً خفياً: أن يصدقه الناس قبل أن يدعوهم، وأن يعرف أحوالهم قبل أن يقودهم.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"batha","n":"البعثة والوحي","ic":"✨","part":"القسم الأول: المولد والبعثة","h":"\u003carticle class=\"ch3\" id=\"batha\" data-toc=\"البعثة والوحي\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الأول: المولد والبعثة\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٢ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e١\u003ci\u003e.\u003c/i\u003e٢\u003c/span\u003e\n            \u003ch3\u003eالبعثة والوحي\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eفي السنة الرابعة عشرة قبل الهجرة، وهو في الأربعين من عمره، نزل جبريل عليه السلام في غار حراء على جبل النور قرب مكة، وقال له: «اقرأ». وقد كانت هذه اللحظة بداية تاريخٍ جديد للعالم، لكنها كانت في نظر الرجل نفسه لحظة رعبٍ لا لحظة مجد؛ فقد رجع إلى خديجة يرجف فؤاده ويقول: «دثّروني».\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان النبيّ قبل البعثة يخلو في غار حراء شهراً كل عام، وكان يتعبّد فيه على ملة إبراهيم كما كان يفعل بعض الحنفاء في ذلك الزمان، وقد كان في هذا الخلو ما يُهيّئه للوحي: أن يبتعد عن ضجيج مكة وعن أصنامها وعن أسواقها، وأن يخلو بنفسه في مكانٍ لا يسمع فيه إلا صوته. وقد كان في هذا أيضاً ما جعل الناس يعرفونه قبل البعثة بأنه رجلٌ يتحنّث، لا بأنه رجلٌ من أهل الدنيا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد جاءه جبريل وهو في الغار، فقال له: «اقرأ»، فقال: «ما أنا بقارئ»، فردّ عليه ثلاثاً، ثم قرأ عليه: «اقرأ باسم ربك الذي خلق، خلق الإنسان من علق، اقرأ وربك الأكرم، الذي علّم بالقلم، علّم الإنسان ما لم يعلم». وقد كانت هذه أول خمس آياتٍ من القرآن، وقد كان فيها بيانٌ لمعنى الرسالة: أن الله خلق، وأنه يُعلّم، وأن الإنسان يتعلّم بالقلم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد رجع النبيّ إلى خديجة يرجف فؤاده، فقال: «زمّلوني، دثّروني»، حتى ذهب عنه الروع، ثم أخبرها الخبر وقال: «لقد خشيتُ على نفسي». فقالت له كلمةً تُروى إلى اليوم: «كلا، والله لا يُخزيك الله أبداً، إنك لتصل الرحم، وتحمل الكَلّ، وتكسب المعدوم، وتُقري الضيف، وتُعين على نوائب الحق». وقد كان في هذه الكلمة فقهٌ عظيم: أنها لم تُطمئنه بكلامٍ عام بل عدّدت له أعماله الصالحة، وأن الله لا يُخزي من كان كذلك.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم ذهبت به خديجة إلى ابن عمّها ورقة بن نوفل، وكان نصرانياً يعرف الكتب، فلمّا سمع الخبر قال: «هذا الناموس الذي نزل على موسى»، وقال: «ليتني أكون حياً حين يُخرجك قومك»، فقال النبيّ: «أوَمُخرجيّ هم؟»، قال: «نعم، لم يأتِ رجلٌ قط بمثل ما جئتَ به إلا عُودي». وقد كان في هذه الكلمة تحذيرٌ مبكر: أن الطريق لن يكون سهلاً، وأن من جاء بمثل هذا لا يُقبل في قومه أول الأمر.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم فتر الوحي فترةً، وقد قيل إنها كانت أياماً، وقيل سنوات، وقد حزن النبيّ حزناً شديداً حتى خشي أن يكون قد تُرك، وقد كان يخرج إلى الجبال ويُشرف على الأودية، وقد رُوي أنه همّ بأن يتردّى من رؤوس الجبال مراتٍ، فكان جبريل يتمثّل له ويقول: «يا محمد، إنك رسول الله حقاً». وقد كان في هذه الفترة ما يُعلّمه الصبر على غياب المعنى، وأن الوحي ليس أمراً يملكه الإنسان.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم نزلت سورة المدثر: «يا أيها المدثر، قم فأنذر، وربك فكبّر، وثيابك فطهّر، والرجز فاهجر». وقد كانت هذه الآيات بداية التكليف بالدعوة، وقد كان فيها ترتيبٌ دقيق: أن يقوم، ثم يُنذر، ثم يُكبّر ربه، ثم يُطهّر ثيابه، ثم يهجر الرجز. وقد كان في هذا الترتيب ما يُبيّن أن الدعوة تبدأ من النفس: أن يُطهّر الداعي نفسه قبل أن يُطهّر الناس. وقد كان في هذا التدرّب معنىً في الدعوة: أن من يُريد أن يُصلح الناس يبدأ بنفسه، وأن الطهارة المطلوبة ليست طهارة الثوب فقط بل طهارة القلب واليد واللسان، وأن من لم يُطهّر نفسه لا يستطيع أن يُطهّر غيره ولو كان كلامه صحيحاً.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في البعثة أمرٌ آخر لم يُلاحظ في أول الأمر: أنها جاءت في مكانٍ لا في مدينة، وفي قبيلةٍ لا في دولة، وفي رجلٍ لا في عائلةٍ حاكمة. وقد كان في هذا ما يُبيّن أن الرسالة لا تحتاج إلى سلطةٍ لتنتشر، وأنها تبدأ من فردٍ ثم تصير أمةً، وأن الله اختار لها المكان والزمان والقبيلة بعلمٍ لا بصدفة. وقد كان في هذا الاختيار أيضاً رحمةً بالناس: أن الرسالة جاءت في قومٍ يعرفون العربية ويعرفون الأنبياء، وأنهم كانوا يتوقّعون نبيًّا من نسل إسماعيل، وقد كان في هذا ما جعل الدعوة مفهومةً من أول يوم، لا غريبةً تحتاج إلى ترجمة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه المرحلة أيضاً أن النبيّ لم يُعلن دعوته للناس جميعاً، بل بدأ بأهل بيته وأقرب الناس إليه، وقد كان في هذا حكمةً في التدرّج: أن تُبنى القاعدة الأولى من أناسٍ يتحمّلون، ثم يُوسّع الدائرة، ثم يُعلن الأمر. وقد كان في هذا منهجاً في العمل العام: أن البداية تكون بالقلب القريب قبل الجمهور البعيد. وقد كان في هذا المنهج ما يفعله كل مُصلحٍ ناجح: أنه يبدأ بمن يُصدّقه ويحتمل معه، ثم يتوسّع، ثم يُعلن، وقد كان في هذا ما يجعل الحركة تنمو بلا انشقاقٍ في أولها، لأن القاعدة الأولى تكون مختارةً لا عشوائية.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eغار حراء\u003c/h4\u003e\u003cp class=\"ap\"\u003eغار حراء في جبل النور، وهو جبلٌ قريب من مكة، والغار صغيرٌ يتسع لرجلٍ واحد، وله بابٌ يُشرف على مكة. وقد كان النبيّ يصعد إليه في كل عام شهراً، وكان في ذلك الزمان من العرب من يتحنّث في الجبال على ملة إبراهيم، وقد كان في هذا دليلاً على أن الحنيفية لم تنقطع تماماً.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان اختيار هذا المكان مقصوداً في حكمة الله: أنه بعيد عن الأصنام وعن الأسواق وعن مجالس قريش، وأن فيه خلوةً تُهيّئ القلب، وأن فيه إشرافاً على مكة يُذكّر الإنسان بالمدينة التي يريد أن يُغيّرها. وقد كان في هذا ما يجعل الوحي يبدأ في مكانٍ لا سلطة فيه، لأن الرسالة لا تبدأ من قصر.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eخديجة وورقة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت خديجة أول من آمن به، وكانت في ذلك الزمان امرأةً ذات مالٍ وتجارةٍ ومكانة، وكان إيمانها به في أول يومٍ من الرسالة، وقد كان في هذا ما جعل لها مكانةً لا تُنازع في تاريخ الإسلام، حتى إن النبيّ كان يذكرها بعد موتها ويُفضّلها على نسائه، وقال فيها: «آمنت بي حين كذّبني الناس».\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان ورقة بن نوفل نصرانياً عالماً بالكتب، وقد كان في مكة من الحنفاء من يعرف شيئاً من كتب الأديان، وقد كان في شهادته للنبيّ أثرٌ في تطمينه: أن هذا الذي نزل عليه هو الناموس الذي نزل على موسى، وأن من يأتي بمثله يُعادَى. وقد مات ورقة بعد ذلك بقليل، ولم يشهد الدعوة، وقد رُوي أن النبيّ رآه في المنام في ثيابٍ بيضاء.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eفترة الوحي\u003c/h4\u003e\u003cp class=\"ap\"\u003eبعد أول نزول، فتر الوحي مدةً اختلفت فيها الروايات، وقد كان في هذه الفترة اختبارٌ للنبيّ: أن يبقى على يقينه حين لا يسمع صوتاً، وأن يتحمّل الشك الذي يُلقيه الشيطان في قلبه، وأن يعرف أن الإيمان ليس شعوراً دائماً بل قراراً في وقت الغياب. وقد كان في هذا الفتور حكمةٌ في التربية: أن الإنسان يحتاج إلى أن يعرف أن الإيمان ليس نشوةً دائمة، وأن من يُريد أن يثبت في الطريق يحتاج إلى يقينٍ لا إلى شعور، وأن الفراغ الذي يخافه المؤمن قد يكون هو المكان الذي يُبنى فيه الصبر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه الفترة أيضاً ما يُعلّمه التواضع: أنه لم يُمنح الوحي لأنه يستحقه، بل لأن الله اختاره، وأن انقطاعه لا يعني تركه. وقد جاء في الحديث أنه قال: «فبينا أنا أمشي سمعتُ صوتاً من السماء»، فرفع رأسه فرأى الملك، فرجع إلى خديجة فقال: «دثّروني»، فأنزل الله: «يا أيها المدثر». وقد كان في هذا أن التكليف جاء بعد الخوف، لا قبله.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسنّ البعثة\u003c/b\u003e\u003cspan\u003eأربعون سنة، في السنة الرابعة عشرة قبل الهجرة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأول ما نزل\u003c/b\u003e\u003cspan\u003eخمس آيات من سورة العلق: «اقرأ باسم ربك الذي خلق».\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأول من آمن\u003c/b\u003e\u003cspan\u003eخديجة بنت خويلد، ثم عليّ بن أبي طالب، ثم أبو بكر.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eورقة بن نوفل\u003c/b\u003e\u003cspan\u003eابن عمّ خديجة، وأول من شهد بالنبوة من أهل الكتاب.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eفترة الوحي\u003c/b\u003e\u003cspan\u003eانقطاعٌ بعد أول نزول، ثم نزول سورة المدثر.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمرحلة\u003c/th\u003e\u003cth\u003eالموضع\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالتحنّث\u003c/td\u003e\u003ctd\u003eغار حراء\u003c/td\u003e\u003ctd\u003eخلوةٌ شهراً كل عام قبل البعثة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eأول نزول\u003c/td\u003e\u003ctd\u003eغار حراء\u003c/td\u003e\u003ctd\u003e«اقرأ باسم ربك الذي خلق»\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالعودة\u003c/td\u003e\u003ctd\u003eبيت خديجة\u003c/td\u003e\u003ctd\u003e«دثّروني» ثم شهادة ورقة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eفترة الوحي\u003c/td\u003e\u003ctd\u003eمكة والجبال\u003c/td\u003e\u003ctd\u003eحزنٌ وانتظار ثم طمأنة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالتكليف\u003c/td\u003e\u003ctd\u003eمكة\u003c/td\u003e\u003ctd\u003e«يا أيها المدثر، قم فأنذر»\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eكلا، والله لا يُخزيك الله أبداً، إنك لتصل الرحم، وتحمل الكَلّ، وتكسب المعدوم، وتُقري الضيف، وتُعين على نوائب الحق.\u003c/p\u003e\u003ccite\u003eخديجة بنت خويلد للنبيّ ﷺ بعد أول نزول الوحي\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eبدأت الرسالة في غارٍ صغير على جبلٍ قريب من مكة، بأمرٍ واحد: «اقرأ». وقد رجع النبيّ خائفاً إلى خديجة، فطمأنته بأعماله لا بالكلام، وشهد له ورقة بالنبوة. ثم فتر الوحي اختباراً، ثم جاء التكليف: «قم فأنذر».\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"secret-dawa","n":"الدعوة السرية","ic":"🤫","part":"القسم الأول: المولد والبعثة","h":"\u003carticle class=\"ch3\" id=\"secret-dawa\" data-toc=\"الدعوة السرية\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الأول: المولد والبعثة\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٣ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e١\u003ci\u003e.\u003c/i\u003e٣\u003c/span\u003e\n            \u003ch3\u003eالدعوة السرية\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eاستمرت الدعوة سرية ثلاث سنوات، وكان النبيّ يدعو من يثق به من أقاربه وأصدقائه، وكان بيت الأرقم بن أبي الأرقم مخبأً للاجتماع، وكان عدد المسلمين في نهاية هذه المرحلة نحو أربعين. وقد كانت هذه السنوات هي التي بُنيت فيها القاعدة الأولى: أناسٌ يعرفون ما يُريدون، ويقبلون التضحية قبل أن يُطالبوا بالحقوق.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eبدأ النبيّ بأهل بيته، فآمنت به خديجة زوجته، وعليّ بن أبي طالب وهو ابن عشر سنين وكان في كفالته، وزيد بن حارثة مولاه. ثم آمن أبو بكر الصديق، وكان رجلاً تاجراً محبوباً في قريش، وقد كان له أثرٌ كبير في الدعوة لأنه دعا من يثق به، فأسلم على يديه عثمان بن عفان والزبير بن العوام وعبد الرحمن بن عوف وسعد بن أبي وقاص وطلحة بن عبيد الله. وقد كان في هؤلاء الخمسة تنوّعٌ في الأنساب والأموال والطبائع، وقد كانوا كلهم من أهل السمعة الحسنة في قومهم، وقد كان في هذا ما جعل الدعوة تُبنى على ثقةٍ اجتماعية لا على حماسةٍ عابرة، لأن الناس كانوا يسألون: من أسلم؟ فيجدون أسماءً يعرفونها ويحترمونها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في اختيار هؤلاء الأوائل حكمة: أنهم كانوا من الشباب في الغالب، وأنهم كانوا من قبائل مختلفة، وأنهم كانوا من ذوي الأخلاق الحسنة، وأنهم لم يكونوا من أهل الجاه والسيادة في قريش أول الأمر، وهذا ما جعل الدعوة تنمو في الطبقة الوسطى قبل أن تصل إلى الأشراف. وقد كان في هذا ما يُشبه ما يحدث في كل حركةٍ تغييرية: أن القاعدة تُبنى من الشباب والوسط قبل القمة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان بيت الأرقم بن أبي الأرقم في أسفل مكة عند الصفا مخبأً للاجتماع، وكان النبيّ يجتمع فيه بأصحابه يقرأ عليهم القرآن ويُعلّمهم، وقد كان في هذا البيت ما يُسمّى «دار الإسلام» الأولى، وقد كان فيه من أسلم من الصحابة عددٌ كبير. وقد كان اختيار هذا البيت موفقاً لأنه في مكانٍ بعيد عن أعين قريش، ولأن صاحبه كان شاباً لا يُثير الشك. وقد كان في هذا البيت أيضاً أن الصلاة فُرضت في أول الأمر ركعتين بالغداة وركعتين بالعشي، وكان النبيّ وأصحابه يُصلّون فيه، وقد كان في هذا ما جعل للمسلمين شعيرةً تجمعهم وتُميّزهم عن قريش، وقد كان في هذا بداية تكوين الهوية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت الدعوة في هذه المرحلة تُبنى على ثلاثة عناصر: قراءة القرآن، وتعليم التوحيد، وتربية الأخلاق. ولم يكن فيها صراعٌ سياسي مع قريش، ولم يكن فيها أمرٌ بالقتال، ولم يكن فيها مواجهةٌ مع الأصنام أمام الناس. وقد كان في هذا تدرّجاً في التكليف: أن يُعلّم الناس الإيمان أولاً، ثم يُكلّفهم بالجهر حين يكونون مستعدّين. وقد كان في هذا التدرّج فقهٌ في الدعوة: أن يُعلَّم الناس العقيدة أولاً، ثم تُفرض عليهم الشرائع، ثم يُؤمرون بالجهر، ثم يُؤمرون بالقتال، وقد كان في هذا ما يجعل التكليف على قدر الطاقة، وأن كل مرحلةٍ تُبنى على ما قبلها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان من أسلم في هذه المرحلة من الموالي والضعفاء: بلال بن رباح، وعمّار بن ياسر وأبوه وأمه سميّة، وصهيب الرومي، وسلمان الفارسي بعد ذلك. وقد كان في إسلام هؤلاء دلالة على أن الرسالة لم تكن دعوةً للأشراف، وأنها لم تعدُ أن تكون طريقاً للفقراء والمستضعفين قبل أن تصير قوةً سياسية. وقد كان في إسلام هؤلاء أيضاً دلالةً على أن الدعوة كانت تُخاطب الإنسان لا طبقته: أن بلالاً كان عبداً فأصبح من أهل الصف الأول، وأن عمّاراً كان من المستضعفين فصار من السابقين، وأن هذا كان يُغضب أشراف قريش لأنهم رأوا أن الدين يجعلهم سواسيةً مع من كانوا يستعبدونهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت هذه السنوات الثلاث سنوات إعدادٍ لا سنوات انتظار؛ فقد كان النبيّ يبني جماعةً لها عقيدةٌ مشتركة، ولها شعائر تُؤدّى، ولها أخلاقٌ تُعرف بها، ولها قيادةٌ مطاعة. وقد كان في هذا ما جعل الجماعة قادرةً على أن تتحمّل ما سيأتي بعد الجهر: من الأذى والحصار والمقاطعة. وقد كان في هذه الجماعة الأولى خصائص لا تُوجد في غيرها: أنهم عرفوا النبيّ شخصياً قبل النبوة، وأنهم لم يدخلوا في الإسلام طمعاً في مالٍ أو جاه، وأنهم تحمّلوا الأذى وهم قلة، وقد كان في هذا ما جعلهم الأساس الذي بُني عليه كل شيء بعد ذلك.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه المرحلة أيضاً أن القرآن كان ينزل آيةً أو آيتين، وكان النبيّ يُبلّغها لأصحابه، وكانوا يحفظونها ويكتبونها، وكان في هذا ما جعل الوحي يُبنى في القلوب تدريجياً لا دفعةً واحدة. وقد كان في هذا حكمةٌ تربوية: أن التربية تحتاج إلى وقت، وأن من يُريد أن يُغيّر الناس لا يستطيع أن يفعل ذلك في يوم. وقد كان في نزول القرآن مُفرّقاً حكمةً أخرى: أن يُثبّت قلب النبيّ، وأن يُجيب على ما يُسأل عنه في وقته، وأن يُربّي الجماعة على حادثةٍ حادثة، وقد قال الله في ذلك: «وقرآناً فرقناه لتقرأه على الناس على مُكث»، وقد كان في هذا منهجاً في التعليم: أن التدرّج أنفع من الدفعة.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالسابقون الأولون\u003c/h4\u003e\u003cp class=\"ap\"\u003eأول من أسلم من الرجال خديجة، ومن الصبيان عليّ، ومن الموالي زيد بن حارثة، ومن الرجال الأحرار أبو بكر. وقد كان في ترتيب هؤلاء دلالةً على أن الرسالة لم تُفرّق بين إنسانٍ وآخر، وأنها بدأت من البيت ثم من الصديق ثم من الناس. وقد كان في هذا الترتيب دلالةً على أن الرسالة لم تُفرّق بين الناس بحسب أنسابهم، وأن أول من آمن كان من أهل البيت ومن الموالي ومن التجار، وقد كان في هذا ما جعل الإسلام قادراً على أن يجمع من لا يجمعهم نسبٌ ولا مال.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في إسلام أبي بكر أثرٌ كبير؛ لأنه كان رجلاً يُحبّه الناس ويثقون به، وكان تاجراً يعرف الناس، فلمّا أسلم دعا من يعرفه، فأسلم على يديه خمسةٌ من العشرة المبشّرين بالجنة. وقد كان في هذا دليلاً على أن الدعوة تحتاج إلى رجالٍ لهم علاقات، وأن العلاقة الاجتماعية قد تكون وسيلةً لنشر الحق.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eدار الأرقم\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان بيت الأرقم بن أبي الأرقم عند الصفا، وكان الأرقم شاباً من بني مخزوم، وقد أسلم وأعطى بيته للنبيّ، وقد كان النبيّ يقيم فيه ويجتمع بأصحابه. وقد كان في هذا البيت تُقرأ السور الأولى من القرآن، وتُعلّم الصلاة، وتُبنى الأخوّة بين من أسلم. وقد كان في هذا البيت أيضاً ما جعل الدعوة تُبنى على الأخوّة لا على القرابة: أن المسلمين كانوا يلتقون فيه وهم من قبائل مختلفة، وأنهم يتعلّمون أن الولاء للإيمان لا للدم، وقد كان في هذا ما سيصير بعد ذلك أساساً لنظام «المؤاخاة» في المدينة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في اختيار هذا البيت ذكاءً في العمل السري: أنه في مكانٍ ليس فيه أشراف قريش، وأن صاحبه شابٌّ ليس موضع أنظار، وأن الدخول إليه كان يتم بترتيبٍ لا يجذب الانتباه. وقد كان في هذا ما يُبيّن أن الدعوة في مرحلتها الأولى كانت تُدار بعقلٍ وتنظيم لا بحماسةٍ فقط.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eلماذا السرّية؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم تكن السرية خوفاً من الحق، بل كانت حكمةً في التوقيت: أن الجماعة كانت قليلةً ضعيفة، وأن الجهر في أول الأمر كان سيُعطي قريش فرصةً لإجهاض الدعوة قبل أن تنمو، وأن القرآن كان ينزل تربيةً لا تشريعاً كاملاً بعد. وقد كان في هذه المرحلة أيضاً أن القرآن كان يركز على التوحيد والبعث والأخلاق، ولم تكن الأحكام التفصيلية قد نزلت بعد، لأن المجتمع المسلم لم يكن قد تشكّل بعد، وقد كان في هذا ما يُبيّن أن التشريع يأتي على قدر الحاجة، وأن الدين يُبنى في القلوب قبل أن يُبنى في المؤسسات.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا منهجاً في العمل العام: أن تُبنى القاعدة أولاً، ثم يُعلن الأمر حين تكون القاعدة قادرةً على التحمّل. وقد كان في هذا أيضاً رحمةً بالناس: أنهم لم يُكلّفوا بما لا يطيقون في أول الأمر، وأن التكليف جاء على قدر الاستطاعة، كما قال الله: «لا يُكلّف الله نفساً إلا وُسعها».\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمدة السرية\u003c/b\u003e\u003cspan\u003eثلاث سنوات، من البعثة إلى الجهر.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eعدد المسلمين\u003c/b\u003e\u003cspan\u003eنحو أربعين في نهاية المرحلة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eدار الأرقم\u003c/b\u003e\u003cspan\u003eبيت عند الصفا، كان مركز الاجتماع والتعليم.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأول من أسلم\u003c/b\u003e\u003cspan\u003eخديجة، ثم عليّ، ثم زيد، ثم أبو بكر.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eعناصر التربية\u003c/b\u003e\u003cspan\u003eقراءة القرآن، وتعليم التوحيد، وتربية الأخلاق.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمرحلة\u003c/th\u003e\u003cth\u003eالمدة\u003c/th\u003e\u003cth\u003eالوسيلة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالدعوة الفردية\u003c/td\u003e\u003ctd\u003eالسنة الأولى\u003c/td\u003e\u003ctd\u003eدعوة الأقارب والأصدقاء\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eدار الأرقم\u003c/td\u003e\u003ctd\u003eسنوات\u003c/td\u003e\u003ctd\u003eاجتماعٌ وتعليمٌ وقراءة قرآن\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eإسلام المستضعفين\u003c/td\u003e\u003ctd\u003eخلال المرحلة\u003c/td\u003e\u003ctd\u003eبلال وعمّار وصهيب وغيرهم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eبناء الجماعة\u003c/td\u003e\u003ctd\u003eثلاث سنوات\u003c/td\u003e\u003ctd\u003eعقيدةٌ وشعائرُ وأخلاقٌ وقيادة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالجهر\u003c/td\u003e\u003ctd\u003eبعد ثلاث سنوات\u003c/td\u003e\u003ctd\u003eنزول «فاصدع بما تُؤمر»\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eآمنت بي حين كذّبني الناس.\u003c/p\u003e\u003ccite\u003eقول النبيّ ﷺ في خديجة بعد موتها\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eثلاث سنوات من العمل الهادئ بنت القاعدة الأولى: أربعون مسلماً من قبائل وطبقات مختلفة، يجتمعون في بيت الأرقم، يقرأون القرآن ويتعلّمون التوحيد. ولم يكن هذا انتظاراً بل إعداداً، لأن الجهر يحتاج إلى جماعةٍ قادرة على التحمّل.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"public-dawa","n":"الجهر بالدعوة","ic":"📢","part":"القسم الأول: المولد والبعثة","h":"\u003carticle class=\"ch3\" id=\"public-dawa\" data-toc=\"الجهر بالدعوة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الأول: المولد والبعثة\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٤ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e١\u003ci\u003e.\u003c/i\u003e٤\u003c/span\u003e\n            \u003ch3\u003eالجهر بالدعوة\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eبعد ثلاث سنوات نزل الأمر بالجهر: «فاصدع بما تُؤمر وأعرض عن المشركين». فصعد النبيّ على الصفا ونادى قبائل قريش، وقال لهم إنه نذيرٌ بين يدي عذابٍ شديد، فكان أول من ردّ عليه أبو لهب، وأنزل الله في ذلك سورة المسد. وقد كانت هذه اللحظة بداية الصراع الذي سيستمر ثلاث عشرة سنة.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eبدأ الجهر بدعوة العشيرة الأقرب: «وأنذر عشيرتك الأقربين»، فدعا النبيّ بني هاشم وبني عبد المطلب إلى طعام، وقال لهم كلمةً واضحة: «إني نذيرٌ لكم بين يدي عذابٍ شديد»، فقام أبو لهب فقال: «تبّاً لك سائر اليوم، ألهذا جمعتنا؟»، فأنزل الله سورة المسد. وقد كان في هذا الرد دلالةً على أن الأقربين قد يكونون أشدّ الناس عداوةً، لأنهم يرون في الدعوة تهديداً لمكانتهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم صعد النبيّ على الصفا ونادى بطون قريش، وقال: «أرأيتم لو أخبرتكم أن خيلاً بالوادي تُريد أن تُغير عليكم أكنتم مُصدّقيّ؟»، قالوا: «نعم، ما جرّبتنا عليك كذباً»، قال: «فإني نذيرٌ لكم بين يدي عذابٍ شديد». وقد كان في هذا الاستهلال ذكاءً في الخطاب: أنه بدأ بما يُصدّقونه فيه، ثم بنى عليه ما يُريد أن يُبلّغه. وقد كان في هذا الاستهلال أيضاً إقرارٌ بأن الصدق شرطٌ في الدعوة: أن من عُرف بالكذب لا يُقبل منه خبرٌ عن الغيب، وأن النبيّ لم يحتج إلى معجزةٍ ليُثبت صدقه في هذه اللحظة، لأن ثلاثين سنة من الأمانة كانت كافية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان ردّ قريش متدرّجاً: أول الأمر استهزاء وسخرية، ثم جدالٌ ومطالبةٌ بمعجزات، ثم أذىً جسدياً على المستضعفين، ثم مقاطعةٌ وحصار. وقد كان في هذا التدرّج ما يُبيّن أن السلطة لا تُواجه الدعوة في أول الأمر بالقوة، لأنها لا تراها خطراً بعد، ثم تكتشف أن الخطر أكبر من أن يُستهان به. وقد كان في هذا التدرّج أيضاً ما جعل الدعوة تُثبت نفسها في كل مرحلة: أنها لم تُواجه بالسيف في أول الأمر، فلم يكن لأحدٍ أن يقول إنها قامت بالقوة، وأنها تحمّلت الأذى سنين حتى صارت قويةً بأهلها لا بسلاحها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان من أساليب قريش في المواجهة: أنهم عرضوا على النبيّ الملك والمال والنساء ليترك دعوته، وأنهم طلبوا منه معجزاتٍ حسّية، وأنهم قالوا إن القرآن أساطير الأولين، وأنهم اتّهموه بالسحر والكهانة والشعر والجنون. وقد كان في هذا كله ما يُبيّن أنهم لم يجدوا في دعوته عيباً، فبحثوا عن أعذارٍ للردّ. وقد كان في هذه العروض ما يُبيّن أن قريشاً كانت تُقدّر الدعوة أكثر مما أظهرت، لأنها لم تعرض على رجلٍ يُريد مالاً أو جاهًا أن يأخذهما ويترك دعواه، بل عرضت عليه ما يُشبه أن يكون اعترافاً بأن دعوته قوةٌ لا تُشترى.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان القرآن يُجيب على هذه الاعتراضات آيةً بآية، وكان في هذا ما جعل الدعوة تُبنى على الحوار لا على الصمت. وقد نزلت سورٌ كاملة في الردّ على مطالب قريش، مثل سورة الإسراء: «وقالوا لن نؤمن لك حتى تفجر لنا من الأرض ينبوعاً»، وقد كان في هذا ما جعل الوحي يُشارك في المعركة الفكرية بشكلٍ مباشر. وقد كان في هذا الحوار القرآني ما جعل الدعوة قادرةً على أن تُواجه كل اعتراضٍ بحجّة، وقد كان في هذا ما جعل بعض العقلاء من قريش يقتنعون ويسكتون، ومنهم من أسلم بعد ذلك، ومنهم من بقي مُعانداً وهو يعرف أنه على باطل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان أشدّ ما لقي النبيّ من الأذى في هذه المرحلة، وقد رُوي أن عقبة بن أبي معيط وضع سلا الجزور على ظهره وهو ساجد عند الكعبة، وأن أبا جهل هدّده، وأن أمّ جميل امرأة أبي لهب كانت تُلقي الشوك في طريقه. وقد كان في هذا كله ما جعل الدعوة تُثبت أنها ليست حركةً سياسيةً تُدار بالحكمة فقط، بل هي موقفٌ يتحمّل صاحبه الأذى من أجله. وقد كان في هذا الأذى أيضاً ما جعل المسلمين يُهاجرون إلى الحبشة بعد ذلك، لأن البقاء في مكة صار خطراً على النفس، وقد كان في هذا ما يُبيّن أن الاضطهاد قد يُنتج هجرةً، وأن الهجرة قد تُنتج قوةً في مكانٍ آخر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه المرحلة أن أُسلم عمر بن الخطاب وحمزة بن عبد المطلب، وكان لإسلامهما أثرٌ كبير في قوة المسلمين. وقد رُوي أن المسلمين كانوا نحو أربعين قبل إسلام عمر، فلمّا أسلم صاروا أقوياء، وأنهم صلّوا عند الكعبة بعد ذلك جهاراً. وقد كان في إسلام عمر دلالةً على أن الدعوة قد تُكسب من كان أشدّ عداوة، وأن الله يُؤيّد دينه بمن يشاء. وقد كان في إسلام عمر أن المسلمين صاروا يصلّون عند الكعبة جهاراً، وقد كان في هذا تحوّلاً في ميزان القوة: أن الدعوة صارت لها حمايةٌ من داخل قريش، وأن الأذى لم يتوقف لكنه صار أخطر على من يُمارسه.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالصفا ونداء العشيرة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الصفا موضعاً معروفاً في مكة، وكان الناس يجتمعون عنده، وكان في نداء النبيّ عليه معنى الإعلان العام: أنه لم يعد يدعو فرداً فرداً، بل صار يُخاطب قريشاً كلها. وقد كان في اختيار هذا المكان ذكاءً: أنه مكانٌ يراه الناس ويسمعونه فيه، وأنه قريبٌ من الكعبة رمز المكانة الدينية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في ندائه ترتيبٌ دقيق: أنه بدأ بأهل بيته، ثم بأقرب البطون، ثم بقريش كلها، ثم بالناس عامة في المواسم. وقد كان في هذا منهجاً في التبليغ: أن تبدأ بمن هو أقرب إليك وأشدّ تأثيراً، ثم تُوسّع الدائرة على قدر ما تتحمّله. وقد كان في هذا التوسّع أيضاً مخاطرةً محسوبة: أن يُعلن قبل أن تكتمل القوة قد يُعطي الخصم فرصةً للضربة الأولى، لكن النبيّ كان يعرف أن الوقت قد حان، وأن التأخير أكثر من ذلك كان سيُفسد على الجماعة تربيةَ الصبر التي بنتها ثلاث سنوات.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eعروض قريش\u003c/h4\u003e\u003cp class=\"ap\"\u003eعرضت قريش على النبيّ أشياء كثيرة: أن يُعطّوه الملك فيصير سيداً عليهم، وأن يجمعوا له مالاً حتى يكون أغنى رجلٍ في مكة، وأن يُزوّجوه من أشرف نسائهم، وأن يُعالجوه إن كان به مرض. وقد كان في هذه العروض دلالةً على أنهم كانوا يعرفون أن الدعوة ليست طمعاً في مالٍ أو جاه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان جوابه كلمةً تُروى: أنه قرأ عليهم سورة فصّلت حتى بلغ: «فإن أعرضوا فقل أنذرتكم صاعقةً مثل صاعقة عادٍ وثمود»، وأن عتبة بن ربيعة الذي جاء مفاوضاً رجع إلى قريش وقال: «إنه يقول قولاً ما سمعتُ مثله، وإنه ليس بالشعر ولا بالسحر ولا بالكهانة». وقد كان في هذا شهادةً من خصم.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eإسلام عمر وحمزة\u003c/h4\u003e\u003cp class=\"ap\"\u003eأسلم حمزة بن عبد المطلب قبل عمر، وكان رجلاً قوياً شريفاً، وقد أسلم غضباً للنبيّ حين سمع أن أبا جهل أذاه، ثم ثبت على الإسلام حتى مات. وقد كان في إسلامه قوةً للمسلمين، لأن قريشاً لم تكن تستطيع أن تُؤذيه. وقد كان في إسلام حمزة دلالةً على أن العصبية القبلية قد تعمل لصالح الدعوة أحياناً: أن رجلاً شريفاً من بني هاشم لا يستطيع أحدٌ أن يضربه أو يُهينه، وأن قريشاً صارت تُحسب ألف حسابٍ قبل أن تُؤذي النبيّ بعد ذلك.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأسلم عمر بن الخطاب بعد ذلك، وقد كان شديداً على المسلمين قبل إسلامه، وقد رُوي أنه خرج يريد قتل النبيّ فلقيه رجلٌ فأخبره أن أخته أسلمت، فرجع إليها وضربها، ثم قرأ صحيفةً فيها طه، فأسلم. وقد كان في إسلامه فرقٌ في ميزان القوة، حتى قيل: «ما كنّا نستطيع أن نُصلّي عند الكعبة حتى أسلم عمر».\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالأمر بالجهر\u003c/b\u003e\u003cspan\u003e«فاصدع بما تُؤمر وأعرض عن المشركين».\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأول من عاداه\u003c/b\u003e\u003cspan\u003eأبو لهب، ونزلت فيه سورة المسد.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأسلوب قريش\u003c/b\u003e\u003cspan\u003eاستهزاءٌ ثم جدالٌ ثم أذىً ثم مقاطعة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eعروض قريش\u003c/b\u003e\u003cspan\u003eالملك والمال والنساء، ورفضها النبيّ.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eإسلام عمر\u003c/b\u003e\u003cspan\u003eبعد حمزة، وكان له أثرٌ كبير في قوة المسلمين.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالأسلوب\u003c/th\u003e\u003cth\u003eالمضمون\u003c/th\u003e\u003cth\u003eجواب القرآن\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالاستهزاء\u003c/td\u003e\u003ctd\u003eسخريةٌ من الدعوة\u003c/td\u003e\u003ctd\u003eتثبيتٌ وتذكيرٌ بسنة الأمم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالجدال\u003c/td\u003e\u003ctd\u003eمطالبةٌ بمعجزات\u003c/td\u003e\u003ctd\u003e«قل إنما أنا بشرٌ مثلكم»\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالاتهام\u003c/td\u003e\u003ctd\u003eسحرٌ وكهانةٌ وشعرٌ وجنون\u003c/td\u003e\u003ctd\u003eبيانٌ بأن القرآن لا يُشبه شيئاً منها\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالعرض\u003c/td\u003e\u003ctd\u003eملكٌ ومالٌ ونساء\u003c/td\u003e\u003ctd\u003eرفضٌ وقراءة سورة فصّلت\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالأذى\u003c/td\u003e\u003ctd\u003eعلى المستضعفين\u003c/td\u003e\u003ctd\u003eأمرٌ بالصبر والصلاة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eما جرّبتنا عليك كذباً.\u003c/p\u003e\u003ccite\u003eجواب قريش للنبيّ ﷺ على الصفا\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eبدأ الجهر بالأقربين ثم بقريش كلها، فردّت قريش بالاستهزاء ثم الجدال ثم الأذى. وقد ثبت النبيّ وأصحابه، وأسلم حمزة وعمر فصار للمسلمين قوة. وقد كانت هذه المرحلة بداية صراعٍ سيستمر ثلاث عشرة سنة، لا على الحق بل على المكانة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-2","n":"القسم الثاني: الحصار والهجرة","ic":"⛰️","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-2\" style=\"--c:#1E6B3A\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e⛰️\u003c/div\u003e\n      \u003ch2\u003eالقسم الثاني: الحصار والهجرة\u003c/h2\u003e\n      \u003cp\u003eبين السنة السابعة من البعثة والسنة الرابعة عشرة منها مرّت الدعوة بأشدّ سنواتها: حصارٌ في شعب أبي طالب ثلاث سنين، وهجرةٌ إلى الحبشة مرتين، وسنةُ حزنٍ مات فيها أبو طالب وخديجة، ورحلةُ الإسراء والمعراج، ثم بيعة العقبة والهجرة إلى المدينة. وقد كانت هذه السنوات هي التي حوّلت الدعوة من جماعةٍ محصورة في مكة إلى أمةٍ لها دارٌ في المدينة.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#blockade\"\u003eالأذى والحصار في الشعب\u003c/a\u003e\u003ca href=\"#abyssinia\"\u003eالهجرة إلى الحبشة\u003c/a\u003e\u003ca href=\"#isra\"\u003eالإسراء والمعراج\u003c/a\u003e\u003ca href=\"#aqaba-hijra\"\u003eبيعة العقبة والهجرة\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"blockade","n":"الأذى والحصار في الشعب","ic":"🚫","part":"القسم الثاني: الحصار والهجرة","h":"\u003carticle class=\"ch3\" id=\"blockade\" data-toc=\"الأذى والحصار في الشعب\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الثاني: الحصار والهجرة\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ١ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٢\u003ci\u003e.\u003c/i\u003e١\u003c/span\u003e\n            \u003ch3\u003eالأذى والحصار في الشعب\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eلمّا عجزت قريش عن أن تردّ الدعوة بالجدال والعرض، لجأت إلى الحصار: أن تُقاطع بني هاشم وبني المطلب جميعاً، مسلماً وكافراً، فلا تُبايعهم ولا تُزوّجهم ولا تُكلّمهم، وأن تُعلّق بذلك صحيفةً في جوف الكعبة. وقد استمر الحصار ثلاث سنين، حتى أكل المسلمون ورق الشجر، وسمع النبيّ من خلف الشعب صوت صبيٍّ يبكي من الجوع.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان سبب الحصار أن الدعوة صارت خطراً على مكانة قريش لا على أصنامها فقط؛ فقد كان بنو هاشم يُحمون النبيّ لأنهم أهله، فلم تستطع قريش أن تصل إليه إلا إذا أخرجته من حمايتهم. وقد كان الحل الذي وجدته أن تُقاطع الحمَلة كلهم، وأن تجعل الحياة في مكة مستحيلةً عليهم، حتى يُسلّموا ابن أخيهم أو يتراجعوا عن حمايته. وقد كان في هذا الاختيار اعترافٌ بأن قوة النبيّ لم تكن في شخصه بل في قبيلته، وأن كسر الجماعة أسهل من كسر الفرد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كُتبت الصحيفة — أو «الصحيفة الجائرة» كما تُسمّى في السير — وتُعلّق في جوف الكعبة، وفيها تعهّدٌ من قريش بأن لا تُبايع بني هاشم ولا بني المطلب، ولا تُزوّجهم ولا تتزوّج منهم، ولا تُكلّمهم ولا تجالسهم، حتى يُسلّموا النبيّ للقتل. وقد كان في هذا العمل دلالةً على أن قريشاً كانت تُدرك أن الحلّ السياسي وحده لا يكفي، وأنها احتاجت إلى إعلانٍ دينيٍّ لتُبرّر الحصار.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد دخل بنو هاشم وبني المطلب شعب أبي طالب، وكانوا نحو أربعين رجلاً مع نسائهم وأطفالهم، وكان فيهم مسلمون وكفار، وقد دخل الكفار معهم لا حبّاً في الإسلام بل حبّاً في القبيلة. وقد كان في هذا الموقف درسٌ في العصبية: أنها قد تحمي الحق أحياناً ولو كان حاملها على غير دينها، وأن القبيلة قد تكون سدًّا في وجه الظلم. وقد كان في هذا الحضور الجماعي ما جعل الحصار يُنتج تماسكاً داخلياً لم يكن موجوداً قبل القطيعة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان الحصار قاسياً إلى حدٍّ لا يُتصوّر: أن الطعام كان يُقطع عنهم، وأنهم كانوا يأكلون ورق الشجر، وأن أصوات الأطفال من الجوع كانت تُسمع من خارج الشعب، وأن بعض الرحمة من قريش كانت تُدخل إليهم طعاماً سراً، وقد رُوي أن حكيم بن حزام كان يحمل الطعام إلى عمّته خديجة وهو في الشعب. وقد كان في هذا العمل مخاطرةً كبيرة، لأن من يُساعد المحاصرين كان يُعرّض نفسه للقطيعة نفسها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد استمر الحصار ثلاث سنوات، وقد كان في هذه السنوات أن أبا طالب تحمّل عبئاً كبيراً، وكان يحرس النبيّ بالليل وينقل مكان نومه، وكان يقول الشعر في الدفاع عنه. وقد كان في موقف أبي طالب درسٌ في الحماية: أنه لم يُسلم، لكنه لم يُسلّم ابن أخيه، وقد كان في هذا ما جعل النبيّ يقول بعد موته إنه في ضحضاحٍ من نار، لولا ذلك لكان في الدرك الأسفل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد انتهى الحصار بجهدٍ من بعض العقلاء في قريش؛ فقد قام هشام بن عمرو العامري ومعه زهير بن أبي أمية والمطعم بن عدي وأبو البختري بن هشام، فاجتمعوا على نقض الصحيفة، وقالوا كلاماً في عيب القطيعة، ثم دخلوا الكعبة فوجدوا الصحيفة قد أكلتها الأرضة إلا اسم الله فيها، فأُبطلت. وقد كان في هذا النهاية صورةً رمزية: أن كلاماً ظالماً كُتب ليُبقى، فأكلته دابةٌ صغيرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه السنوات أثرٌ في المسلمين لا يُقاس: أنهم تعلّموا الصبر على الجوع والخوف، وأنهم عرفوا أن الإيمان قد يُكلّف الإنسان بيته وتجارته وأقاربه، وأنهم صاروا جماعةً أقوى بعد أن خرجوا من الحصار، لأنهم لم يتركوا دينهم وهم في أشدّ حالات الضعف. وقد كان في هذا ما جعلهم يخرجون من الشعب وهم أشدّ يقيناً مما دخلوه. وقد كان في هذا ما جعل المسلمين يخرجون من الشعب وهم يعرفون أن الإيمان لا يُقاس بالراحة، وأن من ثبت في الجوع يثبت في القتال.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الحصار أيضاً درسٌ في السياسة: أن الحصار الشامل لا يُنتج الطاعة بل يُنتج صلابة، وأن الأمة التي تُحاصر تُكتشف نفسها، وأن من يُريد أن يُسقط دعوةً لا يستطيع أن يفعل ذلك بتجويع أتباعها، لأن الجوع يُضعف الجسد ولا يُضعف العقيدة. وقد كان في هذا ما يُفسّر صمود المسلمين بعد ذلك في المدينة في سنواتٍ كانت أشدّ من الحصار. وقد كان في هذا ما جعل بعض من كان في الشعب يذكر الحصار بعد سنوات كأنه كان أمس، لأن الجوع لا يُنسى.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في نقض الصحيفة أن قريشاً نفسها اعترفت بأنها ظلمت، وقد كان في هذا ما جعل بعض أشرافها يُحسّون بالعار، وقد كان في هذا ما مهّد بعد ذلك لبعض المراجعات، وإن لم يُغيّر موقفها من الدعوة. وقد كان في هذا ما جعل بعض أشراف قريش يتردّدون بعد ذلك في إعادة الحصار مرةً ثانية. وقد كان في هذا أيضاً أن المسلمين عرفوا أن الظلم إذا صار عاراً على أهله لم يبقَ له أثرٌ في القلوب، وأن العار سلاحٌ أقوى من السيف في المدى الطويل.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eلماذا الحصار الشامل؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الحصار الشامل قراراً من قريش بأن تُعاقب القبيلة كلها لا الرجل وحده، وكان في هذا اعترافٌ بأن الحماية القبلية هي العقبة الحقيقية أمامها، وأنها لا تستطيع أن تُواجه بني هاشم بالسلاح لأن ذلك يُنتج حرباً داخلية تُضعف مكة. وقد كان في هذا ما جعل القرار صعباً على قريش نفسها، لأن فيه تعريضاً لمصالحها التجارية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا القرار خطأٌ استراتيجي: أنه جعل بني هاشم جميعاً في موقفٍ واحد، وألّف بين قلوبهم، وأعطى النبيّ حمايةً جماعيةً لم يكن يحصل عليها لو بقي فرداً يُدافع عن نفسه، وقد كان في هذا ما يجعل القمع الشامل يُنتج توحّداً لا تفرّقاً. وقد كان في هذا درسٌ في أن القمع الذي يستهدف الجميع يُنتج جماعةً لا أفراداً.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eأبو طالب بين الدين والقبيلة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان أبو طالب شيخ بني هاشم، وكان فقيراً كثير الأولاد، وكان يحبّ ابن أخيه حبّاً شديداً، وقد كان يُدرك أن النبيّ صادق، وقد رُوي أنه قال له كلمةً تُنسب إليه: «اذهب يا ابن أخي فقل ما أحببت، فوالله لا أُسلمك أبداً». وقد كان في هذا الموقف ما جعل النبيّ يُسمّيه «شيخ البطحاء» ويذكره بخير بعد موته.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في موقفه تناقضٌ ظاهر: أنه لم يُسلم مع تصديقه، وقد فسّره العلماء بأنه كان يخشى أن يقول الناس إنه ترك دين آبائه خوفاً أو طمعاً، وأنه أراد أن يحمي النبيّ بالقبيلة لا أن يدخل في الدين. وقد كان في موقفه هذا أثرٌ في تاريخ الدعوة كلها، لأنه لولا حمايته لقتلت قريش النبيّ في أول أمرها.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eنقض الصحيفة\u003c/h4\u003e\u003cp class=\"ap\"\u003eنُقضت الصحيفة بعد ثلاث سنوات، وكان السبب في نقضها أن بعض عقلاء قريش سئموا القطيعة، وأنهم رأوا أن منع الطعام عن الأطفال عارٌ لا سياسة، وقد اجتمع خمسةٌ منهم في المسجد وتكلّموا، ثم دخلوا الكعبة فوجدوا الصحيفة قد أكلتها الأرضة. وقد كان في هذا الخبر ما جعل بعض من كان في الشعب يبكي، لأنهم رأوا في نجاته فرجاً بعد ثلاث سنوات.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا الخبر ما يُشبه المعجزة الصغيرة، وقد كان فيه أيضاً درسٌ في الرأي العام: أن الظلم إذا طال صار ثقيلاً على من يُمارسه أيضاً، وأن الرأي العام قد يتغيّر ولو كان الخصم قوياً، وأن الإنسان يحتاج إلى من يُذكّره بالعار حين ينساه. وقد كان في هذا ما يُبيّن أن الرأي العام قد يكون أقوى من الصحيفة المعلّقة في الكعبة.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمدة الحصار\u003c/b\u003e\u003cspan\u003eثلاث سنوات، في شعب أبي طالب قرب مكة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمقاطعون\u003c/b\u003e\u003cspan\u003eقريش كلها، وبني هاشم وبني المطلب محاصرون.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالصحيفة\u003c/b\u003e\u003cspan\u003eتعهّدٌ بقطع البيع والزواج والكلام، عُلّق في الكعبة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالنقض\u003c/b\u003e\u003cspan\u003eعلى يد خمسةٍ من عقلاء قريش، بعد أن أكلت الأرضة الصحيفة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأثر الحصار\u003c/b\u003e\u003cspan\u003eتعلّم المسلمون الصبر، وازدادت الجماعة صلابة.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمرحلة\u003c/th\u003e\u003cth\u003eالسنة من البعثة\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالأذى الفردي\u003c/td\u003e\u003ctd\u003e٤–٦\u003c/td\u003e\u003ctd\u003eتعذيب المستضعفين كبلال وعمّار\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eبداية الحصار\u003c/td\u003e\u003ctd\u003e٧\u003c/td\u003e\u003ctd\u003eتعليق الصحيفة في الكعبة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eأشدّ سنوات الحصار\u003c/td\u003e\u003ctd\u003e٨–٩\u003c/td\u003e\u003ctd\u003eأكل ورق الشجر وسماع أصوات الأطفال\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eنقض الصحيفة\u003c/td\u003e\u003ctd\u003e١٠\u003c/td\u003e\u003ctd\u003eبجهد خمسةٍ من عقلاء قريش\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eعام الحزن\u003c/td\u003e\u003ctd\u003e١٠\u003c/td\u003e\u003ctd\u003eموت أبي طالب وخديجة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eاذهب يا ابن أخي فقل ما أحببت، فوالله لا أُسلمك أبداً.\u003c/p\u003e\u003ccite\u003eكلمة تُنسب إلى أبي طالب في حماية النبيّ ﷺ\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eثلاث سنوات من الحصار في شعب أبي طالب، قطع فيها الطعام والبيع والزواج، حتى أكل المسلمون ورق الشجر. وقد انتهى الحصار بنقض الصحيفة، لكنه ترك في المسلمين صلابةً لم يكن لهم قبلها، وفي قريش شعوراً بأن الظلم صار عاراً.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"abyssinia","n":"الهجرة إلى الحبشة","ic":"🌊","part":"القسم الثاني: الحصار والهجرة","h":"\u003carticle class=\"ch3\" id=\"abyssinia\" data-toc=\"الهجرة إلى الحبشة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الثاني: الحصار والهجرة\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٢ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٢\u003ci\u003e.\u003c/i\u003e٢\u003c/span\u003e\n            \u003ch3\u003eالهجرة إلى الحبشة\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eفي السنة الخامسة من البعثة أذن النبيّ لأصحابه بالهجرة إلى الحبشة، وقال: «إن بها ملكاً لا يُظلم عنده أحد»، فخرج نحو ثمانين رجلاً وامرأة في هجرتين، وكانت هذه أول هجرةٍ في الإسلام. وقد كانت الهجرة إلى بلدٍ نصراني، بقيادة نجاشي، وفيها خطبةٌ في بلاطه تُعدّ من أروع خطب التاريخ.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان الأذى في مكة قد بلغ حدًّا لا يُحتمل، وخاصةً على المستضعفين من العبيد والموالي، فلمّا رأى النبيّ ذلك أشار على أصحابه بالخروج إلى الحبشة، وكانت في ذلك الوقت مملكةً نصرانية يحكمها ملكٌ يُقال له النجاشي، وكان معروفاً بالعدل. وقد كان في هذا الاختيار حكمةٌ سياسية: أن يُوجد للمسلمين ملجأٌ خارج سلطة قريش، وأن تُخفّف الضغوط عن الجماعة في مكة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد خرجت الهجرة الأولى سنة خمسٍ من البعثة، وكان فيها أحد عشر رجلاً وأربع نساء، وكان فيهم عثمان بن عفان وزوجته رقية بنت النبيّ، وجعفر بن أبي طالب، والزبير بن العوام، وعبد الرحمن بن عوف. ثم خرجت الهجرة الثانية سنة ستٍّ، وكان فيها نحو ثلاثة وثمانين رجلاً وثماني عشرة امرأة، وقد كانت أكبر هجرةٍ في ذلك الوقت. وقد كان في هذا العدد دلالةً على أن الهجرة لم تكن فراراً أفرادياً بل انتقال جماعة كاملة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت الهجرة سرّاً في أول الأمر، لأن قريشاً لم تكن تُريد أن يخرج المسلمون، وكانت تُعيد من تُمسك به إلى مكة وتُعذّبه. وقد رُوي في ذلك خبر عمر بن الخطاب حين خرج علناً قبل إسلامه، وقال: «من أراد أن تثكله أمه أو يُيتم ولده فليتبعني»، وقد كان في هذا دليلاً على أن الهجرة كانت موقفاً سياسياً لا مجرد سفر. وقد كان في هذا ما جعل الهجرة تُشبه إعلان موقفٍ أمام قريش لا مجرد خروجٍ من مكة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد تبع المشركون المهاجرين إلى الساحل، وأرسلوا إلى النجاشي يطلبون منه أن يُسلّمهم، وأرسلوا مع رسلهم هدايا من الجلود وغيرها. وقد كان في هذا الطلب دلالةً على أن قريشاً كانت ترى في هذه الجماعة خطراً لا يُستهان به، وأنها كانت مستعدة أن تُكلّف نفسها سفارةً إلى ملكٍ بعيد لتُعيدهم. وقد كان في هذه السفارة كلفةٌ كبيرة على قريش، وهذا يدل على حجم القلق الذي سببته الجماعة المهاجرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي بلاط النجاشي، قام جعفر بن أبي طالب وخطب خطبةً تُروى إلى اليوم؛ فقد قال: «أيها الملك، كنا قوماً أهل جاهلية، نعبد الأصنام، ونأكل الميتة، ونأتي الفواحش، ونقطع الأرحام، ونسيء الجوار، ويأكل القوي منا الضعيف. فكنا على ذلك حتى بعث الله إلينا رسولاً منا، نعرف نسبه وصدقه وأمانته وعفافه»، ثم ذكر التوحيد والصلاة والزكاة والصيام، ثم ذكر أمر النساء واليتامى.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد سأل النجاشي جعفراً: هل معك شيءٌ مما جاء به عن الله؟ فقرأ عليه صدر سورة مريم: «كهيعص، ذكر رحمة ربك عبده زكريا»، فبكى النجاشي حتى أخضل لحيته، وقال: «إن هذا والذي جاء به موسى ليخرج من مشكاةٍ واحدة». ثم قال: «اذهبوا فأنتم آمنون»، وردّ على قريش هداياها، وقال كلمةً تُروى: «ما كنت لآخذ رشوةً في ديني». وقد كان في هذا الرد ما جعل المسلمين يشعرون أنهم في بلدٍ يُحترم فيه الدين ولو كان مخالفاً لدين الملك.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه الحادثة درسٌ في السياسة الدولية: أن المسلمين استعملوا الحجة والقرآن في بلاط ملكٍ لا يعرفهم، وأنهم لم يطلبوا مالاً ولا سلاحاً بل أماناً، وأن الملك لم يُساعدهم لأنهم ضعفاء بل لأنهم كانوا صادقين. وقد كان في هذا دليلاً على أن الخطاب الديني الصادق قد يُؤثّر في غير المسلمين أكثر من المال. وقد كان في هذا ما جعل بعض بطارقة النجاشي يُسلمون بعد ذلك، وقد كان في هذا أثرٌ في انتشار الإسلام في الحبشة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بقي جعفر في الحبشة نحو عشر سنوات، ولم يرجع إلى المدينة إلا سنة سبعٍ من الهجرة، وقد كان في رجوعه أن النبيّ قال فيه كلمةً تُروى: «ما أدري بأيّهما أفرح، بفتح خيبر أم بقدوم جعفر». وقد كان في هذه السنوات أن المسلمين في الحبشة عاشوا آمنين، وأنهم تعلّموا التجارة، وأن بعضهم أسلم على يدهم من أهل الحبشة. وقد كان في هذه السنوات أن المسلمين في الحبشة تعلّموا لغاتٍ وأسواقاً، وصار بعضهم تجاراً معروفين هناك.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه الهجرة أيضاً أثرٌ في فهم العلاقة بين المسلمين وغيرهم: أنهم عاشوا في بلدٍ نصراني تحت حكم ملكٍ نصراني، ولم يُكلّفوا بالجهاد ولا بالهجرة منه، بل عاشوا بوصفهم أقليةً مسلمةً لها دينها، وقد كان في هذا أصلاً في فقه الأقليات الذي سيُبنى عليه بعد ذلك. وقد كان في هذا أن المسلمين عرفوا أن العيش مع غير المسلمين ممكن إذا وُجد العدل والأمان.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eلماذا الحبشة؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الحبشة أقرب بلدٍ آمنٍ إلى مكة من جهة البحر، وكانت مملكةً قويةً لها أسطول وتجارة، وكانت على النصرانية، وكان ملكها معروفاً بالعدل. وقد كان في هذا كله ما يجعلها ملجأً مناسباً: أنها بعيدة عن سلطة قريش، وقريبة من مكة بحراً، ولها حاكمٌ لا يُظلم عنده أحد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا الاختيار أيضاً دلالةً على أن النبيّ لم يكن يرى في غير المسلمين أعداءً بالضرورة، وأنه كان يُفرّق بين من يعاديه لأسبابٍ سياسية ومن يُنصف الناس ولو كان على غير دينه، وقد كان في هذا ما سيبقى أصلاً في سياسة المسلمين مع الدول الأخرى. وقد كان في هذا ما جعل العلاقة بين المسلمين والحبشة تبقى ودّيةً بعد ذلك، حتى إن النبيّ صلّى على النجاشي حين مات.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eخطبة جعفر أمام النجاشي\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت خطبة جعفر من أهم الخطب في تاريخ الإسلام؛ فقد بدأ بتصوير الجاهلية تصويراً صادقاً: عبادة الأصنام، وأكل الميتة، والفواحش، وقطيعة الأرحام، وسوء الجوار، وأكل القوي للضعيف. ثم قال: «فكنا على ذلك حتى بعث الله إلينا رسولاً منا»، وهذا الترتيب يُبيّن أن الرسالة جاءت لعلاج أمراضٍ حقيقية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الخطبة تفصيلٌ للإسلام: التوحيد، والصلاة، والزكاة، والصيام، والعفاف، وصلة الرحم، وحفظ اليتيم. وقد كان في هذا أن الإسلام عُرض بوصفه نظاماً أخلاقياً واجتماعياً لا مجرد عقيدة، وقد كان في هذا ما جعل النجاشي وبطارقته يقتنعون، حتى قال بعضهم: «إن هذا والذي جاء به موسى ليخرج من مشكاةٍ واحدة».\u003c/p\u003e\u003ch4 class=\"sub\"\u003eأثر الهجرة في قوة المسلمين\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الهجرة إلى الحبشة أول تجربةٍ للمسلمين في العيش خارج مكة، وقد كان فيها أنهم عرفوا أنهم يستطيعون أن يعيشوا بلا قريش، وأنهم يستطيعون أن يُديروا شؤونهم بأنفسهم، وأن لهم مكاناً في العالم غير الجزيرة. وقد كان في هذا الخروج أول انفتاحٍ للمسلمين على العالم خارج الجزيرة العربية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه التجربة أيضاً أن المسلمين تعلّموا التجارة البحرية، وأن بعضهم صار له مالٌ ورحلات، وقد كان في هذا ما سيُفيدهم بعد ذلك حين صارت لهم دولةٌ في المدينة، لأن من عرف البحر عرف طرق الرزق، ومن عرف البلاد عرف كيف يُخاطب الناس. وقد كان في هذا ما جعل الهجرة تجربةً في إدارة شؤون الجماعة بعيداً عن قريش.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالهجرة الأولى\u003c/b\u003e\u003cspan\u003eسنة ٥ من البعثة، أحد عشر رجلاً وأربع نساء.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالهجرة الثانية\u003c/b\u003e\u003cspan\u003eسنة ٦ من البعثة، نحو ٨٣ رجلاً و١٨ امرأة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالنجاشي\u003c/b\u003e\u003cspan\u003eملك الحبشة، ردّ هدايا قريش وقال: «ما كنت لآخذ رشوةً في ديني».\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eخطبة جعفر\u003c/b\u003e\u003cspan\u003eعرضٌ للإسلام في بلاط النجاشي، وقرأ عليه سورة مريم.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eعودة جعفر\u003c/b\u003e\u003cspan\u003eسنة ٧هـ، وفرح النبيّ بقدومه مع فتح خيبر.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمرحلة\u003c/th\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالعدد\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالهجرة الأولى\u003c/td\u003e\u003ctd\u003e٥ من البعثة\u003c/td\u003e\u003ctd\u003e١١ رجلاً و٤ نساء\u003c/td\u003e\u003ctd\u003eخروجٌ سرّاً إلى الحبشة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالهجرة الثانية\u003c/td\u003e\u003ctd\u003e٦ من البعثة\u003c/td\u003e\u003ctd\u003e٨٣ رجلاً و١٨ امرأة\u003c/td\u003e\u003ctd\u003eأكبر هجرةٍ قبل المدينة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eسفارة قريش\u003c/td\u003e\u003ctd\u003e٦–٧\u003c/td\u003e\u003ctd\u003eعمرو بن العاص وعبد الله بن أبي ربيعة\u003c/td\u003e\u003ctd\u003eطلبُ تسليم المهاجرين\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eخطبة جعفر\u003c/td\u003e\u003ctd\u003e٦–٧\u003c/td\u003e\u003ctd\u003eفي بلاط النجاشي\u003c/td\u003e\u003ctd\u003eرفضُ التسليم وقبولُ الإسلام\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالعودة\u003c/td\u003e\u003ctd\u003e٧هـ\u003c/td\u003e\u003ctd\u003eوفدٌ كبير\u003c/td\u003e\u003ctd\u003eقدوم جعفر إلى المدينة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eإن هذا والذي جاء به موسى ليخرج من مشكاةٍ واحدة.\u003c/p\u003e\u003ccite\u003eالنجاشي بعد قراءة سورة مريم في بلاطه\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eكانت الهجرة إلى الحبشة أول ملجأٍ للمسلمين خارج مكة، وفيها عاشوا آمنين تحت حكم ملكٍ عادل. وقد دافع جعفر عنهم بخطبةٍ عرضت الإسلام نظاماً أخلاقياً، فردّ النجاشي هدايا قريش، وكان في هذا أول درسٍ في السياسة الدولية للمسلمين.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"isra","n":"الإسراء والمعراج","ic":"🌌","part":"القسم الثاني: الحصار والهجرة","h":"\u003carticle class=\"ch3\" id=\"isra\" data-toc=\"الإسراء والمعراج\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الثاني: الحصار والهجرة\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٣ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٢\u003ci\u003e.\u003c/i\u003e٣\u003c/span\u003e\n            \u003ch3\u003eالإسراء والمعراج\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eفي السنة العاشرة أو الحادية عشرة من البعثة، في وقتٍ كان فيه النبيّ في أشدّ حالات الحزن بعد موت خديجة وأبي طالب، أُسري به ليلاً من المسجد الحرام إلى المسجد الأقصى، ثم عُرج به إلى السماء. وقد كانت هذه الرحلة معجزةً لا تُقاس بالعقل، وكانت في الوقت نفسه تثبيتاً لقلبٍ كان على وشك أن ينكسر.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكانت السنة العاشرة من البعثة سنةً ثقيلة: مات أبو طالب، وماتت خديجة في عامٍ واحد، فسُمّي «عام الحزن»، وتوقّف الوحي فترةً، واشتدّ الأذى من قريش بعد أن فقد النبيّ حاميه وزوجته. وقد كان في هذا الوقت أن خرج النبيّ إلى الطائف يدعو ثقيفاً، فردّوه ردًّا قبيحاً، وأغروا به سفهاءهم، فرجع إلى مكة وهو في حالٍ لا يعلمها إلا الله. وقد كان في هذا الوقت ما يجعل الرحلة تثبيتاً قبل أن تكون تكريماً.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي هذه الفترة كانت رحلة الإسراء والمعراج؛ فقد أُسري به ليلاً من المسجد الحرام إلى المسجد الأقصى، وقد وصف القرآن ذلك في أول سورة الإسراء: «سبحان الذي أسرى بعبده ليلاً من المسجد الحرام إلى المسجد الأقصى الذي باركنا حوله»، ثم عُرج به إلى السماء، وقد وردت تفاصيل ذلك في أحاديث كثيرة في الصحيحين. وقد كان في القرآن إشارةٌ إلى المسجد الأقصى وبركته، وهذا ما جعل القدس حاضرةً في الوعي الإسلامي من أول الأمر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الرحلة أمورٌ كثيرة: أنه صلّى بالأنبياء إماماً في المسجد الأقصى، وأنه رأى في السماوات آدم ويوسف ويحيى وعيسى وإدريس وهارون وموسى وإبراهيم، وأنه فُرضت عليه الصلوات الخمس، وأنه رأى البيت المعمور وسدرة المنتهى. وقد كان في هذا كله ما يُثبّت أن الرسالة ليست بدعةً جديدة بل هي امتدادٌ لرسالات الأنبياء كلهم. وقد كان في هذا ما يُبيّن أن الإسلام لم يأتِ بدينٍ جديد بل بتصديق رسالات الأنبياء وتكميلها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في فرض الصلوات الخمس في هذه الليلة دلالةً على أن الصلاة هي الصلة التي تُعوّض النبيّ عن كل ما فقده: عن خديجة، وعن أبي طالب، وعن الأمان في مكة. وقد رُوي أن الصلاة فُرضت خمسين ثم خُفّفت إلى خمس، وأن موسى قال للنبيّ: «ارجع إلى ربك فاسأله التخفيف»، وقد كان في هذا ما يُبيّن أن التخفيف رحمةٌ وأن الصلاة عبءٌ محبوب. وقد كان في هذا ما جعل الصلاة تُسمّى «معراج المؤمن»، لأنها صلةٌ مباشرة لا تحتاج إلى وسيط.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان ردّ قريش على الخبر أن كذّبوه، وكان أشدّ ما قالوه: «إن قافلةً تستغرق شهراً في الطريق، فكيف تذهب وتعود في ليلة؟» وقد كان في هذا الرد دلالةً على أنهم كانوا يُقيسون الغيب بالحسّ، وأن المعجزة لا تُقنع من لا يُريد أن يُقتنع. وقد قال أبو بكر حين سمع الخبر: «إن كان قال فقد صدق»، فسُمّي الصدّيق. وقد كان في هذا الموقف تعريفٌ للصدق: أن يُصدّق المرء من عرف أمانته ثلاثين سنة، لا أن يُصدّق ما يوافق هواه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الرحلة أيضاً مسألة المسجد الأقصى: أنها ربطت الدعوة بالقدس، وأنها جعلت للمسلمين حقًّا في تلك الأرض لا لأنهم فتحوها بل لأن النبيّ صلّى فيها إماماً للأنبياء. وقد كان في هذا ما يُفسّر اهتمام المسلمين بالقدس في كل تاريخهم، وأنها لم تكن عندهم مدينةً عاديةً في بلاد الشام. وقد كان في هذا ما جعل فتح القدس بعد ذلك حدثاً دينياً لا فتحاً عسكرياً فقط.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الرحلة أن بعض المسلمين ارتدّوا بعد تصديق الخبر، وأن بعضهم ثبت، وقد كان في هذا اختباراً للجماعة: أن الإيمان ليس تصديقاً لما يُرى فقط، بل تصديقاً لما يُخبر به الصادق ولو خالف الحسّ. وقد كان في هذا ما جعل الجماعة أكثر تمييزاً بين من يُصدّق بالدليل ومن يُصدّق بالعادة. وقد كان في هذا أن بعض المسلمين ارتدّوا، وأن بعضهم ثبت، فصار في الجماعة تمييزٌ بين من آمن بالعادة ومن آمن بالحجة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه الليلة أيضاً أن النبيّ وصف بيت المقدس لقريش حين سألوه، وكان لم يرَه قبل ذلك، فجُعل له يراه في الحال، ووصفه وصفاً دقيقاً حتى قال له من كان قد رآه: «صدقت». وقد كان في هذا دليلاً على أن المعجزة قد تكون جواباً على سؤالٍ محدد، لا عرضاً للقوة. وقد كان في هذا ما جعل المعجزة جواباً على سؤالٍ محدد، لا استعراضاً للقوة أمام من لا يُريد أن يُؤمن.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت هذه الرحلة نقطة تحوّلٍ في مسار الدعوة: أن النبيّ صار يتكلّم عن آفاقٍ أبعد من مكة، وأن المسلمين صار لهم أفقٌ عالمي، وأن مكة لم تبقَ مركز العالم في نظرهم بل صارت واحدةً من ثلاثة مساجد. وقد كان في هذا ما مهّد للهجرة بعد ذلك، لأن من عرف أن الأرض أوسع من مكة يستطيع أن يهجرها. وقد كان في هذا ما جعل الهجرة ممكنةً بعد ذلك، لأن من عرف أن الأرض أوسع من مكة لا يخاف من تركها.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eلماذا في هذا الوقت؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eجاءت الرحلة في أشدّ وقتٍ على النبيّ: بعد موت زوجته وعمّه، وبعد ردّ ثقيف، وبعد أن اشتدّ الأذى. وقد كان في هذا التوقيت معنىً واضحاً: أن الله يُثبّت عبده حين تنقطع الأسباب، وأن التكريم قد يأتي في لحظة الفشل الظاهري لا في لحظة النجاح. وقد كان في هذا ما جعل المسلمين يتعلّمون أن الفرج قد يأتي من حيث لا يحتسبون.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا أيضاً ما يُعلّم المسلمين أن الفرج قد يكون في صورةٍ لا يتوقّعونها: أنهم كانوا ينتظرون مخرجاً في مكة، فجاء المخرج من السماء أولاً، ثم من المدينة بعد ذلك. وقد كان في هذا ما يجعل الصبر على الشدة جزءاً من الطريق لا استثناءً منه. وقد كان في هذا ما جعل الصبر على الشدة جزءاً من الطريق لا استثناءً منه.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالصلوات الخمس\u003c/h4\u003e\u003cp class=\"ap\"\u003eفُرضت الصلوات الخمس في هذه الليلة، وكانت في أول الأمر خمسين، ثم خُفّفت إلى خمس في الأجر وخمسين في العمل، وقد رُوي أن النبيّ سأل ربه التخفيف مراراً بعد مشورة موسى، وقد كان في هذا ما يُبيّن أن الشريعة تُبنى على التيسير لا على التعسير. وقد كان في هذا ما جعل الصلاة أوسع العبادات في التخفيف، لأنها تُصلّى قاعداً ومضطجعاً وإيماءً.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في فرض الصلاة في السماء دلالةً على مكانتها: أنها لم تُفرض على الأرض كما فُرض الصيام والزكاة، بل فُرضت في أعلى مكان، وقد كان في هذا ما جعل الصلاة عمود الدين، وأنها الصلة المباشرة بين العبد وربه، وأنها تُصلّى في كل حالٍ حتى في الخوف والمرض. وقد كان في هذا ما جعل الصلاة أول ما يُحاسب عليه العبد، لأنها الصلة التي لا تنقطع.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eتكذيب قريش وتصديق أبي بكر\u003c/h4\u003e\u003cp class=\"ap\"\u003eلمّا أخبر النبيّ قريشاً بالرحلة، كذّبوه وسخروا، وذهبوا إلى أبي بكر فقالوا: «أما تسمع ما يقول صاحبك؟»، فقال: «إن كان قال فقد صدق»، فسُمّي الصدّيق. وقد كان في هذا الموقف تعريفٌ للإيمان: أن يُصدّق المرء من عرف صدقه، ولو خالفت الرواية ما يعرفه من قوانين الطبيعة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في تكذيب قريش دلالةً على أنهم لم يكونوا يُنكرون صدق النبيّ في التجارة والأمانة، بل كانوا يُنكرون أن يكون رسولاً، وقد كان في هذا ما يُبيّن أن المشكلة لم تكن في الأدلة بل في الإرادة، وأن من رفض الحق لأجل مكانته لا تُقنعه معجزة. وقد كان في هذا ما جعل الإيمان تصديقاً للصادق لا تصديقاً لما يعتاده الناس.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالتوقيت\u003c/b\u003e\u003cspan\u003eالسنة ١٠ أو ١١ من البعثة، بعد عام الحزن.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمسرى\u003c/b\u003e\u003cspan\u003eمن المسجد الحرام إلى المسجد الأقصى في ليلة واحدة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمعراج\u003c/b\u003e\u003cspan\u003eالصعود إلى السماء ورؤية الأنبياء والبيت المعمور.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالصلاة\u003c/b\u003e\u003cspan\u003eفُرضت خمسين ثم خُفّفت إلى خمس في هذه الليلة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأبو بكر\u003c/b\u003e\u003cspan\u003eصدّقه فوراً فسُمّي الصدّيق.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمرحلة\u003c/th\u003e\u003cth\u003eالمكان\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eعام الحزن\u003c/td\u003e\u003ctd\u003eمكة\u003c/td\u003e\u003ctd\u003eموت أبي طالب وخديجة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالطائف\u003c/td\u003e\u003ctd\u003eالطائف\u003c/td\u003e\u003ctd\u003eردّ ثقيف وإغراء سفهائهم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالإسراء\u003c/td\u003e\u003ctd\u003eالمسجد الأقصى\u003c/td\u003e\u003ctd\u003eالصلاة بالأنبياء إماماً\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمعراج\u003c/td\u003e\u003ctd\u003eالسماوات\u003c/td\u003e\u003ctd\u003eرؤية الأنبياء وفرض الصلوات\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالعودة\u003c/td\u003e\u003ctd\u003eمكة\u003c/td\u003e\u003ctd\u003eتكذيب قريش وتصديق أبي بكر\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eإن كان قال فقد صدق.\u003c/p\u003e\u003ccite\u003eأبو بكر الصديق حين أخبره المشركون بخبر الإسراء\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eجاءت الرحلة في أشدّ لحظةٍ على النبيّ، فكانت تثبيتاً لا مجرد معجزة. وقد ربطت الدعوة بالقدس، وفرضت الصلوات الخمس، وفرّقت بين من يُصدّق بالدليل ومن يُصدّق بالعادة، فسُمّي أبو بكر بعدها الصدّيق.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"aqaba-hijra","n":"بيعة العقبة والهجرة","ic":"🐪","part":"القسم الثاني: الحصار والهجرة","h":"\u003carticle class=\"ch3\" id=\"aqaba-hijra\" data-toc=\"بيعة العقبة والهجرة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الثاني: الحصار والهجرة\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٤ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٢\u003ci\u003e.\u003c/i\u003e٤\u003c/span\u003e\n            \u003ch3\u003eبيعة العقبة والهجرة\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eفي السنة الحادية عشرة والثانية عشرة من البعثة، جاء إلى مكة وفدٌ من يثرب (المدينة) فبايع النبيّ على الإسلام، ثم جاء وفدٌ أكبر في العام التالي فبايع على النصرة والدفاع. وقد كانت هاتان البيعتان — بيعة العقبة الأولى والثانية — بداية تكوين الدولة، لأنها أعطت الدعوة أرضاً وقوةً بشرية بعد ثلاثة عشر عاماً من العمل في مكة.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان في يثرب قبيلتان كبيرتان: الأوس والخزرج، وكانت بينهما حروبٌ طويلة استمرت سنوات، وكان في المدينة يهودٌ من بني قينقاع والنضير وقريظة، وكانت المدينة مدينةً زراعيةً فيها نخيل ومياه، وكانت على طريق التجارة إلى الشام. وقد كان في هذا الوضع ما يجعلها أرضاً مناسبةً لدولةٍ جديدة: فيها خصومةٌ تحتاج إلى حكم، وفيها أرضٌ تُطعم، وفيها موقعٌ بين مكة والشام.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان أول اتصالٍ بين النبيّ والمدينة في موسم الحج، حين لقيه نفرٌ من الخزرج فدعاهم إلى الإسلام فأسلموا، ثم رجعوا إلى المدينة فذكروا أمر النبيّ لقومهم، فانتشر الإسلام فيها. وقد كان في هذا دليلاً على أن الدعوة انتشرت في المدينة بالكلمة لا بالسيف، وأن أهلها كانوا يبحثون عن مخرجٍ من حروبهم. وقد كان في هذا البحث عن مخرجٍ ما جعل المدينة تُقبل على الإسلام إقبالاً سريعاً.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي السنة الحادية عشرة من البعثة جاء وفدٌ من المدينة في موسم الحج، وكانوا اثني عشر رجلاً، فبايعوا النبيّ عند العقبة على أن لا يُشركوا بالله شيئاً، ولا يسرقوا، ولا يزنوا، ولا يقتلوا أولادهم، ولا يأتوا ببهتانٍ يفترونه، ولا يعصوه في معروف. وقد كانت هذه «بيعة العقبة الأولى»، وقد كانت بيعةً على الإسلام والأخلاق لا على القتال. وقد كان في هذا أن الإسلام عُرض أول الأمر بوصفه أخلاقاً قبل أن يُعرض بوصفه سلطة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي السنة الثانية عشرة — وقيل الثالثة عشرة — جاء وفدٌ أكبر، وكانوا ثلاثة وسبعين رجلاً وامرأتين، فبايعوا النبيّ عند العقبة على أن يمنعوه مما يمنعون منه أنفسهم وأولادهم ونساءهم، وأن ينصروه إذا قدم إليهم. وقد كانت هذه «بيعة العقبة الثانية»، وقد كانت بيعةً على النصرة والدفاع، أي أنها كانت إعلان قيام تحالفٍ سياسي عسكري. وقد كان في هذه البيعة ما جعل المدينة داراً للإسلام قبل أن تكون دار هجرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في البيعة الثانية أن النبيّ اختار من أهل المدينة اثني عشر نقيباً، تسعةً من الخزرج وثلاثةً من الأوس، وكانوا مسؤولين عن قومهم في الإسلام. وقد كان في هذا أول تنظيمٍ إداري للمسلمين، وأول توزيعٍ للمسؤوليات، وقد كان في هذا ما جعل المدينة مستعدةً لاستقبال النبيّ بعد ذلك. وقد كان في هذا التنظيم ما جعل المدينة قادرةً على استقبال مئات المهاجرين في أشهر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في البيعة الثانية أن العباس بن عبد المطلب — وكان يومئذٍ على دين قومه — حضر وتكلّم، وقد كان في حضوره دلالةً على أن الأمر لم يكن سرًّا في هذه المرة، وأن بني هاشم كانوا يعرفون ما يجري. وقد كان في هذا ما يُبيّن أن الهجرة كانت مُدبَّرةً بترتيب، لا هروباً مفاجئاً. وقد كان في هذا ما يُبيّن أن الهجرة كانت قراراً مُدبّراً لا ردة فعلٍ على الأذى.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم أذن النبيّ لأصحابه بالهجرة إلى المدينة، فخرجوا أرسالاً، وكان أول من خرج أبو سلمة، ثم تتابع الناس، وكان فيهم من خرج بماله وأهله، ومن خرج وحده. وقد كان في هذا أن مكة صارت تخلو من المسلمين، وأن قريشاً بدأت تُدرك أن الخطر صار خارج مكة لا داخلها. وقد كان في هذا ما جعل قريشاً تُغيّر خطابها من «من يُريد أن يخرج فليخرج» إلى التخطيط للقتل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هجرة المسلمين إلى المدينة ما جعل قريشاً تُخطّط لقتل النبيّ، فاجتمعوا في دار الندوة، واتفقوا على أن يأخذوا من كل قبيلةٍ شابًّا قويًّا، فيضربوه ضربة رجلٍ واحد، فيتفرّق دمه بين القبائل فلا يستطيع بنو هاشم أن يُطالبوا بدمه. وقد كان في هذا التخطيط ذكاءً سياسيًّا: أن يُوزّع المسؤولية على الجميع، وقد كان في هذا ما يُبيّن أن قريشاً كانت تعرف أن قتل رجلٍ واحد من قبيلةٍ سيُنتج حرباً.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه المرحلة أن النبيّ أذن لأصحابه بالهجرة قبل أن يهاجر هو، وقد كان في هذا ترتيباً حكيماً: أن تُهيّأ الأرض قبل أن يصل القائد، وأن يكون في المدينة من يستقبله، وقد كان في هذا منهجاً في الانتقال: أن لا تُنتقل إلى مكانٍ لا تعرف فيه أحداً. وقد كان في هذا منهجاً في الانتقال: أن تُهيّأ الأرض قبل وصول القائد، وأن يكون في المكان من يعرفه.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eبيعة العقبة الأولى\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت البيعة الأولى سنة إحدى عشرة من البعثة، وكان عدد أهلها اثني عشر رجلاً، وقد كانت بيعةً على الإسلام والأخلاق: التوحيد، وترك السرقة والزنا وقتل الأولاد والقذف، وطاعة النبيّ في المعروف. وقد كان في هذا أن الإسلام عُرض على المدينة بوصفه نظاماً أخلاقياً أولاً.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه البيعة أن النبيّ بعث معهم مصعب بن عمير يُعلّمهم القرآن، وكان مصعب أول سفيرٍ في الإسلام، وقد نجح في المدينة نجاحاً كبيراً، حتى أسلم على يديه سعد بن معاذ وأسيد بن حضير، وكان لإسلامهما أثرٌ في إسلام بني عبد الأشهل كلهم. وقد كان في هذا دليلاً على أن الداعية المخلص قد يُغيّر مدينةً كاملة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eبيعة العقبة الثانية\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت البيعة الثانية سنة اثنتي عشرة أو ثلاث عشرة من البعثة، وكان فيها ثلاثة وسبعون رجلاً وامرأتان، وقد كانت بيعةً على النصرة والدفاع، وقد قال النبيّ لهم: «تُبايعوني على أن تمنعوني مما تمنعون منه أنفسكم وأولادكم»، فقالوا: «نعم»، وقد كان في هذا أنهم صاروا مسؤولين عن حماية النبيّ بدمائهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه البيعة اختيار اثني عشر نقيباً، وقد كان في هذا تنظيمٌ سياسي للمدينة قبل الهجرة، وأن النبيّ صار له نوّابٌ في المدينة يُديرون شؤون المسلمين فيها. وقد كان في هذا ما يجعل الهجرة انتقالاً إلى دولةٍ قائمةٍ لا إلى مكانٍ مجهول، وقد كان في هذا فرقٌ بين الهجرة إلى الحبشة والهجرة إلى المدينة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eدار الندوة ومؤامرة القتل\u003c/h4\u003e\u003cp cla
