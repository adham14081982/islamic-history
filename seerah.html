ss=\"ap\"\u003eلمّا علمت قريش أن المسلمين يخرجون إلى المدينة، وأن النبيّ سيتبعهم، اجتمعوا في دار الندوة — وهي دار قصي بن كلاب التي كانت تُدار فيها شؤون مكة — واتفقوا على قتله. وقد كان في اجتماعهم أن أبا جهل اقترح أن يُؤخذ من كل قبيلةٍ شابٌّ قويٌّ فيُضرب النبيّ ضربة رجلٍ واحد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا الاقتراح أن الدم يُوزّع على القبائل، فلا يستطيع بنو هاشم أن يُطالبوا به، لأنهم سيواجهون قريشاً كلها. وقد كان في هذا دلالةً على أن قريشاً كانت تعرف قوة العصبية، وأنها كانت تُخطّط على أساسها، وقد كان في هذا ما يجعل الهجرة ضرورةً لا خياراً.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eبيعة العقبة الأولى\u003c/b\u003e\u003cspan\u003e١١ من البعثة، ١٢ رجلاً، بيعةٌ على الإسلام والأخلاق.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eبيعة العقبة الثانية\u003c/b\u003e\u003cspan\u003e١٢–١٣ من البعثة، ٧٣ رجلاً وامرأتان، بيعةٌ على النصرة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالنقباء\u003c/b\u003e\u003cspan\u003e١٢ نقيباً، ٩ من الخزرج و٣ من الأوس.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمصعب بن عمير\u003c/b\u003e\u003cspan\u003eأول سفيرٍ في الإسلام، بعثه النبيّ إلى المدينة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eدار الندوة\u003c/b\u003e\u003cspan\u003eفيها اتُّفق على قتل النبيّ، فكانت الهجرة.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالبيعة\u003c/th\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالعدد\u003c/th\u003e\u003cth\u003eالمضمون\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eلقاء الحج الأول\u003c/td\u003e\u003ctd\u003e١٠ من البعثة\u003c/td\u003e\u003ctd\u003eنفرٌ من الخزرج\u003c/td\u003e\u003ctd\u003eدعوةٌ وإسلامٌ أول\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالعقبة الأولى\u003c/td\u003e\u003ctd\u003e١١\u003c/td\u003e\u003ctd\u003e١٢ رجلاً\u003c/td\u003e\u003ctd\u003eبيعةٌ على الإسلام والأخلاق\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eإرسال مصعب\u003c/td\u003e\u003ctd\u003e١١\u003c/td\u003e\u003ctd\u003eسفيرٌ واحد\u003c/td\u003e\u003ctd\u003eتعليمُ القرآن في المدينة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالعقبة الثانية\u003c/td\u003e\u003ctd\u003e١٢–١٣\u003c/td\u003e\u003ctd\u003e٧٣ رجلاً وامرأتان\u003c/td\u003e\u003ctd\u003eبيعةٌ على النصرة والدفاع\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eاختيار النقباء\u003c/td\u003e\u003ctd\u003e١٢–١٣\u003c/td\u003e\u003ctd\u003e١٢ نقيباً\u003c/td\u003e\u003ctd\u003eأول تنظيمٍ إداري للمسلمين\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eتُبايعوني على أن تمنعوني مما تمنعون منه أنفسكم وأولادكم.\u003c/p\u003e\u003ccite\u003eالنبيّ ﷺ في بيعة العقبة الثانية\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eبيعتا العقبة حوّلتا الدعوة من جماعةٍ في مكة إلى أمةٍ لها أرضٌ ونقباء ونظام. وقد سبقت الهجرة تنظيمٌ دقيق: سفيرٌ يُعلّم، وبيعةٌ على النصرة، ونقباء يُديرون، ثم خروجٌ مرتّب. وقد كانت المدينة مستعدةً قبل أن يصل النبيّ.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-3","n":"القسم الثالث: بناء الدولة في المدينة","ic":"🕌","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-3\" style=\"--c:#1E6B3A\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🕌\u003c/div\u003e\n      \u003ch2\u003eالقسم الثالث: بناء الدولة في المدينة\u003c/h2\u003e\n      \u003cp\u003eفي السنة الأولى للهجرة وصل النبيّ إلى المدينة، فبدأت مرحلةٌ جديدة تماماً: لم تكن دعوةً بين قومٍ يُعاندون، بل كانت بناءً لدولةٍ لها مسجدٌ ووثيقةٌ وأسواقٌ وجيش. وقد كانت هذه السنوات الست هي التي حوّلت الجماعة من مهاجرين وأنصارٍ إلى أمةٍ ذات نظام، وحسمت بقاءها في ثلاث معارك كبرى: بدر وأُحد والخندق.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#arrival-mosque\"\u003eالوصول والمسجد والوثيقة\u003c/a\u003e\u003ca href=\"#badr\"\u003eبدر الكبرى\u003c/a\u003e\u003ca href=\"#uhud\"\u003eأُحد ودرس الطاعة\u003c/a\u003e\u003ca href=\"#khandaq\"\u003eالخندق والأحزاب\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"arrival-mosque","n":"الوصول والمسجد والوثيقة","ic":"🏗️","part":"القسم الثالث: بناء الدولة في المدينة","h":"\u003carticle class=\"ch3\" id=\"arrival-mosque\" data-toc=\"الوصول والمسجد والوثيقة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الثالث: بناء الدولة في المدينة\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ١ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٣\u003ci\u003e.\u003c/i\u003e١\u003c/span\u003e\n            \u003ch3\u003eالوصول والمسجد والوثيقة\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eخرج النبيّ من مكة مهاجراً ومعه أبو بكر، واختفيا في غار ثور ثلاث ليالٍ، ثم سلكا طريقاً ساحلياً لم يسلكه أحد قبلهما، حتى وصلا إلى قباء ثم إلى المدينة. وقد كان أول ما فعله في المدينة أن بنى مسجداً، ثم كتب وثيقةً نظّمت العلاقة بين المهاجرين والأنصار واليهود، وهي التي تُعدّ أول دستورٍ في تاريخ الإسلام.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eخرج النبيّ من مكة ليلة الهجرة ومعه أبو بكر، وقد كان المشركون قد أحاطوا ببيته، وقد نام عليّ بن أبي طالب في فراشه تلك الليلة ليعمّي عليهم، وقد كان في هذا التضحية التي جعلت الخروج ممكناً. وقد مكث النبيّ وأبو بكر في غار ثور ثلاث ليالٍ، وكان عبد الله بن أبي بكر يأتيهما بالأخبار، وأسماء بنت أبي بكر تأتي بالطعام، وعامر بن فهيرة يرعى الغنم ليُخفي الأثر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الغار خبرٌ يُروى في الصحيح: أن أبا بكر قال: «يا رسول الله، لو أن أحدهم نظر تحت قدميه لأبصرنا»، فقال النبيّ: «ما ظنّك باثنين الله ثالثهما». وقد كان في هذه الكلمة ما جعل أبا بكر يطمئنّ في أشدّ لحظة، وقد أنزل الله في ذلك: «إذ يقول لصاحبه لا تحزن إن الله معنا». وقد لبثا في الغار ثلاث ليال، وكان عبد الله بن أبي بكر يأتيهما بأخبار قريش كل ليلة، وعامر بن فهيرة يرعى الغنم فيمحو أثر عبد الله، وأسماء بنت أبي بكر تحمل إليهما الزاد. وقد ضربت هذه التفاصيل مثلاً في التنظيم الدقيق: أن الهجرة لم تكن فراراً عشوائياً بل خطةً محكمة، فيها استطلاعٌ وسِترٌ وتمويهٌ على الطلب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد سلك النبيّ طريقاً ساحلياً غير الطريق المعتاد، وكان دليله عبد الله بن أُريقط، وقد كان مشركاً في ذلك الوقت، وقد كان في هذا دلالةً على أن الاستعانة بغير المسلم في أمرٍ مباحٍ جائزة، وأن الكفاءة تُقدّم على المخالفة في الدين في بعض الأحوال. وقد وصل النبيّ إلى قباء في شهر ربيع الأول، وأقام فيها أياماً، وأسّس فيها مسجداً، وهو أول مسجدٍ بُني في الإسلام بعد الهجرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم دخل المدينة، وكان أهلها ينتظرونه، وقد رُوي أنهم صعدوا على السطوح ينظرون، وكان أول من رآه رجلٌ من اليهود قال: «يا معشر يهود، هذا صاحبكم»، وقد كان في هذا دلالةً على أن اليهود كانوا يعرفون علامات النبوة قبل أن يُسلموا، وأن معرفتهم لم تُنفعهم لأنهم رفضوا. وقد رُوي أن بعض أحبارهم كان يقول لأصحابه إن هذه لدار المهاجر، وإن علامات النبوة لتُطابق ما في كتبهم، ثم يُخفي ذلك حسداً وبغياً. وفي هذا الباب درسٌ في أن العلم بلا عمل لا يُنجي صاحبه، وأن الإنكار بعد المعرفة أشدّ من الجهل، لأن صاحبه يعرف الحق ثم يُخاصمه، وهو ما جعل موقفهم بعد ذلك موقف من ينتظر زلّةً لا من يبحث عن هدى.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان أول ما فعله النبيّ في المدينة أن بركت ناقته عند موضعٍ لدارٍ لغلامين يتيمين من بني النجار، فاشتراه النبيّ منهما وبنى فيه المسجد. وقد كان في هذا المكان معنىً: أنه لم يُبنَ على أرضٍ مغصوبة، بل على أرضٍ مُشتراة، وأن المسجد كان في وسط المدينة لتكون الصلاة في قلب الحياة لا على طرفها. وقد شارك النبيّ أصحابه في نقل اللبن والحجارة، وكان يقول معهم: «اللهم إن الأجر أجر الآخرة فارحم الأنصار والمهاجرة»، وقد كان في هذا العمل ما جعل البناء عبادةً، وأن القائد لا يجلس والناس يعملون. وقد كانت القبلة الأولى إلى بيت المقدس، ثم صُرفت إلى الكعبة بعد ذلك، فصار للمسجد تاريخان في اتجاهٍ واحد: أصلٌ في القدس، واستقرارٌ في مكة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في بناء المسجد أن النبيّ شارك بنفسه في العمل، وكان ينقل اللبن والحجارة، وكان يقول: «اللهم لا عيش إلا عيش الآخرة، فاغفر للأنصار والمهاجرة»، وقد كان في هذا ما جعل المسجد مشروعاً جماعياً لا تبرعاً من واحد. وقد بُني المسجد باللبن وسقفه بالجريد، وكان فيه ثلاثة أبواب، وكان فيه صُفّةٌ للفقراء من المهاجرين يُسمّون «أهل الصفة». وقد كان هؤلاء يبيتون في المسجد ويتعلّمون القرآن، وكان النبيّ يُوصي بهم أصحابه، وكانوا ضيوف الإسلام الأول. وقد كان في وجودهم في قلب المسجد ما يُبيّن أن العبادة والعلم لم يكونا منفصلين عن الفقر، وأن المسجد كان بيتاً لمن لا بيت له.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان المسجد في أول أمره أكثر من مكانٍ للصلاة: كان مجلساً للشورى، ومدرسةً للتعليم، ومحكمةً للقضاء، ومكاناً لاستقبال الوفود، وداراً لبعض الفقراء. وقد كان في هذا ما يُبيّن أن المسجد في الإسلام لم يكن مكاناً منفصلاً عن الحياة العامة، بل كان مركز المدينة في كل شأن. ففيه كان يُعلَّم القرآن وتُعقد مجالس العلم، وفيه كانت تُعقد المشاورات قبل الحروب، وفيه كان يُقضى بين الناس، وفيه كان يُستقبل الوفود، ومنه كانت تنطلق السرايا. وقد كان في هذا ما جعل المسجد مؤسسةً جامعة: مسجداً ومدرسةً ودار قضاءٍ ومجلس شورى، لا مكاناً للصلاة وحدها.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم كتب النبيّ وثيقةً بين المهاجرين والأنصار، وبين من دخل معهم من اليهود، وقد نصّت على أن المسلمين أمةٌ واحدة من دون الناس، وأن المهاجرين والأنصار يتعاونون في الدية والفداء، وأن من تبعهم من اليهود فله النصرة والعدل، وأن المدينة حرمٌ لا يُحدث فيها حدث، وأن ما اختلف فيه الناس يُردّ إلى الله وإلى محمد. وقد نصّت الوثيقة على أن المسلمين من قريش وغيرهم أمةٌ واحدة، وأن اليهود يُنفقون مع المسلمين ما داموا محاربين، وأن من خرج آمنٌ ومن قعد آمنٌ في المدينة. وقد كان في هذا ما جعل المدينة دولةً لا حلفاً قبلياً، وأن العقد بين الحاكم والمحكوم مكتوبٌ لا شفوي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه الوثيقة ما لم يكن في أي مجتمعٍ عربي من قبل: أنها نظّمت العلاقة بين جماعاتٍ مختلفة على أساس المواطنة لا على أساس الدم، وأنها أعطت اليهود حقوقاً مقابل واجبات، وأنها جعلت المدينة كياناً واحداً لا قبائل متنازعة. وقد كان في هذا ما يُعدّ أول دستورٍ مدني في التاريخ، لأنه كتب علاقة الحكم بالمواطنين في وثيقةٍ مكتوبة. وقد سبقت هذه الوثيقة كل المواثيق الحديثة بأكثر من أحد عشر قرناً، ولم تكن في نظر النبيّ فضلاً من الحاكم بل حقاً للمحكوم، يُطالب به ويُحتكم إليه. وقد حفظت لليهود دينهم وأموالهم ودماءهم، ولم تُلزمهم بالإسلام، وإنما ألزمتهم بالعهد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا كله أن النبيّ بنى في أشهرٍ ما لم يُبنَ في سنوات: مسجداً، ووثيقة، وأخوّةً بين المهاجرين والأنصار، وسوقاً، ونظاماً للأمن. وقد كان في هذا ما جعل المدينة قادرةً على أن تُواجه قريشاً بعد ذلك بعامٍ واحد، وأن تُقاتل في بدر وهي على بُعدٍ من مكة، وأن تنتصر. وقد كان في هذا الدرس ما يُبيّن أن بناء الدولة يسبق بناء الجيش: أن تُوحَّد القبائل أولاً، ويُكتب العهد، ويُبنى المسجد، ثم يُنظر في الحرب. فمن أراد نصراً بلا دولةٍ بنى على الرمل، ومن بنى دولته على عهدٍ ومسجدٍ وقضاءٍ وجد في وقت الشدة من يقف معه، ولو كان قليل العدد.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eغار ثور والطريق إلى المدينة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان غار ثور في جبلٍ جنوب مكة، وقد مكث فيه النبيّ وأبو بكر ثلاث ليالٍ، وكان المشركون يُفتّشون عليهما، وقد رُوي أنهم وصلوا إلى فم الغار، وأن أبا بكر قال كلمته المشهورة، وأن النبيّ طمأنه بأن الله معهما. وقد كان في الغار درسٌ في الصبر على الطريق، وأن من كان الله معه لا يضره من كان عليه، وأن أبا بكر لم يكن صاحباً في الرحلة فقط بل صاحباً في الخطر وفي الغار وفي الهجرة وفي كل موقف.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه الليالي درسٌ في التنظيم: أن النبيّ لم يخرج خفيةً فقط بل رتّب من يأتيه بالخبر، ومن يأتيه بالطعام، ومن يمحو الأثر، وقد كان في هذا ما جعل الاختفاء ناجحاً. وقد كان في هذا أيضاً ما يُبيّن أن التوكّل لا يُلغي الأخذ بالأسباب، وأن النبيّ جمع بينهما.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالمسجد النبوي\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان المسجد النبوي في أول أمره مربّعاً بسيطاً، جدرانه من اللبن، وسقفه من الجريد، وأعمدته من جذوع النخل، وأرضه من الرمل والحصى. وقد كان في هذا البساطة ما جعل بناءه سريعاً، وأن الناس يستطيعون أن يُصلّوا فيه وهم في أشدّ الحاجة إلى مكانٍ يجتمعون فيه. وقد كان في هذه البساطة ما جعل المسجد يبقى قروناً، وأن العمارة الفخمة جاءت بعده لا قبله، وأن المسجد الذي بدأ بالجريد واللبن صار أشهر مسجدٍ في الأرض.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في المسجد أيضاً بيتٌ للنبيّ، وكان فيه حُجراتٌ لنسائه، وقد كان في هذا ما جعل المسجد مركزاً للأسرة أيضاً. وقد تطوّر المسجد بعد ذلك في العهدين الراشدين والأموي، لكن أصله بقي كما هو: صحنٌ مكشوف، وظلالٌ من الجريد، وجماعةٌ تسمع الخطبة من غير مكبّر صوت.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eوثيقة المدينة\u003c/h4\u003e\u003cp class=\"ap\"\u003eوثيقة المدينة — أو «صحيفة المدينة» — نصٌّ كتبه النبيّ بعد الهجرة، وقد كان في نحو سبعٍ وأربعين بنداً، وقد نظّم العلاقة بين المهاجرين والأنصار وبين من دخل معهم من اليهود. وقد كان في هذا النص ما جعل المدينة دولةً لا قبائل، لأنه جعل المرجع في الخلاف النبيّ لا شيخ القبيلة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الوثيقة أن اليهود «أمةٌ مع المؤمنين»، وأن لهم دينهم وللمسلمين دينهم، وأن عليهم النفقة مع المسلمين في الحرب إذا قاتلوا، وأن من ظُلم يُنصر. وقد كان في هذا ما يُبيّن أن الإسلام لم يُقِم دولته على إخراج الآخرين بل على التعاقد معهم، وأن المواطنة كانت أساس العلاقة لا الدين وحده.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالهجرة\u003c/b\u003e\u003cspan\u003eسنة ٦٢٢م، من مكة إلى المدينة، وهي بداية التقويم الهجري.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eغار ثور\u003c/b\u003e\u003cspan\u003eمكث فيه النبيّ وأبو بكر ثلاث ليالٍ.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأول مسجد\u003c/b\u003e\u003cspan\u003eمسجد قباء، ثم المسجد النبوي في المدينة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأهل الصفة\u003c/b\u003e\u003cspan\u003eفقراء المهاجرين الذين سكنوا في صفة المسجد.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eوثيقة المدينة\u003c/b\u003e\u003cspan\u003eنحو ٤٧ بنداً، تنظّم علاقة المسلمين واليهود، وتُعدّ أول دستور.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمرحلة\u003c/th\u003e\u003cth\u003eالمكان\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالهجرة\u003c/td\u003e\u003ctd\u003eمكة\u003c/td\u003e\u003ctd\u003eخروجٌ ليلاً وبيات عليّ في الفراش\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالاختفاء\u003c/td\u003e\u003ctd\u003eغار ثور\u003c/td\u003e\u003ctd\u003eثلاث ليالٍ مع أبي بكر\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالطريق\u003c/td\u003e\u003ctd\u003eالساحل\u003c/td\u003e\u003ctd\u003eدليلٌ مشرك وطريقٌ غير معتاد\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالوصول\u003c/td\u003e\u003ctd\u003eقباء\u003c/td\u003e\u003ctd\u003eأول مسجد في الإسلام\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالاستقرار\u003c/td\u003e\u003ctd\u003eالمدينة\u003c/td\u003e\u003ctd\u003eالمسجد النبوي ووثيقة المدينة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eما ظنّك باثنين الله ثالثهما.\u003c/p\u003e\u003ccite\u003eالنبيّ ﷺ لأبي بكر في غار ثور\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eمن غارٍ في جبلٍ جنوب مكة إلى مسجدٍ في وسط المدينة: هذه هي الهجرة. وقد بنى النبيّ في أشهرٍ ثلاثة أشياء: مسجداً يجمع، ووثيقةً تنظّم، وأخوّةً تُؤلّف. وقد كان في هذه الثلاثة أساس الدولة التي ستقاوم قريشاً بعد عام.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"badr","n":"بدر الكبرى","ic":"⚔️","part":"القسم الثالث: بناء الدولة في المدينة","h":"\u003carticle class=\"ch3\" id=\"badr\" data-toc=\"بدر الكبرى\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الثالث: بناء الدولة في المدينة\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٢ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٣\u003ci\u003e.\u003c/i\u003e٢\u003c/span\u003e\n            \u003ch3\u003eبدر الكبرى\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eفي رمضان من السنة الثانية للهجرة التقى نحو ثلاثمئةٍ وثلاثة عشر مسلماً بألفٍ من قريش عند بئر بدر، فانتصر المسلمون انتصاراً حاسماً. وقد كان هذا الانتصار هو الذي ثبّت الدولة الجديدة، وأعطاها هيبةً في الجزيرة كلها، وأنزل الله فيه سورة الأنفال بكاملها.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان سبب الخروج أن قافلةً لقريش بقيادة أبي سفيان كانت راجعةً من الشام، وفيها أموالٌ كثيرة، وقد أراد المسلمون أن يعترضوها لأن قريشاً كانت قد صادرت أموال المهاجرين في مكة. وقد كان في هذا الطلب أصلٌ في حقّ المسلمين في استرداد أموالهم، لكن القافلة نجت، وأرسلت إلى قريش تستنجد، فخرجت قريش بجيشٍ كبير. وقد كان في هذا الخروج ما يُبيّن أن قريشاً كانت تُدرك أن الخطر على تجارتها خطرٌ على وجودها، وأنها فضّلت الحرب على احتمال خسارة طريقٍ واحد. وقد خرج أبو جهل بجيشٍ لم يخرج مثله من قبل، ومعه القيان يُنشدن ويُحرّضن، وقد أراد أن يُظهر قوة مكة لكل قبيلة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان النبيّ قد خرج بنحو ثلاثمئةٍ وثلاثة عشر رجلاً، وكان معهم سبعون بعيراً وفرسان، وكان فيهم المهاجرون والأنصار، وكان أكثرهم بلا سلاحٍ كامل. وقد كان في هذا الجيش ما يُبيّن أن الدولة الجديدة لم تكن تملك عدةً، وأنها كانت تُقاتل بعددٍ قليلٍ وإيمانٍ كثير، وأن النصر لم يكن نتيجة توازنٍ مادي. وقد كان عدد المسلمين ثلاثمئة وبضعة عشر رجلاً، ومعهم فرسانٌ اثنان، وسبعون بعيراً يتعاقبون عليها، وكان فيهم من لم يجد سلاحاً كاملاً. وقد كان في هذا العدد ما جعل المعركة تُقاس بالإيمان لا بالعدة، وأن من ظنّ أن النصر يُشترى بالسلاح فقد أخطأ الطريق.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان النبيّ قد استشار أصحابه قبل المعركة، وكان في هذا أصلاً في الشورى في الحرب، وقد قال له الأنصار كلمةً تُروى: «والذي بعثك بالحق، لو استعرضت بنا هذا البحر فخضته لخضناه معك»، وقد كان في هذه الكلمة ما جعل النبيّ يطمئنّ إلى أن الأنصار سيقاتلون معه خارج المدينة، لأن بيعتهم كانت على النصرة في دارهم. وقد سأل النبيّ الأنصار سؤالاً صريحاً حين قال: «أشيروا عليّ»، وكان يعلم أن خروج الجيش من المدينة قرارٌ يخصّهم لأن القتال سيكون في ديارهم. وقد أجابه سعد بن معاذ بكلمةٍ صارت مثلاً: «والذي بعثك بالحق لو استعرضت بنا هذا البحر فخضته لخضناه معك».\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد نزل المسلمون عند بدر، وكان الماء قريباً منهم، وقد أشار الحباب بن المنذر بأن يُحوّل المسلمون إلى ماءٍ أقرب إلى العدو، فقبل النبيّ رأيه، وقد كان في هذا دليلاً على أن القيادة النبوية كانت تقبل الرأي الفني من أهل الخبرة، وأن الشورى لم تكن شكلاً بل عملاً. وقد كان الحباب بن المنذر صاحب خبرةٍ بالماء والمواضع، فأشار بأن يُنزل الجيش عند أدنى ماءٍ من بدر ويُغوّر ما وراءه من الآبار، ففعل النبيّ بقوله. وقد كان في هذا ما يُبيّن أن الشورى لا تُبنى على السنّ ولا على القرب من القائد، بل على العلم والخبرة، وأن القائد الحق هو الذي يعرف من يُشير ومتى يقبل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد جرت المعركة في السابع عشر من رمضان، وقد كان عدد المشركين نحو ألفٍ، وكان معهم مئتا فرس، وقد كان فيهم أبو جهل وعتبة وشيبة والوليد بن المغيرة. وقد بدأت المعركة بالمبارزة، ثم اشتدّ القتال، وقد كان النبيّ في العريش يدعو، وقد رُوي أنه كان يقول: «اللهم أنجز لي ما وعدتني»، حتى سقط رداؤه عن كتفيه. وقد كان في هذا الدعاء ما يُبيّن أن القائد في الإسلام يُقاتل بيده ولسانه وقلبه، وأن الدعاء ليس بديلاً عن الإعداد بل تمامٌ له. وقد رُوي أنه كان يقول: «اللهم إن تُهلك هذه العصابة لا يُعبد في الأرض»، وكان في هذا الدعاء ما جعل المعركة معركة عقيدة لا معركة قبيلة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد انتصر المسلمون انتصاراً كاملاً، وقُتل من قريش نحو سبعين، وأُسر نحو سبعين، وقُتل أبو جهل، وكان في مقتله نهاية مرحلةٍ في الصراع. وقد كان في هذا الانتصار ما غيّر موازين القوى في الجزيرة: أن قبائل كانت تتردّد في الإسلام بدأت تُقدّر المسلمين، وأن من كان يُعادي في مكة صار يُحسب لهم ألف حساب. وقد كان في هذا النصر ما جعل المدينة دولةً يُخاف جانبها، وأن القبائل التي كانت تتربّص بها صارت ترسل وفودها تُسالم. وقد قال الله في ذلك: «يوم الفرقان يوم التقى الجمعان»، وكان في هذا الاسم ما جعل بدراً حداً فاصلاً في تاريخ الدعوة لا معركةً عابرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الغنائم أن نزل قوله تعالى: «واعلموا أنما غنمتم من شيء فأن لله خمسه»، وقد كان في هذا تشريعٌ للمال العام، وأن الخُمس يُصرف في مصالح المسلمين، وأن الباقي يُوزّع على المقاتلين. وقد كان في هذا ما جعل الجيش يُقاتل من أجل الدولة لا من أجل الغنيمة وحدها. وقد نزل في الغنائم قوله تعالى: «واعلموا أنما غنمتم من شيء فأن لله خمسه وللرسول»، فجعل الخُمس حقاً لله وللرسول ولذي القربى واليتامى والمساكين وابن السبيل، والباقي للمقاتلين. وقد كان في هذا التشريع ما حوّل الغنيمة من نهبٍ إلى نظامٍ مالي، ومن مال قبيلة إلى مال دولة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في أسرى بدر تشريعٌ في معاملة الأسرى؛ فقد كان النبيّ يستشير أصحابه فيهم، وكان أبو بكر يرى الفداء، وعمر يرى القتل، فأخذ النبيّ بالفداء، وقد كان في هذا ما جعل المسلمين يستفيدون مالاً، وأن بعض الأسرى علّموا أطفال المسلمين القراءة مقابل فدائهم. وقد كان في هذا الفداء ما يُبيّن أن التعليم صار قيمةً تُعادل المال، وأن المسلمين الأوائل عرفوا أن محو الأمية أصلٌ من أصول بناء الأمة. وقد نزل في الأسرى قوله تعالى: «يا أيها النبي قل لمن في أيديكم من الأسرى إن يعلم الله في قلوبكم خيراً يؤتكم خيراً مما أُخذ منكم»، وقد أسلم بعضهم بعد ذلك وحسن إسلامه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في بدر أثرٌ في القرآن أيضاً؛ فقد نزلت سورة الأنفال في أحداثها، وقد كان فيها حديثٌ عن الغنائم والأسرى والشورى والنصر، وقد كان في هذا ما جعل المعركة حدثاً تشريعياً لا عسكرياً فقط. وقد سُمّي يوم بدر «يوم الفرقان»، لأنه فرّق بين مرحلتين من تاريخ الدعوة. فكانت الدعوة قبله دعوةً مستضعفة تُخفي نفسها وتصبر، وصارت بعده دولةً تُظهر نفسها وتُدافع. وقد كان في هذا الفرق ما جعل المسلمين يعرفون أن الصبر مرحلةٌ لا غاية، وأن الاستضعاف حالةٌ تُنتهى لا يُقام فيها. وقد بقيت في بدر دروسٌ في القيادة والإعداد والشورى تُدرّس إلى اليوم.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالعدد والعدة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان عدد المسلمين في بدر ثلاثمئةٍ وثلاثة عشر رجلاً، وكان معهم نحو سبعين بعيراً، وكان فيهم فارسان أو ثلاثة، وكان أكثرهم بلا دروع. أما قريش فكانت نحو ألفٍ، ومعهم مئتا فرس، وكانوا مُجهّزين تجهيزاً كاملاً، لأنهم خرجوا للقتال لا للتجارة. وقد كان في هذا الفرق ما جعل المعركة غير متكافئة في الظاهر، وأن من نظر إلى العدد وحده حكم بأن المسلمين هالكون، ثم رأى أن النصر كان بأسبابٍ أخرى لا تُحسب في الميزان.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا الفرق ما جعل النصر معجزةً في نظر الناس، وقد كان في هذا أيضاً ما جعل المسلمين يعرفون أن العدد ليس كل شيء في الحرب، وأن الإيمان والتنظيم والقيادة قد تُعادل كثيراً من العدد. وقد قال الله في ذلك: «ولقد نصركم الله ببدر وأنتم أذلّة». وقد كان في هذه الآية ما جعل بدراً حجةً على كل أمةٍ قليلة العدة كثيرة الإيمان، وأن العدة تُعدّ ولا تُتّكل عليها، وأن الإيمان يُعدّ ولا يُستغنى به عن الإعداد.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالشورى قبل المعركة\u003c/h4\u003e\u003cp class=\"ap\"\u003eاستشار النبيّ أصحابه قبل بدر استشارتين: استشارةً في أصل الخروج، واستشارةً في موضع النزول. وقد كان في الأولى أن بعضهم تردّد، لأنهم خرجوا لقافلةٍ لا لحرب، وقد كان في الثانية أن الحباب بن المنذر أشار بمكانٍ أفضل، فقبل النبيّ رأيه. وقد كان في هذا القبول ما يُبيّن أن النبيّ لم يكن يستبدّ بالرأي في أمرٍ لم ينزل فيه وحي، وأنه كان يُقدّم الخبرة على المكانة، وأن أصحابه كانوا يُشيرون عليه بلا خوفٍ ولا مُداراة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا ما يُبيّن أن الشورى في الإسلام لم تكن مظهراً بل منهجاً، وأن القائد الأعلى كان يستمع ويُغيّر رأيه إذا ظهر الأفضل، وأن أصحابه كانوا يقولون رأيهم بصراحةٍ لأنه لم يكن في المجلس خوفٌ من الحاكم. وقد كان في هذا ما جعل المسلمين يُقاتلون وهم مقتنعون لا مُجبَرون.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالأسرى والفداء\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان في أسرى بدر سبعون رجلاً، وكان فيهم من أشراف قريش، وقد استشار النبيّ أصحابه فيهم، فاختلفوا بين الفداء والقتل. وقد كان في هذا الاختلاف دلالةً على أن القرار الحربي في الإسلام لم يكن فردياً، وأن النبيّ كان يُشارك أصحابه فيه. وقد كان في هذا الاختلاف ما جعل السنة النبوية تُبنى على المشاورة، وأن القرار الذي يُشارك فيه الناس يُنفّذونه وهم مطمئنون إليه، وأن القائد الذي يستبدّ برأيه يبقى وحده في ساعة الشدة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أُخذ بالفداء، وكان الفداء مالاً يدفعه الأسير، وكان من لا يملك مالاً يعمل، وقد رُوي أن بعض الأسرى علّموا عشرةً من أطفال المسلمين الكتابة مقابل إطلاقهم، وقد كان في هذا ما يُبيّن أن التعليم كان له قيمةٌ في نظر النبيّ تعادل المال، وأنه كان يرى في تعليم الأطفال مصلحةً للدولة.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالتاريخ\u003c/b\u003e\u003cspan\u003e١٧ رمضان، السنة الثانية للهجرة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eعدد المسلمين\u003c/b\u003e\u003cspan\u003e٣١٣ رجلاً، ونحو ٧٠ بعيراً.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eعدد المشركين\u003c/b\u003e\u003cspan\u003eنحو ١٠٠٠ رجل، ومئتا فرس.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالخسائر\u003c/b\u003e\u003cspan\u003e٧٠ قتيلاً من قريش و٧٠ أسيراً.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسورة الأنفال\u003c/b\u003e\u003cspan\u003eنزلت في أحداث بدر وتشريعات الغنائم والأسرى.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالعنصر\u003c/th\u003e\u003cth\u003eالمسلمون\u003c/th\u003e\u003cth\u003eقريش\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالعدد\u003c/td\u003e\u003ctd\u003e٣١٣\u003c/td\u003e\u003ctd\u003eنحو ١٠٠٠\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالخيل\u003c/td\u003e\u003ctd\u003e٢ أو ٣\u003c/td\u003e\u003ctd\u003e٢٠٠\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالدروع\u003c/td\u003e\u003ctd\u003eقليلة\u003c/td\u003e\u003ctd\u003eكثيرة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالهدف\u003c/td\u003e\u003ctd\u003eاعتراض قافلة ثم قتال\u003c/td\u003e\u003ctd\u003eاستئصال الدعوة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالنتيجة\u003c/td\u003e\u003ctd\u003eنصرٌ حاسم\u003c/td\u003e\u003ctd\u003eهزيمةٌ ومقتل أبي جهل\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eاللهم أنجز لي ما وعدتني.\u003c/p\u003e\u003ccite\u003eدعاء النبيّ ﷺ في العريش يوم بدر\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eثلاثمئةٍ وثلاثة عشر رجلاً هزموا ألفاً في بدر، فثبّتوا الدولة الجديدة وأعطوها هيبةً في الجزيرة. وقد كان النصر ثمرة إيمانٍ وشورى وتنظيم، لا ثمرة عددٍ أو عدة، وقد نزلت فيه سورة الأنفال بتشريعاتها.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"uhud","n":"أُحد ودرس الطاعة","ic":"🏔️","part":"القسم الثالث: بناء الدولة في المدينة","h":"\u003carticle class=\"ch3\" id=\"uhud\" data-toc=\"أُحد ودرس الطاعة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الثالث: بناء الدولة في المدينة\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٣ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٣\u003ci\u003e.\u003c/i\u003e٣\u003c/span\u003e\n            \u003ch3\u003eأُحد ودرس الطاعة\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eفي شوال من السنة الثالثة للهجرة خرجت قريش بثلاثة آلاف مقاتل إلى المدينة لتأخذ بثأر بدر، فخرج النبيّ بألفٍ ثم انسحب منهم عبد الله بن أُبيّ بثلاثمئة. وقد جرت المعركة عند جبل أُحد، وانتصر المسلمون في أولها ثم انهزموا بعد أن ترك الرماة مواقعهم، وقُتل من المسلمين سبعون، ومُثّل بحمزة بن عبد المطلب.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eخرجت قريش في السنة الثالثة بجيشٍ كبير بقيادة أبي سفيان، وكان معهم ثلاثة آلاف مقاتل، ومئتا فرس، وسبعمئة درع، وقد كان فيهم نساءٌ يُحرّضن على القتال، وكانت هند بنت عتبة في مقدّمتهن تطلب بثأر أبيها وأخيها في بدر. وقد كان في هذا الخروج دلالةً على أن بدراً لم يُنهِ الصراع بل فتحه، وأن قريشاً لم تكن تقبل أن تبقى مهزومة. وقد خرجت قريش بثلاثة آلاف مقاتل، ومعهم مئتا فرس، وأبو سفيان قائداً، وخالد بن الوليد على الميمنة، وعكرمة بن أبي جهل على الميسرة، وخرجت نساؤهم يُحرضن على القتال. وقد أرادوا أن يُعيدوا هيبتهم في الجزيرة، وأن يمحوا أثر بدر من ذاكرة القبائل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد استشار النبيّ أصحابه في أن يبقى في المدينة أو يخرج، وكان رأيه أن يبقى ويُقاتل داخل المدينة، لأن المدينة حصينةٌ من جهةٍ ولأن القتال في الأزقة يُقلّل فاعلية الخيل. لكن أكثرهم أرادوا الخروج، وكان فيهم شبابٌ لم يشهدوا بدراً وأرادوا الشهادة، فأخذ النبيّ برأيهم وخرج، وقد كان في هذا درساً في الشورى: أن القائد قد يرى الأصوب ويُخالف رأيه احتراماً لجماعته.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد خرج النبيّ بألف رجل، ثم انسحب عبد الله بن أُبيّ بن سلول بثلاثمئة، وقال إنه لا يُقاتل في قومٍ يُريدون القتال بلا رأي. وقد كان في هذا الانسحاب أثرٌ كبير: أن الجيش صار سبعمئة، وأن القوى تغيّرت، وأن المدينة صارت فيها طائفةٌ تُخذّل وتُشكّك، وهي التي ستُعرف بعد ذلك بـ«المنافقين». وقد كان عبد الله بن أُبيّ بن سلول على رأس هذه الطائفة، وقد انسحب بثلاثمئة من جيش المسلمين في الطريق، فبقي النبيّ في سبعمئة. وقد كان في هذا الانسحاب ما جعل المعركة تُخاض بجيشٍ منقوص، وأن الخطر الداخلي قد يكون أشدّ من الخطر الخارجي في بعض الأحيان.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد نزل المسلمون عند أُحد، ووضع النبيّ خمسين رامياً على جبل الرماة، وأمرهم ألا يتحركوا من مكانهم سواء انتصر المسلمون أو انهزموا، وقال لهم: «إن رأيتمونا تخطفنا الطير فلا تبرحوا حتى أُرسل إليكم». وقد كان في هذا الأمر الصريح ما يُبيّن أن القيادة تحتاج إلى انضباطٍ لا إلى حماسة، وأن الطاعة في الحرب قد تكون أهم من الشجاعة. وقد وضع النبيّ خمسين رامياً على جبل الرماة، وأمرهم أمراً صريحاً ألا يتركوا مواقعهم ولو رأوا الطير تتخطف المسلمين، وقال لهم: «لا تبرحوا مكانكم، إن كان لنا أو علينا». وقد كان في هذا الأمر ما يُبيّن أن الخطة تُبنى على فرضٍ واحد: أن الطريق لا يُفتح للعدو.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بدأت المعركة بانتشار المسلمين، وقد قُتل من قريش عددٌ، وحمل المسلمون على المشركين حتى انكشفوا، وكان في هذا النصر الأول ما جعل الرماة يظنون أن المعركة انتهت، فترك أكثرهم مواقعهم طلباً للغنيمة، ولم يبقَ منهم إلا نفرٌ قليل. وقد كان في هذا الخطأ ما غيّر مسار المعركة كلها. فلمّا رأى الرماة انكسار المشركين وفرارهم، قالوا: قد انهزم القوم، فما مقامنا هنا؟ فتركوا الجبل طلباً للغنيمة، ولم يُذكّرهم إلا أميرهم عبد الله بن جبير ومن بقي معه. فلمّا رآهم خالد بن الوليد قد نزلوا، كرّ بفرسانه على المسلمين من خلفهم، فصارت الدائرة عليهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد استغلّ خالد بن الوليد — وكان يومئذٍ على دين قريش — خلوّ الجبل، فحمل بالخيل على مؤخرة المسلمين، فانقلب النصر هزيمة، واختلط الناس، وقُتل من المسلمين سبعون، وكان فيهم مصعب بن عمير حامل الراية، وقتل حمزة بن عبد المطلب عمّ النبيّ، ومُثّل به، وقد حزن النبيّ عليه حزناً شديداً. وقد كان مصعب بن عمير حامل راية المسلمين، فلمّا قُتل حسب المشركون أنهم قتلوا النبيّ، فأخذ الراية عليّ بن أبي طالب. وقد كان في مقتل حامل الراية ما جعل الجيش يهتزّ، وأن الراية في الحرب رمزٌ لا قطعة قماش، وأن من يحملها يحمل معنى الأمة كلها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه الهزيمة أثرٌ نفسي كبير: أن المسلمين شعروا أنهم استحقّوا ما جرى بسبب مخالفة الأمر، وقد نزل القرآن في ذلك: «ولقد صدقكم الله وعده إذ تحسّونهم بإذنه حتى إذا فشلتم وتنازعتم في الأمر وعصيتم»، وقد كان في هذا ما جعل الهزيمة درساً لا نكبةً، وأن الخطأ في الطاعة قد يُكلّف أمةً دماءها. وقد كان في هذه الآية ما جعل أُحداً مدرسةً في الانضباط، وأن النبيّ لم يُعاقب الرماة بل بيّن لهم خطأهم، وأن الوحي عالج الجرح بالتربية لا بالتشفي. وقد قال الله: «ولا تهنوا ولا تحزنوا وأنتم الأعلون إن كنتم مؤمنين»، فجعل الهزيمة اختباراً لا نهاية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في المعركة أن شائعةً انتشرت بأن النبيّ قُتل، فانكفأ بعض الناس، وثبت آخرون، وقد رُوي أن أنس بن النضر قال: «إن كان محمدٌ قد قُتل فما تصنعون بالحياة بعده؟ موتوا على ما مات عليه»، وقد كان في هذا الموقف معنىً في الإيمان: أن الرسالة لا تموت بموت الرسول، وأن من يُقاتل من أجل شخصٍ ينهار إذا سقط، ومن يُقاتل من أجل دينٍ يثبت. وقد كان في هذه الشائعة ما جعل المسلمين يعرفون أن الرسالة لا تُختصر في شخص، وأنها باقيةٌ ما بقي القرآن. وقد قال أبو بكر حين مات النبيّ بعد ذلك: «من كان يعبد محمداً فإن محمداً قد مات، ومن كان يعبد الله فإن الله حيٌّ لا يموت»، وكان في أُحد تمهيدٌ لهذا الدرس.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في أُحد درسٌ في أن النصر ليس وعداً دائماً للمسلمين، وأن الله يُعلّمهم أن السنن لا تُخالف: أن من أطاع نجح، ومن خالف فشل، وأن التوفيق لا يُلغي الأسباب. وقد قال النبيّ بعد ذلك كلمةً تُروى: «إن الله ليُؤيّد هذا الدين بالرجل الفاجر»، وقد كان في هذا ما يُبيّن أن النصر قد يأتي بأسبابٍ لا بأشخاص. وقد كان خالد بن الوليد يوم أُحد في صفّ المشركين، ثم أسلم بعد الحديبية، وصار سيفاً من سيوف الإسلام، وقال له النبيّ: «لا تسبّوا خالداً، فإنه سيفٌ من سيوف الله صبّه الله على الكفار». وقد كان في هذا ما يُبيّن أن الله قد يُغيّر الرجال كما يُغيّر الأحوال.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eجبل الرماة والخطأ القاتل\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان موضع الرماة على جبلٍ صغير يُسمّى جبل الرماة أو عينين، وكان موقعه استراتيجياً لأنه يُشرف على الممر الذي يمكن أن تأتي منه الخيل. وقد وضع النبيّ فيه خمسين رامياً، وكان في هذا إدراكٌ عسكري دقيق: أن يُغلق الطريق الذي يمكن أن يُلتفّ منه العدو. وقد كان في اختيار هذا الموضع ما يُبيّن أن النبيّ كان يُدرك أهمية الأرض في المعركة، وأنه لم يكن يُهمل الأسباب وهو المتوكل على الله.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان الخطأ أنهم تركوا مواقعهم حين رأوا المسلمين ينتصرون، لأنهم ظنّوا أن المعركة انتهت، وقد كان في هذا أن الطاعة في الحرب لا تُقاس بالنتيجة الظاهرة، وأن الجندي لا يرى ما يرى القائد. وقد كان في هذا الخطأ ما جعل خالد بن الوليد يجد الممر مفتوحاً، فكانت الهزيمة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eحمزة ومُثلة المشركين\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان حمزة بن عبد المطلب عمّ النبيّ وأخاه من الرضاعة، وكان من أشجع الناس، وقد قُتل في أُحد على يد وحشي بن حرب، وكان ذلك بأمرٍ من هند بنت عتبة التي أرادت الثأر. وقد مُثّل بجسده، وقد حزن النبيّ حزناً شديداً، وقال حين رآه: «لن أُصاب بمثلك أبداً». وقد كان في مقتل حمزة حزنٌ خاص، لأنه كان عمّه وأخاه من الرضاعة، وقد وقف النبيّ على جسده وقال كلمةً تُروى في الحزن والوفاء معاً.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه المُثلة أثرٌ في التشريع بعد ذلك: أن النبيّ نهى عن المُثلة، وقال: «لا تُمثّلوا بشيء»، وقد كان في هذا ما يُبيّن أن الحرب في الإسلام لها قيود، وأن الغضب لا يُبرّر ما يُخالف الأخلاق، وأن النبيّ نفسه لم يُرخّص في المُثلة حتى في حق من مثّل بعمّه.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eدروس أُحد\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت أُحد درساً في أن الطاعة أهم من الحماسة، وأن الشورى قد تُنتج قراراً خاطئاً إذا كان الرأي العام غير مُدرّب، وأن القائد قد يُخالف رأيه احتراماً للجماعة ثم يتحمّل النتيجة. وقد كان في هذا ما يجعل أُحد أخطر من بدر في دروسها، لأنها علّمت المسلمين ما لا يُعلّمه النصر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في أُحد درسٌ آخر: أن الهزيمة لا تعني نهاية الدعوة، وأن قريشاً لم تستطع أن تستغلّ انتصارها لأنها لم تُحاصر المدينة، وأن المسلمين استعادوا قوتهم بعدها في سنةٍ واحدة، وقد كان في هذا ما يُبيّن أن الأمة قد تتعثّر ولا تسقط إذا كانت مؤسساتها قائمة. وقد كان في هذا ما جعل أُحداً لا تُسقط المدينة، وأن القيادة النبوية أعادت تنظيم الصفوف بعدها في أيامٍ قليلة، وأن المسلمين خرجوا في العام التالي يطلبون العدو.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالتاريخ\u003c/b\u003e\u003cspan\u003eشوال، السنة الثالثة للهجرة، عند جبل أُحد.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالأعداد\u003c/b\u003e\u003cspan\u003e٧٠٠ مسلم بعد انسحاب ابن أُبيّ، مقابل ٣٠٠٠ من قريش.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالشهداء\u003c/b\u003e\u003cspan\u003e٧٠ شهيداً، منهم حمزة بن عبد المطلب ومصعب بن عمير.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالسبب\u003c/b\u003e\u003cspan\u003eترك الرماة مواقعهم طلباً للغنيمة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالدرس\u003c/b\u003e\u003cspan\u003eالطاعة في الحرب لا تُقاس بالنتيجة الظاهرة.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالعنصر\u003c/th\u003e\u003cth\u003eبدر\u003c/th\u003e\u003cth\u003eأُحد\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالسنة\u003c/td\u003e\u003ctd\u003e٢هـ\u003c/td\u003e\u003ctd\u003e٣هـ\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالعدد\u003c/td\u003e\u003ctd\u003e٣١٣\u003c/td\u003e\u003ctd\u003e٧٠٠ بعد الانسحاب\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالعدو\u003c/td\u003e\u003ctd\u003eنحو ١٠٠٠\u003c/td\u003e\u003ctd\u003e٣٠٠٠\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالنتيجة\u003c/td\u003e\u003ctd\u003eنصرٌ حاسم\u003c/td\u003e\u003ctd\u003eهزيمةٌ بعد نصرٍ أول\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالسبب\u003c/td\u003e\u003ctd\u003eثباتٌ وطاعة\u003c/td\u003e\u003ctd\u003eترك مواقع واختلاف\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eإن كان محمدٌ قد قُتل فما تصنعون بالحياة بعده؟ موتوا على ما مات عليه.\u003c/p\u003e\u003ccite\u003eأنس بن النضر في أُحد حين انتشرت شائعة مقتل النبيّ ﷺ\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eفي أُحد انتصر المسلمون أولاً ثم انهزموا لأن الرماة تركوا مواقعهم، فقُتل سبعون منهم. وقد كانت الهزيمة درساً في الطاعة والانضباط، وعلّمت الأمة أن النصر ليس وعداً دائماً، وأن السنن لا تُخالف ولو كان صاحبها على حق.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"khandaq","n":"الخندق والأحزاب","ic":"🛡️","part":"القسم الثالث: بناء الدولة في المدينة","h":"\u003carticle class=\"ch3\" id=\"khandaq\" data-toc=\"الخندق والأحزاب\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الثالث: بناء الدولة في المدينة\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٤ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٣\u003ci\u003e.\u003c/i\u003e٤\u003c/span\u003e\n            \u003ch3\u003eالخندق والأحزاب\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eفي السنة الخامسة للهجرة تجمّعت قبائل العرب على المدينة في جيشٍ يُقال إنه عشرة آلاف، فحُوصرت المدينة نحو شهر. وقد أشار سلمان الفارسي بحفر خندقٍ حول المدينة، فكان هذا الحل — الذي لم تعرفه العرب من قبل — هو الذي أنقذ المسلمين، ثم أرسل الله ريحاً وجنوداً لم يروها فانهزم الأحزاب.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان سبب هذه المعركة أن قريشاً أرادت أن تُنهي أمر المسلمين، فجمعت قبائل العرب معها، وكان فيهم بنو غطفان وبني أسد وأهل نجد، وقد كان في التحريض يهود بني النضير الذين أُخرجوا من المدينة بعد غدرهم، وقد كان في هذا التحالف ما جعل الخطر أشدّ من كل ما سبق، لأنه لم يكن من قريش وحدها بل من قبائل الجزيرة. وقد كان في هذا التحالف ما جعل المسلمين يُدركون أن الدعوة لم تُواجه قبيلةً بل جزيرة، وأن أعداءها قد يتوحّدون عليها ولو كانوا متفرقين في أهوائهم. وقد سُمّيت هذه الغزوة «الأحزاب» لأن الأحزاب تحزّبت على المدينة من كل جهة، وحاصرتها شهراً كاملاً.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان عدد الأحزاب نحو عشرة آلاف، وكان المسلمون نحو ثلاثة آلاف، وكان في المدينة يهود بني قريظة الذين كانوا على عهدٍ مع النبيّ، وقد كان في هذا الوضع ما جعل المدينة في خطرٍ وجودي: أن يُحاصرها جيشٌ من الخارج ويُغدر بها من الداخل، وأن ينفد الطعام في شهرٍ واحد. وقد حُصر المسلمون نحو شهر، حتى بلغ بهم الجهد أن يُربط الحجر على البطن من الجوع، وقد قال جابر بن عبد الله: «إنا يوم الخندق لَنحفر، فإذا بنا بكرشٍ شديد»، فدعا النبيّ بشيءٍ من طعام فبارك فيه فأكل الجيش كله. وقد كان في هذا الحصار ما جعل المدينة تُختبر في صبرها كما اختُبرت في شجاعتها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أشار سلمان الفارسي بحفر خندقٍ على الجهات المكشوفة من المدينة، وكان سلمان قد عرف في فارس حفر الخنادق في الحروب، وقد كان في هذا الاقتراح ما لم تعرفه العرب في حروبهم، وقد قبله النبيّ وعمل به، وقد كان في هذا دليلاً على أن الإسلام كان يستفيد من خبرات الأمم، وأن الحكمة ضالّة المؤمن يأخذها حيث وجدها. وقد كان سلمان الفارسي هو من أشار بحفر الخندق، وكان قد رآه في أرض فارس، وكان الخندق فكرةً جديدة على العرب الذين كانوا يُقاتلون في المكشوف. وقد قال النبيّ فيه: «سلمان منا أهل البيت»، وقد كان في هذا ما جعل الإسلام يُثمّن الخبرة ولو جاءت من أمةٍ أخرى.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد عمل المسلمون في حفر الخندق عملاً شاقاً، وكان النبيّ يعمل معهم، وكانوا ينقلون التراب على ظهورهم، وكان الجوع شديداً حتى ربطوا على بطونهم الحجارة، وقد رُوي أنهم كانوا يقولون: «اللهم لولا أنت ما اهتدينا، ولا تصدّقنا ولا صلّينا»، وقد كان في هذا العمل ما جعل الحفر عبادةً لا مجرد عملٍ عسكري. وقد كان المسلمون يحفرون بالليل والنهار، وكان النبيّ يحمل التراب معهم حتى اغبرّ صدره، وكانوا يُنشدون أشعاراً تُخفف عنهم التعب. وقد كان في هذا العمل المشترك ما جعل الجيش يشعر أنه أمةٌ واحدة، وأن القائد ليس فوق التعب بل فيه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد حاصر الأحزاب المدينة نحو شهر، وكان القتال في معظمه مبارزةً ورمياً، لأن الخندق منع الخيل من العبور، وقد رُوي أن عمرو بن عبد ودّ عبر الخندق مع نفرٍ، فبارزه عليّ بن أبي طالب وقتله، وقد كان في مقتله أثرٌ في معنويات الطرفين. وقد كان عمرو بن عبد ودّ من أشجع فرسان قريش، وكان قد قُتل له قريبٌ في بدر فحلف ألا يُدهن رأسه حتى يثأر، وقد بارز علياً بعد أن عرض على المسلمين أن يُبارزه أحدٌ ثلاث مرات. وقد قال النبيّ حين قُتل: «والذي نفسي بيده لقد ابتدرها اثنتان»، وكان في مقتله ما جعل المشركين يفقدون رجلاً كانوا يعتمدون عليه في الشدائد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الحصار أن المسلمين كانوا في ضيقٍ شديد، حتى قال الله: «إذ جاؤوكم من فوقكم ومن أسفل منكم وإذ زاغت الأبصار وبلغت القلوب الحناجر»، وقد كان في هذا الوصف القرآني ما جعل الحصار حدثاً في الوجدان لا في التاريخ فقط، وأن المسلمين عرفوا في هذا الشهر ما لم يعرفوه في بدر وأُحد. وقد كان الحصار أشدّ من القتال، لأن القتال ساعةٌ والحصار شهر، وقد كان في هذا ما جعل المسلمين يعرفون معنى الثبات الطويل لا مجرد الشجاعة في ساعة. وقد قال الله في ذلك: «إذ جاءوكم من فوقكم ومن أسفل منكم وإذ زاغت الأبصار وبلغت القلوب الحناجر».\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الحصار أن يهود بني قريظة نقضوا عهدهم وتفاوضوا مع الأحزاب، وقد أرسل النبيّ من يتحقّق من الخبر، وقد كان في هذا الخطر ما جعل المدينة بين جيشٍ من الخارج وغدرٍ من الداخل، وقد كان في هذا أشدّ ما مرّ بالمسلمين في سنوات المدينة. وقد كان بنو قريظة في حصنهم على طرف المدينة، وكانوا في عهدٍ مع النبيّ، فلمّا رأوا الأحزاب يُحيطون بالمدينة نقضوا العهد، وكان في نقضهم ما جعل المدينة مكشوفةً من جهةٍ لم تكن محصّنة. وقد أرسل النبيّ إليهم من يتحقق الخبر، فأكد لهم أنهم نقضوا، وكان في هذا الخبر ما جعل الليل أطول ليلةٍ على المسلمين.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد انتهى الحصار بلا معركة؛ فقد أرسل الله ريحاً شديدة في ليلةٍ باردة، فقلبت قدورهم وخيامهم، واختلفت كلمتهم، فارتحلوا. وقد قال النبيّ في ذلك: «لا إله إلا الله وحده، أعزّ جنده، ونصر عبده، وهزم الأحزاب وحده»، وقد كان في هذا النصر ما جعل المسلمين يعرفون أن الله قد ينصر بالريح كما ينصر بالسيف. وقد أرسل الله ريحاً في ليلةٍ باردة قلعت خيامهم وأطفأت نيرانهم وأكفأت قدورهم، وكان في هذا ما جعل الأحزاب يتفرقون من غير قتال. وقد قال النبيّ حين ذهب الخوف: «الآن نغزوهم ولا يغزوننا»، وكان في هذه الكلمة إعلاناً بأن المدينة لم تبقَ في موقع الدفاع بعد ذلك.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه المعركة أثرٌ في ترتيب القوى بعدها: أن قريشاً فقدت القدرة على مهاجمة المدينة، وأن القبائل عرفت أن المسلمين صاروا قوةً لا تُهزم بسهولة، وأن الطريق صار مفتوحاً بعد ذلك للصلح ثم للفتح. وقد قال النبيّ بعدها: «الآن نغزوهم ولا يغزوننا»، وقد كان في هذه الكلمة إعلاناً بانتقال المسلمين من الدفاع إلى الهجوم. وقد كان في هذا الانتقال ما جعل الجزيرة تعرف أن المدينة صارت قوةً تتحرك لا حصناً ينتظر، وأن المسلمين بعد الخندق لم يعودوا يُقاتلون على أبواب بيوتهم. وقد كانت هذه الكلمة مقدمةً لصلح الحديبية، ولما جرى بعده من فتحٍ عظيم.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eسلمان والخندق\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان سلمان الفارسي من أصبهان، وقد خرج من بلده يبحث عن دين الحق، ومرّ على الرهبان والنصارى، حتى وقع في الأسر وبيع عبداً، ثم أُعتق وأسلم، وقد كان في قصته ما يُبيّن أن البحث عن الحق قد يُكلّف الإنسان سنواتٍ من الغربة. وقد رُوي أنه تنقّل بين الرهبان والقسّيسين يبحث عن دينٍ لم يُحرّف، حتى دلّه أحدهم على نبيٍّ يخرج في أرض العرب، فسافر إليها وبيع عبداً في طريق. وقد كان في قصته ما جعل إسلامه ثمرة بحثٍ طويل لا مصادفة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أشار بحفر الخندق لأنه رآه في حروب فارس، وقد كان في هذا دليلاً على أن الإسلام لم يكن ضد الاستفادة من خبرات الآخرين، وأن النبيّ قبل رأياً من رجلٍ حديث العهد بالإسلام، وأن القيادة النبوية كانت تُقدّر الخبرة أكثر من القِدم في الإسلام. وقد قال النبيّ فيه: «سلمان منا أهل البيت».\u003c/p\u003e\u003ch4 class=\"sub\"\u003eنقض بني قريظة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان بنو قريظة يهوداً في المدينة، وكان بينهم وبين النبيّ عهدٌ في وثيقة المدينة، وكان من بنودها أن من نُصر عليه يُنصر، وأن المدينة حرمٌ لا يُحدث فيها حدث. وقد كان في نقضهم للعهد في أشدّ الأوقات خطراً على المسلمين، لأن المدينة صارت مكشوفةً من الداخل. وقد كان في نقضهم للعهد ما جعل المسلمين يُعيدون النظر في كل عهدٍ مع غيرهم، وأن العهد يُحفظ ما حُفظ، ويُردّ النقض بمثله.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا النقض ما جعل النبيّ يُعيد النظر في العلاقة مع من نقض العهد، وقد حكم فيهم بعد الحصار حكماً شديداً، وقد كان في هذا الحكم ما اختلف فيه المؤرخون، لكن الثابت أن نقض العهد في وقت الحرب كان جريمةً عسكرية في عُرف ذلك الزمان، وأن الدولة الجديدة لم تكن تستطيع أن تتحمّل غدراً في وجود جيشٍ على أبوابها.\u003c/p\u003e\u003ch4 class=\"sub\"\u003e«الآن نغزوهم ولا يغزوننا»\u003c/h4\u003e\u003cp class=\"ap\"\u003eبعد الخندق تغيّر وضع المسلمين: فقد كانت قريش هي التي تهجم في بدر وأُحد والخندق، وصارت بعد الخندق في موضع الدفاع، وقد كان في هذا التحوّل ما جعل النبيّ يقول كلمته المشهورة: «الآن نغزوهم ولا يغزوننا، نحن نسير إليهم». وقد كان في هذه الكلمة ما يُبيّن أن القيادة النبوية كانت تعرف كيف تُحوّل الدفاع إلى هجوم، وأن الخطر إذا انكشف أُخذت منه المبادرة. وقد كان في هذا التحول بداية مرحلةٍ جديدة في تاريخ المدينة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه الكلمة إعلاناً بمرحلةٍ جديدة: أن الدولة صارت قادرةً على أن تُبادِر، وأن الصلح الذي جاء بعد ذلك في الحديبية كان صلحاً من موقع القوة لا من موقع الضعف، وأن فتح مكة بعد سنتين كان ثمرةً لهذا التحول في ميزان القوى. وقد كان في هذا ما جعل المسلمين يُدركون أن الصلح قد يكون أقوى من الحرب إذا كان من موقع القوة، وأن من أخذ المبادرة في التوقيت أخذها في النتيجة.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالتاريخ\u003c/b\u003e\u003cspan\u003eالسنة الخامسة للهجرة، وحصارٌ نحو شهر.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالأعداد\u003c/b\u003e\u003cspan\u003eنحو ١٠٠٠٠ من الأحزاب مقابل ٣٠٠٠ من المسلمين.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالفكرة\u003c/b\u003e\u003cspan\u003eحفر الخندق، وأشار بها سلمان الفارسي.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالنهاية\u003c/b\u003e\u003cspan\u003eريحٌ شديدة فرّقت الأحزاب دون معركة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالأثر\u003c/b\u003e\u003cspan\u003eانتقال المسلمين من الدفاع إلى الهجوم.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمعركة\u003c/th\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالأسلوب\u003c/th\u003e\u003cth\u003eالنتيجة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eبدر\u003c/td\u003e\u003ctd\u003e٢هـ\u003c/td\u003e\u003ctd\u003eقتالٌ في العراء\u003c/td\u003e\u003ctd\u003eنصرٌ حاسم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eأُحد\u003c/td\u003e\u003ctd\u003e٣هـ\u003c/td\u003e\u003ctd\u003eقتالٌ عند جبل\u003c/td\u003e\u003ctd\u003eهزيمةٌ بعد نصر\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالخندق\u003c/td\u003e\u003ctd\u003e٥هـ\u003c/td\u003e\u003ctd\u003eحصارٌ وخندق\u003c/td\u003e\u003ctd\u003eفشل الأحزاب وانهزامهم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eخيبر\u003c/td\u003e\u003ctd\u003e٧هـ\u003c/td\u003e\u003ctd\u003eحصارُ حصون\u003c/td\u003e\u003ctd\u003eفتحٌ كامل\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eفتح مكة\u003c/td\u003e\u003ctd\u003e٨هـ\u003c/td\u003e\u003ctd\u003eدخولٌ بلا قتال\u003c/td\u003e\u003ctd\u003eتسليمُ قريش\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eالآن نغزوهم ولا يغزوننا.\u003c/p\u003e\u003ccite\u003eالنبيّ ﷺ بعد انتهاء حصار الخندق\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eعشرة آلافٍ حاصروا المدينة، فأنقذها خندقٌ أشار به سلمان، ثم ريحٌ فرّقت الأحزاب. وقد كانت هذه المعركة نقطة التحول: أن المسلمين صاروا بعدها يغزون لا يُغزَون، وأن الطريق إلى الصلح ثم الفتح صار مفتوحاً.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-4","n":"القسم الرابع: الصلح والفتح","ic":"🕊️","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-4\" style=\"--c:#1E6B3A\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🕊️\u003c/div\u003e\n      \u003ch2\u003eالقسم الرابع: الصلح والفتح\u003c/h2\u003e\n      \u003cp\u003eمن الحديبية إلى تبوك: كيف انتقل المسلمون في ستّ سنوات من طلبِ أمانٍ للعمرة إلى دولةٍ تُراسل ملوك الأرض، وتفتح مكة بلا قتال، وتُوحّد الجزيرة تحت رايةٍ واحدة. هذا القسم يقرأ الصلح لا كهزيمةٍ في الشكل بل كفتحٍ في المآل، ويقرأ الفتح لا كانتقامٍ بل كعفوٍ عام، ويقرأ تبوك لا كحربٍ بل كإعلانِ حدودٍ للدولة الجديدة.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#hudaybiya\"\u003eصلح الحديبية وبيعة الرضوان\u003c/a\u003e\u003ca href=\"#letters-khaybar\"\u003eالرسائل وخيبر ومؤتة\u003c/a\u003e\u003ca href=\"#fath-makkah\"\u003eفتح مكة والعفو العام\u003c/a\u003e\u003ca href=\"#hunayn-tabuk\"\u003eحنين والطائف وتبوك\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"hudaybiya","n":"صلح الحديبية وبيعة الرضوان","ic":"🕊️","part":"القسم الرابع: الصلح والفتح","h":"\u003carticle class=\"ch3\" id=\"hudaybiya\" data-toc=\"صلح الحديبية وبيعة الرضوان\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الرابع: الصلح والفتح\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ١ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٤\u003ci\u003e.\u003c/i\u003e١\u003c/span\u003e\n            \u003ch3\u003eصلح الحديبية وبيعة الرضوان\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eفي السنة السادسة من الهجرة خرج النبيّ ﷺ بألفٍ وأربعمئةٍ من أصحابه يريدون العمرة لا الحرب، فصدّتهم قريش عند الحديبية، وجرت بينهم مفاوضاتٌ انتهت إلى صلحٍ بدا في ظاهره إجحافاً بالمسلمين، وكان في حقيقته أعظم فتحٍ سياسيٍّ في تاريخ الدعوة.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eلمّا اطمأنّ المسلمون في المدينة بعد الخندق، رأى النبيّ ﷺ في منامه أنه دخل المسجد الحرام هو وأصحابه آمنين مُحلّقين رؤوسهم، فأخبر أصحابه بذلك، ففرحوا فرحاً شديداً، وظنّوا أن الرؤيا تتحقق في ذلك العام. فدعاهم إلى العمرة، وأمرهم أن يخرجوا في هيئة مُعتمرين لا في هيئة مقاتلين: لا يحملون سلاحاً إلا ما يحمله المسافر من سيفٍ في غمده، ويسوقون الهدي أمامهم ليرى الناس أنهم زوّارٌ لا غزاة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوخرج معه ألفٌ وأربعمئةٍ من المهاجرين والأنصار، وساقوا سبعين بدنةً، وأحرموا من ذي الحليفة، وكان في خروجهم هذا رسالةٌ سياسية بليغة: أن المسلمين قومٌ يُريدون العبادة، وأن من يصدّهم عن البيت فهو الظالم لا هم. ولم يكن هذا الخروج ضعفاً بل كان أشدّ خطراً على هيبة قريش من جيشٍ يُقاتل، لأن العرب كانت ترى في منع الزائر عن البيت عاراً لا يُغتفر.\u003c/p\u003e\u003cp class=\"ap\"\u003eولمّا وصلوا إلى الحديبية، وهي مكانٌ على حدود الحرم على بُعد نحو أربعة عشر كيلاً من مكة، بركت ناقة النبيّ ﷺ فلم تقم، فقال الناس: خلأت القصواء، فقال النبيّ ﷺ: «ما خلأت وما هو لها بخلق، ولكن حبسها حابس الفيل». ثم أرسل إلى قريش من يُخبرهم أنه جاء مُعتمراً لا مُحارباً، وأرسل عثمان بن عفان يُبلّغهم بذلك، وكان عثمان ذا قرابةٍ فيهم فحُبس عندهم أياماً.\u003c/p\u003e\u003cp class=\"ap\"\u003eوشاع بين المسلمين أن عثمان قد قُتل، وكان في هذا الخبر ما جعل الموقف يتغيّر: فلم يكن أمامهم إلا أن يُقاتلوا أو يُسلّموا، وكان القتال في الشهر الحرام وفي حدود الحرم أمراً عظيماً. فدعا النبيّ ﷺ أصحابه إلى البيعة، وكانت تحت شجرةٍ في الحديبية، فبايعوه على أن لا يفروا من الزحف، وعلى أن يُقاتلوا حتى الموت، وقد كانت بيعةً على الثبات لا على الملك، لأنهم لم يكونوا يبايعون على غنيمةٍ ولا على سلطان.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد نزل في هذه البيعة قوله تعالى: «لقد رضي الله عن المؤمنين إذ يبايعونك تحت الشجرة فعلم ما في قلوبهم فأنزل السكينة عليهم وأثابهم فتحاً قريباً»، فسُمّيت «بيعة الرضوان» لأن الله أخبر أنه رضي عن أهلها. وقد كان في هذه البيعة ما يُبيّن أن الطاعة في لحظة الخطر تُقاس بالصدق لا بالعدد، وأن من ثبت في ساعة الشدة صار أهلاً لشهادةٍ من الله تُقرأ إلى قيام الساعة.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم جاءت المفاوضات، وأرسلت قريش سهيل بن عمرو، وكان رجلاً صلباً في المفاوضة، فجرى بينه وبين النبيّ ﷺ كلامٌ طويل، واتفقا على شروطٍ كتبها عليّ بن أبي طالب، وكان في كتابتها مواقفُ شديدة على المسلمين. فلمّا أراد عليّ أن يكتب «هذا ما قاضى عليه محمدٌ رسول الله» قال سهيل: لو كنا نعلم أنك رسول الله ما صددناك عن البيت ولا قاتلناك، ولكن اكتب «محمد بن عبد الله». فقال النبيّ ﷺ: «اكتب محمد بن عبد الله»، فقال المسلمون: لا نُقرّ بذلك، فكادت الفتنة تقع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت شروط الصلح أن يرجع المسلمون ذلك العام ولا يدخلوا مكة، وأن يعتمروا في العام القادم ويُقيموا ثلاثاً، وأن تضع الحرب أوزارها عشر سنين، وأن من أراد أن يدخل في حلف قريش دخل، ومن أراد أن يدخل في حلف المسلمين دخل، وأن من جاء من قريش إلى المسلمين مُسلماً رُدّ إليهم، ومن جاء من المسلمين إلى قريش لم يُردّ إليهم. وكان في هذا الشرط الأخير إجحافٌ ظاهر بالمسلمين، حتى قال عمر بن الخطاب: «فلم نُعطِ الدنيّة في ديننا».\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد جزع المسلمون جزعاً شديداً، حتى إن بعضهم لم يُطق أن يُحلّ من إحرامه حين أمرهم النبيّ ﷺ بالنحر والحلق، فدخل النبيّ ﷺ على أم سلمة فأخبرته بما لقي من الناس، فأشارت عليه أن يخرج ولا يُكلّم أحداً حتى ينحر ويحلق، ففعل، فلمّا رأى الناس ذلك نحروا وحلقوا. وقد كان في هذا الموقف درسٌ في القيادة: أن القائد قد يرى ما لا يراه الناس، وأن الصبر على ما يبدو مُرّاً قد يكون عين العقل.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم نزلت سورة الفتح في طريق العودة، وفيها قوله تعالى: «إنا فتحنا لك فتحاً مبيناً»، فكان في هذا النصّ ما جعل المسلمين يُعيدون النظر في تقييمهم: أن ما ظنّوه إجحافاً كان فتحاً، وأن الحكم على الأحداث لا يكون بحاضرها بل بعواقبها. وقد قال النبيّ ﷺ لعمر حين سأله: «أو ليس قد أخبرتك أنا ندخل المسجد الحرام آمنين مُحلّقين رؤوسنا؟»، فكان في هذا تربيةً على الثقة بالوعد الإلهي ولو تأخّر تحققه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت نتائج الصلح أعظم من نتائجه الظاهرة: فقد أمن الناس بعضهم بعضاً، واختلط المسلمون بالمشركين في الأسواق والمواسم، وسمع كثيرٌ من قريش القرآن لأول مرة بلا سيفٍ يُخيفهم، فدخل في العامين التاليين من دخل في الإسلام أكثر ممن دخل في تسع عشرة سنة قبل ذلك. وقد قال النبيّ ﷺ في تقييم الصلح: «إنه لفتح»، وكان في هذا ما يُبيّن أن الحرب ليست الطريق الوحيد للنصر، وأن التنازل في الشكل قد يكون ربحاً في الجوهر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي العام التالي خرج المسلمون لأداء العمرة كما اشترط الصلح، فدخلوا مكة وهم مُحرمون، وأقاموا ثلاثة أيام، وكان المشركون قد أخلوا لهم الطريق، وكان في هذا الدخول ما جعل أهل مكة يرون المسلمين عن قربٍ لا عن بُعد: منظراً ونظاماً وأخلاقاً. وقد تزوّج النبيّ ﷺ في هذه العمرة ميمونة بنت الحارث، وكان في هذا الزواج ما فتح باباً من القرابة مع قريش، وأن الصلح قد صار علاقةً لا مجرد هدنة.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eلماذا كان الصلح فتحاً؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eلأنه حوّل المسلمين من طرفٍ يُحارب إلى طرفٍ يُعترف به: فقريش التي كانت تُسمّيهم «الصُّباة» وتُحرّم عليهم دخول مكة، صارت تُفاوضهم وتُعاهدهم وتُسمّيهم في الوثيقة باسم أبيهم «محمد بن عبد الله». وهذا الاعتراف الوجودي كان أعظم مكسبٍ في الصلح، لأنه أنهى مرحلة الاستضعاف وجعل المسلمين دولةً لها معاهداتٌ وحلفاء.\u003c/p\u003e\u003cp class=\"ap\"\u003eولأنه أوقف الحرب عشر سنين، وكانت الحرب هي التي تُستهلك طاقة المسلمين وتمنعهم من نشر الدعوة. ففي سنوات الصلح أُرسلت الرسائل إلى الملوك، وخرجت السرايا إلى الشام واليمن، ودخلت قبائل كثيرة في الإسلام بلا قتال، وصار للمسلمين حلفاء من غيرهم بعد أن كانوا وحدهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eولأنه فرّق بين قريش وحلفائها في وقتٍ كانت فيه قريش قد أنهكتها الحروب، وكان في هذا التفريق ما جعل ميزان القوى يتغيّر بلا معركة. وقد قال بعض من أسلم من قريش بعد الصلح إنهم لم يكونوا يستطيعون أن يسمعوا القرآن قبل الصلح، فلمّا أمنوا سمعوه فعرفوا. وقد كان في هذا التفريق ما جعل حلفاء قريش يتفرّقون عليها، وأن خزاعة وبني بكرٍ صاروا في حلفين مختلفين، وأن مكة لم تبقَ قادرةً على أن تجمع العرب عليها كما جمعتهم في الخندق.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eشرط الردّ ومنطق الدولة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان أشدّ شروط الصلح على المسلمين شرط ردّ من جاء مُسلماً من قريش، وهو شرطٌ بدا وكأنه يُعيد المستضعفين إلى أعدائهم. وقد وقع في أيام الصلح أن جاء أبو جندل بن سهيل بن عمرو مُسلماً وهو يُرسف في قيوده، وكان أبوه سهيل حاضراً فطالبه به، فردّه النبيّ ﷺ إليه، فكان في هذا أشدّ ما كره المسلمون.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا الشرط معنىً سياسي: أن النبيّ ﷺ كان يُعامل قريشاً معاملة الدول لا معاملة الأعداء، وأن العهد إذا عُقد وجب الوفاء به ولو كان فيه ألم. ولم يكن هذا ضعفاً بل كان بناءً لسمعةٍ سياسية: أن المسلمين قومٌ إذا عاهدوا وفوا، وهذه السمعة هي التي جعلت القبائل تثق بهم وتدخل في حلفهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد جعل الله لهذا الألم مخرجاً في الآية: «وهو الذي كفّ أيديهم عنكم وأيديكم عنهم ببطن مكة من بعد أن أظفركم عليهم»، ثم أنزل في شأن النساء المؤمنات أن يُختبرن ولا يُرددن، فكان في هذا تفريقاً بين الرجال والنساء في حكم الردّ، لأن النساء لا يُخشى عليهن القتال، وكان في هذا رحمةً تُقدّر موضع الألم.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eبيعة الرضوان في الوجدان\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم تكن بيعة الرضوان بيعةً عسكرية فقط، بل كانت عهداً على الموت في مقامٍ لا يُقاتل فيه الإنسان عادةً: فقد كانوا مُحرمين، في الشهر الحرام، في حدود الحرم، أمام عدوٍّ في عقر داره. وكان في هذا الوضع ما جعل البيعة اختباراً خالصاً: أن يبايع الإنسان على أن يقف حيث لا يُتوقع منه أن يقف.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بقي لأهل هذه البيعة شرفٌ في الأمة لا يُنازعهم فيه أحد، لأن الله شهد لهم بالرضا. وكان عمر بن الخطاب بعد ذلك إذا ذُكرت البيعة يقول كلاماً يُبيّن أنه عرف خطأه في يوم الحديبية، وأن اعتراضه كان على ما لم يُدرك عاقبته لا على أصل الطاعة. وقد رُوي أنه قال: «يا رسول الله، ألم تكن تُخبرنا أنا سنأتي البيت فنطوف به؟»، فقال: «بلى، أفأخبرتك أنك تأتيه العام؟» قال: لا، قال: «فإنك تأتيه فتُطاف به». وكان في هذا الحوار ما جعل الاعتراض يُصبح سؤالاً لا اعتراضاً.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه البيعة ما يُبيّن أن الأمة قد تُبتلى بمواقف تبدو مُخالفةً للعقل، وأن دواءها ليس في الاعتراض بل في السؤال والتثبّت. وقد كان عمر من أشدّ الناس اعتراضاً يوم الحديبية، وكان من أعظمهم بعد ذلك، لأن الاعتراض كان على فهمٍ لا على طاعة. وقد كان في بيعة الرضوان ما جعل الناس يُفرّقون بين الطاعة العمياء والطاعة الواعية: أن يبايع الإنسان على الموت وهو يعرف لماذا، وأن يسأل حين لا يفهم ولا يُشكّك حين يُؤمر. وقد كان في هذا ما جعل الأمة تُعلّم أبناءها أن السؤال بابٌ من أبواب الفهم لا من أبواب الخروج.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالسنة السادسة من الهجرة\u003c/b\u003e\u003cspan\u003eخروج ألفٍ وأربعمئةٍ للعمرة، وسوق سبعين بدنة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمكان الصلح\u003c/b\u003e\u003cspan\u003eالحديبية، على حدود الحرم، نحو أربعة عشر كيلاً من مكة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمدة الهدنة\u003c/b\u003e\u003cspan\u003eعشر سنين، وأن يعتمر المسلمون في العام القادم ثلاثة أيام\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eبيعة الرضوان\u003c/b\u003e\u003cspan\u003eبيعةٌ تحت الشجرة على الثبات، وشهد الله لأهلها بالرضا\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسورة الفتح\u003c/b\u003e\u003cspan\u003eنزلت في طريق العودة: «إنا فتحنا لك فتحاً مبيناً»\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eما ظهر في الصلح\u003c/th\u003e\u003cth\u003eما كان في حقيقته\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eرجوع المسلمون بلا عمرة\u003c/td\u003e\u003ctd\u003eتأجيلُ العمرة عاماً واحداً مقابل الاعتراف بالمسلمين طرفاً مُعاهداً\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eكتابة «محمد بن عبد الله» بلا وصف الرسالة\u003c/td\u003e\u003ctd\u003eاعتراف قريش بالاسم والوجود، وهو ما لم تكن تقبله قبل ذلك\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eردّ من جاء مُسلماً من قريش\u003c/td\u003e\u003ctd\u003eالتزامٌ بالعهد يبني سمعةً سياسية تُصدّقها القبائل\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eتوقّف الحرب عشر سنين\u003c/td\u003e\u003ctd\u003eفسحةٌ للدعوة والمراسلات والسرايا، ودخول الناس في الإسلام أفواجاً\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eاكتب محمد بن عبد الله.\u003c/p\u003e\u003ccite\u003eالنبيّ ﷺ لسهيل بن عمرو حين رفض وصف الرسالة في وثيقة الصلح\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eصلح الحديبية كان أعظم فتحٍ في تاريخ الدعوة، لأنه حوّل المسلمين من طرفٍ محارب إلى طرفٍ مُعترف به، وأوقف الحرب عشر سنين، وفتح باب الدعوة بلا سيف. وقد بدا في ظاهره إجحافاً حتى جزع المسلمون، وكان في مآله مقدمةً لفتح مكة بعد سنتين. وفيه درسٌ في أن التنازل في الشكل قد يكون ربحاً في الجوهر، وأن الحكم على الأحداث لا يكون بحاضرها بل بعواقبها.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"letters-khaybar","n":"الرسائل وخيبر ومؤتة","ic":"✉️","part":"القسم الرابع: الصلح والفتح","h":"\u003carticle class=\"ch3\" id=\"letters-khaybar\" data-toc=\"الرسائل وخيبر ومؤتة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الرابع: الصلح والفتح\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٢ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٤\u003ci\u003e.\u003c/i\u003e٢\u003c/span\u003e\n            \u003ch3\u003eالرسائل وخيبر ومؤتة\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eبعد أن أمن جانب قريش، انتقل المسلمون من الدفاع إلى العمل الخارجي: رسائل إلى ملوك الأرض تدعوهم إلى الإسلام، وسرايا إلى الشام واليمن، وغزوة خيبر التي أنهت خطر الحصون اليهودية شمال المدينة، ومؤتة التي فتحت باب الشام.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eلمّا عاد النبيّ ﷺ من الحديبية أرسل رسائل إلى الملوك والأمراء في الأرض، وكتب كتباً في أشراف الرقّ وحمّلها إلى أصحابه، فبعث دحية الكلبي إلى هرقل ملك الروم، وعبد الله بن حذافة إلى كسرى ملك فارس، وعمرو بن أمية الضمري إلى النجاشي ملك الحبشة، وحاطب بن أبي بلتعة إلى المقوقس ملك القبط في مصر. وكان في هذا العمل ما يُبيّن أن الدعوة لم تكن شأناً محلياً، وأن المسلمين صاروا أمةً تُخاطب الأمم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت الرسائل تُكتب بصيغةٍ واحدة تبدأ بـ«بسم الله الرحمن الرحيم، من محمد رسول الله إلى فلان»، وتدعوه إلى الإسلام، وتُذكّره بأنه إن أسلم سلّم له ملكه، وإن أبى فعليه إثم رعيته. وقد بلغ من أثر هذه الرسائل أن كسرى مزّق كتابه حين قرأه، فقال النبيّ ﷺ: «مُزّق ملكه»، وقد مُزّق ملك فارس بعد ذلك بسنوات. أما هرقل فسأل عن النبيّ ﷺ وعن نسبه، ثم قال لقومه إنه يعرف أنه نبيّ لكنه يخاف إن أعلن ذلك أن يفقد ملكه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه المراسلات ما جعل المسلمين يُدركون أن الدعوة تحتاج إلى تنظيمٍ لا إلى حماسة فقط: كاتبٌ يكتب، ورسولٌ يحمل، وأمانٌ في الطريق، وصياغةٌ تُراعي مقام كل مخاطب. وقد كان في اختيار الرسل ما يُبيّن أن الدعوة تحتاج إلى من يعرف لسان القوم وأخلاقهم، وأن من أراد أن يُكلّم ملكاً فليُكلّمه بمن يُحسن الكلام معه. وقد كان في هذه المراسلات أيضاً ما جعل المسلمين يُنظّمون بريدهم: رسالةٌ مكتوبة، وخاتمٌ يُختم به، ورسولٌ أمين، وأمانٌ في الطريق. وقد اتّخذ النبيّ ﷺ خاتماً من فضةٍ نقشه «محمد رسول الله»، وقال: «إن الملوك لا يقرأون كتاباً إلا مختوماً».\u003c/p\u003e\u003cp class=\"ap\"\u003eثم كانت غزوة خيبر في السنة السابعة، وكانت خيبر مجموعة حصونٍ يهودية إلى الشمال من المدينة على بُعد نحو مئةٍ وخمسين كيلاً، وكانت مركزاً للتحريض على المسلمين، وملجأً لمن أُخرج من المدينة من بني النضير. فخرج النبيّ ﷺ إليها بألفٍ وأربعمئةٍ من أصحابه، وكان فيهم من بقي في المدينة من أهل الأعذار، وأمر النبيّ ﷺ أن لا يخرج معه إلا من رغب في الجهاد لا من رغب في الغنيمة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت خيبر حصوناً متفرقة، فحاصر المسلمون حصن ناعم ثم حصون النطاة ثم القموص ثم الوطيح والسلالم، وكان القتال شديداً، وكان النبيّ ﷺ يُعطي الراية لأصحابه فيُقاتلون بها، فلما كان آخر الأيام قال: «لأُعطين الراية غداً رجلاً يُحبّه الله ورسوله ويُحبّ الله ورسوله، يفتح الله على يديه»، فبات الناس يتساءلون من يكون، فدعا عليّاً وقد كان أرمد العين، فتفل في عينه فبرأ، فأعطاه الراية، ففتح الله على يديه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في فتح خيبر ما يُبيّن أن النصر لا يُقاس بالعدد بل بالثبات، وأن النبيّ ﷺ كان يُعطي القيادة على أساس الكفاءة لا على أساس القرابة، وكان في إعطائه الراية لعليّ مع مرضه إشارةٌ إلى أن القائد لا يُشترط فيه سلامة البدن بل سلامة القلب والرأي. وقد كان في فتح الحصون المتفرقة ما جعل المسلمين يتعلّمون حرب الحصار، وكانوا قبل ذلك أهل حرب المكشوف.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد قُتل في خيبر نفرٌ من المسلمين، ومنهم بعض من كان مع النبيّ ﷺ، وأصاب الناس جهدٌ شديد، حتى إنهم لم يجدوا طعاماً إلا لحوم الحُمُر الأهلية فنحروا منها، فنادى منادي النبيّ ﷺ أن لا تُؤكل لحوم الحُمُر الأهلية، وكان في هذا تشريعاً في وقت الحاجة، وأن الحاجة لا تُبيح ما حرّم الله. وقد كان في هذا الصلح ما جعل خيبر تُنتج للمسلمين ثمراً بلا جيشٍ يُقيم فيها، وأن الحرب إذا انتهت صارت علاقة عملٍ لا علاقة ثأر. وقد بقي هذا النمط في الفتوح بعد ذلك: أرضٌ تُفتح ويبقى أهلها عليها، وتُضرب عليهم خراجٌ معلوم، فتصير الأرض وقفاً للمسلمين وتبقى الحياة فيها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوبعد الفتح صالح النبيّ ﷺ أهل خيبر على أن يبقوا في أرضهم يُعمّرونها ولهم نصف الثمر وللمسلمين النصف، وكان في هذا الصلح ما يُبيّن أن الحرب لا تُنهى إلا بترتيبٍ يُعاش بعده، وأن من أراد أن يحكم أرضاً فليُبقِ من يعرف زراعتها. وقد بقي هذا الصلح معمولاً به حتى أجلاهم عمر بن الخطاب بعد ذلك في خلافته. وكان في هذا الترتيب ما يُبيّن أن النبيّ ﷺ كان يُدرك أن القائد قد يُقتل، وأن الجيش إذا لم يكن له بديلٌ محدّد اضطرب عند فقد قائده. وقد كان في تسمية ثلاثةٍ على الترتيب ما جعل مؤتة تُخاض بقادةٍ يعرف كلٌّ منهم موقعه، وأن الراية لم تسقط في الأرض لحظة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي السنة الثامنة كانت مؤتة، وكان سببها أن النبيّ ﷺ أرسل الحارث بن عمير الأزدي بكتابه إلى ملك بُصرى، فقتله شرحبيل بن عمرو الغساني، فقتل رسولٌ من المسلمين في طريقٍ لم يكن فيه قتال. فبعث النبيّ ﷺ ثلاثة آلافٍ، وأمّر عليهم زيد بن حارثة، وقال: «إن قُتل زيد فجعفر بن أبي طالب، وإن قُتل جعفر فعبد الله بن رواحة»، وكان في هذا الترتيب ما يُبيّن أن القيادة تُرتب بالاسم لا تُترك للفوضى.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد لقي المسلمون في مؤتة جيشاً من الروم والعرب يُقال إنه مئتا ألف، فقاتلوا قتالاً شديداً، وقُتل القادة الثلاثة واحداً بعد واحد كما قال النبيّ ﷺ، ثم أخذ الراية خالد بن الوليد فانحاز بالجيش وانسحب به، وكان في هذا الانسحاب ما يُعدّ من أعظم أعمال خالد العسكرية. وقد قال النبيّ ﷺ في خبر مؤتة: «أخذ الراية زيد فأُصيب، ثم أخذها جعفر فأُصيب، ثم أخذها عبد الله بن رواحة فأُصيب»، ثم قال: «ثم أخذها سيفٌ من سيوف الله ففتح الله به».\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في مؤتة درسٌ في أن الانسحاب المنظّم قد يكون نصراً، وأن حفظ الجيش أولى من الثبات في موضعٍ لا يُرجى فيه غلبة. ولم تكن مؤتة فتحاً في الأرض لكنها كانت فتحاً في السمعة: أن العرب سمعت أن ثلاثة آلافٍ وقفت أمام جيشٍ عظيمٍ وخرجت منه، وأن المسلمين صاروا يُحسبون في الشام قوةً لا يُستهان بها. وقد قال النبيّ ﷺ في خبر مؤتة حين أُخبر بها: «أخذ الراية زيد فأُصيب، ثم أخذها جعفر فأُصيب، ثم أخذها عبد الله بن رواحة فأُصيب»، وكان في هذا الخبر ما جعل المسلمين يعرفون أن القيادة قد تُستشهد ولا تنتهي، وأن الراية تُنتقل من يدٍ إلى يدٍ ولا تسقط.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالرسائل وحدود الدولة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الرسائل إعلاناً بأن الإسلام دينٌ عالمي لا قبلي، وأن النبيّ ﷺ يرى نفسه مسؤولاً عن تبليغ الناس كافة. وقد كتب إلى هرقل وكسرى والنجاشي والمقوقس، وكانت هذه أعظم قوى الأرض في زمانه، وكان في مخاطبتهم ما يُبيّن أن الدعوة لا تعرف حدوداً سياسية. وقد كان في اختيار وقتها بعد الصلح ما يُبيّن أن الدعوة تحتاج إلى أمنٍ في الطريق، وأن من أراد أن يُخاطب الأمم فليبدأ بتأمين ظهره.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في صياغة الرسائل أدبٌ في المخاطبة: يبدأ باسمه ونسبه، ثم يدعو، ثم يُحذّر، ولا يسبّ أحداً ولا يُهدد بجيش. وكان في هذا ما جعل بعض الملوك يحفظ الرسالة ويُكرم الرسول، حتى إن المقوقس أهدى إلى النبيّ ﷺ جاريةً وبغلة، وكان في هذا إقرارٌ بأن المسلمين صاروا أمةً تُخاطب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في مصير الرسائل عبرةٌ في أن الدعوة لا تُقاس بنتائجها القريبة: فكسرى مزّق الكتاب ومزّق الله ملكه، وهرقل عرف ولم يُعلن، والنجاشي أسلم وأخفى إسلامه. وكلٌّ أُخذ بما فعل، وكان في هذا ما يُبيّن أن البلاغ مسؤولية المُبلّغ والقبول مسؤولية المُبلَّغ. وقد كان في هذا ما يُبيّن أن الدعوة تُبلّغ بالأمانة لا بالنتيجة، وأن حساب الناس على ما بلغهم لا على ما أراده المُبلّغ.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eخيبر ومعنى الحصار\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت خيبر أول حرب حصارٍ يُخوضها المسلمون على حصونٍ منيعة، وكانوا قبل ذلك أهل حرب المكشوف في بدر وأُحد والخندق. وقد تعلّموا فيها أن الحصار يحتاج إلى صبرٍ طويل، وأن تقسيم الحصون وقطع بعضها عن بعض أجدى من الهجوم الشامل، وأن قطع النخيل قد يكون وسيلة ضغطٍ لا غاية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في خيبر أيضاً درسٌ في توزيع الغنائم، فقد كانت أرضاً ذات نخيلٍ وعقار، فلم تُقسَم كما تُقسَم الأموال المنقولة، بل صولح أهلها على نصف الثمر. وكان في هذا ابتكاراً في إدارة الأرض المفتوحة، وأن الفتح لا يعني الإخلاء بل تنظيم العلاقة. وقد كان في هذا ما جعل الفقه يُفرّق بين ما يُنقل من الأموال وما يبقى من الأرض، وأن لكلٍّ حكمه، وأن من أراد أن يحكم أرضاً فليُبقِ من يعرف زراعتها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في خيبر ما جعل المسلمين يُدركون خطر التحريض الداخلي: كانت خيبر ملجأً لمن أُخرج من المدينة، ومركزاً للاتصال بالأحزاب، وكان في فتحها ما جعل الشمال خالياً من قاعدةٍ تُعادي المدينة، وكان في هذا تمهيداً لتبوك بعد ذلك. وقد كان في خيبر ما جعل المدينة في مأمنٍ من الشمال، وأن النبيّ ﷺ لم يخرج إلى تبوك بعد ذلك وفي ظهره حصنٌ يُعادي. وقد كان في هذا درسٌ في أن الجيوش لا تتحرك إلا إذا أُمن ظهرها، وأن من ترك خلفه خطراً لم يخرج إلى خطرٍ أكبر.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eمؤتة والانسحاب الشريف\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت مؤتة أول لقاءٍ بين المسلمين والروم، وأول مرة يُقاتل المسلمون قوةً عظمى في خارج الجزيرة. وقد كانت ثلاثة آلافٍ أمام جيشٍ يُقال إنه مئتا ألف، وكان في هذا الفرق ما جعل المعركة اختباراً للثبات لا للأمل في الغلبة، وقد ثبت المسلمون حتى قُتل قادتهم الثلاثة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في انسحاب خالد بن الوليد ما يُبيّن أن القيادة تعرف متى تُقاتل ومتى تنسحب، وأن الانسحاب ليس فراراً إذا كان بقرارٍ لا بخوف. وقد رتّب خالد الصفوف على هيئةٍ جعلت العدو يظنّ أن مدداً جاء المسلمين، فتراجع الروم، وخرج المسلمون بجيشهم. وقد كان في هذا الانسحاب ما جعل الفقهاء يُقعّدون قاعدةً: أن حفظ الجيش مطلوبٌ شرعاً، وأن القتال إلى الموت ليس مطلوباً في كل موضع، وأن الفرار من الزحف حرامٌ أما الانحياز بقرارٍ فليس منه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في مؤتة ما جعل النبيّ ﷺ يُسمّي خالداً «سيفاً من سيوف الله»، وكان في هذا استشرافاً لما سيكون منه في اليرموك بعد ذلك. وقد كان في مؤتة أيضاً درسٌ في أن الجيش قد يُصاب في قادته ولا ينهار إذا كانت الراية تُنتقل بترتيب. وقد كان في مؤتة ما جعل المسلمين يعرفون أن الروم أمةٌ ذات جيشٍ منظّمٍ وعدة، وأن قتالهم يحتاج إلى تجهيزٍ غير تجهيز العرب. وقد كان في هذا الدرس ما ظهر بعد سنواتٍ في اليرموك، حين قاتل المسلمون الروم على أرضهم وبجيشٍ أكبر.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالرسائل\u003c/b\u003e\u003cspan\u003eإلى هرقل وكسرى والنجاشي والمقوقس وغيرهم بعد الحديبية\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eخيبر\u003c/b\u003e\u003cspan\u003eالسنة السابعة، حصونٌ شمال المدينة، فُتحت بعد حصارٍ وقتال\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eصلح خيبر\u003c/b\u003e\u003cspan\u003eبقاء أهلها على نصف الثمر وللمسلمين النصف\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمؤتة\u003c/b\u003e\u003cspan\u003eالسنة الثامنة، ثلاثة آلافٍ أمام الروم، وقادةٌ ثلاثة قُتلوا\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eخالد بن الوليد\u003c/b\u003e\u003cspan\u003eأخذ الراية وانسحب بالجيش، فسُمّي «سيفاً من سيوف الله»\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eرسائل الملوك\u003c/td\u003e\u003ctd\u003e٦–٧ هـ\u003c/td\u003e\u003ctd\u003eإعلان عالمية الدعوة، ودخول المسلمين في مخاطبة الأمم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eفتح خيبر\u003c/td\u003e\u003ctd\u003e٧ هـ\u003c/td\u003e\u003ctd\u003eإزالة قاعدة التحريض شمال المدينة، وتأمين الطريق إلى الشام\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eعمرة القضاء\u003c/td\u003e\u003ctd\u003e٧ هـ\u003c/td\u003e\u003ctd\u003eدخول مكة مُحرمين، ورؤية أهلها للمسلمين عن قرب\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eمؤتة\u003c/td\u003e\u003ctd\u003e٨ هـ\u003c/td\u003e\u003ctd\u003eأول لقاءٍ مع الروم، وانسحابٌ منظّم حفظ الجيش\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eلأُعطين الراية غداً رجلاً يُحبّه الله ورسوله ويُحبّ الله ورسوله، يفتح الله على يديه.\u003c/p\u003e\u003ccite\u003eالنبيّ ﷺ في خيبر، ثم أعطى الراية عليّ بن أبي طالب\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eبعد الصلح انتقل المسلمون من الدفاع إلى العمل الخارجي: رسائل إلى ملوك الأرض أعلنت عالمية الدعوة، وخيبر أنهت قاعدة التحريض شمال المدينة وعلّمت المسلمين حرب الحصار، ومؤتة فتحت باب الشام وأثبتت أن الانسحاب المنظّم قد يكون نصراً. وفي هذه المرحلة صار للمسلمين حلفاء وسمعة وحدود.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"fath-makkah","n":"فتح مكة والعفو العام","ic":"🏳️","part":"القسم الرابع: الصلح والفتح","h":"\u003carticle class=\"ch3\" id=\"fath-makkah\" data-toc=\"فتح مكة والعفو العام\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الرابع: الصلح والفتح\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٣ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٤\u003ci\u003e.\u003c/i\u003e٣\u003c/span\u003e\n            \u003ch3\u003eفتح مكة والعفو العام\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eفي رمضان من السنة الثامنة نقضت قريشٌ وحلفاؤها العهد، فخرج النبيّ ﷺ بعشرة آلافٍ في سرّيةٍ تامة، ودخل مكة بلا قتالٍ يُذكر، وأعلن عفواً عاماً عن أهلها، وكان في هذا الفتح ما أنهى مرحلة الصراع مع قريش وأسّس لمرحلةٍ جديدة.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان بنو بكرٍ حلفاء قريش، وخزاعة حلفاء المسلمين، وكان بينهما ثأرٌ قديم، فلمّا جاء الصلح دخل كلٌّ في حلفٍ، وكان في هذا الحلف ما يُفترض أن يمنع القتال بينهما. لكن بني بكرٍ أغروا رجالاً من قريش فأعانوهم بالسلاح والرجال، وهجموا على خزاعة في الليل وهم على ماءٍ لهم، فقتلوا منهم نفراً، وكان في هذا الهجوم نقضٌ صريحٌ للصلح. وقد كان الصلح ينصّ على أن من دخل في حلف قريشٍ دخل، ومن دخل في حلف المسلمين دخل، وأن بين الفريقين ألا يُقاتل بعضهم بعضاً. فلمّا اعتدى بنو بكرٍ على خزاعة كان في هذا اعتداءً على حلفاء المسلمين، وكان في إعانة قريش لهم بالسلاح والرجال نقضاً مباشراً للعهد لا تأويلاً فيه.\u003c/p\u003e\u003cp class=\"ap\"\u003eفخرج عمرو بن سالم الخزاعي إلى المدينة يستنصر النبيّ ﷺ، وأنشد بين يديه شعراً يُخبره بما جرى، وقال في آخره: «يا ربّ إني ناشدٌ محمداً، حلف أبينا وأبيه الأتلدا». فلمّا سمع النبيّ ﷺ قال: «نُصرت يا عمرو بن سالم»، ثم أرسل إلى قريش يخيّرهم بين ثلاث: أن يدفعوا دية القتلى، أو يُبرئوا أنفسهم من حلف بني بكر، أو يُعلنوا أن الصلح منقوض. فاختارت قريش الحرب، وكان في هذا الاختيار ما جعل النقض ثابتاً بالحجة لا بالدعوى.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأراد النبيّ ﷺ أن يدخل مكة بغتةً، فأمر بالتجهيز وأخفى الوجهة، ولم يُخبر الناس أنه يقصد مكة، حتى إن أبا بكر جاء يستأذنه في أن يُخبر ابنته عائشة، فسأله النبيّ ﷺ: «إلى أي شيءٍ تُريد أن تُخبرها؟»، فسكت أبو بكر. وكان في هذه السرّية ما جعل قريشاً تُفاجأ، وكان حاطب بن أبي بلتعة قد كتب كتاباً إلى قريش يُخبرهم بمسير النبيّ ﷺ، فأُنزلت فيه سورة الممتحنة، وعُوتب ثم عُذر، وكان في هذا درسٌ في أن السرّية أصلٌ من أصول الحرب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوخرج النبيّ ﷺ في رمضان بعشرة آلافٍ، وكان فيهم المهاجرون والأنصار وقبائل العرب، وكان عددٌ منهم من مُسلمة الفتح، وهم من أسلموا حين رأوا القوة. وقد أفطر النبيّ ﷺ في الطريق حتى بلغ الكديد، ثم صام، وكان في هذا مراعاةً لحال الجيش في السفر، وأن الفطر في السفر رخصةٌ لا تُترك إلا حيث تقوى القوة. وقد كان في إفطاره ﷺ في الطريق ثم صيامه ما جعل الناس يعرفون أن الرخصة تُتبع بالمصلحة
