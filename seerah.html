 لا بالهوى، وأن القائد قد يفطر ليقوى على المسير، ثم يصوم حين لا يحتاج إلى ذلك. وقد كان في هذا ما جعل الجيش لا يحرج أحداً في صومه ولا في فطره.\u003c/p\u003e\u003cp class=\"ap\"\u003eولمّا نزل النبيّ ﷺ بمرّ الظهران قرب مكة، أمر أصحابه فأوقدوا عشرة آلاف نار، وكان في هذا الإيضاح ما جعل قريشاً ترى النيران فتفزع. وكان أبو سفيان قد خرج يتحسّس الخبر، فلقيه العباس عمّ النبيّ ﷺ، فحمله إلى النبيّ ﷺ، فأسلم أبو سفيان قبل الدخول، فقال له النبيّ ﷺ: «من دخل دار أبي سفيان فهو آمن، ومن أغلق بابه فهو آمن، ومن دخل المسجد فهو آمن».\u003c/p\u003e\u003cp class=\"ap\"\u003eودخل النبيّ ﷺ مكة في رمضان من السنة الثامنة، وكان مُتواضعاً على راحلته، مُطأطئاً رأسه حتى كاد يمسّ سرجه تواضعاً لله، وكان يقرأ سورة الفتح، وكان في هذا المشهد ما يُبيّن أن الفتح لم يُغيّر من أخلاقه شيئاً، وأنه دخل مكة كما خرج منها قبل عشرين سنة: عبداً لله لا ملكاً. وقد كان في تواضعه ﷺ يوم الفتح ما جعل الناس يعرفون أن الفتح لا يُغيّر الأخلاق، وأن من كان قبل الفتح متواضعاً لا يصير بعده متكبّراً. وقد كان في قراءته سورة الفتح على راحلته ما جعل الدخول عبادةً لا استعراضاً، وأن الجيش الذي دخل مكة لم يدخلها بطبولٍ ولا بأعلامٍ مرفوعة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أمر النبيّ ﷺ خالد بن الوليد أن يدخل من كُدًى في أسفل مكة، وأمر الزبير بن العوام أن يدخل من كُدىً في أعلاها، وأمر أبا عبيدة أن يدخل من بطن الوادي، وأمرهم أن لا يُقاتلوا إلا من قاتلهم. وقد لقي خالدٌ في طريقه مقاومةً من نفرٍ من قريش في الخندمة، فقاتلهم وقتل منهم، وكان في هذه المقاومة ما جعل الفتح لا يخلو من دمٍ قليل، وقد عاب النبيّ ﷺ ما جرى وقال: «لم آمر بالقتال».\u003c/p\u003e\u003cp class=\"ap\"\u003eولمّا دخل النبيّ ﷺ المسجد الحرام، طاف بالبيت على راحلته، وكان في البيت ثلاثمئة وستون صنماً، فجعل يطعنها بقوسٍ في يده ويقول: «جاء الحق وزهق الباطل، إن الباطل كان زهوقاً»، وكان في هذا المشهد ما جعل أهل مكة يرون أن ما كانوا يعبدونه قد سقط بلا حربٍ ولا جيش، وأن الأصنام لم تُدافع عن نفسها. وقد كان في طَوافه على راحلته ما جعل الناس يرون أنه لا يخشى شيئاً في البلد الذي أخرجه، وأن الأصنام التي كانت تُرهب الناس لم تمنع قوساً واحداً. وقد كان في هذا المشهد ما جعل بعض أهل مكة يُسلمون قبل أن يسمعوا خطبةً واحدة، لأنهم رأوا أن ما كانوا يُعظّمونه قد سقط بلا معركة.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم وقف النبيّ ﷺ على باب الكعبة وأهل مكة ينتظرون ما يُقال لهم، وقد كانوا قد آذوه وأخرجوه وحاربوه وقتلوا أصحابه، فقال: «ما تقولون أني فاعلٌ بكم؟»، قالوا: خيراً، أخٌ كريم وابن أخٍ كريم. فقال: «اذهبوا فأنتم الطُّلقاء». وكان في هذا العفو العام أعظم درسٍ في تاريخ الفتوح: أن المنتصر قد يعفو في يوم قدرته، وأن العفو في موضع القدرة هو الشجاعة الحقيقية لا الضعف.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد قال النبيّ ﷺ في خطبته يوم الفتح: «إن الله حرّم مكة يوم خلق السماوات والأرض، فهي حرامٌ إلى يوم القيامة، لا يُعضد شوكها ولا يُنفّر صيدها ولا تُلتقط لقطتها إلا لمنشد»، وكان في هذا ما جعل الفتح لا يُغيّر حرمة البلد، وأن الفاتح لا يملك أن يُبدّل ما حرّمه الله. وقد كان في هذا ما جعل الفتح لا يُلغي حرمة البلد، وأن مكة لم تصبح ملكاً للمسلمين يتصرفون فيها كما يشاؤون، بل بقيت حراماً كما كانت. وقد قال ﷺ: «إنها لم تحلّ لأحدٍ قبلي ولا تحلّ لأحدٍ بعدي، وإنما أُحلّت لي ساعةً من نهار»، وكان في هذا ما جعل الفتح حدثاً في التاريخ لا في الجغرافيا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أهدر النبيّ ﷺ دم نفرٍ قليلٍ ممن كانوا يُعذّبون المسلمين ويُؤذون النبيّ ﷺ، وكان في هذا استثناءً يُبيّن أن العفو العام لا يعني إفلات المجرمين، وأن العدل لا يُلغيه الرحمة. وقد أُسلم أكثرهم بعد ذلك أو اختفوا، وكان في هذا ما جعل الفتح استثناءً في تاريخ الفتوح لا قاعدةً. وكان من هؤلاء من كان يُعذّب المسلمين في مكة كعبد الله بن خطل ومقيس بن صبابة، وكان في إهدار دمائهم ما يُبيّن أن العفو العام لا يُلغي حقّ المظلوم، وأن العدل ليس عكس الرحمة بل هو شرطها. وقد فرّ بعضهم فقُتل، واستجار بعضهم فأُجير، وكان في هذا ما جعل الفتح عدلاً لا انتقاماً ولا إفلاتاً.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eلماذا لم تكن مكة فتحاً عادياً؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eلأنها لم تُفتح بالقتال بل بالرهبة، ودخلها النبيّ ﷺ بعشرة آلافٍ ولم يُقتل فيها إلا نفرٌ قليل. وكان في هذا ما جعل الفتح حدثاً سياسياً أكثر منه عسكرياً: أن قريشاً استسلمت لما رأت أن المقاومة لا تُجدي، وأن النبيّ ﷺ أراد أن يدخل البلد الحرام بلا دمٍ يُسفك فيه.\u003c/p\u003e\u003cp class=\"ap\"\u003eولأن العفو العام فيها غيّر موقف قريش تغييراً جذرياً: فقد كان أهل مكة أشدّ الناس عداوةً وأقربهم قرابةً، فلمّا عفا عنهم النبيّ ﷺ دخل كثيرٌ منهم في الإسلام، وصاروا من قادة الفتوح بعد ذلك، كأبي سفيان وعكرمة بن أبي جهل وسهيل بن عمرو. وقد كان في هذا التحوّل ما جعل الإسلام يُعيد تشكيل الناس لا يُلغي كفاءاتهم: فمن كان قائداً في الشرك صار قائداً في الإسلام، ومن كان عدواً صار حليفاً، وكان في هذا ما جعل الأمة الجديدة تستفيد من خبرات من كان يُعادلها.\u003c/p\u003e\u003cp class=\"ap\"\u003eولأنها أنهت مرحلة الصراع مع قريش نهائياً، وصارت مكة بعد الفتح مركزاً للدعوة لا مركزاً للحرب. وقد قال النبيّ ﷺ بعد الفتح: «لا هجرة بعد الفتح، ولكن جهادٌ ونية»، وكان في هذا إعلاناً بأن المرحلة تغيّرت، وأن العمل صار في تثبيت الدولة لا في الهجرة منها. وقد كان في هذا القول ما جعل الناس يعرفون أن مرحلة الهجرة انتهت، وأن المرحلة الجديدة تحتاج إلى عملٍ داخل المجتمع لا إلى فرارٍ منه. وقد كان في هذا ما جعل مكة تعود مركزاً للدعوة بعد أن كانت مركزاً للصدّ عنها.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالعفو في موضع القدرة\u003c/h4\u003e\u003cp class=\"ap\"\u003eوقف أهل مكة أمام النبيّ ﷺ وهم يعرفون ما فعلوا: أخرجوه من داره، وحاصروه في شِعبٍ ثلاث سنين، وقتلوا أصحابه، ومثّلوا بحمزة عمّه. وكانوا يتوقعون أن يُقتلوا أو يُسبوا، فجاءت الكلمة: «اذهبوا فأنتم الطُّلقاء». وكان في وقوفهم هذا ما جعل المشهد أشدّ: أن يعرف الإنسان أنه مذنبٌ ثم يجد العفو، وأن يعرف أن العفو من عند من كان يُعاديه بلا سبب. وقد كان في هذا ما جعل بعضهم يقول: ما رأينا ملكاً أرفّ من هذا، ولا رأينا ديناً أحسن من هذا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا العفو ما جعل الإسلام يدخل قلوب من كان يُعاديه بلا حربٍ ولا مال: أن يرى الإنسان نفسه مقهوراً ثم يُطلق سراحه بلا فداء، فهذا أعظم ما يُغيّر القلب. وقد أسلم في يوم الفتح من لم يكن يُتوقع إسلامه، وكان في هذا ما يُبيّن أن العفو سلاحٌ قد يكون أقوى من السيف.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في العفو العام أيضاً درسٌ في السياسة: أن النبيّ ﷺ أراد أن يجعل من قريش حلفاء لا أعداءً مقهورين، لأن الدولة الجديدة تحتاج إلى من يعرف مكة وإدارتها وتجارتها. وكان في هذا ما جعل الفتح بناءً لا هدماً. وقد كان في العفو العام ما جعل مكة تُدار بعد الفتح بأهلها لا بجيشٍ غريب، وأن النبيّ ﷺ أقرّ كثيراً من مواضعهم كما كانت. وقد كان في هذا درسٌ في أن الفاتح الحق لا يُدمّر ما فتح بل يُصلحه، وأن الدولة تُبنى بالخبرات لا بالثأر.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eتحطيم الأصنام ومعنى التوحيد\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان في الكعبة ثلاثمئة وستون صنماً، وكانت العرب تُعظّمها وتُهدي إليها، وكان في تحطيمها إعلانٌ بأن ما كان يُخيف الناس قروناً لا يملك لنفسه ضراً ولا نفعاً. وقد كان النبيّ ﷺ يطعنها بقوسه ويقرأ: «جاء الحق وزهق الباطل»، وكان في هذا المشهد ما جعل الناس يرون سقوط ما عبدوه بأعينهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في تحطيم الأصنام ما يُبيّن أن التوحيد ليس إضافةً إلى الشرك بل إزالةٌ له، وأن من أراد أن يبني توحيداً على شركٍ باقٍ بنى على غير أساس. وقد قال النبيّ ﷺ لعمر حين سأله عن استلام الحجر: «إنك رجلٌ قوي، لو أخذت غير هذا»، وكان في هذا تفريقاً بين ما يُعظّم لله وما يُعظّم لحكمة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الفتح تطهيرٌ للكعبة من الصور والأصنام، وإعادةٌ لها إلى ما كانت عليه في عهد إبراهيم، وكان في هذا ما جعل مكة تعود مركزاً للحج على ملة إبراهيم لا على ملة قريش. وقد أذّن بلال على ظهر الكعبة، وكان في هذا مشهداً لا يُنسى: أن عبداً حبشياً يقف حيث كان سادة قريش يقفون.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسبب الفتح\u003c/b\u003e\u003cspan\u003eنقض بني بكرٍ وحلفائهم من قريش عهد الحديبية بالهجوم على خزاعة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالتجهيز\u003c/b\u003e\u003cspan\u003eعشرة آلافٍ خرجوا في رمضان سنة ٨ هـ، بسرّيةٍ تامة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالدخول\u003c/b\u003e\u003cspan\u003eمن أربع جهات، بأمرٍ ألا يُقاتلوا إلا من قاتلهم\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالعفو العام\u003c/b\u003e\u003cspan\u003e«اذهبوا فأنتم الطُّلقاء» — عفوٌ عن أهل مكة جميعاً\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالأصنام\u003c/b\u003e\u003cspan\u003eثلاثمئة وستون صنماً حُطّمت، والكعبة طُهّرت\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمرحلة\u003c/th\u003e\u003cth\u003eالتاريخ\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eنقض العهد\u003c/td\u003e\u003ctd\u003eشعبان ٨ هـ\u003c/td\u003e\u003ctd\u003eهجوم بني بكرٍ على خزاعة بعونٍ من قريش\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالخروج\u003c/td\u003e\u003ctd\u003eرمضان ٨ هـ\u003c/td\u003e\u003ctd\u003eعشرة آلافٍ من المدينة، وإخفاء الوجهة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالدخول\u003c/td\u003e\u003ctd\u003e٢٠ رمضان ٨ هـ\u003c/td\u003e\u003ctd\u003eدخول مكة من كُدًى وبطن الوادي، وقتالٌ محدود في الخندمة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالعفو\u003c/td\u003e\u003ctd\u003eيوم الفتح\u003c/td\u003e\u003ctd\u003eإطلاق أهل مكة، وإهدار دم نفرٍ قليلٍ فقط\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eاذهبوا فأنتم الطُّلقاء.\u003c/p\u003e\u003ccite\u003eالنبيّ ﷺ لأهل مكة يوم الفتح بعد أن سألهم: ما تقولون أني فاعلٌ بكم؟\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eفتح مكة كان فتحاً بالرهبة لا بالقتال: عشرة آلافٍ دخلوا البلد الحرام، ولم يُسفك فيه إلا دمٌ قليل عابه النبيّ ﷺ. وقد أنهى الفتح مرحلة الصراع مع قريش، وحوّل أشدّ أعداء الإسلام إلى حلفاء، وأعلن العفو العام في موضع القدرة، وطهّر الكعبة من الأصنام. وفيه درسٌ في أن العفو عند القدرة شجاعةٌ لا ضعف، وأن الفتح بناءٌ لا هدم.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"hunayn-tabuk","n":"حنين والطائف وتبوك","ic":"⚔️","part":"القسم الرابع: الصلح والفتح","h":"\u003carticle class=\"ch3\" id=\"hunayn-tabuk\" data-toc=\"حنين والطائف وتبوك\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الرابع: الصلح والفتح\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٤ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٤\u003ci\u003e.\u003c/i\u003e٤\u003c/span\u003e\n            \u003ch3\u003eحنين والطائف وتبوك\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eبين فتح مكة ووفاة النبيّ ﷺ أربع سنواتٍ حافلة: حنينٌ التي كادت تكون هزيمةً بعد الفتح، وحصار الطائف، وتبوك التي بلغت حدود الروم، وعام الوفود الذي دخلت فيه القبائل في الإسلام أفواجاً، وحجة الوداع التي ختمت الرسالة.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eلمّا فُتحت مكة، اجتمعت هوازن وثقيف على قتال المسلمين، وكان على هوازن مالك بن عوف النصري، فجمع الناس وحمل معهم أموالهم ونساءهم وأطفالهم، ليكون ذلك باعثاً لهم على الثبات، وكان في هذا خطأً عسكرياً لأنه جعلهم يُقاتلون وهم يخافون على أهليهم لا وهم يُقاتلون لهدف. ونزلوا بأوطاس، وأرسلوا رجلاً ليُخبرهم بمسير المسلمين. وكان مالك بن عوف قد أمر الناس أن يأتوا بأهليهم وأموالهم، فقال له دُرَيد بن الصِّمّة: «إنها لو كانت حرباً بيننا وبين غيرنا لكان هذا صواباً، ولكنها حربٌ بيننا وبين محمد، فما يصنع المال والنساء؟» فأبى مالكٌ أن يسمعه، وكان في هذا ما جعل الهزيمة تُبنى على قرارٍ واحد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوخرج النبيّ ﷺ في شوّال سنة ثمانٍ بعشرة آلافٍ من المسلمين ومعه ألفان من أهل مكة، فكان الجيش اثني عشر ألفاً، وكان في كثرة العدد ما جعل بعض المسلمين يقول: «لن نُغلب اليوم من قلة»، وكان في هذه الكلمة ما جعل الله يُعلّمهم أن النصر ليس بالعدد. وقد قال الله في ذلك: «ويوم حنين إذ أعجبتكم كثرتكم فلم تُغنِ عنكم شيئاً وضاقت عليكم الأرض بما رحبت ثم وليتم مُدبرين».\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت هوازن قد كمنت في الوادي قبل الفجر، فلمّا دخل المسلمون الوادي بغتةً انقضّوا عليهم، فاضطربت الصفوف وتراجع الناس، وكان أول من تراجع من أهل مكة من حديثي الإسلام، وكان في هذا ما جعل الفتنة تعظم. وثبت النبيّ ﷺ على بغلته يُنادي: «أنا النبيّ لا كذب، أنا ابن عبد المطلب»، وكان في ثباته في هذا الموقف ما جعل الراية تبقى قائمة. وكان في ثباته ﷺ على بغلته وهو يُنادي ما جعل الناس يعرفون أن القائد لا يفرّ حين يفرّ الناس، وأن من ثبت في أسوأ لحظةٍ أعاد الجيش كله. وقد قال له بعض أصحابه: «لا تُهلك نفسك»، فقال: «أنا النبيّ لا كذب، أنا ابن عبد المطلب»، وكان في هذا ما جعل الجيش يعود إلى نفسه.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم نادى العباس بن عبد المطلب بصوته العالي: «يا معشر الأنصار، يا أصحاب السمرة»، فجعل الناس يُجيبون: «لبيك لبيك»، وكرّوا على العدو، وكان في هذه الكلمة ما جعل الجيش يعود إلى أصله: أن يُذكّر الناس ببيعةٍ قديمة، وأن يُعيدهم إلى ما بايعوا عليه لا إلى ما يُقاتلون من أجله اليوم. وقد كان في اختيار العباس لهذا النداء ما يُبيّن أن النبيّ ﷺ كان يعرف من يُحسن النداء: كان العباس أشدّ الناس صوتاً، وكان من قريش فسمعه الناس من بعيد. وقد كان في نداء «يا أصحاب السمرة» تذكيراً ببيعةٍ عُقدت تحت شجرة في ليلةٍ مظلمة، وأن العهد الذي عُقد هناك لا يُنقض في وادٍ.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في الجيش نفرٌ من المهاجرين والأنصار ثابتون، وقد قال النبيّ ﷺ حين رأى اضطراب الناس: «يا عباس، نادِ أصحاب السمرة»، وكان في هذا النداء ما جعل الناس يتذكّرون بيعة الرضوان تحت الشجرة، وأن العهد الذي عُقد هناك لا يُنقض هنا. وقد انهزمت هوازن وتراجعت إلى أوطاس، ثم إلى الطائف. وقد كان في هذا الاضطراب ما جعل الله يُنزل النصر بعد أن ذهب العُجب: فلمّا لم يبقَ في نفوس الناس إلا الله، جاء النصر. وقد قال الله: «ثم أنزل الله سكينته على رسوله وعلى المؤمنين وأنزل جنوداً لم تروها»، وكان في هذا ما جعل حنيناً درساً في أن السكينة تنزل على من ثبت لا على من كثر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت الغنائم في حنين عظيمة، لأن هوازن حملت معها أموالها ونساءها، فكانت ستة آلاف أسير وأكثر من عشرين ألف بعير. وقد أخذ النبيّ ﷺ الغنائم وتركها في الجعرانة، وكان في هذا ما جعل المسألة الكبرى بعده: كيف تُوزّع هذه الغنائم على من حضر الفتح وحنين معاً، وقد كان في الجيش من أسلم حديثاً ومن قاتل قبل ذلك سنين. وقد كان في هذه المسألة ما جعل النبيّ ﷺ يتصرّف تصرّف الحاكم لا تصرّف قائد الجيش فقط: أن يُوازن بين من أسلم اليوم ومن جاهد سنين، وأن يُعطي المال لمن يُريد أن يُثبّت قلبه. وقد كان في هذا ما جعل الغنيمة وسيلةً لبناء الأمة لا مكافأةً على الجهد وحده.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أعطى النبيّ ﷺ المؤلفة قلوبهم من أهل مكة عطاءً كبيراً، وأعطى أبا سفيان ومعاوية وصفوان بن أمية وعكرمة بن أبي جهل وغيرهم، حتى قال بعض الأنصار: «إن هذا لهو العجب، سيوفنا تقطر من دمائهم، وأموالنا تُدفع إليهم». فبلغ ذلك النبيّ ﷺ فجمع الأنصار وقال لهم: «أما ترضون أن يذهب الناس بالشاة والبعير وتذهبون برسول الله إلى بيوتكم؟»، فقالوا: رضينا يا رسول الله.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا العطاء ما يُبيّن أن المال يُؤخذ به قومٌ في بداية طريقهم، وأن من ثبّت قلبه بالإسلام لا يُحتاج إلى مالٍ يُثبّته. وقد قال النبيّ ﷺ للأنصار: «لو سلك الناس وادياً وسلكت الأنصار شعباً لسلكت شعب الأنصار»، وكان في هذه الكلمة ما جعلهم يبكون حتى أخضلوا لحاهم. وقد كان في عتاب الأنصار ما جعلهم يعرفون أن النبيّ ﷺ لم يكن يُفضّل عليهم أحداً، وأنه أعطى المال لضرورةٍ في التأليف لا لتفضيلٍ في الدين. وقد قال لهم: «ألا ترضون أن يرجع الناس بالدنيا وترجعون برسول الله؟»، وكان في هذا ما جعلهم يبكون ويقولون: «رضينا يا رسول الله».\u003c/p\u003e\u003cp class=\"ap\"\u003eثم سار النبيّ ﷺ إلى الطائف وحاصرها نحو عشرين ليلة، وكانت ثقيف قد تحصّنت فيها، وكان الحصار شديداً حتى رمى المسلمون الحصن بالمنجنيق، ونادى منادي النبيّ ﷺ أن من نزل من الحصن فهو حرّ، فخرج نفرٌ منهم فأسلموا. ثم استشار النبيّ ﷺ في أمرهم، فأشار عليه بعض أصحابه بالانصراف، فانصرف، وقال: «إنا قافلون إن شاء الله»، وكان في هذا الانصراف ما يُبيّن أن الحرب تُقاس بالمصلحة لا بالإصرار.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي السنة التاسعة كانت تبوك، وكان سببها أن الروم جمعوا جموعاً في الشام، وأن النصارى من العرب تحرّكوا، وكان الوقت وقت عُسرةٍ وحرارةٍ وجدب، وكان الطريق بعيداً. فاستنفر النبيّ ﷺ الناس وأعلن الوجهة هذه المرة، فلم يكن في السرّية حاجة، وكان في هذا الإعلان ما جعل التجهيز اختباراً لصدق الناس، وتخلّف المنافقون. وقد كان في هذه الغزوة ما جعل التخلّف يُفرز الصفوف: فقد تخلّف المنافقون بلا عذر، وتخلّف ثلاثةٌ من المؤمنين بغير عذر أيضاً، ثم تاب الله عليهم بعد ذلك. وقد كان في هذا ما جعل تبوك اختباراً للصدق لا مجرد حملةٍ عسكرية، وأن الجهاد قد يكون بالسفر والمال كما يكون بالسيف.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد خرج النبيّ ﷺ بثلاثين ألفاً، وكان في الجيش من جاء بمئة بعيرٍ ومن جاء بجهازه كله، وكان عثمان بن عفان قد جهّز جيش العُسرة بألف بعير، وكان أبو بكر قد جاء بماله كله، وكان عمر قد جاء بنصف ماله. وكان في هذا ما جعل تبوك تُسمّى «غزوة العُسرة»، لأنها كانت أشدّ الغزوات نفقةً وأطولها طريقاً. وقد كان في هذا الجيش ما جعل تبوك تُظهر طبقات المجتمع الجديد: من جاء بماله كله، ومن جاء بجهازه، ومن لم يجد ما يتجهّز به فبكى أسفاً فسُمّوا «البكّائين». وقد كان في هذا ما جعل الغزوة تُقاس بما أُنفق فيها من صدقٍ لا بما جُمع فيها من عدد.\u003c/p\u003e\u003cp class=\"ap\"\u003eولمّا وصل النبيّ ﷺ إلى تبوك لم يجد جيشاً يُقاتله، لأن الروم تفرّقوا حين سمعوا بمسيره، فأقام النبيّ ﷺ أياماً يُراسل من حوله من الأمراء، وكتب إلى يُوحنّا بن رؤبة صاحب أيلة، وإلى أهل أذرح وإلى أهل الجرباء، فصالحوه على الجزية. وكان في هذا الصلح ما جعل الإسلام يُقرّر قاعدةً في العلاقة مع أهل الكتاب: أن يُقرّوا على دينهم مقابل جزيةٍ تُؤخذ منهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت تبوك آخر غزوةٍ خرج فيها النبيّ ﷺ بنفسه، وكانت في السنة التاسعة، وقد نزل فيها قوله تعالى: «لقد تاب الله على النبي والمهاجرين والأنصار الذين اتبعوه في ساعة العُسرة»، وكان في هذا النصّ ما جعل تبوك حدثاً في الوجدان لا في التاريخ فقط. وقد كان في تبوك أيضاً ما جعل المسلمين يُدركون أن حدود الدولة صارت تبلغ الشام، وأنهم صاروا أمةً لها جيران من الروم.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eحنين ودرس العُجب بالكثرة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت حنين بعد الفتح بأيام، وكان الجيش اثني عشر ألفاً وهو أكبر جيشٍ خرج به المسلمون حتى ذلك الوقت. وقد قال بعضهم: «لن نُغلب اليوم من قلة»، وكانت هذه الكلمة أول سببٍ للاضطراب، لأنها جعلت الثقة في العدد لا في الله. وقد كان في اجتماعها بعد الفتح مباشرةً ما جعل المسلمين يُدركون أن الفتح لا يعني نهاية الصراع، وأن من انتصر أمس قد يُبتلى غداً، وأن الأمة تحتاج إلى يقظةٍ دائمة لا إلى احتفالٍ بالنصر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد انهزم المسلمون في أول الأمر انهزاماً حقيقياً، حتى إن النبيّ ﷺ بقي في نفرٍ قليل، وكان في هذا ما جعل الدرس أشدّ: أن النصر قد يُسلب في ساعةٍ ليعود بعدها، وأن من ظنّ أن عدده يكفيه فقد وكل إلى عدده. وقد كان في هذا الانهزام ما جعل بعض من أسلم حديثاً يظنّ أن الأمر انتهى، ثم رأى النبيّ ﷺ ثابتاً فعاد. وكان في هذا ما يُبيّن أن ثبات القائد وحده قد يكون سبباً في عودة الجيش كله، وأن الراية إذا بقيت لم تضع الأمة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد قال الله بعد ذلك: «ثم أنزل الله سكينته على رسوله وعلى المؤمنين وأنزل جنوداً لم تروها»، وكان في هذا ما جعل حنيناً تُصبح درساً في التواضع لا في الشجاعة فقط. وقد كان في عودتهم بعد الهزيمة ما جعلهم يعرفون أن الثبات ليس حالةً دائمة بل قراراً يُتخذ في كل لحظة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالطائف والحصار الطويل\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الطائف مدينةً مُحصّنة على جبلٍ، وكانت ثقيف من أشدّ العرب بأساً وأكثرهم عدةً، وكان حصارها أول تجربةٍ للمسلمين في حصار مدينةٍ مسوّرة. وقد استخدم المسلمون المنجنيق والدبابة، وكان في هذا ما يُبيّن أنهم كانوا يستفيدون من وسائل الحصار المعروفة في زمانهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد طال الحصار حتى ملّ الناس، فاستشار النبيّ ﷺ أصحابه في الانصراف، فانصرف، وكان في هذا الانصراف ما يُبيّن أن القيادة تعرف متى تُنهي حصاراً لا يُرجى. وقد قال النبيّ ﷺ حين انصرف: «إنا قافلون غداً إن شاء الله»، ثم دعا على ثقيف بالجوع والخوف، فلم يلبثوا أن أسلموا بعد ذلك.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أسلمت ثقيف في السنة التاسعة، وجاء وفدها إلى المدينة فأسلموا، وطلبوا أن يُقروا على الزنا والخمر والربا، فأبى النبيّ ﷺ أن يُقرّهم على شيءٍ من ذلك، وقال: «إنكم إن تُقرّوا على ذلك تُهلكوا»، وكان في هذا ما يُبيّن أن الإسلام لا يُفاوض على المحرّمات، وأن الدخول فيه دخولٌ كامل.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eتبوك وحدود الدولة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت تبوك أبعد غزوةٍ خرج إليها النبيّ ﷺ، وكانت في أشدّ الظروف: حرارةً وجدباً وقلةً في المال والظهر. وقد أعلن النبيّ ﷺ الوجهة فيها ليُجهّز الناس، فكانت اختباراً للصدق، وتخلّف عنها المنافقون، وكان في هذا ما جعل الغزوة تُفرز الصفوف بلا قتال. وقد كان في هذا ما جعل المسلمين يتعلّمون أن حرب الحصون تختلف عن حرب المكشوف، وأنها تحتاج إلى آلاتٍ وصبرٍ وقطع طرق الإمداد، لا إلى شجاعةٍ في الميدان فقط.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بلغ المسلمون تبوك ولم يلقوا جيشاً، وكان في هذا ما جعل الغزوة تُحقّق هدفها بلا معركة: أن يعرف الروم وأهل الشام أن المسلمين صاروا قوةً تصل إلى حدودهم. وقد صالح النبيّ ﷺ من حول تبوك على الجزية، وكان في هذا تأسيساً لعلاقةٍ سياسية مع أهل الكتاب. وقد كان في هذا الانصراف ما جعل بعض الصحابة يقول: ننصرف ولا فتح؟ فقال النبيّ ﷺ: «بل ننصرف ونحن نفتح»، فكان الفتح بعد ذلك بلا حرب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد نزل في تبوك قوله تعالى: «لقد تاب الله على النبي والمهاجرين والأنصار الذين اتبعوه في ساعة العُسرة»، وكان في هذا النصّ ما جعل الغزوة حدثاً في الإيمان لا في الجغرافيا. وقد كان في تبوك أيضاً ما جعل المسلمين يعرفون أن الدولة تحتاج إلى حدودٍ تُحمى، وأن الفتوح لا تكون كلها بالقتال.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eحنين\u003c/b\u003e\u003cspan\u003eشوّال ٨ هـ، اثنا عشر ألفاً، وانهزامٌ أول ثم عودةٌ ونصر\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالطائف\u003c/b\u003e\u003cspan\u003eحصارٌ نحو عشرين ليلة، ثم انصراف، وأسلمت ثقيف في السنة التاسعة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eتبوك\u003c/b\u003e\u003cspan\u003eرجب ٩ هـ، ثلاثون ألفاً، أقصى غزوات النبيّ ﷺ\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eجيش العُسرة\u003c/b\u003e\u003cspan\u003eجهّزه عثمان بألف بعير، وجاء أبو بكر بماله كله\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالجزية\u003c/b\u003e\u003cspan\u003eصالح النبيّ ﷺ أهل أيلة وأذرح والجرباء عليها\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالنتيجة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eحنين\u003c/td\u003e\u003ctd\u003e٨ هـ\u003c/td\u003e\u003ctd\u003eهزيمة هوازن وثقيف، وغنائم كبيرة، وتوزيعٌ على المؤلفة قلوبهم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالطائف\u003c/td\u003e\u003ctd\u003e٨ هـ\u003c/td\u003e\u003ctd\u003eانصرافٌ بعد حصار، ثم إسلام ثقيف في السنة التاسعة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eتبوك\u003c/td\u003e\u003ctd\u003e٩ هـ\u003c/td\u003e\u003ctd\u003eبلوغ حدود الروم، وصلحٌ على الجزية، وآخر غزوةٍ للنبيّ ﷺ\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eعام الوفود\u003c/td\u003e\u003ctd\u003e٩ هـ\u003c/td\u003e\u003ctd\u003eدخول قبائل الجزيرة في الإسلام أفواجاً\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eأما ترضون أن يذهب الناس بالشاة والبعير وتذهبون برسول الله إلى بيوتكم؟\u003c/p\u003e\u003ccite\u003eالنبيّ ﷺ للأنصار حين عاتبوه على العطاء، فبكوا وقالوا: رضينا\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eحنين كانت درساً في أن الكثرة لا تُغني، إذ انهزم المسلمون أول الأمر ثم عادوا وانتصروا. والطائف علّمتهم حرب الحصار والصبر على ما لا يُرجى. وتبوك بلغت حدود الروم وأقرّت قاعدة الجزية، وكانت آخر غزوات النبيّ ﷺ. وفي هذه السنوات دخلت قبائل الجزيرة في الإسلام أفواجاً، وصارت المدينة مركز أمةٍ لا قبيلة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-5","n":"القسم الخامس: الوداع والشمائل","ic":"🕯️","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-5\" style=\"--c:#1E6B3A\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🕯️\u003c/div\u003e\n      \u003ch2\u003eالقسم الخامس: الوداع والشمائل\u003c/h2\u003e\n      \u003cp\u003eالسنوات الأخيرة من حياة النبيّ ﷺ: وفود العرب تدخل الإسلام أفواجاً، ثم حجة الوداع التي خطب فيها خطبةً تُعدّ أول إعلانٍ لحقوق الإنسان، ثم المرض والوفاة، ثم شمائله وأخلاقه التي بقيت حيّةً في وجدان الأمة بعد أن غاب شخصه. خاتمة السيرة ليست نهايةً بل انتقالاً: من صحبة الشخص إلى اتباع السنّة.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#wufud-najran\"\u003eعام الوفود ووفد نجران\u003c/a\u003e\u003ca href=\"#hajj-wada\"\u003eحجة الوداع وخطبة عرفة\u003c/a\u003e\u003ca href=\"#illness-death\"\u003eالمرض والوفاة\u003c/a\u003e\u003ca href=\"#shamail\"\u003eشمائله ﷺ وأخلاقه\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"wufud-najran","n":"عام الوفود ووفد نجران","ic":"🤝","part":"القسم الخامس: الوداع والشمائل","h":"\u003carticle class=\"ch3\" id=\"wufud-najran\" data-toc=\"عام الوفود ووفد نجران\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الخامس: الوداع والشمائل\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ١ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٥\u003ci\u003e.\u003c/i\u003e١\u003c/span\u003e\n            \u003ch3\u003eعام الوفود ووفد نجران\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eبعد فتح مكة وتبوك، صارت القبائل ترسل وفودها إلى المدينة تُعلن إسلامها، حتى سُمّي ذلك العام «عام الوفود». وكان أعجب هذه الوفود وفد نجران النصراني، الذي جاء يُحاجّ النبيّ ﷺ في عيسى، فجرت بينهم مباهلةٌ انتهت إلى صلحٍ وعهد.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eبعد فتح مكة وهزيمة هوازن وثقيف، وبلوغ جيش المسلمين تبوك، تغيّر ميزان القوى في الجزيرة تغيّراً كاملاً: فقد كانت القبائل ترى قبل ذلك أن قريشاً هي مركز الثقل، فلمّا سقطت مكة وصارت في حلف المسلمين، لم يبقَ لأحدٍ عذرٌ في التردّد. فبدأت الوفود تَرِدُ على المدينة من كل جهة، وكان في هذا ما جعل السنة التاسعة تُسمّى «عام الوفود»، لكثرة من قدم فيها من قبائل العرب مُعلناً إسلامه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت الوفود تأتي بأعدادٍ متفاوتة: وفدٌ من مذحج، ووفدٌ من بني حنيفة، ووفدٌ من طيّئ، ووفدٌ من بني تميم، ووفدٌ من بني أسد، ووفدٌ من غطفان، ووفدٌ من باهلة، ووفدٌ من كندة، وغيرهم كثير. وكان النبيّ ﷺ يستقبلهم ويُكرمهم ويُعلّمهم الإسلام، وكان يُعطي كل وفدٍ ما يناسب حاله، وكان في هذا الاستقبال ما جعل المدينة أشبه بعاصمةٍ تُفد إليها القبائل لا بحصنٍ يُحاصر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت القبائل تختلف في أغراضها: فمنهم من جاء راغباً، ومنهم من جاء مُسايِساً يريد أن يعرف قوة المسلمين، ومنهم من جاء يطلب مالاً أو يُفاخر بنسبه. وكان في هذه الوفود ما جعل النبيّ ﷺ يُواجه مسائل جديدة لم تكن في مكة ولا في المدينة: مسائل الزكاة والعشور، وحدود ما يُطلب من القبائل، وكيف تُدار قبيلةٌ دخلت الإسلام ولم يدخل أهلها كلهم بعد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في عام الوفود ما جعل المدينة تُصبح مركز تعلّمٍ لا مركز حكمٍ فقط: فقد كان النبيّ ﷺ يُرسل مع كل وفدٍ من يُعلّمه القرآن وأحكام الإسلام، وكان يُسمّى «المُعلّم» أو «المُقرئ». وكان في هذا ما جعل الإسلام ينتشر في القبائل بلا جيشٍ يُقيم عندها، وأن التعليم كان هو الوسيلة الأولى لتثبيت الدين في القلوب. وقد كان في هذا ما جعل الإسلام ينتشر في القبائل بلا مؤسسةٍ مركزية تُقيم عندها، وأن المعلّم الواحد قد يكون كافياً لتثبيت قبيلةٍ كاملة إذا كان صادقاً عالماً.\u003c/p\u003e\u003cp class=\"ap\"\u003eومن أعجب ما جرى في عام الوفود مجيء وفد نجران، وهم نصارى من أهل اليمن، وكانوا اثنين وستين رجلاً، فيهم العاقب والسيد وأبو حارثة، وكانوا أهل علمٍ وكتاب. فدخلوا المسجد وعليهم ثيابهم الحريرية وصلبانهم، فلمّا دخلوا حان وقت صلاتهم، فصلى النبيّ ﷺ أن يصلّوا في المسجد، فصلّوا فيه إلى الشرق، وكان في هذا ما جعل المسلمين يعرفون أن المسجد يتّسع لغيرهم في العبادة الخاصة، وأن الإسلام لا يُلزم أحداً بالدخول فيه بالسيف.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم جرى بينهم وبين النبيّ ﷺ حوارٌ طويل في شأن عيسى عليه السلام، وكانوا يقولون إنه الله وإنه ابن الله وإنه ثالث ثلاثة، وكان النبيّ ﷺ يقول إنه عبد الله ورسوله وكلمته ألقاها إلى مريم. فأنزل الله في ذلك صدر سورة آل عمران: «إن مثل عيسى عند الله كمثل آدم خلقه من تراب ثم قال له كن فيكون»، وكان في هذا النصّ ما جعل الحوار يُنتقل من الجدل إلى الحجة، وأن الحقّ لا يُثبت بالخصومة بل بالبيان.\u003c/p\u003e\u003cp class=\"ap\"\u003eولمّا لم يقتنع القوم، دعاهم النبيّ ﷺ إلى المباهلة، وهو أن يدعو كل فريقٍ ربه أن يلعن الكاذب من الفريقين، وكان في هذا أعظم امتحانٍ في الحوار: أن يُعلّق الإنسان دعواه على نفسه لا على خصمه. فلمّا رأى القوم أن النبيّ ﷺ جاء بفاطمة والحسن والحسين وعليّ، وقال: «هؤلاء أهلي»، أشفقوا على أنفسهم، وقال بعضهم: «والله لئن باهلنا لنُهلكن»، فصالحوه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في مباهلة نجران ما يُبيّن أن النبيّ ﷺ كان على يقينٍ من رسالته: أنه دعا إلى أمرٍ لو كان كاذباً فيه لأهلك نفسه وأهل بيته. وكان في مجيئه بأهل بيته ما جعل أهل السنّة يحتجّون به في فضل آل البيت، لأن النبيّ ﷺ اختارهم للمباهلة، وكان في هذا ما جعل الحوار العقدي لا يُفصل عن القرابة والرحمة. وقد كان في مجيء النبيّ ﷺ بأهل بيته ما جعل المباهلة حدثاً عائلياً لا مناظرةً بين علماء فقط، وأن من أراد أن يُدافع عن الحق فليبدأ بنفسه وأهله، وأن يُقدّمهم قبل أن يُقدّم غيرهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوانتهى الأمر إلى صلحٍ كتبه النبيّ ﷺ لوفد نجران: أن لهم أن يُقيموا على دينهم، وأن يُصلّوا في كنائسهم، وأن يُؤدّوا جزيةً في كل سنة، وأن لا يُهاجروا ولا يُظلموا، وأن يُنصرهم المسلمون إن احتاجوا. وكان في هذا العهد ما جعل الإسلام يُقرّر قاعدةً في التعايش: أن الاختلاف في الدين لا يُلغي حقّ الإنسان في الأمان، وأن الدولة تُحمي من دفع الجزية كما تُحمي من أسلم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في وفد نجران ما جعل المسلمين يُدركون أن الدعوة صارت تُخاطب أهل الكتاب لا المشركين فقط، وأن الحوار معهم يحتاج إلى علمٍ بكتبهم لا إلى تكفيرٍ سريع. وكان في جواب النبيّ ﷺ لهم ما جعل القرآن يُعالج العقائد بالحجة: أن يُشبّه خلق عيسى بخلق آدم، وأن يُبيّن أن القدرة الإلهية لا تُقاس بالعادة. وقد كان في هذا العهد ما جعل الفقه يُفرّق بين الجزية والخراج: أن الأولى على الرؤوس مقابل الأمان، والثانية على الأرض مقابل الانتفاع، وأن كليهما ليس عقوبةً على الدين بل بدلٌ عن الأمن والدفاع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في عام الوفود أيضاً ما جعل النبيّ ﷺ يُعلن البراءة من المشركين في سنة تسع، إذ أذّن أبو بكر في الحجّ، ثم أردف النبيّ ﷺ عليّاً ليُبلّغ سورة التوبة، وكان في هذا ما جعل الحجّ يتطهّر من الشرك بعد سنين من الاختلاط. وكان في هذا الإعلان ما جعل الجزيرة تُدخل مرحلةً جديدة: أن البيت لا يُحجّ له بالمشركين، وأن الإسلام صار صاحب البيت لا شريكاً فيه.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eلماذا سُمّي عام الوفود؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eسُمّي بذلك لأن الوفود توالت على المدينة في السنة التاسعة تترى، فما كان يمرّ أسبوعٌ إلا ويقدم وفدٌ من قبيلةٍ من قبائل العرب. وكان في هذا ما جعل المدينة تُشبه العواصم التي تُفد إليها الأمم، وأن المسلمين خرجوا من موقع المُحاصر إلى موقع المُخاطَب، وكان هذا التحوّل أعظم ثمرةٍ للفتح.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذه الوفود ما جعل الإسلام ينتشر بلا قتال في معظم أنحاء الجزيرة: قبائل لم يُرسل إليها جيش، وإنما سمعت أن مكة فُتحت وأن الأحزاب هُزمت، فأرسلت من يُسالم. وكان في هذا ما يُبيّن أن القوة قد تكون وسيلةً للبلاغ لا غايةً في نفسها، وأن الحرب إنما تُخاض لتُفتح بها القلوب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في عام الوفود ما جعل النبيّ ﷺ يُواجه إدارة التنوّع: قبائل مختلفة الألسنة والأخلاق، وفيها من أسلم وفيها من أرجأ إسلامه، وفيها من طلب أن يُقيم في دياره ولا يُهاجر. وكان في كل هذا ما جعل التشريع يتوسّع، وأن الإسلام لم يكن نظاماً للمدينة فقط بل نظاماً للأمة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالمباهلة ومعنى الحوار\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت المباهلة أعلى درجات الحوار: أن يضع الإنسان نفسه موضع المخاطرة في دعواه. ولم يكن النبيّ ﷺ يُهدّدهم بالسيف ولا بالحصار، وإنما دعاهم إلى أن يدعوا الله أن يهلك الكاذب، وكان في هذا ما جعل الخصم يفكّر مرتين: أن هذا الرجل على يقينٍ من أمره، وإلا لما خاطر بأهل بيته.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في اختيار النبيّ ﷺ لفاطمة والحسن والحسين وعليّ ما جعل المباهلة حدثاً في التاريخ لا في المناظرة فقط، وصار هذا المشهد أصلاً من أصول الحديث في فضل أهل البيت. وكان في هذا ما يُبيّن أن النبيّ ﷺ لم يُقدّم للمباهلة أصحابه الأقوياء بل أهل بيته، وأن القرابة عنده مسؤوليةٌ لا مزيّة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد رجع وفد نجران بغير مباهلة، ورضوا بالصلح والجزية، وكان في رجوعهم ما جعل الإسلام يُقرّر أن الحوار قد ينتهي إلى تعايشٍ لا إلى إسلام، وأن ذلك مقبول ما دام الطرف الآخر مُعاهداً. وكان في هذا ما جعل الفقه يُنشئ باباً كاملاً في أحكام أهل الذمّة، أصله هذا العهد.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالبراءة من المشركين\u003c/h4\u003e\u003cp class=\"ap\"\u003eفي سنة تسع أُذّن في الحجّ، وكان أبو بكر أميراً على الحجّ، ثم أردف النبيّ ﷺ عليّاً ليُبلّغ سورة التوبة في يوم النحر عند جمرة العقبة. وكان في هذا الإعلان ما جعل الحجّ يتطهّر من الشرك، وأن المشركين لم يبقَ لهم حقّ في البيت الذي بناه إبراهيم على التوحيد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد نصّ الإعلان على أن لا يحجّ بعد هذا العام مشرك، ولا يطوف بالبيت عريان، وأن من كان له عهدٌ مع النبيّ ﷺ فهو إلى مدّته، ومن لم يكن له عهدٌ فأجله أربعة أشهر. وكان في هذا التحديد ما جعل الإسلام يفرّق بين من عاهد ووفى ومن لم يعاهد، وأن البراءة ليست نقضاً للعهود بل إعلاناً لانتهائها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا الإعلان ما جعل الجزيرة تُدخل مرحلةً جديدة: مرحلة الإسلام الغالب، وأن المسلمين صاروا أصحاب البيت لا زوّاره فقط. وكان في هذا ما جعل النبيّ ﷺ يُنظّم الحجّ قبل حجّة الوداع بعامٍ، فلمّا حجّ في السنة العاشرة كان الحجّ قد خلا من المظاهر الشركية، وكانت حجّته بياناً للحجّ الصحيح.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eعام الوفود\u003c/b\u003e\u003cspan\u003eالسنة التاسعة، توالت فيها قبائل العرب على المدينة مُعلنة الإسلام\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eوفد نجران\u003c/b\u003e\u003cspan\u003eاثنان وستون رجلاً من نصارى اليمن، حاجّوا في شأن عيسى\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمباهلة\u003c/b\u003e\u003cspan\u003eدعاهم النبيّ ﷺ إليها فجاء بفاطمة والحسن والحسين وعليّ\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eعهد نجران\u003c/b\u003e\u003cspan\u003eبقاؤهم على دينهم، وجزيةٌ عليهم، ونصرٌ لهم من المسلمين\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالبراءة\u003c/b\u003e\u003cspan\u003eسنة ٩ هـ، إعلان أن لا يحجّ مشرك بعد ذلك العام\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالوفد\u003c/th\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eما جرى فيه\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eوفد نجران\u003c/td\u003e\u003ctd\u003e٩ هـ\u003c/td\u003e\u003ctd\u003eحوارٌ في عيسى، ثم مباهلة، ثم صلحٌ على الجزية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eوفد ثقيف\u003c/td\u003e\u003ctd\u003e٩ هـ\u003c/td\u003e\u003ctd\u003eأسلموا بعد حصار الطائف، وأبى النبيّ ﷺ أن يُقرّهم على الخمر والزنا\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eوفد بني تميم\u003c/td\u003e\u003ctd\u003e٩ هـ\u003c/td\u003e\u003ctd\u003eفاخروا بنسبهم، فأنزل الله: «إن أكرمكم عند الله أتقاكم»\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eحجّ أبي بكر\u003c/td\u003e\u003ctd\u003e٩ هـ\u003c/td\u003e\u003ctd\u003eإعلان البراءة من المشركين، وتطهير الحجّ من مظاهر الشرك\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eإن مثل عيسى عند الله كمثل آدم خلقه من تراب ثم قال له كن فيكون.\u003c/p\u003e\u003ccite\u003eقرآن في شأن وفد نجران حين قالوا إن عيسى ابن الله — آل عمران\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eعام الوفود كان ثمرة الفتح: قبائل العرب تأتي المدينة مُسلمة بلا جيش، والإسلام ينتشر بالتعليم لا بالقتال. ووفد نجران جعل الحوار مع أهل الكتاب حواراً بالحجة والمباهلة لا بالسيف، وانتهى إلى عهدٍ يُقرّر التعايش. وفي السنة التاسعة أُعلنت البراءة من المشركين، فتطهّر الحجّ، وصارت الجزيرة على أبواب مرحلةٍ جديدة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"hajj-wada","n":"حجة الوداع وخطبة عرفة","ic":"🕋","part":"القسم الخامس: الوداع والشمائل","h":"\u003carticle class=\"ch3\" id=\"hajj-wada\" data-toc=\"حجة الوداع وخطبة عرفة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الخامس: الوداع والشمائل\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٢ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٥\u003ci\u003e.\u003c/i\u003e٢\u003c/span\u003e\n            \u003ch3\u003eحجة الوداع وخطبة عرفة\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eفي السنة العاشرة حجّ النبيّ ﷺ حجّةً واحدةً بعد الهجرة، حجّ بها مئة ألفٍ من المسلمين، ووقف على عرفة فخطب خطبةً تُعدّ إعلاناً جامعاً لأصول الدين وحقوق الإنسان، ثم ودّع الناس بكلماتٍ لم يكن يعلم أكثرهم أنها الوداع الأخير.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eفي السنة العاشرة من الهجرة أذّن النبيّ ﷺ في الناس بالحجّ، فقدم المدينة خلقٌ كثيرٌ من كل جهة، وكان عدد من حجّ معه يُقال إنهم مئة ألفٍ أو يزيدون. وخرج النبيّ ﷺ من المدينة في ذي القعدة، وخرج معه أزواجه وأصحابه، وكان في هذا الخروج ما جعل الحجّ حدثاً جامعاً للأمة، وأن المسلمين اجتمعوا من كل قبيلةٍ في مكانٍ واحدٍ وزمانٍ واحد. وقد كان في هذا الاجتماع ما جعل الحجّ يُصبح مؤتمراً للأمة لا عبادةً فردية، وأن المسلمين يرون أنفسهم أمةً واحدة بعد أن كانوا قبائل متفرقة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ساق النبيّ ﷺ معه الهدي، وأحرم بالحجّ مُفرداً في روايةٍ، وفي روايةٍ أخرى قرن بين الحجّ والعمرة، وكان في اختلاف الروايات ما جعل الفقه يتّسع في صفة الإحرام، وأن النبيّ ﷺ أجاز أكثر من صورةٍ في أداء النسك. وكان في هذا ما جعل الحجّ عبادةً فيها سعةٌ لا ضيق، وأن المسلمين لم يُلزموا صورةً واحدةً في كل تفصيل. وقد كان في هذا ما جعل الفقه يُقرّر أن الأفضل قد يكون متعدّداً، وأن اختلاف الصحابة في صفة الحجّ أصلٌ من سعة الشريعة لا من تناقضها.\u003c/p\u003e\u003cp class=\"ap\"\u003eولمّا وصل النبيّ ﷺ إلى مكة دخل المسجد الحرام، وطاف بالبيت، ثم صلّى، ثم سعى بين الصفا والمروة، وكان في هذا ما جعل الحجّ يُؤدّى بصفةٍ بيّنةٍ يشهدها الناس، وأن النبيّ ﷺ قال: «خذوا عنّي مناسككم»، فكان في هذه الكلمة ما جعل الحجّ يُنقل بالتواتر العملي لا بالكتاب فقط، وأن الأمة تعلّمت مناسكها بالمشاهدة. وقد كان في هذا ما جعل الحجّ يُنقل عملاً لا كلاماً، وأن من أراد أن يعرف المناسك فليتبع الأفعال لا الأقوال وحدها، وأن التعليم بالمشاهدة أرسخ من التعليم بالوصف.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم خرج النبيّ ﷺ إلى منى وعرفة، ووقف بعرفة في اليوم التاسع، وكان في هذا الموقف ما جعل الحجّ يبلغ ذروته: أن يقف مئة ألفٍ في مكانٍ واحدٍ بلا فوارق، لا فرق بين سيدٍ وعبد، ولا بين قرشيّ وحبشيّ، ولا بين غنيٍّ وفقير. وكان في هذا المشهد ما جعل الحجّ يُصوّر المساواة تصويراً لا يحتاج إلى كلام، لأن الناس كلهم في ثوبٍ واحدٍ ومكانٍ واحد. وقد كان في هذا المشهد ما جعل الحجّ يُعلّم المساواة بلا خطبة، وأن من رأى مئة ألفٍ في ثوبٍ واحدٍ لم يحتج إلى دليلٍ على أن الناس سواء.\u003c/p\u003e\u003cp class=\"ap\"\u003eوخطب النبيّ ﷺ في عرفة خطبةً عظيمة، بدأها بحمد الله والثناء عليه، ثم قال: «أيها الناس، اسمعوا قولي، فإني لا أدري لعلي لا ألقاكم بعد عامي هذا بهذا الموقف أبداً». وكان في هذا التصدير ما جعل الخطبة تُقرأ قراءة وصيةٍ لا قراءة درس، وأن الناس استمعوا إليها وهم يعرفون أن صاحبها يُودّعهم. وقد كان في هذا التصدير ما جعل الخطبة تُقرأ في ضوء نهايتها، وأن كل حكمٍ فيها صار وصيةً يُوصي بها من يعرف أنه لا يلقاهم بعد عامه، وأن الناس حفظوها لأنهم شعروا أنها آخر ما يسمعونه.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم قال ﷺ: «إن دماءكم وأموالكم وأعراضكم عليكم حرام، كحرمة يومكم هذا، في شهركم هذا، في بلدكم هذا». وكان في هذا التقرير ما جعل حرمة الإنسان أصلاً ثابتاً لا يتغيّر بتغيّر الزمان ولا المكان، وأنه جمع بين الدم والمال والعرض في حرمةٍ واحدة، وكان في هذا ما جعل الخطبة تُعدّ أول إعلانٍ جامعٍ لحقوق الإنسان في التاريخ. وقد كان في تشبيه حرمة الإنسان بحرمة اليوم والشهر والبلد ما جعل الحرمة مُطلقةً لا نسبية، وأن من أراد أن يعرف قيمة الإنسان في الإسلام فليقرأ هذه الجملة وحدها.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم قال ﷺ: «ألا وإن كل شيءٍ من أمر الجاهلية موضوعٌ تحت قدميّ هاتين، ودماء الجاهلية موضوعة، وإن أول دمٍ أضعه دم ربيعة بن الحارث»، وكان في هذا ما جعل الإسلام يقطع مع الماضي قطعاً صريحاً: أن الثأر الذي كان يُقيم الحروب بين القبائل قد أُلغي، وأن أول ما ألغاه النبيّ ﷺ كان دم أقرب الناس إليه. وقد كان في هذا ما جعل التشريع يبدأ من الذات لا من الآخرين: أن يُلغي النبيّ ﷺ دم أهل بيته قبل أن يُطالب غيره بإلغاء دمه، وأن لا يُقال إنه استثنى نفسه من حكمٍ شرعه.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم قال ﷺ: «وربا الجاهلية موضوع، وإن أول ربا أضعه ربا العباس بن عبد المطلب، فإنه موضوعٌ كله». وكان في هذا ما جعل الإسلام يُعالج الاقتصاد من أصله: أن المال لا يُنمى بالظلم، وأن من كان له ربا في الجاهلية فليس له إلا رأس ماله. وكان في اختياره لربا عمّه ما جعل التشريع يبدأ من الذات لا من الآخرين. وقد كان في هذا ما جعل الإسلام يُعالج الربا معالجةً أخلاقيةً لا اقتصاديةً فقط: أن المال لا يكون نماءً على حساب حاجة المحتاج، وأن من أراد أن يُقرض فليُقرض حسناً لا مُضاعفاً.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم قال ﷺ: «فاتقوا الله في النساء، فإنكم أخذتموهنّ بأمانة الله، واستحللتم فروجهنّ بكلمة الله»، ثم بيّن أن لهنّ عليهم رزقهنّ وكسوتهنّ بالمعروف. وكان في هذا ما جعل الخطبة تُقرّر حقوق المرأة في موضعٍ كان فيه العرب لا يرون للمرأة حقاً، وأن النبيّ ﷺ ربطها بأمانة الله لا بعرف الناس. وقد كان في هذا ما جعل حقوق المرأة في الإسلام عهداً بين الزوجين لا منّةً من الرجل، وأن من أخذ أمانةً وجب عليه أداؤها، وأن العرف لا يُسقط ما أوجبه الله.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم قال ﷺ: «وإني قد تركت فيكم ما إن أخذتم به لن تضلّوا بعدي: كتاب الله»، وفي روايةٍ: «كتاب الله وسنّة نبيّه»، وكان في هذا ما جعل الأمة تُعلّق عصمتها بالوحي لا بالأشخاص. وكان في هذا القول ما جعل الصحابة يفهمون أن الرسالة باقيةٌ بعد صاحبها، وأنهم مسؤولون عن حفظها لا عن حبّها فقط. وقد كان في هذا القول ما جعل الأمة تُعلّق عصمتها بالوحي، وأن كل ما جاء بعد ذلك من فتنٍ لم يكن نقصاً في الوحي بل تقصيراً في الأخذ به.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم قال ﷺ: «ألا فهل بلّغت؟» قالوا: نعم، قال: «اللهم اشهد»، ثم قال: «فليُبلّغ الشاهد الغائب، فربّ مُبلَّغٍ أوعى من سامع». وكان في هذا الأمر ما جعل التبليغ فرضاً على كل من سمع، وأن الأمة كلها صارت أمناء على هذا الدين، وأن العلم يُنقل بالتواتر لا بالوراثة. وقد كان في قوله «فربّ مُبلَّغٍ أوعى من سامع» ما جعل الرواية تُبنى على الضبط لا على القرب من النبيّ ﷺ، وأن من سمع مباشرةً قد يكون أقلّ فهماً ممن وصله الخبر بضبطٍ وأمانة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد نزل في هذا اليوم قوله تعالى: «اليوم أكملت لكم دينكم وأتممت عليكم نعمتي ورضيت لكم الإسلام ديناً»، وكان في هذا النصّ ما جعل الصحابة يعرفون أن الدين قد اكتمل، وأنه لا ينتظر تشريعاً جديداً. وقد رُوي أن بعضهم بكى حين سمعها، لأنه فهم أن اكتمال الدين إشارةٌ إلى قرب انتهاء الرسالة. وقد كان في هذا النصّ ما جعل الصحابة يُدركون أن الإسلام صار تاماً لا ينتظر تشريعاً، وأن ما بقي عليهم هو الفهم والتطبيق والتبليغ، لا الانتظار. وقد قال بعضهم: ما رأينا يوماً كان أشدّ فرحاً ولا أشدّ حزناً من ذلك اليوم.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eلماذا سُمّيت حجّة الوداع؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eسُمّيت بذلك لأن النبيّ ﷺ ودّع الناس فيها، وقال في خطبته: «فإني لا أدري لعلي لا ألقاكم بعد عامي هذا بهذا الموقف أبداً». وكان في هذه الكلمة ما جعل الناس يستمعون إلى كل حرفٍ، وأن الخطبة صارت وصيةً لا محاضرة، وأن من كان حاضراً نقلها إلى من غاب بوصفها عهداً.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد حجّ النبيّ ﷺ بعد الهجرة حجّةً واحدةً فقط، وكانت هذه، فصارت هي الحجّة التي يُؤخذ منها المناسك. وكان في هذا ما جعل المسلمين يُدركون أن السنّة العملية قد تُنقل بمرةٍ واحدة إذا شهدها عددٌ كبير، وأن الحجّ لا يُبنى على اجتهادٍ فردي بل على اتّباع. وقد كان في هذا ما جعل المناسك تُؤخذ بالتواتر العملي، وأن كل تفصيلٍ فيها له أصلٌ في فعلٍ مشاهَد لا في رأيٍ مُقدَّر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد سمّاها بعض الصحابة «حجّة البلاغ» و«حجّة الإسلام»، لأن فيها بلّغ النبيّ ﷺ أصول الدين وحقوق الإنسان. وكان في تعدّد الأسماء ما جعل الحدث الواحد يُقرأ من وجوهٍ: وداعاً، وبلاغاً، وإكمالاً للدين، وبياناً للمناسك. وقد كان في تعدّد هذه الأسماء ما جعل الحدث الواحد يُقرأ من وجوهٍ، وأن من أراد أن يفهم السيرة فليقرأ الحدث الواحد في سياقاتٍ متعددة، لأن الحدث الكبير لا يُحيط به اسمٌ واحد.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eأصولٌ في خطبة عرفة\u003c/h4\u003e\u003cp class=\"ap\"\u003eجمعت الخطبة أصولاً خمسة: حرمة الدم والمال والعرض، وإلغاء ثأر الجاهلية ورباها، والوصية بالنساء، والاعتصام بالكتاب، ومسؤولية التبليغ. وكان في هذا الجمع ما جعل الخطبة تُشبه دستوراً مختصراً، لأنها قرّرت ما يُصان وما يُلغى وما يُوصى به وما يُتمسّك به. وقد كان في هذا الجمع ما جعل الخطبة تُدرّس كوحدةٍ واحدة، لا كجملٍ متفرقة تُقتبس في المناسبات.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في تقديم الحرمة على غيرها ما جعل الإسلام يبدأ بحماية الإنسان قبل أن يُطالبه بالتكاليف: أن يُعلن أولاً أن دمه وماله وعرضه محرّم، ثم يُبيّن ما عليه. وكان في هذا ترتيبٌ في الأولويات جعل الفقه يُبنى على حفظ الضرورات قبل تشريع العبادات. وقد كان في هذا الترتيب ما جعل الفقهاء يُقسّمون مقاصد الشريعة إلى ضروراتٍ وحاجاتٍ وتحسينات، وأن حفظ النفس والمال والعرض مقدَّمٌ على غيره.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في إلغاء الثأر والربا ما جعل الخطبة تُعالج أمراض المجتمع الجاهلي من جذورها: أن الثأر يُولّد الحروب، وأن الربا يُولّد الظلم الاقتصادي. وكان في اختيار النبيّ ﷺ لدم ربيعة وربا العباس ما جعل التشريع يبدأ بأهل بيت النبيّ ﷺ، فلا يُقال إنه أبقى لنفسه ما ألغاه لغيره.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالتبليغ ومسؤولية الأمة\u003c/h4\u003e\u003cp class=\"ap\"\u003eختم النبيّ ﷺ خطبته بسؤالٍ: «ألا فهل بلّغت؟»، ثم أمر من حضر أن يُبلّغ من غاب، وقال: «فربّ مُبلَّغٍ أوعى من سامع». وكان في هذا ما جعل التبليغ وظيفة الأمة كلها لا وظيفة العلماء وحدهم، وأن من سمع حكماً صار مسؤولاً عن نقله، وأن الله شهيدٌ على البلاغ. وقد كان في هذا السؤال ما جعل التبليغ عهداً يُسأل عنه السامع، وأن الصمت عن العلم مسؤوليةٌ لا راحة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في قوله «فربّ مُبلَّغٍ أوعى من سامع» ما جعل العلم لا يُقاس بالمكانة: قد يكون من سمع مباشرةً أقلّ فهماً من الذي وصله الخبر، وقد يكون التابعيّ أوعى من الصحابيّ في مسألةٍ ما. وكان في هذا ما جعل الرواية تُبنى على الضبط لا على القرب. وقد كان في هذا ما جعل علم الحديث يُنشئ قواعد للتحمّل والأداء، وأن من روى بلا ضبطٍ لم يُقبل خبره ولو كان صالحاً.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا الأمر ما جعل الأمة تحمل الدين بالتواتر: جيلٌ يسمع، وجيلٌ يُبلّغ، وسلسلةٌ لا تنقطع. وكان في هذا ما يُبيّن أن حفظ الدين لم يُوكَل إلى كتابةٍ وحدها ولا إلى أفرادٍ معدودين، بل إلى جماعةٍ لا تجتمع على ضلالة، وكان في هذا أصلٌ من أصول علم الحديث.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالسنة العاشرة\u003c/b\u003e\u003cspan\u003eحجّة النبيّ ﷺ الوحيدة بعد الهجرة، حجّ معه نحو مئة ألف\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eخطبة عرفة\u003c/b\u003e\u003cspan\u003eإعلانٌ جامعٌ لحرمة الدم والمال والعرض، وإلغاء الثأر والربا\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالوصية بالنساء\u003c/b\u003e\u003cspan\u003e«فاتقوا الله في النساء، فإنكم أخذتموهنّ بأمانة الله»\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالثقلان\u003c/b\u003e\u003cspan\u003e«تركت فيكم ما إن أخذتم به لن تضلّوا: كتاب الله»\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eإكمال الدين\u003c/b\u003e\u003cspan\u003e«اليوم أكملت لكم دينكم» نزلت في يوم عرفة\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eما قرّرته الخطبة\u003c/th\u003e\u003cth\u003eالنصّ\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eحرمة الإنسان\u003c/td\u003e\u003ctd\u003e«دماءكم وأموالكم وأعراضكم عليكم حرام»\u003c/td\u003e\u003ctd\u003eأصلٌ جامعٌ لحقوق الإنسان\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eإلغاء الثأر\u003c/td\u003e\u003ctd\u003e«كل شيءٍ من أمر الجاهلية موضوعٌ تحت قدميّ»\u003c/td\u003e\u003ctd\u003eقطعٌ مع منطق القبيلة والانتقام\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eإلغاء الربا\u003c/td\u003e\u003ctd\u003e«ربا الجاهلية موضوع»\u003c/td\u003e\u003ctd\u003eالمال لا يُنمى بالظلم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eحقوق المرأة\u003c/td\u003e\u003ctd\u003e«فاتقوا الله في النساء»\u003c/td\u003e\u003ctd\u003eرزقٌ وكسوةٌ بالمعروف، وأمانةُ الله\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالاعتصام بالوحي\u003c/td\u003e\u003ctd\u003e«كتاب الله»\u003c/td\u003e\u003ctd\u003eعصمةُ الأمة في الوحي لا في الأشخاص\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eأيها الناس، اسمعوا قولي، فإني لا أدري لعلي لا ألقاكم بعد عامي هذا بهذا الموقف أبداً.\u003c/p\u003e\u003ccite\u003eالنبيّ ﷺ في خطبة عرفة، حجّة الوداع، السنة العاشرة\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eحجّة الوداع كانت الحجّة الوحيدة للنبيّ ﷺ بعد الهجرة، حجّ فيها نحو مئة ألف، ووقف بهم على عرفة فخطب خطبةً جمعت أصول الدين وحقوق الإنسان: حرمة الدم والمال والعرض، وإلغاء الثأر والربا، والوصية بالنساء، والاعتصام بالكتاب، ومسؤولية التبليغ. وفيها نزل «اليوم أكملت لكم دينكم»، فكانت إعلاناً باكتمال الرسالة وقرب الرحيل.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"illness-death","n":"المرض والوفاة","ic":"🕯️","part":"القسم الخامس: الوداع والشمائل","h":"\u003carticle class=\"ch3\" id=\"illness-death\" data-toc=\"المرض والوفاة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الخامس: الوداع والشمائل\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٣ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٥\u003ci\u003e.\u003c/i\u003e٣\u003c/span\u003e\n            \u003ch3\u003eالمرض والوفاة\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eفي صفرٍ من السنة الحادية عشرة بدأ المرض الذي تُوفّي فيه النبيّ ﷺ، فاشتدّ عليه الوجع أياماً، وأمر أبا بكر أن يُصلّي بالناس، ثم تُوفّي يوم الاثنين في ربيع الأول، ودُفن في حجرة عائشة، وكان في وفاته أعظم امتحانٍ مرّ به المسلمون.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eفي أواخر صفرٍ من السنة الحادية عشرة بدأ المرض بالنبيّ ﷺ، وكان يشتكي من صداعٍ ووجع، وقد بدأ ذلك بعد رجوعه من زيارة أهل البقيع في ليلةٍ قال فيها: «إني أُمرت أن أستغفر لأهل البقيع»، وكان في هذه الزيارة ما جعل بعض الصحابة يفهمون أنها مقدمةٌ لشيءٍ أكبر، وأن النبيّ ﷺ كان يُودّع من حوله بلا أن يُصرّح. وقد كان في زيارته لأهل البقيع ما جعل الصحابة يفهمون أن النبيّ ﷺ كان يُهيّئهم للفراق تدريجاً، وأن من أراد أن يُخفّف على أهله مصيبةً قادمة فليبدأ بإعدادهم قبل وقوعها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد اشتدّ المرض حتى كان النبيّ ﷺ يُغمى عليه، وكانت عائشة تُلاحظ شدة الوجع، فقال لها: «ما لقيتُ من امرأةٍ ما لقيتُ من نسائي»، وكان في هذا ما جعل المسلمين يعرفون أن النبيّ ﷺ بشرٌ يُصيبه ما يُصيب الناس، وأنه لم يكن يُعافى من الألم بحكم نبوّته، وكان في هذا تسليةٌ لكل مريضٍ في الأمة. وقد كان في شدة وجعه ما جعل المسلمين يعرفون أن البلاء ليس علامةً على غضب الله، وأن الأنبياء أشدّ الناس بلاءً، وأن الصبر على المرض عبادةٌ لا مجرد احتمال.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان النبيّ ﷺ في أيام مرضه يُوصي بأمورٍ: بالصلاة، وبالأنصار، وبأهل الكتاب، وكان يقول: «الصلاة الصلاة وما ملكت أيمانكم»، وكان في هذه الوصية ما جعل آخر ما اهتمّ به النبيّ ﷺ هو الصلاة والرحمة بالضعفاء، وأن من أراد أن يعرف ما كان في قلبه فلينظر إلى ما قاله في آخر لحظاته. وقد كان في هذه الوصية ما جعل الأمة تعرف أن أعظم ما يُحافظ عليه بعد النبيّ ﷺ هو الصلاة، وأن من ضيّعها فقد ضيّع أول ما أوصى به، وأن الرحمة بالضعفاء ليست تفضّلاً بل وصيةً من النبيّ ﷺ.\u003c/p\u003e\u003cp class=\"ap\"\u003eولمّا ثقل المرض، أمر النبيّ ﷺ أبا بكر أن يُصلّي بالناس، وكان في هذا الأمر ما جعل الصحابة يفهمون إشارةً في الاختيار: أن من قدّم للصلاة فقد قُدّم لكل شيء، وأن أبا بكر صار مقدّماً في أعظم شأن. وقد رُوي أن النبيّ ﷺ خرج يوماً وهو مُتعصّب الرأس فجلس إلى جنب أبي بكر فصلى، وكان في هذا ما جعل الأمر واضحاً. وقد كان في خروج النبيّ ﷺ في مرضه ليُصلّي خلف أبي بكر ما جعل الصحابة يعرفون أن الأمر ليس مجرد نيابةٍ في الصلاة، بل تقديمٌ يُفهم منه ما هو أوسع من الصلاة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في اختيار أبي بكر للصلاة ما جعل الأمة بعد ذلك تعرف موقفها في الخلافة، لأن الصلاة كانت أعظم ما في الإسلام، ومن قام بها مقام النبيّ ﷺ كان أولى الناس بمقامه في غيره. وقد قال النبيّ ﷺ في مرضه: «مُروا أبا بكر فليُصلّ بالناس»، وقالت عائشة: إن أبا بكر رجلٌ رقيقٌ، فقال: «مُروا أبا بكر»، وكان في تكرار الأمر ما جعل الاختيار قطعياً لا اجتهاداً.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي يوم الاثنين من شهر ربيع الأول تُوفّي النبيّ ﷺ، وكان في بيت عائشة، وكان قد أسند ظهره إلى صدرها، وكان عندها قدحٌ فيه ماء، فجعل يُدخل يده في الماء ويمسح وجهه ويقول: «لا إله إلا الله، إن للموت لسكرات»، ثم قال: «اللهم الرفيق الأعلى»، وكان في هذه الكلمة الأخيرة ما جعل المسلمين يعرفون أن النبيّ ﷺ اختار الرفيق الأعلى، وأن الموت لم يكن نهايةً بل انتقالاً.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد وقعت الوفاة في وقتٍ لم يكن أحدٌ يتوقّعه، وكان عمر بن الخطاب في المسجد يُكلّم الناس ويقول: إن النبيّ ﷺ لم يمت وإنه سيُرجع، وكان في هذا الموقف ما جعل الأمة على شفا فتنة. فدخل أبو بكر على النبيّ ﷺ وكشف عن وجهه وقبّله، ثم خرج إلى الناس فقال كلمته التي ثبتت بها الأمة: «من كان يعبد محمداً فإن محمداً قد مات، ومن كان يعبد الله فإن الله حيٌّ لا يموت».\u003c/p\u003e\u003cp class=\"ap\"\u003eثم تلا أبو بكر قوله تعالى: «وما محمد إلا رسول قد خلت من قبله الرسل أفإن مات أو قُتل انقلبتم على أعقابكم»، فلمّا سمع الناس الآية كأنهم لم يسمعوها قبل ذلك، وكان في هذا الموقف ما يُبيّن أن أبا بكر كان أعلم الأمة بمقاصد الدين، وأن الآية كانت موجودةً في القرآن قبل ذلك لكن الحاجة إليها لم تكن قد جاءت بعد. وقد كان في هذا الموقف ما جعل الأمة تعرف أن العالم الحقيقي هو من يعرف من القرآن ما تحتاجه اللحظة، وأن حفظ الآيات لا يُغني عن فهم مواقعها، وأن أبا بكر لم يُقل كلمةً من عنده بل أخذها من الوحي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في وفاة النبيّ ﷺ أعظم امتحانٍ مرّ بالمسلمين، لأنهم كانوا قد ألفوا أن يُسألوا فيُجابوا، وأن تُقضى حاجاتهم بحضرته، وأن يعرفوا من القرآن ما لم يعرفوه من غير سؤال. فلمّا غاب، وجدوا أنفسهم أمام كتابٍ وسنّةٍ لا أمام شخص، وكان في هذا ما جعلهم يعرفون أن الإسلام لم يكن قائماً على وجود النبيّ ﷺ بل على ما جاء به. وقد كان في هذا الامتحان ما جعل الأمة تنضج في يومٍ واحد: أن تنتقل من صحبة الشخص إلى اتّباع السنّة، ومن السؤال المباشر إلى الاجتهاد والنظر، وأن تعرف أن غياب النبيّ ﷺ لم يُغلق باب الهداية بل فتح باب العلم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد اختلف المسلمون في موضع دفنه، فأشار أبو بكر بأن يُدفن حيث قُبض، وقال: سمعت النبيّ ﷺ يقول: «ما قُبض نبيٌّ إلا دُفن حيث يُقبض»، فدُفن في حجرة عائشة، وكان في هذا ما جعل قبره في بيته لا في المسجد، وأن المسلمين لم يبنوا على قبره مسجداً، وكان في هذا أصلٌ في منع اتخاذ القبور مساجد. وقد كان في هذا الاختيار ما جعل قبر النبيّ ﷺ في بيته لا في المسجد، وأن المسلمين لم يبنوا على قبره مسجداً في حياته ولا بعد وفاته، وأن من أراد أن يعبد الله فليعبد في مسجدٍ لا عند قبر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في دفنه ﷺ ما جعل المسلمين يعرفون أن النبيّ ﷺ قد فارقهم بجسده، وأن ما بقي هو ما تركه. وقد غُسّل في قميصه ولم يُنزع عنه، وكان في هذا ما جعل أزواجه يُشرفن على غسله، وكان في تفاصيل الغسل والدفن ما جعل الفقه يُبنى على هذا المشهد، وأن المسلمين تعلّموا من موت النبيّ ﷺ ما يفعلونه في موتاهم. وقد كان في تفاصيل الغسل والكفن والدفن ما جعل الفقه يُنشأ من مشاهدةٍ عملية لا من تنظير، وأن الأمة تعلّمت أحكام الجنازة من أول جنازةٍ في الإسلام، وكانت جنازة النبيّ ﷺ.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في أيام الوفاة ما جعل الأمة تُعيد ترتيب نفسها: فقد اجتمع المهاجرون والأنصار في سقيفة بني ساعدة، وتنازعوا في الخلافة، ثم اتفقوا على أبي بكر، وكان في هذا الاختلاف ما جعل الفقه السياسي يُنشأ من الحاجة لا من التنظير. وقد قال أبو بكر في خطبته الأولى: «أطيعوني ما أطعت الله ورسوله، فإن عصيت فلا طاعة لي عليكم»، وكان في هذا ما جعل السلطة عقداً لا وراثة.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003e«من كان يعبد محمداً»\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت كلمة أبي بكر أعظم كلمةٍ في تاريخ الأمة، لأنها فصلت بين محبة الشخص واتّباع الرسالة. وقد كان في المسلمين من أحبّ النبيّ ﷺ حباً جعله لا يُطيق تصديق موته، وكان عمر من أشدّهم، وكان في موقفه ما جعل الفتنة ممكنةً لو لم يُثبّته أبو بكر. وقد كان في موقف عمر ما جعل الأمة تعرف أن المحبة الصادقة قد تُعمي صاحبها عن الحق، وأن من أحبّ شيئاً أكثر من الحق أوشك أن يُخطئ فيه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد استدلّ أبو بكر بالقرآن لا بالعاطفة، وكان في هذا ما جعل الأمة تعرف أن أعظم المواقف تُحسم بالوحي لا بالحماسة. وكان في قوله «فإن الله حيٌّ لا يموت» ما جعل التعلّق ينتقل من الحاضر إلى الباقي، وأن من تعلّق بمن يموت انقطع، ومن تعلّق بالله لم ينقطع. وقد كان في هذا ما جعل الأمة تعرف أن التعلّق بالأشخاص يُنتهي بالموت، وأن التعلّق بالله لا ينتهي، وأن من أراد أن يبقى له حبيبه فليُحبّه في الله.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد قال النبيّ ﷺ قبل ذلك في مرضه: «إن عبداً خيّره الله بين أن يؤتيه من زهرة الدنيا ما شاء وبين ما عنده، فاختار ما عند الله»، فبكى أبو بكر لأنه فهم المعنى، وكان في هذا ما جعل الصحابة يُهيّئون أنفسهم للفراق قبل أن يقع. وقد كان في بكاء أبي بكر ما جعل النبيّ ﷺ يقول: «لا تبك يا أبا بكر»، وكان في هذا ما جعل الصحابة يعرفون أن أبا بكر فهم ما لم يفهمه غيره، وأن الفهم قد يسبق الحدث.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالمرض والوصية\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت وصايا النبيّ ﷺ في مرضه تدور على الصلاة والضعفاء وأهل الكتاب، وكان يقول: «الصلاة الصلاة وما ملكت أيمانكم». وكان في هذا الترتيب ما جعل الأمة تعرف أن أعظم ما يُحافظ عليه هو الصلة بالله، وأن ما يليه هو الرحمة بمن تحت اليد من الضعفاء. وقد كان في تكرار الوصية بالصلاة ما جعلها أعظم ما يُحافظ عليه، وأن من أراد أن يبدأ بإصلاح نفسه فليبدأ بالصلاة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أوصى بالأنصار وقال: «أوصيكم بالأنصار، فإنهم كرشي وعيبتي، وقد قضوا الذي عليهم وبقي الذي لهم»، وكان في هذا ما جعل النبيّ ﷺ يُوصي بمن نصر لا بمن قرب، وأن الوفاء بالجميل أصلٌ من أصول الدين، وأن من صنع معروفاً لا يُترك بعد صاحبه. وقد كان في وصيته بالأنصار ما جعل الأمة تعرف أن الوفاء لأهل الفضل أصلٌ، وأن من نصر الدين في وقتٍ ضعفه لا يُنسى في وقت قوّته.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أوصى بأهل الكتاب فقال: «أوصيكم بأهل الكتاب خيراً»، وكان في هذا ما جعل العلاقة مع غير المسلمين مبناها على العدل لا على العداء، وأن الوصية بها جاءت في آخر لحظات النبيّ ﷺ، وكان في هذا ما جعلها من الأصول لا من الفروع. وقد كان في وصيته بأهل الكتاب ما جعل العلاقة معهم محكومةً بالعهد والعدل لا بالهوى، وأن من أراد أن يعرف حكم الإسلام في غير المسلمين فليقرأ وصية النبيّ ﷺ في آخر أيامه.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالوفاة وأثرها في الأمة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت وفاة النبيّ ﷺ أعظم حدثٍ في تاريخ الإسلام، لأن الأمة فقدت في يومٍ واحدٍ مصدر التشريع الحيّ، ورجعت إلى كتابٍ وسنّة. وكان في هذا ما جعل المسلمين يعرفون أن الدين قد اكتمل قبل الرحيل، وأنهم لم يفقدوا هدايةً بل فقدوا شخصاً كان يُبيّنها. وقد كان في هذا ما جعل الأمة تعرف أن الهداية محفوظةٌ في الكتاب والسنّة، وأن من أرادها فليطلبها فيهما لا في الأشخاص.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في وفاته ما جعل الأمة تُواجه مسائل لم تكن مطروحةً من قبل: من يُصلّي بالناس، ومن يقضي في الخلافات، ومن يقود الجيش. وكان في اجتماع السقيفة ما جعل الفقه السياسي يُنشأ من الواقع لا من النظرية، وأن الأمة تُقرّر أمرها بالشورى لا بالوراثة. وقد كان في السقيفة ما جعل الفقه السياسي يُبنى على اختيار الأمة لا على نصٍّ صريحٍ بالخلافة، وأن الأمة استطاعت أن تُدير أخطر لحظةٍ في تاريخها بلا فتنةٍ كبرى.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في وفاته ما جعل التعلّق بالقبر يُصبح مسألةً في العقيدة، فلمّا دُفن في حجرته ولم يُبنَ على قبره مسجد، عرف المسلمون أن العبادة لله لا للأنبياء، وأن محبتهم تُظهر بالاتّباع لا بالبناء على القبور. وكان في هذا ما جعل التوحيد يُحفظ بعد الرحيل كما حُفظ في الحياة.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eبداية المرض\u003c/b\u003e\u003cspan\u003eأواخر صفر سنة ١١ هـ، بعد زيارة البقيع\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالصلاة\u003c/b\u003e\u003cspan\u003eأمر النبيّ ﷺ أبا بكر أن يُصلّي بالناس في مرضه\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالوفاة\u003c/b\u003e\u003cspan\u003eيوم الاثنين، ربيع الأول سنة ١١ هـ، في حجرة عائشة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالكلمة الأخيرة\u003c/b\u003e\u003cspan\u003e«اللهم الرفيق الأعلى»\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالدفن\u003c/b\u003e\u003cspan\u003eحيث قُبض، في حجرة عائشة، ولم يُبنَ على قبره مسجد\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمرحلة\u003c/th\u003e\u003cth\u003eما جرى فيها\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالمرض\u003c/td\u003e\u003ctd\u003eاشتداد الوجع، وإغماءٌ متكرر\u003c/td\u003e\u003ctd\u003eبيان أن النبيّ بشرٌ يُصيبه ما يُصيب الناس\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالوصايا\u003c/td\u003e\u003ctd\u003eالصلاة، والأنصار، وأهل الكتاب\u003c/td\u003e\u003ctd\u003eترتيبُ الأولويات في آخر لحظات النبيّ ﷺ\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالصلاة بالناس\u003c/td\u003e\u003ctd\u003eأمرٌ متكرر لأبي بكر\u003c/td\u003e\u003ctd\u003eتقديمٌ عمليّ لأبي بكر في أعظم شأن\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالوفاة\u003c/td\u003e\u003ctd\u003e«اللهم الرفيق الأعلى»\u003c/td\u003e\u003ctd\u003eانتقالٌ لا نهاية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالسقيفة\u003c/td\u003e\u003ctd\u003eاجتماع المهاجرين والأنصار\u003c/td\u003e\u003ctd\u003eالخلافة عقدٌ وشورى لا وراثة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eمن كان يعبد محمداً فإن محمداً قد مات، ومن كان يعبد الله فإن الله حيٌّ لا يموت.\u003c/p\u003e\u003ccite\u003eأبو بكر الصديق يوم وفاة النبيّ ﷺ، حين ثبت الله به الأمة\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eمرض النبيّ ﷺ في آخر صفرٍ سنة ١١ هـ، واشتدّ عليه الوجع، فأمر أبا بكر أن يُصلّي بالناس، وأوصى بالصلاة والضعفاء وأهل الكتاب. ثم تُوفّي يوم الاثنين في ربيع الأول في حجرة عائشة، وقال: «اللهم الرفيق الأعلى». فثبّت أبو بكر الأمة بقوله: «من كان يعبد محمداً فإن محمداً قد مات»، ودُفن حيث قُبض. وكان في وفاته أعظم امتحانٍ، وأثبت أن الدين قائمٌ على الوحي لا على الأشخاص.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"shamail","n":"شمائله ﷺ وأخلاقه","ic":"🌿","part":"القسم الخامس: الوداع والشمائل","h":"\u003carticle class=\"ch3\" id=\"shamail\" data-toc=\"شمائله ﷺ وأخلاقه\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالقسم الخامس: الوداع والشمائل\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٤ من ٤\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٥\u003ci\u003e.\u003c/i\u003e٤\u003c/span\u003e\n            \u003ch3\u003eشمائله ﷺ وأخلاقه\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003eبقيت سيرة النبيّ ﷺ بعد رحيله في وصف أصحابه له: خُلقه، وتواضعه، ورحمته، وعدله، وسخاؤه، وشجاعته. وقد جمع العلماء هذه الأوصاف في كتب «الشمائل»، لأن الأمة أرادت أن تحفظ صورة النبيّ ﷺ كما حفظت كلامه، وأن تجعل الاقتداء به ممكناً في التفاصيل لا في العبادات وحدها.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان خُلقه ﷺ القرآن، كما قالت عائشة رضي الله عنها حين سُئلت عن خُلقه فقالت: «كان خُلقه القرآن»، وكان في هذه الكلمة ما جعل الأمة تعرف أن السنّة ليست أفعالاً منفصلة عن القرآن بل هي القرآن مُجسّداً في حياةٍ إنسانية. وكان في هذا ما جعل الاقتداء بالنبيّ ﷺ يُفهم فهماً جامعاً: أن تُترجم الآيات إلى سلوك، وأن يكون الدين ظاهراً في المعاملة لا في العبادة فقط.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان ﷺ أشدّ الناس تواضعاً مع عظم مقامه: كان يخصف نعله، ويُخيط ثوبه، ويحلب شاته، ويخدم نفسه، وكان يجلس حيث ينتهي به المجلس، وكان يقول: «لا تُطروني كما أطرت النصارى عيسى ابن مريم، فإنما أنا عبد، فقولوا عبد الله ورسوله». وكان في هذا التواضع ما جعل أصحابه يُحبّونه لا يهابونه، وأنهم كانوا يُكلّمونه كأحدهم ويسألونه عن أخصّ شؤونهم. وقد كان في هذا التواضع ما جعل الناس لا يخافون أن يسألوا، وأن العلم لا يُنال مع الهيبة الزائدة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان ﷺ أرحم الناس بالضعفاء والخدم: قال أنس بن مالك: «خدمتُ النبيّ ﷺ عشر سنين، فوالله ما قال لي أفٍّ قط، ولا قال لشيءٍ فعلته: لِمَ فعلت؟ ولا لشيءٍ لم أفعله: ألا فعلت؟». وكان في هذه الشهادة ما جعل الأمة تعرف أن الرحمة تُقاس بما يتحمّله الإنسان من أخطاء من تحت يده، وأن من ملك القدرة على اللوم فتركه فقد بلغ مرتبةً عالية. وقد كان في صنيعه مع أنس ما جعل الخدم يعرفون أن الإسلام لم يُشرّع السخرة بل العشرة، وأن عشر سنواتٍ بلا لومٍ هي شهادةٌ لا تُشترى.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان ﷺ أشدّ الناس عدلاً حتى مع خصومه: فقد جاءه رجلٌ يطلب حقاً، فجذبه بردائه جذبةً شديدة حتى أثّرت في عنقه، فقال: «أعطني حقي»، فابتسم النبيّ ﷺ وأمر له بعطاءٍ، وكان في هذا ما جعل الصحابة يعرفون أن العدل ليس ليناً في الحق بل إعطاءٌ لكل ذي حقٍّ حقّه، وأن النبيّ ﷺ لم يستعمل سلطته للانتقام من جافٍ. وقد كان في ابتسامه ﷺ للجافي وأمره له بعطاءٍ ما جعل الصحابة يعرفون أن القدرة على العفو أعظم من القدرة على الانتقام، وأن من ملك أن ينتقم فلم يفعل فقد بلغ أعلى مراتب القوة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان ﷺ أكرم الناس وأبعدهم عن جمع المال: فقد جاءه رجلٌ فسأله، فأعطاه غنماً بين جبلين، فرجع الرجل إلى قومه فقال: «أسلموا، فإن محمداً يُعطي عطاءً لا يخشى الفاقة». وكان في هذا العطاء ما جعل الإسلام يدخل القلوب بالكرم قبل أن يدخلها بالحجة، وأن من أراد أن يُعلّم الناس فليبدأ بالعطاء لا بالوعظ، وكان في سخائه ما جعل بعض من أسلم يقول: ما رأينا ملكاً أرفّ من هذا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان ﷺ أشجع الناس في مواطن الخوف: ففي حنين ثبت على بغلته والناس يُدبرون، وفي أُحد ثبت وحده في نفرٍ قليل، وقد قال أنس: «كان النبيّ ﷺ أحسن الناس وأشجع الناس»، وقال رجلٌ من أصحابه: «لقد فزع أهل المدينة ليلةً، فخرج النبيّ ﷺ على فرسٍ لأبي طلحة عُري، فقال: لن تُراعوا، لن تُراعوا». وكان في هذا ما جعل الشجاعة تُقاس بالثبات لا بالصياح، وأن القائد الحقيقي يسبق الناس إلى موضع الخوف لا يتبعهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان ﷺ رحيماً بالحيوان: فقد رُوي أنه مرّ ببعيرٍ قد لصق ظهره ببطنه من الجوع فقال: «اتقوا الله في هذه البهائم المُعجمة»، ورأى عصفوراً يُقلّب وفرخه قد أُخذ فقال: «من فجع هذه بولدها؟ ردّوا عليها فرخها». وكان في هذه الوصايا ما جعل الرحمة في الإسلام تتجاوز الإنسان إلى كل ما له كبدٌ رطبة، وأن من أراد أن يعرف رقّة القلب فلينظر إلى معاملته لمن لا يستطيع أن يُطالبه بحق.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان ﷺ يُحسن إلى من أساء إليه: فقد جاءت امرأةٌ تسبّه وتُؤذيه، فلم يزد على أن قال: «إنها تصنع كذا وكذا»، وكان يقول: «ما نُزع الرِّفق من شيءٍ إلا شانه، وما كان في شيءٍ إلا زانه». وكان في هذا ما جعل الأمة تعرف أن القوة ليست في الردّ بل في التحكّم في الردّ، وأن من ملك نفسه عند الغضب فقد ملك أعظم ما يملكه الإنسان. وقد كان في هذا ما جعل الأمة تعرف أن الرفق ليس ضعفاً بل قوةً مُتحكَّمة، وأن من أراد أن يعرف رجولة الرجل فلينظر إلى ما يفعله حين يغضب، لا إلى ما يقوله حين يرضى.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان ﷺ يعمل بيده ويعيش كأفقر الناس: فقد كان ينام على الحصير فيُؤثّر في جنبه، فقال له عمر: لو اتّخذت فراشاً ألين من هذا، فقال: «ما لي وللدنيا؟ ما أنا في الدنيا إلا كراكبٍ استظلّ تحت شجرةٍ ثم راح وتركها». وكان في هذا ما جعل الصحابة يعرفون أن الزهد ليس ترك العمل بل ترك التعلّق، وأن النبيّ ﷺ وهو سيد الناس كان أبعدهم عن متاعهم. وقد كان في هذا ما جعل الزهد يُفهم على أنه تحريرٌ للقلب لا تعذيبٌ للجسد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان ﷺ يبتسم ويُداعب أصحابه: كان يُداعب زاهراً الأعرابي، وكان يُداعب أنساً ويقول: «يا ذا الأذنين»، وكان يقول: «إن الله يُحبّ أن تُؤتى رخصه كما يُحبّ أن تُؤتى عزائمه». وكان في هذه المداعبة ما جعل الإسلام لا يُفهم على أنه عبوس، وأن النبيّ ﷺ جمع بين الجدّ في الحق واللطف في العشرة، وأن من ظنّ أن التديّن قطوبٌ فقد أخطأ فهم السنّة. وقد كان في مداعبته ما جعل الإسلام ديناً يُعاش لا ديناً يُتحمّل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان ﷺ يستغفر في اليوم مئة مرة، ويقوم من الليل حتى تتفطر قدماه، ويقول: «أفلا أكون عبداً شكوراً». وكان في هذا ما جعل الأمة تعرف أن العبادة لا تُؤدّى لحاجة الله إليها بل لحاجة العبد إليها، وأن النبيّ ﷺ وهو مغفورٌ له كان أشدّ الناس عبادة، وكان في هذا ما جعل التقصير في العبادة عذراً بلا عذر. وقد كان في استغفاره ﷺ مئة مرة في اليوم ما جعل الأمة تعرف أن الاستغفار ليس توبةً عن ذنبٍ فقط بل اعترافٌ بالتقصير أمام الله، وأن من عرف مقام ربه لم يزل يستغفر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بقيت هذه الشمائل محفوظةً في كتبٍ ألّفها العلماء، ككتاب «الشمائل المحمدية» للترمذي، لأن الأمة أرادت أن تُقرأ السيرة في التفاصيل لا في الأحداث الكبرى فقط. وكان في هذا التدوين ما جعل الاقتداء بالنبيّ ﷺ ممكناً لكل أحد: في بيته وسوقه ومسيره، وفي معاملته لأهله وخدمه وخصومه، وأن الإسلام يُعرف من أخلاق أهله لا من كتبهم وحدها. وقد كان في تدوين الشمائل ما جعل السيرة تُقرأ في البيوت والأسواق، لا في المعارك والخطب فقط.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003e«كان خُلقه القرآن»\u003c/h4\u003e\u003cp class=\"ap\"\u003eقول عائشة «كان خُلقه القرآن» أعظم وصفٍ يُقال في النبيّ ﷺ، لأنه جعل القرآن مقياساً لسلوكه، وأن كل ما أمر به القرآن من عدلٍ ورحمةٍ وعفافٍ وصبرٍ كان ظاهراً في حياته. وكان في هذا ما جعل السنّة تُفهم على أنها تطبيقٌ للقرآن لا تشريعاً مستقلاً عنه. وقد كان في هذا ما جعل من أراد أن يفهم السنّة فليقرأ القرآن أولاً، لأن السنّة شرحٌ له لا بديلٌ عنه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا الوصف ما جعل الاقتداء بالنبيّ ﷺ ممكناً في كل زمان: لأن القرآن موجود، فمن أراد أن يقتدي بالنبيّ ﷺ فليقرأ القرآن وليُطبّقه. وكان في هذا ما جعل السنة القولية والفعلية تُقرأ مع القرآن لا بدلاً منه، وأن من أراد الفهم الصحيح فليجمع بينهما. وقد كان في هذا ما جعل العلماء يُؤلّفون في الأخلاق كما ألّفوا في الأحكام، لأن الأخلاق عندهم جزءٌ من الدين لا زينةٌ عليه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا الوصف أيضاً ما جعل الأخلاق في الإسلام جزءاً من الدين لا زينةً عليه: أن يكون الصدق والعدل والرحمة عباداتٍ لا مجاملات، وأن من تركها فقد ترك ما دعا إليه القرآن. وكان في هذا ما جعل ميزان الناس في الإسلام أخلاقهم لا مظاهرهم. وقد كان في هذا ما جعل النبيّ ﷺ يقول: «إنما بُعثت لأتمّم مكارم الأخلاق»، وكان في هذا ما جعل الأخلاق غايةً من غايات البعثة لا نتيجةً جانبية لها.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالرحمة بالضعفاء والحيوان\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت رحمة النبيّ ﷺ تشمل من لا يستطيع أن يُطالب بحق: الخادم، والمرأة، والطفل، والحيوان. وكان في هذا ما جعل الرحمة في الإسلام مقياساً للقوة لا علامةً على الضعف، وأن من كان قادراً على الإيذاء فلم يُؤذِ فقد بلغ مرتبةً عالية. وقد كان في هذا ما جعل الرحمة في الإسلام مقياساً للقوة لا علامةً على الضعف، وأن من رحم من لا يستطيع أن يُطالب بحقّه فقد بلغ أعلى ما يُبلغه الإنسان.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد قال ﷺ: «الراحمون يرحمهم الرحمن، ارحموا من في الأرض يرحمكم من في السماء»، وكان في هذا ما جعل الرحمة علاقةً متبادلةً بين العبد وربه: أن من رحم خُلقه رُحم، وأن من قسا على من تحته قُسي عليه. وكان في هذا ما جعل الأخلاق تُقاس بالمعاملة لا بالشعور. وقد كان في هذا ما جعل الرحمة عملاً لا عاطفة، وأن من قال إنه رحيم فليُنظر إلى معاملته لمن تحت يده.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في وصاياه بالبهائم ما جعل الفقه يُنشئ باباً في حقّ الحيوان: أن تُطعم إذا جاعت، وتُسقى إذا عطشت، ولا تُحمّل ما لا تُطيق، ولا تُفجع بولدها. وكان في هذا ما جعل الإسلام يُعلّم أن الرحمة ليست عاطفةً عابرةً بل أحكاماً تُعرف وتُطبّق. وقد كان في هذا ما جعل الفقه يُدخل الحيوان في باب الحقوق، وأن من أراد أن يعرف رقّة قلب أمةٍ فلينظر إلى ما شرعته لبهائمها.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالشمائل وأثرها في الأمة\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم تكن الشمائل تفاصيل شخصية لا علاقة لها بالدين، بل كانت في نظر الصحابة جزءاً من الرسالة. وقد كانوا ينقلون عنه كيف يأكل وكيف ينام وكيف يُصافح، لأنهم أرادوا أن يُحفظ الإسلام كاملاً في حياةٍ واحدة، لا في أفكارٍ مجرّدة. وقد كان في نقلهم لتفاصيل حياته ما جعل الإسلام ديناً قابلاً للتقليد في كل زمان، وأن من أراد أن يقتدي به فليقتد به في بيته وسوقه ومسيره.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في تدوين الشمائل ما جعل الأمة تُقاوم تحويل الدين إلى قوانين جافة: أن تُذكّر الناس بأن التشريع نزل على قلب رجلٍ رحيم، وأن تُبيّن أن الإسلام يمكن أن يُعاش ببشاشةٍ لا بقطوب. وكان في هذا ما جعل العلماء يُؤلّفون في الأخلاق كما ألّفوا في الفقه. وقد كان في هذا ما جعل الأخلاق علماً له أصوله ومصادره، لا مجرد مواعظ تُقال في المنابر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه الشمائل ما جعل من أراد أن يدعو إلى الإسلام يبدأ بأخلاقه: فقد دخل الناس في الإسلام بكرم النبيّ ﷺ وصدقه وأمانته قبل أن يدخلوا ببرهانٍ فلسفي. وكان في هذا ما جعل الدعوة اليوم تحتاج إلى أخلاقٍ أكثر من حاجتها إلى جدال، وأن من حسن خُلقه كفاه ذلك دليلاً.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eخُلقه\u003c/b\u003e\u003cspan\u003e«كان خُلقه القرآن» — قول عائشة رضي الله عنها\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eتواضعه\u003c/b\u003e\u003cspan\u003e«إنما أنا عبد، فقولوا عبد الله ورسوله»\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eخدمته\u003c/b\u003e\u003cspan\u003eخدمه أنس عشر سنين فما قال له أفٍّ قط\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسخاؤه\u003c/b\u003e\u003cspan\u003eأعطى غنماً بين جبلين، فقال الرجل: أسلموا\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eزُهده\u003c/b\u003e\u003cspan\u003e«ما أنا في الدنيا إلا كراكبٍ استظلّ تحت شجرة ثم راح وتركها»\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالخصلة\u003c/th\u003e\u003cth\u003eالشاهد\u003c/th\u003e\u003cth\u003eالدلالة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالتواضع\u003c/td\u003e\u003ctd\u003eكان يخصف نعله ويخدم نفسه\u003c/td\u003e\u003ctd\u003eالعظمة لا تُنافي خدمة النفس\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالرحمة\u003c/td\u003e\u003ctd\u003eعشر سنين خدمةٍ بلا لوم\u003c/td\u003e\u003ctd\u003eالرحمة تُقاس بتحمّل أخطاء من تحت اليد\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالعدل\u003c/td\u003e\u003ctd\u003eأعطى من جذبه بردائه\u003c/td\u003e\u003ctd\u003eالعدل ليس ليناً في الحق\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالشجاعة\u003c/td\u003e\u003ctd\u003eثبت في حنين وأُحد\u003c/td\u003e\u003ctd\u003eالشجاعة ثباتٌ لا صياح\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالزهد\u003c/td\u003e\u003ctd\u003eنام على الحصير فأثّر في جنبه\u003c/td\u003e\u003ctd\u003eالزهد ترك التعلّق لا ترك العمل\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eما نُزع الرِّفق من شيءٍ إلا شانه، وما كان في شيءٍ إلا زانه.\u003c/p\u003e\u003ccite\u003eمن شمائله ﷺ في الرفق، وقد جُمعت في كتب الشمائل كسنن الترمذي\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eبقيت شمائل النبيّ ﷺ محفوظةً كما بقي كلامه: خُلقه القرآن، وتواضعه مع عظم مقامه، ورحمته بالضعفاء والخدم والحيوان، وعدله مع خصومه، وسخاؤه، وشجاعته، وزُهده. وقد جمع العلماء هذه الأوصاف في كتب الشمائل لأن الاقتداء يحتاج إلى تفاصيل لا إلى عناوين. وفي شمائله ﷺ ما جعل الإسلام يُعرف من أخلاق أهله، وأن الدعوة تبدأ بحسن الخلق قبل الجدال.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"f","one":true,"id":"people","n":"أهم الشخصيات","ic":"","part":"","h":"\u003csection class=\"rsec\"\u003e\n      \u003ch2 class=\"sec\"\u003eأهم الشخصيات\u003c/h2\u003e\n      \u003cdiv class=\"people\"\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eمحمد بن عبد الله ﷺ\u003c/b\u003e\u003cspan\u003eالنبي خاتم الأنبياء، وُلد بمكة ٥٧١م، وأُوحى إليه ٦١٠م، وتوفي بالمدينة ٦٣٢م.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eخديجة بنت خويلد\u003c/b\u003e\u003cspan\u003eزوجة النبي ﷺ وأوّل من آمن به، وبذلت مالها في الدعوة قبل هجرته.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eأبو بكر بن أبي قحافة\u003c/b\u003e\u003cspan\u003eصديق النبي ﷺ، مهاجر الحبشة معه، وأوّل من أسند له الراية في بدر.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eعمر بن الخطاب\u003c/b\u003e\u003cspan\u003eأسلم في السنة السادسة من البعثة، وأجاز الهجرة، وصار أمير المؤمنين بعد أبي بكر.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eبلال بن رباح\u003c/b\u003e\u003cspan\u003eصحابي مكة اشتراه عمرو بن العاص مملوكاً، وأعتقه في الإسلام وصار أمير المؤمنين.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eعمرو بن العاص\u003c/b\u003e\u003cspan\u003eقائد فرسان الإسلام الفاتحين، أرسله عمر إلى النجاشي يفصل بين علي وعثمان وعمر.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eعائشة بنت أبي بكر\u003c/b\u003e\u003cspan\u003eزوجة النبي ﷺ، وأحد أشهر ناقلات الحديث، وروت للناس كثيراً من أحواله.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\n    \u003c/section\u003e"},{"u":"f","one":true,"id":"outcomes","n":"النتائج والآثار","ic":"","part":"","h":"\u003csection class=\"rsec\"\u003e\n      \u003ch2 class=\"sec\"\u003eالنتائج والآثار\u003c/h2\u003e\n      \u003cul class=\"outs\"\u003e\u003cli\u003eأسّس النبي ﷺ في المدينة كياناً سياسياً ودينياً متكاملاً، فكانت نواة الدولة الإسلامية الأولى.\u003c/li\u003e\u003cli\u003eأمن أهل الذمة من مسيحيين ويهود، فاستقرّوا في المدينة تحت حماية الدولة.\u003c/li\u003e\u003cli\u003eأرسى النبي ﷺ أركان الصلاة والزكاة والحج، فصارت أركاناً عملية في حياة المسلمين.\u003c/li\u003e\u003cli\u003eمهّدت حجة الوداع لحج الأجيال، بإتمام مناسك الحج كما حج النبي ﷺ.\u003c/li\u003e\u003cli\u003eدوّنت كتب السيرة أحوال النبي ﷺ تفصيلاً، فصارت أصلاً لتاريخ الإسلام الأول.\u003c/li\u003e\u003cli\u003eبدأ التاريخ الهجري من هجرة النبي ﷺ إلى المدينة سنة ٦٢٢م، فصار أصلاً في تأريخ المسلمين.\u003c/li\u003e\u003c/ul\u003e\n    \u003c/section\u003e"},{"u":"f","one":true,"id":"sources","n":"المصادر والمراجع","ic":"","part":"","h":"\u003cdiv class=\"src frame\" style=\"--c:#1E6B3A\"\u003e\n    \u003cspan class=\"crn tl\"\u003e\u003csvg viewBox=\"0 0 26 26\"\u003e\n\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\"/\u003e\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\" transform=\"rotate(90 13 13)\" opacity=\".5\"/\u003e\u003c/svg\u003e\u003c/span\u003e\u003cspan class=\"crn tr\"\u003e\u003csvg viewBox=\"0 0 26 26\"\u003e\n\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\"/\u003e\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\" transform=\"rotate(90 13 13)\" opacity=\".5\"/\u003e\u003c/svg\u003e\u003c/span\u003e\u003cspan class=\"crn bl\"\u003e\u003csvg viewBox=\"0 0 26 26\"\u003e\n\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3
