َإِسْمَاعِيلَ وَإِدْرِيسَ وَذَا الْكِفْلِ كُلٌّ مِّنَ الصَّابِرِينَ﴾ (سورة الأنبياء: ٨٥). فصِفَ بالصدق في الوعد وبالصبر، وهما وصفان يذكَران في موضع جامعٍ لا في سياق قصّة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد جاء ذكر ميلاد إسحاق فرحًا؛ قال الله تعالى: ﴿وَامْرَأَتُهُ قَائِمَةٌ فَضَحِكَتْ فَبَشَّرْنَاهَا بِإِسْحَقَ وَمِن وَرَاءِ إِسْحَقَ يَعْقُوبَ﴾ (سورة هود: ٧١). فجاء الموعد بالذرّية في الآية ذاتها، وسُبِّق بالبشارة بالابن ثم بما بعده. ولم يذكر القرآن سِنّ الرسالة ولا قصر العمر، فيقتصر المُتعلِّم على ما ورد ولا يُضِف إلى الآية ما لم تقل به.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما قصة الذبح فقد وردت بلفظ الابن دون تسمية؛ قال الله تعالى: ﴿فَبَشَّرْنَاهُ بِغُلَامٍ حَلِيمٍ﴾ (سورة الصفات: ١٠١)، ثم: ﴿فَلَمَّا بَلَغَ مَعَهُ السَّعْيَ قَالَ يَا بُنَيَّ إِنِّي أَرَىٰ فِي الْمَنَامِ أَنِّي أَذْبَحُكَ فَانْظُرْ مَاذَا تَرَىٰ قَالَ يَا أَبَتِ افْعَلْ مَا تُؤْمَرُ سَتَجِدُنِي إِنْ شَاءَ اللَّهُ مِنَ الصَّابِرِينَ﴾ (سورة الصفات: ١٠٢). فجاء جواب الابن بالطاعة والصبر في آيةٍ واحدة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد خُتمت القصة بالتصديق؛ قال الله تعالى: ﴿قَدْ صَدَّقْتَ الرُّؤْيَا إِنَّا كَذَلِكَ نَجْزِي الْمُحْسِنِينَ﴾ (سورة الصفات: ١٠٥)، وقال: ﴿وَبَارَكْنَا عَلَيْهِ وَعَلَىٰ إِسْحَقَ﴾ (سورة الصفات: ١١٣). فلم يذكر القرآن عقوبةً ولا ندمًا ولا أثرًا بعد ذلك، بل ذكر البركة والجزاء. وهذه الصمتات القرآنية منهجٌ فيه ترك ما لا يُعبَّر عنه، وبه تُقرأ القصة بلا زيادةٍ على ما أُنزل، ولا يُطلب لها تفصيلٌ لم يَرِد في كتاب الله.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما يعقوب عليه السلام فقد أصابه الحزن بفقد ابنه، قال الله تعالى: ﴿وَتَوَلَّىٰ عَنْهُمْ وَقَالَ يَا أَسَفَىٰ عَلَىٰ يُوسُفَ وَابْيَضَّتْ عَيْنَاهُ مِنَ الْحُزْنِ فَهُوَ كَظِيمٌ﴾ (سورة يوسف: ٨٤). وفي الآية صفةُ الحزن لا حكمٌ على البكاء ولا سببٌ خارجي، ثم قال لهم: ﴿يَا بَنِيَّ اذْهَبُوا فَتَحَسَّسُوا مِن يُوسُفَ وَأَخِيهِ وَلَا تَايَأْسُوا مِن رَّوْحِ اللَّهِ﴾ (سورة يوسف: ٨٧). فاجتاز من الحزن إلى العمل في آيةٍ واحدة، ولم يذكر في الآيتين لومًا ولا إحباطًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد جاءت وصية إبراهيم لبنيه بالتوحيد، قال الله تعالى: ﴿وَوَصَّىٰ بِهَا إِبْرَاهِيمُ بَنِيهِ وَيَعْقُوبُ يَا بَنِيَّ إِنَّ اللَّهَ اصْطَفَىٰ لَكُمُ الدِّينَ فَلَا تَمُوتُنَّ إِلَّا وَأَنتُم مُّسْلِمُونَ﴾ (سورة البقرة: ١٣٢). وقد تكرّر اجتياز القرآن لهذه الوصية في آية الإيمان بالرسل جميعهم: ﴿آمَنَّا بِاللَّهِ وَمَا أُنزِلَ عَلَيْنَا وَمَا أُنزِلَ عَلَىٰ إِبْرَاهِيمَ وَإِسْمَاعِيلَ وَإِسْحَقَ وَيَعْقُوبَ وَالْأَسْبَاطِ﴾ (سورة البقرة: ٨٤). فصارت الذرّية كلّها موصولةً بالوصية.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eإسماعيل: الوعد والصدق\u003c/h4\u003e\u003cp class=\"ap\"\u003eقال الله تعالى: ﴿وَاذْكُرْ فِي الْكِتَابِ إِسْمَاعِيلَ إِنَّهُ كَانَ صَادِقَ الْوَعْدِ وَكَانَ رَسُولًا نَّبِيًّا﴾ (سورة مريم: ٥٤). وهذه جملةٌ جامعة في كتاب الله ذُكر فيها الاسم ثم الصفة ثم الرسالة، دون تفصيل قصّةٍ كاملة. وقد كرّر القرآن ذكره في مواضعٍ أخرى بصفاتٍ متشابهة، فلم تتغير الوصفة من موضعٍ إلى موضع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد جاء ذكره في سياق الصبر: ﴿وَإِسْمَاعِيلَ وَإِدْرِيسَ وَذَا الْكِفْلِ كُلٌّ مِّنَ الصَّابِرِينَ﴾ (سورة الأنبياء: ٨٥). والجمع في الآية يجمع بين الأنبياء على وصفٍ واحد، وهو الصبر، لا على وصفٍ يخصّ كلٍّ منهم. وبذلك يُقرأ الاسم في سياق عموميٍّ لا في سياق قصّةٍ مفردة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ذُكر مع أبيه في رفع قواعد البيت: ﴿وَإِذْ يَرْفَعُ إِبْرَاهِيمُ الْقَوَاعِدَ مِنَ الْبَيْتِ وَإِسْمَاعِيلُ﴾ (سورة البقرة: ١٢٧). فجاء الذكر في باب البناء لا في باب الميلاد، وهو يدلّ على أن القرية كلّها كان لها دورٌ في القيام بالبيت. وقد تقدّم الذكران في آيةٍ واحدة لا في موضعين منفصلين.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eإسحاق والبشارة\u003c/h4\u003e\u003cp class=\"ap\"\u003eقال الله تعالى: ﴿وَامْرَأَتُهُ قَائِمَةٌ فَضَحِكَتْ فَبَشَّرْنَاهَا بِإِسْحَقَ وَمِن وَرَاءِ إِسْحَقَ يَعْقُوبَ﴾ (سورة هود: ٧١). فجاءت البشارة مرتّبة: الابن ثم من بعده، وهذا ترتيبٌ في الآية نفسها لا خارجها. وقد وردت البشارة بصيغةٍ قصيرة جامعة، ولا تُفصل فيها تفاصيلُ الميلاد ولا سِنّ الولادة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ذكر الله إسحاق في بركة النبوّة: ﴿وَبَارَكْنَا عَلَيْهِ وَعَلَىٰ إِسْحَقَ﴾ (سورة الصفات: ١١٣)، وفي هداية الأنبياء: ﴿وَوَهَبْنَا لَهُ إِسْحَقَ وَيَعْقُوبَ كُلًّا هَدَيْنَا﴾ (سورة الأنعام: ٨٤). فالبركة في الموضع الأول والهداية في الموضع الثاني، والمعنيان يجتمعان في نعمةٍ واحدة لا يتنافيان.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد وُصفت هديتهما في موضع آخر بأنها نافلةٌ فرضيّة: ﴿وَوَهَبْنَا لَهُ إِسْحَقَ وَيَعْقُوبَ نَافِلَةً﴾ (سورة الأنبياء: ٧٢)، فجاءت النافلة بعد الفريضة لا قبلها. ويبقى المضمون واحدًا: نعمةٌ من الله على أبيهما وبركةٌ عليهما، ووصيةٌ لا تنتهي عند حدّ زمني، بل تسير مع الذرّية كلّها في كتاب الله.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eيعقوب والوصية\u003c/h4\u003e\u003cp class=\"ap\"\u003eوصف القرآن حزن يعقوب عليه السلام وصفًا محسوسًا: ﴿وَابْيَضَّتْ عَيْنَاهُ مِنَ الْحُزْنِ فَهُوَ كَظِيمٌ﴾ (سورة يوسف: ٨٤). ولم يذكر في الآية لومًا ولا ندمًا، ولا أثرًا غير أثر الحزن نفسه. وقد اقتصر الوصف على ما ظهر من صفة الأب، دون تفصيلٍ في عدد الأيام ولا في مقدار الفراق.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم جاء نهيه عن اليأس: ﴿وَلَا تَايَأْسُوا مِن رَّوْحِ اللَّهِ إِنَّهُ لَا يَايَأْسُ مِن رَّوْحِ اللَّهِ إِلَّا الْقَوْمُ الْكَافِرُونَ﴾ (سورة يوسف: ٨٧). وهذه الجملة هي النهاية التي انتقل بها من الحزن إلى العمل، فلم يبقَ في الآية تفصيلٌ غير هذا. وقد كرّر الحكم في الآية نفسها تعليلاً وجوابًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما وصيته بالتوحيد فهي موصولة بوصية إبراهيم: ﴿وَوَصَّىٰ بِهَا إِبْرَاهِيمُ بَنِيهِ وَيَعْقُوبُ﴾ (سورة البقرة: ١٣٢)، وفيها نهيٌ عن الموت على غير الإسلام: ﴿فَلَا تَمُوتُنَّ إِلَّا وَأَنتُم مُّسْلِمُونَ﴾. وهذه الوصية جمعت الأبوين في آيةٍ واحدة، وبيّنت أن الوصية واحدة لا تتبدّل بين الأجيال.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eإسماعيل عليه السلام\u003c/b\u003e\u003cspan\u003eصادق الوعد ورسولٌ نبيّ، وذُكر مع أبيه في رفع قواعد البيت ووصف بالصبر.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالبشارة بالذرّية\u003c/b\u003e\u003cspan\u003eبشارةٌ بإسحاق ثم بمن ورائه يعقوب في آية واحدة من سورة هود.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالذبح\u003c/b\u003e\u003cspan\u003eوردت القصة بلفظ الابن دون تسمية، وجاء جوابه: افعل ما تؤمر ستجدني إن شاء الله من الصابرين.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالوصية\u003c/b\u003e\u003cspan\u003eوصّى إبراهيم بنيه ويعقوب: إن الله اصطفى لكم الدين فلا تموتون إلا وأنتم مسلمون.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالنبي\u003c/th\u003e\u003cth\u003eما ورد في القرآن\u003c/th\u003e\u003cth\u003eالسورة ورقم الآية\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eإسماعيل\u003c/td\u003e\u003ctd\u003eإنه كان صادق الوعد وكان رسولا نبيّا\u003c/td\u003e\u003ctd\u003eمريم: ٥٤\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eإسماعيل\u003c/td\u003e\u003ctd\u003eرفع القواعد من البيت مع إبراهيم\u003c/td\u003e\u003ctd\u003eالبقرة: ١٢٧\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eإسحاق\u003c/td\u003e\u003ctd\u003eومن وراء إسحاق يعقوب\u003c/td\u003e\u003ctd\u003eهود: ٧١\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eيعقوب\u003c/td\u003e\u003ctd\u003eووصّى بها إبراهيم بنيه ويعقوب\u003c/td\u003e\u003ctd\u003eالبقرة: ١٣٢\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالأسباط\u003c/td\u003e\u003ctd\u003eآمنا بما أنزل على إبراهيم وإسماعيل وإسحاق ويعقوب والأسباط\u003c/td\u003e\u003ctd\u003eالبقرة: ٨٤\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eقال الله تعالى: ﴿وَوَصَّىٰ بِهَا إِبْرَاهِيمُ بَنِيهِ وَيَعْقُوبُ يَا بَنِيَّ إِنَّ اللَّهَ اصْطَفَىٰ لَكُمُ الدِّينَ فَلَا تَمُوتُنَّ إِلَّا وَأَنتُم مُّسْلِمُونَ﴾\u003c/p\u003e\u003ccite\u003eالقرآن الكريم — سورة البقرة، الآية ١٣٢\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eوهب الله لإبراهيم إسحاق ويعقوب وهداهم، وذُكر إسماعيل في الذكر بالصدق في الوعد وبالصبر. ووردت قصّة الذبح بلفظ الابن دون تسمية، ودُوّرت وصيّة إبراهيم ويعقوب بالتوحيد، فكانت الذرّية كلّها على وصيةٍ واحدة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-3","n":"يوسف وموسى في مصر","ic":"","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-3\" style=\"--c:#8B4513\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🏜️\u003c/div\u003e\n      \u003ch2\u003eيوسف وموسى في مصر\u003c/h2\u003e\n      \u003cp\u003eيعالج هذا الجزء قصتَي يوسف وموسى عليهما السلام في مصر: بدءًا من رؤيا يوسف ومكيدة إخوته وبِيعه حتى سجنه وتمكينه في الأرض، ثم من بعثة موسى إلى فرعون وملئه بآياته المفصّلة حتى الخروج من مصر والتيه بعد ذلك. وقد وُزِّعت الآيات بين سورة يوسف والأعراف وطه والقصص ويونس والشعراء والدخان والمائدة، ونذكر مع كل نصٍّ سورةَه ورقمَ آيته بأرقام عربية.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#yusuf-dream\"\u003eيوسف والرؤيا\u003c/a\u003e\u003ca href=\"#pharaoh-musa\"\u003eموسى وفرعون\u003c/a\u003e\u003ca href=\"#exodus-wandering\"\u003eالخروج والتيه\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"yusuf-dream","n":"يوسف والرؤيا","ic":"🌙","part":"يوسف وموسى في مصر","h":"\u003carticle class=\"ch3\" id=\"yusuf-dream\" data-toc=\"يوسف والرؤيا\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eيوسف وموسى في مصر\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ١ من ٣\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٣\u003ci\u003e.\u003c/i\u003e١\u003c/span\u003e\n            \u003ch3\u003e🌙 يوسف والرؤيا\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eك\u003c/span\u003eيف جاءت رؤيا يوسف عليه السلام إلى أبيه، وكيف تحوّلت إلى مكيدةٍ إخوته ثم إلى بيعٍ ثم إلى سجنٍ ثم إلى خزائن الأرض؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eقال الله تعالى: ﴿إِذْ قَالَ يُوسُفُ لِأَبِيهِ يَا أَبَتِ إِنِّي رَأَيْتُ أَحَدَ عَشَرَ كَوْكَبًا وَالشَّمْسَ وَالْقَمَرَ رَأَيْتُهُمْ لِي سَاجِدِينَ﴾ (سورة يوسف: ٤). فهذه جملةٌ واحدة تُحدِّد العدد والمُشاهَد والحالة، ولم يُضِف إليها يوسف عليه السلام تأويلًا من عند نفسه، بل عرضها على أبيه كما رآها. والعدد إحدى عشرة كوكبًا مع الشمس والقمر، وهذا كلُّ ما ذكره النصُّ في موضع الرؤيا. ثم أتبعه القرآن بجملة يعقوب عليه السلام، وهي أوّلُ تعليقٍ ورد عليها في القصة، إذ جاء فيها التحذير ثم التبشير، وقد جرت عادةُ القرآن أن يُورِث كلَّ الخبر حكمَه بعده في الموضع نفسه.\u003c/p\u003e\u003cp class=\"ap\"\u003eقال الله تعالى: ﴿قَالَ يَا بُنَيَّ لَا تَقْصُصْ رُؤْيَاكَ عَلَى إِخْوَتِكَ فَيَكِيدُوا لَكَ كَيْدًا إِنَّ الشَّيْطَانَ لِلْإِنسَانِ عَدُوٌّ مُّبِينٌ﴾ (سورة يوسف: ٥)، ثم جاء الوعد بعدها مباشرة: ﴿وَكَذَلِكَ يَجْتَبِيكَ رَبُّكَ وَيُعَلِّمُكَ مِنْ تَأْوِيلِ الْأَحَادِيثِ وَيُتِمُّ نِعْمَتَهُ عَلَيْكَ وَعَلَى آلِ يَعْقُوبَ﴾ (سورة يوسف: ٦). فالممنوعُ هو القصة على الإخوة، والسبب المذكور كيدٌ لهم، والوعد انتخابٌ وعلمٌ ونِعمةٌ تامّة. وقد جُمِعت الأوصاف الثلاثة في آيةٍ واحدة، ولم يذكر القرآن في هذا الموضع عددًا من السنين ولا مكانًا من الأرض.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم اجتمعت الآيات على المشورة؛ قال الله تعالى: ﴿اقْتُلُوا يُوسُفَ أَوِ اطْرَحُوهُ أَرْضًا يَخْلُ لَكُمْ وَجْهُ أَبِيكُمْ وَتَكُونُوا مِن بَعْدِهِ قَوْمًا صَالِحِينَ﴾ (سورة يوسف: ٩)، وجاء في الراية منهم قائلٌ يعدل بين الطرح والقتل: ﴿لَا تَقْتُلُوا يُوسُفَ وَأَلْقُوهُ فِى غَيَابَةِ الْجُبِّ يَلْتَقِطْهُ بَعْضُ السَّيَّارَةِ﴾ (سورة يوسف: ١٠). ثم جاءوا إلى الأب بطلبٍ ظاهرٍ مُجمَّل: ﴿أَرْسِلْهُ مَعَنَا غَدًا يَرْتَعْ وَيَلْعَبْ وَإِنَّا لَهُ لَحَافِظُونَ﴾ (سورة يوسف: ١٢)، وقد نزلوا عنه طلبًا خاصًّا أُخْرِج صيغتُه في جملةٍ تالية: ﴿مَا لَكَ لَا تَأْمَنَّا عَلَى يُوسُفَ وَإِنَّا لَهُ لَنَّاصِحُونَ﴾ (سورة يوسف: ١١).\u003c/p\u003e\u003cp class=\"ap\"\u003eوعند العودة جاء الخبر: ﴿قَالُوا يَا أَبَانَا إِنَّا ذَهَبْنَا نَسْتَبِقُ وَتَرَكْنَا يُوسُفَ عِندَ مَتَاعِنَا فَأَكَلَهُ الذِّئْبُ وَمَا أَنتَ بِمُؤْمِنٍ لَّنَا وَلَوْ كُنَّا صَادِقِينَ﴾ (سورة يوسف: ١٧)، ففي الجملة الأخيرة استباقٌ لردّ الأب قبل أن يردّ. ثم جاء الحكم على القميص: ﴿وَجَاءُوا عَلَى قَمِيصِهِ بِدَمٍ كَذِبٍ﴾ (سورة يوسف: ١٨)، وجاء جواب يعقوب عليه السلام في نفس الآية: ﴿بَلْ سَوَّلَتْ لَكُمْ أَنفُسُكُمْ أَمْرًا فَصَبْرٌ جَمِيلٌ وَاللَّهُ الْمُسْتَعَانُ عَلَى مَا تَصِفُونَ﴾ (سورة يوسف: ١٨). فلم يَرِد في الآية أن قال: صدّقتُكم أو كذبتُكم، بل وصف الأمر ثم أتى بالصبر ثم بالاستعانة.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم جاء خبر البيع؛ قال الله تعالى: ﴿وَشَرَوْهُ بِثَمَنٍ بَخْسٍ دَرَاهِمَ مَعْدُودَةٍ وَكَانُوا فِيهِ مِن الزَّاهِدِينَ﴾ (سورة يوسف: ٢٠)، فالبيع موصوفٌ بالثمن وبالزهد في المبيع معًا. ثم جاء الخبر بالتمكين: ﴿وَكَذَلِكَ مَكَّنَّا لِيُوسُفَ فِى الْأَرْضِ وَلِنُعَلِّمَهُ مِنْ تَأْوِيلِ الْأَحَادِيثِ﴾ (سورة يوسف: ٢١). وقد سبق أن أُخبر يعقوب عليه السلام بذلك في قوله: ﴿يَجْتَبِيكَ رَبُّكَ وَيُعَلِّمُكَ مِنْ تَأْوِيلِ الْأَحَادِيثِ﴾ (سورة يوسف: ٦)، ففي الآيتين اقترانٌ واحد بين التمكين في الأرض وبين تعليم التأويل، وبينهما ما جرى في بيت العزيز الذي أورده القرآن حكمه.\u003c/p\u003e\u003cp class=\"ap\"\u003eقال الله تعالى: ﴿وَاسْتَبَقَا الْبَابَ وَقَدَّتْ قَمِيصَهُ مِن دُبُرٍ وَأَلْفَيَا سَيِّدَهَا لِدَا الْبَابِ﴾ (سورة يوسف: ٢٥)، ثم جاء ميزان الشهادة: ﴿إِن كَانَ قَمِيصُهُ قُدَّ مِن قُبُلٍ فَصَدَقَتْ وَهُوَ مِنَ الْكَاذِبِينَ﴾ (سورة يوسف: ٢٦). ثم تتابعت الآيات على القول المبطن في المدينة، وفيها: ﴿قَدْ شَغَفَهَا حُبًّا إِنَّا لَنَرَىٰهَا فِى ضَلَالٍ مُّبِينٍ﴾ (سورة يوسف: ٣٠). وجاء بعدها الحُكم في مجلس الملك: ﴿الْآنَ حَصْحَصَ الْحَقُّ أَنَا رَاوَدْتُهُ عَن نَّفْسِهِ وَإِنَّهُ لَمِنَ الصَّادِقِينَ﴾ (سورة يوسف: ٥١)، ثم الحكمة: ﴿ذَلِكَ لِيَعْلَمَ أَنِّي لَمْ أَخُنْهُ بِالْغَيْبِ وَأَنَّ اللَّهَ لَا يَهْدِي كَيْدَ الْخَائِنِينَ﴾ (سورة يوسف: ٥٢).\u003c/p\u003e\u003cp class=\"ap\"\u003eقال الله تعالى: ﴿وَدَخَلَ مَعَهُ السِّجْنَ فَتَيَانِ﴾ (سورة يوسف: ٣٦)، ففسّر لهما قبل أن يأتيهما طعامهما: ﴿لَا يَأْتِيكُمَا طَعَامٌ تُرْزَقَانِهِ إِلَّا نَبَّأْتُكُمَا بِتَأْوِيلِهِ قَبْلَ أَن يَأْتِيَكُمَا﴾ (سورة يوسف: ٣٧). ثم جاء في مواجهتهما نهيٌ عن عبادة ما دون الله: ﴿مَا تَعْبُدُونَ مِن دُونِهِ إِلَّا أَسْمَاءً سَمَّيْتُمُوهَا أَنتُمْ وَآبَاؤُكُمْ مَا أَنزَلَ اللَّهُ بِهَا مِن سُلْطَانٍ﴾ (سورة يوسف: ٤٠). ثم جاء الإذن ثم الطلب: ﴿اجْعَلْنِي عَلَى خَزَائِنِ الْأَرْضِ إِنِّي حَفِيظٌ عَلِيمٌ﴾ (سورة يوسف: ٥٥)، فكان الجواب: ﴿وَكَذَلِكَ مَكَّنَّا لِيُوسُفَ فِى الْأَرْضِ يَتَبَوَّأُ مِنْهَا حَيْثُ يَشَاءُ﴾ (سورة يوسف: ٥٦).\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالرؤيا وتحذير الأب\u003c/h4\u003e\u003cp class=\"ap\"\u003eالرؤية في الآية واحدة: أحد عشر كوكبًا والشمس والقمر ساجدين. قال الله تعالى: ﴿رَأَيْتُ أَحَدَ عَشَرَ كَوْكَبًا وَالشَّمْسَ وَالْقَمَرَ رَأَيْتُهُمْ لِي سَاجِدِينَ﴾ (سورة يوسف: ٤). ولم يذكر القرآن في هذا الموضع ما رآه أبوه ولا بماذا فسّره له، بل أورد الخبر ثم أردفه بالمنع من القصة على الإخوة، وهو ترتيبٌ ظاهر في الآيتين المتتاليتين.\u003c/p\u003e\u003cp class=\"ap\"\u003eقال الله تعالى: ﴿لَا تَقْصُصْ رُؤْيَاكَ عَلَى إِخْوَتِكَ فَيَكِيدُوا لَكَ كَيْدًا﴾ (سورة يوسف: ٥). والنهي مقيَّد بسببٍ مذكور، والسبب كيدٌ من الإخوة لا من الرؤيا بذاتها. ثم جاء الوعد: ﴿يَجْتَبِيكَ رَبُّكَ وَيُعَلِّمُكَ مِنْ تَأْوِيلِ الْأَحَادِيثِ﴾ (سورة يوسف: ٦). فجاء المنع والوعد في سياقٍ واحد، ولا ينفصل أحدهما عن الآخر في الآية الأولى.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي الوعد ذِكرُ آل يعقوب جميعًا: ﴿وَيُتِمُّ نِعْمَتَهُ عَلَيْكَ وَعَلَى آلِ يَعْقُوبَ كَمَا أَتَمَّهَا عَلَى أَبَوَيْكَ مِن قَبْلُ إِبْرَاهِيمَ وَإِسْحَاقَ﴾ (سورة يوسف: ٦). فالتسلسل في الآية: يعقوب ثم إسحاق ثم إبراهيم عليهم السلام، والنعمة متصلةٌ بين الأجيال لا منقطعة. وقد خُتمت الآية بوصفين لله: ﴿إِنَّ رَبَّكَ عَلِيمٌ حَكِيمٌ﴾، وهما ما يُبيِّنان وجوب الرضا بالحكم.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالمكيدة والخبر الكاذب\u003c/h4\u003e\u003cp class=\"ap\"\u003eقال الله تعالى: ﴿اقْتُلُوا يُوسُفَ أَوِ اطْرَحُوهُ أَرْضًا يَخْلُ لَكُمْ وَجْهُ أَبِيكُمْ﴾ (سورة يوسف: ٩). فالمشورة مبنيّةٌ على الحسد لا على جرائم، وقد عدل أحدهم إلى الطرح تعويضًا عن القتل، ثم جاء المكسب الموعود بها: ﴿ثُمَّ تَكُونُوا مِن بَعْدِهِ قَوْمًا صَالِحِينَ﴾ (سورة يوسف: ٩). ففي الآية رتّبٌ ظاهر: الفعل ثم العاقبة.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم جاء الطلب إلى الأب: ﴿أَرْسِلْهُ مَعَنَا غَدًا يَرْتَعْ وَيَلْعَبْ وَإِنَّا لَهُ لَحَافِظُونَ﴾ (سورة يوسف: ١٢)، والضمير في «معنا» جمعٌ يدلُّ على أنّ العدد كان أكثر من اثنين، ولم يذكر القرآن عددهم في الآية. وقد سبق ردُّ الأب عليهم: ﴿مَا لَكَ لَا تَأْمَنَّا عَلَى يُوسُفَ وَإِنَّا لَهُ لَنَّاصِحُونَ﴾ (سورة يوسف: ١١)، فكانت الحجّة حجّةَ أمانةٍ ادّعَوها أنفسهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوعند العودة جاء الخبر: ﴿أَكَلَهُ الذِّئْبُ وَمَا أَنتَ بِمُؤْمِنٍ لَّنَا وَلَوْ كُنَّا صَادِقِينَ﴾ (سورة يوسف: ١٧)، وفي الجملة الأخيرة استباقٌ لردّ الأب قبل أن يردّ. وجاء جوابه بوصفٍ للأمر ثم صبرٍ ثم استعانة: ﴿بَلْ سَوَّلَتْ لَكُمْ أَنفُسُكُمْ أَمْرًا فَصَبْرٌ جَمِيلٌ وَاللَّهُ الْمُسْتَعَانُ عَلَى مَا تَصِفُونَ﴾ (سورة يوسف: ١٨). وقد وصف القرآن حاله لاحقًا: ﴿وَابْيَضَّتْ عَيْنَاهُ مِنَ الْحُزْنِ فَهُوَ كَظِيمٌ﴾ (سورة يوسف: ٨٤).\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالسجن والتمكين\u003c/h4\u003e\u003cp class=\"ap\"\u003eقال الله تعالى: ﴿وَدَخَلَ مَعَهُ السِّجْنَ فَتَيَانِ﴾ (سورة يوسف: ٣٦)، وفسّر لهما رؤاهما قبل أن يأتيهما طعامهما: ﴿لَا يَأْتِيكُمَا طَعَامٌ تُرْزَقَانِهِ إِلَّا نَبَّأْتُكُمَا بِتَأْوِيلِهِ﴾ (سورة يوسف: ٣٧). والتعليل في الآية جملةٌ واحدة: ﴿ذَلِكُمَا مِمَّا عَلَّمَنِي رَبِّي﴾، وفيها ذكرٌ للعلم لا لشيءٍ آخر، وقد صرّح به موسى عليه السلام في موضعٍ آخر: ﴿ذَلِكُمَا مِمَّا عَلَّمَنِي رَبِّي إِنِّي تَرَكْتُ مِلَّةَ قَوْمٍ لَّا يُؤْمِنُونَ بِاللَّهِ﴾ (سورة يوسف: ٣٧).\u003c/p\u003e\u003cp class=\"ap\"\u003eثم جاء النهي عن عبادة الأسماء: ﴿مَا تَعْبُدُونَ مِن دُونِهِ إِلَّا أَسْمَاءً سَمَّيْتُمُوهَا أَنتُمْ وَآبَاؤُكُمْ مَا أَنزَلَ اللَّهُ بِهَا مِن سُلْطَانٍ﴾ (سورة يوسف: ٤٠)، ثم خُتم بالحكم لله وحده: ﴿إِنِّ الْحُكْمُ إِلَّا لِلَّهِ أَمَرَ أَلَّا تَعْبُدُوا إِلَّا إِيَّاهُ﴾ (سورة يوسف: ٤٠). فكانت الدعوة في السجن متمّمةً للتوحيد قبل أن تكون تفسيرًا للأحلام، وقد جاءت في آيتين متتاليتين لا تفصل بينهما.\u003c/p\u003e\u003cp class=\"ap\"\u003eقال الله تعالى: ﴿اجْعَلْنِي عَلَى خَزَائِنِ الْأَرْضِ إِنِّي حَفِيظٌ عَلِيمٌ﴾ (سورة يوسف: ٥٥). وفي الطلب وصفان نصَّ عليهما في الآية: الحفظ والعلم. ثم جاء جواب الملك بالقبول والتمكين: ﴿يَتَبَوَّأُ مِنْهَا حَيْثُ يَشَاءُ نُصِيبُ بِرَحْمَتِنَا مَن نَّشَاءُ وَلَا نُضِيعُ أَجْرَ الْمُحْسِنِينَ﴾ (سورة يوسف: ٥٦). فكانت الخاتمة هي التمكين، وهو ما سبق أن وُعد به في (سورة يوسف: ٦).\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالرؤيا\u003c/b\u003e\u003cspan\u003eقال الله تعالى: ﴿إِنِّي رَأَيْتُ أَحَدَ عَشَرَ كَوْكَبًا وَالشَّمْسَ وَالْقَمَرَ رَأَيْتُهُمْ لِي سَاجِدِينَ﴾ يوسف ٤.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eتحذير الأب\u003c/b\u003e\u003cspan\u003eقال الله تعالى: ﴿لَا تَقْصُصْ رُؤْيَاكَ عَلَى إِخْوَتِكَ فَيَكِيدُوا لَكَ كَيْدًا﴾ يوسف ٥.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالصبر الجميل\u003c/b\u003e\u003cspan\u003eقال الله تعالى: ﴿فَصَبْرٌ جَمِيلٌ وَاللَّهُ الْمُسْتَعَانُ عَلَى مَا تَصِفُونَ﴾ يوسف ١٨.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eخزائن الأرض\u003c/b\u003e\u003cspan\u003eقال الله تعالى: ﴿اجْعَلْنِي عَلَى خَزَائِنِ الْأَرْضِ إِنِّي حَفِيظٌ عَلِيمٌ﴾ يوسف ٥٥.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالنص الموجز\u003c/th\u003e\u003cth\u003eالسورة ورقم الآية\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالرؤيا\u003c/td\u003e\u003ctd\u003eإني رأيت أحد عشر كوكبًا والشمس والقمر ساجدين لي\u003c/td\u003e\u003ctd\u003eيوسف: ٤\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمشورة\u003c/td\u003e\u003ctd\u003eاقتلوا يوسف أو اطرحوه أرضًا يخل لكم وجه أبيكم\u003c/td\u003e\u003ctd\u003eيوسف: ٩\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالخبر\u003c/td\u003e\u003ctd\u003eأكله الذئب وما أنت بمؤمن لنا ولو كنا صادقين\u003c/td\u003e\u003ctd\u003eيوسف: ١٧\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالبيع\u003c/td\u003e\u003ctd\u003eوشروه بثمن بخس دراهم معدودة وكانوا فيه من الزاهدين\u003c/td\u003e\u003ctd\u003eيوسف: ٢٠\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالتمكين\u003c/td\u003e\u003ctd\u003eاجعلني على خزائن الأرض إني حفيظ عليم\u003c/td\u003e\u003ctd\u003eيوسف: ٥٥\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eقال الله تعالى: ﴿وَكَذَلِكَ مَكَّنَّا لِيُوسُفَ فِى الْأَرْضِ يَتَبَوَّأُ مِنْهَا حَيْثُ يَشَاءُ نُصِيبُ بِرَحْمَتِنَا مَن نَّشَاءُ وَلَا نُضِيعُ أَجْرَ الْمُحْسِنِينَ﴾\u003c/p\u003e\u003ccite\u003eالقرآن الكريم — سورة يوسف، الآية ٥٦\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eرأى يوسف عليه السلام أحد عشر كوكبًا والشمس والقمر ساجدين، فمنعه أبوه من القصة ثمّ كاده إخوته فبيعوه بثمن بخس، فصار إلى مصر حيث السجن ثم خزائن الأرض. وكلُّ ذلك جاء في السورة مرتّبًا: رؤيا ثم تحذير ثم مكيدة ثم بيع ثم قانونٌ في الشهادة ثم تمكين.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"pharaoh-musa","n":"موسى وفرعون","ic":"🪄","part":"يوسف وموسى في مصر","h":"\u003carticle class=\"ch3\" id=\"pharaoh-musa\" data-toc=\"موسى وفرعون\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eيوسف وموسى في مصر\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٢ من ٣\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٣\u003ci\u003e.\u003c/i\u003e٢\u003c/span\u003e\n            \u003ch3\u003e🪄 موسى وفرعون\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eم\u003c/span\u003eا الذي قاله موسى عليه السلام لفرعون وملئه، وكيف جاءت آياته المفصّلة، وما الذي بني عليه فرعون حجّته؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eقال الله تعالى: ﴿ثُمَّ بَعَثْنَا مِن بَعْدِهِم مُّوسَى بِآيَاتِنَا إِلَى فِرْعَوْنَ وَمَلَئِهِ فَظَلَمُوا بِهَا فَانظُرْ كَيْفَ كَانَ عَاقِبَةُ الْمُفْسِدِينَ﴾ (سورة الأعراف: ١٠٣). وقد وُصفوا بالظلم لا بالكذب وحده، وخُتمت الآية بطلب النظر إلى العاقبة لا إلى الجريمة. ثم جاء قول موسى عليه السلام: ﴿يَا فِرْعَوْنُ إِنِّي رَسُولٌ مِّن رَّبِّ الْعَالَمِينَ﴾ (سورة الأعراف: ١٠٤). فلم يبدأ بالاحتجاج على الظلم بل ببيان الرسالة، وهو الترتيب الذي ورد به الخبر في هذه الآيات.\u003c/p\u003e\u003cp class=\"ap\"\u003eقال الله تعالى: ﴿حَقِيقٌ عَلَىٰ أَن لَّا أَقُولَ عَلَى اللَّهِ إِلَّا الْحَقَّ قَدْ جِئْتُكُم بِبَيِّنَةٍ مِّن رَّبِّكُمْ فَأَرْسِلْ مَعِيَ بَنِي إِسْرَائِيلَ﴾ (سورة الأعراف: ١٠٥)، فهذه جملتان: التزامٌ بعدم القول على الله إلا الحق، ثم الطلب بعينه. وقد كرّر القرآن الخبر في موضعٍ آخر بلفظٍ آخر: ﴿وَلَقَدْ أَرْسَلْنَا مُوسَى بِآيَاتِنَا إِلَى فِرْعَوْنَ وَمَلَئِهِ فَقَالَ إِنِّي رَسُولُ رَبِّ الْعَالَمِينَ﴾ (سورة الزخرف: ٤٦). فالمضمون واحد مع اختلاف الصياغة، ولا يَرِد في الآيتين ما قاله فرعون في جوابه.\u003c/p\u003e\u003cp class=\"ap\"\u003eقال الله تعالى: ﴿وَنَادَىٰ فِرْعَوْنُ فِي قَوْمِهِ قَالَ يَا قَوْمِ أَلَيْسَ لِي مُلْكُ مِصْرَ وَهَذِهِ الْأَنْهَارُ تَجْرِي مِن تَحْتِي﴾ (سورة الزخرف: ٥١). فحجّته ملكٌ وأنهار تجري، وقد تقدّم خطابُه إلى ملئه: ﴿يَا أَيُّهَا الْمَلَأُ مَا عَلِمْتُ لَكُم مِّنْ إِلَهٍ غَيْرِي فَأَوْقِدْ لِي يَا هَامَانُ عَلَى الطِّينِ فَاجْعَل لِي صَرْحًا لَّعَلِّي أَطَّلِعُ إِلَىٰ إِلَهِ مُوسَىٰ وَإِنِّي لَأَظُنُّهُ مِنَ الْكَاذِبِينَ﴾ (سورة القصص: ٣٨). فبين الجملتين خطابان مختلفان: هذا إلى قومه بملكه، وذاك إلى ملئه بالصُّرَح.\u003c/p\u003e\u003cp class=\"ap\"\u003eقال الله تعالى: ﴿فَأَلْقَىٰ عَصَاهُ فَإِذَا هِيَ ثُعْبَانٌ مُّبِينٌ﴾ (سورة الأعراف: ١٠٧). ففي الآية صيغةُ الفعل ثم الفجأة بـ«فَإِذَا هِيَ»، ولم يذكر القرآن في هذا الموضع ما رآه فرعون من أثر العصا ولا كمّيةً من الناس شاهدوها. ثم جاء التكليف بالذهاب والقول: ﴿فَأْتِيَاهُ فَقُولَا إِنَّا رَسُولَا رَبِّكَ فَأَرْسِلْ مَعَنَا بَنِي إِسْرَائِيلَ وَلَا تُعَذِّبْهُمْ قَدْ جِئْنَاكَ بِآيَةٍ مِّن رَّبِّكَ﴾ (سورة طه: ٤٧). فطلبٌ مزدوج: الإرسال والكفّ عن العذاب، وقد تقدّم آيةٌ من عند الله قبل الطلب.\u003c/p\u003e\u003cp class=\"ap\"\u003eقال الله تعالى: ﴿فَلَمَّا أَلْقَوْا قَالَ مُوسَىٰ مَا جِئْتُم بِهِ السِّحْرُ إِنَّ اللَّهَ سَيُبْطِلُهُ إِنَّ اللَّهَ لَا يُصْلِحُ عَمَلَ الْمُفْسِدِينَ﴾ (سورة يونس: ٨١)، ثم جاء الوعد بالحق: ﴿وَيُحِقُّ اللَّهُ الْحَقَّ بِكَلِمَاتِهِ وَلَوْ كَرِهَ الْمُجْرِمُونَ﴾ (سورة يونس: ٨٢). ففي الآيتين حكمٌ على العمل ثم وعدٌ باللغوب للحق. وقد جاء ردُّ القوم على الآيات نفسها بوصفها: ﴿مَا هَذَا إِلَّا سِحْرٌ مُّفْتَرًى وَمَا سَمِعْنَا بِهَذَا فِي آبَائِنَا الْأَوَّلِينَ﴾ (سورة القصص: ٣٦)، فحجّتان: الابتداع وانقطاع الخبر عن الآباء.\u003c/p\u003e\u003cp class=\"ap\"\u003eقال الله تعالى: ﴿فَأَرْسَلْنَا عَلَيْهِمُ الطُّوفَانَ وَالْجَرَادَ وَالْقُمَّلَ وَالضَّفَادِعَ وَالدَّمَ آيَاتٍ مُّفَصَّلَاتٍ فَاسْتَكْبَرُوا وَكَانُوا قَوْمًا مُّجْرِمِينَ﴾ (سورة الأعراف: ١٣٣). فعُدِّت الآيات الخمس ثم أُتبعها بالاستكبار وبالإجرام في آيةٍ واحدة. ثم جاء تهديدُه بالقطع والصلب: ﴿لَأُقَطِّعَنَّ أَيْدِيكُمْ وَأَرْجُلَكُم مِّنْ خِلَافٍ ثُمَّ لَأُصَلِّبَنَّكُمْ أَجْمَعِينَ﴾ (سورة الأعراف: ١٢٤). فالمكرَّر في الآية صيغةُ التوكيد لا غيرها.\u003c/p\u003e\u003cp class=\"ap\"\u003eقال الله تعالى: ﴿سَأَصْرِفُ عَنْ آيَاتِيَ الَّذِينَ يَتَكَبَّرُونَ فِي الْأَرْضِ بِغَيْرِ الْحَقِّ وَإِن يَرَوْا كُلَّ آيَةٍ لَّا يُؤْمِنُوا بِهَا وَإِن يَرَوْا سَبِيلَ الرُّشْدِ لَا يَتَّخِذُوهُ سَبِيلًا وَإِن يَرَوْا سَبِيلَ الْغَيِّ يَتَّخِذُوهُ سَبِيلًا﴾ (سورة الأعراف: ١٤٦). فالأوصاف في الآية أربعة: التكبر، والجحود بكل آية، وإهمال سبيل الرشد، واتخاذ سبيل الغي. ثم جاء سببٌ آخر مُرتَّبٌ معها: ﴿وَالَّذِينَ كَذَّبُوا بِآيَاتِنَا وَلِقَاءِ الْآخِرَةِ حَبِطَتْ أَعْمَالُهُمْ هَل يُجْزَوْنَ إِلَّا مَا كَانُوا يَعْمَلُونَ﴾ (سورة الأعراف: ١٤٧). فجاء الوصف والحكم في آيتين متجاورتين، وقد أُفرد لكلٍّ منهما ما يخصّه، ولا يَرِد في الآيتين عدّةُ الآيات ولا طولُ المدة.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالدعوة وطلباتها\u003c/h4\u003e\u003cp class=\"ap\"\u003eقال الله تعالى: ﴿يَا فِرْعَوْنُ إِنِّي رَسُولٌ مِّن رَّبِّ الْعَالَمِينَ﴾ (سورة الأعراف: ١٠٤). فالتقدير في الآية: رسولٌ من رب العالمين، والمخاطَب فرعون وحده لا قومه. وقد تقدّم قبلها وصفُ مجيئه بالآيات، ووصفُ ما فعله بهم: ﴿فَظَلَمُوا بِهَا﴾ (سورة الأعراف: ١٠٣). فبيّن القرآن الجريمة قبل أن يبيّن المواجهة.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم جاء الطلب صريحًا: ﴿قَدْ جِئْتُكُم بِبَيِّنَةٍ مِّن رَّبِّكُمْ فَأَرْسِلْ مَعِيَ بَنِي إِسْرَائِيلَ﴾ (سورة الأعراف: ١٠٥). فالمطلوب إرسالُ بني إسرائيل معه، لا إعفاءٌ من شيءٍ آخر. وقد كُرِّر الطلب في سورة طه بالقول: ﴿فَأَرْسِلْ مَعَنَا بَنِي إِسْرَائِيلَ وَلَا تُعَذِّبْهُمْ﴾ (سورة طه: ٤٧)، ففي الثانية كفٌّ عن العذاب زيادةً على الإرسال.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي الآيتين تقدُّمُ الآية قبل الطلب: ﴿قَدْ جِئْتُكُم بِبَيِّنَةٍ مِّن رَّبِّكُمْ﴾ (سورة الأعراف: ١٠٥)، و﴿قَدْ جِئْنَاكَ بِآيَةٍ مِّن رَّبِّكَ﴾ (سورة طه: ٤٧). ففي الأولى خطابٌ إلى الملأ، وفي الثانية خطابٌ إلى فرعون نفسه، وقد افترقت الضمائر في الآيتين تبعًا للخطاب، وهذا فصلٌ ظاهر في لفظ القرآن.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالعصا والآيات المفصّلة\u003c/h4\u003e\u003cp class=\"ap\"\u003eقال الله تعالى: ﴿فَأَلْقَىٰ عَصَاهُ فَإِذَا هِيَ ثُعْبَانٌ مُّبِينٌ﴾ (سورة الأعراف: ١٠٧). ولم يذكر القرآن في هذا الموضع عدّةَ الآية ولا عدد من رآها، وقد أوردها في سياق ما أُلقي بين يدي موسى وفرعون. ثم جاءت جملةُ الحَكم على ما ألقاه السحرة: ﴿مَا جِئْتُم بِهِ السِّحْرُ إِنَّ اللَّهَ سَيُبْطِلُهُ﴾ (سورة يونس: ٨١). فالأمر حكمٌ على العمل ثم وعدٌ بإبطاله.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم جاءت الآيات الخمس معدودةً في آيةٍ واحدة: ﴿الطُّوفَانَ وَالْجَرَادَ وَالْقُمَّلَ وَالضَّفَادِعَ وَالدَّمَ آيَاتٍ مُّفَصَّلَاتٍ﴾ (سورة الأعراف: ١٣٣). فكلُّ واحدٍ منها مُذكورٌ باسمه، والوصف «مفصّلات» بمعنى مُبيَّنات في نزولها. وقد أُتبع العدد بالاستكبار في الآية نفسها: ﴿فَاسْتَكْبَرُوا وَكَانُوا قَوْمًا مُّجْرِمِينَ﴾.\u003c/p\u003e\u003cp class=\"ap\"\u003eوجاء ردُّ القوم على الآيات بحجّتين: ﴿مَا هَذَا إِلَّا سِحْرٌ مُّفْتَرًى﴾ و﴿مَا سَمِعْنَا بِهَذَا فِي آبَائِنَا الْأَوَّلِينَ﴾ (سورة القصص: ٣٦). فالأولى إنكارُ الأصل، والثانية إنكارُ النقل. وقد كُرِّرت الجملتان في آيةٍ واحدة لا تفصل بينهما، وليس في الآية عددُ الآباء الذين لم يسمعواهم.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eحجّة فرعون واستكباره\u003c/h4\u003e\u003cp class=\"ap\"\u003eقال الله تعالى: ﴿يَا قَوْمِ أَلَيْسَ لِي مُلْكُ مِصْرَ وَهَذِهِ الْأَنْهَارُ تَجْرِي مِن تَحْتِي﴾ (سورة الزخرف: ٥١). فحجّته في الآية: ملكٌ وأنهار، وكلاهما زائلٌ لا يُثبت إلهيةً. وقد سبق خطابُه إلى ملئه بأنه لا يعلم لهم إلهًا غيره، ثم أمرَ بالصُّرَح ليطّلع إلى إله موسى: ﴿وَإِنِّي لَأَظُنُّهُ مِنَ الْكَاذِبِينَ﴾ (سورة القصص: ٣٨).\u003c/p\u003e\u003cp class=\"ap\"\u003eثم جاء التهديد: ﴿لَأُقَطِّعَنَّ أَيْدِيكُمْ وَأَرْجُلَكُم مِّنْ خِلَافٍ ثُمَّ لَأُصَلِّبَنَّكُمْ أَجْمَعِينَ﴾ (سورة الأعراف: ١٢٤)، وقد ورد اللفظ نفسه في سورة الشعراء: ﴿وَلَأُصَلِّبَنَّكُمْ أَجْمَعِينَ﴾ (سورة الشعراء: ٤٩). فالتكرار في الآيتين واحد، والزيادة في الأعراف ذكرُ «من خلاف» والترديد بـ«ثم».\u003c/p\u003e\u003cp class=\"ap\"\u003eثم جاء وصفُ الذي يصرف الله عن آياته: ﴿يَتَكَبَّرُونَ فِي الْأَرْضِ بِغَيْرِ الْحَقِّ﴾ (سورة الأعراف: ١٤٦)، وأنهم وإن رأوا كلَّ آيةٍ لا يؤمنون بها، وأنهم يسلكون سبيل الغي إذا رأوه. وقد أعقب ذلك وصفُ الذين كذّبوا بالآيات وبِلقاء الآخرة بأن حبِطت أعمالهم: ﴿هَل يُجْزَوْنَ إِلَّا مَا كَانُوا يَعْمَلُونَ﴾ (سورة الأعراف: ١٤٧).\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالرسالة\u003c/b\u003e\u003cspan\u003eقال الله تعالى: ﴿يَا فِرْعَوْنُ إِنِّي رَسُولٌ مِّن رَّبِّ الْعَالَمِينَ﴾ الأعراف ١٠٤.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالعصا\u003c/b\u003e\u003cspan\u003eقال الله تعالى: ﴿فَأَلْقَىٰ عَصَاهُ فَإِذَا هِيَ ثُعْبَانٌ مُّبِينٌ﴾ الأعراف ١٠٧.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالآيات الخمس\u003c/b\u003e\u003cspan\u003eالطوفان والجراد والقمل والضفادع والدم، آيات مفصلات — الأعراف ١٣٣.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eحجّة الملك\u003c/b\u003e\u003cspan\u003eقال الله تعالى: ﴿أَلَيْسَ لِي مُلْكُ مِصْرَ وَهَذِهِ الْأَنْهَارُ تَجْرِي مِن تَحْتِي﴾ الزخرف ٥١.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالآية\u003c/th\u003e\u003cth\u003eما ورد فيها\u003c/th\u003e\u003cth\u003eالسورة ورقمها\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالرسالة\u003c/td\u003e\u003ctd\u003eيا فرعون إني رسول من رب العالمين\u003c/td\u003e\u003ctd\u003eالأعراف: ١٠٤\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالبيّنة\u003c/td\u003e\u003ctd\u003eقد جئتك ببيّنة من ربّك فأرسل معي بني إسرائيل\u003c/td\u003e\u003ctd\u003eالأعراف: ١٠٥\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالعصا\u003c/td\u003e\u003ctd\u003eفألقى عصاه فإذا هي ثعبان مبين\u003c/td\u003e\u003ctd\u003eالأعراف: ١٠٧\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالأعذاب\u003c/td\u003e\u003ctd\u003eالطوفان والجراد والقمل والضفادع والدم آيات مفصلات\u003c/td\u003e\u003ctd\u003eالأعراف: ١٣٣\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالتهدّد\u003c/td\u003e\u003ctd\u003eلأقطعن أيديكم وأرجلكم من خلاف ثم لأصلبنكم أجمعين\u003c/td\u003e\u003ctd\u003eالأعراف: ١٢٤\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eقال الله تعالى: ﴿إِنَّنِي أَنَا اللَّهُ لَا إِلَٰهَ إِلَّا أَنَا فَاعْبُدْنِي وَأَقِمِ الصَّلَاةَ لِذِكْرِي﴾\u003c/p\u003e\u003ccite\u003eالقرآن الكريم — سورة طه، الآية ١٤\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eبدأ موسى عليه السلام رسالتَه إلى فرعون وملئه ببيان الرسالة ثم بطلب إرسال بني إسرائيل معه، فجاءته الآياتُ المفصّلة: العصا ثم الطوفان والجراد والقمل والضفادع والدم. وكان جوابهم الاستكبارُ والتكذيب والتهديد بالقطع والصلب، فوصفت الآيات تكبرهم في الأرض بغير الحق وحبوط أعمالهم.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"exodus-wandering","n":"الخروج والتيه","ic":"🚶","part":"يوسف وموسى في مصر","h":"\u003carticle class=\"ch3\" id=\"exodus-wandering\" data-toc=\"الخروج والتيه\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eيوسف وموسى في مصر\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٣ من ٣\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٣\u003ci\u003e.\u003c/i\u003e٣\u003c/span\u003e\n            \u003ch3\u003e🚶 الخروج والتيه\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eك\u003c/span\u003eيف كان ليلُ الخروج من مصر، وكيف انفلق البحر ونجا بني إسرائيل، وما الذي جاء بعد الخروج من عجلٍ وتيهٍ ورفضٍ للأرض المقدسة؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eقال الله تعالى: ﴿وَلَقَدْ فَتَنَّا قَبْلَهُمْ قَوْمَ فِرْعَوْنَ وَجَاءَهُمْ رَسُولٌ كَرِيمٌ﴾ (سورة الدخان: ١٧)، ثم الإنذار: ﴿وَأَن لَّا تَعْلُوا عَلَى اللَّهِ إِنِّي آتِيكُم بِسُلْطَانٍ مُّبِينٍ﴾ (سورة الدخان: ١٩). ثم أمرُ الخروج: ﴿فَأْسِرْ بِعِبَادِي لَيْلًا إِنَّكُم مُّتَّبَعُونَ﴾ (سورة الدخان: ٢٣). وجاء في موضعٍ آخر أن الأمر بالإسراع قد ورد بلفظٍ آخر: ﴿وَأَوْحَيْنَا إِلَى مُوسَىٰ أَنْ أَسْرِ بِعِبَادِي إِنَّكُم مُّتَّبَعُونَ﴾ (سورة الشعراء: ٥٢). فالليل أمرٌ والإسراع أمرٌ، ولا يُذكر في الآيتين وقتٌ مُعيَّن بساعةٍ ولا عدّةُ من خرج.\u003c/p\u003e\u003cp class=\"ap\"\u003eقال الله تعالى: ﴿وَجَوَزْنَا بِبَنِي إِسْرَائِيلَ الْبَحْرَ فَأَتْبَعَهُمْ فِرْعَوْنُ وَجُنُودُهُ بَغْيًا وَعَدْوًا﴾ (سورة يونس: ٩٠). فالفعلُ في الآية نسبٌ إلى فرعون وجنوده، والوصف بَغْيٌ وعدوان. ثم جاء أمرُ الله لموسى: ﴿أَنِ اضْرِب بِّعَصَاكَ الْبَحْرَ فَانفَلَقَ فَكَانَ كُلُّ فِرْقٍ كَالطَّوْدِ الْعَظِيمِ﴾ (سورة الشعراء: ٦٣). والوصف في الآية جبلٌ عظيم، ولا يُذكر فيها عددُ الأفواج ولا عمقُ الماء. ثم جاء النجاة: ﴿وَأَنجَيْنَا مُوسَى وَمَن مَّعَهُ أَجْمَعِينَ﴾ (سورة الشعراء: ٦٥).\u003c/p\u003e\u003cp class=\"ap\"\u003eقال الله تعالى: ﴿حَتَّىٰ إِذَا أَدْرَكَهُ الْغَرَقُ قَالَ آمَنتُ أَنَّهُ لَا إِلَٰهَ إِلَّا الَّذِي آمَنَتْ بِهِ بَنُو إِسْرَائِيلَ وَأَنَا مِنَ الْمُسْلِمِينَ﴾ (سورة يونس: ٩٠). ثم جاء ردُّ الله: ﴿ءَآلْآنَ وَقَدْ عَصَيْتَ قَبْلُ وَكُنتَ مِنَ الْمُفْسِدِينَ﴾ (سورة يونس: ٩١). فالإيمان في الآية مقترنٌ بظرفٍ هو الغرق، والجواب مقترنٌ بذكر العصيان السابق. وقد خُتم القضاء بقوله: ﴿فَالْيَوْمَ نُنَجِّيكَ بِبَدَنِكَ لِتَكُونَ لِمَنْ خَلْفَكَ آيَةً﴾ (سورة يونس: ٩٢). فالأثر المذكور للبدن وحده.\u003c/p\u003e\u003cp class=\"ap\"\u003eقال الله تعالى: ﴿وَاتْرُكِ الْبَحْرَ رَهْوًا إِنَّهُمْ جُندٌ مُّغْرَقُونَ﴾ (سورة الدخان: ٢٤). فالأمر بترك البحر يقع بعد نجاة بني إسرائيل، والوصف للمتْبَعين جندٌ مغرقون. ثم وصف القرآن ما نُجّوا منه: ﴿وَلَقَدْ نَجَّيْنَا بَنِي إِسْرَائِيلَ مِنَ الْعَذَابِ الْمُهِينِ مِن فِرْعَوْنَ إِنَّهُ كَانَ عَالِيًا مِّنَ الْمُسْرِفِينَ﴾ (سورة الدخان: ٣٠ و٣١). وقد فُصِّل المضمون في موضعٍ آخر: ﴿يَسُومُونَكُمْ سُوءَ الْعَذَابِ يُذَبِّحُونَ أَبْنَاءَكُمْ وَيَسْتَحْيُونَ نِسَاءَكُمْ﴾ (سورة البقرة: ٤٩)، فجاء الوصف في البقرة بجملتين مُفصَّلتين.\u003c/p\u003e\u003cp class=\"ap\"\u003eقال الله تعالى: ﴿وَاتَّخَذَ قَوْمُ مُوسَىٰ مِن بَعْدِهِ مِنْ حُلِيِّهِمْ عِجْلًا جَسَدًا لَّهُ خُوَارٌ أَلَمْ يَرَوْا أَنَّهُ لَا يُكَلِّمُهُمْ وَلَا يَهْدِيهِمْ سَبِيلًا﴾ (سورة الأعراف: ١٤٨). ثم جاء جوابُ الله للمعتذرين: ﴿إِنَّ الَّذِينَ اتَّخَذُوا الْعِجْلَ سَيَنَالُهُمْ غَضَبٌ مِّن رَّبِّهِمْ وَذِلَّةٌ فِي الْحَيَاةِ الدُّنْيَا﴾ (سورة الأعراف: ١٥٢). وقد ذُكر اتخاذ العجل في موضعٍ آخر مع الترتيب نفسه: ﴿وَلَقَدْ جَاءَكُم مُّوسَىٰ بِالْبَيِّنَاتِ ثُمَّ اتَّخَذْتُمُ الْعِجْلَ مِن بَعْدِهِ وَأَنتُمْ ظَالِمُونَ﴾ (سورة البقرة: ٩٢).\u003c/p\u003e\u003cp class=\"ap\"\u003eقال الله تعالى: ﴿وَلَمَّا رَجَعَ مُوسَىٰ إِلَىٰ قَوْمِهِ غَضْبَانَ أَسِفًا قَالَ بِئْسَمَا خَلَفْتُمُونِي مِن بَعْدِي أَعْجِلْتُمْ أَمْرَ رَبِّكُمْ وَأَلْقَى الْأَلْوَاحَ وَأَخَذَ بِرَأْسِ أَخِيهِ يَجُرُّهُ إِلَيْهِ﴾ (سورة الأعراف: ١٥٠). ثم جاءت جملةُ هارون عليه السلام بأنهم قد استضعفوه وكادوا يقتلونه، ثم دعاء موسى: ﴿رَبِّ اغْفِرْ لِي وَلِأَخِي وَأَدْخِلْنَا فِي رَحْمَتِكَ وَأَنتَ أَرْحَمُ الرَّاحِمِينَ﴾ (سورة الأعراف: ١٥١). وجاء الندمُ من القوم: ﴿وَالَّذِينَ عَمِلُوا السَّيِّئَاتِ ثُمَّ تَابُوا مِن بَعْدِهَا وَآمَنُوا إِنَّ رَبَّكَ مِن بَعْدِهَا لَغَفُورٌ رَّحِيمٌ﴾ (سورة الأعراف: ١٥٣).\u003c/p\u003e\u003cp class=\"ap\"\u003eقال الله تعالى: ﴿يَا قَوْمِ ادْخُلُوا الْأَرْضَ الْمُقَدَّسَةَ الَّتِي كَتَبَ اللَّهُ لَكُمْ وَلَا تَرْتَدُّوا عَلَىٰ أَدْبَارِكُمْ فَتَنقَلِبُوا خَاسِرِينَ﴾ (سورة المائدة: ٢١). ثم جاء الجواب: ﴿يَا مُوسَىٰ إِنَّا لَن نَّدْخُلَهَا أَبَدًا مَّا دَامُوا فِيهَا فَاذْهَبْ أَنتَ وَرَبُّكَ فَقَاتِلَا إِنَّا هَاهُنَا قَاعِدُونَ﴾ (سورة المائدة: ٢٤). ثم ردُّ موسى عليه السلام: ﴿رَبِّ إِنِّي لَا أَمْلِكُ إِلَّا نَفْسِي وَأَخِي فَافْرُقْ بَيْنَنَا وَبَيْنَ الْقَوْمِ الْفَاسِقِينَ﴾ (سورة المائدة: ٢٥). فثلاث آيات متتالية: أمرٌ ثم اعتذارٌ ثم دعاء، ولا يُذكر في الآيات عددُ من رفض الدخول.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eليل الخروج وانفلاق البحر\u003c/h4\u003e\u003cp class=\"ap\"\u003eقال الله تعالى: ﴿فَأْسِرْ بِعِبَادِي لَيْلًا إِنَّكُم مُّتَّبَعُونَ﴾ (سورة الدخان: ٢٣). فالأمر يتكوّن من أمرين: الإسراع بالليل، ثم الخبر بأنهم متبَعون. وقد ورد في الشعراء لفظُ الإسراع دون ذكر الليل: ﴿أَنْ أَسْرِ بِعِبَادِي إِنَّكُم مُّتَّبَعُونَ﴾ (سورة الشعراء: ٥٢)، فجاءت الآيتان متكاملتين لا متناقضتين.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم جاء الخبر بالتبع: ﴿وَجَوَزْنَا بِبَنِي إِسْرَائِيلَ الْبَحْرَ فَأَتْبَعَهُمْ فِرْعَوْنُ وَجُنُودُهُ بَغْيًا وَعَدْوًا﴾ (سورة يونس: ٩٠). ففي الآية تقدُّمُ العبور ثم تبعُ فرعون له، والوصف بَغْيٌ وعدوان. وقد ذكر القرآن في موضعٍ آخر أن قوم فرعون كانوا قومًا حاذرين: ﴿وَإِنَّا لَجَمِيعٌ حَاذِرُونَ﴾ (سورة الشعراء: ٥٦)، فجاء الوصف من طرفين: بغيٌ وعدوانٌ وحذر.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم جاء أمرُ الضرب: ﴿أَنِ اضْرِب بِّعَصَاكَ الْبَحْرَ فَانفَلَقَ فَكَانَ كُلُّ فِرْقٍ كَالطَّوْدِ الْعَظِيمِ﴾ (سورة الشعراء: ٦٣). والوصف جبلٌ عظيم لكل فرقة، ولا يُذكر في الآية عددُ الفِرَق. ثم جاءت النجاة بجملةٍ جامعة: ﴿وَأَنجَيْنَا مُوسَى وَمَن مَّعَهُ أَجْمَعِينَ﴾ (سورة الشعراء: ٦٥). فالصفة «أجمعين» تفيد شمول من كان معه، ولم يُذكر في الآية عددهم.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالعجل ورجعة موسى\u003c/h4\u003e\u003cp class=\"ap\"\u003eقال الله تعالى: ﴿وَاتَّخَذَ قَوْمُ مُوسَىٰ مِن بَعْدِهِ مِنْ حُلِيِّهِمْ عِجْلًا جَسَدًا لَّهُ خُوَارٌ﴾ (سورة الأعراف: ١٤٨). والمعترض في الآية بلفظ الاستفهام: ﴿أَلَمْ يَرَوْا أَنَّهُ لَا يُكَلِّمُهُمْ وَلَا يَهْدِيهِمْ سَبِيلًا﴾. فالأوصاف ثلاثة: جسدٌ، وخوار، وكلامٌ لا يكون وهُدايةٌ لا تكون، وقد سُئِلوا بها أنفسهم في الآية نفسها.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم جاء الحكم على المعتذرين: ﴿إِنَّ الَّذِينَ اتَّخَذُوا الْعِجْلَ سَيَنَالُهُمْ غَضَبٌ مِّن رَّبِّهِمْ وَذِلَّةٌ فِي الْحَيَاةِ الدُّنْيَا وَكَذَلِكَ نَجْزِي الْمُفْتَرِينَ﴾ (سورة الأعراف: ١٥٢). فذكر العاقبة في الدنيا ثم أُضيفت الزيادةُ بـ«وكذلك نجزي المفترين». وقد تقدّم وصفُ الاتخاذ في البقرة بترتيبٍ آخر: ﴿جَاءَكُم مُّوسَىٰ بِالْبَيِّنَاتِ ثُمَّ اتَّخَذْتُمُ الْعِجْلَ مِن بَعْدِهِ﴾ (سورة البقرة: ٩٢).\u003c/p\u003e\u003cp class=\"ap\"\u003eقال الله تعالى: ﴿وَلَمَّا رَجَعَ مُوسَىٰ إِلَىٰ قَوْمِهِ غَضْبَانَ أَسِفًا﴾ (سورة الأعراف: ١٥٠). فحالاه في الآية: غضبٌ وأسى، وقد عُلِّق الغضب بالخلَف حين قال: ﴿بِئْسَمَا خَلَفْتُمُونِي مِن بَعْدِي أَعْجِلْتُمْ أَمْرَ رَبِّكُمْ﴾. ثم جاء ردُّ هارون عليه السلام في الآية التالية، ثم دعاء موسى: ﴿رَبِّ اغْفِرْ لِي وَلِأَخِي وَأَدْخِلْنَا فِي رَحْمَتِكَ﴾ (سورة الأعراف: ١٥١).\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالميقات والأرض المقدسة\u003c/h4\u003e\u003cp class=\"ap\"\u003eقال الله تعالى: ﴿وَاخْتَارَ مُوسَىٰ قَوْمَهُ سَبْعِينَ رَجُلًا لِّمِيقَاتِنَا فَلَمَّا أَخَذَتْهُمُ الرَّجْفَةُ قَالَ رَبِّ لَوْ شِئْتَ أَهْلَكْتَهُم مِّن قَبْلُ وَإِيَّايَ﴾ (سورة الأعراف: ١٥٥). ففي الآية عددُ الرجال، والميقات الذي اختيروا له، وحدثُ الرجفة، ثم جوابُ موسى اعتذارًا ودعاءً. وقد خُتم الدعاء بـ﴿أَنتَ خَيْرُ الْغَافِرِينَ﴾ في آخر الآية.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم جاء أمرُ الأرض المقدسة: ﴿ادْخُلُوا الْأَرْضَ الْمُقَدَّسَةَ الَّتِي كَتَبَ اللَّهُ لَكُمْ وَلَا تَرْتَدُّوا عَلَىٰ أَدْبَارِكُمْ فَتَنقَلِبُوا خَاسِرِينَ﴾ (سورة المائدة: ٢١). والشرط في الآية واحد: الدخول وعدم الردة، والعاقبة خسارةٌ لمن رتدّ. وقد ورد الأمر نفسه في الأعراف بلفظٍ قريب: ﴿اسْكُنُوا هَذِهِ الْقَرْيَةَ وَكُلُوا مِنْهَا حَيْثُ شِئْتُمْ وَقُولُوا حِطَّةٌ﴾ (سورة الأعراف: ١٦١).\u003c/p\u003e\u003cp class=\"ap\"\u003eثم جاء الجواب اعتذارًا: ﴿إِنَّا لَن نَّدْخُلَهَا أَبَدًا مَّا دَامُوا فِيهَا فَاذْهَبْ أَنتَ وَرَبُّكَ فَقَاتِلَا إِنَّا هَاهُنَا قَاعِدُونَ﴾ (سورة المائدة: ٢٤). فصيغةُ الرفض مطلقةٌ بـ«أبدًا» مقيَّدةً بشرط البقاء. ثم جاء ردُّ موسى: ﴿إِنِّي لَا أَمْلِكُ إِلَّا نَفْسِي وَأَخِي فَافْرُقْ بَيْنَنَا وَبَيْنَ الْقَوْمِ الْفَاسِقِينَ﴾ (سورة المائدة: ٢٥). فحصرُ القدرة في النفسين ثم دعاءُ الفِراق، وقد أُتي بها في آيةٍ واحدة.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eليل الخروج\u003c/b\u003e\u003cspan\u003eقال الله تعالى: ﴿فَأْسِرْ بِعِبَادِي لَيْلًا إِنَّكُم مُّتَّبَعُونَ﴾ الدخان ٢٣.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eانفلاق البحر\u003c/b\u003e\u003cspan\u003eقال الله تعالى: ﴿فَانفَلَقَ فَكَانَ كُلُّ فِرْقٍ كَالطَّوْدِ الْعَظِيمِ﴾ الشعراء ٦٣.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالعجل\u003c/b\u003e\u003cspan\u003eقال الله تعالى: ﴿عِجْلًا جَسَدًا لَّهُ خُوَارٌ﴾ الأعراف ١٤٨.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالأرض المقدسة\u003c/b\u003e\u003cspan\u003eقال الله تعالى: ﴿ادْخُلُوا الْأَرْضَ الْمُقَدَّسَةَ الَّتِي كَتَبَ اللَّهُ لَكُمْ﴾ المائدة ٢١.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالنص الموجز\u003c/th\u003e\u003cth\u003eالسورة ورقمها\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eليل الخروج\u003c/td\u003e\u003ctd\u003eفأسر بعبادي ليلًا إنكم متبَعون\u003c/td\u003e\u003ctd\u003eالدخان: ٢٣\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eانفلاق البحر\u003c/td\u003e\u003ctd\u003eاضرب بعصاك البحر فانفلق\u003c/td\u003e\u003ctd\u003eالشعراء: ٦٣\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالنجاة\u003c/td\u003e\u003ctd\u003eوأنجينا موسى ومن معه أجمعين\u003c/td\u003e\u003ctd\u003eالشعراء: ٦٥\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالعجل\u003c/td\u003e\u003ctd\u003eاتخذ قوم موسى من حلية عجلًا جسدا له خوار\u003c/td\u003e\u003ctd\u003eالأعراف: ١٤٨\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالأرض المقدسة\u003c/td\u003e\u003ctd\u003eيَا قومِ ادخلوا الأرض المقدسة التي كتب الله لكم\u003c/td\u003e\u003ctd\u003eالمائدة: ٢١\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eقال الله تعالى: ﴿فَالْيَوْمَ نُنَجِّيكَ بِبَدَنِكَ لِتَكُونَ لِمَنْ خَلْفَكَ آيَةً وَإِنَّ كَثِيرًا مِّنَ النَّاسِ عَنْ آيَاتِنَا لَغَافِلُونَ﴾\u003c/p\u003e\u003ccite\u003eالقرآن الكريم — سورة يونس، الآية ٩٢\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eخرج بنو إسرائيل ليلًا وتبَعهم فرعون وجنوده، فانفلق البحر بعصى موسى عليه السلام وأنجاه الله ومن معه، وغرق المتبعون ونُجّي فرعون ببدنه آيةً لمن خلفه. ثم اتخذ قومه العجلَ بعد رحيله، فرجعوا نادمين، ثم رُفض دخول الأرض المقدسة فأمسك الله أولئك قرنًا.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-4","n":"الأنبياء والملوك","ic":"","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-4\" style=\"--c:#8B4513\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e👑\u003c/div\u003e\n      \u003ch2\u003eالأنبياء والملوك\u003c/h2\u003e\n      \u003cp\u003eيشمل هذا الجزء قصصَ الأنبياء الذين اجتمعت مع النبوةِ المَلكُ وسخّر الله لهم من الخلق: داودُ وسليمان عليهما السلام، ثم قصتي أيوب ويونس عليهما السلام في الابتلاء والنجاة. وقد وردت هذه القصص في القرآن الكريم مواضعَ متناثرةً في سورٍ متعددة، نجمعها هنا ونعزوها إلى آياتها، ولا نزيد على نصّ الكتاب شيئًا.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#david-king\"\u003eداود والملك\u003c/a\u003e\u003ca href=\"#solomon-jinn-wind\"\u003eسليمان والجن والريح\u003c/a\u003e\u003ca href=\"#job-jonah-patience\"\u003eأيوب ويونس ودروس الصبر\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"david-king","n":"داود والملك","ic":"👑","part":"الأنبياء والملوك","h":"\u003carticle class=\"ch3\" id=\"david-king\" data-toc=\"داود والملك\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالأنبياء والملوك\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ١ من ٣\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٤\u003ci\u003e.\u003c/i\u003e١\u003c/span\u003e\n            \u003ch3\u003e👑 داود والملك\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eك\u003c/span\u003eيف جمع القرآن بين النبوةِ والمَلكِ في قصة داود عليه السلام، وما الذي ورد في حكمه ونعمةِه وحَذَره من اتباع الهوى؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eورد اسم داود عليه السلام في القرآن الكريم مواضعَ متعددة، جعل الله فيها النبوةَ والفضلَ والمَلكَ معًا. ففي سورة الأنعام ذُكر في سياق نعمةٍ على المحسنين، فقال تعالى: ﴿وَوَهَبْنَا لَهُ إِسْحَاقَ وَيَعْقُوبَ كُلًّا هَدَيْنَا وَنُوحًا هَدَيْنَا مِن قَبْلُ وَمِن ذُرِّيَّتِهِ دَاوُدَ وَسُلَيْمَانَ وَأَيُّوبَ وَيُوسُفَ وَمُوسَىٰ وَهَارُونَ وَكَذَٰلِكَ نَجْزِي الْمُحْسِنِينَ﴾ [سورة الأنعام: الآية ٨٤]. ثم جاء ذكره في ص وفي سبأ وفي الأنبياء، فلم تذكره السور قصةً مطولةً ولا تاريخًا مفصّلًا ولا مكانًا ولا سنةً، بل محطاتٍ معدودةٍ يذكرها الله فيها، فالقصة عندنا نصُّ آياتها لا تراجمُ سيرها.\u003c/p\u003e\u003cp class=\"ap\"\u003eمن أوضح هذه المحطات حكمُه مع سليمان عليه السلام في نزاعٍ بين قومٍ في زرعهم، فقال تعالى: ﴿وَدَاوُدَ وَسُلَيْمَانَ إِذْ يَحْكُمَانِ فِي الْحَرْثِ إِذْ نَفَشَتْ فِيهِ غَنَمُ الْقَوْمِ وَكُنَّا لِحُكْمِهِمْ شُهُودًا﴾ سورة الأنبياء: الآية ٧٨. فالموضوع المحسوس: غنمٌ رعت في زرع قوم، وقدرُ المسألة: نزاعٌ صغير يُقاس به صاحبَ المَلك. ثم قال: ﴿فَفَهَّمْنَاهَا سُلَيْمَانَ وَكُلًّا آتَيْنَا حُكْمًا وَعِلْمًا﴾ الآية ٧٩. فالفهم من الله والحكم من الله والعلم من الله، والشهادة على ذلك للأنبياء جميعًا. ولم يذكر الكتاب قرارَ الحكم ولا من صدَّقه ولا من كذّبه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سورة ص ذُكر أمرٌ آخر في حكمه: نزاعٌ وقع بين اثنين في نعجةٍ، فقال تعالى: ﴿قَالَ لَقَدْ ظَلَمَكَ بِسُؤَالِ نَعْجَتِكَ إِلَىٰ نِعَاجِهِ وَإِنَّ كَثِيرًا مِّنَ الْخُلَطَاءِ لَيَبْغِي بَعْضُهُمْ عَلَىٰ بَعْضٍ إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ وَقَلِيلٌ مَّا هُمْ﴾ سورة ص: الآية ٢٤. وقد جاء في الآية نهيٌ عن الظلم وتحذيرٌ من بغي الخلاطاء بعضهم على بعض، مع استثناء الذين آمنوا وعملوا الصالحات وقوله ﴿وَقَلِيلٌ مَّا هُمْ﴾، ثم خُتمت بفعله هو: ﴿وَظَنَّ دَاوُدُ أَنَّمَا فَتَنَّاهُ فَاسْتَغْفَرَ رَبَّهُ وَخَرَّ رَاكِعًا وَأَنَابَ﴾. وقد وردت القصة في كتاب الله وحده من غير زيادةٍ على نصها.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم خاطبه الله في سورة ص بما فيه، فقال تعالى: ﴿يَا دَاوُدُ إِنَّا جَعَلْنَاكَ خَلِيفَةً فِي الْأَرْضِ فَاحْكُمْ بَيْنَ النَّاسِ بِالْحَقِّ وَلَا تَتَّبِعِ الْهَوَىٰ فَيُضِلَّكَ عَن سَبِيلِ اللَّهِ إِنَّ الَّذِينَ يَضِلُّونَ عَن سَبِيلِ اللَّهِ لَهُمْ عَذَابٌ شَدِيدٌ بِمَا نَسُوا يَوْمَ الْحِسَابِ﴾ سورة ص: الآية ٢٦. وقد ذكرت الآية جعلَه خليفةً في الأرض، وأمرتُه بالحكم بين الناس بالحق، ونهته عن اتباع الهوى، وذَكَرَت الذين يضلون عن سبيل الله لهم عذابًا شديدًا بنسانهم يوم الحساب. ولم يزدد الكتاب على ذلك اسمًا لمَلكه ولا بلداً ولا مدةً.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سورة سبأ ذُكرت النعمةُ عليه، فقال تعالى: ﴿وَلَقَدْ آتَيْنَا دَاوُدَ مِنَّا فَضْلًا يَا جِبَالُ أَوِّبِي مَعَهُ وَالطَّيْرَ وَأَلَنَّا لَهُ الْحَدِيدَ﴾ الآية ١٠، ثم قال: ﴿أَنِ اعْمَلْ سَابِغَاتٍ وَقَدِّرْ فِي السَّرْدِ وَاعْمَلُوا صَالِحًا إِنِّي بِمَا تَعْمَلُونَ بَصِيرٌ﴾ الآية ١١. ففي الأولى نداءٌ للجبال والطير بالتسبيح معه، وفي الثانية أمرٌ بصنع السابغات وتقدير السرد، وختمٌ بالعمل الصالح وبالبصيرة به. وقد ذكر الكتاب الحديدَ والدروعَ من غير أن يذكر موضعًا ولا خصمًا ولا عامًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد قرنت الآية بين داود وسليمان عليهما السلام في العلم والحكم، فقال تعالى: ﴿فَفَهَّمْنَاهَا سُلَيْمَانَ وَكُلًّا آتَيْنَا حُكْمًا وَعِلْمًا وَسَخَّرْنَا مَعَ دَاوُدَ الْجِبَالَ يُسَبِّحْنَ وَالطَّيْرَ وَكُنَّا فَاعِلِينَ﴾ سورة الأنبياء: الآية ٧٩، وقد جاء تسخير الجبال والطير معه أيضًا في سورة سبأ. ثم جاء في سورة النمل أن ابنه ورثه، فقال تعالى: ﴿وَوَرِثَ سُلَيْمَانُ دَاوُدَ﴾ سورة النمل: الآية ١٦. فانتقل المَلك بينهما بوراثةٍ مذكورة في كتاب الله، من غير أن تُذكر في الموضع تفاصيلُ قصرٍ ولا جيشٍ ولا مَلِكٍ ولا سنةٍ.\u003c/p\u003e\u003cp class=\"ap\"\u003eتجمع هذه المحطات ثلاثَ وقائع: نداءَ الله له بالخِلافة وبالحكم بالحق، ونعمةَ الحديد والصنع والسُبح معه، ثم إنابتَه حين ظنّ أنما فُتِن. وقد جاء في كل محطةٍ ذكرُ الله قبل ذكر العبد، وذكرُ الرجاء بعد ذكر الابتلاء، فالمَلكُ جاء بالخِلافة والحكمُ جاء بالحق، والصناعةُ جاءت بالشكر، والتوبةُ جاءت بالاستغفار. ولا يُضاف إلى هذه المحطات شيءٌ مما لم يذكره كتاب الله، فإن إغفالَ ما لم يثبت عندنا أسلمٌ من الحثّ على ما يشكُّ فيه. وبذلك تعرض قصةُ داود عليه السلام بترتيب آياتها دون سواه: الموضع الذي تكلّم فيه القرآن قد تكلّم به، والذي سكت عنه سكت عنه، فيظهر في المصحف نبيًّا أوتي المَلك وأُمِر باتباع الحق لا الهوى ثم رجع إلى ربه يستغفره.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالخلافة والحكم بالحق\u003c/h4\u003e\u003cp class=\"ap\"\u003eافتتحت الآية بنداءٍ خاص ثم أعقبته بقوله: ﴿إِنَّا جَعَلْنَاكَ خَلِيفَةً فِي الْأَرْضِ﴾. وقد ورد لفظ الاستخلاف في القرآن قبل هذا حين أخبر الله ملائكته بخلق آدم عليه السلام، فصار النداء هنا راجعًا إلى أصلٍ متقدمٍ في كتابه. وبذلك جاء المَلك في الآية مُقدَّمًا عليه بمقدار ما يسبق من تفويضٍ من الله، لا بمقدار ما يبلغه صاحبُه من قوة.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم جاءت الجملة الآمرة: ﴿فَاحْكُمْ بَيْنَ النَّاسِ بِالْحَقِّ﴾، وهي العمل الأول الذي عُلِّق به المَلك. ولم تذكر الآية مَن يُحكَم بينهم ولا ما الذي يحكم به، فأضافت الحقَّ إلى ذاتها، وهو نصٌّ لا يحتاج إلى استدلال. وقد جاء في سورة ص قبل هذه الآية قصة حكمه بين اثنين في نعجة، فجمعت السورة بين المبدأ العام والتطبيق الخاص في موضع واحد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقبلت الجملة الناهية: ﴿وَلَا تَتَّبِعِ الْهَوَىٰ﴾ وعلّلتها بقوله: ﴿فَيُضِلَّكَ عَن سَبِيلِ اللَّهِ﴾، ثم أتبعها بقوله: ﴿إِنَّ الَّذِينَ يَضِلُّونَ عَن سَبِيلِ اللَّهِ لَهُمْ عَذَابٌ شَدِيدٌ بِمَا نَسُوا يَوْمَ الْحِسَابِ﴾. وقد وقع تعليل العذاب بالنسان في الآية نفسها، فجاء التذكير بالحساب في صلب الخطاب لا في حاشيته.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eقصة النعجتين: نصٌّ مضمون\u003c/h4\u003e\u003cp class=\"ap\"\u003eوردت القصة في سورة ص ضمن سياق حكمه بين اثنين، وذكرت النعجةَ التي سُئلت فجاء في الآية الثاني: ﴿وَإِنَّ كَثِيرًا مِّنَ الْخُلَطَاءِ لَيَبْغِي بَعْضُهُمْ عَلَىٰ بَعْضٍ إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ وَقَلِيلٌ مَّا هُمْ﴾. فخُصّ الإيثارُ بالذين آمنوا وعملوا الصالحات، وخُتم الوصف بقلةِ عددهم في الآية.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم جاءت الجملة التي تتعلق به هو: ﴿وَظَنَّ دَاوُدُ أَنَّمَا فَتَنَّاهُ﴾، فذكر الظنَّ ثم ذكر الجواب، وهو ثلاثة أفعال متتابعة: ﴿فَاسْتَغْفَرَ رَبَّهُ وَخَرَّ رَاكِعًا وَأَنَابَ﴾. ولم يذكر الكتاب جوابًا لمن معه، ولا قولًا في القضية، ولا عقابًا وقع عليه، ولا حكمًا صدر من أميره.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد جاءت القصة في موضع المَلك لا في موضع الهجرة، وقامت على أمرٍ صغير في المقدار: نعجةٌ واحدة بين اثنين. وهذا القدر من التفصيل هو كل ما أورده الله منها، وما زاد عليه من أخبارٍ وطُرُقٍ لا أصل له في كتابه. فلا يُقدَّم عليها إلا نصُّ الآية كما وُضعت، ولا يُسأل عن سبب الخصومة ولا عن قرار الحاكم فيها ما لم يذكره الكتاب. وقد وقع ذكرُها في سورة ص قبيل آية النداء بالخِلافة، فتلاحمت في المصحف حالتان: حالةُ المسألة الجزئية قبل حالةِ المَلك العام.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالنعمة والصنع والشكر\u003c/h4\u003e\u003cp class=\"ap\"\u003eقال الله في سورة سبأ: ﴿وَلَقَدْ آتَيْنَا دَاوُدَ مِنَّا فَضْلًا﴾، فبدأ بالنعمة ثم قال: ﴿يَا جِبَالُ أَوِّبِي مَعَهُ وَالطَّيْرَ وَأَلَنَّا لَهُ الْحَدِيدَ﴾. وقد ذُكرت الجبال والطير مخاطَبين بالتسبيح معه، وذُكر الحديد مُيسَّرًا له، والثلاثة في آية واحدة لا يفصل بينها.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم أتبعها بالآية التي فيها أمرُ العمل: ﴿أَنِ اعْمَلْ سَابِغَاتٍ وَقَدِّرْ فِي السَّرْدِ﴾، فجاءت السابغاتُ كاملةَ الورق، والسردُ مقدَّرَ الاتصال. ثم قال: ﴿وَاعْمَلُوا صَالِحًا إِنِّي بِمَا تَعْمَلُونَ بَصِيرٌ﴾، فخُتم أمرُ الصنعة بأمر العمل الصالح وبالبصيرة به، وهي خاتمةٌ تجعل الصنعةَ محسوبةً لا منتهيةً بذاتها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي الآية التي تليها قال: ﴿يَعْمَلُونَ لَهُ مَا يَشَاءُ مِن مَّحَارِيبَ وَتَمَاثِيلَ وَجِفَانٍ كَالْجَوَابِ وَقُدُورٍ رَّاسِيَاتٍ اعْمَلُوا آلَ دَاوُدَ شُكْرًا وَقَلِيلٌ مِّنْ عِبَادِيَ الشَّكُورُ﴾ سورة سبأ: الآية ١٣. فكلِّف آلَه بالشكر، وذَكَرَ قلة الشاكرين، ولم يذكر في الآيات موضعًا ولا سنةً ولا عدوًّا يُصنع له شيءٌ من ذلك.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمَلك خِلافة\u003c/b\u003e\u003cspan\u003eخاطبه الله بأنه جعله خليفةً في الأرض، وأمره أن يحكم بين الناس بالحق وأن لا يتبع الهوى.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالحكم في الحرث\u003c/b\u003e\u003cspan\u003eحكم مع سليمان عليه السلام في غنمٍ رعت زرعَ قوم، وكانا شاهدَين وكان الله عليهم شهيدًا.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالحديد والسباغ\u003c/b\u003e\u003cspan\u003eألين له الحديد وأُمِر بصنع السابغات وتقدير السرد، دون ذكر مكانٍ ولا زمنٍ ولا خصم.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالاستغفار والإنابة\u003c/b\u003e\u003cspan\u003eظنّ أنما فُتِن فاستغفر ربه وخركاعا وأناب، فخُتمت الآية بذلك لا بلومٍ ولا عقاب.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالموضع القرآني\u003c/th\u003e\u003cth\u003eالسياق\u003c/th\u003e\u003cth\u003eما ورد فيها\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eسورة الأنعام: الآية ٨٤\u003c/td\u003e\u003ctd\u003eذكر ذرّية نوح\u003c/td\u003e\u003ctd\u003eداؤد وسليمان وأيوب ويوسف وموسى وهارون\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eسورة الأنبياء: الآية ٧٨\u003c/td\u003e\u003ctd\u003eحكمه مع سليمان\u003c/td\u003e\u003ctd\u003eنزاع الغنم في الحرث والشهادة على الحكم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eسورة ص: الآية ٢٤\u003c/td\u003e\u003ctd\u003eبين رجلين تنازعوا\u003c/td\u003e\u003ctd\u003eنهيٌ عن الظلم ثم استغفاره وإبانته\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eسورة ص: الآية ٢٦\u003c/td\u003e\u003ctd\u003eخطابٌ بالنداء\u003c/td\u003e\u003ctd\u003eخليفةٌ في الأرض يحكم بالحق ولا يتبع الهوى\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eسورة سبأ: الآيتان ١٠ و١١\u003c/td\u003e\u003ctd\u003eنعمةُ الفضل\u003c/td\u003e\u003ctd\u003eالجبال والطير والحديد والسباغات\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eقال الله تعالى: ﴿يَا دَاوُدُ إِنَّا جَعَلْنَاكَ خَلِيفَةً فِي الْأَرْضِ فَاحْكُمْ بَيْنَ النَّاسِ بِالْحَقِّ وَلَا تَتَّبِعِ الْهَوَىٰ فَيُضِلَّكَ عَن سَبِيلِ اللَّهِ﴾\u003c/p\u003e\u003ccite\u003eالقرآن الكريم — سورة ص: الآية ٢٦\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eجاءت قصة داود عليه السلام في القرآن مواضعَ متعددةٍ تجمع النبوةَ والمَلكَ والنعمةَ والابتلاء، مرتّبةً على الفضل ثم الخطاب ثم الاستغفار. وأهمّ ما فيها إسنادُ المَلك إلى خِلافةٍ من الله، وربطُ الحكم بالحق بالاستغناء عن الهوى، وذِكر يوم الحساب في صلب الخطاب لا في حاشيته.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"solomon-jinn-wind","n":"سليمان والجن والريح","ic":"🌪️","part":"الأنبياء والملوك","h":"\u003carticle class=\"ch3\" id=\"solomon-jinn-wind\" data-toc=\"سليمان والجن والريح\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالأنبياء والملوك\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٢ من ٣\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٤\u003ci\u003e.\u003c/i\u003e٢\u003c/span\u003e\n            \u003ch3\u003e🌪️ سليمان والجن والريح\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eم\u003c/span\u003eا الذي ورد في القرآن عن مَلك سليمان عليه السلام من ريحٍ وجنٍّ وطيرٍ ونملة، وما الذي حُذِّر منه المؤمنون في هذه القصة؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eافتتحت سورة النمل ذكرَ سليمان عليه السلام بوراثته ملكَ أبيه، فقال تعالى: ﴿وَوَرِثَ سُلَيْمَانُ دَاوُدَ وَقَالَ يَا أَيُّهَا النَّاسُ عُلِّمْنَا مَنْطِقَ الطَّيْرِ وَأُوتِينَا مِن كُلِّ شَيْءٍ إِنَّ هَٰذَا لَهُوَ الْفَضْلُ الْمُبِينُ﴾ سورة النمل: الآية ١٦. فجمعت الآية الوراثةَ والنبوةَ والفضلَ، ثم أتبعها بقوله: ﴿وَحُشِرَ لِسُلَيْمَانَ جُنُودُهُ مِنَ الْجِنِّ وَالْإِنسِ وَالطَّيْرِ فَهُمْ يُوزَعُونَ﴾ الآية ١٧. وقد ذكر السورة جنوده قبل أن تذكر رسالته إلى قومه، ولم تذكر عددها ولا مكان جمعها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سورة سبأ ذُكرت النعمةُ الكبيرة، فقال تعالى: ﴿وَلِسُلَيْمَانَ الرِّيحَ غُدُوُّهَا شَهْرٌ وَرَوَاحُهَا شَهْرٌ وَأَسَلْنَا لَهُ عَيْنَ الْقِطْرِ وَمِنَ الْجِنِّ مَنْ يَعْمَلُ بَيْنَ يَدَيْهِ بِإِذْنِ رَبِّهِ وَمَنْ يَزِغْ مِنْهُمْ عَنْ أَمْرِنَا نُذِقْهُ مِنْ عَذَابِ السَّعِيرِ﴾ الآية ١٢. فجاءت الريحُ بقدرتها ومعيار زمانها، وجاء عينُ القطرِ مُسلَّحةً له، وجاء الجنُّ يعملون بين يديه بإذن ربّهم لا بأمره وحده، ثم جاءت النافذةُ التي يخرج منها من يزغ عن أمر الله.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سورة النمل وصف القرآن سيرَه بجنوده، فقال تعالى: ﴿حَتَّىٰ إِذَا أَتَوْا عَلَىٰ وَادِ النَّمْلِ قَالَتْ نَمْلَةٌ يَا أَيُّهَا النَّمْلُ ادْخُلُوا مَسَاكِنَكُمْ لَا يَحْطِمَنَّكُمْ سُلَيْمَانُ وَجُنُودُهُ وَهُمْ لَا يَشْعُرُونَ﴾ الآية ١٨. ثم قال: ﴿فَتَبَسَّمَ ضَاحِكًا مِّن قَوْلِهَا وَقَالَ رَبِّ أَوْزِعْنِي أَنْ أَشْكُرَ نِعْمَتَكَ الَّتِي أَنْعَمْتَ عَلَيَّ وَعَلَىٰ وَالِدَيَّ وَأَنْ أَعْمَلَ صَالِحًا تَرْضَاهُ وَأَدْخِلْنِي بِرَحْمَتِكَ فِي عِبَادِكَ الصَّالِحِينَ﴾ الآية ١٩. فجاء نداءُ أصغر الخلق، وجاء رده دعاءً لا عقابًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد تفقّد الطيرَ فقال: ﴿مَا لِيَ لَا أَرَى الْهُدْهُدَ أَمْ كَانَ مِنَ الْغَائِبِينَ﴾ الآية ٢٠، فجاءه بعد غيبةٍ فقال: ﴿أَحَطْتُ بِمَا لَمْ تُحِطْ بِهِ وَجِئْتُكَ مِن سَبَإٍ بِنَبَإٍ يَقِينٍ﴾ الآية ٢٢. ثم وصف القوم فقال: ﴿وَجَدْتُهَا وَقَوْمَهَا يَسْجُدُونَ لِلشَّمْسِ مِن دُونِ اللَّهِ وَزَيَّنَ لَهُمُ الشَّيْطَانُ أَعْمَالَهُمْ فَصَدَّهُمْ عَنِ السَّبِيلِ فَهُمْ لَا يَهْتَدُونَ﴾ الآية ٢٤. فبدأت الرسالةُ بالسجود لله، وانتهت بالصبْرِ على الطاعة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد جاء في النمل أن العرش جاء إلى موضعه قبل أن يرتدّ طرفه، فقال تعالى: ﴿قَالَ الَّذِي عِندَهُ عِلْمٌ مِّنَ الْكِتَابِ أَنَا آتِيكَ بِهِ قَبْلَ أَن يَرْتَدَّ إِلَيْكَ طَرْفُكَ فَلَمَّا رَآهُ مُسْتَقِرًّا عِندَهُ قَالَ هَٰذَا مِن فَضْلِ رَبِّي لِيَبْلُوَنِي أَأَشْكُرُ أَمْ أَكْفُرُ وَمَن شَكَرَ فَإِنَّمَا يَشْكُرُ لِنَفْسِهِ وَمَن كَفَرَ فَإِنَّ رَبِّي غَنِيٌّ كَرِيمٌ﴾ الآية ٤٠. فلم يزدد فخرًا بعد رؤية العرش، بل رجع الأمر إلى فضل ربه وبلائه، وربط الشكرَ بالنفس.\u003c/p\u003e\u003cp class=\"ap\"\u003eوحذّر القرآن المؤمنين مما يُنسب إليه، فقال تعالى: ﴿وَاتَّبَعُوا مَا تَتْلُوا الشَّيَاطِينُ عَلَىٰ مُلْكِ سُلَيْمَانَ وَمَا كَفَرَ سُلَيْمَانُ وَلَٰكِنَّ الشَّيَاطِينَ كَفَرُوا يُعَلِّمُونَ النَّاسَ السِّحْرَ﴾ سورة البقرة: الآية ١٠٢. فقد نُزِّه في الآية وعُزِّي بنفي الكفر عنه، وسُبِّب الكفرُ إلى الشياطين الذين كانوا يعلمون الناس السحر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سبأ ذُكرت وفاته فقال تعالى: ﴿فَلَمَّا قَضَيْنَا عَلَيْهِ الْمَوْتَ مَا دَلَّهُمْ عَلَىٰ مَوْتِهِ إِلَّا دَابَّةُ الْأَرْضِ تَأْكُلُ مَنْسَأَتَهُ فَلَمَّا خَرَّ تَبَيَّنَتِ الْجِنُّ أَن لَّوْ كَانُوا يَعْلَمُونَ الْغَيْبَ مَا لَبِثُوا فِي الْعَذَابِ الْمُهِينِ﴾ سورة سبأ: الآية ١٤. فدلَّهم على موته ما يأكلُ من عصاه، وعُلِّق علم الجن بالغيب في الآية على الظاهرة التي أدركوها. وتختصر هذه الآيات ملكَ سليمان في خمسة أشياء: وراثةُ المَلك ونبوتُه، وسخرية الريح والعين والناسخين، وجنودٌ من الجن والإنس والطير، ثم وعظٌ يأتي من الطير والنملة، ثم التحذير من نسبة السحر إليه. وقد أبرز القرآن في كل مرحلةٍ أن النعمة من الله وأن الفضل من الله وأن الجن يسخَّرون بإذن ربه، ولم تذكر السور تفصيلاً لبنيانه ولا عدَد جنوده، فالمقصود منها التعليم لا الاستقصاء.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eجنودٌ من الجن والإنس والطير\u003c/h4\u003e\u003cp class=\"ap\"\u003eقال تعالى في النمل: ﴿وَحُشِرَ لِسُلَيْمَانَ جُنُودُهُ مِنَ الْجِنِّ وَالْإِنسِ وَالطَّيْرِ فَهُمْ يُوزَعُونَ﴾. وفي اللفظ جمعٌ بين ثلاثة أصناف، ثم وصفٌ بالسَّيْر الموزَّع، أي أن السير كان مقسومًا على منازلهم. ولم يذكر الكتاب عددهم ولا عدَد بيوتهم ولا مقدار زمان سيرهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد وصفت سبأ ما يقع منه الجن فقالت: ﴿وَمِنَ الْجِنِّ مَنْ يَعْمَلُ بَيْنَ يَدَيْهِ بِإِذْنِ رَبِّهِ وَمَنْ يَزِغْ مِنْهُمْ عَنْ أَمْرِنَا نُذِقْهُ مِنْ عَذَابِ السَّعِيرِ﴾. فصار العملُ بين يديه مشروطًا بإذن ربّه، وصار الزايغُ منهم مذائقًا لعذاب السعير، وهي حدودٌ لا تتجاوزها القصة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي الآية التي تليه قال: ﴿يَعْمَلُونَ لَهُ مَا يَشَاءُ مِن مَّحَارِيبَ وَتَمَاثِيلَ وَجِفَانٍ كَالْجَوَابِ وَقُدُورٍ رَّاسِيَاتٍ اعْمَلُوا آلَ دَاوُدَ شُكْرًا وَقَلِيلٌ مِّنْ عِبَادِيَ الشَّكُورُ﴾، فجاء عملُ الجنِّ مقرونًا بما يُعمل له، وجاء الأمرُ بالشكر بعد جملةِ الفعل، وخُتم الموضعُ بقلة الشاكرين من عباد الله. وقد توالى في الآيتين أمران مذكوران: أن يعملوا ما يُراد لهم، وأن يشكروا، وكان الذِّكرُ بالشكر ومَن هم عليه آخر ما ورد في الموضع، ولم يذكر الكتاب بعد ذلك موضعًا لبنيانه ولا سعةً ولا عدَدَ من يعمله.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالريح والعين وشكر آل داود\u003c/h4\u003e\u003cp class=\"ap\"\u003eقال الله في سبأ: ﴿وَلِسُلَيْمَانَ الرِّيحَ غُدُوُّهَا شَهْرٌ وَرَوَاحُهَا شَهْرٌ﴾، فجعل لمسيرها صباحًا ومساءً مقدارًا هو الشهر، وهذا وصفٌ لزمن السير لا لمكانه. ثم قال: ﴿وَأَسَلْنَا لَهُ عَيْنَ الْقِطْرِ﴾، فسُخِّرت له عينُ المطر، وقد وقع الجمعُ بين الريح والقطر في الآية الواحدة، وذكر السيرَ ثم الماءَ على التوالي في نصٍّ واحد لا يفصل بينهما.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم ذكرت الآية ما يُعمل له: ﴿يَعْمَلُونَ لَهُ مَا يَشَاءُ مِن مَّحَارِيبَ وَتَمَاثِيلَ وَجِفَانٍ كَالْجَوَابِ وَقُدُورٍ رَّاسِيَاتٍ﴾، فسُمِّيت المحاريبُ والتماثيلُ والجِفانُ التي كالجواب والقدورُ الراسيات في جملةٍ واحدة. وقد جاء في الآية ما يُصنع له، ومَن يصنعه، والطريقةُ التي عُدِّ بها، ثم جاء بعد العدّ أمرُ الله لآلِه بالشكر، فلم يقتصر الموضعُ على وصف الصنعة وحدها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي الآية نفسها خُتم قولُ الله: ﴿وَقَلِيلٌ مِّنْ عِبَادِيَ الشَّكُورُ﴾. فلم يَقِف سياقُ الآية عند صنعة المحاريب وقدرها، بل انتهى إلى ذكر الشكر وقلةِ من هم عليه. وقد نُسِب قلةُ الشاكرين إلى عباد الله جميعًا لا إلى آل داود وحدهم، فجاءت خاتمةُ الموضع عامةً لا خاصةً. ولم يذكر الكتاب في الموضع موضعًا لبنيانه ولا سعةً ولا زينةً ولا مَن رآها من الناس، ولا سنةً لحدوثه ولا جيشًا يُصان عنه.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالعرش وإسلام بلقيس\u003c/h4\u003e\u003cp class=\"ap\"\u003eبدأ الخبرُ عن العرش بقول الهدهد: ﴿إِنِّي وَجَدْتُ امْرَأَةً تَمْلِكُهُمْ وَأُوتِيَتْ مِن كُلِّ شَيْءٍ وَلَهَا عَرْشٌ عَظِيمٌ﴾. ثم أتبعه بما يذمّهم: ﴿أَلَّا يَسْجُدُوا لِلَّهِ الَّذِي يُخْرِجُ الْخَبْءَ فِي السَّمَاوَاتِ وَالْأَرْضِ وَيَعْلَمُ مَا تُخْفُونَ وَمَا تُعْلِنُونَ﴾. فبدأ الوعظُ بالسجود لله قبل الذم في غيره.\u003c/p\u003e\u003cp class=\"ap\"\u003eوجاء الرسولُ بعد رؤية العرش فقال: ﴿هَٰذَا مِن فَضْلِ رَبِّي لِيَبْلُوَنِي أَأَشْكُرُ أَمْ أَكْفُرُ﴾، فلم يقل ما قيل له ولَم يقارِنْ بغيره. ثم قال: ﴿وَمَن شَكَرَ فَإِنَّمَا يَشْكُرُ لِنَفْسِهِ﴾، فردَّ الشكرَ إلى صاحبه، ثم ختم بقوله: ﴿وَمَن كَفَرَ فَإِنَّ رَبِّي غَنِيٌّ كَرِيمٌ﴾.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم ذُكر دخولها الصرحَ فقال: ﴿قِيلَ لَهَا ادْخُلِي الصَّرْحَ فَلَمَّا رَأَتْهُ حَسِبَتْهُ لُجَّةً وَكَشَفَتْ عَن سَاقَيْهَا قَالَ إِنَّهُ صَرْحٌ مُّمَرَّدٌ مِّن قَوَارِيرَ﴾، ثم جاء جوابُها: ﴿قَالَتْ رَبِّ إِنِّي ظَلَمْتُ نَفْسِي وَأَسْلَمْتُ مَعَ سُلَيْمَانَ لِلَّهِ رَبِّ الْعَالَمِينَ﴾ سورة النمل: الآية ٤٤. فكانت النتيجةُ إقرارٌ بالذنب وتسليمٌ لله، ولم تذكر الآية ردًّا لمن معها.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eوراثة المَلك\u003c/b\u003e\u003cspan\u003eورث سليمان داود، وقال لقومه: عُلِّمْنَا منطق الطير وأُوتينا من كل شيء.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالريح والناسخون\u003c/b\u003e\u003cspan\u003eغدوها شهر ورواحها شهر، وأُسِلِت له عين القطر، ومن الجن من يعمل بين يديه بإذن ربه.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالجنود والأوامر\u003c/b\u003e\u003cspan\u003eجندٌ من الجن والإنس والطير يوزعون، ومن يزغ منهم عن أمر الله يذوق عذاب السعير.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eنفي الكفر عنه\u003c/b\u003e\u003cspan\u003eقال الله: وما كفر سليمان ولكن الشياطين كفروا يعلمون الناس السحر.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالموضع القرآني\u003c/th\u003e\u003cth\u003eالسياق\u003c/th\u003e\u003cth\u003eما ورد فيها\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eسورة النمل: الآيتان ١٦ و١٧\u003c/td\u003e\u003ctd\u003eافتتاح القصة\u003c/td\u003e\u003ctd\u003eالوراثة ومنطق الطير وجندٌ من الجن والإنس والطير\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eسورة سبأ: الآية ١٢\u003c/td\u003e\u003ctd\u003eنعمةُ الريح\u003c/td\u003e\u003ctd\u003eغدوها شهر ورواحها شهر وعين القطر\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eسورة النمل: الآية ١٨\u003c/td\u003e\u003ctd\u003eالسير إلى الوادي\u003c/td\u003e\u003ctd\u003eنداء النملة لقومها أن يدخلوا مساكنهم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eسورة النمل: الآية ٤٠\u003c/td\u003e\u003ctd\u003eنقل العرش\u003c/td\u003e\u003ctd\u003eمن عنده علمٌ من الكتاب قبل أن يرتدّ طرفه\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eسورة البقرة: الآية ١٠٢\u003c/td\u003e\u003ctd\u003eالتحذير\u003c/td\u003e\u003ctd\u003eوما كفر سليمان ولكن الشياطين كفروا\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eقال الله تعالى: ﴿وَاتَّبَعُوا مَا تَتْلُوا الشَّيَاطِينُ عَلَىٰ مُلْكِ سُلَيْمَانَ وَمَا كَفَرَ سُلَيْمَانُ وَلَٰكِنَّ الشَّيَاطِينَ كَفَرُوا يُعَلِّمُونَ النَّاسَ السِّحْرَ﴾\u003c/p\u003e\u003ccite\u003eالقرآن الكريم — سورة البقرة: الآية ١٠٢\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eتعرض آيات القرآن ملكَ سليمان عليه السلام نعمةً موصوفةً بالريح والعين والناسخين ومن الجن والإنس والطير، ثم تعظُّمًا للذكر يبدأ من النملة وينتهي بالعرش. وتنتهي القصة بنفي الكفر عنه عن صريح نصّ القرآن، وبنهاية المَلك بالوفاة وظهور الغيب.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"job-jonah-patience","n":"أيوب ويونس ودروس الصبر","ic":"🌱","part":"الأنبياء والملوك","h":"\u003carticle class=\"ch3\" id=\"job-jonah-patience\" data-toc=\"أيوب ويونس ودروس الصبر\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالأنبياء والملوك\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٣ من ٣\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٤\u003ci\u003e.\u003c/i\u003e٣\u003c/span\u003e\n            \u003ch3\u003e🌱 أيوب ويونس ودروس الصبر\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eم\u003c/span\u003eا الذي ورد في القرآن عن دعاء أيوب ويونس عليهما السلام، وكيف انتهت كلتا القصتين؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eورد ذكر أيوب عليه السلام في القرآن الكريم في مواضع أربعة لا نزيد عليها. ففي الأنعام ذُكر في سياق الذرّية التي هداها الله، فقال تعالى: ﴿وَوَهَبْنَا لَهُ إِسْحَاقَ وَيَعْقُوبَ كُلًّا هَدَيْنَا وَنُوحًا هَدَيْنَا مِن قَبْلُ وَمِن ذُرِّيَّتِهِ دَاوُدَ وَسُلَيْمَانَ وَأَيُّوبَ وَيُوسُفَ وَمُوسَىٰ وَهَارُونَ﴾ سورة الأنعام: الآية ٨٤، وفي النساء ذُكر مع من أوحي إليهم، فقال تعالى: ﴿وَأَوْحَيْنَا إِلَىٰ إِبْرَاهِيمَ وَإِسْمَاعِيلَ وَإِسْحَاقَ وَيَعْقُوبَ وَالْأَسْبَاطِ وَعِيسَى وَأَيُّوبَ وَيُونُسَ وَهَارُونَ وَسُلَيْمَانَ﴾ سورة النساء: الآية ١٦٣.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي الأنبياء ذُكر دعاؤه، فقال تعالى: ﴿وَأَيُّوبَ إِذْ نَادَىٰ رَبَّهُ أَنِّي مَسَّنِيَ الضَّرُّ وَأَنتَ أَرْحَمُ الرَّاحِمِينَ فَاسْتَجَبْنَا لَهُ فَكَشَفْنَا مَا بِهِ مِن ضَرٍّ وَآتَيْنَاهُ أَهْلَهُ وَمِثْلَهُم مَّعَهُمْ رَحْمَةً مِّنْ عِندِنَا وَذِكْرَىٰ لِلْعَبِدِينَ﴾ سورة الأنبياء: الآيتان ٨٣ و٨٤. وقد بُني الدعاء على أمرين مذكورين: أن الضرَّ قد مسَّه، وأن الله أرحم الراحمين. ثم جاء الردُّ في الآية التالية كشفَ الضر وإعادةُ الأهل ومثلهم معهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي ص ذُكر عذابُه بأن الله ذكره فقال: ﴿وَاذْكُرْ عَبْدَنَا أَيُّوبَ إِذْ نَادَىٰ رَبَّهُ أَنِّي مَسَّنِيَ الشَّيْطَانُ بِنُصْبٍ وَعَذَابٍ ارْكُضْ بِرِجْلِكَ هَٰذَا مُغْتَسَلٌ بَارِدٌ وَشَرَابٌ وَوَهَبْنَا لَهُ أَهْلَهُ وَمِثْلَهُم مَّعَهُمْ رَحْمَةً مِّنَّا وَذِكْرَىٰ لِأُولِي الْأَلْبَابِ﴾ سورة ص: الآيات ٤١ إلى ٤٣. فجمع النصُّ بين نصبه وعذابه، وبين أمرِ الله له بالضرب برجله مغتسلًا باردًا وشرابًا، وبين إعطاء الأهل ومثلهم معهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم خُتمت الآية بقوله: ﴿رَحْمَةً مِّنَّا وَذِكْرَىٰ لِأُولِي الْأَلْبَابِ﴾، فجعل ما وقع له رحمةً يُذكر بها. ولم تذكر السور تفصيلاً لمرضه ولا مدةً ولا موضعًا ولا قومًا، وليس في كتاب الله من ذلك شيء. ويبقى أنه أُصيب فدعا ربه، فاستجاب له، فعُوفي وأُعيد إليه أهله. وقد ذُكر في الأنعام في سياق الذرّية التي هداها الله، وفي النساء في سياق من أوحي إليهم، وفي الأنبياء وص في سياق النداء والابتلاء، فلا تجمع هذه المواضع حكايةٌ واحدة متمامية، بل محطاتٌ يذكرها كلٌّ منها في موضعه ومقصوده.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما يونس عليه السلام فقد ذكره الله بصفتين: أنه من المرسلين، وأنه ذا النون. ففي الصافات قال: ﴿وَإِنَّ يُونُسَ لَمِنَ الْمُرْسَلِينَ إِذْ أَبَقَ إِلَى الْفُلْكِ الْمَشْحُونِ فَسَاهَمَ فَكَانَ مِنَ الْمُدْحَضِينَ فَالْتَقَمَهُ الْحُوتُ وَهُوَ مُلِيمٌ فَلَوْلَا أَنَّهُ كَانَ مِنَ الْمُسَبِّحِينَ لَلَبِثَ فِي بَطْنِهِ إِلَىٰ يَوْمِ يُبْعَثُونَ﴾ سورة الصافات: الآيات ١٣٩ إلى ١٤٤.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي الأنبياء ذُكر دعاؤه وهو في الظلمات، فقال تعالى: ﴿وَذَا النُّونِ إِذ ذَّهَبَ مُغَاضِبًا فَظَنَّ أَن لَّن نَّقْدِرَ عَلَيْهِ فَنَادَىٰ فِي الظُّلُمَاتِ أَن لَّا إِلَٰهَ إِلَّا أَنتَ سُبْحَانَكَ إِنِّي كُنتُ مِنَ الظَّالِمِينَ فَاسْتَجَبْنَا لَهُ وَنَجَّيْنَاهُ مِنَ الْغَمِّ وَكَذَٰلِكَ نُنجِي الْمُؤْمِنِينَ﴾ سورة الأنبياء: الآيتان ٨٧ و٨٨. وقد بُني الدعاء على تنزيه الله واحتسابه نفسه من الظالمين، وجاءت النتيجة نجاةً منه ومن الغم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي الصافات ذُكرت نهایته: ﴿فَنَبَذْنَاهُ بِالْعَرَاءِ وَهُوَ سَقِيمٌ وَأَنْبَتْنَا عَلَيْهِ شَجَرَةً مِّن يَقْطِينٍ وَأَرْسَلْنَاهُ إِلَىٰ مِائَةِ أَلْفٍ أَوْ يَزِيدُونَ فَآمَنُوا فَمَتَّعْنَاهُمْ إِلَىٰ حِينٍ﴾ سورة الصافات: الآيات ١٤٥ إلى ١٤٨. فجاء إلقاؤه على العراء وهو سقيم، ثم شجرةُ اليقطين، ثم بعثُه إلى قومٍ آمنوا فمُتِّعوا إلى حين. وتجمع القصتان نداءَ ربه في لحظةٍ ماضيةٍ واستجابةً من فضله.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eنداء أيوب: النص ثم الجواب\u003c/h4\u003e\u003cp class=\"ap\"\u003eقال الله عنده: ﴿أَنِّي مَسَّنِيَ الضَّرُّ وَأَنتَ أَرْحَمُ الرَّاحِمِينَ﴾. فلم يذكر في دعائه اسم مرضٍ ولا مدةً ولا سببًا، وبنى إجابته على صفةٍ من صفات الله: الرحمة. وقد جاء في سورة ص النداءُ نفسه بصيغةٍ أخرى، فقال: ﴿إِنِّي مَسَّنِيَ الشَّيْطَانُ بِنُصْبٍ وَعَذَابٍ﴾، فجمع بين النصب والعذاب من دون تحديد.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم جاء ردُّ الله في الأنبياء بقوله: ﴿فَاسْتَجَبْنَا لَهُ فَكَشَفْنَا مَا بِهِ مِن ضَرٍّ وَآتَيْنَاهُ أَهْلَهُ وَمِثْلَهُم مَّعَهُمْ﴾. فالاستجابة في الآية سبقت العطاء، والكشف سبق إعادة الأهل. ولم يذكر الكتاب ما الذي مَنَحَهُ بعد ذلك ولا كيف عاش ولا كم بقي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي ص جاء أمرُ الله له: ﴿ارْكُضْ بِرِجْلِكَ هَٰذَا مُغْتَسَلٌ بَارِدٌ وَشَرَابٌ﴾، وهي الأداة التي أُمِر بها لا هي التي وصفت من ذا قبل. ثم جاء العطاء: ﴿وَوَهَبْنَا لَهُ أَهْلَهُ وَمِثْلَهُم مَّعَهُمْ رَحْمَةً مِّنَّا﴾، فصار ما وقع له رحمةً وذكرى في نفس الآية.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eنداء يونس في الظلمات\u003c/h4\u003e\u003cp class=\"ap\"\u003eصفَّه الله بقوله: ﴿ذَا النُّونِ﴾، وبيّن حاله بقوله: ﴿إِذ ذَّهَبَ مُغَاضِبًا فَظَنَّ أَن لَّن نَّقْدِرَ عَلَيْهِ﴾، فذُكر الغضبُ ثم الظنُّ ثم مكانُ النداء. وقد ذكرت الآية أنه نادى في الظلمات، ولم تذكر مكانًا ولا زمانًا ولا قومًا ذُكرهم، ولم يذكر الكتاب وجهَ غضبه ولا سببَه ولا مَن رافقه في الغضب. فانتهت مقدِّمةُ القصة عند موضع النداء، وهو الموضع الذي بُنِي عليه ردُّ الله له في الآية التالية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوصُغ الدعاء في ثلاثة أركان: ﴿أَن لَّا إِلَٰهَ إِلَّا أَنتَ﴾ إقرارٌ بالتوحيد، ﴿سُبْحَانَكَ﴾ تنزيهٌ لله، ﴿إِنِّي كُنتُ مِنَ الظَّالِمِينَ﴾ احتسابُ نفسِه. ولم يذكر في الدعاء طلبَ نجاةٍ ولا استعجالًا ولا سببًا لطلبِه، بل جاء جوابُ الله بعده من غير سؤالٍ ظاهر. وقد جاء في الآية الجملةُ الجماعية ﴿فَاسْتَجَبْنَا لَهُ﴾، فأُسنِدت الاستجابة إلى الله لا إلى الدعاء وحده ولا إلى حاله.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم قال: ﴿فَاسْتَجَبْنَا لَهُ وَنَجَّيْنَاهُ مِنَ الْغَمِّ﴾، وجعل النتيجةَ عامةً في الآية التالية بقوله: ﴿وَكَذَٰلِكَ نُنجِي الْمُؤْمِنِينَ﴾. فانتقل الوصفُ من القصة إلى قاعدةٍ عامة في الآية نفسها، من غير زيادةٍ في تفصيل المكان ولا في زمن النجاة ولا في مَن نجا معه، وهذا آخر ما ورد في القصة في سورة الأنبياء.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالنجاة والمقام في القصة\u003c/h4\u003e\u003cp class=\"ap\"\u003eجاء في الصافات أن السببَ في بقائه في البطن ﴿أَنَّهُ كَانَ مِنَ الْمُسَبِّحِينَ﴾، وأنه لولا ذلك لَلبث إلى يوم البعث. ثم قال: ﴿فَنَبَذْنَاهُ بِالْعَرَاءِ وَهُوَ سَقِيمٌ﴾، فبيّن عُهده بعد الالقاه بالسقم، ثم ﴿وَأَنْبَتْنَا عَلَيْهِ شَجَرَةً مِّن يَقْطِينٍ﴾.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم جاءت بعثُه: ﴿وَأَرْسَلْنَاهُ إِلَىٰ مِائَةِ أَلْفٍ أَوْ يَزِيدُونَ﴾، أي أنه بُعِثَ إلى قومٍ وُصفَ عددهم ونهايةُهم ﴿فَآمَنُوا فَمَتَّعْنَاهُمْ إِلَىٰ حِينٍ﴾. ولم تذكر الآيات موضعًا ولا عامًا ولا تاريخًا لبعثته. وقد جاءت الآيات الثلاث على التوالي: إلقاؤه على العراء وهو سقيم، ثم شجرةُ اليقطين، ثم البعثةُ والقبول، فكانت النهايةُ في النص امتاعًا إلى حين بعد إيمانٍ لا بعد عذاب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد وقع في القصتين نداءٌ باللسان ثم استجابةٌ بفضله: أيوب عليه السلام نادى ربه فكشف عنه ضره، ويونس عليه السلام نادى في الظلمات فنجي من الغم. وقد اتفق في القصتين أن الاستجابة جاءت بعد النداء لا قبله، وأن الفعلَ في كلتيهما منسوبٌ إلى الله وحده، وأن الضرَّ والغمَّ وُصفا بلا تفصيلٍ لزمنهما ولا لمكانهما. ويُذكر أن كلتاهما وردت في القرآن على قدرٍ واحد من الاختصار لا يزيد على ما ورد فيه.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأيوب ونداؤه\u003c/b\u003e\u003cspan\u003eنادى ربه: إني مسني الضر وأنت أرحم الراحمين، فاستجاب له فكشف ما به من ضر.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمغتسل والشراب\u003c/b\u003e\u003cspan\u003eأمره الله أن يضرب برجله مغتسلًا باردًا وشرابًا، ثم وهب له أهله ومثلهم معهم.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eيونس والظلمات\u003c/b\u003e\u003cspan\u003eنادى: لا إله إلا أنت سبحانك إني كنت من الظالمين، فنجي من الغم.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمئة ألف أو يزيدون\u003c/b\u003e\u003cspan\u003eأُرسل يونس إلى مئة ألف أو يزيدون فآمنوا فمتعناهم إلى حين.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالنبي عليه السلام\u003c/th\u003e\u003cth\u003eالدعاء كما ورد\u003c/th\u003e\u003cth\u003eما جاء في الآية بعده\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eأيوب عليه السلام\u003c/td\u003e\u003ctd\u003eأنني مسني الضر وأنت أرحم الراحمين\u003c/td\u003e\u003ctd\u003eالاستجابة وكشف الضر وإعادة الأهل\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eأيوب عليه السلام\u003c/td\u003e\u003ctd\u003eأنني مسني الشيطان بنصب وعذاب\u003c/td\u003e\u003ctd\u003eارضض برجلك مغتسلٌ باردٌ وشراب\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eأيوب عليه السلام\u003c/td\u003e\u003ctd\u003eلم يذكر دعاءً ثالثًا في كتاب الله\u003c/td\u003e\u003ctd\u003eوهبنا له أهله ومثلهم رحمةً منا\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eيونس عليه السلام\u003c/td\u003e\u003ctd\u003eلا إله إلا أنت سبحانك إني كنت من الظالمين\u003c/td\u003e\u003ctd\u003eالاستجابة والنجاة من الغم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eيونس عليه السلام\u003c/td\u003e\u003ctd\u003eلم يذكر في الآية سؤال نجاة\u003c/td\u003e\u003ctd\u003eنبذناه بالعراء وهو سقيم ثم آمن قومه\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eقال الله تعالى: ﴿فَاسْتَجَبْنَا لَهُ وَنَجَّيْنَاهُ مِنَ الْغَمِّ وَكَذَٰلِكَ نُنجِي الْمُؤْمِنِينَ﴾\u003c/p\u003e\u003ccite\u003eالقرآن الكريم — سورة الأنبياء: الآية ٨٨\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eجاءت قصتا أيوب ويونس عليهما السلام على نداءٍ ربهما في لحظة ضيقٍ ثم استجابةٍ من فضله، دون أن تذكر السور مكانًا ولا مدةً ولا تفصيلًا. وأنهى القرآن كلتاهما بما يجعل النجاة منسوبةً إلى الله، وبيّن أن ما أصاب أيوب صار رحمةً وذكرى.\u003c/div\u003e\n      \u003c/article\u003
