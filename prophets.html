<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="description" content="تعرض هذه الصفحة محطات مختارة من قصص الأنبياء كما وردت في القرآن الكريم، من آدم إلى النبي محمد ﷺ. وهي محطات موجزة لا قصص كاملة، والمقصود منها بيان المع">
<title>محطات من قصص الأنبياء | موسوعة تاريخ الإسلام</title>
<link rel="preload" href="assets/fonts/amiri-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/amiri-700.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* ===== موسوعة تاريخ الإسلام — التنسيق المشترك ===== */

/* الخطوط محليّة (Subset عربي): لا شبكة، ولا اختلاف في القياس بين تشغيل وتشغيل */
@font-face{font-family:'Amiri';font-style:normal;font-weight:400;font-display:block;
  src:url(assets/fonts/amiri-400.woff2) format('woff2')}
@font-face{font-family:'Amiri';font-style:normal;font-weight:700;font-display:block;
  src:url(assets/fonts/amiri-700.woff2) format('woff2')}
@font-face{font-family:'Cairo';font-style:normal;font-weight:200 1000;font-display:block;
  src:url(assets/fonts/cairo-var.woff2) format('woff2')}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --gold:#B8942F;--gold2:#8B6914;--cream:#FBF4E4;--paper:#FFFDF8;
  --ink:#2E2A24;--muted:#7C7364;--line:#E7DCC3;
  --green:#1E6B3A;--blue:#155E9C;
  --shadow:0 4px 18px rgba(80,60,20,.08);
  --c:#B8942F;
}
body{font-family:'Cairo',sans-serif;background:var(--cream);color:var(--ink);
  min-height:100vh;line-height:1.9;transition:.3s}

body.dark{--paper:#201E1A;--cream:#161512;--ink:#E8E1D2;--muted:#A79E8B;
  --line:#3A362C;--shadow:0 4px 18px rgba(0,0,0,.35)}

main{max-width:820px;margin:0 auto;padding:1.2rem 1.1rem 5rem}

/* ---------- الترويسة ---------- */
header.top{position:sticky;top:0;z-index:60;display:flex;align-items:center;
  justify-content:space-between;gap:.6rem;padding:.55rem 1rem;
  background:var(--paper);border-bottom:2px solid var(--gold)}
.brand{font-family:'Amiri',serif;font-weight:700;font-size:1.02rem;color:var(--ink);
  text-decoration:none;display:flex;align-items:center;gap:.4rem}
.tools{display:flex;align-items:center;gap:.5rem}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
  background:transparent;color:var(--ink);font-size:1.05rem;cursor:pointer;
  display:grid;place-items:center;transition:.2s}
.ib:hover{background:var(--gold);color:#fff;border-color:var(--gold)}
.ib:active{transform:scale(.9)}

/* ---------- قبة التقدم ---------- */
.dome{width:38px;height:44px;position:relative;cursor:default}
.dome svg{width:100%;height:100%;display:block}
.dome .fill{fill:var(--gold);opacity:.85;transition:.4s}

/* ---------- شارات ---------- */
.badge{display:inline-flex;align-items:center;gap:.3rem;font-size:.72rem;
  background:var(--gold);color:#fff;border-radius:50px;padding:.15rem .6rem;
  font-weight:700}

/* ---------- المسار ---------- */
.crumbs{font-size:.82rem;color:var(--muted);margin-bottom:.8rem;
  display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.crumbs a{color:var(--muted);text-decoration:none}
.crumbs a:hover{color:var(--gold2)}

/* ---------- الترويسة البطلة ---------- */
.hero{position:relative;background:var(--paper);border:1px solid var(--line);
  border-top:6px solid var(--c);border-radius:20px;padding:1.6rem 1.3rem 1.4rem;
  text-align:center;box-shadow:var(--shadow);margin-bottom:1.4rem;overflow:hidden}
.hero .ic{font-size:2.6rem;line-height:1}
.hero h1{font-family:'Amiri',serif;font-size:1.9rem;color:var(--c);margin:.3rem 0 .1rem}
.hero .period{color:var(--gold2);font-size:.85rem;font-weight:600;margin-bottom:.6rem}
.hero .intro{color:var(--muted);font-size:.96rem;line-height:2;max-width:620px;margin:0 auto}

/* ---------- زخرفة SVG ---------- */
.orn{display:block;margin:1.2rem auto;opacity:.55}
.orn line,.orn path,.orn circle{stroke:var(--gold);stroke-width:1.1;fill:none}

/* ---------- العناوين ---------- */
h2.sec{font-family:'Amiri',serif;font-size:1.35rem;color:var(--c);
  margin:2rem 0 .9rem;display:flex;align-items:center;gap:.6rem}
h2.sec:before{content:"";width:6px;height:22px;background:var(--gold);
  border-radius:3px;flex:0 0 auto}
h2.sec .n{margin-right:auto;font-family:'Cairo';font-size:.75rem;color:var(--muted);font-weight:400}

/* ---------- الخط الزمني ---------- */
.tlwrap{position:relative;margin-bottom:.4rem}
.tl{display:flex;gap:.6rem;overflow-x:auto;padding:.6rem .2rem 1rem;
  scroll-snap-type:x mandatory;scrollbar-width:thin}
.tl::-webkit-scrollbar{height:5px}
.tl::-webkit-scrollbar-thumb{background:var(--gold);border-radius:9px}
.tli{flex:0 0 150px;scroll-snap-align:center;background:var(--paper);
  border:1px solid var(--line);border-right:4px solid var(--c);
  border-radius:14px;padding:.6rem .7rem;cursor:pointer;text-align:right;
  transition:.22s;font-family:'Cairo'}
.tli:hover,.tli.on{transform:translateY(-3px);box-shadow:var(--shadow);border-right-color:var(--gold)}
.tli b{display:block;color:var(--c);font-size:.9rem}
.tli span{display:block;color:var(--muted);font-size:.76rem;line-height:1.6}
.tlnav{display:flex;justify-content:space-between;margin-top:-.5rem}

/* ---------- الأحداث ---------- */
.ev{background:var(--paper);border:1px solid var(--line);border-radius:16px;
  padding:1rem 1.1rem;margin-bottom:.9rem;box-shadow:var(--shadow);
  opacity:0;transform:translateY(14px);transition:.45s}
.ev.in{opacity:1;transform:none}
.ev-head{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;margin-bottom:.5rem}
.ev-y{background:var(--c);color:#fff;font-size:.74rem;font-weight:700;
  padding:.15rem .55rem;border-radius:6px;white-space:nowrap}
.ev h3{font-family:'Amiri',serif;font-size:1.18rem;color:var(--ink)}
.ev p{font-family:'Amiri',serif;font-size:1.08rem;line-height:2.05;text-align:justify}
.ev .res{margin-top:.7rem;padding:.55rem .8rem;border-right:4px solid var(--gold);
  background:linear-gradient(135deg,rgba(184,148,47,.10),rgba(184,148,47,.04));
  border-radius:10px;font-size:.9rem;color:var(--gold2);font-weight:600}
.ev .res:before{content:"◀ النتيجة  "}

/* ---------- الشخصيات ---------- */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.6rem}
.pc{background:var(--paper);border:1px solid var(--line);border-radius:14px;
  padding:.65rem .8rem;border-top:3px solid var(--c)}
.pc b{display:block;color:var(--ink);font-size:.95rem}
.pc span{display:block;color:var(--muted);font-size:.78rem;line-height:1.65}

/* ---------- النتائج ---------- */
.outs{list-style:none}
.outs li{position:relative;padding:.5rem 1.5rem .5rem 0;border-bottom:1px dashed var(--line);
  font-size:.95rem}
.outs li:before{content:"◆";position:absolute;right:0;color:var(--gold);font-size:.8rem}

/* ---------- المصادر ---------- */
.src{background:var(--paper);border:1px solid var(--line);border-radius:16px;
  padding:.9rem 1.1rem;margin-top:2.2rem}
.src li{font-size:.86rem;color:var(--muted);padding:.25rem 1.2rem .25rem 0;
  position:relative;line-height:1.8}
.src li:before{content:"❋";position:absolute;right:0;color:var(--gold)}
.src li cite{font-style:normal;color:var(--ink);font-weight:600}

/* ---------- التنقل بين الصفحات ---------- */
.pager{display:flex;gap:.6rem;margin-top:1.6rem}
.pager a{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:14px;
  padding:.7rem .9rem;text-decoration:none;color:var(--ink);transition:.22s}
.pager a:hover{border-color:var(--gold);box-shadow:var(--shadow)}
.pager a small{display:block;color:var(--muted);font-size:.7rem}
.pager a b{font-size:.92rem;color:var(--c)}
.pager a.next{text-align:left}
.pager a.empty{visibility:hidden}

/* ---------- الانتقال بين الصفحات ---------- */
main{animation:pageIn .4s ease}
@keyframes pageIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}

/* ---------- فهرس الصفحة الرئيسية ---------- */
.eg{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:.8rem}
.ec{position:relative;background:var(--paper);border:1px solid var(--line);
  border-top:5px solid var(--c);border-radius:18px;padding:1rem .8rem .9rem;
  text-align:center;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);
  transition:.25s;overflow:hidden}
.ec:hover{transform:translateY(-4px);box-shadow:0 10px 26px rgba(80,60,20,.16)}
.ec .ic{font-size:2.1rem;line-height:1.2}
.ec b{display:block;color:var(--c);font-size:.98rem;margin:.25rem 0 .15rem}
.ec small{display:block;color:var(--muted);font-size:.72rem;line-height:1.55}
.ec .pg{height:5px;background:var(--line);border-radius:9px;margin-top:.55rem;overflow:hidden}
.ec .pg i{display:block;height:100%;background:var(--c);width:0;transition:.4s}
.ec .done{position:absolute;top:.4rem;left:.5rem;font-size:.95rem;color:var(--gold)}

/* ---------- البحث ---------- */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;display:none}
.ov.on{display:block}
.panel{position:fixed;inset:0;background:var(--paper);z-index:95;display:none;flex-direction:column}
.panel.on{display:flex}
.sh{display:flex;gap:.6rem;padding:.8rem;border-bottom:2px solid var(--gold)}
.sh input{flex:1;border:0;background:transparent;font-family:'Cairo';
  font-size:1.05rem;color:var(--ink);outline:none}
.sb{flex:1;overflow-y:auto;padding:.8rem}
.res{background:transparent;border:1px solid var(--line);border-radius:12px;
  padding:.7rem .9rem;margin-bottom:.5rem;cursor:pointer}
.res b{display:block;color:var(--c);font-size:.95rem}
.res small{color:var(--muted);font-size:.78rem;line-height:1.6}
.res em{font-style:normal;background:rgba(184,148,47,.22);border-radius:3px;padding:0 2px}

@media(max-width:420px){
  main{padding:.9rem .8rem 4rem}
  .hero h1{font-size:1.5rem}
  .tli{flex:0 0 132px}
}

/* ========== ١) الإطار المزخرف — حواشي المخطوطات (زوايا ثابتة الحجم) ========== */
.frame{position:relative;border:1px solid var(--gold);border-radius:6px;padding:1.6rem 1.35rem}
.frame:before{content:"";position:absolute;inset:5px;border:1px solid var(--gold);
  opacity:.28;border-radius:3px;pointer-events:none}
.crn{position:absolute;width:26px;height:26px;pointer-events:none;color:var(--gold);opacity:.75}
.crn svg{width:100%;height:100%;display:block;stroke:currentColor;fill:none;stroke-width:1.1}
.crn.tl{top:-1px;right:-1px}.cn-tr{}
.crn.tr{top:-1px;left:-1px}
.crn.bl{bottom:-1px;right:-1px}
.crn.br{bottom:-1px;left:-1px}
.frame>*:not(.crn){position:relative;z-index:1}

/* ========== ٢) الخط الزمني الكبير ========== */
.orn{width:210px;max-width:70%;height:18px;opacity:.55}
.bigtl{display:flex;gap:.55rem;overflow-x:auto;padding:1rem .3rem 1.3rem;
  scroll-snap-type:x mandatory;cursor:grab;scrollbar-width:thin;
  -webkit-overflow-scrolling:touch}
.bigtl:active{cursor:grabbing}
.bigtl::-webkit-scrollbar{height:6px}
.bigtl::-webkit-scrollbar-thumb{background:var(--gold);border-radius:9px}
.btl{flex:0 0 126px;scroll-snap-align:center;position:relative;
  display:flex;flex-direction:column;align-items:center;gap:.25rem;
  text-decoration:none;color:inherit;padding-top:1.1rem}
.btl:before{content:"";position:absolute;top:.4rem;right:-.3rem;left:-.3rem;height:2px;
  background:var(--line)}
.btl:after{content:"";position:absolute;top:0;right:calc(50% - 9px);
  width:18px;height:18px;border-radius:50%;background:var(--paper);
  border:3px solid var(--c);z-index:2;transition:.25s}
.btl:hover:after{transform:scale(1.25)}
.btl .ic{font-size:1.6rem;line-height:1;z-index:2}
.btl .nm{font-family:'Amiri',serif;font-size:.86rem;color:var(--c);text-align:center;line-height:1.5}
.btl .yr{font-size:.65rem;color:var(--muted)}
.btl .st{font-size:.6rem;color:var(--gold2);font-weight:700}

/* ========== ٣) تقليب الصفحة ========== */
.flip{position:fixed;inset:0;background:var(--cream);z-index:200;pointer-events:none;opacity:0}
.flip.go{animation:flipA .5s ease forwards}
@keyframes flipA{
  0%{opacity:.95;transform:perspective(1200px) rotateY(0)}
  55%{opacity:.95;transform:perspective(1200px) rotateY(-38deg)}
  100%{opacity:1;transform:perspective(1200px) rotateY(0)}
}
main.flip-out{animation:flipB .3s ease forwards}
@keyframes flipB{to{opacity:0;transform:perspective(1200px) translateX(-45px)}}

/* ========== ٤) تقدّم على شكل سيف ========== */
.sword{position:fixed;bottom:14px;right:50%;transform:translateX(50%);
  z-index:70;pointer-events:none;display:flex;align-items:center;gap:.5rem;
  background:var(--paper);border:1px solid var(--line);border-radius:50px;
  padding:.3rem .85rem;box-shadow:var(--shadow);font-size:.72rem;color:var(--muted)}
.sword svg{height:11px;width:118px}
.sword .bl{fill:var(--gold);opacity:.9}

/* ========== ٥) الأوسمة ========== */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:.55rem;margin-top:.8rem}
.bg{border:1px dashed var(--line);border-radius:14px;padding:.7rem .5rem;text-align:center;
  background:var(--paper);opacity:.4;filter:grayscale(1);transition:.35s}
.bg.on{opacity:1;filter:none;border:1px solid var(--gold);
  box-shadow:0 0 0 1px rgba(184,148,47,.22),var(--shadow)}
.bg .bi{font-size:1.9rem;line-height:1.2}
.bg b{display:block;font-size:.82rem;color:var(--ink);margin-top:.15rem}
.bg small{display:block;color:var(--muted);font-size:.64rem;line-height:1.5}

/* ========== ٦) شريط علوي رفيع ========== */
.topbar{position:fixed;top:0;right:0;left:0;height:3px;z-index:80}
.topbar i{display:block;height:100%;width:0;
  background:linear-gradient(90deg,var(--gold),#E8CE7C);transition:width .1s linear}

/* ==========================================================
   واجهة الصفحات العميقة (فصول متعددة)
   ========================================================== */

/* الفهرس */
.toc{margin-bottom:1.4rem;padding:1.2rem 1.3rem 1.4rem}
.toclist{list-style:none}
.toclist li{margin:0}
.toclist a{display:flex;align-items:center;gap:.6rem;padding:.42rem .3rem;
  border-bottom:1px dashed var(--line);text-decoration:none;color:var(--ink);
  font-size:.92rem;transition:.2s}
.toclist a:hover{color:var(--c);padding-right:.8rem;background:rgba(184,148,47,.07)}
.toclist b{background:var(--c);color:#fff;border-radius:6px;min-width:24px;
  text-align:center;font-size:.72rem;padding:.1rem .3rem;flex:0 0 auto}
.toclist .ttl{flex:1 1 auto;min-width:0}
.toclist .tpg{margin-inline-start:auto;flex:0 0 auto;font-size:.74rem;color:var(--muted);
  background:rgba(184,148,47,.1);border-radius:6px;padding:.05rem .4rem;min-width:26px;text-align:center}

/* عنوان القسم */
.part{margin-bottom:2.6rem}
.part-h{position:relative;text-align:center;margin:2.4rem 0 1.6rem;
  padding:1.1rem .9rem;border-top:1px solid var(--gold);border-bottom:1px solid var(--gold)}
.part-ic{font-size:2rem;line-height:1}
.part-h h2{font-family:'Amiri',serif;font-size:1.5rem;color:var(--c);margin:.2rem 0}
.part-h p{color:var(--muted);font-size:.92rem;max-width:640px;margin:.4rem auto 0;line-height:1.95}

/* الفصل */
.ch3{position:relative;background:var(--paper);border:1px solid var(--line);
  border-radius:16px;padding:1.3rem 1.2rem;margin-bottom:1.1rem;box-shadow:var(--shadow)}
.ch3-h{display:flex;align-items:flex-start;gap:.6rem;margin-bottom:.7rem;
  padding-bottom:.6rem;border-bottom:1px solid var(--line)}
.ch3-n{background:var(--c);color:#fff;font-size:.72rem;font-weight:700;
  padding:.18rem .5rem;border-radius:6px;flex:0 0 auto;margin-top:.25rem}
.ch3 h3,.rbody h3{font-family:'Amiri',serif;font-size:1.35rem;color:var(--ink);line-height:1.6}

/* افتتاحية الفصل: تميّز فصلًا عن آخر داخل القارئ */
.cho-top{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;
  font-family:'Cairo';font-size:.7rem;color:var(--muted);margin-bottom:.45rem}
.cho-part{font-weight:700;color:var(--c);opacity:.9}
.cho-cnt{margin-inline-start:auto;background:rgba(184,148,47,.13);color:var(--gold2);
  border-radius:20px;padding:.12rem .6rem;font-weight:700;white-space:nowrap}
.cho-mid{display:flex;align-items:flex-start;gap:.6rem}
.cho-num{font-family:'Amiri',serif;font-weight:700;font-size:1.45rem;color:var(--gold2);
  line-height:1.25;flex:0 0 auto;padding-top:.1rem}
.cho-num i{font-style:normal;opacity:.5;margin:0 .04rem}
.cho-rule{display:flex;align-items:center;gap:.5rem;margin-top:.65rem}
.cho-rule i{flex:1 1 auto;height:1px}
.cho-rule i:first-child{background:linear-gradient(to right,var(--gold),rgba(184,148,47,.06))}
.cho-rule i:last-child{background:linear-gradient(to left,var(--gold),rgba(184,148,47,.06))}
.cho-rule b{color:var(--gold);font-size:.68rem;font-weight:400;line-height:1}
.ch3 .lead,.rbody .lead{font-family:'Amiri',serif;font-size:1.12rem;line-height:2.05;
  color:var(--c);font-weight:700;margin-bottom:.7rem;text-align:right}
.ch3 .ap,.rbody .ap{font-family:'Amiri',serif;font-size:1.1rem;line-height:2.15;
  text-align:justify;margin-bottom:.75rem}
.ch3 .sub,.rbody .sub{font-family:'Amiri',serif;font-size:1.15rem;color:var(--c);
  margin:1.2rem 0 .5rem;padding-right:.6rem;border-right:4px solid var(--gold)}

/* صندوق الخلاصة */
.kbox{margin-top:1rem;background:linear-gradient(135deg,rgba(184,148,47,.09),rgba(184,148,47,.03));
  border:1px solid var(--line);border-radius:12px;padding:.8rem .9rem}
.kbox .bt{font-family:'Amiri',serif;color:var(--gold2);font-size:1rem;margin-bottom:.5rem}
.kgrid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.55rem}
.kb{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:.5rem .6rem}
.kb b{display:block;color:var(--blue);font-size:.88rem;margin-bottom:.1rem}
.kb span{font-size:.78rem;color:var(--muted);line-height:1.6;display:block}

/* جدول */
.tblwrap{overflow-x:auto;margin-top:1rem;border:1px solid var(--line);border-radius:12px}
.tblwrap table{border-collapse:collapse;width:100%;min-width:380px}
.tblwrap th{background:var(--c);color:#fff;font-size:.82rem;font-weight:700;
  padding:.55rem .7rem;text-align:right;white-space:nowrap}
.tblwrap td{padding:.55rem .7rem;font-size:.84rem;border-bottom:1px solid var(--line);
  line-height:1.8;vertical-align:top}
.tblwrap tr:last-child td{border-bottom:0}
.tblwrap tbody tr:nth-child(odd){background:rgba(184,148,47,.045)}

/* اقتباس */
.ch3 blockquote,.rbody blockquote{margin:1rem 0;padding:.8rem 1rem;border-right:5px solid var(--gold);
  background:rgba(184,148,47,.07);border-radius:0 12px 12px 0}
.ch3 blockquote p,.rbody blockquote p{font-family:'Amiri',serif;font-size:1.08rem;line-height:2;color:var(--gold2)}
.ch3 blockquote cite,.rbody blockquote cite{display:block;margin-top:.4rem;font-size:.78rem;
  color:var(--muted);font-style:normal}

/* خلاصة الفصل */
.ch3 .res,.rbody .res{margin-top:1rem;padding:.6rem .9rem;border-right:4px solid var(--gold);
  background:linear-gradient(135deg,rgba(184,148,47,.12),rgba(184,148,47,.04));
  border-radius:10px;font-size:.9rem;color:var(--gold2);font-weight:600}
.ch3 .up{display:block;text-align:left;margin-top:.9rem;font-size:.78rem;
  color:var(--muted);text-decoration:none}
.ch3 .up:hover{color:var(--c)}

@media(max-width:420px){
  .ch3{padding:1rem .85rem}
  .ch3 .ap,.rbody .ap{font-size:1.05rem}
  .kgrid3{grid-template-columns:1fr 1fr}
}


/* ==========================================================
   COMFORT — راحة القراءة والزخرفة
   ========================================================== */

/* عرض مريح للسطر: يمنع الإرهاق البصري */
main{max-width:760px}
.ch3 .ap,.ch3 .lead{max-width:100%}

.part-list a:hover{color:var(--c);border-color:var(--gold);background:rgba(184,148,47,.08)}

/* فهرس متشعّب */
.toclist>li{padding:0}
.toc-part{list-style:none;margin-bottom:.9rem}
.toc-part>b{display:inline-block;margin-left:.4rem}

.toc-part>ul{list-style:none;margin:.35rem 0 0;padding-right:.9rem;

.toc-part>ul>li{margin:0}

.chnav{display:flex;gap:.5rem;align-items:stretch;margin-top:1.1rem;

   القارئ — كتاب بلا تمرير عمودي

/* الصفحة كلها: شريط علوي + مسرح + شريط سفلي */
body.reading{height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
body.reading .top{flex:0 0 auto}
body.reading .flip,body.reading .sword,body.reading .railbar,body.reading .crumbs{display:none}

main.reader{max-width:none;margin:0;padding:0;flex:1;min-height:0;
  display:flex;flex-direction:column;animation:none}

/* الشريط العلوي يحمل اسم الفصل */
.top.reading .brand{flex:1;min-width:0;gap:.35rem}
.top.reading .btxt{display:none}
.rbrand{font-family:'Amiri',serif;font-size:.92rem;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* المسرح */
.rstage{position:relative;flex:1;min-height:0;overflow:hidden;
  perspective:2200px;perspective-origin:50% 50%;touch-action:pan-y}

/* الصفحة */
.rpage{position:absolute;display:flex;flex-direction:column;overflow:hidden;
  background:var(--paper);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 6px 22px rgba(80,60,20,.12)}
.rbody{flex:1;min-height:0;overflow:hidden;padding:12px 20px}
.rpfoot{flex:0 0 auto;height:26px;display:flex;align-items:center;justify-content:center;
  font-size:.72rem;color:var(--muted);border-top:1px solid var(--line);
  direction:ltr;unicode-bidi:isolate}

/* حاوية القياس (خارج الشاشة) */
.rmeas{position:absolute;left:-99999px;top:0;visibility:hidden;pointer-events:none}
.rmeas .rbody{height:auto!important;padding:0;overflow:hidden}

/* ورقة التقليب */
.rleaf{position:absolute;display:none;transform-style:preserve-3d;
  will-change:transform;z-index:20;pointer-events:none}
.rleaf.on{display:block}
.rface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--paper);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);overflow:hidden}
.rback{transform:rotateY(180deg);
  background:linear-gradient(270deg,var(--paper) 55%,var(--cream) 100%)}
.rleaf::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to left,rgba(0,0,0,.30),rgba(0,0,0,0) 45%);
  opacity:calc(var(--a,0)*.95)}
.rleaf.prev::after{background:linear-gradient(to right,rgba(0,0,0,.30),rgba(0,0,0,0) 45%)}

/* الشريط السفلي */
.rfoot{flex:0 0 auto;display:flex;align-items:center;gap:.6rem;
  padding:.35rem .8rem;min-height:56px;border-top:1px solid var(--line);background:var(--paper)}
.rnav{min-height:48px;min-width:66px;padding:.35rem .9rem;border:1px solid var(--line);
  border-radius:12px;background:transparent;color:var(--ink);font-family:'Cairo';
  font-size:.9rem;font-weight:600;cursor:pointer;transition:.2s}
.rnav:hover:not(:disabled){border-color:var(--gold);background:rgba(184,148,47,.07)}
.rnav:disabled{opacity:.3;cursor:default}
.rprog{flex:1;height:9px;min-width:60px;border:0;padding:0;border-radius:9px;
  background:var(--line);overflow:hidden;cursor:pointer;display:block}
.rprog i{display:block;height:100%;width:0;
  background:linear-gradient(90deg,var(--gold),#E3C56A);transition:width .25s}

/* لوحة الفهرس والذهاب إلى صفحة */
.rpanel{position:fixed;top:0;right:0;bottom:0;width:min(86vw,360px);z-index:120;
  background:var(--paper);border-left:1px solid var(--line);display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .28s ease;
  box-shadow:-6px 0 24px rgba(0,0,0,.14)}
.rpanel.on{transform:translateX(0)}
.rphead{display:flex;align-items:center;justify-content:space-between;
  padding:.65rem .9rem;border-bottom:2px solid var(--gold);
  font-family:'Amiri';font-size:1.05rem;color:var(--c)}

  background:var(--cream);color:var(--ink);font-family:'Cairo';font-size:1rem;padding:0 .7rem}
.rpgo{min-height:46px;padding:0 1rem;border:0;border-radius:10px;background:var(--gold);
  color:#fff;font-family:'Cairo';font-weight:700;cursor:pointer}
.rpfont{display:flex;align-items:center;gap:.45rem;padding:.55rem .9rem;
  border-bottom:1px solid var(--line);font-size:.85rem;color:var(--muted)}
.rpfont span{margin-left:auto}

  background:transparent;color:var(--ink);font-family:'Cairo';font-size:.92rem;cursor:pointer}

one":true,"id":"part-1","n":"البدايات","ic":"","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-1\" style=\"--c:#8B4513\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🌱\u003c/div\u003e\n      \u003ch2\u003eالبدايات\u003c/h2\u003e\n      \u003cp\u003eيبدأ الجزء الأول من قصص الأنبياء بالبدايات: خلق آدم عليه السلام وسجود الملائكة له ومحنة الشجرة، ثم نوح عليه السلام ودعوته الطويلة وطوفانه، ثم هود وصالح عليهما السلام وقوميهما. حكايات هذه الفصول وردت في القرآن الكريم بالتفصيل، ونحن نسير مع نصّ التنزيل وحده، نذكر مع كل شاهدٍ رقم آيته، ونتجنّب كل ما لم يثبت فيه.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#adam\"\u003eآدم وحواء وبداية الإنسان\u003c/a\u003e\u003ca href=\"#nuh\"\u003eنوح والطوفان\u003c/a\u003e\u003ca href=\"#hud-salih\"\u003eهود وصالح وقوماهما\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"adam","n":"آدم وحواء وبداية الإنسان","ic":"🌿","part":"البدايات","h":"\u003carticle class=\"ch3\" id=\"adam\" data-toc=\"آدم وحواء وبداية الإنسان\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالبدايات\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ١ من ٣\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e١\u003ci\u003e.\u003c/i\u003e١\u003c/span\u003e\n            \u003ch3\u003e🌿 آدم وحواء وبداية الإنسان\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eك\u003c/span\u003eيف خلق الله آدم عليه السلام، وما الذي جرى بينه وبين ربّه في الجنة قبل نزوله إلى الأرض؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eقال الله تعالى: ﴿إِذْ قَالَ رَبُّكَ لِلْمَلَائِكَةِ إِنِّي خَالِقٌ بَشَرًا مِنْ طِينٍ﴾ (سورة ص: ٧١)، ثم قال: ﴿فَإِذَا سَوَّيْتُهُ وَنَفَخْتُ فِيهِ مِنْ رُوحِي فَقَعُوا لَهُ سَاجِدِينَ﴾ (سورة ص: ٧٢). هكذا يفتتح القرآن حكاية الإنسان: طينٌ ثم تسويةٌ ثم نفخٌ في الجسد من الروح، ثم إرادةٌ بأن يسجد الملائكة له. وقد ذكر سجودهم فقال تعالى: ﴿فَسَجَدَ الْمَلَائِكَةُ كُلُّهُمْ أَجْمَعُونَ إِلَّا إِبْلِيسَ اسْتَكْبَرَ وَكَانَ مِنَ الْكَافِرِينَ﴾ (سورة ص: ٧٣ و٧٤). ولم يذكر القرآن مقدار الزمن ولا صفة الخلق، فلا يُقدَّر فيها ما لم يُنزَل، ولا يُضاف إلى النصّ ما لم يقل به.\u003c/p\u003e\u003cp class=\"ap\"\u003eولم يقتصر الأمر على الخلق، بل تميّز آدم بالعلم؛ قال الله تعالى: ﴿وَعَلَّمَ آدَمَ الْأَسْمَاءَ كُلَّهَا ثُمَّ عَرَضَهُمْ عَلَى الْمَلَائِكَةِ فَقَالَ أَنْبِئُونِي بِأَسْمَاءِ هَؤُلَاءِ إِنْ كُنتُمْ صَادِقِينَ﴾ (سورة البقرة: ٣١)، ثم قال: ﴿قَالَ يَا آدَمُ أَنْبِئْهُمْ بِأَسْمَائِهِمْ فَلَمَّا أَنْبَأَهُمْ بِأَسْمَائِهِمْ قَالَ أَلَمْ أَقُلْ لَكُمْ إِنِّي أَعْلَمُ غَيْبَ السَّمَاوَاتِ وَالْأَرْضِ وَأَعْلَمُ مَا تُبْدُونَ وَمَا كُنتُمْ تَكْتُمُونَ﴾ (سورة البقرة: ٣٣). فجاء التمييز بعلمٍ سُوِّي له، ولم يَجِئ بسلطةٍ فوق الملائكة، بل بحجةٍ يُفتتح بها وجه الخطاب كلّه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد قرّن الله خلق آدم بمقصود الخلق نفسه؛ قال الله تعالى: ﴿وَإِذْ قَالَ رَبُّكَ لِلْمَلَائِكَةِ إِنِّي جَاعِلٌ فِي الْأَرْضِ خَلِيفَةً قَالُوا أَتَجْعَلُ فِيهَا مَن يُفْسِدُ فِيهَا وَيَسْفِكُ الدِّمَاءَ وَنَحْنُ نُسَبِّحُ بِحَمْدِكَ وَنُقَدِّسُ لَكَ قَالَ إِنِّي أَعْلَمُ مَا لَا تَعْلَمُونَ﴾ (سورة البقرة: ٣٠). وفي الآية بيانٌ موجز لمنزلة الإنسان في الأرض: خليفةٌ يُختبر، وسأل الملائكة سؤالًا لم يُبيّن له جوابٌ غير جواب الله، ولا يُحمَل هذا الحوار على معنىٍ يخرج عن ظاهر التنزيل.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم جاء النهي، وهو أول واجبٍ ورد على الإنسان؛ قال الله تعالى: ﴿وَقُلْنَا يَا آدَمُ اسْكُنْ أَنْتَ وَزَوْجُكَ الْجَنَّةَ وَكُلَا مِنْهَا رَغَدًا حَيْثُ شِئْتُمَا وَلَا تَقْرَبَا هَذِهِ الشَّجَرَةَ فَتَكُونَا مِنَ الظَّالِمِينَ﴾ (سورة البقرة: ٣٥). ورُفِعت العناية بحفظ الحدّ، فخُصَّت الشجرة بالذكر، وخُصَّ آدم وحواء بالمخاطبة. ثم جاء الاقتراب فقال الله تعالى: ﴿فَأَزَلَّهُمَا الشَّيْطَانُ عَنْهَا فَأَخْرَجَهُمَا مِمَّا كَانَا فِيهِ وَقُلْنَا اهْبِطُوا بَعْضُكُمْ لِبَعْضٍ عَدُوٌّ وَلَكُمْ فِي الْأَرْضِ مُسْتَقَرٌّ وَمَتَاعٌ إِلَىٰ حِينٍ﴾ (سورة البقرة: ٣٦).\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد وصف القرآن سلوك الوسوسة إليهما بالتفصيل؛ قال الله تعالى: ﴿فَوَسْوَسَ لَهُمَا الشَّيْطَانُ لِيُبْدِيَ لَهُمَا مَا وُورِيَ عَنْهُمَا مِنْ سَوْآتِهِمَا وَقَالَ مَا نَهَاكُمَا رَبُّكُمَا عَنْ هَذِهِ الشَّجَرَةِ إِلَّا أَن تَكُونَا مَلَكَيْنِ أَوْ تَكُونَا مِنَ الْخَالِدِينَ﴾ (سورة الأعراف: ٢٠)، ثم قال: ﴿فَدَلَّاهُمَا بِغُرُورٍ فَلَمَّا ذَاقَا الشَّجَرَةَ بَدَتْ لَهُمَا سَوْآتُهُمَا وَطَفِقَا يَخْصِفَانِ عَلَيْهِمَا مِنْ وَرَقِ الْجَنَّةِ﴾ (سورة الأعراف: ٢٢). فبدأ الأمر بالشكّ في النهي، ثم انتهى إلى نتيجةٍ ظاهرة، ولم يذكر في القرآن أن أحدهما أوقع الآخر في الاقتراب، بل ذُكر اقتراب الاثنين معاً من الشجرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eولم يكن عاقبة الأمر هلاكًا، بل توبةٌ وعودة؛ قال الله تعالى: ﴿فَتَلَقَّى آدَمُ مِنْ رَبِّهِ كَلِمَاتٍ فَتَابَ عَلَيْهِ إِنَّهُ هُوَ التَّوَّابُ الرَّحِيمُ﴾ (سورة البقرة: ٣٧). وفي الآية التالية: ﴿قُلْنَا اهْبِطُوا مِنْهَا جَمِيعًا فَإِمَّا يَأْتِيَنَّكُمْ مِنِّي هُدًى فَمَنْ تَبِعَ هُدَايَ فَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ﴾ (سورة البقرة: ٣٨). هكذا يبدأ تاريخ البشرية بالابتلاء ثم بالتوبة ثم بالوعد بالهداية، وهذه ترتيباتٌ ثابتة في كتاب الله لا تتبدّل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد خُتمت الحكاية ببيان كرامة الإنسان ومقصود خلقه؛ قال الله تعالى: ﴿وَلَقَدْ كَرَّمْنَا بَنِي آدَمَ وَحَمَلْنَاهُمْ فِي الْبَرِّ وَالْبَحْرِ وَرَزَقْنَاهُمْ مِنَ الطَّيِّبَاتِ وَفَضَّلْنَاهُمْ عَلَى كَثِيرٍ مِمَّنْ خَلَقْنَا تَفْضِيلًا﴾ (سورة الإسراء: ٧٠)، وقال: ﴿وَمَا خَلَقْتُ الْجِنَّ وَالْإِنْسَ إِلَّا لِيَعْبُدُونِ﴾ (سورة الذاريات: ٥٦)، وقال: ﴿فَأَقِمْ وَجْهَكَ لِلدِّينِ حَنِيفًا فِطْرَتَ اللَّهِ الَّتِي فَطَرَ النَّاسَ عَلَيْهَا لَا تَبْدِيلَ لِخَلْقِ اللَّهِ﴾ (سورة الروم: ٣٠). وبهذا تنتهي بداية الإنسان: مكرَّمٌ مُكلَّفٌ، خرج إلى الأرض على وعدٍ من الله بالهداية.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالخلق والنفخ في الروح\u003c/h4\u003e\u003cp class=\"ap\"\u003eمرّ خلق آدم في القرآن بثلاث مراحل متعاقبة: الطين، ثم التسوية، ثم النفخ من الروح. وقد ذُكرت كل مرحلةٍ في موضعها، فلم يُطوى شيءٌ منها ولم يُضف إليها وصفٌ من عند التأويل. والنتيجة المستفادة من هذا الترتيب أن الوجود يبدأ بالمادي ثم يكتمل بالروح، وأن كرامة الإنسان ليست كرامة جسده وحده.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما السجود فقد ورد في القرآن بأمرين متعاقبين: الأمر بالسجود، ثم إتمامه، فقال الله تعالى: ﴿وَإِذْ قُلْنَا لِلْمَلَائِكَةِ اسْجُدُوا لِآدَمَ فَسَجَدُوا إِلَّا إِبْلِيسَ أَبَىٰ وَاسْتَكْبَرَ وَكَانَ مِنَ الْكَافِرِينَ﴾ (سورة البقرة: ٣٤). فالامتناع وُصف بالكبرياء، والكبرياء في التنزيل سببٌ للطرد لا سببٌ للمنزلة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما قول الملائكة في باب الجنة فمذكورٌ في أسلوبٍ قصير: قالوا: ﴿أَتَجْعَلُ فِيهَا مَن يُفْسِدُ فِيهَا وَيَسْفِكُ الدِّمَاءَ﴾ (سورة البقرة: ٣٠)، فأجابهم الله بما لا يُدركه قولهم. ولا يُبنى على هذا الحوار استقراءٌ لطبع البشر ولا حكمٌ على الأجناس، لأن الآية اعتبرت سؤال الملائكة ولم تُصدّقه.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eمحنة الشجرة والوسوسة\u003c/h4\u003e\u003cp class=\"ap\"\u003eالنهي في الآية صريح ومحدّد: ﴿وَلَا تَقْرَبَا هَذِهِ الشَّجَرَةَ﴾ (سورة البقرة: ٣٥)، وبدأ الاقتراب بإزاحة الشيطان لهما عن مكانيهما، فقال الله تعالى: ﴿فَأَزَلَّهُمَا الشَّيْطَانُ عَنْهَا﴾ (سورة البقرة: ٣٦). وقد وصف القرآن فعل الوسوسة بأنه إبداءٌ لما وُوري عنهما، أي إظهارٌ لما كان مكتومًا، وهذا أصل ما جرى بعد ذلك.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد جاء في سورة الأعراف أن النهي وُجّه إلى الفريقين معًا: ﴿مَا نَهَاكُمَا رَبُّكُمَا عَنْ هَذِهِ الشَّجَرَةِ﴾ (سورة الأعراف: ٢٠)، فلم يُفرَّق في الآية بين الرجل والمرأة في المسؤولية. وبعد الأكل ظهرت السوءة، واحتملا معًا فعل الورق، ثم جاء النداء: ﴿أَلَمْ أَنْهَكُمَا عَن تِلْكُمَا الشَّجَرَةِ﴾ (سورة الأعراف: ٢٢).\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ذُكر في القرآن أن الإقدام كان بسببٍ ذُكر صراحةً: ﴿فَدَلَّاهُمَا بِغُرُورٍ﴾ (سورة الأعراف: ٢٢). والغرور في التنزيل هو ما زوّره الشيطان لا ما رآه آدم بعينه، ولذلك جاء ردّ الله على الشيطان من باب الجواب بما يستحقه، لا من باب تعليل فعل آدم. وهذا فرقٌ ظاهر يحفظ للنصّ حجّيته.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالتوبة والهبوط إلى الأرض\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم تختتم القصة بالطرد وحده، بل بالالتقاء؛ قال الله تعالى: ﴿فَتَلَقَّى آدَمُ مِنْ رَبِّهِ كَلِمَاتٍ فَتَابَ عَلَيْهِ إِنَّهُ هُوَ التَّوَّابُ الرَّحِيمُ﴾ (سورة البقرة: ٣٧). ولم يُبيّن القرآن ألفاظ تلك الكلمات، فيكتفي القارئ بما ورد، ولا يدخل فيما لم يَرِد. وهذا أسلوب القرآن في المواضع التي أراد فيها التعظيم بالاختصار.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما النزول فقد وُصف بأنه أمرٌ جماعي: ﴿قُلْنَا اهْبِطُوا مِنْهَا جَمِيعًا﴾ (سورة البقرة: ٣٨)، فنزل الرجل والمرأة والشيطان، ووُضِع للأولين وعدٌ بالهداية إن اتّبعوها. والآية تجعل الأرض موضع اختبارٍ لا موضع جزاءٍ عاجل، وأن الخوف والحزن مرفوعان عمّن تبع هدي الله.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد خُتم أمر إبليس بتحذيرٍ دائم؛ قال الله تعالى: ﴿قَالَ اخْرُجْ مِنْهَا مَذْءُومًا مَّدْحُورًا لِمَن تَبِعَكَ مِنْهُمْ لَأَمْلَأَنَّ جَهَنَّمَ مِنكُمْ أَجْمَعِينَ﴾ (سورة الأعراف: ١٨). وبذلك بقي تعلّق الإنسان بربّه مفتوحًا، وبقي طريق العودة مفتوحًا في كل زمان.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالخلق من طين\u003c/b\u003e\u003cspan\u003eأمرٌ بالخلق من طين، ثم تسوية، ثم نفخٌ في الجسد من الروح، ثم سجود الملائكة إلا إبليس.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eعلم الأسماء\u003c/b\u003e\u003cspan\u003eعُلِّم آدم الأسماء كلها ثم عُرِضت على الملائكة، فكان الفضل في العلم لا في الجسد.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالتوبة\u003c/b\u003e\u003cspan\u003eتلقى آدم من ربّه كلمات فتاب عليه، ثم هُبط الجميع إلى الأرض بوعدٍ بالهداية.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالعهد\u003c/b\u003e\u003cspan\u003eشهادة الذرّية على ربّيتها وردت في الأعراف ١٧٢، وتُنكِرها الذاكرة يوم القيامة.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالحلقة\u003c/th\u003e\u003cth\u003eما ورد في الآية\u003c/th\u003e\u003cth\u003eالسورة ورقم الآية\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالخلق\u003c/td\u003e\u003ctd\u003eإني خالق بشر من طين\u003c/td\u003e\u003ctd\u003eص: ٧١\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالنفخ في الروح\u003c/td\u003e\u003ctd\u003eفإذا سويته ونفخت فيه من روحي\u003c/td\u003e\u003ctd\u003eص: ٧٢\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالنهي عن الشجرة\u003c/td\u003e\u003ctd\u003eولا تقربا هذه الشجرة فتكونا من الظالمين\u003c/td\u003e\u003ctd\u003eالبقرة: ٣٥\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالتوبة\u003c/td\u003e\u003ctd\u003eفتلقى آدم من ربّه كلمات فتاب عليه\u003c/td\u003e\u003ctd\u003eالبقرة: ٣٧\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالنزول إلى الأرض\u003c/td\u003e\u003ctd\u003eقلنا اهبطوا منها جميعا فمن تبع هداي فلا خوف عليهم\u003c/td\u003e\u003ctd\u003eالبقرة: ٣٨\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eقال الله تعالى: ﴿وَلَقَدْ كَرَّمْنَا بَنِي آدَمَ وَحَمَلْنَاهُمْ فِي الْبَرِّ وَالْبَحْرِ وَرَزَقْنَاهُمْ مِنَ الطَّيِّبَاتِ﴾\u003c/p\u003e\u003ccite\u003eالقرآن الكريم — سورة الإسراء، الآية ٧٠\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eخُلق آدم عليه السلام من طينٍ ونُفخ فيه من الروح، وعُلِّم الأسماء، وأُمرت الملائكة بالسجود له فأبى إبليس. ثم جاء النهي عن الشجرة فعُوقب الاقتراب بالنزول إلى الأرض، وخُتم الأمر بتوبةٍ ووعيدٍ بالهداية، فصارت هذه البداية أصلًا للبشرية كلّها.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"nuh","n":"نوح والطوفان","ic":"🌊","part":"البدايات","h":"\u003carticle class=\"ch3\" id=\"nuh\" data-toc=\"نوح والطوفان\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالبدايات\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٢ من ٣\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e١\u003ci\u003e.\u003c/i\u003e٢\u003c/span\u003e\n            \u003ch3\u003e🌊 نوح والطوفان\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eك\u003c/span\u003eم بقي نوح عليه السلام يدعو قومه، وبماذا دعاهم، وكيف انتهى أمرهم؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eقال الله تعالى: ﴿وَلَقَدْ أَرْسَلْنَا نُوحًا إِلَىٰ قَوْمِهِ فَلَبِثَ فِيهِمْ أَلْفَ سَنَةٍ إِلَّا خَمْسِينَ عَامًا فَأَخَذَهُمُ الطُّوفَانُ وَهُمْ ظَالِمُونَ﴾ (سورة العنكبوت: ١٤). بهذه الآية تُحدَّد مدة دعوته في كتاب الله: ألف سنة إلا خمسين عامًا، وقد صاحب ذلك كله بقاءُ الظلم، ثم جاء الطوفان. ولم يذكر القرآن تاريخًا ميلاديًّا لهذه الحوادث، فلا يُثبَت فيها إلا ما نزل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بدأ رسالته بالتحذير والتوحيد معًا؛ قال الله تعالى: ﴿وَلَقَدْ أَرْسَلْنَا نُوحًا إِلَىٰ قَوْمِهِ إِنِّي لَكُمْ نَذِيرٌ مُّبِينٌ أَنْ لَا تَعْبُدُوا إِلَّا اللَّهَ إِنِّي أَخَافُ عَلَيْكُمْ عَذَابَ يَوْمٍ أَلِيمٍ﴾ (سورة هود: ٢٥ و٢٦). فجاءت الرسالة بأصلٍ واحد هو عبادة الله وحده، ونبّهت إلى عذابٍ يومٍ أليم. وهذه الصيغة هي نفسها صيغة الرسل جميعًا في القرآن.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد وصف القرآن أثر دعوته بما هو محسوس؛ قال الله تعالى: ﴿فَلَمْ يَزِدْهُمْ دُعَائِي إِلَّا فِرَارًا﴾ (سورة نوح: ٦). والفرار هنا وصفٌ لسلوكهم تجاه الداعي، لا وصفٌ لاختلافهم في الرأي. وقال تعالى: ﴿يَغْفِرْ لَكُم مِّن ذُنُوبِكُمْ وَيُؤَخِّرْكُمْ إِلَىٰ أَجَلٍ مُّسَمًّى إِنَّ أَجَلَ اللَّهِ إِذَا جَاءَ لَا يُؤَخَّرُ لَوْ كُنتُمْ تَعْلَمُونَ﴾ (سورة نوح: ٤). فكان ما يُقدَّم لهم موعظةً وتبشيرًا بالغفران وتأجيلًا محدودًا، وكان ردّهم فرارًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأُمِر بصنع الفلك؛ قال الله تعالى: ﴿وَاصْنَعِ الْفُلْكَ بِأَعْيُنِنَا وَوَحْيِنَا وَلَا تُخَاطِبْنِي فِي الَّذِينَ ظَلَمُوا إِنَّهُم مُّغْرَقُونَ﴾ (سورة هود: ٣٧). فجاء الأمر صريحًا، ورافقه تحديدٌ بعدم المجادلة فيهم. ولم يذكر القرآن صنعة الفلك ولا عدد مَن ساعد فيها، بل ذكر الأمر والتنفيذ. ثم جاء توجيه الركوب: ﴿وَقَالَ ارْكُبُوا فِيهَا بِسْمِ اللَّهِ مَجْرَاهَا وَمَرْسَاهَا إِنَّ رَبِّي لَغَفُورٌ رَّحِيمٌ﴾ (سورة هود: ٤١)، فافتتحت رحلة السفينة بذكر اسم الله.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ورد في القرآن دعاؤه لربّه عند رؤية ابنه من أهله؛ قال الله تعالى: ﴿وَنَادَىٰ نُوحٌ رَبَّهُ فَقَالَ رَبِّ إِنَّ ابْنِي مِنْ أَهْلِي وَإِنَّ وَعْدَكَ الْحَقُّ وَأَنْتَ أَحْكَمُ الْحَاكِمِينَ﴾ (سورة هود: ٤٥)، فجاء الجواب: ﴿يَا نُوحُ إِنَّهُ لَيْسَ مِنْ أَهْلِكَ إِنَّهُ عَمَلٌ غَيْرُ صَالِحٍ فَلَا تَسْأَلْنِي مَا لَيْسَ لَكَ بِهِ عِلْمٌ إِنِّي أُعِظُكَ أَن تَكُونَ مِنَ الْجَاهِلِينَ﴾ (سورة هود: ٤٦). وفي الآيتين نهيٌ عن سؤال ما ليس للإنسان به علم، وذكرٌ لرجوع الأمر كلّه إلى حكم الله.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم جاء العذاب؛ قال الله تعالى: ﴿فَفَتَحْنَا أَبْوَابَ السَّمَاءِ بِمَاءٍ مُّنْهَمِرٍ﴾ (سورة القمر: ١١)، وقال: ﴿وَقِيلَ يَا أَرْضُ ابْلَعِي مَاءَكِ وَيَا سَمَاءُ أَقْلِعِي وَغِيضَ الْمَاءُ وَقُضِيَ الْأَمْرُ وَاسْتَوَتْ عَلَى الْجُودِيِّ وَقِيلَ بُعْدًا لِلْقَوْمِ الظَّالِمِينَ﴾ (سورة هود: ٤٤). وفي الآية ترتيب الأحداث من فتح السماء إلى الاستواء على الجودي، وهو كل ما ذكره النصّ من أمر المكان.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد وُصف سلب النجاة لهم بسببهم؛ قال الله تعالى: ﴿مِمَّا خَطِيئَاتِهِمْ أُغْرِقُوا فَأُدْخِلُوا نَارًا فَلَمْ يَجِدُوا لَهُم مِّن دُونِ اللَّهِ أَنصَارًا﴾ (سورة نوح: ٢٥). أما نوح ومن معه فقد وُعدوا بالنجاة، فقال الله تعالى: ﴿قِيلَ يَا نُوحُ اهْبِطْ بِسَلَامٍ مِّنَّا وَبَرَكَةٍ عَلَيْكَ وَعَلَىٰ أُمَمٍ مِّمَّن مَّعَكَ وَأُمَمٌ سَنُمَتِّعُهُمْ ثُمَّ يَمَسُّهُم مِّنَّا عَذَابٌ أَلِيمٌ﴾ (سورة هود: ٤٨)، وخُتمت القصة بأنها آيةٌ، فقال تعالى: ﴿وَلَقَدْ تَّرَكْنَاهَا آيَةً فَهَلْ مِن مُّدَّكِرٍ﴾ (سورة القمر: ١٥).\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالدعوة الطويلة\u003c/h4\u003e\u003cp class=\"ap\"\u003eمدة دعوة نوح عليه السلام مذكورة في كتاب الله ألف سنة إلا خمسين عامًا، وهي مدةٌ تجعل التبليغ مستمرًا والباب مفتوحًا مدةً طويلة. ولم تُذكر في القرآن ولا في التاريخ المقدّر بها سنةٌ ميلادية، فلا يُنسب إليها تاريخٌ لم يَرِد. وهذا الرقم واردٌ في الآية ذاتها، فلا يُزاد عليه ولا يُنقص منه، ولا يُشبَه بأعمار الأمم الأخرى.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ركّز نوح عليه السلام في رسالته على أمرين: التوحيد وتحذير من عذاب يوم أليم. وهما نفس الأمران اللذان يفتتح بهما القرآن رسالات الرسل جميعًا: ﴿أَنْ لَا تَعْبُدُوا إِلَّا اللَّهَ﴾ (سورة هود: ٢٦). ولا تُزاد في الرسالة حكمًا غير هذا الأصل، ولا يُقدَّم لقومه ما لم يَرِد في الرسالة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما أثر الدعوة فوُصف بالفرار: ﴿فَلَمْ يَزِدْهُمْ دُعَائِي إِلَّا فِرَارًا﴾ (سورة نوح: ٦). وهذه جملةٌ قصيرة تُلخّص ردة فعل قومه تجاه الدعوة، ولا تشرح أقوالهم ولا أعدادهم. ولم يذكر القرآن عددًا لمن استجاب ولا عددًا لمن رفض، فيقتصر القارئ على ما ورد، ويبقى ما سواه خارج حدود النصّ.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالفلك وأمر الركوب\u003c/h4\u003e\u003cp class=\"ap\"\u003eأمر الله نوحًا بصنع الفلك، ورافق الأمر منعًا من المجادلة في الظالمين لأنهم مغرقون، وهذا ورد لفظًا في سورة هود: ﴿وَاصْنَعِ الْفُلْكَ بِأَعْيُنِنَا وَوَحْيِنَا﴾ (سورة هود: ٣٧). ولم يذكر القرآن وصف الفلك ولا مقداره ولا عدد مَن ساعد في صنعته، فلا يُقدَّر ما لم يَرِد، ولا يُقدَّم على النصّ وصفٌ من خارجه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأمّر الله بالركوب بذكر اسم الله، فقال: ﴿ارْكُبُوا فِيهَا بِسْمِ اللَّهِ مَجْرَاهَا وَمَرْسَاهَا﴾ (سورة هود: ٤١). فجاءت في الآية سنة البداية وسنة الختام معًا، وذكر الغفران والرحمة بعد الاقتراب من أمرٍ عظيم. وبهذا تُفتتح رحلة السفينة بذكر الاسم الذي به يُفتتح كل أمرٍ نافع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما دعاؤه لربّه من أجل ابنه فمذكورٌ في الآيتين ٤٥ و٤٦ من سورة هود، وفيهما ردٌّ على السؤال ونهيٌ عن مسألة الغيب. ثم جاء دعاؤه لربّه بالاستعاذة من سؤال ما ليس له به علم، فقال الله تعالى: ﴿رَبِّ إِنِّي أَعُوذُ بِكَ أَن أَسْأَلَكَ مَا لَيْسَ لِي بِهِ عِلْمٌ وَإِلَّا تَغْفِرْ لِي وَتَرْحَمْنِي أَكُن مِّنَ الْخَاسِرِينَ﴾ (سورة هود: ٤٧). ولم يقل القرآن إن نوحًا عصى، بل ذكر دعاءه ورجع فيها إلى أمر الله.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالطوفان والنجاة\u003c/h4\u003e\u003cp class=\"ap\"\u003eوصف القرآن دخول الماء بقوله: ﴿فَفَتَحْنَا أَبْوَابَ السَّمَاءِ بِمَاءٍ مُّنْهَمِرٍ﴾ (سورة القمر: ١١)، ثم أمر الأرض والسماء بقوله: ﴿يَا أَرْضُ ابْلَعِي مَاءَكِ وَيَا سَمَاءُ أَقْلِعِي﴾ (سورة هود: ٤٤). وهذه أسلوبٌ قرآنيٌّ يُذكر فيه الخطاب في موضع الواقعة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد وُصف حمل نوح على الفلك بالألواح والأدسر، فقال الله تعالى: ﴿وَحَمَلْنَاهُ عَلَىٰ ذَاتِ أَلْوَاحٍ وَدُسُرٍ﴾ (سورة القمر: ١٣). والوصف مقتصرٌ على ما يدلّ على صنعة الفلك، ولا يزيد عليه. ولم يذكر القرآن عدد الركاب ولا مسار السفينة ولا مدّة الرحلة، فيقتصر المُتعلِّم على الجملتين الواردتين ولا يطلب للبقية حكمًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأُقِرَّ أمر الظالمين بسبب خطاياهم، وقال الله تعالى في ختامها: ﴿وَلَقَدْ تَّرَكْنَاهَا آيَةً فَهَلْ مِن مُّدَّكِرٍ﴾ (سورة القمر: ١٥). فالقصة لم تُذكر لترفيه، بل وُضعت آيةً تُذكِّر، والسؤال في الآية عن المذكِّر نفسه. ويبقى مضمون الحكاية قائمًا كما أُنزل، ولا تحتاج إلى ما يُضاف إليها من خارج التنزيل.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمدة الدعوة\u003c/b\u003e\u003cspan\u003eألف سنة إلا خمسين عامًا، ثم أخذهم الطوفان وهم ظالمون — العنكبوت ١٤.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأصل الرسالة\u003c/b\u003e\u003cspan\u003eإنّي لكم نذير مبين أن لا تعبدوا إلا الله، وإني أخاف عليكم عذاب يوم أليم — هود ٢٥ و٢٦.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالفلك\u003c/b\u003e\u003cspan\u003eأمرٌ بصنعه بعين الله ووحيه، ثم ركوبه بسم الله مجرها ومرساه — هود ٣٧ و٤١.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eآية بعد\u003c/b\u003e\u003cspan\u003eنجا نوح ومن معه، ووُصف الباقيون بخطاياهم، وخُتمت القصة بأنها آية لمن يذكر.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالسورة\u003c/th\u003e\u003cth\u003eرقم الآية\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالإرسال والتحذير\u003c/td\u003e\u003ctd\u003eالعنكبوت\u003c/td\u003e\u003ctd\u003e١٤\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمدة في الدعوة\u003c/td\u003e\u003ctd\u003eالعنكبوت\u003c/td\u003e\u003ctd\u003e١٤\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eصنع الفلك\u003c/td\u003e\u003ctd\u003eهود\u003c/td\u003e\u003ctd\u003e٣٧\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eأمر الركوب بسم الله\u003c/td\u003e\u003ctd\u003eهود\u003c/td\u003e\u003ctd\u003e٤١\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالاستواء على الجودي\u003c/td\u003e\u003ctd\u003eهود\u003c/td\u003e\u003ctd\u003e٤٤\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eقال الله تعالى: ﴿وَاصْنَعِ الْفُلْكَ بِأَعْيُنِنَا وَوَحْيِنَا وَلَا تُخَاطِبْنِي فِي الَّذِينَ ظَلَمُوا إِنَّهُم مُّغْرَقُونَ﴾\u003c/p\u003e\u003ccite\u003eالقرآن الكريم — سورة هود، الآية ٣٧\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eدعا نوح عليه السلام قومه ألف سنة إلا خمسين عامًا دعوةً يقوم على التوحيد وتحذير العذاب، فكان جوابهم فرارًا. ثم أُمِر بصنع الفلك وركوبه بسم الله، فنجا هو ومن معه، وأُغرق الظالمون بخطاياهم، وبقيت الحكاية آيةً تُتلى.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"hud-salih","n":"هود وصالح وقوماهما","ic":"🏔️","part":"البدايات","h":"\u003carticle class=\"ch3\" id=\"hud-salih\" data-toc=\"هود وصالح وقوماهما\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالبدايات\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٣ من ٣\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e١\u003ci\u003e.\u003c/i\u003e٣\u003c/span\u003e\n            \u003ch3\u003e🏔️ هود وصالح وقوماهما\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eم\u003c/span\u003eن هم قوم هود ومن هم قوم صالح، وبماذا انتهت قصّتهما في كتاب الله؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eقال الله تعالى: ﴿وَإِلَىٰ عَادٍ أَخَاهُمْ هُودًا قَالَ يَا قَوْمِ اعْبُدُوا اللَّهَ مَا لَكُم مِّنْ إِلَهٍ غَيْرُهُ أَفَلَا تَتَّقُونَ﴾ (سورة الأعراف: ٦٥)، وفي موضع آخر: ﴿وَإِلَىٰ عَادٍ أَخَاهُمْ هُودًا قَالَ يَا قَوْمِ اعْبُدُوا اللَّهَ مَا لَكُم مِّنْ إِلَهٍ غَيْرُهُ إِنْ أَنتُمْ إِلَّا مُفْتَرُونَ﴾ (سورة هود: ٥٠). فافتتح رسالته بالتوحيد نفسه، ووصَف ما هم عليه بأنه افتراء لا حقيقة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد وصف القرآن قوة قوم عاد حين قال: ﴿أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِعَادٍ إِرَمَ ذَاتِ الْعِمَادِ الَّتِي لَمْ يُخْلَقْ مِثْلُهَا فِي الْبِلَادِ﴾ (سورة الفجر: ٦ و٧ و٨). وهذه آيةٌ على عُمارةٍ لم يُخلق مثلها، وذكرها القرآن بعد أن نقل حديثهم عن قوتهم. وقال تعالى: ﴿فَأَمَّا عَادٌ فَاسْتَكْبَرُوا فِي الْأَرْضِ بِغَيْرِ الْحَقِّ وَقَالُوا مَن أَشَدُّ مِنَّا قُوَّةً﴾ (سورة فصلت: ١٥).\u003c/p\u003e\u003cp class=\"ap\"\u003eثم جاء العذاب، وقد حُددَ في الآية بالريح والأيام؛ قال الله تعالى: ﴿وَأَمَّا عَادٌ فَأُهْلِكُوا بِرِيحٍ صَرْصَرٍ عَاتِيَةٍ سَخَّرَهَا عَلَيْهِمْ سَبْعَ لَيَالٍ وَثَمَانِيَةَ أَيَّامٍ حُسُومًا فَتَرَى الْقَوْمَ فِيهَا صَرْعَىٰ كَأَنَّهُمْ أَعْجَازُ نَخْلٍ خَاوِيَةٍ﴾ (سورة الحاقه: ٦ و٧). والعدّاد في الآية مذكور: سبع ليالٍ وثمانية أيام، والوصف بالصور لا بأسبابٍ خارجة عن النصّ.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما صالح عليه السلام فقد أُرسل إلى ثمود؛ قال الله تعالى: ﴿وَإِلَىٰ ثَمُودَ أَخَاهُمْ صَالِحًا قَالَ يَا قَوْمِ اعْبُدُوا اللَّهَ مَا لَكُم مِّنْ إِلَهٍ غَيْرُهُ قَدْ جَاءَتْكُم بَيِّنَةٌ مِّن رَّبِّكُمْ هَذِهِ نَاقَةُ اللَّهِ لَكُمْ آيَةً﴾ (سورة الأعراف: ٧٣). فجاءت دعوته بالتوحيد ثم بذكر البينة، والبينة عندهم هي الناقة المذكورة في الآية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أُمِر قومه بتركها؛ قال الله تعالى: ﴿وَيَا قَوْمِ هَذِهِ نَاقَةُ اللَّهِ لَكُمْ آيَةً فَذَرُوهَا تَأْكُلْ فِي أَرْضِ اللَّهِ وَلَا تَمَسُّوهَا بِسُوءٍ فَيَأْخُذَكُمْ عَذَابٌ قَرِيبٌ﴾ (سورة هود: ٦٤). وفي الآية شرطان: تركها تأكل، وعدم الإيذاء. وقبل ذلك قال لهم: ﴿يَا قَوْمِ أَرَأَيْتُمْ إِن كُنتُ عَلَىٰ بَيِّنَةٍ مِّن رَّبِّي وَآتَانِي مِنْهُ رَحْمَةً فَمَن يَنصُرُنِي مِنَ اللَّهِ إِنْ عَصَيْتُهُ﴾ (سورة هود: ٦٣).\u003c/p\u003e\u003cp class=\"ap\"\u003eثم عقروها؛ قال الله تعالى: ﴿فَعَقَرُوا النَّاقَةَ وَعَتَوْا عَنْ أَمْرِ رَبِّهِمْ وَقَالُوا يَا صَالِحُ ائْتِنَا بِمَا تَعِدُنَا إِن كُنتَ مِنَ الْمُرْسَلِينَ﴾ (سورة الأعراف: ٧٧)، ثم: ﴿فَأَخَذَتْهُمُ الرَّجْفَةُ فَأَصْبَحُوا فِي دَارِهِمْ جَاثِمِينَ﴾ (سورة الأعراف: ٧٨). ولهم في هود: ﴿فَعَقَرُوهَا فَقَالَ تَمَتَّعُوا فِي دَارِكُمْ ثَلَاثَةَ أَيَّامٍ ذَلِكَ وَعْدٌ غَيْرُ مَكْذُوبٍ﴾ (سورة هود: ٦٥). فالعدّاد ثلاثة أيام مذكورٌ في النصّ ثم جاء ما وُعدوا به.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد خُتم أمر كل قوم بما فعلوا؛ فعاد أُهلكوا بالريح الصرصار في أيامٍ محدودة، وثمود أُخذتهم الرجفة في دارهم. والقراءة في الفصلين تسير مع نصّ القرآن دون تأويل سببٍ ولا تاريخٍ ميلاد، ويقتصر القارئ على ما ذُكر: قوةٌ وبطرٌ ثم نقمةٌ فجأة. وهذه هي الصيغة التي يتكرّر بها ذكر الأمم المدمرة في كتاب الله، وهي صيغةٌ لا تُغيَّر بحسب المكان ولا بحسب الحقبة، لأن الدرس فيها عامٌّ لا يخصّ قومًا بعينهم دون أن تُنسب إليهم حوادثهم كما وردت في آيات الله.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eهود وقوم عاد\u003c/h4\u003e\u003cp class=\"ap\"\u003eبدأ هود عليه السلام بقوله: ﴿يَا قَوْمِ اعْبُدُوا اللَّهَ مَا لَكُم مِّنْ إِلَهٍ غَيْرُهُ﴾ (سورة الأعراف: ٦٥)، ووصف ما هم عليه بأنه افتراء. وهذه الجملة تتكرّر في رسائل الأنبياء جميعًا في القرآن، فالمضمون واحد والمبشّر واحد، ولا تُضاف إلى الرسالة حكمةٌ أخرى غير التوحيد وما يتبعه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوصف القرآن قوة عاد بقوله: ﴿إِرَمَ ذَاتِ الْعِمَادِ الَّتِي لَمْ يُخْلَقْ مِثْلُهَا فِي الْبِلَادِ﴾ (سورة الفجر: ٧ و٨)، ثم نقل قولهم: ﴿مَن أَشَدُّ مِنَّا قُوَّةً﴾ (سورة فصلت: ١٥). فالنصّ جمع بين ما آتاههم الله من قوة وبين ما قالوه في أنفسهم، وبين ما رآه لهم الله من صنعٍ لم يُخلق مثله في البلاد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوعُاقِبوا بالريح الصرصار، وحُدد النصّ مدةً لها سبع ليالٍ وثمانية أيام. ولم يذكر القرآن مدينةً معيّنةً لعاد في هذه الآيات، فلا تُثبت ولا تُنكر بغير سندٍ من التنزيل. وهم مذكورون في أكثر من موضع، فيجمع القارئ أطراف القصة من مواضعها كلّها ولا يحصي ما لم يَرِد.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eصالح وقوم ثمود\u003c/h4\u003e\u003cp class=\"ap\"\u003eأُرسل صالح عليه السلام إلى قومه بالتوحيد ثم بالبينة، وقال في الأعراف: ﴿قَدْ جَاءَتْكُم بَيِّنَةٌ مِّن رَّبِّكُمْ هَذِهِ نَاقَةُ اللَّهِ لَكُمْ آيَةً﴾ (سورة الأعراف: ٧٣). فلم تكن الناقة عندهم صنمًا، بل آيةٌ يؤمرون بتركها، وهي مذكورة في هذا الموضع بلفظ الآية لا بوصفٍ يُضاف إليها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد شرط الله لهم شرطين في تركها: أن تأكل في أرض الله، وأن لا تمسّوها بسوء، فإنهم يأخذهم عذاب قريب، وذلك في سورة هود: ﴿وَلَا تَمَسُّوهَا بِسُوءٍ فَيَأْخُذَكُمْ عَذَابٌ قَرِيبٌ﴾ (سورة هود: ٦٤). ولم يذكر القرآن ما إذا كان أكلها منعهم من شيء، فلا يُقدَّر ذلك.\u003c/p\u003e\u003cp class=\"ap\"\u003eواتّخذوا السؤال وسيلةً للتكذيب: ﴿ئَاتِنَا بِمَا تَعِدُنَا إِن كُنتَ مِنَ الْمُرْسَلِينَ﴾ (سورة الأعراف: ٧٧)، وقد سبق ذلك وصفٌ لمناصرتهم حين قال: ﴿مَن يَنصُرُنِي مِنَ اللَّهِ إِنْ عَصَيْتُهُ﴾ (سورة هود: ٦٣). فبان في الطلبين أن المسألة كانت محاولةً لإلحاق الضرر.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eنهاية الأمة وبداية الدرس\u003c/h4\u003e\u003cp class=\"ap\"\u003eأُغرقت عاد بالريح الصرصار، وحُددت المدة سبع ليالٍ وثمانية أيام، ووصِفت الحالة بأن القوم صرعى كأعجاز نخل خاوية، وهذا كله في سورة الحاقه: ﴿فَتَرَى الْقَوْمَ فِيهَا صَرْعَىٰ كَأَنَّهُمْ أَعْجَازُ نَخْلٍ خَاوِيَةٍ﴾ (سورة الحاقه: ٧). والوصف بالصورة لا يحيل على شيء خارج النصّ.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأُخذت ثمود بالرجفة، ووُصفوا بأنهم أصبحوا في دارهم جاثمين، وهذا ورد في سورة الأعراف: ﴿فَأَخَذَتْهُمُ الرَّجْفَةُ فَأَصْبَحُوا فِي دَارِهِمْ جَاثِمِينَ﴾ (سورة الأعراف: ٧٨). ثم ذُكر لهم وعدٌ بثلاثة أيام: ﴿ذَلِكَ وَعْدٌ غَيْرُ مَكْذُوبٍ﴾ (سورة هود: ٦٥).\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد جاءت هاتان القصّتان في مواضع متعددة من القرآن، تُذكر في كل موضع بعض أجزائها دون بعض. وهذه المرة القرآنية ليست اختصارًا لقصةٍ كاملة في موضعها، بل هي أسلوبٌ يُجمَع فيه الدرس من غير تكرارٍ حرفيا، ويبقى للقارئ أن يقرأ المواضع كلّها ليجمع أطرافها. ولا يُقدَّم على هذا الأسلوب تخمينٌ في الموضع أو في الترتيب.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eهود عليه السلام\u003c/b\u003e\u003cspan\u003eأُرسل إلى قوم عاد بالتوحيد، فصفّهم بالمفترى، ثم أُهلكوا بالريح الصرصار سبع ليالٍ وثمانية أيام.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eعاد وقوة البناء\u003c/b\u003e\u003cspan\u003eإرم ذات العماد التي لم يُخلق مثلها في البلاد، ثم نقل القرآن قولهم: من أشدّ منّا قوة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eصالح والنَّاقة\u003c/b\u003e\u003cspan\u003eآيةٌ من الله أُمِر قومه بتركها تأكل وبترك إيذائها، فعقوها فأخذتهم الرجفة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eعدّاد العذاب\u003c/b\u003e\u003cspan\u003eسبع ليالٍ وثمانية أيام لعاد، وثلاثة أيام لثمود قبل النقم، كلٌّ مذكورٌ في نصّ الآية.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالقوم\u003c/th\u003e\u003cth\u003eالنبي\u003c/th\u003e\u003cth\u003eما أهلكهم في النصّ\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eعاد\u003c/td\u003e\u003ctd\u003eهود عليه السلام\u003c/td\u003e\u003ctd\u003eريحٌ صرصرٌ عاتية سبع ليالٍ وثمانية أيام\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eثمود\u003c/td\u003e\u003ctd\u003eصالح عليه السلام\u003c/td\u003e\u003ctd\u003eالرجفة بعد عقر الناقة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eثمود\u003c/td\u003e\u003ctd\u003eصالح عليه السلام\u003c/td\u003e\u003ctd\u003eوعدٌ بثلاثة أيام ثم ما وعدوا\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eعاد\u003c/td\u003e\u003ctd\u003eهود عليه السلام\u003c/td\u003e\u003ctd\u003eالاستكبار في الأرض بغير الحق\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eثمود\u003c/td\u003e\u003ctd\u003eصالح عليه السلام\u003c/td\u003e\u003ctd\u003eالعقر وعتوّ عن أمر ربّهم\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eقال الله تعالى: ﴿وَأَمَّا عَادٌ فَأُهْلِكُوا بِرِيحٍ صَرْصَرٍ عَاتِيَةٍ سَخَّرَهَا عَلَيْهِمْ سَبْعَ لَيَالٍ وَثَمَانِيَةَ أَيَّامٍ حُسُومًا﴾\u003c/p\u003e\u003ccite\u003eالقرآن الكريم — سورة الحاقة، الآية ٦ و٧\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eأُرسل هود إلى قوم عاد وصالح إلى قوم ثمود بالتوحيد وببينةٍ ظاهرة، فكذّبهم الأولون بالاستكبار وعقرت الثانيون الناقة. وأهلك الله كل قومٍ بما ورد في آياته: بالريح الصرصار وبالرجفة، مع تثبيت العدّاد في القرآن أهلًى للاعتبار.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-2","n":"إبراهيم وأبناؤه","ic":"","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-2\" style=\"--c:#8B4513\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🐏\u003c/div\u003e\n      \u003ch2\u003eإبراهيم وأبناؤه\u003c/h2\u003e\n      \u003cp\u003eيضمّ هذا الجزء حكايات إبراهيم عليه السلام: محاجّته قومه بالنجم ثم بالقمر ثم بالشمس، وخلاصه من النار، ثم هجرته إلى البيت الحرام ورفعه القواعد مع ابنه إسماعيل، ثم ذريته من إسحاق ويعقوب عليهما السلام. وقد وُزِّعت هذه القصص في سورٍ متعددة من القرآن، ونحن نجمعها من مواضعها ونذكر رقم كل آية نستشهد بها.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#stars-fire\"\u003eإبراهيم والنجوم والنار\u003c/a\u003e\u003ca href=\"#migration-kabah\"\u003eالهجرة والبيت الحرام\u003c/a\u003e\u003ca href=\"#sons-ibrahim\"\u003eإسماعيل وإسحاق ويعقوب\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"stars-fire","n":"إبراهيم والنجوم والنار","ic":"🔥","part":"إبراهيم وأبناؤه","h":"\u003carticle class=\"ch3\" id=\"stars-fire\" data-toc=\"إبراهيم والنجوم والنار\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eإبراهيم وأبناؤه\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ١ من ٣\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٢\u003ci\u003e.\u003c/i\u003e١\u003c/span\u003e\n            \u003ch3\u003e🔥 إبراهيم والنجوم والنار\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eك\u003c/span\u003eيف حاج إبراهيم عليه السلام قومه في النجوم، وكيف انتهى أمرهم به في النار؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eقال الله تعالى: ﴿وَكَذَلِكَ نُرِي إِبْرَاهِيمَ مَلَكُوتَ السَّمَاوَاتِ وَالْأَرْضِ وَلِيَكُونَ مِنَ الْمُوقِنِينَ﴾ (سورة الأنعام: ٧٥)، ثم فصّل ما أُري بعد ذلك بمراحلٍ متتابعة. فرآى الكواكب فقال: ﴿هَذَا رَبِّي فَلَمَّا أَفَلَ قَالَ لَا أُحِبُّ الْأَفِلِينَ﴾ (سورة الأنعام: ٧٦). والقصة في القرآن قطعٌ مناظرٍ وحكم، لا مجرد رؤيةٍ عابرة. وقد ذكر القرآن هذه المراحل بترتيبها لا يخلط بينها، فلكل واحدةٍ منها حكمٌ خاصٌّ ينتهي به، ثم يتبعها ما بعدها في الآية نفسها. وهذه المراحل لا تحتاج إلى ترتيبٍ من عند المُقرئ ولا إلى تأويلٍ يضيف إلى النصّ ما لم يَرِد فيه.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم انتقل إلى القمر فرآه بازغًا، فقال: ﴿هَذَا رَبِّي فَلَمَّا أَفَلَ قَالَ لَئِن لَّمْ يَهْدِنِي رَبِّي لَأَكُونَنَّ مِنَ الْقَوْمِ الضَّالِّينَ﴾ (سورة الأنعام: ٧٧)، ثم رأى الشمس بازغةً فقال: ﴿هَذَا رَبِّي هَذَا أَكْبَرُ فَلَمَّا أَفَلَتْ قَالَ يَا قَوْمِ إِنِّي بَرِيءٌ مِمَّا تُشْرِكُونَ﴾ (سورة الأنعام: ٧٨). فكل مرحلةٍ انتهت بالزوال، والزوال هو ما أبطلها في نظره لا عظمتها في أول وهلة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوخُتم المسير بالتوحيد خالصًا؛ قال الله تعالى: ﴿إِنِّي وَجَّهْتُ وَجْهِي لِلَّذِي فَطَرَ السَّمَاوَاتِ وَالْأَرْضَ حَنِيفًا وَمَا أَنَا مِنَ الْمُشْرِكِينَ﴾ (سورة الأنعام: ٧٩). وفي الآية تعيينٌ صريح لمَن يُوجَّه إليه الوجه: الخالق الذي فطر السماوات والأرض، لا ما يُرى فيها. وقد وردت في موضع آخر أنه نظر نظرةً في النجوم فقال: ﴿إِنِّي سَقِيمٌ﴾ (سورة الصافات: ٨٨ و٨٩)، وهي الابتداءة التي انتهت إلى هذا الموضع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بدأت المحاجّة بأبيه؛ قال الله تعالى: ﴿وَإِذْ قَالَ إِبْرَاهِيمُ لِأَبِيهِ آزَرَ أَتَتَّخِذُ أَصْنَامًا آلِهَةً إِنِّي أَرَاكَ وَقَوْمَكَ فِي ضَلَالٍ مُّبِينٍ﴾ (سورة الأنعام: ٧٤). فكانت المواجهة مباشرةً ومحدَّدة بالوصف، ولم تكن على وجه الابتداء؛ ثم راح يعرض على قومه ما يعملون به بأنفسهم، فقال: ﴿أَتَعْبُدُونَ مَا تَنْحِتُونَ﴾ (سورة الصفات: ٩٥).\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ردّوا عليه بأن الآلهة تستحق التعظيم، فقال الله تعالى: ﴿قَالُوا ابْنُوا لَهُ بُنْيَانًا فَأَلْقُوهُ فِي الْجَحِيمِ﴾ (سورة الصفات: ٩٧). فلم يجدوا جوابًا للاستدلال، فالتجأوا إلى القوة. وقد ذكر القرآن جوابه لهم وهو يقول: ﴿أَفَتَعْبُدُونَ مِنْ دُونِ اللَّهِ مَا لَا يَنفَعُكُمْ شَيْئًا وَلَا يَضُرُّكُمْ﴾ (سورة الأنبياء: ٦٦) بعد أن قال: ﴿أُفٍّ لَكُمْ وَلِمَا تَعْبُدُونَ مِنْ دُونِ اللَّهِ أَفَلَا تَعْقِلُونَ﴾ (سورة الأنبياء: ٦٧).\u003c/p\u003e\u003cp class=\"ap\"\u003eثم جاء أمرهم بإحراقه؛ قال الله تعالى: ﴿قَالُوا حَرِّقُوهُ وَانصُرُوا آلِهَتَكُمْ إِن كُنتُمْ فَاعِلِينَ﴾ (سورة الأنبياء: ٦٨). وقد ذكر القرآن حادثة النار في آيةٍ واحدة جامعة: ﴿قُلْنَا يَا نَارُ كُونِي بَرْدًا وَسَلَامًا عَلَىٰ إِبْرَاهِيمَ﴾ (سورة الأنبياء: ٦٩). فلم يُفصل في الآية ما قبل الإلقاء ولا ما بعده، ولا يُقدَّر على النصّ ما لم يَرِد فيه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد خُتم أمرهم بالخسارة؛ قال الله تعالى: ﴿وَأَرَادُوا بِهِ كَيْدًا فَجَعَلْنَاهُمُ الْأَخْسَرِينَ﴾ (سورة الأنبياء: ٧٠). وبهذا تنتهي الحكاية بنتيجةٍ واضحة في الآية ذاتها، لا تحتاج إلى تأويل. وقد جمعت هذه القصص بين الحجّة العقلية في النجوم وبين النجاة في النار، فصارت أولى بالاعتبار في قصة إبراهيم عليه السلام. ووردت حادثة النار في القرآن بصيغةٍ قصيرة هي الأمر ثم النتيجة، ولا يُقدَّم عليها سببٌ لم يذكره النصّ ولا يُقدَّر عددٌ لم يَرِد.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالمراحل الثلاث في النجوم\u003c/h4\u003e\u003cp class=\"ap\"\u003eقال الله تعالى: ﴿فَلَمَّا جَنَّ عَلَيْهِ اللَّيْلُ رَأَىٰ كَوْكَبًا قَالَ هَذَا رَبِّي﴾ (سورة الأنعام: ٧٦)، ثم أتبعه بالقمر: ﴿فَلَمَّا رَأَى الْقَمَرَ بَازِغًا قَالَ هَذَا رَبِّي﴾ (سورة الأنعام: ٧٧)، ثم بالشمس: ﴿فَلَمَّا رَأَى الشَّمْسَ بَازِغَةً قَالَ هَذَا رَبِّي هَذَا أَكْبَرُ﴾ (سورة الأنعام: ٧٨). وتلك ثلاث مراحل مرتّبة في النصّ لا تُخلط.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي كل مرحلةٍ حكمٌ صريح بالرفض عند الزوال: الكواكب أفلا لا أحبّ، والقمر لم يهدني ربي، والشمس بريءٌ مما تشركون. وهذه الصيغة الثلاث جوابٌ منطوق به لا تخمينٌ في النفس، وقد وردت كلها في آياتٍ متتابعة من سورة الأنعام، فلم يُنفصل الوصف عن الحكم في أي مرحلةٍ منها، بل جاء الحكم في نفس الآية التي وردت بها الرؤية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد سُبِّق هذا المسير بطلبٍ من إبراهيم أن يرى، وبإرادةٍ من الله بأن يُرى له ملكوت السماوات والأرض. فالمقصود من الرؤية في النصّ هو الاقتناع، لا المتعة، ولهذا انتهى المسير إلى أن قال وجهه لله خالصًا. ولا يُستخرج من هذا المسير حكمٌ على النظر كله، بل يُستخرج منه أن ما زال فهو زائل، وأن الذي لا يزال هو الذي فطر السماوات والأرض.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالحجّة على أبيه وعلى قومه\u003c/h4\u003e\u003cp class=\"ap\"\u003eبدأ إبراهيم عليه السلام بحواره مع أبيه آزر: ﴿أَتَتَّخِذُ أَصْنَامًا آلِهَةً إِنِّي أَرَاكَ وَقَوْمَكَ فِي ضَلَالٍ مُّبِينٍ﴾ (سورة الأنعام: ٧٤). والوصف في الآية ضلالٌ مبين، وهو حكمٌ نزل به الكتاب لا حكمٌ أُضيف من عنديّات المتنبّئين. ولم يبدأ إبراهيم عليه السلام بالتشاؤم ولا بالتقبيح، بل بالسؤال عن الأصنام نفسها وعن مقام أبيه، وهذا ترتيبٌ ظاهر في حوار السورة.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم وسّع الخطاب إلى قومه بالسؤال عن فعلهم: ﴿أَتَعْبُدُونَ مَا تَنْحِتُونَ﴾ (سورة الصفات: ٩٥)، فهي حجّةٌ قائمة على الوصف لا على الحجّة فقط، لأن من يصنع الصنم لا يملك أن ينفعه أو يضرّه. وقد تقدّم منها: ﴿مَا لَا يَنفَعُكُمْ شَيْئًا وَلَا يَضُرُّكُمْ﴾ (سورة الأنبياء: ٦٦). فجاء الاستدلال من جهة الجمود والنحت، ثم جاء من جهة النفع والضرر، وهما وجهان لم يُجِب بهما كلامُهم من أنفسهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ورد في القرآن أنهم استعانوا بالصوت عوضًا عن الحجّة: ﴿أُفٍّ لَكُمْ وَلِمَا تَعْبُدُونَ مِنْ دُونِ اللَّهِ أَفَلَا تَعْقِلُونَ﴾ (سورة الأنبياء: ٦٧). فكان التعجب من قومٍ يعبدون ما لا يضرّ ولا ينفع، ثم جاء ردّهم بأن السؤال لا يُجاب عنه بالقول بل بالفعل.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالنار والنجاة\u003c/h4\u003e\u003cp class=\"ap\"\u003eقال الله تعالى: ﴿قَالُوا حَرِّقُوهُ وَانصُرُوا آلِهَتَكُمْ إِن كُنتُمْ فَاعِلِينَ﴾ (سورة الأنبياء: ٦٨). وهذه جملةٌ قصيرة تبيّن أن الأمر انتقل من المناظرة إلى التهديد بالحرق، وهي الحادثة التي انتهى بها أمر المحاجّة. ولم يذكر القرآن عدداً لمن نفّذ الأمر ولا كمّيةً من الآلة، فيقتصر الناقل على الجملتين المذكورتين.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم جاء أمر النار نفسها؛ قال الله تعالى: ﴿قُلْنَا يَا نَارُ كُونِي بَرْدًا وَسَلَامًا عَلَىٰ إِبْرَاهِيمَ﴾ (سورة الأنبياء: ٦٩). وفي الآية خطابٌ إلى النار، وهو أسلوبٌ قرآنيٌّ يُذكر فيه الفعل في موضعه. ولم يذكر القرآن عدد من أُلقي في النار ولا مدّة بقائه فيها، فلا يُقدَّر على النصّ ما لم يَرِد في الآية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأخبر الله بنتيجة كيدهم: ﴿وَأَرَادُوا بِهِ كَيْدًا فَجَعَلْنَاهُمُ الْأَخْسَرِينَ﴾ (سورة الأنبياء: ٧٠). فالخسارة في الآية عاقبةٌ مذكورة لا تُحصى أسبابها من خارج النصّ، وتُقرأ القصة كما وردت ثم يُردّ علم التفاصيل إلى ما لم يَرِد. وبهذه الجملة تُغلق القصة عند نتيجةٍ واحدة لا عند تفصيلٍ مطوّل.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالنجوم الثلاث\u003c/b\u003e\u003cspan\u003eالكواكب ثم القمر ثم الشمس، كلٌّ رُئي زائلًا، فانتهى المسير إلى الخالق وحده.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالوجه لله\u003c/b\u003e\u003cspan\u003eقال الله تعالى: ﴿إِنِّي وَجَّهْتُ وَجْهِي لِلَّذِي فَطَرَ السَّمَاوَاتِ وَالْأَرْضَ﴾ الأنعام ٧٩.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eحجّة الصنم\u003c/b\u003e\u003cspan\u003eأتعبدون ما تنحتون، وما لا ينفعكم ولا يضرّكم — الصفات ٩٥ والأنبياء ٦٦.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالنار\u003c/b\u003e\u003cspan\u003eأمرٌ لها بأن تكون برداً وسلاما عليه، ثم خسارةٌ لمن أرادوا به كيدهم.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمنظر\u003c/th\u003e\u003cth\u003eما قاله في الآية\u003c/th\u003e\u003cth\u003eالسورة ورقم الآية\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالكواكب\u003c/td\u003e\u003ctd\u003eهذا ربي فلما أفلا قلت لا أحبّ الآفلين\u003c/td\u003e\u003ctd\u003eالأنعام: ٧٦\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالقمر\u003c/td\u003e\u003ctd\u003eهذا ربي فلما أفل قلت لئن لم يهديني\u003c/td\u003e\u003ctd\u003eالأنعام: ٧٧\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالشمس\u003c/td\u003e\u003ctd\u003eهذا ربي هذا أكبر فلما أفلت قلت بريء\u003c/td\u003e\u003ctd\u003eالأنعام: ٧٨\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالنحات\u003c/td\u003e\u003ctd\u003eأتعبدون ما تنحتون\u003c/td\u003e\u003ctd\u003eالصفات: ٩٥\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالنار\u003c/td\u003e\u003ctd\u003eكوني بردا وسلاما على إبراهيم\u003c/td\u003e\u003ctd\u003eالأنبياء: ٦٩\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eقال الله تعالى: ﴿إِنِّي وَجَّهْتُ وَجْهِي لِلَّذِي فَطَرَ السَّمَاوَاتِ وَالْأَرْضَ حَنِيفًا وَمَا أَنَا مِنَ الْمُشْرِكِينَ﴾\u003c/p\u003e\u003ccite\u003eالقرآن الكريم — سورة الأنعام، الآية ٧٩\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eحاج إبراهيم عليه السلام قومه بزوال النجوم الثلاث، فانتهى إلى أن وجهه لله الخالق وحده. ثم واجههم في آلهتهم المنحوتة فردّوا عليه بالإحراق، فأنجاه الله من النار، وجعل كيدهم هو الخسارة التي ذكرها الكتاب.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"migration-kabah","n":"الهجرة والبيت الحرام","ic":"🕋","part":"إبراهيم وأبناؤه","h":"\u003carticle class=\"ch3\" id=\"migration-kabah\" data-toc=\"الهجرة والبيت الحرام\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eإبراهيم وأبناؤه\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٢ من ٣\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٢\u003ci\u003e.\u003c/i\u003e٢\u003c/span\u003e\n            \u003ch3\u003e🕋 الهجرة والبيت الحرام\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eك\u003c/span\u003eيف بوّأ الله إبراهيم موضع البيت، وكيف رفع القواعد مع ابنه إسماعيل؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eقال الله تعالى: ﴿وَإِذْ نُبَوِّئُ لِإِبْرَاهِيمَ مَكَانَ الْبَيْتِ أَلَّا تُشْرِكْ بِي شَيْئًا وَطَهِّرْ بَيْتِيَ لِلطَّائِفِينَ وَالْقَائِمِينَ وَالرُّكَّعِ السُّجُودِ﴾ (سورة الحج: ٢٦). فجاء اختيار المكان بأمرٍ يتبعه شرطان: التوحيد وطهارة البيت. وقد ذُكر المكان ثم ذُكرت ميقاته، فصار البيت ميقاتًا ومناسكًا معاً. ولا يُذكر في الآية مسافةُ سيرٍ ولا زمنُ سفر، فلا يُقدَّر عليه ما لم يَرِد، ويبقى المضمون قائمًا في المكان والميقات والطهارة الثلاثة التي وردت فيها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد وُصف البيت في موضع آخر بوصفٍ يتّسع لكل الناس؛ قال الله تعالى: ﴿إِذْ جَعَلْنَا الْبَيْتَ مَثَابَةً لِلنَّاسِ وَأَمْنًا وَاتَّخَذُوا مِنْ مَقَامِ إِبْرَاهِيمَ مُصَلًّى وَعَهِدْنَا إِلَىٰ إِبْرَاهِيمَ وَإِسْمَاعِيلَ أَنْ طَهِّرَا بَيْتِيَ لِلطَّائِفِينَ وَالْعَاكِفِينَ وَالرُّكَّعِ السُّجُودِ﴾ (سورة البقرة: ١٢٥). وفي الآية بيتٌ ومَقامٌ وطهارةٌ، كلها أمورٌ عباديةٌ مذكورةٌ في آيةٍ واحدة. وقد كُرِّرت الطهارة في هذا الموضع وفي موضع الحج، فصارت الطهارة شرطًا مذكورًا مرارًا لا مرةً واحدة، وصار مَقام إبراهيم موضعًا يُصلّى فيه لا مجرد ذكرى عابرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ورد بناؤه بالصيغة الجامعة؛ قال الله تعالى: ﴿وَإِذْ يَرْفَعُ إِبْرَاهِيمُ الْقَوَاعِدَ مِنَ الْبَيْتِ وَإِسْمَاعِيلُ رَبَّنَا تَقَبَّلْ مِنَّا إِنَّكَ أَنْتَ السَّمِيعُ الْعَلِيمُ﴾ (سورة البقرة: ١٢٧). فذُكِرا معًا في رفع القواعد، وذُكرت التضرّعات في الآية نفسها بجمعٍ لا بتفصيل. ولم يُذكر في الآية عددُ القواعد ولا صفةُ البناء، فلا يُقدَّر على النصّ ما لم يَرِد فيه، ويبقى المعنى مقتصرًا على الرفع والدعاء معًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم جاء دعاؤهما في الآية التالية: ﴿رَبَّنَا وَاجْعَلْنَا مُسْلَمَيْنِ لَكَ وَمِن ذُرِّيَّتِنَا أُمَّةً مُّسْلِمَةً لَكَ وَأَرِنَا مَنَاسِكَنَا وَتُبْ عَلَيْنَا إِنَّكَ أَنْتَ التَّوَّابُ الرَّحِيمُ﴾ (سورة البقرة: ١٢٨). فلم يُطلبا أن يُفتح لهما فتحٌ دون سواهما، بل سألا مِن يُصلح ولايةَ البيت، وسألا إظهار المناسك. ثم قالا: ﴿رَبَّنَا وَابْعَثْ فِيهِمْ رَسُولًا مِّنْهُمْ يَتْلُوا عَلَيْهِمْ آيَاتِكَ وَيُعَلِّمُهُمُ الْكِتَابَ وَالْحِكْمَةَ وَيُزَكِّيهِمْ﴾ (سورة البقرة: ١٢٩).\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد سبق الهجرة دعاءٌ في الموضع الذي نزل به؛ قال الله تعالى: ﴿رَبَّنَا إِنِّي أَسْكَنْتُ مِن ذُرِّيَّتِي بِوَادٍ غَيْرِ ذِي زَرْعٍ عِندَ بَيْتِكَ الْمُحَرَّمِ رَبَّنَا لِيُقِيمُوا الصَّلَاةَ فَاجْعَلْ أَفْئِدَةً مِّنَ النَّاسِ تَهْوِي إِلَيْهِمْ وَارْزُقْهُم مِّنَ الثَّمَرَاتِ لَعَلَّهُمْ يَشْكُرُونَ﴾ (سورة إبراهيم: ٣٧). وفي الآية ذكرُ الوادي وذكرُ بيته المحرم، وذكرُ الصلاة والرزق والشكر، ولا يُذكر في الآية اسمُ من تركه ولا اسمُ المكان.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ربط الله البيت بعموم الناس، فقال: ﴿إِنَّ أَوَّلَ بَيْتٍ وُضِعَ لِلنَّاسِ لَلَّذِي بِبَكَّةَ مُبَارَكًا وَهُدًى لِلْعَالَمِينَ﴾ (سورة آل عمران: ٩٦)، وقال: ﴿وَأَذِّن فِي النَّاسِ بِالْحَجِّ يَأْتُوكَ رِجَالًا وَعَلَىٰ كُلِّ ضَامِرٍ يَأْتِينَ مِنْ كُلِّ فَجٍّ عَمِيقٍ﴾ (سورة الحج: ٢٧). فصار موضعُ الخلافة في الدعوة موضعَ استجابةٍ للأمر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بقي المَقام محفوظًا في المناسك، فقال الله تعالى: ﴿وَاتَّخَذُوا مِنْ مَقَامِ إِبْرَاهِيمَ مُصَلًّى﴾ (سورة البقرة: ١٢٥)، وقال في الصفا والمروة: ﴿إِنَّ الصَّفَا وَالْمَرْوَةَ مِنْ شَعَائِرِ اللَّهِ فَمَنْ حَجَّ الْبَيْتَ أَوِ اعْتَمَرَ فَلَا جُنَاحَ عَلَيْهِ أَنْ يَطَّوَّفَ بِهِمَا﴾ (سورة البقرة: ١٥٨). فجاءت الشعائر كلّها في آياتٍ متتابعة تربط البيت بالتوحيد والمناسك.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eمكان البيت وشرطه\u003c/h4\u003e\u003cp class=\"ap\"\u003eقال الله تعالى: ﴿وَإِذْ نُبَوِّئُ لِإِبْرَاهِيمَ مَكَانَ الْبَيْتِ﴾ (سورة الحج: ٢٦)، فالابتداء بإرادة الله للمكان، ثم شرطان يتبعانه: ألّا يُشرك به شيء، وطهارة البيت للطائفين والقائمين والركع السجود. وهذه التلاتة صفاتٌ لمن يقوم بالبيت، وفيها تعليلٌ لمن يقوم به لا وصفٌ لمن سواهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد وُصف في البقرة بأنه مثابةٌ وأمن، فجمع الوصف بين القرب والطمأنينة: ﴿إِذْ جَعَلْنَا الْبَيْتَ مَثَابَةً لِلنَّاسِ وَأَمْنًا﴾ (سورة البقرة: ١٢٥). ومَثابةٌ في النصّ موضع الرجوع والطمأنينة، ولا يُضاف إليها معنىٌ خارج الآية. وبذلك يصير البيت مرجعًا للناس جميعًا لا موضعًا لجنسٍ دون جنس.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأمّا مَقام إبراهيم فقد ذُكر آيةً منفردة، واتُّخذ مصلًّى، أي موضعًا يُقام فيه صلاة. وهذا الاتّخاذ ورد في الآية نفسها التي وُصف فيها البيت بالطهارة، فهما معاً في آية واحدة لا منفصلين. وقد جرى ذكر البيت والمقام في أكثر من موضع، فكل موضعٍ زاد وصفًا لا ناقض ما قبله.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eرفع القواعد والدعاء\u003c/h4\u003e\u003cp class=\"ap\"\u003eقال الله تعالى: ﴿وَإِذْ يَرْفَعُ إِبْرَاهِيمُ الْقَوَاعِدَ مِنَ الْبَيْتِ وَإِسْمَاعِيلُ﴾ (سورة البقرة: ١٢٧). فلم يُذكر إبراهيم وحده، بل ذُكر إسماعيل معه في الرفع، وهذا كمالٌ في البناء لا نقصٌ في الباري. وقد جاءت الآية بصيغة الماضي الدال على حدوثٍ سابق، فيثبت الفعل ولا يُقدَّر عليه زمانٌ ميلادي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي نفس الآية دعاءٌ موجز: ﴿رَبَّنَا تَقَبَّلْ مِنَّا إِنَّكَ أَنْتَ السَّمِيعُ الْعَلِيمُ﴾. ولم يُطلَب في الدعاء قبولُ شيءٍ بعينه، بل قبول العمل كله مع علم الله به. وقد جاء الدعاء في موضع البناء، فيكون العمل قُبلَ من الله مع اقترانه بالذكر. ولا يُفصل في الآية رفعُ القواعد عن الدعاء، بل جاء الاثنان في جملةٍ واحدة تُقرأ جامعة.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم تبع ذلك دعاءُ الذرّية والمناسك: ﴿وَأَرِنَا مَنَاسِكَنَا وَتُبْ عَلَيْنَا﴾ (سورة البقرة: ١٢٨)، فصار بيتُ الله مقامَ إبراهيم ودعوةَ إبراهيم معًا، ولا يُفصل أحدهما عن الآخر في قراءة الآيات. وقد جاء في آيةٍ واحدة قبولٌ وذرّيةٌ ومناسكُ، وهذه الأمور الثلاثة هي مضمون باب البيت كلّه.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالنفرة والشعائر\u003c/h4\u003e\u003cp class=\"ap\"\u003eدعا إبراهيم له ولمن معه بالهبوط في الوادي غير ذي الزرع، فذكر بيت الله المحرّم، وطلب أن يجعل الله أفئدةً من الناس تهوي إليهم ورزقًا من الثمرات لشكور. وهذا نصٌّ صريح في سورة إبراهيم: ﴿رَبَّنَا إِنِّي أَسْكَنْتُ مِن ذُرِّيَّتِي بِوَادٍ غَيْرِ ذِي زَرْعٍ﴾ (إبراهيم: ٣٧).\u003c/p\u003e\u003cp class=\"ap\"\u003eثم جاء الأمر بنداء الناس للحج في سورة الحج: ﴿وَأَذِّن فِي النَّاسِ بِالْحَجِّ يَأْتُوكَ رِجَالًا﴾ (الحج: ٢٧). فبين صيغة الابتداء بالمكان وصيغة الدعوة للناس يظهر أن البيت خُصّ للناس جميعًا لا لجنسٍ دون جنس. وقد وُصف المجيء إليه بأنهم يأتون رجالًا وعلى كل ضامر من كل فجٍّ عميق، فجاءت الصورة جامعةً عن أوضاع القدوم كلّها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد وردت شعائر البيت في آياتٍ أخرى: المَقام مصلًّى، والصفا والمروة من شعائر الله، والبيت أول بيتٍ وُضع للناس. وهذه الأمور الثلاثة مذكورة في القرآن بأساليب مختلفة ومقاصد واحدة، وهي كُلّها وردت في القرآن بصيغة أمرٍ لا بصيغة رأي. ولا يُزاد على هذه الشعائر حكمٌ خارجي، لأن نصوص البيت في القرآن تسير كلّها في باب العبادة والمناسك دون استدلالٍ فقهيٍّ أو مذهبيّ.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمكانٌ مُبَوَّأ\u003c/b\u003e\u003cspan\u003eبوّأ الله إبراهيم موضع البيت بألا يُشرك به شيء، وأن يُطهر للطائفين والقائمين.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eرفع القواعد\u003c/b\u003e\u003cspan\u003eإبراهيم وإسماعيل معًا رفعا القواعد، ودعاهما: ربّنا تقبل منا إنك السميع العليم.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالوادي غير الزارع\u003c/b\u003e\u003cspan\u003eدعاء إبراهيم بسكنى ذريته عند البيت المحرّم ليقيموا الصلاة ويرزقهم الله من الثمرات.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eبيتٌ للناس\u003c/b\u003e\u003cspan\u003eأول بيتٍ وُضع للناس بركةً وهدى، وأذن فيه للناس بالحج من كل فجٍّ عميق.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالحكم\u003c/th\u003e\u003cth\u003eالنصّ\u003c/th\u003e\u003cth\u003eالسورة ورقم الآية\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eاختيار المكان\u003c/td\u003e\u003ctd\u003eإذ نبوّئ لإبراهيم مكان البيت\u003c/td\u003e\u003ctd\u003eالحج: ٢٦\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eطهارة البيت\u003c/td\u003e\u003ctd\u003eوطهّر بيتي للطائفين والعاكفين\u003c/td\u003e\u003ctd\u003eالبقرة: ١٢٥\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eرفع القواعد\u003c/td\u003e\u003ctd\u003eوإذ يرفع إبراهيم القواعد من البيت وإسماعيل\u003c/td\u003e\u003ctd\u003eالبقرة: ١٢٧\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eطلب قبول العمل\u003c/td\u003e\u003ctd\u003eربّنا تقبل منا إنك أنت السميع العليم\u003c/td\u003e\u003ctd\u003eالبقرة: ١٢٧\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالنفرة والاستسقاء\u003c/td\u003e\u003ctd\u003eربّنا إني أسكت من ذريتي بواد غير ذي زرع\u003c/td\u003e\u003ctd\u003eإبراهيم: ٣٧\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eقال الله تعالى: ﴿وَإِذْ يَرْفَعُ إِبْرَاهِيمُ الْقَوَاعِدَ مِنَ الْبَيْتِ وَإِسْمَاعِيلُ رَبَّنَا تَقَبَّلْ مِنَّا إِنَّكَ أَنْتَ السَّمِيعُ الْعَلِيمُ﴾\u003c/p\u003e\u003ccite\u003eالقرآن الكريم — سورة البقرة، الآية ١٢٧\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eبوّأ الله إبراهيم موضع البيت وأمر بطوهره وتوحيده، فرفع القواعد مع ابنه إسماعيل واستقبل الدعاء بالقبول. ثم صار البيت مثابةً وأمنًا وأول بيتٍ وُضع للناس، وصار مقامه مصلًّى وشعائره مناسكَ تُؤدّى.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"sons-ibrahim","n":"إسماعيل وإسحاق ويعقوب","ic":"🌳","part":"إبراهيم وأبناؤه","h":"\u003carticle class=\"ch3\" id=\"sons-ibrahim\" data-toc=\"إسماعيل وإسحاق ويعقوب\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eإبراهيم وأبناؤه\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٣ من ٣\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٢\u003ci\u003e.\u003c/i\u003e٣\u003c/span\u003e\n            \u003ch3\u003e🌳 إسماعيل وإسحاق ويعقوب\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eم\u003c/span\u003eاذا ورد في القرآن عن إسماعيل وإسحاق ويعقوب عليهم السلام وعن وصية إبراهيم لهم؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eقال الله تعالى: ﴿وَوَهَبْنَا لَهُ إِسْحَقَ وَيَعْقُوبَ نَافِلَةً وَكُلًّا جَعَلْنَا صَالِحِينَ﴾ (سورة الأنبياء: ٧٢)، وقال: ﴿وَوَهَبْنَا لَهُ إِسْحَقَ وَيَعْقُوبَ كُلًّا هَدَيْنَا وَنُوحًا هَدَيْنَا مِن قَبْلُ﴾ (سورة الأنعام: ٨٤). فجاء النعمة بالهداية قبل أن تأتي بالصلاح، وهذا ترتيبٌ ظاهر في الآيتين. وقد وُصِف الاثنان بالصلاح في الأولى وبالهداية في الثانية، فوصفان لا تعارض بينهما في النصّ.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد وُبِّئ إسماعيل في الذكر؛ قال الله تعالى: ﴿وَاذْكُرْ فِي الْكِتَابِ إِسْمَاعِيلَ إِنَّهُ كَانَ صَادِقَ الْوَعْدِ وَكَانَ رَسُولًا نَّبِيًّا﴾ (سورة مريم: ٥٤)، وقال: ﴿و
