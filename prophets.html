e"},{"u":"p","one":true,"id":"part-5","n":"الأنبياء الآخرون","ic":"","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-5\" style=\"--c:#8B4513\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e📜\u003c/div\u003e\n      \u003ch2\u003eالأنبياء الآخرون\u003c/h2\u003e\n      \u003cp\u003eيجمع هذا الجزء ما ورد في القرآن الكريم عن الأنبياء الذين لم يسبق ذكرهم في أجزاء هذا العصر: زكريا ويحيى ومريم، ثم عيسى ابن مريم، ثم مقامَ الرسالات جميعًا وخاتمَ الأنبياء. وقد اقتصرنا في كل قصة على نصّ الآية وعزوها إلى سورتها ورقمها، مع حذف كل ما لم يثبت في كتاب الله.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#zachariah-yahya-mary\"\u003eزكريا ويحيى ومريم\u003c/a\u003e\u003ca href=\"#jesus-mary\"\u003eعيسى ابن مريم\u003c/a\u003e\u003ca href=\"#seal-of-prophets\"\u003eبين الرسالات وخاتمها\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"zachariah-yahya-mary","n":"زكريا ويحيى ومريم","ic":"🕌","part":"الأنبياء الآخرون","h":"\u003carticle class=\"ch3\" id=\"zachariah-yahya-mary\" data-toc=\"زكريا ويحيى ومريم\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالأنبياء الآخرون\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ١ من ٣\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٥\u003ci\u003e.\u003c/i\u003e١\u003c/span\u003e\n            \u003ch3\u003e🕌 زكريا ويحيى ومريم\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eك\u003c/span\u003eيف فُتِحت سورة مريم بدعوة زكريا، وكيف نعت القرآن يحيى ومريم عليهما السلام؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eافتتحت سورة مريم بذكر رحمة ربه لعبدِه زكريا، فقال تعالى: ﴿كَهَيْعَصْ ذِكْرُ رَحْمَتِ رَبِّكَ عَبْدَهُ زَكَرِيَّا إِذْ نَادَىٰ رَبَّهُ نِدَاءً خَفِيًّا قَالَ رَبِّ إِنِّي وَهَنَ الْعَظْمُ مِنِّي وَاشْتَعَلَ الرَّأْسُ شَيْبًا وَلَمْ أُكُن بِدُعَاكَ رَبِّ شَقِيًّا﴾ سورة مريم: الآيات ١ إلى ٤. وقد وصف حاله بوهن العظم واشتعال الرأس شيبًا، وعوّض عن ذلك بما لم يكن يشك فيه: أنه لم يكن في دعائه ربَّه شقيًّا، أي لم يدعه من قبل.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم ذكر الخوفَ الذي حمله على الدعاء، فقال تعالى: ﴿وَإِنِّي خِفْتُ الْمَوَالِيَ مِن وَرَائِيَ وَكَانَتِ امْرَأَتِي عَاقِرًا فَهَبْ لِي مِن لَّدُنكَ وَلِيًّا يَرِثُنِي وَيَرِثُ مِنْ آلِ يَعْقُوبَ وَاجْعَلْهُ رَبِّ رَضِيًّا﴾ سورة مريم: الآيتان ٥ و٦. فبين أن دعاؤه اتُّصل بخوفٍ على ما بعده، وأن امرأته عاقر، وأن طلبه أن يكون وارثًا له ومن آل يعقوب، وأن يجعله ربُّه رضيًّا.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم جاء الردُّ في الآية التالية: ﴿يَا زَكَرِيَّا إِنَّا نُبَشِّرُكَ بِغُلَامٍ اسْمُهُ يَحْيَىٰ لَمْ نَجْعَل لَّهُ مِن قَبْلُ سَمِيًّا﴾ مريم: الآية ٧. فتعجّب فقال: ﴿رَبِّ أَنَّىٰ يَكُونُ لِي غُلَامٌ وَكَانَتِ امْرَأَتِي عَاقِرًا وَقَد بَلَغْتُ مِنَ الْكِبَرِ عِتِيًّا﴾ الآية ٨، فجاء الجواب: ﴿كَذَٰلِكَ قَالَ رَبُّكَ هُوَ عَلَيَّ هَيِّنٌ وَقَدْ خَلَقْتُكَ مِن قَبْلُ وَلَمْ تَكُ شَيْئًا﴾ الآية ٩. وقد ذُكر في الآية خلقُه من غير شيء مقارنةً بخلق الغلام. ثم طلب آيةً فقال: ﴿رَبِّ اجْعَل لِّي آيَةً﴾، فجاء الرد: ﴿آيَتُكَ أَلَّا تُكَلِّمَ النَّاسَ ثَلَاثَ لَيَالٍ سَوِيًّا﴾ مريم: الآية ١٠، ثم قال: ﴿فَخَرَجَ عَلَىٰ قَوْمِهِ مِنَ الْمِحْرَابِ فَأَوْحَىٰ إِلَيْهِمْ أَن سَبِّحُوا بُكْرَةً وَعَشِيًّا﴾ الآية ١١. فكانت الآيةُ سكونُه عن الكلام، وقد خرج بعدها يُوحى إلى قومه بالتسبيح.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد نعت الله يحيى في آيتين متتاليتين، فقال تعالى: ﴿يَا يَحْيَىٰ خُذِ الْكِتَابَ بِقُوَّةٍ وَآتَيْنَاهُ الْحُكْمَ صَبِيًّا وَحَنَانًا مِّن لَّدُنَّا وَزَكَاةً وَكَانَ تَقِيًّا وَبَرًّا بِوَالِدَيْهِ وَلَمْ يَكُن جَبَّارًا عَصِيًّا وَسَلَامٌ عَلَيْهِ يَوْمَ وُلِدَ وَيَوْمَ يَمُوتُ وَيَوْمَ يُبْعَثُ حَيًّا﴾ مريم: الآيات ١٢ إلى ١٥. فجمعت الآيات: أخذَ الكتاب بقوة، والحُكمَ صبيًّا، وحنانًا من الله، وزكاةً، وتقوى، وبرًّا بالوالدين، وسلامًا في ثلاثة أيام.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم فتحت الآيةُ قصةَ مريم بأن خرجت عن أهلها، فقال تعالى: ﴿وَاذْكُرْ فِي الْكِتَابِ مَرْيَمَ إِذِ انتَبَذَتْ مِنْ أَهْلِهَا مَكَانًا شَرْقِيًّا فَاتَّخَذَتْ مِن دُونِهِمْ حِجَابًا فَأَرْسَلْنَا إِلَيْهَا رُوحَنَا فَتَمَثَّلَ لَهَا بَشَرًا سَوِيًّا﴾ مريم: الآيتان ١٦ و١٧. فجاء في الآية: المكانُ الشرقي، والحِجاب، ثم الإرسالُ إلى روحنا، ثم تمثُّلُه لها إنسانًا سويًّا. ثم قال: ﴿قَالَتْ إِنِّي أَعُوذُ بِالرَّحْمَٰنِ مِنكَ إِن كُنتَ تَقِيًّا﴾ الآية ١٨.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم ذُكر جوابه وجدالُها، فقال: ﴿إِنَّمَا أَنَا رَسُولُ رَبِّكِ لِأَهْبَ لَكِ غُلَامًا زَكِيًّا﴾ مريم: الآية ١٩، فتعجّبت: ﴿أَنَّىٰ يَكُونُ لِي غُلَامٌ وَلَمْ يَمْسَسْنِي بَشَرٌ وَلَمْ أَكُ بَغِيًّا﴾ الآية ٢٠، ثم جاء: ﴿كَذَٰلِكِ قَالَ رَبُّكِ هُوَ عَلَيَّ هَيِّنٌ وَلِنَجْعَلَهُ آيَةً لِّلنَّاسِ وَرَحْمَةً مِّنَّا وَكَانَ أَمْرًا مَّقْضِيًّا﴾ الآية ٢١. وقد تكرر في القصتين لفظُ: ﴿هُوَ عَلَيَّ هَيِّنٌ﴾.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد وُضِعت قصّة مريم في آل عمران في إطار الاختيار والتطهير، فقال تعالى: ﴿إِذْ قَالَتِ الْمَلَائِكَةُ يَا مَرْيَمُ إِنَّ اللَّهَ اصْطَفَاكِ وَطَهَّرَكِ وَاصْطَفَاكِ عَلَىٰ نِسَاءِ الْعَالَمِينَ﴾ سورة آل عمران: الآية ٤٢. فجاء الاصطفاءُ مرتين وذُكر التطهيرُ بينهما، وقُرِن بالاختيار على نساء العالمين. وتنتهي هذه المحطات الثلاث بقول الله ممن اصطفى وطهّر.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eدعاء زكريا وطلب الوارث\u003c/h4\u003e\u003cp class=\"ap\"\u003eبدأ دعاؤه بالوصف لا بالطلب: ﴿إِنِّي وَهَنَ الْعَظْمُ مِنِّي وَاشْتَعَلَ الرَّأْسُ شَيْبًا﴾، ثم جاء الاعتذار: ﴿وَلَمْ أُكُن بِدُعَاكَ رَبِّ شَقِيًّا﴾. وقد وقع الوصف بالعظام والرأس في آية واحدة، ثم جاء في الآية التالية سببُ الدعاء: ﴿وَإِنِّي خِفْتُ الْمَوَالِيَ مِن وَرَائِيَ﴾.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ذُكرت حالُ امرأته في دعائه مرتين: ﴿وَكَانَتِ امْرَأَتِي عَاقِرًا﴾، الأولي مع خوفه على من بعده، والثانية في تعجّله من البشارة. ولم يذكر القرآن اسمها ولا عملها ولا قصةً لبيتها، فجاء التفصيل قاصِرًا على ما يتصل بالدعاء. وقد اقترن سببُ الدعاء بوصفِ الحالة في الآيتين، فلم ينفصل الوصفُ عن الطلب، ولم يزدد الكتاب على ذلك بصفةٍ أخرى لبيته ولا لحالها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوجاء طلبه في مرحلتين: أن يكون وارثًا له ومن آل يعقوب، وأن يكون ربُّه رضيًّا. والصفتان في آية واحدة: ﴿يَرِثُنِي وَيَرِثُ مِنْ آلِ يَعْقُوبَ وَاجْعَلْهُ رَبِّ رَضِيًّا﴾. ولم تذكر الآية مدةً بين الدعاء والبشارة ولا مكانًا لوقوعها. وقد جُمع في الطلب بين الوارثِ له والوارثِ من آل يعقوب، فذُكر الوارثُ في لفظ الآية مرتين، ثم خُتمت الجملةُ بالرضا من ربّه.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eبشارة يحيى وصفاته\u003c/h4\u003e\u003cp class=\"ap\"\u003eقال الله: ﴿نُبَشِّرُكَ بِغُلَامٍ اسْمُهُ يَحْيَىٰ لَمْ نَجْعَل لَّهُ مِن قَبْلُ سَمِيًّا﴾، فبدأ الاسمَ ثم نفيَ التسمية قبله. ثم جاء جواب التعجّب: ﴿هُوَ عَلَيَّ هَيِّنٌ وَقَدْ خَلَقْتُكَ مِن قَبْلُ وَلَمْ تَكُ شَيْئًا﴾، فقابله بما قبل الوجود لا بما بعده.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كُلِّف زكريا بالسكوت ثلاث ليالٍ سويًّا، فقال: ﴿آيَتُكَ أَلَّا تُكَلِّمَ النَّاسَ ثَلَاثَ لَيَالٍ سَوِيًّا﴾، فجعل الله سكونَه في الكلام آيةً على صدق البشارة. ثم ذكر خروجه من الحرم: ﴿فَخَرَجَ عَلَىٰ قَوْمِهِ مِنَ الْمِحْرَابِ﴾، فخرج بعد المدة ولم يقل القرآن كيف وصل إليه الخبر ولا من أخبرهم، واقتصر النصّ على الإيحاء بالتسبيح بكرةً وعشيًّا، ولم يزدد على ذلك تفصيلًا لحاله ولا لحالهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأمّا يحيى فقد أُعطى الكتابَ وهو صبي، والحُكمَ وهو صبي، وجاء بعد ذلك ﴿وَحَنَانًا مِّن لَّدُنَّا وَزَكَاةً وَكَانَ تَقِيًّا﴾، ثم ﴿وَبَرًّا بِوَالِدَيْهِ وَلَمْ يَكُن جَبَّارًا عَصِيًّا﴾. وقد ذُكر السلامةُ في ثلاثة أيام: يوم ولد ويوم يموت ويوم يبعث حيًّا.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eمريم والرسول الممثل\u003c/h4\u003e\u003cp class=\"ap\"\u003eذكر القرآن مكانَ انتبائها بأنه موضعٌ شرقي: ﴿إِذِ انتَبَذَتْ مِنْ أَهْلِهَا مَكَانًا شَرْقِيًّا﴾، وأنها اتّخذت من دونهم حجابًا، ثم أرسل الله إليها روحًا فتمثل لها بشراً سويًّا. وقد جاء في الآية ترتيبُ الأحداث: الانتقالُ أولًا، ثم الحجابُ ثانيًا، ثم الإرسالُ ثالثًا، ثم التمثُّلُ رابعًا، ولم يذكر القرآن عددَ الأيام ولا طولَ المكث ولا وصفًا لحالها وقتئذٍ، فجاء النصّ قاصِرًا على هذا الترتيب وحده.\u003c/p\u003e\u003cp class=\"ap\"\u003eفكان ردُّها تعويذًا: ﴿إِنِّي أَعُوذُ بِالرَّحْمَٰنِ مِنكَ إِن كُنتَ تَقِيًّا﴾، وجاء الردُّ: ﴿إِنَّمَا أَنَا رَسُولُ رَبِّكِ﴾، فصار الرسولُ في الجواب راسخًا، ولم تُذكر في الموضع حالةٌ أخرى له. ثم جاءت استغرابُها بثلاث صفات: ﴿وَلَمْ يَمْسَسْنِي بَشَرٌ وَلَمْ أَكُ بَغِيًّا﴾.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم جاء الجواب الثاني: ﴿كَذَٰلِكِ قَالَ رَبُّكِ هُوَ عَلَيَّ هَيِّنٌ وَلِنَجْعَلَهُ آيَةً لِّلنَّاسِ وَرَحْمَةً مِّنَّا وَكَانَ أَمْرًا مَّقْضِيًّا﴾. فذُكرت الآية والرحمةُ ثم خُتم بقوله كان أمرًا مقضيًا، وهي جملةٌ تكررت في قصّة زكريا أيضًا. وقد جاء في آل عمران أن الله اختاها وطهّرها واختارها على نساء العالمين.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eنداء خفي\u003c/b\u003e\u003cspan\u003eنادى زكريا ربَّه نداءً خفيًّا في الحالة التي وصفها بوهن العظم والرأس الشيب.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eآية السكوت\u003c/b\u003e\u003cspan\u003eقال له: آيتك ألا تكلم الناس ثلاث ليالٍ سويًّا، ثم خرج يُوحى إلى قومه بالتسبيح.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eيحيى صبيًّا\u003c/b\u003e\u003cspan\u003eأُعطى الكتاب بقوة والحُكم صبيًّا، وحَنانًا من الله وزكاةً وكان تقيًّا.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمريم مختارة\u003c/b\u003e\u003cspan\u003eقال الله: إني اختبتك وطهرك واختباك على نساء العالمين.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالشخصية\u003c/th\u003e\u003cth\u003eالموضع القرآني\u003c/th\u003e\u003cth\u003eما ورد فيها\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eزكريا عليه السلام\u003c/td\u003e\u003ctd\u003eمريم: الآيات ٣ إلى ٦\u003c/td\u003e\u003ctd\u003eالنداء الخفي ووصف الحال وطلب الوارث\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eزكريا ويحيى\u003c/td\u003e\u003ctd\u003eمريم: الآيات ٧ إلى ١٠\u003c/td\u003e\u003ctd\u003eالبشارة بالغلام والتعجّب وآية السكوت\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eيحيى عليه السلام\u003c/td\u003e\u003ctd\u003eمريم: الآيات ١٢ إلى ١٥\u003c/td\u003e\u003ctd\u003eالكتاب والحُكم والحنان والبر بوالديه\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eمريم عليها السلام\u003c/td\u003e\u003ctd\u003eمريم: الآيتان ١٦ و١٧\u003c/td\u003e\u003ctd\u003eالمكان الشرقي والحجاب وروح الله\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eمريم عليها السلام\u003c/td\u003e\u003ctd\u003eآل عمران: الآية ٤٢\u003c/td\u003e\u003ctd\u003eالاصطفاء والتطهير على نساء العالمين\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eقال الله تعالى: ﴿يَا زَكَرِيَّا إِنَّا نُبَشِّرُكَ بِغُلَامٍ اسْمُهُ يَحْيَىٰ لَمْ نَجْعَل لَّهُ مِن قَبْلُ سَمِيًّا﴾\u003c/p\u003e\u003ccite\u003eالقرآن الكريم — سورة مريم: الآية ٧\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eتبدأ سورة مريم بدعوة زكريا التي بُنِيت على وصف حاله وخوفه على من بعده، فجاءت البشارةُ بيحيى وآيةُ السكوت ثم صفاته في آياتٍ متتابعة. ثم تنتقل القصة إلى مريم التي اختارها الله وطهّرها، وإلى الرسول الذي تمثّل لها بشراً سويًّا ببشارةٍ فيها آيةٌ ورحمةٌ وأمرٌ مقضي.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"jesus-mary","n":"عيسى ابن مريم","ic":"🕊️","part":"الأنبياء الآخرون","h":"\u003carticle class=\"ch3\" id=\"jesus-mary\" data-toc=\"عيسى ابن مريم\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالأنبياء الآخرون\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٢ من ٣\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٥\u003ci\u003e.\u003c/i\u003e٢\u003c/span\u003e\n            \u003ch3\u003e🕊️ عيسى ابن مريم\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eم\u003c/span\u003eا الذي ورد في القرآن عن البشارة بعيسى وولادته وآياته ورفعه؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eبدأ ذكر ولادته في آل عمران بالبشارة، فقال تعالى: ﴿إِذْ قَالَتِ الْمَلَائِكَةُ يَا مَرْيَمُ إِنَّ اللَّهَ يُبَشِّرُكِ بِكَلِمَةٍ مِّنْهُ اسْمُهُ الْمَسِيحُ عِيسَى ابْنُ مَرْيَمَ وَجِيهًا فِي الدُّنْيَا وَالْآخِرَةِ وَمِنَ الْمُقَرَّبِينَ﴾ سورة آل عمران: الآية ٤٥. فسُمِّي بكلمةٍ من الله، ووصِفَ وجيّهًا في الدنيا والآخرة ومن المقربين. ثم جاء جواب سؤالها: ﴿قَالَتْ رَبِّ أَنَّىٰ يَكُونُ لِي وَلَدٌ وَلَمْ يَمْسَسْنِي بَشَرٌ قَالَ كَذَٰلِكِ اللَّهُ يَخْلُقُ مَا يَشَاءُ إِذَا قَضَىٰ أَمْرًا فَإِنَّمَا يَقُولُ لَهُ كُن فَيَكُونُ﴾ الآية ٤٧.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي مريم ذُكرت البشارةُ أيضًا: ﴿وَلِنَجْعَلَهُ آيَةً لِّلنَّاسِ وَرَحْمَةً مِّنَّا وَكَانَ أَمْرًا مَّقْضِيًّا﴾ مريم: الآية ٢١، ثم وُصفت ولادتُه فقال تعالى: ﴿فَأَجَاءَهَا الْمَخَاضُ إِلَىٰ جِذْعِ النَّخْلَةِ قَالَتْ يَا لَيْتَنِي مِتُّ قَبْلَ هَٰذَا وَكُنتُ نَسْيًا مَّنْسِيًّا﴾ الآية ٢٣. ثم جاء نداءُ الله لها: ﴿أَلَّا تَحْزَنِي قَدْ جَعَلَ رَبُّكِ تَحْتَكِ سَرِيًّا وَهُزِّي إِلَيْكِ بِجِذْعِ النَّخْلَةِ تُسَاقِطْ عَلَيْكِ رُطَبًا جَنِيًّا فَكُلِي وَاشْرَبِي وَقَرِّي عَيْنًا﴾ الآيتان ٢٤ و٢٥. ثم أوصاها بما تقول إن رأت بشرًا: ﴿إِنِّي نَذَرْتُ لِلرَّحْمَٰنِ صَوْمًا فَلَنْ أُكَلِّمَ الْيَوْمَ إِنسِيًّا﴾ مريم: الآية ٢٦. فأتت به قومها فتعجّبوا، فقالوا: ﴿يَا مَرْيَمُ لَقَدْ جِئْتِ شَيْئًا فَرِيًّا يَا أُخْتَ هَارُونَ مَا كَانَ أَبُوكِ امْرَأَ سَوْءٍ وَمَا كَانَتْ أُمُّكِ بَغِيًّا فَأَشَارَتْ إِلَيْهِ﴾ الآيات ٢٧ إلى ٢٩.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم كَلَّمهم وهو في المهد، فقال تعالى: ﴿قَالَ إِنِّي عَبْدُ اللَّهِ آتَانِيَ الْكِتَابَ وَجَعَلَنِي نَبِيًّا وَجَعَلَنِي مُبَارَكًا أَيْنَ مَا كُنتُ وَأَوْصَانِي بِالصَّلَاةِ وَالزَّكَاةِ مَا دُمْتُ حَيًّا وَبَرًّا بِوَالِدَتِي وَلَمْ يَجْعَلْنِي جَبَّارًا شَقِيًّا وَالسَّلَامُ عَلَيَّ يَوْمَ وُلِدتُّ وَيَوْمَ أَمُوتُ وَيَوْمَ أُبْعَثُ حَيًّا﴾ مريم: الآيات ٣٠ إلى ٣٣. ثم خُتمت بقوله: ﴿ذَٰلِكَ عِيسَى ابْنُ مَرْيَمَ قَوْلَ الْحَقِّ الَّذِي فِيهِ يَمْتَرُونَ﴾ الآية ٣٤.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأمّا آياته التي أُتي بها إلى بني إسرائيل فقال تعالى: ﴿أَنِّي أَخْلُقُ لَكُم مِّنَ الطِّينِ كَهَيْئَةِ الطَّيْرِ فَأَنفُخُ فِيهِ فَيَكُونُ طَيْرًا بِإِذْنِ اللَّهِ وَأُبْرِئُ الْأَكْمَهَ وَالْأَبْرَصَ وَأُحْيِ الْمَوْتَىٰ بِإِذْنِ اللَّهِ وَأُنَبِّئُكُم بِمَا تَأْكُلُونَ وَمَا تَدَّخِرُونَ فِي بُيُوتِكُمْ﴾ سورة آل عمران: الآية ٤٩. فجاءت الآيات بأربعة أشياء، وقُرِنت جميعًا بإذن الله أو بتبليغٍ منه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي المائدة ذُكرت المائدةُ التي دعا بها، فقال تعالى: ﴿قَالَ عِيسَى ابْنُ مَرْيَمَ اللَّهُمَّ رَبَّنَا أَنزِلْ عَلَيْنَا مَائِدَةً مِّنَ السَّمَاءِ تَكُونُ لَنَا عِيدًا لِّأَوَّلِنَا وَآخِرِنَا وَآيَةً مِّنكَ وَارْزُقْنَا وَأَنتَ خَيْرُ الرَّازِقِينَ﴾ سورة المائدة: الآية ١١٤. وقد بُنِي الدعاء على ثلاثة معانٍ: عيدٌ لأولنا وآخرنا، وآيةٌ من الله، ورزقٌ من خير الرازقين.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم ذكر القرآن رفعَه، فقال تعالى: ﴿إِذْ قَالَ اللَّهُ يَا عِيسَىٰ إِنِّي مُتَوَفِّيكَ وَرَافِعُكَ إِلَيَّ وَمُطَهِّرُكَ مِنَ الَّذِينَ كَفَرُوا﴾ سورة آل عمران: الآية ٥٥، وقال: ﴿بَلْ رَفَعَهُ اللَّهُ إِلَيْهِ وَكَانَ اللَّهُ عَزِيزًا حَكِيمًا﴾ سورة النساء: الآية ١٥٨. وقد وقع في الآيتين معنى الرفع مقرنًا بالوفاة وبالتطهير وبالعزة والحكمة، ولم تذكر الآيتان زمانًا ولا مكانًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بيّن القرآن موضعَه من الرسالة في آيةٍ جامعة، فقال تعالى: ﴿يَا أَهْلَ الْكِتَابِ لَا تَغْلُوا فِي دِينِكُمْ وَلَا تَقُولُوا عَلَى اللَّهِ إِلَّا الْحَقَّ إِنَّمَا الْمَسِيحُ عِيسَى ابْنُ مَرْيَمَ رَسُولُ اللَّهِ وَكَلِمَتُهُ أَلْقَاهَا إِلَىٰ مَرْيَمَ وَرُوحٌ مِّنْهُ﴾ سورة النساء: الآية ١٧١. فجاء في الآية أمرٌ بالوقف ونهيٌ عن القول على الله بغير الحق، ثم بيانُ صفتَيه: رسولُ الله وكلمةُه وروحٌ منه.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالبشارة والولادة\u003c/h4\u003e\u003cp class=\"ap\"\u003eقال الله للملايكة: ﴿يُبَشِّرُكِ بِكَلِمَةٍ مِّنْهُ اسْمُهُ الْمَسِيحُ عِيسَى ابْنُ مَرْيَمَ﴾، فبدأت البشارةُ بالكلمة ثم جاء الاسم ثم جاء الوصف: ﴿وَجِيهًا فِي الدُّنْيَا وَالْآخِرَةِ وَمِنَ الْمُقَرَّبِينَ﴾. وقد ذكرت الآية الابتداءَ من عند الله بقوله: كلمةٌ منه، ثم جاء جوابُ سؤالها أن الله يخلق ما يشاء إذا قضى أمرًا، فكان الجواب قائمًا على مشيئته وحكمته لا على أمرٍ سابق.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم جاء في مريم أن الجواب كان: ﴿كَذَٰلِكِ اللَّهُ يَخْلُقُ مَا يَشَاءُ إِذَا قَضَىٰ أَمْرًا فَإِنَّمَا يَقُولُ لَهُ كُن فَيَكُونُ﴾، وفي الآية نفسها تكرر هذا الجواب في قصّة زكريا. وقد ذكرت الآية الخلقَ والقضاءَ ثم الأمرَ بالكون، من غير تفصيلٍ لزمنٍ ولا مكان.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم جاء وصف الولادة: المخاضُ إلى جذع النخلة، وقولها: ﴿يَا لَيْتَنِي مِتُّ قَبْلَ هَٰذَا﴾، ثم النداءُ: ﴿أَلَّا تَحْزَنِي قَدْ جَعَلَ رَبُّكِ تَحْتَكِ سَرِيًّا﴾، ثم الأمرُ بهزِّ الجذع وأكلِ الرطبِ الجنيّ وشربِه وقرّةِ العين. وقد جاءت هذه الثلاث في ترتيب واحد لا يفصل بينها.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eآياته في المهد وبعده\u003c/h4\u003e\u003cp class=\"ap\"\u003eقال الله: ﴿وَأُنَبِّئُكُم بِمَا تَأْكُلُونَ وَمَا تَدَّخِرُونَ فِي بُيُوتِكُمْ﴾ سورة آل عمران: الآية ٤٩، فكانت الآية الخامسةُ معرفةً بالغيب المتعلق بالبيوت، وهي متصلة بما قبلها بلفظ النبوءة: ﴿وَأُنَبِّئُكُم﴾. ثم خُتمت الآياتُ جميعها بقوله: ﴿إِنَّ فِي ذَٰلِكَ لَآيَةٍ لَّكُمْ إِن كُنتُم مُّؤْمِنِينَ﴾، فكانت القوةُ فيها متوقّفةً على الإيمان، ولم يذكر القرآن عاقبةَ القبول أو الرفض.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي مريم ذُكرت الآيةُ في المهد، فقال: ﴿قَالَ إِنِّي عَبْدُ اللَّهِ آتَانِيَ الْكِتَابَ وَجَعَلَنِي نَبِيًّا﴾، فجاءت الكلماتُ في جملة: عبادتُه لله، ونبوتُه، والبرُّ بوالدته، والسلامُ في ثلاثة أيام. ثم قال: ﴿ذَٰلِكَ عِيسَى ابْنُ مَرْيَمَ قَوْلَ الْحَقِّ الَّذِي فِيهِ يَمْتَرُونَ﴾، فسُمِّيت القصة كلها قولَ الحق الذي فيه يمترعون، ولم يذكر القرآن مَن امترى ولا في أي شيء.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي الآية التي تليها قال: ﴿مَا كَانَ لِلَّهِ أَن يَتَّخَذَ مِن وَلَدٍ سُبْحَانَهُ﴾، فجاء التنزيهُ في نفس الموضع، ثم ﴿إِذَا قَضَىٰ أَمْرًا فَإِنَّمَا يَقُولُ لَهُ كُن فَيَكُونُ﴾. وقد قرِن في الآية التالية وصفُه بقوله: ﴿وَإِنَّ اللَّهَ رَبِّي وَرَبُّكُمْ فَاعْبُدُوهُ﴾، فكان ختامُ القصة دعوةً إلى عبادة الله وحده.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالرفع والموقف من القول فيه\u003c/h4\u003e\u003cp class=\"ap\"\u003eذكر الله وفاته ورفعه في آية واحدة: ﴿إِنِّي مُتَوَفِّيكَ وَرَافِعُكَ إِلَيَّ وَمُطَهِّرُكَ مِنَ الَّذِينَ كَفَرُوا﴾، فثلاثة أفعال: الوفاة، والرفع، والتطهير، جرت جميعها في الخطاب الإلهي له. ثم ذكر في النساء: ﴿بَلْ رَفَعَهُ اللَّهُ إِلَيْهِ وَكَانَ اللَّهُ عَزِيزًا حَكِيمًا﴾، فجاء القصرُ على الرفع بلفظ القلب، وأُقرِن بالعزة والحكمة، ولم تذكر الآيتان يومًا ولا ساعة ولا مكانًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي آل عمران ذكر بعدها وعده بأن يجعل الذين اتبعوه فوق الذين كفروا إلى يوم البعثة، ثم رجوعَ الجميع إلى الله ليحكم بينهم في ما كانوا فيه يختلفون. وقد جاءت الآيات في ترتيبٍ واحد لا يفصل بين الرفع والبعث والحساب، ولم يذكر القرآن تفصيلًا لصفة الرفع ولا موضعَه ولا يومَ وقوعه، فجاء النصّ بالوعد ثم بالرجوع والحكم دون أن يُذكر زمانٌ ولا مكان.\u003c/p\u003e\u003cp class=\"ap\"\u003eأمّا الآية في النساء فقد بدأت بنهيٍ عن التغليط في الدين وعن القول على الله إلا الحق، ثم بيانُ الموضع: رسولُ الله وكلمةُه ألقاها إلى مريم وروحٌ منه، ثم أمرٌ بالإيمان بالله ورسله، ثم نهيٌ عن قول الثلثة، ثم ختمٌ بقوله: ﴿إِنَّمَا اللَّهُ إِلَٰهٌ وَاحِدٌ﴾. وقد جاءت الأركانُ كلها في آيةٍ واحدة مرتبة.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eكلمةٌ منه\u003c/b\u003e\u003cspan\u003eبشّرت الملائكة مريم بكلمةٍ من الله اسمه المسيح عيسى ابن مريم.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eآياته بإذن الله\u003c/b\u003e\u003cspan\u003eخلق الطير من الطين وإبراء الأكمه والأبرص وإحياء الموتى، كلها بإذن الله.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالرفع\u003c/b\u003e\u003cspan\u003eقال الله: إني متوفيك ورافعك إلي ومطهرك من الذين كفروا.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالحق الذي يمترعون\u003c/b\u003e\u003cspan\u003eوصفت الآية قوله بأنه عيسى ابن مريم قول الحق الذي فيه يمترعون.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالموضوع\u003c/th\u003e\u003cth\u003eالموضع القرآني\u003c/th\u003e\u003cth\u003eما ورد فيها\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالبشارة\u003c/td\u003e\u003ctd\u003eآل عمران: الآية ٤٥\u003c/td\u003e\u003ctd\u003eبكلمةٍ منه اسمه المسيح عيسى ابن مريم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالولادة\u003c/td\u003e\u003ctd\u003eمريم: الآيات ٢٣ إلى ٢٥\u003c/td\u003e\u003ctd\u003eجذع النخلة والنداء والرطب الجني\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالكلام في المهد\u003c/td\u003e\u003ctd\u003eمريم: الآيات ٣٠ إلى ٣٣\u003c/td\u003e\u003ctd\u003eعبديتيه ونبوته وبرّه بوالدته والسلام\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالآيات\u003c/td\u003e\u003ctd\u003eآل عمران: الآية ٤٩\u003c/td\u003e\u003ctd\u003eالطائر من الطين والأكمه والأبرص والموتى\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالرفع\u003c/td\u003e\u003ctd\u003eالنساء: الآية ١٥٨\u003c/td\u003e\u003ctd\u003eبل رفعه الله إليه وكان عزيزًا حكيمًا\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eقال الله تعالى: ﴿إِنَّمَا الْمَسِيحُ عِيسَى ابْنُ مَرْيَمَ رَسُولُ اللَّهِ وَكَلِمَتُهُ أَلْقَاهَا إِلَىٰ مَرْيَمَ وَرُوحٌ مِّنْهُ﴾\u003c/p\u003e\u003ccite\u003eالقرآن الكريم — سورة النساء: الآية ١٧١\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eتدور قصّة عيسى ابن مريم في القرآن على البشارة بالكلمة ثم الولادة ثم الكلام في المهد ثم الآيات التي أُتي بها بإذن الله. ثم يأتي موضعُه المبيَّن في الآية التي تنهى عن التغليط فيه، ويعقبه ذكرُ وفاته ورفعه إليه دون تفصيلٍ لزمنٍ ولا مكان.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"seal-of-prophets","n":"بين الرسالات وخاتمها","ic":"📿","part":"الأنبياء الآخرون","h":"\u003carticle class=\"ch3\" id=\"seal-of-prophets\" data-toc=\"بين الرسالات وخاتمها\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eالأنبياء الآخرون\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٣ من ٣\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٥\u003ci\u003e.\u003c/i\u003e٣\u003c/span\u003e\n            \u003ch3\u003e📿 بين الرسالات وخاتمها\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eك\u003c/span\u003eيف عرّف القرآن الرسالاتَ بعضها ببعض، وبماذا وُصف نبينا محمد ﷺ بينها؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eعرّف القرآن مَن أرسلهم الله بأنهم من البشر، فقال تعالى: ﴿وَمَا أَرْسَلْنَا قَبْلَكَ مِنَ الْمُرْسَلِينَ إِلَّا إِنَّهُمْ لَيَأْكُلُونَ الطَّعَامَ وَيَمْشُونَ فِي الْأَسْوَاقِ وَجَعَلْنَا بَعْضَكُمْ لِبَعْضٍ فِتْنَةً أَتَصْبِرُونَ وَكَانَ رَبُّكَ بَصِيرًا﴾ سورة الفرقان: الآية ٢٠. فقد ذُكر في الآية أميران ظاهران: الأكل من الطعام والمشي في الأسواق، ثم ذُكر الابتلاءُ والبصيرةُ من الله به.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بيّن الله أن الرسالة صارت إلى كل أمة، فقال تعالى: ﴿وَلَقَدْ بَعَثْنَا فِي كُلِّ أُمَّةٍ رَّسُولًا أَنِ اعْبُدُوا اللَّهَ وَاجْتَنِبُوا الطَّاغُوتَ فَمِنْهُم مَّنْ هَدَى اللَّهُ وَمِنْهُم مَّنْ حَقَّتْ عَلَيْهِ الضَّلَالَةُ فَسِيرُوا فِي الْأَرْضِ فَانظُرُوا كَيْفَ كَانَ عَاقِبَةُ الْمُكَذِّبِينَ﴾ سورة النحل: الآية ٣٦. فجاءت الرسالةُ موحَّدةً في الواجب، وتعدُّدُ الأمة فيما بعدها. ثم ذكر أن العددَ لا يُحصى كلَّه، فقال تعالى: ﴿وَلَقَدْ أَرْسَلْنَا رُسُلًا مِّن قَبْلِكَ مِنْهُم مَّن قَصَصْنَا عَلَيْكَ وَمِنْهُم مَّن لَّمْ نَقْصُصْ عَلَيْكَ وَمَا كَانَ لِرَسُولٍ أَن يَأْتِيَ بِآيَةٍ إِلَّا بِإِذْنِ اللَّهِ﴾ سورة غافر: الآية ٧٨. فقُصِّ عليهم جزءٌ ولم يُقَصَّ عليهم بعض، وكل آيةٍ بإذن الله.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم بين أن الرسالات تفاوتت في المنزلة، فقال تعالى: ﴿تِلْكَ الرُّسُلُ فَضَّلْنَا بَعْضَهُمْ عَلَىٰ بَعْضٍ مِّنْهُم مَّن كَلَّمَ اللَّهُ وَرَفَعَ بَعْضَهُمْ دَرَجَاتٍ وَآتَيْنَا عِيسَى ابْنَ مَرْيَمَ الْبَيِّنَاتِ وَأَيَّدْنَاهُ بِرُوحِ الْقُدُسِ﴾ سورة البقرة: الآية ٢٥٣. فجمعت الآية الفضلَ والمباينةَ والكلامَ من الله والرفعَ بالدرجات.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد وُضِع النبيون جميعًا تحت ميثاقٍ واحد، فقال تعالى: ﴿وَإِذْ أَخَذْنَا مِنَ النَّبِيِّينَ مِيثَاقَهُمْ وَمِنكَ وَمِن نُّوحٍ وَإِبْرَاهِيمَ وَمُوسَىٰ وَعِيسَى ابْنِ مَرْيَمَ وَأَخَذْنَا مِنْهُم مِّيثَاقًا غَلِيظًا﴾ سورة الأحزاب: الآية ٧. فقد ذُكر الميثاقُ في الآية مرّتين، وذُكر نبينا ﷺ في أول السياق ثم نوح وإبراهيم وموسى وعيسى ابن مريم.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم ذُكر أن الوحيَ كان واحدًا، فقال تعالى: ﴿إِنَّا أَوْحَيْنَا إِلَيْكَ كَمَا أَوْحَيْنَا إِلَىٰ نُوحٍ وَالنَّبِيِّينَ مِن بَعْدِهِ وَأَوْحَيْنَا إِلَىٰ إِبْرَاهِيمَ وَإِسْمَاعِيلَ وَإِسْحَاقَ وَيَعْقُوبَ وَالْأَسْبَاطِ وَعِيسَى وَأَيُّوبَ وَيُونُسَ وَهَارُونَ وَسُلَيْمَانَ وَآتَيْنَا دَاوُدَ زَبُورًا﴾ سورة النساء: الآية ١٦٣. فجاء التواليُ بأسماءٍ متعددة في آيةٍ واحدة بلفظ الوحْي نفسه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأمّا نبينا محمد ﷺ فقد وُصِف بخِتام النبوة، فقال تعالى: ﴿مَا كَانَ مُحَمَّدٌ أَبَا أَحَدٍ مِّن رِّجَالِكُمْ وَلَٰكِن رَّسُولَ اللَّهِ وَخَاتَمَ النَّبِيِّينَ﴾ سورة الأحزاب: الآية ٤٠، وقال: ﴿وَمَا مُحَمَّدٌ إِلَّا رَسُولٌ قَدْ خَلَتْ مِن قَبْلِهِ الرُّسُلُ﴾ سورة آل عمران: الآية ١٤٤. ثم وُصفت رسالته بأنها رحمةٌ للعالمين وبشارةٌ ونذارةٌ للناس جميعًا، فقال تعالى: ﴿وَمَا أَرْسَلْنَاكَ إِلَّا رَحْمَةً لِّلْعَالَمِينَ﴾ سورة الأنبياء: الآية ١٠٧، و﴿وَمَا أَرْسَلْنَاكَ إِلَّا كَافَّةً لِّلنَّاسِ بَشِيرًا وَنَذِيرًا﴾ سورة سبأ: الآية ٢٨.\u003c/p\u003e\u003cp class=\"ap\"\u003eوتنتهي هذه المحطات بدعوةٍ جامعة قالها الله بلفظه: ﴿قُلْ يَا أَيُّهَا النَّاسُ إِنِّي رَسُولُ اللَّهِ إِلَيْكُمْ جَمِيعًا الَّذِي لَهُ مُلْكُ السَّمَاوَاتِ وَالْأَرْضِ لَا إِلَٰهَ إِلَّا هُوَ يُحْيِي وَيُمِيتُ فَآمِنُوا بِاللَّهِ وَرَسُولِهِ النَّبِيِّ الْأُمِّيِّ الَّذِي يُؤْمِنُ بِاللَّهِ وَكَلِمَاتِهِ وَاتَّبِعُوهُ لَعَلَّكُمْ تَهْتَدُونَ﴾ سورة الأعراف: الآية ١٥٨. فجاء في الآية النداءُ للناس جميعًا، والتوحيدُ، والإيمانُ بالرسول، ثم الاتباعُ على أمل الهدى.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالرسل بشرٌّ والرسالة واحدة\u003c/h4\u003e\u003cp class=\"ap\"\u003eقال الله: ﴿إِنَّهُمْ لَيَأْكُلُونَ الطَّعَامَ وَيَمْشُونَ فِي الْأَسْوَاقِ﴾، فوصف رسلَه بوصفِ الحال البشريّة في أمرَين اثنين فقط، ولم يزدد عليهم صفةً ولا نسبًا. ثم قال: ﴿وَجَعَلْنَا بَعْضَكُمْ لِبَعْضٍ فِتْنَةً أَتَصْبِرُونَ وَكَانَ رَبُّكَ بَصِيرًا﴾، فذكر الابتلاءَ في الآية، ثم وصف ربَّه بالبصيرة، وكان سؤالُ الصبر متصلاً بالابتلاء لا منفصلاً عنه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي النحل ذُكرت الرسالةُ بأنها ﴿أَنِ اعْبُدُوا اللَّهَ وَاجْتَنِبُوا الطَّاغُوتَ﴾، فجاء المطلوبُ في أمرَين متصلين: عبادةُ الله واجتنابُ الطاغوت. ثم ذُكرت النتيجةُ في نفس الآية: فمنهم من هدى الله ومنهم من حقّت عليه الضلالة، ثم أُمِر بالسير في الأرض لرؤية عاقبة المكذّبين، فجاء السيرُ ذكرًا لنتيجةٍ في الآية لا أمرًا مقتضىً لطلبٍ جديد، ولم يذكر القرآن عددًا لمن هُدي ولا عددًا لمن ضلّ.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي غافر بيّن أن العددَ لا يُقصَّ كلَّه: ﴿مِنْهُم مَّن قَصَصْنَا عَلَيْكَ وَمِنْهُم مَّن لَّمْ نَقْصُصْ عَلَيْكَ﴾. فصار ما في الكتاب قصةُ جزءٍ مقصوص، وما عداه خارجًا عن هذا الأصل، مع قاعدةٍ جامعة في الآية: ﴿أَن يَأْتِيَ بِآيَةٍ إِلَّا بِإِذْنِ اللَّهِ﴾.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالميثاق وفضل الله\u003c/h4\u003e\u003cp class=\"ap\"\u003eقال الله: ﴿وَإِذْ أَخَذْنَا مِنَ النَّبِيِّينَ مِيثَاقَهُمْ وَمِنكَ﴾، فذُكر نبينا محمدًا ﷺ في صدر السياق، ثم قال: ﴿وَمِن نُّوحٍ وَإِبْرَاهِيمَ وَمُوسَىٰ وَعِيسَى ابْنِ مَرْيَمَ﴾، ثم خُتم بقوله: ﴿وَأَخَذْنَا مِنْهُم مِّيثَاقًا غَلِيظًا﴾. فتكرر لفظُ الميثاق في الآية مرّتين.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي البقرة ذكر الفضلَ فقال: ﴿تِلْكَ الرُّسُلُ فَضَّلْنَا بَعْضَهُمْ عَلَىٰ بَعْضٍ﴾، ثم عدّد ثلاثًا: ﴿مِنْهُم مَّن كَلَّمَ اللَّهُ وَرَفَعَ بَعْضَهُمْ دَرَجَاتٍ وَآتَيْنَا عِيسَى ابْنَ مَرْيَمَ الْبَيِّنَاتِ﴾. وقد ذُكر الفضلُ في الآية في أسلوب الجملة الاسمية المبنية على الفعل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي النساء ذكر الوحْيَ بلفظٍ واحد قاله الله: ﴿كَمَا أَوْحَيْنَا إِلَىٰ نُوحٍ وَالنَّبِيِّينَ مِن بَعْدِهِ﴾، ثم سرد أسماءً في الآية الواحدة: إسماعيل وإسحاق ويعقوب والأسباط وعيسى وأيوب ويونس وهارون وسليمان، وفيهم من وُصف بالكتاب: ﴿وَآتَيْنَا دَاوُدَ زَبُورًا﴾. فلم يذكر في الآية تباعدًا في الأصل وإن تعدّدت الأسماء، ولم يذكر القرآن ترتيبًا زمنيًّا بينها ولا تفصيلًا لحال كل اسم.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eخاتم النبيين ورحمة العالمين\u003c/h4\u003e\u003cp class=\"ap\"\u003eقال الله: ﴿وَلَٰكِن رَّسُولَ اللَّهِ وَخَاتَمَ النَّبِيِّينَ﴾، فجاءت صفةُ الخِتام في آيةٍ تبدأ بنفي أن يكون أباً لأحد من رجالهم. ثم قال في آل عمران: ﴿وَمَا مُحَمَّدٌ إِلَّا رَسُولٌ قَدْ خَلَتْ مِن قَبْلِهِ الرُّسُلُ﴾، فقرن بعثتَه بفني الرسول من قبله.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم وُصفت رسالتُه بأنها ﴿رَحْمَةً لِّلْعَالَمِينَ﴾ في الأنبياء، وبأنها ﴿كَافَّةً لِّلنَّاسِ بَشِيرًا وَنَذِيرًا﴾ في سبأ، فالنِّذارُ والبشارةُ جاءتا في آيةٍ واحدة بلفظ الناس جميعًا. وقد سبق في النحل أن الرسالةَ مبعثرةٌ في كل أمة، وأن الواجبَ فيها واحد.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم جاءت الدعوةُ الجامعة بقوله: ﴿إِنِّي رَسُولُ اللَّهِ إِلَيْكُمْ جَمِيعًا﴾، فنُودي الناسُ جميعًا، وقُدِّم ذكرُ ملكوت السماوات والأرض، ثم نهيٌ عن غير الإلهية، ثم الإيمانُ بالله وبرسوله ثم الاتباعُ. وقد خُتمت الآية بقوله: ﴿لَعَلَّكُمْ تَهْتَدُونَ﴾، وهي الآية التي تختم بها هذه المحطات.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالرسل يأكلون ويمشون\u003c/b\u003e\u003cspan\u003eوصفهم القرآن بأكل الطعام والمشي في الأسواق، وجعل بعضهم فتنةً لبعض.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eفي كل أمة رسول\u003c/b\u003e\u003cspan\u003eقال الله: ولقد بعثنا في كل أمة رسولا أن اعبدوا الله واجتنبوا الطاغوت.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالميثاق الغليظ\u003c/b\u003e\u003cspan\u003eأُخذ من النبيين ميثاقهم ومن نبينا محمد ﷺ ميثاقٌ غليظ مذكور في الأحزاب.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eخاتم النبيين\u003c/b\u003e\u003cspan\u003eقال الله: ولكن رسول الله وخاتم النبيين، وما محمد إلا رسول قد خلت من قبله الرسل.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالدرس\u003c/th\u003e\u003cth\u003eالموضع القرآني\u003c/th\u003e\u003cth\u003eما ورد فيها\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eبشريّة الرسل\u003c/td\u003e\u003ctd\u003eالفرقان: الآية ٢٠\u003c/td\u003e\u003ctd\u003eيأكلون الطعام ويمشون في الأسواق\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eشمول الرسالة\u003c/td\u003e\u003ctd\u003eالنحل: الآية ٣٦\u003c/td\u003e\u003ctd\u003eولقد بعثنا في كل أمة رسولا\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالتفاوت في المنازل\u003c/td\u003e\u003ctd\u003eالبقرة: الآية ٢٥٣\u003c/td\u003e\u003ctd\u003eفضلنا بعضهم على بعض ومنهم من كلم الله\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالميثاق\u003c/td\u003e\u003ctd\u003eالأحزاب: الآية ٧\u003c/td\u003e\u003ctd\u003eأخذنا من النبيين ميثاقهم ميثاقًا غليظًا\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eخاتم النبيين\u003c/td\u003e\u003ctd\u003eالأحزاب: الآية ٤٠\u003c/td\u003e\u003ctd\u003eولكن رسول الله وخاتم النبيين\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eقال الله تعالى: ﴿مَا كَانَ مُحَمَّدٌ أَبَا أَحَدٍ مِّن رِّجَالِكُمْ وَلَٰكِن رَّسُولَ اللَّهِ وَخَاتَمَ النَّبِيِّينَ وَكَانَ اللَّهُ بِكُلِّ شَيْءٍ عَلِيمًا﴾\u003c/p\u003e\u003ccite\u003eالقرآن الكريم — سورة الأحزاب: الآية ٤٠\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eعرّف القرآن الرسالات بعضها ببعض بأنها بشريةٌ موحَّدةٌ في الواجب، جمعت على ميثاقٍ واحد، متفاوتةٍ في المنزلة، مقصوصةٍ وغير مقصوصة. ثم وصف نبينا محمد ﷺ بخِتام النبوة وبأن رسالته رحمةٌ للعالمين وبشارةٌ ونذارةٌ للناس جميعًا.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"f","one":true,"id":"people","n":"أهم الشخصيات","ic":"","part":"","h":"\u003csection class=\"rsec\"\u003e\n      \u003ch2 class=\"sec\"\u003eأهم الشخصيات\u003c/h2\u003e\n      \u003cdiv class=\"people\"\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eآدم عليه السلام\u003c/b\u003e\u003cspan\u003eأوّل الخلق، خُلق من التراب وسجد له الملائكة، وأوّل من نودّي بالتوبة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eنوح عليه السلام\u003c/b\u003e\u003cspan\u003eدعا إلى التوحيد تسع وخمسين ومئة سنة، وأمره الله ببناء السفينة فجاء الطوفان.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eإبراهيم عليه السلام\u003c/b\u003e\u003cspan\u003eأقام الكعبة ودعا إلى التوحيد، وبُشر بإسحاق وإسماعيل فوجّهت الملّة بعده.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eيوسف عليه السلام\u003c/b\u003e\u003cspan\u003eابن يعقوب، ابتلي بالجُبّ حتى بلغ قصر فرعون، ففُضّل علماً وحكماً وأدبَر قومه.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eموسى عليه السلام\u003c/b\u003e\u003cspan\u003eأنقذ بني إسرائيل من فرعون، وأغرقه في البحر، وأنزل عليه التوراة فيها هدى وبشرى.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eعيسى عليه السلام\u003c/b\u003e\u003cspan\u003eابن مريم بلا أب، أُبرئ المرضى بإذن الله، وأنزل عليه الإنجيل، ورُفع ولم يُقتل.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eمحمد بن عبد الله ﷺ\u003c/b\u003e\u003cspan\u003eخاتم النبيين، أُرسل سنة ٦١٠م، وأنزل عليه القرآن، وتوفي سنة ٦٣٢م بالمدينة.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\n    \u003c/section\u003e"},{"u":"f","one":true,"id":"outcomes","n":"النتائج والآثار","ic":"","part":"","h":"\u003csection class=\"rsec\"\u003e\n      \u003ch2 class=\"sec\"\u003eالنتائج والآثار\u003c/h2\u003e\n      \u003cul class=\"outs\"\u003e\u003cli\u003eجاءت كل نبوة تصحيحاً لأمة في فسادها، فكان الأنبياء حلقات متتابعة في رسالة واحدة.\u003c/li\u003e\u003cli\u003eختم النبي محمد ﷺ الرسالة وبيّن أنه خاتم النبيين، فلا نبي بعده شرعاً.\u003c/li\u003e\u003cli\u003eثبت خط التوحيد الواحد في إبراهيم وموسى وعيسى ومحمد ﷺ من غير انقطاع.\u003c/li\u003e\u003cli\u003eصارت قصص الأنبياء مدرسة في الصبر على الابتلاء والشكر عند النعمة.\u003c/li\u003e\u003cli\u003eحفظ القرآن الكريم هذه القصص في سوره، فبقيت معلومة دائمة للأجيال.\u003c/li\u003e\u003c/ul\u003e\n    \u003c/section\u003e"},{"u":"f","one":true,"id":"sources","n":"المصادر والمراجع","ic":"","part":"","h":"\u003cdiv class=\"src frame\" style=\"--c:#8B4513\"\u003e\n    \u003cspan class=\"crn tl\"\u003e\u003csvg viewBox=\"0 0 26 26\"\u003e\n\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\"/\u003e\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\" transform=\"rotate(90 13 13)\" opacity=\".5\"/\u003e\u003c/svg\u003e\u003c/span\u003e\u003cspan class=\"crn tr\"\u003e\u003csvg viewBox=\"0 0 26 26\"\u003e\n\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\"/\u003e\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\" transform=\"rotate(90 13 13)\" opacity=\".5\"/\u003e\u003c/svg\u003e\u003c/span\u003e\u003cspan class=\"crn bl\"\u003e\u003csvg viewBox=\"0 0 26 26\"\u003e\n\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\"/\u003e\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\" transform=\"rotate(90 13 13)\" opacity=\".5\"/\u003e\u003c/svg\u003e\u003c/span\u003e\u003cspan class=\"crn br\"\u003e\u003csvg viewBox=\"0 0 26 26\"\u003e\n\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\"/\u003e\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\" transform=\"rotate(90 13 13)\" opacity=\".5\"/\u003e\u003c/svg\u003e\u003c/span\u003e\n    \u003ch2 class=\"sec\" style=\"margin-top:0\"\u003eالمصادر والمراجع\u003c/h2\u003e\n    \u003cul\u003e\u003cli\u003e\u003ccite\u003eالقرآن الكريم\u003c/cite\u003e — سور القرآن الكريم (مجمع الملك فهد لطباعة المصحف الشريف)\u003c/li\u003e\u003cli\u003e\u003ccite\u003eابن كثير\u003c/cite\u003e — البداية والنهاية (قصص الأنبياء والسير)\u003c/li\u003e\u003cli\u003e\u003ccite\u003eابن هشام\u003c/cite\u003e — السيرة النبوية (المقدمة وفيها نسب النبي ﷺ وقصص الأنبياء)\u003c/li\u003e\u003cli\u003e\u003ccite\u003eالبخاري\u003c/cite\u003e — صحيح البخاري (أحاديث النبوة والشهادة خاتم النبيين)\u003c/li\u003e\u003c/ul\u003e\n  \u003c/div\u003e"},{"u":"f","one":true,"id":"pager","n":"الحقب الأخرى","ic":"","part":"","h":"\u003cnav class=\"pager\"\u003e\n    \u003ca class=\"prev\" href=\"pre-islamic.html\"\u003e\u003csmall\u003e← الحقبة السابقة\u003c/small\u003e\u003cb\u003e🏜️ الجزيرة العربية قبل الإسلام\u003c/b\u003e\u003c/a\u003e\n    \u003ca class=\"next\" href=\"seerah.html\"\u003e\u003csmall\u003eالحقبة التالية →\u003c/small\u003e\u003cb\u003e🌟 محطات من السيرة النبوية\u003c/b\u003e\u003c/a\u003e\n  \u003c/nav\u003e"}]}</script>
<script>
/* ===== موسوعة تاريخ الإسلام — منطق الواجهة + قارئ الكتاب =====
   يعمل على صفحات «الكتاب» (التي تحمل <script id="book">) وبقية الصفحات كما هي. */

/* هل هذه صفحة قارئ؟ يُحدَّد قبل أي تهيئة */
window.__READER__ = !!document.getElementById('book');

(function () {
  'use strict';
  var STORE = 'ti_bookmarks', THEME = 'ti_theme', PROG = 'ti_progress';

  /* ---------- تحويل الأرقام إلى هندية (وقت التشغيل) ---------- */
  function arDigits(s) {
    return String(s == null ? '' : s).replace(/\d/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'[d]; });
  }
  window.arDigits = arDigits;

  /* ---------- الوضع الليلي ---------- */
  function applyTheme(d) {
    document.body.classList.toggle('dark', d);
    var b = document.getElementById('themeBtn');
    if (b) b.textContent = d ? '☀️' : '🌙';
  }
  var th = document.getElementById('themeBtn');
  if (th) th.addEventListener('click', function () {
    var d = !document.body.classList.contains('dark');
    applyTheme(d); localStorage.setItem(THEME, d ? '1' : '0');
  });
  applyTheme(localStorage.getItem(THEME) === '1');

  /* ---------- التقدّم: مشترك بين التمرير والقارئ ---------- */
  function setProgress(id, frac) {
    if (!id || id === 'home') return;
    var pr = JSON.parse(localStorage.getItem(PROG) || '{}');
    if ((pr[id] || 0) < frac) { pr[id] = frac; localStorage.setItem(PROG, JSON.stringify(pr)); }
    if (frac > 0.92) {
      var bm = JSON.parse(localStorage.getItem(STORE) || '[]');
      if (bm.indexOf(id) < 0) {
        bm.push(id); localStorage.setItem(STORE, JSON.stringify(bm));
        if (window.refreshBadges) window.refreshBadges();
      }
    }
  }
  window.__setProgress = setProgress;

  var domeFill = document.querySelector('.dome .fill');
  var topBar = document.querySelector('.topbar i');
  var swordBl = document.querySelector('.sword .bl');
  var swordTx = document.querySelector('.sword span');

  function paintProgress(pct) {
    if (domeFill) domeFill.style.opacity = (0.12 + pct * 0.88).toFixed(2);
    if (topBar) topBar.style.width = Math.round(pct * 100) + '%';
    if (swordBl) swordBl.style.clipPath = 'inset(0 ' + (100 - pct * 100) + '% 0 0)';
    if (swordTx) swordTx.textContent = 'القراءة ' + arDigits(Math.round(pct * 100)) + '٪';
  }
  window.__paintProgress = paintProgress;

  /* ---------- نظام الأوسمة ---------- */
  var BADGES = [
    { id: 'start', ic: '🌱', n: 'نَبتُ الطريق', d: 'ابدأ أول حقبة' },
    { id: 'prophets', ic: '📜', n: 'وسام النبوة', d: 'أنبياء' },
    { id: 'seerah', ic: '🕊️', n: 'وسام الرحمة', d: 'السيرة' },
    { id: 'rashidun', ic: '⚔️', n: 'وسام الفاروق', d: 'الراشدون' },
    { id: 'umayyad', ic: '🏛️', n: 'وسام البناء', d: 'الأمويه' },
    { id: 'andalus', ic: '🏰', n: 'وسام الأندلس', d: 'الأندلس' },
    { id: 'abbasid', ic: '📚', n: 'وسام الفجر', d: 'العباسيه' },
    { id: 'crusades', ic: '🛡️', n: 'وسام حطين', d: 'الصليبيون' },
    { id: 'mamluk', ic: '🐎', n: 'وسام النصر', d: 'المماليك' },
    { id: 'ottoman', ic: '🕌', n: 'وسام السلطان', d: 'العثمانيون' },
    { id: 'civilization', ic: '🔬', n: 'وسام العقل', d: 'الحضاره' },
    { id: 'modern', ic: '🕰️', n: 'وسام التاريخ', d: 'العصر الحديث' },
    { id: 'all', ic: '👑', n: 'تاج المؤرخ', d: 'كل الحقب' }
  ];
  window.refreshBadges = function () {
    var bm = JSON.parse(localStorage.getItem(STORE) || '[]');
    var host = document.getElementById('badges');
    if (!host) return;
    var done = BADGES.filter(function (b) {
      return b.id === 'start' ? bm.length >= 1
        : b.id === 'all' ? bm.length >= 12 : bm.indexOf(b.id) >= 0;
    }).map(function (b) { return b.id; });
    var pct = Math.round(done.length / BADGES.length * 100);
    document.querySelectorAll('#badges .bg').forEach(function (el) {
      el.classList.toggle('on', done.indexOf(el.dataset.b) >= 0);
    });
    var c = document.getElementById('bcnt');
    if (c) c.textContent = arDigits(done.length) + ' من ' + arDigits(BADGES.length);
    var pb = document.getElementById('bprog');
    if (pb) pb.style.width = pct + '%';
  };
  window.refreshBadges();

  /* ---------- إخفاء المفضلة ---------- */
  var f = document.getElementById('favBtn');
  if (f) {
    f.textContent = JSON.parse(localStorage.getItem(STORE) || '[]')
      .indexOf(document.body.dataset.page) >= 0 ? '★' : '☆';
    f.addEventListener('click', function () {
      var id = document.body.dataset.page;
      var bm = JSON.parse(localStorage.getItem(STORE) || '[]');
      var i = bm.indexOf(id);
      i >= 0 ? bm.splice(i, 1) : bm.push(id);
      localStorage.setItem(STORE, JSON.stringify(bm));
      f.textContent = i >= 0 ? '☆' : '★';
    });
  }
})();


/* ==========================================================
   قارئ الكتاب — تقسيم المحتوى إلى صفحات بلا تمرير عمودي
   ========================================================== */
(function () {
  'use strict';
  var dataEl = document.getElementById('book');
  if (!dataEl) return;

  var BOOK;
  try { BOOK = JSON.parse(dataEl.textContent); } catch (e) { return; }

  var PGID = BOOK.id;
  var PADX = 20, PADY = 12, FOOT = 26, GAP = 12;
  var SPREAD = false;   /* وضع الكتاب المفتوح (صفحتان متقابلتان) — يُفعَّل لاحقًا */
  var R = {
    cur: 0, total: 0, pages: [], units: [], chaps: [],
    pageW: 0, pageH: 0, cw: 0, ch: 0, stageW: 0, stageH: 0,
    spread: false, fs: 1, busy: false, dir: 0, drag: null,
    rendered: {}, plan: null, index: null
  };
  window.__R = R; /* مرجع للتشخيص فقط */
  window.__go = function (n) { R.cur = Math.max(0, Math.min(n, R.total - 1)); render(); }; /* لفحص الصفحات */

  var stage, meas, measBody, leaf, leafFront, leafBack, chapEl, progEl, prevBtn, nextBtn;

  /* ---------- أدوات ---------- */
  function arD(s) { return window.arDigits(s); }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  /* ---------- ١) التهيئة ---------- */
  function setup() {
    stage = document.getElementById('rStage');
    if (!stage) return;
    leaf = document.getElementById('rLeaf');
    leafFront = document.getElementById('rFront');
    leafBack = document.getElementById('rBack');
    chapEl = document.getElementById('rBrand');
    progEl = document.getElementById('rProg');
    prevBtn = document.getElementById('rPrev');
    nextBtn = document.getElementById('rNext');

    meas = document.createElement('div');
    meas.className = 'rmeas';
    meas.innerHTML = '<div class="rbody"></div>';
    stage.appendChild(meas);
    measBody = meas.firstChild;

    R.fs = parseFloat(localStorage.getItem('ti_font') || '1') || 1;
    applyFont();

    /* القياس قبل استقرار الخطوط يعطي عدد صفحات مختلفًا في كل تحميل (٢٧٥ / ٢٧٩ / ٢٨١)،
       فنؤجّل أول ترقيم حتى تنتهي محاولة تحميل الخطوط (نجاحًا أو فشلًا). */
    var booted = false;
    function boot() {
      if (booted) return;
      booted = true;

      layout();
      buildUnits();

      var ok = loadPlan();
      if (!ok) { paginate(); savePlan(); }

      var saved = parseInt(localStorage.getItem('ti_pos_' + PGID) || '0', 10);
      R.cur = (saved > 0 && saved <= R.total) ? saved - 1 : 0;

      /* قفزة مباشرة إلى صفحة (للاختبار): seerah.html?p=12 */
      var m = /[?&#]p=(\d+)/.exec(location.href);
      if (m) { var jp = parseInt(m[1], 10); if (jp >= 1 && jp <= R.total) R.cur = jp - 1; }

      render();
      buildPanel();
      wire();
      document.body.classList.add('rready');
    }

    var fontsReady = Promise.resolve();
    if (document.fonts && document.fonts.load) {
      fontsReady = Promise.all([
        document.fonts.load('1em Amiri'),
        document.fonts.load('1em Cairo')
      ]).catch(function () { });
    }
    /* مهلة أمان: لو علِق الطلب لا نُجمّد القارئ */
    var safety = new Promise(function (res) { setTimeout(res, 2500); });
    Promise.race([fontsReady, safety]).then(function () {
      /* نفس طفيف: حتى بعد list/ready قد يحتاج المتصفح لحظة لتطبيق القياسات الجديدة */
      setTimeout(boot, 50);
    });
  }

  function applyFont() {
    document.documentElement.style.fontSize = (16 * R.fs) + 'px';
  }

  /* ---------- ٢) المقاسات ---------- */
  function layout() {
    var r = stage.getBoundingClientRect();
    R.stageW = r.width; R.stageH = r.height;
    R.spread = SPREAD && (window.innerWidth >= 820) && (window.innerWidth > window.innerHeight);
    R.pageW = R.spread ? Math.floor((R.stageW - 24 - GAP) / 2) : Math.min(R.stageW - 16, 700);
    R.pageH = Math.floor(R.stageH - 8);
    R.cw = R.pageW - PADX * 2;
    R.ch = R.pageH - PADY * 2 - FOOT;
    stage.style.setProperty('--pw', R.pageW + 'px');
    stage.style.setProperty('--ph', R.pageH + 'px');
    stage.style.setProperty('--ch', R.ch + 'px');
    meas.style.width = R.cw + 'px';
  }

  /* ---------- ٣) تحويل HTML إلى كتل ---------- */
  function buildUnits() {
    R.units = BOOK.units.map(function (u, ui) {
      var tpl = document.createElement('template');
      tpl.innerHTML = u.h;
      var root = tpl.content.firstElementChild;
      var blocks = u.one ? [root] : Array.prototype.slice.call(root.children)
        .filter(function (el) { return !(el.matches && el.matches('.crn,.orn,.porn,svg')); });
      return { ui: ui, u: u.u, id: u.id, n: u.n, ic: u.ic || '', blocks: blocks };
    });
  }

  /* ---------- ٤) القياس ---------- */
  function measureAll(nodes) {
    measBody.innerHTML = '';
    var fr = document.createDocumentFragment(), i;
    for (i = 0; i < nodes.length; i++) fr.appendChild(nodes[i].cloneNode(true));
    measBody.appendChild(fr);
    measBody.appendChild(document.createElement('div'));
    var kids = measBody.children, n = nodes.length, hs = [];
    for (i = 0; i < n; i++) hs.push(kids[i + 1].offsetTop - kids[i].offsetTop);
    measBody.innerHTML = '';
    return hs;
  }
  function measureOne(node) {
    measBody.innerHTML = '';
    measBody.appendChild(node.cloneNode(true));
    measBody.appendChild(document.createElement('div'));
    var k = measBody.children;
    var h = k[1].offsetTop - k[0].offsetTop;
    measBody.innerHTML = '';
    return h;
  }

  /* ---------- ٥) تصنيف الكتل ---------- */
  function kindOf(el) {
    if (!el) return 'other';
    var t = el.tagName;
    if (t === 'P') return 'tx';
    if (t === 'BLOCKQUOTE') return 'qt';
    if (t === 'UL' || t === 'OL') return 'ls';
    if (el.classList.contains('tblwrap')) return 'tb';
    if (el.classList.contains('kbox')) return 'kb';
    if (el.classList.contains('toc')) return 'toc';
    if (el.classList.contains('res')) return 'tx';
    if (el.classList.contains('people')) return 'ls';
    if (el.classList.contains('toclist')) return 'ls';
    if (el.querySelector && el.querySelector('.toclist,.people,ul,ol')) return 'ls';
    if (t === 'H2' || t === 'H3' || t === 'H4' || t === 'H5') return 'hd';
    return 'other';
  }

  /* الحاوية التي أبناؤها عناصر القائمة (قد تكون داخل إطار) */
  function listHost(el) {
    if (el.matches && el.matches('ul,ol,.people,.toclist')) return el;
    return (el.querySelector && el.querySelector('.toclist,.people,ul,ol')) || el;
  }
  function isHeading(el) {
    if (!el) return false;
    var t = el.tagName;
    if (t === 'H2' || t === 'H3' || t === 'H4' || t === 'H5') return true;
    if (el.classList.contains('ch3-h')) return true;
    return false;
  }

  /* مدى الكتلة القابل للتقسيم: [بداية، نهاية) */
  function rangeOf(el, kind) {
    if (kind === 'tx' || kind === 'qt') return [0, textOf(el).length];
    if (kind === 'ls') return [0, listHost(el).children.length];
    if (kind === 'toc') return [0, tocRows(el).length];
    if (kind === 'tb') return [0, el.querySelectorAll('tbody tr').length];
    if (kind === 'kb') {
      var g = el.querySelector('.kgrid3');
      return [0, g ? g.children.length : 0];
    }
    return [0, 0];
  }

  /* ---------- ٦) نصوص الكتلة ---------- */
  function textOf(el) {
    if (el.tagName === 'BLOCKQUOTE') {
      var p = el.querySelector('p');
      return p ? p.textContent : el.textContent;
    }
    return el.textContent;
  }
  function cloneWithText(el, text, keepDrop) {
    var c = el.cloneNode(true);
    var drop = c.querySelector('.drop');
    var kids = Array.prototype.slice.call(c.childNodes);
    for (var i = 0; i < kids.length; i++) {
      var k = kids[i];
      if (k.nodeType === 3) c.removeChild(k);
      else if (k.nodeType === 1 && !(keepDrop && k === drop)) c.removeChild(k);
    }
    var body = text;
    if (keepDrop && drop) body = text.slice(drop.textContent.length);
    c.appendChild(document.createTextNode(body));
    return c;
  }
  function makeText(el, a, e, keepDrop) {
    if (el.tagName === 'BLOCKQUOTE') {
      var c = el.cloneNode(true);
      var p = c.querySelector('p');
      p.textContent = el.querySelector('p').textContent.slice(a, e);
      var cite = c.querySelector('cite');
      if (cite && a > 0) cite.remove();
      return c;
    }
    return cloneWithText(el, el.textContent.slice(a, e), keepDrop);
  }
  function snapSentence(text, pos) {
    var marks = ['.', '؟', '!', '۔', '،', '؛', ':'];
    for (var i = pos; i > pos - 220 && i > 40; i--) {
      if (marks.indexOf(text[i - 1]) >= 0) return i;
    }
    return pos;
  }

  /* ---------- ٧) تقسيم الكتل ---------- */
  function splitBlock(el, kind, a, e, avail) {
    if (avail < 70) return null;
    if (kind === 'tx' || kind === 'qt') {
      var full = textOf(el);
      /* عتبة منخفضة: كان ٢٤٠/٢٠٠ حرفًا فيترك فراغًا كبيرًا في أسفل الصفحات
         حين تأتي فقرة متوسطة لا تسع كاملة. نسمح بالقسمة ما دامت البقية سطرًا معتبرًا. */
      if (e - a < 90) return null;
      var hasDrop = !!el.querySelector('.drop');
      /* تقدير نسبي ثم تصحيحان على الأكثر — أسرع بكثير من البحث الثنائي على الجوال */
      var span = e - a;
      var fullH = measureOne(el);
      if (!(fullH > avail)) return null;
      var guess = a + Math.max(60, Math.min(span - 60, Math.round(span * (avail / fullH) * 0.97)));
      var best = -1;
      for (var it = 0; it < 3; it++) {
        var h = measureOne(makeText(el, a, guess, a === 0 && hasDrop));
        if (h <= avail) {
          best = guess;
          var room = avail - h;
          if (room < 24) break;
          var step = Math.max(24, Math.round(span * room / fullH));
          if (guess + step > e - 50) break;
          guess += step;
        } else {
          var back = Math.max(24, Math.round(span * (h - avail) / fullH));
          if (guess - back <= a + 50) break;
          guess -= back;
        }
      }
      if (best < 0) return null;
      var cut = snapSentence(full, best);
      if (cut <= a || cut >= e) cut = best;
      /* لا نُبقِي ذيلًا قصيرًا جدًا (سطرًا مبتورًا) ولا رأسًا قصيرًا جدًا */
      if ((cut - a) < 70 || (e - cut) < 50) return null;
      var p1 = makeText(el, a, cut, a === 0 && hasDrop);
      var p2 = makeText(el, cut, e, false);
      return [
        { d: { k: kind === 'qt' ? 'qt' : 'tx', a: a, e: cut, dp: (a === 0 && hasDrop) ? 1 : 0 }, node: p1 },
        { d: { k: kind === 'qt' ? 'qt' : 'tx', a: cut, e: e, dp: 0 }, node: p2 }
      ];
    }
    if (kind === 'tb') return splitTable(el, a, e, avail);
    if (kind === 'ls') return splitList(el, a, e, avail);
    if (kind === 'kb') return splitKbox(el, a, e, avail);
    if (kind === 'toc') return splitToc(el, a, e, avail);
    return null;
  }

  /* جدول: يُقسَّم بالصفوف مع تكرار صف العناوين */
  function splitTable(el, a, e, avail) {
    var rows = el.querySelectorAll('tbody tr');
    if (!rows.length) return null;
    function build(r0, r1) {
      var w = el.cloneNode(true);
      var rs = w.querySelectorAll('tbody tr');
      for (var i = 0; i < rs.length; i++) {
        if (i < r0 || i >= r1) w.querySelector('tbody').removeChild(rs[i]);
      }
      if (r0 > 0) { var cap = w.querySelector('.tblcap'); if (cap) cap.remove(); }
      return w;
    }
    var lo = a + 1, hi = e - 1, best = -1;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      if (measureOne(build(a, mid)) <= avail) { best = mid; lo = mid + 1; } else hi = mid - 1;
    }
    if (best < 0 || best <= a) return null;
    return [
      { d: { k: 'tb', a: a, b: best }, node: build(a, best) },
      { d: { k: 'tb', a: best, b: e }, node: build(best, e) }
    ];
  }

  /* قائمة أو شبكة: تُقسَّم بعناصرها */
  function splitList(el, a, e, avail) {
    var host = listHost(el);
    var kids = host.children;
    if (kids.length < 3) return null;
    function build(c0, c1) {
      var c = el.cloneNode(true);
      var h = listHost(c);
      var ch = Array.prototype.slice.call(h.children);
      for (var i = 0; i < ch.length; i++) if (i < c0 || i >= c1) h.removeChild(ch[i]);
      return c;
    }
    var lo = a + 1, hi = e - 1, best = -1;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      if (measureOne(build(a, mid)) <= avail) { best = mid; lo = mid + 1; } else hi = mid - 1;
    }
    if (best < 0 || best <= a) return null;
    return [
      { d: { k: 'ls', a: a, b: best }, node: build(a, best) },
      { d: { k: 'ls', a: best, b: e }, node: build(best, e) }
    ];
  }

  /* فهرس الفصول: يُقسَّم بالصفوف، مع تكرار عنوان القسم في الصفحة التالية */
  function tocRows(el) {
    var host = listHost(el), rows = [];
    Array.prototype.slice.call(host.children).forEach(function (li) {
      var ul = (li.classList && li.classList.contains('toc-part')) ? li.querySelector('ul') : null;
      if (ul) {
        rows.push({ kind: 'p', node: li });
        Array.prototype.slice.call(ul.children).forEach(function (c) { rows.push({ kind: 'c', node: c }); });
      } else rows.push({ kind: 'c', node: li });
    });
    return rows;
  }
  function buildToc(el, a, b) {
    var rows = tocRows(el);
    var w = el.cloneNode(true);
    var host = listHost(w);
    host.innerHTML = '';
    var start = a, k;
    /* إن بدأت الصفحة بفصلٍ بعيد عن عنوان قسمه، أعد العنوان معه */
    if (start > 0 && rows[start] && rows[start].kind === 'c') {
      for (k = start - 1; k >= 0; k--) if (rows[k].kind === 'p') { start = k; break; }
    }
    var curUl = null;
    for (var i = start; i < b; i++) {
      var r = rows[i];
      if (r.kind === 'p') {
        var li = r.node.cloneNode(true);
        var ul = li.querySelector('ul');
        if (ul) ul.innerHTML = '';
        curUl = ul;
        host.appendChild(li);
      } else {
        if (!curUl) {
          curUl = document.createElement('ul');
          var holder = document.createElement('li');
          holder.className = 'toc-part toc-cont';
          holder.appendChild(curUl);
          host.appendChild(holder);
        }
        curUl.appendChild(r.node.cloneNode(true));
      }
    }
    return w;
  }
  function splitToc(el, a, e, avail) {
    var rows = tocRows(el);
    var lo = a + 1, hi = e - 1, best = -1;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      if (measureOne(buildToc(el, a, mid)) <= avail) { best = mid; lo = mid + 1; } else hi = mid - 1;
    }
    if (best < 0 || best <= a) return null;
    /* لا تترك عنوان قسم وحده في آخر الصفحة بلا فصول */
    while (best > a + 1 && rows[best - 1] && rows[best - 1].kind === 'p') best--;
    return [
      { d: { k: 'toc', a: a, b: best }, node: buildToc(el, a, best) },
      { d: { k: 'toc', a: best, b: e }, node: buildToc(el, best, e) }
    ];
  }

  /* شبكة البطاقات */
  function splitKbox(el, a, e, avail) {
    var grid = el.querySelector('.kgrid3');
    if (!grid) return null;
    var cards = grid.children;
    if (cards.length < 3) return null;
    function build(c0, c1) {
      var k = el.cloneNode(true);
      var g = k.querySelector('.kgrid3');
      var ch = Array.prototype.slice.call(g.children);
      for (var i = 0; i < ch.length; i++) if (i < c0 || i >= c1) g.removeChild(ch[i]);
      if (c0 > 0) { var t = k.querySelector('.bt'); if (t) t.remove(); }
      return k;
    }
    var lo = a + 1, hi = e - 1, best = -1;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      if (measureOne(build(a, mid)) <= avail) { best = mid; lo = mid + 1; } else hi = mid - 1;
    }
    if (best < 0 || best <= a) return null;
    return [
      { d: { k: 'kb', a: a, b: best }, node: build(a, best) },
      { d: { k: 'kb', a: best, b: e }, node: build(best, e) }
    ];
  }

  /* ---------- ٨) بناء كتلة من واصف (لاسترجاع الخطة) ---------- */
  function buildNode(u, b, d) {
    var el = R.units[u].blocks[b];
    if (d.k === 'tx' || d.k === 'qt') return makeText(el, d.a, d.e, !!d.dp);
    if (d.k === 'tb') {
      var w = el.cloneNode(true);
      var rs = w.querySelectorAll('tbody tr');
      for (var i = 0; i < rs.length; i++) if (i < d.a || i >= d.b) w.querySelector('tbody').removeChild(rs[i]);
      if (d.a > 0) { var cap = w.querySelector('.tblcap'); if (cap) cap.remove(); }
      return w;
    }
    if (d.k === 'ls') {
      var c = el.cloneNode(true);
      var h = listHost(c);
      var ch = Array.prototype.slice.call(h.children);
      for (var j = 0; j < ch.length; j++) if (j < d.a || j >= d.b) h.removeChild(ch[j]);
      return c;
    }
    if (d.k === 'kb') {
      var k = el.cloneNode(true);
      var g = k.querySelector('.kgrid3');
      if (g) {
        var gc = Array.prototype.slice.call(g.children);
        for (var q = 0; q < gc.length; q++) if (q < d.a || q >= d.b) g.removeChild(gc[q]);
      }
      if (d.a > 0) { var tt = k.querySelector('.bt'); if (tt) tt.remove(); }
      return k;
    }
    if (d.k === 'toc') return buildToc(el, d.a, d.b);
    return el;
  }

  /* ---------- ٩) الترقيم ---------- */
  function paginate() {
    var pages = [], cur = { items: [], ch: '' }, curH = 0;
    R.chaps = []; R.partPages = {};

    function flush() {
      if (cur.items.length) pages.push(cur);
      cur = { items: [], ch: cur.ch }; curH = 0;
    }
    function add(u, b, d, node) { cur.items.push({ u: u, b: b, d: d, node: node }); curH += measureOne(node); }

    for (var ui = 0; ui < R.units.length; ui++) {
      var unit = R.units[ui];
      flush();
      cur.ch = unit.n;
      if (unit.u === 'c') R.chaps.push({ id: unit.id, n: unit.n, ic: unit.ic, page: pages.length + 1 });
      if (unit.u === 'p') R.partPages[unit.id] = pages.length + 1;

      var hs = measureAll(unit.blocks);
      var q = [], i;
      for (i = 0; i < unit.blocks.length; i++) {
        var k = kindOf(unit.blocks[i]);
        var rg = rangeOf(unit.blocks[i], k);
        q.push({ b: i, orig: unit.blocks[i], node: unit.blocks[i], h: hs[i], d: null, a: rg[0], e: rg[1], kind: k });
      }
      var qi = 0;
      while (qi < q.length) {
        var it = q[qi];

        /* عنوان: لا يبقى وحيدًا في آخر صفحة */
        if (isHeading(it.node) && cur.items.length) {
          var nx = q[qi + 1];
          var nh = nx ? Math.min(nx.h, 100) : 0;
          if (curH + it.h + nh > R.ch) { flush(); cur.ch = unit.n; continue; }
        }

        if (curH + it.h <= R.ch) {
          /* it.d موجود إذا كان هذا الجزء بقية كتلة قُسِّمت: نحفظ وصفه لا 'full'
             وإلا أعاد بناءُ الخطة عند التحميل التالي الكتلةَ كاملة (تكرار النص) */
          cur.items.push({ u: ui, b: it.b, d: it.d || { k: 'full' }, node: it.node });
          curH += it.h; qi++; continue;
        }

        /* لا يسع: قسّم إن أمكن */
        if (cur.items.length) {
          var sp = splitBlock(it.orig, it.kind, it.a, it.e, R.ch - curH);
          if (sp) {
            cur.items.push({ u: ui, b: it.b, d: sp[0].d, node: sp[0].node });
            flush(); cur.ch = unit.n;
            q[qi] = { b: it.b, orig: it.orig, node: sp[1].node, h: measureOne(sp[1].node),
              d: sp[1].d, a: sp[1].d.a, e: (sp[1].d.e !== undefined ? sp[1].d.e : sp[1].d.b), kind: it.kind };
            continue;
          }
          flush(); cur.ch = unit.n; continue;
        }

        /* صفحة فارغة ولا زال لا يسع */
        var sp2 = splitBlock(it.orig, it.kind, it.a, it.e, R.ch);
        if (sp2) {
          cur.items.push({ u: ui, b: it.b, d: sp2[0].d, node: sp2[0].node });
          flush(); cur.ch = unit.n;
          q[qi] = { b: it.b, orig: it.orig, node: sp2[1].node, h: measureOne(sp2[1].node),
            d: sp2[1].d, a: sp2[1].d.a, e: (sp2[1].d.e !== undefined ? sp2[1].d.e : sp2[1].d.b), kind: it.kind };
          continue;
        }
        cur.items.push({ u: ui, b: it.b, d: { k: 'full' }, node: it.node });
        curH += it.h; qi++;
      }
    }
    flush();

    R.pages = pages;
    R.total = pages.length;
    R.plan = {
      v: 7, w: R.cw, h: R.ch, fs: R.fs, spread: R.spread,
      sig: R.units.length + ':' + R.units.reduce(function (a, u) { return a + u.blocks.length; }, 0),
      chaps: R.chaps,
      pages: pages.map(function (p) {
        return { ch: p.ch, items: p.items.map(function (it) { return { u: it.u, b: it.b, d: it.d }; }) };
      })
    };
  }

  /* ---------- ١٠) الخطة المخزَّنة ---------- */
  function planKey() { return 'ti_plan_' + PGID + '_' + R.cw + 'x' + R.ch + '_' + R.fs; }
  function loadPlan() {
    try {
      var raw = localStorage.getItem(planKey());
      if (!raw) return false;
      var pl = JSON.parse(raw);
      if (!pl || pl.v !== 7 || (pl.pages.length !== undefined && !pl.pages.length)) return false;
      /* بصمة المحتوى: إذا تغيّر عدد الوحدات أو الكتل فالخطة قديمة ولا تصلح */
      var sig = R.units.length + ':' + R.units.reduce(function (a, u) { return a + u.blocks.length; }, 0);
      if (pl.sig !== sig) return false;
      R.chaps = pl.chaps || [];
      R.pages = pl.pages.map(function (p) {
        return {
          ch: p.ch,
          items: p.items.map(function (it) {
            return { u: it.u, b: it.b, d: it.d, node: buildNode(it.u, it.b, it.d) };
          })
        };
      });
      R.total = R.pages.length;
      R.plan = pl;
      return R.total > 0;
    } catch (e) { return false; }
  }
  function savePlan() {
    if (!R.plan) return;
    try { localStorage.setItem(planKey(), JSON.stringify(R.plan)); }
    catch (e) { /* المساحة ممتلئة: تجاهل */ }
  }

  /* ---------- ١١) العرض ---------- */
  function mountPage(n) {
    if (R.rendered[n]) return R.rendered[n];
    var el = document.createElement('div');
    el.className = 'rpage';
    el.setAttribute('data-n', n);
    var body = document.createElement('div');
    body.className = 'rbody';
    var foot = document.createElement('div');
    foot.className = 'rpfoot';
    /* عزل LTR: نضع كل جزء في عنصر مستقل حتى لا يعيد bidi ترتيب «صفحة/إجمالي» */
    var fcur = document.createElement('span');
    fcur.textContent = arD(n + 1);
    var fsep = document.createElement('span');
    fsep.textContent = ' / ';
    var ftot = document.createElement('span');
    ftot.textContent = arD(R.total);
    foot.appendChild(fcur); foot.appendChild(fsep); foot.appendChild(ftot);
    el.appendChild(body); el.appendChild(foot);
    R.pages[n].items.forEach(function (it) {
      if (it.node.getAttribute) {
        it.node.setAttribute('data-u', it.u);
        it.node.setAttribute('data-b', it.b);
      }
      body.appendChild(it.node);
    });
    place(el, n);
    stage.appendChild(el);
    /* كتلة واحدة أطول من الصفحة ولا تُقسَّم (كالغلاف): اسمح بالتمرير داخلها فقط */
    if (body.scrollHeight > body.clientHeight + 4 && R.pages[n].items.length === 1) body.classList.add('rflow');
    R.rendered[n] = el;
    return el;
  }
  function place(el, n) {
    var x;
    if (R.spread) x = (n % 2 === 0) ? (R.stageW - R.pageW - 10) : 10;
    else x = Math.round((R.stageW - R.pageW) / 2);
    el.style.left = x + 'px';
    el.style.top = '4px';
    el.style.width = R.pageW + 'px';
    el.style.height = R.pageH + 'px';
  }
  function unmountAll() {
    for (var k in R.rendered) {
      var el = R.rendered[k];
      if (el && el.parentNode) el.parentNode.removeChild(el);
    }
    R.rendered = {};
  }
  /* أرقام صفحات الفهرس تُحسب وقت التشغيل */
  function fillToc() {
    var links = document.querySelectorAll('.toclist a[href^="#"]');
    if (!links.length) return;
    var map = {}, k;
    for (k in (R.partPages || {})) map[k] = R.partPages[k];
    R.chaps.forEach(function (c) { map[c.id] = c.page; });
    for (var i = 0; i < links.length; i++) {
      var id = links[i].getAttribute('href').slice(1);
      var pg = map[id];
      if (!pg) continue;
      var s = links[i].querySelector('.tpg');
      if (!s) { s = document.createElement('span'); s.className = 'tpg'; links[i].appendChild(s); }
      s.textContent = arD(pg);
    }
  }

  function refreshPanel() {
    var list = document.getElementById('rPlist');
    if (!list) return;
    list.innerHTML = '';
    R.chaps.forEach(function (c) {
      var a = document.createElement('a');
      a.className = 'rpitem';
      a.href = 'javascript:void(0)';
      a.innerHTML = '<i>' + arD(c.page) + '</i><span>' + (c.ic ? c.ic + ' ' : '') + c.n + '</span>';
      a.addEventListener('click', function () { closePanel(); goto(c.page - 1); });
      list.appendChild(a);
    });
  }

  function render() {
    unmountAll();
    var from = Math.max(0, R.cur - 2), to = Math.min(R.total - 1, R.cur + 2);
    for (var i = from; i <= to; i++) {
      var el = mountPage(i);
      el.style.visibility = (i === R.cur) ? 'visible' : 'hidden';
      el.style.zIndex = (i === R.cur) ? 3 : 1;
    }
    updateChrome();
    fillToc();
    refreshPanel();
    checkOverflow();
  }

  /* إن تجاوز المحتوى حدود الصفحة: أعد الترقيم بقياس جديد، ثم قلّل الارتفاع إن لزم.
     الحد الأقصى محاولتين ثم توقّف — وإلا دارت الحلقة بلا نهاية عند كتلة لا تُقسَّم. */
  function checkOverflow() {
    if (R.checking) return;
    var over = 0;
    for (var k in R.rendered) {
      var b = R.rendered[k].querySelector('.rbody');
      if (!b || b.classList.contains('rflow')) continue;
      /* قِس آخر عنصر فعليًا: الهوامش الختامية لا تُحتسب فيضًا */
      var last = b.lastElementChild;
      if (!last) continue;
      var d = Math.round(last.getBoundingClientRect().bottom - b.getBoundingClientRect().bottom);
      if (d > 2) over = Math.max(over, d);   /* تسامح ٢بك: نزول الحروف العربية تحت السطر */
    }
    if (over <= 2) return;
    if (R.ovN >= 3 || R.ch <= 142) return;
    R.ovN = (R.ovN || 0) + 1;
    R.checking = true;
    /* قلّل ارتفاع العمود بقدر الفيض وأعد الترقيم: القياس النظري أقلّ من الواقع بعد استقرار الخط */
    R.ch = Math.max(142, R.ch - Math.min(30, over + 4));
    R.refixed = true;
    paginate(); savePlan();
    R.checking = false;
    R.cur = Math.min(R.cur, R.total - 1);
    setTimeout(render, 0);
  }

  function repaginate() {
    var keep = R.cur;
    paginate();
    savePlan();
    R.cur = Math.min(keep, R.total - 1);
    render();
  }

  function updateChrome() {
    var fr = R.total ? (R.cur + 1) / R.total : 0;
    document.body.setAttribute('data-dbg', 'cur=' + R.cur + ' total=' + R.total +
      ' rendered=' + Object.keys(R.rendered).join(',') + ' busy=' + R.busy +
      ' pages=' + R.pages.length + ' ch=' + R.ch);
    if (progEl) progEl.style.width = Math.round(fr * 100) + '%';
    if (chapEl) chapEl.textContent = (R.pages[R.cur] && R.pages[R.cur].ch) || BOOK.n;
    if (window.__paintProgress) window.__paintProgress(fr);
    if (window.__setProgress) window.__setProgress(PGID, fr);
    try { localStorage.setItem('ti_pos_' + PGID, String(R.cur + 1)); } catch (e) { }
    if (prevBtn) prevBtn.disabled = (R.cur <= 0);
    if (nextBtn) nextBtn.disabled = (R.cur >= R.total - 1);
    var st = document.querySelector('[data-stat="pages"]');
    if (st) st.textContent = arD(R.total);
  }

  /* ---------- ١٢) الانتقال ---------- */
  function goto(n, hl) {
    n = clamp(n, 0, R.total - 1);
    if (n === R.cur && !hl) { return; }
    R.cur = n;
    render();
    if (hl) setTimeout(function () { highlightPage(n, hl); }, 30);
  }

  /* ---------- ١٣) التقليب ---------- */
  function startFlip(dir) {
    if (R.busy) return false;
    var dest = R.cur + dir;
    if (dest < 0 || dest >= R.total) return false;
    R.busy = true; R.dir = dir;

    var destEl = mountPage(dest);
    var curEl = R.rendered[R.cur];
    leafFront.innerHTML = curEl ? curEl.querySelector('.rbody').innerHTML : '';
    leafBack.innerHTML = '';
    var x = Math.round((R.stageW - R.pageW) / 2);
    leaf.style.width = R.pageW + 'px';
    leaf.style.height = R.pageH + 'px';
    leaf.style.left = x + 'px';
    leaf.style.top = '4px';
    leaf.style.transformOrigin = dir > 0 ? 'right center' : 'left center';
    leaf.style.transition = 'none';
    leaf.style.transform = 'rotateY(0deg)';
    leaf.classList.toggle('prev', dir < 0);
    leaf.classList.add('on');
    if (curEl) { curEl.style.visibility = 'hidden'; curEl.style.zIndex = 1; }
    destEl.style.visibility = 'visible';
    destEl.style.zIndex = 2;
    return true;
  }
  function setAngle(deg) {
    leaf.style.transition = 'none';
    leaf.style.transform = 'rotateY(' + deg + 'deg)';
    var a = Math.abs(deg) / 180;
    leaf.style.setProperty('--a', a.toFixed(3));
  }
  /* زمن التقليب: أبطأ وأثقل حتى لا يمرّ الفصل مرورًا خاطفًا */
  var FLIP_MS = 620, FLIP_BACK_MS = 360;
  function commitFlip() {
    leaf.style.transition = 'transform ' + (FLIP_MS / 1000) + 's cubic-bezier(.30,.62,.28,1)';
    leaf.style.transform = 'rotateY(' + (R.dir > 0 ? 180 : -180) + 'deg)';
    leaf.style.setProperty('--a', '1');
    setTimeout(function () {
      leaf.classList.remove('on');
      leafFront.innerHTML = '';
      R.cur = clamp(R.cur + R.dir, 0, R.total - 1);
      R.busy = false; R.dir = 0;
      render();
    }, FLIP_MS + 40);
  }
  function cancelFlip() {
    leaf.style.transition = 'transform ' + (FLIP_BACK_MS / 1000) + 's cubic-bezier(.25,.7,.3,1)';
    leaf.style.transform = 'rotateY(0deg)';
    leaf.style.setProperty('--a', '0');
    setTimeout(function () {
      leaf.classList.remove('on');
      leafFront.innerHTML = '';
      R.busy = false; R.dir = 0;
      render();
    }, FLIP_BACK_MS + 40);
  }
  function flipTo(dir) {
    try {
      if (!startFlip(dir)) { document.body.setAttribute('data-dbg', 'flip-refused dir=' + dir + ' busy=' + R.busy + ' cur=' + R.cur + ' total=' + R.total); return; }
      commitFlip();
    } catch (err) {
      document.body.setAttribute('data-dbg', 'flip-error ' + (err && err.message));
    }
  }

  /* ---------- ١٤) اللمس والسحب ---------- */
  function wire() {
    stage.addEventListener('pointerdown', onDown, { passive: true });
    window.addEventListener('pointermove', onMove, { passive: false });
    window.addEventListener('pointerup', onUp, { passive: true });
    window.addEventListener('pointercancel', onUp, { passive: true });

    if (prevBtn) prevBtn.addEventListener('click', function () { flipTo(-1); });
    if (nextBtn) nextBtn.addEventListener('click', function () { flipTo(1); });
    var menu = document.getElementById('rMenu');
    if (menu) menu.addEventListener('click', openPanel);
    var pbtn = document.getElementById('rProgBtn');
    if (pbtn) pbtn.addEventListener('click', openPanel);

    /* الروابط الداخلية (فهرس الفصول) تقفز إلى الصفحة */
    stage.addEventListener('click', function (e) {
      var a = e.target.closest('a[href^="#"]');
      if (!a) return;
      e.preventDefault();
      var id = a.getAttribute('href').slice(1);
      var ci = R.chaps.filter(function (c) { return c.id === id; })[0];
      if (ci) { closePanel(); goto(ci.page - 1); }
    });

    var t = null;
    window.addEventListener('resize', function () {
      clearTimeout(t);
      t = setTimeout(function () {
        layout();
        repaginate();
      }, 220);
    });

    document.addEventListener('backbutton', function (e) {
      if (R.cur > 0) { e.preventDefault(); goto(R.cur - 1); }
      else { e.preventDefault(); location.href = 'index.html'; }
    });
  }

  function onDown(e) {
    if (R.busy) return;
    if (e.target.closest('a,button,input,select')) return;
    R.drag = { x0: e.clientX, y0: e.clientY, dir: 0, t0: Date.now(), active: false };
  }
  function onMove(e) {
    if (!R.drag || R.busy) return;
    var dx = e.clientX - R.drag.x0, dy = e.clientY - R.drag.y0;
    if (!R.drag.active) {
      if (Math.abs(dx) < 12 || Math.abs(dx) < Math.abs(dy)) return;
      R.drag.active = true;
      R.drag.dir = dx > 0 ? 1 : -1;
      if (!startFlip(R.drag.dir)) { R.drag = null; return; }
    }
    e.preventDefault();
    var deg = clamp((dx / R.pageW) * 180, -180, 180);
    setAngle(deg);
  }
  function onUp(e) {
    if (!R.drag) return;
    var d = R.drag; R.drag = null;
    if (!d.active) {
      /* نقر على الحافة: يسار = التالي، يمين = السابق */
      var r = stage.getBoundingClientRect();
      var rel = (e.clientX - r.left) / r.width;
      if (rel < 0.28) flipTo(1);
      else if (rel > 0.72) flipTo(-1);
      return;
    }
    var dx = e.clientX - d.x0;
    var dt = Math.max(1, Date.now() - d.t0);
    var fast = Math.abs(dx) / dt > 0.5;
    var far = Math.abs(dx) > R.pageW * 0.32;
    if ((fast || far) && Math.sign(dx) === d.dir) commitFlip();
    else cancelFlip();
  }

  /* ---------- ١٥) لوحة الفهرس والذهاب إلى صفحة ---------- */
  function buildPanel() {
    var pan = document.createElement('div');
    pan.className = 'rpanel';
    pan.id = 'rPanel';
    pan.innerHTML =
      '<div class="rphead"><b>الذهاب إلى صفحة</b><button class="ib" id="rClose" title="إغلاق">✕</button></div>' +
      '<div class="rpjump"><input type="number" id="rJumpIn" min="1" placeholder="رقم الصفحة">' +
      '<button class="rpgo" id="rJumpGo">انتقل</button></div>' +
      '<div class="rpfont"><span>حجم الخط</span>' +
      '<button data-fs="0.9">ص</button><button data-fs="1">م</button>' +
      '<button data-fs="1.12">ك</button><button data-fs="1.25">ج</button></div>' +
      '<div class="rplist" id="rPlist"></div>' +
      '<a class="rphome" href="index.html">فهرس الموسوعة</a>';
    document.body.appendChild(pan);
    refreshPanel();
    document.getElementById('rClose').addEventListener('click', closePanel);
    document.getElementById('rJumpGo').addEventListener('click', function () {
      var v = parseInt(document.getElementById('rJumpIn').value, 10);
      if (v >= 1 && v <= R.total) { closePanel(); goto(v - 1); }
    });
    pan.querySelectorAll('[data-fs]').forEach(function (b) {
      b.addEventListener('click', function () {
        setFont(parseFloat(b.getAttribute('data-fs')));
        closePanel();
      });
    });
  }
  function openPanel() {
    var p = document.getElementById('rPanel');
    if (!p) return;
    p.classList.add('on');
    var inp = document.getElementById('rJumpIn');
    if (inp) { inp.max = R.total; inp.value = R.cur + 1; inp.focus(); }
  }
  function closePanel() {
    var p = document.getElementById('rPanel');
    if (p) p.classList.remove('on');
  }

  function setFont(fs) {
    R.fs = fs;
    try { localStorage.setItem('ti_font', String(fs)); } catch (e) { }
    applyFont();
    layout();
    repaginate();
  }

  /* ---------- ١٦) البحث في نص الكتاب ---------- */
  function normKeep(s) {
    return s.replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه');
  }
  function buildIndex() {
    if (R.index) return R.index;
    var idx = [];
    R.pages.forEach(function (p, pi) {
      p.items.forEach(function (it) {
        var t = it.node.textContent || '';
        if (t.trim().length > 8) idx.push({ page: pi, u: it.u, b: it.b, text: t });
      });
    });
    R.index = idx;
    return idx;
  }
  function highlightPage(pageNo, q) {
    var el = R.rendered[pageNo];
    if (!el) return;
    var nq = normKeep(q);
    var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
    var nodes = [], n;
    while ((n = walker.nextNode())) if (n.nodeValue && n.nodeValue.trim()) nodes.push(n);
    nodes.forEach(function (t) {
      var s = t.nodeValue, low = normKeep(s);
      var i = low.indexOf(nq);
      if (i < 0) return;
      var frag = document.createDocumentFragment(), last = 0, j = i;
      while (j >= 0) {
        frag.appendChild(document.createTextNode(s.slice(last, j)));
        var mk = document.createElement('mark');
        mk.textContent = s.substr(j, q.length);
        frag.appendChild(mk);
        last = j + q.length;
        j = low.indexOf(nq, last);
      }
      frag.appendChild(document.createTextNode(s.slice(last)));
      t.parentNode.replaceChild(frag, t);
    });
    var mk = el.querySelector('mark');
    if (mk) mk.scrollIntoView({ block: 'center' });
  }
  window.__searchBook = function (q) {
    var sb = document.getElementById('sb');
    if (!sb) return;
    var nq = normKeep(q.trim());
    if (nq.length < 2) { sb.innerHTML = ''; return; }
    var idx = buildIndex(), res = [], i;
    for (i = 0; i < idx.length && res.length < 40; i++) {
      var low = normKeep(idx[i].text);
      var at = low.indexOf(nq);
      if (at < 0) continue;
      var st = Math.max(0, at - 40);
      res.push({
        page: idx[i].page, u: idx[i].u, b: idx[i].b,
        snip: idx[i].text.substr(st, 130),
        name: R.pages[idx[i].page] ? R.pages[idx[i].page].ch : BOOK.n
      });
    }
    if (!res.length) {
      sb.innerHTML = '<p style="text-align:center;color:var(--muted);padding:2rem">لا توجد نتائج</p>';
      return;
    }
    var html = '';
    res.forEach(function (r) {
      var sn = escHtml(r.snip), at = normKeep(r.snip).indexOf(nq);
      if (at >= 0) {
        sn = escHtml(r.snip.slice(0, at)) + '<em>' + escHtml(r.snip.substr(at, q.length)) +
          '</em>' + escHtml(r.snip.slice(at + q.length));
      }
      html += '<div class="res" data-p="' + r.page + '" data-q="' + escHtml(q) + '">' +
        '<b>' + escHtml(r.name) + ' — صفحة ' + arD(r.page + 1) + '</b><small>' + sn + '</small></div>';
    });
    sb.innerHTML = html;
    sb.querySelectorAll('.res').forEach(function (el) {
      el.addEventListener('click', function () {
        closeSearch();
        goto(parseInt(el.getAttribute('data-p'), 10), el.getAttribute('data-q'));
      });
    });
  };
  function escHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  /* ---------- انطلاق ---------- */
