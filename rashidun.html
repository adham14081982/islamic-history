س أثرٌ كبير في تاريخ الإسلام: أن الدولة صارت تُشرف على العراق وإيران وأجزاءٍ من آسيا الوسطى، وأن تراث فارس الإداري والفكري دخل في الحضارة الإسلامية بعد ذلك، وكان في هذا ما يُفسّر ظهور الوزارة والكتابة الديوانية والنظم الإدارية في العصر العباسي. وقد كان في هذا أيضًا تحدٍّ كبير: أن تُدار شعوبٌ متعددة الأديان واللغات، وكان في هذا ما دفع إلى بناء نظامٍ إداري جديد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه الفتوح ما يُظهر أن الحرب مع فارس كانت أطول من الحرب مع بيزنطة، لأن فارس كانت دولةً مركزيةً قوية تُقاتل حتى النهاية، وكان في هذا ما جعل الجبهة الشرقية تحتاج إلى سنواتٍ أكثر. وقد كان في هذا درسٌ في التاريخ العسكري: أن الدولة المركزية تُقاتل أطول من الدولة المركّبة، لأن سقوط عاصمتها لا يعني سقوط إدارتها. وقد كان في هذا ما يُفسّر أن الفتح في الشرق كان أبطأ من الفتح في الشام، لأن فارس كانت تُقاتل على أرضها وفي عواصمها.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالفيلة والمفاوضات\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الفيلة في القادسية عاملاً نفسيًّا كبيرًا، لأن خيول العرب كانت تنفر منها، وكان في هذا ما جعل المسلمين يحتاجون إلى حيلة، وقد رُوي أنهم عمدوا إلى تعمية الفيلة أو إصابتها في خرطومها، وكان في هذا ما يُظهر أن الجيش كان يتعلّم في الميدان. وقد كان في هذا درسٌ: أن التفوّق التقني يُواجه بالحيلة والتعلّم لا بالاستسلام.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت المفاوضات قبل المعركة جزءًا من الحرب، لأن كل طرفٍ كان يريد أن يعرف قوّة الآخر، وكان في إرسال الوفود ما يُشبه الاستطلاع السياسي. وقد كان في موقف رِبعي بن عامر رمزٌ للخطاب الإسلامي في الفتوح: أنه لم يعرض المال ولا الأرض بل عرض الدين والعدل، وكان في هذا ما جعل بعض قادة الفرس يُدركون أن هؤلاء لا يُشترون.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالمدائن ونهاوند\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان عبور دجلة في المدائن من أعمال الفتح التي ذُكرت في المصادر بتفصيل، لأن النهر كان في موسم الفيضان، ولأن الفرس كانوا قد قطعوا الجسور، وقد عبر الجيش بخيوله سباحةً، وكان في هذا إقدامًا يُشبه المغامرة، لكنه كان محسوبًا لأن العدو كان قد فقد تنظيمه. وقد كان في هذا الفرق ما جعل المعركة تُحسم بالصبر لا بالمناورة، لأن الجيش الذي يعتمد على قائده ينهار إذا فقده.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت نهاوند آخر المعارك الكبرى، وكانت في موضعٍ جبلي، وقد استعمل المسلمون خطةً تقوم على استدراج الفرس ثم محاصرتهم في الممرات، وكان في هذا ما يُظهر تطوّر التكتيك عند المسلمين من معارك السهول إلى معارك الجبال. وقد كان في سقوط نهاوند إعلانًا بأن الدولة الساسانية قد انتهت كقوّةٍ عسكرية.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eأثر فتح فارس\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يكن فتح فارس فتحًا عسكريًّا فقط، بل كان انتقالًا لحضارةٍ كاملة، فقد كانت فارس ذات إدارةٍ وكتابةٍ وديوانٍ وتنظيمٍ للمال، وكان في هذا التراث ما أخذه المسلمون وتطوّروا فيه. وقد كان في هذا ما يُفسّر أن الدولة الإسلامية في العصر الأموي والعباسي صارت تُشبه الدولة الفارسية في إدارتها أكثر مما تُشبه الدولة البيزنطية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا الفتح أيضًا مشكلةٌ جديدة: أن تُحكم شعوبٌ لا تتكلّم العربية ولا تعرف الإسلام، وكان في هذا ما دفع إلى وضع نظام الخراج والجزية، وإلى السماح بالبقاء على الدين، وكان في هذا ما جعل الإسلام ينتشر بالتدريج لا بالسيف، لأن الشعوب التي أسلمت بعد قرونٍ أسلمت بقناعةٍ لا بخوف.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالتاريخ\u003c/b\u003e\u003cspan\u003eسنة ١٥هـ، ونهاوند ٢١هـ\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالقائد\u003c/b\u003e\u003cspan\u003eسعد بن أبي وقاص\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالخصم\u003c/b\u003e\u003cspan\u003eرستم ثم يزدجرد\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالعاصمة\u003c/b\u003e\u003cspan\u003eالمدائن وسقوطها بعد القادسية\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالنتيجة\u003c/b\u003e\u003cspan\u003eنهاية الدولة الساسانية\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e١٤هـ\u003c/td\u003e\u003ctd\u003eتوجّه سعد إلى العراق\u003c/td\u003e\u003ctd\u003eبداية الجبهة الفارسية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٥هـ\u003c/td\u003e\u003ctd\u003eمعركة القادسية\u003c/td\u003e\u003ctd\u003eمقتل رستم وتفرّق الجيش\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٦هـ\u003c/td\u003e\u003ctd\u003eسقوط المدائن\u003c/td\u003e\u003ctd\u003eنهاية العاصمة الساسانية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٦ – ١٩هـ\u003c/td\u003e\u003ctd\u003eجلولاء وحلوان\u003c/td\u003e\u003ctd\u003eتثبيت الفتح في العراق\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٢١هـ\u003c/td\u003e\u003ctd\u003eنهاوند\u003c/td\u003e\u003ctd\u003eآخر معركةٍ كبرى مع الفرس\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eوَعَدَ اللَّهُ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ مِنكُمْ لَيَسْتَخْلِفَنَّهُمْ فِي الْأَرْضِ\u003c/p\u003e\u003ccite\u003eسورة النور، الآية ٥٥\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eسقطت دولة فارس في ثلاث معارك كبرى، وكانت القادسية أولها وأعظمها، وفيها قُتل رستم وسقطت المدائن. وقد دخل تراث فارس الإداري في الدولة الإسلامية، وكان في هذا بداية تحوّلٍ في نظام الحكم.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"jerusalem","n":"فتح بيت المقدس","ic":"🕌","part":"القسم الثاني: الفتوح الكبرى","h":"\u003carticle class=\"ch3\" id=\"jerusalem\" data-toc=\"فتح بيت المقدس\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e2.3\u003c/span\u003e\n          \u003ch3\u003e🕌 فتح بيت المقدس\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي سنة ست عشرة أو سبع عشرة للهجرة سقطت بيت المقدس، وكان عمر بن الخطاب قد جاء بنفسه ليُوقّع العهد، وكان في مجيئه ما جعل الفتح حدثًا دينيًّا لا عسكريًّا فقط.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكانت بيت المقدس في يد بيزنطة منذ سنة ٦١٤م، وكانت المدينة مقدّسة عند النصارى، وكانت قد بُنيت فيها كنيسة القيامة، وكانت في المدينة أسقفيةٌ كبيرة. وقد حاصرها المسلمون في أثناء فتح الشام، وكان أهلها يُريدون أن يُسلّموها إلى الخليفة نفسه، وكان في هذا الطلب ما يُظهر أنهم كانوا يعرفون من يُدير الدولة، وكان في هذا أيضًا ما جعل عمر يخرج من المدينة إلى الشام.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في مجيء عمر إلى الشام ما يُشبه الزيارة السياسية: أنه أراد أن يرى البلاد المفتوحة بنفسه، وأن يُنظّم إدارتها، وأن يُوقّع العهود بيده. وقد كان في سفره بساطةٌ شديدة، وكان يمشي وخادمه يركب، وكان في هذا ما يُظهر أن الخليفة لم يكن ملكًا، وكان في هذا أيضًا ما يُشيع في الناس أن الحكم الجديد لا يقوم على الترف. وقد كان في هذا الخروج ما جعل عمر يرى بنفسه ما لم يكن يُرى في الرسائل، وكان في هذا ما يُفسّر دقّة قراراته الإدارية بعد ذلك.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد وُقّع العهد المعروف بالعُمرية، وفيه أمانٌ لأهل المدينة على أنفسهم وأموالهم وكنائسهم، وأن لا تُسكن كنائسهم ولا تُهدم، وأن لا يُكره أحدٌ على دينه، وأن تُدفع الجزية. وقد كان في هذا العهد تفصيلٌ دقيق: أن من أراد أن يخرج يُؤمَّن على نفسه وماله، وأن من بقي يُعطى الأمان، وكان في هذا ما جعل المدينة تُسلّم بلا قتال. وقد كان في هذا العهد ما جعل المدينة تُدار بلا حربٍ أهلية، وكان في هذا ما يُفسّر بقاء النصارى فيها قرونًا بعد الفتح.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد رُوي أن عمر لما دخل المدينة أراد أن يُصلّي في موضعٍ، فدلّه الأسقف على موضعٍ في الكنيسة، فرفض أن يُصلّي فيه، وقال: إن صليتُ هنا لصلّى المسلمون بعدي فيه، وكان في هذا القرار ما يُظهر وعيًا سياسيًّا عميقًا: أن يُحفظ للمدينة طابعها، وأن لا تُستفزّ النصارى في أماكن عبادتهم، وكان في هذا ما جعل المدينة تُدار بسلامٍ سنوات. وقد كان في هذا الرفض ما جعل الكنيسة تبقى كنيسة، وجعل المسجد يُبنى في موضعٍ مستقل، وكان في هذا أصلًا في سياسة الأماكن المقدّسة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أمر عمر أن يُبنى مسجدٌ في الموضع الذي عُرج بالنبيّ إليه، وكان في هذا تأسيسٌ للمكانة الإسلامية للمدينة، وكان في بناء المسجد في طرف الحرم ما جعل للمسلمين موضعًا لا يُزاحم الكنائس. وقد كان في هذا التخطيط ما يُشبه التنظيم العمراني للطوائف في المدينة الواحدة، وكان في هذا ما يُفسّر بقاء بيت المقدس مدينةً متعددة الأديان قرونًا. وقد كان في هذا التخطيط ما جعل المدينة تُشبه المدن المقدّسة التي تُدار بشراكةٍ بين الطوائف لا بغلبةٍ واحدة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في فتح بيت المقدس معنى دينيًّا كبيرًا عند المسلمين، لأنه أولى القبلتين وثالث الحرمين، وكان في هذا ما جعل المدينة محطّ أنظار المسلمين بعد ذلك، وكان في هذا ما جعلها محطّ نزاعٍ أيضًا. وقد كان في هذا الفتح ما جعل المدينة تُدخل في التاريخ الإسلامي لا كمدينةٍ مفتوحة بل كمدينةٍ مقدّسة، وكان في هذا فرقٌ في مكانتها بعد ذلك. وقد كان في هذا ما جعل المدينة محطّ أنظار المسلمين في كل عصر، وكان في هذا ما يُفسّر كثرة الوصايا والرحلات إليها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في زيارة عمر إلى الشام أعمالٌ إدارية أخرى: أنه نظّم الجند وأقطعهم، وأنشأ المدن العسكرية، ووضع نظامًا للخراج. وقد كان في هذه الزيارة ما يُظهر أن الخليفة كان يُدير الدولة من الميدان لا من المكتب، وكان في هذا ما يُفسّر دقّة النظام الإداري في العهد العمري. وقد كان في هذه الزيارة ما جعل عمر يُقطع الجند ويُنظّم الخراج بنفسه، وكان في هذا ما يُفسّر أن النظام العمري كان دقيقًا في تفاصيله.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بقي في المدينة بعد الفتح سكّانها من النصارى واليهود، وكان في هذا ما جعلها مدينةً مختلطة، وكان في هذا ما يجعلها نموذجًا لسياسة المسلمين في المدن المقدّسة. وقد كان في هذا النموذج ما يتكرّر في التاريخ بعد ذلك، حين دخل صلاح الدين المدينة سنة ١١٨٧م، فلم يُكرّر ما فعله الصليبيون سنة ١٠٩٩م، وكان في هذا ما يُظهر أثر النموذج العمري في الذاكرة السياسية.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالعهد العمري\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان العهد العمري وثيقةً قانونية بالمعنى الدقيق: فيه تحديدٌ للحقوق والواجبات، وفيه ضمانٌ للعبادة، وفيه شرطٌ بعدم الإكراه، وكان في هذا ما يجعل الفتح عمليةً قانونية لا عمليةً عسكرية فقط. وقد كان في هذا العهد ما يُقارن بمعاهدات الدول الحديثة، لأن فيه بنودًا واضحةً لا شعارات.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا العهد أيضًا شرطٌ يُثير النقاش عند المؤرخين، وهو ما يُروى من بعض الشروط التي قيل إنها أُضيفت بعد ذلك. والذي لا خلاف فيه أن المدينة سُلّمت بعهد، وأن أهلها بقوا فيها، وأن كنائسهم بقيت، وكان في هذا ما يُخالف ما جرى في فتوحٍ أخرى في التاريخ حيث كان المنتصر يُدمّر أماكن العبادة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eلماذا جاء عمر بنفسه\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان في مجيء عمر معانٍ عدة: أن يُشرف على تقسيم الشام إشرافًا مباشرًا، وأن يرى الجند وأحوال الناس، وأن يُوقّع العهد بيده لأن أهل المدينة طلبوا ذلك. وكان في هذا أيضًا معنى رمزي: أن الخليفة يزور المدينة المقدّسة تواضعًا لا فتحًا، وكان في هذا ما جعله في الذاكرة الإسلامية مثالًا للحاكم الذي لا يُسرف في مظاهر السلطة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في سفره ما رُوي من بساطته، وقد كان في هذا ما يُشبه سياسةً مقصودة: أن يُعلّم الناس أن الخلافة ليست مُلكًا، وأن الأموال التي تصل إلى المدينة من الفتوح لا تُصرف على القصور. وقد كان في هذا الدرس ما بقي في الفكر السياسي الإسلامي معيارًا للحكم العادل، وإن لم يُطبّق دائمًا بعد ذلك.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eبيت المقدس في الوعي الإسلامي\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت مكانة بيت المقدس في الإسلام مبنيةً على النصّ لا على الفتح، لأنها أولى القبلتين، ولأنها المكان الذي أُسري بالنبيّ إليه، وكان في هذا ما جعل المدينة مقدّسةً قبل أن يدخلها جيش. وقد كان في هذا ما يُفسّر أن فتحها كان حدثًا مختلفًا عن فتح المدن الأخرى، وأن المسلمين لم يكتفوا بأن تكون ولايةً بل جعلوها مركزًا دينيًّا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بقي هذا الوعي حاضرًا في الشعر والرحلات والحجّ، وكان في العهد الأموي أن بُنيت قبة الصخرة والمسجد الأقصى، وكان في هذا ما جعل المدينة مركزًا معماريًّا أيضًا. وقد كان في هذا كله ما يجعل المدينة محطّ أنظار المسلمين في كل عصر، وكان في هذا ما يُفسّر حجم الرمزية التي تحملها إلى اليوم.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالتاريخ\u003c/b\u003e\u003cspan\u003eنحو سنة ١٦ – ١٧هـ\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالخليفة\u003c/b\u003e\u003cspan\u003eعمر بن الخطاب وقد جاء بنفسه\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالوثيقة\u003c/b\u003e\u003cspan\u003eالعهد العمري\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالضمان\u003c/b\u003e\u003cspan\u003eالأنفس والأموال والكنائس\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالأثر\u003c/b\u003e\u003cspan\u003eمدينةٌ مقدّسة في الدولة الإسلامية\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالعنصر\u003c/th\u003e\u003cth\u003eالتفصيل\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالحصار\u003c/td\u003e\u003ctd\u003eأمام أسوار المدينة\u003c/td\u003e\u003ctd\u003eطلبُ التسليم للخليفة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالعهد\u003c/td\u003e\u003ctd\u003eأمانٌ بشروطٍ مكتوبة\u003c/td\u003e\u003ctd\u003eتسليمٌ بلا قتال\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالصلاة\u003c/td\u003e\u003ctd\u003eرفض الصلاة في الكنيسة\u003c/td\u003e\u003ctd\u003eحفظُ الكنائس من المشاركة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمسجد\u003c/td\u003e\u003ctd\u003eبناءٌ في طرف الحرم\u003c/td\u003e\u003ctd\u003eتأسيسُ مكانةٍ إسلامية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالإدارة\u003c/td\u003e\u003ctd\u003eتنظيم الجند والخراج\u003c/td\u003e\u003ctd\u003eنموذجٌ للولايات\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eسُبْحَانَ الَّذِي أَسْرَىٰ بِعَبْدِهِ لَيْلًا مِّنَ الْمَسْجِدِ الْحَرَامِ إِلَى الْمَسْجِدِ الْأَقْصَى\u003c/p\u003e\u003ccite\u003eسورة الإسراء، الآية ١\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eسُلّمت بيت المقدس بعهدٍ كتبه عمر بنفسه، فيه أمانٌ للنفوس والأموال والكنائس. وقد كان في مجيء الخليفة وتواضعه ورفضه الصلاة في الكنيسة ما جعل الفتح نموذجًا في سياسة المدن المقدّسة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"egypt","n":"فتح مصر","ic":"🌾","part":"القسم الثاني: الفتوح الكبرى","h":"\u003carticle class=\"ch3\" id=\"egypt\" data-toc=\"فتح مصر\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e2.4\u003c/span\u003e\n          \u003ch3\u003e🌾 فتح مصر\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي سنة ثماني عشرة للهجرة كتب عمرو بن العاص إلى عمر يستأذنه في فتح مصر، فتردّد عمر ثم أذن، وكتب إليه: إن أدركتَ كتابي قبل أن تدخلها فارجع. ولمّا وصل الكتاب كان عمرو قد دخل، فمضى. وفي ثلاث سنوات صارت مصر ولايةً إسلامية.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكانت مصر في يد بيزنطة، وكانت تُنتج القمح الذي يُطعم القسطنطينية، وكانت ذات أقباطٍ يُديرون الزراعة والإدارة، وكانت فيها أقلياتٌ دينية تُعاني من اضطهادٍ مذهبي، لأن بيزنطة كانت تُلزم الناس بمذهبها الرسمي. وقد كان في هذا الاضطهاد ما جعل كثيرًا من الأقباط يرون في الحكم الجديد تخفيفًا، وكان في هذا ما يُفسّر سرعة الفتح بعد ذلك. وقد كان في هذا الاضطهاد ما جعل الأقباط يُفضّلون حكمًا بعيدًا على حكمٍ قريبٍ يُلزمهم بمذهبٍ لا يُريدونه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان عمرو بن العاص يعرف مصر معرفةً تجارية، لأنه كان قد سافر إليها في الجاهلية، وكان يعرف طرقها ومدنها، وكان في هذا ما جعله يُقنع عمر بفتحها. وقد أذن له عمر بعد تردّد، لأن الجيوش كانت في الشام وفارس، وكان في هذا التردّد حسابٌ منطقي: أن الدولة لا تستطيع أن تفتح جبهةً ثالثة في وقتٍ واحد. وقد كان في هذا التردّد ما يُظهر أن عمر كان يُفكّر بموارد الدولة لا بحماس القادة، وكان في هذا ما جعل الفتح قرارًا محسوبًا لا مغامرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد دخل عمرو مصر سنة ١٩هـ من طريق العريش، وكانت المقاومة في أول الأمر محدودة، ثم حاصر حصن بابليون في موضع الفسطاط الحالية، وكان الحصار طويلًا استمرّ أشهرًا، وكان في هذا الحصار ما يُظهر أن الجيش العربي لم يكن يملك آلات حصارٍ كبيرة، وكان يعتمد على الصبر والمفاوضات. وقد كان في هذا الحصار ما جعل الجيش يتعلّم أن المدينة المحصّنة تُؤخذ بالصبر لا بالهجوم، وكان في هذا ما جعل الفتح في مصر أبطأ من الفتح في الشام.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد سقط حصن بابليون سنة ٢٠هـ، ثم سار عمرو إلى الإسكندرية، وكانت مدينةً محصّنةً بأسوارٍ وأبراج، وكانت تحتاج إلى حصارٍ من البحر والبر. وقد سقطت سنة ٢١هـ بعد حصارٍ ومعاهدة، وكان في سقوطها نهاية الحكم البيزنطي في مصر، وقد قال هرقل قبل موته إنه لا يُريد أن يسمع بمصر. وقد كان في هذا الحصار ما جعل المسلمين يُدركون أهمية البحر، لأن الإسكندرية كانت تُمدّ من الأسطول البيزنطي، وكان في هذا ما دفع إلى بناء أسطولٍ بعد ذلك.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في فتح مصر قراراتٌ إدارية مهمة: أن تُترك الأرض لأهلها وتُفرض عليها الخراج، وأن يُترك الأقباط في إدارة القرية والزراعة، وأن يُنشأ مدينةٌ جديدة هي الفسطاط لتكون مقرًّا للجند، لأن الإسكندرية كانت مدينةً بحرية يصعب الدفاع عنها من البر. وقد كان في تأسيس الفسطاط ما جعل مصر تُدار من مركزٍ عربي لا من مركزٍ بيزنطي. وقد كان في هذا القرار ما جعل الفسطاط مدينةً تنمو حتى صارت القاهرة بعد قرون، وكان في هذا ما يُظهر أن قرارات الجند الصغيرة تُنتج جغرافيا كبيرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد رُوي أن عمر كتب إلى عمرو في شأن خراج مصر، وأنه كان يرى أن يُخفّف عن الناس، وأن يُترك لهم ما يحتاجون إليه للزراعة. وقد كان في السياسة المالية في مصر ما جعل البلاد تُنتج، وكان في هذا ما يُفسّر أن مصر صارت مخزن الحبوب للدولة الإسلامية بعد ذلك، وكان في هذا أثرٌ في كل تاريخها. وقد كان في هذه السياسة ما جعل مصر تُنتج أكثر مما كانت تُنتج في العهد البيزنطي، لأن الفلاح الذي يُترك له محصوله يعمل أكثر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في فتح مصر أيضًا مسألةٌ تتعلق بالبحر: أن بيزنطة كانت تُهدّد السواحل، وكانت تُرسل أسطولها، وكان في هذا ما دفع المسلمين إلى بناء أسطولٍ بعد ذلك. وقد كان في هذا ما يُظهر أن الفتح البحري لم يكن ترفًا بل ضرورة، لأن من يملك مصر ولا يملك بحرها لا يستطيع أن يحميها. وقد كان في هذا التهديد ما جعل معاوية يُنشئ أسطولًا في مصر والشام، وكان في هذا ما جعل المسلمين يُقاتلون بيزنطة في بحرها لا في برّها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في فتح مصر أثرٌ ثقافي كبير: أن الأزهر لم يكن بعد، لكن المسجد الذي بناه عمرو في الفسطاط صار أول مركزٍ علمي في مصر، وكان في هذا ما جعل مصر تُصبح مركزًا للعلم في العالم الإسلامي بعد قرون. وقد كان في هذا ما يُظهر أن الفتح كان بدايةً لتاريخٍ طويل لا حدثًا عابرًا، وأن المدن التي بُنيت في العهد الأول بقيت تُنتج العلم بعد ألف سنة.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eلماذا مصر\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت مصر مهمّةً لثلاثة أسباب: أنها تُنتج القمح، وأنها تُشرف على البحر المتوسط، وأنها كانت تُموّل بيزنطة بالمال والرجال. وكان في فتحها إضعافٌ مباشر لبيزنطة، وكان في هذا ما يجعل عمر يقبل المخاطرة بجبهةٍ ثالثة. وقد كان في هذا ما يُفسّر أن الفتح لم يكن حربًا على الأقباط بل على الدولة البيزنطية، وأن الأقباط بقوا في أرضهم بعد الفتح.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في مصر أيضًا أقلياتٌ دينية مُضطهدة، وكان في هذا ما جعل الفتح أسهل، لأن الناس لم يكونوا يُدافعون عن حكمٍ يكرهونه. وقد كان في هذا درسٌ في التاريخ: أن الدولة التي تُضطهد أهليها لا تجد من يُدافع عنها عند الخطر، وأن الفتح في كثيرٍ من الأحيان يبدأ من داخل المدينة لا من خارجها.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالفسطاط والإدارة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان تأسيس الفسطاط قرارًا استراتيجيًّا، لأن العرب كانوا يُقيمون في مدنٍ عسكرية لا في مدنٍ قديمة مفتوحة، وكان في هذا ما يُشبه سياسةً عامة في الفتوح: أن تُبنى مدنٌ جديدة للجند في الكوفة والبصرة والفسطاط والقيروان. وكان في هذا ما يُحفظ للجند هويتهم وللدولة سيطرتها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الإدارة المالية في مصر نموذجٌ يُحتذى: أن تُترك الأرض لأهلها وتُفرض عليها ضريبة، وأن يُترك الأقباط في إدارة القرى، لأنهم يعرفون الريّ والزراعة. وقد كان في هذا ما جعل الدخل يزيد لا ينقص، وكان في هذا دليلًا على أن الفتح الناجح هو الذي يُحافظ على اقتصاد البلد لا الذي يُخرّبه.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالبحر والمستقبل\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان البحر هو الثغرة في فتح مصر، لأن بيزنطة كانت تُغير من السواحل، وكان في هذا ما جعل المسلمين يُدركون أنهم يحتاجون إلى أسطول. وقد كان في هذا ما دفع معاوية بعد ذلك إلى بناء أسطولٍ في الشام ومصر، وكان في هذا الأسطول ما جعل المسلمين يفتحون قبرص ورودس ويُهدّدون القسطنطينية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا التحوّل ما يُظهر أن الفتوح كانت تُنتج تحدياتٍ جديدة مع كل نجاح، وأن الدولة التي تتوسّع تحتاج إلى أدواتٍ جديدة لا إلى الجيش القديم. وقد كان في هذا الدرس ما يُفسّر أن الدولة الإسلامية صارت قوةً بحرية في القرن الأول الهجري، مع أنها بدأت دولةً صحراوية.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالتاريخ\u003c/b\u003e\u003cspan\u003e١٩ – ٢١هـ\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالقائد\u003c/b\u003e\u003cspan\u003eعمرو بن العاص\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالحصن\u003c/b\u003e\u003cspan\u003eبابليون وسقوطه سنة ٢٠هـ\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالعاصمة الجديدة\u003c/b\u003e\u003cspan\u003eالفسطاط\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالأثر\u003c/b\u003e\u003cspan\u003eمصر مخزن الحبوب ومركز العلم\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e١٨هـ\u003c/td\u003e\u003ctd\u003eاستئذان عمرو في فتح مصر\u003c/td\u003e\u003ctd\u003eإذنٌ بعد تردّد\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٩هـ\u003c/td\u003e\u003ctd\u003eدخول العريش\u003c/td\u003e\u003ctd\u003eبداية الفتح\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٢٠هـ\u003c/td\u003e\u003ctd\u003eسقوط حصن بابليون\u003c/td\u003e\u003ctd\u003eتأسيس الفسطاط\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٢١هـ\u003c/td\u003e\u003ctd\u003eسقوط الإسكندرية\u003c/td\u003e\u003ctd\u003eنهاية الحكم البيزنطي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٢١هـ\u003c/td\u003e\u003ctd\u003eتنظيم الخراج\u003c/td\u003e\u003ctd\u003eاستمرار الزراعة والإنتاج\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eوَأَوْرَثَكُمْ أَرْضَهُمْ وَدِيَارَهُمْ وَأَمْوَالَهُمْ وَأَرْضًا لَّمْ تَطَئُوهَا\u003c/p\u003e\u003ccite\u003eسورة الأحزاب، الآية ٢٧\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eفُتحت مصر في ثلاث سنوات، وسقطت الإسكندرية سنة ٢١هـ، وبُنيت الفسطاط مقرًّا للجند والإدارة. وقد تُركت الأرض لأهلها والزراعة للأقباط، فصارت مصر مخزن الحبوب ومركز العلم في الدولة الإسلامية.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-3","n":"القسم الثالث: عمر بن الخطاب","ic":"","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-3\" style=\"--c:#8B1A3A\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e⚖️\u003c/div\u003e\n      \u003ch2\u003eالقسم الثالث: عمر بن الخطاب\u003c/h2\u003e\n      \u003cp\u003eحكم عمر عشر سنين ونصفًا، وفيها وُضعت أكثر مؤسسات الدولة الإسلامية: الديوان، والتقويم الهجري، والأمصار، والقضاء، ونظام العطاء. وقد كان في هذه السنوات ما جعل الدولة تنتقل من فتحٍ إلى نظام، وهذا هو الفرق بين دولةٍ تُقاتل ودولةٍ تُدار.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#umar-rule\"\u003eعمر: تولّيه وعدله\u003c/a\u003e\u003ca href=\"#diwan\"\u003eالديوان والعطاء والتقويم\u003c/a\u003e\u003ca href=\"#umar-conquests\"\u003eالفتوحات في عهد عمر\u003c/a\u003e\u003ca href=\"#assassination\"\u003eمقتله واختيار الستة\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"umar-rule","n":"عمر: تولّيه وعدله","ic":"⚖️","part":"القسم الثالث: عمر بن الخطاب","h":"\u003carticle class=\"ch3\" id=\"umar-rule\" data-toc=\"عمر: تولّيه وعدله\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e3.1\u003c/span\u003e\n          \u003ch3\u003e⚖️ عمر: تولّيه وعدله\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eت\u003c/span\u003eولّى عمر الخلافة بعهدٍ من أبي بكر، وكان أول من لُقّب بأمير المؤمنين، وكان يخرج في الليل يتفقّد الناس، ويقضي بينهم بنفسه، ويكتب إلى ولاته يُحاسبهم. وقد كان في سيرته ما صار مثالًا للحكم العادل في الفكر السياسي الإسلامي.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان عمر بن الخطاب من أشدّ قريش على المسلمين قبل إسلامه، ثم أسلم فصار من أقوى أصحاب النبيّ، وكان في إسلامه عزٌّ للمسلمين كما قال ابن مسعود. وقد كان في شخصيته حدّةٌ وقوّة، وكان في خلافته عدلٌ صارم، وكان في هذا المزيج ما جعله قادرًا على أن يحكم دولةً تتوسّع بسرعة، لأن الدولة الفتيّة كانت تحتاج إلى من يُمسك أطرافها بحزمٍ لا بلين. وقد كان في هذا التحوّل في شخصيته ما يُفسّر أن الدولة احتاجت إليه في لحظةٍ كان فيها الحزم أنفع من اللين.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان أول ما فعله أن خطب في الناس خطبةً بيّن فيها سياسته، وكان فيها أنه سيسير بهم على الكتاب والسنة، وأنه سيكون أشدّ على نفسه من غيره، وكان في هذا إعلانٌ للمعيار الذي سيُحاسب به نفسه وولاته. وقد كان في خطبته ما يُظهر أنه كان يعرف أن الخلافة ليست مُلكًا بل أمانة، وكان في هذا ما جعله يرفض أن يُبنى له قصرٌ أو أن يُخصّ بمال. وقد كان في هذا الإعلان ما جعل الناس يُحاسبونه، وكان في هذا ما يُفسّر كثرة اعتراضاته عليهم في المجالس العامة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان عمر يخرج في الليل في المدينة يتفقّد أحوال الناس، وقد رُوي أنه وجد امرأةً في بيتٍ تُطبخ قدرًا فيه حجارة لأولادها، فبكى ورجع فأمر بخزانة الطعام، وكان في هذه الحكايات ما يُظهر أن الخليفة كان يُدير حياة الناس لا الحرب فقط. وقد كان في هذا ما جعله يُعرف بأنه خليفة الفقراء، وكان في هذا ما جعل الناس يُحبّونه على الرغم من شدّته. وقد كان في هذه الحكايات ما جعل سيرته تُروى في كتب الأدب لا في كتب التاريخ فقط، لأنها تُصوّر الحكم من جهة الناس لا من جهة الدولة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في عدله ما يُروى في قصصٍ كثيرة: أنه حاسب ابنه على أمرٍ، وأنه لم يُعطِ أهل بيته من المال ما يُعطيه للناس، وأنه كان يضرب من يُخالف النظام ولو كان من قريش. وقد كان في هذا ما يُظهر أن العدل في نظره لم يكن شعارًا بل إجراءً يوميًّا، وكان في هذا ما جعل الدولة الجديدة تُقبل عند الشعوب المفتوحة، لأن الناس كانوا يُقارنون بين حكمٍ يُحاسب نفسه وحكمٍ يُحاسب الناس.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في سياسته مع الولاة نظامٌ دقيق: أنه كان يكتب لهم العهود ويُحدّد لهم ما عليهم، وأنه كان يستدعي الوالي في موسم الحجّ ليُحاسبه أمام الناس، وأنه كان يمنع الولاة من الترفّ ومن بناء القصور. وقد كان في هذا النظام ما يُشبه الرقابة الإدارية في الدول الحديثة، وكان في هذا ما جعل الفتوح لا تتحوّل إلى إقطاعاتٍ خاصة كما حدث في دولٍ أخرى.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في عهده ما يُسمّى بعام الرمادة، وهو عامُ قحطٍ أصاب الجزيرة، وقد كان عمر يُنفق منه على الناس، وكان يُرسل الأموال إلى البوادي، وكان في هذا ما يُظهر أن الدولة كانت تُدير الأزمات لا تُتركها للسوق. وقد كان في هذا العام ما جعل الناس يُقبلون على الخلافة أكثر، لأنهم رأوا أن الدولة تُغيثهم حين تنقطع السماء. وقد كان في هذا العام ما جعل عمر يُلغي بعض الحدود ويُخفّف العقوبات، لأن الضرورة تُغيّر الأحكام، وكان في هذا فقهٌ في الموازنة بين النصّ والمصلحة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في شخصية عمر ما جعل الفقه السياسي الإسلامي يتحدّث عن الشورى والعدل والمساءلة، وكان في سيرته ما صار مرجعًا في باب الحسبة والأمر بالمعروف. وقد كان في هذا ما يُفسّر أن أكثر ما يُروى عن الإدارة الإسلامية في العصر الأول يُنسب إلى عمر، لأن عهده كان العهد الذي وُضعت فيه القواعد لا العهد الذي فُتحت فيه البلاد فقط. وقد كان في سيرته ما جعل الفقهاء يُصنّفون في السياسة الشرعية، لأنها أعطتهم أمثلةً على تصرّفات الإمام في المال والأرض والعقوبة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في سياسته ما لا يُقلّد بسهولة: أنه كان يستعمل الشدّة في مواضع واللين في أخرى، وكان يُوازن بين مصلحة الدولة ومصلحة الناس، وكان في هذا ما يُظهر أن الحكم ليس قاعدةً واحدة بل تقديرٌ للموازنات. وقد كان في هذا ما يجعل سيرته مادةً للفكر السياسي لا للقصص فقط، لأنها تُبيّن كيف تُبنى مؤسسةٌ في زمنٍ تتغيّر فيه الأحوال بسرعة. وقد كان في هذه الموازنة ما يُظهر أن الحكم اجتهادٌ متجدّد، وأن من يُطبّق قاعدةً واحدة على كل حالٍ يُخطئ في نصفها.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eأمير المؤمنين\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان عمر أول من سُمّي أمير المؤمنين، وكان اللقب في أصله وصفًا لا تشريفًا، لأنه كان يدلّ على أنه أميرُ الجماعة لا ملكها. وقد كان في هذا اللقب ما يُظهر أن الخلافة صارت مؤسسةً لها وظيفة إدارية، وأن الخليفة صار يُدير جيشًا وإدارةً ومالًا لا أن يُبلّغ رسالةً فقط.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في اختيار اللقب دلالةً على تطوّر الوعي السياسي: أن المسلمين احتاجوا إلى اسمٍ يُعبّر عن سلطةٍ جامعة لا تُشبه الملك ولا تُشبه النبوّة. وقد كان في هذا ما يُفسّر أن الفقهاء بعد ذلك فرّقوا بين الخلافة والمُلك، وأنهم جعلوا الخلافة نيابةً عن النبيّ في إقامة الدين وسياسة الدنيا.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالعدل والمساءلة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان في عدل عمر عنصرٌ مؤسسي لا عاطفي: أنه وضع قواعد للمساءلة، وألزم الولاة بالحضور في الحجّ، ومنعهم من التجارة في ولاياتهم، وكان في هذا ما يمنع تضارب المصالح. وقد كان في هذا ما يُشبه ما يُعرف اليوم بالحوكمة، وإن اختلفت الأدوات، لأن المقصود واحد: أن لا يستعمل المسؤول سلطته لمصلحته.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في مساءلته لنفسه ما يُروى من أنه كان يقول: لو عثرت بغلةٌ في العراق لسألني الله عنها، لمَ لم تُمهّد لها الطريق يا عمر. وقد كان في هذه الكلمة ما يُلخّص تصوّرًا كاملًا للمسؤولية: أن الخليفة مسؤول عن الطرق والزراعة والأسعار، لا عن الحرب والفتح فقط.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالشدّة والرحمة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان عمر شديدًا في الحق، وكان في شدّته ما جعل بعض الناس يخافونه، لكنه كان رحيمًا في مواضع، وكان يُبكي نفسه في الصلاة، وكان يُعطي الفقراء من بيته. وقد كان في هذا التركيب ما يُظهر أن الحكم العادل يحتاج إلى قوّةٍ في التنفيذ ورحمةٍ في النظر، وأن من يملك واحدةً فقط لا يستطيع أن يُدير دولة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في سيرته ما يُروى عن رحمته بالنساء والأطفال والضعفاء، وكان في هذا ما جعله يُنشئ نظامًا للعطاء يشمل الطفل والمرأة والعجوز، وكان في هذا ما يُظهر أن الدولة التي تُقاتل لا تُهمل من لا يُقاتل، وكان في هذا ما جعل الناس يرون في الخلافة حاميةً لا سيّدة.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالخلافة\u003c/b\u003e\u003cspan\u003eسنة ١٣هـ بعهدٍ من أبي بكر\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eاللقب\u003c/b\u003e\u003cspan\u003eأمير المؤمنين، أول من لُقّب به\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمدة\u003c/b\u003e\u003cspan\u003eعشر سنين ونصفًا\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eعام الرمادة\u003c/b\u003e\u003cspan\u003eقحطٌ ومواجهةٌ بالإنفاق\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمبدأ\u003c/b\u003e\u003cspan\u003eمساءلة الولاة في موسم الحجّ\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمجال\u003c/th\u003e\u003cth\u003eالإجراء\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eاللقب\u003c/td\u003e\u003ctd\u003eأمير المؤمنين\u003c/td\u003e\u003ctd\u003eتأسيسُ صيغةٍ للسلطة الجامعة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالولاة\u003c/td\u003e\u003ctd\u003eاستدعاءٌ ومحاسبةٌ في الحجّ\u003c/td\u003e\u003ctd\u003eمنعُ الترفّ وتضارب المصالح\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالاقتصاد\u003c/td\u003e\u003ctd\u003eالإنفاق في عام الرمادة\u003c/td\u003e\u003ctd\u003eدورٌ للدولة في الأزمات\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالنظام\u003c/td\u003e\u003ctd\u003eالتقويم الهجري\u003c/td\u003e\u003ctd\u003eوحدةُ التأريخ في الدولة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالعدل\u003c/td\u003e\u003ctd\u003eقضاءٌ بنفسه في المدينة\u003c/td\u003e\u003ctd\u003eثقةُ الناس في الحكم\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eوَاتَّقُوا اللَّهَ وَاعْلَمُوا أَنَّ اللَّهَ بِمَا تَعْمَلُونَ بَصِيرٌ\u003c/p\u003e\u003ccite\u003eسورة البقرة، الآية ٢٣٣\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eكان عمر أوّل من لُقّب بأمير المؤمنين، وحكم بالحزم والعدل والمساءلة، وكان يخرج في الليل يتفقّد الناس. وقد كان في سيرته ما صار مثالًا في الفكر السياسي الإسلامي للحاكم الذي يُحاسب نفسه قبل أن يُحاسب الناس.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"diwan","n":"الديوان والعطاء والتقويم","ic":"📋","part":"القسم الثالث: عمر بن الخطاب","h":"\u003carticle class=\"ch3\" id=\"diwan\" data-toc=\"الديوان والعطاء والتقويم\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e3.2\u003c/span\u003e\n          \u003ch3\u003e📋 الديوان والعطاء والتقويم\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي عهد عمر ظهرت مؤسسات لم تكن في الجزيرة من قبل: ديوانٌ تُكتب فيه أسماء الجند ورواتبهم، وتقويمٌ هجري يُؤرّخ به الناس، وأمصارٌ تُبنى للجند، ونظامٌ للعطاء يُعطي كل مسلمٍ بحسب سابقته.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان الديوان في أصله نظامًا فارسيًّا لإحصاء الجند ورواتبهم، وقد دخل إلى الدولة الإسلامية في عهد عمر، وكان السبب في إنشائه أن الأموال كثرت بعد الفتوح، فاحتاجت الدولة إلى سجلٍّ يُعرف به من يستحق ومن لا يستحق. وقد قيل إن الذي أشار به هو الهرمزان أو بعض الفرس، وقيل إن عمر فكّر فيه لما رأى الجند يتنازعون في العطاء. وقد كان في هذا السبب ما يُظهر أن المؤسسات تُنشأ بالحاجة لا بالتخطيط المسبق، وأن الدولة تتعلّم من مشكلاتها اليومية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان نظام العطاء يقوم على السابقة في الإسلام لا على النسب وحده، وكان يُعطى أهل بدر أكثر من غيرهم، وكان يُعطى المهاجرون أكثر من الطلقاء، وكان في هذا النظام ما يُشبه التقدير للتاريخ الشخصي في خدمة الجماعة. وقد كان في هذا ما أثار نقاشًا: أن يُفضّل الناس بالسابقة، وكان في هذا ما جعل الفقهاء يتحدّثون عن العدل في العطاء وعن حقّ الفقير في المال.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الديوان ما يُشبه الإدارة المالية الحديثة: أنه كان يُسجّل الاسم والنسب والعطاء والبلدة، وكان يُحدَّث كل سنة، وكان في هذا ما يجعل الدولة تعرف عدد من تستطيع أن تُجنّدهم. وقد كان في هذا النظام ما جعل الجيش جيشًا نظاميًّا لا قبائل تُستنفر، وكان في هذا فرقٌ كبير في قوّة الدولة. وقد كان في هذا السجل ما جعل الدولة تعرف سكّانها، وكان في هذا ما يُفسّر سرعة التعبئة في الحروب بعد ذلك.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان التقويم الهجري من أعظم ما أُنجز في عهده، وقد وُضع سنة ١٧هـ، وكان السبب في وضعه أن الدولة احتاجت إلى تأريخٍ للرسائل والعقود، وكان الناس يؤرّخون بحادثة الفيل أو بموت فلان، فاحتجنا إلى تأريخٍ واحد. وقد اتُّفق على أن يكون بدء التاريخ من هجرة النبيّ، وكان في هذا اختيارٌ ديني وسياسي في وقتٍ واحد: أن يكون الحدث المؤسّس للأمة هو الهجرة لا المولد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت الأمصار من مؤسسات هذا العهد، فبُنيت الكوفة والبصرة في العراق، والفسطاط في مصر، وكانت هذه المدن تُبنى لتكون مقرًّا للجند وعائلاتهم، وكان في هذا ما يُحفظ للعرب لغتهم وعاداتهم، وكان في هذا أيضًا ما يُسهّل إدارة البلاد المفتوحة. وقد كان في اختيار مواقعها حسابٌ عسكري وصحي، فالكوفة على الفرات والبصرة على الخليج والفسطاط على النيل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في العهد العمري نظامٌ للقضاء: أنه كان يُعيّن قاضيًا لكل مصر، وكان يُحدّد له ما ينظر فيه، وكان يُوصيه بأشياء في أدب القضاء مثل النظر في البينة والصلح بين الخصمين. وقد كان في هذا ما يجعل القضاء مؤسسةً لا وظيفةً ثانوية للوالي، وكان في هذا ما يُعدّ أصلًا من أصول القضاء الإسلامي. وقد كان في هذا التحديث السنوي ما جعل الديوان يعكس الواقع لا الماضي، وكان في هذا ما منع تراكم الأخطاء في السجلات.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في سياسة الأرض قرارٌ تاريخي: أن الأرض المفتوحة لا تُقسم غنيمة، بل تبقى في يد أهلها وتُفرض عليها الخراج، وكان في هذا القرار ما جعل الدولة ذات دخلٍ مستمر، وكان في هذا أيضًا ما منع أن تُصبح الأرض ملكًا لقلائل من الفاتحين. وقد كان في هذا القرار معارضةٌ من بعض الصحابة، وكان في اجتهاد عمر ما يُظهر أن الفقه السياسي يُبنى على المصلحة لا على القياس الحرفي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه المؤسسات مجتمعةً ما جعل الدولة الإسلامية دولةً بالمعنى الكامل: لها جيشٌ مسجّل، ومالٌ مُحصّل، وقضاءٌ مستقل، وتأريخٌ واحد، ومدنٌ إدارية. وقد كان في هذا ما يُفسّر أن الدولة استمرّت بعد موت عمر، لأنها لم تكن معلّقةً بشخصه، بل كانت قائمةً على نظمٍ تُدار بها. وقد كان في هذا الاختيار ما جعل التأريخ الإسلامي يبدأ بالهجرة، وكان في هذا ما أثّر في كل تقويمٍ استُعمل في العالم الإسلامي بعد ذلك.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالديوان: من الغنيمة إلى الراتب\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الدولة قبل الديوان تعيش على الغنائم والصدقات، وكانت الغنائم تُقسم عند وصولها، وكان في هذا نظامٌ يعتمد على الحاضر لا على المستمر. وقد كان في الديوان تحوّلٌ إلى نظام الراتب، وكان في هذا ما يجعل الجند مستمرّين في الخدمة لا موسميين، وكان في هذا ما يجعل الدولة قادرةً على حربٍ طويلة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الديوان أيضًا أثرٌ اجتماعي: أن الناس صاروا يُعرّفون بأرقامهم في السجل، وأن الدولة صارت تعرف الفقير والغني، وكان في هذا ما جعل العطاء يصل إلى من لا يستطيع أن يُطالب به. وقد كان في هذا ما يُشبه ما يُعرف اليوم بالضمان الاجتماعي، وإن كان في صورةٍ أبسط.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالتقويم الهجري\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان اختيار الهجرة بدايةً للتقويم قرارًا في غاية الأهمية، لأن التاريخ الذي يبدأ به قومٌ يُحدّد ما يُعدّ تأسيسًا في وعيهم. وقد كان في اختيار الهجرة إشارة إلى أن الأمة بُنيت بالهجرة والجماعة والدولة، لا بالمولد ولا بالمعجزة، وكان في هذا ما يُشبه إعلانًا عن طبيعة التجربة الإسلامية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في التقويم الهجري أيضًا أداةً إدارية: أن تُؤرّخ العقود والرسائل والعهود بتاريخٍ واحد، وكان في هذا ما يمنع النزاع في المواعيد والديون. وقد كان في هذا ما يُظهر أن الإدارة الدقيقة تحتاج إلى وحدة قياسٍ للزمن، كما تحتاج إلى وحدة قياسٍ للمال والمسافة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالأرض والخراج\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان قرار عمر في أرض السواد من أهمّ القرارات الاقتصادية في تاريخ الإسلام، لأنه حدّد علاقة الدولة بالأرض المفتوحة قرونًا. وقد كان في القرار أن تبقى الأرض بيد أهلها وتُفرض عليها ضريبة، وكان في هذا ما حافظ على الإنتاج، وما منع تكدّس الأرض في يد قليلين. وقد كان في هذا ما جعل الإدارة الدقيقة ممكنة، لأن العقد الذي لا يُؤرَّخ لا يُثبت عند النزاع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا القرار اجتهادٌ في مقابل ظاهر الآية في الغنائم، وكان في هذا ما جعل الفقهاء يتحدّثون عن المصلحة كأصلٍ من أصول التشريع. وقد كان في هذا ما يُفسّر أن الفقه الإسلامي في مسائل الأرض والمال تطوّر تطوّرًا كبيرًا في القرون الأولى، لأنه كان يُواجه أسئلةً لم تكن في الجزيرة.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالديوان\u003c/b\u003e\u003cspan\u003eسجل الجند والعطاء\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالتقويم\u003c/b\u003e\u003cspan\u003eالتاريخ الهجري سنة ١٧هـ\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالأمصار\u003c/b\u003e\u003cspan\u003eالكوفة والبصرة والفسطاط\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالأرض\u003c/b\u003e\u003cspan\u003eالخراج لا القسمة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالقضاء\u003c/b\u003e\u003cspan\u003eقاضٍ لكل مصر\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمؤسسة\u003c/th\u003e\u003cth\u003eوظيفتها\u003c/th\u003e\u003cth\u003eأثرها\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالديوان\u003c/td\u003e\u003ctd\u003eإحصاء الجند والعطاء\u003c/td\u003e\u003ctd\u003eجيشٌ دائم ورواتب\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالتقويم الهجري\u003c/td\u003e\u003ctd\u003eتأريخٌ موحّد\u003c/td\u003e\u003ctd\u003eوحدةٌ إدارية وثقافية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالأمصار\u003c/td\u003e\u003ctd\u003eمدنٌ للجند والإدارة\u003c/td\u003e\u003ctd\u003eمراكزُ حضرية جديدة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالخراج\u003c/td\u003e\u003ctd\u003eضريبةٌ على الأرض\u003c/td\u003e\u003ctd\u003eدخلٌ مستمر للدولة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالقضاء\u003c/td\u003e\u003ctd\u003eفصلٌ في الخصومات\u003c/td\u003e\u003ctd\u003eاستقلالُ القضاء عن الوالي\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eوَأَعِدُّوا لَهُمْ مَا اسْتَطَعْتُم مِّن قُوَّةٍ\u003c/p\u003e\u003ccite\u003eسورة الأنفال، الآية ٦٠\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eأُنشئت في عهد عمر مؤسسات الدولة: الديوان، والتقويم الهجري، والأمصار، ونظام الخراج، والقضاء المستقل. وقد نقلت هذه المؤسسات الدولة من فتحٍ إلى نظام، فاستمرّت بعد موت صاحبها.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"umar-conquests","n":"الفتوحات في عهد عمر","ic":"🗺️","part":"القسم الثالث: عمر بن الخطاب","h":"\u003carticle class=\"ch3\" id=\"umar-conquests\" data-toc=\"الفتوحات في عهد عمر\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e3.3\u003c/span\u003e\n          \u003ch3\u003e🗺️ الفتوحات في عهد عمر\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي عشر سنوات فُتحت الشام ومصر والعراق وفارس وأجزاءٌ من أرمينية وآسيا الوسطى، وكانت الدولة تُقاتل على أربع جبهات في وقتٍ واحد. ولم تكن الفتوح في عهده حملاتٍ عشوائية بل خطةً تُراجع كل سنة.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكانت الجبهة الشامية قد انتهت في أوّل عهده، وكانت الجبهة المصرية قد فُتحت في سنواته الوسطى، وكانت الجبهة الفارسية هي الأطول، لأن فارس كانت دولةً مركزية كبيرة تُقاتل على أرضها. وقد كان في هذا التوزيع ما يُظهر أن عمر كان يُرتّب الجبهات بحسب الخطر لا بحسب الرغبة، وكان في هذا ما جعل الفتوح منظمةً لا متفرقة. وقد كان في هذا الترتيب ما جعل الجيوش تنتقل من جبهةٍ إلى أخرى بحسب الأولوية، وكان في هذا ما وفّر على الدولة جهدًا كبيرًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في عهده فتح بيت المقدس وزيارته له، وكان في هذا ما جعل الجبهة الشامية تُستكمل دينيًّا، وكان في عهده أيضًا فتح أنطاكية وبعض مدن الساحل، وكان في هذا ما جعل الشام كلها في يد المسلمين ما عدا بعض الموانئ التي كانت تحتاج إلى أسطول. وقد كان في هذه الفتوح ما جعل الشام تُصبح قاعدةً للجيش الإسلامي في الشمال، وكان في هذا ما ساعد على فتح أرمينية بعد ذلك.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في عهده فتح مصر والإسكندرية، وكان في هذا ما جعل الدولة تُشرف على البحر المتوسط من الجنوب، وكان في هذا ما جعل بيزنطة تفقد موردها الأساسي من الحبوب. وقد كان في هذا الفتح ما جعل المسلمين يُدركون أهمية البحر، وكان في هذا ما دفع إلى إنشاء الأسطول في العهد التالي. وقد كان في هذا الفتح ما جعل مصر تُصبح ولايةً ذات دخلٍ كبير، وكان في هذا ما جعلها هدفًا للأسطول البيزنطي سنوات.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في عهده فتح العراق كاملًا بعد القادسية والمدائن، ثم فتح فارس في معارك نهاوند وأصبهان وكرمان وسجستان، وكانت الفتوح تمتدّ شرقًا حتى خراسان. وقد كان في هذا التوسّع ما جعل الدولة تُواجه شعوبًا جديدة ولغاتٍ جديدة وأديانًا جديدة، وكان في هذا ما دفع إلى تطوير النظام الإداري والقانوني. وقد كان في هذا التوسّع ما جعل الدولة تُواجه شعوبًا لا تعرف العربية، وكان في هذا ما دفع إلى تعريب الدواوين بعد ذلك.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في عهده أيضًا فتح أرمينية وأذربيجان في الشمال، وكانت هذه الجبهة تُواجه بيزنطة والخزر، وكان في هذا ما جعل الدولة تُشرف على القوقاز. وقد كان في هذه الجبهة ما يُظهر أن الفتوح لم تكن في اتجاهٍ واحد، بل كانت في كل الاتجاهات التي فيها خطر أو مصلحة. وقد كان في هذه الجبهة ما جعل المسلمين يُدركون أن الشمال بابٌ إلى آسيا الصغرى، وكان في هذا ما جعل بيزنطة تُدافع عنه بجهدٍ كبير.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في سياسته أن لا يُولّي قائدًا واحدًا كل الجبهات، وكان يُبدّل القادة، وكان في هذا ما يمنع أن يصير قائدٌ قويًّا بما يُهدّد الدولة. وقد كان في هذا ما يُشبه ما يُعرف اليوم بفصل السلطات، وكان في هذا ما يُفسّر أن الفتوح لم تُنتج إماراتٍ مستقلة في عهده، بخلاف ما حدث في عهودٍ لاحقة. وقد كان في هذا التبديل ما منع أن تُصبح الجبهات إماراتٍ وراثية، وكان في هذا ما حافظ على وحدة القيادة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الفتوح في عهده نظامٌ في الصلح: أن تُصالح المدن على شروطٍ مكتوبة، وأن يُترك للناس دينهم وأموالهم، وكان في هذا ما جعل الفتح مستقرًّا، وكان في هذا ما يُفسّر أن الشعوب المفتوحة لم تُثِر ثوراتٍ كبيرة في القرون الأولى. وقد كان في هذا النظام ما يُخالف ما فعله كثيرٌ من الفاتحين في التاريخ، وكان في هذا ما يُعدّ من أخلاقيات الحرب في الإسلام.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في عهده أيضًا توقّف الفتوح في بعض السنوات، وكان في هذا ما يُظهر أن الدولة كانت تُراجع قوّتها، وكان في هذا ما يُفسّر أن الفتوح لم تكن انفجارًا واحدًا بل موجاتٍ متتابعة. وقد كان في هذا درسٌ في إدارة التوسّع: أن الدولة تحتاج إلى وقتٍ لتهضم ما فتحت، وأن التوسّع الذي لا يُتبعه تنظيم يُنتج انهيارًا بعد جيل. وقد كان في هذه المراجعة ما جعل الفتوح منظمةً لا انفجارية، وكان في هذا ما يُفسّر أن الدولة لم تنهار بعد التوسّع الكبير.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالجبهات الأربع\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الدولة تُقاتل في الشام ومصر والعراق وفارس وأرمينية، وكان في هذا عبءٌ لوجستي هائل على دولةٍ لم يكن لها أسطول ولا سكك ولا إدارة كبيرة. وقد كان في نجاحها دليلًا على أن الإدارة كانت بسيطةً وفعّالة، وأن القادة كانوا يُديرون ميدانهم بقرارٍ سريع دون انتظار المركز.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا التعدّد خطرٌ أيضًا: أن تُستهلك الجيوش، وأن تُفتح جبهةٌ وتُترك أخرى، وكان في هذا ما جعل عمر يُرجّح جبهةً على أخرى في بعض السنوات. وقد كان في هذا الترجيح ما يُظهر أن القيادة الاستراتيجية ليست فتح كل الجبهات بل اختيار ما يُفتح أولًا. وقد كان في هذا التعدّد ما جعل الدولة تُواجه مشكلاتٍ مختلفة في وقتٍ واحد، وكان في هذا ما دفع إلى تطوير الإدارة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالصلح والجزية\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت المدن تُصالح على شروطٍ تُحدّد الجزية والخراج وحقوق السكان، وكان في هذه الشروط ما يجعل الفتح عمليةً قانونية. وقد كان في هذا ما جعل الناس يُقبلون الحكم الجديد لأنهم يعرفون ما عليهم، وكان في هذا ما يُفسّر أن المدن التي صالحت لم تثر بعد ذلك. وقد كان في هذا النظام ما جعل الفتح مقبولًا عند الناس، لأنهم كانوا يعرفون ما عليهم وما لهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في نظام الجزية ما يُظهر أن الدولة كانت تُفرّق بين الأرض والدين: فالأرض تُدفع عنها ضريبةً سواء أسلم صاحبها أو لا، والشخص يُدفع عنه جزيةً إن لم يُسلم. وقد كان في هذا النظام ما جعل الإسلام ينتشر بالتدريج، لأن من أسلم صار له ما للمسلمين من العطاء والحماية.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eحدود التوسّع\u003c/h4\u003e\u003cp class=\"ap\"\u003eتوقّف التوسّع في بعض الجهات لأن الدولة وصلت إلى حدودٍ طبيعية: البحر في الغرب، والجبال في الشمال، والصحاري في الجنوب. وقد كان في هذا ما جعل الفتوح في عهد عمر تُرسم لها حدودٌ واضحة، وكان في هذا ما يُفسّر أن عهده يُعدّ عهد التأسيس لا عهد التوسّع المفتوح.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا التوقّف حكمةٌ إدارية: أن الدولة تحتاج إلى سنواتٍ لتُثبّت ما فتحت، وأن الجيوش التي تُقاتل بلا توقّف تفقد قدرتها على الحكم. وقد كان في هذا ما يُفسّر أن الفتوح في العهد العثماني والأموي بعد ذلك كانت تُبنى على أساسٍ من النظام لا على أساسٍ من الحماس وحده.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالشام\u003c/b\u003e\u003cspan\u003eاليرموك ثم بيت المقدس\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمصر\u003c/b\u003e\u003cspan\u003e١٩ – ٢١هـ\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eفارس\u003c/b\u003e\u003cspan\u003eالقادسية ثم نهاوند ٢١هـ\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالشمال\u003c/b\u003e\u003cspan\u003eأرمينية وأذربيجان\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالسياسة\u003c/b\u003e\u003cspan\u003eتبديل القادة ومنع الاستقلال\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالجبهة\u003c/th\u003e\u003cth\u003eأهم وقائعها\u003c/th\u003e\u003cth\u003eالنتيجة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالشام\u003c/td\u003e\u003ctd\u003eاليرموك وبيت المقدس\u003c/td\u003e\u003ctd\u003eسقوط الحكم البيزنطي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eمصر\u003c/td\u003e\u003ctd\u003eبابليون والإسكندرية\u003c/td\u003e\u003ctd\u003eولايةٌ إسلامية غنية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالعراق\u003c/td\u003e\u003ctd\u003eالقادسية والمدائن\u003c/td\u003e\u003ctd\u003eنهاية العاصمة الساسانية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eفارس\u003c/td\u003e\u003ctd\u003eنهاوند وأصبهان\u003c/td\u003e\u003ctd\u003eانهيار الدولة الساسانية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالشمال\u003c/td\u003e\u003ctd\u003eأرمينية وأذربيجان\u003c/td\u003e\u003ctd\u003eحدودٌ مع بيزنطة والخزر\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eلِّيُظْهِرَهُ عَلَى الدِّينِ كُلِّهِ\u003c/p\u003e\u003ccite\u003eسورة التوبة، الآية ٣٣\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eفي عشر سنوات فُتحت أربع جبهات كبرى، وكان التوسّع يُراجَع كل سنة ويُوقَف عند حدودٍ طبيعية. وقد كان في سياسة الصلح والخراج ما جعل الفتح مستقرًّا لا حملةً عابرة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"assassination","n":"مقتله واختيار الستة","ic":"🗳️","part":"القسم الثالث: عمر بن الخطاب","h":"\u003carticle class=\"ch3\" id=\"assassination\" data-toc=\"مقتله واختيار الستة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e3.4\u003c/span\u003e\n          \u003ch3\u003e🗳️ مقتله واختيار الستة\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي أواخر سنة ثلاث وعشرين للهجرة طُعن عمر في المسجد وهو يُصلّي، وكان الطاعن غلامًا فارسيًّا. وقد رفض عمر أن يُسمّي خليفةً بنفسه، وترك الأمر لستةٍ من الصحابة، فكان في هذا القرار أصلٌ في الشورى.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان أبو لؤلؤة فيروز غلامًا للمغيرة بن شعبة، وكان من أهل فارس، وقد اشتكى إلى عمر من ثقل خراجه على مولاه، فقال له عمر: ما خراجك بكبير، وكان في هذه الكلمة ما أغضبه. وقد طعن عمر في صلاة الفجر بضربةٍ في خاصرته، وطعن معه عدةً من الصحابة، ثم قتل نفسه، وكان في هذا الحادث ما جعل المدينة في صدمة كبيرة. وقد كان في هذه الصدمة ما جعل المدينة تُدرك أن الخلافة صارت هدفًا، وكان في هذا ما دفع إلى وضع حرسٍ للخليفة بعد ذلك.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد عاش عمر بعد الطعنة أيامًا، وكان يُسأل عن الخلافة، فرفض أن يُولّي ابنه عبد الله وقال: لا أُحمّل آل الخطاب وزرًا، وكان في هذا الرفض ما يُظهر أنه كان يخشى أن تصير الخلافة ملكًا في بيتٍ واحد. وقد قال كلمته المعروفة: لو كان سالم مولى أبي حذيفة حيًّا ما خالفت، وكان في هذا ما يُظهر أن معياره كان الكفاءة لا النسب. وقد كان في هذا الرفض ما جعل بيت الخطاب بعيدًا عن السلطة، وكان في هذا ما حفظ له مكانته في الذاكرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد اختار عمر ستةً من الصحابة ليختاروا من بينهم: عثمان وعلي وطلحة والزبير وسعد بن أبي وقاص وعبد الرحمن بن عوف، وكان في هذا الاختيار ما يُشبه تفويضًا لمجلسٍ صغير، وكان في هذا ما جعل الخلافة نتيجة شورى لا وصية. وقد كان في هذا القرار أصلٌ في الفكر السياسي الإسلامي، لأنه أقرّ أن السلطة تُنتقل بالاختيار لا بالتوريث. وقد كان في هذا التفويض ما جعل الخلافة نتيجة اتفاقٍ لا نتيجة وصية، وكان في هذا ما يُشبه العقد السياسي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد جرت الشورى بعد موته، وكان عبد الرحمن بن عوف قد تنازل عن حقه وأخذ يُشاور الناس، وكان في هذا ما يُشبه تصويتًا عامًّا، وكان في هذا ما جعل البيعة لعثمان أقرب إلى الإجماع. وقد كان في المشاورة ما يُظهر أن الصحابة كانوا يُميّزون بين الرجلين بحسب السياسة لا بحسب الفضل، وكان في هذا ما يُفسّر اختيار عثمان في تلك اللحظة. وقد كان في هذه المشاورة ما جعل البيعة أقرب إلى الإجماع، وكان في هذا ما منع النزاع في تلك اللحظة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان اختيار عثمان بسبب أنه كان أسنّ وأكثر خبرةً في الإدارة، وكان في هذا ما يُظهر أن الأمة كانت تُريد من يُكمل النظام الذي بدأه عمر، وكان في هذا ما جعل عهده امتدادًا لعهد عمر في التوسّع. وقد كان في هذا الاختيار أيضًا ما سيُنتج مشكلةً بعد ذلك، لأن عثمان كان لَيِّنًا مع أقاربه، وكان في هذا ما جعل الفتنة تُفتح بعد سنوات. وقد كان في هذا الاختيار ما جعل عهد عثمان امتدادًا لعهد عمر في الفتوح، وكان في هذا ما جعل الدولة تستمرّ في التوسّع سنوات.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في مقتل عمر أثرٌ كبير في الأمة: أنه كان أول خليفة يُقتل في المسجد، وكان في هذا ما يُظهر أن الفتنة صارت ممكنة، وكان في هذا ما جعل الناس يُدركون أن الدولة تحتاج إلى حمايةٍ للخليفة، وكان في هذا ما دفع إلى وضع الحرس بعد ذلك. وقد كان في هذا المقتل ما جعل الفتنة ممكنةً بعد ذلك، وكان في هذا ما يُفسّر اضطراب الأمة في العقود التالية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في وصاياه في آخر أيامه ما يُظهر اهتمامه بالدولة لا بنفسه: أنه أوصى بأن تُقضى ديونه، وأن يُنظر في أمر من قُتل معه، وأن يُستشار في الخلافة. وقد كان في هذا ما يُظهر أن الرجل كان يُدير حتى وهو في مرض الموت، وكان في هذا ما جعل سيرته تُروى كاملةً في كتب التاريخ والأدب. وقد كان في هذه الوصايا ما جعل الناس يرون أن الخليفة كان يُدير الدولة إلى آخر لحظة، وكان في هذا ما جعل سيرته تُروى كاملة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بقي في الذاكرة الإسلامية أن عمر كان الخليفة الذي جمع بين الفتح والعدل والإدارة، وكان في سيرته ما جعل بعض المؤرخين يقولون إن الدولة الإسلامية بلغت في عهده توازنًا لم تُحقّقه بعد ذلك. وقد كان في هذا القول مبالغة، لكنه يُظهر أن عهده كان نموذجًا في الوعي الجمعي، وكان في هذا النموذج ما يُستدعى في كل أزمةٍ بعد ذلك. وقد كان في هذا النموذج ما جعل الناس يقيسون به كل حاكمٍ بعد ذلك، وكان في هذا ما جعل سيرة عمر مرجعًا في الخطاب السياسي.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eلماذا رفض التوريث\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان عمر يستطيع أن يُولّي ابنه عبد الله، وكان عبد الله من علماء الصحابة ومن أهل الفضل، لكنه رفض وقال إنه لا يُريد أن يُحمّل بيته وزر الخلافة. وقد كان في هذا الرفض موقفٌ من مسألة التوريث التي ستظهر بعد ذلك في الدولة الأموية، وكان في هذا ما يُظهر أن عمر كان يرى الخلافة أمانةً لا ميراثًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في رفضه أيضًا حمايةٌ للدولة من النزاع، لأن التوريث يُنتج صراعًا بين أبناء البيت الواحد، وكان في هذا ما يُفسّر أن عمر اختار جماعةً من الصحابة لا فردًا. وقد كان في هذا القرار ما جعل الشورى ممكنةً، وكان في هذا ما يُعدّ من أهمّ ما تركه في الفكر السياسي.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالشورى الستة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الشورى الستة تجربةً فريدة في تاريخ الخلافة، لأنها جمعت بين التعيين والتداول: أن يُعيّن عمر المرشحين ويترك للناس أن يختاروا. وقد كان في هذا ما يُشبه النظام الانتخابي غير المباشر، وكان في هذا ما جعل البيعة لعثمان مقبولةً عند الأكثرية. وقد كان في هذا الموقف ما جعل مسألة التوريث تُطرح بعد ذلك، وكان في هذا ما جعل الأمويين يُواجهون سؤالًا قديمًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه التجربة مشكلةٌ أيضًا: أنها لم تُحدّد آليةً واضحة للاختيار، وكان في هذا ما جعل النزاع ممكنًا بعد ذلك. وقد كان في هذا درسٌ في بناء المؤسسات: أن الشورى تحتاج إلى قواعد إجرائية لا إلى نوايا حسنة فقط، وأن من يُترك له الاختيار بلا قواعد قد يقع في النزاع.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eميراث عمر\u003c/h4\u003e\u003cp class=\"ap\"\u003eترك عمر دولةً لها ديوانٌ وجيشٌ وأمصارٌ وقضاءٌ وتقويم، وترك سيرةً صارت مرجعًا في العدل والمساءلة. وقد كان في هذا الميراث ما جعل عهده يُدرس في الفكر السياسي أكثر من أي عهدٍ آخر، لأن فيه قواعد يمكن أن تُقارن بأنظمة الحكم في كل زمان. وقد كان في هذه التجربة ما جعل الشورى تحتاج إلى قواعد، وكان في هذا ما ظهر في النزاع بعد مقتل عثمان.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في ميراثه أيضًا مشكلاتٌ لم تُحلّ: أن الفتنة صارت ممكنة، وأن مسألة الخلافة لم تُؤسّس لها آلية واضحة، وأن الأمة لم تُحدّد كيف تُختار القيادة إذا اختلف الناس. وقد كان في هذه المشكلات ما سيظهر في عهد عثمان وعلي، وكان في هذا ما يُفسّر أن القرن الأول كان قرن بناءٍ وفتنة في وقتٍ واحد.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمقتل\u003c/b\u003e\u003cspan\u003eأواخر سنة ٢٣هـ في المسجد\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالقاتل\u003c/b\u003e\u003cspan\u003eأبو لؤلؤة فيروز المجوسي\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالوصية\u003c/b\u003e\u003cspan\u003eشورى من ستةٍ من الصحابة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمختار\u003c/b\u003e\u003cspan\u003eعثمان بن عفان\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمبدأ\u003c/b\u003e\u003cspan\u003eرفض التوريث\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e٢٣هـ\u003c/td\u003e\u003ctd\u003eطعن عمر في المسجد\u003c/td\u003e\u003ctd\u003eأول خليفة يُقتل في المسجد\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٢٣هـ\u003c/td\u003e\u003ctd\u003eرفض توريث ابنه\u003c/td\u003e\u003ctd\u003eتأكيدُ مبدأ عدم التوريث\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٢٣هـ\u003c/td\u003e\u003ctd\u003eتحديد الستة\u003c/td\u003e\u003ctd\u003eشورى محدودة العدد\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٢٣هـ\u003c/td\u003e\u003ctd\u003eمشاورة عبد الرحمن\u003c/td\u003e\u003ctd\u003eبيعةٌ قريبة من الإجماع\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٢٣هـ\u003c/td\u003e\u003ctd\u003eخلافة عثمان\u003c/td\u003e\u003ctd\u003eاستمرارُ الفتوح والتوسّع\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eوَأَمْرُهُمْ شُورَىٰ بَيْنَهُمْ\u003c/p\u003e\u003ccite\u003eسورة الشورى، الآية ٣٨\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eقُتل عمر في المسجد سنة ٢٣هـ، ورفض أن يُورّث الخلافة لابنه، وترك الأمر لستةٍ من الصحابة فاختاروا عثمان. وقد كان في هذا القرار أصلٌ في الشورى، وفي رفضه للتوريث موقفٌ بقي مرجعًا في الفكر السياسي.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-4","n":"القسم الرابع: عثمان وعلي","ic":"","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-4\" style=\"--c:#8B1A3A\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🌊\u003c/div\u003e\n      \u003ch2\u003eالقسم الرابع: عثمان وعلي\u003c/h2\u003e\n      \u003cp\u003eحكم عثمان اثنتي عشرة سنة، فاتسعت الدولة إلى أقصى مداها، ثم انتهى عهده بمقتله في بيته. ثم حكم عليٌّ خمس سنوات لم يهدأ فيها القتال، فكانت تلك السنوات هي التي شكّلت الفرق والمواقف التي بقيت في الأمة إلى اليوم.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#uthman-expansion\"\u003eخلافة عثمان وتوسّع الدولة\u003c/a\u003e\u003ca href=\"#fitna-uthman\"\u003eالفتنة ومقتل عثمان\u003c/a\u003e\u003ca href=\"#camel-siffin\"\u003eالجمل وصفين\u003c/a\u003e\u003ca href=\"#nahrawan\"\u003eالتحكيم والنهروان ونهاية علي\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"uthman-expansion","n":"خلافة عثمان وتوسّع الدولة","ic":"🌍","part":"القسم الرابع: عثمان وعلي","h":"\u003carticle class=\"ch3\" id=\"uthman-expansion\" data-toc=\"خلافة عثمان وتوسّع الدولة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e4.1\u003c/span\u003e\n          \u003ch3\u003e🌍 خلافة عثمان وتوسّع الدولة\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي عهد عثمان بلغت الدولة أقصى اتساعها في الشرق والغرب، ونزل المسلمون البحر للمرة الأولى، ودخلت خراسان وإفريقية في دار الإسلام. وفي عهده أيضًا جُمعت الأمة على مصحفٍ واحد.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eتولّى عثمان الخلافة سنة ٢٣هـ بعد شورى الستة، وكان من أوائل من أسلم ومن كتّاب الوحي، وكانت له مكانةٌ في قريش وفي الإسلام، وكان في شخصيته لينٌ وكرم، وكان في هذا اللين ما جعله يُحبّ أن يُرضي الناس، وكان في الوقت نفسه ما جعل بعض أقاربه ينفذون إلى المناصب في عهده. وقد كان في هذا اللين ما جعله يُحسن إلى الناس، وكان في الوقت نفسه ما جعل الحزم يقلّ في مواضع كان يحتاج فيها إلى الحزم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في عهده توسّعٌ كبير في الشرق: فقد فُتحت أرمينية وأذربيجان في الشمال، وفُتحت خراسان في الشرق، ووصلت الجيوش إلى نهر جيحون، وكان في هذا ما جعل الدولة تُشرف على آسيا الوسطى. وقد كان في هذه الفتوح ما جعل الفرس يفقدون دولتهم نهائيًّا، وكان في هذا ما جعل الفرس يُصبحون رعيةً في دولةٍ عربية. وقد كان في هذه الفتوح ما جعل الدولة تُواجه شعوبًا جديدة، وكان في هذا ما دفع إلى تطوير الإدارة والخراج في تلك النواحي البعيدة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في عهده توسّعٌ في الغرب: فقد أُرسلت حملةٌ إلى إفريقية سنة ٢٧هـ بقيادة عبد الله بن سعد بن أبي سرح، وقد انتصرت في وقعة سُبيطلة، وقُتل فيها حاكمها البيزنطي، وكان في هذا الفتح ما جعل المسلمين يُشرفون على تونس، وكان في هذا ما مهّد لفتح الأندلس بعد ذلك بسبعين سنة. وقد كان في هذه الحملة ما جعل المسلمين يعرفون طرق الغرب، وكان في هذا ما ساعد على فتح الأندلس بعد ذلك، لأن الطريق صار معروفًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في عهده أن دخل المسلمون البحر: فقد أذن عثمان لمعاوية في بناء أسطول، وكان معاوية واليًا على الشام، وكان قد طلب ذلك من عمر فرفض، فلمّا جاء عثمان أذن له، وكان في هذا قرارًا تاريخيًّا. وقد فُتحت قبرص سنة ٢٨هـ، وكانت أول جزيرةٍ يفتحها المسلمون من البحر، وكان في هذا ما جعل المسلمين قوةً بحرية في المتوسط. وقد كان في هذا القرار ما جعل المسلمين يُدركون أن البحر ميدانٌ لا بدّ منه، وأن من لا يملك أسطولًا لا يستطيع أن يحمي سواحله الطويلة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في عهده أن جُمع الناس على مصحفٍ واحد، وكان السبب أن حذيفة بن اليمان رأى في أرمينية اختلافًا في القراءة بين أهل الشام وأهل العراق، فرجع إلى عثمان وقال: أدرك الأمة قبل أن يختلفوا في كتابهم. فأمر عثمان بنسخ المصاحف من المصحف الذي جمعه أبو بكر، وأرسل إلى الأمصار نسخةً مع قارئٍ يُعلّم الناس، وكان في هذا القرار ما حفظ وحدة النصّ إلى اليوم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في عهده أن الدولة صارت أكثر تعقيدًا، لأنها اتّسعت اتساعًا كبيرًا، وكانت تحتاج إلى إدارةٍ أكبر، وكان عثمان يُولّي أقاربه من بني أمية في بعض المناصب، وكان في هذا ما أثار عليه الناس. وقد كان في بعض هؤلاء الولاة كفاءةً، وكان في بعضهم ما أثار الشكوك، وكان في هذا ما جعل المعارضة تنمو في الأمصار. وقد كان في هذا التوسّع ما جعل الدولة تحتاج إلى إدارةٍ أكبر، وكان في هذا ما جعل المناصب تُصبح مطمعًا لأهل الطمع، وكان في هذا ما أضعف الثقة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في عهده أن الأموال كثرت، وأن الناس صاروا يتنافسون في الدنيا، وكان في هذا ما يُخالف بساطة العهد الأول، وكان في هذا ما جعل بعض الصحابة ينتقدون السياسة المالية. وقد كان في هذا النقد ما هو حقّ، وكان فيه ما هو مبالغة، وكان في الاثنين ما جعل المناخ يتوتّر سنةً بعد سنة. وقد كان في هذا التنافس ما جعل الناس يقيسون الحكم بالمال لا بالعدل، وكان في هذا ما جعل المعارضة تجد أرضًا خصبة في الأمصار.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في عهده أيضًا بناءٌ وإعمار: أنه وسّع المسجد الحرام والمسجد النبوي، وكان في هذا ما جعل الحرمين يستوعبان الحجيج المتزايد. وقد كان في هذا ما يُظهر أن عهده كان عهد تحوّلٍ من دولة فتح إلى دولة إدارة وعمران، وكان في هذا ما جعله يُواجه مشكلاتٍ جديدة لم تكن في عهدي أبي بكر وعمر. وقد كان في هذا العمران ما جعل الحرمين يستوعبان الحجيج، وكان في هذا ما يُظهر أن الدولة صارت تُنفق على البنية لا على الحرب فقط.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالمصحف الإمام\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان جمع المصحف في عهد عثمان خطوةً ثانيةً بعد جمعه في عهد أبي بكر، وكانت الأولى جمعًا للنصّ في موضعٍ واحد، وكانت الثانية توحيدًا للنسخ في الأمصار. وقد كان في هذا القرار ما يُشبه سياسة التوحيد الثقافي، لأن اختلاف القراءات كان يُهدّد وحدة الأمة في وقتٍ كانت فيه الفتوح قد فرّقت الناس في البلدان.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أرسل عثمان مع كل مصحفٍ قارئًا يُعلّم الناس، وكان في هذا ما جعل النصّ ينتشر بصورةٍ موحّدة، وكان في هذا أيضًا ما جعل بعض الصحابة يتحرّجون من إحراق المصاحف المخالفة. وقد كان في القرار جدلٌ في وقته، لكن نتيجته أن الأمة بقيت على نصٍّ واحد، وهذا ما يُعدّ من أعظم أعمال عثمان.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالأسطول وقبرص\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان فتح قبرص أول عملٍ بحري للمسلمين، وكان يحتاج إلى سفنٍ وبحّارةٍ وخبرةٍ لم تكن عند العرب، وكان في هذا ما جعل المسلمين يستعينون بأهل السواحل من الشام ومصر. وقد كان في هذا الفتح ما أظهر أن الدولة قادرة على أن تتعلّم ما لا تُحسنه، وأن البحر ليس حاجزًا لا يُعبر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا الفتح خطرٌ أيضًا، لأن الأسطول كان يحتاج إلى نفقاتٍ كبيرة، وكانت الرحلة بحرية في وقتٍ لا توجد فيه خرائط ولا بوصلة، وكان في هذا ما يُظهر أن القرار كان جريئًا. وقد كان في نجاحه ما جعل معاوية يُصبح صاحب القوّة البحرية في الدولة، وكان في هذا ما سيؤثّر في السياسة بعد ذلك.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالإدارة والأقارب\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان من أبرز ما أُخذ على عثمان أنه ولّى أقاربه، وكان في هذا ما يُخالف سياسة عمر التي كانت تُبعد الأقارب عن المناصب. وقد كان في بعض هؤلاء كفاءة، لكن المسألة كانت في المبدأ: أن الناس رأوا أن المال والسلطة صارا يدوران في بيتٍ واحد. وقد كان في هذا المبدأ ما جعل الناس يرون أن المال صار يدور في بيتٍ واحد، وكان في هذا ما أضعف الثقة بالدولة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا ما جعل المعارضة تُنظّم نفسها في الأمصار، وكان في هذا ما يُظهر أن الحكم لا يُقاس بالنيّة بل بالصورة، وأن الناس إذا رأوا ما يُشبه المحاباة فقدوا الثقة ولو كان الوالي كفؤًا. وقد كان في هذا درسٌ في الإدارة: أن الشفافية جزءٌ من العدل لا زيادةٌ عليه.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالخلافة\u003c/b\u003e\u003cspan\u003e٢٣ – ٣٥هـ\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالفتوح\u003c/b\u003e\u003cspan\u003eخراسان وإفريقية وأرمينية\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالبحر\u003c/b\u003e\u003cspan\u003eأسطول معاوية وفتح قبرص ٢٨هـ\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمصحف\u003c/b\u003e\u003cspan\u003eنسخ المصاحف وتوحيد النصّ\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالعمران\u003c/b\u003e\u003cspan\u003eتوسعة المسجد الحرام والنبوي\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e٢٣هـ\u003c/td\u003e\u003ctd\u003eخلافة عثمان\u003c/td\u003e\u003ctd\u003eاستمرار الفتوح\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٢٧هـ\u003c/td\u003e\u003ctd\u003eحملة إفريقية\u003c/td\u003e\u003ctd\u003eدخول الغرب الإسلامي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٢٨هـ\u003c/td\u003e\u003ctd\u003eفتح قبرص\u003c/td\u003e\u003ctd\u003eأول فتحٍ بحري\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٣٠هـ\u003c/td\u003e\u003ctd\u003eنسخ المصاحف\u003c/td\u003e\u003ctd\u003eتوحيد النصّ في الأمصار\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٣٠ – ٣٥هـ\u003c/td\u003e\u003ctd\u003eتوترٌ في الأمصار\u003c/td\u003e\u003ctd\u003eبداية المعارضة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eإِنَّا نَحْنُ نَزَّلْنَا الذِّكْرَ وَإِنَّا لَهُ لَحَافِظُونَ\u003c/p\u003e\u003ccite\u003eسورة الحجر، الآية ٩\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eاتّسعت الدولة في عهد عثمان إلى خراسان وإفريقية، ودخل المسلمون البحر وفتحوا قبرص، وجُمعت الأمة على مصحفٍ واحد. وقد كان في تولية الأقارب ما أثار المعارضة، وكان في هذا بداية الطريق إلى الفتنة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"fitna-uthman","n":"الفتنة ومقتل عثمان","ic":"💔","part":"القسم الرابع: عثمان وعلي","h":"\u003carticle class=\"ch3\" id=\"fitna-uthman\" data-toc=\"الفتنة ومقتل عثمان\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e4.2\u003c/span\u003e\n          \u003ch3\u003e💔 الفتنة ومقتل عثمان\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي سنة خمس وثلاثين للهجرة حاصر الناس بيت عثمان أربعين يومًا، ثم دخلوا عليه فقتلوه وهو يقرأ القرآن. وكان في مقتله بداية فتنةٍ لم تُغلق أبوابها بعد ذلك.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eبدأت المعارضة في الأمصار، وكانت في الكوفة والبصرة والفسطاط، وكانت تُعبّر عن مطالبٍ مالية وسياسية: أن تُوزّع الأموال بعدل، وأن يُعزل الولاة الذين يُتهمون، وأن يُحاسب من أخذ من المال. وقد كان في هذه المطالب ما هو مشروع، وكان فيها ما هو مُبالغ، وكان في الاثنين ما جعل الحركة تكبر. وقد كان في هذه المطالب ما جعل الحركة تبدأ من الحقّ ثم تنتهي إلى الفوضى، لأن من يُطالب بحقٍّ لا يتحكّم فيمن ينضمّ إليه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد جاءت وفودٌ من الأمصار إلى المدينة سنة ٣٥هـ، وكانت تطالب عثمان بتغيير السياسة، وقد وعدهم بذلك، ثم رجعوا، ثم عادوا بعد أن أشيع أن رسالةً قد كُتبت من المدينة إلى والي مصر بأن يُقتل بعضهم. وقد كان في هذه الرسالة ما هو محلّ خلافٍ بين المؤرخين: فمنهم من قال إنها كُتبت بغير علم عثمان، ومنهم من قال إنها من مروان، والذي لا خلاف فيه أنها كانت الشرارة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد حاصر الناس بيت عثمان، وكان الحصار أربعين يومًا، وكان في المدينة من الصحابة من لم يُشارك، وكان فيهم من دافع عنه، وكان فيهم من حاول أن يُصلح. وقد كان في هذا الموقف ما يُظهر أن المدينة كانت منقسمةً بين فريقٍ يُدافع وفريقٍ يُطالب وفريقٍ ينتظر، وكان في هذا ما جعل الموقف يخرج عن سيطرة الجميع. وقد كان في هذا الحصار ما جعل المدينة تُدرك أن الخلافة لم تعد محصّنة، وكان في هذا ما جعل الناس يفقدون الثقة في الأمن العام.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد قُتل عثمان في بيته، وكان يقرأ في المصحف، وكانت زوجته نائلة تُدافع عنه فقُطعت أصابعها، وكان في مقتله ما جعل الدم يقع على المصحف، وكان في هذه الصورة ما بقيت في الذاكرة الإسلامية قرونًا. وقد كان في مقتله أول خليفةٍ يُقتل بهذه الطريقة بعد عمر، وكان في هذا ما جعل الأمة تدخل في مرحلةٍ جديدة. وقد كان في هذه الصورة ما جعل مقتل عثمان يُصبح رمزًا في الخطاب السياسي، وكان في هذا ما استُعمل بعد ذلك في كل نزاعٍ على الشرعية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في مقتله مشكلةٌ سياسية كبيرة: أن قتلته كانوا جماعةً من الثائرين، وأنه لم يكن هناك سلطةٌ قادرة على أن تُقيم الحدّ، وكان في هذا ما جعل المطالبة بالقصاص مسألةً مركزية في الفتنة. وقد كان في هذا المطلب ما هو حقّ، لأن دم الخليفة لا يُهدر، وكان فيه ما جعل الحرب ممكنة، لأن من يُطالب بالقصاص يُريد سلطةً تُنفّذه. وقد كان في هذا المطلب ما جعل الحرب ممكنة، لأن من يُطالب بالقصاص يُريد سلطةً تُنفّذه، وكان في هذا ما جعل الصدام بين عليٍّ ومعاوية مسألة وقت.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في اختيار عليٍّ بعد ذلك مخرجًا مؤقّتًا، لأن أهل المدينة بايعوه، وكان في هذا ما جعله الخليفة الشرعي، وكان في الوقت نفسه ما جعل عليه عبئًا كبيرًا، لأنه لم يكن قادرًا على أن يُعاقب القتلة في أول الأمر، لأنهم كانوا جماعةً لها أنصار، وكان في هذا ما جعل معاوية يُطالبه بالقصاص ويُعلّق بيعته على ذلك. وقد كان في هذا العبء ما جعل عليًّا يبدأ خلافته بأزمةٍ لا بحلّ، وكان في هذا ما جعل سنوات حكمه سنوات دفاعٍ لا بناء.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في مقتل عثمان أثرٌ عميق في الفكر السياسي الإسلامي: أنه فتح باب الفتنة، وأنه جعل المسلمون يتساءلون عن حكم من يخرج على الإمام، وعن حكم من يُعين على قتل خليفة، وعن مسؤولية الجماعة في حفظ الأمن. وقد كان في هذه الأسئلة ما أنتج مذاهب وفرقًا في العقيدة والسياسة، وكان في هذا ما يُفسّر أن القرن الأول كان قرن تأسيسٍ واختلاف. وقد كان في هذه الأسئلة ما أنتج فرقًا في العقيدة، وكان في هذا ما جعل الفكر السياسي الإسلامي يبدأ من سؤال الفتنة لا من سؤال الدولة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بقي في المصادر اختلافٌ كبير في تفاصيل مقتل عثمان، وكان في هذا الاختلاف ما يُظهر أن الرواية التاريخية تُبنى على الولاءات، وأن من أراد أن يفهم تلك السنوات عليه أن يقرأ الروايات المتعددة لا روايةً واحدة. وقد كان في هذا درسٌ في التاريخ: أن الحقيقة قد تكون في التقاطع بين الروايات لا في واحدةٍ منها. وقد كان في هذا الاختلاف ما جعل المؤرخين يضعون قواعد للرواية، وكان في هذا ما أنتج علم الحديث وعلم الرجال، وهو من ثمار الأزمة.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالرسالة المزعومة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الرسالة التي قيل إنها كُتبت إلى والي مصر هي نقطة التحوّل، لأنها حوّلت المطالب إلى اتّهامٍ بالغدر، وكان في هذا ما جعل الوفود تعود مسلّحةً. وقد كان في الروايات أن عثمان حلف أنه لم يكتبها، وأنه لا يعرف من كتبها، وكان في هذا ما يُظهر أن الخلافة كانت قد فقدت سيطرتها على جهازها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه الحادثة ما يُشبه الأزمات السياسية في كل زمان: أن وثيقةً واحدة قد تُشعل حربًا، وأن الشكّ قد يكون أقوى من الدليل. وقد كان في هذا ما جعل المؤرخين يتحدّثون عن ضرورة الشفافية في الحكم، لأن الغموض في الأزمات يُنتج تفسيراتٍ أسوأ من الواقع. وقد كان في هذا الغموض ما جعل الشكّ أقوى من الدليل، وكان في هذا ما يُفسّر أن الوفود عادت مسلّحة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالحصار\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الحصار أربعين يومًا، وكان في المدينة من يستطيع أن يُدافع عن عثمان، وكان فيهم الحسن والحسين وأبناء الصحابة، وقد أرسلهم عثمان إلى بيوتهم وأبى أن يُراق دمٌ من أجله. وقد كان في هذا الموقف ما يُظهر أنه كان يُريد أن يحقن الدماء ولو كان الثمن حياته. وقد كان في هذا الموقف ما جعل الناس يرون أنه يُريد أن يحقن الدماء، وكان في هذا ما جعل مقتله فاجعةً في الوعي الجمعي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الحصار ما يُظهر انقسام المدينة: أن الناس لم يكونوا كلهم معه ولا كلهم عليه، وكان في هذا ما جعل الموقف غامضًا، لأن الجماهير كانت تنتظر من ينتصر. وقد كان في هذا ما يُفسّر أن الفتنة استمرّت بعد مقتله، لأنها لم تكن بين طرفين واضحين بل بين جماعاتٍ متعددة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالمطالبة بالقصاص\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان مطلب القصاص هو محور الفتنة بعد مقتل عثمان، وكان في هذا المطلب حقٌّ لا يُنكر، لأن دم الخليفة لا يُهدر، وكان في الوقت نفسه ما جعل الحرب ممكنة، لأن تنفيذه كان يحتاج إلى سلطةٍ قوية وجيش. وقد كان في هذا التردّد ما جعل الطرفين يتّهمان بعضهما، وكان في هذا ما جعل الحرب قائمةً سنوات.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان عليٌّ يرى أن الوقت لا يُساعد على القصاص، لأن القتلة كانوا جماعةً في جيشه، وأن الحرب مع معاوية ستُضعف الدولة أكثر. وقد كان في موقفه حسابٌ سياسي، وكان في موقف معاوية مطلبٌ شرعي، وكان في الاثنين ما جعل الحرب قائمة، وكان في هذا ما يُفسّر أن الفتنة لم تكن بين حقٍّ وباطل بل بين اجتهادين.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالتاريخ\u003c/b\u003e\u003cspan\u003eذو الحجة سنة ٣٥هـ\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالحصار\u003c/b\u003e\u003cspan\u003eأربعون يومًا في بيته\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالسبب\u003c/b\u003e\u003cspan\u003eرسالةٌ إلى والي مصر\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالخلافة\u003c/b\u003e\u003cspan\u003eبيعة عليٍّ في المدينة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمطلب\u003c/b\u003e\u003cspan\u003eالقصاص لدم عثمان\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e٣٤هـ\u003c/td\u003e\u003ctd\u003eبداية المعارضة في الأمصار\u003c/td\u003e\u003ctd\u003eوفودٌ ومطالب\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٣٥هـ\u003c/td\u003e\u003ctd\u003eوصول الوفود إلى المدينة\u003c/td\u003e\u003ctd\u003eوعودٌ ثم توتر\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٣٥هـ\u003c/td\u003e\u003ctd\u003eالرسالة إلى والي مصر\u003c/td\u003e\u003ctd\u003eاتّهامٌ بالغدر\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٣٥هـ\u003c/td\u003e\u003ctd\u003eحصار بيت عثمان\u003c/td\u003e\u003ctd\u003eانقسام المدينة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٣٥هـ\u003c/td\u003e\u003ctd\u003eمقتل عثمان\u003c/td\u003e\u003ctd\u003eبيعة عليٍّ وبداية الفتنة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eوَمَن يَقْتُلْ مُؤْمِنًا مُّتَعَمِّدًا فَجَزَاؤُهُ جَهَنَّمُ\u003c/p\u003e\u003ccite\u003eسورة النساء، الآية ٩٣\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eبدأت المعارضة بمطالب مالية وسياسية، ثم تحوّلت إلى حصارٍ ومقتل، وكان في الرسالة المزعومة الشرارة. وقد بقي مطلب القصاص محور الفتنة، فكان في هذا ما جعل الحرب بين عليٍّ ومعاوية ممكنة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"camel-siffin","n":"الجمل وصفين","ic":"🐪","part":"القسم الرابع: عثمان وعلي","h":"\u003carticle class=\"ch3\" id=\"camel-siffin\" data-toc=\"الجمل وصفين\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e4.3\u003c/span\u003e\n          \u003ch3\u003e🐪 الجمل وصفين\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي سنة ستٍّ وثلاثين وقعت معركة الجمل قرب البصرة، وفي سنة سبعٍ وثلاثين وقعت صفين على الفرات. وفي هاتين المعركتين قُتل من الصحابة والتابعين عددٌ كبير، وكانت الأمة تُقاتل نفسها.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eبعد بيعة عليٍّ في المدينة خرج إلى العراق، وكانت عائشة وطلحة والزبير قد خرجوا إلى البصرة يُطالبون بالقصاص لدم عثمان، وكان في خروجهم ما جعل الصدام ممكنًا. وقد كان في هذا الموقف ما يُظهر أن الفتنة لم تكن بين عليٍّ ومعاوية فقط، بل كانت بين عليٍّ وجماعةٍ من الصحابة كانوا يرون أن القصاص يجب أن يُقدَّم على كل شيء. وقد كان في خروجهم ما جعل الصدام قريبًا، لأن كل طرفٍ كان يرى أنه يُدافع عن حقٍّ لا يُمكن التنازل عنه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد جرت محاولات للإصلاح قبل المعركة، وقد التقى عليٌّ بطلحة والزبير وتحدّثوا، وكان في هذا اللقاء ما جعل الصلح ممكنًا، لكن في الليل اشتعل القتال، وكان في الروايات أن من أشعلوه هم من كانوا يخافون الصلح، لأنهم كانوا من قتلة عثمان. وقد كان في هذا ما يُظهر أن الفتنة صار لها من يُديرها من داخلٍ لا من خارج. وقد كان في هذا الاشتعال ما يُظهر أن الفتنة كان لها من يُديرها من الداخل، وأن من أشعلها كان يخاف من الصلح أكثر من الحرب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت معركة الجمل في جما
