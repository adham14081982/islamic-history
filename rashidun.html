<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="description" content="تمتد هذه الحقبة من وفاة النبي محمد ﷺ سنة 632م إلى تنازل الحسن بن علي سنة 661م، أي نحو ثلاثة عقود حُكم فيها أربعة من الصحابة هم الخلفاء الراشدون: أبو ب">
<title>الخلفاء الراشدون والفتوحات | موسوعة تاريخ الإسلام</title>
<link rel="preload" href="assets/fonts/amiri-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/amiri-700.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* ===== موسوعة تاريخ الإسلام — التنسيق المشترك ===== */

/* الخطوط محليّة (Subset عربي): لا شبكة، ولا اختلاف في القياس بين تشغيل وتشغيل */
@font-face{font-family:'Amiri';font-style:normal;font-weight:400;font-display:block;
  src:url(assets/fonts/amiri-400.woff2) format('woff2')}
@font-face{font-family:'Amiri';font-style:normal;font-weight:700;font-display:block;
  src:url(assets/fonts/amiri-700.woff2) format('woff2')}
@font-face{font-family:'Cairo';font-style:normal;font-weight:200 1000;font-display:block;
  src:url(assets/fonts/cairo-var.woff2) format('woff2')}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --gold:#B8942F;--gold2:#8B6914;--cream:#FBF4E4;--paper:#FFFDF8;
  --ink:#2E2A24;--muted:#7C7364;--line:#E7DCC3;
  --green:#1E6B3A;--blue:#155E9C;
  --shadow:0 4px 18px rgba(80,60,20,.08);
  --c:#B8942F;
}
body{font-family:'Cairo',sans-serif;background:var(--cream);color:var(--ink);
  min-height:100vh;line-height:1.9;transition:.3s}

body.dark{--paper:#201E1A;--cream:#161512;--ink:#E8E1D2;--muted:#A79E8B;
  --line:#3A362C;--shadow:0 4px 18px rgba(0,0,0,.35)}

main{max-width:820px;margin:0 auto;padding:1.2rem 1.1rem 5rem}

/* ---------- الترويسة ---------- */
header.top{position:sticky;top:0;z-index:60;display:flex;align-items:center;
  justify-content:space-between;gap:.6rem;padding:.55rem 1rem;
  background:var(--paper);border-bottom:2px solid var(--gold)}
.brand{font-family:'Amiri',serif;font-weight:700;font-size:1.02rem;color:var(--ink);
  text-decoration:none;display:flex;align-items:center;gap:.4rem}
.tools{display:flex;align-items:center;gap:.5rem}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
  background:transparent;color:var(--ink);font-size:1.05rem;cursor:pointer;
  display:grid;place-items:center;transition:.2s}
.ib:hover{background:var(--gold);color:#fff;border-color:var(--gold)}
.ib:active{transform:scale(.9)}

/* ---------- قبة التقدم ---------- */
.dome{width:38px;height:44px;position:relative;cursor:default}
.dome svg{width:100%;height:100%;display:block}
.dome .fill{fill:var(--gold);opacity:.85;transition:.4s}

/* ---------- شارات ---------- */
.badge{display:inline-flex;align-items:center;gap:.3rem;font-size:.72rem;
  background:var(--gold);color:#fff;border-radius:50px;padding:.15rem .6rem;
  font-weight:700}

/* ---------- المسار ---------- */
.crumbs{font-size:.82rem;color:var(--muted);margin-bottom:.8rem;
  display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.crumbs a{color:var(--muted);text-decoration:none}
.crumbs a:hover{color:var(--gold2)}

/* ---------- الترويسة البطلة ---------- */
.hero{position:relative;background:var(--paper);border:1px solid var(--line);
  border-top:6px solid var(--c);border-radius:20px;padding:1.6rem 1.3rem 1.4rem;
  text-align:center;box-shadow:var(--shadow);margin-bottom:1.4rem;overflow:hidden}
.hero .ic{font-size:2.6rem;line-height:1}
.hero h1{font-family:'Amiri',serif;font-size:1.9rem;color:var(--c);margin:.3rem 0 .1rem}
.hero .period{color:var(--gold2);font-size:.85rem;font-weight:600;margin-bottom:.6rem}
.hero .intro{color:var(--muted);font-size:.96rem;line-height:2;max-width:620px;margin:0 auto}

/* ---------- زخرفة SVG ---------- */
.orn{display:block;margin:1.2rem auto;opacity:.55}
.orn line,.orn path,.orn circle{stroke:var(--gold);stroke-width:1.1;fill:none}

/* ---------- العناوين ---------- */
h2.sec{font-family:'Amiri',serif;font-size:1.35rem;color:var(--c);
  margin:2rem 0 .9rem;display:flex;align-items:center;gap:.6rem}
h2.sec:before{content:"";width:6px;height:22px;background:var(--gold);
  border-radius:3px;flex:0 0 auto}
h2.sec .n{margin-right:auto;font-family:'Cairo';font-size:.75rem;color:var(--muted);font-weight:400}

/* ---------- الخط الزمني ---------- */
.tlwrap{position:relative;margin-bottom:.4rem}
.tl{display:flex;gap:.6rem;overflow-x:auto;padding:.6rem .2rem 1rem;
  scroll-snap-type:x mandatory;scrollbar-width:thin}
.tl::-webkit-scrollbar{height:5px}
.tl::-webkit-scrollbar-thumb{background:var(--gold);border-radius:9px}
.tli{flex:0 0 150px;scroll-snap-align:center;background:var(--paper);
  border:1px solid var(--line);border-right:4px solid var(--c);
  border-radius:14px;padding:.6rem .7rem;cursor:pointer;text-align:right;
  transition:.22s;font-family:'Cairo'}
.tli:hover,.tli.on{transform:translateY(-3px);box-shadow:var(--shadow);border-right-color:var(--gold)}
.tli b{display:block;color:var(--c);font-size:.9rem}
.tli span{display:block;color:var(--muted);font-size:.76rem;line-height:1.6}
.tlnav{display:flex;justify-content:space-between;margin-top:-.5rem}

/* ---------- الأحداث ---------- */
.ev{background:var(--paper);border:1px solid var(--line);border-radius:16px;
  padding:1rem 1.1rem;margin-bottom:.9rem;box-shadow:var(--shadow);
  opacity:0;transform:translateY(14px);transition:.45s}
.ev.in{opacity:1;transform:none}
.ev-head{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;margin-bottom:.5rem}
.ev-y{background:var(--c);color:#fff;font-size:.74rem;font-weight:700;
  padding:.15rem .55rem;border-radius:6px;white-space:nowrap}
.ev h3{font-family:'Amiri',serif;font-size:1.18rem;color:var(--ink)}
.ev p{font-family:'Amiri',serif;font-size:1.08rem;line-height:2.05;text-align:justify}
.ev .res{margin-top:.7rem;padding:.55rem .8rem;border-right:4px solid var(--gold);
  background:linear-gradient(135deg,rgba(184,148,47,.10),rgba(184,148,47,.04));
  border-radius:10px;font-size:.9rem;color:var(--gold2);font-weight:600}
.ev .res:before{content:"◀ النتيجة  "}

/* ---------- الشخصيات ---------- */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.6rem}
.pc{background:var(--paper);border:1px solid var(--line);border-radius:14px;
  padding:.65rem .8rem;border-top:3px solid var(--c)}
.pc b{display:block;color:var(--ink);font-size:.95rem}
.pc span{display:block;color:var(--muted);font-size:.78rem;line-height:1.65}

/* ---------- النتائج ---------- */
.outs{list-style:none}
.outs li{position:relative;padding:.5rem 1.5rem .5rem 0;border-bottom:1px dashed var(--line);
  font-size:.95rem}
.outs li:before{content:"◆";position:absolute;right:0;color:var(--gold);font-size:.8rem}

/* ---------- المصادر ---------- */
.src{background:var(--paper);border:1px solid var(--line);border-radius:16px;
  padding:.9rem 1.1rem;margin-top:2.2rem}
.src li{font-size:.86rem;color:var(--muted);padding:.25rem 1.2rem .25rem 0;
  position:relative;line-height:1.8}
.src li:before{content:"❋";position:absolute;right:0;color:var(--gold)}
.src li cite{font-style:normal;color:var(--ink);font-weight:600}

/* ---------- التنقل بين الصفحات ---------- */
.pager{display:flex;gap:.6rem;margin-top:1.6rem}
.pager a{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:14px;
  padding:.7rem .9rem;text-decoration:none;color:var(--ink);transition:.22s}
.pager a:hover{border-color:var(--gold);box-shadow:var(--shadow)}
.pager a small{display:block;color:var(--muted);font-size:.7rem}
.pager a b{font-size:.92rem;color:var(--c)}
.pager a.next{text-align:left}
.pager a.empty{visibility:hidden}

/* ---------- الانتقال بين الصفحات ---------- */
main{animation:pageIn .4s ease}
@keyframes pageIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}

/* ---------- فهرس الصفحة الرئيسية ---------- */
.eg{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:.8rem}
.ec{position:relative;background:var(--paper);border:1px solid var(--line);
  border-top:5px solid var(--c);border-radius:18px;padding:1rem .8rem .9rem;
  text-align:center;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);
  transition:.25s;overflow:hidden}
.ec:hover{transform:translateY(-4px);box-shadow:0 10px 26px rgba(80,60,20,.16)}
.ec .ic{font-size:2.1rem;line-height:1.2}
.ec b{display:block;color:var(--c);font-size:.98rem;margin:.25rem 0 .15rem}
.ec small{display:block;color:var(--muted);font-size:.72rem;line-height:1.55}
.ec .pg{height:5px;background:var(--line);border-radius:9px;margin-top:.55rem;overflow:hidden}
.ec .pg i{display:block;height:100%;background:var(--c);width:0;transition:.4s}
.ec .done{position:absolute;top:.4rem;left:.5rem;font-size:.95rem;color:var(--gold)}

/* ---------- البحث ---------- */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;display:none}
.ov.on{display:block}
.panel{position:fixed;inset:0;background:var(--paper);z-index:95;display:none;flex-direction:column}
.panel.on{display:flex}
.sh{display:flex;gap:.6rem;padding:.8rem;border-bottom:2px solid var(--gold)}
.sh input{flex:1;border:0;background:transparent;font-family:'Cairo';
  font-size:1.05rem;color:var(--ink);outline:none}
.sb{flex:1;overflow-y:auto;padding:.8rem}
.res{background:transparent;border:1px solid var(--line);border-radius:12px;
  padding:.7rem .9rem;margin-bottom:.5rem;cursor:pointer}
.res b{display:block;color:var(--c);font-size:.95rem}
.res small{color:var(--muted);font-size:.78rem;line-height:1.6}
.res em{font-style:normal;background:rgba(184,148,47,.22);border-radius:3px;padding:0 2px}

@media(max-width:420px){
  main{padding:.9rem .8rem 4rem}
  .hero h1{font-size:1.5rem}
  .tli{flex:0 0 132px}
}

/* ========== ١) الإطار المزخرف — حواشي المخطوطات (زوايا ثابتة الحجم) ========== */
.frame{position:relative;border:1px solid var(--gold);border-radius:6px;padding:1.6rem 1.35rem}
.frame:before{content:"";position:absolute;inset:5px;border:1px solid var(--gold);
  opacity:.28;border-radius:3px;pointer-events:none}
.crn{position:absolute;width:26px;height:26px;pointer-events:none;color:var(--gold);opacity:.75}
.crn svg{width:100%;height:100%;display:block;stroke:currentColor;fill:none;stroke-width:1.1}
.crn.tl{top:-1px;right:-1px}.cn-tr{}
.crn.tr{top:-1px;left:-1px}
.crn.bl{bottom:-1px;right:-1px}
.crn.br{bottom:-1px;left:-1px}
.frame>*:not(.crn){position:relative;z-index:1}

/* ========== ٢) الخط الزمني الكبير ========== */
.orn{width:210px;max-width:70%;height:18px;opacity:.55}
.bigtl{display:flex;gap:.55rem;overflow-x:auto;padding:1rem .3rem 1.3rem;
  scroll-snap-type:x mandatory;cursor:grab;scrollbar-width:thin;
  -webkit-overflow-scrolling:touch}
.bigtl:active{cursor:grabbing}
.bigtl::-webkit-scrollbar{height:6px}
.bigtl::-webkit-scrollbar-thumb{background:var(--gold);border-radius:9px}
.btl{flex:0 0 126px;scroll-snap-align:center;position:relative;
  display:flex;flex-direction:column;align-items:center;gap:.25rem;
  text-decoration:none;color:inherit;padding-top:1.1rem}
.btl:before{content:"";position:absolute;top:.4rem;right:-.3rem;left:-.3rem;height:2px;
  background:var(--line)}
.btl:after{content:"";position:absolute;top:0;right:calc(50% - 9px);
  width:18px;height:18px;border-radius:50%;background:var(--paper);
  border:3px solid var(--c);z-index:2;transition:.25s}
.btl:hover:after{transform:scale(1.25)}
.btl .ic{font-size:1.6rem;line-height:1;z-index:2}
.btl .nm{font-family:'Amiri',serif;font-size:.86rem;color:var(--c);text-align:center;line-height:1.5}
.btl .yr{font-size:.65rem;color:var(--muted)}
.btl .st{font-size:.6rem;color:var(--gold2);font-weight:700}

/* ========== ٣) تقليب الصفحة ========== */
.flip{position:fixed;inset:0;background:var(--cream);z-index:200;pointer-events:none;opacity:0}
.flip.go{animation:flipA .5s ease forwards}
@keyframes flipA{
  0%{opacity:.95;transform:perspective(1200px) rotateY(0)}
  55%{opacity:.95;transform:perspective(1200px) rotateY(-38deg)}
  100%{opacity:1;transform:perspective(1200px) rotateY(0)}
}
main.flip-out{animation:flipB .3s ease forwards}
@keyframes flipB{to{opacity:0;transform:perspective(1200px) translateX(-45px)}}

/* ========== ٤) تقدّم على شكل سيف ========== */
.sword{position:fixed;bottom:14px;right:50%;transform:translateX(50%);
  z-index:70;pointer-events:none;display:flex;align-items:center;gap:.5rem;
  background:var(--paper);border:1px solid var(--line);border-radius:50px;
  padding:.3rem .85rem;box-shadow:var(--shadow);font-size:.72rem;color:var(--muted)}
.sword svg{height:11px;width:118px}
.sword .bl{fill:var(--gold);opacity:.9}

/* ========== ٥) الأوسمة ========== */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:.55rem;margin-top:.8rem}
.bg{border:1px dashed var(--line);border-radius:14px;padding:.7rem .5rem;text-align:center;
  background:var(--paper);opacity:.4;filter:grayscale(1);transition:.35s}
.bg.on{opacity:1;filter:none;border:1px solid var(--gold);
  box-shadow:0 0 0 1px rgba(184,148,47,.22),var(--shadow)}
.bg .bi{font-size:1.9rem;line-height:1.2}
.bg b{display:block;font-size:.82rem;color:var(--ink);margin-top:.15rem}
.bg small{display:block;color:var(--muted);font-size:.64rem;line-height:1.5}

/* ========== ٦) شريط علوي رفيع ========== */
.topbar{position:fixed;top:0;right:0;left:0;height:3px;z-index:80}
.topbar i{display:block;height:100%;width:0;
  background:linear-gradient(90deg,var(--gold),#E8CE7C);transition:width .1s linear}

/* ==========================================================
   واجهة الصفحات العميقة (فصول متعددة)
   ========================================================== */

/* الفهرس */
.toc{margin-bottom:1.4rem;padding:1.2rem 1.3rem 1.4rem}
.toclist{list-style:none}
.toclist li{margin:0}
.toclist a{display:flex;align-items:center;gap:.6rem;padding:.42rem .3rem;
  border-bottom:1px dashed var(--line);text-decoration:none;color:var(--ink);
  font-size:.92rem;transition:.2s}
.toclist a:hover{color:var(--c);padding-right:.8rem;background:rgba(184,148,47,.07)}
.toclist b{background:var(--c);color:#fff;border-radius:6px;min-width:24px;
  text-align:center;font-size:.72rem;padding:.1rem .3rem;flex:0 0 auto}
.toclist .ttl{flex:1 1 auto;min-width:0}
.toclist .tpg{margin-inline-start:auto;flex:0 0 auto;font-size:.74rem;color:var(--muted);
  background:rgba(184,148,47,.1);border-radius:6px;padding:.05rem .4rem;min-width:26px;text-align:center}

/* عنوان القسم */
.part{margin-bottom:2.6rem}
.part-h{position:relative;text-align:center;margin:2.4rem 0 1.6rem;
  padding:1.1rem .9rem;border-top:1px solid var(--gold);border-bottom:1px solid var(--gold)}
.part-ic{font-size:2rem;line-height:1}
.part-h h2{font-family:'Amiri',serif;font-size:1.5rem;color:var(--c);margin:.2rem 0}
.part-h p{color:var(--muted);font-size:.92rem;max-width:640px;margin:.4rem auto 0;line-height:1.95}

/* الفصل */
.ch3{position:relative;background:var(--paper);border:1px solid var(--line);
  border-radius:16px;padding:1.3rem 1.2rem;margin-bottom:1.1rem;box-shadow:var(--shadow)}
.ch3-h{display:flex;align-items:flex-start;gap:.6rem;margin-bottom:.7rem;
  padding-bottom:.6rem;border-bottom:1px solid var(--line)}
.ch3-n{background:var(--c);color:#fff;font-size:.72rem;font-weight:700;
  padding:.18rem .5rem;border-radius:6px;flex:0 0 auto;margin-top:.25rem}
.ch3 h3,.rbody h3{font-family:'Amiri',serif;font-size:1.35rem;color:var(--ink);line-height:1.6}
.ch3 .lead,.rbody .lead{font-family:'Amiri',serif;font-size:1.12rem;line-height:2.05;
  color:var(--c);font-weight:700;margin-bottom:.7rem}
.ch3 .ap,.rbody .ap{font-family:'Amiri',serif;font-size:1.1rem;line-height:2.15;
  text-align:justify;margin-bottom:.75rem}
.ch3 .sub,.rbody .sub{font-family:'Amiri',serif;font-size:1.15rem;color:var(--c);
  margin:1.2rem 0 .5rem;padding-right:.6rem;border-right:4px solid var(--gold)}

/* صندوق الخلاصة */
.kbox{margin-top:1rem;background:linear-gradient(135deg,rgba(184,148,47,.09),rgba(184,148,47,.03));
  border:1px solid var(--line);border-radius:12px;padding:.8rem .9rem}
.kbox .bt{font-family:'Amiri',serif;color:var(--gold2);font-size:1rem;margin-bottom:.5rem}
.kgrid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.55rem}
.kb{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:.5rem .6rem}
.kb b{display:block;color:var(--blue);font-size:.88rem;margin-bottom:.1rem}
.kb span{font-size:.78rem;color:var(--muted);line-height:1.6;display:block}

/* جدول */
.tblwrap{overflow-x:auto;margin-top:1rem;border:1px solid var(--line);border-radius:12px}
.tblwrap table{border-collapse:collapse;width:100%;min-width:380px}
.tblwrap th{background:var(--c);color:#fff;font-size:.82rem;font-weight:700;
  padding:.55rem .7rem;text-align:right;white-space:nowrap}
.tblwrap td{padding:.55rem .7rem;font-size:.84rem;border-bottom:1px solid var(--line);
  line-height:1.8;vertical-align:top}
.tblwrap tr:last-child td{border-bottom:0}
.tblwrap tbody tr:nth-child(odd){background:rgba(184,148,47,.045)}

/* اقتباس */
.ch3 blockquote,.rbody blockquote{margin:1rem 0;padding:.8rem 1rem;border-right:5px solid var(--gold);
  background:rgba(184,148,47,.07);border-radius:0 12px 12px 0}
.ch3 blockquote p,.rbody blockquote p{font-family:'Amiri',serif;font-size:1.08rem;line-height:2;color:var(--gold2)}
.ch3 blockquote cite,.rbody blockquote cite{display:block;margin-top:.4rem;font-size:.78rem;
  color:var(--muted);font-style:normal}

/* خلاصة الفصل */
.ch3 .res,.rbody .res{margin-top:1rem;padding:.6rem .9rem;border-right:4px solid var(--gold);
  background:linear-gradient(135deg,rgba(184,148,47,.12),rgba(184,148,47,.04));
  border-radius:10px;font-size:.9rem;color:var(--gold2);font-weight:600}
.ch3 .up{display:block;text-align:left;margin-top:.9rem;font-size:.78rem;
  color:var(--muted);text-decoration:none}
.ch3 .up:hover{color:var(--c)}

@media(max-width:420px){
  .ch3{padding:1rem .85rem}
  .ch3 .ap,.rbody .ap{font-size:1.05rem}
  .kgrid3{grid-template-columns:1fr 1fr}
}


/* ==========================================================
   COMFORT — راحة القراءة والزخرفة
   ========================================================== */

/* عرض مريح للسطر: يمنع الإرهاق البصري */
main{max-width:760px}
.ch3 .ap,.ch3 .lead{max-width:100%}

/* سطر استهلالي كبير (حرف Headline) */
.ch3 .lead .drop,.rbody .lead .drop{float:right;font-family:'Amiri',serif;font-size:3.4rem;line-height:.82;
  color:var(--c);margin:.18rem 0 0 .45rem;font-weight:700;opacity:.9;
  border-right:3px solid var(--gold);padding:.1rem .45rem 0 0}

/* فاصل زخرفي بين الأقسام */
.porn{width:280px;max-width:80%;height:38px;margin:0 auto .6rem;display:block}
.porn .ln{stroke:var(--gold);stroke-width:1.1;fill:none;opacity:.7}
.porn .dm{stroke:var(--gold);stroke-width:.9;fill:none;opacity:.5}

/* فهرس الأقسام داخل رأس القسم */
.part-list{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin-top:.7rem}
.part-list a{font-size:.76rem;text-decoration:none;color:var(--muted);
  border:1px solid var(--line);border-radius:50px;padding:.2rem .7rem;transition:.2s}
.part-list a:hover{color:var(--c);border-color:var(--gold);background:rgba(184,148,47,.08)}

/* فهرس متشعّب */
.toclist>li{padding:0}
.toc-part{list-style:none;margin-bottom:.9rem}
.toc-part>b{display:inline-block;margin-left:.4rem}
.toc-part>a{font-weight:700;font-size:.98rem;color:var(--c);display:flex;align-items:center;gap:.45rem}
.toc-part>ul{list-style:none;margin:.35rem 0 0;padding-right:.9rem;
  border-right:1px dashed var(--line)}
.toc-part>ul>li{margin:0}
.toc-part>ul a{padding:.32rem .3rem;font-size:.88rem;border:0;gap:.45rem}
.toc-part>ul a i{width:6px;height:6px;border-radius:50%;background:var(--line);

.toc-part>ul>li.here a i{background:var(--gold);box-shadow:0 0 0 3px rgba(184,148,47,.2)}

/* تنقّل بين الفصول */
.chnav{display:flex;gap:.5rem;align-items:stretch;margin-top:1.1rem;
  padding-top:.9rem;border-top:1px dashed var(--line)}
.chnav a{flex:1;background:transparent;border:1px solid var(--line);border-radius:12px;

/* شريط الفصل العائم */
.railbar{position:fixed;bottom:52px;right:0;left:0;z-index:69;pointer-events:none;

/* ==========================================================
   القارئ — كتاب بلا تمرير عمودي
   ========================================================== */

/* الصفحة كلها: شريط علوي + مسرح + شريط سفلي */
body.reading{height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
body.reading .top{flex:0 0 auto}
body.reading .flip,body.reading .sword,body.reading .railbar,body.reading .crumbs{display:none}

main.reader{max-width:none;margin:0;padding:0;flex:1;min-height:0;
  display:flex;flex-direction:column;animation:none}

/* الشريط العلوي يحمل اسم الفصل */
.top.reading .brand{flex:1;min-width:0;gap:.35rem}
.top.reading .btxt{display:none}
.rbrand{font-family:'Amiri',serif;font-size:.92rem;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* المسرح */
.rstage{position:relative;flex:1;min-height:0;overflow:hidden;
  perspective:2200px;perspective-origin:50% 50%;touch-action:pan-y}

/* الصفحة */
.rpage{position:absolute;display:flex;flex-direction:column;overflow:hidden;
  background:var(--paper);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 6px 22px rgba(80,60,20,.12)}
.rbody{flex:1;min-height:0;overflow:hidden;padding:12px 20px}
.rpfoot{flex:0 0 auto;height:26px;display:flex;align-items:center;justify-content:center;
  font-size:.72rem;color:var(--muted);border-top:1px solid var(--line);
  direction:ltr;unicode-bidi:isolate}

/* حاوية القياس (خارج الشاشة) */
.rmeas{position:absolute;left:-99999px;top:0;visibility:hidden;pointer-events:none}
.rmeas .rbody{height:auto!important;padding:0;overflow:hidden}

/* ورقة التقليب */
.rleaf{position:absolute;display:none;transform-style:preserve-3d;
  will-change:transform;z-index:20;pointer-events:none}
.rleaf.on{display:block}
.rface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--paper);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);overflow:hidden}
.rback{transform:rotateY(180deg);
  background:linear-gradient(270deg,var(--paper) 55%,var(--cream) 100%)}
.rleaf::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to left,rgba(0,0,0,.30),rgba(0,0,0,0) 45%);
  opacity:calc(var(--a,0)*.95)}
.rleaf.prev::after{background:linear-gradient(to right,rgba(0,0,0,.30),rgba(0,0,0,0) 45%)}

/* الشريط السفلي */
.rfoot{flex:0 0 auto;display:flex;align-items:center;gap:.6rem;
  padding:.35rem .8rem;min-height:56px;border-top:1px solid var(--line);background:var(--paper)}
.rnav{min-height:48px;min-width:66px;padding:.35rem .9rem;border:1px solid var(--line);
  border-radius:12px;background:transparent;color:var(--ink);font-family:'Cairo';
  font-size:.9rem;font-weight:600;cursor:pointer;transition:.2s}
.rnav:hover:not(:disabled){border-color:var(--gold);background:rgba(184,148,47,.07)}
.rnav:disabled{opacity:.3;cursor:default}
.rprog{flex:1;height:9px;min-width:60px;border:0;padding:0;border-radius:9px;
  background:var(--line);overflow:hidden;cursor:pointer;display:block}
.rprog i{display:block;height:100%;width:0;
  background:linear-gradient(90deg,var(--gold),#E3C56A);transition:width .25s}

/* لوحة الفهرس والذهاب إلى صفحة */
.rpanel{position:fixed;top:0;right:0;bottom:0;width:min(86vw,360px);z-index:120;
  background:var(--paper);border-left:1px solid var(--line);display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .28s ease;
  box-shadow:-6px 0 24px rgba(0,0,0,.14)}
.rpanel.on{transform:translateX(0)}
.rphead{display:flex;align-items:center;justify-content:space-between;
  padding:.65rem .9rem;border-bottom:2px solid var(--gold);
  font-family:'Amiri';font-size:1.05rem;color:var(--c)}
.rpjump{display:flex;gap:.5rem;padding:.7rem .9rem;border-bottom:1px solid var(--line)}
.rpjump input{flex:1;min-width:0;min-height:46px;border:1px solid var(--line);border-radius:10px;
  background:var(--cream);color:var(--ink);font-family:'Cairo';font-size:1rem;padding:0 .7rem}
.rpgo{min-height:46px;padding:0 1rem;border:0;border-radius:10px;background:var(--gold);
  color:#fff;font-family:'Cairo';font-weight:700;cursor:pointer}
.rpfont{display:flex;align-items:center;gap:.45rem;padding:.55rem .9rem;
  border-bottom:1px solid var(--line);font-size:.85rem;color:var(--muted)}
.rpfont span{margin-left:auto}
.rpfont button{min-width:44px;min-height:42px;border:1px solid var(--line);border-radius:9px;
  background:transparent;color:var(--ink);font-family:'Cairo';font-size:.92rem;cursor:pointer}
.rpfont button.on{border-color:var(--gold);background:rgba(184,148,47,.12);color:var(--c);font-weight:700}
.rplist{flex:1;overflow-y:auto;padding:.4rem .6rem;-webkit-overflow-scrolling:touch}
.rpitem{display:flex;align-items:center;gap:.55rem;padding:.45rem .5rem;
  border-bottom:1px dashed var(--line);text-decoration:none;color:var(--ink);font-size:.9rem}
.rpitem i{background:var(--gold);color:#fff;border-radius:6px;min-width:32px;text-align:center;
  font-size:.72rem;font-style:normal;padding:.15rem .2rem;flex:0 0 auto}
.rpitem:hover{color:var(--c);background:rgba(184,148,47,.07)}
.rphome{display:block;text-align:center;padding:.85rem;border-top:1px solid var(--line);
  color:var(--c);text-decoration:none;font-weight:700;font-size:.9rem}

/* داخل الصفحة: إزالة إطار الفصل، وتوسيط الجدول بلا تمرير أفقي */
.rbody .ch3{border:0;background:transparent;box-shadow:none;padding:0;margin:0 0 .5rem}
.rbody .ch3-h{border-bottom:1px solid var(--line);padding-bottom:.5rem;margin-bottom:.7rem}
.rbody .part-h{margin:0 0 .6rem;padding-top:.4rem}
.rbody .tblwrap{overflow:hidden}
.rbody .tblwrap table{min-width:0;width:100%;table-layout:auto}
/* كسر الكلمات عند حدودها فقط: overflow-wrap:anywhere كان يقصّ «المرحلة» إلى «المر/حلة» */
.rbody .tblwrap th,.rbody .tblwrap td{word-break:normal;overflow-wrap:break-word;white-space:normal;hyphens:none}
.rbody .people{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.rbody mark{background:rgba(184,148,47,.38);color:inherit;border-radius:3px;padding:0 2px}
/* فهرس أكثف داخل القارئ: أقسام أكثر في الصفحة */
.rbody .toc-part{margin-bottom:.5rem}
.rbody .toclist a{padding:.26rem .3rem}
.rbody .toc-part>ul{margin-top:.2rem}
/* كتلة أطول من الصفحة (الغلاف مثلًا): تمرير داخلي بدل قصّ المحتوى */
.rbody.rflow{overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}

@media(max-width:420px){
  .rbody{padding:10px 14px}
  .rnav{min-width:56px;font-size:.82rem;padding:.3rem .55rem}
  .rfoot{gap:.4rem;padding:.3rem .5rem}
}

/* كثافة القراءة على الجوال: صفحة كتاب لا شرائح عرض */
@media(max-width:560px){
  .rbody{padding:10px 15px}
  .rbody .ap{font-size:1.02rem;line-height:1.95}
  .rbody .lead{font-size:1.06rem;line-height:1.95}
  .rbody .ch3 h3{font-size:1.22rem;line-height:1.55}
  .rbody .lead .drop{font-size:2.7rem}
  .rbody h4.sub{font-size:1.08rem}
  .rbody .kbox .bt{font-size:.92rem}
  .rbody .tblwrap td{font-size:.8rem;line-height:1.7}
  .rbody .tblwrap th{font-size:.76rem}
}

#8B1A3A\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🤝\u003c/div\u003e\n      \u003ch2\u003eالقسم الأول: السقيفة والبداية\u003c/h2\u003e\n      \u003cp\u003eفي اليوم الذي مات فيه النبيّ اجتمع الأنصار في سقيفة بني ساعدة ليختاروا خليفة، وفي المسجد كان المهاجرون، وفي بيتٍ قريب كان عليٌّ يُجهّز الجنازة. وفي ساعاتٍ قليلة حُسمت مسألةٌ ستحكم تاريخ الأمة كلها: كيف يُختار من يقود المسلمين بعد نبيّهم.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#death-and-saqifah\"\u003eوفاة النبيّ وسقيفة بني ساعدة\u003c/a\u003e\u003ca href=\"#abu-bakr-consolidation\"\u003eأبو بكر وتثبيت الدولة\u003c/a\u003e\u003ca href=\"#ridda-wars\"\u003eحروب الردة: القبيلة في مواجهة الدولة\u003c/a\u003e\u003ca href=\"#first-conquests\"\u003eالفتوح الأولى: العراق والشام\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"death-and-saqifah","n":"وفاة النبيّ وسقيفة بني ساعدة","ic":"🕋","part":"القسم الأول: السقيفة والبداية","h":"\u003carticle class=\"ch3\" id=\"death-and-saqifah\" data-toc=\"وفاة النبيّ وسقيفة بني ساعدة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e1.1\u003c/span\u003e\n          \u003ch3\u003e🕋 وفاة النبيّ وسقيفة بني ساعدة\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي الثاني عشر من ربيع الأول سنة إحدى عشرة للهجرة مات النبيّ في بيت عائشة، وكانت المدينة كلها تُصلّي وتُصلّي، وكانت الأمة أمام سؤالٍ لم يُجب عنه بنصٍّ صريح: من يقودها بعده؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكانت الأمة في سنة إحدى عشرة قد اتّسعت اتساعًا كبيرًا، فدخلت في الإسلام قبائل كثيرة من الحجاز ونجد واليمن، وكانت هذه القبائل تدخل في الغالب بعقودٍ مع النبيّ شخصيًّا، وكان في دخولها كثيرٌ من الحساب السياسي. وقد كان في هذا ما يجعل موت النبيّ خطرًا حقيقيًّا، لأن العقود التي عُقدت مع شخصٍ تنتهي بموته في فهم كثيرٍ من العرب، وكان هذا هو ما سيظهر بعد أسابيع في حروب الردة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد مرض النبيّ أيامًا، وكان في مرضه يأمر أبا بكر أن يُصلّي بالناس، وكان في هذا إشارةٌ يفهمها أهل المدينة، لأن الإمامة في الصلاة كانت في العرف الجاهلي والإسلامي معًا من علامات التقدّم. وقد قال النبيّ في مرضه كلمةً رُويت في الصحيح، فيها أمرٌ بإخراج اليهود من الجزيرة وإجازة الوفود، وكان في وصاياه الأخيرة ما يدل على أنه كان يُفكّر في شأن العامة لا في شأن الخلافة وحدها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد مات النبيّ في ضحى يوم الاثنين، وكان في البيت عائشة وحفصة وأسماء وغيرهم، وكان عليٌّ وبنو هاشم يُجهّزون الغسل والدفن، وكان أبو بكر في بيته في السنح خارج المدينة. وقد دخل أبو بكر على النبيّ فكشف عن وجهه وقبّله وقال كلمته المعروفة، ثم خرج إلى المسجد فوجد الناس في اضطراب، فخطب فيهم وقال: من كان يعبد محمدًا فإن محمدًا قد مات، ومن كان يعبد الله فإن الله حيّ لا يموت، وتلا قوله تعالى: وما محمد إلا رسول قد خلت من قبله الرسل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان الأنصار قد اجتمعوا في سقيفة بني ساعدة، وكان فيهم سعد بن عبادة سيد الخزرج مريضًا، وكانوا يريدون أن يكون الخليفة منهم، وقال قائلهم: منّا أمير ومنكم أمير. وقد كان في هذا الموقف منطقٌ قبلي مفهوم: أن الأنصار هم الذين آزروا النبيّ وحموه، وأن المدينة صارت دار الإسلام، فمن العدل أن يكون الحكم فيها لهم أو بينهم وبين المهاجرين. وقد كان في هذا الاجتماع دليلًا على أن الأنصار كانوا يُفكّرون بالجماعة لا بالشخص، لأنهم لم يُرشّحوا رجلًا ليُصبح ملكًا بل ليُصبح قائدًا يُدير شأن المدينة التي آزروا النبيّ فيها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ذهب أبو بكر وعمر وأبو عبيدة إلى السقيفة، وكان معهم جماعة من المهاجرين، وقد جرت في السقيفة مناقشةٌ طويلة، وكانت حجة المهاجرين أن العرب لا تعرف الفضل إلا لقريش، وأن القبائل لن تُطيع خليفةً من غيرها، وأن في ذلك فتنةً. وقد قال أبو بكر كلمةً تُلخّص موقفه: إن العرب لا تعرف هذا الأمر إلا لقريش، ثم أخذ بيد عمر أو أبي عبيدة فقال: أُبايع أحد هذين. وقد كان في هذا عرضًا للتسوية لا للغلبة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد انتهت السقيفة ببيعةٍ لأبي بكر، وكانت بيعةً سريعةً في موضعٍ ضيّق، ثم جاءت البيعة العامة في المسجد في اليوم التالي، وكان عليٌّ مشغولًا بالدفن، وقد بايع بعد ذلك. وقد روى المؤرخون أن أبا بكر قال في خطبته الأولى: إني قد وُلّيت عليكم ولست بخيركم، فإن أحسنت فأعينوني وإن أسأت فقوّموني، وكان في هذه الكلمة إعلانًا لمبدأ المساءلة، وهذا ما جعل البيعة أقرب إلى العقد منها إلى التوريث.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بقي هذا اليوم موضع نقاشٍ في التاريخ الإسلامي، فمن الفرق من رأى أن البيعة كانت صحيحةً بالإجماع، ومنهم من رأى أن الأولى كانت لعليّ، والأمر في أصله اجتهادٌ سياسي لا نصّ. والذي يُهمّ في القراءة التاريخية أن يُفهم السياق: أن الأمة كانت في يومها الثاني بلا قائد، وأن قبائل العرب كانت تُراقب، وأن أي تأخيرٍ كان يُمكن أن يُنتج فراغًا يُهدّد وجود الدولة نفسها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان أول عملٍ لأبي بكر أن أنفذ جيش أسامة بن زيد إلى الشام، وكان النبيّ قد جهّزه قبل موته، وكان الناس يرون أن الجيش لا يُرسل والمدينة في حالها، فقال أبو بكر كلمته: والله لا أُرخي رايةً عقّدها رسول الله. وقد كان في هذا القرار معنى سياسي كبير: أن الدولة لا تُدار بالخوف من الداخل، وأن إنفاذ قرار الدولة أهمّ من إرضاء المتردّدين، وقد كان في خروج الجيش إشارةٌ إلى القبائل بأن المدينة ما زالت قادرةً على الفعل.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eلماذا كانت السقيفة ضرورة\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم تكن السقيفة حادثةً عارضة، بل كانت استجابةً لفراغٍ حقيقي، لأن النبيّ لم يُسمِّ خليفةً بالاسم على وجهٍ لا يقبل التأويل، وكان في هذا حكمةٌ أو مصلحةٌ يُقدّرها الله. وقد كان في الأمة من يُمكن أن يُرشّح نفسه: أهل البيت، وكبار الصحابة، والأنصار، وكان في التأخير خطرٌ أن تُصبح المسألة سلاحًا في يد القبائل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان اختيار السقيفة اختيارًا سريعًا لأنه كان لا بدّ من قرارٍ في ساعات، وكان في هذا درسٌ في إدارة الأزمات: أن القرار في وقته ولو كان ناقصًا أفضل من الكمال في غير وقته، وأن الجماعة التي تُطيل النقاش في لحظة الفراغ قد تفقد وجودها قبل أن تنتهي من النقاش. وقد كان في هذا معنى يُشبه ما يُقال اليوم في إدارة المؤسسات: أن الفراغ لا يبقى فراغًا بل يملؤه الأقوى.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eبيعة السقيفة والبيعة العامة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان في البيعة الأولى عنصر المفاجأة، وكان في الثانية عنصر الإجماع، وقد فرّق المؤرخون بينهما تفريقًا مهمًّا: أن الأولى كانت اتفاقًا بين جماعةٍ في موضعٍ مغلق، والثانية كانت إعلانًا في المسجد أمام الناس. وقد كان في هذا التفريق ما يُظهر أن الشرعية في الإسلام الأول كانت تُبنى بالتدريج: تُبدأ بالاتفاق ثم تُعلن ثم تُقبل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في البيعة العامة معنى العقد: أن الناس يُبايعون على السمع والطاعة في المنشط والمكره، وأن الحاكم يُبايع على العدل والكتاب. وقد كان أبو بكر يقول في خطبته: أطيعوني ما أطعت الله، فإن عصيت الله فلا طاعة لي عليكم، وكان في هذا تحديدًا لسقف الطاعة، وهذا ما يُعدّ من أهمّ ما أنتجه العهد الراشدي في الفكر السياسي.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eعليٌّ والبيعة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان عليٌّ في بيت النبيّ يُجهّز الجنازة، ولم يكن حاضرًا في السقيفة، وقد بايع أبا بكر بعد ذلك، وقد اختلفت الروايات في وقت بيعته: فمنها ما يقول إنه بايع في اليوم نفسه، ومنها ما يقول إنه تأخّر أيامًا ثم بايع. وقد كان في التأخير تفسيرٌ سياسي وتفسيرٌ إجرائي: أنه كان يرى لنفسه حقًّا، وأنه كان مشغولًا بالدفن، والروايتان قد تجتمعان.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالذي يُهمّ أن عليًّا لم يُقِم حربًا على الخلافة، ولم يدّعِ العصمة، ولم يقطع الجماعة، وكان في موقفه ما حفظ وحدة الأمة في أخطر لحظة. وقد كان في هذا الموقف درسٌ يُستشهد به في كل خلافٍ بعد ذلك: أن الحقّ إن لم يُنل لا يعني أن تُشقّ العصا، وأن تأجيل المطالبة قد يكون مصلحةً أعظم من نيلها.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالتاريخ\u003c/b\u003e\u003cspan\u003e١٢ ربيع الأول سنة ١١هـ\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالموضع\u003c/b\u003e\u003cspan\u003eسقيفة بني ساعدة في المدينة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالخليفة\u003c/b\u003e\u003cspan\u003eأبو بكر الصدّيق\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأول قرار\u003c/b\u003e\u003cspan\u003eإنفاذ جيش أسامة إلى الشام\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمبدأ\u003c/b\u003e\u003cspan\u003eالطاعة في المعروف لا في المعصية\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eاليوم\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالاثنين ١٢ ربيع الأول\u003c/td\u003e\u003ctd\u003eوفاة النبيّ\u003c/td\u003e\u003ctd\u003eفراغٌ سياسي في الأمة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالاثنين ضحى\u003c/td\u003e\u003ctd\u003eاجتماع الأنصار في السقيفة\u003c/td\u003e\u003ctd\u003eطرحٌ لأنصاريٍّ للخلافة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالاثنين عصرًا\u003c/td\u003e\u003ctd\u003eمناقشة المهاجرين والأنصار\u003c/td\u003e\u003ctd\u003eبيعةٌ أولى لأبي بكر\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالثلاثاء\u003c/td\u003e\u003ctd\u003eالبيعة العامة في المسجد\u003c/td\u003e\u003ctd\u003eشرعيةٌ عامة للخليفة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eأيامٌ بعدها\u003c/td\u003e\u003ctd\u003eإنفاذ جيش أسامة\u003c/td\u003e\u003ctd\u003eإعلان قدرة الدولة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eوَمَا مُحَمَّدٌ إِلَّا رَسُولٌ قَدْ خَلَتْ مِن قَبْلِهِ الرُّسُلُ\u003c/p\u003e\u003ccite\u003eسورة آل عمران، الآية ١٤٤\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eمات النبيّ فاجتمع الأنصار في السقيفة، واجتمع المهاجرون معهم، وانتهى الأمر ببيعة أبي بكر في يومٍ واحد، ثم ببيعةٍ عامة في المسجد. وقد كان في سرعة القرار حفظٌ للجماعة، وفي خطبة أبي بكر تحديدٌ لسقف الطاعة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"abu-bakr-consolidation","n":"أبو بكر وتثبيت الدولة","ic":"🛡️","part":"القسم الأول: السقيفة والبداية","h":"\u003carticle class=\"ch3\" id=\"abu-bakr-consolidation\" data-toc=\"أبو بكر وتثبيت الدولة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e1.2\u003c/span\u003e\n          \u003ch3\u003e🛡️ أبو بكر وتثبيت الدولة\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eح\u003c/span\u003eكم أبو بكر سنتين وثلاثة أشهر، وفيها أنفذ جيش أسامة، وقمع الردة، وجمع القرآن، وفتح العراق والشام، وترك دولةً قائمةً بعد أن كانت على حرف الانهيار.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكانت أول أزمةٍ واجهها أبو بكر أن القبائل بدأت تُراجع عقودها، فمنعت الزكاة وقالت إنها كانت تؤدّيها للنبيّ، وكان في هذا الموقف خطأٌ سياسي كبير: أنهم ظنّوا أن الإسلام عقدٌ شخصي ينتهي بموت صاحبه، ولم يُدركوا أن الدولة صارت مؤسسةً لها حقوق. وقد كان أبو بكر حاسمًا في هذا، وقال كلمته المشهورة: والله لأُقاتلنّ من فرّق بين الصلاة والزكاة، فإن الزكاة حقّ المال.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في حزمه هذا درسٌ في بناء الدولة: أن أول ما يجب تثبيته هو حقّها في الجباية، لأن الدولة التي لا تجمع المال لا تستطيع أن تُدافع ولا أن تُنفق. وقد كان عمر يُشير عليه باللين في أول الأمر، فقال له أبو بكر: أنت كنت أشدّ عليّ في الجاهلية وأنا ألين عليك في الإسلام، وكان في هذا الحوار ما يُظهر أن الخلافة صارت منصبًا يُناقش فيه لا مقامًا يُخاف منه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أنفذ جيش أسامة كما أمر النبيّ، وكان الناس يقولون إن الروم قد تجمّعت، وإن المدينة بحاجةٍ إلى الجيش، فقال: والله لا أُرخي رايةً عقّدها رسول الله ولو أُخذت المدينة. وقد خرج الجيش، وكان أبو بكر يمشي مع أسامة وهو راكب، ويُودّعه، وقد عاد الجيش بغنائم وسلام، وكان في عودته إعلانٌ بأن المدينة قادرة، وأن القبائل التي كانت تُفكّر في الردّة أُعطيت مثالًا على قوّة الدولة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بدأت حروب الردة في أنحاء الجزيرة، وكانت على نوعين: ردّةٌ عن الإسلام بالكلية، وردّةٌ عن الزكاة مع البقاء على الإسلام. وقد كان في النوع الثاني خطورةٌ أكبر، لأنه كان يهدّد بنية الدولة من داخلها، وكان في النوع الأول خطرٌ على وجود الإسلام في الجزيرة. وقد قسّم أبو بكر الجيوش وأرسلها إلى جهاتٍ متعددة، وكان يقود السياسة من المدينة بمراسلاتٍ يومية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان من أخطر حركات الردّة حركة مسيلمة في اليمامة، وكان قد ادّعى النبوّة في حياة النبيّ، وكتب إليه النبيّ رسالةً فيها: من مسيلمة رسول الله إلى محمد رسول الله، أما بعد، فإن الأرض نصفها لي ونصفها لك، فكتب النبيّ: إن الأرض لله يُورثها من يشاء. وقد قُتل مسيلمة في وقعة اليمامة سنة ١٢هـ على يد وحشي بن حرب، وكان في هذه الوقعة قتلٌ كثيرٌ من حُفّاظ القرآن.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في كثرة قتل الحفاظ في اليمامة ما دفع عمر إلى أن يُشير على أبي بكر بجمع القرآن، وقال: إني أخشى أن يستحرّ القتل بالقرّاء في المواطن فيذهب كثيرٌ من القرآن. وقد تردّد أبو بكر أول الأمر وقال: كيف أفعل شيئًا لم يفعله رسول الله؟ ثم قبل، وكان في هذا القبول أصلًا من أصول حفظ الدين بالتدوين، وكان زيد بن ثابت هو الذي كُلّف بالجمع، وكان يجمع من الرقاع واللخاف وصدور الرجال.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد فتح أبو بكر العراق في عهده فتحًا أوّليًّا، وكان خالد بن الوليد قائد الجبهة، وقد انتصر في وقائع متعددة، ثم انتقل إلى الشام بأمر أبي بكر ليكون قائدًا هناك. وقد كان في هذا الانتقال قرارٌ استراتيجي: أن الأولوية صارت للشام لأنها أخطر، ولأن الروم أقوى من الفرس في تلك اللحظة، وقد كان في هذا فقهٌ في ترتيب الأعداء لا يُدركه إلا من ينظر إلى الخريطة كلها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد مرض أبو بكر مرض الموت، فاستشار الصحابة فيمن يخلفه، ثم كتب عهدًا لعمر، وكان في هذا العهد سابقةً في نقل السلطة بترتيبٍ لا بالتغلّب. وقد قال في عهده كلمةً تُروى: إني وليّت عليكم عمر، فإن عدل فذاك ظنّي به، وإن جار فذلك ما لا أعلم، وقد كان في هذا الاعتراف ما يُظهر أن الاختيار اجتهادٌ لا ضمانة. وقد مات أبو بكر سنة ١٣هـ ودُفن إلى جانب النبيّ، وكانت خلافته سنتين وثلاثة أشهر.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eحروب الردة: الدين والدولة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت حروب الردة في ظاهرها حربًا على المرتدين، وفي عمقها حربًا على تفكيك الدولة، لأن القبائل التي منعت الزكاة لم تكن تُنكر الإسلام كله، بل أرادت أن تُعيد العلاقة القبلية القديمة: أن تُعطي إذا أرادت وأن تمنع إذا أرادت. وقد كان في هذا التصوّر بقايا من النظام الجاهلي، حيث لا سلطة فوق القبيلة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في حسم أبي بكر تأسيسٌ لمبدأٍ في الفقه السياسي: أن الزكاة ليست تبرّعًا فرديًّا بل حقٌّ للدولة، وأن من منعها فهو خارجٌ على الجماعة. وقد كان في هذا المبدأ ما يجعل الدولة قادرةً على البقاء، لأن الدولة التي لا تملك موردًا مستقلًّا تبقى رهينةً لمن يُموّلها، وهذا ما يُفسّر لماذا كان هذا القرار أخطر قرارٍ في خلافته.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eجمع القرآن\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان جمع القرآن في عهد أبي بكر خطوةً دفاعيةً في أصلها: أن يبقى النصّ محفوظًا بعد موت الحفاظ، وكان زيد بن ثابت يطلب الشاهدين على كل آية، وكان يجمع ما كُتب في حياة النبيّ. وقد كان في هذا الجمع منهجٌ دقيق: لا يُقبل إلا ما ثبت كتابًا وسماعًا، وكان في هذا ما جعل النصّ محفوظًا من التحريف بعد ذلك.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الجمع أيضًا قرارٌ سياسي: أن الأمة التي اتّسعت واختلفت قرّاؤها تحتاج إلى نصٍّ واحد، وأن النصّ الواحد هو أساس الوحدة. وقد كان في هذا ما يجعل جمع القرآن في عهد أبي بكر بدايةً لمسارٍ انتهى في عهد عثمان بنسخ المصاحف وإرسالها إلى الأمصار، وهو مسارٌ يُبيّن كيف تُبنى الوحدة بالتوثيق لا بالخطابة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالعهد إلى عمر\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يُعيِّن أبو بكر خليفةً من أبنائه، ولم يجعلها ملكًا، بل اختار رجلًا أشدّ منه، وكان في هذا الاختيار نظرٌ إلى المصلحة لا إلى القرابة. وقد كان في استشارته للصحابة ثم في كتابة العهد ما يجمع بين الشورى والتنفيذ: أن يُشاور ثم يُقرّر ثم يُوثّق القرار كتابةً حتى لا يقع النزاع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا العهد أيضًا سابقةً في انتقال السلطة سلميًّا، وكان في الأمة من هو أفضل منه في النسب أو السابقة، لكنه اختار الأصلح للإدارة، وكان في هذا ما يُظهر أن معيار الاختيار في العهد الراشدي كان الكفاءة والعدل، لا الأفضلية المطلقة. وقد بقي هذا العهد مثالًا في الفكر السياسي الإسلامي على أن التوريث ليس سنّةً لازمة.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمدة الخلافة\u003c/b\u003e\u003cspan\u003eسنتان وثلاثة أشهر\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأول قرار\u003c/b\u003e\u003cspan\u003eإنفاذ جيش أسامة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأخطر قرار\u003c/b\u003e\u003cspan\u003eقتال مانعي الزكاة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eجمع القرآن\u003c/b\u003e\u003cspan\u003eبيد زيد بن ثابت\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالعهد\u003c/b\u003e\u003cspan\u003eإلى عمر بن الخطاب سنة ١٣هـ\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e١١هـ\u003c/td\u003e\u003ctd\u003eإنفاذ جيش أسامة\u003c/td\u003e\u003ctd\u003eإعلان قدرة المدينة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١١ – ١٢هـ\u003c/td\u003e\u003ctd\u003eحروب الردة\u003c/td\u003e\u003ctd\u003eإعادة القبائل إلى الدولة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٢هـ\u003c/td\u003e\u003ctd\u003eوقعة اليمامة\u003c/td\u003e\u003ctd\u003eمقتل مسيلمة وكثرة القتل في الحفاظ\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٢هـ\u003c/td\u003e\u003ctd\u003eبدء جمع القرآن\u003c/td\u003e\u003ctd\u003eحفظ النصّ بالتدوين\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٣هـ\u003c/td\u003e\u003ctd\u003eفتح أوّلي في العراق\u003c/td\u003e\u003ctd\u003eتأسيس جبهة الشرق\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٣هـ\u003c/td\u003e\u003ctd\u003eالعهد إلى عمر\u003c/td\u003e\u003ctd\u003eانتقال سلمي للسلطة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eفَإِن تَوَلَّوْا فَاعْلَمُوا أَنَّ اللَّهَ لَا يُحِبُّ الْكَافِرِينَ\u003c/p\u003e\u003ccite\u003eسورة آل عمران، الآية ٣٢\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eثبّت أبو بكر الدولة بثلاثة قرارات: إنفاذ جيش أسامة، وقتال مانعي الزكاة، وجمع القرآن. وقد حكم سنتين وثلاثة أشهر، وترك دولةً قائمةً وعهدًا مكتوبًا لعمر، فكان في هذا تأسيسًا لمبدأ التداول السلمي للسلطة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"ridda-wars","n":"حروب الردة: القبيلة في مواجهة الدولة","ic":"⚔️","part":"القسم الأول: السقيفة والبداية","h":"\u003carticle class=\"ch3\" id=\"ridda-wars\" data-toc=\"حروب الردة: القبيلة في مواجهة الدولة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e1.3\u003c/span\u003e\n          \u003ch3\u003e⚔️ حروب الردة: القبيلة في مواجهة الدولة\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eب\u003c/span\u003eعد موت النبيّ ارتدّت قبائل كثيرة، أو منعت الزكاة، وكانت الجزيرة كلها تُعيد حسابها. وفي سنةٍ واحدة أعاد أبو بكر وقادة جيوشه الجزيرة إلى الدولة، وكانت هذه السنة هي التي جعلت الإسلام دينًا لدولةٍ لا دعوةً في قبيلة.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكانت الردّة في الجزيرة على أشكالٍ متعددة، فمنها ردّةٌ كاملة عن الإسلام إلى الوثنية، ومنها ردّةٌ عن الزكاة مع الإقرار بالصلاة، ومنها ادّعاء النبوّة من أشخاصٍ مثل مسيلمة وطليحة وسجاح والأسود العنسي. وقد كان في كل شكلٍ من هذه الأشكال سببٌ مختلف، وكان في هذا ما يجعل الحرب معقّدة، لأن أبا بكر كان يُقاتل أعداءً مختلفين في وقتٍ واحد. وقد كان في هذا التعدّد ما يجعل الحرب شبكةً من الحركات لا جبهةً واحدة، وكان في هذا ما يُفسّر أن أبا بكر قسّم الجيوش على جهاتٍ متعددة في وقتٍ واحد، ولم يجمعها في جيشٍ واحد كما يفعل من يُقاتل دولةً منظّمة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان الأسود العنسي في اليمن أول من ادّعى النبوّة، وقد قُتل على يد فيروز الديلمي قبل موت النبيّ بأيام، وقد ذكر النبيّ ذلك في مرضه. وقد كان في هذا دليلًا على أن الردّة لم تبدأ بعد موت النبيّ، بل بدأت في حياته، وأن موته كان الشرارة التي جعلت كل من كان يُخفي شيئًا يُظهره. وقد كان في قتله قبل موت النبيّ دليلًا على أن الردّة كانت قد بدأت في حياته، وأن النبيّ كان يُتابع أخبار الجزيرة في مرضه، وكان في هذا ما يجعل موته شرارةً لا بدايةً.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان طليحة بن خويلد في بني أسد قد ادّعى النبوّة أيضًا، وكان في قبائل غطفان وأسد أنصار، وقد أرسل إليه أبو بكر خالد بن الوليد، فانهزم طليحة في وقعة بُزاخة، وفرّ إلى الشام ثم أسلم بعد ذلك وحسن إسلامه. وقد كان في هذا مثالٌ على أن الردّة كانت في كثيرٍ من حالها حركةً قبلية لا عقيدةً، وأن من ارتدّ لم يكن مقتنعًا بدينٍ جديد بل كان يتبع زعيم قبيلته.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت سجاح بنت الحارث من بني تغلب قد ادّعت النبوّة أيضًا، وكانت قد جاءت بجيشٍ إلى اليمامة، ثم اتفقت مع مسيلمة على أن تُزوّجه نفسها وأن يأخذ نصف محصول اليمامة، ثم رجعت إلى قومها. وقد كان في هذه الحادثة ما يُظهر أن بعض الردّة كانت مشروعًا سياسيًّا لا دينيًّا، وأن بعض من ادّعى النبوّة كان يُريد مكانةً قبلية لا رسالة. وقد كان في هذه الحادثة ما يُظهر أن بعض الردّة كان مشروعًا سياسيًّا لا دينيًّا، وأن بعض من ادّعى النبوّة كان يُريد مكانةً قبلية لا رسالة، وكان في هذا ما يُفسّر سرعة انهيار حركاتهم بعد ذلك.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان مسيلمة الكذّاب أخطرهم، لأنه كان في اليمامة، وكانت اليمامة ذات زرعٍ ومال، وكان قد كتب إلى النبيّ يطلب أن يُشاركه في الأمر، وكان له أنصارٌ من بني حنيفة. وقد أرسل إليه أبو بكر خالد بن الوليد، وكانت الوقعة في اليمامة سنة ١٢هـ، وكانت من أشدّ الوقائع، وقد قُتل فيها عددٌ كبير من الصحابة والحفاظ، وكان في هذا ما دفع إلى جمع القرآن. وقد كان في هذه الوقعة من الشدّة ما جعل المؤرخين يقولون إن المسلمين لم يقفوا في مثلها، وكان في كثرة القتلى من الصحابة ما جعل المدينة تُدرك أن الحرب لم تكن نزهةً بل استنزافًا لرجالها الأوائل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في اليمن ردّةٌ أخرى، وكان فيها قيس بن مكشوح وعمرو بن معدي كرب، وقد أرسل أبو بكر إليها جيشًا بقيادة المهاجر بن أبي أمية، وكان في هذه الجبهة تعقيدٌ قبلي كبير. وقد كان في اليمن أيضًا ردّةُ حضرموت وكِندة، وقد أُرسل إليها زياد بن لبيد، وكان في هذه الجبهات ما يُظهر أن الردّة كانت في كل الجزيرة لا في نجدٍ فقط. وقد كان في هذه الجبهة تعقيدٌ قبلي كبير، لأن قبائل اليمن كانت تُحالف وتُعادي بحسابٍ محلي، وكان في هذا ما جعل الجيش يحتاج إلى سياسةٍ قبل أن يحتاج إلى سلاح، وهذا ما فعله قادتها بالتفاوض مع الزعماء.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في البحرين وعمان والمهرة ردّاتٌ أيضًا، وقد أُرسلت إليها جيوشٌ بأسماءٍ مختلفة، وكان القائد العام في الشرق هو العلاء بن الحضرمي، وكان في هذه الجبهات ما يجعل حرب الردّة حربًا على ثلاث جبهاتٍ في وقتٍ واحد. وقد كان في هذا عبءٌ لوجستي كبير على مدينةٍ صغيرة، وكان في نجاحه دليلًا على أن الإدارة التي بناها النبيّ كانت قادرةً على العمل بعد موته.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد انتهت حروب الردة في نحو سنة ١٢هـ، وكانت نتيجتها أن الجزيرة كلها عادت إلى الإسلام، وأن القبائل التي كانت تُحسب على الردّة دخلت في جيوش الفتوح بعد ذلك، وكان في هذا تحويلٌ للطاقة القبلية من الداخل إلى الخارج. وقد كان في هذا القرار ذكاءٌ سياسي كبير: أن تُوجَّه القبائل التي كانت تُقاتل الدولة إلى قتال أعداء الدولة، وكان في هذا ما جعل الفتوح ممكنة بعد ذلك.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eأسباب الردّة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان من أسباب الردّة أن الإسلام دخل على كثيرٍ من القبائل بعقودٍ مع النبيّ شخصيًّا، وكان في هذه العقود التزامٌ سياسي أكثر منه اقتناعًا دينيًّا كاملًا، فلمّا مات النبيّ رأت القبائل أن العقد انتهى. وكان من أسبابها أيضًا أن الزكاة كانت عبئًا ماليًّا على القبائل، وكانت في العرف القبلي مذلّةً لأنها عطاءٌ للأقوى.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان من أسبابها الثالث ادّعاء النبوّة، وكان في كل قبيلةٍ من يدّعي أنه أولى بالرسالة من غيره، وكان في هذا ما يُشبه المنافسة على المكانة. وقد كان في هذه الأسباب مجتمعةً ما يُفسّر انتشار الردّة بهذه السرعة، وأنها لم تكن مؤامرةً واحدة بل حركاتٌ متفرقة تشابهت في النتيجة واختلفت في الدافع.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eخالد بن الوليد في اليمامة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت اليمامة أصعب جبهات الردّة، لأن بني حنيفة كانوا كثيرين، ولأن مسيلمة كان قد هيّأ جيشًا في سهلٍ مفتوح، وكان في جيشه من يُقاتل بعقيدةٍ زائفة. وقد استعمل خالد خطةً تعتمد على المبارزة والضغط على القلب، وكان القتال شديدًا حتى قال المؤرخون إن المسلمين لم يقفوا في مثلها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان من نتائج هذه الوقعة أن قُتل عددٌ كبير من حُفّاظ القرآن، وكان في هذا الحدث ما جعل عمر يُفكّر في جمع القرآن، وكان في هذا مثالٌ على أن الأحداث العسكرية قد تُنتج قراراتٍ ثقافية كبرى. وقد كان في اليمامة أيضًا أن ثبت فيها قادةٌ من الصحابة، وكان في ثباتهم ما أعاد تنظيم الجيش بعد اضطراب.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eأثر الردّة في بناء الدولة\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم تكن حروب الردة مجرّد استعادةٍ للأرض، بل كانت بناءً لمفهوم الدولة: أن السلطة المركزية هي التي تُقرّر من داخل الجماعة ومن خارجها، وأن القبيلة لم تعد وحدةً سياسية مستقلة. وقد كان في هذا تحوّلٌ كبير في بنية المجتمع العربي، لأن القبيلة التي كانت تُحارب وحدها صارت تُقاتل تحت رايةٍ واحدة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه الحروب أيضًا تدريبٌ للجيش العربي على القتال المنظّم، وعلى الطاعة للقائد، وعلى العمل في جبهاتٍ بعيدة. وقد ظهر أثر هذا التدريب بعد أشهرٍ في اليرموك والقادسية، حيث قاتلت القبائل التي كانت مُرتدةً تحت قيادةٍ واحدة، وكان في هذا ما يُفسّر سرعة الفتوح بعد ذلك.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمدة\u003c/b\u003e\u003cspan\u003eنحو سنة ١١ – ١٢هـ\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالأسود العنسي\u003c/b\u003e\u003cspan\u003eفي اليمن وقُتل قبل موت النبيّ\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eطليحة\u003c/b\u003e\u003cspan\u003eفي بني أسد وهُزم في بُزاخة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمسيلمة\u003c/b\u003e\u003cspan\u003eفي اليمامة وقُتل سنة ١٢هـ\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالنتيجة\u003c/b\u003e\u003cspan\u003eعودة الجزيرة وتوجيه القبائل للفتوح\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالحركة\u003c/th\u003e\u003cth\u003eالموضع\u003c/th\u003e\u003cth\u003eالنهاية\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالأسود العنسي\u003c/td\u003e\u003ctd\u003eاليمن\u003c/td\u003e\u003ctd\u003eقُتل على يد فيروز الديلمي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eطليحة بن خويلد\u003c/td\u003e\u003ctd\u003eبني أسد ونجد\u003c/td\u003e\u003ctd\u003eهُزم في بُزاخة ثم أسلم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eسجاح\u003c/td\u003e\u003ctd\u003eبني تغلب\u003c/td\u003e\u003ctd\u003eاتفقت مع مسيلمة ثم رجعت\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eمسيلمة\u003c/td\u003e\u003ctd\u003eاليمامة\u003c/td\u003e\u003ctd\u003eقُتل في الوقعة سنة ١٢هـ\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eردّة البحرين وعمان\u003c/td\u003e\u003ctd\u003eشرق الجزيرة\u003c/td\u003e\u003ctd\u003eأُخمدت بجيوشٍ متعددة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eيَا أَيُّهَا الَّذِينَ آمَنُوا مَنْ يَرْتَدَّ مِنكُمْ عَن دِينِهِ فَسَوْفَ يَأْتِي اللَّهُ بِقَوْمٍ يُحِبُّهُمْ وَيُحِبُّونَهُ\u003c/p\u003e\u003ccite\u003eسورة المائدة، الآية ٥٤\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eكانت الردّة حركاتٍ قبلية متفرقة، بعضها عن الدين وبعضها عن الزكاة، وبعضها ادّعاء نبوّة. وقد أُخمدت في سنة، وكانت نتيجتها أن صارت القبيلة جزءًا من دولة، وأن تحوّلت طاقتها من الداخل إلى الفتوح.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"first-conquests","n":"الفتوح الأولى: العراق والشام","ic":"🐎","part":"القسم الأول: السقيفة والبداية","h":"\u003carticle class=\"ch3\" id=\"first-conquests\" data-toc=\"الفتوح الأولى: العراق والشام\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e1.4\u003c/span\u003e\n          \u003ch3\u003e🐎 الفتوح الأولى: العراق والشام\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي سنة ١٢هـ بدأت الجيوش تخرج من الجزيرة إلى العراق والشام، وكانت الدولة الفتيّة تُقاتل دولتين عظيمتين في وقتٍ واحد. وفي سنتين سقطت الحيرة وبُصرى ودمشق، وكان في هذا ما لم يكن في حساب أحد.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكانت الفتوح في أول أمرها امتدادًا لحرب الردّة: أن القبائل التي أُخمدت صارت جيوشًا لا تجد ما تعيش به في الجزيرة، وكان في هذا دافعٌ اقتصادي واضح. وقد كان أبو بكر يُدرك هذا، فوجّه الجيوش إلى العراق والشام، وكان يكتب إلى القبائل أن تُنفر، وكان في هذا تحويلٌ للطاقة إلى الخارج بعد أن كانت تُهدّد الداخل. وقد كان في هذه الحركة ما يجعل الفتوح مسألةً اقتصاديةً قبل أن تكون مسألةً عسكرية، لأن القبائل التي لم تجد ما تعيش به في الجزيرة وجدت في أرض السواد والشام ما يُغنيها، وكان في هذا دافعٌ يجعل الجيش يستمرّ في التقدّم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت الجبهة العراقية أول ما فُتح، وكان خالد بن الوليد قائدها، وقد انتصر في وقائع متعددة في سنة ١٢هـ، وكان من أشهرها وقعة ذات السلاسل ووقعة أُلاَّس، ثم دخل الحيرة وصالح أهلها على الجزية. وقد كان في فتح الحيرة معنى مهم: أنها أول مدينةٍ فارسية ذات إدارة تُصالح المسلمين، وكان في هذا سابقةً في التعامل مع المدن المفتوحة. وقد كان في هذه الوقائع ما جعل العراق جبهةً مفتوحةً قبل الشام، لأنها كانت أقرب إلى الجزيرة وأقلّ تحصينًا، وكان في هذا ترتيبٌ منطقي في الفتح: أن تُفتح الأسهل أولًا لتُصبح قاعدةً لما بعده.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت الجبهة الشامية تُدار بأربعة جيوش، وكانت القيادة العامة لعمر بن العاص وأبي عبيدة ويزيد بن أبي سفيان وشرحبيل بن حسنة، وكان أبو بكر قد كتب إلى خالد أن ينتقل إلى الشام ليكون قائدًا عامًّا هناك. وقد كان في هذا الانتقال قرارًا استراتيجيًّا: أن يُجمّع القيادة في يد واحدة في الجبهة الأخطر، وكان في هذا ما جعل النصر ممكنًا في اليرموك. وقد كان في هذا التجميع ما جعل الجيش العربي يعمل كوحدةٍ واحدة في اليرموك، وكان في هذا درسٌ عسكري: أن الجيوش المتفرقة لا تنتصر على جيشٍ واحد يقودها قائدٌ واحد، ولو كانت أعدادها أكبر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الشام مدنٌ ذات أسوارٍ قديمة، وكان الجيش العربي لا يملك آلات حصارٍ كبيرة، فكان يعتمد على الحصار الطويل وعلى المفاوضات. وقد سقطت بُصرى سنة ١٣هـ، ثم دمشق بعد حصار، وقد دخلها خالد من بابٍ وأبو عبيدة من بابٍ آخر، وكان في هذا ما جعل أهلها يطلبون الصلح، وقد صالحهم على الجزية وعلى أمانٍ لأنفسهم وكنائسهم. وقد كان في هذا الحصار ما جعل الجيش يتعلّم فنون الحصار بالتدريج، وكان في هذا ما يُفسّر أن المدن الساحلية تأخّرت في السقوط، لأنها كانت تحتاج إلى أسطولٍ لا إلى فرسان، وهذا ما جعل عمر يُنشئ الأسطول بعد ذلك.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه الفتوح الأولى ما يُشبه المفارقة: أن الدولة الفتيّة كانت تُقاتل بيزنطة وفارس في وقتٍ واحد، وكانت بيزنطة قد خرجت من حربٍ طويلة مع فارس، وكانت فارس قد دخلت في حربٍ أهلية بعد موت كسرى. وقد كان في هذا ما يُفسّر سرعة النصر: أن الخصمين كانا مُنهكين، وكان المسلمون في أوّل قوّتهم. وقد كان في هذا الفتح ما يُشبه النموذج الذي تكرّر بعد ذلك في كل مدينة: حصارٌ ثم مفاوضات ثم صلحٌ بشروطٍ مكتوبة، وكان في هذا ما جعل الفتح سريعًا وحفظ المدن من الخراب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الفتوح نظامٌ في التعامل مع أهل البلاد: أن يُعرض عليهم الإسلام أو الجزية أو القتال، وأن من أسلم كان له ما للمسلمين وعليه ما عليهم، وأن من بقي على دينه كان له أمانٌ على نفسه وماله وكنيسة، وأن الجزية تُقابل الحماية لا الإذلال. وقد كان في هذا النظام ما جعل المدن تُسلّم بسرعة، لأن الناس كانوا يُقارنون بين حكمٍ قديمٍ ثقيل وحكمٍ جديدٍ يُحدّد الحقوق. وقد كان في هذا ما يُفسّر لماذا لم تكن الفتوح حرب إبادة: أن الخصمين كانا في حالة ضعف، وأن المسلمين كانوا يُريدون مدنًا عامرةً تُعطي خراجًا لا أراضي خالية، وكان في هذا حسابٌ اقتصادي لا عاطفي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه الفتوح أيضًا مسألةٌ فقهية كبرى: هل الأرض المفتوحة تُقسم غنيمةً بين المقاتلين كما تُقسم المنقول، أم تبقى في يد أهلها وتُفرض عليها خراجًا؟ وقد كان هذا النقاش في عهد عمر بعد ذلك، وكان في القرار ما حدّد اقتصاد الدولة الإسلامية قرونًا. وقد كان في عهد أبي بكر أن الأراضي كانت تُقسم أحيانًا، وكان عمر يرى أن تُترك. وقد كان في هذا النقاش ما يُظهر أن الفتوح كانت تُدار بفقهٍ لا بحدس، وأن كل قرارٍ فيها كان له سندٌ من الكتاب والسنة ومصلحةٍ مُقدّرة، وكان في هذا ما جعل الدولة الجديدة تُقيم نظامًا ماليًّا لا يقوم على الغنيمة وحدها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد مات أبو بكر والفتوح في أوّلها، وكانت الجيوش في الميدان، وكان في هذا اختبارًا للدولة: أن يموت الخليفة والجيوش في الخارج، وأن يتولّى خليفةٌ جديد ويُقرّر أن تُستأنف الفتوح. وقد كان في قرار عمر أن تُستأنف ولا تُوقف، وكان في هذا ما جعل الفتوح ظاهرةً متصلةً لا حملاتٍ متفرقة، وكان في هذا الفرق بين دولةٍ تُقاتل بالمناسبات ودولةٍ تُقاتل بالخطة. وقد كان في هذا النقاش ما يجعل الفتوح مسألةً فقهيةً لا عسكرية فقط، لأن من يُقرّر مصير الأرض يُقرّر اقتصاد الأجيال القادمة، وكان في هذا ما يُظهر أن الصحابة كانوا يُفكّرون بالمستقبل لا بالغنيمة الحاضرة.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eلماذا انتصر المسلمون\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يكن النصر في الفتوح الأولى معجزةً عسكرية، بل كان نتيجةً لأسبابٍ يمكن تعدادها: أن الجيش العربي كان جيشًا متحرّكًا خفيفًا يعرف الصحراء ويستطيع أن يتحرّك بسرعة، وأن الخصمين كانا مُنهكين بحربٍ طويلة، وأن القبائل العربية في الشام والعراق كانت تُرحّب بمن يُخفّف عنها الضرائب والاضطهاد الديني.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان من الأسباب أيضًا أن القيادة كانت موحّدةً في الجبهة، وأن الجند كان يُقاتل بعقيدةٍ لا بأجرة، وكان في هذا فرقٌ في الروح المعنوية. وقد كان في الجيش أيضًا قادةٌ من طرازٍ عالٍ مثل خالد وأبي عبيدة وعمرو، وكان في وجودهم ما يُغطّي نقص العدد والعدة، وهذا ما يُسمّى في العسكرية اليوم قيادةً ميدانية قادرة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالجزية والخراج\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الجزية في الفتوح الأولى بديلًا عن الحماية العسكرية، وكانت تُفرض على القادرين من الرجال، وكانت في الغالب مبالغ معتدلة، وكانت تُسقط بالإسلام. وقد كان في هذا النظام ما جعل أهل البلاد يجدون أن الحكم الجديد أخفّ من الحكم القديم، لأن بيزنطة كانت تجمع الضرائب وتُضطهد المخالفين في الدين.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان الخراج على الأرض، وكان يُفرض بحسب مساحتها وإنتاجها، وكان يُترك للأرض أهلها يعملون فيها. وقد كان في هذا النظام ما جعل الأرض تُنتج وتُعطي الدولة دخلًا مستمرًّا، بخلاف القسمة التي تُحوّل الأرض إلى ملكٍ لأفرادٍ ثم تُخرجها من حساب الدولة، وهذا ما سيُصبح قرارًا في عهد عمر.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eخالد بين العراق والشام\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان انتقال خالد من العراق إلى الشام قرارًا حاسمًا، وقد قطعه بمسيرةٍ في الصحراء تُعدّ من أعماله العسكرية الكبرى، وكان في هذا الانتقال ما يُظهر أن القيادة كانت تُفكّر بخريطةٍ واحدة لا بجبهاتٍ منفصلة. وقد كان في وصوله إلى الشام ما غيّر ميزان القوى في الجبهة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا الانتقال أيضًا درسٌ في الإدارة: أن الخليفة يستطيع أن ينقل قائدًا من جبهةٍ إلى أخرى إذا اقتضت المصلحة، وأن القائد لا يكون مالكًا لجبهته. وقد كان في هذا ما يُميّز الدولة عن الإمارة القبلية، لأن القبيلة تُقاتل حيث يكون زعيمها، والدولة تُقاتل حيث تكون المصلحة.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالجبهة الأولى\u003c/b\u003e\u003cspan\u003eالعراق سنة ١٢هـ\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأول مدينة\u003c/b\u003e\u003cspan\u003eالحيرة وصالح أهلها\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالشام\u003c/b\u003e\u003cspan\u003eأربعة جيوش ثم قيادة خالد\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eبُصرى\u003c/b\u003e\u003cspan\u003eسقطت سنة ١٣هـ\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eدمشق\u003c/b\u003e\u003cspan\u003eسقطت بعد حصارٍ وصلح\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e١٢هـ\u003c/td\u003e\u003ctd\u003eوقائع العراق الأولى\u003c/td\u003e\u003ctd\u003eسقوط الحيرة والصلح معها\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٣هـ\u003c/td\u003e\u003ctd\u003eانتقال خالد إلى الشام\u003c/td\u003e\u003ctd\u003eتوحيد القيادة في الجبهة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٣هـ\u003c/td\u003e\u003ctd\u003eسقوط بُصرى\u003c/td\u003e\u003ctd\u003eأول قاعدةٍ في الشام\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٣هـ\u003c/td\u003e\u003ctd\u003eحصار دمشق\u003c/td\u003e\u003ctd\u003eصلحٌ وأمانٌ لأهلها\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٣هـ\u003c/td\u003e\u003ctd\u003eوفاة أبي بكر\u003c/td\u003e\u003ctd\u003eاستئناف الفتوح في عهد عمر\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eوَعَدَ اللَّهُ الَّذِينَ آمَنُوا مِنكُمْ وَعَمِلُوا الصَّالِحَاتِ لَيَسْتَخْلِفَنَّهُمْ فِي الْأَرْضِ\u003c/p\u003e\u003ccite\u003eسورة النور، الآية ٥٥\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eخرجت الجيوش من الجزيرة إلى العراق والشام في سنةٍ واحدة، فسقطت الحيرة وبُصرى ودمشق، وكان النصر نتيجةً لخفّة الجيش وتوحيد القيادة وانهاك الخصمين. وقد أُسّس في هذه الفتوح نظام الجزية والخراج الذي حكم اقتصاد الدولة قرونًا.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-2","n":"القسم الثاني: الفتوح الكبرى","ic":"","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-2\" style=\"--c:#8B1A3A\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e⚔️\u003c/div\u003e\n      \u003ch2\u003eالقسم الثاني: الفتوح الكبرى\u003c/h2\u003e\n      \u003cp\u003eبين سنة ١٣هـ وسنة ٢١هـ سقطت في يد المسلمين أعظم إمبراطوريتين في العالم القديم: دولة فارس، وأقاليم بيزنطة في الشام ومصر. ولم يكن ذلك بحملةٍ واحدة بل بأربع معارك كبرى، كل واحدة منها غيّرت خريطة العالم.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#yarmouk\"\u003eاليرموك: سقوط الشام\u003c/a\u003e\u003ca href=\"#qadisiyya\"\u003eالقادسية وسقوط فارس\u003c/a\u003e\u003ca href=\"#jerusalem\"\u003eفتح بيت المقدس\u003c/a\u003e\u003ca href=\"#egypt\"\u003eفتح مصر\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"yarmouk","n":"اليرموك: سقوط الشام","ic":"🏇","part":"القسم الثاني: الفتوح الكبرى","h":"\u003carticle class=\"ch3\" id=\"yarmouk\" data-toc=\"اليرموك: سقوط الشام\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e2.1\u003c/span\u003e\n          \u003ch3\u003e🏇 اليرموك: سقوط الشام\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي رجب سنة خمس عشرة للهجرة التقى جيشٌ عربي بجيشٍ بيزنطي في سهل اليرموك، وكان عدد البيزنطيين أضعاف عدد العرب، وكانت النتيجة هزيمةً لم تُجبر. وفي ثلاث سنوات صارت الشام كلها في يد المسلمين.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eبعد سقوط دمشق سنة ١٤هـ تجمّعت بيزنطة لجهدٍ كبير، وكان هرقل في أنطاكية يُدير الحرب بنفسه، وكان قد أرسل جيشًا ضخمًا بقيادة أخيه أو أحد قادته، وكان في الجيش رومٌ وأرمن وعربٌ من قبائل الشام الموالية، وكان الهدف أن يُستعاد الشام كله في معركةٍ واحدة. وقد كان في هذا الجهد إدراكٌ صحيح: أن الشام لا تُستعاد بمعارك صغيرة بل بمعركةٍ فاصلة. وقد كان في هذا الجهد البيزنطي ما يُظهر أن القسطنطينية كانت تُدرك أن الشام قلبُ إمبراطوريتها، وأن فقدانها يعني فقدان الطريق إلى مصر وإفريقية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان المسلمون في الشام أربعة جيوش، فجمعهم أبو عبيدة بن الجراح في موضعٍ واحد، وكان خالد بن الوليد قائدًا ميدانيًّا للجيش، وكان في الجيش نحو أربعين ألفًا في رواياتٍ كثيرة، وكان في الجيش البيزنطي أعدادٌ أكبر بكثير، وكان في العدد تفاوتٌ يبدو في الظاهر حاسمًا. وقد كان في هذا الموقف ما يجعل القرار الأول هو القرار الأخطر: هل يواجه الجيشُ الصغيرُ الجيشَ الكبير في سهلٍ مفتوح، أم ينسحب إلى الصحراء حيث يُقاتل بشروطه؟\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد اختار المسلمون أن يُقاتلوا في اليرموك، وهو سهلٌ في أطرافه وديانٌ وعرة، وكان في هذا الاختيار ذكاءٌ عسكري: أن يُختار موضعٌ تُحدّ فيه الوديان حركة الجيش الكبير، وأن يكون ظهر الجيش المسلم إلى الصحراء التي يعرفها ويعرف كيف ينسحب إليها إذا لزم. وقد كان في هذا ما يُشبه اختيار الملعب لا اختيار الجيش، وهو ما يُعدّ من أصول القيادة. وقد كان في هذا الاختيار ما جعل المعركة تُحسم بالحركة لا بالعدد، وكان في هذا ما يُفسّر أن المؤرخين العسكريين يعدّون اليرموك من معارك الحسم في التاريخ القديم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد استمرّ القتال أيامًا، وكان في البداية قتالًا متكافئًا في بعض الأيام، وكانت بيزنطة تُحاول أن تستعمل الفرس المدرّعة والعدد الثقيل، وكان المسلمون يعتمدون على الخيل والمناورة والهجوم المتتابع. وقد كان في الجيش المسلم نساءٌ يُسقين الماء ويُداوين الجرحى، وكان لهنّ في بعض الروايات موقفٌ في المعركة حين اضطربت الصفوف، وهذا ما يُذكر في المصادر بوصفه من أسباب الثبات.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان اليوم الأخير هو الحاسم، وقد استعمل خالد خطةً تقوم على سحب جزءٍ من الجيش ثم الالتفاف على جناح العدو، وكان في هذا ما يُشبه ما فعله في معارك العراق، وكان في تكرار الخطة نفسها ما يُظهر أن القائد كان يعرف ما يُحسنه. وقد انهار الجيش البيزنطي انهيارًا كاملًا، وكانت الخسائر فيه كبيرة، وقد قال هرقل كلمته المعروفة عن الشام: سلامٌ عليك يا سوريا، وداعًا لا لقاء بعده.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان فتح الشام بعد اليرموك سريعًا، فقد سقطت حمص وحماة وحلب وأنطاكية في سنواتٍ قليلة، وكان في هذا ما يُظهر أن المعركة الفاصلة تُختصر بها سنوات من الحصار. وقد كان في الفتح نظامٌ في التعامل: صلحٌ بشروطٍ وأمانٌ للكنائس، وكان في هذا ما جعل المدن تُسلّم بسرعة، لأن أهلها كانوا يعرفون ما لهم وما عليهم. وقد كان في هذا الفتح ما جعل المدن تُسلّم بسرعة، لأنها كانت تعرف أن الجيش الذي انتصر في اليرموك لا يُقاوم، وكان في هذا أثرٌ نفسي أكبر من أثر السلاح.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في اليرموك درسٌ عسكري ظاهر: أن الجيش الصغير المتحرّك يستطيع أن ينتصر على جيشٍ كبيرٍ ثقيل إذا اختار الأرض المناسبة وحافظ على وحدة القيادة. وقد كان في هذا الدرس ما يظهر في كل تاريخ المسلمين بعد ذلك: أن القوّة ليست في العدد بل في التنظيم والسرعة والقيادة، وأن من يُقاتل على أرضه ويعرف تضاريسها يملك ميزةً لا تُشترى بالمال. وقد كان في هذا الدرس ما يُفسّر انتصارات المسلمين في القرون الأولى، مع أن أعدادهم كانت أقلّ في أكثر المواضع التي دخلوها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه المعركة أيضًا معنى سياسي: أن الشام صارت دار إسلام بعد أن كانت دار روم، وأن دمشق صارت قاعدةً للجبهة الشمالية، وأن بيت المقدس صار الهدف التالي. وقد كان في هذا التحوّل ما جعل العالم الإسلامي يُصبح قوةً متوسطية لا قوةً جزيرية، وكان في هذا بداية تحوّلٍ في التاريخ كله. وقد كان في هذا التحوّل ما جعل الدولة الإسلامية تُشبه الدول المتوسطية في إدارتها وتجارتها، وكان في هذا ما مهّد لبناء الأسطول وفتح قبرص ورودس بعد ذلك.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالعدد والقيادة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان العدد في اليرموك في غير صالح المسلمين، وكان في هذا ما يجعل النصر مُستغربًا لولا أسباب أخرى: أن القيادة كانت موحّدة في يد خالد، وأن الجيش كان يعمل كوحدة، وأن البيزنطيين كانوا جيشًا مركّبًا من شعوبٍ لا تُقاتل بالحماس نفسه، وكان في اختلاف لغاتهم وولاءاتهم ما جعل التنسيق بينهم ضعيفًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الجيش البيزنطي فرسانٌ ثقيلون لا يُحسنون المناورة السريعة، وكان في الجيش العربي خيّالة خفيفة تستطيع أن تُغيّر موقعها بسرعة، وكان في هذا فرقٌ في أسلوب الحرب لا في العدد. وقد كان في هذا الفرق ما جعل المعركة تُحسم بالحركة لا بالضربة، وهو ما يُسمّى في العسكرية الحديثة سرعة القرار.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eأرض المعركة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان اختيار اليرموك اختيارًا مدروسًا، فقد كان السهل محصورًا بين وديانٍ تُقيّد حركة الجيش الكبير، وكان ظهر الجيش المسلم إلى الصحراء، وكان في هذا ثلاثة معانٍ: أن يُحمى الظهر، وأن يُضمن طريق الانسحاب، وأن يُستدرج العدو إلى أرضٍ لا يستطيع أن يستعمل فيها كل قوّته.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا الدرس ما يتكرّر في التاريخ الإسلامي بعد ذلك، فقد اختار المسلمون في القادسية موضعًا فيه ماءٌ وظهورٌ محمية، واختاروا في نهاوند المواضع المرتفعة، وكان في هذا ما يُظهر أن القيادة كانت تعرف أن الأرض جزءٌ من الجيش، وأن من يُهمل الأرض يُسلّم نصف المعركة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eما بعد اليرموك\u003c/h4\u003e\u003cp class=\"ap\"\u003eبعد اليرموك لم يبقَ في الشام جيشٌ بيزنطي كبير، وكانت المدن تُسلّم الواحدة بعد الأخرى، وكانت بعض المدن تُقاوم ثم تُصالح، وكانت أنطاكية آخر القواعد الكبيرة. وقد كان في هذا ما يُظهر أن المعركة الفاصلة تُنهي الحرب النفسية قبل أن تُنهي الحرب العسكرية، لأن المدن التي تعرف أن جيشها هُزم لا تُقاتل بجدّ.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في فتح الشام أثرٌ اقتصادي كبير: أن الطرق التجارية من الجزيرة إلى المتوسط صارت في يد المسلمين، وأن الخراج صار يُدفع إلى المدينة، وكان في هذا ما جعل الدولة قادرةً على أن تُنفق على الجيوش في جبهاتٍ أخرى. وقد كان في هذا ما يُفسّر لماذا استطاعت الدولة الفتيّة أن تُقاتل على ثلاث جبهات في وقتٍ واحد.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالتاريخ\u003c/b\u003e\u003cspan\u003eرجب سنة ١٥هـ\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالموضع\u003c/b\u003e\u003cspan\u003eنهر اليرموك في شمال الشام\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالقادة\u003c/b\u003e\u003cspan\u003eأبو عبيدة وخالد بن الوليد\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالخصم\u003c/b\u003e\u003cspan\u003eجيش بيزنطي بقيادة هرقل\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالنتيجة\u003c/b\u003e\u003cspan\u003eسقوط الشام في ثلاث سنوات\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e١٣هـ\u003c/td\u003e\u003ctd\u003eسقوط بُصرى ودمشق\u003c/td\u003e\u003ctd\u003eقاعدةٌ للجيش في الشام\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٤هـ\u003c/td\u003e\u003ctd\u003eتجمّع البيزنطيين\u003c/td\u003e\u003ctd\u003eإعدادٌ لمعركةٍ فاصلة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٥هـ\u003c/td\u003e\u003ctd\u003eمعركة اليرموك\u003c/td\u003e\u003ctd\u003eانهيار القوّة البيزنطية في الشام\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٥ – ١٦هـ\u003c/td\u003e\u003ctd\u003eسقوط حمص وحلب\u003c/td\u003e\u003ctd\u003eتوسّع الفتح شمالًا\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٦هـ\u003c/td\u003e\u003ctd\u003eسقوط أنطاكية\u003c/td\u003e\u003ctd\u003eخروج بيزنطة من الشام\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eوَلَقَدْ نَصَرَكُمُ اللَّهُ بِبَدْرٍ وَأَنتُمْ أَذِلَّةٌ\u003c/p\u003e\u003ccite\u003eسورة آل عمران، الآية ١٢٣\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eانتصر جيشٌ عربي صغير في اليرموك على جيشٍ بيزنطي أكبر منه أضعافًا، لأن القيادة كانت موحّدة والأرض كانت مختارة. وقد كان سقوط الشام نتيجةً مباشرة لهذه المعركة، وبها صار المسلمون قوةً متوسطية.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"qadisiyya","n":"القادسية وسقوط فارس","ic":"🏹","part":"القسم الثاني: الفتوح الكبرى","h":"\u003carticle class=\"ch3\" id=\"qadisiyya\" data-toc=\"القادسية وسقوط فارس\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e2.2\u003c/span\u003e\n          \u003ch3\u003e🏹 القادسية وسقوط فارس\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي سنة خمس عشرة للهجرة وقف جيش المسلمين على حدود فارس، وكانت فارس دولةً عمرها أربعة قرون ولها جيشٌ منظّم وفيلةٌ وفرسان. وفي ثلاث معارك سقطت دولتهم، وكانت القادسية أولها وأعظمها.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكانت الجبهة الفارسية قد فُتحت في عهد أبي بكر فتحًا أوّليًّا، ثم توقّفت في عهد عمر أول الأمر، لأن عمر أراد أن يُثبّت الشام أولًا. ثم رأى أن فارس لا تُترك، لأنها الدولة التي تُهدّد العراق، ولأن القبائل العربية في العراق كانت تنتظر، فكتب إلى سعد بن أبي وقاص أن يسير إليها، وكان سعدٌ من أوائل من أسلم ومن العشرة المبشّرين بالجنة، وكان مريضًا في بعض أيام المعركة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد اختار سعدٌ القادسية موضعًا للمعركة، وكانت القادسية على حدود العراق قريبةً من الحيرة، وكان في الموضع ماءٌ، وكان خلف الجيش صحراء، وكان في هذا اختيارٌ يُشبه اختيار اليرموك: أن يكون للجيش ماءٌ وظهرٌ محمي. وقد كان في الجيش الفارسي فيلةٌ، وكان العرب لم يعتادوا قتال الفيلة، وكان في هذا عامل رهبةٍ كبير في أول الأمر. وقد كان في هذا الاختيار ما جعل الفيلة تفقد أثرها النفسي بعد الأيام الأولى، لأن الجيش ثبّت في موضعه وتعلّم كيف يتعامل معها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد جرت بين الطرفين مفاوضات قبل المعركة، وقد أرسل سعدٌ رجالًا إلى يزدجرد وكسرى، وكان من أشهرهم رِبْعي بن عامر، وقد دخل على رستم في خيمته ببساطٍ شديد، وقال كلمته المعروفة: إن الله ابتعثنا لنُخرج من شاء من عبادة العباد إلى عبادة الله، ومن ضيق الدنيا إلى سعتها، ومن جور الأديان إلى عدل الإسلام. وقد كان في هذه الكلمة تلخيصٌ للخطاب السياسي الذي حمله الفاتحون، وقد كان رستم يقول بعدها إن العرب قد رفعوا رؤوسهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد استمرّت المعركة أيامًا، وكانت في الليلة الثالثة أو الرابعة ليلةٌ سُمّيت ليلة الهرير، لأن الكلاب كانت تهرّ من شدّة الصوت، وكان القتال فيها متواصلًا حتى الصباح. وقد كان في هذه الليلة ما يُظهر أن المعركة لم تكن مناورةً بارعة بل صبرًا واستنزافًا، وكان في هذا ما يُفسّر أن النصر كان ثقيلًا لا سريعًا. وقد كان في هذه الليلة ما يُظهر أن المعركة كانت استنزافًا لا مناورة، وأن الصبر كان سلاحًا مثل السيف، وكان في هذا ما يُفسّر طول المعركة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد قُتل رستم في أثناء المعركة، وكان في مقتله ما جعل الجيش الفارسي يتفرّق، لأن القيادة كانت مركزيةً في شخصه، وكان في هذا فرقٌ بين الجيشين: أن الجيش الفارسي كان يعتمد على قائده، والجيش العربي كان يعتمد على خطةٍ وقيادةٍ متعددة المستويات. وقد كانت الغنائم في القادسية كبيرة، وكان فيها ما يُسمّى بالفرس والسلاح والذهب، وكان في توزيعها نظامٌ يُظهر أن الجيش صار مؤسسةً لا جماعة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوبعد القادسية سار المسلمون إلى المدائن عاصمة فارس، وكانت على نهر دجلة، وقد عبروا النهر بخيولهم في مشهدٍ ذكره المؤرخون، ودخلوا المدينة فوجدوها خالية، لأن يزدجرد فرّ إلى الشرق، وقد وجدوا في قصرها ما وصفوه من الفرش والذهب، وكان في هذا ما يُظهر حجم الدولة التي سقطت. وقد كانت المدائن أول عاصمةٍ لدولةٍ عظمى تسقط في يد المسلمين، وكان في سقوطها معنى رمزي كبير.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان سقوط المدائن بدايةً لسلسلةٍ من المعارك، فقد قاتل الفرس بعد ذلك في جلولاء ونهاوند، وكانت نهاوند سنة ٢١هـ تُسمّى فتح الفتوح، لأنها كانت آخر معركةٍ كبيرة، وقد قُتل فيها قائد الفرس، وقد قال عمر حين بلغه خبرها: اللهم قد انقطع رجائي من هذه الأمة، يعني الفرس. وقد كان في هذا ما يُظهر أن الدولة الفارسية لم تسقط بمعركةٍ واحدة بل بسلسلة، وأن كل معركةٍ كانت تُنهي طبقةً من القيادة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في فتح فار
