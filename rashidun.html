<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="description" content="تمتد هذه الحقبة من وفاة النبي محمد ﷺ سنة 632م إلى تنازل الحسن بن علي سنة 661م، أي نحو ثلاثة عقود حُكم فيها أربعة من الصحابة هم الخلفاء الراشدون: أبو ب">
<title>الخلفاء الراشدون والفتوحات | موسوعة تاريخ الإسلام</title>
<link rel="preload" href="assets/fonts/amiri-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/amiri-700.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* ===== موسوعة تاريخ الإسلام — التنسيق المشترك ===== */

/* الخطوط محليّة (Subset عربي): لا شبكة، ولا اختلاف في القياس بين تشغيل وتشغيل */
@font-face{font-family:'Amiri';font-style:normal;font-weight:400;font-display:block;
  src:url(assets/fonts/amiri-400.woff2) format('woff2')}
@font-face{font-family:'Amiri';font-style:normal;font-weight:700;font-display:block;
  src:url(assets/fonts/amiri-700.woff2) format('woff2')}
@font-face{font-family:'Cairo';font-style:normal;font-weight:200 1000;font-display:block;
  src:url(assets/fonts/cairo-var.woff2) format('woff2')}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --gold:#B8942F;--gold2:#8B6914;--cream:#FBF4E4;--paper:#FFFDF8;
  --ink:#2E2A24;--muted:#7C7364;--line:#E7DCC3;
  --green:#1E6B3A;--blue:#155E9C;
  --shadow:0 4px 18px rgba(80,60,20,.08);
  --c:#B8942F;
}
body{font-family:'Cairo',sans-serif;background:var(--cream);color:var(--ink);
  min-height:100vh;line-height:1.9;transition:.3s}

body.dark{--paper:#201E1A;--cream:#161512;--ink:#E8E1D2;--muted:#A79E8B;
  --line:#3A362C;--shadow:0 4px 18px rgba(0,0,0,.35)}

main{max-width:820px;margin:0 auto;padding:1.2rem 1.1rem 5rem}

/* ---------- الترويسة ---------- */
header.top{position:sticky;top:0;z-index:60;display:flex;align-items:center;
  justify-content:space-between;gap:.6rem;padding:.55rem 1rem;
  background:var(--paper);border-bottom:2px solid var(--gold)}
.brand{font-family:'Amiri',serif;font-weight:700;font-size:1.02rem;color:var(--ink);
  text-decoration:none;display:flex;align-items:center;gap:.4rem}
.tools{display:flex;align-items:center;gap:.5rem}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
  background:transparent;color:var(--ink);font-size:1.05rem;cursor:pointer;
  display:grid;place-items:center;transition:.2s}
.ib:hover{background:var(--gold);color:#fff;border-color:var(--gold)}
.ib:active{transform:scale(.9)}

/* ---------- قبة التقدم ---------- */
.dome{width:38px;height:44px;position:relative;cursor:default}
.dome svg{width:100%;height:100%;display:block}
.dome .fill{fill:var(--gold);opacity:.85;transition:.4s}

/* ---------- شارات ---------- */
.badge{display:inline-flex;align-items:center;gap:.3rem;font-size:.72rem;
  background:var(--gold);color:#fff;border-radius:50px;padding:.15rem .6rem;
  font-weight:700}

/* ---------- المسار ---------- */
.crumbs{font-size:.82rem;color:var(--muted);margin-bottom:.8rem;
  display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.crumbs a{color:var(--muted);text-decoration:none}
.crumbs a:hover{color:var(--gold2)}

/* ---------- الترويسة البطلة ---------- */
.hero{position:relative;background:var(--paper);border:1px solid var(--line);
  border-top:6px solid var(--c);border-radius:20px;padding:1.6rem 1.3rem 1.4rem;
  text-align:center;box-shadow:var(--shadow);margin-bottom:1.4rem;overflow:hidden}
.hero .ic{font-size:2.6rem;line-height:1}
.hero h1{font-family:'Amiri',serif;font-size:1.9rem;color:var(--c);margin:.3rem 0 .1rem}
.hero .period{color:var(--gold2);font-size:.85rem;font-weight:600;margin-bottom:.6rem}
.hero .intro{color:var(--muted);font-size:.96rem;line-height:2;max-width:620px;margin:0 auto}

/* ---------- زخرفة SVG ---------- */
.orn{display:block;margin:1.2rem auto;opacity:.55}
.orn line,.orn path,.orn circle{stroke:var(--gold);stroke-width:1.1;fill:none}

/* ---------- العناوين ---------- */
h2.sec{font-family:'Amiri',serif;font-size:1.35rem;color:var(--c);
  margin:2rem 0 .9rem;display:flex;align-items:center;gap:.6rem}
h2.sec:before{content:"";width:6px;height:22px;background:var(--gold);
  border-radius:3px;flex:0 0 auto}
h2.sec .n{margin-right:auto;font-family:'Cairo';font-size:.75rem;color:var(--muted);font-weight:400}

/* ---------- الخط الزمني ---------- */
.tlwrap{position:relative;margin-bottom:.4rem}
.tl{display:flex;gap:.6rem;overflow-x:auto;padding:.6rem .2rem 1rem;
  scroll-snap-type:x mandatory;scrollbar-width:thin}
.tl::-webkit-scrollbar{height:5px}
.tl::-webkit-scrollbar-thumb{background:var(--gold);border-radius:9px}
.tli{flex:0 0 150px;scroll-snap-align:center;background:var(--paper);
  border:1px solid var(--line);border-right:4px solid var(--c);
  border-radius:14px;padding:.6rem .7rem;cursor:pointer;text-align:right;
  transition:.22s;font-family:'Cairo'}
.tli:hover,.tli.on{transform:translateY(-3px);box-shadow:var(--shadow);border-right-color:var(--gold)}
.tli b{display:block;color:var(--c);font-size:.9rem}
.tli span{display:block;color:var(--muted);font-size:.76rem;line-height:1.6}
.tlnav{display:flex;justify-content:space-between;margin-top:-.5rem}

/* ---------- الأحداث ---------- */
.ev{background:var(--paper);border:1px solid var(--line);border-radius:16px;
  padding:1rem 1.1rem;margin-bottom:.9rem;box-shadow:var(--shadow);
  opacity:0;transform:translateY(14px);transition:.45s}
.ev.in{opacity:1;transform:none}
.ev-head{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;margin-bottom:.5rem}
.ev-y{background:var(--c);color:#fff;font-size:.74rem;font-weight:700;
  padding:.15rem .55rem;border-radius:6px;white-space:nowrap}
.ev h3{font-family:'Amiri',serif;font-size:1.18rem;color:var(--ink)}
.ev p{font-family:'Amiri',serif;font-size:1.08rem;line-height:2.05;text-align:justify}
.ev .res{margin-top:.7rem;padding:.55rem .8rem;border-right:4px solid var(--gold);
  background:linear-gradient(135deg,rgba(184,148,47,.10),rgba(184,148,47,.04));
  border-radius:10px;font-size:.9rem;color:var(--gold2);font-weight:600}
.ev .res:before{content:"◀ النتيجة  "}

/* ---------- الشخصيات ---------- */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.6rem}
.pc{background:var(--paper);border:1px solid var(--line);border-radius:14px;
  padding:.65rem .8rem;border-top:3px solid var(--c)}
.pc b{display:block;color:var(--ink);font-size:.95rem}
.pc span{display:block;color:var(--muted);font-size:.78rem;line-height:1.65}

/* ---------- النتائج ---------- */
.outs{list-style:none}
.outs li{position:relative;padding:.5rem 1.5rem .5rem 0;border-bottom:1px dashed var(--line);
  font-size:.95rem}
.outs li:before{content:"◆";position:absolute;right:0;color:var(--gold);font-size:.8rem}

/* ---------- المصادر ---------- */
.src{background:var(--paper);border:1px solid var(--line);border-radius:16px;
  padding:.9rem 1.1rem;margin-top:2.2rem}
.src li{font-size:.86rem;color:var(--muted);padding:.25rem 1.2rem .25rem 0;
  position:relative;line-height:1.8}
.src li:before{content:"❋";position:absolute;right:0;color:var(--gold)}
.src li cite{font-style:normal;color:var(--ink);font-weight:600}

/* ---------- التنقل بين الصفحات ---------- */
.pager{display:flex;gap:.6rem;margin-top:1.6rem}
.pager a{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:14px;
  padding:.7rem .9rem;text-decoration:none;color:var(--ink);transition:.22s}
.pager a:hover{border-color:var(--gold);box-shadow:var(--shadow)}
.pager a small{display:block;color:var(--muted);font-size:.7rem}
.pager a b{font-size:.92rem;color:var(--c)}
.pager a.next{text-align:left}
.pager a.empty{visibility:hidden}

/* ---------- الانتقال بين الصفحات ---------- */
main{animation:pageIn .4s ease}
@keyframes pageIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}

/* ---------- فهرس الصفحة الرئيسية ---------- */
.eg{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:.8rem}
.ec{position:relative;background:var(--paper);border:1px solid var(--line);
  border-top:5px solid var(--c);border-radius:18px;padding:1rem .8rem .9rem;
  text-align:center;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);
  transition:.25s;overflow:hidden}
.ec:hover{transform:translateY(-4px);box-shadow:0 10px 26px rgba(80,60,20,.16)}
.ec .ic{font-size:2.1rem;line-height:1.2}
.ec b{display:block;color:var(--c);font-size:.98rem;margin:.25rem 0 .15rem}
.ec small{display:block;color:var(--muted);font-size:.72rem;line-height:1.55}
.ec .pg{height:5px;background:var(--line);border-radius:9px;margin-top:.55rem;overflow:hidden}
.ec .pg i{display:block;height:100%;background:var(--c);width:0;transition:.4s}
.ec .done{position:absolute;top:.4rem;left:.5rem;font-size:.95rem;color:var(--gold)}

/* ---------- البحث ---------- */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;display:none}
.ov.on{display:block}
.panel{position:fixed;inset:0;background:var(--paper);z-index:95;display:none;flex-direction:column}
.panel.on{display:flex}
.sh{display:flex;gap:.6rem;padding:.8rem;border-bottom:2px solid var(--gold)}
.sh input{flex:1;border:0;background:transparent;font-family:'Cairo';
  font-size:1.05rem;color:var(--ink);outline:none}
.sb{flex:1;overflow-y:auto;padding:.8rem}
.res{background:transparent;border:1px solid var(--line);border-radius:12px;
  padding:.7rem .9rem;margin-bottom:.5rem;cursor:pointer}
.res b{display:block;color:var(--c);font-size:.95rem}
.res small{color:var(--muted);font-size:.78rem;line-height:1.6}
.res em{font-style:normal;background:rgba(184,148,47,.22);border-radius:3px;padding:0 2px}

@media(max-width:420px){
  main{padding:.9rem .8rem 4rem}
  .hero h1{font-size:1.5rem}
  .tli{flex:0 0 132px}
}

/* ========== ١) الإطار المزخرف — حواشي المخطوطات (زوايا ثابتة الحجم) ========== */
.frame{position:relative;border:1px solid var(--gold);border-radius:6px;padding:1.6rem 1.35rem}
.frame:before{content:"";position:absolute;inset:5px;border:1px solid var(--gold);
  opacity:.28;border-radius:3px;pointer-events:none}
.crn{position:absolute;width:26px;height:26px;pointer-events:none;color:var(--gold);opacity:.75}
.crn svg{width:100%;height:100%;display:block;stroke:currentColor;fill:none;stroke-width:1.1}
.crn.tl{top:-1px;right:-1px}.cn-tr{}
.crn.tr{top:-1px;left:-1px}
.crn.bl{bottom:-1px;right:-1px}
.crn.br{bottom:-1px;left:-1px}
.frame>*:not(.crn){position:relative;z-index:1}

/* ========== ٢) الخط الزمني الكبير ========== */
.orn{width:210px;max-width:70%;height:18px;opacity:.55}
.bigtl{display:flex;gap:.55rem;overflow-x:auto;padding:1rem .3rem 1.3rem;
  scroll-snap-type:x mandatory;cursor:grab;scrollbar-width:thin;
  -webkit-overflow-scrolling:touch}
.bigtl:active{cursor:grabbing}
.bigtl::-webkit-scrollbar{height:6px}
.bigtl::-webkit-scrollbar-thumb{background:var(--gold);border-radius:9px}
.btl{flex:0 0 126px;scroll-snap-align:center;position:relative;
  display:flex;flex-direction:column;align-items:center;gap:.25rem;
  text-decoration:none;color:inherit;padding-top:1.1rem}
.btl:before{content:"";position:absolute;top:.4rem;right:-.3rem;left:-.3rem;height:2px;
  background:var(--line)}
.btl:after{content:"";position:absolute;top:0;right:calc(50% - 9px);
  width:18px;height:18px;border-radius:50%;background:var(--paper);
  border:3px solid var(--c);z-index:2;transition:.25s}
.btl:hover:after{transform:scale(1.25)}
.btl .ic{font-size:1.6rem;line-height:1;z-index:2}
.btl .nm{font-family:'Amiri',serif;font-size:.86rem;color:var(--c);text-align:center;line-height:1.5}
.btl .yr{font-size:.65rem;color:var(--muted)}
.btl .st{font-size:.6rem;color:var(--gold2);font-weight:700}

/* ========== ٣) تقليب الصفحة ========== */
.flip{position:fixed;inset:0;background:var(--cream);z-index:200;pointer-events:none;opacity:0}
.flip.go{animation:flipA .5s ease forwards}
@keyframes flipA{
  0%{opacity:.95;transform:perspective(1200px) rotateY(0)}
  55%{opacity:.95;transform:perspective(1200px) rotateY(-38deg)}
  100%{opacity:1;transform:perspective(1200px) rotateY(0)}
}
main.flip-out{animation:flipB .3s ease forwards}
@keyframes flipB{to{opacity:0;transform:perspective(1200px) translateX(-45px)}}

/* ========== ٤) تقدّم على شكل سيف ========== */
.sword{position:fixed;bottom:14px;right:50%;transform:translateX(50%);
  z-index:70;pointer-events:none;display:flex;align-items:center;gap:.5rem;
  background:var(--paper);border:1px solid var(--line);border-radius:50px;
  padding:.3rem .85rem;box-shadow:var(--shadow);font-size:.72rem;color:var(--muted)}
.sword svg{height:11px;width:118px}
.sword .bl{fill:var(--gold);opacity:.9}

/* ========== ٥) الأوسمة ========== */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:.55rem;margin-top:.8rem}
.bg{border:1px dashed var(--line);border-radius:14px;padding:.7rem .5rem;text-align:center;
  background:var(--paper);opacity:.4;filter:grayscale(1);transition:.35s}
.bg.on{opacity:1;filter:none;border:1px solid var(--gold);
  box-shadow:0 0 0 1px rgba(184,148,47,.22),var(--shadow)}
.bg .bi{font-size:1.9rem;line-height:1.2}
.bg b{display:block;font-size:.82rem;color:var(--ink);margin-top:.15rem}
.bg small{display:block;color:var(--muted);font-size:.64rem;line-height:1.5}

/* ========== ٦) شريط علوي رفيع ========== */
.topbar{position:fixed;top:0;right:0;left:0;height:3px;z-index:80}
.topbar i{display:block;height:100%;width:0;
  background:linear-gradient(90deg,var(--gold),#E8CE7C);transition:width .1s linear}

/* ==========================================================
   واجهة الصفحات العميقة (فصول متعددة)
   ========================================================== */

/* الفهرس */
.toc{margin-bottom:1.4rem;padding:1.2rem 1.3rem 1.4rem}
.toclist{list-style:none}
.toclist li{margin:0}
.toclist a{display:flex;align-items:center;gap:.6rem;padding:.42rem .3rem;
  border-bottom:1px dashed var(--line);text-decoration:none;color:var(--ink);
  font-size:.92rem;transition:.2s}
.toclist a:hover{color:var(--c);padding-right:.8rem;background:rgba(184,148,47,.07)}
.toclist b{background:var(--c);color:#fff;border-radius:6px;min-width:24px;
  text-align:center;font-size:.72rem;padding:.1rem .3rem;flex:0 0 auto}
.toclist .ttl{flex:1 1 auto;min-width:0}
.toclist .tpg{margin-inline-start:auto;flex:0 0 auto;font-size:.74rem;color:var(--muted);
  background:rgba(184,148,47,.1);border-radius:6px;padding:.05rem .4rem;min-width:26px;text-align:center}

/* عنوان القسم */
.part{margin-bottom:2.6rem}
.part-h{position:relative;text-align:center;margin:2.4rem 0 1.6rem;
  padding:1.1rem .9rem;border-top:1px solid var(--gold);border-bottom:1px solid var(--gold)}
.part-ic{font-size:2rem;line-height:1}
.part-h h2{font-family:'Amiri',serif;font-size:1.5rem;color:var(--c);margin:.2rem 0}
.part-h p{color:var(--muted);font-size:.92rem;max-width:640px;margin:.4rem auto 0;line-height:1.95}

/* الفصل */
.ch3{position:relative;background:var(--paper);border:1px solid var(--line);
  border-radius:16px;padding:1.3rem 1.2rem;margin-bottom:1.1rem;box-shadow:var(--shadow)}
.ch3-h{display:flex;align-items:flex-start;gap:.6rem;margin-bottom:.7rem;
  padding-bottom:.6rem;border-bottom:1px solid var(--line)}
.ch3-n{background:var(--c);color:#fff;font-size:.72rem;font-weight:700;
  padding:.18rem .5rem;border-radius:6px;flex:0 0 auto;margin-top:.25rem}
.ch3 h3,.rbody h3{font-family:'Amiri',serif;font-size:1.35rem;color:var(--ink);line-height:1.6}

/* افتتاحية الفصل: تميّز فصلًا عن آخر داخل القارئ */
.cho-top{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;
  font-family:'Cairo';font-size:.7rem;color:var(--muted);margin-bottom:.45rem}
.cho-part{font-weight:700;color:var(--c);opacity:.9}
.cho-cnt{margin-inline-start:auto;background:rgba(184,148,47,.13);color:var(--gold2);
  border-radius:20px;padding:.12rem .6rem;font-weight:700;white-space:nowrap}
.cho-mid{display:flex;align-items:flex-start;gap:.6rem}
.cho-num{font-family:'Amiri',serif;font-weight:700;font-size:1.45rem;color:var(--gold2);
  line-height:1.25;flex:0 0 auto;padding-top:.1rem}
.cho-num i{font-style:normal;opacity:.5;margin:0 .04rem}
.cho-rule{display:flex;align-items:center;gap:.5rem;margin-top:.65rem}
.cho-rule i{flex:1 1 auto;height:1px}
.cho-rule i:first-child{background:linear-gradient(to right,var(--gold),rgba(184,148,47,.06))}
.cho-rule i:last-child{background:linear-gradient(to left,var(--gold),rgba(184,148,47,.06))}
.cho-rule b{color:var(--gold);font-size:.68rem;font-weight:400;line-height:1}
.ch3 .lead,.rbody .lead{font-family:'Amiri',serif;font-size:1.12rem;line-height:2.05;
  color:var(--c);font-weight:700;margin-bottom:.7rem;text-align:right}
.ch3 .ap,.rbody .ap{font-family:'Amiri',serif;font-size:1.1rem;line-height:2.15;
  text-align:justify;margin-bottom:.75rem}
.ch3 .sub,.rbody .sub{font-family:'Amiri',serif;font-size:1.15rem;color:var(--c);
  margin:1.2rem 0 .5rem;padding-right:.6rem;border-right:4px solid var(--gold)}

/* صندوق الخلاصة */
.kbox{margin-top:1rem;background:linear-gradient(135deg,rgba(184,148,47,.09),rgba(184,148,47,.03));
  border:1px solid var(--line);border-radius:12px;padding:.8rem .9rem}
.kbox .bt{font-family:'Amiri',serif;color:var(--gold2);font-size:1rem;margin-bottom:.5rem}
.kgrid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.55rem}
.kb{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:.5rem .6rem}
.kb b{display:block;color:var(--blue);font-size:.88rem;margin-bottom:.1rem}
.kb span{font-size:.78rem;color:var(--muted);line-height:1.6;display:block}

/* جدول */
.tblwrap{overflow-x:auto;margin-top:1rem;border:1px solid var(--line);border-radius:12px}
.tblwrap table{border-collapse:collapse;width:100%;min-width:380px}
.tblwrap th{background:var(--c);color:#fff;font-size:.82rem;font-weight:700;
  padding:.55rem .7rem;text-align:right;white-space:nowrap}
.tblwrap td{padding:.55rem .7rem;font-size:.84rem;border-bottom:1px solid var(--line);
  line-height:1.8;vertical-align:top}
.tblwrap tr:last-child td{border-bottom:0}
.tblwrap tbody tr:nth-child(odd){background:rgba(184,148,47,.045)}

/* اقتباس */
.ch3 blockquote,.rbody blockquote{margin:1rem 0;padding:.8rem 1rem;border-right:5px solid var(--gold);
  background:rgba(184,148,47,.07);border-radius:0 12px 12px 0}
.ch3 blockquote p,.rbody blockquote p{font-family:'Amiri',serif;font-size:1.08rem;line-height:2;color:var(--gold2)}
.ch3 blockquote cite,.rbody blockquote cite{display:block;margin-top:.4rem;font-size:.78rem;
  color:var(--muted);font-style:normal}

/* خلاصة الفصل */
.ch3 .res,.rbody .res{margin-top:1rem;padding:.6rem .9rem;border-right:4px solid var(--gold);
  background:linear-gradient(135deg,rgba(184,148,47,.12),rgba(184,148,47,.04));
  border-radius:10px;font-size:.9rem;color:var(--gold2);font-weight:600}
.ch3 .up{display:block;text-align:left;margin-top:.9rem;font-size:.78rem;
  color:var(--muted);text-decoration:none}
.ch3 .up:hover{color:var(--c)}

@media(max-width:420px){
  .ch3{padding:1rem .85rem}
  .ch3 .ap,.rbody .ap{font-size:1.05rem}
  .kgrid3{grid-template-columns:1fr 1fr}
}


/* ==========================================================
   COMFORT — راحة القراءة والزخرفة
   ========================================================== */

/* عرض مريح للسطر: يمنع الإرهاق البصري */
main{max-width:760px}
.ch3 .ap,.ch3 .lead{max-width:100%}

/* سطر استهلالي كبير (حرف Headline) */
.ch3 .lead .drop,.rbody .lead .drop{float:right;font-family:'Amiri',serif;font-size:3.4rem;line-height:.82;
  color:var(--c);margin:.18rem 0 0 .45rem;font-weight:700;opacity:.9;
  border-right:3px solid var(--gold);padding:.1rem .45rem 0 0}

/* فاصل زخرفي بين الأقسام */
.porn{width:280px;max-width:80%;height:38px;margin:0 auto .6rem;display:block}
.porn .ln{stroke:var(--gold);stroke-width:1.1;fill:none;opacity:.7}
.porn .dm{stroke:var(--gold);stroke-width:.9;fill:none;opacity:.5}

/* فهرس الأقسام داخل رأس القسم */
.part-list{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin-top:.7rem}
.part-list a{font-size:.76rem;text-decoration:none;color:var(--muted);
  border:1px solid var(--line);border-radius:50px;padding:.2rem .7rem;transition:.2s}
.part-list a:hover{color:var(--c);border-color:var(--gold);background:rgba(184,148,47,.08)}

/* فهرس متشعّب */
.toclist>li{padding:0}
.toc-part{list-style:none;margin-bottom:.9rem}
.toc-part>b{display:inline-block;margin-left:.4rem}
.toc-part>a{font-weight:700;font-size:.98rem;color:var(--c);display:flex;align-items:center;gap:.45rem}
.toc-part>ul{list-style:none;margin:.35rem 0 0;padding-right:.9rem;
  border-right:1px dashed var(--line)}
.toc-part>ul>li{margin:0}
.toc-part>ul a{padding:.32rem .3rem;font-size:.88rem;border:0;gap:.45rem}
.toc-part>ul a i{width:6px;height:6px;border-radius:50%;background:var(--line);
  flex:0 0 auto;display:block;margin-top:.55rem}
.toc-part>ul a:hover i{background:var(--gold)}
.toc-part>li.here a,.toc-part>ul>li.here a{color:var(--c);background:rgba(184,148,47,.1)}
.toc-part>ul>li.here a i{background:var(--gold);box-shadow:0 0 0 3px rgba(184,148,47,.2)}

/* تنقّل بين الفصول */
.chnav{display:flex;gap:.5rem;align-items:stretch;margin-top:1.1rem;
  padding-top:.9rem;border-top:1px dashed var(--line)}
.chnav a{flex:1;background:transparent;border:1px solid var(--line);border-radius:12px;
  padding:.5rem .7rem;text-decoration:none;transition:.22s;min-width:0}
.chnav a:hover{border-color:var(--gold);background:rgba(184,148,47,.06)}
.chnav a.empty{visibility:hidden}
.chnav small{display:block;font-size:.66rem;color:var(--muted)}
.chnav b{display:block;font-size:.82rem;color:var(--c);line-height:1.5;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chnav .nx{text-align:left}
.chnav .nx b{white-space:normal}
.cn-pos{align-self:center;font-size:.7rem;color:var(--muted);white-space:nowrap;padding:0 .3rem}

/* عنوان الجدول */
.tblcap{font-family:'Amiri',serif;font-size:.95rem;color:var(--gold2);
  padding:.5rem .8rem;background:rgba(184,148,47,.07);font-weight:700}

/* شريط الفصل العائم */
.railbar{position:fixed;bottom:52px;right:0;left:0;z-index:69;pointer-events:none;
  display:flex;justify-content:center}
.railbar .rb{max-width:92%;background:var(--paper);border:1px solid var(--line);
  border-radius:50px;padding:.2rem .9rem;font-size:.7rem;color:var(--gold2);
  box-shadow:var(--shadow);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-height:1.7rem;line-height:1.7rem}

@media(max-width:560px){
  .ch3 .lead .drop,.rbody .lead .drop{font-size:2.7rem}
  .chnav b{font-size:.76rem}
  .railbar{display:none}
}


/* ==========================================================
   القارئ — كتاب بلا تمرير عمودي
   ========================================================== */

/* الصفحة كلها: شريط علوي + مسرح + شريط سفلي */
body.reading{height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
body.reading .top{flex:0 0 auto}
body.reading .flip,body.reading .sword,body.reading .railbar,body.reading .crumbs{display:none}

main.reader{max-width:none;margin:0;padding:0;flex:1;min-height:0;
  display:flex;flex-direction:column;animation:none}

/* الشريط العلوي يحمل اسم الفصل */
.top.reading .brand{flex:1;min-width:0;gap:.35rem}
.top.reading .btxt{display:none}
.rbrand{font-family:'Amiri',serif;font-size:.92rem;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* المسرح */
.rstage{position:relative;flex:1;min-height:0;overflow:hidden;
  perspective:2200px;perspective-origin:50% 50%;touch-action:pan-y}

/* الصفحة */
.rpage{position:absolute;display:flex;flex-direction:column;overflow:hidden;
  background:var(--paper);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 6px 22px rgba(80,60,20,.12)}
.rbody{flex:1;min-height:0;overflow:hidden;padding:12px 20px}
.rpfoot{flex:0 0 auto;height:26px;display:flex;align-items:center;justify-content:center;
  font-size:.72rem;color:var(--muted);border-top:1px solid var(--line);
  direction:ltr;unicode-bidi:isolate}

/* حاوية القياس (خارج الشاشة) */
.rmeas{position:absolute;left:-99999px;top:0;visibility:hidden;pointer-events:none}
.rmeas .rbody{height:auto!important;padding:0;overflow:hidden}

/* ورقة التقليب */
.rleaf{position:absolute;display:none;transform-style:preserve-3d;
  will-change:transform;z-index:20;pointer-events:none}
.rleaf.on{display:block}
.rface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--paper);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);overflow:hidden}
.rback{transform:rotateY(180deg);
  background:linear-gradient(270deg,var(--paper) 55%,var(--cream) 100%)}
.rleaf::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to left,rgba(0,0,0,.30),rgba(0,0,0,0) 45%);
  opacity:calc(var(--a,0)*.95)}
.rleaf.prev::after{background:linear-gradient(to right,rgba(0,0,0,.30),rgba(0,0,0,0) 45%)}

/* الشريط السفلي */
.rfoot{flex:0 0 auto;display:flex;align-items:center;gap:.6rem;
  padding:.35rem .8rem;min-height:56px;border-top:1px solid var(--line);background:var(--paper)}
.rnav{min-height:48px;min-width:66px;padding:.35rem .9rem;border:1px solid var(--line);
  border-radius:12px;background:transparent;color:var(--ink);font-family:'Cairo';
  font-size:.9rem;font-weight:600;cursor:pointer;transition:.2s}
.rnav:hover:not(:disabled){border-color:var(--gold);background:rgba(184,148,47,.07)}
.rnav:disabled{opacity:.3;cursor:default}
.rprog{flex:1;height:9px;min-width:60px;border:0;padding:0;border-radius:9px;
  background:var(--line);overflow:hidden;cursor:pointer;display:block}
.rprog i{display:block;height:100%;width:0;
  background:linear-gradient(90deg,var(--gold),#E3C56A);transition:width .25s}

/* لوحة الفهرس والذهاب إلى صفحة */
.rpanel{position:fixed;top:0;right:0;bottom:0;width:min(86vw,360px);z-index:120;
  background:var(--paper);border-left:1px solid var(--line);display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .28s ease;
  box-shadow:-6px 0 24px rgba(0,0,0,.14)}
.rpanel.on{transform:translateX(0)}
.rphead{display:flex;align-items:center;justify-content:space-between;
  padding:.65rem .9rem;border-bottom:2px solid var(--gold);
  font-family:'Amiri';font-size:1.05rem;color:var(--c)}
.rpjump{display:flex;gap:.5rem;padding:.7rem .9rem;border-bottom:1px solid var(--line)}
.rpjump input{flex:1;min-width:0;min-height:46px;border:1px solid var(--line);border-radius:10px;
  background:var(--cream);color:var(--ink);font-family:'Cairo';font-size:1rem;padding:0 .7rem}
.rpgo{min-height:46px;padding:0 1rem;border:0;border-radius:10px;background:var(--gold);
  color:#fff;font-family:'Cairo';font-weight:700;cursor:pointer}
.rpfont{display:flex;align-items:center;gap:.45rem;padding:.55rem .9rem;
  border-bottom:1px solid var(--line);font-size:.85rem;color:var(--muted)}
.rpfont span{margin-left:auto}
.rpfont button{min-width:44px;min-height:42px;border:1px solid var(--line);border-radius:9px;
  background:transparent;color:var(--ink);font-family:'Cairo';font-size:.92rem;cursor:pointer}
.rpfont button.on{border-color:var(--gold);background:rgba(184,148,47,.12);color:var(--c);font-weight:700}
.rplist{flex:1;overflow-y:auto;padding:.4rem .6rem;-webkit-overflow-scrolling:touch}
.rpitem{display:flex;align-items:center;gap:.55rem;padding:.45rem .5rem;
  border-bottom:1px dashed var(--line);text-decoration:none;color:var(--ink);font-size:.9rem}
.rpitem i{background:var(--gold);color:#fff;border-radius:6px;min-width:32px;text-align:center;
  font-size:.72rem;font-style:normal;padding:.15rem .2rem;flex:0 0 auto}
.rpitem:hover{color:var(--c);background:rgba(184,148,47,.07)}
.rphome{display:block;text-align:center;padding:.85rem;border-top:1px solid var(--line);
  color:var(--c);text-decoration:none;font-weight:700;font-size:.9rem}

/* داخل الصفحة: إزالة إطار الفصل، وتوسيط الجدول بلا تمرير أفقي */
.rbody .ch3{border:0;background:transparent;box-shadow:none;padding:.2rem 0 0;margin:0 0 .5rem}
.rbody .ch3-h{border:0;padding:.1rem 0 .25rem;margin:0 0 1.15rem}
.rbody .ch3-h h3{font-family:'Amiri',serif;font-size:1.58rem;font-weight:700;
  color:var(--c);line-height:1.5}
.rbody .cho-top{font-size:.68rem;margin-bottom:.4rem}
.rbody .cho-num{font-size:1.5rem}
.rbody .part-h{margin:0 0 .6rem;padding-top:.4rem}
/* غلاف الحقبة داخل القارئ: مضغوط ليدخل في صفحة واحدة بلا تمرير */
.rbody .hero{padding:.9rem .8rem .7rem;margin:0;border-top-width:4px}
.rbody .hero .ic{font-size:1.7rem}
.rbody .hero h1{font-size:1.42rem;margin:.15rem 0 0}
.rbody .hero .period{font-size:.78rem;margin-bottom:.35rem}
.rbody .hero .intro{font-size:.86rem;line-height:1.72}
.rbody .hero .orn{margin:.5rem auto;height:14px}
/* غلاف القسم داخل القارئ: مضغوط ليدخل في صفحة واحدة بلا قصّ */
.rbody .part-h .part-list{gap:.22rem;margin-top:.45rem}
.rbody .part-h .part-list a{font-size:.66rem;padding:.1rem .5rem}
.rbody .part-h p{font-size:.84rem;line-height:1.72;margin-top:.3rem}
.rbody .part-h h2{font-size:1.28rem}
.rbody .part-ic{font-size:1.5rem}
.rpfoot span:nth-child(2){margin:0 .22rem}
.rbody .tblwrap{overflow:hidden}
.rbody .tblwrap table{min-width:0;width:100%;table-layout:auto}
/* كسر الكلمات عند حدودها فقط: overflow-wrap:anywhere كان يقصّ «المرحلة» إلى «المر/حلة» */
.rbody .tblwrap th,.rbody .tblwrap td{word-break:normal;overflow-wrap:break-word;white-space:normal;hyphens:none}
.rbody .people{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.rbody mark{background:rgba(184,148,47,.38);color:inherit;border-radius:3px;padding:0 2px}
/* فهرس أكثف داخل القارئ: أقسام أكثر في الصفحة */
.rbody .toc-part{margin-bottom:.5rem}
.rbody .toclist a{padding:.26rem .3rem}
.rbody .toc-part>ul{margin-top:.2rem}
/* كتلة أطول من الصفحة (الغلاف مثلًا): تمرير داخلي بدل قصّ المحتوى */
.rbody.rflow{overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}

@media(max-width:420px){
  .rbody{padding:10px 14px}
  .rnav{min-width:56px;font-size:.82rem;padding:.3rem .55rem}
  .rfoot{gap:.4rem;padding:.3rem .5rem}
}

/* كثافة القراءة على الجوال: صفحة كتاب لا شرائح عرض */
@media(max-width:560px){
  .rbody{padding:10px 15px}
  .rbody .ap{font-size:1.02rem;line-height:1.95}
  .rbody .lead{font-size:1.06rem;line-height:1.95}
  .rbody .ch3 h3{font-size:1.22rem;line-height:1.55}
  .rbody .lead .drop{font-size:2.7rem}
  .rbody h4.sub{font-size:1.08rem}
  .rbody .kbox .bt{font-size:.92rem}
  .rbody .tblwrap td{font-size:.8rem;line-height:1.7}
  .rbody .tblwrap th{font-size:.76rem}
}

003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href=\"#ali-jamaa\"\u003e\u003ci\u003e\u003c/i\u003e\u003cspan class=\"ttl\"\u003eعام الجماعة واتفاق كلمة المسلمين\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\u003c/ul\u003e\n    \u003c/li\u003e\u003c/ol\u003e\n  \u003c/div\u003e"},{"u":"p","one":true,"id":"part-1","n":"أبو بكر الصديق (١١–١٣هـ)","ic":"","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-1\" style=\"--c:#8B1A3A\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🕊️\u003c/div\u003e\n      \u003ch2\u003eأبو بكر الصديق (١١–١٣هـ)\u003c/h2\u003e\n      \u003cp\u003eسنتان وثلاثة أشهر فقط جلسها أبو بكر على كرسي الخلافة، لكنها كانت كافية لإنقاذ الأمة من ارتداد يعصف بها، وفتح الطريق أمام أكبر حركة فتح في التاريخ. هذا القسم يتتبع الرجل من نسبه وصفاته، إلى إيمانه وتضحيته، إلى بيعته وبيانه، ثم جيش أسامة وقضاء المرتدين وجمع القرآن، وينتهي بفتوح الفرس والروم ووفاته وهو يستخلف عمر.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#abubakr-nasab\"\u003eالنسب والصفات والمكانة\u003c/a\u003e\u003ca href=\"#abubakr-iman\"\u003eالإيمان والتضحية وفضل الرسول\u003c/a\u003e\u003ca href=\"#abubakr-bayaa\"\u003eالبيعة وبيان الخلافة\u003c/a\u003e\u003ca href=\"#abubakr-usama-ridda\"\u003eجيش أسامة وقضاء المرتدين\u003c/a\u003e\u003ca href=\"#abubakr-quran\"\u003eجمع القرآن الكريم\u003c/a\u003e\u003ca href=\"#abubakr-futuh\"\u003eالفتوحات: جبهة الفرس وجبهة الروم\u003c/a\u003e\u003ca href=\"#abubakr-wafat\"\u003eالمرض والوفاة واستخلاف عمر\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"abubakr-nasab","n":"النسب والصفات والمكانة","ic":"🌿","part":"أبو بكر الصديق (١١–١٣هـ)","h":"\u003carticle class=\"ch3\" id=\"abubakr-nasab\" data-toc=\"النسب والصفات والمكانة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eأبو بكر الصديق (١١–١٣هـ)\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ١ من ٧\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e١\u003ci\u003e.\u003c/i\u003e١\u003c/span\u003e\n            \u003ch3\u003e🌿 النسب والصفات والمكانة\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eم\u003c/span\u003eن هو الرجل الذي شهد له النبي ﷺ بأنه أصدق الناس لهجة، وكيف صنعته مكة قبل الإسلام؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eهو عبد الله بن عثمان بن عامر بن عمرو بن كعب بن سعد بن تيم بن مرة بن كعب بن لؤي، وأبو قحافة كنية أبيه عثمان بن عامر، وأمه أم الخير سلمى بنت صخر بن عامر بن عمرو بن كعب بن سعد بن تيم، فهو قرشي تيمي، يلتقي مع النبي ﷺ في مرة بن كعب، ويجتمع معه في الجدّ السادس. نشأ في بيت شرف وثراء، وكان من أعيان مكة وأهل الرأي والمشورة فيها قبل البعثة، يعرف أنساب العرب وأخبارها وأيامها، ويحفظ من الشعر ما يجعله مرجعًا لقومه في المنازعات والخصومات.\u003c/p\u003e\u003cp class=\"ap\"\u003eولُقّب بالصدّيق لأنه أسرع الناس إلى تصديق رسول الله ﷺ، وأول من آمن به من غير أهل بيته، فلم ينتظر آية ولا معجزة، بل كفاه خلق النبي ﷺ ودعوته. ويروي ابن سعد عن أبي هريرة أن النبي ﷺ قال: «أتاني جبريل فقال: إني أُرسلت إلى قومك، قلت: إن قومي لا يصدقوني، قال: يصدقك أبو بكر وهو الصديق». ويروي هشام بن الحسن البصري أن أبا بكر قال حين وصف له النبي ﷺ بيت المقدس في ليلة الإسراء: «صدقت»، فسُمّي الصديق من يومئذ، وفي هذا الخبر دلالة على أن اللقب لصق به من كثرة تصديقه، لا من حادثة واحدة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما العتيق فمعناه الجميل في الجود والخير، وقيل بل هو لقب لقّبه به النبي ﷺ؛ روى ابن سعد أن عائشة رضي الله عنها سألت: يا رسول الله، لم سُمّي أبو بكر عتيقًا؟ فقال: «هذا عتيق الله من النار». وأما الأوّاه فهو كثير التأوه والترحم، وقد فسّره أهل التفسير بالرحيم الرقيق القلب، وكان أبو بكر رفيقًا بأصحابه، رحيمًا بهم، يقضي حوائجهم ويخفف عنهم، فكأنه اقتبس هذا الخلق من نبيه ﷺ، فصار رحمة لمن حوله في بيته وفي السوق وفي ساعة الحرب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوصفَته ابنته عائشة رضي الله عنها فقالت: رجل أبيض، خفيف، خفيف العارضين، أجنأ لا يستمسك إزاره لشدة نحافته، معروق الوجه، قليل لحم الوجه، غائر العينين، ناتئ الجبهة، عاري الأشاجع. وهذه الصورة تدل على جسم نحيف خفيف الحركة، لا على قوة البنية وضخامة الخلق، ومع ذلك كان أشد الناس احتمالًا وأثبتهم قلبًا في المواقف الحرجة، فالقوة عنده كانت في النفس لا في الجسد، وفي اليقين لا في العضلات.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما صفاته الخُلقية فكان صدّيقًا أوّاهًا، شديد الحياء، كثير الورع، حازمًا مع رحمة، تاجرًا يحفظ شرفه وكرامته، غنيًا بماله عن أموال الناس. ولم يؤثر عنه شرب الخمر في جاهلية ولا إسلام، ولا سجود لصنم، ولا كذب في جد ولا هزل، حتى قال أهل السير: إنه لم يعبد صنمًا قط ولم يشرب خمرًا قط. وكان صديقًا حميمًا للنبي ﷺ قبل البعثة، فقد كانت الصحبة بينهما تقاربًا في المظهر والمسلك، وسلامةً في الفطرة، وبُعدًا في النظر، ورجاحةً في العقل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في قومه محبوبًا موثوقًا، أنسب قريش لقريش وأعلمها بأنسابها وأخبارها، حليمًا كريم النفس، يجود بماله ووقته، فنال حب الناس وتقديرهم، وكانوا يأتونه في مهماتهم ويستشيرونه في أمورهم، ويستودعونه أموالهم ومصالحهم. وقد كانت إليه في الجاهلية الأشناك، وهي الديّات التي تحملها العشيرة عن القاتل، فكان يقرب بذلك من العشيرة ويحمل عن الناس أعباءهم، فإذا سأل في دية قومه أمضوا حمالته ومدحوه، وإن حملها غيره لم يصدّقوه.\u003c/p\u003e\u003cp class=\"ap\"\u003eفكان سيدًا في الجاهلية وسيدًا في الإسلام، وشريفًا في الجاهلية وشريفًا في الإسلام، لم تغيّر الإسلامَ سطوته ولا أفسدته الجاهليةُ ببقاياها. وهذا المعنى هو ما جعل النبي ﷺ يقدّمه على غيره في مواطن كثيرة، ويقول فيه ما لم يقله في أحد من أصحابه، فقد جمع بين شرف النسب وشرف النفس، وبين علم الدنيا وعلم الدين، فاجتمعت له في قومه المكانة الرفيعة والثقة الكاملة، وكان أهل مكة يسمونه قبل الإسلام أميرَ قريش.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eبيته ونشأته في مكة\u003c/h4\u003e\u003cp class=\"ap\"\u003eنشأ أبو بكر في بني تيم، وهم حيّ من قريش لهم مكانة في التجارة والرأي، وكان بيت أبيه من بيوت اليسار، فتعلم التجارة صغيرًا، وخرج إلى أسواق العرب في الموسم، واتصل بأشراف القبائل وتجار الشام واليمن، فربح مالًا كثيرًا حتى بلغت تجارته ما جعله من أغنياء مكة. ولم يُلهه المال عن مروءة ولا عن حق، بل كان يعين الضعيف ويصل الرحم ويحمل عن العشيرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eولم يكن في شبابه من أهل اللهو والعبث، بل كان من أهل الحفظ والرواية، يعرف الأنساب والأخبار، ويجلس إلى أهل العلم بالكتب القديمة، فكان أقربَ قريش إلى معرفة ما جاءت به الرسل. فلما بُعث النبي ﷺ وجد في نفسه أرضًا خصبة، فلم يحتج إلى طول نظر ولا إلى جدال، لأن ما سمعه وافق ما كان يعرفه من أخبار الأنبياء وصفاتهم، ولأن قلبه كان سليمًا من الشرك لم يتدنس بعبادة حجر.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eألقابه ودلالتها\u003c/h4\u003e\u003cp class=\"ap\"\u003eاجتمع لأبي بكر ثلاثة ألقاب، كل واحد منها يصف جانبًا من شخصه: الصدّيق يصف صدق خبره ويقينه، والعتيق يصف عتقه من النار وكرامته عند ربه، والأوّاه يصف رقته ورحمته. وهذه الألقاب لم تكن ألقاب شهرة في السوق، بل كانت شهادات من النبي ﷺ وأصحابه على خلق راسخ في الرجل، فصارت أعلامًا تُعرف بها شخصيته قبل اسمه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد تنازع أهل السير في سبب تسميته بالصدّيق: فمنهم من قال لأنه صدّق النبي ﷺ في الإسراء حين كذّبه الناس، ومنهم من قال لأنه لم يكذب قط، ومنهم من قال لأن النبي ﷺ لقّبه بذلك. والأقوال لا تتعارض، فكلها ترجع إلى معنى واحد: رجل لا يفارق الصدق قولًا وعملًا، ولا يتقدمه أحد في تصديق رسول الله ﷺ، حتى صار الصدق وصفًا لازمًا له لا يفارقه في حال.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eبين الجاهلية والإسلام\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يكن إسلام أبي بكر انقطاعًا عن ماضيه، بل كان تتويجًا له؛ فقد كان في الجاهلية على شمائل أهل الإسلام من العفة والصدق والجود، فما إن دعاه النبي ﷺ حتى أسلم في الحال، ولم يسأل عن دليل ولا طلب معجزة، لأن قلبه كان مهيأ للإيمان، وقد قال فيه النبي ﷺ: «ما دعوت أحدًا إلى الإسلام إلا كانت عنده كبوة ونظر وتردد، إلا ما كان من أبي بكر».\u003c/p\u003e\u003cp class=\"ap\"\u003eومكانته في قريش هي التي جعلت إسلامه ذا أثر عظيم؛ فقد أسلم على يديه خمسة من العشرة المبشرين بالجنة: عثمان بن عفان، والزبير بن العوام، وعبد الرحمن بن عوف، وسعد بن أبي وقاص، وطلحة بن عبيد الله، فكان أول من دعا إلى الإسلام بعد النبي ﷺ، وأول من جمع الناس على الإيمان في مكة، وأول من بنى مسجدًا يُذكر فيه اسم الله.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالنسب\u003c/b\u003e\u003cspan\u003eقرشي تيمي، يجتمع مع النبي ﷺ في مرة بن كعب\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eاللقب الأشهر\u003c/b\u003e\u003cspan\u003eالصدّيق، لتصديقه النبي ﷺ قبل الناس\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأول من أسلم\u003c/b\u003e\u003cspan\u003eمن الرجال الأحرار البالغين\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأثر إسلامه\u003c/b\u003e\u003cspan\u003eأسلم على يديه خمسة من العشرة المبشرين بالجنة\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eألقاب أبي بكر ومعانيها\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eاللقب\u003c/th\u003e\u003cth\u003eمعناه\u003c/th\u003e\u003cth\u003eسبب التلقيب\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالصدّيق\u003c/td\u003e\u003ctd\u003eكثير التصديق\u003c/td\u003e\u003ctd\u003eأسرع الناس إلى تصديق النبي ﷺ في كل ما جاء به\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالعتيق\u003c/td\u003e\u003ctd\u003eالجميل في الجود والخير\u003c/td\u003e\u003ctd\u003eقال له النبي ﷺ: هذا عتيق الله من النار\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالأوّاه\u003c/td\u003e\u003ctd\u003eالرحيم الرقيق القلب\u003c/td\u003e\u003ctd\u003eكان رفيقًا بأصحابه يقضي حوائجهم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eأبو بكر\u003c/td\u003e\u003ctd\u003eكنية غلبت عليه\u003c/td\u003e\u003ctd\u003eكنية ابنه بكر بن أبي بكر\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eما دعوت أحدًا إلى الإسلام إلا كانت عنده كبوة ونظر وتردد، إلا ما كان من أبي بكر بن أبي قحافة، ما أحجم عن شيء ذكرته له وما تردد فيه\u003c/p\u003e\u003ccite\u003eابن هشام، السيرة النبوية ١/٢٣١، عن القضاة ص١٤\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eجمع أبو بكر بين شرف النسب وشرف النفس، فكان سيدًا في الجاهلية وسيدًا في الإسلام. وألقابه الثلاثة شهادات على صدق ويقين ورحمة لم تكن عنده ادعاءً بل خلقًا راسخًا.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"abubakr-iman","n":"الإيمان والتضحية وفضل الرسول","ic":"🤍","part":"أبو بكر الصديق (١١–١٣هـ)","h":"\u003carticle class=\"ch3\" id=\"abubakr-iman\" data-toc=\"الإيمان والتضحية وفضل الرسول\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eأبو بكر الصديق (١١–١٣هـ)\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٢ من ٧\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e١\u003ci\u003e.\u003c/i\u003e٢\u003c/span\u003e\n            \u003ch3\u003e🤍 الإيمان والتضحية وفضل الرسول\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eم\u003c/span\u003eا الذي جعل النبي ﷺ يقول إن أبا بكر أمنّ الناس عليه في صحبته وماله؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان أبو بكر أشجع الصحابة قلبًا وأكملهم إيمانًا، شهد له القرآن في مواضع كثيرة، منها قوله تعالى: «فأما من أعطى واتقى وصدّق بالحسنى فسنيسره لليسرى»، وقوله: «وسيجنبها الأتقى الذي يؤتي ماله يتزكى وما لأحد عنده من نعمة تجزى إلا ابتغاء وجه ربه الأعلى ولسوف يرضى». وقال تعالى فيه وفي النبي ﷺ: «ثاني اثنين إذ هما في الغار إذ يقول لصاحبه لا تحزن إن الله معنا»، وهي أعلى شهادة نزلت في صحابي، وقد قرأها العلماء على أنها تنصيص على فضله وثباته في أحرج ساعة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوظهر يقينه في حادثة الإسراء والمعراج أظهر ما يكون؛ فقد جاء مشركو مكة إلى أبي بكر يقولون: أتنظر ما يقول صاحبك؟ يزعم أنه جاء هذه الليلة بيت المقدس ورجع إلى مكة، فقال: «والله لئن كان قال ذلك لقد صدق»، قالوا: وتصدقه في هذا؟ قال: «إني أخبرني أنه يأتيه الخبر من السماء إلى الأرض في ساعة من ليل أو نهار فأصدقه». فمن هنا لُقّب بالصدّيق، لأن تصديقه لم يكن على قدر العقل والحساب، بل على قدر اليقين، فما تردد لحظة واحدة في خبر لا يشهد له الحس.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي بدر ظهر إيمانه في أحرج ساعة؛ فقد وقف النبي ﷺ يدعو ربه ويُلحّ في الدعاء حتى سقط الرداء عن كتفيه وهو يقول: «اللهم إن تهلك هذه العصابة فلن تُعبد بعدُ في الأرض، اللهم أنجز لي ما وعدتني»، فأتاه أبو بكر فرفع الرداء عن كتفيه وقال: «يا رسول الله، إن الله منجز لك ما وعد، والله لن يخزيك الله أبدًا». فكان إيمانه في تلك اللحظة سندًا للنبي ﷺ نفسه، وليس سندًا لنفسه فقط، وفي هذا أدب عظيم في مواجهة الخطر: تثبيت القائد لا زيادة الهمّ عليه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي يوم الحديبية ظهر الفرق بين من ينظر إلى ظاهر الأمر ومن ينظر إلى حقيقته؛ فقد رأى عمر أن المسلمين على حق وأن المشركين منعوهم، فذهب إلى أبي بكر يجادله، فقال له أبو بكر: «الزم أمره فإنه رسول الله ولن يضيعه الله أبدًا». ولم يكن ذلك توقفًا عن السؤال، بل كان تسليمًا لعلم النبوة، وهو التسليم الذي جعل أبا بكر يرى في الصلح فتحًا قبل أن يراه الناس، فكان من ثمار هذا اليقين أن جاء الفتح الأعظم بعد سنتين.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأعظم مواقفه يوم وفاة النبي ﷺ، حين اضطربت النفوس وزلزلت القلوب، فخرج على الناس وقال: «أيها الناس، من كان يعبد محمدًا فإن محمدًا قد مات، ومن كان يعبد الله فإن الله حي لا يموت»، ثم تلا: «وما محمد إلا رسول قد خلت من قبله الرسل أفإن مات أو قُتل انقلبتم على أعقابكم». قال عمر: ما سمعت أبا بكر تلاها حتى وقعت إلى الأرض ما تحملني رجلاي. فكان ثباته سدًّا أمام ارتداد كان يمكن أن يجرف الأمة كلها في ساعتها الأولى.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما تضحيته بنفسه فبدأت في مكة قبل الهجرة؛ فقد حاولت قريش الاعتداء على النبي ﷺ يومًا، فقام أبو بكر يدفع عنهم ويقول: «أَتَقْتُلون رجلًا أن يقول ربي الله»، فتحاملوا عليه وضربوه حتى أُغمي عليه، فلما أفاق قال: «ما فعل رسول الله؟» قالوا: خير، فقال: «والله لا أذوق طعامًا ولا شرابًا حتى أرى رسول الله»، فلم تهدأ نفسه حتى اطمأن على النبي ﷺ. وفي الهجرة بلغت التضحية حدًّا لا يُتصور؛ فقريش تبحث عنهما وجعلت جائزة عظيمة لمن يأتي بهما، فعرض أبو بكر نفسه للقتل والهلاك رجاء أن يفوز بصحبة النبي ﷺ، ولما أراد النبي ﷺ دخول غار ثور دخل أبو بكر قبله يفتش الغار مخافة أن تكون فيه دابة تؤذيه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما ماله فكان كله في خدمة الدعوة؛ اشترى سبع رقاب فأعتقهم، فقال أبوه: يا بني إني أراك تعتق رقابًا ضعافًا، فلو أنك أعتقت رجالًا أشداء يساعدونك، فقال: «يا أبت إني أريد وجه الله عز وجل». ثم جاء يوم الهجرة فأخذ معه ماله كله، وحين ندب النبي ﷺ للتبرع لجيش العسرة في تبوك جاء بماله كله، فقال له النبي ﷺ: «ما أبقيت لأهلك؟» قال: «أبقيت لهم الله ورسوله». وقال النبي ﷺ: «ما نفعني مال ما نفعني مال أبي بكر»، وقال: «إن أمنّ الناس عليّ في صحبته وماله أبو بكر». وقد أسلم وله أربعون ألف درهم، فأنفقها كلها في سبيل الله، وحين ولي الخلافة جعل ما بيده في بيت مال المسلمين.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eتضحيته بنفسه\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم تكن تضحية أبي بكر كلامًا في مجلس، بل مواقف حقيقية عرض فيها نفسه للضرب والتشريد والقتل؛ في مكة كان درعه بجسده دون النبي ﷺ، وفي الهجرة كان أمامه في الغار ينظر ما فيه، وفي كل موطن كان يقدّم النبي ﷺ على نفسه وأهله وولده، فما سُئل عن نفسه في لحظة خطر إلا سأل عن النبي ﷺ أولًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوهذه التضحية لم تكن حماسة عابرة تُطفئها الشدة، بل كانت خلقًا ثابتًا لازمه إلى آخر عمره؛ ففي الخلافة كان يجاهد بنفسه وماله، ويركب في الحر والبرد، ويقف في الصف الأول، ويقول: «وما لي لا أُغبّر قدميّ في سبيل الله» يوم مشى في وداع جيش أسامة وهو خليفة المسلمين.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eتضحيته بماله\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان أبو بكر من أغنياء قريش، فأنفق ماله في تحرير المستضعفين من الرقيق الذين كانوا يُعذَّبون في مكة، وفي تجهيز الجيوش، وفي سدّ حاجة الفقراء، حتى لم يبقَ في يده شيء يُذكر. ولم يكن يرى في المال إلا وسيلة لخدمة الدين، لا زينة ولا سلطانًا، فما جمعه للتجارة أنفقه للدعوة.\u003c/p\u003e\u003cp class=\"ap\"\u003eولما ولي الخلافة كان له عيشه من التجارة، فلما رآه عمر يحمل ثيابه إلى السوق قال له: إنك وليت أمر المسلمين فيُفرض لك في أموالهم ما يكفيك. ففرضوا له كفايته، وقال: «إني كنت أحترف لعيالي فأكتسب قوتهم، وأنا الآن أحترفت لله». ومات وما ترك دينارًا ولا درهمًا، كما قالت عائشة رضي الله عنها، فكان غناه في قلبه لا في صندوقه.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eإشارات النبي إلى تفضيله\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يعيّن النبي ﷺ خليفة بعده، لأن طبيعة الدعوة وتطبيق مبدأ الشورى يقتضيان أن يختار المسلمون أمرهم، ولكن ذلك لا يعني ترك الأمر دون هداية؛ فقد قدّم النبي ﷺ أبا بكر في مواطن فهم منها الصحابة تقديمه على غيره. من ذلك أمره له بالصلاة بالناس في مرضه: «مروا أبا بكر فليصل بالناس»، وقد قالت عائشة: إن أبا بكر إذا قام مقامك لم يُسمع الناس من البكاء، فقال: «إنكن لأنتن صواحب يوسف، مروا أبا بكر فليصل بالناس».\u003c/p\u003e\u003cp class=\"ap\"\u003eومنها أمره بإغلاق الأبواب الشارعة إلى المسجد إلا باب أبي بكر، فقال: «انظروا هذه الأبواب اللافطة في المسجد فسدّوها، إلا بيت أبي بكر، فإني لا أعلم أحدًا كان أفضل في الصحبة عندي يدًا منه». ومنها قوله في الخطبة: «إن عبدًا من عباد الله خيّره الله بين الدنيا وبين ما عنده، فاختار ما عنده»، فبكى أبو بكر، فقال: «لو كنت متخذًا من العباد خليلًا لاتخذت أبا بكر خليلًا، ولكن صحبة وإخاء إيمان حتى يجمع الله بيننا عنده».\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eشهادة القرآن\u003c/b\u003e\u003cspan\u003eثاني اثنين إذ هما في الغار\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eيوم الوفاة\u003c/b\u003e\u003cspan\u003eمن كان يعبد محمدًا فإن محمدًا قد مات\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eماله\u003c/b\u003e\u003cspan\u003eأربعون ألف درهم أنفقها كلها\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eقول النبي ﷺ\u003c/b\u003e\u003cspan\u003eإن أمنّ الناس عليّ في صحبته وماله أبو بكر\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eمواقف كشف فيها إيمان أبي بكر\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالموقف\u003c/th\u003e\u003cth\u003eقوله أو فعله\u003c/th\u003e\u003cth\u003eأثره\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالإسراء\u003c/td\u003e\u003ctd\u003eوالله لئن كان قال ذلك لقد صدق\u003c/td\u003e\u003ctd\u003eلُقّب بالصدّيق\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eبدر\u003c/td\u003e\u003ctd\u003eوالله لن يخزيك الله أبدًا\u003c/td\u003e\u003ctd\u003eثبّت النبي ﷺ في أحرج ساعة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالحديبية\u003c/td\u003e\u003ctd\u003eالزم أمره فإنه رسول الله\u003c/td\u003e\u003ctd\u003eردّ حيرة المسلمين إلى التسليم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eوفاة النبي ﷺ\u003c/td\u003e\u003ctd\u003eمن كان يعبد محمدًا فإن محمدًا قد مات\u003c/td\u003e\u003ctd\u003eأوقف موجة الارتداد\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eتبوك\u003c/td\u003e\u003ctd\u003eأبقيت لهم الله ورسوله\u003c/td\u003e\u003ctd\u003eأنفق ماله كله\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eلو كنت متخذًا من العباد خليلًا لاتخذت أبا بكر خليلًا، ولكن صحبة وإخاء إيمان حتى يجمع الله بيننا عنده\u003c/p\u003e\u003ccite\u003eرواه البخاري ومسلم، عن القضاة ص٢٦\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eكان إيمان أبي بكر يقينًا لا يعرف التردد، وتضحيته نفسًا ومالًا في كل موطن. وقد شهد له النبي ﷺ بما لم يشهد به لأحد، فكان أمنّ الناس عليه في صحبته وماله.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"abubakr-bayaa","n":"البيعة وبيان الخلافة","ic":"🤝","part":"أبو بكر الصديق (١١–١٣هـ)","h":"\u003carticle class=\"ch3\" id=\"abubakr-bayaa\" data-toc=\"البيعة وبيان الخلافة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eأبو بكر الصديق (١١–١٣هـ)\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٣ من ٧\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e١\u003ci\u003e.\u003c/i\u003e٣\u003c/span\u003e\n            \u003ch3\u003e🤝 البيعة وبيان الخلافة\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eك\u003c/span\u003eيف اختار المسلمون خليفةً في ساعاتٍ كانت فيها الأمة على حرف؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eلم يكد يُقضَ نحب النبي ﷺ حتى اجتمع الأنصار في سقيفة بني ساعدة يتشاورون في الأمر، ولا يدرون ما يفعل إخوانهم من المهاجرين، فرأوا أن يرسلوا إليهم، فقال أبو بكر: «بل نمشي إليهم»، فسار المهاجرون إليهم فيهم أبو بكر وعمر وأبو عبيدة بن الجراح. وكان في المجلس همّ واحد: من يحمل عبء هذه الدعوة بعد صاحبها؟ ولم يكن في نفوسهم طمع في منصب، بل كانوا يدركون أن الإمارة كما وصفها نبيهم ﷺ «فنعم المرضعة وبئست الفاطمة».\u003c/p\u003e\u003cp class=\"ap\"\u003eفتباحث القوم، وقال بعض الأنصار: «منا أمير ومنكم أمير»، فقام أبو بكر فتكلم فأتى على الأنصار فأثنى عليهم بما هم أهله، ثم بيّن وجه الحق فقال: «نحن الأمراء وأنتم الوزراء»، واحتج بأن العرب لا تعرف هذا الأمر إلا لقريش، وأن النبي ﷺ قال: «الأئمة من قريش». ثم قال: «إني أرضى لكم هذين الرجلين، عمر وأبا عبيدة، فأيّهم شئتم فبايعوا»، فكان في هذا الطرح تنازل عن حظ النفس وتقديم لمصلحة الجماعة على ما سواها.\u003c/p\u003e\u003cp class=\"ap\"\u003eفقال عمر: «من يتقدم عليك وقد رضيك رسول الله ﷺ لديننا، أفلا نرضاك لدنيانا؟» ثم قال: «ابسط يدك يا أبا بكر»، فبسط يده فبايعه، ثم بايعه أبو عبيدة وهو يقول: «إنك أفضل المهاجرين وثاني اثنين إذ هما في الغار، وخليفة رسول الله ﷺ»، ثم بايع الناس، وبايعه المهاجرون ثم الأنصار. قال عمر: «وبذلك حسمت الفتنة»، فكانت البيعة في يوم واحد، ولم يبقَ في المدينة من يطمع في الأمر أو يزاحم عليه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان هذا الخلاف خلافًا في الرأي لا في الهوى؛ فما اختلف القوم على منصب يبتغونه لأنفسهم، بل اختلفوا فيمن يحمل أثقل مسؤولية، والأنصار يدلون بجهودهم ونصرتهم، والمهاجرون بسابقتهم وصحبتهم. فلما تبيّن وجه الحق رجعوا إلى كلمة واحدة، لأن قلوبهم كانت صافية، واختلافهم كان لله لا على الله، فكان حبهم لله وافتراقهم لله، وهذا هو السر في أن الخلاف لم يترك جرحًا في الأمة.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم وقف أبو بكر في الناس يلقي بيان خلافته، وهو أول بيان سياسي في تاريخ الدولة الإسلامية، فقال: «إني قد وُليت عليكم ولست بخيركم، فإن أحسنت فأعينوني، وإن أسأت فقوّموني، الصدق أمانة، والكذب خيانة، والضعيف فيكم قوي عندي حتى آخذ له الحق، والقوي فيكم ضعيف عندي حتى آخذ منه الحق، لا يدع قوم الجهاد في سبيل الله إلا ضربهم الله بالذل، ولا تشيع الفاحشة في قوم قط إلا عمهم الله بالبلاء، أطيعوني ما أطعت الله ورسوله، فإذا عصيت الله ورسوله فلا طاعة لي عليكم». وهذه الكلمات لم تكن شعارات تُقال في يوم الفرح ثم تُنسى، بل كانت دستورًا عمليًا سار عليه في سنتي خلافته؛ فقد ردّ الحقوق إلى أهلها، وأقام العدل بين القوي والضعيف، وبدأ بنفسه فلم يستثنها من المساءلة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما مخصصاته المالية فلم تكن استثناءً عن هذا المنهج؛ فقد كان يعيش من التجارة، فلما ولي أمر المسلمين خرج يومًا إلى السوق يحمل ثيابه، فلقيه عمر فقال: «ما هذا؟ وإلى أين؟» قال: «إلى السوق»، فقال عمر: «إنك وليت أمر المسلمين، فيُفرض لك في أموالهم ما يكفيك وبيتك». ثم نادى عمر في الناس حتى اجتمعوا، فقام أبو بكر فقال: «أيها الناس، إني كنت أحترف لعيالي فأكتسب قوتهم، وأنا الآن أحترفت لله، فافرضوا لي من بيت المال».\u003c/p\u003e\u003cp class=\"ap\"\u003eفقال أبو عبيدة: «أفرض لك قوت رجل من المسلمين، ليس بأعلاهم ولا بدناهم، وكسوة الشتاء، وكسوة الصيف، وركوبة تركها»، ففرضوا له من بيت المال ما يكفيه، ثم زادوه حين رأوا حاجته وكثرة أعماله. وكان ذلك أول تنظيم لمال الخليفة في الإسلام: كفاية لا ترف، وحاجة لا سرف، ورقابة من الأمة على من يحكمها، فلم يكن الخليفة يملك من المال إلا ما يكفيه ليؤدي عمله، ولم يستفد من الخلافة درهمًا واحدًا.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eسقيفة بني ساعدة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان اجتماع السقيفة فورَ وفاة النبي ﷺ، قبل أن يُدفن، لأن الأمر لا يحتمل فراغًا، والخطر يهدد الدولة من كل جانب. وقد فهم الأنصار أنهم أصحاب الفضل في نصرة الإسلام، فطلبوا لأنفسهم نصيبًا في الأمر، ولم يكن طلبهم خروجًا على الجماعة، بل حرصًا على ألا يُستبدّ بهم في أمر يخصهم وحدهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد حُلّ الخلاف بحجة وبرهان، لا بغلبة ولا سيف؛ فساق أبو بكر الدليل من قول النبي ﷺ في قريش، ثم تنازل عن حقه في الاختيار حين رشّح عمر وأبا عبيدة، فكان تنازله عن الترشيح سببًا في استقرار الأمر. وهكذا انتهى أول خلاف سياسي في الإسلام إلى بيعة عامة في يوم واحد، بلا دم ولا سيف، وبلا ضغينة بقيت في القلوب.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eبيان الخلافة ودستورها\u003c/h4\u003e\u003cp class=\"ap\"\u003eيُعدّ بيان أبي بكر أول وثيقة تحدد علاقة الحاكم بالمحكوم في الإسلام؛ فيه إقرار بأن الخليفة ليس معصومًا، وأن الرعية تملك تقويمه، وأن الضعفاء يجدون عند الحاكم ما لا يجدونه عند غيره، وأن الطاعة ليست مطلقة بل مقيدة بالمعروف، وأن الجهاد إذا تُرك ضرب الله الأمة بالذل، وأن الفاحشة إذا شاعت عمّ البلاء الجميع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد جعل أبو بكر معيار الشرعية واضحًا: الطاعة ما أطاع الله ورسوله، فإذا خالف فليس له طاعة. وهذا المعيار هو الذي حوّل الخلافة من ملك يتوارث إلى أمانة تُؤدّى وتُسأل عنها، وهو الأساس الذي بنى عليه عمر بن الخطاب من بعده حين وسّع الشورى والمساءلة، فصار البيان سنة يُقتدى بها في كل عهد.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eمخصصات الخليفة المالية\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت سابقة عمر بن الخطاب في فرض كفاية الخليفة من بيت المال سابقةً مهمة في تنظيم الدولة؛ فالحاكم الذي ينشغل بأمر المسلمين لا يستطيع أن ينشغل بتجارته، ولا يصح أن يبقى عالة على أحد، ولا أن يثري من منصبه، فوجب أن يكون له من بيت المال ما يكفيه ويكفي بيته، وأن يكون ذلك معلومًا للناس لا سرًّا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد قبل أبو بكر الفرض على مضض، وحدّده أبو عبيدة بقوت رجل متوسط من المسلمين وكسوة الشتاء والصيف وركوبة، فكان ذلك حدًّا أدنى للكفاية لا للترف. ولم يزل أبو بكر على هذا الحال حتى مات، وقد جعل ما بيده من مال في بيت مال المسلمين، فكان أول خليفة يردّ على الأمة ما أخذ منها.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمكان البيعة\u003c/b\u003e\u003cspan\u003eسقيفة بني ساعدة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأول من بايع\u003c/b\u003e\u003cspan\u003eعمر بن الخطاب ثم أبو عبيدة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمبدأ البيان\u003c/b\u003e\u003cspan\u003eأطيعوني ما أطعت الله ورسوله\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمخصصه\u003c/b\u003e\u003cspan\u003eكفاية رجل متوسط، لا ترف ولا سرف\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eخطوات انعقاد البيعة\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمرحلة\u003c/th\u003e\u003cth\u003eما جرى فيها\u003c/th\u003e\u003cth\u003eالنتيجة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eاجتماع الأنصار\u003c/td\u003e\u003ctd\u003eتشاوروا في الأمر وطلبوا أميرًا منهم\u003c/td\u003e\u003ctd\u003eالحاجة إلى إجماع\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eمسير المهاجرين\u003c/td\u003e\u003ctd\u003eأبو بكر وعمر وأبو عبيدة إلى السقيفة\u003c/td\u003e\u003ctd\u003eتوحيد المجلس\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eطرح الحق\u003c/td\u003e\u003ctd\u003eنحن الأمراء وأنتم الوزراء\u003c/td\u003e\u003ctd\u003eبيان وجه الحق بالدليل\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالترشيح\u003c/td\u003e\u003ctd\u003eعمر وأبو عبيدة\u003c/td\u003e\u003ctd\u003eتنازل أبي بكر عن الاختيار\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالبيعة\u003c/td\u003e\u003ctd\u003eبايعه عمر ثم أبو عبيدة ثم الناس\u003c/td\u003e\u003ctd\u003eانعقاد الخلافة وحسم الفتنة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eإني قد وُليت عليكم ولست بخيركم، فإن أحسنت فأعينوني، وإن أسأت فقوّموني، الصدق أمانة، والكذب خيانة\u003c/p\u003e\u003ccite\u003eتاريخ الخلفاء للسيوطي ص٦٩، عن القضاة ص٢٩\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eانعقدت البيعة في سقيفة بني ساعدة بالحجة والتنازل، لا بالغلبة والسيف. وحدّد بيان أبي بكر معنى الخلافة: أمانة تُسأل عنها، وطاعة مقيدة بطاعة الله ورسوله.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"abubakr-usama-ridda","n":"جيش أسامة وقضاء المرتدين","ic":"⚔️","part":"أبو بكر الصديق (١١–١٣هـ)","h":"\u003carticle class=\"ch3\" id=\"abubakr-usama-ridda\" data-toc=\"جيش أسامة وقضاء المرتدين\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eأبو بكر الصديق (١١–١٣هـ)\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٤ من ٧\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e١\u003ci\u003e.\u003c/i\u003e٤\u003c/span\u003e\n            \u003ch3\u003e⚔️ جيش أسامة وقضاء المرتدين\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eم\u003c/span\u003eاذا يفعل خليفة في أول يوم له، وجيشٌ في خارج المدينة ينتظر أمرًا، وقبائل تتربص بالدولة؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان النبي ﷺ قد جهّز جيشًا تحت إمرة أسامة بن زيد، وهو شاب لم يبلغ العشرين، وأمره أن يوطئ الخيل تُخوم البلقاء والداروم من أرض فلسطين، وعقد له الراية بيده. ثم اشتد به المرض، فمكث الجيش خارج المدينة ينتظر أمره، فلما قُضي نحبه وتولى أبو بكر الخلافة قال كلمته: «أنفذوا أمر رسول الله ﷺ»، فكان أول قرار في خلافته إنفاذَ أمر النبي ﷺ لا إلغاءَه ولا تأجيله.\u003c/p\u003e\u003cp class=\"ap\"\u003eوخرج أبو بكر يودّع الجيش ومعه كبار الصحابة، وهو يمشي على قدميه وأسامة راكب، فقال له أسامة: «لتركب أو لأنزل»، فقال أبو بكر: «وما لي لا أُغبّر قدميّ في سبيل الله؟» ثم استأذنه أسامة في أن يترك عمر بن الخطاب في المدينة يستعين به على أمور المسلمين، فأذن له. وغاب الجيش نحو أربعين يومًا وقيل سبعين، ثم عاد يؤدي مهمته وقد رفع رأس الدولة في عيون القبائل المترددة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان إنفاذ هذا الجيش نظرًا بعيدًا من أبي بكر؛ فبعض قبائل العرب كانت قد دخلت الإسلام حديثًا، وبعضها لم يدخل بعد، وظنّت أن الفرصة سانحة بعد وفاة النبي ﷺ وقبل استتاب الأمر، فكان عزم الخليفة على إنفاذ الجيش إعلانًا بأن مركز الدولة في قوة لا في ضعف. ويُذكر أن أسامة كان لا يمرّ بقبيلة تريد الارتداد إلا قالوا: لولا أن بنا قوة لما أرسلوا هذا الجيش، فكفّوا عن كثير مما كانوا يريدون أن يفعلوه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوما كاد أبو بكر يتسلم زمام المسؤولية حتى بدأت الفتنة تطل برأسها؛ فبعد أن مضى جيش أسامة في طريقه إلى شرق الأردن، جعلت وفود القبائل تتوارد على المدينة تناقش قضية الزكاة، وتزعم أنها لم تعد مشروعة بعد وفاة النبي ﷺ، محتجين بقوله تعالى: «خذ من أموالهم صدقة تطهرهم وتزكيهم بها وصلّ عليهم إن صلاتك سكن لهم»، فقالوا: إن الزكاة تُدفع لمن كانت صلاته سكنًا لنا، وهو النبي ﷺ، وقد انقطع ذلك بوفاته، فسقطت بموته.\u003c/p\u003e\u003cp class=\"ap\"\u003eوتوسعت الفتنة وأبو بكر ينظر رأي أصحابه فلا يجد إلا من يقول له: اتركهم وما هم عليه من منع الزكاة وتألفهم حتى يتمكن الإيمان من قلوبهم، حتى عمر بن الخطاب وهو الرجل الشديد الحازم يقول له: إذا منعك العرب فاصبر عليهم. فأجاب أبو بكر بجوابه المشهور: «والله لو منعوني عقالًا كانوا يؤدونه إلى رسول الله ﷺ لقاتلتهم عليه، والله لأقاتلن من فرّق بين الصلاة والزكاة».\u003c/p\u003e\u003cp class=\"ap\"\u003eثم التفت إلى عمر فقال: «يا عمر، أجبار في الجاهلية، خوّار في الإسلام؟» ولما قيل له: مع من تقاتلهم وقد مات الناس عنك؟ قال: «وحدي حتى تنفرد سالفتي». فعزم على قتال المرتدين رغم أنه لم يبق معه إلا أهل المدينة ومكة والطائف، وهذه وقفة من أشد مواقفه؛ فهو الرقيق القلب كما تقول ابنته، لكنه كان جبارًا في الحق، حازمًا في نشر الدعوة، قويًا في الدفاع عن الإسلام.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم عقد أبو بكر أحد عشر لواء لأحد عشر قائدًا، كلهم من خيار أصحاب رسول الله ﷺ، منهم خالد بن الوليد، وعمرو بن العاص، وشرحبيل بن حسنة، وسارت الجيوش لقتال أهل الردة، فنصر الله الإسلام، وتفرّقت كلمة العدو، وكُسرت شوكتهم. وقد قال السباعي في هذا الموقف: إنه أعظم ما يؤثر عن الرجال من الحزم المصمم والإرادة الحازمة، ولولا أن ثبّت الله قلب أبي بكر على الحق لطوّحت الفتنة بصرح الإسلام الفتي. وبهذا القضاء الحاسم ثبتت الدولة في أخطر سنة من عمرها، فما تنازل أبو بكر عن شبر من الدين في أول يوم، وكان ذلك أصلح سياسة للدولة على المدى الطويل.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eإنفاذ جيش أسامة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان في الجيش من كبار الصحابة من هو أسنّ من قائده، ومع ذلك لم يعترض أحد على إمارة أسامة لأن النبي ﷺ عقد له الراية. وفي إصرار أبي بكر على إنفاذه درسان: أن أمر النبي ﷺ لا يُنسخ بموته، وأن الشاب قد يكون أهلًا للقيادة إذا اختاره من يعرف، فالعبرة بالكفاءة لا بالسن ولا بالسابقة وحدها.\u003c/p\u003e\u003cp class=\"ap\"\u003eولم يكن خروج الجيش إلى فلسطين مجازفة، بل كان رسالة سياسية إلى القبائل المترددة وإلى الروم في الوقت نفسه: أن الدولة قائمة، وأن جيشها لم يتوقف بموت صاحبه. وقد تحققت الفائدة قبل أن يصل الجيش إلى هدفه، فكفّت قبائل كثيرة عن الارتداد خوفًا من قوة الدولة، فكان الجيش يفتح بمسيره ما لم يفتحه بسيفه.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eقضية الزكاة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت حجة القبائل ظاهرة الضعف، لكنها كانت ذريعة لرفض الدولة الوليدة؛ فالزكاة في الإسلام عبادة وليست ضريبة، وربطها بالصلاة في القرآن جعل التفريق بينهما خروجًا على الدين لا مسألة إدارية. ولذلك رأى أبو بكر أن التنازل عنها في أول الأمر يعني التنازل عن أصل الدين، وأن التأليف لا يكون بإسقاط ركن.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان رأي الصحابة أول الأمر رأي تأليف ومجاملة، فخالفهم أبو بكر إلى رأي الحسم، ثم تبين لهم صوابه. وفي هذا دليل على أن الخليفة قد يرى ما لا يراه غيره، وأن الشورى لا تُلزمه بما يراه خطأً في أصل الدين، وأن الحزم في موضعه رحمة بالأمة لا قسوة عليها، وأن التأخير في الحق يفتح أبوابًا لا تُسدّ.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eأحد عشر لواء\u003c/h4\u003e\u003cp class=\"ap\"\u003eقسّم أبو بكر المرتدين إلى جبهات، وعقد لكل جبهة لواءً وقائدًا، فكان ذلك أول تنظيم عسكري شامل في الإسلام؛ فلم يواجه الردة بجيش واحد في معركة واحدة، بل وزّع القوة على القبائل حتى لا تتجمع عليه في وقت واحد، فحارب كل جماعة بما يصلح لها وبمن هو أعرف بها. فكان التوزيع نفسه خطة لا مجرد تقسيم إداري، لأن كل قبيلة تعرف قائدها وتخافه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان أعظم هذه الألوية أثرًا لواء خالد بن الوليد، فقد قصد طليحة بن خويلد في بزاخة حتى انهزم، ثم سار إلى مسيلمة في اليمامة فكانت الوقعة الفاصلة التي قُتل فيها مسيلمة، وعادت اليمامة إلى الإسلام. وبعد أن فرغت الجبهات عادت الجيوش إلى المدينة، وأصبحت الجزيرة كلها تحت راية واحدة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوبهذا التنظيم انتهت الردة في أقل من سنة، وعادت الجزيرة إلى الإسلام، وتفرّغت الدولة لمواجهة الفرس والروم في الخارج. وكان هذا الحسم هو الذي جعل الفتوح ممكنة، لأن الدولة لا تستطيع أن تفتح خارج حدودها وهي تحارب في داخلها، فكان ثمرة الحزم في الداخل فتحًا في الخارج.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eقائد الجيش\u003c/b\u003e\u003cspan\u003eأسامة بن زيد، شاب في العشرين\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eوجهته\u003c/b\u003e\u003cspan\u003eالبلقاء والداروم من أرض فلسطين\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمدة الغياب\u003c/b\u003e\u003cspan\u003eنحو أربعين يومًا وقيل سبعين\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eعدد الألوية\u003c/b\u003e\u003cspan\u003eأحد عشر لواء لأحد عشر قائدًا\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eأولويات أبي بكر في سنته الأولى\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالأولوية\u003c/th\u003e\u003cth\u003eالإجراء\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eإنفاذ أمر النبي ﷺ\u003c/td\u003e\u003ctd\u003eتسيير جيش أسامة إلى فلسطين\u003c/td\u003e\u003ctd\u003eهيبة الدولة أمام القبائل\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eحفظ الدين\u003c/td\u003e\u003ctd\u003eقتال مانعي الزكاة\u003c/td\u003e\u003ctd\u003eإبقاء الزكاة ركنًا لا يسقط\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eتنظيم القوة\u003c/td\u003e\u003ctd\u003eعقد أحد عشر لواء\u003c/td\u003e\u003ctd\u003eتفريق قوة المرتدين\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eضبط القيادة\u003c/td\u003e\u003ctd\u003eاختيار الأكفاء من الصحابة\u003c/td\u003e\u003ctd\u003eسرعة الحسم في الردة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eوالله لو منعوني عقالًا كانوا يؤدونه إلى رسول الله ﷺ لقاتلتهم عليه، والله لأقاتلن من فرّق بين الصلاة والزكاة\u003c/p\u003e\u003ccite\u003eالعواصم من القواصم ص٤٦، عن القضاة ص٣٣\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eأنفذ أبو بكر أمر النبي ﷺ فسيّر جيش أسامة رغم الخطر، ثم قاتل مانعي الزكاة وحده حتى دانت الجزيرة. وبذلك ثبتت الدولة في أول سنة، وعادت الجزيرة إلى الإسلام.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"abubakr-quran","n":"جمع القرآن الكريم","ic":"📖","part":"أبو بكر الصديق (١١–١٣هـ)","h":"\u003carticle class=\"ch3\" id=\"abubakr-quran\" data-toc=\"جمع القرآن الكريم\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eأبو بكر الصديق (١١–١٣هـ)\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٥ من ٧\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e١\u003ci\u003e.\u003c/i\u003e٥\u003c/span\u003e\n            \u003ch3\u003e📖 جمع القرآن الكريم\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eك\u003c/span\u003eيف حُفظ القرآن في صحف مكتوبة، ومن الذي أشار بذلك أول مرة؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eإن أشرف النهضات هي التي جاء بها الرسل، لأنها موقوفة على صلاح النفس الإنسانية، والنهضة الإسلامية قامت على وحي هو القرآن الكريم، الذي يعلق بالنفس ويتصل بها أوثق اتصال، ويطبعها طبعًا جديدًا وينشئها نشأة جديدة. فمن هنا كان حفظ القرآن في صحف مجموعة أول قاعدة من قواعد بناء الأمة، وأول عمل من أعمال أبي بكر بعد قضاء الردة، لأن الدولة لا تقوم إلا على كتاب محفوظ مجموع لا يتطرق إليه الضياع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان سبب الجمع حادثة اليمامة؛ فقد استُحرّ القتل يومها بقرّاء القرآن، وخشي عمر بن الخطاب أن يستمر القتل بالقراء في المواطن فيذهب كثير من القرآن، فأتى أبا بكر فقال: «إن القتل قد استحرّ يوم اليمامة بقرّاء القرآن، وإني أخشى إن استمر القتل بالقراء بالمواطن فيذهب كثير من القرآن، وإني أرى أن تأمر بجمع القرآن». وكان في هذا النظر إدراك أن الحفظ في الصدور وحده عرضة للفقد بموت الحفاظ في يوم واحد.\u003c/p\u003e\u003cp class=\"ap\"\u003eفقال أبو بكر: «كيف نفعل شيئًا لم يفعله رسول الله ﷺ؟» فقال عمر: «هذا والله خير»، فلم يزل عمر يراجعه حتى شرح الله صدره لذلك، ورأى في ذلك الذي رأى عمر. وهكذا كان القرار اجتهادًا جماعيًا لا فتوًّا فرديًّا؛ بدأ بفكرة من عمر، ثم اقتنع بها أبو بكر بعد مراجعة، ثم أُسند تنفيذها إلى من هو أهل لها، فاجتمعت المشورة والخبرة والتنفيذ في مسار واحد لم يتعجل خطوة.\u003c/p\u003e\u003cp class=\"ap\"\u003eفدعا أبو بكر زيد بن ثابت فقال له: «إنك رجل شاب عاقل لا نتهمك، وقد كنت تكتب الوحي لرسول الله ﷺ، فتتبع القرآن فاجمعه». فقال زيد: «فوالله لو كلفوني نقل جبل من الجبال ما كان أثقل عليّ مما أمرني به من جمع القرآن»، قال: «كيف تفعلون شيئًا لم يفعله رسول الله ﷺ؟» قال أبو بكر: «هو والله خير»، فلم يزل يراجعه حتى شرح الله صدره للذي شرح له صدر أبي بكر وعمر. فكان تردد زيد ورعًا، وكان إقدامه بعد ذلك يقينًا، وما أقدم على عمل إلا بعد أن اطمأن قلبه.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم تتبع زيد القرآن يجمعه من العسب واللخاف وصدور الرجال، أي من سعف النخل والرقاع والحجارة البيضاء الرقيقة، ومن حفظ الرجال الذين تلقّوه عن النبي ﷺ. ولم يعتمد على مصدر واحد، بل جمع بين المكتوب والمحفوظ، وهو أدق ما يمكن أن يُصنع في التوثيق؛ فالكتابة تحفظ اللفظ، والصدور تحفظ الأداء، وبهما معًا يُصان النص من التحريف والنسيان، وقد كان هذا المنهج هو الذي حصّن القرآن بعد ذلك.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بلغت الدقة أن زيدًا لم يقبل شيئًا حتى وجد عليه شاهدين، فلم يجد آخر سورة التوبة إلا مع أبي خزيمة الأنصاري، وهي قوله تعالى: «لقد جاءكم رسول من أنفسكم عزيز عليه ما عنتم» حتى خاتمة براءة، فأثبتها بشهادة أبي خزيمة. وفي هذا دليل على أن الجمع لم يكن تسجيلًا عشوائيًا، بل كان توثيقًا منضبطًا بمنهج الشهود، فما كُتب حرف إلا بشهادة تحفظه، ولا قُبل خبر منفرد في كتاب الله.\u003c/p\u003e\u003cp class=\"ap\"\u003eفكانت الصحف عند أبي بكر حتى توفاه الله، ثم عند عمر في حياته، ثم عند حفصة بنت عمر رضي الله عنها. وهذه الصحف هي الأصل الذي اعتمد عليه عثمان بن عفان بعد ذلك في نسخ المصاحف وإرسالها إلى الأمصار، فكان جمع أبي بكر مقدمة ضرورية لحفظ القرآن من الضياع، وأساسًا لوحدة المصحف بعد ذلك، ودرعًا دون اختلاف الأمة في كتابها، فما اختلف المسلمون في حرف من كتابهم بعده.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eسبب الجمع\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان القتل في اليمامة فادحًا في صفوف القرّاء، وهم الذين يحملون القرآن في صدورهم ويعلمونه الناس. ومثل هذا النقص لا يُستدرك إذا ذهب، لأن الحفظ في الصدور وحده عرضة للفقد بموت الحفاظ، فكان لا بد من تدوين شامل يجمع المتفرق ويحفظ الأصل قبل أن يضيع، ويجعل الأمة تستند إلى كتاب مكتوب لا إلى ذاكرة رجال.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أدرك عمر هذا الخطر قبل غيره، فكانت فكرته استجابةً لحاجة الأمة لا رغبة في تدوين جديد. وتردد أبي بكر كان ورعًا لا توانيًا؛ فما فعله النبي ﷺ لا يُزاد عليه إلا إذا دعت الضرورة، فلما تبيّن أن الضرورة قائمة أقدم على الجمع، فكان اجتهاده في محله، وكان تردده أولًا ثم إقدامه آخرًا دليل فقه لا دليل تردد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في موقف عمر درس في أدب المشورة: رأى رأيًا فلم يفرضه، بل راجع صاحبه مرة بعد مرة حتى اقتنع أو أقنع، فما استعمل سلطته ولا لجأ إلى إلزام. وهذا هو الفرق بين مشورة تُطلب للبركة ومشورة تُطلب للحقيقة، وبين رأي يُطرح للنقاش ورأي يُفرض بالقوة، فما كل رأي يُلزم به صاحبه، وما كل اختلاف يُعدّ خروجًا.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eزيد بن ثابت ومنهجه\u003c/h4\u003e\u003cp class=\"ap\"\u003eاختير زيد بن ثابت لثلاث خصال: شبابه وعقله، وأمانته التي لا تُتهم، وكتابته الوحي لرسول الله ﷺ. وهذه الخصال هي التي جعلته أهلًا لأخطر مهمة في تاريخ الأمة، فجمع بين القدرة التقنية في الكتابة والثقة الأخلاقية التي تجعل الناس يقبلون عمله بلا جدال ولا مراء.\u003c/p\u003e\u003cp class=\"ap\"\u003eومن منهجه أنه جمع بين المصدرين: المكتوب المحفوظ بين أيدي الناس، والمحفوظ في صدور الرجال، ولم يقبل رواية منفردة إلا بشهادة. وقد استمر الجمع على هذا المنهج زمنًا، حتى صار القرآن كله في صحف مرتبة محفوظة عند الخليفة، لا يضيع منه حرف، ولا يختلط فيه شيء بغيره، فكان عمله أساسًا لكل ما جاء بعده.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالصحف ومصيرها\u003c/h4\u003e\u003cp class=\"ap\"\u003eانتقلت الصحف من أبي بكر إلى عمر، وكان عمر يقرأ فيها ويعتمد عليها، ثم صارت إلى حفصة بنت عمر بعد وفاته. فكانت هذه الصحف وديعة الخلافة، يحفظها الخليفة في بيته كما يحفظ أمن الدولة، ويوصي بها من بعده، لأنها أصل الدين وأساس وحدته، فكانت أمانة لا تُترك لورثة.\u003c/p\u003e\u003cp class=\"ap\"\u003eولما أراد عثمان نسخ المصاحف أخذ هذه الصحف أساسًا لعمله، فكان جمع أبي بكر السبب المباشر في وحدة النص القرآني في الأمصار. وهكذا أثمر اجتهادُ خليفةٍ واحد حفظَ القرآن للأمة إلى آخر الدهر، فصار عملًا يُذكر له ما دام القرآن يُقرأ في المساجد والبيوت، وما دامت الأمة تتلو كتاب ربها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد حفظت هذه الصحف في بيت الخليفة لا في خزانة خاصة، لأنها ملك الأمة لا ملك الأسرة. ولذلك لما طلب عثمان الصحف من حفصة أرسلت بها إليه، فلما فرغ من نسخ المصاحف ردّها إليها، وبقيت عندها حتى ماتت، فكانت سيرة الصحف سيرة الأمانة في الأمة كلها، يتوارثها الخلفاء كما يتوارثون المسؤولية لا الميراث.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eصاحب الفكرة\u003c/b\u003e\u003cspan\u003eعمر بن الخطاب\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمنفذ\u003c/b\u003e\u003cspan\u003eزيد بن ثابت الأنصاري\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالسبب\u003c/b\u003e\u003cspan\u003eمقتل قرّاء القرآن يوم اليمامة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمصير الصحف\u003c/b\u003e\u003cspan\u003eأبو بكر ثم عمر ثم حفصة\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eمراحل جمع القرآن في عهد أبي بكر\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمرحلة\u003c/th\u003e\u003cth\u003eمن قام بها\u003c/th\u003e\u003cth\u003eما تم فيها\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالاقتراح\u003c/td\u003e\u003ctd\u003eعمر بن الخطاب\u003c/td\u003e\u003ctd\u003eخشية ذهاب القرآن بموت القرّاء\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالقرار\u003c/td\u003e\u003ctd\u003eأبو بكر الصديق\u003c/td\u003e\u003ctd\u003eمراجعة ثم اقتناع ثم أمر بالجمع\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالتنفيذ\u003c/td\u003e\u003ctd\u003eزيد بن ثابت\u003c/td\u003e\u003ctd\u003eتتبع القرآن من المكتوب والصدور\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالتوثيق\u003c/td\u003e\u003ctd\u003eزيد مع الشهود\u003c/td\u003e\u003ctd\u003eإثبات آخر التوبة بشهادة أبي خزيمة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالحفظ\u003c/td\u003e\u003ctd\u003eأبو بكر ثم عمر ثم حفصة\u003c/td\u003e\u003ctd\u003eبقاء الصحف أصلًا لنسخ عثمان\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eإنك رجل شاب عاقل لا نتهمك، وقد كنت تكتب الوحي لرسول الله ﷺ، فتتبع القرآن فاجمعه\u003c/p\u003e\u003ccite\u003eصحيح البخاري ٩/١٠، عن القضاة ص٣٥\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eبدأ جمع القرآن بفكرة عمر، ونُفّذ بأمر أبي بكر، وبتوثيق زيد بن ثابت من المكتوب والصدور. فحُفظ النص، وصارت الصحف أساسًا لوحدة المصحف في عهد عثمان.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"abubakr-futuh","n":"الفتوحات: جبهة الفرس وجبهة الروم","ic":"🗺️","part":"أبو بكر الصديق (١١–١٣هـ)","h":"\u003carticle class=\"ch3\" id=\"abubakr-futuh\" data-toc=\"الفتوحات: جبهة الفرس وجبهة الروم\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eأبو بكر الصديق (١١–١٣هـ)\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٦ من ٧\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e١\u003ci\u003e.\u003c/i\u003e٦\u003c/span\u003e\n            \u003ch3\u003e🗺️ الفتوحات: جبهة الفرس وجبهة الروم\u003c/h3\u003e\n          \u003c/div\u003e\n
