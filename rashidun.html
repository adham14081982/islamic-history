\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-4","n":"علي بن أبي طالب (٣٥–٤٠هـ)","ic":"","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-4\" style=\"--c:#8B1A3A\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🌿\u003c/div\u003e\n      \u003ch2\u003eعلي بن أبي طالب (٣٥–٤٠هـ)\u003c/h2\u003e\n      \u003cp\u003eخمس سنوات، أقصر الخلافات الراشدية وأشدها اختبارًا. بدأت بخلافةٍ مُرغَمة في زمن الفتنة، ومضت بين معركة الجمل وصفين والنهروان، وانتهت بسيفٍ مسمومٍ في صلاة الفجر. هذا القسم يتتبع عليًا من نسبه ونشأته، إلى مكانته عند النبي ﷺ، ثم تولّي الخلافة وموقفه من قتلة عثمان، وفتنته العظيمة، وأعماله في الفتوحات والحكم، ويُنهي بمؤامرة ابن ملجم واستشهاده وعام الجماعة.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#ali-nasab\"\u003eالنسب والصفات والإسلام والتضحية\u003c/a\u003e\u003ca href=\"#ali-makana\"\u003eمكانته في قومه وإيمانه\u003c/a\u003e\u003ca href=\"#ali-khilafa\"\u003eتولّي الخلافة وموقفه من قتلة عثمان\u003c/a\u003e\u003ca href=\"#ali-fitna\"\u003eالفتنة في عهده\u003c/a\u003e\u003ca href=\"#ali-futuhat\"\u003eالفتوحات ونظام الحكم\u003c/a\u003e\u003ca href=\"#ali-muamara\"\u003eالمؤامرة واستشهاده\u003c/a\u003e\u003ca href=\"#ali-jamaa\"\u003eعام الجماعة واتفاق كلمة المسلمين\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"ali-nasab","n":"النسب والصفات والإسلام والتضحية","ic":"🌿","part":"علي بن أبي طالب (٣٥–٤٠هـ)","h":"\u003carticle class=\"ch3\" id=\"ali-nasab\" data-toc=\"النسب والصفات والإسلام والتضحية\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eعلي بن أبي طالب (٣٥–٤٠هـ)\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ١ من ٧\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٤\u003ci\u003e.\u003c/i\u003e١\u003c/span\u003e\n            \u003ch3\u003e🌿 النسب والصفات والإسلام والتضحية\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eع\u003c/span\u003eلي بن أبي طالب، ابن عم النبي ﷺ وزوج ابنته فاطمة، هو الرجل الذي لم يُولد في بيتٍ ولم يُعبد صنمًا قبل الإسلام، فكان أول من صلى مع النبي ﷺ، وأول من استبسل في الإسلام، وأول من بذل نفسه فداءً له. هذا الفصل يتتبع نسبه ونشأته، صفاته الجسدية والخلقية، فضله على المسلمين، ومواقفه التي أثبتت إيمانه قبل أن يُعلن.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eعلي بن أبي طالب، واسم أبي طالب عبد مناف بن عبد المطلب بن هاشم، وهو ابن عم الرسول صلى الله عليه وسلم، وأمه فاطمة بنت أسد بن هاشم بن عبد مناف، وكنيته أبو الحسن، وهو صهر النبي صلى الله عليه وسلم بزواج ابنته فاطمة بنت السيدة خديجة رضي الله عنها. وقد نشأ علي في كنف النبي ﷺ منذ صغره، فكان أقرب الناس إليه نسبًا وتربية. وكان بيته بيت علمٍ وفضلٍ، فقد ورث عن أبيه الصدق والشجاعة، وعن أمه الحزم والكرم.\u003c/p\u003e\u003cp class=\"ap\"\u003eولُقب بأبي السبطين — يعني الحسن والحسين — ويقال إنه ولُقب بهما لأنه كان أباهما معًا. ولقبه الرسول صلى الله عليه وسلم بأبي تراب، فقد روى البخاري أن عليًا دخل على فاطمة، ثم خرج فاضطجع في المسجد، فقال النبي صلى الله عليه وسلم: أين ابن عمك؟ قالت: في المسجد، فخرج إليه، فوجد رداءه قد سقط عن ظهره وخلص التراب إلى ظهره فجعل يمسح التراب عن ظهره فيقول: إجلس يا أبا تراب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوهو أصغر من إخوته الثلاثة: جعفر وعقيل وطالب. وكان علي بن أبي طالب يعيش في كنف الرسول صلى الله عليه وسلم حيث كنفله وتولى تربيته ليخفف عن عمه شيئًا من مؤنة العيال. وكان العباس قد كفل وكفلًا ولدًا آخر لأبي طالب. فنشأ علي في بيتين: بيت عمه أبي طالب وبيت خاله النبي ﷺ، فجمع بين شرف النسب وعظمة التربية النبوية. وقد كان هذا التنوع في التربية سببًا في بلاغته وقوة حجته.\u003c/p\u003e\u003cp class=\"ap\"\u003eوحينما بُعث الرسول صلى الله عليه وسلم — كان عليّ لا يزال في حجره فدعاه إلى الإسلام فآمن به وصدقه. وكان له من العمر آنذاك عشر سنين وقيل تسع، فكان بذلك أول من أسلم من الصبيان، وأول من صلى مع النبي صلى الله عليه وسلم ركعتين، وأول من قال له النبي صلى الله عليه وسلم: يا علي أسلمت وأسلم الناس. ولم يُعبد صنمًا قط، ولم يشرب خمرًا، ولم يسجد لغير الله، فكان طاهرًا من الشرك في كل لحظة من حياته.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم زوّجه النبي ﷺ ابنته فاطمة رقية ثم أم كلثوم، ولم يتزوج غيرهما في حياة النبي ﷺ. وقال النبي ﷺ: «لو كانت عندي ثالثة لزوجتها عليًا». وهذا اللقب ليس لقب شرف عائلي فحسب، بل هو شهادة نبوية لا مجرد خبر تاريخي. وأما إسلامه فكان بدعوة أبي بكر الصديق رضي الله عنه، فقد تبع علي بن أبي طالب أثر طلحة والزبير، فعرض عليهما الإسلام فآمنا به وصدقاه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما صفاته فقد وُصف بأنه رجلٌ قصير، ضخم البطن، كثير الشعر، عظيم اللحية، واسع العينين، وكان حسن الصورة جميل الطلعة، وكانت لحيته كثيفة. وقد وُصف أيضًا بأنه كان رجلًا وسيمًا، حسن الوجه، حسن الصوت، وكان له هيبةٌ تملأ القلوب، ووقارٌ يسكن النفوس. وقد كان يمشي بين الناس فيسكنون لوقاره، ويتكلم فيسمعون لحلاوة كلامه. وقد كان النبي ﷺ يقول له: أنت مني بمنزلة هارون من موسى، إلا أنه لا نبي بعدي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما صفاته الخلقية فقد وُصف بأنه كان شديد القوى، يقول القوي، ويتفجر العلم من جوانبه، وتنطق الحكمة من نواحيه، يستوحش من الدنيا وزهرتها، ويأنس الليل ووحشته، وكان غزير العبرة، طويل الفكرة، يقلب كفه ويخاطب نفسه بعجبٍ من اللباس ما قصر، ومن الطعام ما خشن. وكان فينا كأحدنا يدنينا إذا أتيناه، ويجيبنا إذا سألناه، وينبئنا إذا استبأناه، ونحن والله مع تقريبه إيانا وقربه منّا، لا نكاد نكلمه هيبةً له، فإن تبسم فعن اللؤلؤ المنظوم يعظم أهل الدين، ويقرب المساكين ولا يطمع القوي في باطله، ولا ييأس الضعيف من عدله.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأشهد بالله لقد رأيته في بعض مواقفه — وقد أرخى الليل سدوله وغارت نجومه يميل في خرابه قابضًا على لحيته، ويبكي بكاء الحزين ويقول: يا دنيا غري غري، أإلى تعرضت؟ أم إليّ تشرفت؟ هيهات! هيهات! قد طلقتك ثلاثًا ولا رجعة فيها، فعمرك قصير، وخطرك قليل، وآه من قلة الزاد وبُعد السفر ووحشة الطريق. فيكي معاوية. وقال: رحم الله أبا الحسن، كان والله كذلك فكيف حزنك عليه يا ضرار؟ قال: حزنٌ من ذبيح وحيدها في حجرها لا ترقأ دمعتها ولا يسكن حزنها.\u003c/p\u003e\u003cp class=\"ap\"\u003eلقد رُبّي علي في بيت النبوة، وكان أسبق الناس إلى الإسلام، وقد أشرّبت روحه بتعاليمه، وشبّ على الصلاح، وقد كان فارسًا مقدامًا شجاعًا، يبارز أبطال قريش ويصرعهم، في بدرٍ وأُحد وغيرهما، كان قمة في الزهد والورع، ذا علمٍ وحكمة. وقد تضحى علي تضحيةً لم يُضحِّ بمثلها أحد، فقد نام في فراش النبي صلى الله عليه وسلم حينما هاجر، وعرض نفسه للقتل، ولكن ذلك لم يكن في حساب علي ذا قيمة ما دام أنه يشارك في تنفيذ خطة وضعها قائده من أجل هذه الدعوة.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالصفات الخلقية\u003c/h4\u003e\u003cp class=\"ap\"\u003eروى ابن مسعود عن سعد الضّبي — رضي الله عنه — فقال: كان رجلًا فوق الربعة (متوسط القامة) ضخم المكنين، طويل اللحية إذا نظرت إليه قلت هو آدم ( حنطي ) وإذا نظرت إليه من قريب قلت هو أقرب إلى السمرة. وذكر غيره في وصفه فقالوا: كان ضخم عضلة الذراع، وكان أصلع وكانت لحيته عريضة، بيضاء تملأ ما بين منكبيه.\u003c/p\u003e\u003cp class=\"ap\"\u003eخير ما نذكر في هذا الصدد وصف ضرار الصدائي عليه لمعاوية حيث قال: كان والله بعيد المدى، شديد القوى، يقول فصيلًا، ويحكم عدلًا، يتفجر العلم من جوانبه، وتنطق الحكمة من نواحيه، يستوحش من الدنيا وزهرتها، ويأنس الليل ووحشته، وكان غزير العبرة، طويل الفكرة، يقلب كفه ويخاطب نفسه بعجبٍ من اللباس ما قصر، ومن الطعام ما خشن. وكان فينا كأحدنا يدنينا إذا أتيناه، ويجيبنا إذا سألناه، وينبئنا إذا استبأناه، ونحن والله مع تقريبه إيانا وقربه منّا، لا نكاد نكلمه هيبةً له، فإن تبسم فعن اللؤلؤ المنظوم يعظم أهل الدين، ويقرب المساكين ولا يطمع القوي في باطله، ولا ييأس الضعيف من عدله.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003e\u003c/b\u003e\u003cspan\u003e\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003e\u003c/b\u003e\u003cspan\u003e\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003e\u003c/b\u003e\u003cspan\u003e\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003e\u003c/b\u003e\u003cspan\u003e\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003e\u003c/b\u003e\u003cspan\u003e\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالصلة\u003c/th\u003e\u003cth\u003eالاسم\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eأب\u003c/td\u003e\u003ctd\u003eأبو طالب عبد مناف\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eأم\u003c/td\u003e\u003ctd\u003eفاطمة بنت أسد\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eابن عم\u003c/td\u003e\u003ctd\u003eمحمد ﷺ\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eزوجة\u003c/td\u003e\u003ctd\u003eفاطمة بنت محمد ﷺ\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eلو كانت عندي ثالثة لزوجتها عليًا\u003c/p\u003e\u003ccite\u003eرواه الترمذي\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eعلي بن أبي طالب، ابن عم النبي ﷺ وزوج ابنته فاطمة، أول من أسلم من الصبيان، أول من صلى مع النبي ﷺ، فارسٌ مقدامٌ وزاهدٌ ورعٌ، وُصف بالقوة والعلم والحلم، ونام في فراش النبي ﷺ ليلة الهجرة فداءً له.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"ali-makana","n":"مكانته في قومه وإيمانه","ic":"⭐","part":"علي بن أبي طالب (٣٥–٤٠هـ)","h":"\u003carticle class=\"ch3\" id=\"ali-makana\" data-toc=\"مكانته في قومه وإيمانه\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eعلي بن أبي طالب (٣٥–٤٠هـ)\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٢ من ٧\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٤\u003ci\u003e.\u003c/i\u003e٢\u003c/span\u003e\n            \u003ch3\u003e⭐ مكانته في قومه وإيمانه\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eل\u003c/span\u003eم يكن علي مجرد ابن عمٍّ وزوج ابنة، بل كان رجلًا له مكانةٌ خاصةٌ في قلب النبي ﷺ وفي قلوب المسلمين. هذا الفصل يعرض فضائله التي أثبتها النبي ﷺ، ومكانته عند الله وعند الناس، وإيمانه الذي شهد له به الملأ الأعلى.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eفضائل علي رضي الله عنه كثيرة، ولقد كان رضي الله عنه — قريبًا من الرسول صلى الله عليه وسلم في نسبه وفي قلبه وفي كل شيء. ونحن نسوق لك من فضائله بعض ما ذكر البخاري في صحيحه. فقد قال له النبي صلى الله عليه وسلم: (أنت مني وأنا منك) وقال عمر رضي الله عنه في غزوة تبوك لتخلفه عن أصحابه فقال له النبي صلى الله عليه وسلم: (أما ترضى أن تكون مني بمنزلة هارون من موسى).\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي غزوة خيبر — حينما استعصى على المسلمين حصنان — قال رسول الله صلى الله عليه وسلم: اللهم فتحًا لا يُفتَح إلا عليه. فبات الناس يدورون فلم يفتح الله عليهم إلا علي، فأعطاه رايةً غدًا رجلًا يحب الله ورسوله، ويحبه الله ورسوله، فبات الناس يتساءلون من هو هذا الرجل، فبات الناس يتساءلون، ثم بعث النبي صلى الله عليه وسلم إلى علي رضي الله عنه، فجاء وهو يشتكي عينيه، فقال النبي صلى الله عليه وسلم: خذه بيدك فتوضأ منها، ثم ضعها على عينيك. ففعل فبُرئ، وأخذ الراية ففتح الله عليه.\u003c/p\u003e\u003cp class=\"ap\"\u003eفقال علي رضي الله عنه: قاتلتهم حتى رأيت النساء يتصايحن خلف ظهورهم، فعرفت أنهم قد هُزموا. وقال: والله لقد سمعتُ رسول الله صلى الله عليه وسلم يقول يوم خيبر: لأعطينَّ الراية غدًا رجلًا يحب الله ورسوله، ويحبه الله ورسوله، كرَّارًا غير فرَّار، لا يرجع حتى يفتح الله على يديه. فبات الناس يتساءلون من هو هذا الرجل، وظنوا أنفسهم أحق به، فلم يُفتح إلا علي. وقد كانت هذه الفضيلة من أعظم فضائله، لأنها جمعت بين حب الله ورسوله، وبين الشجاعة والبطولة.\u003c/p\u003e\u003cp class=\"ap\"\u003eومن فضائله أيضًا قول النبي صلى الله عليه وسلم: (من كنت مولاه فعلي مولاه). وهذا الحديث رواه الترمذي وابن ماجه وغيرهما، وقد اختلف العلماء في تفسيره، فمنهم من فسّره بمعنى المودة والمحبة، ومنهم من فسّره بمعنى الولاية والإمامة. والصواب أن المعنى الأول أرجح، لأن النبي صلى الله عليه وسلم قال ذلك يوم غدير خمٍّ، وكان الناس قادمين من حجة الوداع، فأراد النبي صلى الله عليه وسلم أن يُذكّر الناس بمكانة علي ويُحبّبوه إليهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما إيمانه فقد شهد له النبي صلى الله عليه وسلم بأنه أول من أسلم، وأول من صلى معه، وأول من جهاد في سبيل الله. وقال النبي صلى الله عليه وسلم: (علي مني بمنزلة هارون من موسى إلا أنه لا نبي بعدي). وهذا الحديث رواه البخاري ومسلم، وهو يُثبت مكانة علي الخاصة عند النبي صلى الله عليه وسلم، ويُبيّن أنه كان أقرب الناس إليه، وأنه كان يُشاوره في الأمور الكبرى.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد وصفه النبي صلى الله عليه وسلم بأنه (يقضي بحق الله وبحق رسوله)، وأنه (يكفي هم المؤمنين)، وأنه (باب حطة لأمتي). وكان علي رضي الله عنه يُمثل الإيمان الصادق في أصدق صوره، فقد باع نفسه لله، واشتري بها الجنة، ولم يبخل بروحه في سبيل الله ورسوله. وقد كان النبي صلى الله عليه وسلم يدعو له في صلاته، ويقول: اللهم اجعل وجهه نورًا، واجعل قبره نورًا، واجعل لقاءه نورًا.\u003c/p\u003e\n        \n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003e\u003c/b\u003e\u003cspan\u003e\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003e\u003c/b\u003e\u003cspan\u003e\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003e\u003c/b\u003e\u003cspan\u003e\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003e\u003c/b\u003e\u003cspan\u003e\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالفضيلة\u003c/th\u003e\u003cth\u003eالرواية\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eأول من أسلم من الصبيان\u003c/td\u003e\u003ctd\u003eرواه البخاري\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eذو القربى\u003c/td\u003e\u003ctd\u003eقوله ﷺ: أنت مني وأنا منك\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eفاتح خيبر\u003c/td\u003e\u003ctd\u003eرواه مسلم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eمن كنت مولاه فعلي مولاه\u003c/td\u003e\u003ctd\u003eرواه الترمذي\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eلأعطينَّ الراية غدًا رجلًا يحب الله ورسوله، ويحبه الله ورسوله\u003c/p\u003e\u003ccite\u003eرواه مسلم\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eعلي رضي الله عنه كان أقرب الناس إلى النبي ﷺ، شهد له بفضائل عديدة منها: أنت مني وأنا منك، من كنت مولاه فعلي مولاه، وبمنزلة هارون من موسى. وكان إيمانه صادقًا باع نفسه لله واشترى بها الجنة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"ali-khilafa","n":"تولّي الخلافة وموقفه من قتلة عثمان","ic":"⚔️","part":"علي بن أبي طالب (٣٥–٤٠هـ)","h":"\u003carticle class=\"ch3\" id=\"ali-khilafa\" data-toc=\"تولّي الخلافة وموقفه من قتلة عثمان\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eعلي بن أبي طالب (٣٥–٤٠هـ)\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٣ من ٧\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٤\u003ci\u003e.\u003c/i\u003e٣\u003c/span\u003e\n            \u003ch3\u003e⚔️ تولّي الخلافة وموقفه من قتلة عثمان\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eب\u003c/span\u003eعد مقتل عثمان رضي الله عنه، وجد المسلمون أنفسهم في دوامةٍ من الفتنة والاختلاف. علي رضي الله عنه لم يطلب الخلافة، بل دُفع إليها دفعًا، وكان موقفه من قتلة عثمان محكومًا بالمصلحة العامة لا بالانتقام الشخصي. هذا الفصل يتتبع بيعة علي، وموقفه من قتلة عثمان، والخلاف الذي نشأ حول ذلك.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eبعد مقتل عثمان رضي الله عنه — بقيَت المدينة أربعة أيامٍ وأميرها من المتمردين وهو الغافقي بن حرب قاتل عثمان. وكان لا بد لهم من تنصيب خليفة إلا أن الفتنة كانت أشد من أن تُحكم، فقد أجمع المتمرردون على قتل عثمان ولكنهم لم يختلفوا فيمن يخلفه. فبعد أن تدبَّر ابن سبأ أمره من تدمير وتمزيق، وجد أنه لا يستطيع أن يفعل شيئًا إلا إذا وُجد رأسٌ للدولة يقف في وجهه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوهكذا بقي المتمرردون حيارى لا يعرفون ماذا يفعلون، فالصحابة كلهم قد تبرأوا منهم، ولم يريدوا أن يتعاونوا معهم لا من قريب ولا من بعيد. وحينئذٍ يهدد المتمرردون أهل المدينة بقولهم: دونكم يا أهل المدينة فقد أجلناكم يومين، (أي من إختيار الخليفة) لتنتخبن عليًا وطلحة والزبير وأنسابًا كثيرًا. فعندها أتى المسلمون عليًا فقالوا: نبايعك. فقال: دعوني وابتغوا غيري. فقالوا: لا نُبايع غيرك. فقال: إن أبيتم إلا أن تُبايعوني فإنّي لا أبايعكم سرًا، بل في المسجد.\u003c/p\u003e\u003cp class=\"ap\"\u003eفبايعه الناس في المسجد، وكان بايعه طلحة والزبير في المسجد أيضًا. ثم طلبا من علي رضي الله عنه أن يُعطيهما ولايتين: طلحة البصرة والزبير الكوفة، فأبى علي ذلك وقال: أنتما عندي بمنزلة أبي بكر وعمر، أفأعطيكما الولايات؟ فقالا: نعم. فقال: لا، ولكن إن شئتما فكونا معي مستشارين. فقبلا ذلك. وكان هذا الموقف دليلًا على حكمة علي، فقد رفض أن يُفرّق بين الصحابة بتوزيع الولايات، واختار أن يجمعهم حوله بالمشورة. وقد أثبت هذا الموقف أن عليًا لم يكن باحثًا عن السلطة، بل كان يبحث عن مصلحة الأمة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما موقفه من قتلة عثمان فقد كان معقدًا. فقد كان علي رضي الله عنه يرى أن قتلة عثمان هم الذين أشعلوا الفتنة، وأنهم يجب أن يُحاسبوا. ولكنه كان يعلم أيضًا أن المدينة في حالة فوضى، وأن المصلحة العامة تقتضي تأجيل المحاسبة إلى أن تستقر الأمور. وقد طالب بعض الصحابة بأن يُعاقب القتلة فورًا، ولكن عليًا رأى أن ذلك سيؤدي إلى فتنةٍ أشد. وقد كان علي يقول: إنّي والله ما كنت لأدع قتلة عثمان يجولون في الأرض.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد قال علي رضي الله عنه في خطبته: إنّي والله ما كنت لأدع قتلة عثمان يجولون في الأرض، ولكنّي رأيت أنّي إن قاتلتهم الآن هلكت، وإن تركتهم هلكت أيضًا. فاخترتُ أن أُمهّد لهم حتى إذا استقرت الأمور عاقبتهم. وقد كان هذا الموقف مثار خلافٍ كبير بين المسلمين، فمنهم من رأى أن عليًا قصّر في حق عثمان، ومنهم من رأى أنه تصرّف بحكمة. فاخترتُ أن أُمهّد لهم حتى إذا استقرت الأمور عاقبتهم. وقد كان هذا الموقف مثار خلافٍ كبير بين المسلمين، فمنهم من رأى أن عليًا قصّر في حق عثمان، ومنهم من رأى أنه تصرّف بحكمة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالواقع أن موقف علي رضي الله عنه كان محكومًا بالظروف. فقد كانت المدينة في حالة انفلاتٍ أمني، والجيوش في الخارج تنتظر أوامر الخليفة الجديد. وكان علي يعلم أن أي تصرفٍ متسرعٍ سيؤدي إلى حربٍ أهليةٍ تدمّر الأمة. ففضّل التأني والحكمة على الانتقام السريع، وقد أثبت التاريخ أن هذا الموقف كان الأسلم، لأن الفتنة كانت أعمق من أن تُحلّ بالسيف وحده.\u003c/p\u003e\n        \n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003e\u003c/b\u003e\u003cspan\u003e\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003e\u003c/b\u003e\u003cspan\u003e\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003e\u003c/b\u003e\u003cspan\u003e\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالنتيجة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eمقتل عثمان\u003c/td\u003e\u003ctd\u003eفراغ الخلافة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eتهديد المتمرردين\u003c/td\u003e\u003ctd\u003eاضطرار علي للقبول\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eمطالبة طلحة والزبير\u003c/td\u003e\u003ctd\u003eرفض علي توزيع الولايات\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eإنّي والله ما كنت لأدع قتلة عثمان يجولون في الأرض\u003c/p\u003e\u003ccite\u003eرواه الطبري\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eتولّى علي الخلافة دفعًا لا طلبًا، وبايعه الناس في المسجد. وموقفه من قتلة عثمان كان محكومًا بالمصلحة العامة، ففضّل التأني والحكمة على الانتقام السريع لئلا تتفاقم الفتنة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"ali-fitna","n":"الفتنة في عهده","ic":"🔥","part":"علي بن أبي طالب (٣٥–٤٠هـ)","h":"\u003carticle class=\"ch3\" id=\"ali-fitna\" data-toc=\"الفتنة في عهده\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eعلي بن أبي طالب (٣٥–٤٠هـ)\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٤ من ٧\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٤\u003ci\u003e.\u003c/i\u003e٤\u003c/span\u003e\n            \u003ch3\u003e🔥 الفتنة في عهده\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eل\u003c/span\u003eم تكن فتنة قتل عثمان نهايةً للشقاق، بل كانت بدايةً لفتنةٍ أعمق. طلحة والزبير وعائشة خرجوا إلى البصرة، وعليّ تبعهم ليُصلح، فوقعت معركة الجمل. ثم قام معاوية في الشام بالطعن في دمه، فوقعت صفين. وفيما بعد اختلف أتباع علي أنفسهم فوقعت النهروان. هذا الفصل يسرد تفاصيل هذه الفتن ومواقف علي منها.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eلم يكن هدف المتمردين من قتل عثمان مجرد قتله، بل كان هدفهم تدمير الدولة الإسلامية من الداخل. وقد استطاعوا أن يسبقوا بخبر مقتل عثمان إلى البلاد قبل أن يصل إليها خبر تولي علي للخلافة، فأثاروا الشكوك والشبهات. وكان ابن سبأ يعمل في الخفاء لإشعال الفتنة بين المسلمين، فأرسل رسائل إلى الأمصار يدعو فيها إلى الثورة على علي، ويزعم أنه لم يُعاقب قتلة عثمان.\u003c/p\u003e\u003cp class=\"ap\"\u003eوخرج طلحة والزبير من المدينة إلى مكة، ثم إلى البصرة. وقد كان خروجهما مثار خلافٍ بين المؤرخين: فمنهم من قال إنهما خرجا للحج ثم انقلبا على علي، ومنهم من قال إنهما خرجا للثأر لعثمان. وقد لقيا عائشة في مكة فتحالفوا ضد علي، وجمعوا جندًا وانطلقوا إلى البصرة. وقد كان علي رضي الله عنه يريد الصلح، فبعث إليهم سفاراء يدعونهم إلى الرجوع، ولكنهم أبوا إلا القتال.\u003c/p\u003e\u003cp class=\"ap\"\u003eفوقعت معركة الجمل في البصرة، وكانت أول معركةٍ بين المسلمين بعد وفاة النبي ﷺ. وقد حاول علي رضي الله عنه أن يتجنب القتال حتى اللحظة الأخيرة، فأرسل إليهم يقول: دعوا القتال وعودوا إلى بيوتكم، فإنّي أنا أحقّ بثأر عثمان منكم. ولكنهم أبوا إلا الحرب. فاقتتلوا، وقُتل طلحة والزبير، وأسر عائشة. وقد كان علي رضي الله عنه يأمر بمعاملة عائشة بالإكرام، فأرسلها إلى المدينة في أربعين جارية، وأمر أن يُحرسنها حتى تصل.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم قام معاوية بن أبي سفيان في الشام، ورفض مبايعة علي رضي الله عنه. وكان معاوية يطلب بدم عثمان، ويزعم أن عليًا قد أهمل حقه. وقد أظهر معاوية مصاحفًا مُعلّقةً فيها دم عثمان، ودعا الناس إلى الثأر له. وقد كان هذا استغلالًا سياسيًا للحدث، فقد أراد معاوية أن يُحرّك عواطف الناس ضد علي، ويُبرر رفضه للمبايعة. وقد نجح في ذلك إلى حدٍّ كبير، فقد استطاع أن يُجنّد جيوش الشام ضد علي تحت شعار الثأر لعثمان. وقد كان معاوية يستغل هذه الفرصة ليُحقق طموحاته السياسية، فقد كان يطمح إلى الخلافة منذ زمنٍ بعيد. وقد أرسل علي رضي الله عنه إليه سفاراء يدعونه إلى المبايعة، ولكنه رفض.\u003c/p\u003e\u003cp class=\"ap\"\u003eفاضطر علي رضي الله عنه إلى الخروج إلى الشام، فالتقى بجيش معاوية في صفين. ودامت المعركة أيامًا، وكانت من أشرس المعارك في التاريخ الإسلامي. وقد كان علي يحارب وهو يكره القتال، ويقول: اللهم اشهد أني لم أبغِ الحرب، ولم أكن مُبادرًا إليها. وفي ليلة من الليالي، رأى علي في المنام النبي ﷺ يقول له: اصبر يا علي، فإنّك على الحق. فصبر علي وثبت. وقد قال في تلك اللحظة: اللهم اشهد أني لم أبغِ الحرب، ولم أكن مُبادرًا إليها. وكان صبره على الحق نموذجًا يُحتذى في كل العصور. وقد قال أيضًا: والله لأعطينّ الراية رجلًا يحب الله ورسوله.\u003c/p\u003e\u003cp class=\"ap\"\u003eوحينما كاد علي أن يُحقق النصر، أمر عمرو بن العاص الجيوش برفع المصاحف على الرماح، وقال: بينكم وبينا كتاب الله. فتوقف المسلمون عن القتال، واختلفوا فيما بينهم: فمنهم من قال: نقاتلهم حتى ينتهوا، ومنهم من قال: نُجيبهم إلى الحكم. وقد أراد عمرو بن العاص بذلك أن يُفرّق كلمة المسلمين، ويُضعف جبهة علي. وقد نجح في ذلك، فتوقف القتال واضطر علي إلى قبول التحكيم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان التحكيم مثار خلافٍ كبير. فقد اختار علي أبا موسى الأشعري مُحكّمًا عنه، واختار معاوية عمرو بن العاص. وقد اشترط علي أن يكون الحكم بناءً على كتاب الله وسنة رسوله ﷺ. وفي الجلسة، قال أبو موسى: نُعزل عليًا ونُعزل معاوية، ونُبايع ابن عمر. فقال عمرو: نُعزل عليًا ونُبايع معاوية. فاختلفا، ولم يُحسم الأمر. وقد كان هذا التحكيم بدايةً لانشقاقٍ جديد. فقد خرج من جيش علي جماعةٌ رفضوا التحكيم، وقالوا: لا حكم إلا لله. وكان على رأسهم عبد الله بن وهب الراسبي وحرقوص بن زهير السعدي. وقد سُمّوا الخوارج لخروجهم على الإمام الشرعي.\u003c/p\u003e\u003cp class=\"ap\"\u003eفقد خرج من جيش علي جماعةٌ رفضوا التحكيم، وقالوا: لا حكم إلا لله. وكان على رأسهم عبد الله بن وهب الراسبي وحرقوص بن زهير السعدي. وقد سُمّوا الخوارج لخروجهم على علي. وقد حاول علي أن يُقنعهم بالرجوع، فقال لهم: أنتم الذين قلتم لا حكم إلا لله، ثم لما حُكِمَ بيننا رفضتم الحكم. ولكنهم أبوا إلا القتال، فاقتتلوا في معركة النهروان، وقُتل منهم آلاف. وقد قال النبي ﷺ فيهم: يخرجون من الدين كما يخرج السهم من الرمية.\u003c/p\u003e\n        \n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003e\u003c/b\u003e\u003cspan\u003e\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003e\u003c/b\u003e\u003cspan\u003e\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003e\u003c/b\u003e\u003cspan\u003e\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003e\u003c/b\u003e\u003cspan\u003e\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003e\u003c/b\u003e\u003cspan\u003e\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمعركة\u003c/th\u003e\u003cth\u003eالخصم\u003c/th\u003e\u003cth\u003eالنتيجة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالجمل\u003c/td\u003e\u003ctd\u003eطلحة والزبير وعائشة\u003c/td\u003e\u003ctd\u003eانتصار علي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eصفين\u003c/td\u003e\u003ctd\u003eمعاوية\u003c/td\u003e\u003ctd\u003eتحكيم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالنهروان\u003c/td\u003e\u003ctd\u003eالخوارج\u003c/td\u003e\u003ctd\u003eانتصار علي\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eاللهم اشهد أني لم أبغِ الحرب، ولم أكن مُبادرًا إليها\u003c/p\u003e\u003ccite\u003eرواه البلاذري\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eفتنة عهد علي تضمنت ثلاث معارك: الجمل ضد طلحة والزبير وعائشة، وصفين ضد معاوية الذي رفع المصاحف، والنهروان ضد الخوارج الذين رفضوا التحكيم. علي حارب وهو يكره القتال، وصبر على الحق.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"ali-futuhat","n":"الفتوحات ونظام الحكم","ic":"🏛️","part":"علي بن أبي طالب (٣٥–٤٠هـ)","h":"\u003carticle class=\"ch3\" id=\"ali-futuhat\" data-toc=\"الفتوحات ونظام الحكم\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eعلي بن أبي طالب (٣٥–٤٠هـ)\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٥ من ٧\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٤\u003ci\u003e.\u003c/i\u003e٥\u003c/span\u003e\n            \u003ch3\u003e🏛️ الفتوحات ونظام الحكم\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eب\u003c/span\u003eالرغم من الفتنة، لم يتوقف علي رضي الله عنه عن العمل. فقد واصل الفتوحات في فارس ومصر، وأسس نظامًا للحكم يُعتمد على العدل والشورى. هذا الفصل يعرض جهوده في الفتح والتنظيم.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eلم يتوقف علي رضي الله عنه عن العمل رغم الفتنة. فقد واصل الفتوحات في بلاد فارس، فأرسل جيوشه إلى جبهة الفرس وجبهة الروم. وقد كان يُعطي القادة تعليمات صارمة بألا يُعتدوا على المدنيين، وألا يُخربوا البلاد. وقد فتح المسلمون في عهده مناطقً جديدةً في فارس، ووسّعوا نفوذهم في الشرق. وقد كان علي يُشجع الجنود على الجهاد، ويقول: الجهاد بابٌ من أبواب الجنة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما في مصر فقد أرسل علي رضي الله عنه جيشًا بقيادة محمد بن أبي بكر، فاستردّوا مصر من يد معاوية. وقد كان محمد بن أبي بكر صحابيًا شابًا، وكان علي يثق به. وقد نجح في استرداد مصر لفترةٍ من الزمن، ولكن معاوية أرسل عمرو بن العاص ليستردها، فهزم محمد بن أبي بكر وقتله. وقد كان هذا خسارةً كبيرةً لعلي، لأن مصر كانت مصدرًا مهمًا للغلال والضرائب. وقد أثّر فقدان مصر بشكلٍ كبيرٍ في قدرة علي على مواصلة الحرب. وقد كان هذا خسارةً كبيرةً لعلي، لأن مصر كانت مصدرًا مهمًا للغلال.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما في جبهة الروم فقد واصل المسلمون جهادهم في الشام. وقد كان علي يُرسل التعزيزات إلى جبهة الروم، ويُشجع المجاهدين على الثبات. وقد وقعت معارك عديدة بين المسلمين والروم في عهد علي، وكان المسلمون يُحققون انتصاراتٍ متتالية. وقد كان علي يُرسل إلى القادة يأمرهم بالعدل والرفق بالرعية. وقد كان يخشى على المدنيين أكثر مما يخشى على نفسه. وقد كان يقول: لا تُقاتلوا إلا من قاتلكم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما في نظام الحكم فقد أسس علي نظامًا يُعتمد على العدل والشورى. فقد كان يستشير الصحابة في الأمور الكبرى، ويأخذ برأيهم. وقد عيّن ولاةً على الأمصار، وكان يُرسل إليهم كتبًا يأمرهم فيها بالعدل. ومن أشهر كتبه كتابه إلى مالك الأشتر حينما ولاه على مصر، وهو من أروع ما كُتب في الأدب السياسي الإسلامي. وقد كان هذا الكتاب دليلًا على عمق فهمه للإدارة والعدل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي كتابه إلى مالك الأشتر، يأمره علي بأن يتخذ من نفسه بيتًا للمظلومين، وأن يُعطي كل ذي حقٍّ حقه، وألا يُفرّق بين العرب والعجم، وأن يُكرم العلماء، وأن يُحسن إلى الفقراء. وقد وصف علي في هذا الكتاب صورة المسؤول المثالي، الذي يُحاسب نفسه قبل أن يُحاسب الناس. وقد أصبح هذا الكتاب مرجعًا للحكماء في كل العصور، وما زال يُدرّس في جامعات السياسة إلى اليوم. وقد جاء فيه: ألا وإنّ أحبّ الأعمال إليك أدومها وإن قلّ. وقد أصبح هذا الكتاب مرجعًا للحكماء في كل العصور.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أسس علي أيضًا نظام بيت المال، وجعله مؤسسةً مستقلةً تُشرف على توزيع الأموال. وقد كان يُراقب بيت المال بنفسه، ويمنع أي تلاعبٍ فيه. وقد قال: بيت المال ليس لي ولا لأحدٍ من بني هاشم، بل هو للمسلمين جميعًا. وقد كان يُعطي كل ذي حقٍّ حقه، ويُساعد الفقراء والأرامل واليتامى. وقد أثبت التاريخ أن عهد علي كان من أكثر العهود عدلًا في التاريخ الإسلامي. فقد كان يُراقب بيت المال بنفسه، ويمنع أي تلاعبٍ فيه، ويُعطي كل ذي حقٍّ حقه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد اهتم علي بنشر العلم ونشر العلماء. فقد كان يجلس في المسجد يُعلم الناس الفقه والحديث، ويُجيب على أسئلتهم. وكان يقول: سلوني قبل أن تفقدوني، فإنّي أعلم بكتاب الله منكم. وقد تتلمذ على يديه كثيرٌ من التابعين، ونقلوا عنه العلم. وقد كان علي مصدرًا للحكمة والمواعظ، وقد جُمعت أقواله في كتبٍ عديدة. ومن أشهرها نهج البلاغة، الذي يضم خطبه ورسائله ومواعظه، وقد أصبح من أهم المصادر في الأدب العربي والفكر الإسلامي.\u003c/p\u003e\n        \n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003e\u003c/b\u003e\u003cspan\u003e\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003e\u003c/b\u003e\u003cspan\u003e\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003e\u003c/b\u003e\u003cspan\u003e\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003e\u003c/b\u003e\u003cspan\u003e\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003e\u003c/b\u003e\u003cspan\u003e\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمجال\u003c/th\u003e\u003cth\u003eالإنجاز\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالفتوحات\u003c/td\u003e\u003ctd\u003eفارس وجبهة الروم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالإدارة\u003c/td\u003e\u003ctd\u003eكتاب مالك الأشتر\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eبيت المال\u003c/td\u003e\u003ctd\u003eتنظيم وتوزيع عادل\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالعلم\u003c/td\u003e\u003ctd\u003eنشر الفقه والحديث\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eسلوني قبل أن تفقدوني، فإنّي أعلم بكتاب الله منكم\u003c/p\u003e\u003ccite\u003eرواه ابن أبي شيبة\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eواصل علي الفتوحات في فارس ومصر وجبهة الروم رغم الفتنة، وأسس نظام حكم يعتمد على العدل والشورى. وكتابه إلى مالك الأشتر من أروع ما كُتب في الأدب السياسي، واهتم بنشر العلم والعلماء.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"ali-muamara","n":"المؤامرة واستشهاده","ic":"🗡️","part":"علي بن أبي طالب (٣٥–٤٠هـ)","h":"\u003carticle class=\"ch3\" id=\"ali-muamara\" data-toc=\"المؤامرة واستشهاده\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eعلي بن أبي طالب (٣٥–٤٠هـ)\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٦ من ٧\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٤\u003ci\u003e.\u003c/i\u003e٦\u003c/span\u003e\n            \u003ch3\u003e🗡️ المؤامرة واستشهاده\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eك\u003c/span\u003eانت الفتنة تستعر، وكانت المؤامرة تُحاك في الخفاء. ثلاثة خوارج — ابن ملجم والبُركي والشبثي — تآمروا على قتل علي ومعاوية وعمرو بن العاص في ليلةٍ واحدة. وفي صلاة الفجر، ضرب ابن ملجم عليًا بسيفٍ مسمومٍ على رأسه، فاستشهد بعد أيام. هذا الفصل يسرد تفاصيل المؤامرة والاستشهاد.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكانت الفتنة تستعر في الأمة، وكانت الخوارج يُخططون للانتقام من علي رضي الله عنه. فقد خرج ثلاثةٌ من خوارج النهروان — وهم عبد الرحمن بن ملجم، والحجاج بن عدي التميمي المُلقب بالبُرك، وعمرو بن بكير التميمي المُلقب بالشبثي — فتآمروا على قتل ثلاثةٍ في ليلةٍ واحدة: علي بن أبي طالب، ومعاوية بن أبي سفيان، وعمرو بن العاص. وقد اتفقوا على أن يضرب ابن ملجم عليًا، ويضرب البُرك معاوية، ويضرب الشبثي عمروًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eفأما ابن ملجم فقد جاء إلى المسجد في صلاة الفجر، ونظر إلى علي رضي الله عنه وهو يسجد، فضربه بسيفٍ مسمومٍ على رأسه، فشُجَّ رأسه. وقد نادى علي وهو يسجد: بسم الله الرحمن الرحيم. وقد قال ابن عباس: رأيتُ ابن ملجم يضرب عليًا وهو ساجد، فخرج دماغه على حاجبيه. وقد أُمسك ابن ملجم وحُبس، وظلّ علي يعيش أيامًا يتألم فيها من السم. وقد كان السم قد انتشر في جسده فلم يُفلح فيه الطبيب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما البُرك فقد جاء إلى معاوية ليضربه، ولكن الله سلّمه، فإنّ البُرك ضرب معاوية ضربةً خفيفةً على فخذه، فلم يُصبه بأذىً يُذكر. وأما الشبثي فقد جاء إلى عمرو بن العاص ليضربه، فإذا عمرو قد مات قبل ذلك بيومٍ أو يومين، فضرب الشبثي الوالي الذي خلفه — وهو شرحبيل بن حسنة — فقتله. وقد كان هذا من تدبير الله، فقد سلّى معاوية وعمروًا في ليلةٍ واحدة من المؤامرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد استمر علي رضي الله عنه يعيش بعد الضربة أيامًا، وكان السم يتفاعل في جسده. وقد كان يُعالج على يد طبيب، ولكن السم كان قويًا. وقد كان علي يعلم أنه مُفارق الحياة، فبدأ يُجهز أموره. وقد دعا ابنيه الحسن والحسين، ووصّاهما بالصبر والعدل، وقال لهما: إياكما والفتنة، فإنّها تُحرق الأخضر واليابس. وقد دعا ابنيه الحسن والحسين، ووصّاهما بالصبر والعدل، وقال لهما: إياكما والفتنة، فإنّها تُحرق الأخضر واليابس. وقد أوصاهما أيضًا بأن يُحسنا إلى أهل بيته، وأن يُكملا ما بدأه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقبل وفاته بيومٍ، دعا علي رضي الله عنه ابن ملجم فقال له: يا ابن ملجم، ما رأيت مني جورًا قط؟ قال: لا. قال: فما حملك على ما صنعت؟ قال: قتلك حربُك لنا في النهروان. فقال علي: أما إنّك قاتلي. قال: نعم. قال: فإن عشت فأنا أشدّ الناس صبرًا على العقوبة، وإن متّ فأنت أشدّ الناس حسرةً على ما فاتك. ثم قال لابنيه: إذا متُّ فلا تُقيّدوه، وإن عشتم فأحسنوا إليه، وإن قتلتموه فأحسنوا قتله، ولا تُمثّلوا به. وقد كان هذا من أعظم مواقف علي رضي الله عنه، فقد عفا عن قاتله حتى في لحظات الموت.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد توفي علي بن أبي طالب رضي الله عنه في السابع عشر من رمضان سنة أربعين للهجرة، عن عمرٍ ناهز الثامنة والخمسين. وقد صُلي عليه في المسجد، ودُفن في الكوفة. وقد كان جنازته سريةً، خوفًا من أن يُفتّت خوارج قبره. وقد دُفن في مكانٍ سريٍّ لم يُعرف إلا لبعض أهل بيته، وما زال مكان قبره مجهولًا إلى اليوم. وقد أقام المسلمون له عزاءً لم يُشهد له مثيل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد نعاه الحسن بن علي رضي الله عنهما بقوله: يا أبتاه، من لمن ضعف بعدك؟ ومن لمن اهتدى بك؟ ومن لمن ساءه ظلم الظالمين؟ ومن لمن ضاقت به الدنيا؟ لقد فارقتنا ولم تُفسد فينا، ولم تُخلف فينا إلا خيرًا. وقد بكى الناس عليه بكاءً شديدًا، فقد كانوا يعلمون أنهم فقدوا رجلًا لم يُولد مثله. وقد قال الحسن: والله ما زالت الأمة تُصيبها المصائب منذ قُتل أبي، فقد كان سدًا منيعًا. وقد قال الحسن: والله ما زالت الأمة تُصيبها المصائب منذ قُتل أبي، فقد كان سدًا منيعًا.\u003c/p\u003e\n        \n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003e\u003c/b\u003e\u003cspan\u003e\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003e\u003c/b\u003e\u003cspan\u003e\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003e\u003c/b\u003e\u003cspan\u003e\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003e\u003c/b\u003e\u003cspan\u003e\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003e\u003c/b\u003e\u003cspan\u003e\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالقاتل المكلف\u003c/th\u003e\u003cth\u003eالهدف\u003c/th\u003e\u003cth\u003eالنتيجة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eابن ملجم\u003c/td\u003e\u003ctd\u003eعلي بن أبي طالب\u003c/td\u003e\u003ctd\u003eاستشهاد علي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالبُرك\u003c/td\u003e\u003ctd\u003eمعاوية\u003c/td\u003e\u003ctd\u003eإصابة خفيفة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالشبثي\u003c/td\u003e\u003ctd\u003eعمرو بن العاص\u003c/td\u003e\u003ctd\u003eمات قبلها\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eإياكما والفتنة، فإنّها تُحرق الأخضر واليابس\u003c/p\u003e\u003ccite\u003eرواه البخاري\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eتآمر ثلاثة خوارج على قتل علي ومعاوية وعمرو في ليلةٍ واحدة. ضرب ابن ملجم عليًا بسيفٍ مسمومٍ في صلاة الفجر، فاستشهد بعد أيام. وعفا عن قاتله، ودُفن سرًا في الكوفة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"ali-jamaa","n":"عام الجماعة واتفاق كلمة المسلمين","ic":"🤝","part":"علي بن أبي طالب (٣٥–٤٠هـ)","h":"\u003carticle class=\"ch3\" id=\"ali-jamaa\" data-toc=\"عام الجماعة واتفاق كلمة المسلمين\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eعلي بن أبي طالب (٣٥–٤٠هـ)\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٧ من ٧\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٤\u003ci\u003e.\u003c/i\u003e٧\u003c/span\u003e\n            \u003ch3\u003e🤝 عام الجماعة واتفاق كلمة المسلمين\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eب\u003c/span\u003eعد مقتل علي رضي الله عنه، تولّى الحسن بن علي الخلافة، ثم تنازل عنها لمعاوية في صُلحٍ أوقف الحرب الأهلية. وعُرف هذا العام بعام الجماعة، حيث اتفقت كلمة المسلمين على معاوية. هذا الفصل ينتهي بخاتمةٍ تُقيّم عهد علي وأثره في التاريخ.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eبعد مقتل علي رضي الله عنه، تولّى الحسن بن علي رضي الله عنهما الخلافة. وقد كان الحسن رجلًا حكيمًا، يعلم أن استمرار الحرب سيؤدي إلى دمار الأمة. فقد بعث إلى معاوية يدعوه إلى الصلح، واشترط شروطًا تضمن حقوق أهل البيت والمسلمين. وقد قبل معاوية هذه الشروط، وعُقد الصلح بينهما. وقد كان هذا الصلح من أعظم الأحداث في التاريخ الإسلامي. وقد أثبت الحسن أن الحكمة أعظم من الشجاعة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد تنازل الحسن عن الخلافة لمعاوية، وعُرف هذا العام بعام الجماعة. وقد كان هذا الصلح حكمةً من الحسن، فقد أوقف الحرب الأهلية التي كادت تُدمّر الأمة. وقد قال الحسن: إنّي رأيت أن أُصلح بين الناس خيرٌ من أن أُقاتلهم. وقد كان هذا القرار مثار انتقادٍ من بعض الذين أرادوا استمرار القتال، ولكن الحسن أصرّ على موقفه. وقد أثبت التاريخ صواب رأيه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان عام الجماعة بدايةً لعهدٍ جديد في التاريخ الإسلامي. فقد اتفقت كلمة المسلمين على معاوية، واستقرّت الأوضاع. وقد كان هذا الاتفاق ضروريًا لاستعادة وحدة الأمة، وإعادة بناء ما دمّرته الفتنة. وقد عمل معاوية على توحيد الأمة، وأسس دولةً أمويةً استمرت قرنًا من الزمان. وقد كان هذا التنازل ثمنًا لوقف الدماء. وقد أثبت التاريخ أن هذا الاتفاق أنقذ الأمة من التمزق.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما علي رضي الله عنه فقد ترك أثرًا عميقًا في التاريخ الإسلامي. فقد كان عهدُه رغم الفتنة من أكثر العهود عدلًا وحكمة. وقد أسس نظامًا للحكم يُعتمد على الشورى والعدل. وقد كان مصدرًا للحكمة والمواعظ، وقد جُمعت أقواله في كتبٍ عديدة. وقد كان علي رضي الله عنه مدرسةً في الفقه والتفسير والتاريخ، وما زال علماؤه يُدرّسون إلى اليوم. وقد كان إرثه العلمي من أغنى ما تركه الصحابة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان علي رضي الله عنه رجلًا فريدًا في التاريخ. فقد جمع بين الشجاعة والعلم، والزهد والسياسة، والعدل والحلم. وقد كان النبي ﷺ يُحبه ويُكرّمه، وقد شهد له الملأ الأعلى بإيمانه. وقد بذل نفسه في سبيل الله، واستشهد شهادةً أبدية. وقد ترك للأمة إرثًا علميًا وأخلاقيًا لا يُضاهى. ومن أراد أن يعرف عليًا فليقرأ نهج البلاغة. ومن أراد أن يعرف عدله فليسأل عن بيت المال في عهده.\u003c/p\u003e\u003cp class=\"ap\"\u003eولقد كان في مقتل علي رضي الله عنه درسٌ عميق للأمة. فقد أثبت أن الفتنة أشد من القتل، وأن الاختلاف يمكن أن يؤدي إلى دمارٍ لا يُحمد عقباه. وقد كان علي يحذر من الفتنة في كل خطبةٍ له، ويقول: إياكم والفتنة. وقد كان هذا التحذير نبوءةً تحققت، فقد استمرت الفتنة بعده أجيالًا. وقد كان درس علي رضي الله عنه أن العدل والحكمة هما السبيل الوحيد لحفظ الأمة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوهكذا ينتهي سردنا لعهد علي بن أبي طالب رضي الله عنه. فقد كان عهدُه قصيرًا — لم يزد على خمس سنوات — ولكنه كان حافلًا بالأحداث. وقد واجه علي تحدياتٍ لم يواجهها أحدٌ قبله، وقد تصرّف بحكمةٍ وصبر. وقد ترك للأمة إرثًا خالدًا: مصحفًا يُقرأ، وعدلًا يُتبع، وحكمةً تُدرّس. وقد كان علي رضي الله عنه خيرَ مثالٍ للخليفة الراشدي: عادلًا، زاهدًا، شجاعًا، حكيمًا.\u003c/p\u003e\n        \n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003e\u003c/b\u003e\u003cspan\u003e\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003e\u003c/b\u003e\u003cspan\u003e\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003e\u003c/b\u003e\u003cspan\u003e\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003e\u003c/b\u003e\u003cspan\u003e\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eتنازل الحسن\u003c/td\u003e\u003ctd\u003eوقف الحرب الأهلية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eمبايعة معاوية\u003c/td\u003e\u003ctd\u003eتوحيد الأمة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالدولة الأموية\u003c/td\u003e\u003ctd\u003eاستمرار قرنًا\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eإنّي رأيت أن أُصلح بين الناس خيرٌ من أن أُقاتلهم\u003c/p\u003e\u003ccite\u003eرواه البلاذري\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eتولّى الحسن الخلافة بعد علي، ثم تنازل لمعاوية في صُلحٍ أوقف الحرب وأعاد الجماعة. عهد علي كان قصيرًا حافلًا بالأحداث، وترك إرثًا خالدًا من العدل والحكمة والعلم.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"f","one":true,"id":"people","n":"أهم الشخصيات","ic":"","part":"","h":"\u003csection class=\"rsec\"\u003e\n      \u003ch2 class=\"sec\"\u003eأهم الشخصيات\u003c/h2\u003e\n      \u003cdiv class=\"people\"\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eأبو بكر بن أبي قحافة\u003c/b\u003e\u003cspan\u003eالصديق، أوّل الخلفاء الراشدين، بايعة أهل المدينة وبدأ حروب الردة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eعمر بن الخطاب\u003c/b\u003e\u003cspan\u003eالفاروق، ثاني الخلفاء، فتح الشام والعراق ومصر وجمع المصاحف سنة ١٣هـ.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eعثمان بن عفان\u003c/b\u003e\u003cspan\u003eذو النورين، ثالث الخلفاء، أتمّ الفتح نحو خراسان وسواحل البحر.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eعلي بن أبي طالب\u003c/b\u003e\u003cspan\u003eرابع الخلفاء، قاتل معاوية في صفين واشتُهد في مسجد النبي سنة ٤٠هـ.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eخالد بن الوليد\u003c/b\u003e\u003cspan\u003eسيف الله المسلول، قاد جيوش الشام وحروب الردة، وأول من كثر عليه الكلام.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eعمرو بن العاص\u003c/b\u003e\u003cspan\u003eقائد الفتح في مصر، وهو أوّل من أرسل إلى عمر تقريراً مفصلاً عن الأقاليم.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eالحسن بن علي\u003c/b\u003e\u003cspan\u003eتنازل عن الخلافة سنة ٣٩هـ، فعهدت الخلافة لمعاوية وانتهت حقبة الراشدين.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\n    \u003c/section\u003e"},{"u":"f","one":true,"id":"outcomes","n":"النتائج والآثار","ic":"","part":"","h":"\u003csection class=\"rsec\"\u003e\n      \u003ch2 class=\"sec\"\u003eالنتائج والآثار\u003c/h2\u003e\n      \u003cul class=\"outs\"\u003e\u003cli\u003eانتشرت الدولة الإسلامية من حدود المدينة إلى الشام والعراق ومصر وخراسان في نحو ثلاثين عاماً.\u003c/li\u003e\u003cli\u003eدُوّنت المصاحف الأولى في عهد أبي بكر، فصار للقرآن نصّ واحد تواترت به القراءة.\u003c/li\u003e\u003cli\u003eأقرّ عمر أهل الذمة بذمة العمرية، فبقي لأهل الكتاب نظام حماية في الدولة.\u003c/li\u003e\u003cli\u003eقُسّمت الأقاليم إلى ولايات وعُمّرت الدواوين والكُتّاب، فاكتسبت الدولة جهاز إدارة مستقراً.\u003c/li\u003e\u003cli\u003eانتهت حقبة الراشدين بانعقاد البيعة إلى بني أمية، وهو مدخل الدولة الأموية.\u003c/li\u003e\u003c/ul\u003e\n    \u003c/section\u003e"},{"u":"f","one":true,"id":"sources","n":"المصادر والمراجع","ic":"","part":"","h":"\u003cdiv class=\"src frame\" style=\"--c:#8B1A3A\"\u003e\n    \u003cspan class=\"crn tl\"\u003e\u003csvg viewBox=\"0 0 26 26\"\u003e\n\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\"/\u003e\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\" transform=\"rotate(90 13 13)\" opacity=\".5\"/\u003e\u003c/svg\u003e\u003c/span\u003e\u003cspan class=\"crn tr\"\u003e\u003csvg viewBox=\"0 0 26 26\"\u003e\n\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\"/\u003e\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\" transform=\"rotate(90 13 13)\" opacity=\".5\"/\u003e\u003c/svg\u003e\u003c/span\u003e\u003cspan class=\"crn bl\"\u003e\u003csvg viewBox=\"0 0 26 26\"\u003e\n\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\"/\u003e\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\" transform=\"rotate(90 13 13)\" opacity=\".5\"/\u003e\u003c/svg\u003e\u003c/span\u003e\u003cspan class=\"crn br\"\u003e\u003csvg viewBox=\"0 0 26 26\"\u003e\n\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\"/\u003e\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\" transform=\"rotate(90 13 13)\" opacity=\".5\"/\u003e\u003c/svg\u003e\u003c/span\u003e\n    \u003ch2 class=\"sec\" style=\"margin-top:0\"\u003eالمصادر والمراجع\u003c/h2\u003e\n    \u003cul\u003e\u003cli\u003e\u003ccite\u003eابن هشام\u003c/cite\u003e — السيرة النبوية (وفاة النبي ﷺ وبيعة أبي بكر وأخبار بيعته)\u003c/li\u003e\u003cli\u003e\u003ccite\u003eالطبري\u003c/cite\u003e — تاريخ الرسل والملوك (أخبار الخلفاء الراشدين ومعارك الفتح)\u003c/li\u003e\u003cli\u003e\u003ccite\u003eابن الأثير\u003c/cite\u003e — الكامل في التاريخ (قادة الخلفاء وفتوح الشام والعراق ومصر)\u003c/li\u003e\u003cli\u003e\u003ccite\u003eابن كثير\u003c/cite\u003e — البداية والنهاية (الراشدون والفتنة ووقائعها)\u003c/li\u003e\u003c/ul\u003e\n  \u003c/div\u003e"},{"u":"f","one":true,"id":"pager","n":"الحقب الأخرى","ic":"","part":"","h":"\u003cnav class=\"pager\"\u003e\n    \u003ca class=\"prev\" href=\"seerah.html\"\u003e\u003csmall\u003e← الحقبة السابقة\u003c/small\u003e\u003cb\u003e🌟 محطات من السيرة النبوية\u003c/b\u003e\u003c/a\u003e\n    \u003ca class=\"next\" href=\"umayyad.html\"\u003e\u003csmall\u003eالحقبة التالية →\u003c/small\u003e\u003cb\u003e🏛️ الدولة الأموية\u003c/b\u003e\u003c/a\u003e\n  \u003c/nav\u003e"}]}</script>
<script>
/* ===== موسوعة تاريخ الإسلام — منطق الواجهة + قارئ الكتاب =====
   يعمل على صفحات «الكتاب» (التي تحمل <script id="book">) وبقية الصفحات كما هي. */

/* هل هذه صفحة قارئ؟ يُحدَّد قبل أي تهيئة */
window.__READER__ = !!document.getElementById('book');

(function () {
  'use strict';
  var STORE = 'ti_bookmarks', THEME = 'ti_theme', PROG = 'ti_progress';

  /* ---------- تحويل الأرقام إلى هندية (وقت التشغيل) ---------- */
  function arDigits(s) {
    return String(s == null ? '' : s).replace(/\d/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'[d]; });
  }
  window.arDigits = arDigits;

  /* ---------- الوضع الليلي ---------- */
  function applyTheme(d) {
    document.body.classList.toggle('dark', d);
    var b = document.getElementById('themeBtn');
    if (b) b.textContent = d ? '☀️' : '🌙';
  }
  var th = document.getElementById('themeBtn');
  if (th) th.addEventListener('click', function () {
    var d = !document.body.classList.contains('dark');
    applyTheme(d); localStorage.setItem(THEME, d ? '1' : '0');
  });
  applyTheme(localStorage.getItem(THEME) === '1');

  /* ---------- التقدّم: مشترك بين التمرير والقارئ ---------- */
  function setProgress(id, frac) {
    if (!id || id === 'home') return;
    var pr = JSON.parse(localStorage.getItem(PROG) || '{}');
    if ((pr[id] || 0) < frac) { pr[id] = frac; localStorage.setItem(PROG, JSON.stringify(pr)); }
    if (frac > 0.92) {
      var bm = JSON.parse(localStorage.getItem(STORE) || '[]');
      if (bm.indexOf(id) < 0) {
        bm.push(id); localStorage.setItem(STORE, JSON.stringify(bm));
        if (window.refreshBadges) window.refreshBadges();
      }
    }
  }
  window.__setProgress = setProgress;

  var domeFill = document.querySelector('.dome .fill');
  var topBar = document.querySelector('.topbar i');
  var swordBl = document.querySelector('.sword .bl');
  var swordTx = document.querySelector('.sword span');

  function paintProgress(pct) {
    if (domeFill) domeFill.style.opacity = (0.12 + pct * 0.88).toFixed(2);
    if (topBar) topBar.style.width = Math.round(pct * 100) + '%';
    if (swordBl) swordBl.style.clipPath = 'inset(0 ' + (100 - pct * 100) + '% 0 0)';
    if (swordTx) swordTx.textContent = 'القراءة ' + arDigits(Math.round(pct * 100)) + '٪';
  }
  window.__paintProgress = paintProgress;

  /* ---------- نظام الأوسمة ---------- */
  var BADGES = [
    { id: 'start', ic: '🌱', n: 'نَبتُ الطريق', d: 'ابدأ أول حقبة' },
    { id: 'prophets', ic: '📜', n: 'وسام النبوة', d: 'أنبياء' },
    { id: 'seerah', ic: '🕊️', n: 'وسام الرحمة', d: 'السيرة' },
    { id: 'rashidun', ic: '⚔️', n: 'وسام الفاروق', d: 'الراشدون' },
    { id: 'umayyad', ic: '🏛️', n: 'وسام البناء', d: 'الأمويه' },
    { id: 'andalus', ic: '🏰', n: 'وسام الأندلس', d: 'الأندلس' },
    { id: 'abbasid', ic: '📚', n: 'وسام الفجر', d: 'العباسيه' },
    { id: 'crusades', ic: '🛡️', n: 'وسام حطين', d: 'الصليبيون' },
    { id: 'mamluk', ic: '🐎', n: 'وسام النصر', d: 'المماليك' },
    { id: 'ottoman', ic: '🕌', n: 'وسام السلطان', d: 'العثمانيون' },
    { id: 'civilization', ic: '🔬', n: 'وسام العقل', d: 'الحضاره' },
    { id: 'modern', ic: '🕰️', n: 'وسام التاريخ', d: 'العصر الحديث' },
    { id: 'all', ic: '👑', n: 'تاج المؤرخ', d: 'كل الحقب' }
  ];
  window.refreshBadges = function () {
    var bm = JSON.parse(localStorage.getItem(STORE) || '[]');
    var host = document.getElementById('badges');
    if (!host) return;
    var done = BADGES.filter(function (b) {
      return b.id === 'start' ? bm.length >= 1
        : b.id === 'all' ? bm.length >= 12 : bm.indexOf(b.id) >= 0;
    }).map(function (b) { return b.id; });
    var pct = Math.round(done.length / BADGES.length * 100);
    document.querySelectorAll('#badges .bg').forEach(function (el) {
      el.classList.toggle('on', done.indexOf(el.dataset.b) >= 0);
    });
    var c = document.getElementById('bcnt');
    if (c) c.textContent = arDigits(done.length) + ' من ' + arDigits(BADGES.length);
    var pb = document.getElementById('bprog');
    if (pb) pb.style.width = pct + '%';
  };
  window.refreshBadges();

  /* ---------- إخفاء المفضلة ---------- */
  var f = document.getElementById('favBtn');
  if (f) {
    f.textContent = JSON.parse(localStorage.getItem(STORE) || '[]')
      .indexOf(document.body.dataset.page) >= 0 ? '★' : '☆';
    f.addEventListener('click', function () {
      var id = document.body.dataset.page;
      var bm = JSON.parse(localStorage.getItem(STORE) || '[]');
      var i = bm.indexOf(id);
      i >= 0 ? bm.splice(i, 1) : bm.push(id);
      localStorage.setItem(STORE, JSON.stringify(bm));
      f.textContent = i >= 0 ? '☆' : '★';
    });
  }
})();


/* ==========================================================
   قارئ الكتاب — تقسيم المحتوى إلى صفحات بلا تمرير عمودي
   ========================================================== */
(function () {
  'use strict';
  var dataEl = document.getElementById('book');
  if (!dataEl) return;

  var BOOK;
  try { BOOK = JSON.parse(dataEl.textContent); } catch (e) { return; }

  var PGID = BOOK.id;
  var PADX = 20, PADY = 12, FOOT = 26, GAP = 12;
  var SPREAD = false;   /* وضع الكتاب المفتوح (صفحتان متقابلتان) — يُفعَّل لاحقًا */
  var R = {
    cur: 0, total: 0, pages: [], units: [], chaps: [],
    pageW: 0, pageH: 0, cw: 0, ch: 0, stageW: 0, stageH: 0,
    spread: false, fs: 1, busy: false, dir: 0, drag: null,
    rendered: {}, plan: null, index: null
  };
  window.__R = R; /* مرجع للتشخيص فقط */
  window.__go = function (n) { R.cur = Math.max(0, Math.min(n, R.total - 1)); render(); }; /* لفحص الصفحات */

  var stage, meas, measBody, leaf, leafFront, leafBack, chapEl, progEl, prevBtn, nextBtn;

  /* ---------- أدوات ---------- */
  function arD(s) { return window.arDigits(s); }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  /* ---------- ١) التهيئة ---------- */
  function setup() {
    stage = document.getElementById('rStage');
    if (!stage) return;
    leaf = document.getElementById('rLeaf');
    leafFront = document.getElementById('rFront');
    leafBack = document.getElementById('rBack');
    chapEl = document.getElementById('rBrand');
    progEl = document.getElementById('rProg');
    prevBtn = document.getElementById('rPrev');
    nextBtn = document.getElementById('rNext');

    meas = document.createElement('div');
    meas.className = 'rmeas';
    meas.innerHTML = '<div class="rbody"></div>';
    stage.appendChild(meas);
    measBody = meas.firstChild;

    R.fs = parseFloat(localStorage.getItem('ti_font') || '1') || 1;
    applyFont();

    /* القياس قبل استقرار الخطوط يعطي عدد صفحات مختلفًا في كل تحميل (٢٧٥ / ٢٧٩ / ٢٨١)،
       فنؤجّل أول ترقيم حتى تنتهي محاولة تحميل الخطوط (نجاحًا أو فشلًا). */
    var booted = false;
    function boot() {
      if (booted) return;
      booted = true;

      layout();
      buildUnits();

      var ok = loadPlan();
      if (!ok) { paginate(); savePlan(); }

      var saved = parseInt(localStorage.getItem('ti_pos_' + PGID) || '0', 10);
      R.cur = (saved > 0 && saved <= R.total) ? saved - 1 : 0;

      /* قفزة مباشرة إلى صفحة (للاختبار): seerah.html?p=12 */
      var m = /[?&#]p=(\d+)/.exec(location.href);
      if (m) { var jp = parseInt(m[1], 10); if (jp >= 1 && jp <= R.total) R.cur = jp - 1; }

      render();
      buildPanel();
      wire();
      document.body.classList.add('rready');
    }

    var fontsReady = Promise.resolve();
    if (document.fonts && document.fonts.load) {
      fontsReady = Promise.all([
        document.fonts.load('1em Amiri'),
        document.fonts.load('1em Cairo')
      ]).catch(function () { });
    }
    /* مهلة أمان: لو علِق الطلب لا نُجمّد القارئ */
    var safety = new Promise(function (res) { setTimeout(res, 2500); });
    Promise.race([fontsReady, safety]).then(function () {
      /* نفس طفيف: حتى بعد list/ready قد يحتاج المتصفح لحظة لتطبيق القياسات الجديدة */
      setTimeout(boot, 50);
    });
  }

  function applyFont() {
    document.documentElement.style.fontSize = (16 * R.fs) + 'px';
  }

  /* ---------- ٢) المقاسات ---------- */
  function layout() {
    var r = stage.getBoundingClientRect();
    R.stageW = r.width; R.stageH = r.height;
    R.spread = SPREAD && (window.innerWidth >= 820) && (window.innerWidth > window.innerHeight);
    R.pageW = R.spread ? Math.floor((R.stageW - 24 - GAP) / 2) : Math.min(R.stageW - 16, 700);
    R.pageH = Math.floor(R.stageH - 8);
    R.cw = R.pageW - PADX * 2;
    R.ch = R.pageH - PADY * 2 - FOOT;
    stage.style.setProperty('--pw', R.pageW + 'px');
    stage.style.setProperty('--ph', R.pageH + 'px');
    stage.style.setProperty('--ch', R.ch + 'px');
    meas.style.width = R.cw + 'px';
  }

  /* ---------- ٣) تحويل HTML إلى كتل ---------- */
  function buildUnits() {
    R.units = BOOK.units.map(function (u, ui) {
      var tpl = document.createElement('template');
      tpl.innerHTML = u.h;
      var root = tpl.content.firstElementChild;
      var blocks = u.one ? [root] : Array.prototype.slice.call(root.children)
        .filter(function (el) { return !(el.matches && el.matches('.crn,.orn,.porn,svg')); });
      return { ui: ui, u: u.u, id: u.id, n: u.n, ic: u.ic || '', blocks: blocks };
    });
  }

  /* ---------- ٤) القياس ---------- */
  function measureAll(nodes) {
    measBody.innerHTML = '';
    var fr = document.createDocumentFragment(), i;
    for (i = 0; i < nodes.length; i++) fr.appendChild(nodes[i].cloneNode(true));
    measBody.appendChild(fr);
    measBody.appendChild(document.createElement('div'));
    var kids = measBody.children, n = nodes.length, hs = [];
    for (i = 0; i < n; i++) hs.push(kids[i + 1].offsetTop - kids[i].offsetTop);
    measBody.innerHTML = '';
    return hs;
  }
  function measureOne(node) {
    measBody.innerHTML = '';
    measBody.appendChild(node.cloneNode(true));
    measBody.appendChild(document.createElement('div'));
    var k = measBody.children;
    var h = k[1].offsetTop - k[0].offsetTop;
    measBody.innerHTML = '';
    return h;
  }

  /* ---------- ٥) تصنيف الكتل ---------- */
  function kindOf(el) {
    if (!el) return 'other';
    var t = el.tagName;
    if (t === 'P') return 'tx';
    if (t === 'BLOCKQUOTE') return 'qt';
    if (t === 'UL' || t === 'OL') return 'ls';
    if (el.classList.contains('tblwrap')) return 'tb';
    if (el.classList.contains('kbox')) return 'kb';
    if (el.classList.contains('toc')) return 'toc';
    if (el.classList.contains('res')) return 'tx';
    if (el.classList.contains('people')) return 'ls';
    if (el.classList.contains('toclist')) return 'ls';
    if (el.querySelector && el.querySelector('.toclist,.people,ul,ol')) return 'ls';
    if (t === 'H2' || t === 'H3' || t === 'H4' || t === 'H5') return 'hd';
    return 'other';
  }

  /* الحاوية التي أبناؤها عناصر القائمة (قد تكون داخل إطار) */
  function listHost(el) {
    if (el.matches && el.matches('ul,ol,.people,.toclist')) return el;
    return (el.querySelector && el.querySelector('.toclist,.people,ul,ol')) || el;
  }
  function isHeading(el) {
    if (!el) return false;
    var t = el.tagName;
    if (t === 'H2' || t === 'H3' || t === 'H4' || t === 'H5') return true;
    if (el.classList.contains('ch3-h')) return true;
    return false;
  }

  /* مدى الكتلة القابل للتقسيم: [بداية، نهاية) */
  function rangeOf(el, kind) {
    if (kind === 'tx' || kind === 'qt') return [0, textOf(el).length];
    if (kind === 'ls') return [0, listHost(el).children.length];
    if (kind === 'toc') return [0, tocRows(el).length];
    if (kind === 'tb') return [0, el.querySelectorAll('tbody tr').length];
    if (kind === 'kb') {
      var g = el.querySelector('.kgrid3');
      return [0, g ? g.children.length : 0];
    }
    return [0, 0];
  }

  /* ---------- ٦) نصوص الكتلة ---------- */
  function textOf(el) {
    if (el.tagName === 'BLOCKQUOTE') {
      var p = el.querySelector('p');
      return p ? p.textContent : el.textContent;
    }
    return el.textContent;
  }
  function cloneWithText(el, text, keepDrop) {
    var c = el.cloneNode(true);
    var drop = c.querySelector('.drop');
    var kids = Array.prototype.slice.call(c.childNodes);
    for (var i = 0; i < kids.length; i++) {
      var k = kids[i];
      if (k.nodeType === 3) c.removeChild(k);
      else if (k.nodeType === 1 && !(keepDrop && k === drop)) c.removeChild(k);
    }
    var body = text;
    if (keepDrop && drop) body = text.slice(drop.textContent.length);
    c.appendChild(document.createTextNode(body));
    return c;
  }
  function makeText(el, a, e, keepDrop) {
    if (el.tagName === 'BLOCKQUOTE') {
      var c = el.cloneNode(true);
      var p = c.querySelector('p');
      p.textContent = el.querySelector('p').textContent.slice(a, e);
      var cite = c.querySelector('cite');
      if (cite && a > 0) cite.remove();
      return c;
    }
    return cloneWithText(el, el.textContent.slice(a, e), keepDrop);
  }
  function snapSentence(text, pos) {
    var marks = ['.', '؟', '!', '۔', '،', '؛', ':'];
    for (var i = pos; i > pos - 220 && i > 40; i--) {
      if (marks.indexOf(text[i - 1]) >= 0) return i;
    }
    return pos;
  }

  /* ---------- ٧) تقسيم الكتل ---------- */
  function splitBlock(el, kind, a, e, avail) {
    if (avail < 70) return null;
    if (kind === 'tx' || kind === 'qt') {
      var full = textOf(el);
      /* عتبة منخفضة: كان ٢٤٠/٢٠٠ حرفًا فيترك فراغًا كبيرًا في أسفل الصفحات
         حين تأتي فقرة متوسطة لا تسع كاملة. نسمح بالقسمة ما دامت البقية سطرًا معتبرًا. */
      if (e - a < 90) return null;
      var hasDrop = !!el.querySelector('.drop');
      /* تقدير نسبي ثم تصحيحان على الأكثر — أسرع بكثير من البحث الثنائي على الجوال */
      var span = e - a;
      var fullH = measureOne(el);
      if (!(fullH > avail)) return null;
      var guess = a + Math.max(60, Math.min(span - 60, Math.round(span * (avail / fullH) * 0.97)));
      var best = -1;
      for (var it = 0; it < 3; it++) {
        var h = measureOne(makeText(el, a, guess, a === 0 && hasDrop));
        if (h <= avail) {
          best = guess;
          var room = avail - h;
          if (room < 24) break;
          var step = Math.max(24, Math.round(span * room / fullH));
          if (guess + step > e - 50) break;
          guess += step;
        } else {
          var back = Math.max(24, Math.round(span * (h - avail) / fullH));
          if (guess - back <= a + 50) break;
          guess -= back;
        }
      }
      if (best < 0) return null;
      var cut = snapSentence(full, best);
      if (cut <= a || cut >= e) cut = best;
      /* لا نُبقِي ذيلًا قصيرًا جدًا (سطرًا مبتورًا) ولا رأسًا قصيرًا جدًا */
      if ((cut - a) < 70 || (e - cut) < 50) return null;
      var p1 = makeText(el, a, cut, a === 0 && hasDrop);
      var p2 = makeText(el, cut, e, false);
      return [
        { d: { k: kind === 'qt' ? 'qt' : 'tx', a: a, e: cut, dp: (a === 0 && hasDrop) ? 1 : 0 }, node: p1 },
        { d: { k: kind === 'qt' ? 'qt' : 'tx', a: cut, e: e, dp: 0 }, node: p2 }
      ];
    }
    if (kind === 'tb') return splitTable(el, a, e, avail);
    if (kind === 'ls') return splitList(el, a, e, avail);
    if (kind === 'kb') return splitKbox(el, a, e, avail);
    if (kind === 'toc') return splitToc(el, a, e, avail);
    return null;
  }

  /* جدول: يُقسَّم بالصفوف مع تكرار صف العناوين */
  function splitTable(el, a, e, avail) {
    var rows = el.querySelectorAll('tbody tr');
    if (!rows.length) return null;
    function build(r0, r1) {
      var w = el.cloneNode(true);
      var rs = w.querySelectorAll('tbody tr');
      for (var i = 0; i < rs.length; i++) {
        if (i < r0 || i >= r1) w.querySelector('tbody').removeChild(rs[i]);
      }
      if (r0 > 0) { var cap = w.querySelector('.tblcap'); if (cap) cap.remove(); }
      return w;
    }
    var lo = a + 1, hi = e - 1, best = -1;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      if (measureOne(build(a, mid)) <= avail) { best = mid; lo = mid + 1; } else hi = mid - 1;
    }
    if (best < 0 || best <= a) return null;
    return [
      { d: { k: 'tb', a: a, b: best }, node: build(a, best) },
      { d: { k: 'tb', a: best, b: e }, node: build(best, e) }
    ];
  }

  /* قائمة أو شبكة: تُقسَّم بعناصرها */
  function splitList(el, a, e, avail) {
    var host = listHost(el);
    var kids = host.children;
    if (kids.length < 3) return null;
    function build(c0, c1) {
      var c = el.cloneNode(true);
      var h = listHost(c);
      var ch = Array.prototype.slice.call(h.children);
      for (var i = 0; i < ch.length; i++) if (i < c0 || i >= c1) h.removeChild(ch[i]);
      return c;
    }
    var lo = a + 1, hi = e - 1, best = -1;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      if (measureOne(build(a, mid)) <= avail) { best = mid; lo = mid + 1; } else hi = mid - 1;
    }
    if (best < 0 || best <= a) return null;
    return [
      { d: { k: 'ls', a: a, b: best }, node: build(a, best) },
      { d: { k: 'ls', a: best, b: e }, node: build(best, e) }
    ];
  }

  /* فهرس الفصول: يُقسَّم بالصفوف، مع تكرار عنوان القسم في الصفحة التالية */
  function tocRows(el) {
    var host = listHost(el), rows = [];
    Array.prototype.slice.call(host.children).forEach(function (li) {
      var ul = (li.classList && li.classList.contains('toc-part')) ? li.querySelector('ul') : null;
      if (ul) {
        rows.push({ kind: 'p', node: li });
        Array.prototype.slice.call(ul.children).forEach(function (c) { rows.push({ kind: 'c', node: c }); });
      } else rows.push({ kind: 'c', node: li });
    });
    return rows;
  }
  function buildToc(el, a, b) {
    var rows = tocRows(el);
    var w = el.cloneNode(true);
    var host = listHost(w);
    host.innerHTML = '';
    var start = a, k;
    /* إن بدأت الصفحة بفصلٍ بعيد عن عنوان قسمه، أعد العنوان معه */
    if (start > 0 && rows[start] && rows[start].kind === 'c') {
      for (k = start - 1; k >= 0; k--) if (rows[k].kind === 'p') { start = k; break; }
    }
    var curUl = null;
    for (var i = start; i < b; i++) {
      var r = rows[i];
      if (r.kind === 'p') {
        var li = r.node.cloneNode(true);
        var ul = li.querySelector('ul');
        if (ul) ul.innerHTML = '';
        curUl = ul;
        host.appendChild(li);
      } else {
        if (!curUl) {
          curUl = document.createElement('ul');
          var holder = document.createElement('li');
          holder.className = 'toc-part toc-cont';
          holder.appendChild(curUl);
          host.appendChild(holder);
        }
        curUl.appendChild(r.node.cloneNode(true));
      }
    }
    return w;
  }
  function splitToc(el, a, e, avail) {
    var rows = tocRows(el);
    var lo = a + 1, hi = e - 1, best = -1;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      if (measureOne(buildToc(el, a, mid)) <= avail) { best = mid; lo = mid + 1; } else hi = mid - 1;
    }
    if (best < 0 || best <= a) return null;
    /* لا تترك عنوان قسم وحده في آخر الصفحة بلا فصول */
    while (best > a + 1 && rows[best - 1] && rows[best - 1].kind === 'p') best--;
    return [
      { d: { k: 'toc', a: a, b: best }, node: buildToc(el, a, best) },
      { d: { k: 'toc', a: best, b: e }, node: buildToc(el, best, e) }
    ];
  }

  /* شبكة البطاقات */
  function splitKbox(el, a, e, avail) {
    var grid = el.querySelector('.kgrid3');
    if (!grid) return null;
    var cards = grid.children;
    if (cards.length < 3) return null;
    function build(c0, c1) {
      var k = el.cloneNode(true);
      var g = k.querySelector('.kgrid3');
      var ch = Array.prototype.slice.call(g.children);
      for (var i = 0; i < ch.length; i++) if (i < c0 || i >= c1) g.removeChild(ch[i]);
      if (c0 > 0) { var t = k.querySelector('.bt'); if (t) t.remove(); }
      return k;
    }
    var lo = a + 1, hi = e - 1, best = -1;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      if (measureOne(build(a, mid)) <= avail) { best = mid; lo = mid + 1; } else hi = mid - 1;
    }
    if (best < 0 || best <= a) return null;
    return [
      { d: { k: 'kb', a: a, b: best }, node: build(a, best) },
      { d: { k: 'kb', a: best, b: e }, node: build(best, e) }
    ];
  }

  /* ---------- ٨) بناء كتلة من واصف (لاسترجاع الخطة) ---------- */
  function buildNode(u, b, d) {
    var el = R.units[u].blocks[b];
    if (d.k === 'tx' || d.k === 'qt') return makeText(el, d.a, d.e, !!d.dp);
    if (d.k === 'tb') {
      var w = el.cloneNode(true);
      var rs = w.querySelectorAll('tbody tr');
      for (var i = 0; i < rs.length; i++) if (i < d.a || i >= d.b) w.querySelector('tbody').removeChild(rs[i]);
      if (d.a > 0) { var cap = w.querySelector('.tblcap'); if (cap) cap.remove(); }
      return w;
    }
    if (d.k === 'ls') {
      var c = el.cloneNode(true);
      var h = listHost(c);
      var ch = Array.prototype.slice.call(h.children);
      for (var j = 0; j < ch.length; j++) if (j < d.a || j >= d.b) h.removeChild(ch[j]);
      return c;
    }
    if (d.k === 'kb') {
      var k = el.cloneNode(true);
      var g = k.querySelector('.kgrid3');
      if (g) {
        var gc = Array.prototype.slice.call(g.children);
        for (var q = 0; q < gc.length; q++) if (q < d.a || q >= d.b) g.removeChild(gc[q]);
      }
      if (d.a > 0) { var tt = k.querySelector('.bt'); if (tt) tt.remove(); }
      return k;
    }
    if (d.k === 'toc') return buildToc(el, d.a, d.b);
    return el;
  }

  /* ---------- ٩) الترقيم ---------- */
  function paginate() {
    var pages = [], cur = { items: [], ch: '' }, curH = 0;
    R.chaps = []; R.partPages = {};

    function flush() {
      if (cur.items.length) pages.push(cur);
      cur = { items: [], ch: cur.ch }; curH = 0;
    }
    function add(u, b, d, node) { cur.items.push({ u: u, b: b, d: d, node: node }); curH += measureOne(node); }

    for (var ui = 0; ui < R.units.length; ui++) {
      var unit = R.units[ui];
      flush();
      cur.ch = unit.n;
      if (unit.u === 'c') R.chaps.push({ id: unit.id, n: unit.n, ic: unit.ic, page: pages.length + 1 });
      if (unit.u === 'p') R.partPages[unit.id] = pages.length + 1;

      var hs = measureAll(unit.blocks);
      var q = [], i;
      for (i = 0; i < unit.blocks.length; i++) {
        var k = kindOf(unit.blocks[i]);
        var rg = rangeOf(unit.blocks[i], k);
        q.push({ b: i, orig: unit.blocks[i], node: unit.blocks[i], h: hs[i], d: null, a: rg[0], e: rg[1], kind: k });
      }
      var qi = 0;
      while (qi < q.length) {
        var it = q[qi];

        /* عنوان: لا يبقى وحيدًا في آخر صفحة */
        if (isHeading(it.node) && cur.items.length) {
          var nx = q[qi + 1];
          var nh = nx ? Math.min(nx.h, 100) : 0;
          if (curH + it.h + nh > R.ch) { flush(); cur.ch = unit.n; continue; }
        }

        if (curH + it.h <= R.ch) {
          /* it.d موجود إذا كان هذا الجزء بقية كتلة قُسِّمت: نحفظ وصفه لا 'full'
             وإلا أعاد بناءُ الخطة عند التحميل التالي الكتلةَ كاملة (تكرار النص) */
          cur.items.push({ u: ui, b: it.b, d: it.d || { k: 'full' }, node: it.node });
          curH += it.h; qi++; continue;
        }

        /* لا يسع: قسّم إن أمكن */
        if (cur.items.length) {
          var sp = splitBlock(it.orig, it.kind, it.a, it.e, R.ch - curH);
          if (sp) {
            cur.items.push({ u: ui, b: it.b, d: sp[0].d, node: sp[0].node });
            flush(); cur.ch = unit.n;
            q[qi] = { b: it.b, orig: it.orig, node: sp[1].node, h: measureOne(sp[1].node),
              d: sp[1].d, a: sp[1].d.a, e: (sp[1].d.e !== undefined ? sp[1].d.e : sp[1].d.b), kind: it.kind };
            continue;
          }
          flush(); cur.ch = unit.n; continue;
        }

        /* صفحة فارغة ولا زال لا يسع */
        var sp2 = splitBlock(it.orig, it.kind, it.a, it.e, R.ch);
        if (sp2) {
          cur.items.push({ u: ui, b: it.b, d: sp2[0].d, node: sp2[0].node });
          flush(); cur.ch = unit.n;
          q[qi] = { b: it.b, orig: it.orig, node: sp2[1].node, h: measureOne(sp2[1].node),
            d: sp2[1].d, a: sp2[1].d.a, e: (sp2[1].d.e !== undefined ? sp2[1].d.e : sp2[1].d.b), kind: it.kind };
          continue;
        }
        cur.items.push({ u: ui, b: it.b, d: { k: 'full' }, node: it.node });
        curH += it.h; qi++;
      }
    }
    flush();

    R.pages = pages;
    R.total = pages.length;
    R.plan = {
      v: 7, w: R.cw, h: R.ch, fs: R.fs, spread: R.spread,
      sig: R.units.length + ':' + R.units.reduce(function (a, u) { return a + u.blocks.length; }, 0),
      chaps: R.chaps,
      pages: pages.map(function (p) {
        return { ch: p.ch, items: p.items.map(function (it) { return { u: it.u, b: it.b, d: it.d }; }) };
      })
    };
  }

  /* ---------- ١٠) الخطة المخزَّنة ---------- */
  function planKey() { return 'ti_plan_' + PGID + '_' + R.cw + 'x' + R.ch + '_' + R.fs; }
  function loadPlan() {
    try {
      var raw = localStorage.getItem(planKey());
      if (!raw) return false;
      var pl = JSON.parse(raw);
      if (!pl || pl.v !== 7 || (pl.pages.length !== undefined && !pl.pages.length)) return false;
      /* بصمة المحتوى: إذا تغيّر عدد الوحدات أو الكتل فالخطة قديمة ولا تصلح */
      var sig = R.units.length + ':' + R.units.reduce(function (a, u) { return a + u.blocks.length; }, 0);
      if (pl.sig !== sig) return false;
      R.chaps = pl.chaps || [];
      R.pages = pl.pages.map(function (p) {
        return {
          ch: p.ch,
          items: p.items.map(function (it) {
            return { u: it.u, b: it.b, d: it.d, node: buildNode(it.u, it.b, it.d) };
          })
        };
      });
      R.total = R.pages.length;
      R.plan = pl;
      return R.total > 0;
    } catch (e) { return false; }
  }
  function savePlan() {
    if (!R.plan) return;
    try { localStorage.setItem(planKey(), JSON.stringify(R.plan)); }
    catch (e) { /* المساحة ممتلئة: تجاهل */ }
  }

  /* ---------- ١١) العرض ---------- */
  function mountPage(n) {
    if (R.rendered[n]) return R.rendered[n];
    var el = document.createElement('div');
    el.className = 'rpage';
    el.setAttribute('data-n', n);
    var body = document.createElement('div');
    body.className = 'rbody';
    var foot = document.createElement('div');
    foot.className = 'rpfoot';
    /* عزل LTR: نضع كل جزء في عنصر مستقل حتى لا يعيد bidi ترتيب «صفحة/إجمالي» */
    var fcur = document.createElement('span');
    fcur.textContent = arD(n + 1);
    var fsep = document.createElement('span');
    fsep.textContent = ' / ';
    var ftot = document.createElement('span');
    ftot.textContent = arD(R.total);
    foot.appendChild(fcur); foot.appendChild(fsep); foot.appendChild(ftot);
    el.appendChild(body); el.appendChild(foot);
    R.pages[n].items.forEach(function (it) {
      if (it.node.getAttribute) {
        it.node.setAttribute('data-u', it.u);
        it.node.setAttribute('data-b', it.b);
      }
      body.appendChild(it.node);
    });
    place(el, n);
    stage.appendChild(el);
    /* كتلة واحدة أطول من الصفحة ولا تُقسَّم (كالغلاف): اسمح بالتمرير داخلها فقط */
    if (body.scrollHeight > body.clientHeight + 4 && R.pages[n].items.length === 1) body.classList.add('rflow');
    R.rendered[n] = el;
    return el;
  }
  function place(el, n) {
    var x;
    if (R.spread) x = (n % 2 === 0) ? (R.stageW - R.pageW - 10) : 10;
    else x = Math.round((R.stageW - R.pageW) / 2);
    el.style.left = x + 'px';
    el.style.top = '4px';
    el.style.width = R.pageW + 'px';
    el.style.height = R.pageH + 'px';
  }
  function unmountAll() {
    for (var k in R.rendered) {
      var el = R.rendered[k];
      if (el && el.parentNode) el.parentNode.removeChild(el);
    }
    R.rendered = {};
  }
  /* أرقام صفحات الفهرس تُحسب وقت التشغيل */
  function fillToc() {
    var links = document.querySelectorAll('.toclist a[href^="#"]');
    if (!links.length) return;
    var map = {}, k;
    for (k in (R.partPages || {})) map[k] = R.partPages[k];
    R.chaps.forEach(function (c) { map[c.id] = c.page; });
    for (var i = 0; i < links.length; i++) {
      var id = links[i].getAttribute('href').slice(1);
      var pg = map[id];
      if (!pg) continue;
      var s = links[i].querySelector('.tpg');
      if (!s) { s = document.createElement('span'); s.className = 'tpg'; links[i].appendChild(s); }
      s.textContent = arD(pg);
    }
  }

  function refreshPanel() {
    var list = document.getElementById('rPlist');
    if (!list) return;
    list.innerHTML = '';
    R.chaps.forEach(function (c) {
      var a = document.createElement('a');
      a.className = 'rpitem';
      a.href = 'javascript:void(0)';
      a.innerHTML = '<i>' + arD(c.page) + '</i><span>' + (c.ic ? c.ic + ' ' : '') + c.n + '</span>';
      a.addEventListener('click', function () { closePanel(); goto(c.page - 1); });
      list.appendChild(a);
    });
  }

  function render() {
    unmountAll();
    var from = Math.max(0, R.cur - 2), to = Math.min(R.total - 1, R.cur + 2);
    for (var i = from; i <= to; i++) {
      var el = mountPage(i);
      el.style.visibility = (i === R.cur) ? 'visible' : 'hidden';
      el.style.zIndex = (i === R.cur) ? 3 : 1;
    }
    updateChrome();
    fillToc();
    refreshPanel();
