تصر به.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eجبهة الفرس\u003c/b\u003e\u003cspan\u003eخالد بن الوليد، محرم ١٢هـ\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eجبهة الشام\u003c/b\u003e\u003cspan\u003eأربعة جيوش بأربعة قادة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eموقع اليرموك\u003c/b\u003e\u003cspan\u003eسفوح جبال الجولان\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالشهداء\u003c/b\u003e\u003cspan\u003eنحو ثلاثة آلاف من الصحابة\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجيوش الشام الأربعة\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالجيش\u003c/th\u003e\u003cth\u003eقائده\u003c/th\u003e\u003cth\u003eوجهته\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالأول\u003c/td\u003e\u003ctd\u003eعمرو بن العاص\u003c/td\u003e\u003ctd\u003eفلسطين\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالثاني\u003c/td\u003e\u003ctd\u003eشرحبيل بن حسنة\u003c/td\u003e\u003ctd\u003eالأردن\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالثالث\u003c/td\u003e\u003ctd\u003eيزيد بن أبي سفيان\u003c/td\u003e\u003ctd\u003eالبلقاء\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالرابع\u003c/td\u003e\u003ctd\u003eأبو عبيدة عامر بن الجراح\u003c/td\u003e\u003ctd\u003eحمص\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eيا أيها الذين آمنوا قاتلوا الذين يلونكم من الكفار وليجدوا فيكم غلظة واعلموا أن الله مع المتقين\u003c/p\u003e\u003ccite\u003eسورة التوبة، الآية ١٢٣، عن القضاة ص٣٦\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eخرجت الفتوحات من منطق البلاغ قبل القتال، فسبق البيانُ السيفَ في كل جبهة. وفي أقل من سنتين فُتح العراق، وانتصر المسلمون في اليرموك، فانتقلت الدولة من الدفاع إلى الفتح.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"abubakr-wafat","n":"المرض والوفاة واستخلاف عمر","ic":"🕯️","part":"أبو بكر الصديق (١١–١٣هـ)","h":"\u003carticle class=\"ch3\" id=\"abubakr-wafat\" data-toc=\"المرض والوفاة واستخلاف عمر\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e١.٧\u003c/span\u003e\n          \u003ch3\u003e🕯️ المرض والوفاة واستخلاف عمر\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eك\u003c/span\u003eيف ودّع أبو بكر الأمة بعد سنتين وثلاثة أشهر غيّرت وجه التاريخ؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان أول مرض أبي بكر أنه اغتسل في يوم بارد فأصيب بحمّى، فلبث خمسة عشر يومًا لا يخرج إلى الصلاة، وكان يأمر عمر بن الخطاب أن يصلي بالناس. فكان هذا التقديم إشارة عملية إلى من يصلح للأمر بعده، وقد فهم الصحابة ذلك، لأن الإمامة في الصلاة كانت أعظم منصب يُقدَّم فيه الرجل في حياة النبي ﷺ، فكان تقديمه في الصلاة تقديمًا في الأمر كله عند من يفقه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان الناس يدخلون إليه يزورونه وهو في بيته، وكان عثمان بن عفان ألزمهم له في مرضه، يخرج في حوائجه ويقضي ما يحتاج إليه، ويبلغه أخبار الناس. وقد جمع أبو بكر في مرضه بين إدارة الدولة من فراشه، وبين النظر في أمر من يخلفه، فلم يترك الأمة هملاً في ساعة حرجة، ولم يغب عن أمرها حتى آخر نفس من عمره، فكان يدير ما يحتاج إلى إدارة وهو على فراش المرض، ويوصي من يثق به في كل صغيرة وكبيرة، ويوصد بابًا قد يُفتح للفتنة بعده.\u003c/p\u003e\u003cp class=\"ap\"\u003eولم يكن اختياره لعمر اختيارًا ارتجاليًا، بل كان عن مشاورة لكبار الصحابة ومراجعة لهم، لأن عمر كان أشدّ الصحابة في الحق وأقواه في الأمر، وكانت الدولة في حاجة إلى قوة تحفظ ما بُني، وكان عمر قد جُرّب في الشدة والرخاء فعُرف بالثبات والعدل. وقد لقي اختياره قبولًا من أهل الحل والعقد، فتمت البيعة لعمر بعد وفاة أبي بكر بإجماع من حضر، فلم يقع في المدينة خلاف ولا اضطراب، ولا احتاج الأمر إلى سيف ولا إلى جدال.\u003c/p\u003e\u003cp class=\"ap\"\u003eوتوفي أبو بكر رضي الله عنه مساء ليلة الثلاثاء لثمان ليالٍ بقين من جمادى الآخرة سنة ثلاث عشرة للهجرة، فكانت خلافته سنتين وثلاثة أشهر وعشر ليالٍ، وهو في الثالثة والستين من عمره على المشهور. وهذه المدة القصيرة لم تكن قصيرة في أثرها؛ فقد قضى فيها الردة، وجمع القرآن، وبدأ الفتوح الكبرى، وثبّت الدولة التي كادت تُجرف في أول يوم من أيامها، فما ترك للأمة فراغًا يُملأ بالخلاف، ولا ثغرة يدخل منها الطامع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أوصى أن تغسله زوجته أسماء بنت عميس رضي الله عنها، وكُفّن في ثوبين مستعملين وقيل ثلاثة، وصلى عليه عمر بن الخطاب، ودُفن ليلًا إلى جانب صاحبه بين المنبر وقبر رسول الله ﷺ، فجُعل رأسه محاذيًا كتفي رسول الله ﷺ. فكان في حياته ثاني اثنين في الغار، وفي مماته جارًا لصاحبه في القبر، لم يفارقه حيًّا ولا ميتًا، ولا في الشدة ولا في الرخاء.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد رثاه المسلمون بقولهم: «رحمك الله يا أبا بكر، ورضي عنك، فلقد خلفت الحبيب ﷺ فكنت خير خلف لخير سلف، وبلغت ونشرت الدعوة، وحملت الأمانة وأدّيتها وقمت بها خير قيام». وهذه الكلمات تلخص سيرته: خليفةٌ لم يبتغِ ملكًا، وأمينٌ لم يخن، وقائدٌ لم يتخلّ عن أمانة في يوم من أيامه، وقد شهد له النبي ﷺ بما لم يشهد به لأحد من أصحابه، فكان أمنّ الناس عليه في صحبته وماله.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت وفاته نهاية مرحلة التأسيس الأولى، وبداية مرحلة البناء والتوسع على يد عمر بن الخطاب، الذي حمل الأمانة بعده فوسّع الدولة، وأقام الدواوين، ووضع أسس نظام الحكم، فكان امتدادًا طبيعيًا لسيرة صاحبه. وهكذا لم ينقطع خط الراشدين بموت أحدهم، بل كان كل خليفة يكمل ما بدأه من قبله، فكانت الخلافة فيهم كالبناء يُشدّ بعضه ببعض، وكالسيل لا يتوقف عند حجر، ودرسًا في أن الأمم لا تموت بموت رجالها إذا بنت مؤسساتها.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالمرض وأيامه الأخيرة\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يكن مرض أبي بكر طويلًا، لكنه كان كافيًا لاختبار الدولة الفتية: هل تستطيع أن تعمل بلا خليفة قادر على الخروج؟ وقد أثبتت الأمة أنها تستطيع، لأن الأمر كان مؤسسة لا شخصًا، فاستمرت الصلاة والجند والعمل الإداري في أثناء مرضه، فلم يتوقف شيء من شؤون الناس.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان يخرج من بيته إلى المسجد ما استطاع، فإذا اشتد به المرض أمر عمر بالصلاة، ثم اشتدّ المرض حتى لزم الفراش، فكان الناس يزورونه ويسمعون منه التوجيه. ولم تنقطع أعمال الدولة في هذه الأيام، حتى إذا مات وجد عمر الدولة قائمة تعمل، لا تحتاج إلى تأسيس من جديد، فكان ذلك من حسن تدبيره في آخر عمره.\u003c/p\u003e\u003cp class=\"ap\"\u003eوإذا كان المرض قد منعه من الخروج، فإنه لم يمنعه من التفكير في مصير الأمة؛ فكان يجمع بين التداوي والتدبير، ويوصي أهله بما يجب عليهم، ويرى الناس في بيته كما كانوا يرونه في المسجد. فلم يكن انقطاعه عن الخروج انقطاعًا عن الأمة، وهذا هو الفرق بين من يحكم بجسده ومن يحكم بعقله وأمانته.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالاستخلاف\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان أبو بكر يرى أن ترك الأمر دون تحديد خطر على الأمة، لأن الفتنة لا تحتاج إلا إلى ساعة فراغ، فشاور أهل الرأي من الصحابة في عمر، ووجد منهم قبولًا، فعهد إليه بالأمر. وقد كان عمر أهلًا لذلك بشدته وعدله وعلمه، فما ولاّه أبو بكر إلا وهو يعلم ثقله وقدرته على حمله.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أحسن أبو بكر حين لم يجعل الأمر ميراثًا لأهل بيته، وحين لم يتركه عرضة للتنازع، بل جمع بين الشورى والحسم: شاور ثم عزم. وهذا هو المنهج الذي صار قاعدة في اختيار الخلفاء بعده، وإن اختلفت صورته من عهد إلى عهد، فالشورى أصل والحسم عند الحاجة فرعه، وما أخطأ من جمع بينهما في موضعهما.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد يُسأل: لماذا لم يولّ أبو بكر أحدًا من أهل بيته وهو يعلم أنهم من صالحي المسلمين؟ والجواب أن الخلافة عنده أمانة لا ملك، وأن الأفضلية في الإسلام ليست بالنسب بل بالتقوى والعلم، فما نظر إلى بيته ولا إلى قومه، بل نظر إلى من يصلح لحمل الأمانة، فكان اختياره لعمر اختيار مصلحة لا قرابة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالوفاة والدفن\u003c/h4\u003e\u003cp class=\"ap\"\u003eتوفي أبو بكر في مساء ليلة الثلاثاء لثمان ليالٍ بقين من جمادى الآخرة سنة ثلاث عشرة للهجرة، وكانت خلافته سنتين وثلاثة أشهر وعشر ليالٍ. وغسّلته زوجته أسماء بنت عميس، وكُفّن في ثوبين مستعملين، وصلى عليه عمر، ودُفن ليلًا بجانب رسول الله ﷺ، فكان قبره ملاصقًا لقبر من أحبه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان دفنه إلى جانب صاحبه تعبيرًا عن منزلته، كما كان في حياته رفيقه في الغار والهجرة. وبموته انطوى عهد التأسيس، وبدأ عهد التوسع والتنظيم، فبقيت سيرته مثالًا للحاكم الذي لا يملك من الدنيا شيئًا إلا كفايته، ولا يترك لأهله إلا ما يكفيهم، ولا يذكر الناس منه إلا العدل والصدق.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمدة الخلافة\u003c/b\u003e\u003cspan\u003eسنتان وثلاثة أشهر وعشر ليالٍ\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eتاريخ الوفاة\u003c/b\u003e\u003cspan\u003eجمادى الآخرة سنة ١٣هـ\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالخليفة بعده\u003c/b\u003e\u003cspan\u003eعمر بن الخطاب\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eموضع الدفن\u003c/b\u003e\u003cspan\u003eإلى جانب رسول الله ﷺ\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eحصيلة خلافة أبي بكر\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالعمل\u003c/th\u003e\u003cth\u003eالأثر المباشر\u003c/th\u003e\u003cth\u003eالأثر البعيد\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eقضاء الردة\u003c/td\u003e\u003ctd\u003eوحدة الجزيرة\u003c/td\u003e\u003ctd\u003eبقاء الزكاة ركنًا\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eجمع القرآن\u003c/td\u003e\u003ctd\u003eحفظ النص في صحف\u003c/td\u003e\u003ctd\u003eأساس مصحف عثمان\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eفتح العراق\u003c/td\u003e\u003ctd\u003eإبعاد خطر الفرس\u003c/td\u003e\u003ctd\u003eبداية الفتوح الكبرى\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eاليرموك\u003c/td\u003e\u003ctd\u003eانفتاح الشام\u003c/td\u003e\u003ctd\u003eسقوط الروم عن الشام\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eاستخلاف عمر\u003c/td\u003e\u003ctd\u003eاستقرار الأمر\u003c/td\u003e\u003ctd\u003eنموذج الشورى والحسم\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eرحمك الله يا أبا بكر، ورضي عنك، فلقد خلفت الحبيب ﷺ فكنت خير خلف لخير سلف\u003c/p\u003e\u003ccite\u003eتاريخ الطبري ٣/٤٢١–٤٢٢، عن القضاة ص٤٠\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eفي سنتين وثلاثة أشهر قضى أبو بكر الردة وجمع القرآن وبدأ الفتوح، ثم استخلف عمر ومات. فكانت خلافته القصيرة أطول أثرًا من ممالك طويلة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-2","n":"عمر بن الخطاب (١٣–٢٣هـ)","ic":"","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-2\" style=\"--c:#8B1A3A\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e⚖️\u003c/div\u003e\n      \u003ch2\u003eعمر بن الخطاب (١٣–٢٣هـ)\u003c/h2\u003e\n      \u003cp\u003eعشر سنين حوّلت دولة المدينة إلى إمبراطورية تمتد من خراسان إلى برقة، وحوّلت الخليفة إلى موظفٍ يحاسبه الناس على كل درهم. هذا القسم يتتبع عمر من نسبه وشدّته في الجاهلية، إلى إسلامه الذي أعزّ الله به المسلمين، إلى موافقته القرآن، ثم بيعته وخطبته، وفتوحه على ثلاث جبهات، ونظامه في الولاية والقضاء وبيت المال، وينتهي بخنجرٍ في المسجد أنهى حياة أعدل من حكم.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#umar-nasab\"\u003eالنسب والمولد والمكانة والإسلام\u003c/a\u003e\u003ca href=\"#umar-sifat\"\u003eصفاته وهيبتُه وشدّته في الحق\u003c/a\u003e\u003ca href=\"#umar-iman\"\u003eإيمانه وموافقة القرآن\u003c/a\u003e\u003ca href=\"#umar-khilafa\"\u003eتسلّم الخلافة وبيانها\u003c/a\u003e\u003ca href=\"#umar-futuh\"\u003eالفتوحات على ثلاث جبهات\u003c/a\u003e\u003ca href=\"#umar-nizam\"\u003eأسس نظام الحكم ونشر العلم\u003c/a\u003e\u003ca href=\"#umar-ightiyal\"\u003eاغتياله ووفاته\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"umar-nasab","n":"النسب والمولد والمكانة والإسلام","ic":"⚖️","part":"عمر بن الخطاب (١٣–٢٣هـ)","h":"\u003carticle class=\"ch3\" id=\"umar-nasab\" data-toc=\"النسب والمولد والمكانة والإسلام\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٢.١\u003c/span\u003e\n          \u003ch3\u003e⚖️ النسب والمولد والمكانة والإسلام\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eك\u003c/span\u003eيف تحوّل أشدّ أهل مكة عداءً للدعوة إلى سيف من أسيافها، وفي أي بيت نشأ الرجل الذي فرّق الله به بين الحق والباطل؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eهو عمر بن الخطاب بن نُفيل بن عبد العزى بن رياح بن عبد الله بن قُرط بن رزاح بن عدي بن كعب بن لؤي، فهو عَدَويّ قُرشيّ، يلتقي مع النبي ﷺ في كعب بن لؤي، ويجتمع مع أبي بكر في مُرّة بن كعب، فالنسبان يفترقان عند كعب ثم يعودان إلى لؤي. وأمه حنتمة بنت هاشم بن المغيرة بن عبد الله بن عمر بن مخزوم، من بني مخزوم، وهم أهل شرف ومنعة في قريش، وفي القول المشهور أنها أخت أبي جهل عمرو بن هشام، فيكون عمر ابن أخت أشد أعداء النبي ﷺ، وفي هذا عبرة في أن الهداية لا تُورَّث عن الأرحام، وأن الله يخرج من الأصل الواحد الوليَّ والعدوَّ في وقت واحد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوُلد بعد الفجار الأعظم بأربع سنين، وقيل بعد عام الفيل بثلاث عشرة سنة، وعلى القول الثاني يكون بينه وبين رسول الله ﷺ ثلاث عشرة سنة، وهو القول الذي رجّحه أكثر أهل السير. نشأ في بيتٍ ليس من أيسر بيوت قريش ولا من أفقرها، فرعى الغنم لأبيه في صباه كما رعى النبي ﷺ قبله، ثم دخل التجارة، فكان يخرج إلى أسواق العرب وأسواق الشام، ويخالط التجار وأهل الكتاب، ويسمع أخبار الأمم وأحاديث الكتب، فكان له من ذلك معرفة بأحوال الناس لا تُعطى لمن لزم بيته.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت إليه السفارة في الجاهلية، فإذا وقعت بين قريش وغيرها حرب أو مفاخرة أو مطالبة بدية، بعثوه سفيرًا يتكلم باسمهم ويرجع بالجواب، فكانت قريش تعترف له بسلامة الرأي وقوة العارضة، وهي مكانة لا تنال إلا لمن جمع بين النسب والحكمة. وكان مع ذلك شديدًا على من خالف دين قومه، عزيزًا في نفسه، لا يقبل ضيمًا، فلما ظهر الإسلام كان من أشد الناس عليه، لا عن جهل بحقيقة الدعوة، بل عن دفاع عن مكانة قومه وعن دين آبائه، وهو دفاع يفسّر عنف موقفه الأول.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم جعل الله له في بيت أخته فاطمة بنت الخطاب مفتاحًا للهداية؛ فقد أسلمت فاطمة وزوجها سعيد بن زيد بن عمرو بن نفيل، وكان سعيد قد أسلم قبل ذلك، وأخفيا إسلامهما عن عمر خوفًا من شدة بأسه. وكان خباب بن الأرت يختلف إليهما يقرئهما القرآن، فسمع عمر يومًا صوت قراءة في البيت وهو مقبل، فلما دخل سألهما عما سمع، فأنكرا، فقال: «قد علمت أنكما قد صبوتما»، ثم بطش بزوج أخته سعيد بن زيد، فقامت إليه أخته فاطمة تدفعه عن زوجها فشجّها، فلما رأى الدم على وجهها سكن غضبه وندم على ما فعل، وطلب الصحيفة ليقرأها.\u003c/p\u003e\u003cp class=\"ap\"\u003eفأبت أخته أن تعطيه الصحيفة حتى يغتسل، فاغتسل ثم أخذها فقرأ، وكان كاتبًا قارئًا، فلما قرأ صدر سورة طه قال: «ما أحسن هذا الكلام وأكرمه»، وكان خباب قد خرج من مخبئه فقال له: «يا عمر، والله إني لأرجو أن يكون الله قد خصّك بدعوة نبيه ﷺ، فإني سمعته أمس يقول: اللهم أعزّ الإسلام بأبي الحكم بن هشام أو بعمر بن الخطاب»، فقال عمر: «فدلّني يا خباب على محمد». فخرج به حتى وقف على باب دار الأرقم، وكان النبي ﷺ فيها مع أصحابه.\u003c/p\u003e\u003cp class=\"ap\"\u003eفلما رآه النبي ﷺ مقبلًا قال: «ما جاء بك يا ابن الخطاب؟» فقال: «جئتك لأؤمن بالله ورسوله»، فكبّر رسول الله ﷺ وكبّر المسلمون معه حتى ارتجّ البيت تكبيرًا، ثم دعاه النبي ﷺ إلى الإسلام وقرأ عليه القرآن فأسلم في الحال. وروى البخاري عن عبد الله بن مسعود رضي الله عنه أنه قال: «ما زلنا أعزّة منذ أسلم عمر»، وقال: «لقد رأيتنا وما نستطيع أن نطوف بالبيت حتى أسلم عمر، فلما أسلم عمر قاتلهم حتى تركونا». فكان إسلامه فتحًا، وكانت شوكته التي كانت على المسلمين صارت لهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما هجرته فكانت علنية على غير عادة المهاجرين؛ فقد روى أهل السير أنه خرج متوشحًا سيفه، فطاف بالبيت سبعًا، ثم أتى المقام فصلى، ثم وقف على أندية قريش فقال: «من أراد أن تثكله أمه، أو يُيتم ولده، أو تُرمل زوجته، فليلقني وراء هذا الوادي». فلم يتبعه أحد، وخرج وحده إلى المدينة، فكان أول من أعلن هجرته وأذلّ قريشًا بذلك، وقد قال النبي ﷺ فيه: «إن الله جعل الحق على لسان عمر وقلبه، وهو الفاروق فرّق الله به بين الحق والباطل».\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالفاروق: اللقب ومعناه\u003c/h4\u003e\u003cp class=\"ap\"\u003eالفاروق لقب غلب على عمر حتى صار علمًا عليه، ومعناه الفاصل بين الحق والباطل، وقد ورد في الحديث عن النبي ﷺ: «إن الله جعل الحق على لسان عمر وقلبه، وهو الفاروق فرّق الله به بين الحق والباطل». والتفريق هنا ليس تفريقًا بالكلام والجدال، بل تفريقًا بالسلوك والمواقف؛ فمنذ أسلم صار خطًّا فاصلًا في مكة بين من يستضعف المؤمنين ومن يحتمي بهم، وصار في المدينة فصلًا في الرأي يُميّز به الحق من الهوى.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد تنازع أهل العلم فيمن لقّبه بهذا اللقب؛ فمنهم من قال لقّبه النبي ﷺ، ومنهم من قال لقّبه أهل الكتاب لأنه كان يفارقهم في الحق، ومنهم من قال لقّبه المسلمون لما رأوا من فرقانه بين الحق والباطل في الفتنة. والأقوال لا تتناقض في الجوهر، فالمعنى واحد في كل منها: رجلٌ صار وجوده حدًّا يفصل بين أمرين، ولذلك استحق أن يكون ثاني الخلفاء وأن يكون ميزانًا يُقاس به غيره في العدل والشدة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eبيت أخته: الطريق إلى الهداية\u003c/h4\u003e\u003cp class=\"ap\"\u003eمن أعجب ما في قصة إسلام عمر أن الله جعل سبب هدايته أقرب الناس إليه؛ أخته التي دفعته عنها فشجّها، وزوجها الذي ضربه، والغريب المستضعف الذي كان يقرئهما. فقد اجتمع في بيت صغير من بيوت مكة ثلاثةٌ من المستضعفين: امرأة، ورجل من بني زيد، وخباب بن الأرت الذي كان يُعذَّب في رمضاء مكة، فكانوا أخطر على مكة من جيوش، لأنهم كانوا يحفظون كلام الله في صدورهم ويقرؤونه سرًّا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي هذا البيت ظهر الفرق بين القوة التي تُخيف والقوة التي تُقنع؛ فلما قرأ عمر الصحيفة لم يغلبه الجدال ولا الخوف، بل غلبه حسن الكلام، فقال كلمة تُكتب في تاريخ الدعوة: «ما أحسن هذا الكلام وأكرمه». ثم انتقل من الإعجاب بالكلام إلى السؤال عن صاحبه، ومن السؤال إلى الإيمان، فكانت رحلته في ساعة واحدة أطول من رحلة كثير من الناس في أعمارهم.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eمن الشدة إلى العزة\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يكن إسلام عمر تغيرًا في طبعه، بل تحويلًا لطاقته إلى وجهتها الصحيحة؛ فالشدة التي كان يخيف بها المسلمين صارت تخيف أعداءهم، والحمية التي كانت لدين الآباء صارت لله ورسوله، ولذلك لم يصر مسالمًا هادئًا بعد إسلامه، بل صار أشد في الحق وأصلب في الدفاع عن الدين، لكن شدة موجّهة بالعلم لا بالهوى، ومحكومة بالشرع لا بالغضب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أدرك النبي ﷺ هذه القيمة في شخصه فدعا له قبل إسلامه، وقال فيه ما لم يقله في كثير من السابقين، وأخبر أن الإسلام أعزّ بإسلامه، وهي شهادة تُبيّن أن الله يختار لدينه من يشاء من عباده، وأن الرجال قد يُستعملون في مواضع لم يكن أحد يتوقعها، وأن الظن بالناس قد يخيب في الاتجاهين: فقد كان المسلمون يخافون عمر، فصاروا يأمنون به.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالنسب\u003c/b\u003e\u003cspan\u003eعدوي قرشي، يجتمع مع النبي ﷺ في كعب بن لؤي\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأمه\u003c/b\u003e\u003cspan\u003eحنتمة بنت هاشم المخزومية، وقيل أخت أبي جهل\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسنه\u003c/b\u003e\u003cspan\u003eأصغر من النبي ﷺ بثلاث عشرة سنة على المشهور\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمكانته في الجاهلية\u003c/b\u003e\u003cspan\u003eسفير قريش في الحروب والمفاخرات\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eاللقب\u003c/b\u003e\u003cspan\u003eالفاروق، فرّق الله به بين الحق والباطل\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eمحطات في طريق إسلام عمر\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمحطة\u003c/th\u003e\u003cth\u003eما جرى فيها\u003c/th\u003e\u003cth\u003eدلالتها\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eبيت أخته فاطمة\u003c/td\u003e\u003ctd\u003eسمع القرآن فسأل عنه وأنكر أهله\u003c/td\u003e\u003ctd\u003eالقرآن أول ما يهزّ القلب السليم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالصحيفة\u003c/td\u003e\u003ctd\u003eقرأ صدر سورة طه فقال: ما أحسن هذا الكلام\u003c/td\u003e\u003ctd\u003eالبيان الحسن يفتح ما لا يفتحه السيف\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eدعاء النبي ﷺ\u003c/td\u003e\u003ctd\u003eاللهم أعز الإسلام بعمر بن الخطاب\u003c/td\u003e\u003ctd\u003eإسلامه كان إجابة دعاء\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eدار الأرقم\u003c/td\u003e\u003ctd\u003eأسلم وكبّر المسلمون حتى ارتجّ البيت\u003c/td\u003e\u003ctd\u003eإسلامه فتح للمسلمين باب العزة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالهجرة\u003c/td\u003e\u003ctd\u003eخرج متوشحًا سيفه وأعلنها في الأندية\u003c/td\u003e\u003ctd\u003eشجاعته صارت في خدمة الدين\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eما زلنا أعزّة منذ أسلم عمر، ولقد رأيتنا وما نستطيع أن نطوف بالبيت حتى أسلم عمر، فلما أسلم عمر قاتلهم حتى تركونا\u003c/p\u003e\u003ccite\u003eصحيح البخاري ٧/١٧٧، عن القضاة ص٤٦\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eخرج عمر من بيتٍ شريف في قريش، وكان سفيرها وأشدّها على المسلمين، ثم اهتدى في بيت أخته بقراءة سورة طه، فصار إسلامه فتحًا و عزًّا لأصحاب النبي ﷺ، وهجرته إعلانًا لم يستطع أحد أن يواجهه.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"umar-sifat","n":"صفاته وهيبتُه وشدّته في الحق","ic":"🛡️","part":"عمر بن الخطاب (١٣–٢٣هـ)","h":"\u003carticle class=\"ch3\" id=\"umar-sifat\" data-toc=\"صفاته وهيبتُه وشدّته في الحق\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٢.٢\u003c/span\u003e\n          \u003ch3\u003e🛡️ صفاته وهيبتُه وشدّته في الحق\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eب\u003c/span\u003eأي صورةٍ كان يبدو عمر في عيون الناس، وكيف صارت هيبته حديثًا في المدينة كما كانت في مكة؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eوصفه ابنه عبد الله رضي الله عنهما فقال: رجل أبيض تعلوه حمرة، أصلع، أشيب، شديد الطول، ضخم الجثة، يبدو من بين الناس كأنه راكب لكثرة طوله، وكان أعسرَ يستعمل يده اليسرى، جهوريَّ الصوت. وهذه الصورة تجمع بين الطول والصلابة وجهارة الصوت، وهي صفات تجعل الرجل مهيبًا في المجلس قبل أن يتكلم، فإذا تكلم ازدادت هيبته لأن صوته يملأ المكان ولا يحتاج إلى رفع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما صفاته الخُلقية فهي التي جعلته قمة في الخُلق كما قال ابن عمر: «رحم الله عمر، فقد كان قمة في الخلق، كيف لا وقد كان من أحبّ من ربّاهم رسول الله ﷺ في مَحضن النبوة وعلى منهج الإسلام وتحت رقابة الوحي». ولا يسهل أن يُكتب عن أخلاق عمر في سطور، لأنها مجموعة متكاملة: فقد كان شديدًا في الحق، ذكيًّا ثاقب الرأي، متحمسًا لدينه، وفيًّا لنبيه، شديد الهيبة، كثير الورع، شديد التأثر بالقرآن، وافر العدل، يحاسب نفسه قبل أن يحاسب رعيته.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت هيبته أمرًا مشهودًا حتى قال النبي ﷺ: «والذي نفسي بيده ما لقيك الشيطان سالكًا فجًّا إلا سلك فجًّا غير فجّك»، وهي شهادة أن هيبته لم تكن هيبة جاه أو سلطان، بل هيبة رجلٍ استقام فخافه الشيطان قبل الناس. وحدّث محمد بن سعد بن أبي وقاص عن أبيه أن عمر استأذن على رسول الله ﷺ وعنده نسوة من قريش يستكثرنه أصواتهن على صوته، فلما استأذن عمر بادرن الحجاب، فأذن له رسول الله ﷺ فدخل ورسول الله ﷺ يضحك، فقال: «أضحك الله سنك يا رسول الله»، فقال النبي ﷺ: «عجبت من هؤلاء اللاتي كنّ عندي، فلما سمعن صوتك ابتدرن الحجاب»، فقال عمر: «فأنت أحق أن يهبنك يا رسول الله»، ثم قال: «يا عدوّات أنفسهن، أتهبنني ولا تهبن رسول الله ﷺ؟»\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما شدته في الحق فلها في السيرة مواقف تُعدّ من أدق ما عُرف عن الصحابة؛ منها موقفه في غزوة بني المصطلق حين حاول رأس المنافقين عبد الله بن أُبيّ بن سلول أن يوقع فتنة بين المسلمين، فلما رجعوا إلى المدينة قال عمر: «يا رسول الله، دعني أضرب عنق هذا المنافق»، فقال رسول الله ﷺ: «دعه، لا يتحدث الناس أن محمدًا يقتل أصحابه». فكان رأي عمر رأي الحسم، ورأي النبي ﷺ رأي الحكمة التي تنظر إلى ما بعد الحادثة، وكلاهما في موضعه.\u003c/p\u003e\u003cp class=\"ap\"\u003eومنها موقفه يوم أخطأ حاطب بن أبي بلتعة حين كتب إلى قريش يخبرهم بمسير النبي ﷺ، فلما قرأ النبي ﷺ الكتاب سأله، فبرّر فعله بأنه أراد أن تكون له يد عند قريش تحمي أهله وماله، فقال عمر: «دعني يا رسول الله أضرب عنق هذا المنافق»، فقال له النبي ﷺ: «إنه شهد بدرًا»، وفي رواية: «وما يدريك لعل الله اطّلع على أهل بدر فقال: اعملوا ما شئتم». فكان عمر ينظر إلى الفعل في ذاته، والنبي ﷺ ينظر إلى السابقة والنية، فرُدّت شدته إلى أصلٍ أعلى منها.\u003c/p\u003e\u003cp class=\"ap\"\u003eومنها موقفه يوم الحديبية؛ فقد رأى أن المسلمين على حق وأن المشركين منعوهم، فجاء إلى النبي ﷺ فقال: «يا رسول الله، ألسنا على الحق وهم على الباطل؟» قال: «بلى»، قال: «فعلام نعطي الدنية في ديننا؟» فقال النبي ﷺ: «إني رسول الله ولن يضيعني الله أبدًا»، فمضى عمر إلى أبي بكر فقال له أبو بكر ما قال له النبي ﷺ، فسكن. وقد رجع عمر بعد ذلك فكان يقول: «ما زلت أصوم وأتصدق وأعتق مخافة كلامي الذي تكلمت به».\u003c/p\u003e\u003cp class=\"ap\"\u003eويروى أن رجلين اختصما — منافق ويهودي — فطلب اليهودي أن يُقضى بينهما النبي ﷺ، وطلب المنافق أن يُقضى بينهما كعب بن الأشرف أو عمر، فذهبا إلى عمر فسألهما، فأخبراه، فقتل عمر المنافق وقال: «هذا قضاء من لم يقبل بقضاء رسول الله ﷺ». وهذه الحادثة تُظهر أن شدته كانت في موضعها حين كان الخصم يريد التحاكم إلى غير الشرع، وأن الغضب لله ليس غضبًا للنفس، وأن الحدّ يُقام حيث يجب لا حيث يشتهي الحاكم.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eصورته كما وصفها ابنه\u003c/h4\u003e\u003cp class=\"ap\"\u003eالصورة التي رسمها عبد الله بن عمر لأبيه صورة رجل ضخم طويل أصلع أشيب، أحمر الوجه، أعسر اليد، جهوري الصوت، وهي صورة تُخالف ما يتصوره الناس عن الزهاد؛ فليس نحيفًا ضعيفًا، بل قويَّ البنية صلبَ العود، وكانت قوته الجسدية ظاهرة في مشيه وسرعته وفي حمله للقربة على ظهره وفي مصارعته.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت هذه الصورة الجسدية من أسباب هيبته، لكنها لم تكن سببها الوحيد؛ فكثير من الناس يكونون أشداء الأجسام ولا يهابهم أحد، وإنما الهيبة ثمرة استقامة الظاهر والباطن معًا، فإذا اجتمع في الرجل قوة الجسم وقوة الحق وقوة السلطان، صار في القلوب موضعًا لا يُطاول.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eهيبته في المجلس\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت هيبته حاضرة في كل مجلس؛ في مجلس النبي ﷺ حين سمع صوته نساء قريش فابتدرن الحجاب، وفي المسجد حين يدخل فيسكن الناس، وفي السوق حين يمرّ فيقوم الناس له، وفي بيته حين يدخل على أهله فيجدهم على غير ما يحب فيعاتبهم عتابًا لا يجرح كرامتهم. وكان النبي ﷺ يضحك لهذا الهيبة ويعرف أنها من الله لا من تكلف العبد.\u003c/p\u003e\u003cp class=\"ap\"\u003eولم تكن هيبته مانعة من الرحمة؛ فقد كان يبكي في الصلاة حتى يُسمع نشيجه، وكان يمرّ بالصبيان فيسلّم عليهم، وكان يجلس مع الفقراء ويأكل معهم، وكان يعطف على الأرملة والمسكين، فكانت هيبته في المجلس ورقّته في الخلوة، وهذا الجمع هو ما جعل الناس يحبونه ويهابونه في وقت واحد، وهو أعجب ما في شخصيته.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eشدّته في الحق لا في الهوى\u003c/h4\u003e\u003cp class=\"ap\"\u003eالفرق بين الشدة المحمودة والشدة المذمومة أن الأولى تقع في موضع الحق فتنتهي بانتهائه، والثانية تقع في موضع الهوى فلا تنتهي إلا بغرض صاحبها. وقد كان عمر في المواقف الثلاثة — ابن سلول وحاطب والحديبية — يُراجع النبي ﷺ في العلن، فإذا بيّن له النبي ﷺ وجه الحق رجع وسلم، ولم يبقَ في قلبه أثر من مخالفة، وهذا هو الفرق بين المناقشة والمنازعة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد شهد له النبي ﷺ بأن الحق على لسانه وقلبه، وهي شهادة لا تعني أن كل رأي له صواب، بل تعني أن قصده الحق، وأن اجتهاده في طلب الحق مأمون، وأنه إذا أخطأ لم يخطئ في الاتجاه بل في الطريق، وهذا أقل ما يقال في رجلٍ كان يُراجع فيُقبل ويُعاتب فيعتذر، ويسأل عن حكم الله في كل صغيرة قبل أن يُسأل عنه غيره.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eصورته\u003c/b\u003e\u003cspan\u003eطويل، أصلع، أشيب، أحمر، ضخم الجثة، أعسر، جهوري الصوت\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eهيبته\u003c/b\u003e\u003cspan\u003eقال النبي ﷺ: ما لقيك الشيطان فجًّا إلا سلك فجًّا غير فجّك\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأبرز أخلاقه\u003c/b\u003e\u003cspan\u003eشدة في الحق، ورع، عدل، محاسبة للنفس\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eموقفه مع المنافقين\u003c/b\u003e\u003cspan\u003eطلب قتل ابن سلول وحاطب، فردّه النبي ﷺ إلى الحكمة\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eثلاثة مواقف لشدّة عمر وردّ النبي ﷺ عليها\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالموقف\u003c/th\u003e\u003cth\u003eرأي عمر\u003c/th\u003e\u003cth\u003eتوجيه النبي ﷺ\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eعبد الله بن أُبيّ\u003c/td\u003e\u003ctd\u003eاضرب عنقه يا رسول الله\u003c/td\u003e\u003ctd\u003eدعه، لا يتحدث الناس أن محمدًا يقتل أصحابه\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eحاطب بن أبي بلتعة\u003c/td\u003e\u003ctd\u003eدعني أضرب عنق هذا المنافق\u003c/td\u003e\u003ctd\u003eإنه شهد بدرًا، فلعله اطّلع الله على أهل بدر فقال اعملوا ما شئتم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالحديبية\u003c/td\u003e\u003ctd\u003eعلام نعطي الدنية في ديننا\u003c/td\u003e\u003ctd\u003eإني رسول الله ولن يضيعني الله أبدًا\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eوالذي نفسي بيده ما لقيك الشيطان سالكًا فجًّا إلا سلك فجًّا غير فجّك\u003c/p\u003e\u003ccite\u003eصحيح البخاري ٧/٤١، عن القضاة ص٤٩\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eجمع عمر بين صورة مهيبة وخلق أشدّ، فكانت هيبته من استقامته لا من منصبه، وكانت شدته في الحق تُراجع فترجع، ولذلك شهد له النبي ﷺ أن الحق على لسانه وقلبه.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"umar-iman","n":"إيمانه وموافقة القرآن","ic":"📖","part":"عمر بن الخطاب (١٣–٢٣هـ)","h":"\u003carticle class=\"ch3\" id=\"umar-iman\" data-toc=\"إيمانه وموافقة القرآن\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٢.٣\u003c/span\u003e\n          \u003ch3\u003e📖 إيمانه وموافقة القرآن\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eم\u003c/span\u003eا معنى أن يوافق القرآنُ رأيَ رجل، وكيف صار قلب عمر ميزانًا تنزل الآيات على ما فيه؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان إيمان عمر من الطراز الذي يُرى أثره في الجسد قبل اللسان؛ فقد روى أهل السير أنه كان يقوم من الليل فيقرأ في المصحف، فإذا مرّ بآية فيها ذكر النار بكى حتى يبلّ ثوبه، وإذا مرّ بآية رحمة سكن واطمأن. وذكروا أنه كان يمرّ بالآية من كتاب الله فيُغشى عليه، فيُحمل إلى بيته فيُعاد أيامًا، والناس يحسبونه مريضًا وما به مرض، وإنما أخذت الآية بلبّه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقال أبو سعيد الخدري رضي الله عنه: سمعت رسول الله ﷺ يقول: «بينما أنا نائم رأيت الناس يعرضون عليّ وعليهم قمص، فمنها ما يبلغ الثدي، ومنها ما يبلغ دون ذلك، وعرض عليّ عمر وعليه قميص يجره»، قالوا: فما أوّلته يا رسول الله؟ قال: «الدين». فكان القميص الطويل الذي يجره عمر إشارة إلى تمام دينه وسعة علمه، وهي رؤيا فسّرها النبي ﷺ بنفسه فصارت شهادة لا تحتاج إلى تأويل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوحدّث المسور بن مخرمة قال: «كنّا نلزم عمر بن الخطاب نتعلم منه الورع»، ثم ذكر أنه سمعه ليلةً وهو يحدّث نفسه ويقول: «أصبحت يا عمر بن الخطاب أمير المؤمنين، والله لتتقينّ الله أو ليعذبنّك». فكان يخاطب نفسه مخاطبة الخائف، ويجعل المنصب سببًا لمزيد الخوف لا لمزيد الطمأنينة، وهذا قلب رجل يعلم أن الولاية تكليف لا تشريف، وأن الحساب على قدر المسؤولية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما موافقة القرآن فرأس فضائله؛ فقد روى البخاري عن عمر أنه قال: «وافقتُ ربي في ثلاث: قلت يا رسول الله لو اتخذنا من مقام إبراهيم مصلًّى، فنزلت: «واتخذوا من مقام إبراهيم مصلًّى»، وقلت: يا رسول الله لو أمرت نساءك أن يحتجبن، فإنه يكلمهن البر والفاجر، فنزلت آية الحجاب، واجتمع نساء النبي ﷺ في الغيرة فقلت: «عسى ربه إن طلّقكن أن يبدله أزواجًا خيرًا منكن»، فنزلت الآية كذلك».\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد زاد أهل العلم على هذه الثلاث مواضع أخرى؛ منها موقفه في أسرى بدر حين أشار بالإبقاء على الأسرى وأخذ الفداء، ونزل القرآن موافقًا لرأيه في سورة الأنفال: «لولا كتاب من الله سبق لمسّكم فيما أخذتم عذاب عظيم»، وقيل بل نزلت الآية على خلاف ما أراد عمر ثم رُفع، والروايات في هذا الباب متعارضة، وأثبتها ما ثبت بسند صحيح، وما لم يثبت يُذكر بصيغة «رُوي» ولا يُجزم به.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقال ابن حجر في شرحه: إن المواضع التي وقفنا عليها من موافقات عمر تبلغ خمسة عشر موضعًا بحسب ما ذكره أهل الحديث، وإن كان بعضها يحتاج إلى نظر في ثبوته. وقال السيوطي في كتاب «فضائل الإمامين»: إنه رأى في كلام أبي عبد الله الشيباني أن عمر وافق ربه في أحد وعشرين موضعًا، وهذا العدد يحتاج إلى تحقيق، والأخذ بالأقل الثابت أسلم من التوسع في غير الثابت.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأخرج الترمذي عن ابن عمر وصححه أن النبي ﷺ قال: «ما نزل بالناس أمر فقالوا فيه وقال عمر فيه إلا نزل القرآن على نحو ما قال عمر»، وهذا الحديث وإن كان في سنده كلام، فمعناه مشهود في سيرته؛ فقد كان عمر يُعرض رأيه على الوحي فيوافق، لا لأنه يشرّع، بل لأن عقله وقلبه انسجما مع روح الشريعة انسجامًا تامًّا، فصار يفكّر كما يفكّر الشرع، ويحكم كما يحكم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالدلالة التي تُؤخذ من هذا كله أن الموافقة ليست تشريعًا من عمر، ولا مشاركة له في النبوة، بل هي ثمرة تفاعل عقله مع القرآن، وامتزاج قلبه بأهداف التشريع، وانضباط فطرته التي انسجمت مع الشريعة؛ فكان يتجسّس الأفعال والأقوال التي لا تتوافق مع الفطرة الصافية، فيتنزل الأمر الإلهي علاجًا لحادثة وقعت، فيصادف صادق النظرة وعظيم الخبرة بدخائل النفس البشرية، فيكون الإكرام الإلهي له بموافقة القرآن في كثير من آيات الذكر.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eبكاؤه عند القرآن\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يكن بكاء عمر عند القرآن بكاء عاطفة عابرة، بل كان انفعالًا كاملًا بالمعنى؛ فكان يقرأ آية واحدة فيقوم بها ليلة، ويمرّ بآية الوعد فيسكن قلبه، وبآية الوعيد فيرتجف جسده، وكان يقول: «لو نزلت آية فيها: اعملوا ما شئتم، لجعلت عليها ناظري». وكان يخاف أن يكون من أهل الآية التي يقول فيها الله: «وما أريد أن أخالفكم إلى ما أنهاكم عنه».\u003c/p\u003e\u003cp class=\"ap\"\u003eوهذا البكاء كان من أسباب قوته لا من أسباب ضعفه؛ فالذي يبكي من خشية الله في الليل لا يظلم الناس في النهار، والذي يخشى آية واحدة في خلوته لا يحتاج إلى شرطي على بابه، وقد لاحظ الناس أن أشد أيامه في الحق كانت بعد ليالٍ من القيام، وأن ألين أيامه على الضعفاء كانت بعد بكاءٍ في السحر.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالمواضع الثلاثة\u003c/h4\u003e\u003cp class=\"ap\"\u003eالموضع الأول مقام إبراهيم: كان النبي ﷺ يطوف ويصلي حيث شاء، فقال عمر: لو اتخذنا من مقام إبراهيم مصلًّى، فنزلت الآية، فصار المقام موضع صلاة بعد الطواف. والموضع الثاني الحجاب: كان النساء يخرجن فيُكلمن، فسأل عمر أن يُؤمرن بالحجاب، فنزلت آية الحجاب في سورة الأحزاب، ثم نزلت آية أخرى في سورة النور.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالموضع الثالث ما جرى بين أزواج النبي ﷺ من غيرة، فقال عمر ما قال، فنزل القرآن مصدّقًا لمعناه. وهذه المواضع الثلاثة ليست في باب واحد؛ فالأول في العبادة، والثاني في الآداب، والثالث في أحوال البيت النبوي، وفي اجتماعها دليل على أن موافقته لم تكن في باب واحد من أبواب الدين، بل في شؤون الحياة كلها.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eدلالة الموافقة\u003c/h4\u003e\u003cp class=\"ap\"\u003eالموافقة بهذا المعنى منقبة لعمر لا حجة له على الشرع؛ فهو لم يقل حكمًا فيُقرّ، بل قال رأيًا فجاء الحكم مطابقًا، والفرق بين الأمرين كبير. وقد أدرك عمر هذا الفرق فكان يقول: «إني أخاف أن أكون قد قلت في شيء فأكون قد خالفت»، وكان يردّ رأيه إذا ظهر له الدليل، وهذا هو أدب المفتي والراعي مع النص.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد جعل العلماء هذه الموافقات من أعلام نبوة النبي ﷺ؛ لأن رجلًا يقول رأيًا فينزل القرآن بعده على ما قال، لا يكون ذلك إلا إذا كان الله يعلم أن هذا الرأي هو عين المصلحة، فيكون في الموافقة إشعار بأن هذا الدين يوافق الفطرة، وأن أحكامه ليست تكاليف تعسفية، بل هي ما تستقيم به حياة الناس لو أنصفوا.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eرؤيا القميص\u003c/b\u003e\u003cspan\u003eفسّرها النبي ﷺ بالدين، وكان قميص عمر يجره\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالموافقات الثابتة\u003c/b\u003e\u003cspan\u003eمقام إبراهيم، والحجاب، وأزواج النبي ﷺ\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالعدد المذكور\u003c/b\u003e\u003cspan\u003eخمسة عشر عند ابن حجر، وأحد وعشرون عند السيوطي\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأثره\u003c/b\u003e\u003cspan\u003eقال: ما نزل بالناس أمر فقالوا فيه وقال عمر إلا نزل القرآن نحوه\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eموافقات عمر للقرآن\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالموضع\u003c/th\u003e\u003cth\u003eرأي عمر\u003c/th\u003e\u003cth\u003eما نزل فيه\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eمقام إبراهيم\u003c/td\u003e\u003ctd\u003eلو اتخذنا من مقام إبراهيم مصلًّى\u003c/td\u003e\u003ctd\u003eواتخذوا من مقام إبراهيم مصلًّى\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالحجاب\u003c/td\u003e\u003ctd\u003eلو أمرت نساءك أن يحتجبن\u003c/td\u003e\u003ctd\u003eآية الحجاب في سورة الأحزاب\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eغيرة أزواج النبي ﷺ\u003c/td\u003e\u003ctd\u003eعسى ربه إن طلّقكن أن يبدله أزواجًا خيرًا منكن\u003c/td\u003e\u003ctd\u003eالآية نفسها في سورة التحريم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eأسرى بدر\u003c/td\u003e\u003ctd\u003eأشار بالفداء والإبقاء\u003c/td\u003e\u003ctd\u003eروي أن القرآن نزل موافقًا، وفيه نظر\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eوافقتُ ربي في ثلاث: قلت يا رسول الله لو اتخذنا من مقام إبراهيم مصلًّى فنزلت، وقلت لو أمرت نساءك أن يحتجبن فنزلت آية الحجاب، واجتمع نساء النبي ﷺ في الغيرة فقلت عسى ربه إن طلّقكن أن يبدله أزواجًا خيرًا منكن فنزلت\u003c/p\u003e\u003ccite\u003eصحيح البخاري ٨/٥٠٤، عن القضاة ص٥١–٥٢\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eكان إيمان عمر ظاهر الأثر في جسده ولسانه، وبلغ من انسجام عقله مع الوحي أن نزل القرآن موافقًا لرأيه في مواضع عدة، وهي منقبة له لا تشريع، ودليل على أن هذا الدين يوافق الفطرة السليمة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"umar-khilafa","n":"تسلّم الخلافة وبيانها","ic":"📜","part":"عمر بن الخطاب (١٣–٢٣هـ)","h":"\u003carticle class=\"ch3\" id=\"umar-khilafa\" data-toc=\"تسلّم الخلافة وبيانها\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٢.٤\u003c/span\u003e\n          \u003ch3\u003e📜 تسلّم الخلافة وبيانها\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eك\u003c/span\u003eيف انتقلت الخلافة من أبي بكر إلى عمر، ولماذا كانت وصيةً في كتابٍ لا انفرادًا برأي؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكانت خلافة عمر بن الخطاب من أوضح ما دلّ على أن النبي ﷺ أشار إلى خلافته من بعده؛ فقد روى الترمذي وغيره عن حذيفة بن اليمان أن النبي ﷺ قال: «اقتدوا بالذين من بعدي أبي بكر وعمر»، وفي رواية أخرى أنه قال في مرضه: «يأبى الله والمؤمنون إلا أبا بكر»، فكانت هذه الإشارات معروفة عند الصحابة، ولذلك لم يقع في المدينة خلاف حين استُخلف عمر، ولم يحتج أحد على أبي بكر في اختياره.\u003c/p\u003e\u003cp class=\"ap\"\u003eفلما ثقل بأبي بكر المرض واشتدّ به، جمع الناس واستشارهم، فخطب فيهم خطبةً تُعدّ من أهمّ وثائق الشورى في تاريخ الإسلام؛ قال: «أيها الناس، قد حضرني من قضاء الله ما ترون، وإنه لا بدّ لكم من رجل يلي أمركم، ويصلي بكم، ويقاتل عدوّكم، ويأمركم، فإن شئتم اجتهدت لكم رأيي، والله الذي لا إله إلا هو لا آلوكم في نفسي خيرًا»، فبكى الناس، وقالوا: «يا خليفة رسول الله، أنت أخبرنا وأعلمنا فاختر لنا»، قال: «أجتهد رأيي، وأختار لكم خيركم إن شاء الله».\u003c/p\u003e\u003cp class=\"ap\"\u003eثم دعا أبا بكر عثمان بن عفان فقال: «اكتب: بسم الله الرحمن الرحيم، هذا ما عهد أبو بكر بن أبي قحافة في آخر عهده بالدنيا خارجًا منها، وعند أول عهده بالآخرة داخرًا فيها، حيث يؤمن الكافر، ويوقن الفاجر، ويصدق الكاذب: إني استخلفت عليكم بعدي عمر بن الخطاب، فاسمعوا له وأطيعوا، فإنّي لم آلُكم ونفسي خيرًا، وإن تَرَون أن ذلك عدل فذلك ظني به وعلمي فيه، وإن بدّل فلكل امرئ ما اكتسب من الإثم، والخير أردت، ولا أعلم الغيب، وسيعلم الذين ظلموا أي منقلب ينقلبون، والسلام عليكم ورحمة الله وبركاته».\u003c/p\u003e\u003cp class=\"ap\"\u003eثم دعا أبو بكر عمر خاليًا فأوصاه بما أوصاه به، ثم خرج من عنده فرفع يديه فقال: «اللهم إني لم أُرد بذلك إلا صلاحهم، وخفت عليهم الفتنة، فعملت فيهم بما أنت أعلم به، واجتهدت لهم رأيي، فوليت عليهم خيرهم وأقواهم عليهم». فكان هذا الدعاء إعلانًا بأن الاختيار كان اجتهادًا في المصلحة، لا محاباةً لأحد، ولا رغبةً في تقديم قريب أو صديق، وهو معنى يندر أن يُسمع من صاحب سلطان في تاريخ الأمم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان اختيار عمر بالشورى لا بالانفراد؛ فما كان أبو بكر ليُخرج عن باب الشورى، لكنه استشار أصحابه ثم اختار، فكانت موافقتهم هي التي خوّلته الاختيار، كما قال له الصحابة: «أنت أخبرنا وأعلمنا فاختر لنا». وقد كان ملحظ الصحابة في غاية الدقة حين قالوا له ذلك، فإنه لا أحد يعلم متتابع الحكم وتبعاته وما يناسبه وما لا يناسبه كعلم من جرّب ذلك وخبره، وعرف ظروف الدولة وما يحيط بها من أخطار وما يترتب عليها من تبعات.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان عمر هو الرجل المناسب لتلك المرحلة؛ فقد أحسنت الاختيار حين اختارت الدولة رجلًا في شدة عمر وقوته وعدله، فقد كان المسلمون يشتكون من فارس والروم في حروب طاحنة ومعارك ضروس، وكانت الدولة في حاجة إلى قوة تحفظ ما بُني، وإلى عدل يجمع الكلمة، وإلى علم يُنير الطريق، فاجتمعت هذه الخصال في رجل واحد. ولو اختير في تلك اللحظة رجل لينٍ لضاعت الفتوح، ولو اختير رجل شديد بلا ورع لضاع العدل، فكان عمر هو القدر الذي وافق القدرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوبعد وفاة أبي بكر ليلة الثلاثاء لثمان بقين من جمادى الآخرة سنة ثلاث عشرة، استقبل عمر بن الخطاب الخلافة صبيحة الثلاثاء، وألقى خطبةً بيّن فيها منهاجه؛ قال: «أما بعد فقد أُبليت بكم، وابتُليتم بي، وخُلفت فيكم بعد صاحبي، فمن كان بحضرتنا باشرناه بأنفسنا، ومن غاب عنا فقد ولّينا أمره أهل القوة والأمانة، فمن يُحسن نزده حسنًا، ومن يسيء نعاقبه، ونغفر الله لنا ولكم». فجمع في خطبته بين الوعد والوعيد، وبين القرب والبعد، وأعلن أن الجزاء معلّق بالعمل لا بالقرابة.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم كان من تواضعه في أول يوم أن خشي من نفسه الشدة، فقال: «اللهم إني شديد فليّنّي، وإني ضعيف فقوّني، وإني بخيل فسخّني»، ثم قال لأصحابه حين أفضى إليه الأمر: «لا تظنّوا بي الشدة، فقد كنت شديدًا على عهد النبي ﷺ وشرطه، فلما فجأني أبو بكر فككتُ كذلك، فأما وقد أفضى إليّ الأمر فأنا أضعفكم أمام الحق». فكان يعرف موضع قوته وموضع ضعفه، ويعرف أن الشدة في غير موضعها ظلم، وأن اللين في غير موضعه تفريط.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eكيف اختير عمر\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم تكن خلافة عمر فلتةً ولا وراثةً ولا غلبةً؛ فالنبي ﷺ أشار، وأبو بكر استشار، والصحابة وافقوا، والكتاب كُتب وشُهد عليه، ثم بُويع في المسجد بيعة عامة. فهذه خمس خطوات لا تجتمع إلا في نظامٍ يعرف كيف ينقل السلطة بغير سفك دم ولا صراع، وهي خطوات تُظهر أن الشورى في الإسلام ليست شكلًا، بل هي الطريق الشرعي لتولّي الأمر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان اختيار عمر مفاجئًا لكثير من الناس؛ فلم يكن من بني تيم ولا من بني هاشم، ولم يكن من السابقين الأولين كعثمان وعلي، لكنه كان الأقوى على إدارة الدولة في وقت الحروب، والأعرف بأحوال الناس، وأشدّهم في الحق، وقد صدق فيه ظنّ أبي بكر، فكانت سنوه العشر أعظم سني الفتوح والعدل في تاريخ الأمة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eخطبة أبي بكر الأخيرة\u003c/h4\u003e\u003cp class=\"ap\"\u003eخطبة أبي بكر هذه من أعظم ما ورد عن الخلفاء في بيان مسؤولية الحكم؛ فقد بدأها بإقرار أن الموت قادم، ثم أعلن أن الأمة لا بدّ لها من والٍ، ثم عرض نفسه على الناس: «فإن شئتم اجتهدت لكم رأيي»، فلم يستبدّ برأيه في لحظة يُحتاج فيها إلى الحسم، بل جعل الناس شركاء في القرار.\u003c/p\u003e\u003cp class=\"ap\"\u003eولما قالوا له: «أنت أخبرنا وأعلمنا فاختر لنا»، قبل تفويضهم ولم يتجاوزه، فاختار وحدّه، لكنه اختار بعد مشورة وإعلان. وهذا هو الفرق بين من يستشير ثم يقرّر، ومن يقرّر ثم يستشير ليُلبس قراره ثوب الشورى؛ فالأول يُشارك الناس في المسؤولية، والثاني يُحمّلهم تبعتها وحدهم.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eأول خطبة لعمر\u003c/h4\u003e\u003cp class=\"ap\"\u003eافتتح عمر خلافته بخطبة قصيرة جامعة، لم يمدح فيها نفسه ولم يعد الناس بوعود، بل أعلن قواعد حكمه في جمل معدودة: من كان حاضرًا باشره بنفسه، ومن كان غائبًا وكّل عنه أهل القوة والأمانة، والمحسن يُزاد، والمسيء يُعاقب. وهي قواعد تقوم على المساواة في الجزاء، وعلى تفويض السلطة لأهلها، وعلى إعلان المعيار قبل الحكم.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم أضاف إليها دعاءً يكشف عن خوفه من نفسه: «اللهم إني شديد فليّنّي، وإني ضعيف فقوّني، وإني بخيل فسخّني». فمن يدعو أن يُلَيَّن في موضع اللين، وأن يُقوّى في موضع القوة، ويعترف بأنه بخيل يحتاج إلى السخاء، هو رجل يعلم أن الحكم اختبار للنفس قبل أن يكون سلطانًا على الناس.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eإشارة النبي ﷺ\u003c/b\u003e\u003cspan\u003eاقتدوا بالذين من بعدي أبي بكر وعمر\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eطريقة الاختيار\u003c/b\u003e\u003cspan\u003eاستشارة الصحابة ثم كتاب عهد بحضورهم\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eتاريخ التولي\u003c/b\u003e\u003cspan\u003eصبيحة الثلاثاء، لثمان بقين من جمادى الآخرة سنة ١٣هـ\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمدة خلافته\u003c/b\u003e\u003cspan\u003eعشر سنين وأشهر، حتى ذي الحجة سنة ٢٣هـ\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eخطوات انتقال الخلافة إلى عمر\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالخطوة\u003c/th\u003e\u003cth\u003eتفصيلها\u003c/th\u003e\u003cth\u003eأثرها\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالإشارة النبوية\u003c/td\u003e\u003ctd\u003eاقتدوا بالذين من بعدي أبي بكر وعمر\u003c/td\u003e\u003ctd\u003eهيّأت القلوب لقبول خلافته\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eاستشارة الناس\u003c/td\u003e\u003ctd\u003eجمعهم أبو بكر وخطب فيهم وعرض عليهم رأيه\u003c/td\u003e\u003ctd\u003eجعل القرار قرار الأمة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eتفويض الصحابة\u003c/td\u003e\u003ctd\u003eقالوا: أنت أخبرنا وأعلمنا فاختر لنا\u003c/td\u003e\u003ctd\u003eخوّلوه الاختيار بعد الشورى\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eكتاب العهد\u003c/td\u003e\u003ctd\u003eكتبه عثمان بن عفان بحضور الصحابة\u003c/td\u003e\u003ctd\u003eتوثيق القرار ومنع النزاع\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالبيعة العامة\u003c/td\u003e\u003ctd\u003eبويع في المسجد بعد وفاة أبي بكر\u003c/td\u003e\u003ctd\u003eانتقال سلمي بلا اضطراب\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eاللهم إني لم أُرد بذلك إلا صلاحهم، وخفت عليهم الفتنة، فعملت فيهم بما أنت أعلم به، واجتهدت لهم رأيي، فوليت عليهم خيرهم وأقواهم عليهم\u003c/p\u003e\u003ccite\u003eتاريخ الطبري ٣/٤٢٩، عن القضاة ص٥٤\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eانتقلت الخلافة إلى عمر بإشارة نبوية، واستشارة أبي بكر للناس، وتفويضهم له بالاختيار، وكتاب عهد موثّق، وبيعة عامة، فكانت نموذجًا لنقل السلطة بالشورى، وافتتح عمر حكمه بإعلان قواعده لا بمدح نفسه.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"umar-futuh","n":"الفتوحات على ثلاث جبهات","ic":"⚔️","part":"عمر بن الخطاب (١٣–٢٣هـ)","h":"\u003carticle class=\"ch3\" id=\"umar-futuh\" data-toc=\"الفتوحات على ثلاث جبهات\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٢.٥\u003c/span\u003e\n          \u003ch3\u003e⚔️ الفتوحات على ثلاث جبهات\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eك\u003c/span\u003eيف انتقلت دولة المدينة إلى إمبراطورية تمتد من خراسان إلى برقة في عشر سنين؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكانت خلافة عمر حافلة بالأعمال الجليلة التي قدّمتها لنشر الإسلام وبسط نفوذ راية الحق على أرض الله الواسعة، وإرساء دعائم الحكم وأنظمته التي أصبحت تقتضيها طبيعة الدولة الملتزمة الإصلاح. وقد حاربت الجيوش الإسلامية في عهده على ثلاث جبهات في وقت واحد: جبهة الفرس في الشرق، وجبهة الروم في الشام، وجبهة الروم في مصر، وكان عبء إدارة هذه الجبهات الثلاث يقع على خليفةٍ في المدينة لا يملك طائرة ولا بريدًا سريعًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eأما جبهة الفرس فقد بدأت بتأسيس قاعدتين عسكريتين في العراق سنة أربع عشرة، وهما البصرة والكوفة، لتكونا منطلقتين للجيوش الفاتحة وقواعد للقتال، وبقيت الحرب في منطقة الفرات على شكل مجموعات قبلية يهابها المسلمون. وحين ولي أبو موسى الأشعري البصرة أخذ عمر برأي الأحنف بن قيس في توسيع دائرة الفتوحات، فأذن لأبي موسى بالخروج من البصرة، وأرسل معه الأمراء الذين سيسيرون في بلاد العجم، وكانوا سبعة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان هؤلاء الأمراء أصحاب ألوية سبعة: لواء خراسان للأحنف بن قيس، ولواء أردشيرخرة لمجاشع بن مسعود، ولواء اصطخر لعثمان بن أبي العاص الثقفي، ولواء فسا ودارابجرد لسارية بن زنيم الكناني، ولواء كرمان لسهيل بن عدي، ولواء سجستان لعاصم بن عمرو، ولواء مكران للحكم بن عمرو التغلبي. فانطلقت هذه الجيوش من البصرة قاصدة الأماكن التي أُمرت بفتحها، فسار الأحنف إلى خراسان سنة ثماني عشرة وقيل اثنتين وعشرين، فدخلها وافتتح هراة عنوة ثم سار إلى مرو الشاهجان.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما العراق فقد كان فيه أعظم معركتين في تاريخ الفرس؛ الأولى القادسية سنة خمس عشرة، حيث قاد سعد بن أبي وقاص جيش المسلمين والتقى بجيش الفرس بقيادة رستم، فكان النصر للمسلمين ومقتل رستم، وكتب سعد إلى عمر بالفتح. والثانية نهاوند سنة إحدى وعشرين، وسمّاها المسلمون «فتح الفتوح»، لأنها كانت بداية النهاية لدولة الفرس، وقد سقطت بعدها المدائن عاصمة كسرى، وزالت الدولة الساسانية من الوجود.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما جبهة الروم في الشام فقد كانت معركة اليرموك الفاصلة هي الضربة الموجعة لهم في بلاد الشام، بقيادة أمين هذه الأمة أبي عبيدة عامر بن الجراح، وساعده خالد بن الوليد، وما مرّت فترة من الزمن حتى بلغ الخبر المسلمين بأن مددًا قد جاء الروم، فسارع المسلمون إلى دمشق وحاصروها من جهة، وحاصرها خالد بن الوليد من جهة أخرى، ودام الحصار ما يزيد على الشهرين حتى فُتحت دمشق صلحًا وعنوة.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم تتابعت الفتوح في الشام؛ ففُتحت حمص واللاذقية وحلب حتى وصل المسلمون إلى أنطاكية والبسفور، وبذلك دانت الشام للمسلمين ليقيموا فيها حكم الله وتعلو على ربوعها راية الحق، ولترفرف فوق ربى القدس وتعلو على مآذنها شهادة الحق وكلمة التوحيد. وقد كان فتح بيت المقدس حدثًا فريدًا؛ فقد جاء عمر بنفسه إلى الشام، ودخل المدينة المقدسة ماشيًا، وكتب لأهلها الأمان، وأمر ببناء المسجد في موضعه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما جبهة مصر فقد كانت خاضعة للحكم الروماني آنذاك، فاستأذن عمرو بن العاص أمير المؤمنين في فتحها، فوافق عمر على ذلك، وسيّر جيشًا بقيادة عمرو، وألحق به الزبير بن العوام على رأس جيش آخر، ففُتحت مصر سنة عشرين كما ذكر السيوطي، وكان ذلك صلحًا، ونزل المسلمون مكانًا اسمه الفسطاط، حيث بنوا فيه بنيانًا وأنشأوا هناك مسجدًا، وأنشأ عمرو مدينته التي صارت عاصمة مصر قرونًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم سار عمرو إلى الإسكندرية فالتقى مع الروم قبلها وانتصر عليهم ودخلها، ثم خرج الروم إلى القسطنطينية، وصالح عمرو بن العاص المقوقس زعيم الأقباط وهم سكان البلاد. وهكذا ساد الإسلام أرضًا أخرى وانتشر في ربوعها وارتفعت أصوات المآذن بالتوحيد، وصارت مصر بابًا للإسلام في أفريقية كلها بعد ذلك، وأصبحت الفسطاط قاعدةً للفتوح نحو الغرب في عهد من جاء بعد عمر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان عمر يتابع الجيوش بالكتاب والرسول لا بالحضور؛ فكتب إلى أبي عبيدة عامر بن الجراح كتابًا يُقرأ على الجند: «أما بعد، فإني آمرك ومن معك من الأجناد بتقوى الله على كل حال، فإن تقوى الله أفضل العدد على العدو، وأقوى المكيدة في الحرب، وآمرك ومن معك أن تكونوا أشدّ احتراسًا من المعاصي منكم من عدوكم، فإن ذنوب الجيش أخوف عليهم من عدوهم، ولولا ذلك لم تكن لنا بهم قوة، لأن عددنا ليس كعددهم، ولا عدتنا كعدتهم، فإن استوينا في المعصية كان لهم الفضل علينا في القوة، فإن لم ننتصر عليهم بفضلنا لم نغلبهم بقوتنا».\u003c/p\u003e\u003cp class=\"ap\"\u003eفاعلموا أن عليكم حفظة من الله يعلمون ما تفعلون، فاستحيوا منهم، ولا تعملوا بمعاصي الله وأنتم في سبيل الله، ولا تقولوا إن عدونا شرّ منا، فليس لنا عليهم سلطان كما سُلّط على قوم من شرّ منهم، كما سُلّط بنو إسرائيل على من عملوا بمساخط الله، فكانوا خلال الديار، ولو كان ذلك عدلًا فيهم لما كان لهم قوة. واعملوا أن الله لم يسلّط عليهم إلا بمعصيتهم، فإذا عملنا بمعصيته سلّط علينا كما سلّط عليهم، وليس لنا عليهم قوة إلا بالطاعة».\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eجبهة الفرس\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت جبهة الفرس أطول الجبهات وأشدّها؛ فقد كانت دولة عريقة ذات جيش نظامي ومدن حصينة وأموال كثيرة، وكانت الحروب فيها على مرحلتين: مرحلة تأسيس القواعد في البصرة والكوفة، ومرحلة التوغّل في العمق حتى المدائن ونهاوند وخراسان. وقد أدرك عمر أن الحرب لا تُدار من المدينة وحدها، فأذن للقادة بالاجتهاد في الميدان، وكان يشير ولا يأمر، ويراجع ولا يعطّل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت نهاوند «فتح الفتوح» لأنها جمعت شمل الفرس بعد هزائمهم، فلما انتصر المسلمون فيها لم تقم لهم بعدها قائمة، وتفرّقت جيوشهم في المدن، ودخل الناس في دين الله أفواجًا. وقد ساعد على ذلك سياسة عمر في إبقاء أهل البلاد على أموالهم وأرضهم مقابل الجزية، فلم يكن الفتح استبدالًا للسكان، بل تغييرًا للسلطة والحكم.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eجبهة الروم\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت جبهة الشام أخطر الجبهات سياسيًا؛ لأن الروم كانوا يجاورون الجزيرة العربية منذ قرون، ولهم عملاء من قبائل العرب، وكان فتح دمشق واليرموك يعني قطع الطريق على نفوذهم في الشام كله. وقد سار أبو عبيدة في الشام بجيشٍ لم يكن أكثر عددًا ولا أفضل عتادًا، لكنه كان أشدّ انضباطًا وأصدق نية، فكان النصر ثمرة الإيمان قبل السلاح.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما بيت المقدس فقد كان فتحه ذا معنى خاص؛ ففيه المسجد الأقصى أولى القبلتين وثالث الحرمين، وقد جاء عمر بنفسه ليتسلّم المدينة، ولم يدخلها بجيش منتصر بل دخلها ماشًا تواضعًا لله، وكتب لأهلها أمانًا يحفظ أرواحهم وأموالهم وكنائسهم، وهذا الأمان أصبح أساسًا في فقه التعامل مع أهل الذمة في كل العصور.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eجبهة مصر\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان فتح مصر من أعظم ثمرات عهد عمر؛ فقد كانت مصر سلة غذاء الروم ومصدر قمحهم، وكان فتحها يعني إخراج الروم من أفريقية كلها. وقد أذن عمر لعمرو بن العاص بعد تردد، ثم كتب إليه: «قد كنت أخرجتك... فإن أدركك كتابي هذا قبل أن تدخل أرض مصر فارجع، وإن دخلتها فلا ترجع»، فلما وصله الكتاب وقد دخلها مضى في طريقه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أسّس عمرو الفسطاط مدينةً للمسلمين، وبنى فيها المسجد الجامع، وأبقى للناس كنائسهم، وأقام العدل بين القبط والروم والعرب، فلم يشكُ أحد من ظلم، ودخل أهل البلاد في الإسلام على مهل، وصارت مصر بعد ذلك قاعدة الفتوح نحو الغرب، ومنها خرجت الجيوش إلى برقة وإفريقية في عهد من جاء بعد عمر.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالجبهات\u003c/b\u003e\u003cspan\u003eالفرس في الشرق، والروم في الشام، والروم في مصر\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالقواعد العسكرية\u003c/b\u003e\u003cspan\u003eالبصرة والكوفة سنة ١٤هـ\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمعارك الفاصلة\u003c/b\u003e\u003cspan\u003eاليرموك والقادسية ونهاوند\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمدة الفتوح\u003c/b\u003e\u003cspan\u003eعشر سنين من سنة ١٣هـ إلى ٢٣هـ\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eأهم الفتوح في عهد عمر\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالجبهة\u003c/th\u003e\u003cth\u003eالمعركة أو الفتح\u003c/th\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالقائد\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالفرس\u003c/td\u003e\u003ctd\u003eالقادسية\u003c/td\u003e\u003ctd\u003e١٥هـ\u003c/td\u003e\u003ctd\u003eسعد بن أبي وقاص\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالفرس\u003c/td\u003e\u003ctd\u003eنهاوند، فتح الفتوح\u003c/td\u003e\u003ctd\u003e٢١هـ\u003c/td\u003e\u003ctd\u003eالنعمان بن مقرن\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالفرس\u003c/td\u003e\u003ctd\u003eخراسان ومرو\u003c/td\u003e\u003ctd\u003e١٨هـ\u003c/td\u003e\u003ctd\u003eالأحنف بن قيس\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالروم\u003c/td\u003e\u003ctd\u003eاليرموك\u003c/td\u003e\u003ctd\u003e١٥هـ\u003c/td\u003e\u003ctd\u003eأبو عبيدة بن الجراح\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالروم\u003c/td\u003e\u003ctd\u003eدمشق وحمص وقنسرين\u003c/td\u003e\u003ctd\u003e١٤–١٥هـ\u003c/td\u003e\u003ctd\u003eأبو عبيدة وخالد\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالروم\u003c/td\u003e\u003ctd\u003eبيت المقدس\u003c/td\u003e\u003ctd\u003e١٦هـ\u003c/td\u003e\u003ctd\u003eعمر بن الخطاب\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالروم\u003c/td\u003e\u003ctd\u003eمصر والفسطاط\u003c/td\u003e\u003ctd\u003e٢٠هـ\u003c/td\u003e\u003ctd\u003eعمرو بن العاص\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eفإن تقوى الله أفضل العدد على العدو، وأقوى المكيدة في الحرب، وآمرك ومن معك أن تكونوا أشدّ احتراسًا من المعاصي منكم من عدوكم، فإن ذنوب الجيش أخوف عليهم من عدوهم\u003c/p\u003e\u003ccite\u003eتاريخ الطبري ٣/٤٨٣، عن القضاة ص٦٢\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eفتح عمر ثلاث جبهات في عشر سنين، فأسّس البصرة والكوفة، وانتصر في القادسية ونهاوند واليرموك، ودخل بيت المقدس ماشيًا، وفتح مصر، وكان يوصي قوادَه بالتقوى قبل السلاح لأنها عنده أفضل العدد.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"umar-nizam","n":"أسس نظام الحكم ونشر العلم","ic":"🏛️","part":"عمر بن الخطاب (١٣–٢٣هـ)","h":"\u003carticle class=\"ch3\" id=\"umar-nizam\" data-toc=\"أسس نظام الحكم ونشر العلم\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٢.٦\u003c/span\u003e\n          \u003ch3\u003e🏛️ أسس نظام الحكم ونشر العلم\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eك\u003c/span\u003eيف بنى عمر دولةً تدير إمبراطورية من المدينة، وما الذي جعل نظامه يبقى بعد موته قرونًا؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eإن أمور التنظيم وسياساتها لا تنشأ من فراغ، بل حسب الحاجات التي تقتضي وجود مثل هذه السياسة التنظيمية، فكلما جدّت حاجة وجد ما يسدّ تلك الحاجة. ونظام الحكم الذي تبلورت صورته في عهد عمر لم يوضع دفعة واحدة، بل كان بالتدرج وحسب ما تقتضيه القضايا المستجدة، فكان كل تشريع إداري جوابًا على سؤال واقعي، لا تصورًا نظريًا سابقًا للتجربة، ولذلك نجد في سيرته نظامًا مكتوبًا في الأوراق بقدر ما نجده مكتوبًا في الوقائع نفسها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأول ما يُذكر في هذا الباب الخلافة؛ فأول من تسمّى باسم الخليفة أبو بكر الصديق رضي الله عنه، ولذلك يعتبر هو أول من وضع هذا النظام بعد استشارة الصحابة بذلك، والجديد في عهد عمر هو وضع الأسس وتحديد صلاحيات الخليفة وعلاقته مع رعيته، وكل ذلك مستمد من سيرة الرسول ﷺ وسنته، ومن أهم مظاهر نظام الخلافة أن الخليفة يجمع بين الإمارة والإمامة، بمعنى أن بيده السلطة الدينية والسياسية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوسلطان الخليفة مستمد من الأمة لأنه يمثلها، ولذا يجب أن يوافق الشعب على الخليفة، وإلا لم يكن خليفة، والموافقة تكون بالبيعة. وكذا يحق للشعب أن يبين للخليفة خطأه وينبهه، ويجب على الخليفة أيضًا أن يشارك الشعب بالشورى، والخلافة ليست وراثية فيها يختار لها الأكفأ والأنسب لمصلحة الأمة والدين. فهذه أربع قواعد: تمثيل الأمة، والبيعة، والنصيحة، والشورى، وهي قواعد تحوّل الحكم من ملكٍ إلى أمانة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما الولاية فوضع عمر بن الخطاب نظام ولاية الأمصار الإسلامية في عهد الراشدين بشكله النهائي؛ فأما أبو بكر فقد وضع مبادئ هذا النظام الأول بإرساله الجيوش للفتوح، وعلى رأسها قائد الجيش، وقائد الجيش هو الذي يدير المقاطعات التي يفتحها. وعلى أن عمر بن الخطاب وضع نظام الولاية بشكل مستقر، ففي عهده سُمّي الوالي أو العامل بالأمير، وأول من سُمّي بالأمير هو المغيرة بن شعبة، ثم سرى هذا اللفظ على غيره من القواد أو الولاة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان للأمير في البداية سلطان الخليفة في مقاطعته ويده في السلطات الثلاث: التشريعية والتنفيذية والقضائية، لكن عمر بن الخطاب رضي الله عنه فصل هذه السلطات بعضها عن بعض، وترك للأمير السلطة التنفيذية وسلطة الإمامة في المسجد، وفصل عنه القضاء، فعيّن قضاة في الأمصار، وفصل عنه الخراج فعيّن أصحابًا للخراج والصدقات. وعلى أن هؤلاء الولاة والقضاة والعمال مرجعهم ومردهم إلى الخليفة، فهو الذي يعينهم وهو الذي يعزلهم، واستمر النظام على هذا الشكل حتى أواخر الخلفاء الراشدين.\u003c/p\u003e\u003cp class=\"ap\"\u003eوهذا النظام كما نلاحظ يجمع بين إيجابيات النظامين المتعارف عليهما حديثًا لدى الدول وهما النظام المركزي والنظام اللامركزي، كأسلوبين من أساليب الإدارة الحديثة، ولكن لكل منهما إيجابيات وسلبيات. فجاء عمر بن الخطاب رضي الله عنه بهذا الأسلوب المبتكر من أجل إعطاء الوالي شيئًا من الاستقلالية وهو في الوقت ذاته يحافظ على وحدة الدولة السياسية والعسكرية والاجتماعية، فلا يشعر الوالي أنه مجرّد موظف، ولا يستقل استقلالًا يهدد وحدة الأمة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما بيت المال فأول من اتخذ بيتًا للمال عمر بن الخطاب، وكان إيراده من زكاة المسلمين، وجزية أهل الذمة، وخمس الغنائم، ومواريث من ليس لهم وارث من موتى المسلمين. ومن أجل تنظيم أموال بيت المال فقد دوّن الدواوين لحصر أسماء المستحقة وفرض الأعطيات، وهي أموال تعطى لبعض الناس إكرامًا لهم، لقاء خدمات عظيمة وتضحيات جليلة قدموها في سبيل هذا الدين، فكان العطاء تقديرًا للسابقة والبلاء لا مجرد صدقة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما نشر العلم فقد حرص عمر بن الخطاب رضي الله عنه على نشر العلم في أطراف العالم الإسلامي، وخاصة تعليم القرآن الكريم والفقه، لأن في ذلك قيام الدولة وحياة الأمة. فقد أمر عمر بن الخطاب رضي الله عنه أبا موسى الأشعري بإقراء أهل البصرة كتاب الله أثناء ولايته إياها، فقد روى عنه أنه كان يقول لأهل البصرة: «إن أمير المؤمنين بعثني إليكم لأعلمكم كتاب الله عز وجل وسنة نبيكم صلى الله عليه وسلم»، وكان رضي الله عنه يرسل بعض الصحابة ليعلموا الناس الفقه أيضًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eروى ابن سعد عن أبي الأسود الدؤلي قال: قدمت البصرة وبها عمران بن الحصين أبو النجدين، وكان عمر بن الخطاب بعثه ليفقه أهل البصرة. ولقد كان شأن البصرة في هذا كشأن باقي الأمصار الإسلامية الأخرى؛ فكل مصر من الأمصار أُرسل إليه من يعلّم أهله، فكان العلم يُنقل من المدينة إلى الأمصار، ثم يصير في كل مصر حلقةٌ من العلماء تُخرّج من بعدها أجيالًا، وهذا هو أعظم أثرٍ تركه عمر في بناء الأمة العلمي.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالخلافة: عقدٌ بين الأمة والخليفة\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم تكن الخلافة عند عمر ملكًا يُورَّث، ولا سلطةً تُنتزع، بل عقدًا بين الأمة ومن تختاره، فالأمة هي مصدر السلطان، والخليفة وكيلها في تنفيذ الشرع وحفظ المصالح. ولذلك كانت البيعة شرطًا في صحتها، وكانت النصيحة حقًّا للرعية على الخليفة، وكانت الشورى أصلًا في القرارات الكبرى التي لا نصّ فيها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد جسّد عمر هذه القواعد في سلوكه لا في كلامه؛ فكان يستشير الصحابة في الفتوح والأموال والقضاء، وكان يقبل النقد في العلن، وكان يقول: «لا خير في قوم ليسوا بناصحين، ولا خير في قوم لا يحبون الناصحين». وكان يجعل نفسه في مجلسه واحدًا من الناس، فلا يرفع صوته على أحد، ولا يمنع أحدًا من الكلام، حتى كان الأعرابي يجذبه من ثوبه فينصت له.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eبيت المال والدواوين\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان بيت المال في عهد عمر مؤسسةً قائمة بذاتها، لها إيرادات معروفة ومصارف محددة، لا صندوقًا ملحقًا ببيت الخليفة. وقد حرص عمر على أن يكون المال مال الأمة، فكان يسأل عن مصدر كل درهم، ويردّ ما لا حقّ فيه، وكان يقول: «ما لي وللدنيا، إنما أنا كرجلٍ له مالٌ في يده لا يدري متى يُقبض منه».\u003c/p\u003e\u003cp class=\"ap\"\u003eوالدواوين كانت أول خطوة في تنظيم الدولة؛ فبها عُرفت الأسماء والأنساب والسوابق، وبها ضُبط العطاء فلم يُعطَ أحدٌ أكثر من حقّه، ولم يُنسَ أحدٌ حقّه. وقد سار على هذا النظام من جاء بعده من الخلفاء، فصار الديوان مؤسسةً ثابتة في الدولة الإسلامية، ثم تطوّرت في العصور الأموية والعباسية حتى صارت وزارات ودواوين كبرى.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالعلم في الأمصار\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان تعليم القرآن والفقه في نظر عمر أمنًا للدولة لا كمالًا لها؛ فالأمة التي لا تعرف دينها لا تحفظ نظامها، والذي لا يفقه حكم الله في المال والدم لا يؤتمن على قضاء ولا ولاية. ولذلك كان يبعث المعلّمين إلى الأمصار قبل أن يبعث إليها الجباة، ويأمر الولاة أن يجلسوا للناس يعلمونهم، ويحاسبهم على تقصيرهم في ذلك.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أثمر هذا الحرص أن صارت البصرة والكوفة والشام ومصر مراكز علمٍ في زمن قصير، وتخرّج منها فقهاء وقضاة وقرّاء، وصار في كل مصر مدرسةٌ لها منهجها وأصحابها. وهذا هو الإنجاز الذي لا يُقاس بعدد الأميال التي فُتحت، بل بعدد العقول التي أُوقفت على فهم كتاب الله وسنة نبيه.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالخلافة\u003c/b\u003e\u003cspan\u003eعقد وبيعة وشورى، وليست وراثة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالولاية\u003c/b\u003e\u003cspan\u003eأمير على المصر، فصل عمر عنه القضاء والخراج\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eبيت المال\u003c/b\u003e\u003cspan\u003eأول من اتخذه عمر، ومصادره الزكاة والجزية والخمس\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالعلم\u003c/b\u003e\u003cspan\u003eبعث المعلّمين إلى الأمصار لتعليم القرآن والفقه\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eأسس نظام الحكم في عهد عمر\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمؤسسة\u003c/th\u003e\u003cth\u003eوظيفتها\u003c/th\u003e\u003cth\u003eما جدّ فيها\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالخلافة\u003c/td\u003e\u003ctd\u003eرئاسة الدولة وتمثيل الأمة\u003c/td\u003e\u003ctd\u003eتحديد الصلاحيات وربطها بالبيعة والشورى\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالولاية\u003c/td\u003e\u003ctd\u003eإدارة الأمصار\u003c/td\u003e\u003ctd\u003eتسمية الأمير وفصل السلطات عنه\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالقضاء\u003c/td\u003e\u003ctd\u003eالفصل بين الناس\u003c/td\u003e\u003ctd\u003eتعيين قضاة مستقلين في الأمصار\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eبيت المال\u003c/td\u003e\u003ctd\u003eجمع المال وتوزيعه\u003c/td\u003e\u003ctd\u003eاتخاذ بيت للمال وتدوين الدواوين\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالتعليم\u003c/td\u003e\u003ctd\u003eنشر القرآن والفقه\u003c/td\u003e\u003ctd\u003eإرسال المعلّمين إلى البصرة وغيرها\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eإن أمير المؤمنين بعثني إليكم لأعلمكم كتاب الله عز وجل وسنة نبيكم صلى الله عليه وسلم\u003c/p\u003e\u003ccite\u003eطبقات ابن سعد ٧/١٠، عن القضاة ص٦٦\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eبنى عمر نظامًا متدرجًا يقوم على بيعة وشورى، وأميرٍ في كل مصر تُفصل عنه السلطات، وبيت مالٍ مستقل، ومعلّمين يُرسلون إلى الأمصار، فجمع بين وحدة الدولة واستقلال الولايات، وأسّس ما بقي بعده قرونًا.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"umar-ightiyal","n":"اغتياله ووفاته","ic":"🕯️","part":"عمر بن الخطاب (١٣–٢٣هـ)","h":"\u003carticle class=\"ch3\" id=\"umar-ightiyal\" data-toc=\"اغتياله ووفاته\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٢.٧\u003c/span\u003e\n          \u003ch3\u003e🕯️ اغتياله ووفاته\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eك\u003c/span\u003eيف قُتل الخليفة الذي بلغ عدله الآفاق، وما الذي قاله وهو يعالج طعنته؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eرغم أن عدل عمر بن الخطاب رضي الله عنه بلغ الآفاق، وأصبح مضرب المثل، والعدل يفرز الطمأنينة — كما قال الأعرابي: «عدلت فأمنت فنمت يا عمر» — إلا أن ذلك ما كان ليمنع يد الغدر والحقد أن تمتد إلى عمر رضي الله عنه لتضع حدًّا لحياة هذا العملاق العظيم. فليس كل الناس يرضيهم العدل، ولا كل من عاش في ظل الدولة الإسلامية كان مؤمنًا بغايتها، وكان في المدينة من يحمل في قلبه حقدًا على الإسلام ينتظر الفرصة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقضية ذلك مشهورة ذكرها المؤرخون والرواة، وهي أن المغيرة بن شعبة رضي الله عنه كان واليًا على الكوفة، ففرض خراجًا على أصحاب الصنائع، وكان ضمن هؤلاء صنّاعًا عندهم عدد من الحرف. فقد كان حدادًا نقّاشًا نجّارًا، ففرض عليه المغيرة مائة درهم في الشهر خراجًا، وهي أشبه بالضريبة، ولكنها تُفرض على غير المسلمين حمايتهم، أما المسلمون فيدفعون الزكاة، فكان في هذا الفرق بين الجزية والزكاة أصلٌ من أصول نظام المال في الدولة.\u003c/p\u003e\u003cp class=\"ap\"\u003eفجاء الغلام عمر يشكو شدة الخراج، فقال له عمر: «ما خراجك بكثير»، فانصرف ساخطًا يتمرمر. ثم دعاه عمر بعد ليالٍ فقال له: «بلغني أنك تستطيع أن تصنع رحى تطحن بالريح، فاصنع لنا». فالتفت إلى عمر عابسًا وقال: «لأصنعنّ لك رحى يتحدث الناس بها». فلمّا ولى قال عمر لأصحابه: «توعدني العبد آنفًا». ثم جهّز هذا الغلام — وأمه أبو لؤلؤة، وكان مجوسيًّا — خنجرًا له رأسان، نصبه في وسطه، وشحذه وأشبعه بالسم، ثم أتى المسجد.\u003c/p\u003e\u003cp class=\"ap\"\u003eويروي البخاري عن عمر بن ميمون رضي الله عنه قال: «إني لقائم ما بيني وبينه إلا عبد الله بن عباس غداة أُصيب، وكان إذا مرّ بين الصفين قال: استووا، وحينما قرأ سورة النحل أو يوسف وركع، سمعته يقول: قتلني أو آكلي الكلب». حين طعنه — وقيل إنه طعنه في كتفه وفي خاصرته — سقط عمر بن الخطاب فتناوله عبد الرحمن بن عوف — وكان ممن يليه — فقدمه فأتمّ الصلاة.\u003c/p\u003e\u003cp class=\"ap\"\u003eأما أبو لؤلؤة فخرج من بين الناس لا يجد أحدًا في طريقه إلا طعنه، حتى طعن ثلاثة عشر رجلًا مات منهم سبعة، فلمّا رأى ذلك رجل من المسلمين طرح عليه برنسًا، فلمّا أينقن العلج أنه مأخوذ نحر نفسه فمات. وحُمل عمر إلى بيته جريحًا، فسُئل عن قاتله، فأخبروه، فقال: «الحمد لله الذي لم يجعل منيتي بيد رجل يدعي الإسلام». ثم دُعي الطبيب فسقاه نبيذًا فخرج من جرحه، ثم أُتي بلبن فشربه فخرج من جرحه، فعلموا أنه ميت.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم أرسل عمر إلى عائشة ابنه يقول له: «انطلق إلى عائشة أم المؤمنين فقل: يقرأ عليك عمر السلام، ولا تقل أمير المؤمنين، فإني لست اليوم أميرًا للمؤمنين، وقل: يستأذن عمر بن الخطاب أن يُدفن مع صاحبيه». فذهب فسلّم واستأذن، ثم دخل عليها فوجدها تبكي، فقال: «يقرأ عليك عمر بن الخطاب السلام، ويستأذن أن يُدفن مع صاحبيه»، فقالت: «كنت أريده لنفسي، ولأوثرنّه به اليوم على نفسي».\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت إصابة عمر رضي الله عنه يوم الأربعاء، وبقي جريحًا عدة أيام إلى أن توفاه الله قبل نهاية ذي الحجة بأربع ليالٍ سنة ثلاث وعشرين، ودُفن رضي الله عنه إلى جانب صاحبه، وجُعل رأسه محاذاة رأس أبي بكر محاذاة منكبه، وكان رأس أبي بكر محاذاة كتفي رسول الله ﷺ. وكان عمر يوم قُتل ابن ثلاث وستين سنة، وهي السن التي مات فيها أبو بكر، والسن التي قُتل فيها حمزة عمّ النبي ﷺ، فكان في كل ذلك على منهاج أصحابه.\u003c/p\u003e\u003cp class=\"ap\"\u003eومما يلفت النظر أن عمر رضي الله عنه قُتل بسبب اتهامه بالظلم — حسب الظاهر — من قِبل الغلام المجوسي، رغم أن عدالة عمر أصبحت مضرب المثل، وكان عمر رمزًا للعدالة، فهو والعدل قرينان حيث ذكر أحدهما ذكر الآخر. وهذا دليل على أن صاحب الحاجة يرى أنه لا بدّ من تحقيق حاجته، وكل ما عدا ذلك يعتبره ظلمًا، وهذه طبيعة البشر، وقد قيل: «صاحب الحاجة أعمى لا يرى إلا حاجته».\u003c/p\u003e\u003cp class=\"ap\"\u003eفكم يزلّ الناس في اتهام الآخرين بالخلف والظلم والبعد عن الحق والخطأ في القول والفعل، لا لشيء إلا لأن أفعالهم لم تكن موافقة لرغبات أولئك ويتضح هذا أكثر حينما يكون الإنسان مستندًا قويًّا، ولكنه غاب عنه أنه ربما يكون للأخر حجته ومستنده الأقوى. وكم يحصل هذا حينما يقدم أحد اقتراحًا مدعمًا بالدليل، فلشدة إيمانه بجدوى اقتراحه يظن أن عدم الأخذ به بُعدٌ عن الحق، وإعراض عن الصواب.\u003c/p\u003e\u003cp class=\"ap\"\u003eفأفلا يعلم أن اقتراحه هذا قد يكون معارضًا باقتراح آخر له من يؤيده وعليه دليله، فليس اقتراحه بأولى من اقتراح الآخرين؟ فليت شعري لو أن الناس أدركوا هذه الحقيقة لتقلّصت النزاعات والخلافات، ولتوالت الاتهامات بين الناس. فسبحان الذي خلق العقول، وجعل ذلك التفاوت في الفهم والإدراك، والتحليل والاستنتاج، وصدق الله العظيم إذ يقول: «ولو شاء ربك لجعل الناس أمة واحدة ولا يزالون مختلفين إلا من رحم ربك ولذلك خلقهم».\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالرحى التي طحنت\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت قصة الطعن تبدأ من شكوى على ضريبة، لا من معركة ولا من فتنة؛ فقد فرض المغيرة بن شعبة على صنّاع الكوفة من غير المسلمين خراجًا مقابل الحماية، فاعترض أبو لؤلؤة على مقدار ما فرض عليه، وذهب يشكو إلى الخليفة، فلم يجد عنده ما يرضيه، فتحوّل اعتراضه إلى حقدٍ دفين، وحقده إلى خنجرٍ مسموم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد قال عمر كلمةً تُروى إلى اليوم: «توعدني العبد آنفًا»، وقال له الغلام: «لأصنعنّ لك رحى يتحدث الناس بها». فكانت الرحى التي وعد بها رحى الموت، وطحنت مع عمرَ جراحًا في جسد الأمة، لأن الفتنة لا تُقاس بحجم سببها، بل بما تجده من قلوب مستعدة لها، ولذلك كان عمر يقول: «أخوف ما أخاف على هذه الأمة المنافقون».\u003c/p\u003e\u003ch4 class=\"sub\"\u003eصبيحة الطعن\u003c/h4\u003e\u003cp class=\"ap\"\u003eخرج عمر في صبيحة ذلك اليوم كما يخرج كل يوم، يمرّ بين الصفوف ويقول: «استووا»، ثم كبّر وقرأ، فلما سجد أو ركع طُعن، فسقط، فتقدّمه عبد الرحمن بن عوف فأتمّ بالناس الصلاة، وحُمل الخليفة إلى بيته وهو ينزف. ولم يكن في المسجد من يعرف القاتل في اللحظة الأولى، ثم عُرف أنه أبو لؤلؤة غلام المغيرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان من آخر ما قاله في الدنيا: «الحمد لله الذي لم يجعل منيتي بيد رجل يدعي الإسلام»، وهي كلمة تختصر حياة رجلٍ كان يخاف أن يُقتل على يد مسلم فيكون في ذلك فتنة، فجاءه القتل على يد مجوسي، فحمد الله أن أخرجه من هذه الشبهة. ثم أوصى بالخلافة فجعلها شورى في ستة من الصحابة، وأوصى صهيبًا أن يصلي بالناس ثلاثًا.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالوصية والدفن\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يوصِ عمر لأحد بعينه، بل جعل الأمر شورى في ستة: عثمان وعلي وطلحة والزبير وسعد وعبد الرحمن بن عوف، وأمرهم أن يجتمعوا في بيتٍ ويختاروا واحدًا منهم، وأوصى أن يُشهد عليهم المهاجرون والأنصار. وكان في وصاياه أن يُدفن مع صاحبيه إن أذنت عائشة، وأن يُؤذّن له في الناس، وأن يُعجل به، وأن يكتب إلى الآفاق بخلافته.\u003c/p\u003e\u003cp class=\"ap\"\u003eفلما مات غُسّل وكُفّن وصُلّي عليه، ودُفن في حجرة عائشة إلى جانب النبي ﷺ وأبي بكر، فكان ثالث ثلاثةٍ في ذلك الموضع الشريف. وبموته انتهى عهدٌ من أعظم عهود العدل في تاريخ البشرية، وبدأ عهدٌ آخر كانت فيه الفتنة تنتظر على الباب، وقد كان عمر يعلم ذلك فكتب إليه ما كتب.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eتاريخ الطعن\u003c/b\u003e\u003cspan\u003eيوم الأربعاء، قبل نهاية ذي الحجة سنة ٢٣هـ\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالقاتل\u003c/b\u003e\u003cspan\u003eأبو لؤلؤة، غلام المغيرة بن شعبة، مجوسي\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eعدد المطعونين\u003c/b\u003e\u003cspan\u003eثلاثة عشر رجلًا مات منهم سبعة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسنه\u003c/b\u003e\u003cspan\u003eثلاث وستون سنة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالخلافة بعده\u003c/b\u003e\u003cspan\u003eشورى في ستة من الصحابة\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eوقائع ليلة الطعن\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالوقت\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eقبل الفجر\u003c/td\u003e\u003ctd\u003eخرج عمر إلى المسجد كعادته\u003c/td\u003e\u003ctd\u003eمرّ بين الصفوف يقول استووا\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eفي الصلاة\u003c/td\u003e\u003ctd\u003eطعنه أبو لؤلؤة بخنجر مسموم\u003c/td\u003e\u003ctd\u003eسقط فتقدّمه عبد الرحمن بن عوف\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eبعد الطعن\u003c/td\u003e\u003ctd\u003eخرج القاتل يطعن من لقيه\u003c/td\u003e\u003ctd\u003eمات سبعة من ثلاثة عشر\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eفي البيت\u003c/td\u003e\u003ctd\u003eسُئل عن قاتله فأُخبر\u003c/td\u003e\u003ctd\u003eقال: الحمد لله الذي لم يجعل منيتي بيد رجل يدعي الإسلام\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eقبل الوفاة\u003c/td\u003e\u003ctd\u003eأرسل إلى عائشة يستأذن في الدفن\u003c/td\u003e\u003ctd\u003eقالت: لأوثرنّه به اليوم على نفسي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eبعد الوفاة\u003c/td\u003e\u003ctd\u003eدُفن إلى جانب النبي ﷺ وأبي بكر\u003c/td\u003e\u003ctd\u003eثالث ثلاثة في ذلك الموضع\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eالحمد لله الذي لم يجعل منيتي بيد رجل يدعي الإسلام\u003c/p\u003e\u003ccite\u003eفتح الباري ٧/٦١، عن القضاة ص٦٨\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eقُتل عمر على يد مجوسي غضب من خراجٍ فرضه والي الكوفة، فطعنه في الصلاة، فحمد الله أن لم تكن منيته بيد مسلم، وجعل الخلافة شورى في ستة، ودُفن إلى جانب صاحبيه، وانتهى بموته عهد من أعدل عهود الحكم.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"f","one":true,"id":"people","n":"أهم الشخصيات","ic":"","part":"","h":"\u003csection class=\"rsec\"\u003e\n      \u003ch2 class=\"sec\"\u003eأهم الشخصيات\u003c/h2\u003e\n      \u003cdiv class=\"people\"\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eأبو بكر بن أبي قحافة\u003c/b\u003e\u003cspan\u003eالصديق، أوّل الخلفاء الراشدين، بايعة أهل المدينة وبدأ حروب الردة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eعمر بن الخطاب\u003c/b\u003e\u003cspan\u003eالفاروق، ثاني الخلفاء، فتح الشام والعراق ومصر وجمع المصاحف سنة ١٣هـ.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eعثمان بن عفان\u003c/b\u003e\u003cspan\u003eذو النورين، ثالث الخلفاء، أتمّ الفتح نحو خراسان وسواحل البحر.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eعلي بن أبي طالب\u003c/b\u003e\u003cspan\u003eرابع الخلفاء، قاتل معاوية في صفين واشتُهد في مسجد النبي سنة ٤٠هـ.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eخالد بن الوليد\u003c/b\u003e\u003cspan\u003eسيف الله المسلول، قاد جيوش الشام وحروب الردة، وأول من كثر عليه الكلام.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eعمرو بن العاص\u003c/b\u003e\u003cspan\u003eقائد الفتح في مصر، وهو أوّل من أرسل إلى عمر تقريراً مفصلاً عن الأقاليم.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eالحسن بن علي\u003c/b\u003e\u003cspan\u003eتنازل عن الخلافة سنة ٣٩هـ، فعهدت الخلافة لمعاوية وانتهت حقبة الراشدين.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\n    \u003c/section\u003e"},{"u":"f","one":true,"id":"outcomes","n":"النتائج والآثار","ic":"","part":"","h":"\u003csection class=\"rsec\"\u003e\n      \u003ch2 class=\"sec\"\u003eالنتائج والآثار\u003c/h2\u003e\n      \u003cul class=\"outs\"\u003e\u003cli\u003eانتشرت الدولة الإسلامية من حدود المدينة إلى الشام والعراق ومصر وخراسان في نحو ثلاثين عاماً.\u003c/li\u003e\u003cli\u003eدُوّنت المصاحف الأولى في عهد أبي بكر، فصار للقرآن نصّ واحد تواترت به القراءة.\u003c/li\u003e\u003cli\u003eأقرّ عمر أهل الذمة بذمة العمرية، فبقي لأهل الكتاب نظام حماية في الدولة.\u003c/li\u003e\u003cli\u003eقُسّمت الأقاليم إلى ولايات وعُمّرت الدواوين والكُتّاب، فاكتسبت الدولة جهاز إدارة مستقراً.\u003c/li\u003e\u003cli\u003eانتهت حقبة الراشدين بانعقاد البيعة إلى بني أمية، وهو مدخل الدولة الأموية.\u003c/li\u003e\u003c/ul\u003e\n    \u003c/section\u003e"},{"u":"f","one":true,"id":"sources","n":"المصادر والمراجع","ic":"","part":"","h":"\u003cdiv class=\"src frame\" style=\"--c:#8B1A3A\"\u003e\n    \u003cspan class=\"crn tl\"\u003e\u003csvg viewBox=\"0 0 26 26\"\u003e\n\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\"/\u003e\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\" transform=\"rotate(90 13 13)\" opacity=\".5\"/\u003e\u003c/svg\u003e\u003c/span\u003e\u003cspan class=\"crn tr\"\u003e\u003csvg viewBox=\"0 0 26 26\"\u003e\n\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\"/\u003e\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\" transform=\"rotate(90 13 13)\" opacity=\".5\"/\u003e\u003c/svg\u003e\u003c/span\u003e\u003cspan class=\"crn bl\"\u003e\u003csvg viewBox=\"0 0 26 26\"\u003e\n\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\"/\u003e\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\" transform=\
