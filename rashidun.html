الخطاب السلام، ويستأذن أن يُدفن مع صاحبيه»، فقالت: «كنت أريده لنفسي، ولأوثرنّه به اليوم على نفسي».\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت إصابة عمر رضي الله عنه يوم الأربعاء، وبقي جريحًا عدة أيام إلى أن توفاه الله قبل نهاية ذي الحجة بأربع ليالٍ سنة ثلاث وعشرين، ودُفن رضي الله عنه إلى جانب صاحبه، وجُعل رأسه محاذاة رأس أبي بكر محاذاة منكبه، وكان رأس أبي بكر محاذاة كتفي رسول الله ﷺ. وكان عمر يوم قُتل ابن ثلاث وستين سنة، وهي السن التي مات فيها أبو بكر، والسن التي قُتل فيها حمزة عمّ النبي ﷺ، فكان في كل ذلك على منهاج أصحابه.\u003c/p\u003e\u003cp class=\"ap\"\u003eومما يلفت النظر أن عمر رضي الله عنه قُتل بسبب اتهامه بالظلم — حسب الظاهر — من قِبل الغلام المجوسي، رغم أن عدالة عمر أصبحت مضرب المثل، وكان عمر رمزًا للعدالة، فهو والعدل قرينان حيث ذكر أحدهما ذكر الآخر. وهذا دليل على أن صاحب الحاجة يرى أنه لا بدّ من تحقيق حاجته، وكل ما عدا ذلك يعتبره ظلمًا، وهذه طبيعة البشر، وقد قيل: «صاحب الحاجة أعمى لا يرى إلا حاجته».\u003c/p\u003e\u003cp class=\"ap\"\u003eفكم يزلّ الناس في اتهام الآخرين بالخلف والظلم والبعد عن الحق والخطأ في القول والفعل، لا لشيء إلا لأن أفعالهم لم تكن موافقة لرغبات أولئك ويتضح هذا أكثر حينما يكون الإنسان مستندًا قويًّا، ولكنه غاب عنه أنه ربما يكون للأخر حجته ومستنده الأقوى. وكم يحصل هذا حينما يقدم أحد اقتراحًا مدعمًا بالدليل، فلشدة إيمانه بجدوى اقتراحه يظن أن عدم الأخذ به بُعدٌ عن الحق، وإعراض عن الصواب.\u003c/p\u003e\u003cp class=\"ap\"\u003eفأفلا يعلم أن اقتراحه هذا قد يكون معارضًا باقتراح آخر له من يؤيده وعليه دليله، فليس اقتراحه بأولى من اقتراح الآخرين؟ فليت شعري لو أن الناس أدركوا هذه الحقيقة لتقلّصت النزاعات والخلافات، ولتوالت الاتهامات بين الناس. فسبحان الذي خلق العقول، وجعل ذلك التفاوت في الفهم والإدراك، والتحليل والاستنتاج، وصدق الله العظيم إذ يقول: «ولو شاء ربك لجعل الناس أمة واحدة ولا يزالون مختلفين إلا من رحم ربك ولذلك خلقهم».\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالرحى التي طحنت\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت قصة الطعن تبدأ من شكوى على ضريبة، لا من معركة ولا من فتنة؛ فقد فرض المغيرة بن شعبة على صنّاع الكوفة من غير المسلمين خراجًا مقابل الحماية، فاعترض أبو لؤلؤة على مقدار ما فرض عليه، وذهب يشكو إلى الخليفة، فلم يجد عنده ما يرضيه، فتحوّل اعتراضه إلى حقدٍ دفين، وحقده إلى خنجرٍ مسموم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد قال عمر كلمةً تُروى إلى اليوم: «توعدني العبد آنفًا»، وقال له الغلام: «لأصنعنّ لك رحى يتحدث الناس بها». فكانت الرحى التي وعد بها رحى الموت، وطحنت مع عمرَ جراحًا في جسد الأمة، لأن الفتنة لا تُقاس بحجم سببها، بل بما تجده من قلوب مستعدة لها، ولذلك كان عمر يقول: «أخوف ما أخاف على هذه الأمة المنافقون».\u003c/p\u003e\u003ch4 class=\"sub\"\u003eصبيحة الطعن\u003c/h4\u003e\u003cp class=\"ap\"\u003eخرج عمر في صبيحة ذلك اليوم كما يخرج كل يوم، يمرّ بين الصفوف ويقول: «استووا»، ثم كبّر وقرأ، فلما سجد أو ركع طُعن، فسقط، فتقدّمه عبد الرحمن بن عوف فأتمّ بالناس الصلاة، وحُمل الخليفة إلى بيته وهو ينزف. ولم يكن في المسجد من يعرف القاتل في اللحظة الأولى، ثم عُرف أنه أبو لؤلؤة غلام المغيرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان من آخر ما قاله في الدنيا: «الحمد لله الذي لم يجعل منيتي بيد رجل يدعي الإسلام»، وهي كلمة تختصر حياة رجلٍ كان يخاف أن يُقتل على يد مسلم فيكون في ذلك فتنة، فجاءه القتل على يد مجوسي، فحمد الله أن أخرجه من هذه الشبهة. ثم أوصى بالخلافة فجعلها شورى في ستة من الصحابة، وأوصى صهيبًا أن يصلي بالناس ثلاثًا.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالوصية والدفن\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يوصِ عمر لأحد بعينه، بل جعل الأمر شورى في ستة: عثمان وعلي وطلحة والزبير وسعد وعبد الرحمن بن عوف، وأمرهم أن يجتمعوا في بيتٍ ويختاروا واحدًا منهم، وأوصى أن يُشهد عليهم المهاجرون والأنصار. وكان في وصاياه أن يُدفن مع صاحبيه إن أذنت عائشة، وأن يُؤذّن له في الناس، وأن يُعجل به، وأن يكتب إلى الآفاق بخلافته.\u003c/p\u003e\u003cp class=\"ap\"\u003eفلما مات غُسّل وكُفّن وصُلّي عليه، ودُفن في حجرة عائشة إلى جانب النبي ﷺ وأبي بكر، فكان ثالث ثلاثةٍ في ذلك الموضع الشريف. وبموته انتهى عهدٌ من أعظم عهود العدل في تاريخ البشرية، وبدأ عهدٌ آخر كانت فيه الفتنة تنتظر على الباب، وقد كان عمر يعلم ذلك فكتب إليه ما كتب.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eتاريخ الطعن\u003c/b\u003e\u003cspan\u003eيوم الأربعاء، قبل نهاية ذي الحجة سنة ٢٣هـ\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالقاتل\u003c/b\u003e\u003cspan\u003eأبو لؤلؤة، غلام المغيرة بن شعبة، مجوسي\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eعدد المطعونين\u003c/b\u003e\u003cspan\u003eثلاثة عشر رجلًا مات منهم سبعة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسنه\u003c/b\u003e\u003cspan\u003eثلاث وستون سنة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالخلافة بعده\u003c/b\u003e\u003cspan\u003eشورى في ستة من الصحابة\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eوقائع ليلة الطعن\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالوقت\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eقبل الفجر\u003c/td\u003e\u003ctd\u003eخرج عمر إلى المسجد كعادته\u003c/td\u003e\u003ctd\u003eمرّ بين الصفوف يقول استووا\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eفي الصلاة\u003c/td\u003e\u003ctd\u003eطعنه أبو لؤلؤة بخنجر مسموم\u003c/td\u003e\u003ctd\u003eسقط فتقدّمه عبد الرحمن بن عوف\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eبعد الطعن\u003c/td\u003e\u003ctd\u003eخرج القاتل يطعن من لقيه\u003c/td\u003e\u003ctd\u003eمات سبعة من ثلاثة عشر\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eفي البيت\u003c/td\u003e\u003ctd\u003eسُئل عن قاتله فأُخبر\u003c/td\u003e\u003ctd\u003eقال: الحمد لله الذي لم يجعل منيتي بيد رجل يدعي الإسلام\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eقبل الوفاة\u003c/td\u003e\u003ctd\u003eأرسل إلى عائشة يستأذن في الدفن\u003c/td\u003e\u003ctd\u003eقالت: لأوثرنّه به اليوم على نفسي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eبعد الوفاة\u003c/td\u003e\u003ctd\u003eدُفن إلى جانب النبي ﷺ وأبي بكر\u003c/td\u003e\u003ctd\u003eثالث ثلاثة في ذلك الموضع\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eالحمد لله الذي لم يجعل منيتي بيد رجل يدعي الإسلام\u003c/p\u003e\u003ccite\u003eفتح الباري ٧/٦١، عن القضاة ص٦٨\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eقُتل عمر على يد مجوسي غضب من خراجٍ فرضه والي الكوفة، فطعنه في الصلاة، فحمد الله أن لم تكن منيته بيد مسلم، وجعل الخلافة شورى في ستة، ودُفن إلى جانب صاحبيه، وانتهى بموته عهد من أعدل عهود الحكم.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-3","n":"عثمان بن عفان (٢٣–٣٥هـ)","ic":"","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-3\" style=\"--c:#8B1A3A\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e📖\u003c/div\u003e\n      \u003ch2\u003eعثمان بن عفان (٢٣–٣٥هـ)\u003c/h2\u003e\n      \u003cp\u003eاثنتا عشرة سنة، أطول من كل خلافة راشدية، بدأت بفتوحٍ في فارس وتركيا والشام وقبرص وإفريقية، ثم بنسخ المصحف الذي وحّد رسم الأمة إلى اليوم، وانتهت بحصارٍ في الدار وقتلٍ في جوف الليل. هذا القسم يتتبع عثمان من نسبه وحيائه وتضحيته، إلى بيعة الشورى والشبهة التي أُثيرت حولها، ثم الفتنة التي أودت بمقتله ونقد رواياتها، وينتهي بأعماله في النسخ والفتح والتنظيم.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#uthman-nasab\"\u003eالنسب والصفات والإسلام والتضحية\u003c/a\u003e\u003ca href=\"#uthman-khilafa\"\u003eكيف آلت إليه الخلافة وشبهة وردّها\u003c/a\u003e\u003ca href=\"#uthman-fitna\"\u003eالفتنة التي أودت بمقتله\u003c/a\u003e\u003ca href=\"#uthman-naqd\"\u003eنقد روايات الفتنة\u003c/a\u003e\u003ca href=\"#uthman-mushaf\"\u003eنسخ القرآن الكريم\u003c/a\u003e\u003ca href=\"#uthman-futuh\"\u003eالفتوحات في عهده\u003c/a\u003e\u003ca href=\"#uthman-nizam\"\u003eتنظيم أمور الدولة ومرافقها\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"uthman-nasab","n":"النسب والصفات والإسلام والتضحية","ic":"🌿","part":"عثمان بن عفان (٢٣–٣٥هـ)","h":"\u003carticle class=\"ch3\" id=\"uthman-nasab\" data-toc=\"النسب والصفات والإسلام والتضحية\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eعثمان بن عفان (٢٣–٣٥هـ)\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ١ من ٧\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٣\u003ci\u003e.\u003c/i\u003e١\u003c/span\u003e\n            \u003ch3\u003e🌿 النسب والصفات والإسلام والتضحية\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eم\u003c/span\u003eن هو الرجل الذي تستحي منه الملائكة، ولماذا لُقّب بذي النورين؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eهو عثمان بن عفان بن أبي العاص بن أمية بن عبد شمس بن عبد مناف بن قصي بن كلاب بن مرة بن لؤي بن غالب، فهو أمويّ قرشيّ، يلتقي مع النبي ﷺ في عبد مناف، ويجتمع مع أبي بكر في قصي. يكنى أبا عبد الله، ويقال أبا ليلى. وأمه أروى بنت كريز بن حبيب بن عبد شمس، وأمها أم حكيم البيضاء بنت عبد المطلب، أي أن جدته لأمه عمة رسول الله ﷺ، فهو قريب من النبي ﷺ من جهة الأم وإن كان من بني أمية من جهة الأب.\u003c/p\u003e\u003cp class=\"ap\"\u003eولُقّب بذي النورين لأنه تزوج ابنتي رسول الله ﷺ رقية ثم أم كلثوم، وقد توفيت رقية بعيد غزوة بدر، ثم زوّجه النبي ﷺ أختها أم كلثوم، ولم يتزوج غيرهما في حياة النبي ﷺ. وقال النبي ﷺ: «لو كانت عندي ثالثة لزوجتها عثمان». وهذا اللقب ليس لقب شرف عائلي فحسب، بل هو شهادة على وفاء نادر: فقد ماتت زوجته الأولى في وقت كانت فيه المصاهرة شرفًا، فما فتّر ذلك من صلة، وما طلب غير أختها، وكانت الثانية في بيت النبي ﷺ.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما إسلامه فكان بدعوة أبي بكر الصديق رضي الله عنه؛ فقد تبع عثمان أثر طلحة والزبير، فدخلا على رسول الله ﷺ فعرض عليهما الإسلام، وقرأ عليهما القرآن، وأنبأهما بحقوق الإسلام ووعدهما الكرامة من الله، فآمنا وصدقا. وكان إسلام عثمان مبكرًا قبل دخول الرسول ﷺ دار الأرقم، ويذكر أنه حين أسلم كمل به عشرة من المسلمين، فهو من السابقين الأولين الذين أسلموا في مكة في أول الدعوة، قبل أن يصير الإسلام قوةً وعددًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما صفاته الخلقية فقد اختلف فيها عدد من الرواة، وقال ابن سعد: لم أر بينهم اختلافًا في أنه كان رجلًا ليس بالقصير ولا بالطويل، حسن الوجه رقيق البشرة، كبير اللحية عظيمها، أسمر اللون، عظيم الكراديس، بعيد ما بين المنكبين، كثير شعر الرأس، يصفّر لحيته، وكان يشدّ أسنانه بالذهب. وهذه الصورة تجمع بين الجمال والهيبة: وجه حسن، ولحية كبيرة، وجسم بعيد ما بين المنكبين، وهو ما يجعله مهيبًا في المجلس محبوبًا في العين.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما صفاته الخُلقية فكان كبقية كبار أصحاب رسول الله ﷺ، عظيم الخلق، رفيع التهذيب، عالي التربية، كان شديد الحياء، والحياء شعبة من الإيمان. وقال بعض من وصفه: «ما رأيت أحدًا من أصحاب رسول الله ﷺ أحسن حديثًا ولا أحسن من عثمان، إلا أنه كان رجلًا يهاب الحديث». وروى ابن سعد بسنده عن أنس بن مالك أن النبي ﷺ قال: «أصدق أمتي حياءً عثمان». وتذكر بعض الروايات عن ابن عمر أن النبي ﷺ قال: «إن الملائكة لتستحي من عثمان كما تستحي من الله ورسوله».\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما تضحيته بنفسه فقد بدأت بعد أن أعلن إسلامه مباشرة؛ يروي ابن سعد بسنده أن عثمان لما أسلم أخذه عمه الحكم فأوثقه رباطًا وقال: «أترغب عن ملة آبائك إلى دين محدث؟ والله لا أحلّك أبدًا حتى تدع ما أنت عليه من هذا الدين»، فقال عثمان: «والله لا أدعه أبدًا ولا أفارقه»، فلما رأى الحكم صلابة في دينه تركه. وكانت هذه أول امتحان في طريق طويل من الثبات، ثم تكرر الامتحان في صورة أخرى حين هاجر مرتين: إلى الحبشة، ثم إلى المدينة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي الهجرة الأولى إلى الحبشة تحمّل المشاق بأهله، وهاجر بزوجته رقية بنت النبي ﷺ، فقال النبي ﷺ: «صحبهما الله، إن عثمان لأول من هاجر إلى الله بأهله بعد لوط». وفي الحديبية ذهب إلى مكة مخاطرًا بنفسه لتنفيذ أمر رسول الله ﷺ، فاحتبسته قريش، ثم يكون الصلح فيعود عثمان فيجد أن الرسول ﷺ قد بايع عنه، ونزل قوله تعالى: «لقد رضي الله عن المؤمنين إذ يبايعونك تحت الشجرة»، وكانت هذه البيعة شهادة من الله لمن بايع، وقد بايع فيها عن عثمان وهو غائب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما تضحيته بماله فحادثة بئر رومة مشهورة؛ فقد حفرها بماله حين كانت ماءً يُشترى، ثم جعلها للمسلمين. وفي جيش العسرة تبرع بثلاثمئة بعير بأحلاسها وأقتابها، وقيل إنه أتى بألف دينار فوضعها في حجر رسول الله ﷺ فجعل النبي ﷺ يقلّبها ويقول: «ما ضرّ عثمان ما عمل بعد اليوم»، مرتين. فكان ماله في خدمة الدعوة، لا في خدمة مكانته، وهذا هو الفرق بين الغني الذي يملك ماله والغني الذي يملكه ماله.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eذو النورين: لقب ووفاء\u003c/h4\u003e\u003cp class=\"ap\"\u003eلقب ذي النورين من أصدق الألقاب دلالةً على صاحبه؛ فالنوران هما ابنتا النبي ﷺ، وقد جمع بينهما في حياته، ولم يجمع بين ابنتي نبي لغيره. وقد ماتت رقية في حياة النبي ﷺ، فزوّجه أختها أم كلثوم، فكانت المصاهرة الثانية تكريمًا للأولى لا تعويضًا عنها. وهو لقب لم يُطلق على أحد قبله، ولم يجتمع لأحد بعده.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان هذا اللقب يذكّر الناس بمعنى أدق: أن الرجل لم يكن قريبًا من النبي ﷺ بالمال أو الجاه فقط، بل كان قريبًا منه بالنسب والمصاهرة والصحبة، وهذا القرب يفسّر شدة الحياء الذي عُرف به، فمن كان في بيت النبوة يرى من الأخلاق ما لا يراه غيره، فيصير الحياء خلقًا لازمًا لا تكلفًا عارضًا.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eحياؤه وأثره\u003c/h4\u003e\u003cp class=\"ap\"\u003eالحياء عند عثمان لم يكن انطواءً ولا ضعفًا في القول، بل كان ضبطًا للنفس ومراقبة لله؛ فكان قليل الكلام في مجلسه، كثير الإصغاء، لا يقطع على أحد حديثه، وإذا تكلم تكلم بحق. وقد قال عنه من صحبه: كان أحسن الناس حديثًا، لكنه يهاب الحديث، أي أنه كان يجيد القول ولا يتجرأ عليه إلا فيما ينفع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد جعل النبي ﷺ حياءه علامة على صدق إيمانه، فقال: «أصدق أمتي حياءً عثمان»، وقال: «إن الملائكة لتستحي من عثمان». وهذا الثناء يرفع الحياء من مرتبة الخلق الاجتماعي إلى مرتبة العبادة، لأن من يستحي من الله في السر يستحي من الناس في العلن، ومن كان كذلك لا يخون في مال ولا في ولاية.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eأول من هاجر بأهله\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم تكن هجرة عثمان هجرة فرد ينجو بنفسه، بل هجرة رجل خرج بأهله وولده، وقد كانت الهجرة إلى الحبشة في أول الإسلام من أشد الامتحانات؛ فالمسلم يترك داره وماله وعشيرته، ويذهب إلى بلد لا يعرف فيه أحدًا ولا يعرف لغته، ويحمل معه أهله إلى مجهول. وليس مثل هذا الفعل فعل من يبحث عن نجاة، بل فعل من يبحث عن دين.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد شهد له النبي ﷺ بأنه أول من هاجر إلى الله بأهله بعد لوط، وهذه الشهادة تجعل من هجرته سابقة في تاريخ المهاجرين، وتدل على أن التضحية بالمال والنفس لا تكتمل إلا بالتضحية بالأهل، لأن من يهاجر وحده يخاطر بنفسه، ومن يهاجر بأهله يخاطر بكل ما يملك. وقد كانت هذه السابقة شهادة نبوة لا مجرد خبر تاريخي.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالنسب\u003c/b\u003e\u003cspan\u003eأموي قرشي، يلتقي مع النبي ﷺ في عبد مناف\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eاللقب\u003c/b\u003e\u003cspan\u003eذو النورين، لتزوجه رقية ثم أم كلثوم\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eإسلامه\u003c/b\u003e\u003cspan\u003eبدعوة أبي بكر، ومن السابقين قبل دار الأرقم\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأول هجرة\u003c/b\u003e\u003cspan\u003eأول من هاجر إلى الله بأهله بعد لوط\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمن مآثره\u003c/b\u003e\u003cspan\u003eبئر رومة وجيش العسرة\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eمحطات في حياة عثمان قبل الخلافة\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمحطة\u003c/th\u003e\u003cth\u003eما جرى فيها\u003c/th\u003e\u003cth\u003eدلالتها\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالإسلام\u003c/td\u003e\u003ctd\u003eأسلم بدعوة أبي بكر وكمل به عشرة\u003c/td\u003e\u003ctd\u003eمن السابقين الأولين\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالحبشة\u003c/td\u003e\u003ctd\u003eهاجر بأهله ورقية بنت النبي ﷺ\u003c/td\u003e\u003ctd\u003eأول من هاجر بأهله بعد لوط\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالحديبية\u003c/td\u003e\u003ctd\u003eأرسله النبي ﷺ إلى مكة فاحتبسته قريش\u003c/td\u003e\u003ctd\u003eبايع النبي ﷺ عنه ونزل الرضوان\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eبئر رومة\u003c/td\u003e\u003ctd\u003eحفرها بماله وجعلها للمسلمين\u003c/td\u003e\u003ctd\u003eماله في خدمة الدعوة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالعسرة\u003c/td\u003e\u003ctd\u003eجهّز بثلاثمئة بعير وألف دينار\u003c/td\u003e\u003ctd\u003eقال النبي ﷺ: ما ضر عثمان ما عمل بعد اليوم\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eوالله لا أدعه أبدًا ولا أفارقه\u003c/p\u003e\u003ccite\u003eطبقات ابن سعد ٣/٥٥، عن القضاة ص٧٥\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eجمع عثمان بين شرف النسب وقرب المصاهرة من النبي ﷺ، وكان من السابقين إلى الإسلام، اشتهر بحيائه وتضحيته بنفسه وماله، حتى شهد له النبي ﷺ بأنه أول من هاجر بأهله، وبأن الملائكة تستحي منه.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"uthman-khilafa","n":"كيف آلت إليه الخلافة وشبهة وردّها","ic":"📜","part":"عثمان بن عفان (٢٣–٣٥هـ)","h":"\u003carticle class=\"ch3\" id=\"uthman-khilafa\" data-toc=\"كيف آلت إليه الخلافة وشبهة وردّها\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eعثمان بن عفان (٢٣–٣٥هـ)\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٢ من ٧\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٣\u003ci\u003e.\u003c/i\u003e٢\u003c/span\u003e\n            \u003ch3\u003e📜 كيف آلت إليه الخلافة وشبهة وردّها\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eك\u003c/span\u003eيف اختير عثمان بين ستة، ولماذا أُثيرت حول اختياره شبهة العشيرة والمصاهرة؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eأورد الرواة والمؤرخون روايات متقاربة في بيعة عثمان، ونسوق لك خلاصة ما رواه البخاري في صحيحه عن عمر بن ميمون قال: قال المسلمون لعمر: أوصِ يا أمير المؤمنين، استخلف. قال: «ما أحقّ بهذا الأمر من هؤلاء النفر — أو الرهط — الذين توفي رسول الله ﷺ وهو عنهم راضٍ»، فسمّى عليًا وعثمان والزبير وطلحة وسعدًا وعبد الرحمن، ثم أوصى بالمهاجرين والأنصار خيرًا. فكان عمر يعلم أن الأمر لا يستقيم إلا برجلٍ يجتمع عليه الناس، فترك الاختيار لمن شهد لهم النبي ﷺ بالرضا.\u003c/p\u003e\u003cp class=\"ap\"\u003eفلما فرغ من دفنه رضي الله عنه اجتمع هؤلاء الرهط، فقال عبد الرحمن بن عوف: «اجعلوا أمركم إلى ثلاثة منكم». فقال الزبير: «قد جعلت أمري إلى علي». وقال طلحة: «قد جعلت أمري إلى عثمان». وقال سعد: «قد جعلت أمري إلى عبد الرحمن بن عوف». فقال عبد الرحمن: «أيكم تبرّأ من هذا الأمر فنجعله إليه؟» فسكت علي وعثمان، فقال عبد الرحمن: «افتجعونه إليّ؟» أي أتجعلونه إليّ، قالا: «نعم». فصار القرار في يد واحد بعد أن تنازل الآخرون، وهذا تدبير حكيم يمنع التشاحن ويجعل المسؤولية واضحة.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم أخذ عبد الرحمن بيد أحدهما فقال: «لك قرابة من رسول الله ﷺ والقدم في الإسلام ما قد علمت، فالله عليك لئن أمرتك لتعدلنّ، ولئن أمرت عثمان لتسمعنّ ولتطعنّ»، ثم خلا بالآخر فقال مثل ذلك. ثم أخذ الميثاق، فقال: «ارفع يدك يا عثمان»، فبايعه، فبايع علي، ثم دخل الناس فبايعوه. فكانت البيعة عقدًا مشروطًا بالعدل والسمع والطاعة، لا تفويضًا مطلقًا، وهذا أصل من أصول الحكم في الإسلام.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان عبد الرحمن بن عوف قد قام باستطلاع سرّي لمعرفة رأي الناس؛ خرج حيث تخلّى فلم يسأل أحدًا عن رأيه فيمن يكون الخليفة إلا ويقول عثمان. ثم جعلها شورى، فأخرج نفسه من الأمر حتى لا يُتهم بأنه يطلبها لنفسه، وهذا من أرقى ما يُعرف في تاريخ الحكم: أن يتولى رجلٌ مهمة الاختيار ثم يخرج نفسه من دائرة المرشحين ليكون حكمه مقبولًا. فما أقدم على اختيار حتى سبر الناس، وما أعلن اختيارًا حتى اطمأن إلى قبوله، وهذه هي الشورى في أدق صورها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوهكذا بويع عثمان بن عفان خليفةً ثالثًا للمسلمين في آخر يوم من سنة ثلاث وعشرين، فاستقبل خلافته في الأول من محرم عام أربعة وعشرين. وقد دامت خلافته نحو اثنتي عشرة سنة، وهي أطول خلافة في عصر الراشدين، وقد وقعت في آخرها الفتنة التي سنفصّل القول فيها، لكن سنواتها الأولى كانت سنوات فتح وعمل وبناء. فمن حكم على عهده بالفتنة وحدها ظلمه، ومن حكم عليه بالبناء وحده أغفل آخره، والصواب أن تُقرأ السيرتان معًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما الشبهة التي أُثيرت حول اختياره فقد صوّر بعض الكتّاب تشاور الصحابة بصورة الخلاف العشائري، وأن الناس قد انقسموا إلى حزبين: حزب أموي وحزب هاشمي، كما يقول الدكتور السيد عبد العزيز سالم في كتابه «تاريخ الدولة العربية» بعد أن عرض ما نقلته كتب التاريخ من وصية عمر في كيفية اختيار الخليفة. وقد خرج عليّ — بزعمه — من الأمر حين أيقن أن الأمر قد خرج من الهاشمية ما دام عمر قد أوصى بأن يختار المرشحون من كان أقرب إلى عبد الرحمن بن عوف في جانبه، لأن عثمان كان مرتبطًا بعبد الرحمن بالمصاهرة، كما أن سعد بن أبي وقاص كان ابن عم عبد الرحمن بن عوف.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي معرض حديثه عن انسحاب ثلاثة من المرشحين وبقاء ثلاثة يقول: «وهكذا انقسم الناس إلى فريقين: فريق يؤيد عثمان وفريق يؤيد علي، ومعنى ذلك أنهم انقسموا إلى حزبين: حزب أموي وحزب هاشمي». وهو تصور موهوم، واستنتاج مردود لا دليل عليه، إذ أنه ليس نابعًا من ذلك الجو الذي كان يعيشه أصحاب رسول الله ﷺ حينما كان المهاجر يقف مع الأنصاري ضد أخيه وابن عمه وعشيرته، وليس نابعًا من تصور هؤلاء الصحب وهم يضحون بكل شيء من حطام الدنيا في سبيل أن يسلم لهم دينهم، ولا من المعرفة الصحيحة لهؤلاء النخبة من المبشرين بالجنة.\u003c/p\u003e\u003cp class=\"ap\"\u003eفالأحداث الكثيرة التي رويت عن هؤلاء تثبت أن هؤلاء كانوا أكبر بكثير من أن ينطلقوا من هذه الزاوية الضيقة في معالجة أمورهم، فليست القضية تمثيلًا عائليًا أو عشائريًا، فهم أهل الشورى لمكانتهم في الإسلام لا غير. ثم إن الكاتب يناقض نفسه بعد أن يذكر هذه الشبهة الخطيرة، فيعتمد في سرده لكيفية الاختيار نصوصًا تثبت أن الاختيار إنما كان شورى من جميع الناس خاصتهم وعامتهم، لكنه لم يشأ أن يعلن اختياره للخليفة قبل أن يعرف مشاعر الناس.\u003c/p\u003e\u003cp class=\"ap\"\u003eفقد خرج عبد الرحمن بن عوف يلتقي الناس في أنقاب المدينة ملثمًا لا يعرفه أحد، فما ترك أحدًا من المهاجرين والأنصار وغيرهم من ضعفاء الرأي ورعاعهم إلا سألهم واستشارهم، أما أهل الرأي فأتاهم مستشيرًا وتلقى غيرهم سائلًا يقول: من ترى الخليفة بعد عمر؟ فلم يلق أحدًا يستشيره ولا يسأله إلا ويقول عثمان. فلما رأى اتفاق الناس عاد إلى المسجد. وهذا الكلام يصور حقيقة ما جرى، إذن فلم يكن اختيار عبد الرحمن لعثمان لقرابته ومصاهرته، ولم يكن هذا هو رأي عبد الرحمن وحده بل كان رأي المسلمين جميعًا من أهل الخاصة ومن أهل الشورى والعامة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأستطيع أن أقول بأن هذا الاستطلاع الواسع لآراء الناس بشكل سرّي ينفي نفيًا قاطعًا أية شبهة تُدعى ضد عبد الرحمن بن عوف، ويثبت نزاهته وحرصه الشديد على تأدية المهمة الموكلّة إليه، وتبليغ الأمانة التي لزمت عنقه. فمن يخرج نفسه من المرشحين، ثم يطوف على الناس سرًّا يسألهم، ثم يبايع من أجمعوا عليه، لا يمكن أن يُتهم بأنه قدّم قريبه أو صهره، لأن اختياره لم يكن رأيًا فرديًا حتى يُقال فيه ما قيل.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالستة الذين أوصى بهم عمر\u003c/h4\u003e\u003cp class=\"ap\"\u003eاختار عمر ستةً من أصحاب الشورى، وهم الذين توفي النبي ﷺ وهو عنهم راضٍ، وهذا الاختيار نفسه دليل على أن عمر لم يشأ أن يورّث الخلافة لولده ولا لأسرته، مع أنه كان يستطيع، وقد كان له بنون فيهم من الصلاح ما فيهم، فترك الأمر لأهل الشورى. وهذا وحده يكفي في بيان أمانته على الأمة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الستة ثلاثة من العشرة المبشرين بالجنة، وفيهم صهر النبي ﷺ وابن عمه، وفيهم من هو من قبيلة أخرى، وهذا التنوع هو الذي جعل الشورى حقيقية، لأن التشاور بين متجانسين في النسب والمصلحة لا يكون تشاورًا، وإنما يكون تبادلًا للمصالح. أما التشاور بين رجال من بيوت مختلفة وأمزجة متباينة فهو الذي يُخرج الرأي الأرجح.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالميثاق والبيعة\u003c/h4\u003e\u003cp class=\"ap\"\u003eمن أدق ما في هذه البيعة أن عبد الرحمن بن عوف لم يقل لعثمان: أنت الخليفة، بل قال له: «فالله عليك لئن أمرتك لتعدلنّ»، وقال لعلي مثل ذلك. فهي بيعة على شرط، والشرط هو العدل، ومن نقض الشرط فقد نقض العقد، وهذا أصل سياسي عظيم سبق به الإسلام كل النظم التي جاءت بعده.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم أخذ الميثاق من كليهما، ثم رفع يد عثمان فبايعه، فبايع عليٌّ بعده، ثم دخل الناس فبايعوا. ولم يكن في هذا ترتيبٌ عائلي ولا حساب قبلي، بل كان ترتيبًا في المسؤولية: الأول من بايع هو من وكّله الستة، والثاني هو من نافسه، ثم العامة، فكانت البيعة سلسلةً متصلة من الأمانة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالشبهة والردّ عليها\u003c/h4\u003e\u003cp class=\"ap\"\u003eالشبهة تقول: إن عثمان فاز بالخلافة لأنه صهر عبد الرحمن بن عوف، ولأن سعد بن أبي وقاص ابن عمه، فكانت القرابة هي الميزان. والردّ عليها من ثلاثة أوجه: الأول أن عبد الرحمن أخرج نفسه من الأمر، فلو كان يطلب لصهره لما احتاج إلى استطلاع رأي الناس سرًّا. والثاني أن عليًا نفسه بايع عثمان طائعًا، ولو رأى في الأمر حيفًا لما بايع. والثالث أن الناس بايعوا عامةً، والبيعة العامة لا تُجبر أحدًا على ما لا يرضاه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالأهم أن هذا التصور يفترض في الصحابة أنهم كانوا يتصرفون بعقلية العشيرة، وهذا يخالف كل ما عُرف عنهم من التضحية في سبيل الدين؛ فقد خرجوا من ديارهم وأموالهم، وتركوا آباءهم وأبناءهم، وقاتلوا أقاربهم في بدر وأحد، فكيف يُعقل أنهم في مسألة الخلافة يعودون إلى منطق العشيرة الذي حاربوه؟ إن هذا الاستنتاج مردود لأنه يبني على مقدمة لم تثبت، ويهدم ما ثبت بالتواتر من سيرتهم.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأوصى بالشورى\u003c/b\u003e\u003cspan\u003eستة من الصحابة توفي النبي ﷺ وهو عنهم راضٍ\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمنسحبون\u003c/b\u003e\u003cspan\u003eالزبير لعلي، وطلحة لعثمان، وسعد لعبد الرحمن\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالميثاق\u003c/b\u003e\u003cspan\u003eبيعة على شرط العدل والسمع والطاعة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالاستطلاع\u003c/b\u003e\u003cspan\u003eخرج عبد الرحمن سرًّا يسأل الناس فما وجد إلا عثمان\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالتاريخ\u003c/b\u003e\u003cspan\u003eبويع آخر سنة ٢٣هـ، واستقبل خلافته في محرم ٢٤هـ\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eخطوات اختيار عثمان\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالخطوة\u003c/th\u003e\u003cth\u003eتفصيلها\u003c/th\u003e\u003cth\u003eدلالتها\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eوصية عمر\u003c/td\u003e\u003ctd\u003eسمّى ستة وأوصى بالمهاجرين والأنصار\u003c/td\u003e\u003ctd\u003eلم يورّث الخلافة لأسرته\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eتنازل الثلاثة\u003c/td\u003e\u003ctd\u003eالزبير لعلي، وطلحة لعثمان، وسعد لعبد الرحمن\u003c/td\u003e\u003ctd\u003eتضييق دائرة الخلاف\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eتفويض عبد الرحمن\u003c/td\u003e\u003ctd\u003eسأل عليًا وعثمان: أفتجعونه إليّ؟\u003c/td\u003e\u003ctd\u003eمسؤولية واضحة أمام الأمة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالميثاق\u003c/td\u003e\u003ctd\u003eالله عليك لئن أمرتك لتعدلنّ\u003c/td\u003e\u003ctd\u003eالبيعة عقد مشروط بالعدل\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالاستطلاع السري\u003c/td\u003e\u003ctd\u003eسأل الناس في أنقاب المدينة\u003c/td\u003e\u003ctd\u003eالاختيار نتيجة إجماع لا محاباة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالبيعة العامة\u003c/td\u003e\u003ctd\u003eبايع عثمان ثم علي ثم الناس\u003c/td\u003e\u003ctd\u003eشرعية لا تُنتزع بالقرابة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eلك قرابة من رسول الله ﷺ والقدم في الإسلام ما قد علمت، فالله عليك لئن أمرتك لتعدلنّ، ولئن أمرت عثمان لتسمعنّ ولتطعنّ\u003c/p\u003e\u003ccite\u003eصحيح البخاري ٧/٦١، عن القضاة ص٧٦\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eآلت الخلافة إلى عثمان باختيار ستةٍ فوضوا عبد الرحمن بن عوف، فاستطلع رأي الناس سرًّا فلم يجد إلا عثمان، فبايعه على شرط العدل، ثم بايع الناس. والشبهة التي أُثيرت حول مصاهرته مردودة بنزاهة الاستطلاع وببيعة عليٍّ وبالبيعة العامة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"uthman-fitna","n":"الفتنة التي أودت بمقتله","ic":"🕯️","part":"عثمان بن عفان (٢٣–٣٥هـ)","h":"\u003carticle class=\"ch3\" id=\"uthman-fitna\" data-toc=\"الفتنة التي أودت بمقتله\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eعثمان بن عفان (٢٣–٣٥هـ)\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٣ من ٧\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٣\u003ci\u003e.\u003c/i\u003e٣\u003c/span\u003e\n            \u003ch3\u003e🕯️ الفتنة التي أودت بمقتله\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eك\u003c/span\u003eيف انتهت خلافة امتدت اثنتي عشرة سنة بحصارٍ في الدار وقتلٍ في جوف الليل؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eلقد أخبر الرسول ﷺ عثمان عن بلوى تصيبه، وبشّره أيضًا الرسول ﷺ بالشهادة هو وعمر، كما روى البخاري أن الرسول ﷺ صعد أُحدًا ومعه أبو بكر وعمر وعثمان، فرجف فقال: «اسكن أُحد، فليس عليك إلا نبي وصديق وشهيدان». فكان في هذا الخبر إعلامٌ مسبق بأن عثمان سيموت شهيدًا، وأن ما سيقع عليه ليس عقوبةً على ذنب، بل بلاءً يُكتب له به أجر الشهادة. وهذا يضع الحادثة كلها في باب الابتلاء لا في باب العقوبة، ويغيّر نظر القارئ إليها تغييرًا كاملًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوسُمّيت الفتنة فتنةً لأنها فتنت الناس، وامتحنت به دينهم وأخلاقهم وثباتهم على المبدأ والعقيدة، فقد فرّقت الناس شيعًا وأحزابًا. وقد صدق الله العظيم إذ يقول: «والفتنة أشد من القتل»، فما جرى في تلك الأيام لم يكن قتل رجل واحد، بل كان انقسامًا في الأمة استمر أثره قرونًا، وفتح بابًا للتأويل والتكفير والاقتتال. وكان ذلك أشد على الأمة من فقد خليفتها، لأن الخليفة يُستخلف، وأما الشقاق في النفوس فيبقى أجيالًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالروايات الواردة في سرد أحداث الفتنة كثيرة، ولكنها متناقضة ومتضاربة، ولذلك فلا بد من إخضاع هذه الروايات لعملية النقد بنوعية: النقد الخارجي والنقد الداخلي. وسنفرد للروايات وأسانيدها فصلًا، ونقتصر هنا على سرد ما صحّ منها، فنقول: إن الفتنة بدأت بوفودٍ قدمت من الأمصار إلى المدينة بزعم المظالم، وكان أكثرهم من مصر، ومعه نفر من أهل الكوفة والبصرة، وقد حرّكهم ما بلغهم من كتبٍ متبادلة تُصوّر الظلم وتُهيّج النفوس.\u003c/p\u003e\u003cp class=\"ap\"\u003eفخرج عثمان رضي الله عنه إليهم ودعاهم إلى الاحتكام إلى كتاب الله، فاحتكموا وردّ عليهم كثيرًا من التهم الباطلة وأقنعهم بذلك، وأقرّ لهم بأخطاء يسيرة واستغفر ربه عنها، وتعاهدوا وتعاهد، وأخذ عليهم ألا يشقّوا عصا الطاعة، ولا يفارقوا جماعة. ثم غادروا أماكنهم باتجاه بلدانهم، فكان هذا أول صلح يُعقد في الفتنة، ولو ثبت الناس عليه لسلمت الأمة، ولكن اليد الخفية كانت تعمل في الخفاء.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم إن الوفد المصري عاد إلى المدينة بعد أيام، وزعموا أنهم أخذوا مع البريد كتابًا موقعًا من عثمان يأمر عامله بقتلهم. فجاءوا إلى عليّ بن أبي طالب فقالوا: أخذنا مع البريد كتابًا موقعًا من عثمان يأمر عامله بقتلنا، فقال علي: «كيف علمتم؟» قالوا: علمنا ذلك من أهل البصرة، ومن أهل الكوفة، فقال علي: «وقد سرتم مراحل على طريق بذلكم؟ هذا والله أمر أُبرم بالمدينة».\u003c/p\u003e\u003cp class=\"ap\"\u003eوهنا يقف بنا الكتاب عند قصة الكتاب المزور ليكشف ثلاث حقائق: الأولى أن معرفة أهل البصرة وأهل الكوفة بذلك تثبت أن الأمر فعلًا قد اتفق عليه في المدينة، لأن طريق أهل مصر كان باتجاه معاكس لطريق أهل الكوفة والبصرة. والثانية أن بعض الروايات الصحيحة تذكر أن حامل الكتاب كان يسير على مقربة من أهل مصر فيتعرض لهم ثم يرجع إليهم ثم يفارقهم ويسابقهم، حتى قالوا له: مالك؟ إن لك لأمرًا ما شأنك؟ فقال: أنا رسول أمير المؤمنين إلى عامله بمصر، ففتشوه فإذا هم بالكتاب، وواضح أن هذا الرجل كان قاصدًا أن يُعرف ويُثير الشبهة حوله.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالثالثة أن عثمان قد طلب منهم التحقق من ذلك، فقال: إما أن تشهدوا عليّ رجلين من المسلمين، أو أن أحلف لكم يمينًا أن هذا ليس بكتابي، بل زُوّر عليّ، ونُقش الخاتم على الخاتم. بل طلب منهم أن يحكّموا فيه بعض الذين هم معرفة بالخطوط. ولكن المتمردين أبَوا وقالوا: قد أحلّ الله دمك ونقضت العهد والميثاق. فكان رفضهم للبينة دليلًا على أنهم لم يريدوا الحقيقة، بل أرادوا الذريعة.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم قام عثمان على المنبر ليدافع عن نفسه، فحصبه المتمردون بالحجارة حتى سقط مغشيًا عليه، فحُمل إلى بيته، وجاءه علي وطلحة والزبير يعودونه ويشكون بثّهم، ثم رجعوا إلى منازلهم فلا حول لهم ولا قوة. فقد خرج معظم أهل المدينة إلى الحج، ولزم أهل المدينة بيوتهم لا يخرج منهم أحد، ولا يجلس إلا وعليه سيفه خوفًا على نفسه، وحاصر المتمردون المدينة أربعين يومًا. وكان التوقيت الذي اختاروه مهمًا، إذ أن كثيرًا من أهل المدينة قد خرجوا إلى الحج في الفترة التي غادر فيها هؤلاء المدينة وقبل عودتهم إليها ثانيًا بعد ادعاء العثور على الكتاب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكتب عثمان إلى الأمصار يستنجد بهم، وقال في كتابه عن المتمردين: «إنهم أغاروا علينا في جوار رسول الله ﷺ وحرمة وأرض الهجرة، وثاب إليهم الأعراب، فهم كالأحزاب أيام الأحزاب». فخرج المسلمون من أهل الأمصار لنجدة عثمان، ولكنهم سمعوا قبل وصولهم بمقتل عثمان فعادوا إلى بلادهم. وقد قام على حراسة عثمان عدد من أبناء الصحابة، منهم الحسن بن علي ومحمد بن طلحة وعبد الله بن الزبير، فجلسوا بالباب حسبما أمرهم به آباؤهم ووصّاهم في ذلك كثير، ولزم عثمان الدار.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم حال المتمردون بين عثمان ووصول الماء إليه، وجاءت أم حبيبة رضي الله عنها زوج رسول الله ﷺ على بغلة لها والماء معها لتوصله إلى عثمان، فقيل لهم إنها أم المؤمنين أم حبيبة، فضربوا وجه بغلتها وقطعوا الجبل بالسيف، فهربت البغلة بأم المؤمنين وكادت ذلك اليوم تُقتل رضي الله عنها. فكان منع الماء عن خليفة المسلمين في داره جريمةً تكشف أن القوم خرجوا عن كل حد، وأنهم لم يبقَ لهم غرض إلا القتل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوخشي المتمردون قدوم النجدة من الأمصار، فرأوا أنه لا ينجيهم إلا قتل عثمان، لأن الناس سينشغلون بقتله. فاقتحموا الدار ودخلوها، ودخل رجال لقتله وكان بيده القرآن يقرأ به، فكان كلما دخل إليه رجل قال له: «بيني وبينك كتاب الله»، فيستحي ويخرج، حتى دخل إليه الغافقي فضربه بحديدة، وضرب المصحف برجله، وجاءت زوجته نائلة بنت الفرافصة تحتجز عنه أحد الجُرمين فضرب يدها فقطع أصابعها، وضرب عثمان فقتله.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم قتلوا غلمانًا لعثمان ونهبوا داره، وقصدوا بيت المال لينهبوه ولم يستطع أحد من الصحابة أن يقترب منه. فلما كان جوف الليل خرج مروان وأتى ببعض الصحابة وبعض النساء والصبيان، ثم حملوا عثمان إلى البقيع فدفنوه فيه، ودفنوا بعض غلمان عثمان الذين قُتلوا، لكنهم لم يستطيعوا أن يصلوا إلى غلامين آخرين لُقيا خارج الدار فأكلتهما الكلاب. وكان مقتل عثمان رضي الله عنه يوم الجمعة في الثامن عشر من ذي الحجة عام خمسة وثلاثين.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالوفود والكتاب المزور\u003c/h4\u003e\u003cp class=\"ap\"\u003eبدأت الفتنة بمطالبَ ظاهرها الإصلاح: طعنٌ في ولاة الأمصار، ومطالبةٌ بعزل بعضهم، وشكوى من مظالم مكتوبة. ولو كان أصحابها يريدون الإصلاح لرجعوا إلى الخليفة بالبينة، ولكنهم جاءوا بأوراق لا شاهد عليها، ثم لما طُلب منهم الشهود أبَوا، فظهر أن الغرض ليس إصلاحًا بل إسقاطًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقصة الكتاب المزور هي مفتاح الفتنة؛ فحامل الكتاب تعمّد أن يُرى ويُفتّش، والكتاب نفسه لا يحمل شاهدًا واحدًا، وعثمان طلب البينة أو اليمين أو تحكيم العارفين بالخطوط، وكل ذلك رُفض. فمن يرفض كل طرق التحقق لا يبحث عن حقيقة، بل يبحث عن ذريعة، وقد وجدها في الكتاب المزور.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eحصار الدار\u003c/h4\u003e\u003cp class=\"ap\"\u003eدام الحصار أربعين يومًا، مُنع فيها الماء عن دار الخليفة، وهو أشد ما يُفعل بمحارب، فكيف بشيخٍ في داره؟ وقد خرجت أم حبيبة بالماء فضُربت بغلتها بالسيف، وهذا المشهد وحده يكفي للدلالة على أن القوم تجاوزوا كل حرمة، ولم يبقَ في نفوسهم تعظيم لصاحب النبي ﷺ ولا لزوجته.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي أثناء الحصار كان أبناء الصحابة يحرسون بابه، وقد أمرهم آباؤهم بذلك، فكان الحسن بن علي ومحمد بن طلحة وعبد الله بن الزبير في مقدمة المدافعين. وهذا يدل على أن أهل المدينة لم يكونوا راضين بما يجري، ولكن القوة كانت بيد الغوغاء، والفتنة إذا قامت صارت العصمة فيها لمن حمل السلاح لا لمن كان معه الحق.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالقتل والدفن\u003c/h4\u003e\u003cp class=\"ap\"\u003eقُتل عثمان وهو يقرأ في المصحف، وقد قال لكل من دخل عليه: «بيني وبينك كتاب الله»، فكان هذا القول آخر حجة له، وكان المصحف آخر ما بينه وبين قاتله. وقطع أصابع زوجته نائلة وهي تدافع عنه، ثم نُهبت داره وقتل غلمانه، فلم تبقَ حرمة إلا انتُهكت. وقد كان المصحف في يده حين وقع السيف، فأصابت الحديدة المصحف والجسد معًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eودُفن في البقيع ليلًا، ولم يستطع الصحابة أن يخرجوا بجنازته في النهار خوفًا من المتمردين، حتى إن غلامين من غلمانه أُلقيا خارج الدار فأكلتهما الكلاب. وهذه التفاصيل القاسية تُصوّر حجم الفوضى التي عمّت المدينة في تلك الأيام، وتُبيّن أن الفتنة لا تُبقي على شيء، وأن أول ما يُفقد فيها هو الأمن.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eبداية الفتنة\u003c/b\u003e\u003cspan\u003eوفود من الأمصار بزعم المظالم\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالحصار\u003c/b\u003e\u003cspan\u003eأربعون يومًا مُنع فيها الماء\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالحراسة\u003c/b\u003e\u003cspan\u003eالحسن بن علي ومحمد بن طلحة وابن الزبير\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالقاتل\u003c/b\u003e\u003cspan\u003eالغافقي، والروايات تختلف في اسمه\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالتاريخ\u003c/b\u003e\u003cspan\u003eالجمعة ١٨ ذي الحجة سنة ٣٥هـ\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eمراحل الفتنة ومقتل عثمان\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمرحلة\u003c/th\u003e\u003cth\u003eما جرى فيها\u003c/th\u003e\u003cth\u003eالنتيجة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالوفود\u003c/td\u003e\u003ctd\u003eقدوم نفر من مصر والكوفة والبصرة\u003c/td\u003e\u003ctd\u003eالطعن في الولاة والمطالبة بالعزل\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالصلح الأول\u003c/td\u003e\u003ctd\u003eخرج عثمان فدعاهم إلى كتاب الله\u003c/td\u003e\u003ctd\u003eتعاهدوا على الطاعة وعادوا\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالكتاب المزور\u003c/td\u003e\u003ctd\u003eزعموا أن مع البريد كتابًا بقتلهم\u003c/td\u003e\u003ctd\u003eرفضوا البينة واليمين\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالحصار\u003c/td\u003e\u003ctd\u003eأربعون يومًا ومنع الماء\u003c/td\u003e\u003ctd\u003eحصار الدار وضرب أم حبيبة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالاقتحام\u003c/td\u003e\u003ctd\u003eدخلوا الدار وقتلوه وهو يقرأ\u003c/td\u003e\u003ctd\u003eقتل الخليفة ونهب الدار\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالدفن\u003c/td\u003e\u003ctd\u003eدُفن ليلًا في البقيع\u003c/td\u003e\u003ctd\u003eانتهاء عهد عثمان وبدء الفتنة الكبرى\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eبيني وبينك كتاب الله\u003c/p\u003e\u003ccite\u003eتاريخ الطبري ٤/٣٧٨، عن القضاة ص٩٢\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eبدأت الفتنة بوفودٍ طالبت بالإصلاح ثم رفضت كل بينة، وانتهت بحصار أربعين يومًا وقتل الخليفة وهو يقرأ القرآن، فكان مقتله يوم الجمعة في الثامن عشر من ذي الحجة سنة خمس وثلاثين، ودُفن ليلًا في البقيع.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"uthman-naqd","n":"نقد روايات الفتنة","ic":"🔍","part":"عثمان بن عفان (٢٣–٣٥هـ)","h":"\u003carticle class=\"ch3\" id=\"uthman-naqd\" data-toc=\"نقد روايات الفتنة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eعثمان بن عفان (٢٣–٣٥هـ)\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٤ من ٧\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٣\u003ci\u003e.\u003c/i\u003e٤\u003c/span\u003e\n            \u003ch3\u003e🔍 نقد روايات الفتنة\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eك\u003c/span\u003eيف نقرأ رواياتٍ متناقضة عن مقتل خليفة، وأيها نصدّق؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eلمّا كانت روايات الفتنة متناقضة ومتضاربة، لم يكن بدٌّ من إخضاعها لعملية النقد بنوعية: النقد الخارجي والنقد الداخلي. فأما الخارجي فتحكيمه في علم مصطلح الحديث لنعرف صحيح هذه الروايات من كاذبها، وأما الداخلي فعملية النقد للأخبار من حيث تتلاءم وتنسجم في صحتها وضبطها، وتتسق في منطقها، وكذلك من حيث موافقتها للروايات الصحيحة التي اقتصرت على ذكر جزئيات من أخبار هذه الفتنة مما ذكرته كتب الحديث المعتمدة أو كتب التاريخ المسندة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كتب عدد من الأخباريين المسلمين كتبًا ذكروا فيها أخبار هذه الفتنة، ولكن لم يصلنا إلا ثلاث روايات متكاملة لكبار هؤلاء المؤرخين، وهم: رواية أبي مخنف لوط بن يحيى (ت ٢٥٧هـ) نقلها البلاذري، ورواية محمد بن عمر الواقدي (ت ٢٠٧هـ) نقلها البلاذري والطبري، ورواية سيف بن عمر التميمي (ت ١٨٠هـ تقريبًا) نقلها الطبري. وأما بقية الأخبار فلا تسرد الحادثة، بل تذكر جزئيات بعضها نقل بأسانيد صحيحة وبعضها ليس كذلك.\u003c/p\u003e\u003cp class=\"ap\"\u003eفأبو مخنف لا يَعزِل عثمان عن مظهر الخليفة الذي كثرت سقطاته، فاستحق ما استحق، وأن يبيّن أن طلحة كان من المحرضين على عثمان والثائرين عليه، ويظهر عليًا بمظهر من يعطف على عثمان ويدافع عنه مع غضبه من أفعاله وأقواله. ومن هنا فإننا نحكم عليه من خلال علوم الحديث فلا نجد أساسًا إلا القاعدة التي تقول: إن صاحب البدعة أو المذهب السياسي لا يقبل خبره فيما يدعم بدعته، وهذا في صاحب البدعة الثقة، فإننا لا نقبل هذا النوع من روايته. فما ظنك بمن كان ممن يُروى ما يؤيد بدعته؟ فهذا أحرى أن لا تقبل روايته.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما الواقدي فنرى في روايته التشنيّع على عثمان، حتى إن الطبري تورّع عن نقل كثير من أخباره لبشاعتها. ولا يتورع الواقدي بإظهار الصحابة بمظهر المتآمرين على عثمان، ويخص بالذكر منهم طلحة، وأن عليًا مخالف لعثمان، وأما محمد بن أبي بكر فهو عنده القاتل. ويعرض الواقدي على أهل الجرح والتعليل ما يَحمِلهم على التحذير منه، فالنسائي والشافعي يتهمانه بالكذب والوضع، ويحثّ البخاري وغيره على عدم الأخذ بروايته، ويقول الذهبي: استقر الإجماع على وهن الواقدي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما سيف بن عمر فنجده يسلك مسلكًا غير مسلك أبي مخنف والواقدي، فيعرض تسلسلًا تاريخيًا ليس فيه تهمة للصحابة بل تبرئة لهم. ومع ذلك نجد أن بعض المحدثين يعدونه ضعيفًا، ويتركون الرواية عنه لأنه متهم بالزندقة. ولكن حاصل التحقيق في سيف أن اتهامه بالزندقة لا دليل عليه، ولم يتهمه أحد ممن عاصره، وإنما اتهمه المتأخرون كابن حبان والحاكم. وأما اتهامه بالكذب فمنشؤه وقوع أغلاط في مروياته بالحديث، وذلك لعدم عنايته بالحديث، ولم يظهر في رواياته ما يدل على تعمّد الكذب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما في التاريخ فقد عُني به واعتمد عليه علماء الحديث على الرد والفتوح، ونقل الحافظ ابن حجر في كتابه فتح الباري أقوالًا من هذا الكتاب واستدل بها. والنظر في روايات سيف التاريخية يثبت ذلك، لأنه لم يأت في روايته بشيء يخالف الثقات، وإنما جاءت رواياته موثقة ومفصلة لبعض جزئيات الحوادث التي رويت بطرق وأسانيد صحيحة مقبولة، وهذا دليل الصدق في النقل. وما أحسن قول الحافظ ابن حجر في حقه: ضعيف في الحديث، عمدة في التاريخ. والجدير بالذكر أنه ليس من هؤلاء الثلاثة رواية في بعض الكتب الستة إلا سيف بن عمر هذا.\u003c/p\u003e\u003cp class=\"ap\"\u003eفإن الواقدي وأبا مخنف يوضحان لنا خبر تلك الأيدي، فإذا هي أيدي الصحابة الذين كانون حول عثمان، كطلحة والزبير وعائشة وعمرو بن العاص ومحمد بن أبي بكر وعمار بن ياسر، وإذا هم مشتركون في إثارة الناس على عثمان وتحريك الفتنة وتوجيهها. لكن قليلًا من التفكير يبعد اشتراكهم أو اشتراك بعضهم في الأمر، فهل يعقل أن يكون طلحة والزبير وعائشة وعمرو بن العاص مشتركين في توجيه الفتنة وإضرام نارها، وهم الذين شدّدوا على الخليفة علي بن أبي طالب في المطالبة بدم عثمان فيما بعد؟\u003c/p\u003e\u003cp class=\"ap\"\u003eفمهما أشطط الفكر وغلبنا سوء الظن فلا يمكن أن نذهب مذهبًا يسخر فيه من عقولنا ومعاييرنا. فهذا تناقض في التفكير، وسقوط في الاستنتاج، يقوده الهوى الذي يعمي الأبصار من رؤية الحقيقة. فقد كان في جيش علي — بالرغم عنه — عدد ممن حاصروا عثمان حتى أدّت إلى قتله، وهؤلاء المحاصرون كانوا يعرفون أن طلحة والزبير وعائشة وعمرو بن العاص من أصحابهم الذين حركوا الناس وحرضوهم على عثمان، فلو كان كذلك لرفعوا صوتهم يهزؤون بهم ويدفعونهم الحجة، إذ كيف يطالبون بدم عثمان وهم حرّضوا على قتله؟ فليكن جديدين ومنطقيين، ولنستبعد إشتراك هؤلاء الصحابة في تحريك الفتنة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوملخص رواية سيف بن عمر في الفتنة ومقتل عثمان: كان عبد الله بن سبأ يهوديًا من أهل صنعاء أسلم زمن عثمان، ثم تنقّل بين البلدان يحاول إضلالهم، بدأ بالحجاز ثم البصرة ثم الكوفة ثم الشام، فلم يستجب له إلا في مصر، فاستقر عندهم وبدأ ينشر سمومه، وهذه اليد الخفية هي التي تُنسب إليها الفرقة السبئية ذات العقيدة الشاذة. وكان مما يقوله لهم: أعجب ممن يزعم أن عيسى سيرجع ويُكذّب بأن محمدًا سيرجع، وقد قال الله: «إن الذي فرض عليك القرآن ليرادك إلى معاد». فمحمد أحق بالرجوع من عيسى. فقبل أهل مصر ذلك، ووضع لهم عقيدة الرجعة.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم قال لهم: إن محمدًا خاتم الأنبياء وعلي خاتم الأوصياء، ومن أظلم ممن لم ينفّذ وصية رسول الله ﷺ؟ وتناول أمر هذه الأمة ويقصد بذلك عثمان. ثم قال: إن عثمان أخذها بغير حق، وهذا وصيّ رسول الله فانهضوا في هذا الأمر فحرّكوه. وقد وجّه أصحابه لتحقيق ذلك عن طريق إظهار الأمر بالمعروف والنهي عن المنكر، وذلك بالطعن في ولاة الأمصار ومطالبهم، وكتب إلى أتباعه في الأمصار لتنفيذ هذا الأمر تحت شعار الأمر بالمعروف والنهي عن المنكر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأخذ أتباعه في كل قطر يكتبون كذبًا وبهتانًا عن المظالم والمفاسد التي عندهم، ويرسلونها إلى الأقطار الأخرى، فتُقرأ الكتب على مسامع من الناس، فيقول أهل كل قطر: إنا لفي عافية مما ابتُلي به هؤلاء. فداعٍ في كل مكان أن المفاسد والبقايا قد عمّت، وأن الحال قد بلغ من السوء مبلغه، وأصبح أصحاب كل قطر يتصورون بأن الأقطار الأخرى تعاني من الظلم والفساد وسوء الحال إلا قطرهم، لأنهم لا يرون شيئًا من ذلك.\u003c/p\u003e\u003cp class=\"ap\"\u003eوشعر عثمان بأن شيئًا يُحاك في الأمصار، فكتب إليهم: «أما بعد: فإني آخذ العمال بموافاتي في كل موسم، وقد سلّطت الأمة منذ وليت على الأمر بالمعروف والنهي عن المنكر، فلا يرفع عليّ شيء ولا على أحد من عمالي إلا أعطيته، وليس لي ولعيالي حق قبل الرعية إلا مأزوك لهم، وقد رفع إليّ أهل المدينة أن أقوامًا يُشتمون وآخرين يُضربون، فمن ادّعى شيئًا من ذلك فليوافِ الموسم، فليأخذ بحقه حيث كان من عملي أو من عمالي، أو تصدّقوا فإن الله يجزي المتصدقين». فلما قُرئ في الأمصار بكى الناس ودعوا لعثمان، وقالوا: إن الأمة لتمحض بشرًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالواقع أنها كانت تمحض بشرًّا كبيرًا، فابن سبأ ما زال يُغري قلوب الناس ويحرضهم على التمرد ضد الخليفة، وكان له أتباع في الكوفة والبصرة ومصر، وهو ينسّق بينهم حسب ما يريد ويخطط. وهكذا سيّرهم جميعًا إلى المدينة ليحاجّوه في المظالم — على زعمهم — ويذكروا له أخطاءه، ويحملوه على الاعتراف بها، فإن فعل زعموا بعد ذلك أنه لم يتركها ولم يتب، فيحلّ لهم بذلك دمه، ويتولى الخلافة من هو أحق بها منه — بزعمهم.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالنقد الخارجي: ثلاثة مؤرخين\u003c/h4\u003e\u003cp class=\"ap\"\u003eالثلاثة الذين وصلتنا رواياتهم هم أبو مخنف ولوط بن يحيى، ومحمد بن عمر الواقدي، وسيف بن عمر التميمي، وكلهم من القرن الثاني والثالث، وكلهم كتب عن الفتنة بغير إسناد متصل في كثير من المواضع. ومع ذلك فبينهم فروق كبيرة في المنهج: فأبو مخنف يميل إلى الأخبار المثيرة، والواقدي يميل إلى التفصيل البشع، وسيف يميل إلى السرد المتصل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأهل الحديث لم يقبلوا من هؤلاء إلا ما وافق أصولهم، فردّوا الواقدي وأبا مخنف، وقبلوا سيفًا في التاريخ دون الحديث. وهذا التفريق دقيق، لأن الرجل قد يكون ضابطًا لأخبار الناس غير ضابط لأحاديث النبي ﷺ، والعكس، ومن لم يفرّق بين البابين خلط بين ما يُقبل وما يُردّ.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالنقد الداخلي: تناقض الرواية\u003c/h4\u003e\u003cp class=\"ap\"\u003eأقوى ما في النقد الداخلي أنه يعتمد على المنطق لا على السند؛ فإذا كانت الرواية تقول إن طلحة والزبير وعائشة حرّضوا على عثمان، ثم تقول إنهم طالبوا بدمه، فهذه رواية تُنقض نفسها، لأن من حرّض على القتل لا يطالب بالقصاص من القاتل، ولأن من أراد الملك لا يبدأ بإشعال فتنة تُحرق الجميع.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم إن هؤلاء كانوا في جيش علي، وكان في جيشه أيضًا من حاصر عثمان، فكيف يجتمع المحرّض والمحاصر والمطالب بالدم في صف واحد؟ إن هذا لا يستقيم إلا إذا كان القتل قد وقع بيدٍ ثالثة تعمل في الخفاء، وهي التي أشار إليها سيف بن عمر، وسمّاها باسم عبد الله بن سبأ وأتباعه.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eرواية سيف: قراءة في المنهج\u003c/h4\u003e\u003cp class=\"ap\"\u003eرواية سيف لا تبرّئ الصحابة تبرئةً مجانية، بل تفسّر الحادثة بتفسير يضعها في سياق الصراع بين الإسلام ودسائس أعدائه، وهذا السياق له شواهد في القرآن والسيرة، فقد حذّر القرآن من المنافقين الذين يبثون الفتنة، وحذّر النبي ﷺ من أن يتحدث الناس بأن محمدًا يقتل أصحابه.\u003c/p\u003e\u003cp class=\"ap\"\u003eومع ذلك فلا تُقبل روايته على عمومها، بل تُعرض على المقتطفات الصحيحة، فما وافقها قُبل، وما خالفها رُدّ، وما لم يرد فيه شيء يُتوقف فيه. وهذا هو المنهج الوسط: لا تصديق كامل لراوٍ ضعيف في الحديث، ولا تكذيب كامل لخبرٍ لم يثبت خلافه، بل وزنٌ للأخبار بميزان الصحة والموافقة.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأبو مخنف\u003c/b\u003e\u003cspan\u003eلوط بن يحيى، ت ٢٥٧هـ، نقل عنه البلاذري\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالواقدي\u003c/b\u003e\u003cspan\u003eمحمد بن عمر، ت ٢٠٧هـ، استقر الإجماع على وهنه\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسيف بن عمر\u003c/b\u003e\u003cspan\u003eت ١٨٠هـ تقريبًا، ضعيف في الحديث عمدة في التاريخ\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eاليد الخفية\u003c/b\u003e\u003cspan\u003eعبد الله بن سبأ وأتباعه في الأمصار\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eالرواة الثلاثة وحكم أهل الحديث فيهم\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالراوي\u003c/th\u003e\u003cth\u003eمذهبه في الرواية\u003c/th\u003e\u003cth\u003eحكم المحدثين\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eأبو مخنف\u003c/td\u003e\u003ctd\u003eيُظهر عثمان مستحقًا لما جرى، وطلحة محرضًا\u003c/td\u003e\u003ctd\u003eلا يُقبل خبره فيما يدعم بدعته\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالواقدي\u003c/td\u003e\u003ctd\u003eيشنّع على عثمان ويُظهر الصحابة متآمرين\u003c/td\u003e\u003ctd\u003eاتهمه النسائي والشافعي، واستقر الإجماع على وهنه\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eسيف بن عمر\u003c/td\u003e\u003ctd\u003eيبرّئ الصحابة وينسب الفتنة لابن سبأ\u003c/td\u003e\u003ctd\u003eضعيف في الحديث، عمدة في التاريخ\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eضعيف في الحديث، عمدة في التاريخ\u003c/p\u003e\u003ccite\u003eابن حجر، تقريب التهذيب ١/٣٤٤، عن القضاة ص٨٤\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eلا تُقبل روايات الفتنة على عمومها؛ فأبو مخنف والواقدي مردودان عند أهل الحديث، وسيف بن عمر ضعيف في الحديث لكنه عمدة في التاريخ. وبالنقد الداخلي يظهر تناقض رواية تآمر الصحابة، وتتضح اليد الخفية التي حرّكت الوفود.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"uthman-mushaf","n":"نسخ القرآن الكريم","ic":"📖","part":"عثمان بن عفان (٢٣–٣٥هـ)","h":"\u003carticle class=\"ch3\" id=\"uthman-mushaf\" data-toc=\"نسخ القرآن الكريم\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eعثمان بن عفان (٢٣–٣٥هـ)\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٥ من ٧\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٣\u003ci\u003e.\u003c/i\u003e٥\u003c/span\u003e\n            \u003ch3\u003e📖 نسخ القرآن الكريم\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eل\u003c/span\u003eماذا أُحرقت مصاحف الناس، وكيف صار للمسلمين مصحف واحد؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eذُكر فيما سبق أن أبا بكر رضي الله عنه جمع القرآن الكريم، وأن المهمة أُسندت إلى زيد بن ثابت رضي الله عنه، وكُتبت نسخه من القرآن الكريم وحُفظت في بيت أبي بكر ثم عمر ثم حفصة. فكان الجمع الأول جمعًا للمواد، أي جمع ما كُتب في الرقاع واللخاف والعسب وصدور الرجال في صحفٍ واحدة، لئلا يضيع شيء من القرآن بموت الحفاظ. وكانت الصحف مكتوبة بخطٍّ من غير نقط ولا شكل، لأن العرب كانوا يقرؤون بالسليقة، وكان الاعتماد على الحفظ في الصدور.\u003c/p\u003e\u003cp class=\"ap\"\u003eفلما انتشر الإسلام وعمّت الفتوح ودخل في الإسلام أقوام من غير العرب، خشي بعض أصحاب رسول الله ﷺ من اختلاف الناس بالقراءة أو تحريف شيء من القرآن لفظًا أو أداءً. يروي البخاري بسنده عن أنس بن مالك: أن حذيفة بن اليمان قَدِم على عثمان، وكان يغازي أهل الشام في فتح أرمينية وأذربيجان مع أهل العراق، فأفزع حذيفة اختلافهم في القراءة. وكان اختلافهم في الحروف لا في المعنى، فمنهم من يقرأ على حرف ومنهم من يقرأ على آخر، وكلهم محق، ولكن الجهل بذلك يوقع في الإنكار.\u003c/p\u003e\u003cp class=\"ap\"\u003eفقال حذيفة لعثمان: «يا أمير المؤمنين، أدرك هذه الأمة قبل أن يختلفوا في الكتاب اختلاف اليهود والنصارى». فأرسل عثمان إلى حفصة: «أن أرسلي إلينا بالصحف ننسخها في المصاحف ثم نردها إليك»، فأرسلت بها حفصة إلى عثمان. فكانت الصحف التي جمعها أبو بكر هي الأصل الذي نُسخت منه المصاحف، وهذا يبيّن أن عمل عثمان لم يكن جمعًا جديدًا، بل نسخًا من جمعٍ سابق موثوق.\u003c/p\u003e\u003cp class=\"ap\"\u003eفأمر عثمان زيد بن ثابت وعبد الله بن الزبير وسعيد بن العاص وعبد الرحمن بن الحارث بن هشام فنسخوها في المصاحف. وقال عثمان للرهط القرشيين الثلاثة: «إذا اختلفتم أنتم وزيد بن ثابت في شيء من القرآن فاكتبوه بلسان قريش، فإنما نزل بلسانهم»، ففعلوا. وهذا الشرط دقيق، لأن القرآن نزل بلسان قريش، فإذا اختلف الرسم بين لسان زيد — وهو أنصاري — ولسان القرشيين، فالترجيح للسان قريش.\u003c/p\u003e\u003cp class=\"ap\"\u003eحتى إذا نسخوا الصحف في المصاحف، ردّ عثمان الصحف إلى حفصة، وأرسل إلى كل أفق بمصحف مما نسخوا، وأمر بما سواه من القرآن في كل صحيفة أو مصحف أن يُحرق. فكان هذا الإحراق ليس إتلافًا للقرآن، بل إتلافًا للنسخ المختلفة الرسم التي قد تُفضي إلى الاختلاف، وقد كان الصحابة على ذلك، ولم يُنكر أحد منهم على عثمان فعله، لأنه رأى المصلحة العليا في توحيد الأمة على رسم واحد.\u003c/p\u003e\u003cp class=\"ap\"\u003eإلا أن الباحثين اختلفوا في عدد المصاحف التي استنسخها، والراجح عليه أن الباحثين أنها سبعة مصاحف، استبقى واحدًا منها عنده وهو الذي سُمّي بالمصحف الإمام، ووزّع سائرها على الكوفة والبصرة والشام واليمن ومكة والبحرين. فصارت هذه المصاحف أصولًا يُنسخ منها في الأمصار، وبهذا استقر رسم القرآن في الأمة إلى اليوم، فكل مصحف في العالم الإسلامي يرجع في رسمه إلى أحد هذه المصاحف.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالفرق بين الجمعين واضح: جمع أبي بكر كان جمعًا للمواد المتفرقة في صحفٍ واحدة بعد أن خُشي ذهاب القرآن بذهاب الحفاظ، وكان عملًا داخليًا في المدينة لم يُلزم به الأمصار. وأما جمع عثمان فكان توحيدًا للنسخ وتوزيعًا لها على الأمصار، وإتلافًا لما خالفها، وكان عملًا عامًّا شارك فيه الصحابة وأُجمع عليه، ولذلك نُسب المصحف إليه فقيل «المصحف العثماني».\u003c/p\u003e\u003cp class=\"ap\"\u003eوهذا الفرق يفسّر لماذا لم يُنسب المصحف إلى أبي بكر مع أنه أول من جمع؛ لأن الجمع الأول كان خطوة تأسيسية في المدينة، والجمع الثاني كان خطوة تنفيذية عامة غيّرت واقع الأمة، والناس إنما ينسبون العمل إلى من عمّ نفعه وظهر أثره. وقد قال علي رضي الله عنه كلمةً في حق عثمان في هذا الباب، فكان من أعظم الشهادات له، لأنها جاءت من خصمه السياسي في وقت الفتنة.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eحذيفة والاختلاف في القراءة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان حذيفة بن اليمان في فتح أرمينية وأذربيجان، فرأى أهل الشام وأهل العراق يختلفون في القراءة اختلافًا أفزعه، حتى كأنهم يتنازعون في كتابين لا في كتاب واحد. وهذا الخطر أعظم من خطر الحروب، لأن اختلاف القراءة إذا استحكم صار كل فريق يرى قراءة الآخر خطأً، ثم يرى صاحبها على خطأ، ثم يرى نفسه على صواب.\u003c/p\u003e\u003cp class=\"ap\"\u003eفجاء حذيفة إلى عثمان يصف له ما رأى، وقال كلمته المشهورة: «أدرك هذه الأمة قبل أن يختلفوا في الكتاب اختلاف اليهود والنصارى». وكان في هذا التحذير استشهاد بتجربة الأمم السابقة، وهو من فقه حذيفة، فقد رأى أن ما وقع لليهود والنصارى من الاختلاف في كتبهم سيقع للمسلمين إذا لم يُضبط الرسم.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eاللجنة وشرط اللسان\u003c/h4\u003e\u003cp class=\"ap\"\u003eاختار عثمان أربعة: زيد بن ثابت، وعبد الله بن الزبير، وسعيد بن العاص، وعبد الرحمن بن الحارث بن هشام، ثلاثة منهم من قريش وواحد من الأنصار. وهذا الاختيار يوازن بين الأمانة في الحفظ والخبرة في الرسم، فزيد هو الذي جمع القرآن في عهد أبي بكر، وهو أعلم الناس بما كُتب، والقرشيون أعرف بلسان قريش الذي نزل به القرآن.\u003c/p\u003e\u003cp class=\"ap\"\u003eوشرط اللسان شرط عظيم، لأنه يمنع أن يُكتب القرآن بلهجة أخرى ولو كانت صحيحة في العربية، فالنص يُروى بلفظه لا بمعناه، والرسم يُضبط على لسان من نزل به. وقد عملت اللجنة بهذا الشرط، فلم يختلفوا في شيء إلا كتبوه بلسان قريش، فسلم الرسم من الترجيحات الفردية. ولو تُرك الأمر للاجتهاد الشخصي لصار لكل مصحف رسم، ولكل رسم قارئ يدافع عنه.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالمصاحف السبعة\u003c/h4\u003e\u003cp class=\"ap\"\u003eوزّع عثمان المصاحف على الأمصار الكبرى: الكوفة والبصرة والشام واليمن ومكة والبحرين، وأبقى واحدًا في المدينة. وهذا التوزيع يوافق توزيع الأمصار الكبرى في ذلك العصر، فكل مصر له مصحف يُقرأ منه ويُنسخ عنه، فلا يحتاج الناس إلى رحلة إلى المدينة لضبط رسمهم. وقد كانت هذه المصاحف تُقرأ بها الأمصار، ويُنسخ عنها في القرون التالية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان لهذا العمل أثرٌ باقٍ إلى اليوم؛ فالمصاحف المطبوعة في العالم كله تعتمد رسمًا واحدًا متصلًا بتلك النسخ، وهذا وحدةٌ في الرسم لم تُعطَ لأي كتاب آخر في التاريخ. ومن هنا كان نسخ عثمان من أعظم أعمال الخلافة، مع أنه وقع في زمنٍ كانت الفتنة تُحيط به من كل جانب.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالسبب\u003c/b\u003e\u003cspan\u003eاختلاف أهل الشام والعراق في القراءة في فتح أرمينية\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمشير\u003c/b\u003e\u003cspan\u003eحذيفة بن اليمان: أدرك هذه الأمة قبل أن يختلفوا\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eاللجنة\u003c/b\u003e\u003cspan\u003eزيد بن ثابت وثلاثة من قريش\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالشرط\u003c/b\u003e\u003cspan\u003eما اختلفوا فيه يُكتب بلسان قريش\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمصاحف\u003c/b\u003e\u003cspan\u003eسبعة، الإمام بالمدينة والباقي في الأمصار\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eبين جمع أبي بكر ونسخ عثمان\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالوجه\u003c/th\u003e\u003cth\u003eجمع أبي بكر\u003c/th\u003e\u003cth\u003eنسخ عثمان\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالسبب\u003c/td\u003e\u003ctd\u003eخشية ذهاب القرآن بموت الحفاظ\u003c/td\u003e\u003ctd\u003eاختلاف الناس في القراءة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالعمل\u003c/td\u003e\u003ctd\u003eجمع المواد في صحف واحدة\u003c/td\u003e\u003ctd\u003eنسخ الصحف في مصاحف متعددة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالنطاق\u003c/td\u003e\u003ctd\u003eالمدينة وحدها\u003c/td\u003e\u003ctd\u003eجميع الأمصار\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالأثر\u003c/td\u003e\u003ctd\u003eحفظ النص من الضياع\u003c/td\u003e\u003ctd\u003eتوحيد الرسم ومنع الاختلاف\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالنتيجة\u003c/td\u003e\u003ctd\u003eالصحف عند حفصة\u003c/td\u003e\u003ctd\u003eالمصحف الإمام والمصاحف السبعة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eيا أمير المؤمنين، أدرك هذه الأمة قبل أن يختلفوا في الكتاب اختلاف اليهود والنصارى\u003c/p\u003e\u003ccite\u003eصحيح البخاري ٩/١١، عن القضاة ص٩٤\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eنسخ عثمان القرآن بعد أن أفزع حذيفة اختلاف الناس في القراءة، فجمع الصحف من حفصة ونسخها بلجنة أربعة بشرط لسان قريش، ثم وزّع سبعة مصاحف على الأمصار وأحرق ما خالفها، فوحّد رسم الأمة إلى اليوم.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"uthman-futuh","n":"الفتوحات في عهده","ic":"⚔️","part":"عثمان بن عفان (٢٣–٣٥هـ)","h":"\u003carticle class=\"ch3\" id=\"uthman-futuh\" data-toc=\"الفتوحات في عهده\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eعثمان بن عفان (٢٣–٣٥هـ)\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٦ من ٧\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٣\u003ci\u003e.\u003c/i\u003e٦\u003c/span\u003e\n            \u003ch3\u003e⚔️ الفتوحات في عهده\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eم\u003c/span\u003eاذا فُتح في السنوات الست الأولى قبل أن تشتعل الفتنة؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eاستمر عثمان رضي الله عنه خلال السنوات الست الأولى من خلافته على نهج سلفيه في توسيع دائرة الفتوح، فقد كان عهده امتدادًا لعهد عمر لا انقطاعًا عنه، وإنما اختلفت الجبهات واتسعت الحدود. فالدولة التي ورثها عثمان كانت قد بلغت العراق والشام ومصر، فكان عملُه أن يُثبّت ما فُتح، وأن يفتح ما بقي، وأن يحمي الأطراف من هجمات المضادّين. وقد ورث عن عمر دولةً قائمة الأركان، فلم يكن بحاجة إلى تأسيس، بل إلى إدارة ما تأسس ومدّه إلى أطراف جديدة.\u003c/p\u003e\u003cp class=\"ap\"\u003eففي بلاد فارس فُتحت طبرستان على يد سعيد بن العاص، وكان معه عدد من الصحابة منهم الحسن والحسين ابنا علي، وابن عباس، وابن عمر، وحذيفة بن اليمان. وهذه الأسماء تدل على أن الفتوح في عهده لم تكن عملًا عسكريًا فقط، بل كانت عملًا دعويًا وتعليميًا، لأن هؤلاء الصحابة كانوا يُعلّمون أهل البلاد المفتوحة الإسلام والقرآن. فكان الفتح في عهده مصحوبًا بالتعليم، وهذا هو الفرق بين فتحٍ يغيّر السلطة وفتحٍ يغيّر القلوب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي تركيا كانت الفتوح سنة اثنتين وثلاثين على يد عبد الرحمن بن ربيعة بعد إحكام السيطرة على اصطخر وخراسان ونيسابور وغيرها، وكان بعضها قد فُتح في عهد عمر، إلا أن أهلها ثاروا وحاولوا استعادة أراضيهم، فأمر عثمان رضي الله عنه جيوش العراق في البصرة والكوفة بالتغلغل في بلاد فارس، ثم التوجه نحو تركيا. فكانت هذه الفتوح إعادةُ فتحٍ لما انتُقض، وتوسّعًا في أطرافٍ جديدة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما في جهة الشام: ففي السنة الثانية من خلافة عثمان سار معاوية إلى بلاد الروم، ففتح عمورية وطرطوس وأنطاكية، وفي سنة ثمانٍ وعشرين فتح معاوية جزيرة قبرص. وكان فتح قبرص خطوةً ذات معنى خاص، لأنه أول فتح بحري في تاريخ المسلمين، وقد احتاج إلى سفنٍ وبحّارةٍ وخبرةٍ في البحر لم تكن عند العرب من قبل، فكان إنجازًا لوجستيًا قبل أن يكون عسكريًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما جهة مصر وشمال إفريقيا: فقد أمر عثمان عمرو بن العاص أن يوجّه جيشًا إلى طرابلس وطنجة، وبقيت الجيوش تتقدم حتى وصلت إلى الجزائر عام سبعة وعشرين. وبذلك دخلت بلاد المغرب في دائرة الدولة الإسلامية، وصارت مصر قاعدةً للفتوح نحو الغرب كما كانت من قبل، وتحقّق في عهد عثمان ما لم يتحقق في عهد عمر، لأن عمر كان يرفض التوغل في البحر ويخشى على المسلمين منه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد اختلفت طريقة فتح المدن في عهده بين صلحٍ وعنوة، وكان لكل طريقة أثرها في أحكام الأرض والخراج؛ فما فُتح صلحًا بقي لأهله ما شرطوه في عهدهم، وما فُتح عنوةً صار فيئًا للمسلمين يُقسم أو يُترك في أيدي أهله مقابل الخراج. وهذا الاختلاف في طريقة الفتح هو الذي أوجب اختلاف الفقهاء بعد ذلك في أحكام الأراضي المفتوحة، وهو أصل من أصول فقه الجهاد الذي بُني على وقائع هذه الفتوح لا على تصور نظري.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان عثمان يوصي قواده بالوفاء بالعهود، لأن نقض العهد يهدم ما بناه الفتح، ويجعل الناس يفرّون من الإسلام قبل أن يعرفوه. فكان الفتح في عهده فتحًا بالعهد والعدل قبل أن يكون فتحًا بالسيف، وهذا هو الذي جعل أهل البلاد يستقرون ويُعمّرون، ثم يدخلون في الدين أفواجًا بعد أن رأوا أمانة المسلمين ووفاءهم. وقد كان هذا الوفاء سيرةً في القادة والجند، لا سياسةً مؤقتة، ولذلك لم تكن البلاد المفتوحة في عهده أرضًا محتلة، بل أرضًا دخلها الناس طوعًا بعد أن أمنوا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد توقفت الفتوح في آخر عهد عثمان بسبب الفتنة، لا بسبب ضعف في الجيوش ولا نقص في القادة؛ فقد كانت الجيوش في الميدان حين اشتعلت الفتنة في المدينة، واستدعى الناسُ أنفسهم للدفاع عن الخليفة، ثم انشغلوا بعد مقتله بالخلاف على من يخلفه. وهكذا فإن الفتنة الداخلية كانت أخطر على الفتوح من جيوش الروم والفرس، لأنها قطعت الطريق على الجيوش في وقت كانت فيه الدولة في أشد الحاجة إلى وحدتها.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eفارس وتركيا\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت جبهة فارس في عهد عثمان جبهة تثبيت أكثر منها جبهة فتح جديد؛ فالمدن التي فُتحت في عهد عمر كانت تثور بين حين وآخر، وكان أهلها يرون في انشغال الدولة فرصة للانتقاض. فكانت مهمة القادة إعادة الفتح وضبط الأمن، وهذا النوع من الحروب أطول من الفتح الأول لأنه يحتاج إلى صبر ومصابرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي تركيا كان التوسع نحو الشمال، وهو اتجاه جديد لم تعرفه الفتوح في عهد عمر، وقد أُسند إلى عبد الرحمن بن ربيعة، فدخل بلادًا جبلية باردة لم يألفها العرب، وكان ذلك اختبارًا لقدرة الجيش على التكيّف. وقد نجح في إحكام السيطرة على اصطخر وخراسان ونيسابور قبل أن يتوجه إلى تلك البلاد.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالشام وقبرص\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الشام في عهد عثمان جبهةً نشطة بقيادة معاوية بن أبي سفيان، وقد فتح عمورية وطرطوس وأنطاكية في السنة الثانية من خلافته، وهذه المدن كانت من معاقل الروم في الشمال، ففتحها يعني تأمين الحدود الشمالية للشام. وقد كانت هذه المدن تُهدد دمشق من الشمال، فكان فتحها ضرورة دفاعية قبل أن يكون توسعًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما قبرص فقد كانت خطوةً نوعية، لأنها جزيرة في البحر لا يمكن الوصول إليها إلا بالسفن، وقد أذن عثمان للمسلمين بالركوب في البحر بعد تردد، ففتحوها سنة ثمانٍ وعشرين. وكان في هذا الفتح بداية تاريخ بحري للأمة الإسلامية، منه جاءت أساطيل المسلمين بعد ذلك في الفتوح التالية.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eمصر وشمال إفريقيا\u003c/h4\u003e\u003cp class=\"ap\"\u003eمن مصر انطلقت الجيوش نحو الغرب، فأمر عثمان عمرو بن العاص أن يوجّه جيشًا إلى طرابلس وطنجة، فتقدّمت الجيوش حتى وصلت إلى الجزائر سنة سبعٍ وعشرين. وكان هذا التوسع يعني دخول قبائل البربر في دائرة الدولة، وقد كان لهم بعد ذلك دور كبير في تاريخ الإسلام في الأندلس وغيرها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان لهذا الفتح أثر اقتصادي أيضًا، لأن بلاد المغرب كانت طريق التجارة نحو السودان الغربي والأندلس، فصار للمسلمين منفذ على البحر المتوسط من جهتين: من الشام ومصر شرقًا، ومن إفريقية غربًا. وهذا ما جعل الدولة في عهد عثمان أوسع مما كانت في عهد عمر من جهة الغرب.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eفارس\u003c/b\u003e\u003cspan\u003eطبرستان على يد سعيد بن العاص\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eتركيا\u003c/b\u003e\u003cspan\u003eسنة ٣٢هـ على يد عبد الرحمن بن ربيعة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالشام\u003c/b\u003e\u003cspan\u003eعمورية وطرطوس وأنطاكية سنة ٢٥هـ\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالبحر\u003c/b\u003e\u003cspan\u003eفتح قبرص سنة ٢٨هـ، أول فتح بحري\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eإفريقية\u003c/b\u003e\u003cspan\u003eطرابلس وطنجة حتى الجزائر سنة ٢٧هـ\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eفتوح عثمان على الجبهات\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالجبهة\u003c/th\u003e\u003cth\u003eما فُتح\u003c/th\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالقائد\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eفارس\u003c/td\u003e\u003ctd\u003eطبرستان\u003c/td\u003e\u003ctd\u003eفي عهده\u003c/td\u003e\u003ctd\u003eسعيد بن العاص\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eتركيا\u003c/td\u003e\u003ctd\u003eاصطخر وخراسان ونيسابور ثم بلاد الترك\u003c/td\u003e\u003ctd\u003e٣٢هـ\u003c/td\u003e\u003ctd\u003eعبد الرحمن بن ربيعة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالشام\u003c/td\u003e\u003ctd\u003eعمورية وطرطوس وأنطاكية\u003c/td\u003e\u003ctd\u003e٢٥هـ\u003c/td\u003e\u003ctd\u003eمعاوية بن أبي سفيان\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالبحر\u003c/td\u003e\u003ctd\u003eقبرص\u003c/td\u003e\u003ctd\u003e٢٨هـ\u003c/td\u003e\u003ctd\u003eمعاوية بن أبي سفيان\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eإفريقية\u003c/td\u003e\u003ctd\u003eطرابلس وطنجة حتى الجزائر\u003c/td\u003e\u003ctd\u003e٢٧هـ\u003c/td\u003e\u003ctd\u003eعمرو بن العاص\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eأما بعد: فإني آخذ العمال بموافاتي في كل موسم، وقد سلّطت الأمة منذ وليت على الأمر بالمعروف والنهي عن المنكر، فلا يرفع عليّ شيء ولا على أحد من عمالي إلا أعطيته\u003c/p\u003e\u003ccite\u003eتاريخ الطبري ٤/٣٤٩، عن القضاة ص٨٨\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eاستمرت الفتوح في عهد عثمان ست سنوات: طبرستان في فارس، وبلاد الترك، وعمورية وطرطوس وأنطاكية في الشام، وقبرص أول فتح بحري، وطرابلس وطنجة حتى الجزائر في الغرب، ثم توقفت بالفتنة لا بالهزيمة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"uthman-nizam","n":"تنظيم أمور الدولة ومرافقها","ic":"🏛️","part":"عثمان بن عفان (٢٣–٣٥هـ)","h":"\u003carticle class=\"ch3\" id=\"uthman-nizam\" data-toc=\"تنظيم أمور الدولة ومرافقها\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cdiv class=\"cho-top\"\u003e\n            \u003cspan class=\"cho-part\"\u003eعثمان بن عفان (٢٣–٣٥هـ)\u003c/span\u003e\n            \u003cspan class=\"cho-cnt\"\u003eالفصل ٧ من ٧\u003c/span\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-mid\"\u003e\n            \u003cspan class=\"cho-num\"\u003e٣\u003ci\u003e.\u003c/i\u003e٧\u003c/span\u003e\n            \u003ch3\u003e🏛️ تنظيم أمور الدولة ومرافقها\u003c/h3\u003e\n          \u003c/div\u003e\n          \u003cdiv class=\"cho-rule\"\u003e\u003ci\u003e\u003c/i\u003e\u003cb\u003e\u0026#10070;\u003c/b\u003e\u003ci\u003e\u003c/i\u003e\u003c/div\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eم\u003c/span\u003eا الذي أضافه عثمان إلى نظام عمر الإداري، وكيف انتهى عهده؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eلا شك أن عمر بن الخطاب قد نظّم بعض أجهزة الدولة ومرافقها، ولكن عثمان جاء فأحدث أنظمة جديدة كان طبيعة الدولة تقتضيها، فالدولة التي اتسعت أطرافها وكثر سكانها واختلط عربها بغيرهم تحتاج إلى أدوات إدارة أكثر تفصيلًا من دولة المدينة الأولى. فكانت إضافات عثمان استجابةً لحاجاتٍ واقعية لا ترفًا إداريًا. ومن هنا فإن كل إضافة نُسبت إليه تُفهم على أنها حلٌّ لمشكلة، لا أنها تقليد لدولة أخرى.\u003c/p\u003e\u003cp class=\"ap\"\u003eفمن ذلك أنه أقطع القطائع، وهي أراضٍ وزّعها على بعض الفاتحين ليعملوا بها ويستقروا ويعمروها. وكانت هذه السياسة ذات فائدتين: الأولى تعمير الأرض التي فُتحت، والثانية تثبيت الفاتحين في البلاد المفتوحة حتى لا تعود إلى أهلها بعد رحيل الجيش. وقد كانت القطيعة في الإسلام أصلًا معروفًا، لكن عثمان وسّع فيها توسعًا يناسب اتساع الدولة. وقد كانت هذه السياسة مثار نقاش بين الصحابة، لأن الأرض المفتوحة عنوةً تكون فيئًا للمسلمين، ولكن عثمان رأى أن التعمير أنفع للأمة من تركها مواتًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eومن ذلك أنه خصص مرتبًا شهريًا للمؤذنين، وكان المؤذن قبل ذلك يقوم بوظيفته تطوعًا أو مقابل عطاء من بيت المال كسائر المسلمين. وتخصيص مرتب له يعني أن الأذان صار وظيفةً من وظائف الدولة لها أجر معلوم، وهذا خطوة في تحويل المرافق الدينية إلى مؤسسات لها ميزانية وأصحاب. وهذا تدبير يجعل الأذان لا ينقطع بانشغال الناس بمعاشهم، ويجعل المسجد مركزًا منتظمًا للوقت في المدينة.\u003c/p\u003e\u003cp class=\"ap\"\u003eومن ذلك أنه فوّض الناس في الدولة الإسلامية بإخراج زكاة أموالهم، أي أن الناس صاروا يخرجون زكاة أموالهم بأنفسهم بدل أن يأتيها العاملون، وهذا يعني أن الدولة لم تعد تجمع الزكاة كلها بيدها، بل تركت للناس إخراجها في مواضعها. وقد كان لهذا أثر في تخفيف الأعباء الإدارية، وفي الوقت نفسه في إبقاء الزكاة عبادةً يؤديها صاحب المال بنفسه. وقد كان في هذا تفويضٌ يحفظ للعبادة معناها، ويخفف عن الدولة أعباء الجباية، ويترك للفقيه أن ينظر في حال كل مال على حقيقته.\u003c/p\u003e\u003cp class=\"ap\"\u003eومن ذلك أنه شكّل جهاز أمن (شرطة) وأمر عليه أحد أصحابه، وكانت الحاجة إلى هذا الجهاز ظاهرة في دولةٍ كثر فيها الغوغاء واختلط فيها الناس، فصار لا بد من قوة نظامية تحفظ الأمن في الأسواق والطرق. وقد كانت هذه أول صورة من صور الشرطة في الدولة الإسلامية، ثم تطورت بعد ذلك في العصور الأموية والعباسية إلى مؤسسة كاملة لها صاحب الشرطة. وكانت هذه الخطوة ضرورةً في مدينة كثر فيها الغرباء والغوغاء، فالأمن لا يُحفظ بالوعظ وحده إذا رُفع السيف في وجه الناس.\u003c/p\u003e\u003cp class=\"ap\"\u003eومن ذلك أنه أنشأ أول أسطول بحري للمسلمين حين غزا المسلمون قبرص، فقد أدرك أن البحر لا يُحفظ بالبر، وأن من يريد حماية سواحله الطويلة من الشام ومصر وإفريقية لا بد له من سفن. وقد كان هذا الأسطول بداية تاريخ بحري طويل للمسلمين، منه جاءت فتوح الأندلس وصقلية وجزر البحر المتوسط بعد ذلك. وكان في إنشائه إقرار بأن المسلمات العسكرية ليست ثابتة، وأن القائد يجتهد بحسب ما يراه من مصلحة الأمة في زمانه ومكانه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان ختام الكتاب في حق عثمان كلمةً تُجمل سيرته: «رحمة الله يا عثمان.. يا ذا النورين لقد قمت بأمانتك ومسؤوليتك خير قيام، ونظمت وعملت، وكان لك الفضل في نسخ المصحف وغيره.. ولكن إرادة الله بأن تصيبك البلوى، كما أخبرك صاحبك رسول الله ﷺ لحكمة يريدها سبحانه، فهنيئًا لك الشهادة في سبيله، وتعسًا للذين لا يربحون حتى يلطخوا أيديهم بدماء المسلمين الزكية.. إنها سنة الله في خلقه، ولن تجد لسنة الله تبديلًا».\u003c/p\u003e\u003cp class=\"ap\"\u003eفكان عهد عثمان في أوله بناءً وإدارةً وفتحًا، وفي آخره فتنةً وقتلًا، وهكذا تجتمع في حياة الرجل الواحد صورتان: صورة الباني الذي نظّم المصحف والأسطول والمرافق، وصورة الشهيد الذي قُتل في داره وهو يقرأ كتاب ربه. وقد جمع الله له الأمرين، فكان له أجر العمل وأجر الشهادة، وبقي أثره في الأمة مصحفًا يُقرأ ونظامًا يُتبع. فمن أراد أن يعرف عثمان فليقرأ مصحفًا، وليقف على ساحل من سواحل الشام أو إفريقية، فإن أثره في الأمة أطول من عمره في الدنيا.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالقطائع والمرتبات\u003c/h4\u003e\u003cp class=\"ap\"\u003eالقطائع سياسة إدارية ذات بعد اقتصادي واجتماعي، فالأرض إذا تُركت بلا تعمير عادت إلى أهلها أو صارت مواتًا، وإذا أُقطعت لمن يعمرها صارت مصدرًا للدولة وللناس. وقد أقطع عثمان بعض الفاتحين لأنهم أهلٌ للعمل، لا لأنهم أهل قرابة، وهذا هو الفرق بين القطيعة في الإسلام والقطيعة في دول التوريث.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما مرتب المؤذنين فيدل على أن الدولة كانت تنظر إلى الوظائف الدينية نظرة مؤسسية، فالأذان ليس عملًا فرديًا يتطوع به من شاء، بل هو وظيفة تُنتظم بها حياة المدينة، فإذا لم يكن للمؤذن مرتب انقطع عن الأذان من كان مشغولًا بمعاشه، وضاع بذلك شعور الناس بالوقت.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالشرطة والأسطول\u003c/h4\u003e\u003cp class=\"ap\"\u003eالشرطة في الدولة الإسلامية بدأت بجهاز صغير مهمته حفظ الأمن، ثم صارت مؤسسة لها صاحب وقوانين. وقد كان إنشاؤها في عهد عثمان ضرورةً لأن المدينة في آخر عهده صارت ميدانًا للغوغاء، فلو كانت الشرطة قائمة بقوة كافية لما وصل الأمر إلى حصار دار الخليفة. فغياب الأمن في المدينة كان أول أسباب الكارثة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما الأسطول فكان أعظم إنجازاته الإدارية، لأنه نقل الأمة من قوة برية إلى قوة بحرية، وقد كان المسلمون قبل ذلك يخافون البحر ويعدّونه خطرًا. وقد أدرك عثمان أن البحر ليس خطرًا إذا أُحسن استخدامه، فأذن بالركوب فيه، ففتح الله على المسلمين قبرص، وصار البحر طريقًا للفتح لا للخوف.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eخاتمة عهد عثمان\u003c/h4\u003e\u003cp class=\"ap\"\u003eالحكم على عهد عثمان لا يكون بعدد سنواته بل بأثره؛ فالمصحف الذي بين أيدينا اليوم يرجع إلى نسخه، والأسطول الذي حمى السواحل بدأ بأمره، والقطائع التي عمّرت الأرض كانت من سياسته. وهذه أعمال تبقى بعد صاحبها، وتشهد له عند الله وعند الناس. فليس العمر بطول الأيام، ولكن بما يُترك فيها من أثر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما مقتله فليس دليلًا على فشل سياسته، بل هو دليل على قوة الفتنة التي أُضرمت من خارج دائرة الحكم. وقد قال النبي ﷺ فيه ما قال، وشهد له بالشهادة قبل أن تقع، فكان مقتله تحقيقًا لخبر النبوة لا إبطالًا لسيرته، وهذا هو الفرق بين من يُقتل على باطل ومن يُقتل على حق.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالقطائع\u003c/b\u003e\u003cspan\u003eأراضٍ أُقطعت للفاتحين ليعمروها\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمؤذنون\u003c/b\u003e\u003cspan\u003eأول مرتب شهري لهم\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالزكاة\u003c/b\u003e\u003cspan\u003eفوّض الناس بإخراج زكاة أموالهم\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالأمن\u003c/b\u003e\u003cspan\u003eأول جهاز شرطة في الدولة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالبحر\u003c/b\u003e\u003cspan\u003eأول أسطول بحري للمسلمين\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eإضافات عثمان في إدارة الدولة\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمرفق\u003c/th\u003e\u003cth\u003eما أضافه عثمان\u003c/th\u003e\u003cth\u003eأثره\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالأرض\u003c/td\u003e\u003ctd\u003eإقطاع القطائع للفاتحين\u003c/td\u003e\u003ctd\u003eتعمير البلاد وتثبيت الفاتحين\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمساجد\u003c/td\u003e\u003ctd\u003eمرتب شهري للمؤذنين\u003c/td\u003e\u003ctd\u003eانتظام الأذان كوظيفة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالزكاة\u003c/td\u003e\u003ctd\u003eتفويض الناس بإخراجها\u003c/td\u003e\u003ctd\u003eتخفيف الأعباء الإدارية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالأمن\u003c/td\u003e\u003ctd\u003eتشكيل جهاز شرطة\u003c/td\u003e\u003ctd\u003eحفظ الأمن في الأسواق والطرق\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالبحر\u003c/td\u003e\u003ctd\u003eإنشاء أول أسطول\u003c/td\u003e\u003ctd\u003eفتح قبرص وحماية السواحل\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eيا ذا النورين لقد قمت بأمانتك ومسؤوليتك خير قيام، ونظمت وعملت، وكان لك الفضل في نسخ المصحف وغيره\u003c/p\u003e\u003ccite\u003eالقضاة، الخلفاء الراشدون، ص٩٦–٩٧\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eأضاف عثمان إلى نظام عمر: القطائع، ومرتب المؤذنين، وتفويض الزكاة، وجهاز الشرطة، وأول أسطول بحري. فكان عهده بناءً في أوله وفتنةً في آخره، وبقي أثره في المصحف والأسطول والنظام.
