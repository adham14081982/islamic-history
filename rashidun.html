دى الآخرة سنة ٣٦هـ، وكانت أول معركةٍ بين المسلمين، وقد قُتل فيها طلحة والزبير، وكان في مقتلهما صدمةً كبيرة، لأن الأمة كانت ترى فيهما من العشرة المبشّرين. وقد كان في هذا ما جعل الناس يُدركون أن الفتنة لا تُبقي أحدًا، وأن من يدخلها لا يخرج سالمًا. وقد كان في مقتلهما ما جعل الناس يُدركون أن الفتنة لا تفرّق بين صالحٍ وطالح، وأن من يدخلها قد يخرج منها مقتولًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في معركة الجمل أن عائشة كانت في هودجٍ على جمل، وكان في هذا ما جعل القتال يدور حول الجمل، وكان في هذا ما جعل المعركة تُسمّى باسمه. وقد أمر عليٌّ بعد المعركة أن تُعاد عائشة إلى المدينة معزّزة، وكان في هذا ما يُظهر أنه أراد أن يُنهي الفتنة لا أن يُذلّ خصومه. وقد كان في هذا الأمر ما جعل عليًّا يُظهر أنه يُريد الإصلاح لا الانتقام، وكان في هذا ما جعل بعض أنصاره يرون أنه لَيِّنٌ في موضع الحزم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في معركة صفين ما هو أشدّ، فقد استمرّت أشهرًا، وكانت في موضعٍ على الفرات، وكان في الجيشين أعدادٌ كبيرة، وكان في القتال ما جعل المسلمين يُدركون أن الحرب الأهلية أشدّ من حرب الكفار. وقد كان في هذه المعركة ما يُسمّى بليلة الهرير أيضًا، وكان فيها من القتال ما جعل بعض الصحابة يبكون. وقد كان في هذه المعركة ما جعل الأمة تُدرك أن الحرب الأهلية تُفني الرجال، وأن الخسارة فيها لا تُقاس بالأرض بل بالدم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في صفين أن معاوية لم يكن يطلب الخلافة في أول الأمر، بل كان يطلب القصاص لعثمان، وكان في هذا الطلب ما يُعطيه شرعيةً في نظر أهل الشام. وقد كان في موقفه حسابٌ سياسي أيضًا، لأنه كان واليًا قويًّا في الشام سنوات، وكان في هذا ما جعل الصدام بين مركزين لا بين رجلين. وقد كان في هذا الحساب ما جعل الصدام بين مركزين لا بين رجلين، وكان في هذا ما جعل الحرب أطول لأن كليهما كان يملك قاعدةً وجيشًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في صفين أن الجيش الشامي رفع المصاحف، وكان في هذا العمل ما جعل القتال يتوقّف، لأن رفع المصاحف كان يعني الاحتكام إلى كتاب الله، وكان في هذا ما جعل فريقًا من جيش عليٍّ يُطالب بالتحكيم. وقد كان في هذا الموقف ما يُظهر أن الدين صار سلاحًا في الحرب، وأن من يرفع المصحف قد ينتصر بالسياسة لا بالسيف. وقد كان في هذا الرفع ما جعل الحرب تنتقل من الميدان إلى المحكمة، وكان في هذا ما جعل جيش عليٍّ ينقسم على نفسه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هاتين المعركتين أثرٌ عميق: أنهما فتحتا باب الاجتهاد في قتال المسلمين، وأنهما جعلتا الأمة تتفرّق إلى مواقف، وأنهما جعلتا الخلافة في العصر الأموي تُبنى على الغلبة لا على الشورى. وقد كان في هذا ما جعل المؤرخين يتحدّثون عن الفتنة الكبرى بوصفها الحدث الذي غيّر مسار التاريخ الإسلامي. وقد كان في هذا الأثر ما جعل الفتنة الكبرى تُصبح حدًّا في التاريخ الإسلامي، وكان في هذا ما جعل كل فرقةٍ تُؤرّخ لنفسها من ذلك الحدث.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eلماذا وقعت الجمل\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الجمل نتيجةً لتراكمٍ سريع: أن عليًّا بُويع في المدينة، وأن طلحة والزبير كانا يريان أن القصاص يجب أن يُقدَّم، وأن عائشة خرجت للمطالبة بالإصلاح، وكان في هذا ما جعل الصدام ممكنًا. وقد كان في هذه المطالب ما هو مشروع، لكن الطريق إلى تنفيذها كان مسدودًا، لأن السلطة الجديدة لم تكن قادرةً على القصاص.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الجمل درسٌ في الفتنة: أن من يُطالب بحقٍّ في وقتٍ لا توجد فيه سلطة قادرة قد يفتح بابًا للفوضى، وأن الخصومة بين من يُريدون الحق نفسه أشدّ من الخصومة بين الحق والباطل. وقد كان في هذا ما جعل الصحابة أنفسهم يختلفون، وكان في هذا ما يُفسّر أن الأمة لم تُجمع بعد ذلك على موقف.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eصفين ورفع المصاحف\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان رفع المصاحف قرارًا سياسيًّا ذكيًّا، لأنه حوّل الحرب من ميدانٍ إلى محكمة، وكان في هذا ما جعل جيش عليٍّ ينقسم، لأن فريقًا أراد التحكيم وفريقًا أراد القتال. وقد كان في هذا ما يُظهر أن الحرب تُحسم أحيانًا بالرموز لا بالسيوف، وأن من يُتقن استعمال الرمز ينتصر ولو كان في موقفٍ أضعف.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا الموقف ما جعل عليًّا في موقفٍ صعب، لأنه إن رفض التحكيم صار مُخالفًا لكتاب الله في نظر الناس، وإن قبل صار مُقيّدًا بشرطٍ لا يُريده. وقد كان في هذا ما يُظهر أن القيادة في الفتنة أصعب من القيادة في الحرب، لأن الخصم لا يُقاتل بالسلاح فقط بل بالشرعية.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالفرقة والخوارج\u003c/h4\u003e\u003cp class=\"ap\"\u003eبعد التحكيم خرج فريقٌ من جيش عليٍّ عليه، وقالوا: لا حكم إلا لله، وكانوا يُنكرون أن يُحكّم الرجال في دين الله، وكان في هذا الموقف ما جعلهم يُصبحون فرقةً مستقلّة. وقد كان في هذا ما يُظهر أن الفتنة تُنتج تطرفًا، وأن من يُبالغ في الحق قد يخرج عن الجماعة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه الفرقة ما جعل الحرب تدور في اتجاهٍ جديد، لأن عليًّا صار يُقاتل ثلاثةً: معاوية في الشام، والخوارج في العراق، وكان في هذا ما أضعف جيشه. وقد كان في هذا ما يُفسّر أن عليًّا لم يستطع أن يُوحّد الأمة في سنوات حكمه، وكان في هذا ما جعل نهايته على يد واحدٍ من هذه الفرقة.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالجمل\u003c/b\u003e\u003cspan\u003eجمادى الآخرة سنة ٣٦هـ قرب البصرة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eقتلى الجمل\u003c/b\u003e\u003cspan\u003eطلحة والزبير\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eصفين\u003c/b\u003e\u003cspan\u003eسنة ٣٧هـ على الفرات\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالتحكيم\u003c/b\u003e\u003cspan\u003eأبو موسى الأشعري وعمرو بن العاص\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالنتيجة\u003c/b\u003e\u003cspan\u003eانقسامٌ وقيام فرقة الخوارج\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e٣٦هـ\u003c/td\u003e\u003ctd\u003eمعركة الجمل\u003c/td\u003e\u003ctd\u003eأول قتالٍ بين المسلمين\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٣٦هـ\u003c/td\u003e\u003ctd\u003eمقتل طلحة والزبير\u003c/td\u003e\u003ctd\u003eصدمةٌ في الأمة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٣٧هـ\u003c/td\u003e\u003ctd\u003eمعركة صفين\u003c/td\u003e\u003ctd\u003eاستنزافُ الجيشين\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٣٧هـ\u003c/td\u003e\u003ctd\u003eرفع المصاحف\u003c/td\u003e\u003ctd\u003eتوقّف القتال والتحكيم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٣٨هـ\u003c/td\u003e\u003ctd\u003eالنهروان\u003c/td\u003e\u003ctd\u003eقيام فرقة الخوارج\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eوَإِن طَائِفَتَانِ مِنَ الْمُؤْمِنِينَ اقْتَتَلُوا فَأَصْلِحُوا بَيْنَهُمَا\u003c/p\u003e\u003ccite\u003eسورة الحجرات، الآية ٩\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eوقعت الجمل سنة ٣٦هـ وصفين سنة ٣٧هـ، وقُتل فيهما صحابةٌ كبار، ثم رُفعت المصاحف فتوقّف القتال وحُكّم الرجال. وقد أنتجت هذه السنوات فرقة الخوارج، وأضعفت الدولة أمام خصومها.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"nahrawan","n":"التحكيم والنهروان ونهاية علي","ic":"🌑","part":"القسم الرابع: عثمان وعلي","h":"\u003carticle class=\"ch3\" id=\"nahrawan\" data-toc=\"التحكيم والنهروان ونهاية علي\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e4.4\u003c/span\u003e\n          \u003ch3\u003e🌑 التحكيم والنهروان ونهاية علي\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eب\u003c/span\u003eعد التحكيم انقسم جيش عليٍّ، وخرج عليه من يُسمّون الخوارج، فقاتلهم في النهروان سنة ثمانٍ وثلاثين، ثم قُتل سنة أربعين في مسجد الكوفة. وكانت خلافته خمس سنوات لم يهدأ فيها القتال.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان التحكيم في أذرح سنة ٣٨هـ، وقد حكم فيه أبو موسى الأشعري عن أهل العراق وعمرو بن العاص عن أهل الشام، وقد انتهى التحكيم إلى نتيجةٍ لم تُرضِ عليًّا ولا أنصاره، وكان في هذا ما جعل موقفه أضعف. وقد كان في التحكيم ما يُظهر أن الحلّ السياسي قد يكون أسوأ من الحرب إذا لم تكن له ضمانات. وقد كان في هذا التحكيم ما جعل الحلّ السياسي يُصبح مشكلةً جديدة، وكان في هذا ما جعل عليًّا يفقد جزءًا من جيشه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد خرج الخوارج على عليٍّ بعد التحكيم، وقالوا: لا حكم إلا لله، وكانوا يُكفّرون من حكّم الرجال في دين الله، وكان في هذا الموقف ما جعلهم يُصبحون جماعةً لها فكرٌ خاص. وقد كان فيهم من كان من القرّاء والعبّاد، وكان في هذا ما يُظهر أن التطرّف قد يجتمع مع العبادة، وأنه لا يُقاس بالسلوك الظاهر. وقد كان في هذا الفكر ما جعل الخوارج يُكفّرون بالحكم، وكان في هذا ما جعلهم يخرجون على كل سلطةٍ بعد ذلك.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أرسل عليٌّ إليهم ابن عباس يُناقشهم، وكان في هذا ما يُظهر أنه كان يُفضّل الحوار على الحرب، وقد رجع بعضهم بعد المناقشة، وكان في هذا ما جعل عددهم يقلّ. وقد كان في هذا الموقف ما يُظهر أن الحوار قد يُعيد من كان على حرفٍ من الخروج، وأن الحرب ليست الطريق الأول. وقد كان في هذا الحوار ما جعل بعضهم يرجع، وكان في هذا ما يُظهر أن الحجة قد تُنقذ من كان على حرفٍ من الخروج.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد قاتلهم عليٌّ في النهروان سنة ٣٨هـ، وكان فيهم من قُتل، وكان في هذه المعركة ما جعل الخوارج يُصبحون أعداءً له إلى الأبد. وقد كان في هذا ما يُظهر أن الفتنة إذا دخلت مرحلة التكفير لم يبقَ مجالٌ للإصلاح، وأن من يُكفّر الناس لا يُمكن أن يُعايشهم. وقد كان في هذه المعركة ما جعل الخوارج يُصبحون أعداءً دائمين، وكان في هذا ما جعلهم يُخطّطون لقتل عليٍّ ومعاوية في وقتٍ واحد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في سنوات عليٍّ الأخيرة أن الدولة كانت مُنقسمة: الشام في يد معاوية، والعراق في يد عليٍّ، ومصر في يد عمرو بن العاص بعد أن دخلها لمعاوية، وكان في هذا ما جعل عليًّا في موقفٍ دفاعي. وقد كان في هذا ما يُظهر أن الخلافة بلا وحدةٍ لا تستطيع أن تُنفّذ سياسة، وأن الحرب الأهلية تُنهك الدولة من الداخل. وقد كان في هذا الانقسام ما جعل الخلافة بلا وحدة، وكان في هذا ما جعل عليًّا يُقاتل على جبهتين ولا يستطيع أن يُنهي واحدة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد قُتل عليٌّ في مسجد الكوفة في رمضان سنة ٤٠هـ، وكان قاتله عبد الرحمن بن ملجم من الخوارج، وقد ضربه بسيفٍ مسموم وهو في صلاة الفجر، وكان في هذا ما جعل نهايته تُشبه نهاية عمر، وكان في هذا ما يُظهر أن العنف صار لغةً في الأمة. وقد كان في هذه النهاية ما جعل الأمة تفقد آخر خليفةٍ من الراشدين، وكان في هذا ما جعل الدولة تنتقل إلى عهدٍ آخر بلا ترتيبٍ واضح.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أوصى عليٌّ بأن يُدفن في موضعٍ لا يُعرف، أو بأن يُدفن قريبًا من الكوفة، وكان في هذا ما جعل قبره في النجف، وكان في هذا ما جعل المدينة تُصبح مركزًا للزيارة بعد ذلك. وقد كان في وصيته ما يُظهر أنه كان يعرف أن الفتنة ستستمرّ بعده، وأن قبره قد يُصبح رمزًا في نزاعٍ جديد. وقد كان في هذه الوصية ما جعل قبره موضعًا للزيارة، وكان في هذا ما جعل المدينة تُصبح مركزًا دينيًّا في العراق.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في خلافته إنجازٌ إداري رغم الحرب: أنه نقل العاصمة إلى الكوفة، وأنه عيّن قضاة، وأنه كتب رسائل في العدل والإدارة، ومنها عهده إلى مالك الأشتر في مصر، وهو من أهمّ ما كُتب في أدب الحكم في الإسلام. وقد كان في هذا العهد ما يُظهر أن عليًّا كان يُفكّر في بناء الدولة حتى وهو يُقاتل، وكان في هذا ما جعله يُصبح مرجعًا في الفكر السياسي عند الشيعة وغيرهم.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالنهروان والخوارج\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت النهروان معركةً ضدّ فرقةٍ خرجت من جيش عليٍّ، وكان في هذا ما جعل الحرب أهليةً داخل أهلية، وكان في هذا ما جعل عليًّا يُقاتل من كانوا معه بالأمس. وقد كان في هذا الموقف ما يُظهر أن الفتنة تتغذّى على نفسها، وأن كل حربٍ تُنتج فرقةً جديدة. وقد كان في هذا الانقسام ما جعل الحرب تدور في اتجاهٍ جديد، وكان في هذا ما جعل عليًّا يُقاتل من كان معه بالأمس.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الخوارج ما جعلهم يُصبحون ظاهرةً في التاريخ الإسلامي، لأنهم خرجوا على كل سلطة بعد ذلك، وكان في هذا ما جعلهم يُقتلون ويُقتلون، وكان في هذا ما يُظهر أن التكفير يُنتج عنفًا دائريًّا لا ينتهي. وقد كان في موقف عليٍّ منهم ما يُظهر أنه كان يرى فيهم ضلالًا لا كفرًا، وأنه كان يُفضّل الحجة على السيف.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eعهد الأشتر\u003c/h4\u003e\u003cp class=\"ap\"\u003eكتب عليٌّ عهدًا لمالك الأشتر حين ولّاه مصر، وفيه تفصيلٌ في أخلاق الحاكم: أن يُحبّ الناس ولا يكون عليهم سبعًا ضاريًا، وأن ينظر في أمورهم بنفسه، وأن يُختار للقضاء أفضل الناس، وأن يُراقب الجباية، وكان في هذا العهد ما يُعدّ من أهمّ نصوص الفكر السياسي الإسلامي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا العهد ما يُشبه دليلًا إداريًّا كاملًا: فيه سياسة الجيش والمال والقضاء والعمران، وفيه تحذيرٌ من الاستئثار بالمال، وفيه تأكيدٌ على أن الحكم أمانة. وقد كان في هذا ما جعل النصّ يُدرَّس في العصور الحديثة كوثيقةٍ في أخلاق الحكم، وكان في هذا ما يُظهر أن عليًّا كان صاحب مشروعٍ إصلاحي لا صاحب حربٍ فقط.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eنهاية العهد الراشدي\u003c/h4\u003e\u003cp class=\"ap\"\u003eبمقتل عليٍّ سنة ٤٠هـ انتهى العهد الذي يُسمّى بالراشدي، وكانت مدته ثلاثين سنة، وكان فيه فتحٌ كبير وفتنةٌ كبيرة، وكان في هذا ما جعل المؤرخين يقسّمون التاريخ الإسلامي إلى عهود. وقد كان في نهايته ما جعل الأمة تدخل في عهدٍ جديد تقوم فيه الدولة على الغلبة والوراثة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا العهد إرثٌ كبير: أن الدولة اتّسعت، وأن المؤسسات وُضعت، وأن النصّ جُمع، وأن الفقه بدأ يتشكّل، وكان في هذا ما جعل العهد الراشدي مرجعًا في كل نقاشٍ سياسي بعد ذلك. وقد كان في الفتنة درسٌ آخر: أن الأمة التي تتفرّق على الحق نفسه قد تفقد وحدتها، وأن الخلاف السياسي إذا صار تكفيرًا صار حربًا لا تنتهي.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالتحكيم\u003c/b\u003e\u003cspan\u003eأذرح سنة ٣٨هـ\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالنهروان\u003c/b\u003e\u003cspan\u003eسنة ٣٨هـ ضدّ الخوارج\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمقتل\u003c/b\u003e\u003cspan\u003eرمضان سنة ٤٠هـ في الكوفة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالقاتل\u003c/b\u003e\u003cspan\u003eعبد الرحمن بن ملجم\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالعهد\u003c/b\u003e\u003cspan\u003eإلى مالك الأشتر في مصر\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e٣٧هـ\u003c/td\u003e\u003ctd\u003eرفع المصاحف\u003c/td\u003e\u003ctd\u003eتوقّف القتال\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٣٨هـ\u003c/td\u003e\u003ctd\u003eالتحكيم في أذرح\u003c/td\u003e\u003ctd\u003eضعفُ موقف عليٍّ\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٣٨هـ\u003c/td\u003e\u003ctd\u003eالنهروان\u003c/td\u003e\u003ctd\u003eقيام الخوارج كفرقة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٣٨هـ\u003c/td\u003e\u003ctd\u003eعهد الأشتر\u003c/td\u003e\u003ctd\u003eنصٌّ في أخلاق الحكم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٤٠هـ\u003c/td\u003e\u003ctd\u003eمقتل عليٍّ\u003c/td\u003e\u003ctd\u003eنهاية العهد الراشدي\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eفَاصْبِرْ إِنَّ وَعْدَ اللَّهِ حَقٌّ\u003c/p\u003e\u003ccite\u003eسورة الروم، الآية ٦٠\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eبعد التحكيم خرج الخوارج، فقاتلهم عليٌّ في النهروان، ثم قُتل في مسجد الكوفة سنة ٤٠هـ. وبه انتهى العهد الراشدي بعد ثلاثين سنة، وترك إرثًا في المؤسسات ودرسًا في الفتنة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-5","n":"القسم الخامس: إرث الراشدين","ic":"","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-5\" style=\"--c:#8B1A3A\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🏛️\u003c/div\u003e\n      \u003ch2\u003eالقسم الخامس: إرث الراشدين\u003c/h2\u003e\n      \u003cp\u003eلم تكن خلافة الثلاثين سنة فترة فتحٍ فقط، بل كانت فترة تأسيس: فيها وُضعت قواعد الحكم والمال والقضاء، وفيها تشكّل الفقه السياسي، وفيها بدأت الفرق. وهذا القسم يقرأ ما تركه الراشدون في بنية الدولة لا في خريطتها.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#system-of-rule\"\u003eنظام الحكم: البيعة والشورى والمساءلة\u003c/a\u003e\u003ca href=\"#bayt-al-mal\"\u003eبيت المال والقضاء والحسبة\u003c/a\u003e\u003ca href=\"#futuh-impact\"\u003eأثر الفتوح في العالم\u003c/a\u003e\u003ca href=\"#fitna-lesson\"\u003eالفتنة الكبرى ودرسها\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"system-of-rule","n":"نظام الحكم: البيعة والشورى والمساءلة","ic":"🗳️","part":"القسم الخامس: إرث الراشدين","h":"\u003carticle class=\"ch3\" id=\"system-of-rule\" data-toc=\"نظام الحكم: البيعة والشورى والمساءلة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e5.1\u003c/span\u003e\n          \u003ch3\u003e🗳️ نظام الحكم: البيعة والشورى والمساءلة\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eل\u003c/span\u003eم يكن للراشدين دستورٌ مكتوب، لكن كانت لهم قواعد متّفق عليها: أن الحاكم يُختار بالبيعة، وأنه يُطاع في المعروف، وأنه يُنصح ويُحاسب، وأن المال مال الله لا مال الحاكم. وقد كانت هذه القواعد هي أساس الفكر السياسي الإسلامي بعد ذلك.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكانت البيعة في العهد الراشدي هي الطريق إلى السلطة، وكانت البيعة عقدًا بين الحاكم والأمة، وكانت تُعقد باليد أو بالكلمة، وكانت تعني السمع والطاعة في المنشط والمكره. وقد كان في البيعة عنصران: عنصر الاختيار، وعنصر الالتزام، وكان في هذين العنصرين ما يجعل السلطة عقدًا لا وراثةً ولا غلبة. وفي هذا العقد ما يجعل السلطة مسؤوليةً لا تشريفًا، لأن من يُبايَع على شرطٍ يُحاسب على الشرط، وهذا ما لم يكن في المُلك الوراثي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت الشورى هي الآلية التي تُنتج البيعة، وكانت الشورى في العهد الأول تُمارس بأشكالٍ مختلفة: ففي السقيفة كانت اجتماعًا عامًّا، وفي عهد عمر كانت استشارةً لأهل الرأي، وفي عهد عثمان كانت مجلسًا محدودًا، وفي عهد عليٍّ كانت بيعةً في المدينة ثم في الأمصار. وقد كان في هذا التنوّع ما يُظهر أن الشورى لم تكن شكلًا واحدًا بل مبدأً يُطبّق بحسب الحال.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت المساءلة ركنًا ثالثًا، وكان الناس يسألون الخليفة ويُعاتبونه في المسجد، وكان في هذا ما يُظهر أن الحكم لم يكن فوق النقد. وقد رُوي أن امرأةً عاتبت عمر على منع المهور فتراجع، وأن رجلًا قال له: اتقِ الله يا عمر، فقال: لولا أن تقولوها ما نفعتمونا. وكان في هذه المواقف ما يجعل المساءلة عادةً لا استثناءً. ولا يُفهم هذا إلا إذا عُرف أن المسجد كان مجلس الأمة في ذلك العهد، فكان الناس يجلسون فيه ويناقشون الخليفة في أمورهم بلا استئذان.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت الطاعة محدودةً بالمعروف، وكان هذا القيد هو الأصل الذي بُني عليه الفكر السياسي بعد ذلك، لأن الطاعة المطلقة تُنتج استبدادًا، والطاعة المقيّدة تُنتج دولةً لها قانون. وقد كان في خطبة أبي بكر ما يُثبت هذا القيد، وكان في سيرة عمر ما يُطبّقه عمليًّا، وكان في هذا ما جعل الفقهاء يُصنّفون في هذا الباب قرونًا. وقد ظهر أثر هذا القيد في مواقف كثيرة، منها تراجع عمر عن تحديد المهور حين احتجّت عليه امرأة، ومنها قبول عثمان للنقد في مجلسه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت الولاية عقدًا لا ملكًا، وكان الوالي يُعيّن ويُعزل، وكان يُحاسب، وكان في هذا ما يجعل الدولة مؤسسةً لا إقطاعة. وقد كان في العهد الراشدي أن الولاة كانوا يُستدعون في الحجّ ويُسألون عن أموالهم، وكان في هذا ما يُشبه الرقابة المالية، وكان في هذا ما جعل الفتح لا يُنتج طبقةً وراثية من الحكّام المحليين. وكان في هذا العقد ما يمنع أن تتحوّل الولايات إلى إقطاعاتٍ وراثية، وهو ما حدث في دولٍ أخرى حيث صارت المناصب ملكًا لأسرٍ بعينها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في النظام القضائي استقلالٌ نسبي، لأن القاضي كان ينظر في الخصومات دون تدخّلٍ من الوالي في الحكم، وكان في هذا ما يُشبه فصل السلطات. وقد كان في العهد العمري أن القضاء صار وظيفةً مستقلة لها آدابها، وكان في هذا ما جعل الفقه القضائي يتطوّر بعد ذلك بسرعة. وقد كان في هذا الاستقلال ما جعل القضاء يكتسب ثقة الناس، لأن من يعرف أن القاضي لا يُطيع الوالي في حكمه يلجأ إليه بلا خوف.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في النظام المالي مبدأ أن المال مال الجماعة، وكان بيت المال هو المؤسسة التي تُجمع فيها الأموال وتُوزّع، وكان في هذا ما جعل الدولة تُنفق على الجند والفقراء والبنية. وقد كان في هذا المبدأ ما يُخالف ما كان في الدول القديمة، حيث كان المال مال الملك، وكان في هذا فرقًا جوهريًّا في طبيعة الدولة. وكان في هذا المبدأ ما يجعل المال العام خاضعًا للمحاسبة، لأن من يعرف أن المال ليس ملكه لا يتصرّف فيه كما يتصرّف المالك في ملكه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا النظام كله ضعفٌ أيضًا: أنه لم يُحدّد آليةً واضحة لانتقال السلطة، وأنه لم يُنشئ مؤسسةً للشورى دائمة، وكان في هذا ما جعل الفتنة ممكنةً بعد مقتل عثمان. وقد كان في هذا ما يُفسّر أن الأمة بعد الراشدين لم تستطع أن تُعيد الشورى، وكان في هذا ما جعل الفكر السياسي الإسلامي يبحث عن حلٍّ في المؤسسات لا في الأشخاص. ولهذا فإن ما يُسمّى اليوم بأزمة الشرعية في التاريخ الإسلامي تعود في جذورها إلى غياب آليةٍ واضحة، لا إلى غياب النوايا الحسنة.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالبيعة: عقدٌ لا ميراث\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت البيعة في جوهرها عقدًا يُلزم الطرفين، وكانت تُعقد في المسجد أمام الناس، وكان في هذا العلنية ما يجعل السلطة مسؤولةً أمام الجماعة. وقد كان في البيعة ما يُشبه الدستور الشفهي، لأنها كانت تُحدّد ما على الحاكم وما على الرعية، وكان في هذا ما يُظهر أن السلطة في الإسلام لم تكن ملكًا يتصرّف فيه صاحبه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في البيعة أيضًا ما يجعل الشرعية قابلةً للقياس: فمن لم يُبايَع لم يكن خليفة، ومن بُويع صار خليفةً ولو كان أقلّ فضلًا. وقد كان في هذا معيارٌ سياسي واضح، وكان في هذا ما يُفسّر أن الفتنة بدأت حين صار الناس يبايعون خليفتين في وقتٍ واحد، لأن البيعة فقدت وحدتها.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالشورى وأهل الحلّ والعقد\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم تكن الشورى في العهد الراشدي مؤسسةً لها أعضاء ومقرّات، بل كانت ممارسةً سياسية يقوم بها أهل الرأي والسابقة. وقد كان في هذا ما يُشبه الديمقراطية غير المنظّمة، لأن القرار كان يُتّخذ بعد مشاورة، لكن المشاورة لم تكن مُقيّدةً بقواعد. وقد كان في هذا القياس ما جعل الشرعية قابلةً للفحص، لأن من يملك البيعة يملك الحقّ، ومن لا يملكها لا يملكه ولو كان أفضل الناس.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد تطوّر هذا المفهوم بعد ذلك إلى نظرية أهل الحلّ والعقد في الفقه السياسي، وكان في هذه النظرية محاولةٌ لتحويل الممارسة إلى مؤسسة. وقد كان في هذا التطوّر ما يُظهر أن الأمة حاولت أن تُعالج مشكلةً لم يحلّها العهد الأول، وهي: كيف تُنظَّم الشورى بحيث لا تصير فوضى ولا تصير شكلًا بلا مضمون.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالمساءلة والطاعة المقيّدة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت المساءلة في العهد الراشدي مباشرةً وغير مؤسسية، لأن الناس كانوا يُعاتبون الخليفة في المسجد والسوق. وقد كان في هذا المباشرة قوّةً وضعفًا: قوّةً لأنها تجعل الحاكم قريبًا من الناس، وضعفًا لأنها تعتمد على شخص الحاكم لا على نظامٍ يُلزمه. وقد كان في هذه الممارسة ما جعل القرار يُتّخذ بعد مشاورة، لكنها لم تُلزم الحاكم بالرأي، وهذا ما جعلها عرضةً للتعطيل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بقي مبدأ الطاعة المقيّدة بالمعروف هو الأصل في الفكر السياسي الإسلامي، وكان في هذا المبدأ ما يُحرّم الطاعة في المعصية، وكان في هذا ما يُعطي الناس حقًّا في الاعتراض على الأمر الظالم. وقد كان في هذا المبدأ ما استُعمل في تاريخٍ طويل، وكان في استعماله ما يُظهر أن النصوص تُقرأ بحسب حاجة العصر.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالبيعة\u003c/b\u003e\u003cspan\u003eعقدٌ بين الحاكم والأمة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالشورى\u003c/b\u003e\u003cspan\u003eممارسةٌ لا مؤسسة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالطاعة\u003c/b\u003e\u003cspan\u003eفي المعروف لا في المعصية\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالولاية\u003c/b\u003e\u003cspan\u003eعقدٌ يُعزل صاحبه\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمال\u003c/b\u003e\u003cspan\u003eمال الجماعة في بيت المال\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمبدأ\u003c/th\u003e\u003cth\u003eتطبيقه في العهد\u003c/th\u003e\u003cth\u003eأثره\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالبيعة\u003c/td\u003e\u003ctd\u003eالسقيفة ثم المسجد\u003c/td\u003e\u003ctd\u003eشرعيةٌ علنية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالشورى\u003c/td\u003e\u003ctd\u003eاستشارة أهل الرأي\u003c/td\u003e\u003ctd\u003eقرارٌ مشترك\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمساءلة\u003c/td\u003e\u003ctd\u003eالاعتراض في المسجد\u003c/td\u003e\u003ctd\u003eحاكمٌ تحت النقد\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالطاعة\u003c/td\u003e\u003ctd\u003eمقيّدةٌ بالمعروف\u003c/td\u003e\u003ctd\u003eحقُّ الاعتراض\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالولاية\u003c/td\u003e\u003ctd\u003eتعيينٌ وعزلٌ ومحاسبة\u003c/td\u003e\u003ctd\u003eدولةٌ لا إقطاعة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eوَأَمْرُهُمْ شُورَىٰ بَيْنَهُمْ\u003c/p\u003e\u003ccite\u003eسورة الشورى، الآية ٣٨\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eقام نظام الراشدين على البيعة والشورى والمساءلة، وعلى طاعةٍ مقيّدة بالمعروف، وعلى مالٍ هو مال الجماعة. وقد كان في هذا النظام قوّةٌ في المبدأ وضعفٌ في الآلية، وهو ما ظهر في الفتنة بعد ذلك.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"bayt-al-mal","n":"بيت المال والقضاء والحسبة","ic":"💰","part":"القسم الخامس: إرث الراشدين","h":"\u003carticle class=\"ch3\" id=\"bayt-al-mal\" data-toc=\"بيت المال والقضاء والحسبة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e5.2\u003c/span\u003e\n          \u003ch3\u003e💰 بيت المال والقضاء والحسبة\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي ثلاثين سنة وُضعت مؤسسات الدولة المالية والقضائية: بيت مالٍ يُجمع فيه ويُوزّع، وقضاةٌ ينظرون في الخصومات، ومحتسبون يراقبون الأسواق. ولم تكن هذه المؤسسات في الجزيرة قبل ذلك.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان بيت المال في أصله خزانةً للمال العام، وكانت موارده من الزكاة والجزية والخراج والعشور والغنائم، وكانت مصارفه على الجند والعطاء والفقراء والبنية. وقد كان في هذا النظام ما يجعل المال العام معروف المصدر والمصرف، وكان في هذا ما يُخالف ما كان في الدول القديمة حيث كان المال مال الملك. وكان في هذا النظام ما يجعل الدولة قادرة على التخطيط، لأنها تعرف ما يدخل وما يخرج، بخلاف الدول التي تعيش على الغنائم المفاجئة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت الزكاة في النظام المالي ركنًا دينيًّا ووظيفةً مالية في وقتٍ واحد، وكانت تُجمع من الأغنياء وتُوزّع على ثمانية أصناف، وكان في هذا ما يجعل للفقراء حقًّا في المال لا صدقةً تُمنّ عليهم. وقد كان في هذا النظام ما يُشبه الضريبة التصاعدية، لأنها تُؤخذ من المال الزائد لا من كل مال. وقد كان في هذا النظام ما يُقارب ما يُعرف اليوم بالضمان الاجتماعي، لأن الزكاة تُعطي من لا يستطيع أن يُطالب بحقّه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان الخراج يُفرض على الأرض، وكان الجزية تُفرض على الشخص غير المسلم القادر، وكان العشر يُفرض على التجارة، وكان في هذا التنوّع ما يجعل النظام المالي قادرًا على أن يُغطّي نفقات دولةٍ تتوسّع. وقد كان في هذا النظام ما يُظهر أن الفقه المالي الإسلامي نشأ من حاجات الدولة العملية لا من التنظير المجرّد. وقد كان في هذا التنوّع ما جعل النظام قادرًا على مواجهة الأزمات، لأن الدولة لم تكن تعتمد على موردٍ واحد كما تعتمد الدول النفطية اليوم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان القضاء في العهد الراشدي وظيفةً مستقلة، وكان القاضي يُعيّن للفصل في الخصومات، وكان يُشترط فيه العلم والعدل، وكان في هذا ما يجعل القضاء سلطةً ثالثة. وقد كان في رسائل عمر إلى قضاة الأمصار ما يُشبه دليلًا إجرائيًّا: في البينة والإقرار والصلح واليمين، وكان في هذا ما جعل القضاء الإسلامي يتشكّل مبكرًا. وقد كانت رسائل عمر إلى القضاة تُشبه الدليل الإجرائي، وفيها تفصيلٌ في البينة والإقرار والصلح، وهذا ما يجعل القضاء الإسلامي مبنيًّا على قواعد لا على مزاج القاضي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت الحسبة وظيفةً أخرى، وكانت تُراقب الأسواق والأوزان والأسعار والأخلاق العامة، وكان في هذا ما يُشبه الرقابة الإدارية والبلدية. وقد كان في هذا النظام ما يُظهر أن الدولة كانت تُنظّم الحياة اليومية لا الحرب فقط، وكان في هذا ما جعل المدن الإسلامية تُصبح مدنًا منظّمة. وقد كان في هذا النظام ما جعل المدن الإسلامية تُصبح مدنًا منظّمة، لأن السوق المنظّم يجذب التجار ويُخفض الأسعار ويُحمي المستهلك.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في النظام المالي مبدأ أن المال لا يُحبس، لأن حبس المال يُعطّل الاقتصاد، وكان في هذا ما يُظهر أن الفقهاء كانوا يُفكّرون في دوران المال قبل أن تُصاغ المصطلحات. وقد كان في هذا المبدأ ما جعل الأموال تُنفق في الفتوح والبناء، وكان في هذا ما جعل الاقتصاد ينمو بسرعة. وقد كان في هذا المبدأ ما يُفسّر سرعة نمو الاقتصاد الإسلامي في القرن الأول، لأن المال الذي يدور يُنتج أكثر من المال المحبوس.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في النظام المالي أيضًا مشكلات: أن العطاء صار يتفاوت بحسب السابقة، وكان في هذا ما أثار نقاشًا، وأن الأموال كثرت في عهد عثمان فصار الناس يتنافسون، وكان في هذا ما جعل السياسة المالية موضوعًا للخلاف السياسي. وقد كان في هذا ما يُفسّر أن الفتنة كانت لها أسبابٌ اقتصادية لا سياسية فقط. وقد كان في هذا الخلاف ما جعل السياسة المالية موضوعًا للنقاش العام، وكان في هذا ما جعل الفتنة تجد في الأمصار من يُحرّكها بمطالب مالية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه المؤسسات ما جعل الدولة الإسلامية دولةً قادرة على أن تُدير بلادًا واسعة، وكان في هذا ما جعلها تبقى بعد موت مؤسسيها. وقد كان في هذا الدرس ما يُستفاد في كل زمان: أن الدولة التي تُبنى على مؤسسات تعيش أطول من الدولة التي تُبنى على شخص. وهذا ما يُلاحظ في كل دولةٍ تتوسّع بسرعة: أن مؤسساتها المالية تتأخّر عن حدودها، وأن الفساد يبدأ من المناطق البعيدة عن المركز.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eمصادر المال\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت مصادر المال في الدولة الإسلامية أربعة: الزكاة، والجزية، والخراج، والعشور، وكان لكل واحدٍ منها حكمه ومصرفه. وقد كان في هذا التفريق ما يُظهر دقّة النظام المالي، لأن كل نوعٍ من المال له جهةٌ لا يُصرف في غيرها. وقد كان في هذا التفريق ما جعل النظام المالي دقيقًا، لأن كل مالٍ له مصرفه، وهذا ما يمنع أن يُصرف مال الزكاة في الحرب أو العكس.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الغنائم مصدرًا خامسًا، وكانت تُقسم بحسب أحكامٍ محدّدة، وكان الخُمس يُصرف في مصارف خاصة. وقد كان في هذا النظام ما جعل الدولة قادرةً على أن تُموّل الفتوح، وكان في هذا ما يُفسّر أن الجيوش كانت تُقاتل بلا رواتب كبيرة في أول الأمر، لأن الغنيمة كانت حافزًا.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالقضاء\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان القضاء في العهد الراشدي يقوم على الاستقلال والعدل، وكان القاضي ينظر في القضية بنفسه ولا يُوكلها، وكان في هذا ما جعل القضاء مؤسسةً ذات هيبة. وقد كان في العهد العمري أن القضاة صاروا يُعيّنون في الأمصار، وكان في هذا ما يُظهر أن الدولة كانت تُدرك أن القضاء جزءٌ من الحكم لا زيادةٌ عليه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في القضاء الإسلامي مبدأ أن الحكم لا يُنفّذ إلا ببينة أو إقرار أو يمين، وكان في هذا ما يُشبه الإجراءات القضائية الحديثة. وقد كان في هذا المبدأ ما جعل الناس يثقون في القضاء، وكان في هذا ما جعل الدولة تُحكم بالقانون لا بالقوة. وقد كان في هذا المبدأ ما جعل الناس يثقون في القضاء، لأن الحكم لا يقوم على الشكّ بل على الدليل.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالحسبة والسوق\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الحسبة وظيفةً تُراقب السوق والأسعار والأوزان، وكان في هذا ما يُشبه حماية المستهلك في العصر الحديث. وقد كان في هذا النظام ما يُظهر أن الإسلام لم يترك السوق بلا تنظيم، وأنه لم يُنظّمه بتسعيرٍ إجباري في الغالب، بل بمنع الغش والاحتكار. وقد كان في هذا التنظيم ما جعل السوق الإسلامية سوقًا حرّةً نسبيًّا، لأن الدولة لم تُسعّر إلا في حالاتٍ نادرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا المبدأ ما جعل الأسواق الإسلامية تُصبح مراكز تجارةٍ كبيرة، لأن التاجر الذي يعرف أنه يُراقب يُحسن، ولأن المشتري الذي يعرف أن له حمايةً يثق. وقد كان في هذا ما يُفسّر ازدهار المدن الإسلامية في القرون الأولى، لأن الاقتصاد يحتاج إلى ثقةٍ قبل أن يحتاج إلى رأس مال.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالزكاة\u003c/b\u003e\u003cspan\u003eحقٌّ للفقراء في المال\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالخراج\u003c/b\u003e\u003cspan\u003eضريبةٌ على الأرض\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالجزية\u003c/b\u003e\u003cspan\u003eعلى غير المسلم القادر\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالقضاء\u003c/b\u003e\u003cspan\u003eسلطةٌ مستقلة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالحسبة\u003c/b\u003e\u003cspan\u003eرقابةٌ على السوق\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمؤسسة\u003c/th\u003e\u003cth\u003eمصدرها\u003c/th\u003e\u003cth\u003eمصرفها\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالزكاة\u003c/td\u003e\u003ctd\u003eأموال المسلمين\u003c/td\u003e\u003ctd\u003eثمانية أصناف\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالخراج\u003c/td\u003e\u003ctd\u003eالأرض المفتوحة\u003c/td\u003e\u003ctd\u003eمصالح الدولة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالجزية\u003c/td\u003e\u003ctd\u003eغير المسلمين\u003c/td\u003e\u003ctd\u003eبيت المال\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالعشور\u003c/td\u003e\u003ctd\u003eالتجارة\u003c/td\u003e\u003ctd\u003eبيت المال\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالغنائم\u003c/td\u003e\u003ctd\u003eالحرب\u003c/td\u003e\u003ctd\u003eأربعة أخماس للجند وخُمسٌ لله\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eكَيْ لَا يَكُونَ دُولَةً بَيْنَ الْأَغْنِيَاءِ مِنكُمْ\u003c/p\u003e\u003ccite\u003eسورة الحشر، الآية ٧\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eوُضع في العهد الراشدي نظام مالي متكامل من الزكاة والخراج والجزية والعشور، ونظام قضائي مستقل، وحسبةٌ تُراقب السوق. وقد جعل هذا النظام الدولة قادرةً على إدارة بلادٍ واسعة، وأعطى الفقراء حقًّا في المال.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"futuh-impact","n":"أثر الفتوح في العالم","ic":"🌍","part":"القسم الخامس: إرث الراشدين","h":"\u003carticle class=\"ch3\" id=\"futuh-impact\" data-toc=\"أثر الفتوح في العالم\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e5.3\u003c/span\u003e\n          \u003ch3\u003e🌍 أثر الفتوح في العالم\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي ثلاثين سنة خرج العرب من الجزيرة إلى ثلاثة قارات، ودخلت شعوبٌ كثيرة في الإسلام أو في ذمّته. ولم يكن الأثر عسكريًّا فقط، بل كان لغويًّا ودينيًّا واقتصاديًّا وعمرانيًّا.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان أول أثر للفتوح أن الجزيرة صارت مركزًا لا هامشًا، فقد كانت قبل الإسلام أرضًا بين دولتين، وصارت بعده مركز إمبراطورية تمتدّ من نهر جيحون إلى الأندلس. وقد كان في هذا التحوّل ما غيّر الاقتصاد العربي، لأن القبائل التي كانت تعيش على الرعي والتجارة صارت تعيش على العطاء والخراج. وقد كان في هذا التحوّل ما جعل القبيلة تفقد استقلالها الاقتصادي، لأنها صارت تعتمد على العطاء الذي تُوزّعه الدولة لا على الغزو والرعي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان الأثر الديني هو الأعمق، فقد دخلت شعوب فارس والشام ومصر وإفريقية في الإسلام بالتدريج، وكان الدخول في الغالب بقناعةٍ لا بإكراه، لأن النظام كان يُتيح البقاء على الدين مع الجزية. وقد كان في هذا التدريج ما جعل الإسلام ينتشر في قرونٍ لا في سنوات، وكان في هذا ما جعله ينتشر بعمقٍ لا بسطحية. وقد كان في هذا التدريج ما جعل الإسلام ينتشر في المدن والقرى معًا، لأن الناس كانوا يرون سلوك المسلمين قبل أن يقرأوا في كتبهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان الأثر اللغوي كبيرًا، فقد صارت العربية لغة الإدارة والدين والعلم في البلاد المفتوحة، وكان في هذا ما جعل العربية تُصبح لغةً عالمية لأول مرة في تاريخها. وقد كان في هذا الانتشار ما جعل العربية تتأثّر بلغات الأمم المفتوحة، وكان في هذا ما جعلها تُثري معجمها بالمصطلحات الإدارية والعلمية. وقد كان في هذا الانتشار ما جعل العربية تُصبح لغة العلم لقرون، لأن من يُريد أن يتعلّم الطب أو الفلك كان عليه أن يتعلّم العربية أولًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان الأثر العمراني ظاهرًا في الأمصار الجديدة: الكوفة والبصرة والفسطاط والقيروان، وكانت هذه المدن تُبنى على نمطٍ عربي في المسجد والسوق والدار، وكان في هذا ما جعل المدن الإسلامية تُصبح نموذجًا في التخطيط. وقد كان في هذه المدن ما جعل الحضارة الإسلامية تُصبح حضارةً حضرية لا بدوية. وقد كان في هذه المدن ما جعل الحضارة الإسلامية حضارةً حضرية، لأن المسجد والسوق والمدرسة والحمّام صارت مؤسساتٍ للمدينة لا للبادية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان الأثر الاقتصادي في تحويل مسارات التجارة، فقد صارت الطرق التي كانت تُمرّ عبر بيزنطة وفارس تُمرّ عبر البلاد الإسلامية، وكان في هذا ما جعل المدن الإسلامية تُصبح مراكز تجارة عالمية. وقد كان في هذا ما يُفسّر ازدهار بغداد والقاهرة وقرطبة بعد ذلك، لأن التجارة هي التي تُنشئ المدن الكبرى. وقد كان في هذا التحوّل ما جعل المدن الإسلامية تُنافس القسطنطينية، وكان في هذا ما جعل أوروبا تتعرّف على الشرق من خلال هذه المدن.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان الأثر في الشعوب المفتوحة عميقًا أيضًا: أن الفلاحين صاروا يملكون أرضهم بعد أن كانوا أجراءً، وأن الضرائب صارت معروفةً، وأن الاضطهاد الديني خفّ، وكان في هذا ما جعل الناس يُقبلون على الحكم الجديد. وقد كان في هذا ما يُفسّر أن الفتوح لم تواجه ثوراتٍ كبيرة في القرون الأولى. وقد كان في هذا التحسّن ما جعل الفلاحين يُقبلون على الحكم الجديد، لأن من يعمل في أرضه ويُعرف ما عليه لا يُريد أن يعود إلى ما كان.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في الفتوح أثرٌ سلبي أيضًا: أن الحروب أزهقت أرواحًا كثيرة، وأن المدن التي قاومت خُرّبت، وأن بعض القبائل هاجرت، وكان في هذا ما يُظهر أن الفتح ليس عمليةً بلا ثمن. وقد كان في هذا ما جعل المؤرخين يتحدّثون عن الفتوح بحسابٍ لا بحماس، لأن التاريخ لا يُقرأ بالانتصارات وحدها. وقد كان في هذا الثمن ما يُظهر أن التاريخ لا يُقاس بالانتصارات وحدها، وأن من يُقرأ الفتوح بلا حسابٍ يقرأ نصف الحقيقة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذه الفتوح ما جعل الإسلام دينًا عالميًّا لا دين قبيلة، وكان في هذا ما غيّر طبيعة الرسالة نفسها: أن تُصبح رسالةً لشعوبٍ لا لقومٍ، وأن تُصبح لها مؤسساتٌ لا مواعظ فقط. وقد كان في هذا التحوّل ما جعل الحضارة الإسلامية تُولد في القرن الأول، وكان في هذا ما يجعل العهد الراشدي بدايةً لا نهاية. وقد كان في هذا التحوّل ما جعل الدولة تحتاج إلى فقهٍ جديد، لأن الأسئلة التي واجهتها لم تكن في الجزيرة، وهذا ما يُفسّر نشأة الفقه في القرن الأول.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالجزية والتحوّل الديني\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان نظام الجزية هو الذي جعل التحوّل الديني تدريجيًّا، لأن من أسلم سقطت عنه الجزية وصار له العطاء، ومن بقي دفع الجزية وبقي على دينه. وقد كان في هذا النظام حافزًا اقتصاديًّا للإسلام، وكان في الوقت نفسه ضمانًا لعدم الإكراه، لأن الإكراه كان سيُنتج نفاقًا لا إيمانًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا النظام مشكلةً أيضًا: أن بعض الولاة كانوا يُثقّلون الجزية على من لا يُريد الإسلام، وكان في هذا ما يُخالف روح النظام، وكان الخلفاء يُحاسبون من يفعل ذلك. وقد كان في هذا ما يُظهر أن التطبيق قد يختلف عن الأصل، وأن العدل يحتاج إلى رقابةٍ مستمرة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالأمصار والمدن\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان بناء الأمصار قرارًا استراتيجيًّا، لأن العرب لم يكونوا يُقيمون في مدنٍ مفتوحة في أول الأمر، وكانوا يخشون أن يذوبوا في السكان المحليين. وقد كان في بناء مدنٍ جديدة ما يُحفظ للجند لغتهم وعاداتهم، وكان في هذا ما يُشبه المعسكرات الدائمة التي صارت مدنًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت هذه المدن مراكز علمٍ بعد ذلك، فالكوفة والبصرة صارتا مدرستين في النحو والفقه والقراءات، والفسطاط صارت مركزًا للأزهر بعد قرون. وقد كان في هذا ما يُظهر أن القرارات العسكرية قد تُنتج نتائج ثقافية لم تكن في حساب صانعيها. وقد كان في هذا الضمان ما جعل الإسلام يُقبل عند الفقراء، لأنهم وجدوا في النظام الجديد حقًّا لا صدقة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالتجارة والاقتصاد\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الفتوح قد فتحت طرقًا جديدة للتجارة، وكانت المدن الإسلامية في وسط الطريق بين الشرق والغرب، وكان في هذا ما جعل التجار المسلمين يُسيطرون على تجارة التوابل والحرير. وقد كان في هذا ما جعل اللغة العربية لغة تجارةٍ أيضًا، لأن العقود كانت تُكتب بها. وقد كان في هذه المدن ما جعل العرب يُقيمون دائمًا لا مؤقتًا، وكان في هذا ما حوّل الجيش إلى مجتمع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا الاقتصاد ما جعل الدولة قادرةً على أن تُنفق على العلم والعمارة، وكان في هذا ما يُفسّر ازدهار الحضارة الإسلامية في القرون التالية. وقد كان في هذا الدرس ما يُظهر أن الحضارة تحتاج إلى اقتصادٍ أولًا، وأن العلم لا يُبنى بالحماس وحده. وقد كان في هذا الازدهار ما جعل الدولة تُنفق على العلم، وكان في هذا ما مهّد لبيت الحكمة والمدارس بعد قرون.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمدى\u003c/b\u003e\u003cspan\u003eمن جيحون إلى إفريقية\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمدن\u003c/b\u003e\u003cspan\u003eالكوفة والبصرة والفسطاط والقيروان\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eاللغة\u003c/b\u003e\u003cspan\u003eالعربية لغة إدارة وعلم\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالدين\u003c/b\u003e\u003cspan\u003eانتشارٌ تدريجي بلا إكراه\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالتجارة\u003c/b\u003e\u003cspan\u003eتحوّل مسارات الطرق العالمية\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمجال\u003c/th\u003e\u003cth\u003eما تغيّر\u003c/th\u003e\u003cth\u003eالأثر البعيد\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالسياسة\u003c/td\u003e\u003ctd\u003eالجزيرة صارت مركزًا\u003c/td\u003e\u003ctd\u003eإمبراطوريةٌ عالمية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالدين\u003c/td\u003e\u003ctd\u003eدخول شعوبٍ بالتدريج\u003c/td\u003e\u003ctd\u003eإسلامٌ عالمي لا قبلي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eاللغة\u003c/td\u003e\u003ctd\u003eانتشار العربية\u003c/td\u003e\u003ctd\u003eلغةُ علمٍ وثقافة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالعمران\u003c/td\u003e\u003ctd\u003eأمصارٌ جديدة\u003c/td\u003e\u003ctd\u003eمدنٌ إسلامية نموذجية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالتجارة\u003c/td\u003e\u003ctd\u003eطرقٌ جديدة\u003c/td\u003e\u003ctd\u003eازدهار المدن الكبرى\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eوَكَذَٰلِكَ جَعَلْنَاكُمْ أُمَّةً وَسَطًا\u003c/p\u003e\u003ccite\u003eسورة البقرة، الآية ١٤٣\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eخرجت الفتوح بالعرب من الجزيرة إلى ثلاثة قارات، وغيّرت الدين واللغة والتجارة والعمران. وقد انتشر الإسلام بالتدريج لا بالإكراه، وكان في هذا ما جعل الحضارة الإسلامية تُولد في القرن الأول.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"fitna-lesson","n":"الفتنة الكبرى ودرسها","ic":"🕯️","part":"القسم الخامس: إرث الراشدين","h":"\u003carticle class=\"ch3\" id=\"fitna-lesson\" data-toc=\"الفتنة الكبرى ودرسها\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e5.4\u003c/span\u003e\n          \u003ch3\u003e🕯️ الفتنة الكبرى ودرسها\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eا\u003c/span\u003eلفتنة التي بدأت سنة خمسٍ وثلاثين لم تكن خلافًا سياسيًّا فقط، بل كانت أزمةً في الشرعية وفي آلية انتقال السلطة. وقد أنتجت فرقًا في العقيدة والسياسة، وظلّ أثرها في الأمة إلى اليوم.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكانت الفتنة نتيجةً لثلاثة عوامل: أن آلية انتقال السلطة لم تكن واضحة، وأن المطالب المالية والسياسية لم تكن لها قنواتٌ شرعية، وأن الصحابة كانوا في الأمصار لا في المدينة، فلم يكن هناك مجلسٌ يُدير الأزمة. وقد كان في هذه العوامل ما يُظهر أن الفتنة كانت بنيويةً لا شخصية. وقد كان في هذه العوامل ما يُظهر أن الفتنة كانت نتيجةً لبنيةٍ لا لسوء نيّة، وأن معالجة البنية أهمّ من لوم الأشخاص.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الفتنة أن المسلمين قاتلوا بعضهم بعضًا، وكان في هذا ما جعل السيف يُصبح أداةً في الخلاف السياسي، وكان في هذا ما غيّر طبيعة الدولة بعد ذلك. وقد كان في هذا ما يُفسّر أن العهد الأموي بُني على القوّة لا على الشورى، لأن الشورى كانت قد فشلت في حفظ الأمن. وقد كان في هذا التحوّل ما جعل الدولة الأموية تبني شرعيتها على النصر والقوّة، لأن الشورى كانت قد فشلت في حفظ الأمن في نظر الناس.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أنتجت الفتنة فرقًا: الخوارج الذين كفّروا بالتحكيم، والشيعة الذين رأوا أن الإمامة في أهل البيت، والمرجئة الذين أجّلوا الحكم في الفتنة، والسنة الذين اختاروا الجماعة والاجتهاد. وقد كان في هذا التنوّع ما جعل الفكر الإسلامي غنيًّا، وكان في الوقت نفسه ما جعل الأمة مُنقسمة. وقد كان في هذا التنوّع ما جعل الفكر الإسلامي غنيًّا، لأن كل فرقةٍ طوّرت أدواتها في التفسير والفقه والكلام للدفاع عن موقفها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الفتنة درسٌ في التكفير: أن من يُكفّر أخاه على تأويلٍ يفتح بابًا لا يُغلق، لأن التكفير يُبيح الدم، وكان في هذا ما يُفسّر أن الخوارج قتلوا المسلمين أكثر مما قتلوا غيرهم. وقد كان في هذا الدرس ما يجعل الفقهاء يُشدّدون في مسألة التكفير بعد ذلك. وقد كان في هذا التكفير ما جعل الدم يُباح بين المسلمين، وهو ما لم يكن في حروب الردّة، لأن أولئك كانوا خارجين عن الجماعة وهؤلاء يدّعون الإسلام.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الفتنة درسٌ في الرواية: أن كل فرقةٍ روت التاريخ بحسب موقفها، وكان في هذا ما جعل المؤرخين يضعون قواعد للجرح والتعديل، وكان في هذا ما أنتج علمًا كاملًا هو علم الحديث. وقد كان في هذا ما يُظهر أن الأزمة قد تُنتج أدواتٍ للتحقّق، وأن العلم قد يُولد من الحاجة إلى الحقيقة. وقد كان في هذه الحاجة إلى التحقّق ما جعل علم الحديث يُصبح علمًا دقيقًا، لأن الأمة احتاجت إلى من يُميّز الصحيح من الضعيف في رواية الفتنة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الفتنة درسٌ في السياسة: أن الدولة التي لا تُحدّد كيف تنتقل السلطة تُعرّض نفسها للحرب، وأن من يُريد أن يحفظ الأمة عليه أن يبني مؤسساتٍ لا أن يعتمد على رجال. وقد كان في هذا الدرس ما يُستفاد في كل زمان، لأن المشكلة تتكرّر بأشكالٍ مختلفة. وقد كان في هذا الدرس ما جعل بعض الفقهاء يُقدّمون الأمن على الحقّ، لأن الفتنة تُفني الدين والدنيا معًا، وهذا ما يُفسّر تحفّظهم على الخروج.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الفتنة أيضًا درسٌ في التسامح: أن الصحابة اختلفوا وتقاتلوا ثم بقوا مسلمين، وأن الأمة لم تُخرج أحدًا من الدين بسبب موقفه السياسي، إلا ما فعله المتطرّفون. وقد كان في هذا ما يُظهر أن الاختلاف في السياسة لا يُلغي الأخوّة في الدين، وكان في هذا أصلًا في الفكر الإسلامي. وقد كان في هذا البقاء ما جعل الأمة تحفظ أخوّتها رغم الاختلاف، وهو ما لم يحدث في فرقٍ أخرى خرجت من الملة بالكلية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بقي أثر الفتنة في اللغة والوجدان: أن كلمة الفتنة صارت تعني الحرب الأهلية، وأن الناس صاروا يخافونها ويُحذّرون منها، وكان في هذا ما جعل الخطاب السياسي الإسلامي يُفضّل الأمن على الحقّ أحيانًا. وقد كان في هذا ما يُظهر أن التاريخ لا يُنسى، وأن الأحداث الكبرى تُصبح مصطلحاتٍ في الوعي. وقد كان في هذه المصطلحات ما جعل الخطاب السياسي الإسلامي حذرًا، لأن من يتكلّم عن الفتنة يتكلّم عن جرحٍ لم يندمل.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالفرق ومواقفها\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الخوارج يرون أن الحكم لله وحده، وأن من حكّم الرجال كفر، وكانوا يُخرجون من المُلة بالمعصية. وكانت الشيعة ترى أن الإمامة في أهل البيت بالنصّ، وأن الأمة أخطأت في السقيفة. وكانت المرجئة تُؤجّل الحكم في الفتنة ولا تُكفّر أحدًا. وقد كان في هذه المواقف ما جعل الفكر السياسي الإسلامي يتشكّل، لأن كل فرقةٍ أجابت على سؤال الشرعية بطريقتها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان أهل السنة يرون أن الصحابة مجتهدون، وأن المصيب واحدٌ والمخطئ مأجور، وأن الجماعة أولى من الفرقة. وقد كان في هذه المواقف ما جعل الفكر السياسي الإسلامي يتشكّل، وكان في هذا ما يُظهر أن الفتنة كانت مُنتِجةً للفكر بقدر ما كانت مُدمّرةً للوحدة. وقد كان في هذا الموقف ما جعل أهل السنة يُفضّلون الجماعة على الحقّ في الفتنة، وهذا ما يُفسّر تحفّظهم على الثورات.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالتكفير والدم\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان أخطر ما أنتجته الفتنة هو التكفير، لأنه حوّل الخلاف السياسي إلى خلافٍ ديني، وكان في هذا ما جعل الدم مُباحًا. وقد كان في هذا ما يُظهر أن التكفير سلاحٌ يُدمّر من يستعمله قبل أن يُدمّر خصمه، لأن الجماعة التي تُكفّر الناس تبقى في حربٍ دائمة. وقد كان في هذا المنهج ما جعل الفقه السياسي يفرّق بين الرأي والسلاح، وهو تفريقٌ مهم في كل نزاعٍ داخلي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في موقف عليٍّ من الخوارج ما يُشبه المنهج: أنه ناقشهم بالحجة، ولم يُكفّرهم، وقاتلهم لأنهم حملوا السلاح لا لأنهم خالفوا الرأي. وقد كان في هذا فرقٌ مهم في الفقه السياسي: أن الخلاف في الرأي لا يُبيح القتال، وأن القتال يكون على الفعل لا على الاعتقاد.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالدرس السياسي\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الدرس السياسي للفتنة أن الأمة احتاجت إلى آليةٍ لانتقال السلطة، وأن الشورى بلا قواعد لا تحفظ الأمن. وقد كان في هذا ما دفع الفقهاء إلى التنظير للخلافة والإمامة، وكان في هذا ما أنتج كتبًا في السياسة الشرعية. وقد كان في هذا التنظير ما جعل الفقه السياسي يُصبح بابًا مستقلًّا، وكُتبت فيه كتبٌ من أشهرها الأحكام السلطانية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الدرس أيضًا أن الدولة تحتاج إلى مؤسسةٍ للشورى لا إلى أفراد، وأن من يُريد أن يحفظ الجماعة عليه أن يبني نظامًا لا أن يُعلّق الأمل على رجل. وقد كان في هذا الدرس ما يُستفاد في كل عصر، لأن المشكلة ليست في الأشخاص بل في البنية. وقد كان في هذا الدرس ما جعل بعض المفكّرين يُطالبون بمؤسسةٍ للشورى، لأن الأفراد يذهبون والنظام يبقى.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالبداية\u003c/b\u003e\u003cspan\u003eسنة ٣٥هـ بمقتل عثمان\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالفرق\u003c/b\u003e\u003cspan\u003eخوارج وشيعة ومرجئة وسنة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالأخطر\u003c/b\u003e\u003cspan\u003eالتكفير وإباحة الدم\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمنهج\u003c/b\u003e\u003cspan\u003eالحجة لا التكفير\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالدرس\u003c/b\u003e\u003cspan\u003eالحاجة إلى آليةٍ للسلطة\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالفرقة\u003c/th\u003e\u003cth\u003eموقفها\u003c/th\u003e\u003cth\u003eأثرها\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالخوارج\u003c/td\u003e\u003ctd\u003eالحكم لله والتكفير بالذنب\u003c/td\u003e\u003ctd\u003eخروجٌ على كل سلطة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالشيعة\u003c/td\u003e\u003ctd\u003eالإمامة في أهل البيت\u003c/td\u003e\u003ctd\u003eفكرٌ سياسي خاص\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمرجئة\u003c/td\u003e\u003ctd\u003eتأجيل الحكم في الفتنة\u003c/td\u003e\u003ctd\u003eتجنّبُ التكفير\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eأهل السنة\u003c/td\u003e\u003ctd\u003eالجماعة والاجتهاد\u003c/td\u003e\u003ctd\u003eاستقرارُ الفقه السياسي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمعتزلة\u003c/td\u003e\u003ctd\u003eالأمر بالمعروف والعدل\u003c/td\u003e\u003ctd\u003eفكرٌ عقلي وسياسي\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eوَاعْتَصِمُوا بِحَبْلِ اللَّهِ جَمِيعًا وَلَا تَفَرَّقُوا\u003c/p\u003e\u003ccite\u003eسورة آل عمران، الآية ١٠٣\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eأنتجت الفتنة فرقًا وعلومًا ومشكلات، وكان أخطر ما فيها التكفير الذي أباح الدم. وقد بقي درسها أن الأمة تحتاج إلى آليةٍ لانتقال السلطة، وأن الخلاف في الرأي لا يُبيح القتال.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-6","n":"القسم السادس: المجتمع والولايات","ic":"","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-6\" style=\"--c:#8B1A3A\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🏘️\u003c/div\u003e\n      \u003ch2\u003eالقسم السادس: المجتمع والولايات\u003c/h2\u003e\n      \u003cp\u003eلم تكن الدولة الراشدية جيشًا وفتحًا فقط، بل كانت مجتمعًا يتشكّل: نساءٌ يشاركن في الحرب والرواية والسوق، وولاياتٌ تُدار من المدينة بمراسلاتٍ ومحاسبة، وأعرافٌ جديدة تُبنى في المدن المفتوحة.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#women\"\u003eالنساء في العهد الراشدي\u003c/a\u003e\u003ca href=\"#provinces\"\u003eالولايات والإدارة المحلية\u003c/a\u003e\u003ca href=\"#tribes-in-amsar\"\u003eالقبائل في الأمصار\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"women","n":"النساء في العهد الراشدي","ic":"🌸","part":"القسم السادس: المجتمع والولايات","h":"\u003carticle class=\"ch3\" id=\"women\" data-toc=\"النساء في العهد الراشدي\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e6.1\u003c/span\u003e\n          \u003ch3\u003e🌸 النساء في العهد الراشدي\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eك\u003c/span\u003eانت النساء في العهد الراشدي حاضرات في الحرب والرواية والسوق والفتوى، وكانت عائشة من أكثر من روى الحديث، وكانت الشفاء بنت عبد الله تتولّى الحسبة في السوق. وهذا ما يُخالف صورةً شائعة عن انغلاق المجتمع.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكانت عائشة بنت أبي بكر من أكثر الصحابة روايةً للحديث، وكانت تُفتي في الفقه والتفسير، وكان يُرجع إليها في مسائل كثيرة بعد موت النبيّ. وقد كان في هذا ما يُظهر أن المرأة في المجتمع الإسلامي الأول كانت تُشارك في العلم، وأن بيت النبيّ كان مدرسةً للرجال والنساء معًا. وقد كان في هذا ما جعل بيت النبيّ مرجعًا للناس بعد موته، لأن من سمع الحديث منه مباشرةً صار مصدرًا يُسأل عن معنى ما سمع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت حفصة بنت عمر من النساء اللواتي حُفظت عندهنّ نسخة المصحف التي جُمعت في عهد أبي بكر، وكانت عندها حتى أُخذت لنسخ المصاحف في عهد عثمان. وقد كان في هذا ما يُظهر أن المرأة كانت موضع ثقةٍ في أعظم وثيقةٍ في الأمة، وكان في هذا ما يُخالف من يزعم أنها كانت معزولةً عن الشأن العام. وقد كان في هذا الحفظ ما جعل المرأة حاملةً لوثيقةٍ لا تُقدّر بثمن، وكان في هذا ما يدل على أن الثقة لم تكن مرتبطةً بالجنس بل بالأمانة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت النساء يخرجن في المعارك يُسقين الماء ويُداوين الجرحى، وكانت نسيبة بنت كعب تُقاتل في أُحد، وكانت أسماء بنت أبي بكر تُشارك في الهجرة بحمل الزاد، وكانت في هذه المواقف ما يُظهر أن النساء كنّ حاضرين في أشدّ اللحظات. وقد كان في هذا ما جعل بعض المؤرخين يقولون إن النساء كنّ نصف الجيش في الحرب النفسية واللوجستية. وقد كان في هذه المشاركة ما جعل النساء يعرفن تفاصيل المعارك، وكان في هذا ما جعل بعضهنّ يروي أحداثًا لم يروها الرجال.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت الشفاء بنت عبد الله العدوية من النساء اللواتي عيّنهنّ عمر بن الخطاب في وظيفةٍ عامة، وقد قيل إنها كانت تتولّى الحسبة في السوق، أي مراقبة الأسعار والأوزان والغش. وقد كان في هذا ما يُظهر أن النساء كنّ في الوظائف العامة، وأن المجتمع لم يكن يمنع المرأة من العمل إذا كانت كفؤة. وقد كان في هذا التعيين ما يُظهر أن الوظيفة العامة كانت تُعطى للكفاءة، وأن عمر لم يمنع امرأةً من عملٍ تُحسنه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في العهد الراشدي تشريعٌ في حقوق المرأة في الميراث والصداق والنفقة، وكان في هذا ما غيّر وضع المرأة العربية قبل الإسلام، حيث كانت المرأة تُورَّث ولا تُورِّث. وقد كان في هذا التشريع ما جعل للمرأة ذمّةً مالية مستقلة، وكان في هذا ما يُعدّ من أهمّ التحوّلات في تاريخ المرأة. وقد كان في هذا التشريع ما جعل المرأة شريكةً في الاقتصاد، وكان في هذا ما غيّر بنية الأسرة العربية من جذورها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في العهد العمري اجتهادٌ في تحديد المهور ومنع المغالاة فيها، وكان في هذا ما يُظهر أن الدولة كانت تتدخّل في الشأن الاجتماعي لحماية الأسر من الأعباء. وقد كان في هذا الاجتهاد ما أثار نقاشًا، لكنه كان يدلّ على أن الفقه كان يُراعي المصلحة الاجتماعية لا النصّ المجرّد فقط. وقد كان في هذا التدخّل ما يُظهر أن الدولة كانت تُراعي الأسر الفقيرة، وكان في هذا ما جعل الزواج ممكنًا لمن لا يملك المال الكثير.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في العهد الراشدي نساءٌ شاعرات مثل الخنساء التي كانت تُنشد في المدينة، وكان الشعراء يُنشدون في المسجد وفي مجالس الخلافة، وكان في هذا ما يُظهر أن الحياة الثقافية لم تكن حكرًا على الرجال. وقد كان في هذا ما يُفسّر كثرة أسماء النساء في كتب الطبقات والتراجم بعد ذلك. وقد كان في هذا الحضور ما جعل المدينة مركزًا ثقافيًّا، وكان في هذا ما جعل النساء يُشاركن في الحياة العامة بلا حرج.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في حياة النساء في هذا العهد قيودٌ أيضًا، فقد كانت هناك أعرافٌ قبلية تُحدّ من حركتهنّ، وكانت بعض المواقف تُقيّد مشاركتهنّ في الحرب بعد أُحد، وكان في هذا ما يُظهر أن المجتمع كان في مرحلة انتقال. وقد كان في هذا ما يجعلنا نقرأ السيرة بحذرٍ: أن نأخذ النصوص كلها لا بعضها، وأن نُفرّق بين التشريع والعرف. وقد كان في هذا التمييز ما يُظهر أن الفقه يحتاج إلى معرفة السياق، وأن من يقرأ النصّ بلا سياقه يُخطئ في فهمه.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالرواية والفتوى\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت عائشة وحفصة وأم سلمة من أكثر النساء روايةً، وكان الصحابة يرجعون إليهنّ في مسائل لا يعرفها غيرهنّ، مثل مسائل الحيض والنفاس والصلاة في السفر. وقد كان في هذا ما يُظهر أن العلم لم يكن محصورًا في الرجال، وأن التخصّص كان معيارًا لا الجنس. وقد كان في هذا التخصّص ما جعل العلم دقيقًا، لأن من يُسأل في بابٍ يُجيب بتحقيقٍ لا بتخمين.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا ما جعل النساء يُصبحن مراجع في الفتوى بعد ذلك، وكان في هذا ما يُفسّر أن كتب التراجم فيها تراجم لنساءٍ عالماتٍ في القرون الأولى. وقد كان في هذا ما يُخالف صورةً انتشرت في بعض الكتابات الحديثة عن انغلاقٍ لم يكن في العهد الأول. وقد كان في هذه التراجم ما يُظهر أن المرأة العالمة كانت معروفةً في القرن الأول، وكان في هذا ما يُصحّح صورةً شائعة عن العزلة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالحرب والخدمة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت النساء يخرجن مع الجيوش يُسقين ويُداوين ويحملن الطعام، وكان بعضهنّ يُقاتل عند الحاجة، وكان في هذا ما جعل بعض المعارك تُحسم بثبات النساء حين اضطرب الرجال. وقد كان في هذا ما يُظهر أن الحرب في ذلك العهد كانت حرب مجتمعٍ لا حرب جيشٍ محترف. وقد كان في هذا الحضور ما جعل النساء يعرفن الحرب من داخلها، وكان في هذا ما جعل روايتهنّ عن المعارك دقيقة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا العمل أجرٌ وغنيمة، لأن من حضر المعركة كان له سهم، وكان في هذا ما جعل النساء يُشاركن في الاقتصاد الحربي. وقد كان في هذا ما يُفسّر أن النساء كنّ يعرفن أحوال الجيوش، وكان في هذا ما جعل بعضهنّ يروي تفاصيل المعارك. وقد كان في هذا السهم ما جعل المرأة مشاركةً في الاقتصاد الحربي، وكان في هذا ما جعلها في قلب الحدث لا على هامشه.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالحقوق المالية\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان للمرأة في العهد الراشدي ذمّةٌ مالية مستقلة: ترث وتُورِّث، وتملك الصداق، وتتصرّف في مالها، وكان في هذا ما غيّر وضعها قبل الإسلام. وقد كان في هذا التشريع ما جعل المرأة شريكةً في الاقتصاد لا تابعةً للرجل. وقد كان في هذا الاستقلال ما جعل المرأة قادرةً على أن تُدير مالها، وكان في هذا ما جعل بعض النساء من أهل التجارة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا ما جعل بعض النساء يُصبحن من ذوي المال والتجارة، وكان في هذا ما يُظهر أن الإسلام لم يُلغِ نشاط المرأة الاقتصادي، بل نظّمه. وقد كان في هذا ما يُفسّر أن في المدينة نساءً لهنّ أملاكٌ وأوقاف، وقد ذُكر ذلك في كتب التاريخ. وقد كان في هذه الأملاك ما يُظهر أن المرأة كانت فاعلةً اقتصاديًّا، وكان في هذا ما يُخالف صورةً رسمت المرأة في زاويةٍ واحدة.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eعائشة\u003c/b\u003e\u003cspan\u003eمن أكثر الصحابة روايةً للحديث\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eحفصة\u003c/b\u003e\u003cspan\u003eحفظت نسخة المصحف الأول\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eنسيبة\u003c/b\u003e\u003cspan\u003eقاتلت في أُحد\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالشفاء\u003c/b\u003e\u003cspan\u003eتولّت الحسبة في السوق\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالميراث\u003c/b\u003e\u003cspan\u003eذمّةٌ مالية مستقلة للمرأة\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمجال\u003c/th\u003e\u003cth\u003eالمشاركة\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالرواية\u003c/td\u003e\u003ctd\u003eعائشة وحفصة وأم سلمة\u003c/td\u003e\u003ctd\u003eحفظُ جزء كبير من السنة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالفتوى\u003c/td\u003e\u003ctd\u003eنساءٌ يُسألن في الفقه\u003c/td\u003e\u003ctd\u003eمرجعيةٌ علمية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالحرب\u003c/td\u003e\u003ctd\u003eالسقاية والتمريض والقتال\u003c/td\u003e\u003ctd\u003eثباتُ الجيش\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالسوق\u003c/td\u003e\u003ctd\u003eالشفاء في الحسبة\u003c/td\u003e\u003ctd\u003eوظيفةٌ عامة للمرأة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمال\u003c/td\u003e\u003ctd\u003eالميراث والصداق\u003c/td\u003e\u003ctd\u003eاستقلالٌ اقتصادي\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eفَاسْتَجَابَ لَهُمْ رَبُّهُمْ أَنِّي لَا أُضِيعُ عَمَلَ عَامِلٍ مِّنكُم مِّن ذَكَرٍ أَوْ أُنثَىٰ\u003c/p\u003e\u003ccite\u003eسورة آل عمران، الآية ١٩٥\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eكانت النساء في العهد الراشدي حاضرات في الرواية والفتوى والحرب والسوق، وكان للمرأة ذمّةٌ مالية مستقلة. وقد كان في هذا ما يُخالف صورةً شائعة عن انغلاق المجتمع، مع بقاء أعرافٍ قبلية تُقيّد الحركة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"provinces","n":"الولايات والإدارة المحلية","ic":"🗂️","part":"القسم السادس: المجتمع والولايات","h":"\u003carticle class=\"ch3\" id=\"provinces\" data-toc=\"الولايات والإدارة المحلية\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e6.2\u003c/span\u003e\n          \u003ch3\u003e🗂️ الولايات والإدارة المحلية\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eم\u003c/span\u003eن المدينة كانت تُدار بلادٌ تمتدّ من مصر إلى خراسان، وكان الوالي يُعيّن ويُعزل ويُحاسب، وكان في كل ولايةٍ قاضٍ وعاملُ خراج. وهذا نظامٌ لم تكن الجزيرة تعرفه قبل الإسلام.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكانت الولايات في العهد الراشدي تُدار من المركز، وكان الخليفة يُعيّن الوالي ويكتب له عهدًا يُحدّد صلاحياته، وكان في هذا ما يجعل الإدارة موحّدةً لا متعدّدة المراكز. وقد كان في هذا النظام ما يُشبه الإدارة المركزية في الدول الحديثة، مع فارق الوسائل. وقد كان في هذا العهد ما يُشبه الدستور الإداري، لأنه كان يُحدّد ما للوالي وما عليه، وكان في هذا ما يمنع تجاوز الصلاحيات.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في كل ولايةٍ وظائف متعددة: الوالي للإدارة والجيش، وعامل الخراج للمال، والقاضي للحكم، وصاحب الشرطة للأمن، وكان في هذا التوزيع ما يمنع أن يجتمع المال والسلاح والحكم في يد واحد. وقد كان في هذا ما يُشبه الفصل بين السلطات، وكان في هذا ما جعل الفساد أقلّ. وقد كان في هذا التوزيع ما جعل كل مسؤولٍ يُحاسب في مجاله، وكان في هذا ما منع أن يُصبح الوالي سيّدًا على المال والحكم معًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان الخليفة يُراقب الولاة بالمراسلات وبالجواسيس وباستدعائهم في الحجّ، وكان في هذا ما يجعل المحاسبة ممكنة، وكان في هذا ما يُفسّر أن الولاة لم يستقلّوا في العهد الراشدي كما استقلّوا بعد ذلك. وقد كان في هذا ما يُظهر أن الدولة كانت قادرة على أن تُمسك أطرافها. وقد كان في هذه الرقابة ما جعل الولاة يحسبون لكل تصرّف، وكان في هذا ما جعل الدولة قادرةً على أن تُصحّح أخطاءها بسرعة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت الأمصار تُدار بنظامٍ خاص، لأنها مدنٌ عسكرية نشأت من الفتوح، وكان فيها دواوين للجند وسجلات للعطاء، وكان فيها مسجدٌ جامع وسوقٌ ودارٌ للإمارة. وقد كان في هذا التخطيط ما جعلها مدنًا كاملة، وكان في هذا ما جعلها مراكز للعلم بعد ذلك. وقد كان في هذه المدن ما جعل الجند يُقيمون مع أسرهم، وكان في هذا ما حوّل المعسكر إلى مجتمع، وكان في هذا ما جعلها مراكز علم بعد ذلك.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في كل مصرٍ عرفاء يُديرون الجماعات بحسب القبائل والأحياء، وكان في هذا النظام ما يُشبه الإدارة المحلية الصغيرة، وكان في هذا ما جعل المدينة تُدار بلا بيروقراطية كبيرة. وقد كان في هذا ما يُفسّر سرعة اتخاذ القرار في الدولة الأولى. وقد كان في هذا النظام ما جعل القرار سريعًا، لأن العرفاء كانوا يعرفون الناس، وكان في هذا ما جعل التعبئة ممكنةً في أيام.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت السياسة مع أهل البلاد تقوم على العهود، وكان الوالي يُوقّع الصلح مع المدن، وكان في هذا ما يجعل الإدارة محليةً في تفاصيلها ومركزيةً في مبادئها. وقد كان في هذا ما جعل الشعوب المفتوحة تُحافظ على نظمها المحلية، وكان في هذا ما يُفسّر استقرار البلاد. وقد كان في هذه العهود ما جعل أهل البلاد يُحافظون على نظمهم، وكان في هذا ما جعل الإدارة أقلّ كلفةً وأكثر قبولًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في النظام البريدي بدايةٌ في هذا العهد، فقد كان الخليفة يُرسل رسائله مع رسلٍ خاصين، وكان في هذا ما يُشبه البريد السريع، وكان في هذا ما جعل المركز يعرف أخبار الأطراف في أسابيع. وقد كان في هذا ما يُفسّر قدرة الخليفة على إدارة بلادٍ واسعة بلا وسائل حديثة. وقد كان في هذه الرسائل ما جعل الخليفة يعرف ما يجري في الأطراف، وكان في هذا ما جعل القرار المركزي ممكنًا بلا نقلٍ سريع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذه الإدارة مشكلات: أن المسافة كانت تُضعف الرقابة، وأن بعض الولاة كانوا يستغلّون بُعدهم، وأن الخليفة كان يعتمد على ثقته بالأشخاص أكثر من اعتماده على النظم. وقد كان في هذا ما يُفسّر أن الفتنة بدأت في الأمصار لا في المدينة، لأن الغضب كان يُولد بعيدًا عن المركز ثم يصل إليه متأخرًا. وقد كان في هذا البعد ما جعل الغضب يتراكم بلا رقيب، وكان في هذا ما جعل الفتنة تبدأ من الأمصار لا من المدينة.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالوظائف والصلاحيات\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الوالي مسؤولًا عن الجيش والأمن والإدارة، وكان عامل الخراج مسؤولًا عن المال، وكان القاضي مسؤولًا عن الحكم، وكان في هذا التوزيع ما يمنع الاستبداد المحلي. وقد كان في هذا النظام ما يُشبه الحوكمة، لأن كل مسؤولٍ كان يُحاسب في مجاله. وقد كان في هذا التوزيع ما جعل السلطة المحلية موزّعةً، وكان في هذا ما جعل الاستبداد المحلي صعبًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان الخليفة يعزل الولاة بسهولة، وكان في هذا ما يجعل المنصب وظيفةً لا ملكًا، وكان في هذا ما يُخالف ما حدث في الدول اللاحقة حيث صارت الولايات وراثية. وقد كان في هذا ما يُظهر أن قوّة الدولة تُقاس بقدرتها على العزل لا بقدرتها على التعيين فقط. وقد كان في هذا العزل ما جعل المنصب وظيفةً، وكان في هذا ما منع أن تُصبح الولايات ملكًا لأسرٍ بعينها.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالأمصار والمدن\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الأمصار تُخطّط على نمطٍ واحد: مسجد جامع في الوسط، ودار إمارة قريبة، وسوق، وأحياء للقبائل، وكان في هذا التخطيط ما يجعل المدينة وحدةً اجتماعية وإدارية. وقد كان في هذا ما جعل المدن الإسلامية تُشبه بعضها في كل البلاد، وكان في هذا ما ساعد على وحدة الثقافة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه المدن دوائر للجند والعطاء، وكان في هذا ما جعلها مراكز إدارية لا سكنية فقط، وكان في هذا ما جعلها تنمو بسرعة. وقد كان في هذا ما يُفسّر أن الكوفة والبصرة والفسطاط صارت من أكبر مدن العالم في قرنٍ واحد. وقد كان في هذا التشابه ما جعل المسافر يجد في كل مدينةٍ ما يعرفه، وكان في هذا ما ساعد على وحدة الثقافة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالحدود والمركز\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت المسافة بين المركز والأطراف كبيرة، وكانت الأخبار تصل متأخرة، وكان في هذا ما يجعل الرقابة صعبة. وقد كان الخليفة يعتمد على الرسل وعلى الحجّ وعلى الثقات، وكان في هذا ما يُشبه نظام تفتيشٍ دوري. وقد كان في هذه الدوائر ما جعل المدينة تُنتج وتُدار، وكان في هذا ما جعلها تنمو بسرعةٍ في قرنٍ واحد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا الاعتماد على الأشخاص خطرٌ، لأن النظام لا يعمل إلا إذا كان الرجل صالحًا، وكان في هذا ما جعل الفتنة ممكنةً حين تغيّر الرجال. وقد كان في هذا الدرس ما يُظهر أن الإدارة تحتاج إلى نظمٍ لا إلى ثقة، وأن الثقة وحدها لا تحفظ دولة. وقد كان في هذا الاعتماد خطرٌ بنيوي، لأن النظام الذي يقوم على الأشخاص ينهار بتغيّرهم، وهذا ما ظهر بعد الفتنة.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالوالي\u003c/b\u003e\u003cspan\u003eالإدارة والجيش\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eعامل الخراج\u003c/b\u003e\u003cspan\u003eالمال والجباية\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالقاضي\u003c/b\u003e\u003cspan\u003eالحكم والخصومات\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالأمصار\u003c/b\u003e\u003cspan\u003eالكوفة والبصرة والفسطاط\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمحاسبة\u003c/b\u003e\u003cspan\u003eاستدعاء الولاة في الحجّ\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالوظيفة\u003c/th\u003e\u003cth\u003eمسؤوليتها\u003c/th\u003e\u003cth\u003eالفصل\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالوالي\u003c/td\u003e\u003ctd\u003eالإدارة والأمن والجيش\u003c/td\u003e\u003ctd\u003eمنفصل عن المال\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eعامل الخراج\u003c/td\u003e\u003ctd\u003eالجباية والحساب\u003c/td\u003e\u003ctd\u003eمنفصل عن الجيش\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالقاضي\u003c/td\u003e\u003ctd\u003eالحكم بين الناس\u003c/td\u003e\u003ctd\u003eمنفصل عن الوالي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eصاحب الشرطة\u003c/td\u003e\u003ctd\u003eالأمن والتنفيذ\u003c/td\u003e\u003ctd\u003eتحت الوالي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالعرفاء\u003c/td\u003e\u003ctd\u003eإدارة الأحياء والقبائل\u003c/td\u003e\u003ctd\u003eمحلي\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eإِنَّ اللَّهَ يَأْمُرُكُمْ أَن تُؤَدُّوا الْأَمَانَاتِ إِلَىٰ أَهْلِهَا\u003c/p\u003e\u003ccite\u003eسورة النساء، الآية ٥٨\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eكانت الولايات تُدار بوظائف منفصلة: والٍ وعامل خراجٍ وقاضٍ وصاحب شرطة، وكان الخليفة يُحاسب الولاة ويستدعيهم. وقد كانت هذه الإدارة قادرة على إمساك بلادٍ واسعة، لكنها كانت تعتمد على الأشخاص أكثر من النظم.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"tribes-in-amsar","n":"القبائل في الأمصار","ic":"🤝","part":"القسم السادس: المجتمع والولايات","h":"\u003carticle class=\"ch3\" id=\"tribes-in-amsar\" data-toc=\"القبائل في الأمصار\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e6.3\u003c/span\u003e\n          \u003ch3\u003e🤝 القبائل في الأمصار\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي الكوفة والبصرة والفسطاط سكنت قبائل من كل الجزيرة، فصارت المدينة تجمع من كانوا يُقاتلون بعضهم في الجاهلية. وكان في هذا التجاور ما أنتج تعاونًا وأنتج عصبيةً، وكان في العصبية ما سيؤثّر في سياسة الدولة بعد ذلك.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكانت الأمصار تُخطّط على أساسٍ قبلي، فلكل قبيلةٍ حيّها وخطّتها، وكان في هذا التخطيط ما يُحفظ للقبيلة تماسكها، وكان في الوقت نفسه ما يُبقي العصبية حيّة. وقد كان في هذا ما يُفسّر أن الخلافات القبلية انتقلت من الجزيرة إلى الأمصار، وأنها صارت جزءًا من سياسة الدولة. وقد كان في هذا ما جعل المدينة الجديدة تحمل معها ذاكرة الجزيرة، وكان في هذا ما جعل السياسة المحلية تُشبه السياسة القبلية في الجاهلية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في كل مصرٍ فريقان كبيران: القبائل اليمنية والقبائل المُضَرية، وكان في هذا التقسيم ما يُشبه الأحزاب في العصر الحديث، وكان في كل فريقٍ قبائلُ متحالفة. وقد كان في هذا التقسيم ما جعل الولاية على المصر تحتاج إلى موازنةٍ بين الفريقين، وكان في هذا ما جعل السياسة المحلية معقّدة. وقد كان في هذا التوازن ما جعل الوالي يُعيّن ويُعزل بحسب التحالفات، وكان في هذا ما جعل الإدارة رهينةً للموازنات المحلية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في العطاء نظامٌ يقوم على السابقة لا على القبيلة، وكان في هذا ما يُخفّف من العصبية، لكن العطاء نفسه كان يُوزّع على القبائل بحسب دواوينها، وكان في هذا ما أعاد العصبية من بابٍ آخر. وقد كان في هذا ما يُظهر أن السياسة المالية قد تُنتج آثارًا سياسية لم تكن في حساب صانعيها. وقد كان في هذا ما جعل الديوان أداةً سياسية لا مالية فقط، وكان في هذا ما يُفسّر أن من يُشرف على الديوان يملك نفوذًا كبيرًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في الأمصار موالٍ كثيرون، وهم من أسلم من غير العرب أو من سُبي ثم أُعتق، وكانوا في الغالب يُلحقون بالقبيلة بالولاء، وكان في هذا ما جعلهم في مرتبةٍ أدنى في العطاء. وقد كان في هذا ما سيُنتج شعورًا بالغبن، وكان في هذا ما سيظهر في حركاتٍ سياسية بعد ذلك. وقد كان في هذا الوضع ما جعل الإسلام في نظر بعض الموالي دينًا يُخالف واقع المسلمين، وكان في هذا ما يُفسّر ظهور حركاتٍ طلبت المساواة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في العهد الراشدي محاولاتٌ لتخفيف الفوارق، وكان عمر يكتب إلى ولاته أن يُسوّوا بين الناس في الحقوق، وكان في هذا ما يُظهر أن المبدأ الإسلامي كان يُخالف العرف القبلي. وقد كان في هذا ما جعل التوتر قائمًا بين مبدأ المساواة وواقع التمييز. وقد كان في هذا التوتر ما جعل الخطاب الإسلامي يُستعمل من الطرفين، وكان في هذا ما يُظهر أن النصّ قد يُقرأ بحسب المصلحة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه المدن ما جعل العرب يتعلّمون من أهل البلاد، وكان في هذا ما جعل الثقافة تختلط، وكان في هذا ما جعل بعض العرب يرى في المولى كفاءةً أعلى منه. وقد كان في هذا ما سيُنتج جدلًا ثقافيًّا حول العرب والعجم في القرون التالية. وقد كان في هذا الاختلاط ما جعل العربية تتأثّر بلغات الموالي، وكان في هذا ما جعل النحو يُوضع لحفظ اللغة من اللحن.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في العصبية خطرٌ على الدولة، لأنها تُنتج تحالفاتٍ تُهدّد السلطة المركزية، وكان في هذا ما جعل الخلفاء يُحاولون أن يُوازنوا بين القبائل لا أن يُلغوها. وقد كان في هذا ما يُظهر أن السياسة في مجتمعٍ قبلي تحتاج إلى إدارةٍ للتوازن لا إلى إلغاءٍ للانتماء. وقد كان في هذا التوازن ما جعل الخلافة تحتاج إلى حكمةٍ في التعيين، وكان في هذا ما جعل بعض التعيينات تُثير الغضب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا العهد ما يُشبه تدريبًا على السياسة، لأن الناس تعلّموا أن يُطالبوا بحقوقهم في مدينةٍ لا في قبيلة، وكان في هذا ما جعل المدينة مجالًا عامًّا للتفاوض. وقد كان في هذا ما مهّد لظهور الفرق والأحزاب السياسية في القرن الأول. وقد كان في هذا التدريب ما جعل الأمصار مراكز للرأي العام، وكان في هذا ما جعل المدينة تفقد احتكار القرار السياسي.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالخطّط والأحياء\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الخطّة في المصر تُمنح للقبيلة، وكانت القبيلة تُوزّعها على أفرادها، وكان في هذا النظام ما يُشبه الإقطاع العمراني، وكان في هذا ما جعل المدينة تُبنى على أساسٍ اجتماعي لا على أساسٍ هندسي فقط. وقد كان في هذا النظام ما جعل المدينة تُبنى على أساسٍ اجتماعي لا على أساسٍ هندسي فقط، وكان في هذا ما جعلها تُشبه القبيلة في تنظيمها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا التخطيط ما جعل كل قبيلةٍ تعرف مكانها، وكان في هذا ما جعل المدينة تُشبه فسيفساء من الجماعات، وكان في هذا ما جعل إدارتها تحتاج إلى عرفاء يُعرفون بالناس. وقد كان في هذا التخطيط ما جعل كل قبيلةٍ تعرف مكانها، وكان في هذا ما جعل المدينة تُشبه فسيفساء من الجماعات.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالعطاء والتمييز\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان العطاء يُوزّع على أساس السابقة، وكان في هذا ما يُعطي أهل بدرٍ أكثر من غيرهم، وكان في هذا ما يُشبه التقدير للخدمة لا للنسب، وكان في هذا ما يُخفّف من العصبية في المبدأ. وكان في هذا التقدير ما يُشبه التقدير للخدمة لا للنسب، وكان في هذا ما يُخفّف من العصبية في المبدأ.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في التطبيق ما أعاد التمييز من بابٍ آخر، لأن الديوان كان يُسجّل القبيلة، ولأن المولى كان يُعطى أقلّ، وكان في هذا ما يُظهر الفرق بين المبدأ الإسلامي والواقع الاجتماعي. وقد كان في هذا التطبيق ما أعاد التمييز من بابٍ آخر، لأن الديوان كان يُسجّل القبيلة، ولأن المولى كان يُعطى أقلّ.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالموالي\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان المولى في المجتمع يُلحق بالقبيلة بالولاء، وكان في هذا ما يُعطيه حمايةً وانتسابًا، وكان في هذا ما يُبقيه في مرتبةٍ أدنى، وكان في هذا ما سيُنتج شعورًا بالغبن في الأجيال التالية. وكان في هذا ما يُبقيه في مرتبةٍ أدنى، وكان في هذا ما سيُنتج شعورًا بالغبن في الأجيال التالية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الإسلام مبدأ أن لا فضل لعربيٍّ على أعجمي إلا بالتقوى، وكان في هذا المبدأ ما يُخالف العرف، وكان في هذا ما جعل التوتر بين المبدأ والواقع قائمًا، وكان في هذا ما سيُستعمل في النزاعات السياسية بعد ذلك. وكان في هذا ما جعل التوتر بين المبدأ والواقع قائمًا، وكان في هذا ما سيُستعمل في النزاعات السياسية بعد ذلك.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالتخطيط\u003c/b\u003e\u003cspan\u003eخطّةٌ لكل قبيلة في المصر\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالفريقان\u003c/b\u003e\u003cspan\u003eاليمنية والمُضَرية\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالعطاء\u003c/b\u003e\u003cspan\u003eعلى السابقة لا على النسب\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالموالي\u003c/b\u003e\u003cspan\u003eولاءٌ ومرتبةٌ أدنى\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالخطر\u003c/b\u003e\u003cspan\u003eعصبيةٌ تُهدّد المركز\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالعنصر\u003c/th\u003e\u003cth\u003eالوصف\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالخطّة\u003c/td\u003e\u003ctd\u003eأرضٌ تُمنح للقبيلة\u003c/td\u003e\u003ctd\u003eمدينةٌ على أساسٍ قبلي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالديوان\u003c/td\u003e\u003ctd\u003eسجلٌ بالاسم والقبيلة\u003c/td\u003e\u003ctd\u003eعطاءٌ متفاوت\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالموالي\u003c/td\u003e\u003ctd\u003eمن أسلم من غير العرب\u003c/td\u003e\u003ctd\u003eشعورٌ بالغبن\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالعرفاء\u003c/td\u003e\u003ctd\u003eرؤساء الأحياء\u003c/td\u003e\u003ctd\u003eإدارةٌ محلية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالتحالفات\u003c/td\u003e\u003ctd\u003eيمنية ومُضَرية\u003c/td\u003e\u003ctd\u003eسياسةٌ محلية معقّدة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eإِنَّ أَكْرَمَكُمْ عِندَ اللَّهِ أَتْقَاكُمْ\u003c/p\u003e\u003ccite\u003eسورة الحجرات، ال
