 الغزالي واليًا على دمشق، ثم لم يلبث أن ثار عليه سنة ١٥٢٠م، وأعلن نفسه سلطانًا على الشام، واستند إلى بقايا المماليك وإلى من لم يقبل الحكم الجديد. وقد استمرت ثورته نحو سنة، حتى هُزم وقُتل في معركة قرب دمشق سنة ١٥٢١م، فكانت آخر محاولة مسلحة لإعادة الدولة القديمة، ولم يكن بعدها من يرفع راية السلطنة في الشام.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما الاقتصاد فقد تغيّر تغيرًا بطيئًا لا يُرى في يومه. فالأراضي التي كانت إقطاعًا لأمراء المماليك صارت تُدار بنظام الالتزام، أي أن يُلتزم شخصٌ بجمع خراج منطقة معينة ويدفع للدولة مبلغًا متفقًا عليه، ويحتفظ بالباقي. وهذا النظام لم يكن جديدًا كل الجدّة، لكنه صار القاعدة بعد سقوط الدولة، وأعطى لأهل الالتزام من المماليك وغيرهم سلطةً على الفلاحين لم تكن لهم من قبل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد رثى مؤرخو العصر هذه اللحظة رثاءً لم يكن كله سياسيًا. فابن إياس، الذي عاصر السقوط وكتب عنه بالتفصيل، يسجّل في تاريخه أحداث الريدانية وما بعدها بلغة من يودّع عالمًا لا من يصف معركة، ويذكر خراب الدور ونهب المتاع وذلّ الناس، ويربط ذلك كله بذهاب الدولة التي كانت تحمي المدينة. وهذا الرثاء هو أعلى ما وصلت إليه كتابة التاريخ في تلك السنين.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالخليفة والقسطنطينية\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الخلافة العباسية في القاهرة منذ أيام بيبرس مؤسسةً رمزية تُضفي الشرعية على السلطان ولا تحكم. وقد قبل العثمانيون هذا الوضع زمنًا، ثم لم يبقَ له معنى بعد أن صارت القاهرة ولاية. فنُقل الخليفة إلى القسطنطينية، وبقي اللقب في بيت السلطان العثماني، وصار يُذكر في الخطب على المنابر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوهذا النقل يفسّر شيئًا من طبيعة السقوط: لم يكن سقوط دولةٍ فقط بل إعادة ترتيب الشرعية في المشرق كله. فمن كان يُذكر اسمه في الخطبة كان يُعدّ صاحب الأمر، ومن انتقل اسمه إلى خطبة الجمعة انتقل إليه ما كان لغيره من الحقوق الرمزية، ولو لم يملك من السلطة ما يملكه الأول.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eمصائر المماليك\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم تكن نهاية المماليك نهاية أفراد بل نهاية نظام. فمن بقي منهم دخل في خدمة الدولة الجديدة بوصفه صاحب خبرة في الجند والإدارة، ومن رفض دخل في مقاومة انتهت إلى القتل أو التشريد. وقد كان في هذا عبرة: النظام الذي بنى قوته على بيوت الجند لم يستطع أن يبقى دولة، لكنه استطاع أن يبقى جهازًا يعمل لحساب غيره.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ظلّ أثرهم في مصر قرونًا. فبيوت المماليك لم تختفِ، بل صارت جزءًا من نسيج الولاية العثمانية، وشكّلت قوةً محلية يحسب لها الوالي حسابها. ولم ينتهِ هذا الأثر إلا في مطلع القرن التاسع عشر، حين قضى محمد علي على بيوت المماليك في القلعة سنة ١٨١١م، فكان ذلك آخر فصل في قصة بدأت في أسواق النخاسة قبل ألف سنة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eما بقي من الدولة\u003c/h4\u003e\u003cp class=\"ap\"\u003eبقي من الدولة أشياء كثيرة لم يكن في وسع الحرب أن تمحوها. بقي في القاهرة ما بناه سلاطينها من مساجد ومدارس وبيمارستانات وأسواق، وبقيت الأوقاف التي رتّبوها على تلك المؤسسات، وبقيت الدواوين بأسمائها ودفاترها، وبقيت اللغة الإدارية نفسها تكتب بها الدولة الجديدة قراراتها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوبقي أيضًا شيء في الناس. فالمماليك لم يكونوا حكامًا فقط، بل كانوا طبقةً لها تقاليدها في الفروسية واللباس والاحتفال، وقد ظلّت هذه التقاليد حيّةً في مصر والشام بعد سقوط الدولة، تُرى في المواكب وفي الأعراس وفي زي الجند. وهذا هو معنى أن الدولة تُهزم ولا يُمحى أثرها: تذهب سلطتها ويبقى شكلها في الحياة اليومية.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالخليفة\u003c/b\u003e\u003cspan\u003eالمتوكل على الله الثالث نُقل إلى القسطنطينية\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأول والٍ\u003c/b\u003e\u003cspan\u003eخاير بكش واليًا عثمانيًا على مصر سنة ١٥١٧م\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eآخر ثورة\u003c/b\u003e\u003cspan\u003eجان بردي الغزالي في الشام سنة ١٥٢٠م إلى ١٥٢١م\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالاقتصاد\u003c/b\u003e\u003cspan\u003eالإقطاع تحوّل إلى نظام الالتزام\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالنهاية الحقيقية\u003c/b\u003e\u003cspan\u003eقضاء محمد علي على بيوت المماليك سنة ١٨١١م\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالميدان\u003c/th\u003e\u003cth\u003eقبل السقوط\u003c/th\u003e\u003cth\u003eبعد السقوط\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالحكم\u003c/td\u003e\u003ctd\u003eسلطان مستقل في القاهرة\u003c/td\u003e\u003ctd\u003eوالٍ يعيّنه سلطان في القسطنطينية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالشرعية\u003c/td\u003e\u003ctd\u003eخليفة عباسي في القاهرة\u003c/td\u003e\u003ctd\u003eاللقب في بيت السلطان العثماني\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالأرض\u003c/td\u003e\u003ctd\u003eإقطاع لأمراء المماليك\u003c/td\u003e\u003ctd\u003eالتزام يُجمع بيد ملتزمين\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالجند\u003c/td\u003e\u003ctd\u003eمماليك مشتراة في بيوت\u003c/td\u003e\u003ctd\u003eفرق عثمانية وبيوت محلية باقية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالشام\u003c/td\u003e\u003ctd\u003eولايات مملوكية\u003c/td\u003e\u003ctd\u003eولايات عثمانية بعد ثورة الغزالي\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eإِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ\u003c/p\u003e\u003ccite\u003eسورة البقرة، الآية ١٥٦\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eسقطت الدولة في معركتين، لكن جهازها بقي يعمل باسم غيره قرونًا. وهذا هو الدرس الأخير في تاريخ المماليك: أن الدولة التي بُنيت على بيوت الجند يمكن أن تُهزم، ولا يمكن أن تُلغى بسهولة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-10","n":"القسم العاشر: إرث المماليك بعد الأزمنة","ic":"","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-10\" style=\"--c:#0F6B5C\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🧭\u003c/div\u003e\n      \u003ch2\u003eالقسم العاشر: إرث المماليك بعد الأزمنة\u003c/h2\u003e\n      \u003cp\u003eيختم هذا القسم بالمماليك بعد دولتهم: نظامهم العسكري الذي ظلت الجيوش تنسخه، وعمارتهم وفنهم، ومؤرخوهم الذين روا قصتهم، وصورتهم في الذاكرة العربية والعالمية حتى اليوم.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#military-organisation\"\u003eالتنظيم العسكري المملوكي\u003c/a\u003e\u003ca href=\"#arts-and-architecture\"\u003eالفنون والعمارة في مصر والشام\u003c/a\u003e\u003ca href=\"#mamluk-historiography\"\u003eمؤرخو الدولة ورؤيتها\u003c/a\u003e\u003ca href=\"#mamluk-memory\"\u003eالمماليك في الذاكرة اللاحقة\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"military-organisation","n":"التنظيم العسكري المملوكي","ic":"🐎","part":"القسم العاشر: إرث المماليك بعد الأزمنة","h":"\u003carticle class=\"ch3\" id=\"military-organisation\" data-toc=\"التنظيم العسكري المملوكي\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e10.1\u003c/span\u003e\n          \u003ch3\u003e🐎 التنظيم العسكري المملوكي\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eل\u003c/span\u003eم تكن قوة المماليك في سيوفهم بل في دفتر أسماءهم. فالنظام الذي بنى جيشًا من العبيد والعتقاء جعله أعتى جيش في المشرق ثلاثة قرون، ثم أوقفه عن التجدد حين صار الدفتر أهم من الميدان.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان الجيش المملوكي مبنيًا على طبقات لا على وحدات. فالمملوك يُشترى صغيرًا، ويُدخل بيتًا من بيوت الأمراء أو بيت السلطان، ويُدرَّب في الطوائف على الفروسية والرمي والمبارزة، ثم يُعتق ويُكتب اسمه في دفتر الجند. ومن لحظة الكتابة يبدأ سلمه: أمير عشرة، ثم أمير أربعين، ثم أمير مئة، ثم مقدم ألف، ولكل درجة عدد من المماليك وراتب من بيت المال وإقطاع من الأرض.\u003c/p\u003e\u003cp class=\"ap\"\u003eوإلى جانب المماليك كان جند الحلقة، وهم أحرار من أبناء البلاد يُكتبون في الدفتر لقبض رواتبهم والقتال عند الحاجة. وكان عددهم في بعض العهود أكبر من عدد المماليك، لكن وزنهم في المعركة أقل، لأنهم يُقاتلون بوصفهم واجبًا لا بوصفهم حرفة. وقد أُهمل هذا الجند في القرون الأخيرة، فصار يُجمع من القرى عند الحاجة ويُترك بعدها، وهذه العادة هي التي جعلت الجيوش المملوكية في آخر أيامها كثيرة العدد قليلة التدريب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان الإقطاع هو العقد الذي يربط الجند بالدولة. فالأرض تُمنح للأمير أو الجندي مقابل خدمته، ويأخذ من أهلها ما يغطي راتبه، وتبقى الأرض في يده ما دام في الدفتر. وقد أعاد السلطان الناصر محمد ترتيب هذا النظام في إحصاء كبير عُرف بالروك الناصري، فحدّد الأراضي ومقدار ما يُجبى منها وأسماء من يملك إقطاعها، وصار هذا الإحصاء أساسًا لدواوين مصر سنوات طويلة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما التدريب فكان صناعة لها أدواتها. فالمماليك يتدربون على الرمح والقوس والسيف وعلى ركوب الخيل في ميدان مفتوح، ويتبارون في ألعاب الفروسية التي صارت فنًّا له كتبه: رمي القوس على ظهر الفرس، والضرب بالسيف في الهواء، واللعب بالرمح بين فارسين. وكانت هذه الألعاب تُقام في المناسبات وتُشاهد من العامة، فصارت جزءًا من حياة المدينة لا من حياة المعسكر وحده.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان للسلطان حرس خاص يُعرف بالطبردارية، يحملون الطبر وهي الفأس الصغيرة، ويقفون في مواكبه ومجالسه. وكانوا في الأصل أشدّ المماليك وأقربهم إلى السلطان، ثم صاروا في آخر أيام الدولة أداةً في يد من يدفع أكثر، حتى قتل بعضهم سلطانًا أو شاركوا في خلعه. وهذه الحال تكشف شيئًا مهمًّا: أن الحرس الذي يُتخذ لحماية السلطان يصير أخطر ما عليه إذا لم يعد اختياره بيده.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان أعظم ما يعيب هذا النظام أنه لا يتجدّد. فالمملوك لا يورث رتبته لابنه، لأن ابن المملوك يُعدّ من أولاد الناس ولا يدخل الجند إلا بشروط، والجديد يُشترى من الخارج. فلمّا انقطعت طرق الشراء أو غلا ثمن الغلمان، لم يكن في الداخل من يسدّ الفراغ. ولهذا لم يكن نقص المماليك في آخر الدولة نتيجة حرب أو وباء، بل نتيجة نظام لا يعرف كيف يبقى بلا سوق يشتري منها رجاله.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالدفتر قبل السيف\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان في الدولة ديوان يُسمّى ديوان الجند، تُكتب فيه أسماء المقاتلين ورواتبهم وإقطاعاتهم. ومن كان اسمه في الدفتر كان له مال وخدمة، ومن لم يكن فيه لم يكن له شيء ولو كان أشجع الناس. ولهذا كانت أكبر معركة في حياة المملوك ليست معركة ميدان بل معركة تسجيل، يسعى فيها لأن يُثبت اسمه ويُرفع راتبه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد جعل هذا النظام الجيش منظمًا في السلم ومنضبطًا في الحساب، لكنه جعله أيضًا عرضةً للفساد. فالتسجيل صار يُشترى، والرتب تُمنح بغير استحقاق، والدفتر يضمّ أسماء من لا يقاتل. ولهذا حين جاءت الحرب الكبرى كان في الدفتر أكثر مما في الميدان، وهذا فرق قاتل في أي جيش.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالإقطاع: أرض مقابل خدمة\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يكن الإقطاع ملكًا خاصًّا بل حقًّا في الجباية. فالأرض أرض الدولة، والأمير يأخذ خراجها ما دام في الخدمة، فإذا خرج منها عادت إلى الديوان لتُمنح لغيره. وهذا الربط بين الأرض والخدمة هو ما جعل الجيش دائمًا في حاجة إلى الدولة، وجعل الدولة دائمًا قادرة على مكافأة من تريد مكافأته.\u003c/p\u003e\u003cp class=\"ap\"\u003eغير أن هذا النظام كان يحمل في داخله خطرًا. فكلما ضعفت الدولة صار الإقطاع ملكًا فعليًا لأصحابه، وكلما طال بقاء الأمير في إقطاعه صار له فيه أهل يطيعونه أكثر مما يطيعون الوالي. وفي آخر أيام المماليك صار بعض الإقطاعات تُورَّث عمليًا، وهذه أول علامة على أن سلطة الدولة بدأت تتحول إلى سلطات محلية.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eأولاد الناس والجند الجديد\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان لأبناء المماليك وضع خاص: يُسمّون أولاد الناس، ويُنشؤون في القاهرة ويعرفون العربية وأحوال البلد، لكنهم لا يدخلون الجند إلا بأمر، لأن الجيش في أصله جيش مشترى لا موروث. وكان في هذا النظام حكمة: أن يبقى الجند خالصًا للسلطان لا لبيوت تتوارث. وكان فيه أيضًا عيب: أن يفقد الجيش أبناء من خبروا البلد وعرفوا أهلها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي آخر الدولة صار أولاد الناس يُقبلون في الجند بأعداد أكبر، لأن شراء المماليك الجدد صار مكلفًا. وبهذا دخل الجيش عنصر جديد يعرف المدينة ولا يعرف حياة المعسكر، فتغيّرت طبيعة الجند وتغيّرت تقاليده، وهذا التغيّر البطيء هو ما يُفسّر بعض ضعف الجيش في معاركه الأخيرة.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسلم الرتب\u003c/b\u003e\u003cspan\u003eأمير عشرة ثم أربعين ثم مئة ثم مقدم ألف\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eجند الحلقة\u003c/b\u003e\u003cspan\u003eأحرار من أبناء البلاد يُكتبون في الدفتر\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالإقطاع\u003c/b\u003e\u003cspan\u003eأرض مقابل خدمة، تعود إلى الديوان عند الانقطاع\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالروك الناصري\u003c/b\u003e\u003cspan\u003eإحصاء الأراضي والإقطاعات في عهد الناصر محمد\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالطبردارية\u003c/b\u003e\u003cspan\u003eحرس السلطان الخاص حاملو الطبر\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالعنصر\u003c/th\u003e\u003cth\u003eوظيفته\u003c/th\u003e\u003cth\u003eما آل إليه في آخر الدولة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالمماليك السلطانية\u003c/td\u003e\u003ctd\u003eقلب الجيش وحرس السلطان\u003c/td\u003e\u003ctd\u003eأعداد كثيرة بلا تدريب منتظم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eمماليك الأمراء\u003c/td\u003e\u003ctd\u003eجند البيوت تحت راية كل أمير\u003c/td\u003e\u003ctd\u003eقوة تفاوض الأمراء أمام السلطان\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eجند الحلقة\u003c/td\u003e\u003ctd\u003eأحرار يُستدعون للقتال\u003c/td\u003e\u003ctd\u003eيُجمعون من القرى عند الحاجة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالإقطاع\u003c/td\u003e\u003ctd\u003eأرض مقابل خدمة عسكرية\u003c/td\u003e\u003ctd\u003eصار ملكًا فعليًا يُورَّث\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eديوان الجند\u003c/td\u003e\u003ctd\u003eدفتر الأسماء والرواتب\u003c/td\u003e\u003ctd\u003eأداة فساد وتضخّم في الأعداد\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eوَأَعِدُّوا لَهُم مَّا اسْتَطَعْتُم مِّن قُوَّةٍ\u003c/p\u003e\u003ccite\u003eسورة الأنفال، الآية ٦٠\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eبنى المماليك جيشًا من العبيد والعتقاء صار أعتى جيش في المشرق، لأنهم ربطوا الأرض بالخدمة والرتبة بالدفتر. ثم أوقفهم النظام نفسه حين لم يعد قادرًا على تجديد رجاله، فبقي الدفتر مليئًا والميدان فارغًا.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"arts-and-architecture","n":"الفنون والعمارة في مصر والشام","ic":"🎨","part":"القسم العاشر: إرث المماليك بعد الأزمنة","h":"\u003carticle class=\"ch3\" id=\"arts-and-architecture\" data-toc=\"الفنون والعمارة في مصر والشام\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e10.2\u003c/span\u003e\n          \u003ch3\u003e🎨 الفنون والعمارة في مصر والشام\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eم\u003c/span\u003eا بقي من المماليك في القاهرة أكثر مما بقي منهم في الكتب: مساجد ومدارس وأضرحة وأسواق، كل واحد منها كان مشروع سلطان أراد أن يُذكر باسمه بعد موته.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان البناء في عصر المماليك عملًا سياسيًا قبل أن يكون عملًا فنيًا. فالسلطان الذي يبني مجمعًا في قلب القاهرة لا يبني مكانًا للصلاة فقط، بل يبني شاهدًا على سلطته وعلى تدينه وعلى قدرته على جمع المال. ولهذا كانت المنشآت تُبنى في المواضع التي يراها الناس كل يوم، على الطرق الرئيسية وبين الأسواق، لا في الأطراف حيث لا يمرّ أحد. وكان السلطان يختار موضع البناء بحيث يراه أكبر عدد من الناس في يومه، وهذا اختيار سياسي بامتياز.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالمجمع المملوكي النموذجي يجمع في بناء واحد وظائف متعددة: مسجد للصلاة، ومدرسة لتدريس المذاهب الأربعة، وضريح للسلطان، وسبيل للماء، وكتّاب للأطفال، وأحيانًا خانقاه للصوفية وبيمارستان للمرضى. وهذا الجمع هو ما يميّز العمارة المملوكية عن غيرها، فالمبنى الواحد كان مدينة صغيرة تخدم الدين والتعليم والصحة والماء في وقت واحد. ولهذا كان المجمع يُعدّ في نظر أهل المدينة مؤسسة لا مبنى، يقصدها الناس للصلاة والدرس والعلاج والاستسقاء.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأشهر هذه المجمعات في القاهرة مجمع السلطان قلاوون، ومجمع السلطان حسن الذي يُعدّ من أعظم ما بُني في العصور الوسطى، ومجمع الأشرف قايتباي قرب القصرين، ومجمع قانصوه الغوري في آخر أيام الدولة. ولكل واحد منها شخصيته: فمجمع حسن يتسم بالضخامة والارتفاع، ومجمع قايتباي بالدقة والتناسب، ومجمع الغوري بالتنوع وكثرة المرافق. وقد بقي من هذه المجمعات ما هو قائم إلى اليوم، وبعضها تهدّم ثم أُعيد بناؤه في عصور لاحقة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما الزخرفة فلها في هذا العصر لغة كاملة. فالحجر يُقطَع بطريقتين مختلفتي اللون ويُركَّب معًا فيُعرف ذلك بالأبلق، والجص يُحفر حفرًا عميقًا وتُرسم فيه نباتات ونجوم، والخشب يُصنع منه الأبواب والمنابر والمشربيات، والرخام يُركَّب في أرضيات وواجهات بأنماط هندسية. وكانت هذه الصناعات كلها تعتمد على حرفيين محليين في القاهرة ودمشق وحلب، لا على استيراد من الخارج.\u003c/p\u003e\u003cp class=\"ap\"\u003eوإلى جانب العمارة ازدهرت الصناعات الدقيقة. فالمعادن المطعمّة بالفضة والذهب كانت من أشهر ما صُدر من مصر والشام، والزجاج المطلي بالمينا كانت له ورش في دمشق والقاهرة، والنسيج المملوكي كان يُصنع في الإسكندرية ودمياط ويُصدَّر إلى أوروبا. وكانت هذه الصناعات تعمل بحسب الطلب، فتارة تُصنع للسلطان وبلاطه، وتارة تُصنع للسوق وللتصدير، وهذا التنوع هو ما جعلها تبقى بعد سقوط الدولة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوما يميّز هذا الفن أنه فن مدينة لا فن بلاط. فالمساجد كانت تُبنى بين الأسواق، والأسواق كانت تُبنى تحت الأسوار، والبيوت كانت تُبنى حول أفنية داخلية تُطلّ على الحياة لا على الشارع. ولهذا حين ينظر الزائر إلى القاهرة القديمة اليوم يرى مدينة كاملة متصلة، لا مجموعة من المباني المنفردة، وهذا الاتصال هو أعظم ما تركه المماليك في العمارة. وهذه المدينة المتصلة هي التي تجعل دراسة العمارة المملوكية ممكنة إلى اليوم.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالمجمع: مدينة في بناء\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان المجمع المملوكي يجمع المسجد والمدرسة والضريح والسبيل في كتلة واحدة، ولكل جزء منها مدخله ووظيفته. وبهذا كان المبنى يخدم الناس في حياتهم اليومية وفي تعليمهم وفي عبادتهم، وكان في الوقت نفسه يضمن لصاحبه أن يُذكر اسمه كلما مرّ به أحد. وكان هذا الاسم يُكتب على المدخل بخط واضح، فصار البناء وثيقةً على صاحبه لا مجرد جدار.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت أوقاف المجمع هي التي تُبقيه حيًّا بعد موت بانيه. فتُوقف عليه أراضٍ ودكاكين وطواحين، ويُصرف ريعها على إمامه ومدرّسيه وطلابه ومؤذنيه. وبهذا صار الوقف نظامًا اقتصاديًا كاملًا يربط البناء بالمجتمع من حوله، ويجعله يعمل سنوات بعد أن يموت من أمر ببنائه.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالأبلق والجص والخشب\u003c/h4\u003e\u003cp class=\"ap\"\u003eالأبلق هو تركيب حجرين مختلفي اللون في صفوف متبادلة، وقد صار علامة على العمارة المملوكية في مصر والشام. وكان يُستعمل في الواجهات والمداخل والأبواب، ويُعطي البناء مظهرًا متباينًا يُرى من بعيد. ولم يكن هذا التباين عبثًا، بل كان وسيلة لإظهار مهارة البنّاء وقدرة صاحبه على جلب الحجر من مواضع مختلفة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما الجص فكان يُحفر حفرًا عميقًا لتظهر فيه الظلال، وتُرسم فيه نجوم ونباتات وخطوط كوفية. والخشب كان يُستعمل في الأبواب والمنابر والأسقف، ويُزيَّن بالحفر والتطعيم بالعاج والصدف. وهذه الصناعات كلها كانت تحتاج ورشًا وحرفيين متخصصين، وكانت تُنقل من جيل إلى جيل بالتدريب لا بالكتاب.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eما بقي منها اليوم\u003c/h4\u003e\u003cp class=\"ap\"\u003eبقي من عمارة المماليك في القاهرة ما يُعدّ من أكبر مجموعات العمارة الإسلامية في العالم، ولهذا سُجّلت القاهرة التاريخية في قائمة التراث العالمي. وقد تعرّض كثير من هذه المباني للتلف بفعل الزلازل والرطوبة وارتفاع منسوب المياه الجوفية، ثم أُعيد ترميم بعضها في العقود الأخيرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوما بقي في الشام أقل، لأن حلب ودمشق تعرّضتا لحروب وزلازل كثيرة. ومع ذلك بقيت في دمشق مدارس وأسواق ومساجد من العصر المملوكي، وبقيت في حلب أسواق مسقوفة تعود إلى تلك السنين. وهذا التفاوت بين ما بقي في مصر وما بقي في الشام يُفسّر بكثافة البناء في القاهرة أولًا، وباستمرار العناية بها ثانيًا.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمجمع\u003c/b\u003e\u003cspan\u003eمسجد ومدرسة وضريح وسبيل وكتّاب في بناء واحد\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالأبلق\u003c/b\u003e\u003cspan\u003eحجران مختلفا اللون في صفوف متبادلة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالوقف\u003c/b\u003e\u003cspan\u003eأراضٍ ودكاكين تُحبَّس لتمويل المجمع بعد موت بانيه\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأشهر المباني\u003c/b\u003e\u003cspan\u003eمجمع قلاوون ومجمع السلطان حسن ومجمع قايتباي\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالصناعات\u003c/b\u003e\u003cspan\u003eمعادن مطعمة وزجاج مطلي بالمينا ونسيج مصدَّر\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمنشأة\u003c/th\u003e\u003cth\u003eوظيفتها\u003c/th\u003e\u003cth\u003eمثال من القاهرة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالجامع\u003c/td\u003e\u003ctd\u003eالصلاة والخطبة\u003c/td\u003e\u003ctd\u003eجامع السلطان حسن\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمدرسة\u003c/td\u003e\u003ctd\u003eتدريس المذاهب الأربعة\u003c/td\u003e\u003ctd\u003eمدرسة قايتباي بين القصرين\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالخانقاه\u003c/td\u003e\u003ctd\u003eإقامة الصوفية وتعليمهم\u003c/td\u003e\u003ctd\u003eخانقاه بيبرس الجاشنكير\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالبيمارستان\u003c/td\u003e\u003ctd\u003eعلاج المرضى وتعليم الطب\u003c/td\u003e\u003ctd\u003eبيمارستان قلاوون\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالوكالة\u003c/td\u003e\u003ctd\u003eتجارة ونُزل للتجار\u003c/td\u003e\u003ctd\u003eوكالة الغوري في الأزهر\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eإِنَّمَا يَعْمُرُ مَسَاجِدَ اللَّهِ مَنْ آمَنَ بِاللَّهِ وَالْيَوْمِ الْآخِرِ وَأَقَامَ الصَّلَاةَ وَآتَى الزَّكَاةَ\u003c/p\u003e\u003ccite\u003eسورة التوبة، الآية ١٨\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eبنى المماليك مدنًا داخل مدنهم، وجمعوا في البناء الواحد الصلاة والتعليم والطب والماء. وما بقي منها اليوم ليس ذكريات سلاطين فقط، بل دليل على أن الحضارة تُقاس بما يبقى منها للناس لا بما يُكتب عنها.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"mamluk-historiography","n":"مؤرخو الدولة ورؤيتها","ic":"📚","part":"القسم العاشر: إرث المماليك بعد الأزمنة","h":"\u003carticle class=\"ch3\" id=\"mamluk-historiography\" data-toc=\"مؤرخو الدولة ورؤيتها\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e10.3\u003c/span\u003e\n          \u003ch3\u003e📚 مؤرخو الدولة ورؤيتها\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eق\u003c/span\u003eليل من الدول في التاريخ كُتب عنها ما كُتب عن دولة المماليك. فقد عاش في القاهرة في تلك القرون مؤرخون لم يكتفوا بتسجيل الحوادث، بل حاولوا أن يفهموا كيف تقوم الدولة وكيف تسقط.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكانت القاهرة في عصر المماليك مركزًا للعلم لا يقل عن مركزها السياسي. وفيها من المدارس والكتاتيب والأوقاف ما جعل الكتابة مهنة ممكنة، وجعل النسخ والتأليف عملًا يُدرّ ربحًا. ولهذا لم يكن عجبًا أن يخرج من هذه المدينة في قرنين ما لم يخرج من غيرها في خمسة: مؤرخون يكتبون بالتفصيل عن مدينتهم وعن الدولة التي تحكمها. وكانت هذه المدينة تستقبل العلماء من كل الأقطار، فيجدون فيها ما لا يجدونه في بلادهم من كتب وأوقاف ومجالس.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأعظم هؤلاء في نظر كثير من الباحثين تقي الدين المقريزي. عاش في القرن التاسع الهجري، وكتب تاريخًا طويلًا للدولة الإسلامية سمّاه السلوك لمعرفة دول الملوك، وكتب عن القاهرة كتابًا صار مرجعًا لكل من جاء بعده هو المواعظ والاعتبار في ذكر الخطط والآثار. وقد جمع في الثاني بين التاريخ والجغرافيا والعمران، فوصف الشوارع والأسواق والمساجد والقبور، وشرح كيف نشأت كل واحدة منها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما ابن تغرى بردي فكان أقرب إلى الديوان من المقريزي، لأنه كان من أولاد المماليك وعرف البلاط من داخله. وقد كتب النجوم الزاهرة في ملوك مصر والقاهرة على ترتيب السنين، فجعل لكل سنة فصلًا يذكر فيه من مات ومن وُلد ومن تولّى ومن عُزل. وهذا الترتيب السنوي جعل كتابه أداة لا غنى عنها لكل من يريد أن يعرف تاريخ حادثة بدقة. وقد اعتمد عليه من جاء بعده من المؤرخين اعتمادًا كبيرًا، لأنه كان ينقل من الدفاتر لا من الروايات الشفوية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما ابن إياس فله وضع آخر، لأنه عاش حتى رأى السقوط. وقد كتب بدائع الزهور في وقائع الدهور، وهو تاريخ مصر من أولها إلى سنة ١٥٢٢م، وفيه وصف مفصل لأيام مرج دابق والريدانية وما جرى بعدها. وقد كتب هذه الأيام بلغة مختلفة عن لغة من يكتب عن قرن مضى، فيها حزن ظاهر وخوف من المستقبل، ولهذا يُعدّ شاهد عيان أكثر منه مؤرخًا. وهذا الوصف المفصل هو الذي يجعل كتابه اليوم أقرب إلى يوميات مدينة منه إلى تاريخ دولة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوإلى جانب هؤلاء كان ابن خلدون، وقد جاء إلى القاهرة في آخر عمره ودرّس فيها، وكتب مقدمته الشهيرة قبل ذلك في المغرب. غير أن أثره في مصر كان كبيرًا، لأن طريقته في تفسير قيام الدولة وسقوطها بالعصبية والعمران صارت إطارًا يفكر به من جاء بعده. وقد تتلمذ على يده في القاهرة من صار بعد ذلك من كبار المؤرخين، ومنهم من نقل طريقته إلى جيل آخر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذه المكتبة أيضًا كتب الرحالة، وهي مصدر آخر لا يقل أهمية. فمن زار القاهرة من المغاربة أو الأوروبيين وصف أسواقها ومماليكها ومواكبها، وكتب عن أشياء لا يذكرها المؤرخ المحلي لأنه يراها كل يوم ولا يراها خبرًا. وهذه الكتب هي التي نقلت صورة الدولة إلى الخارج، وهي التي يعتمد عليها الباحثون اليوم في وصف الحياة اليومية لا في وصف السياسة.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالمقريزي ونظرته إلى الدولة\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يكن المقريزي مؤرخًا محايدًا بالمعنى الحديث، بل كان صاحب رأي في ما يكتب. وقد كتب عن الدولة التي عاش فيها بوصفه من يرى خللها من قريب، وانتقد تأخير الرواتب وفساد الدواوين واستبداد الأمراء. ولهذا يُقرأ تاريخه مرتين: مرة لمعرفة ما جرى، ومرة لمعرفة كيف رأى أهل العصر ما جرى.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان همه الأول أن يفهم لماذا تضعف الدولة، لا أن يسجل انتصاراتها فقط. وهذا السؤال هو ما جعل كتابه يبقى، لأن من يكتب أخبارًا يُنسى بعد جيل، ومن يكتب تفسيرًا يبقى ما بقي السؤال. وقد نقل هذا السؤال إلى من جاء بعده، فصار تاريخ الدولة يُكتب بوصفه مسألة لا بوصفه سردًا.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eابن تغرى بردي والترتيب السنوي\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان ابن تغرى بردي من أسرة مماليك، وقد خدم في الديوان وعرف كيف تُكتب الأوراق وكيف تُحفظ. ولهذا كان كتابه دقيقًا في التواريخ والأسماء، لأنه كان يعمل من وثائق لا من ذاكرة. وهذا فرق كبير بين مؤرخ يجلس في مكتبه يروي ما سمع، ومؤرخ يفتح الدفتر ويقرأ ما كُتب في يومه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد اختار الترتيب السنوي لأنه أراد كتابًا يُراجَع لا كتابًا يُقرأ من أوله إلى آخره. وفي هذا اختيار منهجي عميق: من يريد أن يعرف سنة واحدة يجدها في مكانها، ومن يريد أن يرى الاتجاه العام يقرأ السنوات متتابعة. وهذا هو ما يجعل النجوم الزاهرة أقرب إلى المرجع منه إلى الكتاب الأدبي.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eابن إياس وشاهد العيان\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان ابن إياس مؤرخًا في زمن لم يبقَ فيه ما يُؤرَّخ، فكتب عن سقوط دولة كان يعيش فيها. وقد فعل ذلك بلغة لا تُخفي انحيازها: يذكر خراب الدور، ونهب المتاع، وقتل الناس في الطرق، ويقارن بين ما كان وما صار. وهذا الحزن ليس عيبًا في كتابه بل مصدر قوته، لأنه ينقل ما لا ينقله الوثائق الرسمية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد حفظ لنا تفاصيل لم يكن أحد ليهتم بها لو كانت الدولة قائمة: أسعار السوق في أيام الحصار، وأسماء من قُتل في الأحياء، وكيف تعامل الناس مع الوالي الجديد. وهذه التفاصيل هي التي تجعل كتابه يُقرأ اليوم بوصفه تاريخًا اجتماعيًا لا سياسيًا، وهو ما لم يكن يقصده حين كتبه.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمقريزي\u003c/b\u003e\u003cspan\u003eالسلوك لمعرفة دول الملوك، والخطط عن القاهرة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eابن تغرى بردي\u003c/b\u003e\u003cspan\u003eالنجوم الزاهرة على ترتيب السنين\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eابن إياس\u003c/b\u003e\u003cspan\u003eبدائع الزهور، شاهد عيان على السقوط\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eابن خلدون\u003c/b\u003e\u003cspan\u003eالمقدمة وطريقة تفسير قيام الدولة وسقوطها\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eكتب الرحالة\u003c/b\u003e\u003cspan\u003eوصف الحياة اليومية ونقل صورة الدولة إلى الخارج\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمؤرخ\u003c/th\u003e\u003cth\u003eأشهر كتبه\u003c/th\u003e\u003cth\u003eما يميّزه\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالمقريزي\u003c/td\u003e\u003ctd\u003eالسلوك والخطط\u003c/td\u003e\u003ctd\u003eجمع التاريخ بالعمران ووصف المدينة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eابن تغرى بردي\u003c/td\u003e\u003ctd\u003eالنجوم الزاهرة\u003c/td\u003e\u003ctd\u003eترتيب سنوي دقيق مبني على الدواوين\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eابن إياس\u003c/td\u003e\u003ctd\u003eبدائع الزهور\u003c/td\u003e\u003ctd\u003eشاهد عيان على سقوط الدولة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eابن خلدون\u003c/td\u003e\u003ctd\u003eالمقدمة\u003c/td\u003e\u003ctd\u003eتفسير قيام الدولة بالعصبية والعمران\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eابن حجر العسقلاني\u003c/td\u003e\u003ctd\u003eرفع الإصر عن قضاة مصر\u003c/td\u003e\u003ctd\u003eتاريخ القضاء والعلماء لا السلاطين\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eالْعِلْمُ يُؤْتَى وَلَا يَأْتِي\u003c/p\u003e\u003ccite\u003eمأثور عن أهل العلم\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eكتب المماليك تاريخهم بأيدي من عاش في دواوينهم وبلاطاتهم، فجاء تاريخهم غنيًا بالتفصيل شديد الانحياز في الرأي. ولهذا يبقى سؤالهم الذي بدأوه هو سؤالنا: لماذا تقوم الدولة ولماذا تسقط؟\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"mamluk-memory","n":"المماليك في الذاكرة اللاحقة","ic":"🧩","part":"القسم العاشر: إرث المماليك بعد الأزمنة","h":"\u003carticle class=\"ch3\" id=\"mamluk-memory\" data-toc=\"المماليك في الذاكرة اللاحقة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e10.4\u003c/span\u003e\n          \u003ch3\u003e🧩 المماليك في الذاكرة اللاحقة\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eل\u003c/span\u003eم ينتهِ المماليك بسقوط دولتهم، بل ظلّوا في مصر قرونًا بعدها: بيوتًا وألقابًا وتقاليد، حتى صار اسمهم في الذاكرة أشبه بطبقة من الماضي أكثر منه دولة.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eبعد سنة ١٥١٧م لم يختفِ المماليك من مصر، بل دخلوا في نظام الدولة الجديدة بوصفهم أهل خبرة في الجند والإدارة. وقد صار كثير منهم من أهل الالتزام، يجمعون خراج القرى ويحتفظون بالباقي، وبقيت لهم حاشية من المماليك الصغار تُشترى وتُدرَّب كما كانت تُشترى من قبل. وبهذا استمرّ النظام الاجتماعي بعد أن انتهى النظام السياسي. وقد حفظت لهم الدفاتر العثمانية أسماءهم ومراتبهم، فصار تاريخهم بعد السقوط مكتوبًا بلغة الدولة التي غلبتهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي القرن السابع عشر والثامن عشر صار هؤلاء يُعرفون بالبيوت، ولكل بيت أمير ورجال ومصالح. وقد بلغ بعضهم من القوة ما جعلهم يحكمون مصر فعليًا تحت اسم الوالي العثماني، ثم انتهى هذا كله في سنة ١٨١١م حين أمر محمد علي بالقضاء على بيوت المماليك في القلعة. وفي ذلك اليوم انتهى تاريخ بدأ في أسواق الرقيق قبل ألف سنة. وقد بقي من تلك البيوت أسماء في الشوارع والأحياء، وبقيت في الذاكرة حكايات عن كرم بعضهم وظلم بعضهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما في الذاكرة الشعبية فلم يكن المماليك دائمًا أبطالًا. فالناس في القاهرة عرفوا منهم الجباية والمصادرة والمواكب، وعرفوا أيضًا ما بنوه من مساجد وأسواق وأسبلة. ولهذا جاءت صورتهم في الحكايات الشعبية مزدوجة: ظالمٌ في الجباية، كريمٌ في البناء، قويٌّ في الحرب، غريبٌ في اللسان. وهذه الصورة المزدوجة هي أقرب إلى الحقيقة من أي صورة أحادية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما في الكتابة التاريخية الحديثة فقد تغيّرت النظرة إليهم مرتين. ففي القرن التاسع عشر وأوائل العشرين كانوا يُوصفون بأنهم طبقة من الغزاة الأجانب الذين استنزفوا مصر، ثم جاءت الدراسات الحديثة بعد منتصف القرن العشرين فرأت فيهم طبقة حاكمة لها نظام إداري واقتصادي معقّد، وبدأ الباحثون يدرسون دواوينهم وأوقافهم وعمارتهم لا أخبار حروبهم فقط.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي العقود الأخيرة صار للمماليك مجال بحثي قائم بذاته في الجامعات، تُنشر فيه مجلات وتُعقد فيه مؤتمرات، وتُحقَّق فيه المخطوطات وتُدرس فيه الوثائق. وهذا الاهتمام لم يأتِ من فراغ، بل لأن أرشيف الدولة المملوكية من أغنى ما بقي من العصور الوسطى، ولأن القاهرة ما زالت واقفة بشوارعها ومبانيها تحكي ما جرى فيها. وقد ساعد على ذلك أن كثيرًا من وثائقهم محفوظ في دور الأرشيف، وأن مبانيهم قائمة في قلب القاهرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما ما بقي في المدينة نفسها فهو أوضح من كل كتاب. فالقاهرة التاريخية بما فيها من مساجد ومدارس وأسواق ووكالات وأسبلة، هي الشاهد الذي لا يمكن إنكاره على هذه الدولة. وقد تعرّض بعضها للتلف والإهمال، ثم أُعيد ترميمه في العقود الأخيرة، وصارت هذه المباني اليوم مقصدًا للباحثين والزوار، ومادةً للفن المعاصر الذي يستعير من زخارفها ومن ألوانها.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eمن دولة إلى بيوت\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان انتقال المماليك من دولة إلى بيوت انتقالًا بطيئًا لم يشعر به أحد في يومه. ففي أول الأمر كانوا أمراء في خدمة والٍ عثماني، ثم صاروا أصحاب التزام ونفوذ محلي، ثم صاروا قوةً يحسب لها الوالي حسابها. وفي كل مرحلة كانوا يفقدون شيئًا من سلطة الدولة ويكسبون شيئًا من سلطة المحل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد انتهى هذا المسار في مطلع القرن التاسع عشر. فمحمد علي لم يكن في وسعه أن يبني دولة حديثة وفيها بيوت مسلحة لا تطيع إلا أمراءها، فقضى عليها في القلعة سنة ١٨١١م. وبهذا انتهى آخر أثر سياسي للمماليك، وبقيت بعدهم أسماؤهم في أسماء الشوارع والمباني والحكايات.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eصورة مزدوجة في الذاكرة\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم تكتب الذاكرة الشعبية تاريخًا محايدًا للمماليك، بل حفظت ما مسّ حياة الناس: الضريبة، والمصادرة، والموكب، والبناء. ولهذا يجد الباحث في الحكايات الشعبية أميرًا ظالمًا في السوق وكريمًا في المسجد، وهذا التناقض ليس خطأً في الذاكرة بل وصفًا دقيقًا لطبقة كانت تعيش بين الأمرين.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي المقابل حفظت الذاكرة الرسمية ما يخص الدولة: الفتوح والانتصارات والعمارة. والصورة الكاملة تحتاج إلى الاثنين معًا، لأن من يقرأ الوثائق وحدها يرى نظامًا، ومن يقرأ الحكايات وحدها يرى ظلمًا، والحقيقة في التقائهما. ومن يجمع بين الصورتين يجد طبقةً كانت قويةً في الدولة وضعيفةً أمام الناس، وهذا هو معنى أن تُحكم مصر بغير أهلها.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالمماليك في البحث الحديث\u003c/h4\u003e\u003cp class=\"ap\"\u003eبدأ الاهتمام العلمي الحديث بالمماليك بدراسة العمارة أولًا، لأن المباني كانت ظاهرة لا تحتاج إلى مخطوط. ثم انتقل الاهتمام إلى الوثائق، فصارت دفاتر الأوقاف وسجلات المحاكم مصدرًا لفهم الاقتصاد والمجتمع. وهذا الانتقال غيّر الصورة تغييرًا كبيرًا، لأن الوثيقة تُظهر ما لا يُظهره الكتاب الأدبي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما اليوم فقد صار المماليك موضوعًا عالميًا يُدرَس في جامعات كثيرة، وتُحقَّق فيه المخطوطات وتُنشر فيه الدراسات. وهذا الاهتمام ليس حنينًا إلى دولة مضت، بل محاولة لفهم كيف تُدار دولة كبيرة في عصر قبل الحداثة، وكيف تقوم مؤسساتها وكيف تنهار. ولهذا صار تاريخ المماليك اليوم جزءًا من تاريخ المؤسسات لا من تاريخ الأبطال.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eبعد ١٥١٧م\u003c/b\u003e\u003cspan\u003eأمراء في خدمة الولاية العثمانية وأهل التزام\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالبيوت\u003c/b\u003e\u003cspan\u003eبيوت مسلحة تحكم مصر فعليًا في القرن الثامن عشر\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالنهاية\u003c/b\u003e\u003cspan\u003eالقضاء على بيوت المماليك في القلعة سنة ١٨١١م\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالذاكرة\u003c/b\u003e\u003cspan\u003eصورة مزدوجة: ظلم في الجباية وكرم في البناء\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالبحث الحديث\u003c/b\u003e\u003cspan\u003eدراسات العمارة والوثائق والأوقاف\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمرحلة\u003c/th\u003e\u003cth\u003eالوضع\u003c/th\u003e\u003cth\u003eما بقي منها\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eبعد ١٥١٧م\u003c/td\u003e\u003ctd\u003eأمراء في خدمة الوالي العثماني\u003c/td\u003e\u003ctd\u003eخبرة إدارية ونظام التزام\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالقرن السابع عشر\u003c/td\u003e\u003ctd\u003eبيوت مسلحة ذات نفوذ محلي\u003c/td\u003e\u003ctd\u003eألقاب وتقاليد وحاشية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالقرن الثامن عشر\u003c/td\u003e\u003ctd\u003eحكم فعلي تحت اسم الولاية\u003c/td\u003e\u003ctd\u003eقوة عسكرية محلية لا دولة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eسنة ١٨١١م\u003c/td\u003e\u003ctd\u003eالقضاء على البيوت في القلعة\u003c/td\u003e\u003ctd\u003eنهاية الأثر السياسي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eاليوم\u003c/td\u003e\u003ctd\u003eموضوع بحث وتراث معماري\u003c/td\u003e\u003ctd\u003eالقاهرة التاريخية والمخطوطات\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eوَتَرَى الْجِبَالَ تَحْسَبُهَا جَامِدَةً وَهِيَ تَمُرُّ مَرَّ السَّحَابِ\u003c/p\u003e\u003ccite\u003eسورة النمل، الآية ٨٨\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eانتهت دولة المماليك سنة ١٥١٧م، لكن المماليك ظلّوا في مصر ثلاثة قرون أخرى بيوتًا ونفوذًا وتقاليد. وما بقي منهم اليوم ليس سلطة بل أثرًا: مبانٍ في القاهرة، ومخطوطات في المكتبات، وصورة مزدوجة في الذاكرة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"f","one":true,"id":"people","n":"أهم الشخصيات","ic":"","part":"","h":"\u003csection class=\"rsec\"\u003e\n      \u003ch2 class=\"sec\"\u003eأهم الشخصيات\u003c/h2\u003e\n      \u003cdiv class=\"people\"\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eعز الدين أيبك\u003c/b\u003e\u003cspan\u003eالمماليك الذي تولى أمرة مصر سنة ١٢٥٠م وأتم انتقال الحكم من الأيوبيين.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eسيف الدين قطز\u003c/b\u003e\u003cspan\u003eالسلطان المماليك الذي هزم المغول في سهل عين جالوت سنة ١٢٦٠م.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eالملك الظاهر بيبرس\u003c/b\u003e\u003cspan\u003eقائد المماليك في عين جالوت ثم سلطان استعاد أنطاكية من الصليبيين.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eالأشرف خليل\u003c/b\u003e\u003cspan\u003eسلطان مصر والشام الذي فتح عكا سنة ١٢٩١م فأنهى الحملات الصليبية.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eالملك الناصر قلاوون\u003c/b\u003e\u003cspan\u003eسلطان من المماليك بنى القلاع والمدن في مصر والشام.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eأبو الفتح البرقوقي\u003c/b\u003e\u003cspan\u003eمؤسس الدولة البرقوقية سنة ١٣٢١م التي حكمت نحو قرن كامل.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eسليم الأول\u003c/b\u003e\u003cspan\u003eالسلطان العثماني الذي هزم المماليك ودخل مصر سنة ١٥١٧م.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\n    \u003c/section\u003e"},{"u":"f","one":true,"id":"outcomes","n":"النتائج والآثار","ic":"","part":"","h":"\u003csection class=\"rsec\"\u003e\n      \u003ch2 class=\"sec\"\u003eالنتائج والآثار\u003c/h2\u003e\n      \u003cul class=\"outs\"\u003e\u003cli\u003eصد المغول عن مصر والشام ومنع زحفهم إلى سائر بلاد الإسلام.\u003c/li\u003e\u003cli\u003eأنهيت الإمارات الصليبية كلها وانتقل ساحل الشام إلى المسلمين.\u003c/li\u003e\u003cli\u003eأسست دولة قوية في مصر والشام حكمت أربعة قرون ونظمت جندها وإدارتها.\u003c/li\u003e\u003cli\u003eازدهرت العمارة والعلم في القاهرة فبنيت المساجد والمدارس والأوقاف.\u003c/li\u003e\u003cli\u003eانتهت دولة المماليك على يد العثمانيين سنة ١٥١٧م وانتقلت مصر والشام إليهم.\u003c/li\u003e\u003c/ul\u003e\n    \u003c/section\u003e"},{"u":"f","one":true,"id":"sources","n":"المصادر والمراجع","ic":"","part":"","h":"\u003cdiv class=\"src frame\" style=\"--c:#0F6B5C\"\u003e\n    \u003cspan class=\"crn tl\"\u003e\u003csvg viewBox=\"0 0 26 26\"\u003e\n\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\"/\u003e\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\" transform=\"rotate(90 13 13)\" opacity=\".5\"/\u003e\u003c/svg\u003e\u003c/span\u003e\u003cspan class=\"crn tr\"\u003e\u003csvg viewBox=\"0 0 26 26\"\u003e\n\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\"/\u003e\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\" transform=\"rotate(90 13 13)\" opacity=\".5\"/\u003e\u003c/svg\u003e\u003c/span\u003e\u003cspan class=\"crn bl\"\u003e\u003csvg viewBox=\"0 0 26 26\"\u003e\n\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\"/\u003e\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\" transform=\"rotate(90 13 13)\" opacity=\".5\"/\u003e\u003c/svg\u003e\u003c/span\u003e\u003cspan class=\"crn br\"\u003e\u003csvg viewBox=\"0 0 26 26\"\u003e\n\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\"/\u003e\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\" transform=\"rotate(90 13 13)\" opacity=\".5\"/\u003e\u003c/svg\u003e\u003c/span\u003e\n    \u003ch2 class=\"sec\" style=\"margin-top:0\"\u003eالمصادر والمراجع\u003c/h2\u003e\n    \u003cul\u003e\u003cli\u003e\u003ccite\u003eالمقريزي\u003c/cite\u003e — الخطط المقريزية (تاريخ القاهرة وأخبار الخلفاء المماليك ومعالمهم)\u003c/li\u003e\u003cli\u003e\u003ccite\u003eابن خلدون\u003c/cite\u003e — تاريخ ابن خلدون (أحوال المماليك وأدوارهم السياسي والعمراني)\u003c/li\u003e\u003cli\u003e\u003ccite\u003eابن تغرى بردي\u003c/cite\u003e — النجوم الزاهرة في ملك مصر والقاهرة (أخبار سلاطين المماليك وترتيب سني حكمهم)\u003c/li\u003e\u003cli\u003e\u003ccite\u003eجورج أنطونيوس\u003c/cite\u003e — حضارة العرب (قسم العصر المملوكي في تاريخ العالم الإسلامي)\u003c/li\u003e\u003c/ul\u003e\n  \u003c/div\u003e"},{"u":"f","one":true,"id":"pager","n":"الحقب الأخرى","ic":"","part":"","h":"\u003cnav class=\"pager\"\u003e\n    \u003ca class=\"prev\" href=\"crusades.html\"\u003e\u003csmall\u003e← الحقبة السابقة\u003c/small\u003e\u003cb\u003e🛡️ الحروب الصليبية\u003c/b\u003e\u003c/a\u003e\n    \u003ca class=\"next\" href=\"ottoman.html\"\u003e\u003csmall\u003eالحقبة التالية →\u003c/small\u003e\u003cb\u003e🕌 الدولة العثمانية\u003c/b\u003e\u003c/a\u003e\n  \u003c/nav\u003e"}]}</script>
<script>
/* ===== موسوعة تاريخ الإسلام — منطق الواجهة + قارئ الكتاب =====
   يعمل على صفحات «الكتاب» (التي تحمل <script id="book">) وبقية الصفحات كما هي. */

/* هل هذه صفحة قارئ؟ يُحدَّد قبل أي تهيئة */
window.__READER__ = !!document.getElementById('book');

(function () {
  'use strict';
  var STORE = 'ti_bookmarks', THEME = 'ti_theme', PROG = 'ti_progress';

  /* ---------- تحويل الأرقام إلى هندية (وقت التشغيل) ---------- */
  function arDigits(s) {
    return String(s == null ? '' : s).replace(/\d/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'[d]; });
  }
  window.arDigits = arDigits;

  /* ---------- الوضع الليلي ---------- */
  function applyTheme(d) {
    document.body.classList.toggle('dark', d);
    var b = document.getElementById('themeBtn');
    if (b) b.textContent = d ? '☀️' : '🌙';
  }
  var th = document.getElementById('themeBtn');
  if (th) th.addEventListener('click', function () {
    var d = !document.body.classList.contains('dark');
    applyTheme(d); localStorage.setItem(THEME, d ? '1' : '0');
  });
  applyTheme(localStorage.getItem(THEME) === '1');

  /* ---------- التقدّم: مشترك بين التمرير والقارئ ---------- */
  function setProgress(id, frac) {
    if (!id || id === 'home') return;
    var pr = JSON.parse(localStorage.getItem(PROG) || '{}');
    if ((pr[id] || 0) < frac) { pr[id] = frac; localStorage.setItem(PROG, JSON.stringify(pr)); }
    if (frac > 0.92) {
      var bm = JSON.parse(localStorage.getItem(STORE) || '[]');
      if (bm.indexOf(id) < 0) {
        bm.push(id); localStorage.setItem(STORE, JSON.stringify(bm));
        if (window.refreshBadges) window.refreshBadges();
      }
    }
  }
  window.__setProgress = setProgress;

  var domeFill = document.querySelector('.dome .fill');
  var topBar = document.querySelector('.topbar i');
  var swordBl = document.querySelector('.sword .bl');
  var swordTx = document.querySelector('.sword span');

  function paintProgress(pct) {
    if (domeFill) domeFill.style.opacity = (0.12 + pct * 0.88).toFixed(2);
    if (topBar) topBar.style.width = Math.round(pct * 100) + '%';
    if (swordBl) swordBl.style.clipPath = 'inset(0 ' + (100 - pct * 100) + '% 0 0)';
    if (swordTx) swordTx.textContent = 'القراءة ' + arDigits(Math.round(pct * 100)) + '٪';
  }
  window.__paintProgress = paintProgress;

  /* ---------- نظام الأوسمة ---------- */
  var BADGES = [
    { id: 'start', ic: '🌱', n: 'نَبتُ الطريق', d: 'ابدأ أول حقبة' },
    { id: 'prophets', ic: '📜', n: 'وسام النبوة', d: 'أنبياء' },
    { id: 'seerah', ic: '🕊️', n: 'وسام الرحمة', d: 'السيرة' },
    { id: 'rashidun', ic: '⚔️', n: 'وسام الفاروق', d: 'الراشدون' },
    { id: 'umayyad', ic: '🏛️', n: 'وسام البناء', d: 'الأمويه' },
    { id: 'andalus', ic: '🏰', n: 'وسام الأندلس', d: 'الأندلس' },
    { id: 'abbasid', ic: '📚', n: 'وسام الفجر', d: 'العباسيه' },
    { id: 'crusades', ic: '🛡️', n: 'وسام حطين', d: 'الصليبيون' },
    { id: 'mamluk', ic: '🐎', n: 'وسام النصر', d: 'المماليك' },
    { id: 'ottoman', ic: '🕌', n: 'وسام السلطان', d: 'العثمانيون' },
    { id: 'civilization', ic: '🔬', n: 'وسام العقل', d: 'الحضاره' },
    { id: 'modern', ic: '🕰️', n: 'وسام التاريخ', d: 'العصر الحديث' },
    { id: 'all', ic: '👑', n: 'تاج المؤرخ', d: 'كل الحقب' }
  ];
  window.refreshBadges = function () {
    var bm = JSON.parse(localStorage.getItem(STORE) || '[]');
    var host = document.getElementById('badges');
    if (!host) return;
    var done = BADGES.filter(function (b) {
      return b.id === 'start' ? bm.length >= 1
        : b.id === 'all' ? bm.length >= 12 : bm.indexOf(b.id) >= 0;
    }).map(function (b) { return b.id; });
    var pct = Math.round(done.length / BADGES.length * 100);
    document.querySelectorAll('#badges .bg').forEach(function (el) {
      el.classList.toggle('on', done.indexOf(el.dataset.b) >= 0);
    });
    var c = document.getElementById('bcnt');
    if (c) c.textContent = arDigits(done.length) + ' من ' + arDigits(BADGES.length);
    var pb = document.getElementById('bprog');
    if (pb) pb.style.width = pct + '%';
  };
  window.refreshBadges();

  /* ---------- إخفاء المفضلة ---------- */
  var f = document.getElementById('favBtn');
  if (f) {
    f.textContent = JSON.parse(localStorage.getItem(STORE) || '[]')
      .indexOf(document.body.dataset.page) >= 0 ? '★' : '☆';
    f.addEventListener('click', function () {
      var id = document.body.dataset.page;
      var bm = JSON.parse(localStorage.getItem(STORE) || '[]');
      var i = bm.indexOf(id);
      i >= 0 ? bm.splice(i, 1) : bm.push(id);
      localStorage.setItem(STORE, JSON.stringify(bm));
      f.textContent = i >= 0 ? '☆' : '★';
    });
  }
})();


/* ==========================================================
   قارئ الكتاب — تقسيم المحتوى إلى صفحات بلا تمرير عمودي
   ========================================================== */
(function () {
  'use strict';
  var dataEl = document.getElementById('book');
  if (!dataEl) return;

  var BOOK;
  try { BOOK = JSON.parse(dataEl.textContent); } catch (e) { return; }

  var PGID = BOOK.id;
  var PADX = 20, PADY = 12, FOOT = 26, GAP = 12;
  var SPREAD = false;   /* وضع الكتاب المفتوح (صفحتان متقابلتان) — يُفعَّل لاحقًا */
  var R = {
    cur: 0, total: 0, pages: [], units: [], chaps: [],
    pageW: 0, pageH: 0, cw: 0, ch: 0, stageW: 0, stageH: 0,
    spread: false, fs: 1, busy: false, dir: 0, drag: null,
    rendered: {}, plan: null, index: null
  };
  window.__R = R; /* مرجع للتشخيص فقط */

  var stage, meas, measBody, leaf, leafFront, leafBack, chapEl, progEl, prevBtn, nextBtn;

  /* ---------- أدوات ---------- */
  function arD(s) { return window.arDigits(s); }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  /* ---------- ١) التهيئة ---------- */
  function setup() {
    stage = document.getElementById('rStage');
    if (!stage) return;
    leaf = document.getElementById('rLeaf');
    leafFront = document.getElementById('rFront');
    leafBack = document.getElementById('rBack');
    chapEl = document.getElementById('rBrand');
    progEl = document.getElementById('rProg');
    prevBtn = document.getElementById('rPrev');
    nextBtn = document.getElementById('rNext');

    meas = document.createElement('div');
    meas.className = 'rmeas';
    meas.innerHTML = '<div class="rbody"></div>';
    stage.appendChild(meas);
    measBody = meas.firstChild;

    R.fs = parseFloat(localStorage.getItem('ti_font') || '1') || 1;
    applyFont();

    /* القياس قبل استقرار الخطوط يعطي عدد صفحات مختلفًا في كل تحميل (٢٧٥ / ٢٧٩ / ٢٨١)،
       فنؤجّل أول ترقيم حتى تنتهي محاولة تحميل الخطوط (نجاحًا أو فشلًا). */
    var booted = false;
    function boot() {
      if (booted) return;
      booted = true;

      layout();
      buildUnits();

      var ok = loadPlan();
      if (!ok) { paginate(); savePlan(); }

      var saved = parseInt(localStorage.getItem('ti_pos_' + PGID) || '0', 10);
      R.cur = (saved > 0 && saved <= R.total) ? saved - 1 : 0;

      /* قفزة مباشرة إلى صفحة (للاختبار): seerah.html?p=12 */
      var m = /[?&#]p=(\d+)/.exec(location.href);
      if (m) { var jp = parseInt(m[1], 10); if (jp >= 1 && jp <= R.total) R.cur = jp - 1; }

      render();
      buildPanel();
      wire();
      document.body.classList.add('rready');
    }

    var fontsReady = Promise.resolve();
    if (document.fonts && document.fonts.load) {
      fontsReady = Promise.all([
        document.fonts.load('1em Amiri'),
        document.fonts.load('1em Cairo')
      ]).catch(function () { });
    }
    /* مهلة أمان: لو علِق الطلب لا نُجمّد القارئ */
    var safety = new Promise(function (res) { setTimeout(res, 2500); });
    Promise.race([fontsReady, safety]).then(function () {
      /* نفس طفيف: حتى بعد list/ready قد يحتاج المتصفح لحظة لتطبيق القياسات الجديدة */
      setTimeout(boot, 50);
    });
  }

  function applyFont() {
    document.documentElement.style.fontSize = (16 * R.fs) + 'px';
  }

  /* ---------- ٢) المقاسات ---------- */
  function layout() {
    var r = stage.getBoundingClientRect();
    R.stageW = r.width; R.stageH = r.height;
    R.spread = SPREAD && (window.innerWidth >= 820) && (window.innerWidth > window.innerHeight);
    R.pageW = R.spread ? Math.floor((R.stageW - 24 - GAP) / 2) : Math.min(R.stageW - 16, 700);
    R.pageH = Math.floor(R.stageH - 8);
    R.cw = R.pageW - PADX * 2;
    R.ch = R.pageH - PADY * 2 - FOOT;
    stage.style.setProperty('--pw', R.pageW + 'px');
    stage.style.setProperty('--ph', R.pageH + 'px');
    stage.style.setProperty('--ch', R.ch + 'px');
    meas.style.width = R.cw + 'px';
  }

  /* ---------- ٣) تحويل HTML إلى كتل ---------- */
  function buildUnits() {
    R.units = BOOK.units.map(function (u, ui) {
      var tpl = document.createElement('template');
      tpl.innerHTML = u.h;
      var root = tpl.content.firstElementChild;
      var blocks = u.one ? [root] : Array.prototype.slice.call(root.children)
        .filter(function (el) { return !(el.matches && el.matches('.crn,.orn,.porn,svg')); });
      return { ui: ui, u: u.u, id: u.id, n: u.n, ic: u.ic || '', blocks: blocks };
    });
  }

  /* ---------- ٤) القياس ---------- */
  function measureAll(nodes) {
    measBody.innerHTML = '';
    var fr = document.createDocumentFragment(), i;
    for (i = 0; i < nodes.length; i++) fr.appendChild(nodes[i].cloneNode(true));
    measBody.appendChild(fr);
    measBody.appendChild(document.createElement('div'));
    var kids = measBody.children, n = nodes.length, hs = [];
    for (i = 0; i < n; i++) hs.push(kids[i + 1].offsetTop - kids[i].offsetTop);
    measBody.innerHTML = '';
    return hs;
  }
  function measureOne(node) {
    measBody.innerHTML = '';
    measBody.appendChild(node.cloneNode(true));
    measBody.appendChild(document.createElement('div'));
    var k = measBody.children;
    var h = k[1].offsetTop - k[0].offsetTop;
    measBody.innerHTML = '';
    return h;
  }

  /* ---------- ٥) تصنيف الكتل ---------- */
  function kindOf(el) {
    if (!el) return 'other';
    var t = el.tagName;
    if (t === 'P') return 'tx';
    if (t === 'BLOCKQUOTE') return 'qt';
    if (t === 'UL' || t === 'OL') return 'ls';
    if (el.classList.contains('tblwrap')) return 'tb';
    if (el.classList.contains('kbox')) return 'kb';
    if (el.classList.contains('res')) return 'tx';
    if (el.classList.contains('people')) return 'ls';
    if (el.classList.contains('toclist')) return 'ls';
    if (el.querySelector && el.querySelector('.toclist,.people,ul,ol')) return 'ls';
    if (t === 'H2' || t === 'H3' || t === 'H4' || t === 'H5') return 'hd';
    return 'other';
  }

  /* الحاوية التي أبناؤها عناصر القائمة (قد تكون داخل إطار) */
  function listHost(el) {
    if (el.matches && el.matches('ul,ol,.people,.toclist')) return el;
    return (el.querySelector && el.querySelector('.toclist,.people,ul,ol')) || el;
  }
  function isHeading(el) {
    if (!el) return false;
    var t = el.tagName;
    if (t === 'H2' || t === 'H3' || t === 'H4' || t === 'H5') return true;
    if (el.classList.contains('ch3-h')) return true;
    return false;
  }

  /* مدى الكتلة القابل للتقسيم: [بداية، نهاية) */
  function rangeOf(el, kind) {
    if (kind === 'tx' || kind === 'qt') return [0, textOf(el).length];
    if (kind === 'ls') return [0, listHost(el).children.length];
    if (kind === 'tb') return [0, el.querySelectorAll('tbody tr').length];
    if (kind === 'kb') {
      var g = el.querySelector('.kgrid3');
      return [0, g ? g.children.length : 0];
    }
    return [0, 0];
  }

  /* ---------- ٦) نصوص الكتلة ---------- */
  function textOf(el) {
    if (el.tagName === 'BLOCKQUOTE') {
      var p = el.querySelector('p');
      return p ? p.textContent : el.textContent;
    }
    return el.textContent;
  }
  function cloneWithText(el, text, keepDrop) {
    var c = el.cloneNode(true);
    var drop = c.querySelector('.drop');
    var kids = Array.prototype.slice.call(c.childNodes);
    for (var i = 0; i < kids.length; i++) {
      var k = kids[i];
      if (k.nodeType === 3) c.removeChild(k);
      else if (k.nodeType === 1 && !(keepDrop && k === drop)) c.removeChild(k);
    }
    var body = text;
    if (keepDrop && drop) body = text.slice(drop.textContent.length);
    c.appendChild(document.createTextNode(body));
    return c;
  }
  function makeText(el, a, e, keepDrop) {
    if (el.tagName === 'BLOCKQUOTE') {
      var c = el.cloneNode(true);
      var p = c.querySelector('p');
      p.textContent = el.querySelector('p').textContent.slice(a, e);
      var cite = c.querySelector('cite');
      if (cite && a > 0) cite.remove();
      return c;
    }
    return cloneWithText(el, el.textContent.slice(a, e), keepDrop);
  }
  function snapSentence(text, pos) {
    var marks = ['.', '؟', '!', '۔', '،', '؛', ':'];
    for (var i = pos; i > pos - 220 && i > 40; i--) {
      if (marks.indexOf(text[i - 1]) >= 0) return i;
    }
    return pos;
  }

  /* ---------- ٧) تقسيم الكتل ---------- */
  function splitBlock(el, kind, a, e, avail) {
    if (avail < 70) return null;
    if (kind === 'tx' || kind === 'qt') {
      var full = textOf(el);
      /* عتبة منخفضة: كان ٢٤٠/٢٠٠ حرفًا فيترك فراغًا كبيرًا في أسفل الصفحات
         حين تأتي فقرة متوسطة لا تسع كاملة. نسمح بالقسمة ما دامت البقية سطرًا معتبرًا. */
      if (e - a < 90) return null;
      var hasDrop = !!el.querySelector('.drop');
      /* تقدير نسبي ثم تصحيحان على الأكثر — أسرع بكثير من البحث الثنائي على الجوال */
      var span = e - a;
      var fullH = measureOne(el);
      if (!(fullH > avail)) return null;
      var guess = a + Math.max(60, Math.min(span - 60, Math.round(span * (avail / fullH) * 0.97)));
      var best = -1;
      for (var it = 0; it < 3; it++) {
        var h = measureOne(makeText(el, a, guess, a === 0 && hasDrop));
        if (h <= avail) {
          best = guess;
          var room = avail - h;
          if (room < 24) break;
          var step = Math.max(24, Math.round(span * room / fullH));
          if (guess + step > e - 50) break;
          guess += step;
        } else {
          var back = Math.max(24, Math.round(span * (h - avail) / fullH));
          if (guess - back <= a + 50) break;
          guess -= back;
        }
      }
      if (best < 0) return null;
      var cut = snapSentence(full, best);
      if (cut <= a || cut >= e) cut = best;
      /* لا نُبقِي ذيلًا قصيرًا جدًا (سطرًا مبتورًا) ولا رأسًا قصيرًا جدًا */
      if ((cut - a) < 70 || (e - cut) < 50) return null;
      var p1 = makeText(el, a, cut, a === 0 && hasDrop);
      var p2 = makeText(el, cut, e, false);
      return [
        { d: { k: kind === 'qt' ? 'qt' : 'tx', a: a, e: cut, dp: (a === 0 && hasDrop) ? 1 : 0 }, node: p1 },
        { d: { k: kind === 'qt' ? 'qt' : 'tx', a: cut, e: e, dp: 0 }, node: p2 }
      ];
    }
    if (kind === 'tb') return splitTable(el, a, e, avail);
    if (kind === 'ls') return splitList(el, a, e, avail);
    if (kind === 'kb') return splitKbox(el, a, e, avail);
    return null;
  }

  /* جدول: يُقسَّم بالصفوف مع تكرار صف العناوين */
  function splitTable(el, a, e, avail) {
    var rows = el.querySelectorAll('tbody tr');
    if (!rows.length) return null;
    function build(r0, r1) {
      var w = el.cloneNode(true);
      var rs = w.querySelectorAll('tbody tr');
      for (var i = 0; i < rs.length; i++) {
        if (i < r0 || i >= r1) w.querySelector('tbody').removeChild(rs[i]);
      }
      if (r0 > 0) { var cap = w.querySelector('.tblcap'); if (cap) cap.remove(); }
      return w;
    }
    var lo = a + 1, hi = e - 1, best = -1;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      if (measureOne(build(a, mid)) <= avail) { best = mid; lo = mid + 1; } else hi = mid - 1;
    }
    if (best < 0 || best <= a) return null;
    return [
      { d: { k: 'tb', a: a, b: best }, node: build(a, best) },
      { d: { k: 'tb', a: best, b: e }, node: build(best, e) }
    ];
  }

  /* قائمة أو شبكة: تُقسَّم بعناصرها */
  function splitList(el, a, e, avail) {
    var host = listHost(el);
    var kids = host.children;
    if (kids.length < 3) return null;
    function build(c0, c1) {
      var c = el.cloneNode(true);
      var h = listHost(c);
      var ch = Array.prototype.slice.call(h.children);
      for (var i = 0; i < ch.length; i++) if (i < c0 || i >= c1) h.removeChild(ch[i]);
      return c;
    }
    var lo = a + 1, hi = e - 1, best = -1;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      if (measureOne(build(a, mid)) <= avail) { best = mid; lo = mid + 1; } else hi = mid - 1;
    }
    if (best < 0 || best <= a) return null;
    return [
      { d: { k: 'ls', a: a, b: best }, node: build(a, best) },
      { d: { k: 'ls', a: best, b: e }, node: build(best, e) }
    ];
  }

  /* شبكة البطاقات */
  function splitKbox(el, a, e, avail) {
    var grid = el.querySelector('.kgrid3');
    if (!grid) return null;
    var cards = grid.children;
    if (cards.length < 3) return null;
    function build(c0, c1) {
      var k = el.cloneNode(true);
      var g = k.querySelector('.kgrid3');
      var ch = Array.prototype.slice.call(g.children);
      for (var i = 0; i < ch.length; i++) if (i < c0 || i >= c1) g.removeChild(ch[i]);
      if (c0 > 0) { var t = k.querySelector('.bt'); if (t) t.remove(); }
      return k;
    }
    var lo = a + 1, hi = e - 1, best = -1;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      if (measureOne(build(a, mid)) <= avail) { best = mid; lo = mid + 1; } else hi = mid - 1;
    }
    if (best < 0 || best <= a) return null;
    return [
      { d: { k: 'kb', a: a, b: best }, node: build(a, best) },
      { d: { k: 'kb', a: best, b: e }, node: build(best, e) }
    ];
  }

  /* ---------- ٨) بناء كتلة من واصف (لاسترجاع الخطة) ---------- */
  function buildNode(u, b, d) {
    var el = R.units[u].blocks[b];
    if (d.k === 'tx' || d.k === 'qt') return makeText(el, d.a, d.e, !!d.dp);
    if (d.k === 'tb') {
      var w = el.cloneNode(true);
      var rs = w.querySelectorAll('tbody tr');
      for (var i = 0; i < rs.length; i++) if (i < d.a || i >= d.b) w.querySelector('tbody').removeChild(rs[i]);
      if (d.a > 0) { var cap = w.querySelector('.tblcap'); if (cap) cap.remove(); }
      return w;
    }
    if (d.k === 'ls') {
      var c = el.cloneNode(true);
      var h = listHost(c);
      var ch = Array.prototype.slice.call(h.children);
      for (var j = 0; j < ch.length; j++) if (j < d.a || j >= d.b) h.removeChild(ch[j]);
      return c;
    }
    if (d.k === 'kb') {
      var k = el.cloneNode(true);
      var g = k.querySelector('.kgrid3');
      if (g) {
        var gc = Array.prototype.slice.call(g.children);
        for (var q = 0; q < gc.length; q++) if (q < d.a || q >= d.b) g.removeChild(gc[q]);
      }
      if (d.a > 0) { var tt = k.querySelector('.bt'); if (tt) tt.remove(); }
      return k;
    }
    return el;
  }

  /* ---------- ٩) الترقيم ---------- */
  function paginate() {
    var pages = [], cur = { items: [], ch: '' }, curH = 0;
    R.chaps = []; R.partPages = {};

    function flush() {
      if (cur.items.length) pages.push(cur);
      cur = { items: [], ch: cur.ch }; curH = 0;
    }
    function add(u, b, d, node) { cur.items.push({ u: u, b: b, d: d, node: node }); curH += measureOne(node); }

    for (var ui = 0; ui < R.units.length; ui++) {
      var unit = R.units[ui];
      flush();
      cur.ch = unit.n;
      if (unit.u === 'c') R.chaps.push({ id: unit.id, n: unit.n, ic: unit.ic, page: pages.length + 1 });
      if (unit.u === 'p') R.partPages[unit.id] = pages.length + 1;

      var hs = measureAll(unit.blocks);
      var q = [], i;
      for (i = 0; i < unit.blocks.length; i++) {
        var k = kindOf(unit.blocks[i]);
        var rg = rangeOf(unit.blocks[i], k);
        q.push({ b: i, orig: unit.blocks[i], node: unit.blocks[i], h: hs[i], d: null, a: rg[0], e: rg[1], kind: k });
      }
      var qi = 0;
      while (qi < q.length) {
        var it = q[qi];

        /* عنوان: لا يبقى وحيدًا في آخر صفحة */
        if (isHeading(it.node) && cur.items.length) {
          var nx = q[qi + 1];
          var nh = nx ? Math.min(nx.h, 100) : 0;
          if (curH + it.h + nh > R.ch) { flush(); cur.ch = unit.n; continue; }
        }

        if (curH + it.h <= R.ch) {
          /* it.d موجود إذا كان هذا الجزء بقية كتلة قُسِّمت: نحفظ وصفه لا 'full'
             وإلا أعاد بناءُ الخطة عند التحميل التالي الكتلةَ كاملة (تكرار النص) */
          cur.items.push({ u: ui, b: it.b, d: it.d || { k: 'full' }, node: it.node });
          curH += it.h; qi++; continue;
        }

        /* لا يسع: قسّم إن أمكن */
        if (cur.items.length) {
          var sp = splitBlock(it.orig, it.kind, it.a, it.e, R.ch - curH);
          if (sp) {
            cur.items.push({ u: ui, b: it.b, d: sp[0].d, node: sp[0].node });
            flush(); cur.ch = unit.n;
            q[qi] = { b: it.b, orig: it.orig, node: sp[1].node, h: measureOne(sp[1].node),
              d: sp[1].d, a: sp[1].d.a, e: (sp[1].d.e !== undefined ? sp[1].d.e : sp[1].d.b), kind: it.kind };
            continue;
          }
          flush(); cur.ch = unit.n; continue;
        }

        /* صفحة فارغة ولا زال لا يسع */
        var sp2 = splitBlock(it.orig, it.kind, it.a, it.e, R.ch);
        if (sp2) {
          cur.items.push({ u: ui, b: it.b, d: sp2[0].d, node: sp2[0].node });
          flush(); cur.ch = unit.n;
          q[qi] = { b: it.b, orig: it.orig, node: sp2[1].node, h: measureOne(sp2[1].node),
            d: sp2[1].d, a: sp2[1].d.a, e: (sp2[1].d.e !== undefined ? sp2[1].d.e : sp2[1].d.b), kind: it.kind };
          continue;
        }
        cur.items.push({ u: ui, b: it.b, d: { k: 'full' }, node: it.node });
        curH += it.h; qi++;
      }
    }
    flush();

    R.pages = pages;
    R.total = pages.length;
    R.plan = {
      v: 3, w: R.cw, h: R.ch, fs: R.fs, spread: R.spread,
      chaps: R.chaps,
      pages: pages.map(function (p) {
        return { ch: p.ch, items: p.items.map(function (it) { return { u: it.u, b: it.b, d: it.d }; }) };
      })
    };
  }

  /* ---------- ١٠) الخطة المخزَّنة ---------- */
  function planKey() { return 'ti_plan_' + PGID + '_' + R.cw + 'x' + R.ch + '_' + R.fs; }
  function loadPlan() {
    try {
      var raw = localStorage.getItem(planKey());
      if (!raw) return false;
      var pl = JSON.parse(raw);
      if (!pl || pl.v !== 3 || (pl.pages.length !== undefined && !pl.pages.length)) return false;
      R.chaps = pl.chaps || [];
      R.pages = pl.pages.map(function (p) {
        return {
          ch: p.ch,
          items: p.items.map(function (it) {
            return { u: it.u, b: it.b, d: it.d, node: buildNode(it.u, it.b, it.d) };
          })
        };
      });
      R.total = R.pages.length;
      R.plan = pl;
      return R.total > 0;
    } catch (e) { return false; }
  }
  function savePlan() {
    if (!R.plan) return;
    try { localStorage.setItem(planKey(), JSON.stringify(R.plan)); }
    catch (e) { /* المساحة ممتلئة: تجاهل */ }
  }

  /* ---------- ١١) العرض ---------- */
  function mountPage(n) {
    if (R.rendered[n]) return R.rendered[n];
    var el = document.createElement('div');
    el.className = 'rpage';
    el.setAttribute('data-n', n);
    var body = document.createElement('div');
    body.className = 'rbody';
    var foot = document.createElement('div');
    foot.className = 'rpfoot';
    /* عزل LTR: الأرقام العربية-الهندية تُرتَّب من اليمين فتنقلب «صفحة/إجمالي» */
    foot.textContent = '\u2066' + arD(n + 1) + ' / ' + arD(R.total) + '\u2069';
    el.appendChild(body); el.appendChild(foot);
    R.pages[n].items.forEach(function (it) {
      if (it.node.getAttribute) {
        it.node.setAttribute('data-u', it.u);
        it.node.setAttribute('data-b', it.b);
      }
      body.appendChild(it.node);
    });
    place(el, n);
    stage.appendChild(el);
    /* كتلة واحدة أطول من الصفحة ولا تُقسَّم (كالغلاف): اسمح بالتمرير داخلها فقط */
    if (body.scrollHeight > body.clientHeight + 4 && R.pages[n].items.length === 1) body.classList.add('rflow');
    R.rendered[n] = el;
    return el;
  }
  function place(el, n) {
    var x;
    if (R.spread) x = (n % 2 === 0) ? (R.stageW - R.pageW - 10) : 10;
    else x = Math.round((R.stageW - R.pageW) / 2);
    el.style.left = x + 'px';
    el.style.top = '4px';
    el.style.width = R.pageW + 'px';
    el.style.height = R.pageH + 'px';
  }
  function unmountAll() {
    for (var k in R.rendered) {
      var el = R.rendered[k];
      if (el && el.parentNode) el.parentNode.removeChild(el);
    }
    R.rendered = {};
  }
  /* أرقام صفحات الفهرس تُحسب وقت التشغيل */
  function fillToc() {
    var links = document.querySelectorAll('.toclist a[href^="#"]');
    if (!links.length) return;
    var map = {}, k;
    for (k in (R.partPages || {})) map[k] = R.partPages[k];
    R.chaps.forEach(function (c) { map[c.id] = c.page; });
    for (var i = 0; i < links.length; i++) {
      var id = links[i].getAttribute('href').slice(1);
      var pg = map[id];
      if (!pg) continue;
      var s = links[i].querySelector('.tpg');
      if (!s) { s = document.createElement('span'); s.className = 'tpg'; links[i].appendChild(s); }
      s.textContent = arD(pg);
    }
  }

  function refreshPanel() {
    var list = document.getElementById('rPlist');
    if (!list) return;
    list.innerHTML = '';
    R.chaps.forEach(function (c) {
      var a = document.createElement('a');
      a.className = 'rpitem';
      a.href = 'javascript:void(0)';
      a.innerHTML = '<i>' + arD(c.page) + '</i><span>' + (c.ic ? c.ic + ' ' : '') + c.n + '</span>';
      a.addEventListener('click', function () { closePanel(); goto(c.page - 1); });
      list.appendChild(a);
    });
  }

  function render() {
    unmountAll();
    var from = Math.max(0, R.cur - 2), to = Math.min(R.total - 1, R.cur + 2);
    for (var i = from; i <= to; i++) {
      var el = mountPage(i);
      el.style.visibility = (i === R.cur) ? 'visible' : 'hidden';
      el.style.zIndex = (i === R.cur) ? 3 : 1;
    }
    updateChrome();
    fillToc();
    refreshPanel();
    checkOverflow();
  }

  /* إن تجاوز المحتوى حدود الصفحة: أعد الترقيم بقياس جديد، ثم قلّل الارتفاع إن لزم.
     الحد الأقصى محاولتين ثم توقّف — وإلا دارت الحلقة بلا نهاية عند كتلة لا تُقسَّم. */
  function checkOverflow() {
    if (R.checking) return;
    var over = 0;
    for (var k in R.rendered) {
      var b = R.rendered[k].querySelector('.rbody');
      if (!b || b.classList.contains('rflow')) continue;
      /* قِس آخر عنصر فعليًا: الهوامش الختامية لا تُحتسب فيضًا */
      var last = b.lastElementChild;
      if (!last) continue;
      var d = Math.round(last.getBoundingClientRect().bottom - b.getBoundingClientRect().bottom);
      if (d > 16) over = d;   /* تسامح: نزول الحروف العربية تحت السطر */
    }
    if (over <= 4) return;
    if (R.ovN >= 2 || R.ch <= 142) return;
    R.ovN = (R.ovN || 0) + 1;
    R.checking = true;
    if (!R.refixed) {
      /* مرة واحدة فقط: أعد الترقيم بالقياسات الحالية (قد تختلف عند استقرار الخط) */
      R.refixed = true;
      paginate(); savePlan();
    }
    R.checking = false;
    R.cur = Math.min(R.cur, R.total - 1);
    setTimeout(render, 0);
  }

  function repaginate() {
    var keep = R.cur;
    paginate();
    savePlan();
    R.cur = Math.min(keep, R.total - 1);
    render();
  }

  function updateChrome() {
    var fr = R.total ? (R.cur + 1) / R.total : 0;
    document.body.setAttribute('data-dbg', 'cur=' + R.cur + ' total=' + R.total +
      ' rendered=' + Object.keys(R.rendered).join(',') + ' busy=' + R.busy +
      ' pages=' + R.pages.length + ' ch=' + R.ch);
    if (progEl) progEl.style.width = Math.round(fr * 100) + '%';
    if (chapEl) chapEl.textContent = (R.pages[R.cur] && R.pages[R.cur].ch) || BOOK.n;
    if (window.__paintProgress) window.__paintProgress(fr);
    if (window.__setProgress) window.__setProgress(PGID, fr);
    try { localStorage.setItem('ti_pos_' + PGID, String(R.cur + 1)); } catch (e) { }
    if (prevBtn) prevBtn.disabled = (R.cur <= 0);
    if (nextBtn) nextBtn.disabled = (R.cur >= R.total - 1);
    var st = document.querySelector('[data-stat="pages"]');
    if (st) st.textContent = arD(R.total);
  }

  /* ---------- ١٢) الانتقال ---------- */
  function goto(n, hl) {
    n = clamp(n, 0, R.total - 1);
    if (n === R.cur && !hl) { return; }
    R.cur = n;
    render();
    if (hl) setTimeout(function () { highlightPage(n, hl); }, 30);
  }

  /* ---------- ١٣) التقليب ---------- */
  function startFlip(dir) {
    if (R.busy) return false;
    var dest = R.cur + dir;
    if (dest < 0 || dest >= R.total) return false;
    R.busy = true; R.dir = dir;

    var destEl = mountPage(dest);
    var curEl = R.rendered[R.cur];
    leafFront.innerHTML = curEl ? curEl.querySelector('.rbody').innerHTML : '';
    leafBack.innerHTML = '';
    var x = Math.round((R.stageW - R.pageW) / 2);
    leaf.style.width = R.pageW + 'px';
    leaf.style.height = R.pageH + 'px';
    leaf.style.left = x + 'px';
    leaf.style.top = '4px';
    leaf.style.transformOrigin = dir > 0 ? 'right center' : 'left center';
    leaf.style.transition = 'none';
    leaf.style.transform = 'rotateY(0deg)';
    leaf.classList.toggle('prev', dir < 0);
    leaf.classList.add('on');
    if (curEl) { curEl.style.visibility = 'hidden'; curEl.style.zIndex = 1; }
    destEl.style.visibility = 'visible';
    destEl.style.zIndex = 2;
    return true;
  }
  function setAngle(deg) {
    leaf.style.transition = 'none';
    leaf.style.transform = 'rotateY(' + deg + 'deg)';
    var a = Math.abs(deg) / 180;
    leaf.style.setProperty('--a', a.toFixed(3));
  }
  function commitFlip() {
    leaf.style.transition = 'transform .40s cubic-bezier(.22,.68,.32,1)';
    leaf.style.transform = 'rotateY(' + (R.dir > 0 ? 180 : -180) + 'deg)';
    leaf.style.setProperty('--a', '1');
    setTimeout(function () {
      leaf.classList.remove('on');
      leafFront.innerHTML = '';
      R.cur = clamp(R.cur + R.dir, 0, R.total - 1);
      R.busy = false; R.dir = 0;
      render();
    }, 420);
  }
  function cancelFlip() {
    leaf.style.transition = 'transform .22s ease-out';
    leaf.style.transform = 'rotateY(0deg)';
    leaf.style.setProperty('--a', '0');
    setTimeout(function () {
      leaf.classList.remove('on');
      leafFront.innerHTML = '';
      R.busy = false; R.dir = 0;
      render();
    }, 240);
  }
  function flipTo(dir) {
    try {
      if (!startFlip(dir)) { document.body.setAttribute('data-dbg', 'flip-refused dir=' + dir + ' busy=' + R.busy + ' cur=' + R.cur + ' total=' + R.total); return; }
      commitFlip();
    } catch (err) {
      document.body.setAttribute('data-dbg', 'flip-error ' + (err && err.message));
    }
  }

  /* ---------- ١٤) اللمس والسحب ---------- */
  function wire() {
    stage.addEventListener('pointerdown', onDown, { passive: true });
    window.addEventListener('pointermove', onMove, { passive: false });
    window.addEventListener('pointerup', onUp, { passive: true });
    window.addEventListener('pointercancel', onUp, { passive: true });

    if (prevBtn) prevBtn.addEventListener('click', function () { flipTo(-1); });
    if (nextBtn) nextBtn.addEventListener('click', function () { flipTo(1); });
    var menu = document.getElementById('rMenu');
    if (menu) menu.addEventListener('click', openPanel);
    var pbtn = document.getElementById('rProgBtn');
    if (pbtn) pbtn.addEventListener('click', openPanel);

    /* الروابط الداخلية (فهرس الفصول) تقفز إلى الصفحة */
    stage.addEventListener('click', function (e) {
      var a = e.target.closest('a[href^="#"]');
      if (!a) return;
      e.preventDefault();
      var id = a.getAttribute('href').slice(1);
      var ci = R.chaps.filter(function (c) { return c.id === id; })[0];
      if (ci) { closePanel(); goto(ci.page - 1); }
    });

    var t = null;
    window.addEventListener('resize', function () {
      clearTimeout(t);
      t = setTimeout(function () {
        layout();
        repaginate();
      }, 220);
    });

    document.addEventListener('backbutton', function (e) {
      if (R.cur > 0) { e.preventDefault(); goto(R.cur - 1); }
      else { e.preventDefault(); location.href = 'index.html'; }
    });
  }

  function onDown(e) {
    if (R.busy) return;
    if (e.target.closest('a,button,input,select')) return;
    R.drag = { x0: e.clientX, y0: e.clientY, dir: 0, t0: Date.now(), active: false };
  }
  function onMove(e) {
    if (!R.drag || R.busy) return;
    var dx = e.clientX - R.drag.x0, dy = e.clientY - R.drag.y0;
    if (!R.drag.active) {
      if (Math.abs(dx) < 12 || Math.abs(dx) < Math.abs(dy)) return;
      R.drag.active = true;
      R.drag.dir = dx > 0 ? 1 : -1;
      if (!startFlip(R.drag.dir)) { R.drag = null; return; }
    }
    e.preventDefault();
    var deg = clamp((dx / R.pageW) * 180, -180, 180);
    setAngle(deg);
  }
  function onUp(e) {
    if (!R.drag) return;
    var d = R.drag; R.drag = null;
    if (!d.active) {
      /* نقر على الحافة: يسار = التالي، يمين = السابق */
      var r = stage.getBoundingClientRect();
      var rel = (e.clientX - r.left) / r.width;
      if (rel < 0.28) flipTo(1);
      else if (rel > 0.72) flipTo(-1);
      return;
    }
    var dx = e.clientX - d.x0;
    var dt = Math.max(1, Date.now() - d.t0);
    var fast = Math.abs(dx) / dt > 0.5;
    var far = Math.abs(dx) > R.pageW * 0.24;
    if ((fast || far) && Math.sign(dx) === d.dir) commitFlip();
    else cancelFlip();
  }

  /* ---------- ١٥) لوحة الفهرس والذهاب إلى صفحة ---------- */
  function buildPanel() {
    var pan = document.createElement('div');
    pan.className = 'rpanel';
    pan.id = 'rPanel';
    pan.innerHTML =
      '<div class="rphead"><b>الذهاب إلى صفحة</b><button class="ib" id="rClose" title="إغلاق">✕</button></div>' +
      '<div class="rpjump"><input type="number" id="rJumpIn" min="1" placeholder="رقم الصفحة">' +
      '<button class="rpgo" id="rJumpGo">انتقل</button></div>' +
      '<div class="rpfont"><span>حجم الخط</span>' +
      '<button data-fs="0.9">ص</button><button data-fs="1">م</button>' +
      '<button data-fs="1.12">ك</button><button data-fs="1.25">ج</button></div>' +
      '<div class="rplist" id="rPlist"></div>' +
      '<a class="rphome" href="index.html">فهرس الموسوعة</a>';
    document.body.appendChild(pan);
    refreshPanel();
    document.getElementById('rClose').addEventListener('click', closePanel);
    document.getElementById('rJumpGo').addEventListener('click', function () {
      var v = parseInt(document.getElementById('rJumpIn').value, 10);
      if (v >= 1 && v <= R.total) { closePanel(); goto(v - 1); }
    });
    pan.querySelectorAll('[data-fs]').forEach(function (b) {
      b.addEventListener('click', function () {
        setFont(parseFloat(b.getAttribute('data-fs')));
        closePanel();
      });
    });
  }
  function openPanel() {
    var p = document.getElementById('rPanel');
    if (!p) return;
    p.classList.add('on');
    var inp = document.getElementById('rJumpIn');
    if (inp) { inp.max = R.total; inp.value = R.cur + 1; inp.focus(); }
  }
  function closePanel() {
    var p = document.getElementById('rPanel');
    if (p) p.classList.remove('on');
  }

  function setFont(fs) {
    R.fs = fs;
    try { localStorage.setItem('ti_font', String(fs)); } catch (e) { }
    applyFont();
    layout();
    repaginate();
  }

  /* ---------- ١٦) البحث في نص الكتاب ---------- */
  function normKeep(s) {
    return s.replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه');
  }
  function buildIndex() {
    if (R.index) return R.index;
    var idx = [];
    R.pages.forEach(function (p, pi) {
      p.items.forEach(function (it) {
        var t = it.node.textContent || '';
        if (t.trim().length > 8) idx.push({ page: pi, u: it.u, b: it.b, text: t });
      });
    });
    R.index = idx;
    return idx;
  }
  function highlightPage(pageNo, q) {
    var el = R.rendered[pageNo];
    if (!el) return;
    var nq = normKeep(q);
    var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
    var nodes = [], n;
    while ((n = walker.nextNode())) if (n.nodeValue && n.nodeValue.trim()) nodes.push(n);
    nodes.forEach(function (t) {
      var s = t.nodeValue, low = normKeep(s);
      var i = low.indexOf(nq);
      if (i < 0) return;
      var frag = document.createDocumentFragment(), last = 0, j = i;
      while (j >= 0) {
        frag.appendChild(document.createTextNode(s.slice(last, j)));
        var mk = document.createElement('mark');
        mk.textContent = s.substr(j, q.length);
        frag.appendChild(mk);
