003ctd\u003eتنازع الأمراء على المقود\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٣١٠م إلى ١٣٤١م\u003c/td\u003e\u003ctd\u003eالناصر ثالثا\u003c/td\u003e\u003ctd\u003eاستقلال تام وثلاثون سنة ازدهار\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٣٤١م وما بعدها\u003c/td\u003e\u003ctd\u003eأولاده وأحفاده\u003c/td\u003e\u003ctd\u003eتولى تسعة من ولده في سنوات قليلة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eقال الرحالة في أيام الناصر: يخرج المسافر من دمشق إلى القاهرة بماله لا يخاف إلا الله، وما رأيت في بلاد المشرق أمنا كأمن الناس في هذه الدولة.\u003c/p\u003e\u003ccite\u003eمن كلام الرحالة الذين عبروا الشام ومصر في عهد الناصر\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eفي عهد الناصر محمد وصلت الدولة المملوكية قمة ما بلغته قط: نهاية الحرب مع المغول بعد شقحب، وعمران القاهرة، وأمن الطرق، وخزائن ممتلئة. غير أن ما خلفه من استبداد المماليك وسلطانة أولاد ضعاف كان بذر الضعف الذي ظهر بعد موته سنة ١٣٤١م.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-5","n":"القسم الخامس: انهيار القلاوونيين وصعود المماليك الجراكسة","ic":"","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-5\" style=\"--c:#0F6B5C\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🥋\u003c/div\u003e\n      \u003ch2\u003eالقسم الخامس: انهيار القلاوونيين وصعود المماليك الجراكسة\u003c/h2\u003e\n      \u003cp\u003eتتابع هذه الفصول الانهيار الذي شهدته الدولة بعد موت الناصر: صراع الورثة وتعاقب السلاطين الصبيان في سنوات قليلة، ثم استيلاء الأمراء على مقاليد الحكم، ثم ظهور المماليك الجراكسة من جبال القوقاز حتى أخذوا زمام الدولة من أيدي الأتراك البحرية. في نصف قرن انتقلت السلطنة من بيت قلاوون إلى أيد جديدة ما زالت تتلمس طريقها إلى الحكم.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#qalawunid-collapse\"\u003eسقوط الدولة القلاوونية\u003c/a\u003e\u003ca href=\"#burdji-ascendancy\"\u003eصعود المماليك الجراكسة\u003c/a\u003e\u003ca href=\"#amir-dictatorship\"\u003eحكم الأمراء والسلاطين الظل\u003c/a\u003e\u003ca href=\"#ahmed-and-crisis\"\u003eتيمور على الشام وأزمة نهاية القرن\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"qalawunid-collapse","n":"سقوط الدولة القلاوونية","ic":"⚰️","part":"القسم الخامس: انهيار القلاوونيين وصعود المماليك الجراكسة","h":"\u003carticle class=\"ch3\" id=\"qalawunid-collapse\" data-toc=\"سقوط الدولة القلاوونية\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e5.1\u003c/span\u003e\n          \u003ch3\u003e⚰️ سقوط الدولة القلاوونية\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eح\u003c/span\u003eين مات الناصر محمد سنة ١٣٤١م ظن الناس أن ابنه سيجلس مكانه ثلاثين سنة كما جلس أبوه، فكان العكس تماما: في سبع سنوات تعاقب على عرش القاهرة ستة من ولده وأحفاده، كلهم في يد الأمراء، حتى انقرض البيت القلاوني من الحكم سنة ١٣٨٢م على يد البرقوقي.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eخلف الناصر محمدَ ثمانية من أولاده وأحفاده في السلطنة، أولهم المنصور أبو بكر الذي لم تدم سلطنته إلا أشهرا حتى خلعه كبير الأمراء قوصون وسجنه وقتله سنة ١٣٤١م. ثم تولى الأشرف كوجك وهو صبي في العاشرة بيد قوصون نفسه، فما لبث أن سقط قوصون نفسه في انقلاب لجيش آخرين، وتوالى بعد ذلك الناصر أحمد والصالح إسماعيل والكامل شعبان والناصر حسن والصالح صلاح الدين، وكل سلطان منهم يقعد وينزل بأمر أمير أو جماعة من الأمراء.\u003c/p\u003e\u003cp class=\"ap\"\u003eولم يكن ضعف هؤلاء السلاطين نقصا في رجال البيت القلاوني بقدر ما كان نقصا في سلطانهم: فقد كان الأمراء بعد موت الناصر قد استفحل أمرهم في الإقطاعات والمناصب، وصار في الدولة عشرات من كبار الأمراء لكل منهم مماليكه وأمواله وأتباعه، فإذا ولي سلطان اجتمعوا على من يوافقهم وإن لم يوافقهم خلعوه كما يخلعون قميصا. وكان أكبر منافسات الدولة تدور بين مماليك الناصر الذين ورثهم أبناؤه وبين الأمراء الشراكسة والأتراك القدامى.\u003c/p\u003e\u003cp class=\"ap\"\u003eوظهر في هذه السنوات وباء الطاعون الأسود الذي دخل مصر والشام سنة ١٣٤٧م ف أفنى عددا هائلا من السكان في القاهرة ودمشق وسائر البلاد، ومات فيه كثير من الجند والأمراء والفلاحين. وكان لهذا الوباء أثر اقتصادي بعيد المدى: نقصت الأرض المزروعة لنقص العمال، وارتفعت الأجور لقلة الأحياء، واختلت موازين الخراج في الدواوين، فدخلت الدولة في ضائقة مالية صاحبت ضعفها السياسي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان من أغرب فصول هذه الفترة سلطنة الناصر حسن بن محمد بن قلاوون مرتين: الأولى وهو صبي بيد الأمراء فخلعوه، والثانية سنة ١٣٥٤م وقد استقل فقتل من كان يتحكم فيه وأمر في الدولة أمرا وحده، وبنى مسجده العظيم عند باب زويلة الذي يعد من أجمل مساجد القاهرة، ثم قتل سنة ١٣٦١م في انقلاب قاده يلبغا العمري كبير الأمراء، فكان مثلا يحتاجه في موته من جاء بعده من سلاطين هذا البيت.\u003c/p\u003e\u003cp class=\"ap\"\u003eوبعد مقتل الناصر حسن تعاقب سلطانان صبيان من البيت هما المنصور محمد بن حاجي والأشرف شعبان بن حسن، وفي عهد الأخير استعاد البيت شيئا من قوته وقاد الدولة في حربه ضد مملكة قبرص وثأر لما كان من غارات الفرنج على الإسكندرية سنة ١٣٦٥م. غير أن الأشرك شعبان قتل هو الآخر سنة ١٣٧٦م في انقلاب آخر، وولي ابنه المنصور علي وهو صبي، ثم ابنه الصلاح حاجي، حتى جاء سنة ١٣٨٢م فخلع البرقوقي الصلاح حاجي وابتدأ دولته الجراكسية، فانقرض بيت قلاوون من السلطنة بعد أن حكمها قرنا وثلثا.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eقوصون: أول من لعب بالعرش\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان قوصون من كبار مماليك الناصر محمد وأقربهم إليه، فلما مات السلطان كان قوصون صاحب الكلمة الأولى في القلعة. أجلس أولا المنصور أبا بكر ثم رأى أن يستبدل به صبيا أصغر هو الأشرف كوجك، فخلع الأول وقتله، فكان أول من جرب في مصر خلع سلطان واختيار آخر من غير شورى أمراء ولا حجة شرعية قائمة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوما لبث قوصون أن ذاق من الكأس نفسها: فقد اجتمع عليه الأمراء والجند الذين سخطوا سلطته فخرجوا عليه وأنهوا أمره في أشهر، فولى الأمراء بعده الناصر أحمد وهو في الكرك بعيدا عن القاهرة. وبهذا فتح قوصون بابا ما أغلق: صار العرش في العقود التالية كرسي يرحل عليه السلاطين بقرار الأمراء في مجلس واحد.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالطاعون الأسود وأثره في الدولة\u003c/h4\u003e\u003cp class=\"ap\"\u003eدخل الطاعون الأسود مصر والشام سنة ٧٤٩هـ الموافق ١٣٤٧م قادما من بلاد الترك عبر التجارة، وانتشر في القاهرة ودمسق انتشار النار في الهشيم، ومات في البلاد أعدادا لا يحصيها إلا الله ذكرت بعض الأخبار أنها جاوزت ثلث السكان في مواضع. وتواترت سنوات الوباء بعد ذلك مرات في العقود التالية حتى صارت الأمراض جزءا من حياة الدولة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان أثر الوباء في الدولة المملوكية أشد من أثره في غيرها، لأن قوتها كلها قوة جند والجند من المماليك الذين يموتون فيموت معهم تدريبهم وخبرتهم. وقد شكا الدواوين في هذه السنوات من نقص الخراج وتأخر الجرايات، وظهر في الأسواق غلاء وتغير في الأثمان بقي مع الدولة سنين طويلا بعد انقضاء الوباء نفسه.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eموت الناصر محمد\u003c/b\u003e\u003cspan\u003eسنة ١٣٤١م آخر عهود القوة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eعدد سلاطين البيت بعده\u003c/b\u003e\u003cspan\u003eثمانية من أولاده وأحفاده في نحو أربعين سنة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالطاعون الأسود\u003c/b\u003e\u003cspan\u003eبدأ سنة ١٣٤٧م وتكرر مرات بعدها\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمسجد الناصر حسن\u003c/b\u003e\u003cspan\u003eبني في ولايته الثانية عند باب زويلة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eنهاية البيت القلاوني\u003c/b\u003e\u003cspan\u003eخلع الصلاح حاجي سنة ١٣٨٢م\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالسلطان\u003c/th\u003e\u003cth\u003eالسنوات\u003c/th\u003e\u003cth\u003eمصيره\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالمنصور أبو بكر\u003c/td\u003e\u003ctd\u003e١٣٤١م\u003c/td\u003e\u003ctd\u003eخلعه قوصون وقتله بعد أشهر\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالأشرف كوجك\u003c/td\u003e\u003ctd\u003e١٣٤١م إلى ١٣٤٢م\u003c/td\u003e\u003ctd\u003eخلع بعد سقوط قوصون\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالناصر أحمد\u003c/td\u003e\u003ctd\u003e١٣٤٢م\u003c/td\u003e\u003ctd\u003eخلع وقتل في الكرك\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالصالح إسماعيل\u003c/td\u003e\u003ctd\u003e١٣٤٢م إلى ١٣٤٥م\u003c/td\u003e\u003ctd\u003eمات صبيا في سلطنته\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالناصر حسن\u003c/td\u003e\u003ctd\u003eمرتين ١٣٤٧م و١٣٥٤م\u003c/td\u003e\u003ctd\u003eقتله يلبغا العمري سنة ١٣٦١م\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالأشرف شعبان\u003c/td\u003e\u003ctd\u003e١٣٦٣م إلى ١٣٧٦م\u003c/td\u003e\u003ctd\u003eقتل في انقلاب أمراء\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eلما مات الناصر لم يقعد للدولة سلطان يحكم نفسه، وصار الأمر في القاهرة إلى من غلب من الأمراء، يتولون السلطان ويخلعونه كما يشاؤون.\u003c/p\u003e\u003ccite\u003eمن كلام المؤرخين في وصف سنوات ما بعد الناصر\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eبعد موت الناصر محمد سنة ١٣٤١م صار عرش القاهرة في يد الأمراء يولون ويخلعون من يشاؤون، وضعف البيت القلاوني سلطانا سلطانا حتى انقرض سنة ١٣٨٢م. وكان الطاعون الأسود في هذه السنوات ضربة أخرى أفقرت البلاد وأنهكت الجند.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"burdji-ascendancy","n":"صعود المماليك الجراكسة","ic":"🛡️","part":"القسم الخامس: انهيار القلاوونيين وصعود المماليك الجراكسة","h":"\u003carticle class=\"ch3\" id=\"burdji-ascendancy\" data-toc=\"صعود المماليك الجراكسة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e5.2\u003c/span\u003e\n          \u003ch3\u003e🛡️ صعود المماليك الجراكسة\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eك\u003c/span\u003eان المماليك في القرن الأول للدولة أتراكا من القفجاق يشتريهم التجار من أسواق شمال البحر الأسود، ثم تغيرت خريطة التجارة فصار السلاطين يشتهرون بشراء الجراكسة من جبال القوقاز، فتغير معهم وجه الدولة من عاداتها إلى سلطنتها نفسها.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eالجراكسة قوم من جبال القوقاز بين البحر الأسود وبحر الخزر، كان تجار الرقيق يجلبونهم إلى أسواق مصر عن طريق جنوة والتجار في سواحل البحر الأسود بعد أن ضاقت طرق القفجاق بحروب المغود مع الروس وغيرهم. وكان الجركسي إذا دخل طائفة السلطان تربى فيها كما يتربى التركي، غير أن الجراكسة كانوا يعرفون بأنفسهم جماعة واحدة تشتري بعضها بعضا وتنصر بعضها، فتكاثروا في الجند حتى صاروا أكثر المماليك عددا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأول ما ظهرت كلمة الجركسية في سلطنة صلاح الدين حجي سنة ١٣٨٢م حين خلعه البرقوقي وتولى العرش، فقد كان البرقوقي نفسه جركسيا ونصب على فراشه سلطانا جركسيا، ثم أجلس نفسه في السنة التالية. ومن يومئذ عرف المماليك الجراكسة بالمماليك البرجية نسبة إلى أبراج قلعة الجبل التي أسكنهم فيها البرقوقي، في مقابل المماليك البحرية الأتراك الذين سكنوا بدور قلعة الجبل في النيل في القرن الأول.\u003c/p\u003e\u003cp class=\"ap\"\u003eولم يكن انتقال الحكم من الأتراك إلى الجراكسة انقلابا في ساعة واحدة بل تحولا في عقود: فقد بدأ شراء الجراكسة منذ عهد الناصر محمد نفسه، فتكاثروا في عهد أولاده، ثم صار أكبر الأمراء في عقود الضعف جراكسة مثل يلبغا العمري وآسنبغا ومنجك، فحين جاء البرقوقي وجد بيوتا جركسية عظيمة تسنده. وبهذا صارت السلطنة في بيت جركسي وبقي الحكم في يد الجراكسة قرنا كاملا حتى سقوط الدولة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد تغير مع الجراكسة شيء من طبيعة الدولة في نظر المؤرخين: فقد كان الأتراك أشد انضباطا في التربية وأدبا في مجلس السلطان، وكان الجراكسة أشدبأسا في الحرب وأشد تمسكا بمصالح بيوتهم. وتكثر في كتب التاريخ في القرن الجركسي الشكوى من فوضى الإقطاعات وتعدد البيوتات داخل القلعة، حيث صار لكل بيت من بيوت الأمراء مماليكه وذخائره وعهوده، فتعددت مراكز القوة داخل الدولة الواحدة.\u003c/p\u003e\u003cp class=\"ap\"\u003eعلى أن هذا التغير لم يكسر الدولة بل حافظ عليها قرنا آخر: فقد برز في القرن الجركسي سلاطين كبار مثل برسباي وقايتباي لم تقل هيبتهم عن سلاطين القرن الأول، وواصلت الدولة حروبها مع الفرنجة في قبرص ومع المغود في الشمال وفتحت جزيرة قبرص نفسها سنة ١٤٢٦م. فالتاريخ الجركسي للدولة ليس تاريخ ضعف فقط بل تاريخ دولة وصلت متأخرة في الزمان تغير أهلها وبقي جهازها.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eلماذا انقطع وصول الأتراك\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت أسواق شمال البحر الأسود في القرن الأول للدولة تفيض بأسرى الترك من حروب القفجاق والروس والمغود، فلما استقرت دول المغود في الشمال وانتقلت طرق التجارة تغير هذا المصدر تدريجيا. وصار تجار الرقيق يتجهون إلى جبال القوقاس حيث قبائل الجراكسة تبيع أبناءها في مواسم معروفة.\u003c/p\u003e\u003cp class=\"ap\"\u003eولم يكن هذا التحول اختيارا من السلاطين بل واقع تجارة فرض نفسه: فمن يشتر من أسواق العصر يجد الجركسي متاحا والتركي عزيزا. وهكذا دخل الجراكسة في طوائف الدولة من غير أن يشعر أحد أن هذا الشراء سيغير وجه السلطنة نفسها بعد نصف قرن، كما يتسلل الماء في الأرض فيظهر في مكان بعيد ما ظن الناس أنه يصل إليه.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالبرجية والبحرية: اسمان ومكانان\u003c/h4\u003e\u003cp class=\"ap\"\u003eسمي المماليك الأتراك الأوائل البحرية لأنهم سكنوا بدور قلعة الجبل المطلة على النيل، وسمي الجراكسة البرجية لأن البرقوقي أسكن مماليكه في أبراج القلعة. وظل الاسمان يتصدران تاريخ الدولة حتى إن المؤرخين يقسمون الدول المملوكية كلها إلى دولة بحرية ودولة برجية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان بين الفريقين في القرن الأول من دولة البرجية شيء من التنافر القديم، فإذا سقط سلطان قال الناس: ردها البحرية أو ردها البرجية. غير أن هذا التنافر ذاب مع الزمن في جيل نشأ في القلعة لا يعرف الفرق إلا اسما في كتب التاريخ، وصار المماليك في آخر الدولة جراكسة وأتراكا معا في بيوت متجاورة.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأصل الجراكسة\u003c/b\u003e\u003cspan\u003eجبال القوقاز بين البحرين الأسود والخزر\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسبب حضورهم\u003c/b\u003e\u003cspan\u003eتحول طرق تجارة الرقيق من القفجاق إلى القوقاس\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eبداية السلطنة الجركسية\u003c/b\u003e\u003cspan\u003eخلع البرقوقي لصلاح الدين حجي سنة ١٣٨٢م\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسبب تسمية البرجية\u003c/b\u003e\u003cspan\u003eسكن مماليك البرقوقي أبراج قلعة الجبل\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمدة حكم البرجية\u003c/b\u003e\u003cspan\u003eقرن وثلث حتى سقوط الدولة سنة ١٥١٧م\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالفريق\u003c/th\u003e\u003cth\u003eالأصل\u003c/th\u003e\u003cth\u003eأشهر سلاطينه\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالمماليك البحرية\u003c/td\u003e\u003ctd\u003eأتراك القفجاق\u003c/td\u003e\u003ctd\u003eبيبرس وقلاوون والناصر محمد\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمماليك البرجية\u003c/td\u003e\u003ctd\u003eجراكسة القوقاز\u003c/td\u003e\u003ctd\u003eالبرقوقي وبرسباي وقايتباي والغوري\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالبحرية زمن الحكم\u003c/td\u003e\u003ctd\u003eمن ١٢٥٠م إلى ١٣٨٢م\u003c/td\u003e\u003ctd\u003eقرن وثلث قرن\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالبرجية زمن الحكم\u003c/td\u003e\u003ctd\u003eمن ١٣٨٢م إلى ١٥١٧م\u003c/td\u003e\u003ctd\u003eقرن وثلث قرن\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eصار شراء الجركس في مصر أكثر من شراء الترك، حتى إن الطوائف في القلعة تكاد تخلو من غير الجراكسة، وصار من يشتري عشرين مملوكا جركسيا يعد بيتا من بيوت الدولة.\u003c/p\u003e\u003ccite\u003eمن وصف المؤرخين لتحول سوق المماليك في القرن الثامن\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eصعود الجراكسة لم يكن انقلاب قصر بل نتيجة تحول تجاري غير خريطة أسواق الرقيق، فدخلوا الجند حتى صاروا أهله، ثم أخذوا السلطنة نفسها سنة ١٣٨٢م. ومن يومها حكم المماليك البرجية الدولة إلى آخر أيامها.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"amir-dictatorship","n":"حكم الأمراء والسلاطين الظل","ic":"⛓️","part":"القسم الخامس: انهيار القلاوونيين وصعود المماليك الجراكسة","h":"\u003carticle class=\"ch3\" id=\"amir-dictatorship\" data-toc=\"حكم الأمراء والسلاطين الظل\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e5.3\u003c/span\u003e\n          \u003ch3\u003e⛓️ حكم الأمراء والسلاطين الظل\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي العقود الفاصلة بين انهيار القلاونيين وترسيخ البرقوقي، حكم مصر فعليا كبار الأمراء من خلف سلاطين صبيان يجلسون على العرش شهورا. كان هؤلاء الأمراء يتقاسمون الدولة كما تتقاسم عصبة تجار سوقا، حتى قام البرقوقي فكسر شوتهم واحدة واحدة.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eبعد مقتل الأشرف شعبان سنة ١٣٧٦م ولي ابنه المنصور علي وهو صبي، وصار صاحب التدبير في الدولة الأمير ألتنبغا الناصري ومن بعده برقوق شيخ الولاة. وصار هؤلاء الأمراء يوزعون المناصب الكبرى في مصر والشام على رجالهم، ويجلسون في دار السعادة يحسمون أمر الحرب والخراج والسلطنة، والسلطان الصبي يظهر في المواسم للخلع والبيعة ثم يعود إلى حبس القصر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان أخطر ما في هذا النظام أنه فرغ السلطنة من معناها: فقد كان السلاطين الصبيان يتغيرون بتغير موازين الأمراء، ولا يستمر سلطان إلا ما دام عمه أو وصيه راضيا. وفي الشام صارت دمشق وحلب وصفد شبه إمارات لأمرائها، يتصرفون في الإقطاعات ويخطبون لأنفسهم في سني ضعف القاهرة، ويجتمعون على مصر في مواسم النزاع على العرش، فصارت الدولة في هذه العقود دولة القاهرة ومصر أكثر منها دولة تجمع مصر والشام تحت أمر واحد.\u003c/p\u003e\u003cp class=\"ap\"\u003eولم يكن الجند في هذه السنوات جندا منتظما بالمعنى القديم: فقد كثر في الجيش مماليك الأمراء الذين يتبعون سيد البيت لا السلطان، وصار لكل أمير كبير جند يقيم به سلطته. وبهذا صارت الحروب بين الأمراء حروب مماليك خاصة، تجري في شوارع القاهرة مرات بين بيت وبيت، ويدفع ثمنها أهل الأسواق من أموالهم وأرواحهم، ويشهد حي كامل من أحياء القاهرة معركة لم يصنعها ولم يرض بها في يوم من الأيام.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم ظهر البرقوقي وغير المعادلة: كان جركسيا من مماليك يلبغا العمري، صعد في خدمة الأمراء حتى صار أستادار الدولة ثم تصدر الحكم بعد موت منافسيه. حكم أولا من خلف السلطان الصبي صلاح الدين حجي، ثم أجلس نفسه سلطانا سنة ١٣٨٢م، فكان أول من كسر قاعدة صبيان القلاونيين وأعاد إلى السلطنة هيبتها الأولى، وأخذ على الأمراء عهدا ألا يتصرفوا في دولة السلطان إلا بأمره.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سلطنته الأولى اصطدم بأمراء الشام الذين رأوا في قوته خطرا عليهم، فاجتمعوا عليه وخلعوه سنة ١٣٨٩م وأعادوا صلاح الدين حاجي، فسجن البرقوقي في الكرك ثم فر منها وعاد بمن بقي معه من المماليك، فحارب الأمراء حتى هزمهم وعاد إلى العرش سنة ١٣٩٠م، واستقر له الحكم إلى موته سنة ١٣٩٩م. وبعودته الثانية انتهى زمن سلاطين الظل وبدأ زمن سلاطين البرجية الحقيقيين.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالكرك: مدرسة السلاطين الهاربين\u003c/h4\u003e\u003cp class=\"ap\"\u003eصارت قلعة الكرك شرقي البحر الميت في هذه العقود محطة سياسية غريبة: فإما أن ينفي الأمراء سلطانا إليها فيتحصن بها ويعود بجيش، وإما أن يخرج منها أمير متمرد ليزحف على القاهرة. وقد تولى الكرك نواب أقوياء تحصنوا باستقلالهم لبعدهم عن عين القلعة، فصار ثغر الكرك في هذه السنوات شبه دولة داخل الدولة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في الكرك نفسها ما يعين على ذلك: قلعة منيعة على رأس جبل ومخازن ومياه وسكان منطقة يؤوون الخارجين على الدولة. ولهذا صارت في تاريخ هذه العقود مرادفا للعودة الثانية، كما فعل الناصر أحمد من قبل وفعل البرقوقي في هروبه الشهير الذي أعاد به سلطنته، وصار اسمها في مجالس القاهرة يذكر فيقف عنده المجلس طويلا.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eاقتصاد الدولة في زمن الفوضى\u003c/h4\u003e\u003cp class=\"ap\"\u003eتأثرت أموال الدولة في زمن حكم الأمراء تأثرا بينا: فقد كانت الإقطاعات توزع بلا حساب على أنصار الأمراء كلما تغيرت موازين القوة، وصار يقال إن الرجل يصبح أمير طبلخانة في مجلس واحد ويصبح بلا إقطاع في مجلس آخر. وبهذا اختل دفتر الجند وضاعت المعايير القديمة للترقية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد شهدت هذه العقود أيضا أول محاولات النقود النحاسية الواسعة بعد أن كان الذهب والفضة أساس التعامل، فظهرت في الأسواق فلوس نحاسية كثر الجدل حولها بين الفقهاء والتجار. وكان هذا من علامات الضائقة المالية التي صاحبت الضعف السياسي، ولم تستقم أموال الدولة إلا بعد استقرار البرقوقي في عودته الثانية.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسلطات الظل\u003c/b\u003e\u003cspan\u003eألتنبغا الناصري ثم برقوق قبل استبداده\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eعام أول سلطة للبرقوقي\u003c/b\u003e\u003cspan\u003eمن خلف صلاح الدين حجي منذ ١٣٧٧م تقريبا\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأول سلطنة له\u003c/b\u003e\u003cspan\u003eسنة ١٣٨٢م أول سلطان جركسي مستقل\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eخلعه وعودته\u003c/b\u003e\u003cspan\u003eخلع سنة ١٣٨٩م وعاد سنة ١٣٩٠م\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eدور قلعة الكرك\u003c/b\u003e\u003cspan\u003eقاعدة السلاطين المنفيين والعائدين\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالأمير\u003c/th\u003e\u003cth\u003eمنصبه\u003c/th\u003e\u003cth\u003eمصيره\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eقوصون\u003c/td\u003e\u003ctd\u003eوصي بعد موت الناصر\u003c/td\u003e\u003ctd\u003eسقط بأمراء مصر بعد أشهر من استبداده\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eيلبغا العمري\u003c/td\u003e\u003ctd\u003eأكبر أمراء عهد الناصر حسن\u003c/td\u003e\u003ctd\u003eقتل الناصر حسن ثم قتل هو أيضا\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eألتنبغا الناصري\u003c/td\u003e\u003ctd\u003eصاحب تدبير عهد المنصور علي\u003c/td\u003e\u003ctd\u003eزال بتصدر برقوق\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eبرقوق\u003c/td\u003e\u003ctd\u003eأستادار ثم سلطان\u003c/td\u003e\u003ctd\u003eثبت بعد عودته سنة ١٣٩٠م حتى موته\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eأمراء الشام\u003c/td\u003e\u003ctd\u003eنواب دمشق وحلب وصفد\u003c/td\u003e\u003ctd\u003eهزمهم برقوق في عودته الثانية\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eكان السلطان الصبي يجلس في القلعة للبيعة والخلع والزي، وصاحب الأمر يجلس في داره يقسم الجند والإقطاع، والناس يعرفون من هو السلطان بغير خطبة.\u003c/p\u003e\u003ccite\u003eمن وصف المؤرخين لزمن سلاطين الظل في القاهرة\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eبين ١٣٧٦م و١٣٩٠م حكم الأمراء مصر فعليا من خلف سلاطين صبيان لا يملكون من أمرهم شيئا، وتوزعت الدولة مراكز قوة متعددة في القاهرة والشام. ثم كسر البرقوقي هذه العصبة في سلطنتيه وأنهى زمن سلاطين الظل، ومهد لقرن البرجية.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"ahmed-and-crisis","n":"تيمور على الشام وأزمة نهاية القرن","ic":"⚖️","part":"القسم الخامس: انهيار القلاوونيين وصعود المماليك الجراكسة","h":"\u003carticle class=\"ch3\" id=\"ahmed-and-crisis\" data-toc=\"تيمور على الشام وأزمة نهاية القرن\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e5.4\u003c/span\u003e\n          \u003ch3\u003e⚖️ تيمور على الشام وأزمة نهاية القرن\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي سنة ١٤٠٠م خرج تيمورلنك من سمرقند يزحف على الشام، فكانت سنواته أعظم أزمة عرفتها دولة البرجية في قرنها الأول: سقطت حلب ودمشق وحماة في غارات متتابعة، واحترقت دمشق ونهبت، وعجز جيش مصر عن صد هذا السيل في الميدان.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان تيمور قد بنى في سمرقند إمبراطورية من الهند إلى بوابة الأناضول، وصار جاره الغربي اليلخانية في العراق والشام بعد أن ضعفوا. فلما توفي برقوق سنة ١٣٩٩م وتولى ابنه الناصر فرج وهو صبي في العاشرة، رأى تيمور فرصة فسار إلى الشام في نهاية سنة ١٤٠٠م، فأخذ حلب بالسيف وقتل وسبى، ثم تتابعت مدن الشام سقوطا مدينة بعد أخرى، ووصلت أخبار المصاب إلى القاهرة مع اللاجئين من أهل الشام في شهور قليلة.\u003c/p\u003e\u003cp class=\"ap\"\u003eخرج الناصر فرج بنفسه بجند مصر إلى دمشق ومعه كبار الأمراء، والتقى الجمعان عند برزة خارج دمشق في يناير سنة ١٤٠١م، فانكسر الجيش المصري وانسحب السلطان بأمرائه إلى مصر في ليل أنكره عليه المؤرخون. وحوصرت دمشق أياما ثم قبل أهلها الصلح بدخول بعض الأمراء، غير أن ما جرى بعد الحصار كان فاجعة: دخلت عساكر تيمور فأحرقت الجامع الأموي ونهبت المدينة وسبت أهلها، وذكر المؤرخون أن دمشق لم تر مصيبة كمصيبتها تلك منذ الحروب الصليبية.\u003c/p\u003e\u003cp class=\"ap\"\u003eولم يكن تيمور ليبقى في الشام: فقد عاد إلى العراق فأخذ بغداد سنة ١٤٠١م ثم التفت إلى الأناضول فهزم العثمانيين في أنقرة سنة ١٤٠٢م وأسر السلطان بايزيد الأول. وكان لانشغاله بالأناضول ووفاته سنة ١٤٠٥م أثر في نجات الدولة المملوكية من زحف لم يكن لها عليه قبل، فلو استمر تيمور في اتجاه مصر لكانت محنة الشام والعراق قد وصلت إلى القاهرة نفسها، ولكان تأريخ المنطقة كلها قد تغير على وجه آخر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوعانت الدولة في هذه السنوات من الداخل ما عانته من الخارج: فقد اختلف الناصر فرج وأخوه الأمير عبد العزيز وأمراء الدولة، وتنازع الشام ومصر سلطنتين شقيقتين سنوات، وساءت أخلاق السلطان الشاب حتى قتله الأمراء سنة ١٤١٢م وخلفه المستعين بالله العباسي خليفة في سلطنة صورية، ثم أخذ الأمراء السلطنة من الخليفة وأعادوها للمماليك في أيام، فعادت الدولة إلى ما ألفته من سلطنة مملوكية تجيء بالقوة لا بالوراثة ولا بالخلافة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي عقود ما بعد تيمور استعادت الدولة أنفاسها ببطء: تولى المؤيد شيخ سنة ١٤١٢م فأعاد للدولة هيبتها وضبط جندها، ثم ولده المظفر أحمد ثم الأشرف برسباي سنة ١٤٢٢م الذي فتح قبرص وضبط التجارة. وبينما أخذت دولة المماليك تلتئم من جرح تيمور، كان العثمانيون في الأناضول يلتئمون من جرحهم في أنقرة، وكل منهما يعرف أن اللقاء بينهما مسألة وقت، وأن الدولة التي تسبق إلى ترتيب بيتها هي التي تقود القرن القادم.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eحرق دمشق: الجرح الذي لم ينس\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان سقوط دمشق سنة ١٤٠١م أشهر فصول غزو تيمور، وأشدها أثرا في ذاكرة أهل الشام. فقد دخلت جيوش تيمور المدينة بعد صلح ظاهره الأمان، فكان ما كان من إحراق الجامع الأموي الذي قالت الروايات إن النار أكلت أخشابه وسقوفه المزخرفة حتى ظهرت منه حجارة عارية، وبقيت آثار الدخان في صحن الجامع سنين يراها الداخل فيقف عندها ساكنا.\u003c/p\u003e\u003cp class=\"ap\"\u003eونقلت الأخبار أن تيمور سأل علماء دمشق عن مسألة فأجابوه فلم يعجبه جوابهم، فأمر بما أمر به من العذاب والسبي. وبقيت المدينة بعد خروجه خرابا يبكيه أهلها، ورثاها الشعراء في القاهرة ودمشق، وظل أهل القرن التاسع يقيسون كل مصيبة على مصيبة دمشق عند تيمور، ويعزون بعضهم بعضا في مصائبهم بها دون سواها.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eليلة انسحاب الناصر فرج\u003c/h4\u003e\u003cp class=\"ap\"\u003eأشهر ما حفظه المؤرخون عن حرب تيمور ليلة انسحاب الناصر فرج من دمشق إلى مصر بعد معركة برزة، فقد انسحب هو وكثير من كبار الأمراء في ليلة واحدة وتركوا المدينة لأمرها، فدخلها تيمور بعدها بأيام. وأنكر أهل الشام على السلطان انسحابه إنكارا لم ينسوه له ما بقي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان لهذا الانسحاب أثر سياسي بعيد: فقد تعلم أمراء الشام أن القاهرة قد تتخلى عنهم في المحن، وظهر في الدولة ميل بعض أمرائها إلى تفاهم خاص مع تيمور لإماراتهم. وهذان الدرسان معا جعلا القرن التالي يرى الشام أكثر نفورا من سلطان القاهرة وأكثر طلبا للاستقلال في كل أزمة.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eزحف تيمور على الشام\u003c/b\u003e\u003cspan\u003eمن أواخر ١٤٠٠م إلى ١٤٠١م\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسقوط حلب ودمشق\u003c/b\u003e\u003cspan\u003e١٤٠٠م و١٤٠١م\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمعركة برزة\u003c/b\u003e\u003cspan\u003eيناير ١٤٠١م هزيمة جيش مصر\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمعركة أنقرة\u003c/b\u003e\u003cspan\u003e١٤٠٢م أسر تيمور للسلطان العثماني بايزيد\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eموت تيمور\u003c/b\u003e\u003cspan\u003eسنة ١٤٠٥م نجت معه الدولة من زحف أكبر\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمدينة\u003c/th\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eما جرى فيها\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eسيواس\u003c/td\u003e\u003ctd\u003e١٤٠٠م\u003c/td\u003e\u003ctd\u003eأول ما أخذه تيمور من بلاد الدولة في الشمال\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eحلب\u003c/td\u003e\u003ctd\u003e١٤٠٠م\u003c/td\u003e\u003ctd\u003eاقتحام وقتل وسباي ذكرها المؤرخون بالوحشة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eحماه وحماة\u003c/td\u003e\u003ctd\u003e١٤٠٠م و١٤٠١م\u003c/td\u003e\u003ctd\u003eغارات واتاوات وخراب\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eدمشق\u003c/td\u003e\u003ctd\u003e١٤٠١م\u003c/td\u003e\u003ctd\u003eحصار وصلح ثم إحراق الجامع الأموي ونهب المدينة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eبغداد\u003c/td\u003e\u003ctd\u003e١٤٠١م\u003c/td\u003e\u003ctd\u003eأخذها تيمور في طريق عودته إلى الشرق\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eدخل تيمور دمشق فنهبها وأحرق جامعها، فما بقي في المدينة جامع ولا سوق إلا وآثار الحريق فيه، وبقيت دمشق سنين تعيد بناء ما هدم.\u003c/p\u003e\u003ccite\u003eمما نقل عن مصاب دمشق سنة ١٤٠١م في كتب الحوليات\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eغزو تيمور بين ١٤٠٠م و١٤٠٢م كان أثقل ضربة خارجية على دولة البرجية: سقطت مدن الشام واحترقت دمشق وانهزم جيش مصر في برزة. ولم تنج الدولة إلا بانشغال تيمور بالأناضول ثم بموته سنة ١٤٠٥م، وبدأت بعد ذلك رحلة استعادة أنفاسها الطويلة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-6","n":"القسم السادس: البرقوقي وتيمور وبرسباي","ic":"","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-6\" style=\"--c:#0F6B5C\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🐴\u003c/div\u003e\n      \u003ch2\u003eالقسم السادس: البرقوقي وتيمور وبرسباي\u003c/h2\u003e\n      \u003cp\u003eتركز هذه الفصول في سلطانين كبيرين هما البرقوقي وبرسباي: طريق الأول إلى الحكم وبناء السلطنة الجركسية، ثم ما جرى في الشام من غزو تيمور وما تلاه من استعادة، ثم سياسة برسباي في الشمال وحكر تجارة الفلفل التي جعلت الدولة تدير التجارة العالمية بيدها. في هذا القرن تعلمت دولة البرجية أن تعيش في عالم تغير حولها من كل جهة.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#barqqu-road-to-power\"\u003eطريق البرقوقي إلى الحكم\u003c/a\u003e\u003ca href=\"#barqqu-sultanate\"\u003eسلطنة البرقوقي وترتيب البيت الجركسي\u003c/a\u003e\u003ca href=\"#timur-aftermath\"\u003eما بعد تيمور: استعادة الشام وترتيب الشمال\u003c/a\u003e\u003ca href=\"#barsbay-and-pepper\"\u003eبرسباي وحكر تجارة الفلفل\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"barqqu-road-to-power","n":"طريق البرقوقي إلى الحكم","ic":"🐎","part":"القسم السادس: البرقوقي وتيمور وبرسباي","h":"\u003carticle class=\"ch3\" id=\"barqqu-road-to-power\" data-toc=\"طريق البرقوقي إلى الحكم\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e6.1\u003c/span\u003e\n          \u003ch3\u003e🐎 طريق البرقوقي إلى الحكم\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eل\u003c/span\u003eم يجيء البرقوقي إلى الحكم بيعة هادئة ولا وراثة، بل تسلق تسلق العقود: مملوك اشتراه وأعتقه وتزوج ابنة سيدة، ثم أمير، ثم وصي على سلطان صبي، ثم سلطان خلع وأعيد. سيرته هي سيرة الدولة الجركسية كلها في رجل واحد: صعود بالمصاهرة والسيف والصبر.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eبيع البرقوقي صغيرا من بلاد الجركس ومر بمالكين حتى استقر في ملك يلبغا العمري أحد كبار أمراء القاهرة، فلما مات سيده انتقل إلى خدمة السلطان شعبان ثم إلى ابنه المنصور علي، وصعد في المناصب الكبرى حتى صار أستادار العشرة ثم أستادار الدولة، وهو منصب جعل بيده خزائن السلطان وجهازه وأمر بيته.  وكان فيما يرويه أهل التراجم أنه دخل مصر في صباه بثمن يسير، فما زال الدهر يرفعه من منزلة إلى منزلة حتى صار المالك الذي يشتري ولا يُشترى.\u003c/p\u003e\u003cp class=\"ap\"\u003eوتزوج البرقوقي في أثناء صعوده من السلطانة الخوند زينب ابنة الناصر محمد بن قلاوون، فصار بصهره هذا في عداد بيت الملك القديم، وسكن في الميدان تحت القلعة دارا من دور الأمراء الكبار. وكان له في هذه السنوات من المماليك ما ينافس به كبار البيوت، يشتري الجركس ويتربيهم في طوائفه ويعدهم ليوم يأتي، فتكاثر مماليكه حتى صاروا عصب الدولة القادمة.\u003c/p\u003e\u003cp class=\"ap\"\u003eلما مات الأشرف شعبان سنة ١٣٧٦م تولي ابنه المنصور علي صبيا وصار البرقوقي في جملة من بيده الأمر، ثم استقل بالتدبير بعد زملائه حتى كان السلطان لا يخرج إلا بأمره. وفي سنة ١٣٨١م خلع المنصور علي وولى أخاه الصلاح حاجي وهو أصغر منه، فأدرك الأمراء أنه إنما يصنع سلطانا بعد سلطان ليبقي الأمر في يده، فتنادوا على خلعه.  فاجتمع كبار الأمراء في القلعة وكاتبوا الشام، وكان الرجل منهم يقول: لا سلطان اليوم إلا ما رضيه جماعة الأمراء.\u003c/p\u003e\u003cp class=\"ap\"\u003eاجتمع عليه كبار أمراء الشام ومصر سنة ١٣٨٢م فخلعوه وسجنوه، وأجلسوا الصلاح حاجي سلطانا مستقلا، غير أن مماليك البرقوقي وجماعة من الجند لم يهدأوا، ودارت بين الفريقين حروب انتهت بأن خرج البرقوقي من سجنه وعاد إلى العرش سنة ١٣٩٠م. ولما استقر له الأمر ثانيًا قتل من نازعه من كبار الأمراء وشردهم، وأخذ مماليكهم فضمهم إلى بيته، فصار أكبر بيت في الدولة بيت السلطان نفسه لا بيت أمير من الأمراء.\u003c/p\u003e\u003cp class=\"ap\"\u003eولم يكن البرقوقي ممن ينسى درس غدر الأمراء به، فأعاد تنظيم الجند على مماليكه البرجية في القلعة، وباعد بين مناصب الشام الكبرى وأصحابها القادرين على التمرد، وضبط الإقطاعات بيد دواوينه. وبقي يحكم إلى موته سنة ١٣٩٩م وقد ترك لابنه فرج دولة مستقرة السلطنة مضطربة الأمراء، هي أقوى من السلطنات الصبيانية التي سبقتها بمراحل.  وبقي في القاهرة من ذلك الزمن مثل يقولونه في الرجل الصبور: صبر البرقوقي في الكرك.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eزواجه من بيت قلاوون\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان زواج البرقوقي من الخوند زينب بنت الناصر محمد ضربة سياسية ذكية، فقد جعل الرجل الجركسي الغريب صهرا لبيت حكم مصر قرنا. وصار بذلك يخطب له في المسجد الحرام ومساجد القاهرة بصفة تصل نسبه بأشرف بيوت الدولة، وسكت كثير ممن كانوا يقولون إنه دخيل على الملك لا حق له فيه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد علم من جاء بعد البرقوقي من سلاطين البرجية هذا الدرس، فأكثروا من مصاهرة بيوت الأمراء القديمة والتمسك بألقاب بيوت قلاوون وبيبرس في الخطبة والمراسلات. فصارت الشرعية في دولة المماليك تُصنع بشيئين: قوة المماليك في اليد، ونسب قديم في الخطبة.  وصارت الأنساب والقرابات في دولة المماليك لغة شرعية تكتب في الخطب والمراسلات إلى جانب لغة السيف.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eسنوات السجن والعودة\u003c/h4\u003e\u003cp class=\"ap\"\u003eحين خلعه الأمراء أول مرة سجن البرقوقي في قلعة الكرك البعيدة، وهي السجن الذي عاد منه كثيرون في تاريخ الدولة. فأقام في سجنه يكاتب مماليكه وجنوده في القاهرة والشام حتى أدركوا أن سيدهم لن يخرج إلا بقوة، فتحركوا في سبيله.  فصار سجن الكرك في ألسنة الناس مرادفا للأمل البعيد، يقول القائل: لا تيأس فإن صاحب الكرك قد يعود.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في عودته سنة ١٣٨٩م وما بعدها من الحروب ما شهدته مصر والشام من تنقل الجيوش بين دمشق والقاهرة مرات في سنوات قليلة. ولما استقر آخر الأمر للبرقوقي صار عوده إلى العرش مثالا يذكره المؤرخون في الصبر على الملك والعمل له في أضعف الأحوال.  وذكر المؤرخون هذه العودة في طليعة ما يحكونه من صبر الملوك على نوائب الدهر في تاريخ الإسلام.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأصله\u003c/b\u003e\u003cspan\u003eجركسي اشتراه يلبغا العمري واعتقه\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eزواجه\u003c/b\u003e\u003cspan\u003eمن الخوند زينب بنت الناصر محمد\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأول سلطنة\u003c/b\u003e\u003cspan\u003eسنة ١٣٨٢م بعد خلع الصلاح حاجي\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eخلعه وعودته\u003c/b\u003e\u003cspan\u003e١٣٨٩م خلع وعاد ١٣٩٠م\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eموته\u003c/b\u003e\u003cspan\u003eسنة ١٣٩٩م وخلفه ابنه الناصر فرج\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمنصب\u003c/th\u003e\u003cth\u003eالفترة\u003c/th\u003e\u003cth\u003eملاحظة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eمملوك يلبغا العمري\u003c/td\u003e\u003ctd\u003eشبابه\u003c/td\u003e\u003ctd\u003eتربى في بيوت كبار الأمراء\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eأستادار الدولة\u003c/td\u003e\u003ctd\u003eسبعينيات القرن الرابع عشر\u003c/td\u003e\u003ctd\u003eيد بيده على خزائن السلطان\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eوصي السلطنة\u003c/td\u003e\u003ctd\u003eمن ١٣٧٧م تقريبا\u003c/td\u003e\u003ctd\u003eالحكم الفعلي خلف سلاطين صبيان\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eسلطان أول\u003c/td\u003e\u003ctd\u003e١٣٨٢م إلى ١٣٨٩م\u003c/td\u003e\u003ctd\u003eخلعه أمراء الشام ومصر\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eسلطان ثان\u003c/td\u003e\u003ctd\u003e١٣٩٠م إلى ١٣٩٩م\u003c/td\u003e\u003ctd\u003eاستقر حتى موته\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eكان البرقوقي إذا جلس في إيوانه رؤي عليه سلطنة الملوك، وإذا ركب في حربه رؤي عليه بأس الأمراء، جمع إلى ملكه عقلا صبورا على ما لا يصبر عليه الملوك.\u003c/p\u003e\u003ccite\u003eمن تراجم البرقوقي في كتب الحوليات\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eالبرقوقي صعد من ذل الرقيق إلى عرش مصر بالمصاهرة والتنظيم والصبر، وثبت بعد خلعه وعاد سنة ١٣٩٠م ليؤسس سلطنة البرجية الحقيقية. وحين مات سنة ١٣٩٩م كانت السلطنة في بيت جركسي واحد لا في يد أمراء يتقاسمونها.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"barqqu-sultanate","n":"سلطنة البرقوقي وترتيب البيت الجركسي","ic":"🏛️","part":"القسم السادس: البرقوقي وتيمور وبرسباي","h":"\u003carticle class=\"ch3\" id=\"barqqu-sultanate\" data-toc=\"سلطنة البرقوقي وترتيب البيت الجركسي\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e6.2\u003c/span\u003e\n          \u003ch3\u003e🏛️ سلطنة البرقوقي وترتيب البيت الجركسي\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eل\u003c/span\u003eم تكن سلطنة البرقوقي استراحة بعد سنوات الفوضى فحسب، بل كانت إعادة بناء لجهاز الدولة على أساس جديد: سلطان له مماليكه في أبراج القلعة، ودواوين تعود إلى الدفاتر القديمة، ومدارس ومآثر عمرانية تثبت للقاهرة أن سلطانا جديدا جلس على العرش.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eبعد عودته الثانية سنة ١٣٩٠م قضى البرقوقي سنته الأولى في تصفية خصومه من كبار الأمراء، فقتل منهم طائفة ونفى طائفة وصادر أموال بيوت كاملة فضمها إلى بيت المال. وكان في هذا القسوة ما فيه، غير أنه كسر به ما بقي من عصبية الأمراء التي مزقت الدولة في عقود سلاطين الظل، وصار الأمر في القلعة لواحد لا لجماعة.  وصار الأمراء بعدها يعرفون أن اللعب بالعرش صار مكلفا لمن يمد يده إليه دون سلطان يسانده.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم أعاد البرقوقي إلى الدواوين شيءئا من نظامها القديم: فعرض الجند في مواسمهم وأقر الأعطيات في مواعيدها، وتتبع الإقطاعات الممنوحة في سنوات الفوضى بلا حق فسحب ما ثبت سحبه، وأعاد إلى خزانة السلطان واردات كانت استحوذ عليها الأمراء. وضرب نقودا جديدة أصلح بها ما فسد من التعامل في سنوات الفضة القليلة.  وعاد أهل الدواوين يقولون: رجعت الدفاتر إلى يد من يقرؤها، بعد سنوات كان السلطان فيها اسما في أول السجل لا صاحب قرار.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي الشام أعاد البرقوقي هيبة القاهرة: عين في دمشق وحلب نوابا من خواصه مماليكه، وخرج بنفسه إلى الثغور الشمالية مرات لضبط التركمان والحفاظ على حمص وحماة، وراسل اليلخانية والقبيلة الذهبية في الشمال. وعقد مع اليلخانات صلحا حفظ للشام سنين من الغارات، حتى كانت سنة تيمور الكبرى بعد موته.  وصار أمراء الشام إذا قعد أحدهم عن طاعة القلعة كتب إليه السلطان كتابا واحدا يكفي، لأنهم عرفوا أن وراء الكتاب جيشا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي القاهرة بنى البرقوقي جامعا ومدرسة ومقبرة له في الصحراء خارج باب النصر عرفت بمجموعة الخانقاه البرقوقية، وهي أولى عمائر سلاطين البرجية الكبرى، وفيها صحن واسع ومآذن ومكتب لتحفيظ القرآن. وكان في بنائها في مكان المقبرة الشمالية إعلان بأن دولة البرجية جاءت لتبقى، فصارت المنطقة بعد ذلك حي العمائر المملوكية الشمالية.  وما زالت منارته ومئذنتاه شاخصتين في مقبرة الصحراء إلى اليوم، يشاهدان الناس على عظمة أول سلاطين البرجية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي أواخر سلطنته ظهر خطر تيمور في الشرق فاستعد له البرقوقي استعدادا جادا: جمع العدة وضبط الثغور وكاتب ملوك الأطراف، وحين بلغه زحف تيمور على سيواس سنة ١٤٠٠م خرج بنفسه على رأس الجيش وإن كان قد مرض في طريقه. ومات البرقوقي في فبراير سنة ١٣٩٩م قبل اللقاء الكبير، فكان كمن سبق المحن بقليل وتركها لمن بعده.  وما أدركته عيناه من صد تيمور أكمله من بعده جيشه ورجاله، فكان آخر عهده استعدادا مستمرا لا ركونا إلى راحة.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eمجموعة الخانقاه البرقوقية\u003c/h4\u003e\u003cp class=\"ap\"\u003eبنى البرقوقي له ولأولاده مجمعا في الصحراء عند باب النصر يضم مسجدا وخانقاه للصوفية ومقبرة، ونقل إليه رفات أمه وأولاده، وجعل له أوقافا تجري على من فيه من فقراء الصوفية وطلبة العلم. وهذا المجموع من أجمل ما بقي من عمارة الدولة البرجية في القاهرة إلى اليوم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في اختيار المكان في الصحراء النائية علامة: فالسلطانات الأحياء قبله بنوا في وسط المدينة، أما البرجية فبنوا مقابرهم في الصحراء الشمالية مع بداية دولتهم. وبعد البرقوقي تتابع سلاطين البرجية في البناء هناك حتى صارت المنطقة أكبر تجمع لعمائرهم في القاهرة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eعلاقته بالخلفاء والعلماء\u003c/h4\u003e\u003cp class=\"ap\"\u003eأقر البرقوقي الخلفاء العباسيين في القاهرة على حالهم من البيعة والتشريف، وكان يظهر في المواسم مع الخليفة إظهار السلطان المتدين، ويقري العلماء ويحضر مجالسهم. وبذلك واصل سلاطين البرجية استخدام الخلافة الاسمية سندا للسلطنة كما فعل من قبلهم.  وبقيت الخلافة العباسية في القاهرة طوال دولة البرجية صفا من صفات الشرعية يفخر به كل سلطان جديد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أشاد الفقهاء والصوفية بالبرقوقي لإنشائه الخانقاه وإكرامه أهلها، فكان للسلطان في أوساط العلم والتصوف رصيد من المجاملات يستفيد منه بيته من بعده. وهكذا جمع البرقوقي إلى سيفه وعمرانه شيئا من رصيد الشرع في المدينة.  وصار لهذا الرصيد أثر حقيقي في استقرار دولته ودولة من جاء بعده من أهل بيته وسلاطين البرجية.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمدة الحكم الفعلي\u003c/b\u003e\u003cspan\u003eنحو عشرين سنة بين وصاية وسلطنتين\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eجامعه\u003c/b\u003e\u003cspan\u003eالخانقاه البرقوقية في الصحراء عند باب النصر\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eنواب الشام\u003c/b\u003e\u003cspan\u003eعيّن خواصه في دمشق وحلب لضبط الثغور\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eصلحه مع اليلخانات\u003c/b\u003e\u003cspan\u003eأراح الشام من الغارات سنين\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eآخر أعماله\u003c/b\u003e\u003cspan\u003eالاستعداد لصد تيمور والخروج على رأس الجيش\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالجانب\u003c/th\u003e\u003cth\u003eما فعله البرقوقي\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالجند\u003c/td\u003e\u003ctd\u003eعرض الجند وضبط الأعطيات\u003c/td\u003e\u003ctd\u003eاستعادة الثقة بين السلطان والمقاتلين\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالإقطاع\u003c/td\u003e\u003ctd\u003eسحب إقطاعات سنوات الفوضى\u003c/td\u003e\u003ctd\u003eعودة الأرض لدفاتر الدولة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالشام\u003c/td\u003e\u003ctd\u003eنواب من المماليك السلطانية\u003c/td\u003e\u003ctd\u003eضبط أكبر إقليم في الدولة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالعمارة\u003c/td\u003e\u003ctd\u003eمجموعة الخانقاه في الصحراء\u003c/td\u003e\u003ctd\u003eأول وأجمل عمائر الدولة البرجية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالخارج\u003c/td\u003e\u003ctd\u003eصلح مع اليلخانات ومراسلة الأطراف\u003c/td\u003e\u003ctd\u003eهدوء الجبهة الشمالية سنين\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eجلس البرقوقي على سرير الملك وقد قتل الأمراء المردة وفرق جماعتهم، فاستراحت الدولة من تنازعهم وصارت الكلمة له من فوق قلعة الجبل.\u003c/p\u003e\u003ccite\u003eمن خبر عودة البرقوقي في كتب الحوليات\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eسلطنة البرقوقي أعادت للدولة وحدتها بعد عقود من حكم الأمراء: تصفية البيوت المتمردة، وضبط الدواوين والإقطاعات، وعمائر تثبت الشرعية. ومات وهو يستعد لصد تيمور، فترك لابنه فرج أثقل مهمة في تاريخ الدولة البرجية.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"timur-aftermath","n":"ما بعد تيمور: استعادة الشام وترتيب الشمال","ic":"🐪","part":"القسم السادس: البرقوقي وتيمور وبرسباي","h":"\u003carticle class=\"ch3\" id=\"timur-aftermath\" data-toc=\"ما بعد تيمور: استعادة الشام وترتيب الشمال\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e6.3\u003c/span\u003e\n          \u003ch3\u003e🐪 ما بعد تيمور: استعادة الشام وترتيب الشمال\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eب\u003c/span\u003eعد أن انصرف تيمور عن الشام إلى الأناضول ومات سنة ١٤٠٥م، وجدت الدولة المملوكية نفسها أمام مهمة مزدوجة: إعادة بناء ما حرقته جيوشه في الشام، وترتيب علاقة جديدة مع قوة تيمورية جلست في العراق والأناضول لم يعد معها جار من قبل.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eخرج تيمور من الشام سنة ١٤٠١م بعد مصاب دمشق، وعادت مدن الشام إلى طاعة القاهرة تدريجيا بعد أن ولي عليها الأمراء من جديد. غير أن سنوات الناصر فرج التي تلت كانت سنوات نزاع داخلي بين السلطان وأخيه وأمرائه، فتأخر إصلاح الشام، ومرت حلب وحماه ودمشق بسنوات ضعف في العمران والخراج.  ومرت على دمشق وحلب سنوات ثقيلة على أهلها قبل أن تستقر الأمور وتعود أسواقها تعمل كما كانت.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم جاءت وفاة تيمور سنة ١٤٠٥م فتغيرت خريطة الشرق كله: فقد انقسم ورثته بين سمرقند وبلاد فارس والعراق، وجلست في العراق وأذربيجان دولة التركمان قرة قويونلو ثم آق قويونلو من بعدهم. وصارت حدود الدولة المملوكية الشمالية الشرقية تجاور هاتين القوتين التركمانيتين لا اليلخانات القدامى، فتغيرت السياسة كلها.  وصارت السياسة المملوكية في الشمال قراءة لهذه الخريطة الجديدة، تراقب كل تغيير في العراق وأذربيجان وترتب عليه أمر ثغورها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي الأناضول عاد العثمانيون بعد مصابتهم في أنقرة سنة ١٤٠٢م إلى حرب أهلية بين أبناء بايزيد، فسارعت الدولة المملوكية إلى ضبط ما جاورها من جنوب الأناضول: أعادت التركمان دويلة ذي القدر إلى طاعتها، وثبتت ولاية ألبستان وملطية على يدها، وصارت هذه الدويلة الصغيرة منطقة عازلة بينها وبين العثمانيين قرنين.  فكانت إدارة الأناضول في القرن التاسع لعبة موازنات دقيقة بين القاهرة وأمراء التركمان والأمراء العثمانيين الناهضين.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي عهد المؤيد شيخ الذي تولى سنة ١٤١٢م بعد مقتل الناصر فرج استعادت الدولة زمامها: ضبط المؤيد جنده وأمراءه وخرج إلى الشام فأعاد هيبة القاهرة في دمشق وحلب، وعقد مع شاه رخ بن تيمور صلحا ومهادنة بقيت سنين، فكانت رسائل التكريم تتبادل بين القاهرة وهرات. وباستقرار الشام استأنفت دواوينها عملها في الخراج والجند كما كانت قبل الغزو.  وكان المؤيد يخرج بنفسه إلى الشام ويجلس في دمشق شهورا يصلح ما أفسدته سنوات الاضطراب حتى استقامت الثغور.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد تعلمت الدولة من محنة تيمور درسا بقي معها: أن أمن الشام من الشمال يبدأ من علاقة الحكمة مع جيرانها الأقوياء لا من الحرب الدائمة معهم. فمن المؤيد شيخ إلى برسباي إلى قايتباي صارت سياسة الشمال مزيجا من الحرب مع التركمان حيث يلزم والصلح مع القوى الكبرى حيث يمكن، وهذه السياسة هي التي حفظت للدولة قرنها الأخير من الازدهار.  وهذا هو الفرق بين دولة تقرأ جيرانها ودولة تقاتل كل جيرانها: الأولى تعمر قرنا، والثانية تنفد قوتها في عشرين سنة.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eشاه رخ والصلح مع الشرق\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان شاه رخ بن تيمور قد ورث من أبيه مقاليد خراسان وما وراء النهر ثم بسط يده على فارس والعراق بعد سنين، وكان رجلا يميل إلى العلم والصلح أكثر مما يميل إلى غزو أبيه. فبادره سلاطين مصر بالرسائل والهدايا، وأجاب إلى مهادنة بقيت عشرات السنين.  وكانت رسائله تحمل مع التحف أسماء الملوك بأوصاف مجاملة دقيقة تعرف بها مقادير الدول في حق بعضها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت هذه المهادنة تبادل مصالح حقيقية: فحجاج الشام ومصر يمر بأرضه في أمان، وتجارة الشرق من حرير وتوابل تصل موانئ مصر في حماية سلطانه، وفي المقابل يعترف شاه رخ بولاية القاهرة على مكة والمدينة. فصارت العلاقة بين القاهرة وهرات أهدأ حدود الدولة على الإطلاق في القرن التاسع.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eدويلة ذي القدر: الحاجز الذكي\u003c/h4\u003e\u003cp class=\"ap\"\u003eأنشأت الدولة المملوكية في جنوب الأناضول علاقة خاصة مع دويلة ذي القدر التركمانية التي ملكت ألبستان وملطية، فكان أميرها يتولى بحكم المماليك ويحمي حدودها من التوسع العثماني من الشمال. وصارت هذه الدويلة أهم قلعة دبلوماسية في يد القاهرة قرنين كاملين.  فكان أميرها يقعد على كرسيه من جهة سلطان القاهرة، وينصر القاهرة حيث لا تستطيع جيوشها أن تقيم دائما.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد برزت قيمة هذا الحاجز حين قوي العثمانيون: فكانت حروب المماليك معهم تجر في الغالب في منطقة ذي القدر أو حولها، ولم يصل جيش عثماني إلى حلب إلا في القرن السادس عشر بعد أن سقط الحاجز نفسه. وهكذا أنقذت دويلة صغيرة مهمة دولة كبيرة تأخير سقوطها عقودا.  فمن حفظ ذا القدر حفظ باب مصر الشمالي، ومن ضيعه فتح الطريق لمن وراءه من كبار الأمم.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eموت تيمور\u003c/b\u003e\u003cspan\u003eسنة ١٤٠٥م انفراط عقد إمبراطوريته\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالورثة في الغرب\u003c/b\u003e\u003cspan\u003eدول التركمان قرة قويونلو وآق قويونلو\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eصلح شاه رخ\u003c/b\u003e\u003cspan\u003eمن أيام المؤيد شيخ وبقي سنين\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eدويلة ذي القدر\u003c/b\u003e\u003cspan\u003eحاجز المماليك في جنوب الأناضول\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمؤيد شيخ\u003c/b\u003e\u003cspan\u003eاستعاد هيبة القاهرة في الشام بعد ١٤١٢م\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالجار\u003c/th\u003e\u003cth\u003eطبيعة العلاقة\u003c/th\u003e\u003cth\u003eأثرها على الدولة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eشاه رخ والتيموريون\u003c/td\u003e\u003ctd\u003eصلح ورسائل وتجارة\u003c/td\u003e\u003ctd\u003eأمن الحدود الشرقية سنين طويلة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eقرة قويونلو\u003c/td\u003e\u003ctd\u003eحروب وهدن متقطعة\u003c/td\u003e\u003ctd\u003eجبهة الشمال الشرقي في عهد برسباي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eآق قويونلو\u003c/td\u003e\u003ctd\u003eمنافسة ثم صلح مع أوزون حسن\u003c/td\u003e\u003ctd\u003eأهم قضايا عهد قايتباي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eدويلة ذي القدر\u003c/td\u003e\u003ctd\u003eولاية بحكم القاهرة\u003c/td\u003e\u003ctd\u003eحاجز أمام التوسع العثماني\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالعثمانيون بعد أنقرة\u003c/td\u003e\u003ctd\u003eعودة بطيئة بعد الحرب الأهلية\u003c/td\u003e\u003ctd\u003eقرن من الترقب قبل اللقاء الكبير\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eجرت الرسل بين القاهرة وهرات بالهدايا والكتب، فأمن الطريق وتاجر الناس في أرض التيموريين والمماليك بلا خوف، وصار الحجاج يمرون بأمان لم يعرفوه زمان تيمور.\u003c/p\u003e\u003ccite\u003eمن وصف العلاقة مع شاه رخ في كتب الحوليات\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eبعد موت تيمور سنة ١٤٠٥م أعادت الدولة بناء الشام وترتيب شمالها بذكاء: صلح مع شاه رخ، وحاجز تركماني في الأناضول، وسياسة موازنة بين القوى. هذه السياسة التي رسخها المؤيد شيخ هي التي أتاحت للدولة قرن ازدهار أخير تحت برسباي وقايتباي.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"barsbay-and-pepper","n":"برسباي وحكر تجارة الفلفل","ic":"⚖️","part":"القسم السادس: البرقوقي وتيمور وبرسباي","h":"\u003carticle class=\"ch3\" id=\"barsbay-and-pepper\" data-toc=\"برسباي وحكر تجارة الفلفل\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e6.4\u003c/span\u003e\n          \u003ch3\u003e⚖️ برسباي وحكر تجارة الفلفل\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eب\u003c/span\u003eرسباي ليس أشهر سلاطين البرجية محاربة بل أشهرهم إدارة للمال: رأى أن تجارة التوابل بين الشرق وأوروبا تمر بموانئه فارتبها، فحصر بيع الفلفل وغيره في خزانة السلطان، وصارت الدولة تاجر الأمة الأكبر. وأما حروبه فكانت في قبرص وبلاد التركمان، وفيها ثبتت هيبة الدولة.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eالأشرف سيف الدين برسباي كان من مماليك البرقوقي، تولى السلطنة سنة ١٤٢٢م بعد وفاة أخيه غير الشقيق المؤيد شيخ وما تلاها من صراع على العرش، وحكم إلى موته سنة ١٤٣٨م. وكان رجلا حازما ميالا إلى تدبير المال بنفسه، يقرأ دفاتر الدواوين ويسأل عن تفاصيل الأسواق، فكان في هذا على عكس كثير من سلاطين البرجية.  وكان مع حزمه شديد المحافظة على مظاهر السلطنة، يقعد للناس في المواعيد المعلومة ويسمع شكاوى الخاص والعام.\u003c/p\u003e\u003cp class=\"ap\"\u003eأول ما اشتهر به برسباي أمره في قبرص: فقد كانت مملكة قبرص الفرنجة قد صارت في تلك السنوات مملكة فقيرة يحكمها لوزينيان ويشجع قراصنتها على مهاجمة سفن المسلمين. فخرج إليها برسباي بحملتين سنتي ١٤٢٤م و١٤٢٥م ثم بحملة كبرى سنة ١٤٢٦م نزل فيها جيش مصر في الجزيرة وأخذ ليماسول، ثم هزم ملكها جانوس وأسره وأتى به إلى القاهرة، فطيف بها ورجعت الجزيرة تدفع الجزية للدولة وتعترف بسيادتها.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم فعل برسباي في الاقتصاد ما لم يفعله سلطان قبله بهذا الاتساع: حصر شراء الفلفل وغيره من التوابل من التجار الواردين بالإسكندرية في يد خزانته، ثم باعه للتجار الأوروبيين من البندقية وغيرهم بالسعر الذي يحدده. وصار السلطان يتاجر بالفلفل والسكر والمؤن والصابون، وضرب على هذه المتع أحكاما مفصلة تنظم المشتري والبائع والموازين والسفن.  وصار في القاهرة موظفون ودفاتر كل عملهم تنظيم تجارة السلطان، وهو شيء لم تعرفه مصر من قبل بهذا الاتساع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان أثر هذا الحصر مزدوجا: فقد دخل على خزانة السلطان مال كثير مكن برسباي من العمران والجند وأنعم على القاهرة بأسواق عامرة، وفي المق الوقت شكا تجار مصر من إخراجهم من أعظم تجارات العصر، وشكا الأوروبيون من الأسعار، وبدأ البحث عن طريق آخر للتوابل يتجنب موانئ مصر، وهو البحث الذي انتهى بعد نصف قرن برحلة فاسكو دي جاما.  وقد أحس تجار البندقية في رسائلهم إلى بلادهم أنهم صاروا يشترون من خزانة سلطان لا من سوق حرة، فكتبوا في ذلك شكاوى كثيرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي الشمال حارب برسباي التركمان قرة قويونلو في حروب طويلة: خرج بنفسه إلى الشام مرات، وأرسل الجيوش إلى بلاد ألبستان وعينتاب، ودافع عن حلب وثغورها. ولم تحسم هذه الحروب الجبهة حسما نهائيا، لكنها أبقت المبادرة بيد القاهرة ومنعت قرة قويونلو من التوسع جنوبا في سنوات كانت فيها قوية.  ودامت هذه الجبهة قرونا مشتعلة تهدأ موسما وتشب موسما، وكانت من أهم ميادين تجربة جند مصر في القرن التاسع.\u003c/p\u003e\u003cp class=\"ap\"\u003eولما مات برسباي سنة ١٤٣٨م خلفه ابنه الصغير العزيز يوسف ثم سرعان ما قامت مكيدة رآها كبار المماليك فخلعوه وأجلسوا جقمق أحد كبار أمراء الدولة، فعادت سيرة انتقال العرش بين كبار المماليك بعد أن حاول برسباي أن يجعلها في ولده. غير أن ما تركه من نظام تجاري وجيش منظم بقي أساس دولة قايتباي من بعده.  وعادت الدولة إلى نظامها القديم في انتقال العرش إلى أكبر المماليك الأحياء، لا إلى ابن السلطان مهما كان.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eفتح قبرص سنة ١٤٢٦م\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت حملة قبرص الكبرى سنة ١٤٢٦م من أنجح حملات الدولة البرجية: فقد عبر الأسطول المصري ومعه جيش بقيادة أمراء كبار، ونزل في ليماسول فأخذها، ثم التقى جيش الملك جانوس فهزمه وأسره في الميدان. وأتي بالملك الأسير إلى القاهرة فسار به في موكب أثار دهشة الناس.  وكان نزول الجيش في الجزيرة والعودة بالملك الأسير من أعجب ما رأى أهل القاهرة في ذلك القرن.\u003c/p\u003e\u003cp class=\"ap\"\u003eودفع جانوس فدية كبيرة وأطلق بشرط الجزية والطاعة، وصارت قبرص من بعد تحمل الجزية للقاهرة سنين. وكان لهذا النصر أثر في نفسية الدولة عظيم: فبعد سنوات الدفاع عن الشام عادت مصر تضرب في البحر وتأسر ملكا نصرانيا، فاستعادت هيبتها القديمة في قلوب أهل الشام وأهل أوروبا معا.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eكيف أدار السلطان تجارة الأمة\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يكن حكر برسباي مرسوما واحدا بل نظاما كاملا: فالوكيل يشتري البضاعة من سفن الشرق عند وصولها الإسكندرية بسعر يحدده، ثم يخزنها في دور السلطان، ثم يبيعها لتجار البندقية والكتالان والفلورنسيين في مواسم بأسعار تعلن. وكان لكل جالية أوروبية وكيل وشروط وامتيازات مكتوبة في وثائق.\u003c/p\u003e\u003cp class=\"ap\"\u003eونظر التجار المصريون إلى هذا النظام بعين الغبن، لأن السلطان صار منافسا لهم في أعظم سلع العصر. غير أن الملاحظ في تاريخ الاقتصاد أن هذا الحكر أغنى خزينة الدولة في زمن كانت فيه الضرائب الزراعية قد قلت، فكان مما مول عمائر وجيوش النصف الأول من القرن التاسع.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسلطنته\u003c/b\u003e\u003cspan\u003eمن ١٤٢٢م إلى ١٤٣٨م\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eفتح قبرص\u003c/b\u003e\u003cspan\u003eسنة ١٤٢٦م وأسر الملك جانوس\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eحكر التوابل\u003c/b\u003e\u003cspan\u003eحصر شراء الفلفل في خزانة السلطان\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eحروب الشمال\u003c/b\u003e\u003cspan\u003eضد قرة قويونلو في ألبستان وعينتاب\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eخلفه\u003c/b\u003e\u003cspan\u003eابنه العزيز يوسف ثم الملك جقمق\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالبضاعة\u003c/th\u003e\u003cth\u003eمصدرها\u003c/th\u003e\u003cth\u003eطريقة تصرف الدولة فيها\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالفلفل\u003c/td\u003e\u003ctd\u003eالهند عبر البحر الأحمر\u003c/td\u003e\u003ctd\u003eحصر شرائها وبيعها للأوروبيين بسعر معلن\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالسكر\u003c/td\u003e\u003ctd\u003eمصارع مصر الشامية\u003c/td\u003e\u003ctd\u003eشراء من المنتجين وبيع في موانئ التصدير\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالصابون والمؤن\u003c/td\u003e\u003ctd\u003eمصانع الشام ومصر\u003c/td\u003e\u003ctd\u003eتنظيم بيعها في أسواق التصدير\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالحرير\u003c/td\u003e\u003ctd\u003eبلاد فارس عبر الشام\u003c/td\u003e\u003ctd\u003eجمارك ورسوم ومراقبة المرور\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالأخشاب والحديد\u003c/td\u003e\u003ctd\u003eواردات أوروبا\u003c/td\u003e\u003ctd\u003eتنظيم دخولها لخدمة الأسطول والترسانة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eاشترى السلطان الفلفل كله من التجار الواردين، ثم قعد للبنادقة وغيرهم يبيعهم منه بما يراه، فكثر مال الخزانة وعظم شأن الدولة في الأسواق.\u003c/p\u003e\u003ccite\u003eمن وصف احتكار برسباي في كتب الحوليات الاقتصادية\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eبرسباي أعاد للدولة هيبتها في البحر بفتح قبرص سنة ١٤٢٦م، وبنى ثروتها بحكر تجارة التوابل في يد خزانته. سياسته المالية أغنت الدولة زمانها، لكنها دفعت أوروبا إلى البحث عن طريق آخر للشرق، وهو البحث الذي أثمر بعد نصف قرن طريق رأس الرجاء.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-7","n":"القسم السابع: السلطان قايتباي","ic":"","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-7\" style=\"--c:#0F6B5C\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🦅\u003c/div\u003e\n      \u003ch2\u003eالقسم السابع: السلطان قايتباي\u003c/h2\u003e\n      \u003cp\u003eيمثل قايتباي ذروة الدولة المماليكية في عمرها: سلطنة امتدت نحو خمسة وعشرين سنة، وفيها ازدهرت العمارة والعلوم، وبلغت مصر أوج حضورها في الشام والأناضول، والتقت أوّلًا مع الدولة العثمانية الناشئة على حدودها.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#qaytbay-the-sultan\"\u003eقايتباي: صعود السلطان\u003c/a\u003e\u003ca href=\"#qaytbay-culture\"\u003eالعلم والثقافة في عهد قايتباي\u003c/a\u003e\u003ca href=\"#qaytbay-architecture\"\u003eعمارة قايتباي في القاهرة\u003c/a\u003e\u003ca href=\"#qaytbay-and-ottomans\"\u003eقايتباي والمواجهة مع العثمانيين\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"qaytbay-the-sultan","n":"قايتباي: صعود السلطان","ic":"🦅","part":"القسم السابع: السلطان قايتباي","h":"\u003carticle class=\"ch3\" id=\"qaytbay-the-sultan\" data-toc=\"قايتباي: صعود السلطان\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e7.1\u003c/span\u003e\n          \u003ch3\u003e🦅 قايتباي: صعود السلطان\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eل\u003c/span\u003eم يبلغ قايتباي العرش بوراثة ولا بوصية، بل بترقٍّ بطيء في بيوت الجند امتد أربعين سنة. وحين جلس على العرش سنة ١٤٦٨م كان رجلًا جاوز الخمسين، يعرف كل درجة في سلم الدولة لأنه صعدها بقدميه.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eوُلد قايتباي في بلاد الجركس شمال البحر الأسود في نحو سنة ١٤١٦م، في القبائل التي كان تجار الرقيق يخرجون منها الغلمان إلى أسواق الشام ومصر. اشتراه تاجر من تجار الملوك وأتى به إلى القاهرة، فدخل في مماليك السلطان برسباي وأُعتق على يده، وصار في جند الدولة من الجركس لا من الأتراك ولا من أبناء الناس. ولم يكن له نسب يُشفع له ولا بيت يحميه، وكان هذا في حدّ ذاته أول ما يحتاج إلى تعويضه بالخدمة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوترقّى في الطوائف درجةً درجة، فخدم في أيام جقمق ثم إينال ثم خوشقدم، ومرّ في كل سلطنة بامتحان جديد: من يخدم سلطانًا ويُعفي من خدمة الذي بعده يُنسى، ومن يخدم الجميع يبقى. وقد بقي، لأن ما كان يُحسن تقديمه لم يكن المال ولا النسب بل الانضباط في الحملات والثبات في الأزمات، وهي خصال كان خوشقدم يحتاجها في سنواته الأخيرة أكثر مما يحتاج الشجاعة في الميدان.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سنة ١٤٦٧م مات خوشقدم، فدخلت الدولة في سلسلة بيعات سريعة: سُلطن يلباي ثم خُلع، ثم سُلطن تمر بغا، ثم تنازل عن العرش في أوائل سنة ١٤٦٨م بعد أسابيع من الفوضى. وحين اجتمع الأمراء لاختيار سلطان جديد لم يكن أمامهم رجل يستطيع أن يفرض نفسه على الباقين، فاختاروا أقواهم في الجند وأكثرهم معرفة بالدواوين، وكان ذلك قايتباي. وبُويع في آخر يناير سنة ١٤٦٨م، فبدأت أطول سلطنة في المرحلة الأخيرة من عمر الدولة.\u003c/p\u003e\u003cp class=\"ap\"\u003eولم تكن بيعته نهاية الخلاف بل بدايته. فمن كبار الأمراء من رفض في المجلس الأول، ومنهم من بايع وهو ينتظر الفرصة، وكان في القلعة من يرى نفسه أحق بالعرش لأنه أقدم أو أقرب إلى بيت السلطان السابق. فلم يبدأ قايتباي حكمه بالسيف، بل بالصبر والمال والمصاهرة: ثبّت الأمراء في إقطاعاتهم، وأقرّ كثيرًا منهم في مناصبهم، وزوّج بعضهم من بيته، حتى صار الخلاف خلافًا صامتًا لا يُعلن، وهذا أقصى ما يمكن أن يطلبه سلطان في أول سنة من حكمه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي السنوات الأولى بنى سلطته على ثلاثة أعمدة: ديوان الجند الذي كان يعرفه من الداخل، وخزينة أعاد ترتيب مواردها، وحامية من المماليك الجدد يشتريهم بنفسه ويُنسبون إليه. وبهذا صار له جندٌ يخصّه لا جند الدولة، وهو ما يجعل السلطان قادرًا على مواجهة أمرائه لا على الاعتماد عليهم. وقد استعمل هذه الأداة باقتصاد، فلم يُكثر من المصادرات في أول عهده حتى لا يجمع عليه بيوت الأمراء كلها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوامتدت سلطنته نحو ثمانٍ وعشرين سنة، وهي أطول مدة حكمها سلطان في المرحلة الأخيرة من عمر الدولة. وفيها واجه إمارة ذي القدر في الأناضول الجنوبي، وحارب العثمانيين ست سنوات على ثغور الشام الشمالية، وبنى في القاهرة ومكة والمدينة ما بقي شاهدًا على عصره. ثم مات في السابع من أغسطس سنة ١٤٩٦م، وخلفه ابنه الناصر محمد، فلم يدم على العرش إلا أشهرًا، وعادت الدولة إلى ما كانت تعرفه: بيعة في القلعة وصراع على من يجلس بعدها.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eمن مملوك إلى أمير ألف\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يكن في سلم الدولة درجة تُنال بالمال وحده، ولا درجة تُمنح بالنسب. فالمملوك يبدأ في الطوائف صغيرًا، ثم يصير جنديًا في حوش بيته، ثم أمير عشرة، ثم أمير أربعين، حتى يبلغ رتبة أمير المئة أو أمير الألف، وهي أعلى ما يبلغه القائد قبل طبقة الأتبكة. وكل درجة من هذه كانت تحتاج سنوات، وكانت تحتاج معها من يشفع لصاحبها عند السلطان.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بلغ قايتباي هذه الدرجات في زمن كانت الدولة تُحارب فيه على جبهتين: ذي القدر في الشمال، والقرقويون في الشرق. وفي هذه الحملات تعلّم ما لم يكن يتعلمه في القلعة: كيف يُحرّك جندًا في أرض لا يعرفها، وكيف يُدير مؤونة جيش في الصحراء، وكيف يختار من يثق به من الأمراء. وهذه المعرفة هي التي جعلته بعد ذلك سلطانًا يعرف دواوينه من الداخل لا من فوق.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eسنة ١٤٦٨م: بيعة في وقت فوضى\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الفوضى التي سبقت بيعته من نوع خاص: لم يكن فيها سلطان قوي يُخلع، بل سلاطين ضعاف يتعاقبون في أشهر. فكل واحد منهم جاء ببيعة أمراء، وكل بيعة كانت تُنتج خصومًا جددًا، حتى صارت القلعة سوقًا للمساومات لا مجلسًا للشورى. وفي مثل هذا الموضع لا يفوز الأصلح بل الأقدر على أن يُطمئن الجميع في يوم واحد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد نجح قايتباي في ذلك لأنه لم يدخل العرش بوصفه منتصرًا على أحد. فلم يصادر أموال من نافسه، ولم يقتل أحدًا من كبار الأمراء في أول أيامه، وأبقى على الوظائف كما هي. وهذا ليس رحمةً بقدر ما هو حساب: السلطان الجديد الذي يبدأ بضرب الأمراء يمنحهم سببًا للاجتماع عليه، والذي يبدأ بتثبيتهم يشتري الوقت ليُثبّت جنده الخاص.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eأعمدة السلطة الثلاثة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان العمود الأول ديوان الجند، وهو الدفتر الذي تُكتب فيه أسماء المماليك ورواتبهم وإقطاعاتهم. ومن يملك هذا الدفتر يملك معرفة من في الدولة ومن ليس فيها، ومن يستحق ومن لا يستحق. وقد عرف قايتباي هذا الدفتر من داخله قبل أن يصير سلطانًا، فلم يحتج إلى من يدله على ثغراته.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالعمود الثاني الخزينة، وقد أعاد ترتيب مواردها على أساس أن الرسوم تُجمع أولًا ثم تُقسم على أبواب الإنفاق بترتيب ثابت. والعمود الثالث حاميةٌ من المماليك الجدد يشتريهم السلطان بنفسه ويُسمّيهم باسمه، فلا يكون ولاؤهم لبيت أمير قديم بل له وحده. وبهذه الأعمدة الثلاثة صار في وسع السلطان أن يحكم أمراءه لا أن يفاوضهم.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالأصل\u003c/b\u003e\u003cspan\u003eجركسي من شمال البحر الأسود، أعتقه السلطان برسباي\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالبيعة\u003c/b\u003e\u003cspan\u003eآخر يناير سنة ١٤٦٨م بعد تنازل تمر بغا\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمدة الحكم\u003c/b\u003e\u003cspan\u003eنحو ثمان وعشرين سنة، من ١٤٦٨م إلى ١٤٩٦م\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأداة السلطة\u003c/b\u003e\u003cspan\u003eديوان الجند وخزينة مرتبة ومماليك يشتريهم بنفسه\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالوفاة\u003c/b\u003e\u003cspan\u003eالسابع من أغسطس سنة ١٤٩٦م\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمحطة\u003c/th\u003e\u003cth\u003eالتاريخ\u003c/th\u003e\u003cth\u003eما جرى\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالشراء والعتق\u003c/td\u003e\u003ctd\u003eفي أيام برسباي\u003c/td\u003e\u003ctd\u003eدخل مماليك السلطان وصار في جند الدولة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eرتبة أمير\u003c/td\u003e\u003ctd\u003eفي أيام إينال وخوشقدم\u003c/td\u003e\u003ctd\u003eمن قوّاد الحملات إلى كبار الأمراء\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالبيعة\u003c/td\u003e\u003ctd\u003eآخر يناير سنة ١٤٦٨م\u003c/td\u003e\u003ctd\u003eسلطان بعد فوضى يلباي وتمر بغا\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالسلطنة\u003c/td\u003e\u003ctd\u003eمن ١٤٦٨م إلى ١٤٩٦م\u003c/td\u003e\u003ctd\u003eأطول عهد في المرحلة الأخيرة من عمر الدولة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالوفاة\u003c/td\u003e\u003ctd\u003eالسابع من أغسطس سنة ١٤٩٦م\u003c/td\u003e\u003ctd\u003eخلفه ابنه الناصر محمد أشهرًا ثم خُلع\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eالظلم مؤذن بخراب العمران\u003c/p\u003e\u003ccite\u003eابن خلدون، المقدمة\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eبلغ العرش في الخمسين بعد أربعين سنة في خدمة الدولة، فحكم نحو ثمانٍ وعشرين سنة لم يُخلع فيها. وكان نجاحه في أنه عرف متى يستعمل السيف ومتى يستعمل المال، وهذا هو الفرق بين سلطان يدوم وسلطان يُخلع في أول أزمة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"qaytbay-culture","n":"العلم والثقافة في عهد قايتباي","ic":"📚","part":"القسم السابع: السلطان قايتباي","h":"\u003carticle class=\"ch3\" id=\"qaytbay-culture\" data-toc=\"العلم والثقافة في عهد قايتباي\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e7.2\u003c/span\u003e\n          \u003ch3\u003e📚 العلم والثقافة في عهد قايتباي\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eل\u003c/span\u003eم يكن قايتباي أميرًا يحبّ السيف وحده، بل سلطانًا أدرك أن دولةً تحكم الشام لا تثبت بالقوة وحدها. في عهده كثرت المدارس والأوقاف في القاهرة، وحضر فيها كبار علماء المشرق، وكثر نسخ المخطوطات حتى صارت المدينة واحدة من أكبر مراكز العلم في العالم الإسلامي.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eبني قايتباي في مجمّعه بين القصرين مدرسة تُدرّس المذاهب الأربعة، ووقف عليها نفقة الفقراء والطلبة، وأوقف في القاهرة ودورها أوقافًا أخرى. وكان نصيب هذه السنين من العمران أعلى من نصيب ما قبلها، فقد تضافرت أسباب الكثرة: استقرار سبل التجارة، ووفرة عوائد الأوقاف، وحرص السلطان على أن يُذكر اسمه عند كل مذهب. ولم يكن في عهد سلطان جركسي قبله من اهتم بهذا القدر بتعدد المذاهب في مدرسة واحدة، وهي عادة انتقلت بعده إلى بيوت البرجية كلها.\u003c/p\u003e\u003cp class=\"ap\"\u003eومن أشهر من كتب في هذا العهد المقريزي، وقد وُلد سنة ١٣٦٤م بملطية ثم رحل إلى القاهرة صغيرًا وتربى بها. لم تكن له في ولايته سعة ولا قدر عظيم، لكنه قضى عمره في التدريس والقضاء والكتابة حتى إذا مات سنة ١٤٤٢م في أواخر أيام السلطان ترك مكتبة غنية من التاريخ والنحافة: المواسم، والدُّر، وشذور العقود، والخُطط التي رسم فيها صورة القاهرة كما كانت في عصرها، مدينة فيها آلاف الدور من بيوت الأمراء والعلماء والتجار، ومساجدها ومدارسها وأوقافها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في القاهرة في هذه السنين ابن حجر العسقلاني، وقد وُلد سنة ١٣٣٢م ثم رحل إلى الشام وحقّق في الحديث هناك نحو عشرين سنة قبل أن يستقر بمصر. ومن أشهر كتبه الإصاب في تمييز الصحابة، وتفسير صحيح البخاري الذي أتمّه في هذه الحقبة، ومختصره في تاريخ النبي صلى الله عليه وسلم. ويُذكر أنه جعل من القاهرة دارًا لطلب العلم حتى غدت عنده كتب لا تحصى، وأن تلاميذه ومن بعدهم من المتأخرين اعتمدوا عليه في ضبط أسانيد كتب الحديث فكان حجة في عصره.\u003c/p\u003e\u003cp class=\"ap\"\u003eومن أهم ما دُوّن في هذه الحقبة ما كتبه ابن تغرى بردي في النجوم الزاهرة، وهو يروي فيه أخبار قايتباي يومًا بيوم من سفاراته وحروبه وعمائره. وقد عمل ابن تغرى في دواوين الدولة وهو شاب، فاطّلع على صحائف الدواوين وشاهد الوقائع قبل أن يصير مؤرخًا لها. وفي عهد قايتباي نفسه وُلد السخاوي سنة ١٤٢٧م، صاحب كتاب الضوء اللامع في تراجم أهل مصر، وهو الكتاب الذي أتمه في حياة من أراد أن يعرف من سبقوه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكثر في هذه السنين نسخ المخطوطات نسخًا منظمًا لا نسخًا عارضًا. كانت خزائن الكتب في المدارس والأوقاف تطلب ما تحتاجه، فيتقاسم نسختها ثقات الناسخين في المجلس، وتكتب بخطوط متنوعة منها النسخ المتقن والنسخ المستعجل. وانتشرت كتب الفقه والتاريخ والحكمة على نحو لم تعرفه القاهرة من قبل، لأن أمراء الدولة صاروا يشترون الكتب عن علم لا عن ميل.\u003c/p\u003e\u003cp class=\"ap\"\u003eولم يكن هذا العلم قائمًا وحده، بل كان متصلًا بالتجارة. فالقاهرة في عهد قايتباي ميناء داخلي كبير تصب فيه بضائع البحر الأحمر والنحاس والعسل والصوف، وتخرج منها بضائع أخرى إلى الشام وبلاد ما بين النهرين. والنتيجة أن اجتماع المال والعلم صار من طبع هذه الحقبة لا من طبع فريق منها دون غير. وعلى هذا المعنى نفسه يفسر لماذا كان عهد قايتباي من أطول عهود الدولة وأقلها حروبا كبرى في داخل مصر.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eمدرسة تجمع المذاهب الأربعة\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم تكن مدرسة قايتباي في بين القصرين نسخة من المدارس التي سبقتها في القاهرة والشام. فالمدارس القديمة كانت تدرس مذهبًا واحدًا يتبعه أهل البلد، أما هذه المدرسة فجمعت المذاهب الأربعة في بستان واحد، وأخذ كل مذهب فيها نصيبه من الوقف والرسوم. وهذا الاختيار كان اختيارًا سياسيًا قبل أن يكون فكريًا: أراد قايتباي لمدرسته أن تكون بيتًا لأهل المدينة جميعًا لا معبدًا لمذهب واحد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالمدرسة في تقاليد هذه الحقبة ليست مبنى فحسب بل عقد بين أستاذ ومحضر: يمنح الأول حق التدريس ويؤمن الثاني الكتب والطعام والمرتب. ولذلك كانت كرامة الأستاذ موضع تقدير من الأمراء قبل أن تكون موضع تقدير من العامة، وهذا ما جعل القاهرة تستقبل طلب العلم من كل البلاد. ومن دروس قايتباي في التعليم أنه لم يشترط في أستاذ المدرسة  إلا علمه.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالمقريزي شاهد على عمران القاهرة\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يقف المقريزي عند حدود الأمانة في النقل، فقد كان ينقل ما سمع ويقيس ما رأى، ويقابل بين ما كتبه وما وقف عليه بعينه من المدن والدور. ولهذا صارت الخُطط في أعين الباحثين بعده أمانة على المدينة لا مجرد كتاب أخبار. وهو يحفظ في صفحاتها أرقامًا لا نعرفها من غيره: عدد دور القاهرة ومساجدها، وأوقافها، والسقايات والمياهي التي بُنيت فيها، وأسماء بنائيها، فصارت الخُطط دليلًا ماديًا يفكك مدينة لم تعد قائمة.\u003c/p\u003e\u003cp class=\"ap\"\u003eولعل أطرف ما في المقريزي أنه كان أقل بيت المعرفة قدرًا وأكبرهم علمًا. فقد كان موظفًا صغيرًا لم يصل إلى مراتب القضاة الكبار، ولم يكن له في الدولة إلا حظ يسير من الرزق. ومع ذلك كتب في نحو أربعين كتابًا، فصار مؤرخًا للمدينة من داخلها لا من خارجها، يعرف من القاعات ما لا يعرفه غيره. وقد رأى في عهد قايتباي ما رأى من مظالم في بعض الدواوين فلم يسكت عنها، وهو يعلم ما يعرضه لمن يملك الجند.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eرحلة الطلب إلى القاهرة\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يكن الطالب في هذه الحقبة يسكن بلده ينتظر العلم بل كان يرحل. فقد جاء إلى القاهرة طلاب من الشام والعراق وفارس والأناضول والمغرب الأقصى، ومكثوا فيها سنوات حتى ينالوا الإذن في السماع. ولم يكن نادرًا أن ترى في فناء المدرسة الواحدة طلاب من عشر بلاد يجلسون في حلقة واحدة. وكانت الرحلة في حدّ ذاتها جزءًا من العلم،  لأن الطالب يرى في الطريق مساجد وعلماء وأسواقا تفيده قبل أن يقف في حلقة الدرس.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكثر في هذه السنين ما انتقل بين هذه المدارس من الكتب والرسائل، حتى صارت المدينة تتلقى الجديد في اليوم الذي يخرج فيه من نساخها. ومن هنا نفهم لماذا كانت خزائن القاهرة في عهد قايتباي أوسع من خزائن المدن التي تحيط بها، فالمال الذي يخرج من التجارة يعود إليها في صورة كتاب قبل أن يعود في صورة قصر.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eخزائن الكتب وأوقافها\u003c/h4\u003e\u003cp class=\"ap\"\u003eكثير من المخطوطات التي وصلت إلينا من هذه الحقبة تحمل في آخرها وقفية باسم مالكها، تبين أن الكتاب وُضع لئلا ينتقل، وأن انتقاله بغير إذن مالكه مخالفة. وهذه الوقفيات تدل على أمرين: أن الكتب كانت عند أصحابها أمانة لا متاع، يستعيرها الطالب ويردها كما استلفها. وأن صاحب البيت كان يفتخر بكتاب في بيته كما يفتخر بصحنه في داره.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكثر في هذه السنين استعمال الورق المصنوع في مصر نفسها حتى كادت أقلام النساخ لا تكتب إلا عليه،  ولم يكن الورق في هذه الحقبة أقل ثمنا ولا أقل قيمة من الرق. ولهذا دخلت المصاحف والكتب المطولة أوسع مما كانت، وصار طالب العلم يجد نسخته في زمن قصير كما كان يجد سلعته في السوق في اليوم نفسه.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأشهر مؤرخ في عهده\u003c/b\u003e\u003cspan\u003eالمقريزي ١٣٦٤م إلى ١٤٤٢م\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأشهر محقق للحديث\u003c/b\u003e\u003cspan\u003eابن حجر العسقلاني ١٣٣٢م إلى ١٤٤٩م\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمصدر أساسي\u003c/b\u003e\u003cspan\u003eالنجوم الزاهرة لابن تغرى بردي\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eوُلد في عهده\u003c/b\u003e\u003cspan\u003eالسخاوي سنة ١٤٢٧م صاحب الضوء اللامع\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eنمط المدارس\u003c/b\u003e\u003cspan\u003eمدرسة واحدة تجمع المذاهب الأربعة\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالعالم\u003c/th\u003e\u003cth\u003eمولده ووفاته\u003c/th\u003e\u003cth\u003eأبرز ما صنّفه\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالمقريزي\u003c/td\u003e\u003ctd\u003e١٣٦٤م – ١٤٤٢م\u003c/td\u003e\u003ctd\u003eالمواسم والدّر وشذور العقود والخُطط\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eابن حجر العسقلاني\u003c/td\u003e\u003ctd\u003e١٣٣٢م – ١٤٤٩م\u003c/td\u003e\u003ctd\u003eالإصاب في تمييز الصحابة وتفسير صحيح البخاري\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eابن تغرى بردي\u003c/td\u003e\u003ctd\u003e١٤١٠م – ١٤٧٠م\u003c/td\u003e\u003ctd\u003eالنجوم الزاهرة في ملوك مصر والشام\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالسخاوي\u003c/td\u003e\u003ctd\u003e١٤٢٧م – ١٤٩٧م\u003c/td\u003e\u003ctd\u003eالضوء اللامع في تراجم أهل مصر\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eمن بنى لله مسجدا بنى الله له بيتا في الجنة\u003c/p\u003e\u003ccite\u003eصحيح البخاري ومسلم، عن ابن عمر\u003c/cite\u003e\u003c/blockquo
