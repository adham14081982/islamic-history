 رمضان ٦٥٨هـ، الموافق ٢٥ سبتمبر ١٢٦٠م\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالميدان\u003c/td\u003e\u003ctd\u003eسهل بيسان بين نابلس وسفح جبل جرزيم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eجيش المسلمين\u003c/td\u003e\u003ctd\u003eالمماليك وأمراء بني أيوب وقوة من الجورج وخمسمئة فارس أرمني\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eجيش المغول\u003c/td\u003e\u003ctd\u003eقوات كتبغا التي أرسلها هولاكو إلى فلسطين\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالنتيجة\u003c/td\u003e\u003ctd\u003eانسحاب المغول عبر الأردن وضياع سيطرتهم على فلسطين\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eوإسلاماه، واإسلاماه، يا أولياء الله\u003c/p\u003e\u003ccite\u003eصيحة السلطان قطز في ميدان عين جالوت يوم ٢٥ رمضان ٦٥٨هـ، كما ذكرها ابن عبد الظاهر في الروض الزاهر\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eبقيت المعركة في الذاكرة أول انتصار كبير للمسلمين على المغول، غير أن قطز لم يبق طويلا ليحصد نتائجها. فالمعركة أنقذت مصر، وتركت الدولة المماليكية تبحث عن سلطان جديد يحمل لواءها.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"mongol-terms","n":"المغول بعد عين جالوت","ic":"🕊️","part":"القسم الثاني: الخطر المغولي ومعركة عين جالوت","h":"\u003carticle class=\"ch3\" id=\"mongol-terms\" data-toc=\"المغول بعد عين جالوت\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e2.3\u003c/span\u003e\n          \u003ch3\u003e🕊️ المغول بعد عين جالوت\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eل\u003c/span\u003eم تكن هزيمة كتبغا في فلسطين نهاية المغول في الشام، بل كانت بداية انسحاب طويل. فالمغول بقوا يحكمون فارس والعراق قرنين، لكنهم لم يعودوا قط إلى عبور فلسطين نحو مصر.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eدخل قطز وبيبرس دمشق بعد خمسة أيام من المعركة، ودخلوا حلب في أقل من شهر. وعادت إلى مدنها أعلام بني أيوب الذين قاتلوا في صف المسلمين، فاستقر أمر الشام في أيدي أمرائه من جديد. وما إن استقر الأمر حتى ظن الناس أن المغول لن يعودوا إلى الشام أبدا. لكن هولاكو لم يقبل الهزيمة، فقد طالب قواده بالاستعداد لزحف جديد رغم الخسائر التي لحقت بجيوشه. وردّ قطز المماليك إلى الشام، وأقام منهم خطوط دفاع على حدود البلاد، ثم عاد إلى القاهرة منتصرا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوعلى الجهة نفسها عقد بيبرس هدنة مع الفرنج تمتد إلى عشر سنوات، فانتقل الخطر من جهة إلى أخرى. وأرسل إلى الخليفة العباسي في القاهرة سفارة تجدد صلة الخلافة، لأن السلطان أراد أن يكون يومه يوم الخلافة. وفي عام ١٢٦١م أرسل بيبرس إلى ملك المغول في سهوب شمال البحر الأسود، وهو بركة خان. وكان بركة خان مسلما. وهذا ما جعل التحالف ضد هولاكو أمرا يسيرا، فقد كانت العداوة بينهما قائمة. وفي عامي ١٢٦٢ و١٢٦٣م دارت حرب بينهما، أرسل فيها بيبرس فرسانه إلى نصرة صديقه. ولم تكتف الدولة بذلك، فقد شنّ بيبرس حملة على بلاد ما بين النهرين وأبدى عناية خاصة بترميم الجبهات.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي ربيع الآخر ٦٦٥هـ الموافق فبراير ١٢٦٥م مات هولاكو بعد حكم امتد نحو ثلاثة وثلاثين عاما. وقبل وفاته أوصى بأبنائه أن يوفوا بهدنة مع المسلمين. وتولى ابنه أباقا الحكم، ثم تيكودر بعده، ثم غازان الذي أسلم سنة ٦٩٥هـ الموافق ١٢٩٥م. ومنذ ذلك الحين انصرف المغول عن احتلال الشام، وبقيت جيوشهم في العراق وفارس. وكذلك كان هذا الانصراف نتيجة ضعف لحق بسلطتهم من توترات داخلية، فلم تعد مصر على شفا الحرب كما كانت قبل سنوات.\u003c/p\u003e\u003cp class=\"ap\"\u003eلكن القطيعة لم تكن أبدية، فقد عاد الالتقاء مرة أخرى سنة ٧٠٣هـ الموافق ١٣٠٣م عند مرج داباغ. عند مرج داباغ في شمال الشام التقى المماليك والمغول، وكان النصر للمماليك تحت قيادة السلطان الناصر محمد. وهذا آخر التقاء كبير بين المماليك والمغول في ساحة المعارك. وفي ما بين المعركتين تبادلت الدول الرسل مع أمراء ما بين النهرين وفارس. وتبقى مصر في تلك الحقبة في منأى عن هذه التجاذبات، لأن نهر النيل وحصون مصر كانتا كافية لصد أي زحف جديد.\u003c/p\u003e\u003cp class=\"ap\"\u003eقضى بيبرس بقية حكمه في تثبيت الحدود وتوسيع نفوذ الدولة في الشام. أعاد بناء ما تهدم من دمشق وحلب، وأصلح ما خربه المغول في مسالك الشام. ومن هذا الانتصار استخلص درسا، هو أن الخطر يخيم على طبقة تحرس السلطان لا على دولة تحكم. الطبقة التي أنقذت مصر كانت طبقة من الجند المجنَّد، لا شريحة من الأمراء. ولعل أبعد أثر في هذه الحادثة أنه أثبت أن قيمة النصر في صمود الجند أكثر منها في الخطابة، وهي درس لم تنسه الدولة حين انقسمت بين سلطان وآخر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوظل أمراء بني أيوب في الشام يعتمدون على المماليك في كل مواجهة، فكان ذلك ولاء متبادل لا تحالفا رسميا، وكل منهما كان يحتاج الآخر في كل ساعة. وفي المقابل وجد المماليك في أمراء أيوب حلفاء طبيعيين، لأن المصالح كانت واحدة، وكانوا يتنازلون عن طموح كل منهما ضد الآخر في ساحة المعركة. ولهذا عادت مصر والشام إلى الكتلة الواحدة تحت راية المماليك، وهي كتلة صمدت أمام اختبار المغول ثم صارت تحكم نفسها بسلطان واحد وقوة واحدة.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eمعاهدة عكا\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم تكن الهدنة مع الفرنج تكرما، بل كانت حسابا سياسيًا في صميم الخطر. فالمماليك كانوا يعرفون أن عدو اليوم قد يكون الغد، وأن الفرنج لن ينجدوهم إذا عاد المغول. ولهذا عقد بيبرس هدنة طويلة الأمد، ثم التزم بها ما دامت الظروف تسمح، ففتحت له يدا لتصفية حساب المغول.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد مكنت هذه الهدنة المماليك من تحرير الشام بلا أن يخسروا وحدة الجبهة. ففي العام نفسه عادت دمشق وحلب، وفي العام التالي عاد ترتيب الحدود من جديد. وهذا ما يفسر لماذا لم يلتق المماليك بالفرنج في معركة واحدة ضد المغول. وحين عاد الفرنج إلى يافا وعكا وجدوا أن الدولة التي هزمت المغول هي التي حافظت على عهدهم.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالتحالف مع بركة خان\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان بركة خان زعيم قبيلة قوية من قبائل المغول في سهوب الشمال. وقد أسلم قبل إخوته، ومن ثم كان ينظر إلى مغول المشرق نظرة الحذر. ولهذا لم يجد بيبرس صعوبة في الاستجابة لطلب التحالف، فقد كان الطرفان ضد عدو واحد. والحرب بينهما انتهت بهزيمة المغول في حملتهم على بلاد ما بين النهرين.\u003c/p\u003e\u003cp class=\"ap\"\u003eولعل أبعد أثر لهذه الخطة أنها أنقذت الشام مرتين، مرة من المغول ومرة من الفرنج. فهي خطة لا تعتمد على قوة السلاح وحده، بل على فهم العدو وتوقع تصرفه. وهذا ما يجب أن يعلمه كل قائد يظن أن القوة تكفي في كل وقت. ومن يدري اليوم أي الحصون هي التي تحمي مصر، فالقلوب تتغير ولا تجمد.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eلماذا انتهت الكارثة\u003c/h4\u003e\u003cp class=\"ap\"\u003eانتهت الكارثة بأسباب ثلاثة، أولها انشقاق البيت المغولي على نفسه. وثانيها أن المماليك صاروا قوة نظامية لها قيادة ثابتة وجيش معبأ. وثالثها أن مصر اتبعت سياسة الازدواج مع الفرنج، فلا خوف من جسمين في وقت واحد. ولو تجتمع هذه الأسباب كلها اليوم لكانت الحالة مختلفة.\u003c/p\u003e\u003cp class=\"ap\"\u003eومن المفارقة أن الخطر العظيم جاء من خارج حدود الدولة كلها. فكان على دولة صغيرة في عددها أن تستقبل أمما بأسرها. ولن يجتمع الخطران في وقت واحد إلا إذا غفل الحكام عن درس المعركة. وهذا ما علمته سنة ٦٥٨هـ لكل من جاء بعدها. وتلك سنة باقية في ذاكرة الدولة المماليكية إلى اليوم.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eوفاة هولاكو\u003c/b\u003e\u003cspan\u003eربيع الآخر ٦٦٥هـ الموافق فبراير ١٢٦٥م\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eهدنة الفرنج\u003c/b\u003e\u003cspan\u003eعقدها قطز مع أمراء عكا قبل المعركة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالتحالف مع بركة خان\u003c/b\u003e\u003cspan\u003eبعد عين جالوت، واتفق الطرفان على نصرة بعضهما\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eحرب ما بين النهرين\u003c/b\u003e\u003cspan\u003e١٢٦٢ و١٢٦٣م، وانتهت بانتصار بركة خان\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eآخر مواجهة كبرى\u003c/b\u003e\u003cspan\u003eمرج داباغ ٦٩٤هـ الموافق ١٣٠٥م، وكان النصر للمماليك\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالموضوع\u003c/th\u003e\u003cth\u003eالتاريخ\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eعودة دمشق\u003c/td\u003e\u003ctd\u003e١٢٦٠م\u003c/td\u003e\u003ctd\u003eتسليم المدينة للمماليك بعد خمسة أيام من المعركة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالتحالف مع بركة خان\u003c/td\u003e\u003ctd\u003eبعد ١٢٦٠م\u003c/td\u003e\u003ctd\u003eضرب المغول من جهة الشمال\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eحرب ما بين النهرين\u003c/td\u003e\u003ctd\u003e١٢٦٢ و١٢٦٣م\u003c/td\u003e\u003ctd\u003eانتصار بركة خان على جيوش هولاكو\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eوفاة هولاكو\u003c/td\u003e\u003ctd\u003e١٢٦٥م\u003c/td\u003e\u003ctd\u003eبداية تحول المغول عن الشام\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eمواجهة مرج داباغ\u003c/td\u003e\u003ctd\u003e٦٩٤هـ / ١٣٠٥م\u003c/td\u003e\u003ctd\u003eآخر انتصار كبير للمماليك على المغول\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eقد علمت محبتي للإسلام، وعلمت ما فعل هولاكو بالمسلمين، فاركب أنت من ناحية حتى آتيه أنا من الناحية الأخرى، حتى نهزمه أو نخرجه من البلاد، وأعطيك جميع ما كان بيده من البلاد.\u003c/p\u003e\u003ccite\u003eمن رسالة بركة خان إلى سلطان مصر كما نقلها رشيد الدين الهمذاني في جامع التواريخ\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eانسحب المغول عن الشام بعد عين جالوت، وبقيت مصر خارج المعركة قرنا آخر. ومع ذلك ظلت العداوة قائمة، ولم يسلم العالم الإسلامي من الخطر المغولي إلا بزيادة قوة الدولة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"qatiz","n":"السلطان قطز","ic":"👑","part":"القسم الثاني: الخطر المغولي ومعركة عين جالوت","h":"\u003carticle class=\"ch3\" id=\"qatiz\" data-toc=\"السلطان قطز\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e2.4\u003c/span\u003e\n          \u003ch3\u003e👑 السلطان قطز\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eل\u003c/span\u003eم يعرفه أحد قبل معركته، ثم صار في أشهر شهر معرفة بين المسلمين. سلطان حكم نحو عام واحد، لكنه ترك في الدولة أثرا لا يمحوه الزمن، وأعدّ لمصر والشام دولة واحدة تحت راية المماليك.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eذكر ابن خلدون أن أباه من الأبا الجورجية وأن أمه كانت من جوارب السلطان الصالح، ولذلك نُسب إليه، ويرى بعض المؤرخين أنه من بيت خوارزمشاه. وأسر في المعارك الأخيرة لدولة خوارزم، ثم بيع في دمشق تجارة الرقيق. وسماه المغول قطز، وهو اسم يعني الكلب العنيد في لغتهم. وهو الذي قاتل في معركة المنصورة سنة ١٢٥٠م، فعرفه أصحاب السيف في مصر والشام. وفي مصر وجد مكانا له بين الجنود، وفي الشام دخل في خدمة الأمراء. وقضى بها سنوات حتى نال رتبة كبيرة بين المماليك، ثم دخل في دوائر الحكم، وصار أحد أعمدة الدولة في عهد السلطان عز الدين أيبك.\u003c/p\u003e\u003cp class=\"ap\"\u003eقاد قطز الدفاع عن مصر حين زحف الفرنج عليها سنة ١٢٥٠م، فعرفه أصحاب السيف قبل أن يعرفه القلم. كان بين من اشترك في قتل توران شاه حين استعاد دمشق. ثم دعم شجار الدر ثم عايبيك في تولي الحكم. وقتل عطايا الأطابكة حين أراد أن يستقل بمصر، ومنع بذلك تفكك الدولة في مسيرها. ثم ولي وصاية السلطان الصغير علي بن أيبك. ولما مات عايبيك تولى الرقابة على الملك الصغير حتى كبر، وكان قد جمع بين معرفة الجند وأهل الدولة، فلم يكن فتى يجهل عادات الجيش.\u003c/p\u003e\u003cp class=\"ap\"\u003eتولى قطز الحكم في ٢٤ ذي القعدة ٦٥٧هـ الموافق نوفمبر ١٢٥٩م، فكان من أضيق أصل تولي السلطنة في تاريخ الدولة.  ولزم نفسه بالجد والحزم في الحكم، فكانت سياسته لا تعرف الحد. وأصدر العز بن عبد السلام فتواه في محاربة المغول، فاشتعلت مصر كلها. وباع قطز متاعه هو ليمول الجيش، وجمع لحملة الشام نحو ستمائة ألف دينار. وأرسل رسله إلى الأمراء في الشام يدعوهم إلى الخروج، ثم خرج بنفسه مع الجيوش.\u003c/p\u003e\u003cp class=\"ap\"\u003eوصلت رسالة هولاكو إلى القاهرة تحملها أيدي أربعة من رسله، فقرأها قطز قبل أن يعلم بما فيها. وفيها تهديد صريح بأن الخاقان يملك المشرق والمغرب، وأن ما من سيوفه خلاص ولا من مهابته مناص، وهي رسالة لم يرد إليها السلطان. فقرأ قطز الرسالة على الأمراء في مجلس القلعة، ولم يتردد في الرد، بل طالبهم بالقرار الفوري لا بالتشاور. وقال: قاتلوا من يقاتلكم، فمن أراد النجاة فليحارب، ومن أراد العز فليقتل، ولأثبت عند باب المعركة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوبعد النصر مباشرة رفض قطز أن يتابع الزحف نحو بغداد، لأن الجيوش كانت منهكة. وقيل إن الأمراء هم الذين قتلوه، وقد قتل في ذي القعدة سنة ٦٥٨هـ الموافق أكتوبر من سنة ١٢٦٠م بعد خمسين يوما من النصر بعين جالوت. وقيل إنه قتل وهو خارج القاهرة، بلا حرس كاف. وإن كان سبب موته فيه خلاف، فإن الدولة خسرت سلطانها في أيام. ونقل قبره إلى القاهرة قرب حي القرافة حيث يكون قبره معروفا إلى اليوم، ولم يمض على وفاته طويل حتى تولى بيبرس الحكم في بيت واحد، فكانت الخسارة كبيرة على دولة في أوج بنائها.\u003c/p\u003e\u003cp class=\"ap\"\u003eكان قطز قاسيا في شدة العزم، رقيقا في العطاء، لا يعرف الكسل في حقول المعارك، ويعرف الخطر حين يقبل وجهه. وقبل المعركة جلس مع الأمراء يخطط وينفذ، فكان آمرا حازما لا يقبل الجدل، ومن أحبه منهم كان يعرف أنه لا ينسى. ولا يزال اسمه في كتب التاريخ مربوطا بأول انتصار على المغول، وبأمرائه الذين اختلفوا عليه بعد موته، وبالموسم الذي قاده في فلسطين فلم يرجع منه إلا قبر، وهي مفارقة تبقى في ذاكرة الدولة وأخبارها المنشورة في المصادر.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eمن الدنيا إلى السلطنة\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يولد قطز في بيت سلطان، بل في بيت خوارزم الذي كان معروفا بالسياسة والقوة قبل أن يسقط تحت سيوف المغول. وأسر صباه في المعارك الأخيرة لدولتهم، وبيع عبدا في سوق دمشق، ثم خدم في الجيوش مدة طويلة حتى نال ثقة الأمراء وصار من خاصة السلطان حين ولي أبو بكر بن أبي بكر.\u003c/p\u003e\u003cp class=\"ap\"\u003eصعد قطز درجة بعد درجة حتى بلغ السلطنة. ودخل في صفوف الجيوش ثم تولى الرقابة على السلطان الصغير. ولم يمض على توليه السلطنة أشهر قليلة حتى لاقت مصر الكارثة الكبرى. فكان أول ما فعله أنه جرد المماليك وحسبهم، فعرف قوتهم قبل أن يحتاجها، وأقام منهم نواة الجيش الجديد.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالسلطان الذي لم يبق\u003c/h4\u003e\u003cp class=\"ap\"\u003eبعد النصر رفض قطز أن يقيم في دمشق، وأمر مماليكه بالمبيت خارج القاهرة، ولم يقدّر أن الغدر يقع من حيث لا يحسب. وقد قتل في ٢٤ أكتوبر ١٢٦٠م، أي بعد عين جالوت بخمسين يوما فقط، ودفن في مصر ثم نقل قبره إلى القاهرة قرب حي القرافة حيث يزوره الناس كل سنة إلى اليوم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقيل إن بعض أمرائه لم يكونوا يحبونه لما حملهم من مشقة، ولهذا لم يستطع أحد أن يمنع موته في الطريق. وقد قتلوه وهو خارج القاهرة بعد أن رفض أن يقيم في دمشق كما اعتاد الأمراء من قبله، فكان نصيبه من النصر قليل ونصيب قومه من النفع عظيم، وهي مفارقة لا تخلو من إشارات.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eمن النصر إلى القبر\u003c/h4\u003e\u003cp class=\"ap\"\u003eبعد موته ارتجفت مصر كلها، وانتقل الحكم في بيت واحد إلى بيبرس، فكان الانتقال سريعا لم يفصل فيهما وقت. ومنذ ذلك اليوم صار بيبرس هو صاحب الفضل في ردع المغول، لأن قطز بنى الجيش وقاده النصر، وبيبرس هو من أتم البناء وأطال عمره بالحكم سبعة عشر عاما، فعاشت الدولة بعده أكثر مما عاشت قبله.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقيل إنه كان شديدا في حكمه، ودفن في القاهرة، وقيل إنه خاف من بعض أمرائه، ولم يكن له من يدافع عنه حين قتل. ويجادل بعض المؤرخين في سبب موته، لكنهم يتفقون أنه خسر الدولة سلطانا قبل أن يستوي أمرها، وأن مماليكه انقلبوا عليه وهم أول من آلت إليه النكبة، ولا يزال قبره معروفا.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالاسم الحقيقي\u003c/b\u003e\u003cspan\u003eمحمود بن ممدود بن خوارزمشاه\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eتولي السلطنة\u003c/b\u003e\u003cspan\u003e٢٤ ذي القعدة ٦٥٧هـ الموافق نوفمبر ١٢٥٩م\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمعركة\u003c/b\u003e\u003cspan\u003eعين جالوت في ٢٥ رمضان ٦٥٨هـ الموافق ٢٥ سبتمبر ١٢٦٠م\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمدة الحكم\u003c/b\u003e\u003cspan\u003eأربعة أشهر فقط\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمقتل\u003c/b\u003e\u003cspan\u003e٢٤ أكتوبر ١٢٦٠م، أي بعد النصر بخمسين يوما\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالموضوع\u003c/th\u003e\u003cth\u003eالتفصيل\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالأصل\u003c/td\u003e\u003ctd\u003eمحمود بن ممدود بن خوارزمشاه، من بيت خوارزم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eقبل السلطنة\u003c/td\u003e\u003ctd\u003eقائد في جيوش مصر والشام، ووصي على السلطان الصغير\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالتنظيم\u003c/td\u003e\u003ctd\u003eجمع نحو ستمائة ألف دينار، ورأسل أمراء الشام\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمعركة\u003c/td\u003e\u003ctd\u003eقاد المماليك في عين جالوت يوم ٢٥ رمضان ٦٥٨هـ\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمقتل\u003c/td\u003e\u003ctd\u003e٢٤ أكتوبر ١٢٦٠م، وانتقل الحكم بعده إلى بيبرس\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eلا بد من سلطان قاهر يقاتل هذا العدو، والملك الصبي لا يعرف تدبير الملك.\u003c/p\u003e\u003ccite\u003eمن كلام السلطان قطز في مجلس القلعة أمام الأمراء، نقله ابن عبد الظاهر في الروض الزاهر\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eقاد قطز المماليك إلى أول انتصار على المغول في مدة لا تتجاوز أربعة أشهر، ثم قتل قبل أن يلم ثمرة انتصاره. وبقيت الدولة المماليكية تحمل اسم المعركة التي لم يعش سلطانها ليرى نتائجها.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-3","n":"القسم الثالث: بيبرس وتأسيس الدولة","ic":"","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-3\" style=\"--c:#0F6B5C\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🏛️\u003c/div\u003e\n      \u003ch2\u003eالقسم الثالث: بيبرس وتأسيس الدولة\u003c/h2\u003e\n      \u003cp\u003eتتناول هذه الفصول سلطنة بيبرس التي شرّعت دولة جديدة: صعوده إلى السلطنة بعد عين جالوت، وإقراره للخلافة العباسية بالقاهرة، وتأسيس دواوين الحكم وأنظمة الإقطاع، ثم الحملة التي طوّقت الساحل واسترجعت أنطاكية وطرابلس. وبيبرس هو السلطان الذي وضع لهذه الدولة أسسها: جيش يستحق راتبه من بيت المال، وخراج يدقق في دفتره، وأرض تقسم بين السلطان وأميرها.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#baybars-the-founder\"\u003eالملك الظاهر بيبرس: مؤسس الدولة\u003c/a\u003e\u003ca href=\"#abbasid-caliphate\"\u003eإقرار الخلافة العباسية بالقاهرة\u003c/a\u003e\u003ca href=\"#state-institutions\"\u003eدواوين الدولة وأراضيها\u003c/a\u003e\u003ca href=\"#coastal-reconquest\"\u003eحملة الساحل واستعادة أنطاكية وطرابلس\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"baybars-the-founder","n":"الملك الظاهر بيبرس: مؤسس الدولة","ic":"🐎","part":"القسم الثالث: بيبرس وتأسيس الدولة","h":"\u003carticle class=\"ch3\" id=\"baybars-the-founder\" data-toc=\"الملك الظاهر بيبرس: مؤسس الدولة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e3.1\u003c/span\u003e\n          \u003ch3\u003e🐎 الملك الظاهر بيبرس: مؤسس الدولة\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eأ\u003c/span\u003eعمت عين بيبرس على يد مصر ثم حكم ستة عشر عامًا أعاد فيها بناء دولة المماليك على أسس لم تمس منذ حين: جيش يجيء راتبه من بيت المال، وخراج يدقق في دفتره، وساحل خلا من أكثر معاقل الفرنج. سيرة مؤسس أكثر منها سيرة سلطان، فهو الذي رسم النظام لا الذي ورثه.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eوُلد بيبرس في بلاد القفجاق شمال نهر الدون نحو سنة ٦٢٠هـ الموافق سنة ١٢٢٣م تقريبا، وتختلف الروايات في تحديد سنة ميلاده لكنه نشأ في بيئة تركية هناك. وأسرت أمه وهي تحمله بعد أن فوجئت بجيوش هاجمت قريته، فضاع من يدها وباعه تجار في الطريق إلى الشام، فاشتراه أمير التابعية زنغور الأشقر أحد أمراء الدولة الأيوبية الكبار، فأدخله الطوائف وأقام في قصر السبع خارج دمشق سنوات تدرب فيها على الفروسية والرمي وأنواع القتال حتى أتقنها، ثم انتقل إلى مصر سنة ٦٥١هـ الموافق سنة ١٢٥٣م بعد وفاة زنغور ودخل خدمة الدولة المصرية وهو فارس مجرب في بلاط أمير أيوبي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوشارك بيبرس في معركة المنصورة في العاشر من فبراير سنة ١٢٤٩هـ الموافق سنة ١٢٥٠م وكان على مقدم جند مصر، فأصابته ضربة من يد فارس فرنجي جرحا غزيرا أفتقدته عن فرسه، فاحتمى في مسجد بظاهر المنصورة حتى ظن من رآه أنه مات، ثم عُثر عليه بعد أيام وعولج وعاد إلى الجند. وبعد انقلاب سنة ١٢٥٢م الذي انتهى بمقتل قطز وأتابك وقصون قُبض على بيبرس وعوقبت عينه لأنه كان متهما بالاشتراك في مكيدة قتل قطز، لكنه استردت مكانته حين تولاها قطز، فخرج في حملة استرداد حلب سنة ١٢٥٦م، وكان على قيادة المقدمة في معركة عين جالوت سنة ١٢٦٠م.\u003c/p\u003e\u003cp class=\"ap\"\u003eلم تمض على قتل قطز سوى أيام حتى بايعه أمراء المماليك سلطانا في أواخر شهر جمادى الآخرة سنة ٦٥٨هـ، أي في أواخر مايو أو مطلع يونيو سنة ١٢٦٠م، وتختلف الروايات في تحديد اليوم. وكان في المسألة خلاف، فبعض الأمراء مال إلى تولية ابن قطز الصغير لأن صغره يجعل التحكم فيه أسهل، لكن بيبرس كان أشدهم مروءة وأعرفهم بتدبير الحرب فحسمت له المسألة، وثبتت بياعته بعد النصر في عين جالوت حين بايعه الجند مرة أخرى. ولقبوه الملك الظاهر ركن الدين، ولم يكن اللقب نظريا فقد أخذ على الأمراء بيع الطاعة في مجلس القلعة، وألزمهم بالاتياد والوقار كما لم يعرفوا من قبل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوجد بيبرس دولة معطوبة: جندا متفرقا بعد سنوات الفوضى، وخزينة لا تكاد، ومعسكرين مشلولين. فأعاد نظام الجند من جديد، فرفع عدد المماليك المقربين إليه في مصر، وجعل لهم رواتب ثابتة من خزانة السلطان تدفع في مواعيدها حتى لا يتأخر مملوك عن الخدمة فقرا، لأن المماليك المعدمين كانوا ينفضون إلى أمراء البخل. وأقام في القاهرة خزائن للسلاح تشترى منها السنون والأقواس والخيل وجعل لها حرسا، وسن السفن في النيل وعند رشيد ليجوز بها البحر، وألزم الأمراء بألا يتجاوزوا حدود أمر السلطان في شيء من أمور الجند والبلاط.\u003c/p\u003e\u003cp class=\"ap\"\u003eتغيرت علاقة الدولة بالمغول مع بيبرس: فلما تولى الإيلخان أبقا سنة ١٢٦٥م بعد وفاة أبيه هولاكو بعث إليه بيبرس سفارة تحمل التحية والهدية، فوافق الإيلخان على أن يزحف على الفرنج من الشرق بينما يضربهم بيبرس من الجنوب. غير أن الاتفاق لم يثمر في عامه الأول، فقد زحفت الفرقة المغولية على الشام سنة ١٢٦٨م ثم انحسرت حين بلغها خبر تحرك عساكر مصر، وبقي أمر بيت المقدس معلقا بين المطالبين. وفي الوقت نفسه فاوض بيبرس ملوك الفرنج وأمراءهم وبعث إليهم الرسائل، فالتقى بملك فرنسا لويس التاسع عند قيسارية سنة ١٢٧٠م، وأرسل إلى بابا روما وملك أراغون يدعوهم إلى الكفاح عن الصليب.\u003c/p\u003e\u003cp class=\"ap\"\u003eتوفي بيبرس في دمياط في مطلع يونيو سنة ١٢٧٧م الموافق جمادى الآخرة سنة ٦٧٥هـ، وقد جاوز الستين، بعد ستة عشر عاما من السلطنة متصلة لم يخلع فيها ولم تنازعه فيها يد. وكان قد عاد إلى مصر تلك السنة على عزم الخروج في حملة جديدة على الفرنج بعد وصول أسطول صليبي إلى سواحل الشام، وجهز لهذه الحملة العدد والرجال وأنفق عليها من خزائنه، ثم فجأة مرض في دمياط أياما يسيرة فمات، ولم تكتمل الحملة التي كان قد وظّف خيله وخزائنه لخوضها، فتفرق الجمع الذي جمعه بموت صاحبه.\u003c/p\u003e\u003cp class=\"ap\"\u003eدفن بيبرس في مسجده بقبرة الخياطين شمال القاهرة، وهي المقبرة التي جعلها مثوى لعظماء الدولة فنواها، فبني قبره فيها إلى جانب مئذنة تحمل اسمه. وقد نقلت الروايات أنه أوصى بولاية الدولة بعده لسنقر الجكندار بن أتابك قلاوون ولم يوص بأبنائه لأنهم كانوا صغار السن، غير أن الأمراء لم يبلغوا هذه التوصية فنزعوا الملك من يد بيبرس الثاني وأخذوه بيبرس ابن قلاوون ثم قلاوون نفسه، وقتلوا بعض أبناء السلطان الميت، ثم حكم بعده بيبرس الثاني أربع سنين حتى خلعه قلاوون ورسخ نفسه سلطانا.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eكيف بايعه الأمراء\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم تكن بيعة بيبرس طاعة عمياء، بل خلاصة كلام دار بين الأمراء قبل أن بايعوا. فمنهم من أراد ابن قطز الصغير لأن صغره يجعل أمسك الأمر عليه أهون، ومنهم من رأى في شدة بيبرس ما ينفع في الميدان. وحسمت كثافة جنده وثقته بهم المسألة، فبايعوه لا لأنه الأقرب إلى العرش، بل لأنه الأقوى بينهم جميعًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eولما بايعوه أخذ منهم بيعة على شرط مفاده ألا يخالفوا أمره في جند ولا مال ولا ظلم لأهل البلد. وكان هذا الشرط غريبا في زمانه، لأن أمراء المماليك كانوا قد اعتادوا أن يتقاسموا النفوذ بعد كل انقلاب فيتصرف كل أمير في ما تحت يده تصرف المالك لا الوكيل. فلما جعل بيبرس المخالفة سببا لسحب الإقطاع صار أمر الجند والمال بيد السلطان وحده، وصار الأمراء موظفين للدولة لا شركاء فيها، وهذا هو التغيير الذي ميز سلطنته عمن قبلها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوخالف بعض الأمراء هذا الشرط فأخذ منهم بيبرس حقوقهم وردّها إلى بيت المال، وصار هذا نصيب كل أمير يخالف فيه أمر السلطان. ولم يكن ذلك عقوبة عابرة بل صار قاعدة معلومة تكتب في دواوين الدولة، فإذا خرج أمير عن الطاعة نودي بخرجه وسقط اسمه من ديوان الجند وضُم إقطاعه إلى ما يوزع على من يطيع. وبهذا استقام للأمراء حساب لم يعرفوه من قبل، وعرفت الدولة طريقا إلى ضبط بيوتها الكبار بيد السلطان.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالرجل الذي لم ينم عن الثغور\u003c/h4\u003e\u003cp class=\"ap\"\u003eعرف بيبرس بقلة النوم وشدة المراقبة لثغور بلاده، فكانت البريد تأتيه من الشام والسواحل في أوقات محدودة لا تتأخر، ونصب على الطرقات خيولا معدة تنتقل عليها الأخبار من فارس إلى فارس حتى تبلغ القلعة في أيام معدودة. وكان يقرأ هذه الأخبار بنفسه ويكتب على ظهورها بما يفعله، فصارت دواوينه مدرسة في تدبير الدولة اليومي.\u003c/p\u003e\u003cp class=\"ap\"\u003eولم يكن يقتصر على الأخبار الرسمية، فقد أرسل العيون والرسل إلى قبرص وبلاد الفرنج وكرسي الروم وعسكر المغول، فعرف ما يدور بين أعدائه قبل أن يعقدوا العزم. وحفظت كتب التاريخ أنه كان يجالس التجار والواردين من البلاد ويسألهم عن أسعار الطعام وأحوال الطرق وحركة القوافل، فكانت صورة العالم عنده تتحدث كل يوم، وهذا عون له في قرارات الحرب والصلح.\u003c/p\u003e\u003cp class=\"ap\"\u003eوامتدت هذه العناية إلى البحر، فأقام بيبرس دورا لصناعة السفن في القاهرة والإسكندرية وجعل للأسطول المصري حضورا دائما في مياه الشام بعد أن كان يظهر موسما في موسم. وبهذا صارت الدولة تربط بين برها وبحرها، وصار الساحل الشامي تحت عين السلطان في القاهرة لا مجرد أطراف بعيدة يتصرف فيها أمراؤها كما شاؤوا.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمدة السلطنة\u003c/b\u003e\u003cspan\u003eستة عشر عاما من ١٢٦٠م إلى ١٢٧٧م\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأشهر ألقابه\u003c/b\u003e\u003cspan\u003eالملك الظاهر ركن الدين بيبرس\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالحمولة البريدية\u003c/b\u003e\u003cspan\u003eبريد منغولي وصل مصر والشام في أيام معدودة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eعاصمته\u003c/b\u003e\u003cspan\u003eالقاهرة وقلة الجبل مقرا للحكم\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمثواه\u003c/b\u003e\u003cspan\u003eمكتبة قبة الخياطين شمال القاهرة\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالجهة\u003c/th\u003e\u003cth\u003eطبيعة العلاقة\u003c/th\u003e\u003cth\u003eأبرز الأحداث\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالإيلخان المغولي\u003c/td\u003e\u003ctd\u003eعداوة مع رسائل وسفارات متبادلة\u003c/td\u003e\u003ctd\u003eسفارات التحية بعد وفاة هولاكو ثم غارات متبادلة على الشام\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالفرنج في الشام\u003c/td\u003e\u003ctd\u003eحرب واستعادة ثغور\u003c/td\u003e\u003ctd\u003eاسترداد قيسارية وأرسوف سنة ١٢٦٥م وأنطاكية سنة ١٢٦٨م\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eملك فرنسا وأوروبا\u003c/td\u003e\u003ctd\u003eمراسلات وتربص\u003c/td\u003e\u003ctd\u003eرسائل متبادلة مع ملوك أوروبا ودفاع عن مصالح الدولة في الساحل\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eدولة سلاجقة الروم\u003c/td\u003e\u003ctd\u003eنفذ وسيطرة\u003c/td\u003e\u003ctd\u003eتدخل في شؤون قونية وضم من الأمور ما قرّبها من مصر\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالنوبة والمغرب\u003c/td\u003e\u003ctd\u003eصلح وحدود وتبادل\u003c/td\u003e\u003ctd\u003eحملة على النوبة ورسائل مع أمراء المغرب والأندل\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eكان بيبرس إذا ركب في موكبه لم ير الناس إلا مهابة وجلالا، وكان مع شدته سمحا بأمر الدماء، لا يقتل إلا في حقن كبير، وأحبه الجند لعدله في أعطياتهم.\u003c/p\u003e\u003ccite\u003eمن كتب تراجم الملك الظاهر عند المؤرخين\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eبيبرس هو مهندس دولة المماليك في صورتها المكتملة: جيش منتظم الرواتب، ودواوين محكمة، وساحل يسترد ثغره ثغرا ثغرا. وحين مات في دمياط سنة ١٢٧٧م ترك دولة أقوى مما تسلمها بسبعة عشر عاما.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"abbasid-caliphate","n":"إقرار الخلافة العباسية بالقاهرة","ic":"🕵️","part":"القسم الثالث: بيبرس وتأسيس الدولة","h":"\u003carticle class=\"ch3\" id=\"abbasid-caliphate\" data-toc=\"إقرار الخلافة العباسية بالقاهرة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e3.2\u003c/span\u003e\n          \u003ch3\u003e🕵️ إقرار الخلافة العباسية بالقاهرة\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eح\u003c/span\u003eين سقطت بغداد سنة ١٢٥٨م ظن الناس أن الخلافة العباسية انتهت من الدنيا. ثم جاء رجل من آل العباس فار إلى الشام، فالتقطه بيبرس وأجلسه على منبر القاهرة، فعادت للدولة المملوكية الشرعية التي ما كان يملكها سلطان منذ أمد بعيد.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eلما استولى هولاكو على بغداد وقتل الخليفة المستعصم بالله في شوال سنة ٦٥٦هـ الموافق فبراير سنة ١٢٥٨م، تفرق من بقي من بني العباس في البلاد، فمنهم من لجأ إلى الشام ومنهم من نزل على عرب البادية، وصار وجود رجل منهم يطاف به على الأمراء سبيلا لطلب الشرعية. وكان الأمراء أنفسهم يعرفون قدر هذه الورقة، فما تولى سلطان في مصر والشام إلا وجه إلى العرب والبلاد من يسأل عن رجل من بني العباس.\u003c/p\u003e\u003cp class=\"ap\"\u003eوصل إلى دمشق رجل يقال له أحمد بن أبي القاسم الحسن بن علي، من ولد الخليفة المستظهر بالله، وكان قد أقام في بغداد حتى وقعت الفتنة ثم خرج منها مع من خرج. ولما بلغ بيبرس خبره بعث إليه من يأخوه ويجيء به إلى القاهرة سرا، فدخلها في رجب سنة ٦٥٩هـ الموافق يونيو سنة ١٢٦١م، وأجلس بيبرس له مجلسا عاما حضره القضاة والأمراء وكبار الدولة، فتثبت العدول من نسبه بشهادة من يعرف أهل بغداد من التجار والوافدين، ثم بايعه بيبرس على الخلافة ولقبه المستنصر بالله، وأمر الخطبة له على منابر مصر والشام.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم جرت مراسم فريدة في القلعة: جلس المستنصر والبيعة معقودة له، وجاء بيبرس فجلس بين يديه كأمير من أمرائه، وقال الخليفة كلاما في وجوب طاعة السلطان ونصرة الدين، ثم قام إليه بيبرس فألبسه خلعة وأعطاه ما يليق بمقامه. وبهذا المجلس صار بيبرس سلطانا بشرع خليفة، وصار الخليفة خليفة بسلطان بيبرس، وهذه هي المعادلة التي قامت عليها شرعية الدولة المملوكية قرنين ونصف قرن بعدها.\u003c/p\u003e\u003cp class=\"ap\"\u003eولم يكن المستنصر رجلا يجلس في قصره، فقد التمس من بيبرس أن يمده بجند يستعيد بها بغداد من المغول، ووافقه بيبرس على وجه منه: أن يخرج الخليفة بنفسه في جمع من الجند والعرب. فخرج المستنصر سنة ١٢٦١م في جمع لم يكن على قدر المهمة، فلقيته فرقة مغولية قرب الأنبار فأحاطت به وقتلته في ذي القعدة سنة ٦٥٩هـ، وعاد من نجا من أصحابه إلى مصر بخبر مقتله.\u003c/p\u003e\u003cp class=\"ap\"\u003eفلم ينقطع بيبرس عما بدأه، بل جد الطلب في رجل آخر من بني العباس، فوجد أبا العباس أحمد الذي قدم من الشام فبايعه بالخلافة ولقبه الحاكم بأمر الله، وأقر له بالإقامة في القاهرة مع كرامة وافرة، لكنه لم يخرجه إلى حرب بعد الذي كان من المستنصر. وبقي الحاكم وأولاده من بعده في القاهرة كبارا معظمين، يبايع لهم كل سلطان مملوكي، ولا يملكون من أمر الحكم شيئا، ووقر في الناس أن الخلافة العباسية انتقلت إلى مصر وبقيت فيها حتى آخر دولة المماليك.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان لهذا الإقرار أثر عملي في ميزان الدولة: فقد صارت بيعة الخليفة حجة يحتج بها كل سلطان جديد أمام الجند والعلماء وأهل البلاد، وصارت مصر في نظر مسلمي المشرق والمغرب كرسي الخلافة بعد بغداد، وتيسر لسلاطينها عقد الأيمان والعهود مع ملوك الأطراف باسم الخليفة. كما صار للقضاة والفقهاء في القاهرة مقام يلوح بمقام بغداد في سالف الدهر، فقصدها العلماء وارتفع شأن مدارسها.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالمستنصر ورحلة بغداد الخاطئة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان خروج المستنصر إلى العراق أول اختبار لفكرة استعادة بغداد، وقد كشف هشاشتها. فقد خرج الخليفة في جمع من المماليك والعرب وأهل البلاد ممن التحق به في الطريق، وبلغ الأنبار ولم تكن قوته على قدر جيوش المغول التي تحف العراق. فلقيته كتيبة مغولية صغيرة نسبة إلى ما توقع، فانكشف الجمع وقتل الخليفة في المعركة.\u003c/p\u003e\u003cp class=\"ap\"\u003eتعلم بيبرس من هذه الهزيمة درسا ما نسيه: أن الخليفة ورقة شرعية لا يقام على متونه حرب. فمن بعدها أقر الخلفاء في القاهرة إقرار التشريف لا إقرار التدبير، وبقي اسم الخلافة قويا في الأسماع ضعيفا في الواقع. وهذه الموازنة هي التي حفظت للبيتين معا مقامهما: بيت العباس في الجلال، وبيت المماليك في السلطان.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eمكانة الخلفاء في دويلة القاهرة\u003c/h4\u003e\u003cp class=\"ap\"\u003eعاش الخلفاء العباسيون في القاهرة في دور أنزلهم الله بها من الرحح ما شاء، فأجرت عليهم الدولة رواتب معلومة من بيت المال، وأقطعتهم إقطاعات ينبوع منها، وأقامت لهم حلة بجوار القلعة. وكان السلاطين يزورونهم في الأعياد ويعتنون بمظهر تعظيمهم أمام الناس، من خطبة وطرح خلع وأعلام سود على رسم بني العباس.\u003c/p\u003e\u003cp class=\"ap\"\u003eولم يكن هذا كله بلا ثمن سياسي، فالخليفة الذي يبايع السلطان يعطيه في مقابل الإكرام سندا شرعيا لكل ما يفععه من خلع وقتل وتصرف في الأموال. ولهذا كان السلاطين يحرصون كل الحرص على أن تكون البيعة في أول عهدهم، حتى إذا اعتذر معتذر عن خروجهم لم يكن عنده في الشرع حجة.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسنة إقرار الخلافة\u003c/b\u003e\u003cspan\u003e٦٥٩هـ الموافق ١٢٦١م\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالخليفة الأول بالقاهرة\u003c/b\u003e\u003cspan\u003eأبو القاسم أحمد المستنصر بالله\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمقتل المستنصر\u003c/b\u003e\u003cspan\u003eقرب الأنبار في ذي القعدة سنة ٦٥٩هـ\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالخليفة الثاني\u003c/b\u003e\u003cspan\u003eأبو العباس أحمد الحاكم بأمر الله\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمدة الخلافة بالقاهرة\u003c/b\u003e\u003cspan\u003eقرنان ونصف قرن حتى سنة ١٥١٧م\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالخليفة\u003c/th\u003e\u003cth\u003eسنة البيعة في القاهرة\u003c/th\u003e\u003cth\u003eأبرز ما في عهده\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالمستنصر بالله\u003c/td\u003e\u003ctd\u003e٦٥٩هـ الموافق ١٢٦١م\u003c/td\u003e\u003ctd\u003eأول خليفة بمصر، خرج لاسترداد بغداد فقتله المغول قرب الأنبار\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالحاكم بأمر الله\u003c/td\u003e\u003ctd\u003eسنة ١٢٦٢م\u003c/td\u003e\u003ctd\u003eاستقرت الخلافة بمقامه في القاهرة ودامت في عقبه\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمستكفي بالله\u003c/td\u003e\u003ctd\u003eسنة ١٣٠٢م تقريبا\u003c/td\u003e\u003ctd\u003eبايع السلاطين المماليك ودامت في عهده الأيام الطويلة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالواثق بالله\u003c/td\u003e\u003ctd\u003eفي أواسط القرن الثامن\u003c/td\u003e\u003ctd\u003eشهد أيام قلاوون وبنيه في البيعة والخلع\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمتوكل على الله\u003c/td\u003e\u003ctd\u003eحتى سنة ١٥١٧م\u003c/td\u003e\u003ctd\u003eآخر خلفاء القاهرة، نقله العثمانيون إلى القسطنطينية\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eبايع بيبرس للخليفة المستنصر على الخلافة كما يبايع الأمراء، ثم قام الخليفة فبايعه على السلطنة، فاجتمع للدولة سلطان وخليفة في مجلس واحد.\u003c/p\u003e\u003ccite\u003eمما نقلته كتب التاريخ عن مجلس القلعة سنة ٦٥٩هـ\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eإقرار الخلافة العباسية بالقاهرة سنة ١٢٦١م كان أذكى ما فعله بيبرس في بناء الدولة: أعطى المماليك شرعية ما كانوا يملكونها، وأعطى مصر مقام بغداد في قلوب مسلمي الأرض. وبقيت هذه الخلافة عونا لكل سلطان حتى انتهت الدولة نفسها.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"state-institutions","n":"دواوين الدولة وأراضيها","ic":"🏦","part":"القسم الثالث: بيبرس وتأسيس الدولة","h":"\u003carticle class=\"ch3\" id=\"state-institutions\" data-toc=\"دواوين الدولة وأراضيها\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e3.3\u003c/span\u003e\n          \u003ch3\u003e🏦 دواوين الدولة وأراضيها\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eد\u003c/span\u003eولة المماليك لم تكن عصبة أمراء يحكم كل واحد ما تحت يده، بل كانت دولة دواوين ودفاتر: ديوان جند يقيد الفارس وفرسه ورزقه، وديوان مال يحصر الأرض والخراج، ونظام إقطاع يجعل الأرض حقا لمن يخدم لا لمن يرث.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eقام جهاز الدولة المملوكية على دواوين ثلاثة كبرى: ديوان الجند، وديوان المال، وديوان الإنشاء. فأما ديوان الجند فكان يقيد فيه كل فارس من فرسان الدولة باسمه وصفته ومقدار إقطاعه وجرايته، ولا يستحق أحد عطاء إلا إذا كان اسمه في الدفتر، وكانت تعرض أحوال الجند على السلطان في مواسم معلومة فيقف على ما في الرجال من نقص وزيادة، ويوقف من قصر منهم على سببه ويعاقب أو يعذر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما ديوان المال فكان يحصر واردات الدولة من الخراج والتجارة والجمارك والميراث، ويحدد ما يصرف في الأعطيات والخلع والعمارة، وكان له دفاتر مفصلة في كل إقليم من أقاليم مصر والشام. وأما ديوان الإنشاء فكان يكتب إلي السلطان مراسلاته إلى الملوك والأمراء والولاة، ويصوغ ما يصدر عن الدولة من عهود وأمان، وكان يعرف بالطرة لأن صاحبه يكتب الطرة أعني العنوان.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان أهم ما في النظام المالي نظام الإقطاع، وفيه قسمت الأرض قسمين كبيرين: إقطاع استغلال يمنح للأمير أو الفارس فيقبض خراجه مدة خدمته ولا يملك رقبة الأرض، وإقطاع استثناء للسلطان وأهله. فإذا مات المقطع أو خلع عاد إقطاعه إلى الدولة فتمنحه لغيره، وبهذا ظلت الأرض كلها في يد الدولة تصرفها لمن تريد في مقابل الخدمة، فلم تنشأ في مصر والشام طبقة ملاك كبار يورثون الأرض ويستقلون بها عن السلطان كما وقع في دول كثيرة قبلهم وبعدهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت مراتب الجند على درجات: فمنهم المماليك السلطانية وهم أشرفهم وأعلاهم عطاء، ومنهم أمراء الطبلخانات وأمراء العشرات وأمراء الخمسات، ومنهم الجنود الحلقة وهم فرسان القاهرة المقمطون في الدواوين. ولكل مرتبة جراية وإقطاع معلوم، والترقية من مرتبة إلى مرتبة تكون بعرض الحال على السلطان وأمره، لا بقدم السن ولا بمحبة الأمير وحدها. وكان الفارس يعرف في أي دفتر اسمه وما الذي يلزمه ليُنقل إلى دفتر أعلى منه، فصار الترقي في هذه الدولة غاية يتجه إليها صاحبها بالجد والخدمة والسعي بين الغزوات.\u003c/p\u003e\u003cp class=\"ap\"\u003eوضبط الدولة الشرعي بيد القضاة، فعين في القاهرة قاضيا للقضاة من كل مذهب من المذاهب الأربعة، وجعل لهم حظيرة في الأحكام والوقوف والفرائض. وكان القاضي يجلس للفصل بين الناس في مجالس معلومة، ويرفع إلى السلطان ما فيه معنى السياسة من الأمور. وبهذا التوازن بين ديوان الجند وديوان المال وحلقة القضاء صارت للدولة حياة يومية منتظمة تسير إذا غاب السلطان وتستقيم إذا مرض.\u003c/p\u003e\u003cp class=\"ap\"\u003eولم تكن هذه الدواوين اختراعا مملوكيا خالصا، بل ورثتها الدولة المملوكية عن الدولة الأيوبية وعن دواوين بغداد قبلها، لكن الذي فعله بيبرس وقلاوون من بعده أنها أعادوا ترتيبها بما يوافق واقع الجند المماليكي، فكثرت دفاتر الأسماء وضبطت مواسم العرض، وصارت الدولة أعرف بأموالها ورجالها من كل دولة سبقتها في مصر، حتى قال كاتب الدواوين في القاهرة قولته المشهورة إن الخزانة تعرف عدد الخيل في الإسطبل أكثر مما يعرف صاحبها.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالإقطاع المملوكي في صورته الصحيحة\u003c/h4\u003e\u003cp class=\"ap\"\u003eأشاع الناس عن الإقطاع المملوكي أنه تملك للأرض، والصحيح أنه حق خراج مؤقت. فالأمير الذي يقطع إقطاعا لا يملك الأرض ولا يبيعها ولا يورثها، وإنما يقبض فائض خراجها مدة إقطاعه مقابل أن يقوم بخدمة عسكرية معلومة، من تجهيز فرسانه ووجاهة حربه. فإذا انقطعت الخدمة انقطع الإقطاع، وإذا تأخر في واجباته نقص من إقطاعه بقدر ما قصر من خدمته.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا النظام عدل ومصلحة معا: فالدولة لا تفرغ خزانتها في رواتب نقدية بل منح الأرض عن بعد، والفارس يكفل لنفسه عيشا من إقطاعه بلا انتظار عطاء يتأخر. غير أن نظام الإقطاع كان ميدان محاباة أيضا، فيوسع الإقطاع لمن رضي عنه السلطان ويضيق على من سخط عليه، فصار الإقطاع في عرف الأمراء مقياس القرب من صاحب القلعة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالعرضة ومواسم الجند\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت للجند مواسم يجتمعون فيها للعرض أمام السلطان أو من ينيبه، فيقف الفرسان بطبقاتهم ومعهم خيلهم وسلاحهم، فيرى السلطان بعينه حال كل جند. وفي هذه العرضة تعطى الأعطيات وتعقد الترقيات وتنقل الأسماء من دفتر إلى دفتر، وكان بعض السلاطين يشدد في العرض حتى يعرف الفارس الواحد باسمه.\u003c/p\u003e\u003cp class=\"ap\"\u003eولم تكن العرضة شكلا فحسب، بل كانت يوما تنكشف فيه أسرار الدولة. فمن قصر في سلاحه أو خيله ظهر أمره، ومن كثر مماليكه على قدر جداته عرف الناس أنه في منزلة عند السلطان. ولهذا كانت الأيام التي تسبق العرضة أيام تنافس في أسواق الخيل والسلاح بالقاهرة، ويوم العرضة نفسه كان مشهدا تشهده القاهرة في مجلس السلطان بحضرته وأمرائه وقضاته.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالدواوين الكبرى\u003c/b\u003e\u003cspan\u003eديوان الجند وديوان المال وديوان الإنشاء\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eطبيعة الإقطاع\u003c/b\u003e\u003cspan\u003eحق خراج مؤقت في مقابل الخدمة لا تملك للأرض\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eقضاء الدولة\u003c/b\u003e\u003cspan\u003eقضاة للقضاة من المذاهب الأربعة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأعلى مراتب الجند\u003c/b\u003e\u003cspan\u003eالمماليك السلطانية ثم أمراء الطبلخانات\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمواسم العرض\u003c/b\u003e\u003cspan\u003eمجالس معلومة تعرض فيها أحوال الخيل والسلاح\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالديوان\u003c/th\u003e\u003cth\u003eعمله\u003c/th\u003e\u003cth\u003eأهم دفاتره\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eديوان الجند\u003c/td\u003e\u003ctd\u003eقيد الفرسان وأعطياتهم وترقياتهم\u003c/td\u003e\u003ctd\u003eدفاتر الأسماء والإقطاعات\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eديوان المال\u003c/td\u003e\u003ctd\u003eحصر الواردات والمصروفات وأموال الأقاليم\u003c/td\u003e\u003ctd\u003eدفاتر الخراج والجاميك والخاص\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eديوان الإنشاء\u003c/td\u003e\u003ctd\u003eكتب المراسلات والعهود والأمان\u003c/td\u003e\u003ctd\u003eسجل المراسلات والطرة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eقضاء القضاة\u003c/td\u003e\u003ctd\u003eالشرع في الأحكام والوقوف والفرائض\u003c/td\u003e\u003ctd\u003eسجلات الأحكام والوقاف\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eلا عطاء إلا لمن اسمه في الدفتر، ولا إقطاع إلا بيد السلطان، فمن خرج عن الطاعة محي اسمه وضُم إقطاعه إلى بيت المال.\u003c/p\u003e\u003ccite\u003eمن قواعد الدواوين المملوكية فيما نقلته كتب الحوليات\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eدواوين الدولة المملوكية جعلت من مصر والشام وحدة إدارية محكمة: أرض محصورة، وجند مقيدون بالدفاتر، ومال له وارد ومصروف معلوم. هذا الجهاز هو الذي حمل الدولة على كتفيها قرنين كاملين مهما تغير السلاطين.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"coastal-reconquest","n":"حملة الساحل واستعادة أنطاكية وطرابلس","ic":"⚔️","part":"القسم الثالث: بيبرس وتأسيس الدولة","h":"\u003carticle class=\"ch3\" id=\"coastal-reconquest\" data-toc=\"حملة الساحل واستعادة أنطاكية وطرابلس\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e3.4\u003c/span\u003e\n          \u003ch3\u003e⚔️ حملة الساحل واستعادة أنطاكية وطرابلس\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eل\u003c/span\u003eم يكن بيبرس يقاتل الفرنج في معركة فاصلة واحدة، بل كان يقطع أصابعهم ثغرا ثغرا: قلعة هنا في شهر، ومدينة هناك في موسم، حتى بقيت عكا ومواضع يسيرة تنتظر من يقضي عليها بعد سنته بقليل.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eبعد أن ثبتت قدم بيبرس في مصر وجه عنايته إلى ساحل الشام، وكانت فيه إمارات الفرنج من عكا إلى أنطاكية قد عادت تتنفس بعد أن كاد يجهز عليها المغول. فسار بيبرس في سنته الأولى إلى غزة وكسروان، ثم توجه سنة ٦٦٣هـ الموافق ١٢٦٥م إلى قيسارية فحاصرها وأخذها بالسيف وهدم أسوارها، ثم سار في العام نفسه إلى أرسوف ففتحها بعد حصار وضرب منجنيق، وصارت لفرنج الشام يد ساقطة على الساحل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سنة ٦٦٦هـ الموافق ١٢٦٨م وقع الحدث الأكبر: سار بيبرس إلى أنطاكية، وكانت من أقدم إمارات الفرنج في الشام وأغناها، فحاصرها أياما يسيرة ثم اقتحمها في أول صفر، فقتل وأسر وغنم، وكان سقوطها صدمة في قلوب أوروبا كلها. ثم لم يمض إلا زمن يسير حتى جاءه أمير طرابلس يطلب الأمان والصلح على شرط، فصار في جملة من يطيع الدولة من أمراء الساحل، وصارت طرابلس بعد أن كانت ثغرا مستعصيا تؤدي ما يؤديه التابع المطيع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوهذه الحملات لم تكن غارات عابرة، بل كان بيبرس إذا أخذ ثغا هدم أسواره وقلعته حتى لا يعود الفرنج إليه أبدا، ونقل ما فيه من آلة وعدة إلى مصر. وكان يوقت حملاته بمواسم تخدمه: يخرج في أول الربيع حين يكثر العلف، ويتخير من الثغور ما بين الفرنج فيه خصومة فيستعدي بعضهم على بعض، فكانت السياسة تفتح له ما تفتحه الفروسية، وربما انتظر الشهور وهو يعالج خصومة بين أميرين فرنجيين حتى إذا تفاقمت سار إلى ثغرهما في موسم اشتغالهما به.\u003c/p\u003e\u003cp class=\"ap\"\u003eولم ينس بيبرس في هذا كله المغول في الداخل، فكان إذا خرج إلى الساحل ترك على حدود حلب وحمص من يحفظ الثغر الشمالي، وراسل أمراء الأناضول وسلاجكة الروم يثبت من معه ويخيف من خالفه. وبهذا التوازن بين جبهتي الفرنج والمغول أدار بيبرس حربه سنته كلها، فلم يلق جيشا مغوليا كبيرا في أرضه ولا نجح الفرنج في استرجاع ما أخذ منهم، مع أن كلا من الفريقين كان يستطيع أن يضر لو انتبه إلى فرصة سانحة.\u003c/p\u003e\u003cp class=\"ap\"\u003eولما توفي بيبرس سنة ١٢٧٧م كانت عكا وصور وبيروت وعتليت وأمواس يسيرة هي كل ما بقي للفرنج من ساحل الشام، محاطة بدولة قوية تنتظر الفرصة. وما جاءت الفرصة إلا في عهد قلاوون والأشرف خليل، فأكملوا ما بدأه بيبرس بسقوط عكا سنة ١٢٩٠م ونهاية الوجود الفرنجي في الشام، فصار ما بناه بيبرس في عشر سنين طريقا ممهدا لمن جاء بعده إلى النهاية التي أرادها للساحل كله.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eسقوط أنطاكية في يومين\u003c/h4\u003e\u003cp class=\"ap\"\u003eأنطاكية كانت من أقدم ما أقامه الفرنج في الشام منذ الحملة الأولى، وكانت غنية عامرة محصنة، يظن أهلها أن أسوارها تحفظها من كل قادم. غير أن بيبرس وصلها في أول صفر سنة ٦٦٦هـ وقد سبقه إليها خبره، فما ثبت أهلها طويلا، واقتحمها الجيش في وقت يسير ذكرته الكتب بيومين وأيام يسيرة بعدها.\u003c/p\u003e\u003cp class=\"ap\"\u003eكان لسقوط أنطاكية دوي بعيد: فقد كتب كتبة أوروبا فيها المراثي، وبعث بوهيموند أميرها الذي كان غائبا إلى الملوك يستنفرهم، فلم يجد إلا وعودا وخطب لم تتحقق في حقيقة الأمر. وعرف أمراء الساحل الباقون أن الثغر الذي لا يحميه جيش من ورائه يصير إلى ما صارت إليه أنطاكية، فسارع كثير منهم إلى الصلح مع بيبرس قبل أن يسير إليهم، وصاروا يدفعون له ما يطلب من مال وأسطول في جملة من يطيعون الدولة وهم يرون بأعينهم ما يفعل بمن يأبى.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eلماذا لم يسقط بيبرس عكا\u003c/h4\u003e\u003cp class=\"ap\"\u003eقد يسأل سائل: إذا كان بيبرس قد أخذ قيسارية وأرسوف وأنطاكية، فما باله لم يسارع إلى عكا وهي رأس الفرنج في الشام؟ والجواب في حساباته لا في قدرته: كانت عكا مدينة كبيرة محصنة يسندها البحر، وأهلها يعلمون أن لا نجاة لهم إلا بالثبوت فيقاتلون قتال من لا يرجو غيرها، وأسطول الفرنج كان يمنع الحصار البحري الكامل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان بيبرس يقدم تقتيل الثغور الصغيرة على خوض حصار طويل يستهلك جيشه ويعرض ظهره للمغول. فترك عكا لمن بعده في أوانه، وحصر نفسه فيما يقدر عليه في موسمه، وهذه من أخص خصائص سياسته العسكرية: أن يأخذ المتاح وينتظر الصعب حتى ينضج، وقد أثبتت الأيام بعد نصف قرن أن حسابه كان صحيحا حين سقطت عكا في موسمها الذي نضج.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eقيسارية وأرسوف\u003c/b\u003e\u003cspan\u003eفتحتا سنة ١٢٦٥م في حملة واحدة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأنطاكية\u003c/b\u003e\u003cspan\u003eسقطت في صفر سنة ٦٦٦هـ الموافق ١٢٦٨م\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eما بقي للفرنج عند موت بيبرس\u003c/b\u003e\u003cspan\u003eعكا وصور وبيروت وعتليت وثغور يسيرة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eطريقة بيبرس في الثغور\u003c/b\u003e\u003cspan\u003eهدم الأسوار حتى لا يعود الفرنج إليها\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eنهاية الوجود الفرنجي\u003c/b\u003e\u003cspan\u003eسقوط عكا سنة ١٢٩٠م على يد الأشرف خليل\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالثغر\u003c/th\u003e\u003cth\u003eسنة الفتح\u003c/th\u003e\u003cth\u003eطريقة أخذه\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eقيسارية\u003c/td\u003e\u003ctd\u003eسنة ١٢٦٥م\u003c/td\u003e\u003ctd\u003eحصار واقتحام ثم هدم الأسوار\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eأرسوف\u003c/td\u003e\u003ctd\u003eسنة ١٢٦٥م\u003c/td\u003e\u003ctd\u003eحصار وضرب منجنيق حتى الصلح والفتح\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eصفد\u003c/td\u003e\u003ctd\u003eسنة ١٢٦٦م\u003c/td\u003e\u003ctd\u003eحصار طويل ثم تسليم بأمان\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eأنطاكية\u003c/td\u003e\u003ctd\u003eسنة ١٢٦٨م\u003c/td\u003e\u003ctd\u003eاقتحام سريع في أيام يسيرة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eيافا\u003c/td\u003e\u003ctd\u003eسنة ١٢٦٨م تقريبا\u003c/td\u003e\u003ctd\u003eتخريب بعد جلاء أهلها\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eطرابلس\u003c/td\u003e\u003ctd\u003eبعد أنطاكية\u003c/td\u003e\u003ctd\u003eصلح وامتثال من أميرها\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eكان بيبرس إذا ظفر بثغر من ثغور الفرنج لم يترك فيه حجرا على حجر، حتى لا يعودوا إليه ببناء، ونقل عدة البلد إلى مصر.\u003c/p\u003e\u003ccite\u003eمن صور سياسة بيبرس في كتب الحوليات الشامية\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eحملة الساحل في عهد بيبرس قلبت خريطة الشام في عشر سنين: ذهبت قيسارية وأرسوف وأنطاكية وصفد، ولم يبق للفرنج إلا عكا وما جاورها ينتظر. وهذه الحملات هي التي مهدت لسقوط عكا النهائي سنة ١٢٩٠م.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-4","n":"القسم الرابع: قلاوون وسقوط عكا وأوج الدولة","ic":"","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-4\" style=\"--c:#0F6B5C\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🏔️\u003c/div\u003e\n      \u003ch2\u003eالقسم الرابع: قلاوون وسقوط عكا وأوج الدولة\u003c/h2\u003e\n      \u003cp\u003eتجري في هذه الفصول مرحلة الكمال: سلطنة الملك المنصور قلاوون وحروبه مع المغول، ثم حصار عكا وسقوطها سنة ١٢٩١م، ثم أيام الملك الناصر محمد حتى بلغت الدولة أوج قوتها وأمنها. في هذه العقود الثلاثة اكتمل للدولة المملوكية ما بدأه بيبرس: سلطان يعمر طويلا، وجيش يهزم المغول مرة بعد مرة، وساحل يخلو من الفرنج تماما.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#qalawun-consolidation\"\u003eقلاوون: تصفية الدولة وتثبيت الملك\u003c/a\u003e\u003ca href=\"#qalawun-reconquest\"\u003eاستعادة الشام وصد المغول\u003c/a\u003e\u003ca href=\"#fall-of-acre\"\u003eسقوط عكا ونهاية الإمارات الصليبية\u003c/a\u003e\u003ca href=\"#nasir-muhammad\"\u003eالملك الناصر محمد وأوج الدولة\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"qalawun-consolidation","n":"قلاوون: تصفية الدولة وتثبيت الملك","ic":"🐲","part":"القسم الرابع: قلاوون وسقوط عكا وأوج الدولة","h":"\u003carticle class=\"ch3\" id=\"qalawun-consolidation\" data-toc=\"قلاوون: تصفية الدولة وتثبيت الملك\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e4.1\u003c/span\u003e\n          \u003ch3\u003e🐲 قلاوون: تصفية الدولة وتثبيت الملك\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eج\u003c/span\u003eاء قلاوون إلى السلطنة بعد سنوات قلق بعد موت بيبرس، فقضى عامه الأول في تصفية من ينازعه، وعامه الأخير في بناء ما لا ينازعه فيه أحد: جيش محترف وأسطول دائم وقلاع تحفظ الثغور. حين مات سنة ١٢٩٠م كان قد ترك الدولة أرسخ ما كانت عليه في تاريخها كله.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان سيف الدين قلاوون الفلكي من أصل قفجاقيا، بيع في شبابه فتملكه الصالح أيوب ثم اعتقه وصار من كبار مماليك البيت، وشهد عين جالوت أميرا تحت قيادة قطز وبيبرس. ولما مات بيبرس سنة ١٢٧٧م تولى من بعده ولده بركة خان ثم سلار وخديد وهم صبيان في يد الأمراء، فتنازع الأتابكة والوزراء السلطة وراءهم سنوات، حتى استقل قلاوون بالأمر سنة ١٢٧٩م وبايعه الأمراء سلطانا بعد خلع آخر صبيان البيت البري، ولقب بالملك المنصور سيف الدين.\u003c/p\u003e\u003cp class=\"ap\"\u003eلم يكن طريقه إلى الحكم سهلا، فقد كان في الدولة بيتان كبيران: مماليك بيبرس ومماليك قلاوون نفسه، وكان أمراء بيبرس يرون أن الملك حق في ولد سيدهم. فسار قلاوون فيهم سيرة الحازم: أقر المطمئن منهم في إقطاعه، وأخرج المتسلطين إلى الشام ثم قتل منهم من ظن أن طمعه لا ينطفئ، وأجلس ولده الصالح علي في ولاية العهد ليبقى الملك في بيته ويسكت من يقول بولاية بيت بيبرس.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم بنى قلاوون جهازا عسكريا جديدا على أساس مملوكيته الذين اشتراهم بنفسه وجعلهم أعزز جنده، حتى صار مماليكه البرجية والمنصورية قوة تضاهي مماليك بيبرس في عددها وعدتها. وأعاد تنظيم الأعطيات فأقر الجند على أن رواتبهم تأتي في مواعيدها من ديوان المال، وتتبع عجوز الخراج في الأقاليم بنفسه حتى عرف أمراء البلاد أن السلطان يقرأ الدفاتر كما يقرؤونها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأقام قلاوون أسطولا مصريا دائما بعد أن كانت السفن تجهز في المواسم، فبنى التراه الحربية في الإسكندرية وجعل للأسطول أميرا وقوادا وأعطيات ثابتة، وصار للدولة حضور بحري دائم في مياه الشام وقبرص يخيف الفرنج ويحفظ السواحل. كما بنى في عهده قلعة المنصورية قرب القاهرة ومدارس وبيمارستانا عظيما بدير النحاس عرف بالبيمارستان المنصوري، فجمع بين عدل السيف وعدل العمران في عرف أهل زمانه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوواجه قلاوون في سنته الأخيرة الحدث الذي كان ينتظره الجميع: التحرك الصليبي الكبير في عكا. فقد وصلت حملة من أوروبا بقيادة هنري الثاني ملك قبرص والإنجليز إلى الساحل، وأحدث الفرنج في عكا مقتلة في تجار المسلمين، فاستعد قلاوون للخروج إليهم وجرت العزائم، غير أنه مرض في طريقه إلى الشام ومات في مصر في صحيح سنة ٦٨٩هـ الموافق نوفمبر سنة ١٢٩٠م، وحيل بينه وبين عكا بأيام.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eبيمارستان المنصوري: عدل غير السيف\u003c/h4\u003e\u003cp class=\"ap\"\u003eأنشأ قلاوون في قلب القاهرة بيمارستانا ما زال بعضه قائما إلى اليوم، جعل فيه أطباء للعين والجراح والأمراض الباطنة، ووقف عليه أوقافا تجري أرباحها على مرضاه، وكان يعالج فيه الغني والفقير بلا فرق في بذل الدواء والغذاء. وكان السلطان يشترط على أطبائه شروطا في الإقامة عند المرضى ليلا ونهارا، فهو أول ما عرفته مصر من ملازمات الأطباء لمرضى الدولة.\u003c/p\u003e\u003cp class=\"ap\"\u003eولم يكن البيمارستان وحده، فقد بنى قلاوون بين القصرين مدرسة تجمع المذاهب الأربعة ودرس فيها كبار علماء العصر، وأوقف على طلبتها ما يكفيهم. وبين هذا البناء وذاك رسخت في القاهرة صورة السلطان الذي يقيم للعلم والطب والدين أسسا مع سيفه، فصارت عمائر قلاوون مدرسة تعلم منها من جاء بعده من سلاطين الدولة في مصر والشام.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eحرب الأمراء على قلاوون\u003c/h4\u003e\u003cp class=\"ap\"\u003eتعاقبت على قلاوون في سلطنته محاولات انقلاب من كبار الأمراء، أشهرها ما كان من سنقر الأشقر نائب الشام الذي جمع حوله من رأى خلع المنصور، فسار إليه قلاوون سنة ١٢٨٠م فهزمه وحاصر مواضعه حتى استسلم، فعفا عنه وأرسله معززا إلى القلعة عفوا أثنى عليه الناس، ثم عاد سنقر فحقد على السلطان حتى مات في حبسه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذه الحروب درس بقي مع الدولة طويلا: أن نائب الشام في دمشق أخطر منافس لسلطان القاهرة، لأنه يقعد في مدينة كبيرة عليها مال وجند وثغور. فصار قلاوون يتخار لنائبه في الشام من يثق به ثقة كاملة ويكاتبه كل يوم، وجعل في حلب ودمشق وصفد وحماة حاميات تتبع القلعة مباشرة، فصارت الشام كلها بعد سنوات قلائل تحت عين السلطان كما مصر تحت عينه.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسنوات السلطنة\u003c/b\u003e\u003cspan\u003eمن ١٢٧٩م إلى وفاته في نوفمبر ١٢٩٠م\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eلقبه\u003c/b\u003e\u003cspan\u003eالملك المنصور سيف الدين قلاوون\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأشهر عمائره\u003c/b\u003e\u003cspan\u003eالبيمارستان المنصوري والمدرسة بين القصرين\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأسطوله\u003c/b\u003e\u003cspan\u003eأسطول دائم في الإسكندرية بأمير وأعطيات ثابتة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eولداه اللذان حكما بعده\u003c/b\u003e\u003cspan\u003eالصالح علي والأشرف خليل\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالنتيجة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eتولية قلاوون بعد سنوات الصبيان\u003c/td\u003e\u003ctd\u003e١٢٧٩م\u003c/td\u003e\u003ctd\u003eاستقرار السلطنة في بيته\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eهزيمة سنقر الأشقر\u003c/td\u003e\u003ctd\u003e١٢٨٠م تقريبا\u003c/td\u003e\u003ctd\u003eضبط الشام وإقرار نواب الثقة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eمعركة حمص الثانية\u003c/td\u003e\u003ctd\u003e١٢٨١م\u003c/td\u003e\u003ctd\u003eهزيمة المغول وإبعادهم عن الشام\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eفتح المرقب\u003c/td\u003e\u003ctd\u003e١٢٨٥م\u003c/td\u003e\u003ctd\u003eأهم قلعة فرنجية في الساحل الشمالي تسقط\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالاستعداد لحصار عكا\u003c/td\u003e\u003ctd\u003e١٢٩٠م\u003c/td\u003e\u003ctd\u003eموت قلاوون قبل الخروج بأيام\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eكان المنصور قلاوون إذا ركب في موكبه هابه من رآه، وإذا جلس في داره أنس به جلساؤه، وكان مع عظم ملكه سليم الصدر يطعم الطعام ويقري الضيف.\u003c/p\u003e\u003ccite\u003eمن تراجم المنصور قلاوون في كتب الحوليات\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eقلاوون هو الذي أخرج دولة المماليك من سنوات القلق بعد بيبرس إلى طور الاستقرار: صفى المنازعين وبنى جيشا وأسطولا وعمّر القاهرة. وحين مات سنة ١٢٩٠م ترك لابنه الأشرف جهازا جاهزا لإنهاء ما بقي للفرنج في الشام.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"qalawun-reconquest","n":"استعادة الشام وصد المغول","ic":"⚔️","part":"القسم الرابع: قلاوون وسقوط عكا وأوج الدولة","h":"\u003carticle class=\"ch3\" id=\"qalawun-reconquest\" data-toc=\"استعادة الشام وصد المغول\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e4.2\u003c/span\u003e\n          \u003ch3\u003e⚔️ استعادة الشام وصد المغول\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eب\u003c/span\u003eين سنتي ١٢٨١م و١٢٩١م خاضت الدولة أمرين معا: هزيمة المغول في حمص وحماة، وابتلاع ما بقي للفرنج على الساحل من قلاع. ولم يكن هذا ليحدث لو لم يبن قلاوون جيشا يقاتل في جبهتين في موسم واحد.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان خطر المغول قائما في كل سنة، فبعد عين جالوت عاد المغود للزحف على الشام مرات. وفي سنة ١٢٨١م جاءت من العراق جيوش كبيرة بقيادة منكوتمور أخي أبغا في نحو ثلاثين ألف مقاتل ومعه جند اليلخانية ومن انضم إليه من أمراء الأناضول ورجالة الأرمن، فسار قلاوون إليه بجند مصر والشام والتقيا قرب حمص في رجب سنة ٦٨٠هـ الموافق أكتوبر ١٢٨١م في ميدان بين مدينة حمص والبحيرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eكانت المعركة من أشرس ما جرى بين المماليك والمغول: اقتتل الفريقان من بكرة النهار إلى العصر، وثبت ميسرة المسلمين حتى قتل قائدها المظفر سيف الدين قلج ألبي، ثم حمل قلاوون بنفسه في قلب الجيش فثقل على المغول ثقل الجبال، فانكشفوا آخر النهار وانهزموا إلى ما وراء الفرات بعد أن أثخن الجرح في الفريقين جميعا. وكانت حمص الثانية آخر زحف مغولي كبير على الشام في عهد قلاوون، فقد اشتغل المغود بعدا بحربهم مع خان القبيلة الذهبية في الشمال.\u003c/p\u003e\u003cp class=\"ap\"\u003eولما أمن قلاوون ظهره من جهة العراق وجه قوته إلى الساحل، فأخذ سنة ١٢٨٥م قلعة المرقب الحصينة من يد فرسان الداوية بعد حصار، وكانت من أمنع قلاعهم، ثم تلتها اللاذقية وغيرها من الثغور الصغيرة حتى لم يبق للفرنج في شمال الشام إلا طرابلس وعكا وما حولهما. ثم سار سنة ١٢٨٩م إلى طرابلس فحاصرها وأخذها في سبع بقين من أبريل، وهدم أسوارها وأمر ببناء طرابلس الجديدة في موضعها الحالي على الساحل.\u003c/p\u003e\u003cp class=\"ap\"\u003eولم يكن قلاوون يعمل في الساحل غافلا عن المغول، فقد عقد مع اليلخان أحمد تكودار سنة ١٢٨٢م صلحا مهنا لسنوات أراح الشام، ثم تغير أمر اليلخانات بعد ذلك وعادت الغارات على الثغور الشمالية فكان يصدها بجند حلب وحمص. وكان يراسل في الوقت نفسه ملوك أوروبا وقبرص ويلعب على خصومة الإنجليز والفرنسيين في الساحل، فمنح امتيازات تجارية للبندقية وقبالهما ليعطلها عن نصرة الفرنج في عكا. وهكذا صار الساحل في آخر عهده كالثمرة الناضجة التي لا تحتاج إلا يد تقطفها، ولم يقطفها قلاوون بنفسه لأن الموت عاجله في نوفمبر سنة ١٢٩٠م، وإنما قطفها ابنه الأشرف من بعده في أول سلطنته في موسم واحد من العام التالي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوبهذا الترتيب وجد الأشرف خليل بن قلاوون عند موت أبيه سنة ١٢٩٠م ميدانا ممهدا: الشام كلها في يد الدولة إلا عكا وصور وبيروت وعتليت وأرزيف، والمغول مشغولون بأنفسهم بعد صلح سنوات، وأسطول عكا قد ضعف بوفاة الإمدادات الأوروبية الكبرى. فما كان منه إلا أن خرج في أول سلطنته إلى عكا ليقضي على ما بقي من مملكة بيت المقدس في أرضها، وليغلق آخر صفحة من صفحات الحروب الصليبية في الشام.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eحمص الثانية: المعركة المنسية\u003c/h4\u003e\u003cp class=\"ap\"\u003eيقف الناس عند عين جالوت وينسون حمص الثانية، مع أن الفرق بينهما في الأثر قليل. ففي عين جالوت كانت الغرة والدهشة حليف المماليك، أما في حمص الثانية سنة ١٢٨١م فقد واجهوا جيشا مغوليا محترفا يعرف طرائقهم وقد استعد لهم، ومع ذلك هزموه في ميدان مفتوح قتالا صريحا من الصباح إلى الليل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان لثبات ميسرة المسلمين ومقتل قائدها وهم صامدون أثر في نفوس الجند لم ينقطع، فقد رأوا أن الجند الذي يموت قائده ولا ينسحب جند لا يهزم بسهولة. وروى أهل الشام أن ميادين حمص ظلت أياما والقتلى فيها لم يدفنوا من كثرتهم، وأن قلاوون أمر بجمع الشهداء ودفنهم في مقابر أعدت لهم.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eسقوط طرابلس ونقل المدينة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت طرابلس آخر ما بقي من إمارة الفرنج في الشمال، وقد صمدت قرونا بعد أن أنشأها الفرنج في أوائل حملاتهم. ولما سار إليها قلاوون سنة ١٢٨٩م لم تجد من أوروبا نجدة تذكر، فسقطت بعد حصار واقتحام في أبريل، وكان سقوطها نهاية الوجود الفرنجي في شمال الشام بعد قرنين وثلث.\u003c/p\u003e\u003cp class=\"ap\"\u003eوعمل قلاوون بعد الفتح عملا يدل على نظرته: هدم ما بقي من أسوار المدينة القديمة وأمر بعمارة مدينة جديدة على الساحل في الموضع الذي فيه طرابلس اليوم، وجعلها ثغرا للدولة تحرسه حامية مصرية. فصارت طرابلس من بعد مدينة فرنجية معادية مدينة من مدن الدولة المملوكية، وبقيت كذلك حتى سقوط الدولة نفسها.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eحمص الثانية\u003c/b\u003e\u003cspan\u003eأكتوبر ١٢٨١م هزيمة المغول قرب حمص\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمرقب\u003c/b\u003e\u003cspan\u003eسقطت سنة ١٢٨٥م من يد فرسان الداوية\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eطرابلس\u003c/b\u003e\u003cspan\u003eسقطت في أبريل ١٢٨٩م ونقلت إلى موضعها الحالي\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eبقية الفرنج سنة ١٢٩٠م\u003c/b\u003e\u003cspan\u003eعكا وصور وبيروت وعتليت وأرزيف فقط\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eصلح اليلخان أحمد\u003c/b\u003e\u003cspan\u003eسنة ١٢٨٢م أراح الشام من الغارات سنوات\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالجبهة\u003c/th\u003e\u003cth\u003eالحدث الأبرز\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالمغول في الشمال\u003c/td\u003e\u003ctd\u003eحمص الثانية سنة ١٢٨١م\u003c/td\u003e\u003ctd\u003eآخر زحف مغولي كبير على الشام في عهده\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالساحل الشمالي\u003c/td\u003e\u003ctd\u003eالمرقب ثم اللاذقية\u003c/td\u003e\u003ctd\u003eتطهير جبال اللاذقية من قلاع الفرنج\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالساحل الأوسط\u003c/td\u003e\u003ctd\u003eطرابلس سنة ١٢٨٩م\u003c/td\u003e\u003ctd\u003eنهاية الفرنج في شمال الشام\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eأوروبا وقبرص\u003c/td\u003e\u003ctd\u003eامتيازات للبندقية وقبالهما\u003c/td\u003e\u003ctd\u003eتعطيل نصرة عكا من داخل أوروبا\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eأرزيف\u003c/td\u003e\u003ctd\u003eأخذها الأشرف سنة ١٢٩١م بعد عكا\u003c/td\u003e\u003ctd\u003eتطهير الساحل كله من الفرنج\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eالتقى الجمعان عند حمص فاقتتلوا قتالا شديدا لم ير الناس مثله، حتى إذا كان آخر النهار حمل السلطان بنفسه فألحم الله المغول وانصرفوا إلى بلادهم.\u003c/p\u003e\u003ccite\u003eمن خبر وقعة حمص الثانية في كتب الحوليات\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eفي عقد واحد هزم قلاوون المغول في حمص وأخذ المرقب وطرابلس، فأصبح الساحل الشامي كله للدولة إلا عكا وما جاورها. وبهذا التمهيد خرج ابنه الأشرف سنة ١٢٩١م ليقضي على آخر ما بقي للفرنج في الشام.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"fall-of-acre","n":"سقوط عكا ونهاية الإمارات الصليبية","ic":"🏴","part":"القسم الرابع: قلاوون وسقوط عكا وأوج الدولة","h":"\u003carticle class=\"ch3\" id=\"fall-of-acre\" data-toc=\"سقوط عكا ونهاية الإمارات الصليبية\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e4.3\u003c/span\u003e\n          \u003ch3\u003e🏴 سقوط عكا ونهاية الإمارات الصليبية\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي ربيع سنة ١٢٩١م اجتمعت على عكا كل ما أنجزه قلاوون: جيش مدرع، وأسطول، وآلات حصار، وجيش بلا جبهة ثانية تشغله. وبعد خمسة وأربعين يوما من الحصار سقطت أكبر مدن الفرنج في الشام، وبعدها بسنتين لم يبق للصليبيين على الأرض ثغر واحد.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eخرج الأشرف صلاح الدين خليل بن قلاوون من مصر في أول سنة ١٢٩١م بعد أن استكمل العدة، ونزل على عكا في ثاني عشر من أبريل بجند مصر والشام والمنجنيقات والعتاد، وربط الأسطول في البحر ليمنع النجدة. وكان في المدينة حامية كبيرة من فرسان الداوية وفرسان الهيكل والاسبتاريا وسكانها من الفرنج، يقودهم هنري الثاني ملك قبرص والإنجليز ومعه قادة من فرنسا وإنجلترا.\u003c/p\u003e\u003cp class=\"ap\"\u003eبدأ الحصار بضرب الأسوار بالمنجنيقات من البر وحتى من السفن من البحر، فنقضت الأبراج برجا بعد برج. وخرجت حامية المدينة مرات للغارة على المحاصرين فردتهم المماليك، وحاول الأسطول من قبرص كسر الحصار البحري فلم يصل. ثم نقص الثلث الشمالي من السور بعد أيام من الضرب، فحمل الأشرف بالجند على الفجرة فامتنعت المدينة أياما، ودافع الفرنج دفاع من لا يرجو رجاء غير السيف.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي ثامن عشر من مايو سنة ١٢٩١م سقطت المدينة بعد خمسة وأربعين يوما من الحصار، فمن أهلها من لجأ إلى السفن فنجا إلى قبرص، ومنهم من قاتل حتى قتل، وأما برج عتليت وصور فقد أخذهما الأشرف في الشهر نفسه بلا حرب تذكر. ثم تتابع سقوط ما بقي: صور وبيروت وعتليت في تموز وأغسطس، وقلعة الروتن الصغيرة آخر المعاقل سنة ١٣٠٢م، فلم يبق للفرنج في الشام ولا في البحر قبالة إلإ قبرص المحتلة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان لسقوط عكا دوي عظيم في أوروبا: فقد كتبت المدن المراثي، وألقت بقايا الحملات اللوم على بعضها، وتوقفت فكرة الحملة الكبرى الجديدة لسنوات لما رأت من أن لا مدينة تعود إليها. وأما في مصر والشام فقد فتح سقوط عكا صفحة جديدة في تاريخ الدولة: صارت الدولة المملوكية سيدة البحر والبر من الإسكندرية إلى غزة، وصار اسمها في أوروبا اسم القوة التي لا تقاوم.\u003c/p\u003e\u003cp class=\"ap\"\u003eولم يكن الأشرف بعد عكا ليفسد انتصاره بالعدوان، فقد أمر بهدم أسوار المدينة وما بقي من قلاعها حتى لا تعود إليها حياة، وأقر من أراد من تجار البندقية والجنويين على المرور بموانئ مصر في تجارتهم، فجمع بين قوة السيف وانفتاح السوق. وهذه المعادلة صارت سياسة الدولة طويلا: الشام بلا فرنج، والتجارة مع أوروبا في موانئ مصر، وبذلك ازدادت حركة الإسكندرية ودمياط بعد سقوط عكا لأن تجارة المشرق كلها صارت تمر من موانئ الدولة لا من موانئ الفرنج.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eلماذا سقطت عكا في شهر ونصف\u003c/h4\u003e\u003cp class=\"ap\"\u003eعكا لم تكن مدينة عادية: لها سواران من الأسوار وأبراج محكمة وميناء محمي، وسكانها ومقاتلتها أكثر من كل ما تبقى للفرنج. لكن سقوطها جاء سريعا لأسباب جمعت في وقت واحد: أولها أن الدولة المملوكية جاءت بجيش موحد تحت قيادة سلطان شاب لا ينازعه منازع، وقد ضرب السور بمنجنيقات كثيرة لم تعرفها المدينة قبل ذلك بمثل عددها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوثانيها أن أوروبا كانت في ساعة كسل: فقد انشغل الإنجليز والفرنسيون بخصوماتهم، وتنازع البنادقة والجنويون في التجارة أكثر مما تنازعوا في الحرب، فما وصل إلى عكا في موعدها إلا شتات نجدة. وثالثها أن حامية المدينة نفسها كانت منقسمة بين طوائف ثلاث لا تجتمع كلمتها، فكان كل برج يقاتل وحده حين جاء الهجوم، وهذا ما لا يقوم به دفاع مدينة محاصرة من البحر والبر معا.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eآخر المعاقل: من عكا إلى أرود\u003c/h4\u003e\u003cp class=\"ap\"\u003eبعد سقوط عكا لم يحتج الأشرف إلى حروب كبيرة: فقد استسلمت صور ثم بيروت ثم عتليت في أسابيع، لأن أهل هذه الثغور رأوا بأعينهم ما جرى في عكا فعلموا أن المقاومة لا تجدي. وهكذا انتهى في صيف واحد وجود سياسي للفرنج في البر الشامي دام قرنين كاملين، وانتقل من بقي منهم إلى قبرص حيث بقيت مملكة بيت المقدس اسما بلا أرض يحكمونها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوبقيت بعد ذلك جزيرة أرود الصغيرة قبالة طرابلس يحتلها فرسان الهيكل حتى سنة ١٣٠٢م، فلما جاءها جيش الدولة لم يصمدوا طويلا، فكانت آخر ما رفع فيه الفرنج رايتهم في هذه البحار. ومن يومها صار وجود الفرنج في المشرق وجود تجار وقناصل في موانئ مصر، لا وجود إمارات وسلاح.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eبداية الحصار\u003c/b\u003e\u003cspan\u003eالثاني عشر من أبريل سنة ١٢٩١م\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمدة الحصار\u003c/b\u003e\u003cspan\u003eخمسة وأربعون يوما\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسقوط المدينة\u003c/b\u003e\u003cspan\u003eالثامن عشر من مايو سنة ١٢٩١م\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eقائد الحامية\u003c/b\u003e\u003cspan\u003eهنري الثاني ملك قبرص والإنجليز\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eآخر معقل فرنجي\u003c/b\u003e\u003cspan\u003eجزيرة أرود حتى سنة ١٣٠٢م\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمكان\u003c/th\u003e\u003cth\u003eتاريخ السقوط\u003c/th\u003e\u003cth\u003eملاحظة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eعكا\u003c/td\u003e\u003ctd\u003e١٨ مايو ١٢٩١م\u003c/td\u003e\u003ctd\u003eأكبر مدن الفرنج سقطت بعد حصار طويل\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eصور\u003c/td\u003e\u003ctd\u003eيونيو ويوليو ١٢٩١م\u003c/td\u003e\u003ctd\u003eاستسلام بلا مقاومة كبيرة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eبيروت\u003c/td\u003e\u003ctd\u003eيوليو ١٢٩١م\u003c/td\u003e\u003ctd\u003eأخذها الأشرف في طريق عودته\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eعتليت\u003c/td\u003e\u003ctd\u003eأغسطس ١٢٩١م\u003c/td\u003e\u003ctd\u003eقاعدة فرسان الداوية تخلت\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eأرود\u003c/td\u003e\u003ctd\u003eسنة ١٣٠٢م\u003c/td\u003e\u003ctd\u003eآخر جزيرة فرنجية قبالة طرابلس\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eنصب الأشرف المنجنيقات على عكا حتى صار الجبل حولها، وضربت الأسوار نهارا وليلا حتى سقط برج الملك ثم سقطت المدينة بعد أيام.\u003c/p\u003e\u003ccite\u003eمما نقل عن حصار عكا في كتب الحوليات المملوكية\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eسقوط عكا سنة ١٢٩١م لم يكن معركة واحدة بل حصاد نصف قرن من البناء: جيش قلاوون وأسطوله وسياساته أوصلت الأشرف إلى أسوار المدينة وهي مقطوعة النجدة. وبعد شهر ونصف انتهى الوجود الفرنجي في الشام بعد قرنين كاملين من الحروب.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"nasir-muhammad","n":"الملك الناصر محمد وأوج الدولة","ic":"🛡️","part":"القسم الرابع: قلاوون وسقوط عكا وأوج الدولة","h":"\u003carticle class=\"ch3\" id=\"nasir-muhammad\" data-toc=\"الملك الناصر محمد وأوج الدولة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e4.4\u003c/span\u003e\n          \u003ch3\u003e🛡️ الملك الناصر محمد وأوج الدولة\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eح\u003c/span\u003eكم الناصر محمد بن قلاوون ثلاث مرات وجمعها الثالثة ثلاثين سنة متصلة، وفيها بلغت الدولة المملوكية أوجها: عمران في القاهرة، وأمن في الطرق، وغازى المغول من غير حرب بأثر الصلح مع غازان، وترك عند موته خزائن لم يمتلئ مثلها في عهد سلطان قبله.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eتولى الناصر محمد السلطنة أول مرة صبيا في التاسعة سنة ١٢٩٣م بعد مقتل أخيه الأشرف، ثم عزل مرتين وعاد مرتين بأمر الأمراء، حتى استقر له الأمر ثالثة سنة ١٣١٠م فحكم إلى موته سنة ١٣٤١م. وكانت أولى سنواته الثالثة في تصفية من كان يتلاعب بالعرش من الأتابكة والأمراء، فقد خرج على بيبرس الجاشنكير ونائب الشام وسائر من كان يظن أن السلطان الصبي يبقى صبيا، فانتصر عليهم واحدا بعد واحد حتى جلس على كرسي بلا وصي.\u003c/p\u003e\u003cp class=\"ap\"\u003eولما استقر وجه الناصر إلى المماليك فاشترى منهم أعدادا كبيرة من الجراكسة والأتراك وجعلهم مماليكه الناصرية، وصار جنده أضعاف جند أبيه في العدد والعدة. ثم عقد الصلح مع غازان وخلفائه من اليلخانات في أوائل القرن الثامن الهجري، فكانت الحرب بين الدولة والمغول تنطفئ بعد قرن كامل، وصارت العلاقة رسائل وسفارات وصلحا طويلا أراح الثغور الشمالية وأغنى عن جيوش تقعد في حلب وحمص على أهبة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي عهده الثالث بلغت القاهرة أوج عظمتها: بنى الناصر مسجدا عظيما في القلعة، وأنشأ الميدان الكبير وقصر الأبلق، وحفر ترعة الناصرية التي عمرت أراضي واسعة في الوجه القبلي، وأمر بحفر خلج وجسور جديدة في الأقاليم، فاتسعت الأرض المزروعة وزاد خراج مصر زيادة كبيرة، ونزل ذلك على الأسواق بأرغيف رخيصة وأثمان معتدلة للطعام انتفع بها الناس في كل أقاليم مصر من أقصى الصعيد إلى سواحل البحر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان من أثر الأمن في عهده أن قال الرحالة المسلمون إن المسافر يخرج من القاهرة إلى دمشق ومعه ماله لا يخاف لصا ولا قاطع طريق، وقال ابن بطوطة الذي زار الشام ومصر في أيامه إن الناس في أمن وعدل لم ير مثله في بلاد المشرق. وصارت القاهرة في عهده أكبر مدن الغرب القديم عددا وعمارة، تضم أحياء ومساجد ومدارس وخانات أكثر مما عرفته في عهد بيبرس وقلاوون.\u003c/p\u003e\u003cp class=\"ap\"\u003eغير أن في آخر عهده بدء ما عاد على الدولة بالضعف: فقد كثر استبداد المماليك الناصرية في المناصب، وأقطع الناصر أبناءه وأصهاره أوسع الأقطاع، ومال إلى اقتصاد الاحتكار في بيع الحبوب والسكر فتضرر التجار والأهالي، ولم يحسن تربية ولده لأبي بكر الذي ولي بعده فكان سلطانا ضعيفا في يد الأمراء سنة واحدة. ومع ذلك فإن أوج الدولة المملوكية في القوة والثراء والعمران كان في هذه العقود الثلاثة بلا خلاف بين المؤرخين.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالصلح مع غازان: نهاية قرن الحرب\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان غازان خان اليلخانات قد غزا الشام سنة ١٢٩٩م وانتصر على المماليك في معركة معركة حمص الثالثة ودخل دمشق أياما ثم انسحب، وأعاد الكرة سنة ١٣٠٣م فالتقاه جيش الناصر في شقحب قرب دمشق فهزمه هزيمة بينة. وبعد شقحب لم يعد المغول إلى غزو الشام غزوا كبيرا أبدا، ثم جاء الصلح بعد سنوات فأبدل الحرب رسائل وسفارات وتزاور.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان لهذا الصلح أثر في كل مرافق الدولة: فقد خفت نفقات الحاميات الكبرى في الشمال، وامن بريد الشام ومصر، وصار تجار الحرير يمر من آسيا إلى موانئ مصر في أمان. وظهر أثر هذا الأمن في الثراء العظيم الذي خلده الناصر في خزائنه وفي عمران القاهرة، وهو ثراء ما كان ليوجد في زمن حرب دائمة مع أكبر قوة في العالم يومئذ.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eمعركة شقحب: الحسم قرب دمشق\u003c/h4\u003e\u003cp class=\"ap\"\u003eفي ربيع سنة ١٣٠٣م جاء المغول في جيش ضخم بقيادة قطلو شاه، فسار إليهم جيش مصر بقيادة بيبرس الجاشنكير والعادل كتبغا والناصر معهما، والتقوا عند شقحب جنوب دمشق. وجرت الحرب على غير عادتها: فقد صام الجند يوم الواقعة وأفطروا في الميدان، وثبتوا لضربات المغول حتى انكشف قطلو شاه وجنده في آخر النهار.\u003c/p\u003e\u003cp class=\"ap\"\u003eكانت شقحب آخر معركة كبرى بين المماليك والمغود في التاريخ، وقد رتب الناصر بعد النصر لنفسه هيبة ما سبقته إليها: فقد انتصر وهو في مقدم الجيش فحاز الناس عليه أنه قائد من قادة الميدان لا سلطان في القلعة فحسب. وذكر المؤرخون أن الناصر رجع من شقحب إلى القاهرة موكبا لم يعرف الناس أعظم منه.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمرات الملك\u003c/b\u003e\u003cspan\u003eثلاث: ١٢٩٣م و١٢٩٩م ثم استقر من ١٣١٠م إلى ١٣٤١م\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمعركة شقحب\u003c/b\u003e\u003cspan\u003e١٣٠٣م آخر هزيمة كبرى للمغود في الشام\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأشهر عمرانه\u003c/b\u003e\u003cspan\u003eمسجد القلعة وقصر الأبلق وترعة الناصرية\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمماليكه\u003c/b\u003e\u003cspan\u003eالمماليك الناصرية بالآلاف من الأتراك والجراكسة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمدة العهد الأخير\u003c/b\u003e\u003cspan\u003eإحدى وثلاثون سنة متصلة\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالفترة\u003c/th\u003e\u003cth\u003eالسلطان الفعلي\u003c/th\u003e\u003cth\u003eملاحظة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e١٢٩٣م إلى ١٢٩٤م\u003c/td\u003e\u003ctd\u003eالناصر صبيا\u003c/td\u003e\u003ctd\u003eأول ملك بيد وصي من الأمراء\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٢٩٩م إلى ١٣٠٩م\u003c/td\u003e\u003ctd\u003eالناصر ثانيا ثم بيبرس الجاشنكير\u003c/td\u003e\u
