te\u003e\n        \u003cdiv class=\"res\"\u003eعهد قايتباي هو عهد الطمأنينة العلمية في مصر: مدارس تجمع المذاهب،  وأوقاف تعلم وتصون الكتب، ورحلة طلب علم لا تنتهي. ومن في هذه الحقبة كان المقريزي وابن حجر وابن تغرى، فكتبوا للمدينة تاريخها الذي  بقي بعدهم في الخُطط والنجوم الزاهرة والضوء اللامع.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"qaytbay-architecture","n":"عمارة قايتباي في القاهرة","ic":"🕌","part":"القسم السابع: السلطان قايتباي","h":"\u003carticle class=\"ch3\" id=\"qaytbay-architecture\" data-toc=\"عمارة قايتباي في القاهرة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e7.3\u003c/span\u003e\n          \u003ch3\u003e🕌 عمارة قايتباي في القاهرة\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eب\u003c/span\u003eين قصرين من قصور الملوك، على محور باب زويلة، شيّد قايتباي مسجدًا هو أرقى ما بناه المماليك في مصر وأدقّه. مئذنتان من الحجارة لا من الطوب، وساحة داخلية واسعة، وضريح مرتفع، وزخرفة جص تتشابك كالعقد حتى ليحسبها الناظر لؤلؤًا مصفوفًا.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eأشهر ما بناه قايتباي في القاهرة بلا منازع مسجده المعروف بالجامع الأشرف، وهو قائم بين القصرين على المحور الذي يصل باب زويلة بشارع القصرين. اشتمل المجمع على عدة عناصر: مسجدًا جامعًا، ومدرسة تدرس المذاهب الأربعة، وحجرة بسطة يجلس فيها الأمراء، وضريحًا مرتفعًا فيه قبر السلطان. واستغرق بناؤه نحو عشر سنوات في ثلاثينيات القرن التاسع الهجري، وينسبه بعض المؤرخين إلى المهندس أحمد الأشرفاني، وهو من أشهر من عمل في عمارة القاهرة في جيله.\u003c/p\u003e\u003cp class=\"ap\"\u003eوللمسجد مئذنتان من الحجارة، وهما من أندر ما بقي في القاهرة لأن أكثر مآذنها من الطوب. نقش على سطح كل منهما زخرفة متشابكة على هيئة شبكة معقدة، ووزعت عليها أقراص فيها نباتات ملتفة، وتحتها تيجان من المقرنصات تعلو شرفة المؤذن. وقد جعلت هذه الزخرفة المعقدة المئذنتين أشهر ما في الجامع حتى ليغفل الزائر سائر عناصره عند رفع بصره إليهما، ولهذا صار الناس يعرفون الجامع باسم مئذتيه قبل أن يعرفوه باسم سلطانه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما داخل الجامع فزخرفته على مذهب المماليك الذي اشتهرت به القاهرة: أرضيات من البلاط الأبيض، وجدران من الجص المشغول تتشابك زخارفها على هيئة نباتات هندسية لا صور ولا تماثيل، وعقود من المقرنصات تملأ فراغات الأبواب، وكتب بخط النسخ على العتبات تعلن اسم بانيه. وفي المدخل بلاط مزجج بُني عليه اسم السلطان، وهي علامة عوّد عليها المماليك في أبوابهم  ليربطوا العمارة بملكها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما ضريح السلطان فمبنى قائم بذاته إلى جانب المسجد، تعلوه قبة مضلعة من الآجر، ويؤتى إليه بدرج ضيق لا يكاد يعلمه إلا من سلكه. دُفن فيه قايتباي وابناه الذين تولوا الملك بعده، ولم يمس هذا الضريح بالترميم منذ قرون فبقي كما تركه صاحبه، وما زال الزائر يقف عند بابه كما وقف الأمراء قبله بأجيال ولم يكن الضريح إلا مزارًا للسلطان وسَرتًا يزوره الناس في هذه السنين، فقد جُدد بناؤه وترميم ما تلف منه كما جُدد بناء كثير من المساجد القديمة في القاهرة والشام، فبقي معالم الدولة قائمة بمبانيها..\u003c/p\u003e\u003cp class=\"ap\"\u003eولم يقتصر قايتباي على بناء مسجده الجديد، بل أوقف على المساجد القديمة في القاهرة والشام أرزاقًا تجري عليها صيانة بنائها كما كان يفعل سلاطين الدولة من قبله. وبهذا الوقف كان بيت المال ينفق على مسجد من المساجد الصغيرة في القرى كما ينفق على فناء القصر، لا لأن الأصغر أحقر بل لأن الصيانة لا تُحتمل إلا من مالكها ولم تنقطع صيانة هذه المساجد في عهده، فقد كان بيت المال يصرف على بنائها وعليها في كل سنة ما يحتاج منه، فحفظت هذه المساجد من الخراب إلى أن جاء زمن غفلها فبقي منها ما بقي..\u003c/p\u003e\u003cp class=\"ap\"\u003eقيل إن نفقة هذا الجامع بلغت أضعاف ما أنفق على كل ما بناه الأمراء من المساجد في القاهرة والشام قبله، ولذلك صار هذا المجمع في عيون المؤرخين أحلى ما عمره السلاطين المماليك، إذ جمع بين دقة الصنعة وحسن الاختيار في الأرض والسقف والباب. ولا يستغرب أن يُعد هذا الجامع مدرسة قبل أن يعد مسجدا، فالعلم والعبادة في مصر المماليكية لم يفترقا، فكان للتدريس فيه حصة كبرى من عمره ومكانه فيه.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eموقع الجامع بين القصرين\u003c/h4\u003e\u003cp class=\"ap\"\u003eوقع الجامع في قلب مدينة القاهرة القديمة على محور يفصل بين قصر القلعة شمالا وقصر السلطان، وهو المحور نفسه الذي يصل باب زويلة في الجنوب بشارع القصرين. ولم يكن اختيار الموضع صدفة، فقد أراد قايتباي أن يرى الناس مسجده بين قصرين كما رأى قلاوون مسجده عند باب القلعة.\u003c/p\u003e\u003cp class=\"ap\"\u003eولهذا جاء بناء الجامع في قلب المدينة لا في طرفها، فضاقت المسافة بينه وبين دور الأمراء، وعرفه أهل القاهرة من أول يوم. وكان ممر الأمراء إلى دار الخلافة يمر من أمامه فيرى كل منهم سلطانه واقفا بين قصرين لا مستورا في قصره. ولم يكن في القاهرة مكان أقدم من هذا المحور في عروق الدولة، فمن أراد أن يعرف قايتباي فليبدأ من بين القصرين.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالزخرفة من الجص والبلاط\u003c/h4\u003e\u003cp class=\"ap\"\u003eولم يكن المماليك يفصلون بين فن العمارة وفن الزخرفة بل يجعلون الزخرفة جزءا من البناء نفسه. وكان الجص المشغول في هذه الحقبة يبلغ مراتب الدقة التي تعجز عنها اليد في غيره، فتتشابك خيوطه حتى تنسى العين أين بدأت وكيف انتهت. ومن ومن عجب هذا الفن أنه لا يزول بزوال صاحبه، بل يبقى أثره في الحجر لمن جاء بعده. الغرابة في هذا الفن أنه لا يزول بزوال صاحبه.\u003c/p\u003e\u003cp class=\"ap\"\u003eأما البلاط فكان أرضيات المساجد ينقش عليه بالفسيفساء الملونة نبات وأشكال هندسية ويغطي الدرج والقواعد فيدخل به الماء ولا يعلق به شيء. ولهذا يبدو المسجد حين تغسل الأرضية الماء كأنه يمر على سطح من الماء لا على حجر. ولهذا صارت البلاطات المماليكية مطلوبة في بيوت الأمراء كما صارت في المساجد.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eوقف المساجد وبناء المدينة\u003c/h4\u003e\u003cp class=\"ap\"\u003eولعل أظهر ما فعله قايتباي في عمارة المدينة ليس بناء جامعه بل عنايته بمساجد القاهرة القديمة التي طوى زمنها وتركها بعضهم خربة. فقد وقف عليها ما تحتاج من صيانة دائمة، ووصل هذا الوقف إلى مساجد خرجت من الاستعمال منذ قرون فعادت إليه عامرة، كما فعل من بعده بمن شيخ.\u003c/p\u003e\u003cp class=\"ap\"\u003eلكن صورة المدينة في هذه الحقبة لم تكن حصيلة العمارة الجديدة وحدها، بل كثير مما نراه اليوم في مساجد القاهرة القديمة ثمرة هذه الأوقاف التي أبقت عليها، فمن أراد أن يعرف لماذا بقيت هذه المساجد قائمة فليعد إلى صيغ الوقف. وهذا يعني أن ما بقي من المساجد في القاهرة اليوم جزء منه موقوف على هذه الأوقاف، لا مهجور منها إلا قليل.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمخطط المجمع\u003c/b\u003e\u003cspan\u003eمسجد ومدرسة وضريح وحجرة بسطة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eموقعه\u003c/b\u003e\u003cspan\u003eبين القصرين على محور باب زويلة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمهندسه\u003c/b\u003e\u003cspan\u003eينسب إلى أحمد الأشرفاني\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمئذنتاه\u003c/b\u003e\u003cspan\u003eمن الحجارة لا من الطوب\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eبقاؤه\u003c/b\u003e\u003cspan\u003eمن أظهر ما بقي من عمارة المماليك في القاهرة\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالعنصر\u003c/th\u003e\u003cth\u003eالوصف\u003c/th\u003e\u003cth\u003eموضعه\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالمحراب\u003c/td\u003e\u003ctd\u003eقاع المسجد المقابل لابتدال\u003c/td\u003e\u003ctd\u003eفي قاع الصالة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالساحة\u003c/td\u003e\u003ctd\u003eصحن واسع تحيط به ثلاث إيبونات\u003c/td\u003e\u003ctd\u003eوسط المجمع\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمدخل\u003c/td\u003e\u003ctd\u003eباب من الرخام وبلاط مزجج باسم السلطان\u003c/td\u003e\u003ctd\u003eفي واجهة الجامع\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالضريح\u003c/td\u003e\u003ctd\u003eمبنى مفرد بقبة مضلعة\u003c/td\u003e\u003ctd\u003eشمال المسجد\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمئذنتان\u003c/td\u003e\u003ctd\u003eمن الحجارة بزخرفة متشابكة\u003c/td\u003e\u003ctd\u003eعلى جانبي الواجهة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eفي بيوت أذن الله أن ترفع ويذكر فيها اسمه\u003c/p\u003e\u003ccite\u003eسورة النور، الآية ٣٦\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eمسجد قايتباي بين القصرين أجمل ما عمره المماليك في القاهرة: مئذنتان من حجر، وزخرفة جص متشابكة، وساحة واسعة، وضريح للسلطان. سكب قايتباي في هذه الدرجة آخر ما بقي من فن البناء في عصره، وأوقف على المساجد القديمة ما صانها من الخراب.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"qaytbay-and-ottomans","n":"قايتباي والمواجهة مع العثمانيين","ic":"🛡️","part":"القسم السابع: السلطان قايتباي","h":"\u003carticle class=\"ch3\" id=\"qaytbay-and-ottomans\" data-toc=\"قايتباي والمواجهة مع العثمانيين\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e7.4\u003c/span\u003e\n          \u003ch3\u003e🛡️ قايتباي والمواجهة مع العثمانيين\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eل\u003c/span\u003eم تكن المواجهة مع العثمانيين حربًا واحدة، بل ست سنوات من المناوشات على ثغور لا يعرف أحد أين تنتهي. وفيها تبيّن أن الدولة المملوكية ما زالت قادرة على القتال، وأنها لم تعد قادرة على الانتصار الحاسم.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eبدأت المشكلة قبل الرصاص. فبعد موت السلطان محمد الفاتح سنة ١٤٨١م تنازع ابناه بايزيد وجم على العرش، فخرج جم من الأناضول وطلب اللجوء إلى مصر، فاستقبله قايتباي في القاهرة وأكرمه، ثم ساعده على السفر إلى رودس. وكان في هذا الاستقبال رسالة لا تحتاج إلى تفسير: أن سلطان مصر يرى نفسه كبير المشرق، وأن من يلجأ إليه لا يُسلَّم. ولم ينسَ بايزيد الثاني ذلك، فظلّ يطالب بتسليم أخيه سنوات، وظلّ قايتباي يماطل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت أرض الحرب هي كيليكية وسهل أدنة، وهي المنطقة التي تفصل الأناضول عن الشام. وقد ظلّت هذه المنطقة موضع نزاع بين الدولتين منذ القرن الرابع عشر، وفيها إمارات صغيرة تتبع القاهرة اسمًا وتتبع القسطنطينية مصلحةً. وكانت كل دولة ترى في هذه المنطقة حدًّا لا يمكن التنازل عنه، وكل واحدة منهما تريد أن يكون الأمير فيها من عندها، لأن الأمير الذي يتبع خصمك على حدّك هو باب مفتوح في دارك.\u003c/p\u003e\u003cp class=\"ap\"\u003eوانفجر القتال سنة ١٤٨٥م، فدخلت القوات العثمانية أدنة وطرسوس، ثم استعادها المماليك في السنة التالية. وتكرّرت الحملات على مدى سنوات، حتى بلغت ذروتها في معركة كبيرة سنة ١٤٨٨م، حيث أرسل قايتباي جيشًا بقيادة أحد كبار أمرائه، فانتصر انتصارًا واضحًا وأعاد خط الحدود إلى ما كان عليه تقريبًا. وكان في هذا دليل على أن الجيش المملوكي ما زال قادرًا على القتال في ميدان مفتوح.\u003c/p\u003e\u003cp class=\"ap\"\u003eغير أن الحرب لم تكن في الميدان وحده. فكل حملة تحتاج إلى مال يُدفع قبل أن تُحرّك راية، وكل سنة من سنوات هذه الحرب كانت تستهلك من بيت المال ما لا يعود. وقد اضطُرّت الدولة إلى فرض رسوم إضافية وإلى تأخير بعض الرواتب، وهذا ما جعل الحرب مكلفةً أكثر مما ظهر في دفاترها، لأن كلفتها الحقيقية ظهرت في الجند لا في الخزينة، والجند الذي لا يُدفع له لا يعود كما كان ولو عاد إليه ماله.\u003c/p\u003e\u003cp class=\"ap\"\u003eوانتهت الحرب بصلح سنة ١٤٩١م، لم ينتصر فيه أحد انتصارًا حاسمًا، ولم يخسر فيه أحد أرضًا كبيرة. وقد قبل الطرفان بما يشبه الوضع القديم، لأن كليهما كان يحتاج إلى السلام: العثمانيون كان لهم شأن في الشرق والبلقان، والمماليك كانوا يحتاجون إلى وقت لترميم ماليتهم. وكانت هذه أول مرة تتفاوض فيها الدولتان بوصفهما ندّين، وآخر مرة أيضًا، لأن من جاء بعدهما لم يكن يتفاوض على الحدود بل على البقاء.\u003c/p\u003e\u003cp class=\"ap\"\u003eوما كشفته هذه السنوات الست هو أن الفارق بين الجيشين لم يكن في الشجاعة بل في التنظيم والسلاح. فقد أثبت المماليك أنهم يستطيعون أن يهزموا العثمانيين في ميدان، لكنهم لم يستطيعوا أن يحتفظوا بما فتحوه لأن الحرب كانت تُستنزفهم ماليًا. وعلى الجانب الآخر خرج العثمانيون من هذه الحرب بتجربة في حرب الجنوب، وبتقدير أدقّ لضعف خصمهم، وهذا ما استعملوه بعد ربع قرن في مرج دابق.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eجم سلطان واللجوء إلى القاهرة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان لجوء جم إلى مصر حادثًا دبلوماسيًا بكل معنى الكلمة. فمن يستضيف مدعيًا إلى عرش جاره يملك ورقة ضغط دائمة، ومن يسلّمه يخسر هيبته أمام من حوله. وقد اختار قايتباي أن يستضيف ولا يسلّم، وأن يترك الباب مفتوحًا لسنة أخرى، وهذا هو أقصى ما يمكن أن تفعله دولة لا تريد الحرب ولا تستطيع أن تتجنبها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كلّف هذا الموقف مصر غاليًا. فبايزيد الثاني جعل من مطالبته بتسليم أخيه ذريعةً لتحريك الحدود، وكان كل تقدّم عثماني في كيليكية يُبرَّر بأن مصر تؤوي عدوًّا له. وهكذا صار اللاجئ الواحد سببًا لحرب لم يكن في وسع الدولة أن تختارها في الوقت الذي تختاره هي.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eثغور كيليكية وسهل أدنة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت هذه المنطقة في نظر القاهرة باب الشام الشمالي، وفي نظر القسطنطينية باب الأناضول الجنوبي. ومن يملك أدنة يهدد حلب، ومن يملك حلب يهدد الأناضول، ولهذا كانت كل قرية فيها تُعدّ موقعًا عسكريًا. وقد كانت الحصون فيها متبادلة بين الطرفين سنوات، تُؤخذ وتُردّ، ولا يثبت فيها علمٌ طويلًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان سكانها من التركمان الذين لا يعرفون ولاءً ثابتًا، يتبعون من يدفع أكثر ويحمي أفضل. ولهذا كانت الحرب فيها حرب مواقع لا حرب جيوش: استيلاء على قلعة، وقطع طريق، وإحراق محصول، ثم مفاوضة. وهذا النوع من الحرب يُنهك الطرفين ولا يحسم شيئًا، وهو ما جرى فيها ست سنوات.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eست سنوات بلا حسم\u003c/h4\u003e\u003cp class=\"ap\"\u003eأطول ما في هذه الحرب أنها لم تُنتج نصرًا يُذكر في التاريخ. فلم يسقط عاصمة، ولم تُفتح بلد كبير، ولم يُقتل سلطان. وكل ما نتج عنها أن الحدود عادت إلى مكانها تقريبًا، وأن الطرفين عرفا حدود قوتهما. وهذه نتيجة تُشبه نتائج الحروب الطويلة التي لا يريد فيها أحد أن يخسر أكثر مما يريد أن يكسب.\u003c/p\u003e\u003cp class=\"ap\"\u003eغير أن أثرها الحقيقي كان في الداخل. فالحرب علّمت مصر أن جيشها القديم ما زال يعمل، فلم تُسرع إلى تجديده بعد الصلح، وهذه هي المصيبة. فالنجاح في حرب دفاعية أقنع الدولة بأن ما عندها كافٍ، وبقيت على سلاحها القديم ربع قرن، حتى جاء من غيّر قواعد الميدان، فلم يبقَ في يدها ما تُقاوم به إلا الشجاعة التي كانت تُقاوم بها قبل خمسة قرون.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eشرارة الخلاف\u003c/b\u003e\u003cspan\u003eلجوء جم سلطان إلى القاهرة سنة ١٤٨١م\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأرض الحرب\u003c/b\u003e\u003cspan\u003eكيليكية وسهل أدنة بين الأناضول والشام\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسنوات القتال\u003c/b\u003e\u003cspan\u003eمن سنة ١٤٨٥م إلى سنة ١٤٩١م\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأكبر معركة\u003c/b\u003e\u003cspan\u003eسنة ١٤٨٨م، انتصار مملوكي أعاد خط الحدود\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالنتيجة\u003c/b\u003e\u003cspan\u003eصلح بلا حسم، وكل طرف عاد إلى ما كان عليه\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eما تركه في الدولة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e١٤٨١م\u003c/td\u003e\u003ctd\u003eلجوء جم سلطان إلى مصر\u003c/td\u003e\u003ctd\u003eتوتر دائم مع القسطنطينية وذريعة لتحريك الحدود\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٤٨٥م\u003c/td\u003e\u003ctd\u003eدخول القوات العثمانية أدنة وطرسوس\u003c/td\u003e\u003ctd\u003eبداية حرب ثغور استمرت ست سنوات\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٤٨٦م\u003c/td\u003e\u003ctd\u003eاستعادة المماليك للمواقع\u003c/td\u003e\u003ctd\u003eعودة خط الحدود إلى مكانه الأول\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٤٨٨م\u003c/td\u003e\u003ctd\u003eمعركة كبيرة وانتصار مملوكي\u003c/td\u003e\u003ctd\u003eإثبات قدرة الجيش على القتال في ميدان مفتوح\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٤٩١م\u003c/td\u003e\u003ctd\u003eصلح بين الدولتين\u003c/td\u003e\u003ctd\u003eسلام بلا حسم وعبء مالي ثقيل على بيت المال\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eوَإِن جَنَحُوا لِلسَّلْمِ فَاجْنَحْ لَهَا وَتَوَكَّلْ عَلَى اللَّهِ إِنَّهُ هُوَ السَّمِيعُ الْعَلِيمُ\u003c/p\u003e\u003ccite\u003eسورة الأنفال، الآية ٦١\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eحاربت مصر ست سنوات على ثغور لا تُحسم، فانتصرت في الميدان وأُنهكت في الخزينة. وخرجت من الحرب بحدودها كما كانت، وباقتناعٍ خاطئ بأن جيشها القديم ما زال كافيًا.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-8","n":"القسم الثامن: طريق البرتغاليين والانهيار والغوري","ic":"","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-8\" style=\"--c:#0F6B5C\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e⛵\u003c/div\u003e\n      \u003ch2\u003eالقسم الثامن: طريق البرتغاليين والانهيار والغوري\u003c/h2\u003e\n      \u003cp\u003eتصف هذه الفصول انهيار الدولة من داخلها: طريق البرتغاليين حول رأس الرجاء الذي أفقد مصر تجارتها، ثم ذبول المالية وتآكل الجيش، ثم سلطنة قانصوه الغوري التي انتهت بمصير الدولة كله.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#carreira-around-the-cape\"\u003eطريق رأس الرجاء وعصف التجارة\u003c/a\u003e\u003ca href=\"#economic-collapse\"\u003eالانهيار الاقتصادي وتآكل الجيش\u003c/a\u003e\u003ca href=\"#al-ghawri-sultan\"\u003eسلطان قانصوه الغوري\u003c/a\u003e\u003ca href=\"#egypt-alone\"\u003eمصر وحدها أمام العثمانيين\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"carreira-around-the-cape","n":"طريق رأس الرجاء وعصف التجارة","ic":"⛵","part":"القسم الثامن: طريق البرتغاليين والانهيار والغوري","h":"\u003carticle class=\"ch3\" id=\"carreira-around-the-cape\" data-toc=\"طريق رأس الرجاء وعصف التجارة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e8.1\u003c/span\u003e\n          \u003ch3\u003e⛵ طريق رأس الرجاء وعصف التجارة\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eل\u003c/span\u003eم تكن الكارثة انتفاضةً داخلية ولا هزيمةً في ميدان، بل طريقًا بحريًا جديدًا انفتح حول قارة كاملة فغيّر اتجاه التجارة في المتوسط كله. في أقل من اثنتي عشرة سنة دار بحّار برتغالي حول طرف أفريقيا ووصل ساحل الهند، فلم تعد البضائع الشرقية تمرّ من مصر كما كانت، وبقيت السلطنة واقفة على جانب الطريق لا عليه.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eانطلق بارثلوميوس دياس من لشبونة أواخر سنة ١٤٨٧م في أسطول لا يتجاوز خمس سفن، وحمله أمر ملك البرتغال أن يجد طريقًا إلى الهند عن طريق الجنوب. وفي فبراير سنة ١٤٨٨م بلغ طرف القارة الجنوبية حيث تنحدر الجبال إلى البحر، فرأى ساحلًا لم يسلكه بحّار قبله. وسماه في دفتر رحلته رأس العواصف خوفًا من الرياح، لكنه وصل إلى جزر ساحلية في داخل المحيط الهندي أسماها مونستيروش قبل أن تضيع منه سفينتان فيعود سنة ١٤٨٩م. ولما رُفعت الخريطة إلى الملك غيّر الاسم إلى رأس الرجاء إيمانًا بما وراءه.\u003c/p\u003e\u003cp class=\"ap\"\u003eأما فاسكو دي جاما فصبر نحو سبع سنين قبل أن ينطلق من لشبونة في الثامن من يوليو سنة ١٤٩٧م بأسطول من أربع سفن، فقطع الأطلسي جنوبًا ولفّ حول رأس الرجاء ولامس شواطئ شرق أفريقيا صعودًا حتى رسا في العشرين من مايو سنة ١٤٩٨م في ميناء كاليكوت على الساحل الغربي للهند. وفي رحلته العائدة سنة ١٤٩٩م عاد بحمولة من التوابل فثبت لبلاط لشبونة قيمة الطريق، ثم أتبعه ألبارو كابرسال سنة ١٥٠٠م فبلغ سواحل البرازيل، وصارت الأساطيل تتر إلى الهند كل عام قبل أواخر القرن. وكّلت كل رحلة جديدة تجارة البندقية وجنوة التي كان مصدر رزقها الأول.\u003c/p\u003e\u003cp class=\"ap\"\u003eكان الطريق القديم يبدأ من سواحل اليمن وشرق أفريقيا ثم يمرّ على موانئ البحر الأحمر ويُحمَّل إلى القاهرة وإسكندرية، حيث يشتريه تجار البندقية وجنوة الذين يقومون بدور الوسيط بين الشرق وأوروبا، وتُدفع رسوم الدولة على كل سلعة تدخل أو تخرج. وفي هذا المثلث كانت مصر هي الطرف الأهم: هي التي تحمل البضاعة، وهي التي تجبي رسمها، وهي التي تحرس الطريق. وحين تبيّن لأوروبا أن طريقًا يوصلها بالمشرق دون المرور ببوابة مصر، لم تعد السلطنة طرفًا في التجارة بل حاجزًا أمامها، وبقيت موانئها تستقبل سفنًا تحمل أقل مما كانت.\u003c/p\u003e\u003cp class=\"ap\"\u003eولم يكن أثر الطريق الجديد ذاكرًا في عامه الأول، فقد ظلّ تجار الشرق ينقلون بضائعهم من الهند إلى ساحل البحر الأحمر ثم إلى القاهرة سنوات كما اعتادوا. غير أن الطريق البرتغالي نزل بأسعار التوابل في أوروبا إلى نحو خُمس ما كانت عليه قبل ذلك بأعوام، ومع تراجع الأسعار تضاءلت منفعة الوسطاء، فبدأ التجار المقيمون في الإسكندرية يفكّرون في إرسال سفنهم إلى الهند نفسها لا إلى الميناء، وهنا انهار الربح القائم على فروق الأسعار.\u003c/p\u003e\u003cp class=\"ap\"\u003eوليس بالإسكندرية وحدها. فقد كانت دمياط ميناءً ثانيًا لتجارة الشرق، وقد بدأ ميناها يخبو قبل ظهور الطريق البرتغالي بسنوات حين انحسر مجرى النيل الشرقي ورسبت الطمي في الفروع التي كانت تغذيه، فغلق الميناء ونزلت سفن التونة بحلها. وبقيت دمياط بلا تجارة لا لأن الطريق وحده، بل لأن الماء انسحب منها، وانتقلت حركة التجارة إلى الروضة ثم إلى الإسكندرية صارت الميناء الأكبر للبحر المتوسط كله.\u003c/p\u003e\u003cp class=\"ap\"\u003eحاول سلاطين مصر منع التحوّل، وظلّوا يتعاملون مع الأمر على أنه مسألة قيود وضوابط. فشُدِّدت قيود تصدير التوابل، وحُصر دخول التجار الفرنج في الموانئ المصرية، ووُضعت عليهم رسوم إضافية، وكلها إجراءات كانت دفاتر بيت المال تعرفها من سنين. لكن القرار لم يكن في يد القاهرة: من يجد التوابل بأرخص ثمن عند صاحبها في الهند سافَر إليه، ولا توقفه رسوم. ولم يبقَ لمصر من تجارتها إلى الهند إلا طريقها القديم عبر موانئ البحر الأحمر، وهو طريق باهظ الكلفة تزايد ثقله على كاهل بيت المال.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eخريطة الطريق الجديد\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يكن في رحلة دياس كنز يُذكر، فقد عاد بغير بضاعة تُباع، لكنه عاد بدفتر رسم فيه اتجاه الساحل الجديد. وهذا الرسم هو السلاح الذي حمله كل من بعده، إذ به عُدّ الطريق ممكنًا، وبه كثرت المحاولات عليه. ويومئذ لم يكن أحد يعلم أن ثلاثة عقود فقط تفصل بين هذا الرسم وبين أول سفينة تحمّل التوابل من الهند إلى أوروبا لتبيع بثُلُث الثمن.\u003c/p\u003e\u003cp class=\"ap\"\u003eأما العبء فكانت في الصبر لا في الرحلة. فقد مضى على دياس نحو سبع سنين قبل أن ينال الإذن بالخروج، ومن بعده تنافس ملوك البرتغال وإسبانيا على وراثة الطريق. ولم يكن في ذلك عجب، فقد كانت إسبانيا قد سبقت البرتغال إلى جزر الأطلسي منذ جيل، وقد تنازل البرتغاليون عن حقوقهم فيها لملكها حين ثبتوا على طريق الهند.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eميناء قوامه الرسوم\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يكن في مصر نشاط تجاري فحسب بل نشاطًا ماليًا محسوبًا: كانت الرسوم المأخوذة في الموانئ تدخل بيت المال أولًا ثم تُقتطع منها نفقات الدواوين، وكان اختلالها يعني اختلال رواتب الجند. ولهذا كان بيت المال يعدّ موارده على أساس الرسوم أكثر من اعتداده على الخراج، وحين تتعثر الرسوم كان أوّل ما يتعثر هو رواتب المماليك.\u003c/p\u003e\u003cp class=\"ap\"\u003eومضت موانئ مصر تستقبل السفن وهي تنتظر البضائع التي لا تأتي، حتى صار اختلال الرسوم ينعكس على قيمة الدينار وعلى رواتب الجند. وقد لاحظت دواتر هذه السنين أن دخل الميناء صار يفارق ما كان مألوفًا قبل سنوات قليلة، دون أن يفطن أحد إلى أن الأمر ليس موسمًا خفيصًا ولا سنة نادرة، بل بداية طريق لن ينعطف.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eمحاولات منع التحوّل\u003c/h4\u003e\u003cp class=\"ap\"\u003eبدت مصر في نظر دواترها قادرة على ضبط الموقف بأدواتها المعتادة: منع تصدير التوابل خارج الموانئ، ومنع التفاوض مع الفرنج خارجها، وفرض رسوم إضافية على كل سلعة. وقد نُفِّذت هذه التدابير فعلًا، غير أنها كانت معالجة لمرض خطأ في الحكمة والسياسة معًا، لأن الخلل لم يكن في شخصية سلطان ولا في ضبط موظفيه، بل في طبيعة الطريق نفسه الذي لا تحكمه دولة على ضفة واحدة.\u003c/p\u003e\u003cp class=\"ap\"\u003eأما الحقيقة فأن من يملك الطريق يملك التجارة، ومصر لم تكن تملكه. فقد ظلّت ما دامت تحمي سور القاهرة وبحرها، وحين بدأ الطريق ينتقل من بحر إلى آخر لم يعد في وسع أسطولها أن يبلغه. ولو أراد سلاطين مصر صدّ الطريق بعقلية كاملة، لكان ذلك في شرائه أو في شنّ حرب بحرية بعيدة، وكلاهما خارج طاقة الدولة في تلك السنين.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأول دوران\u003c/b\u003e\u003cspan\u003eلفّ دياس حول رأس الرجاء في فبراير سنة ١٤٨٨م\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eوصول جاما\u003c/b\u003e\u003cspan\u003eرسا في كاليكوت في مايو ١٤٩٨م\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأثر السعر\u003c/b\u003e\u003cspan\u003eنزل سعر التوابل في أوروبا إلى نحو الخُمس\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eدمياط\u003c/b\u003e\u003cspan\u003eانسحب مجرى النيل الشرقي فخبا ميناؤها قبل ظهور الطريق\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eنتيجة\u003c/b\u003e\u003cspan\u003eتحوّل مركز الثروة من مصر إلى ميناء في أقصى الأطلسي\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمحطة\u003c/th\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالأثر على مصر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eدوران دياس حول رأس الرجاء\u003c/td\u003e\u003ctd\u003e١٤٨٨م\u003c/td\u003e\u003ctd\u003eإثبات وجود طريق إلى المحيط الهندي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eوصول دي جاما إلى كاليكوت\u003c/td\u003e\u003ctd\u003e١٤٩٨م\u003c/td\u003e\u003ctd\u003eافتتاح طريق مباشر إلى الهند\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eرحلة ألبارو كابرسال\u003c/td\u003e\u003ctd\u003e١٥٠٠م\u003c/td\u003e\u003ctd\u003eتثبيت الطريق نحو الشرق\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eنضوب ميناء دمياط\u003c/td\u003e\u003ctd\u003eفي القرن الخامس عشر\u003c/td\u003e\u003ctd\u003eانتقال التجارة إلى الروضة ثم الإسكندرية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eتراجع دخل الموانئ\u003c/td\u003e\u003ctd\u003eأواخر القرن الثامن الهجري\u003c/td\u003e\u003ctd\u003eضعف موارد بيت المال\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eالْمَثَلُ الَّذِي تَكَأُونَ فِيهِ وَالَّذِي تَشْرَبُونَهُ وَالَّذِي تُنْفِقُونَهُ فِيهِ وَأَنْتُمْ صَائِمُونَ\u003c/p\u003e\u003ccite\u003eحديث شريف، صحيح مسلم، كتاب الصيام\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eطريق دار حول قارة كاملة فسلب مصر دورها الوسيط في تجارة الشرق دون سيف، فتحوّل أعظم ميناء في الدولة إلى محطة جانبية على طريق لا يقود إليه. ومن هذه اللحظة بدأ الانهيار المالي الذي يصفه الفصل التالي.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"economic-collapse","n":"الانهيار الاقتصادي وتآكل الجيش","ic":"💸","part":"القسم الثامن: طريق البرتغاليين والانهيار والغوري","h":"\u003carticle class=\"ch3\" id=\"economic-collapse\" data-toc=\"الانهيار الاقتصادي وتآكل الجيش\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e8.2\u003c/span\u003e\n          \u003ch3\u003e💸 الانهيار الاقتصادي وتآكل الجيش\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eل\u003c/span\u003eم تكن مصر في أواخر القرن الثامن الهجري فقيرة، بل كانت غنية ببطء. حين تباطأ دخول الرسوم خرج الخلل من دفتر الحساب إلى دفتر الجند، ومن دفتر الجند إلى سور الدولة.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكانت الدولة في أواخر أيامها تجبي من ثلاثة مواضع: ضريبة الأرض، والرسوم على التجارة في الموانئ، واحتكار سلع مثل السكر. وكان أكثر هذه الموارد رهانًا على ما يدخل من سواحل، ثم جاء الطريق الجديد في المحيط ليضرب المورد الذي كانت الدولة تعتمد عليه أكثر من غيره. ولأن بيت المال لم يكن يفصل موارده في حساب واحد، فقد ظهر أثر هذه الضربة الواحدة في كل باب من أبواب الإنفاق معًا، فلم يعزّ الدوام إلى باب بعينه بل أصاب الدواوين كلها.\u003c/p\u003e\u003cp class=\"ap\"\u003eومن أوضح علامات الانهيار ما طرأ على النقد. فالدينار المملوكي كان منذ أيام الدولة عملة ثابتة الوزن، تكفي القليل من الذهب الضائع فيها لحساب تجار كبار. ثم إن الحاجة إلى النقد دفعت الدولة إلى ترقيق وزنه في فترات متقاربة، كما فعل قايتباي نحو سنة ٨٤٧هـ الموافق ١٤٤٣م حين خفّض وزن الدينار قليلًا لينقذ بيت المال، وهو إجراء لم يدم إلا أشهر، ثم عاد الوزن الأول بعد جمع الفضة الخفيفة وعصرها من جديد، وهي عملية كلّفت الدولة كلفة باهظة لأجل فائدة عابرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوإلى جانب الذهب والفضة بدأ النحاس يفرض نفسه في المعاملات الصغيرة. فالقرش البرجي المعروف بالشرفي حلّ محل القطع الفضية في صغائر المدفوعات، فانتشر في الأسواق، ومعه انتشر غشّ النحاس وهرّ القطع على قِطره. ويختلف المؤرخون في السلطان الذي أوّل هذا القرش، غير أنهم يتفقون على ظهوره في أواخر القرن الثامن الهجري وعلى أن الفضة ندت منه تدريجيًا حتى كادت تختفي من التداول في مصر والشام معًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأشدّ ما ظهر أثره في المؤسسة نفسها هو الجند. فقد كانت طبقة المماليك تعتمد في معيشتها على جراية شهرية تدفعها الدولة من بيت المال، وجرت العادة أن تدفع في أول الشهر. وحين تعثرت الموارد بدأ بيت المال يؤجل، ثم يدفع بعض المال وبعض العطاء، ثم تفاءلت المسألة إلى أمراء بيوت المماليك فتنافسوا على نصيب كل بيت منهم، وصارت الجيوش أشبه بحوافز لأهل البيوت منها بجيش لحساب السلطان، وتضاءلت قيمة الرتبة:في نظر المماليك أنفسهم، فاقبلوا على الخدمة مرغمين لا راغبين.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان أثر ذلك في الناس يظهر على صورة موجتين: موجة غلاء وموجة مرض. فقد تواترت في العقود الأخيرة من القرن الثامن الهجري سنواتٌ تدفّق فيها فيض النيل فلم يكن بزوال، وسنواتٌ أخرى خُطب فيها عن غلاء عظيم مات به جمع من الناس. وقد اجتمع على مصر في هذه الحقبة غلاء وجوع ووباء حتى بدا ما عُرف في سنين الغنى فقرًا. ولا بدّ من التصريح بأن للمؤرخين في تحديد سنوات هذه الكوارث خلافًا، فهم يتفقون على وقوعها ويختلفون في تواريخها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوليس صحيحًا أن أزمة هذه السنين كانت مفاجئة؛ فقد سبقها أكثر من قرن من الإنذار. فقد رأى قايتباي نفسه في أيامه الأخيرة يقف على بيت مالٍّ ضيّق، فأخذ بترقيق الدينار حين ضاقت الموارد، وأخذ بمصادرة أموال الأمراء بعد وفاته. ولو وعظ تابعيه لظن بعضهم أن الأمر عابر، لكن الخلل كان بنيويًا لا موسميًا، فلم يكن في بيت المال ما يسدّ ثغرة تفتحها اليوم وتُغلق غدًا.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eمن أين كانت الدولة تجبي\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم تكن مصر تدفع ضريبة واحدة، بل كانت تتقاسم الحصّة بين بيت المال والمماليك أنفسهم، فكان للمماليك نصيب من الأرض يعوّضهم عن الخدمة، وكان لبيت المال نصيبه يُفقَد ببطء. ولهذا فإن ارتفاع ضريبة الأرض كان يظهر أوّلًا في دفاتر الجند لا في سجلات بيت المال وحده.\u003c/p\u003e\u003cp class=\"ap\"\u003eأما الرسوم فكانت دخيلةً على نظام الدولة كله، لأن مَن يجمعها لا يملك الحرفة ولا يسقي الأرض ولا ينصب في الحرث. ولهذا كانت أسرع أبواب الخلل أثرًا حين تعطلت البضاعة في الطريق، إذ لم يكن لبيت المال من مصدر آخر يحميه منها، فقد جرت العادة أن يكون بيت المال آخر من يشتكي.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eنقد الدولة ونقد السوق\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الدينار في عهد قايتباي أثقل عملة متداولة في مصر والشام، ولم يكن أحد يجرؤ على المساس بوزنه إلا بقرار من السلطان. وحين خفّضه قايتباي نحو سنة ٨٤٧هـ كان ذلك إعلانًا واضحًا بأن بيت المال لم يعد يملك ما يكفي، وأن الحل المؤجل هو إلقاء الثمن على النقد، وهو حلٌّ يملك ضرره اليوم ولا يفيد غدًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم جاء القرش البرجي ليضيف إلى اختلال الوزن اختلال القيمة. فالنحاس لا يدخل بيت المال قيمةً نقدية، والخلاف بين التاجر والدولة يصير خلافًا على الوزن لا على الرضا. ومن هنا تُفسَّر الأسعار العالية التي اشتكى منها أهل مصر في هذه السنين، وهي أسعار لم يكن سببها فيض النيل وحده.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالجند بين الراتب والوعد\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم تكن مشكلة الجند في نقص العدد، فمصر لم تخلُ يومًا من المماليك، بل في نوعهم. فقد عوّضت الدولة ضعف العدد بلقطاء سرعوا في التدريب، وصارت الطبقة تتغير أسرع مما تتغير الرتب، ولهذا بدا حينئذ الجند تابعًا للسلطان مباشرةً ومطمعًا لأمرائه، وهو ما يجعل الراتب المسكوت عنه أشدّ خطرًا من ردّه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكما تدهورت جودة الجند تدهورت مكانته في الدولة. فقد كان المماليك أيام قايتباي يملؤون دواوين الإدارة والخراج، ثم لم يعد في الدواوين من يحتاجهم الديوان إلا للجيش وحده. ولهذا بدا الانهيار في الدواوين قبل أن يظهر في الميدان، إذ كانت دفاتر الدواوين أصدق بيّانًا لحال الجند من ساحة المعركة.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eموارد الدولة\u003c/b\u003e\u003cspan\u003eالخراج والرسوم واحتكار السكر، وأخطرها الرسوم\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأول تخفيف\u003c/b\u003e\u003cspan\u003eخفّض قايتباي وزن الدينار نحو سنة ٨٤٧هـ\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eقرش البرجية\u003c/b\u003e\u003cspan\u003eنحاس حلّ محل الفضة في المعاملات الصغيرة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأثر ذلك\u003c/b\u003e\u003cspan\u003eتأخرت رواتب المماليك وتنافس عليها أمراء البيوت\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمؤشر\u003c/th\u003e\u003cth\u003eما كان عليه\u003c/th\u003e\u003cth\u003eما صار إليه\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eدخل الموانئ\u003c/td\u003e\u003ctd\u003eأساس بيت المال\u003c/td\u003e\u003ctd\u003eتناقص بعد طريق المحيط\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eوزن الدينار\u003c/td\u003e\u003ctd\u003eثابت منذ عقود\u003c/td\u003e\u003ctd\u003eخفّفه قايتباي ثم تهاوش في الأوزان\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eمعاملات السوق\u003c/td\u003e\u003ctd\u003eفضة وذهب\u003c/td\u003e\u003ctd\u003eنحاس وغشّ متكرر في الوزن\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eجراية المماليك\u003c/td\u003e\u003ctd\u003eتدفع في أول الشهر\u003c/td\u003e\u003ctd\u003eتُؤجل وتتنافس عليها بيوت الأمراء\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eحال الرعية\u003c/td\u003e\u003ctd\u003eأمن وفرة\u003c/td\u003e\u003ctd\u003eغلاء وجوع ووباء\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eإِنَّ الَّذِينَ يَأْكُلُونَ أَمْوَالَ الْيَتَامَىٰ ظُلْمًا إِنَّمَا يَأْكُلُونَ فِي بُطُونِهِمْ نَارًا وَسَيَصْلُونَ نَارًا\u003c/p\u003e\u003ccite\u003eسورة النساء، الآية ١٠\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eدخل بيت المال اضمحل حين خفّت التجارة، والنقد فقد ضمانه، والجراية تأخّرت، فخرج الخلل من الدفاتر إلى الميدان. وبهذا يكون السلطان الأخير قد ورث دولةً مثقلة الحساب لا دولةً قوية.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"al-ghawri-sultan","n":"سلطان قانصوه الغوري","ic":"🦁","part":"القسم الثامن: طريق البرتغاليين والانهيار والغوري","h":"\u003carticle class=\"ch3\" id=\"al-ghawri-sultan\" data-toc=\"سلطان قانصوه الغوري\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e8.3\u003c/span\u003e\n          \u003ch3\u003e🦁 سلطان قانصوه الغوري\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eو\u003c/span\u003eصل إلى العرش لا في موكب انتصار، بل في واحدة من تلك الدورات التي سمّتها كتب الدواوين انقلابًا. سلطانٌ اشتراه أمراؤه بالبلاط قبل أن تشتريه دار الخلافة، وحكم نحو خمس عشرة سنة أعيقته الحسابات قبل أن تعجزه الساحة.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eقانصوه الغوري من أصول جرجسية، دخل دار السلطان مماليك صغيرًا ثم رُقّي في الطوائف حتى صار من كبار الأمراء في أيام قايتباي. وأما نسبه من بيت السلطان نفسه فمختلف فيه: فمن المؤرخين من يعدّه من أبناء قايتباي، ومنهم من يصفه أميرًا من بيوت الجند تربّى في بلاط قايتباي وتدرّب فيه. والذي لا خلاف فيه أنه بلغ العرش لا بالوراثة بل بمجلس البيعة ومكيدة أمرائه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي هذا الطور تولّى أمر مصر أمراء كبار يتناوبون النفوذ خلف سلاطين صغار، حتى إذا خُلع السلطان انتقل الملك إلى أمير آخر لا إلى وليّ العهد، وصار العرش يُباع ويُشترى في مجالس القلعة كما تُباع الإقطاعات. وكان يقود الدولة فعليًا قانصوه الغوري، فلمّا خُلع السلطان جان بلاط سنة ١٥٠١م بايعه الأمراء سلطانًا، فكان صعوده إلى العرش ببيعة البيوت لا بقرار قدره في نفسه.\u003c/p\u003e\u003cp class=\"ap\"\u003eولم يكن في مقدرة السلطان أن يأمر المماليك بطاعة قسرية، فقد كان أمراؤه الكبار يملكون من الجند والجراية ما يجعل الطاعة لهم مسألة تفاوض لا مسألة أمر. فعمد قانصوه إلى جمع الأمراء وإرضائهم بالمال والامتيازات، فكان يُنهي خلافًا بين أميرين ببركة أو بهدية، ثم يحفظ لنفسه حامية خاصة من المماليك الجدد يتغذى رواتبهم من خزينته الخاصة، ولم يكن في هذا إلا حلٌّ مؤجل لمشكلة الطاعة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان أعقد ما في أيامه علاقة سلطته بالدولة العثمانية الناشئة. فقد كانت القسطنطينية ترى في مصر ولايةً كبيرة خرجت عن طاعتها، وكانت القاهرة ترى في القسطنطينية دولةً حديثة لا تعرف لها فضلًا. ودارت بينهما رسائل وهدايا وسفارات، وفي كل واحدة منها سؤال مضمر عن الحدّ الذي تنتهي عنده كل دولة. وكان الغوري يعرف أن جاره في الشمال أقوى منه، وأن الوقت ليس في صالحه، فكان يماطل في كل ما يُطلب منه من طاعة صريحة، ويؤجل الجواب سنة بعد سنة.\u003c/p\u003e\u003cp class=\"ap\"\u003eومن مظاهر سلطته أن بلاطه بدا فيه ميل إلى فارس والتشيع. فقد ظهر من بعض أمرائه من أصل جغرافي أو فارسي، ووصلت مصر برسائل إلى الدولة الصفوية في عهد شاه إسماعيل، ونزل على مصر لاجئون شيعة طلبوا الحماية. ولم يكن هذا الميل بدعة في العقيدة بل عادة في المودة والسياسة، وهو ميل تُوهم به الرواية حين تقول إن الغوري كان مائلًا إلى الفرس، وهي رواية تستند إلى اتصالات بعينها أكثر مما تستند إلى عقيدة مؤرَّخة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوجد قانصوه في السلطنة دولةً على وشك الانهيار: بيت مالٍّ معطّل الموارد، وجيش كثير العدد ضعيف التدريب، وحدٌّ شرقي تتنازله دولة عثمانية تكبر يومًا بعد يوم. ولم يكن في مصر حليف واحد في الشام، ولا في الشرق من يمدّ يده لها إذا اشتعلت الحرب. وقد بدأ قبل انقضائه بأن يعيد تدريب المماليك الجدد، لكن الوقت كان أقصر من المهمة، ومن جمع خزائن قلّت، ومَماليك لا يعرف بعضهم بعضًا في الميدان.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eنسبه المختلف فيه\u003c/h4\u003e\u003cp class=\"ap\"\u003eنسبه المختلف فيه يكشف الطريقة التي بلغت بها هذه الفئة من الجند إلى العرش، فالنسب في مصر لم يكن مصدر حق كما كان في بيوت الأتراك الأولى، بل امتيازًا يبتكره بيت الحكم نفسه لمن يخدمه. ولذلك يُعقل أن يختلف المؤرخون في نسب الغوري، فالأمر فيه قولان مبنيان على قدر صلة كل واحد منهما بالسلطان.\u003c/p\u003e\u003cp class=\"ap\"\u003eومن ثمّ كان من الطبيعي ألا ينفرد الغوري بتأييد الأمراء له، فقد كان ينافسه على البيعة سواء كان ابن السلطان أو غير ابنه. وليس في ذلك عيب في نسبه، بل هو حال نظام الحكم في برجية المماليك حين صار العرش يُبايع كما تُبايع السلعة بين البيوت. وكانت هذه البيعة نفسها هي التي تحدد من يحكم، لا النسب ولا وصية السلطان السابق، ولهذا كانت كل بيعة تفتح بابًا جديدًا للتنازع بين البيوت.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eشراء الطاعة بالذهب\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يكن في خزانة قانصوه ما يكفي لشراء بيوت الجند كلها، فاختار أن يشتري رؤوسها. كان يجمع كبار الأمراء في مجلس واحد، ويوزّع عليهم الإقطاعات والخلع والمناصب، ويترك لكل واحد منهم حاشيته ومماليكه على حالها، فصار كل أمير في بلاطه دولة صغيرة لها جندها ومالها. ولم يكن ذلك كرمًا من السلطان بل حسابًا باردًا: من دفع له أميره ثمن طاعته في المجلس لم يكن في وسعه أن يعصيه في الميدان، وهذا أقصى ما بلغته سياسة السلطنة في آخر أيامها.\u003c/p\u003e\u003cp class=\"ap\"\u003eغير أن هذا الشراء كان ينفد سريعًا، فما يُعطى اليوم يُطلب غدًا مضاعفًا. ولأن بيت المال لم يعد يملك ما يوزّع، تحوّل السلطان إلى المكوس على الأسواق والقرى ليجد ما يدفعه لأمرائه، فدارت الحلقة على نفسها: كلما اشترى طاعة أمير أفقر الرعية، وكلما أفقر الرعية ضعفت موارد الدولة، فاحتاج إلى شراء طاعة جديدة بثمن أغلى. وقد لاحظ مؤرخو العصر أن عطايا الغوري كانت تُذكر في مجالس الأمراء أكثر مما تُذكر في دواوين الخراج.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالوالي العثماني في القاهرة\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم تكن حماية خاير بكش مجاملة، بل ضرورة في نظر السلطان. فقد كان واليًا عثمانيًا على مصر عُزل أو كاد يُعزل، فجاء إلى القاهرة وأقام في ظل الغوري، وكان الغوري يرى أن من استُبدّ به في دار سلطانه فهو عدوّ للدولة العثمانية قبل أن يكون عدوًّا لمصر، وأن في إيوائه بابًا من أبواب المعرفة بأحوال الأناضول وحركة جيوشه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا التحالف حذقٌ وهشاشة في الوقت نفسه. فمتى عاد خاير بكش إلى حظيرة سلطانه، أو انقطع خبره في الطريق، وجدت مصر نفسها بلا سند في بيوت الأمراء، ولا عين لها في بلاط القسطنطينية. وقد كان الغوري يعتمد على تقاريره في تقدير موعد الزحف، فلمّا تغيّرت الأحوال لم يجد من يخبره بما يجري خلف الحدود، وظلّ يقرأ أخبار الحرب من أفواه التجار والقادمين.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسنوات الحكم\u003c/b\u003e\u003cspan\u003eنحو خمس عشرة سنة، من سنة ١٥٠١م إلى سنة ١٥١٦م\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eطريق الصعود\u003c/b\u003e\u003cspan\u003eبيعة أمراء البيوت لا وراثة بيت السلطان\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأداة الحكم\u003c/b\u003e\u003cspan\u003eالإقطاع والخلعة والمنصب مقابل الطاعة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسند مفقود\u003c/b\u003e\u003cspan\u003eخاير بكش عينه في بلاط سلطان الأتراك\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eحاصل الأمر\u003c/b\u003e\u003cspan\u003eدولة كثيرة الجند قليلة المال\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالباب\u003c/th\u003e\u003cth\u003eما كان في أول الدولة\u003c/th\u003e\u003cth\u003eما صار في آخرها\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eبيت المال\u003c/td\u003e\u003ctd\u003eرسوم الموانئ والخراج\u003c/td\u003e\u003ctd\u003eمكوس على الأسواق والقرى\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالجند\u003c/td\u003e\u003ctd\u003eمماليك مشتراة ومدرّبة في الطوائف\u003c/td\u003e\u003ctd\u003eأعداد كثيرة بلا تدريب منتظم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالأمراء\u003c/td\u003e\u003ctd\u003eأتباع للسلطان في الطاعة والغزو\u003c/td\u003e\u003ctd\u003eبيوت تتفاوض على الطاعة بثمن\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالحليف في الشام\u003c/td\u003e\u003ctd\u003eأمراء مماليك في حلب ودمشق\u003c/td\u003e\u003ctd\u003eولاة عثمانيون أو أمراء منقلبون\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eقُلِ اللَّهُمَّ مَالِكَ الْمُلْكِ تُؤْتِي الْمُلْكَ مَن تَشَاءُ وَتَنزِعُ الْمُلْكَ مِمَّن تَشَاءُ وَتُعِزُّ مَن تَشَاءُ وَتُذِلُّ مَن تَشَاءُ بِيَدِكَ الْخَيْرُ إِنَّكَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ\u003c/p\u003e\u003ccite\u003eسورة آل عمران، الآية ٢٦\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eسلطانٌ بلغ العرش ببيعة البيوت لا بوراثة، فحكم دولةً كانت مصارفها أكبر من مواردها وأمراءها أقوى من سلطانها. وفي هذه الحال لم يكن أمامه من سياسة إلا أن يشتري الوقت، والوقت كان أقصر من أن يُشترى.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"egypt-alone","n":"مصر وحدها أمام العثمانيين","ic":"✂️","part":"القسم الثامن: طريق البرتغاليين والانهيار والغوري","h":"\u003carticle class=\"ch3\" id=\"egypt-alone\" data-toc=\"مصر وحدها أمام العثمانيين\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e8.4\u003c/span\u003e\n          \u003ch3\u003e✂️ مصر وحدها أمام العثمانيين\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eل\u003c/span\u003eم يكن السقوط ضربةً واحدة نزلت على دولة قوية، بل حصيلة سنوات انحسرت فيها حدود الدولة حتى لم يبقَ منها إلا وادي النيل. وحين نظر السلطان في خريطة ملكه سنة ١٥١٦م لم يجد شامًا تحميه ولا حليفًا في الشرق، بل وجد مصر وحدها في وجه جيش لم يُهزم منذ سنين.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eبدأ الانحسار من الأطراف قبل أن يبلغ القلب. فبعد أن استقرّت الولايات العثمانية في الأناضول وبلغت مشارف الشام، صارت الثغور الشمالية تُدار من القسطنطينية لا من القاهرة، وفقدت مصر مواقعها المتقدمة واحدة بعد أخرى. ولم يكن ذلك بمعارك كبرى، بل بتسليمات متتابعة وهدايا ورسائل، حتى صار ما بين مصر وحدود خصمها مسافة قصيرة لا يقطعها جيش في أسابيع. وبهذا انقلبت معادلة كانت قائمة منذ أيام بيبرس: كانت مصر تُقاتل على حدود الشام فتحمي واديها، فصارت تُقاتل على حدودها هي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي هذا الفراغ أخذت المطالبة بالطاعة تتكرر بأشكال مختلفة. فكان سلطان الأتراك يكتب إلى الغوري يذكّره بأنه من جنس المماليك الذين خدم آباؤهم الدولة، ويدعوه إلى إقامة الخطبة باسمه، ويعدّه في رسائله بمنزلة الوالي لا بمنزلة السلطان المستقل. وكان الغوري يردّ ردًّا يلين في اللفظ ويشدّ في المعنى، فيخاطبه بلقب السلطان ويجتهد في ألا يلتزم له بطاعة صريحة، ويُرجئ الحسم إلى وقت آخر. ولم يكن في هذا التردد ضعف رأي بقدر ما كان معرفةً بأن الجواب الصريح يعني الحرب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأشدّ ما أوهى موقف مصر أن جيشها كان من نوعين لا يلتقيان. فالمماليك فرسانٌ مدرّبون على الرمح والسيف والقوس، يعرفون الكرّ والفرّ ويثقون بشجاعتهم، ولا يعرفون من السلاح الناري إلا ما يُطلق مرة واحدة. أما جيش الأتراك فقد صار قوامه المشاة النظاميون، يحملون البنادق ويقفون صفًّا خلف المتاريس فيضربون من بعيد. وكان المماليك يرون في البندقية سلاحًا لا يليق بالفارس، ويعدّون من يحمله جبانًا، فبقوا على عادتهم في القتال، وهذه العادة هي التي حسمت الميدان قبل أن تبدأ المعركة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوإلى جانب السلاح كان المال. فتجهيز حملة إلى الشام يحتاج إلى رواتب الشهور المقبلة وإلى عتاد وخيول ومؤن، وكلها تُدفع قبل أن تصل الجيوش. وقد اضطُرّ الغوري إلى جمع المكوس من الأسواق والقرى، وإلى سحب الفلاحين إلى الجند قبل موسم الحصاد، فخرجت الحملة بمال مجموع على عجل وبجند لم يتدرّب معًا. وكان في هذا دليل على أن الدولة كانت تحارب بمالها الأخير، وأن ميزانية الحرب التهمت ما بقي في الخزائن من غير أن تُغيّر شيئًا في نوع الجند.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان الخطر الأكبر في داخل الصفّ لا خارجه. فقد كان كبار الأمراء ينظرون إلى الحرب كأنها حساب بين بيوتهم، ومن رأى منهم أن الغوري ساقطٌ لا محالة بدأ يبحث عن طريقه إلى السلطان الجديد. وكان جان بردي الغزالي نائب دمشق يميل إلى الصلح ويُشير على السلطان بترك القتال، وكان خاير بكش نائب حلب على صلة بسفارة سليم الأول. ولم يكن الغوري يجهل ذلك، لكنه لم يستطع أن يضرب أمراءه في وقت هو أحوج ما يكون إلى سيوفهم، فسكت عنهم وسار بهم إلى المعركة وهو يعلم أن بعضهم لن يقاتل.\u003c/p\u003e\u003cp class=\"ap\"\u003eفلمّا وقف الجيشان في مرج دابق صار الحساب واضحًا: جيشٌ يعرف الفروسية ولا يعرف النار، وجيشٌ لا يبارز بل يضرب من بعيد، وأمراءٌ في الصف الأول ينتظرون أول هزيمة ليعلنوا ولاءهم الجديد. ولم تكن الهزيمة نتيجة نقص في الشجاعة، فقد قاتل من قاتل حتى الموت، بل نتيجة دولة لم تُجدّد سلاحها ولا رجالها ولا مالية حربها في الوقت الذي تجدّد فيه خصمها كل شيء. وهذا هو معنى أن تقف مصر وحدها: لا لأن أحدًا خذلها في تلك الساعة، بل لأنها لم تُعِدّ لتلك الساعة ما يُعدّ لها.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eثغور الشام التي سقطت\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم تسقط الثغور في يوم واحد، بل تسللت من يد الدولة ثغرًا بعد ثغر. فكان أمير حلب يُعيّن من القاهرة ثم صار يُعيّن بموافقة القسطنطينية، وكان أمير دمشق يحكم باسم السلطان ثم صار يحكم باسمه واسم غيره. وحين انتهى الأمر إلى هذا الحد لم يبقَ في الشام لمصر جيشٌ يصدّ عنها، ولا قلعةٌ تُقاتل دونها، ولا أميرٌ يُقسم لها بالطاعة إلا ومعه حساب آخر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت حلب أوضح مثال على ذلك. فهي أول ما يلقاه القادم من الأناضول، وهي مفتاح الشام كله، وقد صارت في آخر أيام الدولة ولايةً يتنازعها أميران: أميرٌ من بيت المماليك يحكم باسم القاهرة، وسلطانٌ في القسطنطينية يطلب الخطبة باسمه. ولم تكن حلب في ذلك ضعيفة بذاتها، بل كانت قوية بما فيها من جند ومال، وإنما صار انتماؤها موضع مساومة، ومن كان موقفه موضع مساومة فهو أول ما يُباع في الحرب.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eرسائل الطاعة وثمنها\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت المراسلات بين السلطانين تُقرأ في القاهرة كما تُقرأ أخبار المعارك. فكل رسالة تحمل لقبًا جديدًا أو تلميحًا إلى القرابة أو تذكيرًا بخدمة قديمة، وكلها تُقاس بمقياس واحد: هل فيها اعتراف بالطاعة أم لا. وكان الغوري يعلم أن الاعتراف يعني أن يصير سلطان مصر واليًا في نظر القسطنطينية، وأن رفضه يعني الحرب في وقت لا يملك فيه ما يكفي لها.\u003c/p\u003e\u003cp class=\"ap\"\u003eولم يكن الطريق إلى الصلح مسدودًا في كل لحظة، فقد جرت محاولات لإقامة تحالف بالمصاهرة أو بتقاسم النفوذ، ودُفعت الهدايا وحُملت الرسائل. غير أن كل محاولة كانت تتعثر في نقطة واحدة: من يكون الأول في الشام؟ فمصر لا تقبل أن تتنازل عن الشام، والقسطنطينية لا تقبل أن تتركه لأمير يعيّنه غيرها. وبهذا صار الشام هو ثمن الصلح، ولم يكن في يد الغوري ما يدفعه.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالفرق في السلاح\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان المماليك يعدّون الفروسية فضيلة قبل أن يعدّوها حرفة، ومن لا يُحسن الرمح لا يُعدّ فارسًا ولو حمل البندقية. وكان هذا الموقف مفهومًا في جيش نشأ على المبارزة، لكنه كلّف الدولة غاليًا، فبينما كان الأتراك يطوّرون المدافع والبنادق ويجعلونها عماد المشاة، كان المماليك يشترونها ولا يعرفون كيف يستخدمونها في الميدان، ويضعونها في الأسوار أكثر مما يضعونها في الصفوف.\u003c/p\u003e\u003cp class=\"ap\"\u003eوظهر الفرق في المعركة على صورة قاسية: مدافع الأتراك تضرب من مسافة بعيدة فتفرّق الصفوف قبل أن تتلاقى السيوف، والفرسان لا يستطيعون الوصول إلى من يرميهم. وقد أدرك بعض أمراء المماليك هذا الخلل وحاولوا إدخال البنادق في الجند، غير أن المحاولة جاءت في سنوات لا تملك فيها الدولة ثمن البارود ولا وقت التدريب، فبقيت في حدود التجربة الفردية لا في نظام الجيش.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالحدود\u003c/b\u003e\u003cspan\u003eانحسرت من الفرات إلى مشارف غزة في أقل من جيل\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eجيش المماليك\u003c/b\u003e\u003cspan\u003eفرسان بالرمح والسيف، قليلون في السلاح الناري\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eجيش الأتراك\u003c/b\u003e\u003cspan\u003eمشاة نظاميون بالبنادق والمدافع\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eثمن الصلح\u003c/b\u003e\u003cspan\u003eالشام، ولم يكن في يد مصر ما تدفعه\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالنتيجة\u003c/b\u003e\u003cspan\u003eدولة تحارب بمالها الأخير ورجالها القدامى\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالوجه\u003c/th\u003e\u003cth\u003eدولة المماليك سنة ١٥١٦م\u003c/th\u003e\u003cth\u003eالدولة العثمانية سنة ١٥١٦م\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالسلاح\u003c/td\u003e\u003ctd\u003eسيف ورمح وقوس\u003c/td\u003e\u003ctd\u003eبندقية ومدفع ومشاة منظمة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالجند\u003c/td\u003e\u003ctd\u003eمماليك مشتراة بأعداد محدودة\u003c/td\u003e\u003ctd\u003eجند نظامي ثابت الرواتب\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمال\u003c/td\u003e\u003ctd\u003eرسوم موانئ ضعفت ومكوس على الرعية\u003c/td\u003e\u003ctd\u003eخراج واسع من الأناضول والبلقان\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالحلفاء\u003c/td\u003e\u003ctd\u003eلا حليف في الشام ولا في الشرق\u003c/td\u003e\u003ctd\u003eولايات تابعة في الشام والعراق\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالقيادة\u003c/td\u003e\u003ctd\u003eسلطان تحاصره بيوت الأمراء\u003c/td\u003e\u003ctd\u003eسلطان يملك جيشًا واحدًا مطيعًا\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eوَأَطِيعُوا اللَّهَ وَرَسُولَهُ وَلَا تَنَازَعُوا فَتَفْشَلُوا وَتَذْهَبَ رِيحُكُمْ وَاصْبِرُوا إِنَّ اللَّهَ مَعَ الصَّابِرِينَ\u003c/p\u003e\u003ccite\u003eسورة الأنفال، الآية ٤٦\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eلم تقف مصر وحدها لأن أحدًا تخلى عنها في ساعة، بل لأنها لم تُعِدّ لتلك الساعة جندًا جديدًا ولا سلاحًا جديدًا ولا مالًا جديدًا. وحدها كانت النتيجة، وحدها كان الثمن.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-9","n":"القسم التاسع: مرج دابق والريدانية والسقوط","ic":"","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-9\" style=\"--c:#0F6B5C\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e💥\u003c/div\u003e\n      \u003ch2\u003eالقسم التاسع: مرج دابق والريدانية والسقوط\u003c/h2\u003e\n      \u003cp\u003eتنتهي هذه الفصول بالحرب التي أنهت دولة المماليك: زحف سليم الأول على الشام، ومعركة مرج دابق سنة ١٥١٦م، ثم فتح مصر في الريدانية سنة ١٥١٧م، ثم حصيلة السقوط ومصائر من نجا من المماليك.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#ottoman-march-on-syria\"\u003eزحف سليم الأول على الشام\u003c/a\u003e\u003ca href=\"#marj-dabbik-battle\"\u003eمعركة مرج دابق سنة ١٥١٦م\u003c/a\u003e\u003ca href=\"#al-ridaniya-1517\"\u003eالريدانية وسقوط القاهرة\u003c/a\u003e\u003ca href=\"#aftermath-of-the-fall\"\u003eحصيلة السقوط ومصائر المماليك\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"ottoman-march-on-syria","n":"زحف سليم الأول على الشام","ic":"⚔️","part":"القسم التاسع: مرج دابق والريدانية والسقوط","h":"\u003carticle class=\"ch3\" id=\"ottoman-march-on-syria\" data-toc=\"زحف سليم الأول على الشام\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e9.1\u003c/span\u003e\n          \u003ch3\u003e⚔️ زحف سليم الأول على الشام\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eل\u003c/span\u003eم تكن الحرب بين مصر والقسطنطينية حادثًا مفاجئًا، بل نتيجة سنوات طال فيها التنافس على الشام حتى لم يبقَ مجال للمهادنة. وحين زحف سليم الأول سنة ١٥١٦م لم يكن يفتح بلادًا جديدة بقدر ما كان يحسم سؤالًا قديمًا: من يحكم المشرق؟\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكانت العلاقة بين الدولتين قد مرّت بعهود من المهادنة والحرب معًا. فقد تقاربتا في أواخر القرن التاسع الهجري حين صار البرتغاليون يهددون البحر الأحمر والمحيط الهندي، وتعاونت أساطيلهما في بعض المواضع على ملاحقة سفن الفرنج، وتبادلتا السفارات والهدايا. ثم انقلب الميزان بعد فتح القسطنطينية سنة ١٤٥٣م، وبعد أن ثبتت الدولة العثمانية في البلقان والأناضول، فلم يعد التعاون بينهما ضرورة متكافئة بل حسابًا تتغيّر فيه الأثمان بحسب قوة كل طرف.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأوضح ما غيّر الموقف معركة جالديران في الثالث والعشرين من أغسطس سنة ١٥١٤م، حين هزم سليم الأول الشاه إسماعيل الصفوي هزيمةً ثقيلة، فاطمأنّ إلى جبهته الشرقية وتفرّغ لما في الغرب والجنوب. ثم ضمّ ديار بكر، ثم أنهى إمارة ذي القدر في الأناضول الجنوبي في معركة تورناداغ سنة ١٥١٥م. وكانت هذه الإمارة هي الحاجز الأخير بين حدود الدولتين، فلمّا سقطت صار جيش الأناضول على مقربة من حلب لا يفصله عنها إلا مسير أيام.\u003c/p\u003e\u003cp class=\"ap\"\u003eوبهذا انتقل الصراع من حساب إلى مواجهة. فلم تكن مصر تملك في الشام قلاعًا تُقاتل عنها، ولا جيشًا متمركزًا على الحدود، ولا أمراءً يثق بولائهم. وكان الغوري يعلم أن الحرب إن وقعت ستقع في الشام لا في مصر، وأن الشام في تلك السنين لم يكن سندًا بل مسؤولية: أرضٌ واسعة تحتاج إلى حامية، وأمراء يحتاجون إلى مال، ومدنٌ تحتاج إلى أسواق، وحدودٌ تحتاج إلى جيش يقف عليها ولا يتحرك.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان خاير بكش أول من أدرك أن الحساب انتهى. وكان نائبًا على حلب في أواخر أيام الدولة، وقد خبر الجند والتكتيك في مصر والشام، وعرف أن سلطانه لن ينصره في ميدان يتقابل فيه الفرسان مع البنادق. فبدأ يتحدث مع سفارة سليم الأول سرًّا، ووعد بأن يفتح الطريق إلى مصر، ولم يكن في نظره خائنًا بقدر ما كان رجلًا في بيت على وشك الخسارة يبحث عن مكانه في البيت الجديد قبل أن تُقسم الغنائم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوخرج الغوري من القاهرة في ربيع سنة ١٥١٦م على رأس زحف لم يكن فتحًا ولا غزوًا، بل محاولة لتثبيت ما بقي في يد الدولة من الشام. واستخلف على مصر طومان باي، وسار شمالًا حتى بلغ غزة، ثم تقدم إلى صيدا وبيروت، وأرسل من هناك رسائل إلى سلطان الأتراك يعرض الصلح ويطلب ردّ الأمراء الذين لاذوا به. ثم جمع إليه من بقي من أمراء الشام، ومشى حتى وقف على مقربة من جيوش خصمه، وهو يعلم أن ما جمعه ليس جيشًا واحدًا بل بيوتًا متجاورة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي هذه السنين تبادلت السفارات في اتجاه ثالث هو فارس. فكتب الغوري إلى الشاه إسماعيل يعرض التحالف على الأتراك، فجاءه الجواب بالحذر والتحذير، وكتب سليم الأول إلى الصفويين يعرض المصاهرة ويُربكهم. ولم يمضِ وقت طويل حتى أدرك الغوري أن زلفه إلى الفرس لا ينفعه أمام جيش لا يُهزم، وأنه بقي بلا حليف في الشرق. وقد حذّره من أمر خاير بكش أكثر من واحد، ومنهم أمير دمشق نفسه، فلم يعاقبه خشية أن تضطرب القلوب قبل المعركة، واعتمد على رأي جان بردي الغزالي الذي كان يجنح إلى الصلح.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eجالديران وتحرّر الجبهة الشرقية\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم تكن جالديران معركة عابرة في تاريخ الأناضول، بل كانت المفتاح الذي فتح الطريق نحو الجنوب. فقد كان سليم الأول يقاتل على جبهتين: جبهة الصفويين في الشرق، وجبهة المماليك في الجنوب. وحين انتصر في الشرق انتصارًا حاسمًا لم يبقَ أمامه ما يمنعه من تحويل جيشه كله إلى جهة واحدة، وصار كل شهر يمر بعد ذلك شهرًا في غير صالح مصر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأثر المعركة لم يكن في القتلى وحدهم بل في هيبة الدولة الصفوية التي انكسرت أمام جيرانها، وفي ثقة الجيش العثماني بنفسه. فالجيش الذي هزم الشاه في ميدان مفتوح لم يكن يخشى فرسانًا بعد ذلك، ولو كانوا من أحسن فرسان المشرق. وبهذا خرج سليم الأول من سنة ١٥١٤م بجيش يثق بقائده ويرى أن أمامه فراغًا لا مقاومة فيه.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eلماذا الشام قبل مصر\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يكن اختيار الشام اعتباطًا. فالشام هي الباب الذي يُفتح منه المشرق، وهي الأرض التي تُوصل الأناضول بمصر والحجاز والعراق، ومن يملكها يملك طرق التجارة والحج معًا. وكانت حلب أول محطة في هذا الطريق، ودمشق ثانيها، ومن وقف فيهما لم يحتج إلى عبور الصحراء إلا في آخر الأمر وبتخطيط طويل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي الشام أيضًا كانت الشرعية. فدمشق وحلب والقدس مدنٌ لها وزنها في نظر المسلمين، ومن دخلها دخل بوصفه حاميًا لا غازيًا، وهذا ما يحتاجه سلطان يبني دولته على الفتوح. أما مصر فلم تكن هدفًا في نفسها بل نتيجةً لازمة: من أخذ الشام لم يستطع أن يترك مصر خلفه دولةً مستقلة تُهدده في ظهره.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eخاير بكش وحساب البيت\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان خاير بكش أميرًا جرجسيًا وُلي ولاية حلب في أواخر أيام الدولة، وأدرك مبكرًا أن سلطانه لن ينصره أحد في هذه الحرب. ومن حوله من كبار أمراء الجركس يعرفون أن العرش عندهم يُشترى ولا يُورث، وأن من يقف مع الخاسر يخسر إقطاعه ورأسه معًا، فكان حساب البيت عنده أسبق من حساب الدولة.\u003c/p\u003e\u003cp class=\"ap\"\u003eفبدأ يتحدث مع سفارة سليم الأول سرًّا، ووعدهم بأن يفتح لهم الطريق إلى مصر. ولمّا شرع في مشروعه سكت الغوري عن الأمر، بل استهزأ بحجج من حذّره، وتبع في ذلك رأي جان بردي الغزالي الذي كان يميل إلى الصلح قبل أن تنكب الأيام. ولم يكن سكوته رحمةً بخاير بكش، بل خوفًا من أن يُشعل بيده فتنةً في جيشه قبل المعركة بأيام.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eجالديران\u003c/b\u003e\u003cspan\u003e٢٣ أغسطس سنة ١٥١٤م، هزيمة الشاه إسماعيل\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eذي القدر\u003c/b\u003e\u003cspan\u003eضمّها سليم الأول سنة ١٥١٥م فزال الحاجز بين الحدودين\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eخروج الغوري\u003c/b\u003e\u003cspan\u003eمن القاهرة في ربيع سنة ١٥١٦م نحو الشام\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالاستخلاف\u003c/b\u003e\u003cspan\u003eطومان باي نائبًا على مصر في غياب السلطان\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالحليف المفقود\u003c/b\u003e\u003cspan\u003eلا تحالف مع الفرس ولا سند من أمراء الشام\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eأثره على مصر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e١٤٥٣م\u003c/td\u003e\u003ctd\u003eفتح القسطنطينية\u003c/td\u003e\u003ctd\u003eتحوّل التوازن في المشرق لصالح الدولة الجديدة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٤٨٥م إلى ١٤٩١م\u003c/td\u003e\u003ctd\u003eحرب عثمانية مملوكية\u003c/td\u003e\u003ctd\u003eتثبيت حدود مؤقتة في الشمال لا تصمد طويلًا\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٥١٤م\u003c/td\u003e\u003ctd\u003eمعركة جالديران\u003c/td\u003e\u003ctd\u003eتحرّر سليم الأول من جبهته الشرقية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٥١٥م\u003c/td\u003e\u003ctd\u003eضمّ إمارة ذي القدر\u003c/td\u003e\u003ctd\u003eزوال الحاجز الأخير بين حدود الدولتين\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٥١٦م\u003c/td\u003e\u003ctd\u003eخروج الغوري إلى الشام\u003c/td\u003e\u003ctd\u003eآخر زحف مملوكي نحو الشمال\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eوَأَعِدُّوا لَهُم مَّا اسْتَطَعْتُم مِّن قُوَّةٍ وَمِن رِّبَاطِ الْخَيْلِ تُرْهِبُونَ بِهِ عَدُوَّ اللَّهِ وَعَدُوَّكُمْ\u003c/p\u003e\u003ccite\u003eسورة الأنفال، الآية ٦٠\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eلم يزحف سليم الأول على الشام لأنه أراد أرضًا جديدة، بل لأن الطريق إلى مصر يمرّ من هناك، ولأن الشام كانت مفتوحة لا محصّنة. وخرج الغوري ليدافع عن آخر ما بقي في يده، فوجد نفسه في ميدان لا يحكمه هو.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"marj-dabbik-battle","n":"معركة مرج دابق سنة ١٥١٦م","ic":"⚔️","part":"القسم التاسع: مرج دابق والريدانية والسقوط","h":"\u003carticle class=\"ch3\" id=\"marj-dabbik-battle\" data-toc=\"معركة مرج دابق سنة ١٥١٦م\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e9.2\u003c/span\u003e\n          \u003ch3\u003e⚔️ معركة مرج دابق سنة ١٥١٦م\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي سهل واسع شمال حلب تقابل جيشان لا يتشابهان في شيء: فرسان يعرفون المبارزة، ومشاة يعرفون النار. وفي ساعات قليلة انتهت دولة، لا لأن سيوفها كانت أقل حدًّا، بل لأن زمن السيف كان قد انتهى.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eالتقى الجيشان في مرج دابق شمال حلب في الرابع والعشرين من أغسطس سنة ١٥١٦م، الموافق الخامس والعشرين من رجب سنة ٩٢٢هـ. وكان الجيش المملوكي كثير العدد، يُقدَّر بأكثر من ستين ألف مقاتل، ومعه مدافع وبنادق بعضها من صناعة محلية وبعضها مما جُمع في سنوات سابقة. وكان الجيش العثماني أقل عددًا في بعض الروايات وأكثر انضباطًا في كلها، ومدفعيته أثقل وأدقّ تصويبًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eووقف الغوري في قلب المعركة على رأس فرسانه، ووضع خاير بكش في الميسرة، وجعل جان بردي الغزالي في موضع آخر من الصف. وكانت الخطة المملوكية تقوم على ما أُحسنته هذه الدولة منذ قرون: حملة فرسان واحدة تكسر قلب العدوّ قبل أن يثبت، ثم مطاردة تقضي على الباقي. ولم تكن الخطة خاطئة في ميدان يواجه فيه الفارس فارسًا، لكنها كانت خطة معركة مضت قبل أن يظهر المدفع.\u003c/p\u003e\u003cp class=\"ap\"\u003eبدأ القتال بضرب المدفعية العثمانية، فلم يكن في وسع الفرسان أن يصلوا إلى من يرميهم، ولا أن يبقوا واقفين تحت نيران لا تنقطع. وحين اندفعت الحملة المملوكية وجدت صفوفًا ثابتة خلف متاريس وعربات، فانكسر دفعها الأول. وفي هذه اللحظة بدأت الميسرة تتخلخل، ثم انسحبت ومَعها من كان فيها من جند حلب، فانفتح جناح الجيش المملوكي على مصراعيه وانكشف قلبه من جهة لا يستطيع سدّها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالرواية الأشهر أن الانهيار بدأ بشائعة. فقد شاع في الصفوف أن السلطان قُتل أو أن الهزيمة وقعت في الجهة الأخرى، فبدأ الجند يتسللون، ثم صارت الشائعة نفسها سببًا في وقوع ما ترويه. ولا يُعرف على وجه اليقين من أطلقها، غير أن المؤرخين يجمعون على أن انسحاب بعض كبار الأمراء في تلك الساعة هو الذي حوّل التراجع إلى انهيار كامل، ولم يكن في وسع أحد أن يوقف التراجع بعد أن صار كل واحد يحسب سلامته وحده.\u003c/p\u003e\u003cp class=\"ap\"\u003eواختلفت الروايات في موت الغوري اختلافًا لا يُرجَّح فيه قول. فمنها ما يقول إنه سقط عن فرسه فأدركه الموت في الميدان، ومنها ما يقول إنه مات غمًّا حين رأى صفوفه تتفرق من حوله، ومنها ما يقول إنه قُتل بعد أن انكشف موضعه. والذي لا خلاف فيه أن السلطان الذي خرج من القاهرة ليؤدب جاره لم يعد إليها، وأن جسده حُمل إلى حلب ودُفن فيها، ولم يجد من يكتب سيرة حكمه من داخل بلاطه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي أعقاب المعركة انفتح الطريق كله. فدخل سليم الأول حلب بعد أيام، ثم زحف جنوبًا فدخل حمص وحماة، ثم وقف على دمشق في أوائل أكتوبر سنة ١٥١٦م فسلّمها أهلها بعد مفاوضات، وأقرّ جان بردي الغزالي واليًا عليها باسمه. وبهذا انتقل الشام كله إلى العثمانيين في أقل من شهرين، ولم يبقَ بين سلطانهم وبين مصر إلا الصحراء، ولم يكن في الشام من يملك جيشًا يقف به في وجهه بعد أن ذهب جيش مصر.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالميدان والصفّان\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان مرج دابق سهلًا مفتوحًا لا يمنح أحد الجانبين ساترًا، وهذا في صالح من يملك النار لا في صالح من يملك السيف. وقد اختاره العثمانيون بعناية، لأنه يسمح للمدفعية بأن تعمل على مدى واسع، ويحرم الفرسان من الاقتراب تحت غطاء من الأرض. أما المماليك فقد كانوا يفضّلون ميدانًا ضيقًا يقلّل أثر النار ويزيد أثر الحملة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان الفرق في التنظيم أظهر من الفرق في العدد. فالجيش العثماني مقسّم إلى وحدات ثابتة لها قوّادها ورواتبها ونظام تعبئتها، يستطيع قائده أن يحرّك منها ما يشاء ويحتفظ باحتياطي. أما الجيش المملوكي فكان مجموع بيوت لكل بيت رايته وحاشيته، يتحرك حيث يرى أميره، ويقف حيث يقف، ولا يعرف من أمره إلا أميره المباشر.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eساعة الانهيار\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم تكن الهزيمة نتيجة ضربة واحدة بل نتيجة تتابع. فحين ثبت القلب وبدأت الميسرة تنكشف، لم يكن في وسع الغوري أن يعيد تنظيم صفّه وهو تحت النار، ولا أن يستدعي احتياطيًا لأنه لم يكن يملك احتياطيًا. وكانت كل وحدة تقاتل في مكانها، فلمّا انسحبت وحدة انفتحت ثغرة لا يُسدّها إلا من كان فيها وقد ذهب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد وصف مؤرخو العصر تلك الساعة بصور متقاربة: تكسّر الصفوف، وسقوط الرايات، وفرسان يتراجعون إلى الخلف فيجدون الخلف قد تراجع أيضًا. وفي مثل هذا الموقف لا يفصل بين الجيش المنهزم والجيش المنتصر إلا الفوضى، وهي التي تحوّل التراجع إلى هزيمة كاملة في أقل من ساعة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eموت السلطان ورواية المؤرخين\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان موت الغوري في الميدان نهايةً رمزية لدولة كاملة. فقد كان آخر سلطان مملوكي يخرج بنفسه إلى الحرب على رأس جيشه، وآخر من حاول أن يعيد للسلطنة هيبتها القديمة بمال مجموع على عجل وجند لم يتدرب معًا. ولم يترك من بعده سلطانًا يستطيع أن يجمع ما تفرّق، بل ترك نائبًا في القاهرة يواجه مصيرًا لم يختره.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد تناقضت الروايات في تفاصيل موته تناقضًا يكشف أكثر مما يخفي. فبعضها يجعله ميتًا بالسكتة، وبعضها يجعله مقتولًا، وبعضها يجعل جسده قد وُجد بين القتلى لا يُعرف إلا بثيابه. وهذا التناقض نفسه دليل على أن المعركة كانت أسرع من أن يحفظ أحد تفاصيلها، وعلى أن الدولة التي سقطت لم تجد من يكتب عنها من داخل خيمتها.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالتاريخ\u003c/b\u003e\u003cspan\u003e٢٤ أغسطس سنة ١٥١٦م، الخامس والعشرين من رجب سنة ٩٢٢هـ\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمكان\u003c/b\u003e\u003cspan\u003eمرج دابق شمال حلب\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسبب الانهيار\u003c/b\u003e\u003cspan\u003eانسحاب الميسرة وشيعة الهزيمة في الصفوف\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمصير السلطان\u003c/b\u003e\u003cspan\u003eمات في الميدان وحُمل إلى حلب فدُفن فيها\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالنتيجة\u003c/b\u003e\u003cspan\u003eانتقال الشام إلى العثمانيين في أقل من شهرين\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالوجه\u003c/th\u003e\u003cth\u003eالمماليك في مرج دابق\u003c/th\u003e\u003cth\u003eالعثمانيون في مرج دابق\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالعماد\u003c/td\u003e\u003ctd\u003eفرسان وأمراء بيوت\u003c/td\u003e\u003ctd\u003eمشاة نظاميون ومدفعية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالخطة\u003c/td\u003e\u003ctd\u003eحملة واحدة تكسر القلب\u003c/td\u003e\u003ctd\u003eنار بعيدة ثم هجوم على الأجنحة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالاحتياط\u003c/td\u003e\u003ctd\u003eلا احتياطي منظم\u003c/td\u003e\u003ctd\u003eوحدات محفوظة للطوارئ\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالقيادة\u003c/td\u003e\u003ctd\u003eالسلطان في القلب والأمراء حوله\u003c/td\u003e\u003ctd\u003eقيادة واحدة مركزية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالنتيجة\u003c/td\u003e\u003ctd\u003eانهيار الصفوف ومقتل السلطان\u003c/td\u003e\u003ctd\u003eفتح الشام في أسابيع\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eوَمَا أَصَابَكُمْ يَوْمَ الْتَقَى الْجَمْعَانِ فَبِإِذْنِ اللَّهِ وَلِيَعْلَمَ الْمُؤْمِنِينَ\u003c/p\u003e\u003ccite\u003eسورة آل عمران، الآية ١٦٦\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eلم تُحسم مرج دابق بالشجاعة ولا بالعدد، بل بفارق في نوع السلاح ونظام الجيش. ومات الغوري في الميدان، فماتت معه آخر محاولة لدولة المماليك أن تحتفظ بمكانها في المشرق.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"al-ridaniya-1517","n":"الريدانية وسقوط القاهرة","ic":"🏛️","part":"القسم التاسع: مرج دابق والريدانية والسقوط","h":"\u003carticle class=\"ch3\" id=\"al-ridaniya-1517\" data-toc=\"الريدانية وسقوط القاهرة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e9.3\u003c/span\u003e\n          \u003ch3\u003e🏛️ الريدانية وسقوط القاهرة\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eب\u003c/span\u003eعد الشام لم يكن أمام سليم الأول خيار: إما أن يترك مصر دولةً منفصلة تُهدد ظهره، وإما أن يزحف عليها. وفي الريدانية، على مشارف القاهرة، انتهت دولة المماليك في يوم واحد.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eقضى سليم الأول شتاء سنة ١٥١٦م في الشام، ثم عاد إلى حلب ودمشق ينظم ما فتح، ويقرّر ما يفعل بمصر. وكان في رأي كثير من أمرائه أن يكتفي بالشام ويعود إلى القسطنطينية، لأن الزحف على مصر يعني عبور صحراء طويلة ومواجهة دولة لم تُستنزف بعد. لكنه رأى أن مصر لا تُترك، لأن من يملك الشام ولا يملك مصر يملك نصف طريق، ومن يملك مصر يملك الحجاز والبحر الأحمر وتجارة الشرق.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي القاهرة كان طومان باي يواجه أصعب أشهر في تاريخ السلطنة. فقد بويع بعد موت الغوري وهو يعلم أن ما في يده ليس دولةً كاملة بل بقية دولة: خزائن فارغة، وأمراء يتشاورون في مصائرهم، وجند لم يُدفع لهم منذ شهور. ومع ذلك أخذ يجمع المال بالسلف والمصادرة، وأمر بتحصين مداخل القاهرة، وأعدّ خنادق ومواقع في الريدانية على الطريق الشمالي، وكان يعرف أن الوقت ليس في يده.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في جيشه شيء من السلاح الناري هذه المرة. فقد جمع ما استطاع من المدافع والبنادق، ووزّعها على مواقع محصّنة، وأدخل في الجند عددًا من أبناء القاهرة والفلاحين ممن لا يعرفون القتال النظامي لكنهم يعرفون كيف يقفون في مكان. ولم يكن هذا جيشًا جديدًا، بل محاولةً أخيرة لتصنيع جيش في أسابيع، ولم يكن في مصر من يُدرّب هذا الجند على الوقوف في الصفوف، فكان أكثرهم يحمل السلاح لأول مرة في حياته.\u003c/p\u003e\u003cp class=\"ap\"\u003eووقعت المعركة في الثاني والعشرين من يناير سنة ١٥١٧م، الموافق التاسع والعشرين من ذي الحجة سنة ٩٢٢هـ. وبدأت بضرب المدفعية، ثم اندفعت الحملة المملوكية على القلب العثماني فكادت تخترقه، حتى ثبتت الصفوف وردّت المدفعية النار. وحين تكرّرت الحملة الثانية كانت الخنادق قد ضيّقت الميدان، فصارت الفرسان تُستقبل بالنار من ثلاث جهات، وانهار الصفّ المملوكي قبل الغروب.\u003c/p\u003e\u003cp class=\"ap\"\u003eودخل العثمانيون القاهرة في الأيام التالية، فجرى فيها ما يجري في المدن التي تُؤخذ عنوة: نهبٌ في الأسواق، وقتلٌ في الطرق، وتخريبٌ طال بعض المساجد والدور. ثم أعلن سليم الأول الأمان بعد أن استقرّ في القلعة، وعفا عن كثير من الأهالي، وأمر بإحصاء ما في الخزائن، ونقل ما وجده من ذخائر الدولة إلى معسكره. وقد وصف مؤرخو المدينة تلك الأيام بأنها لم تشهد لها نظيرًا، وذكروا أن الأسواق أُغلقت أيامًا ثم عادت تفتح على غير ما كانت عليه.\u003c/p\u003e\u003cp class=\"ap\"\u003eأما طومان باي فلم يُقبض عليه في المعركة. انسحب إلى الجيزة ثم إلى الوجه البحري، وظلّ شهرين يقود مقاومة صغيرة على شكل هجمات متفرقة على حاميات العثمانيين، يعتمد فيها على من بقي معه من المماليك وعلى تعاطف أهل القرى. ثم دلّ عليه أحد من كان معه، فقُبض عليه وأُتي به إلى القاهرة، وصُلب على باب زويلة في أبريل سنة ١٥١٧م. وبهذا انتهت دولة المماليك التي حكمت مصر نحو ثلاثة قرون.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eطومان باي ومسؤولية العرش الأخير\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يكن طومان باي سلطانًا في وقت سليم. فلمّا بويع كانت الخزائن خالية والجيوش موزعة والأمراء يفكرون في مصائرهم أكثر مما يفكرون في الدولة. وقد حاول أن يشتري الوقت بالمال وبالمفاوضات وبالتحصينات، لكن الوقت كان الشيء الوحيد الذي لا يُشترى في تلك السنين، لأن خصمه هو من يحدد سرعته لا هو.\u003c/p\u003e\u003cp class=\"ap\"\u003eومع ذلك كانت مقاومته بعد سقوط القاهرة أطول من مقاومة الجيش كله في الريدانية. فقد ظلّ يقاتل في الأرياف شهرين، وهذا يدل على أن المشكلة لم تكن في فقدان الشجاعة بل في فقدان التنظيم. ومن يقاتل بلا تنظيم في ميدان مفتوح يُهزم في ساعة، ومن يقاتل بتنظيم صغير في أرض يعرفها يصمد شهرين.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالريدانية: خنادق في وجه الفرسان\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الريدانية محاولة مملوكية صادقة لتعويض الفارق في السلاح. فالمماليك لم يكونوا أغبياء في الحرب، وقد رأوا ما حدث في مرج دابق، فحاولوا أن يجعلوا الميدان ضيقًا وأن يستخدموا النار من مواقع ثابتة. لكن المحاولة جاءت متأخرة، لأن ما بُني في أسابيع لا يوازي ما بُني في عقود.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالدرس العسكري واضح: التحصين لا يعوّض عن الجيش، والنار لا تعوّض عن النظام. فقد كان في الريدانية مدافع وبنادق، لكن لم يكن فيها وحدات مدرّبة على المناورة تحت النار، ولا قيادة تستطيع أن تنقل وحدة من مكان إلى مكان في أثناء المعركة. ولهذا انهارت المواقع واحدة بعد أخرى.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالقاهرة بعد المعركة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت القاهرة في تلك الأيام أكبر مدينة في المشرق، وفيها من المساجد والمدارس والأسواق ما لم يكن في غيرها. وقد أصابها النهب في الأيام الأولى، ثم عادت الحياة إليها سريعًا لأن المدينة التي تعيش على التجارة لا تحتمل التوقف طويلًا. وعادت الأسواق تفتح، وعاد القضاة إلى مجالسهم، وجلس الوالي الجديد في القلعة.\u003c/p\u003e\u003cp class=\"ap\"\u003eغير أن ما تغيّر لم يكن في العمارة بل في المكانة. فالقاهرة التي كانت عاصمة دولة مستقلة صارت عاصمة ولاية، والقلعة التي كانت تُبايَع فيها السلطنة صارت مقرًّا لوالٍ يعيّنه سلطان في مدينة بعيدة. وهذا التغيّر هو الذي شعر به أهل المدينة أكثر مما شعروا بالمعركة نفسها.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالتاريخ\u003c/b\u003e\u003cspan\u003e٢٢ يناير سنة ١٥١٧م، التاسع والعشرين من ذي الحجة سنة ٩٢٢هـ\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمكان\u003c/b\u003e\u003cspan\u003eالريدانية على الطريق الشمالي إلى القاهرة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالسلطان\u003c/b\u003e\u003cspan\u003eطومان باي، آخر سلاطين المماليك\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمقاومة\u003c/b\u003e\u003cspan\u003eشهران في الوجه البحري بعد سقوط القاهرة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالنهاية\u003c/b\u003e\u003cspan\u003eصلبه على باب زويلة في أبريل سنة ١٥١٧م\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمرحلة\u003c/th\u003e\u003cth\u003eما جرى\u003c/th\u003e\u003cth\u003eأثره\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالتحضير\u003c/td\u003e\u003ctd\u003eخنادق ومدافع في الريدانية\u003c/td\u003e\u003ctd\u003eمحاولة لتعويض فارق السلاح\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمعركة\u003c/td\u003e\u003ctd\u003eحملة فرسان على القلب العثماني\u003c/td\u003e\u003ctd\u003eردّتها المدفعية وثبتت الصفوف\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eسقوط القاهرة\u003c/td\u003e\u003ctd\u003eدخول العثمانيين ونهب أول أيام\u003c/td\u003e\u003ctd\u003eإعلان الأمان بعد استقرار القلعة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمقاومة\u003c/td\u003e\u003ctd\u003eهجمات متفرقة من الجيزة والدلتا\u003c/td\u003e\u003ctd\u003eاستمرار شهرين ثم القبض على السلطان\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالنهاية\u003c/td\u003e\u003ctd\u003eصلب طومان باي على باب زويلة\u003c/td\u003e\u003ctd\u003eانتهاء دولة المماليك في مصر\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eكُلُّ نَفْسٍ ذَائِقَةُ الْمَوْتِ وَإِنَّمَا تُوَفَّوْنَ أُجُورَكُمْ يَوْمَ الْقِيَامَةِ\u003c/p\u003e\u003ccite\u003eسورة آل عمران، الآية ١٨٥\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eقاتل طومان باي بجيش لم يختره ومال لم يكفِه، فخسر المعركة ثم خسر المدينة ثم خسر حياته. وبسقوط القاهرة لم تنته دولة فقط، بل تغيّر مكان مصر في خريطة المشرق ثلاثة قرون.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"aftermath-of-the-fall","n":"حصيلة السقوط ومصائر المماليك","ic":"📜","part":"القسم التاسع: مرج دابق والريدانية والسقوط","h":"\u003carticle class=\"ch3\" id=\"aftermath-of-the-fall\" data-toc=\"حصيلة السقوط ومصائر المماليك\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e9.4\u003c/span\u003e\n          \u003ch3\u003e📜 حصيلة السقوط ومصائر المماليك\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eل\u003c/span\u003eم تنته دولة المماليك في يوم واحد، بل انتهت في سنوات: دولةٌ سقطت في مرج دابق، وعاصمةٌ سقطت في الريدانية، ونظامٌ ظلّ يعمل بعد سقوطه بقرن أو أكثر. وهذا هو أعجب ما في هذا السقوط: أن الدولة ماتت وبقي جهازها.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان أول ما فعله سليم الأول بعد استقراره في القاهرة أن نظر في رموز الشرعية. فآخر الخلفاء العباسيين في القاهرة، المتوكل على الله الثالث، كان في يده لقب الخليفة لا سلطة الخليفة، وقد أخذه العثمانيون معهم إلى القسطنطينية. وفي الروايات المتأخرة أن الخلافة انتقلت إليه بذلك، وهو ما بنت عليه الدولة العثمانية شرعيتها بعد ذلك قرونًا، وإن كان المؤرخون المحدثون يرون في هذه الرواية تبسيطًا لأمر جرى على مراحل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما المماليك أنفسهم فلم يُفنَوا. فقد قُتل من قاتل، وفرّ من استطاع، وبقي الأكثر. وكان سليم الأول يحتاج إلى من يعرف مصر ويدير دفاترها ويجبي خراجها، فلم يكن في وسعه أن يهدم الجهاز الإداري كله. فأبقى على كثير من الأمراء في مناصبهم، وأخذ عليهم البيعة، وأدخلهم في نظام الدولة الجديدة بوصفهم أهل خبرة لا أهل سلطة، وبهذا انقلب النظام من دولة إلى وظيفة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان خاير بكش أول من نال الحظوة في هذا الترتيب. فقد عيّنه سليم الأول واليًا على مصر، فصار أول والٍ عثماني يجلس في القلعة، وهو رجل من بيت المماليك يعرف البلد وأهلها ودواوينها. وبهذا بدأت مصر مرحلة جديدة: ولاية عثمانية يحكمها والٍ عثماني، يدير شؤونها جهاز مملوكي لم يُهدم بل غُيّر اسمه. ولم يكن في هذا اختيارًا بقدر ما كان ضرورة: فمن يحكم مصر لا يستطيع أن يستغني عن أهلها بدفاترهم ولغتهم ومعرفتهم بمنازل الناس.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي الشام كان المصير مختلفًا. فقد أقرّ سليم الأول جان بردي
