<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="description" content="قامت دولة المماليك في مصر سنة 1250م حين تولى أمرها من الأيوبيين عبيد أتراك دربوا على القتال، وبقيت قائمة نحو أربعة قرون حتى هزمها السلطان العثماني سلي">
<title>المماليك وعالم الشرق | موسوعة تاريخ الإسلام</title>
<link rel="preload" href="assets/fonts/amiri-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/amiri-700.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* ===== موسوعة تاريخ الإسلام — التنسيق المشترك ===== */

/* الخطوط محليّة (Subset عربي): لا شبكة، ولا اختلاف في القياس بين تشغيل وتشغيل */
@font-face{font-family:'Amiri';font-style:normal;font-weight:400;font-display:block;
  src:url(assets/fonts/amiri-400.woff2) format('woff2')}
@font-face{font-family:'Amiri';font-style:normal;font-weight:700;font-display:block;
  src:url(assets/fonts/amiri-700.woff2) format('woff2')}
@font-face{font-family:'Cairo';font-style:normal;font-weight:200 1000;font-display:block;
  src:url(assets/fonts/cairo-var.woff2) format('woff2')}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --gold:#B8942F;--gold2:#8B6914;--cream:#FBF4E4;--paper:#FFFDF8;
  --ink:#2E2A24;--muted:#7C7364;--line:#E7DCC3;
  --green:#1E6B3A;--blue:#155E9C;
  --shadow:0 4px 18px rgba(80,60,20,.08);
  --c:#B8942F;
}
body{font-family:'Cairo',sans-serif;background:var(--cream);color:var(--ink);
  min-height:100vh;line-height:1.9;transition:.3s}

body.dark{--paper:#201E1A;--cream:#161512;--ink:#E8E1D2;--muted:#A79E8B;
  --line:#3A362C;--shadow:0 4px 18px rgba(0,0,0,.35)}

main{max-width:820px;margin:0 auto;padding:1.2rem 1.1rem 5rem}

/* ---------- الترويسة ---------- */
header.top{position:sticky;top:0;z-index:60;display:flex;align-items:center;
  justify-content:space-between;gap:.6rem;padding:.55rem 1rem;
  background:var(--paper);border-bottom:2px solid var(--gold)}
.brand{font-family:'Amiri',serif;font-weight:700;font-size:1.02rem;color:var(--ink);
  text-decoration:none;display:flex;align-items:center;gap:.4rem}
.tools{display:flex;align-items:center;gap:.5rem}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
  background:transparent;color:var(--ink);font-size:1.05rem;cursor:pointer;
  display:grid;place-items:center;transition:.2s}
.ib:hover{background:var(--gold);color:#fff;border-color:var(--gold)}
.ib:active{transform:scale(.9)}

/* ---------- قبة التقدم ---------- */
.dome{width:38px;height:44px;position:relative;cursor:default}
.dome svg{width:100%;height:100%;display:block}
.dome .fill{fill:var(--gold);opacity:.85;transition:.4s}

/* ---------- شارات ---------- */
.badge{display:inline-flex;align-items:center;gap:.3rem;font-size:.72rem;
  background:var(--gold);color:#fff;border-radius:50px;padding:.15rem .6rem;
  font-weight:700}

/* ---------- المسار ---------- */
.crumbs{font-size:.82rem;color:var(--muted);margin-bottom:.8rem;
  display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.crumbs a{color:var(--muted);text-decoration:none}
.crumbs a:hover{color:var(--gold2)}

/* ---------- الترويسة البطلة ---------- */
.hero{position:relative;background:var(--paper);border:1px solid var(--line);
  border-top:6px solid var(--c);border-radius:20px;padding:1.6rem 1.3rem 1.4rem;
  text-align:center;box-shadow:var(--shadow);margin-bottom:1.4rem;overflow:hidden}
.hero .ic{font-size:2.6rem;line-height:1}
.hero h1{font-family:'Amiri',serif;font-size:1.9rem;color:var(--c);margin:.3rem 0 .1rem}
.hero .period{color:var(--gold2);font-size:.85rem;font-weight:600;margin-bottom:.6rem}
.hero .intro{color:var(--muted);font-size:.96rem;line-height:2;max-width:620px;margin:0 auto}

/* ---------- زخرفة SVG ---------- */
.orn{display:block;margin:1.2rem auto;opacity:.55}
.orn line,.orn path,.orn circle{stroke:var(--gold);stroke-width:1.1;fill:none}

/* ---------- العناوين ---------- */
h2.sec{font-family:'Amiri',serif;font-size:1.35rem;color:var(--c);
  margin:2rem 0 .9rem;display:flex;align-items:center;gap:.6rem}
h2.sec:before{content:"";width:6px;height:22px;background:var(--gold);
  border-radius:3px;flex:0 0 auto}
h2.sec .n{margin-right:auto;font-family:'Cairo';font-size:.75rem;color:var(--muted);font-weight:400}

/* ---------- الخط الزمني ---------- */
.tlwrap{position:relative;margin-bottom:.4rem}
.tl{display:flex;gap:.6rem;overflow-x:auto;padding:.6rem .2rem 1rem;
  scroll-snap-type:x mandatory;scrollbar-width:thin}
.tl::-webkit-scrollbar{height:5px}
.tl::-webkit-scrollbar-thumb{background:var(--gold);border-radius:9px}
.tli{flex:0 0 150px;scroll-snap-align:center;background:var(--paper);
  border:1px solid var(--line);border-right:4px solid var(--c);
  border-radius:14px;padding:.6rem .7rem;cursor:pointer;text-align:right;
  transition:.22s;font-family:'Cairo'}
.tli:hover,.tli.on{transform:translateY(-3px);box-shadow:var(--shadow);border-right-color:var(--gold)}
.tli b{display:block;color:var(--c);font-size:.9rem}
.tli span{display:block;color:var(--muted);font-size:.76rem;line-height:1.6}
.tlnav{display:flex;justify-content:space-between;margin-top:-.5rem}

/* ---------- الأحداث ---------- */
.ev{background:var(--paper);border:1px solid var(--line);border-radius:16px;
  padding:1rem 1.1rem;margin-bottom:.9rem;box-shadow:var(--shadow);
  opacity:0;transform:translateY(14px);transition:.45s}
.ev.in{opacity:1;transform:none}
.ev-head{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;margin-bottom:.5rem}
.ev-y{background:var(--c);color:#fff;font-size:.74rem;font-weight:700;
  padding:.15rem .55rem;border-radius:6px;white-space:nowrap}
.ev h3{font-family:'Amiri',serif;font-size:1.18rem;color:var(--ink)}
.ev p{font-family:'Amiri',serif;font-size:1.08rem;line-height:2.05;text-align:justify}
.ev .res{margin-top:.7rem;padding:.55rem .8rem;border-right:4px solid var(--gold);
  background:linear-gradient(135deg,rgba(184,148,47,.10),rgba(184,148,47,.04));
  border-radius:10px;font-size:.9rem;color:var(--gold2);font-weight:600}
.ev .res:before{content:"◀ النتيجة  "}

/* ---------- الشخصيات ---------- */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.6rem}
.pc{background:var(--paper);border:1px solid var(--line);border-radius:14px;
  padding:.65rem .8rem;border-top:3px solid var(--c)}
.pc b{display:block;color:var(--ink);font-size:.95rem}
.pc span{display:block;color:var(--muted);font-size:.78rem;line-height:1.65}

/* ---------- النتائج ---------- */
.outs{list-style:none}
.outs li{position:relative;padding:.5rem 1.5rem .5rem 0;border-bottom:1px dashed var(--line);
  font-size:.95rem}
.outs li:before{content:"◆";position:absolute;right:0;color:var(--gold);font-size:.8rem}

/* ---------- المصادر ---------- */
.src{background:var(--paper);border:1px solid var(--line);border-radius:16px;
  padding:.9rem 1.1rem;margin-top:2.2rem}
.src li{font-size:.86rem;color:var(--muted);padding:.25rem 1.2rem .25rem 0;
  position:relative;line-height:1.8}
.src li:before{content:"❋";position:absolute;right:0;color:var(--gold)}
.src li cite{font-style:normal;color:var(--ink);font-weight:600}

/* ---------- التنقل بين الصفحات ---------- */
.pager{display:flex;gap:.6rem;margin-top:1.6rem}
.pager a{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:14px;
  padding:.7rem .9rem;text-decoration:none;color:var(--ink);transition:.22s}
.pager a:hover{border-color:var(--gold);box-shadow:var(--shadow)}
.pager a small{display:block;color:var(--muted);font-size:.7rem}
.pager a b{font-size:.92rem;color:var(--c)}
.pager a.next{text-align:left}
.pager a.empty{visibility:hidden}

/* ---------- الانتقال بين الصفحات ---------- */
main{animation:pageIn .4s ease}
@keyframes pageIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}

/* ---------- فهرس الصفحة الرئيسية ---------- */
.eg{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:.8rem}
.ec{position:relative;background:var(--paper);border:1px solid var(--line);
  border-top:5px solid var(--c);border-radius:18px;padding:1rem .8rem .9rem;
  text-align:center;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);
  transition:.25s;overflow:hidden}
.ec:hover{transform:translateY(-4px);box-shadow:0 10px 26px rgba(80,60,20,.16)}
.ec .ic{font-size:2.1rem;line-height:1.2}
.ec b{display:block;color:var(--c);font-size:.98rem;margin:.25rem 0 .15rem}
.ec small{display:block;color:var(--muted);font-size:.72rem;line-height:1.55}
.ec .pg{height:5px;background:var(--line);border-radius:9px;margin-top:.55rem;overflow:hidden}
.ec .pg i{display:block;height:100%;background:var(--c);width:0;transition:.4s}
.ec .done{position:absolute;top:.4rem;left:.5rem;font-size:.95rem;color:var(--gold)}

/* ---------- البحث ---------- */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;display:none}
.ov.on{display:block}
.panel{position:fixed;inset:0;background:var(--paper);z-index:95;display:none;flex-direction:column}
.panel.on{display:flex}
.sh{display:flex;gap:.6rem;padding:.8rem;border-bottom:2px solid var(--gold)}
.sh input{flex:1;border:0;background:transparent;font-family:'Cairo';
  font-size:1.05rem;color:var(--ink);outline:none}
.sb{flex:1;overflow-y:auto;padding:.8rem}
.res{background:transparent;border:1px solid var(--line);border-radius:12px;
  padding:.7rem .9rem;margin-bottom:.5rem;cursor:pointer}
.res b{display:block;color:var(--c);font-size:.95rem}
.res small{color:var(--muted);font-size:.78rem;line-height:1.6}
.res em{font-style:normal;background:rgba(184,148,47,.22);border-radius:3px;padding:0 2px}

@media(max-width:420px){
  main{padding:.9rem .8rem 4rem}
  .hero h1{font-size:1.5rem}
  .tli{flex:0 0 132px}
}

/* ========== ١) الإطار المزخرف — حواشي المخطوطات (زوايا ثابتة الحجم) ========== */
.frame{position:relative;border:1px solid var(--gold);border-radius:6px;padding:1.6rem 1.35rem}
.frame:before{content:"";position:absolute;inset:5px;border:1px solid var(--gold);
  opacity:.28;border-radius:3px;pointer-events:none}
.crn{position:absolute;width:26px;height:26px;pointer-events:none;color:var(--gold);opacity:.75}
.crn svg{width:100%;height:100%;display:block;stroke:currentColor;fill:none;stroke-width:1.1}
.crn.tl{top:-1px;right:-1px}.cn-tr{}
.crn.tr{top:-1px;left:-1px}
.crn.bl{bottom:-1px;right:-1px}
.crn.br{bottom:-1px;left:-1px}
.frame>*:not(.crn){position:relative;z-index:1}

/* ========== ٢) الخط الزمني الكبير ========== */
.orn{width:210px;max-width:70%;height:18px;opacity:.55}
.bigtl{display:flex;gap:.55rem;overflow-x:auto;padding:1rem .3rem 1.3rem;
  scroll-snap-type:x mandatory;cursor:grab;scrollbar-width:thin;
  -webkit-overflow-scrolling:touch}
.bigtl:active{cursor:grabbing}
.bigtl::-webkit-scrollbar{height:6px}
.bigtl::-webkit-scrollbar-thumb{background:var(--gold);border-radius:9px}
.btl{flex:0 0 126px;scroll-snap-align:center;position:relative;
  display:flex;flex-direction:column;align-items:center;gap:.25rem;
  text-decoration:none;color:inherit;padding-top:1.1rem}
.btl:before{content:"";position:absolute;top:.4rem;right:-.3rem;left:-.3rem;height:2px;
  background:var(--line)}
.btl:after{content:"";position:absolute;top:0;right:calc(50% - 9px);
  width:18px;height:18px;border-radius:50%;background:var(--paper);
  border:3px solid var(--c);z-index:2;transition:.25s}
.btl:hover:after{transform:scale(1.25)}
.btl .ic{font-size:1.6rem;line-height:1;z-index:2}
.btl .nm{font-family:'Amiri',serif;font-size:.86rem;color:var(--c);text-align:center;line-height:1.5}
.btl .yr{font-size:.65rem;color:var(--muted)}
.btl .st{font-size:.6rem;color:var(--gold2);font-weight:700}

/* ========== ٣) تقليب الصفحة ========== */
.flip{position:fixed;inset:0;background:var(--cream);z-index:200;pointer-events:none;opacity:0}
.flip.go{animation:flipA .5s ease forwards}
@keyframes flipA{
  0%{opacity:.95;transform:perspective(1200px) rotateY(0)}
  55%{opacity:.95;transform:perspective(1200px) rotateY(-38deg)}
  100%{opacity:1;transform:perspective(1200px) rotateY(0)}
}
main.flip-out{animation:flipB .3s ease forwards}
@keyframes flipB{to{opacity:0;transform:perspective(1200px) translateX(-45px)}}

/* ========== ٤) تقدّم على شكل سيف ========== */
.sword{position:fixed;bottom:14px;right:50%;transform:translateX(50%);
  z-index:70;pointer-events:none;display:flex;align-items:center;gap:.5rem;
  background:var(--paper);border:1px solid var(--line);border-radius:50px;
  padding:.3rem .85rem;box-shadow:var(--shadow);font-size:.72rem;color:var(--muted)}
.sword svg{height:11px;width:118px}
.sword .bl{fill:var(--gold);opacity:.9}

/* ========== ٥) الأوسمة ========== */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:.55rem;margin-top:.8rem}
.bg{border:1px dashed var(--line);border-radius:14px;padding:.7rem .5rem;text-align:center;
  background:var(--paper);opacity:.4;filter:grayscale(1);transition:.35s}
.bg.on{opacity:1;filter:none;border:1px solid var(--gold);
  box-shadow:0 0 0 1px rgba(184,148,47,.22),var(--shadow)}
.bg .bi{font-size:1.9rem;line-height:1.2}
.bg b{display:block;font-size:.82rem;color:var(--ink);margin-top:.15rem}
.bg small{display:block;color:var(--muted);font-size:.64rem;line-height:1.5}

/* ========== ٦) شريط علوي رفيع ========== */
.topbar{position:fixed;top:0;right:0;left:0;height:3px;z-index:80}
.topbar i{display:block;height:100%;width:0;
  background:linear-gradient(90deg,var(--gold),#E8CE7C);transition:width .1s linear}

/* ==========================================================
   واجهة الصفحات العميقة (فصول متعددة)
   ========================================================== */

/* الفهرس */
.toc{margin-bottom:1.4rem;padding:1.2rem 1.3rem 1.4rem}
.toclist{list-style:none}
.toclist li{margin:0}
.toclist a{display:flex;align-items:center;gap:.6rem;padding:.42rem .3rem;
  border-bottom:1px dashed var(--line);text-decoration:none;color:var(--ink);
  font-size:.92rem;transition:.2s}
.toclist a:hover{color:var(--c);padding-right:.8rem;background:rgba(184,148,47,.07)}
.toclist b{background:var(--c);color:#fff;border-radius:6px;min-width:24px;
  text-align:center;font-size:.72rem;padding:.1rem .3rem;flex:0 0 auto}
.toclist .ttl{flex:1 1 auto;min-width:0}
.toclist .tpg{margin-inline-start:auto;flex:0 0 auto;font-size:.74rem;color:var(--muted);
  background:rgba(184,148,47,.1);border-radius:6px;padding:.05rem .4rem;min-width:26px;text-align:center}

/* عنوان القسم */
.part{margin-bottom:2.6rem}
.part-h{position:relative;text-align:center;margin:2.4rem 0 1.6rem;
  padding:1.1rem .9rem;border-top:1px solid var(--gold);border-bottom:1px solid var(--gold)}
.part-ic{font-size:2rem;line-height:1}
.part-h h2{font-family:'Amiri',serif;font-size:1.5rem;color:var(--c);margin:.2rem 0}
.part-h p{color:var(--muted);font-size:.92rem;max-width:640px;margin:.4rem auto 0;line-height:1.95}

/* الفصل */
.ch3{position:relative;background:var(--paper);border:1px solid var(--line);
  border-radius:16px;padding:1.3rem 1.2rem;margin-bottom:1.1rem;box-shadow:var(--shadow)}
.ch3-h{display:flex;align-items:flex-start;gap:.6rem;margin-bottom:.7rem;
  padding-bottom:.6rem;border-bottom:1px solid var(--line)}
.ch3-n{background:var(--c);color:#fff;font-size:.72rem;font-weight:700;
  padding:.18rem .5rem;border-radius:6px;flex:0 0 auto;margin-top:.25rem}
.ch3 h3,.rbody h3{font-family:'Amiri',serif;font-size:1.35rem;color:var(--ink);line-height:1.6}
.ch3 .lead,.rbody .lead{font-family:'Amiri',serif;font-size:1.12rem;line-height:2.05;
  color:var(--c);font-weight:700;margin-bottom:.7rem}
.ch3 .ap,.rbody .ap{font-family:'Amiri',serif;font-size:1.1rem;line-height:2.15;
  text-align:justify;margin-bottom:.75rem}
.ch3 .sub,.rbody .sub{font-family:'Amiri',serif;font-size:1.15rem;color:var(--c);
  margin:1.2rem 0 .5rem;padding-right:.6rem;border-right:4px solid var(--gold)}

/* صندوق الخلاصة */
.kbox{margin-top:1rem;background:linear-gradient(135deg,rgba(184,148,47,.09),rgba(184,148,47,.03));
  border:1px solid var(--line);border-radius:12px;padding:.8rem .9rem}
.kbox .bt{font-family:'Amiri',serif;color:var(--gold2);font-size:1rem;margin-bottom:.5rem}
.kgrid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.55rem}
.kb{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:.5rem .6rem}
.kb b{display:block;color:var(--blue);font-size:.88rem;margin-bottom:.1rem}
.kb span{font-size:.78rem;color:var(--muted);line-height:1.6;display:block}

/* جدول */
.tblwrap{overflow-x:auto;margin-top:1rem;border:1px solid var(--line);border-radius:12px}
.tblwrap table{border-collapse:collapse;width:100%;min-width:380px}
.tblwrap th{background:var(--c);color:#fff;font-size:.82rem;font-weight:700;
  padding:.55rem .7rem;text-align:right;white-space:nowrap}
.tblwrap td{padding:.55rem .7rem;font-size:.84rem;border-bottom:1px solid var(--line);
  line-height:1.8;vertical-align:top}
.tblwrap tr:last-child td{border-bottom:0}
.tblwrap tbody tr:nth-child(odd){background:rgba(184,148,47,.045)}

/* اقتباس */
.ch3 blockquote,.rbody blockquote{margin:1rem 0;padding:.8rem 1rem;border-right:5px solid var(--gold);
  background:rgba(184,148,47,.07);border-radius:0 12px 12px 0}
.ch3 blockquote p,.rbody blockquote p{font-family:'Amiri',serif;font-size:1.08rem;line-height:2;color:var(--gold2)}
.ch3 blockquote cite,.rbody blockquote cite{display:block;margin-top:.4rem;font-size:.78rem;
  color:var(--muted);font-style:normal}

/* خلاصة الفصل */
.ch3 .res,.rbody .res{margin-top:1rem;padding:.6rem .9rem;border-right:4px solid var(--gold);
  background:linear-gradient(135deg,rgba(184,148,47,.12),rgba(184,148,47,.04));
  border-radius:10px;font-size:.9rem;color:var(--gold2);font-weight:600}
.ch3 .up{display:block;text-align:left;margin-top:.9rem;font-size:.78rem;
  color:var(--muted);text-decoration:none}
.ch3 .up:hover{color:var(--c)}

@media(max-width:420px){
  .ch3{padding:1rem .85rem}
  .ch3 .ap,.rbody .ap{font-size:1.05rem}
  .kgrid3{grid-template-columns:1fr 1fr}
}


/* ==========================================================
   COMFORT — راحة القراءة والزخرفة
   ========================================================== */

/* عرض مريح للسطر: يمنع الإرهاق البصري */
main{max-width:760px}
.ch3 .ap,.ch3 .lead{max-width:100%}

/* سطر استهلالي كبير (حرف Headline) */
.ch3 .lead .drop,.rbody .lead .drop{float:right;font-family:'Amiri',serif;font-size:3.4rem;line-height:.82;
  color:var(--c);margin:.18rem 0 0 .45rem;font-weight:700;opacity:.9;
  border-right:3px solid var(--gold);padding:.1rem .45rem 0 0}

/* فاصل زخرفي بين الأقسام */
.porn{width:280px;max-width:80%;height:38px;margin:0 auto .6rem;display:block}
.porn .ln{stroke:var(--gold);stroke-width:1.1;fill:none;opacity:.7}
.porn .dm{stroke:var(--gold);stroke-width:.9;fill:none;opacity:.5}

/* فهرس الأقسام داخل رأس القسم */
.part-list{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin-top:.7rem}
.part-list a{font-size:.76rem;text-decoration:none;color:var(--muted);
  border:1px solid var(--line);border-radius:50px;padding:.2rem .7rem;transition:.2s}
.part-list a:hover{color:var(--c);border-color:var(--gold);background:rgba(184,148,47,.08)}

/* فهرس متشعّب */
.toclist>li{padding:0}
.toc-part{list-style:none;margin-bottom:.9rem}
.toc-part>b{display:inline-block;margin-left:.4rem}

/* ==========================================================
   القارئ — كتاب بلا تمرير عمودي
   ========================================================== */

/* الصفحة كلها: شريط علوي + مسرح + شريط سفلي */
body.reading{height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
body.reading .top{flex:0 0 auto}
body.reading .flip,body.reading .sword,body.reading .railbar,body.reading .crumbs{display:none}

main.reader{max-width:none;margin:0;padding:0;flex:1;min-height:0;
  display:flex;flex-direction:column;animation:none}

/* الشريط العلوي يحمل اسم الفصل */
.top.reading .brand{flex:1;min-width:0;gap:.35rem}
.top.reading .btxt{display:none}
.rbrand{font-family:'Amiri',serif;font-size:.92rem;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* المسرح */
.rstage{position:relative;flex:1;min-height:0;overflow:hidden;
  perspective:2200px;perspective-origin:50% 50%;touch-action:pan-y}

/* الصفحة */
.rpage{position:absolute;display:flex;flex-direction:column;overflow:hidden;
  background:var(--paper);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 6px 22px rgba(80,60,20,.12)}
.rbody{flex:1;min-height:0;overflow:hidden;padding:12px 20px}
.rpfoot{flex:0 0 auto;height:26px;display:flex;align-items:center;justify-content:center;
  font-size:.72rem;color:var(--muted);border-top:1px solid var(--line);
  direction:ltr;unicode-bidi:isolate}

/* حاوية القياس (خارج الشاشة) */
.rmeas{position:absolute;left:-99999px;top:0;visibility:hidden;pointer-events:none}
.rmeas .rbody{height:auto!important;padding:0;overflow:hidden}

/* ورقة التقليب */
.rleaf{position:absolute;display:none;transform-style:preserve-3d;
  will-change:transform;z-index:20;pointer-events:none}
.rleaf.on{display:block}
.rface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--paper);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);overflow:hidden}
.rback{transform:rotateY(180deg);
  background:linear-gradient(270deg,var(--paper) 55%,var(--cream) 100%)}
.rleaf::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to left,rgba(0,0,0,.30),rgba(0,0,0,0) 45%);
  opacity:calc(var(--a,0)*.95)}
.rleaf.prev::after{background:linear-gradient(to right,rgba(0,0,0,.30),rgba(0,0,0,0) 45%)}

/* الشريط السفلي */
.rfoot{flex:0 0 auto;display:flex;align-items:center;gap:.6rem;
  padding:.35rem .8rem;min-height:56px;border-top:1px solid var(--line);background:var(--paper)}
.rnav{min-height:48px;min-width:66px;padding:.35rem .9rem;border:1px solid var(--line);
  border-radius:12px;background:transparent;color:var(--ink);font-family:'Cairo';
  font-size:.9rem;font-weight:600;cursor:pointer;transition:.2s}
.rnav:hover:not(:disabled){border-color:var(--gold);background:rgba(184,148,47,.07)}
.rnav:disabled{opacity:.3;cursor:default}
.rprog{flex:1;height:9px;min-width:60px;border:0;padding:0;border-radius:9px;
  background:var(--line);overflow:hidden;cursor:pointer;display:block}
.rprog i{display:block;height:100%;width:0;
  background:linear-gradient(90deg,var(--gold),#E3C56A);transition:width .25s}

/* لوحة الفهرس والذهاب إلى صفحة */
.rpanel{position:fixed;top:0;right:0;bottom:0;width:min(86vw,360px);z-index:120;
  background:var(--paper);border-left:1px solid var(--line);display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .28s ease;
  box-shadow:-6px 0 24px rgba(0,0,0,.14)}
.rpanel.on{transform:translateX(0)}
.rphead{display:flex;align-items:center;justify-content:space-between;
  padding:.65rem .9rem;border-bottom:2px solid var(--gold);
  font-family:'Amiri';font-size:1.05rem;color:var(--c)}
.rpjump{display:flex;gap:.5rem;padding:.7rem .9rem;border-bottom:1px solid var(--line)}
.rpjump input{flex:1;min-width:0;min-height:46px;border:1px solid var(--line);border-radius:10px;
  background:var(--cream);color:var(--ink);font-family:'Cairo';font-size:1rem;padding:0 .7rem}
.rpgo{min-height:46px;padding:0 1rem;border:0;border-radius:10px;background:var(--gold);
  color:#fff;font-family:'Cairo';font-weight:700;cursor:pointer}
.rpfont{display:flex;align-items:center;gap:.45rem;padding:.55rem .9rem;
  border-bottom:1px solid var(--line);font-size:.85rem;color:var(--muted)}
.rpfont span{margin-left:auto}
.rpfont button{min-width:44px;min-height:42px;border:1px solid var(--line);border-radius:9px;
  background:transparent;color:var(--ink);font-family:'Cairo';font-size:.92rem;cursor:pointer}
.rpfont button.on{border-color:var(--gold);background:rgba(184,148,47,.12);color:var(--c);font-weight:700}
.rplist{flex:1;overflow-y:auto;padding:.4rem .6rem;-webkit-overflow-scrolling:touch}
.rpitem{display:flex;align-items:center;gap:.55rem;padding:.45rem .5rem;
  border-bottom:1px dashed var(--line);text-decoration:none;color:var(--ink);font-size:.9rem}
.rpitem i{background:var(--gold);color:#fff;border-radius:6px;min-width:32px;text-align:center;
  font-size:.72rem;font-style:normal;padding:.15rem .2rem;flex:0 0 auto}
.rpitem:hover{color:var(--c);background:rgba(184,148,47,.07)}
.rphome{display:block;text-align:center;padding:.85rem;border-top:1px solid var(--line);
  color:var(--c);text-decoration:none;font-weight:700;font-size:.9rem}

/* داخل الصفحة: إزالة إطار الفصل، وتوسيط الجدول بلا تمرير أفقي */
.rbody .ch3{border:0;background:transparent;box-shadow:none;padding:0;margin:0 0 .5rem}
.rbody .ch3-h{border-bottom:1px solid var(--line);padding-bottom:.5rem;margin-bottom:.7rem}
.rbody .part-h{margin:0 0 .6rem;padding-top:.4rem}
.rbody .tblwrap{overflow:hidden}
.rbody .tblwrap table{min-width:0;width:100%;table-layout:auto}
/* كسر الكلمات عند حدودها فقط: overflow-wrap:anywhere كان يقصّ «المرحلة» إلى «المر/حلة» */
.rbody .tblwrap th,.rbody .tblwrap td{word-break:normal;overflow-wrap:break-word;white-space:normal;hyphens:none}
.rbody .people{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.rbody mark{background:rgba(184,148,47,.38);color:inherit;border-radius:3px;padding:0 2px}
/* فهرس أكثف داخل القارئ: أقسام أكثر في الصفحة */
.rbody .toc-part{margin-bottom:.5rem}
.rbody .toclist a{padding:.26rem .3rem}
.rbody .toc-part>ul{margin-top:.2rem}
/* كتلة أطول من الصفحة (الغلاف مثلًا): تمرير داخلي بدل قصّ المحتوى */
.rbody.rflow{overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}

@media(max-width:420px){

  .rfoot{gap:.4rem;padding:.3rem .5rem}
}

/* كثافة القراءة على الجوال: صفحة كتاب لا شرائح عرض */
@media(max-width:560px){

قانصوه الغوري\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href=\"#egypt-alone\"\u003e\u003ci\u003e\u003c/i\u003e\u003cspan class=\"ttl\"\u003eمصر وحدها أمام العثمانيين\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\u003c/ul\u003e\n    \u003c/li\u003e\u003cli class=\"toc-part\"\u003e\u003cb\u003e💥\u003c/b\u003e\n      \u003ca href=\"#part-9\"\u003e\u003cspan class=\"ttl\"\u003eالقسم التاسع: مرج دابق والريدانية والسقوط\u003c/span\u003e\u003c/a\u003e\n      \u003cul\u003e\u003cli\u003e\u003ca href=\"#ottoman-march-on-syria\"\u003e\u003ci\u003e\u003c/i\u003e\u003cspan class=\"ttl\"\u003eزحف سليم الأول على الشام\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href=\"#marj-dabbik-battle\"\u003e\u003ci\u003e\u003c/i\u003e\u003cspan class=\"ttl\"\u003eمعركة مرج دابق سنة ١٥١٦م\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href=\"#al-ridaniya-1517\"\u003e\u003ci\u003e\u003c/i\u003e\u003cspan class=\"ttl\"\u003eالريدانية وسقوط القاهرة\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href=\"#aftermath-of-the-fall\"\u003e\u003ci\u003e\u003c/i\u003e\u003cspan class=\"ttl\"\u003eحصيلة السقوط ومصائر المماليك\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\u003c/ul\u003e\n    \u003c/li\u003e\u003cli class=\"toc-part\"\u003e\u003cb\u003e🧭\u003c/b\u003e\n      \u003ca href=\"#part-10\"\u003e\u003cspan class=\"ttl\"\u003eالقسم العاشر: إرث المماليك بعد الأزمنة\u003c/span\u003e\u003c/a\u003e\n      \u003cul\u003e\u003cli\u003e\u003ca href=\"#military-organisation\"\u003e\u003ci\u003e\u003c/i\u003e\u003cspan class=\"ttl\"\u003eالتنظيم العسكري المملوكي\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href=\"#arts-and-architecture\"\u003e\u003ci\u003e\u003c/i\u003e\u003cspan class=\"ttl\"\u003eالفنون والعمارة في مصر والشام\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href=\"#mamluk-historiography\"\u003e\u003ci\u003e\u003c/i\u003e\u003cspan class=\"ttl\"\u003eمؤرخو الدولة ورؤيتها\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href=\"#mamluk-memory\"\u003e\u003ci\u003e\u003c/i\u003e\u003cspan class=\"ttl\"\u003eالمماليك في الذاكرة اللاحقة\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\u003c/ul\u003e\n    \u003c/li\u003e\u003c/ol\u003e\n  \u003c/div\u003e"},{"u":"p","one":true,"id":"part-1","n":"القسم الأول: الأصول ونشأة الدولة","ic":"","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-1\" style=\"--c:#0F6B5C\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🌅\u003c/div\u003e\n      \u003ch2\u003eالقسم الأول: الأصول ونشأة الدولة\u003c/h2\u003e\n      \u003cp\u003eلم تنشأ دولة المماليك صدفة ولا في ليلة واحدة، بل كانت ثمرة تحوّلات تراكمت عبر قرن كامل. دولة أيوبية موحّدة قسّمت نفسها على ورثتها حتى تفكّكت، وطبقة من المماليك الأتراك نمت في قلعة على النيل حتى صارت قوة لا تُردّ، وحملة صليبية كبرى مزّقت هذه الدولة في شهور معدودة. في هذا القسم نبدأ من الجذور: نتتبّع بدء الدولة الأيوبية على يد صلاح الدين، ونفتح قلعة الروضة على من تدرّبوا فيها، ثم نقف عند معركة المنصورة التي غيّرت مسار المنطقة، وننتهي إلى اللحظة التي انتقلت فيها مقاليد الحكم من أسرة إلى طائفة.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#arab-abbasid\"\u003eمصر والشام في ظل الدولة الأيوبية\u003c/a\u003e\u003ca href=\"#mamluk-system\"\u003eنظام المماليك: التربية والعقد\u003c/a\u003e\u003ca href=\"#mamluks-crusade\"\u003eالمنصورة والحملة الصليبية السابعة\u003c/a\u003e\u003ca href=\"#transition\"\u003eانتقال السلطة: من شجر الدر إلى عز الدين أيبك\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"arab-abbasid","n":"مصر والشام في ظل الدولة الأيوبية","ic":"🏛️","part":"القسم الأول: الأصول ونشأة الدولة","h":"\u003carticle class=\"ch3\" id=\"arab-abbasid\" data-toc=\"مصر والشام في ظل الدولة الأيوبية\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e1.1\u003c/span\u003e\n          \u003ch3\u003e🏛️ مصر والشام في ظل الدولة الأيوبية\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eق\u003c/span\u003eبل أن يطلع فجر المماليك على خارطة الشرق، كانت مصر والشام محكومتين ببيت واحد تحفظه الروابط قبل الدم. وحين تنكسر رابطة البيت تتفتت الدولة، مهما بلغت في ظاهرها من قوة.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eفي سنة ٥٦٥هـ الموافق ١١٧١م دخل أبو المظفر يوسف بن أيوب، المكنى أبوابا والمشهور بصلاح الدين، مدينة القاهرة، وهو يومئذ وزير الخليفة الفاطمي العاضد بالله ونائب سلطان الموصل نور الدين زنكي في مصر. فلما استوى في دار الخلافة أمر بإيقاف الخطبة باسم آخر الفاطميين المستنصر بالله، وأقامها باسم الخلفية العباسي المستعصم بالله الذي كانت مصر تشتري شرعيتها منه منذ سنين. وانتهت بذلك خلافة فاطمية دامت في مصر نحو مئتين واثنتين وستين سنة، فخرجت البلاد من طائفة إلى دولة. وكان قد سبق أن تولى عمه أسد الدين شيركوه قيادة بعثات زنكي إلى مصر، فكانت مصر مدرسة الحكم قبل أن تصير دارا له.\u003c/p\u003e\u003cp class=\"ap\"\u003eولما توفي نور الدين زنكي سنة ٥٧٤هـ الموافق ١١٧٤م خرج صلاح الدين من مصر قاصدا الشام، فدخل دمشق، ثم ضم حمص ثم حلب، فاجتمعت مصر والشام في يد سلطان واحد بعد قرون من التفرق. وفي صيف سنة ٥٨٣هـ التقى بجيوش الفرنج في موضع يعرف بحطين قرب قرنافة، فكانت الكارثة التي قلبت الموازين في فلسطين، ثم دخل بيت المقدس في التاسع والعشرين من رجب من العام نفسه الموافق ٢ أكتوبر ١١٨٧م، وعادت إليه موانئ الساحل ولم يبق على الفرنج سوى عكا. ومُدّت هدنة مع ريتشارد قلب الأسد سنة ١١٩٢م وانتهت بموته بعد شهور قريبة من السلطان.\u003c/p\u003e\u003cp class=\"ap\"\u003eتوفي صلاح الدين بدمشق في ربيع الآخر من سنة ٥٨٩هـ الموافق ٤ مارس ١١٩٣م، وقد وزع قبل موته مماليكه ومدنته على أبناء إخوته، فكانت دمشق للمؤيد محمد، وحلب لشهاب الدين غازي، ومصر لعثمان ثم لابنه ركن الدين علي، وحماة لنور الدين محمود وشرف الدين عيسى. ولم يمض عام على موته حتى اشتعلت الحروب بين هذه الأجزاء وتنافسوا على الملك، وقتل بعضهم بعضا. وكان أبو بكر العادل أخو صلاح الدين قد جربه الزمن في حلب نحو سبع سنين قبل ذلك، فكان أول من حاول جمع شمل البيت، لكنه لم يبلغ ذلك في حياته.\u003c/p\u003e\u003cp class=\"ap\"\u003eولم ينفع هذا الجمع طويلا. توفي العادل سنة ١٢٣٨م، فتفرق إرثه من جديد على أولاده: الكامل محمد بمصر، والمعظم عيسى بدمشق وما حولها، والأشرف موسى ببقية الشام. وقد سبق أن تنازل الكامل طوعا عن بيت المقدس للملك فريدريك الثاني إمبراطور الروم سنة ٦٢٥هـ الموافق ١٢٢٨م مقابل تحالفه مع الفرنج، فكان أظهر تنازل عن أعز نقاط في تاريخ البيت. وفي عام ١٢٤٠م توجه الصالح إسماعيل، وهو من أبناء العادل، إلى مصر خلفا لأخيه الكامل، فاستقرت مصر من جديد في قلب الدولة الأيوبية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكذلك ظلت حماة التي تولىها شرف الدين عيسى معقلا للبيت الأيوبي يمتد أحفاده فيها قرابة قرن بعد سقوط مصر، ومنهم من تلقب بالمظفر فكانت ألقابهم إعلانا بجذرهم الأيوبي الصريح. وفي عام ١٢٥٠م سقط آخر سلاطين البيت عن عرش مصر في ميدان المعركة، فقُطع العرش من ساقه، وبقي في الشام قرابة عقد من الزمان حتى قضى عليه المماليك سنة ٦٥٨هـ الموافق ١٢٦٠م. وهكذا تمضى قرن كامل بين مؤسس الدولة وأول مماليكها، كان عنوانه أن يجمع الحاكم بين الدم والصهر حتى إذا انكسر أحدهما انهار البيت كله.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eخطبة الجمعة بدل خطبة الخلافة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الفاطميون خلافة مستقلة في مصر منذ نحو قرنين يستمدون شرعيتهم من أسلافهم بالأندلس. فلما أقام صلاح الدين الخطبة باسم العباسي أعلن أن مصر عادت إلى أمانة الخلافة التي انفصلت عنها، ومنذ ذلك الحين استند سلطان مصر في حكمه إلى مشروعية الخلافة العباسية وهي ورقة سياسية استخدمها كل من جاء بعده. ولهذا صار لخلافة بغداد في نظر سلاطين مصر قيمة عملية لا رمزية.\u003c/p\u003e\u003cp class=\"ap\"\u003eولم يكن تغيير الخطبة تفصيلة شكلية. فقد أغلق صلاح الدين مدارس الشيعة الفاطمية، وكثر أذان العامة، ونشر مذهب أهل السنّة، فكسب عامة الناس والمحدثين، وارتبطت مصر به ارتباطا شخصيا. وقد لقي هذا الاتجاه ارتياحا من العامة المصرية فقد أرهقهم الفاطميون بالضرائب والاستبداد. وهكذا صارت مصر بعد قرنين من حكم الفاطميين قلبا سنيا مواليا للعباسيين.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eحطين وانقلاب الموازين\u003c/h4\u003e\u003cp class=\"ap\"\u003eتعد حطين في ذاكرة المسلمين أول معارك صلاح الدين الكبرى. قابل فيها نحو اثني عشر ألف مقاتل من المسلمين جيوش الفرنج الذين يفوقونهم عددا وعتادا، وانتهت المعركة بفرار الفرنج لا بقتلهم، فكانت الكارثة الكبرى التي أرهقت جيوشهم سبع سنين متوالية. ولم تمض على المعركة سوى نحو ثلاثة أشهر حتى دخل صلاح الدين بيت المقدس واسترده من الصليبيين.\u003c/p\u003e\u003cp class=\"ap\"\u003eومن دلالات المعركة ما فعله صلاح الدين مع أسرى الفرنج، فقد عاملهم بعهد حسن وأطعمهم وأحسن إليهم حتى كاد بعضهم لا يجد في قلبه مانعا من البقاء إلى جانب المسلمين. وهذه عادة لم تكن شائعة في حروب ذلك العصر، وكانت في كثير من نظريات الحرب سببًا في تماسك جبهات المسلمين.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eقسمة الميراث بعد الموت\u003c/h4\u003e\u003cp class=\"ap\"\u003eالدرس المستفاد من وفاة صلاح الدين أن قوة السلطان لا تساوي قوة بيته. فقد ترك دولة موحدة من مصر والشام والحجاز، فإذا هو يوزعها على نحو عشرين أميرا، فتنابذوا وتنافسوا على الأنصبة حتى ملك كل منهم مدينته، وضعفت الدولة كلها. فالحرب التي خاضها بنو أيوب ضد الفرنج لم تخرج عن حدود مملكتهم، بل استهلكت قوتهم فيما بين بعضهم. وقد كثر في هذا البيت من القتل حتى صار أمره سمعان الخطر على الدولة كلها.\u003c/p\u003e\u003cp class=\"ap\"\u003eولم يكن الولاء في هذا البيت من الدم وحده. فقد اشترى كل أمير مماليكه من سوق النخاسة وبنى بهم جيشا خاصا به، فكان لهذه الجيوش ولاء يسبق ولاء صاحب البيت أحيانا. ولهذا كان التنافس بين الإخوة حادا وبلغ حد القتل. وقد صار أمر الورياثة عبثا يتنازع عليه الأمراء.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسنة التأسيس\u003c/b\u003e\u003cspan\u003e١١٧١م: دخول صلاح الدين القاهرة وإقامة الخطبة للخلافة العباسية\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eنهاية الفاطميين\u003c/b\u003e\u003cspan\u003eخلافة دامت في مصر نحو ٢٦٢ سنة من سنة ٩٠٩م\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمعركة حطين\u003c/b\u003e\u003cspan\u003e١١٨٧م: هزيمة الفرنج وتحرير بيت المقدس في أكتوبر من العام نفسه\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eموت صلاح الدين\u003c/b\u003e\u003cspan\u003e٥٨٩هـ / ١١٩٣م: قسم الدولة على أبنائه وأخيه أبي بكر العادل\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eنهاية البيت في الشام\u003c/b\u003e\u003cspan\u003e٦٥٨هـ / ١٢٦٠م: قضاء المماليك على الدولة الأيوبية في الشام\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالموضوع\u003c/th\u003e\u003cth\u003eالتاريخ\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eاستيلاء صلاح الدين على القاهرة\u003c/td\u003e\u003ctd\u003e١١٧١م\u003c/td\u003e\u003ctd\u003eسقوط الخلافة الفاطمية وبايع مصر للعباسية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eوفاة نور الدين والعبور إلى الشام\u003c/td\u003e\u003ctd\u003e١١٧٤م\u003c/td\u003e\u003ctd\u003eاتحاد مصر والشام في يد سلطان واحد\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eمعركة حطين واسترداد بيت المقدس\u003c/td\u003e\u003ctd\u003e١١٨٧م\u003c/td\u003e\u003ctd\u003eانعكاس الموازين في فلسطين لصالح المسلمين\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eموت صلاح الدين وقسمة الإرث\u003c/td\u003e\u003ctd\u003e١١٩٣م\u003c/td\u003e\u003ctd\u003eبداية التنابذ بين أبناء البيت\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eقضاء المماليك على الأيوبيين في الشام\u003c/td\u003e\u003ctd\u003e١٢٦٠م\u003c/td\u003e\u003ctd\u003eزوال آخر معقل للبيت الأيوبي في الشام\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eإن تأخرت عن دمياط ملكها الفرنج، وإن سرت إليها خلفني المصريون في أهلها بالشر، وخرجوا من طاعتي، وساروا في أثري، والفرنج أمامي؛ فلا يبقى لنا باقية\u003c/p\u003e\u003ccite\u003eكلام مروي عن صلاح الدين الأيوبي، نقله ابن الأثير في الكامل في التاريخ\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eأسس صلاح الدين دولة موحدة من مصر والشام، فلما مات قسمها على ورثته فانقسمت قوتها وتصدعت وحدتها. ومن هذه الشقوق نبت طبقة المماليك التي ملأت الفراغ وأعادت ترتيب الدولة من جديد.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"mamluk-system","n":"نظام المماليك: التربية والعقد","ic":"⚔️","part":"القسم الأول: الأصول ونشأة الدولة","h":"\u003carticle class=\"ch3\" id=\"mamluk-system\" data-toc=\"نظام المماليك: التربية والعقد\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e1.2\u003c/span\u003e\n          \u003ch3\u003e⚔️ نظام المماليك: التربية والعقد\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eل\u003c/span\u003eم يكن المماليك جندا يشترى فيسحق، بل كانت لهم مدرسة تدوم سنوات، وقلعة تحرسهم، ورابطة تسبق الدم. من هذه الثلاثة وُلدت طائفة حكمت مصر والشام أكثر من قرنين.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eلم تكن في مصر طبقة من المماليك قبل القرن السابع الهجري، بل كانت الحاجة تجلبهم من بلدان بعيدة. فمنذ أن حل المغول بخوارزم سنة ٦١٦هـ واصطدموا بملكها، تشتت الخوارزميون وكثر من استرق من القفجاق وبلاد ما وراء النهر. فصار التجار يجلبون أطفال الأتراك والجراكسة من قوقاز وبلاد ما وراء النهر، ويسلكون بهم طريق البحر الأسود إلى خليج القسطنطينية، ثم إلى موانئ الإسكندرية ودمياط، ثم إلى سوق النخاسة بالقاهرة حيث يتباينهم المشترون من الأمراء.\u003c/p\u003e\u003cp class=\"ap\"\u003eولم يكن التجار وحدهم سبب هذا التسيل. فكلما قصر مد النيل اشتد الغلاء، واتخذ اللصوص من فقراء القرى الأطفال وباعوهم لتجار الرقيق. ويذكر البغدادي أن أطفال الفقراء في مجاعة سنة ٥٩٥هـ الموافق ١١٩٨م كانوا يتفرقون في البلاد بلا كفيل ولا حارس، فيلتقطهم اللصوص ويبيعونهم. وقد وصف المقريزي حالا مماثلة في عهد الأشرف شعبان، إذ غلت الأسعار حتى صارت الأولاد في الصعيد تباع من الجوع. وقد كان هذا حالا مألوفا في مصر قرونا طويلة.\u003c/p\u003e\u003cp class=\"ap\"\u003eأما المماليك البحرية فهم أتراك قبجاق في الغالب. وقد أنشأ لهم السلطان الصالح أيوب قرب قصره على النيل قلعة في جزيرة الروضة، فكان ذلك مقرهم الذي نشأوا فيه وتعلموا فيه فنون الحرب. ولما كان أهل مصر يسمون النيل البحر، سمّيت هذه الفئة المماليك البحرية، بينما سمّيت مماليك البرج نسبة إلى مقرهم في برج القلعة وكان أكثرهم من الجراكسة. ولهذا لا يصح الخلط بين الفئتين، فقد وجد المماليك في هذه القلعة فرسانا صامدين حين جاء وقت الحرب.\u003c/p\u003e\u003cp class=\"ap\"\u003eكانت التربية تبدأ من الصغر ولا تنتهي إلا بعد سنوات. يذكر المقريزي أن أول ما يتعلمه المملوك القراءة والكتابة بالعربية، ثم يدرس القرآن الكريم، ثم مبادئ الفقه وآداب الشريعة، ثم يراقب في صلاته وأذكاره من قومه وأربابه. فإذا بلغ سن البلوغ انتقل إلى معلمي الفروسية فتعلم ركوب الخيل والرمي بالأسهم وضرب السيوف والطعان، ثم تعلم أمور القيادة وإدارة الجيش ووضع الخطط الحربية. وهذا التعليم الطويل هو سر تميزهم عن الجنود المبتدئة.\u003c/p\u003e\u003cp class=\"ap\"\u003eأما رابطة المملوك بأستاذه فليست رابطة السيد بالعبد، بل رابطة المعلم بالتلميذ والأب بابنه. لذلك كان المشتري يلقب نفسه الأستاذ لا السيد، وكان المملوك ينتسب إلى من اشتراه لا إلى أصله. فالمماليك الذين اشتراهم الصالح أيوب يعرفون بالصالحية، والذين اشتراهم الكامل يعرفون بالكاملية. وهذه الانتسابات إلى الشخص لا إلى النسب، فالولاء هنا بالإنسان لا بالدم، ولهذا كان انتقال العرش إلى سلطان جديد أزمة تعصف بالدولة كلها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان للمملوك طريق ثابت في الترقية. يبدأ صغيرا في الخدمة، ثم ينضم إلى الخشداشية، ثم يشرف على فرقة، ثم يصير أميرا من أمراء الأقاليم. وقد تقسم الجيش المملوكي إلى طبقات: الخاصكية الذين لا يدخلون على السلطان إلا بإذن، والنوبة الذين يعرضون عليه أمور المماليك ويقاضون بينهم، وأجناد الحلقة وهم مماليك السلاطين السابقون وأبناؤهم فكانت القوة الضاربة في الجيش، وأجناد الأمراء التي ترافق كل أمير في سفره وحربه. وكان ترتيب هذه الطبقات محسوبا في ساحة المعركة والسلطان معا.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eمن القوقاز إلى سوق النخاسة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان طريق الرقيق إلى مصر طريقا تجاريا طويلا يبدأ من بلاد ما وراء النهر والقوقاز، ثم إلى البحر الأسود وخليج القسطنطينية، ثم إلى الإسكندرية أو دمياط، فتصب البضاعة في سوق النخاسة بالقاهرة. ومن هناك كان الأمراء يشترون الصغار ويتولون تربيتهم بأنفسهم. والملك كان يمدهم بالمال والطعام واللباس.\u003c/p\u003e\u003cp class=\"ap\"\u003eولم تكن هذه التجارة خفيفة الأثر على مصر. فكل مرة ضاقت موارد العامة بيعت لها أولادها، وكثيرا ما اشترى أمير من أمراء حرب مصر صغيرا من فقير وأخذ بيده. وهذا هو المصدر الحقيقي لمماليك مصر. وقد كثر ذلك في عهد الأشرف شعبان وغيره من الملوك، وقد ذكر المقريزي مثل هذا في وقعة رواها عن أهل الصعيد.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eدروس القلعة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت قلعة الروضة مدرسة لا تخرج منها إلا فرسانا. فالتدريب فيها ليس تمرينا بدنيا فحسب بل تربية دينية وعقلية معا. يعلم الصغير العربية والقرآن، ويؤدب على الصلاة والأذكار، ثم يتعلم الفروسية والرمي بالأسهم وضرب السيوف والطعان حتى إذا بلغ العشرين صار فارسا كاملا. كما راعوا في التدريب النظافة والنظام، ولم يخرج الفرسان من القلعة إلا ليمرنوا في الميدان.\u003c/p\u003e\u003cp class=\"ap\"\u003eولذلك كانت قلعة الروضة مصدر الرهبة في أيام ضعف الدولة. فكل سلطان يملك مصر كان يعرف أن في هذه القلعة جندا لا يملكهم وحده. ولذلك كان الأمراء يتنافسون على النفوذ فيها أكثر مما تنافسوا على ميادين المعارك. وهذا معنى يفسر لنا لماذا كان مماليك القلعة أسرع استجابة للسلطان من غيرهم.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالأستاذ والابن\u003c/h4\u003e\u003cp class=\"ap\"\u003eأهم ما في العقد بين السلطان والمملوك أنه عقد إنساني قبل أن يكون عقد تجارة. فالسلطان يشتري الصغير ثم يرعاه ويعلمه حتى يصير صدره. ولذلك كان السلطان يجلس مع مماليكه على الطعام ويماطحهم، وكان بالمقابل يديعون له بولاء لا لسلطان آخر مهما بلغ غيره من جاه. وقد ذكر المؤرخون أنه كان يتناول الطعام معهم ويتحدث إليهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوهنا يفترق هذا العقد عن عقد الرقي العادي. فالمشتري يلقب نفسه الأستاذ لا السيد، والمملوك لا يعرف إلا مولاه. ومن هنا وُلد ولاء يبقى حتى بعد موت الأستاذ، لأنه لا يقوم على صلة النسب، ولذلك كان انقلاب السلطان اختبارا قاسيا للولااءات كلها، وقد رأينا ذلك في مصر حين سقط آخر الأيوبيين.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمصدر التجنيد\u003c/b\u003e\u003cspan\u003eأطفال الأتراك القبجاق من قوقاز وبلاد ما وراء النهر يصلون إلى سوق النخاسة بالقاهرة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمقر التربية\u003c/b\u003e\u003cspan\u003eقلعة الروضة على النيل قرب قصر الصالح أيوب، وبها نشأت التسمية البحرية\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمضمون العقد\u003c/b\u003e\u003cspan\u003eالولاء للأستاذ والسلطان بالإنسان لا بالنسب\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأقسام الجيش\u003c/b\u003e\u003cspan\u003eالخاصكية والنوبة وأجناد الحلقة وأجناد الأمراء\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمرحلة\u003c/th\u003e\u003cth\u003eالمحتوى\u003c/th\u003e\u003cth\u003eالنتيجة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالشراء\u003c/td\u003e\u003ctd\u003eشراء الطفل من سوق النخاسة بالقاهرة\u003c/td\u003e\u003ctd\u003eدخوله بيت الأستاذ وإثبات نسبه إليه\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالتربية الأولى\u003c/td\u003e\u003ctd\u003eالعربية والقرآن والفقه وآداب الشريعة\u003c/td\u003e\u003ctd\u003eتأصيل ديني وسيادة اللغة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالتربية الثانية\u003c/td\u003e\u003ctd\u003eالفروسية والرمي بالأسهم والسيف والطعان\u003c/td\u003e\u003ctd\u003eإتقان القتال وركوب الخيل\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالترقية\u003c/td\u003e\u003ctd\u003eالخشداشية ثم قيادة فرقة ثم إمارة\u003c/td\u003e\u003ctd\u003eتدرج الرتب وازدياد النفوذ\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eإن أول المراحل في حياة المملوك هي أن يتعلم اللغة العربية قراءة وكتابة، ثم بعد ذلك يدفع إلى من يعلمه القرآن الكريم، ثم يبدأ في تعلم مبادئ الفقه الإسلامي وآداب الشريعة الإسلامية\u003c/p\u003e\u003ccite\u003eتقي الدين المقريزي، الخطط المقريزية، الجزء الثالث\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eالمملوك لم يكن عبدا بل تلميذا يتدرج في مدرسة القلعة حتى يصير فارسا وأميرا. ومن هذا العقد الإنساني الذي لا يقوم على الدم نشأت طبقة حكمت مصر والشام، وكسرت شأن الفرنج والمغول معا.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"mamluks-crusade","n":"المنصورة والحملة الصليبية السابعة","ic":"⚔️","part":"القسم الأول: الأصول ونشأة الدولة","h":"\u003carticle class=\"ch3\" id=\"mamluks-crusade\" data-toc=\"المنصورة والحملة الصليبية السابعة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e1.3\u003c/span\u003e\n          \u003ch3\u003e⚔️ المنصورة والحملة الصليبية السابعة\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي أقل من نصف عام صار الفرنج سادة الدلتا، ثم انهارت قوتهم في يوم واحد على ساحة المنصورة. في تلك المعركة مات سلطان أيبي وأسير ملك فرنسي، وانفتح طريق جديد للشرق.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eبدأت الحملة من تصور مفاده أن مصر هي حصون الإسلام ومفتاح الشام. فقد كان الصليبيون قد استولوا على بيت المقدس سنة ٦٤١هـ الموافق ١٢٤٤م على يد الخوارزميين حلفاء السلطان الصالح أيوب، ثم هزموا في أكتوبر من العام نفسه على يد المماليك والأمراء الأيوبيين عند غزة. فكان ذلك صدمة كبيرة في أوروبا، فأيد البابا إنوسنت الرابع الحملة في مجمع ليون سنة ١٢٤٥م، وكان أقوى المتحمسين لها ملك فرنسا لويس التاسع. وتجمع أسطول الحملة في قبرص في ربيع ١٢٤٩م، فعصفت به العواصف ونثرت نحو سبعمائة سفينة، وبقي نحو ألفي فارس من فرسان الملك على متنها وانتظروا في الجزيرة حتى رجع إليهم أواخر الصيف.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي فجر يوم ٥ نوفمبر ١٢٤٨م نزل نحو خمسين ألف مقاتل من الفرنج على ساحل دمياط، فقاتلهم المسلمون وانكشفوا، ثم انسحب أمير فخر الدين يوسف إلى معسكر السلطان ظنا منه أنه مات، وترك المدينة بلا حامية، فعبر الفرنج إلى دمياط المهجورة واحتلوها بلا مقاومة تقريبا. وقد أرسل لويس إلى السلطان كتابا يهدده فيه، فلما قرئ عليه رد عليه بتحذير. وغضب السلطان على أمير فخر الدين وعاقبه من أمره، وأعدم نحو خمسين من أمراء العربان الذين تركوا دمياط بغير إذن، ثم حمل نفسه المريض في حراقة إلى قصر المنصورة، وأعلن النفير العام فهرول أهل القرى للجهاد.\u003c/p\u003e\u003cp class=\"ap\"\u003eاستغرق حصار قلعة دمياط نحو ستة أشهر من نوفمبر ١٢٤٨م إلى يونيو ١٢٤٩م. وكان الفرنج قد ملكوا الدلتا والبحر، وارتفع في مصر من الخوف ما لم يعرف من قبل. وفي أثناء الحصار دارت رحلات ومبارزات على ضفتي النيل، وأسقط المماليك في إحدى المناوشات فرسانا كثيرا. وقد وقع قطز وبيبرس في أسر الفرنج ثم فُديا، وفي ٨ يونيو ١٢٤٩م سقطت القلعة وصبح من فيها. بعدها ترك الفرنج دمياط وتوجهوا جنوبا ومعسكرهم عند المنصورة. وقد بقي الفرنج في الدلتا قرابة ثمانية أشهر أخرى.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي الثاني من فبراير سنة ١٢٤٩م حدثت المعركة الفاصلة عند المنصورة. فالفرنج لم يكتفوا بالبقاء في معسكرهم، بل قصدوا معسكر السلطان الذي كان على ضفته، ففتح المماليك لهم الطريق ظاهرا ثم انقلبوا عليهم في وسط النهار. فانهارت جبهتهم، وقتل في الموقعة عدد كبير من الفرسان وأسر آخرون، وانتهى ذلك بسقوط السلطان الصالح أيوب نفسه. وقد هرب فريق كبير من الفرسان إلى ساحل البحر، وانتهت المعركة بهزيمة لم يعرفها الفرنج من قبل.\u003c/p\u003e\u003cp class=\"ap\"\u003eومن أسوأ ما في هذه المعركة وقوع مأساة السلطان في الميدان. فقد قتل في ساعات المعركة الأولى، وقتل معه ابنه توران شاه. وقد دفن الصالح في قلعة الروضة بمصر، وبقي جسد توران شاه مكشوفا في ساحة القلعة أياما ثم دفن خارجها. وبموتهما معا خلت الدولة من سلطانها ومن وريثه في يوم واحد. وقد قاتل في هذه المعركة كل من قطز وبيبرس وأقطاي الجمدار، وهم الذين سيحكمون مصر بعد ذلك، وكان بعضهم في العشرين من العمر فلم يتراجعوا خطوة.\u003c/p\u003e\u003cp class=\"ap\"\u003eولم ينج من الفرنج إلا القلائل الذين عادوا إلى عكا. فقد سقط الملك لويس التاسع في فارسكور يوم ٦ فبراير ١٢٤٩م، وأكرم في أسره ولم يهان، وأذن له بأداء صلاته مع باروناته. وطالب المسلمون بمال الفدية فكان ثمانمائة ألف دينار بعد أن طلبوا أضعافها، ووعد لويس بأن يسلّم عكا ولم يف. وأطلق سراحه في يوليو ١٢٤٩م، وعاد إلى فرنسا في ربيع ١٢٥٠م، وانتهت الحملة ولم يجرئ الفرنج بعدها على شن حملة كبرى على مصر. وقد تركت الحملة مصر منهكة متضررة، وهي في أسوأ حالها منذ أعوام.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eلماذا ساقوا الفرنج إلى مصر\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان اختيار مصر مبنيا على حساب جغرافي وعسكري، فمن يشترط استعادة بيت المقدس لابد أن يمر عليها لأنها حرس الشرق وممر زحف الفرنج. وقد سبق أن استولى الصليبيون على بيت المقدس سنة ٦٢٩هـ الموافق ١٢٢٩م بمعاهدة مع إمبراطور الروم فريدريك الثاني، ثم استرده الخوارزميون سنة ٦٤١هـ بعد سنين من المعاهدة.\u003c/p\u003e\u003cp class=\"ap\"\u003eفلما عاد الصليبيون إلى بيت المقدس مرة أخرى خافوا من زواله ثانية، فعقدوا العزم على ضرب مصر أولا. ولذلك كان وصولهم إلى دمياط في نوفمبر ١٢٤٨م حدثا هزّ مصر كلها. فقد غضب السلطان على أمير فخر الدين يوسف وعاقبه، وأعدم نحو خمسين من أمراء العربان الذين تركوا دمياط بغير إذن. وتقدم الفرنج بعد ذلك نحو القاهرة ثم ثبتوا عند المنصورة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eسقوط القلعة ثم يوم المنصورة\u003c/h4\u003e\u003cp class=\"ap\"\u003eحين سقطت قلعة دمياط في الثامن من يونيو ١٢٤٩م، صبح بها من فيها، وضاعت بذلك مصر شهورا طويلة. ثم صار الفرنج يتحكم في الدلتا كلها، وتقدم منها إلى المنصورة، ومكان معسكرهم على مسافة يسيرة من معسكر السلطان، فكان ذلك مقدمة للمعركة التي حسمت أمر الدولة في يوم واحد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي فارسكور يوم ٦ فبراير ١٢٤٩م سقط الملك لويس التاسع في يد المسلمين، وأكرم في أسره ولم يهان. وطالب المسلمون بمال الفدية فكان ثمانمائة ألف دينار، ووعد لويس بأن يسلّم عكا ولم يف. وأطلق سراحه في يوليو ١٢٤٩م، وعاد إلى فرنسا في ربيع ١٢٥٠م وانتهت الحملة. ومنذ ذلك الحين لم يجرئ الفرنج على اقتحام مصر مرة أخرى.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالإنزال في دمياط\u003c/b\u003e\u003cspan\u003e٥ نوفمبر ١٢٤٨م: وصل لويس التاسع بجيوشه ونزل على ساحل دمياط\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسقوط القلعة\u003c/b\u003e\u003cspan\u003e٨ يونيو ١٢٤٩م: سقطت قلعة دمياط بعد حصار دام نحو ستة أشهر\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eموت السلطان\u003c/b\u003e\u003cspan\u003e٢٣ نوفمبر ١٢٤٩م: توفي الصالح أيوب في معسكر المنصورة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمعركة الفاصلة\u003c/b\u003e\u003cspan\u003e٢ فبراير ١٢٤٩م: هزيمة الفرنج وسقوط الصالح أيوب وتوران شاه\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالفدية والأسر\u003c/b\u003e\u003cspan\u003eثمانمائة ألف دينار، وأطلق سراح لويس التاسع في يوليو ١٢٤٩م\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمرحلة\u003c/th\u003e\u003cth\u003eالتاريخ\u003c/th\u003e\u003cth\u003eالنتيجة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eإنزال الفرنج في دمياط\u003c/td\u003e\u003ctd\u003e٥ نوفمبر ١٢٤٨م\u003c/td\u003e\u003ctd\u003eسقوط دمياط بلا مقاومة تقريبا\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eسقوط قلعة دمياط\u003c/td\u003e\u003ctd\u003e٨ يونيو ١٢٤٩م\u003c/td\u003e\u003ctd\u003eانتهاء الحصار وتقدم الفرنج نحو القاهرة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eوفاة الصالح أيوب\u003c/td\u003e\u003ctd\u003e٢٣ نوفمبر ١٢٤٩م\u003c/td\u003e\u003ctd\u003eتولية توران شاه على مصر وحرب جارية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eمعركة المنصورة\u003c/td\u003e\u003ctd\u003e٢ فبراير ١٢٤٩م\u003c/td\u003e\u003ctd\u003eمقتل الصالح أيوب وتوران شاه وأسر الملك\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eفك الحصار والفدية\u003c/td\u003e\u003ctd\u003e١٢٤٩م\u003c/td\u003e\u003ctd\u003eانسحاب الفرنج وانتهاء الحملة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eأما قدرتم تقفون ساعة بين يدي الفرنج؟\u003c/p\u003e\u003ccite\u003eالمقريزي، إغاثة الأمة بكشف الغمة، في سياق عتاب السلطان لأمير فخر الدين\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eجاء الفرنج فاحتلوا الدلتا، ثم كسرت قوتهم في يوم واحد عند المنصورة، فسقط سلطان مصر وأسر ملك فرنسا. ومن هذا الانقلاب ظهرت سلطنة المماليك على مسرح التاريخ.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"transition","n":"انتقال السلطة: من شجر الدر إلى عز الدين أيبك","ic":"🔄","part":"القسم الأول: الأصول ونشأة الدولة","h":"\u003carticle class=\"ch3\" id=\"transition\" data-toc=\"انتقال السلطة: من شجر الدر إلى عز الدين أيبك\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e1.4\u003c/span\u003e\n          \u003ch3\u003e🔄 انتقال السلطة: من شجر الدر إلى عز الدين أيبك\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eب\u003c/span\u003eين ليلة وضحاها سقط سلطان مصر وابن سلطانه، ثم جلست أرملة على العرش، ثم تنازلت لزوجها. في هذه الشهور القصيرة اتجهت مصر كلّها من نظام أيوبي إلى نظام مملوكي.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eلم تمض على معركة المنصورة أكثر من أيام حتى عاد الخلاف بين الأمراء. فقد أراد السلطان توران شاه، وهو أمير بلغ السبعين من العمر، أن يتخلص من المماليك، فأرسل فيهم من قتل طائفة منهم واعتقل أخرى. فاجتمع المماليك وتباحثوا فيما بينهم، ثم اتفقوا على أن يقتلوه، ودخلوا عليه في قصره وقت صلاة الجمعة فقتلوه. ومثلت جثته في ساحة القلعة، وبقيت مكشوفة عدة أيام قبل أن تدفن خارجها. ولم يمهلوا أحدا من أهل بيته، فانهار البيت الأيوبي كله في يوم واحد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوظهرت في هذا الوقت أرملة السلطان الصالح، وهي شجرة الدر الملقبة بعصمة الدين أم خليل. كانت خوارزمية الأصل، وقد اشتراها السلطان وهي صغيرة في السن فتربت في بيته وارتفعت درجتها حتى صارت شريكة في الحكم. وقد ظهرت في معسكر المنصورة وقت الحروب تلبس درعها وتشجع الجند، فلما قتل زوجها تولت العرش وبايعها المماليك وأعيان الدولة. ولم تلبث على العرش إلا ثمانين يوما، ثم تنازلت عنه. وكانت لها ابنة اسمها زينب زوجة لأتابك حلب.\u003c/p\u003e\u003cp class=\"ap\"\u003eولم يمض وقت طويل حتى أثارت تولي امرأة على العرش مشكلتين. فأمراء الأيوبيون في الشام، وعلى رأسهم الملك الناصر صلاح الدين يوسف بدمشق، رفضوا الاعتراف بحكمها، حتى سلموا قلعة الكرك إلى غيرهم من أمراء البيت. ولم يقبل الخليفة العباسي المستعصم بالله في بغداد أن يبايع امرأة، وأرسل إلى أمراء مصر كتابا يقول إن كانت الرجال قد عدمت عندكم فأعلموا حتى نسير إليكم رجالا. فاحتاج المماليك إلى حيلة حتى يجدوا للسلطة الجديدة شرعية في نظر الخصوم.\u003c/p\u003e\u003cp class=\"ap\"\u003eفكان الحل أن تنزع عنها التاج وتزوجها من الأمير أيبك التركماني، الأتابك والقائد العام في الجيش، ثم تنازل له عنه. فبايع المماليك أيبك سلطانا في ربيع سنة ١٢٥٠م، وأخذ لقب الملك المعز عز الدين. ولم يكتف بذلك، بل أحضر المماليك طفلا من بيت أيوب في السادسة من عمره وسلطنوه باسم الملك الأشرف مظفر الدين موسى، معلنين أن مصر ما زالت تابعة للخلافة العباسية. وهذا أول لقب مظفر في الدولة المملوكية. وكان هذا الاختيار خطوة عملية لرضا أمراء الشام الأيوبيين لا أكثر من ذلك.\u003c/p\u003e\u003cp class=\"ap\"\u003eونقل أيبك رفات أستاذه السلطان الصالح أيوب من قلعة الروضة إلى المقبرة التي أنشأها قبل وفاته بين القصرين، إظهارا لولائه له. وكان أيبك يعتمد على ثلاثة من كبار المماليك هم فارس الدين أقطاي الجمدار وركن الدين بيبرس البندقداري وسيف الدين بلبان الرشيدي. ولم تمض بضع سنوات حتى تآمر بعضهم على قتل أقطاي الجمدار، وهو الموقف الذي كشف حدّة الطبقة الجديدة وأول أزماتها مع سلطانها. ثم صارت زمام الدولة في يد المماليك نفسها.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eليلة سقوط آخر أيوبي\u003c/h4\u003e\u003cp class=\"ap\"\u003eأراد السلطان توران شاه أن يتخلص من المماليك، وهو أمير بلغ السبعين من العمر، فأرسل فيهم من قتل طائفة واعتقل أخرى. فاجتمع المماليك وتباحثوا فيما بينهم، ثم اتفقوا على أن يقتلوه، ودخلوا عليه في قصره فقتلوه. ومثلت جثته في ساحة القلعة وبقيت مكشوفة عدة أيام قبل أن تدفن خارجها. ولم يكن في القصر من ينتصر له.\u003c/p\u003e\u003cp class=\"ap\"\u003eولولا هذا الاتفاق الخفي لربما بقي الأمر على حاله. فقد بايعه أعيان مصر بعد موت أبيه، غير أنه لم يكن له إلا طبقة من المماليك تحميه، فقتله من أراد أن يحمي نفسه. وبموته انتهت الدولة الأيوبية في مصر بعد نحو ثمانين سنة من تأسيسها. وسجلّ المؤرخون هذه اللحظة بوصفها فاصلة في تاريخ مصر.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eشجر الدر ومظفر الدين\u003c/h4\u003e\u003cp class=\"ap\"\u003eحكمت شجرة الدر ثمانين يوما بايعها فيها المماليك وأعيان الدولة، ثم تنازلت للزوجها أيبك الذي كان أميرا تركمانيا ترقى في خدمة الصالح أيوب حتى صار أتابكا. وكانت هذه التولية استجابة لضغط الظروف، إذ لا يقبل الخليفة جلوس امرأة على العرش كما لا يقبل الأمراء الأيوبيون حكمها. وقد استغرق حكمها أقل من ثلاثة أشهر.\u003c/p\u003e\u003cp class=\"ap\"\u003eولذلك أحضر المماليك طفلا أيوبيا في السادسة من عمره، سلطنوه باسم الملك الأشرف مظفر الدين موسى، وأعلنوا أن أيبك نائب للخليفة العباسي وأن مصر تابعة للخلافة. وبهذا العمل تمّت هندسة السلطة، وانتقلت مصر من نظام أيوبي إلى نظام مملوكي جديد يقوم على جند من البيوت.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمقتل توران شاه\u003c/b\u003e\u003cspan\u003eآخر سلاطين أيبية في مصر، قتله المماليك في قصره بعد أيام من معركة المنصورة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eحكم شجر الدر\u003c/b\u003e\u003cspan\u003eثمانون يوما على العرش في سنة ١٢٥٠م\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eموقف الشام\u003c/b\u003e\u003cspan\u003eالأمير الأيوبيون في دمشق رفضوا حكم امرأة، والخليفة العباسي لم يبايع\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأول لقب مظفر\u003c/b\u003e\u003cspan\u003eالملك الأشرف مظفر الدين موسى، طفل أيوبي بايعه المماليك لأيبك\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأول سلطان مملوكي\u003c/b\u003e\u003cspan\u003eالمعز عز الدين أيبك التركماني في سنة ١٢٥٠م\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالتاريخ\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eمقتل السلطان توران شاه\u003c/td\u003e\u003ctd\u003e١٢٥٠م\u003c/td\u003e\u003ctd\u003eانتهاء الدولة الأيوبية في مصر\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eتولي شجر الدر العرش\u003c/td\u003e\u003ctd\u003e١٢٥٠م\u003c/td\u003e\u003ctd\u003eحكم ثمانون يوما ثم التنازل\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eاعتراض أمراء الشام\u003c/td\u003e\u003ctd\u003e١٢٥٠م\u003c/td\u003e\u003ctd\u003eرفض الاعتراف بحكم المرأة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eتولية أيبك\u003c/td\u003e\u003ctd\u003e١٢٥٠م\u003c/td\u003e\u003ctd\u003eأول سلطان مملوكي في مصر\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eبايشة الطفل الأيوبي\u003c/td\u003e\u003ctd\u003e١٢٥٠م\u003c/td\u003e\u003ctd\u003eأول لقب مظفر الدين في الدولة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eإن كانت الرجال قد عدمت عندكم، فأعلموا حتى نسير إليكم رجالا\u003c/p\u003e\u003ccite\u003eرسيلة الخلفية العباسي المستعصم بالله إلى أمراء مصر، تناقلها ابن كثير في البداية والنهاية\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eقتل آخر أيوبي في قصره، وجلست أرملته على العرش ثم تنازلت لزوجها بعد ثمانين يوما. ومن هذا القبول المتأخر خرجت سلطنة المماليك، وافتتحت بألقاب مظفر الدين.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-2","n":"القسم الثاني: الخطر المغولي ومعركة عين جالوت","ic":"","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-2\" style=\"--c:#0F6B5C\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🌪️\u003c/div\u003e\n      \u003ch2\u003eالقسم الثاني: الخطر المغولي ومعركة عين جالوت\u003c/h2\u003e\n      \u003cp\u003eفي أقل من سنتين سقطت بغداد ثم دمشق ثم حلب بين يدي المغول، ولم يبق بين ذلك الزحف ووادي النيل إلا أرض واحدة. وفي هذه اللحظة بالذات تحوّلت المماليك من طبقة تحرس سلطانا إلى قوة تحمل لواء الإسلام كله. هنا نتتبع الكارثة التي بدأت في بغداد، ثم المعركة التي أوقفت الزحف في فلسطين، ثم ما تلاها من انسحاب وتهدئة، وننتهي إلى سلطان حمل النصر ومات قبل أن يلم ثمرته.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#mongol-threat\"\u003eزحف المغول على الشام\u003c/a\u003e\u003ca href=\"#ayn-jalout\"\u003eمعركة عين جالوت\u003c/a\u003e\u003ca href=\"#mongol-terms\"\u003eالمغول بعد عين جالوت\u003c/a\u003e\u003ca href=\"#qatiz\"\u003eالسلطان قطز\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"mongol-threat","n":"زحف المغول على الشام","ic":"🏹","part":"القسم الثاني: الخطر المغولي ومعركة عين جالوت","h":"\u003carticle class=\"ch3\" id=\"mongol-threat\" data-toc=\"زحف المغول على الشام\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e2.1\u003c/span\u003e\n          \u003ch3\u003e🏹 زحف المغول على الشام\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eل\u003c/span\u003eم يكن سقوط بغداد حدثا في مدينة واحدة، بل كان انكسارا في معنى العالم الإسلامي كله. وثلاثة أعوام بعدها كانت جيوش الشام تنهار تحت سيوف فرسان السهوب، حتى صار الخطر واقفا على حدود مصر نفسها.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eلم يكن ظهور المغول في المشرق حدثًا عابرًا، بل كان حصيلة دولة كاملة قامت في سهوب منغوليا سنة ٦٠٣هـ الموافق ١٢٠٦م على يد جنكيز خان، فحوّل قومًا بدوًا إلى قوة إمبراطورية لا تُرد. وبعد نحو ثلاثة عشر عامًا من تأسيسها بدأ المغول في التمدد غربًا، فسقطت خوارزم سنة ٦١٦هـ الموافق ١٢١٩م، ثم تتابعت المدن: بخارى وسمرقند وبلخ وهرات، ونيسابور وطوس، حتى سار الدمار إلى أذربيجان وهمدان وتبريز. وقد ذُكر في كتب التاريخ كيف أُبيد أهل المدن عن آخرها وأُلقيت رؤوس الرجال في آبار الملح.\u003c/p\u003e\u003cp class=\"ap\"\u003eأما الموجة الثانية فهي أخطر، لأنها جاءت في عهد منكو خان وهو حفيد جنكيز خان وابن أخيه هولاكو، تولّى الخان الأعظم سنة ٦٤٩هـ الموافق ١٢٥١م، فعيّن أخاه هولاكو واليًا على بلاد فارس ليقضي على آخر الكيانات الإسلامية في جنوب غرب آسيا. وانطلق هولاكو بجيوش ضخمة، ومعه كتاب من منكو يوصيه فيه باتباع تقاليد جده جنكيز خان وبأن يكون هدفه مدّ الفتح من ضفاف جيحون حتى مصر، وأن يعامل من استسلم رحمة ويذيق الذل من ظهر المقاومة.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم اتجه هولاكو إلى بغداد، فأرسل إلى الخليفة المستعصم بالله يطلب منه الاستسلام، فأرسل إليه الخليفة رسالة ينذره فيها بنقمة الله. وقيل إن الحصار لم يمتد أكثر من نحو أسبوعين، ثم سقطت بغداد في العاشر من فبراير سنة ١٢٥٨م الموافق للعشرين من المحرم سنة ٦٥٦هـ. وقُتل المستعصم بالله على يد المغول، ونُهبت المدينة بأسرها ونُهبت خزائنها وكتبها، وأُلقيت في دجلة حتى قيل إن الماء صار أسود من الحبر، وبقيت المدينة خالية من السكان أعوامًا طويلة.\u003c/p\u003e\u003cp class=\"ap\"\u003eبهذا السقوط انتهت الخلافة العباسية في بغداد بعد أكثر من خمسة قرون، وارتجّ العالم الإسلامي كله حتى ظنّ كثيرون أن البيت العربي في الإسلام قد انقطع. ولم يقف الأمر عند بغداد، فقد اتجه هولاكو إلى بلاد الشام، فأقبل على ميافارقين في ديار حلب فاحتجرها نحو سنتين نفدت فيهما المؤون وهلك أكثر أهلها، ثم سقطت ماردين ومدّ يده إلى نصيبين والحران والرها. وكان الأيوبيون قد ضربهم بعضهم بعضًا قبل ذلك فاستُشهد منهم نوشروان في معاركهم على إخوته.\u003c/p\u003e\u003cp class=\"ap\"\u003eاجتاح هولاكو حلب في مطلع سنة ٦٥٨هـ الموافق يناير من سنة ١٢٦٠م بعد حصار امتد نحو شهرين ونُصِب أثناءه عشرون منجنيقا، ثم سقطت حمص والمعرة وقلعة حارم ففُتح طريق دمشق. وحين عجز أهل دمشق عن الصمد على نحو ما جرى في حلب، تقدّم أعيانها إلى زعيم المغول بالهدايا يطلبون الأمان، فقبل ودخل المدينة في السابع عشر من صفر سنة ٦٥٨هـ الموافق فبراير من سنة ١٢٦٠م. وبسقوط دمشق لم يبق من الديار الإسلامية في الشام إلا من استسلم للمغول أو هاجر إلى مصر.\u003c/p\u003e\u003cp class=\"ap\"\u003eولشدّة الخطر أرسل الملك الناصر يوسف من دمشق إلى قطز كتابًا استنجد فيه بعساكر مصر. وعقد قطز مجلسًا في القلعة حضره كبار الأمراء والعلماء وعلى رأسهم العز بن عبد السلام، وفيه تكلّم قطز في مساوئ السلطان الصبي منصور بن أيبك، وقال: لا بد من سلطان قاهر يقاتل هذا العدو. وقد ورد إلى قطز في الوقت نفسه رسالة من هولاكو تحملها أيدي أربعة من رسل التتار، فيها تهديد صريح بأن الخاقان الأعظم يملك المشرق والمغرب.\u003c/p\u003e\u003cp class=\"ap\"\u003eولم تكن نجاة مصر من هذه الموجة نتيجة حظ بل نتيجة ظروف وتقدّم. فمن تلك الظروف أن هولاكو انصرف إلى فارس بعد أن بلغه خبر وفاة أخيه منكو خان الخان الأعظم، فانسحب من الشام ومعه معظم جيوشه، واستخلف على الباقين قائده كتبغا نوينان، ولم يبق في الشام سوى عدد قليل من الفرسان لا يزيد على عشرين ألفا. ومنها أن قطز وحّد المماليك المعزية والبحرية في جيش واحد، وضرب لأربابه ضريبة بفتوى من العز بن عبد السلام، وعقد هدنة مع أمراء عكا يؤمّن بها ظهره.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eسقوط بغداد ومعنى الخلافة\u003c/h4\u003e\u003cp class=\"ap\"\u003eحين سقطت بغداد لم تسقط مدينة فقط، بل انتهت الخلافة العباسية التي ظلّت منذ سنة ١٣٢هـ تحكم نفسها بأمر الدين لا بتقنية الفرس. فقد ظن الناس أن زوالها زوال لشرعية الحكم في المشرق كله، فلم يقبل سلطان في مصر والشام بعدها إلا خطاب الخلافة العباسية. وبقيت مصر مركزا لشرعية لا مركزا لسلطان.\u003c/p\u003e\u003cp class=\"ap\"\u003eولهذا لجأ بعض بني المستعصم إلى مصر، لأنها كانت الموصل الوحيد الذي بقي وفيا لبيت العباس حين سقطت بغداد. ومنهم من قضى بقية عمره في القاهرة ينتظر عودة لا تحدث، ومنهم من رأى أن مولده فيها هو الحظ الوحيد الباقي له. ولهذا صار بيت العباس في القاهرة شعلة يذكّر بها كل سلطان مستجدّ النقمة من المغول.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أثر سقوط بغداد في أوضاع المسلمين كلها، فمن فقد في يوم واحد حاضرة الخلافة ومركز العلم، ثم رأى أعوام الانتصار تتبخر تباعا كلما سقطت مدينة أو هزمت جيوش. ولهذا صارت مصر في تلك الحقبة القلب النابض لكل أمل عربي. ولم يعد السؤال في العالم الإسلامي إلا سؤال من يحفظ آخر ما بقي من هذا الكيان.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالشام بلا قيادة\u003c/h4\u003e\u003cp class=\"ap\"\u003eانهار بيت أيوب في الشام عام ١٢٦٠م، فقد كان أمراء الشام يختلفون على الخلافة بعد مصر فيحكم كل منهم مدينة ويعنّف نفسه أميرا مستقلا. وكان بعضهم قد نزع مصر قبل سنوات وطرد منها بني أيوب ثم لم يفلح في حفظها. لذلك كان سقوط حلب يعني أن الحكم في الشام كله صار بيد شخص واحد قد ينسحب في أي ساعة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ذهب بعض أمراء الشام مع المغول طائعا، وبقي آخرون يقاتلون حتى السقوط ثم أسلم من نجا منهم بعد بضع سنين. وكتب التاريخ تصف حال دمشق حين دخلها هولاكو بأنها لم تستطع أن تقاوم ليلا، لأن قائدها كان قد هرب. ولو صمدت دمشق بأسوارها لكان لها في مسار الزحف أثر مختلف، غير أن المدينة كانت قد استنزفت قبل وصول المغول بحروبها مع المماليك.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eلماذا نجت مصر من هذه اللحظة\u003c/h4\u003e\u003cp class=\"ap\"\u003eتُفهم خريطة الخطر في تلك المرحلة بقاعدة بسيطة، مصر تقع خلف صحراء سيناء وعند طرف وادي النيل، ولا يمكن قطع إليها إلا بجيش ثقيل في طريق طويل. بينما كان اختراق الشام أسرع وأيسر، وهذا ما جعل مصر خارج حركة المغول الأولى. ولهذا لم يخرج هولاكو من الشام في تلك السنة، وانشغل بتثبيت سلطته في فارس وما وراء النهر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد نص هولاكو في رسالته إلى لويس التاسع ملك الفرنج أنه ينوي الدخول في تحالف معهم يستفرد به بمصر والشام معا. ولو صحت هذه الخطة لتغير وجه المنطقة كله، غير أن أمراء الفرنج في عكا كان بينهم خلاف كبير ولم يجتمعوا على نص واحد. ولذلك كان على المماليك أن يحموا مصر بالسيف لا بالسور، لأن الخطر لم يكن محسوسا في الميدان حتى ذلك الحين.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسقوط بغداد\u003c/b\u003e\u003cspan\u003eمحرم ٦٥٦هـ الموافق فبراير ١٢٥٨م، ونهاية الخلافة العباسية بمقتل المستعصم بالله\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأول ضربة\u003c/b\u003e\u003cspan\u003eسقوط قلعة الحشاشين سنة ١٢٥٦م، ونهاية دولة الإسماعيلية المعزولة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسقوط حلب\u003c/b\u003e\u003cspan\u003eيناير ١٢٦٠م، وأول جبهات مواجهة بين المغول والمسلمين\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأقرب نقطة\u003c/b\u003e\u003cspan\u003eغزة في جنوب فلسطين، وهي الحد الشرقي لمصر في تلك اللحظة\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالموضوع\u003c/th\u003e\u003cth\u003eالتاريخ\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eزحف المغول على دولة الخوارزم\u003c/td\u003e\u003ctd\u003e١٢١٩م\u003c/td\u003e\u003ctd\u003eمحو دولة إسلامية كبرى من خريطة المشرق\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eسقوط قلعة الحشاشين\u003c/td\u003e\u003ctd\u003e١٢٥٦م\u003c/td\u003e\u003ctd\u003eانقراض دولة الحشاشين\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eسقوط بغداد\u003c/td\u003e\u003ctd\u003e١٢٥٨م\u003c/td\u003e\u003ctd\u003eانقراض الخلافة العباسية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eسقوط حلب بيد المغول\u003c/td\u003e\u003ctd\u003eيناير ١٢٦٠م\u003c/td\u003e\u003ctd\u003eانهيار الدولة الأيوبية في الشام\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eوصول المغول إلى غزة\u003c/td\u003e\u003ctd\u003eصيف ١٢٦٠م\u003c/td\u003e\u003ctd\u003eاقتراب الخطر من حدود مصر الشرقية\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eقد سمعتم أننا قد فتحنا البلاد وطهرنا الأرض من الفساد، وقتلنا معظم العباد، فعليكم بالهرب وعلينا الطلب، فأي أرض تؤويكم وأي طريق ينجيكم وأي بلاد تحميكم، فما من سيوفنا خلاص ولا من مهابتنا مناص.\u003c/p\u003e\u003ccite\u003eمن رسالة هولاكو خان إلى سلطان مصر، نقلها ابن عبد الظاهر في الروض الزاهر\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eسقطت بغداد ثم الشام في أقل من سنتين، فلم تعد مصر محمية بجدار ولا بسلطان، بل واقفة وحدها أمام خطر لم يعرف المسلمون له وجها قبل ذلك. وستكون سنة ١٢٦٠م نقطة التحول في تاريخ الدولة المماليكية كلها، لأن الخطر لم يعد خارجية فقط، بل صار السؤال الأكبر لكل سلطان يحكم مصر.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"ayn-jalout","n":"معركة عين جالوت","ic":"⚔️","part":"القسم الثاني: الخطر المغولي ومعركة عين جالوت","h":"\u003carticle class=\"ch3\" id=\"ayn-jalout\" data-toc=\"معركة عين جالوت\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e2.2\u003c/span\u003e\n          \u003ch3\u003e⚔️ معركة عين جالوت\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eل\u003c/span\u003eم تحسم المعركة في بيت المقدس كما ظن المغول، بل حُسمت في سهل ضيق بين بيسان ونابلس في يوم واحد. وهذا اليوم هو الذي أدخل في حساب المسلمين اسم قطز واسم المماليك معا لا منفصلين.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eوكان قد عقد قطز من قبل معاملة مع أمراء عكا يتفادى فيها محاكاة الفرنج.  وقبل أن يتم للمماليك استعادة دمشق، كاد الفرنج يفوزون حين وصل جيش الإفرنج إلى عكا في أواخر صيف ١٢٦٠م. ولولا سرعة المماليك لما بقي للفرنج وقت في فلسطين. وكان بيبرس صاحب الفكرة في مواجهة المغول قبل الالتحام، فقد ترك حصار عكا وتقدم نحو الشام ليمسك زمام المبادرة. وفي الوقت نفسه كان المغول قد بلغوا غزة في ٢٦ يوليو ١٢٦٠م.\u003c/p\u003e\u003cp class=\"ap\"\u003eاجتمع قطز وبيبرس في دلتا النيل ليتفقا على خطة الخروج إلى الشام. وقد تهيأ المماليك لهذا الخروج خمسة أشهر من التدريب المتواصل حتى صارت سواعدهم لا ترتجف. وكان قطز قد اقتنع بخطأ المماليك في طلب النجدة من الفرنج حين ثبت أن الفرنج لا ينجدون المسلمين. أما الأمراء المماليك فقد أجمعوا على الخروج، وألحوا على قطز حتى غض الطرف عن تردده، ومضى الجميع شمالا. وسار الجيش سيرا في وادي الأردن حتى بلغ سهل بيسان قرب نابلس، وعندئذ التقى الجمعان.\u003c/p\u003e\u003cp class=\"ap\"\u003eكان يقود المغول في فلسطين قائد يعرفه المسلمون باسم كتبغا نوينان، وكان تابعا لهولاكو ومشرفا على جيوشه في الشام بعد أن عاد هولاكو إلى فارس. وكان قد يضم إلى صفوفه حاميات أرمنية مسيحية جاءت مع الجيوش المغولية إلى فلسطين. أما جيش المسلمين فكان فرقة قطز المعزية مماليك الذين عادوا بعد العفو، وأمراء عرب من بني أيوب ومنهم الأشرف موسى صاحب حماة والسيد حسن. وقد استقبل قطز رجلًا كان قد هرب من المغول، فعاد إليه بما من قلة عدد جيوشهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقعت المعركة في شهر رمضان سنة ٦٥٨هـ، ويذكر ابن خلدون أنها كانت في جمادى الآخرة من السنة نفسها، وترجّح الدراسات الحديثة أنها في الخامس والعشرين من رمضان الموافق الثالث من سبتمبر سنة ١٢٦٠م. وخرج المماليك من مخيمهم فجرا، فأرسل بيبرس فرقة من الفرسان تتحرك على طرف المغول. وحدث أن التقي الطرفان، فشن المماليك هجومهم على جناح المغول حتى اختل ترتيب الصف المغولي. وفي تلك اللحظة رأى قطز أن الجنود قد بدأوا يترددون، فخلع خوذه بيده وصاح صيحة الحرب. وردت الجيوش كلها على ذلك الصرخة، وارتفع هتاف المسلمين حتى ارتجفت الأرض تحت أقدامهم. ثم حدث التحول الكبير، فقد انهارت جيوش المغول، وبدأ الفرسان المسلمون يدفعونهم إلى الأمام.\u003c/p\u003e\u003cp class=\"ap\"\u003eوهنا حدث ما لم يعرفه المغول من قبل، فقد سقط قائدهم كتبغا قتيلا بعد أن أرهقه القتال. وقيل إن الذي قتله أمير مملوكي هو جمال الدين آقوش الشمسي. وانحدرت جيوش المغول بسرعة، وانسحبوا عبر الأردن يظنون أن وراء النهر يجدون ملجأ. وكان انهيار المغول في فلسطين يعني أن الخطر الذي كان يهدد مصر قد أُجّل إلى وقت آخر. ورغم ذلك لم تنته الكارثة كلها، لأن جيوش المغول في العراق والشام ظلت قائمة.\u003c/p\u003e\u003cp class=\"ap\"\u003eبعد المعركة اقترح بعض الأمراء أن يكمل المماليك زحفهم إلى بغداد لردع المغول في مهدهم. فرفض قطز هذا الأمر، لأن الجيوش كانت منهكة والوقت ضيّق أمام قسوة الصيف. وكان قطز قد استفاد من انتصاره أكثر مما استفاد المغول من بوادرهم. وفي ليلة الانتصار كان الفرح في معسكر المسلمين على أشده، لأن الخطر العظيم قد انقضى. وفي اليوم التالي بدأت مرحلة أخرى في دولة المماليك، لم تكن مرحلة النصر بل مرحلة إعادة البناء. وهكذا انتهت معركة عين جالوت أول انتصار حقيقي للمسلمين على المغول منذ بدأت الكارثة.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالاستعداد للمواجهة\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم تكن معركة عين جالوت حدثا مفاجئا، بل نتيجة تحض طويل بدأ قبل أشهر. فقد عمل قطز على جمع الجيوش وشد ما تفرّق منها، ثم أدبب المماليك على الطاعة. وفي الوقت نفسه أرسل رسله إلى أمراء الشام يطلب منهم موقفا واضحا لا لبس فيه. وفي هذه الأشهر درب المماليك على الرمي والركض والحفظ قبل أن يخرجوا إلى الميدان.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان بيبرس هو الدافع الحقيقي إلى هذه المعركة، فقد رأى أن ترك الشام بلا دفاع يدعو المغول إلى مصر. وهذا أمر خطير حين يعرف ضعف المماليك، لا سيما وقد سقطت دمشق في يد من لا يتحالفون معه. وكان قطز قد يتردد في أول الأمر، لأنه كان يعرف أن مغامرة كهذه تحتاج إلى كل قوة الدولة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eساعة الحسم\u003c/h4\u003e\u003cp class=\"ap\"\u003eفي صباح ذلك اليوم تحركت الجيوش من معسكرها في سهل بيسان، وتقدمت الفرقة التي أرسلها بيبرس حتى لامست طرف المغول. ولم تمض ساعة حتى اشتعلت نيران القتال في الجبهة، وتبيّن أن المغول يعتمدون على سرعة الاقتحام أكثر من ثبات الصف. هنا رأى قطز أن ما ينقص جنوده هو الحماس لا التدريب، ففعل ما لا يفعله إلا قائد يملك قلبا يعلم أنه سيُقتل إن لم يفعل.\u003c/p\u003e\u003cp class=\"ap\"\u003eفلما رأى المماليك الصيحة اندفعوا جميعا خلف الفرقة الأمامية، وارتفع هتاف صار من أصداء الجبال المحيطة. سقط كتبغا بعد ساعتين من بدء القتال، فانهارت جيوشه وبدأت تنسحب نحو الأردن. وهكذا انتهت المعركة التي كانت ستغير خريطة المشرق لو انتهت غير ذلك. ولم يكن في انكسار المغول نهاية المعركة، لأن قادتها الكبار بقوا في ميادين أخرى.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eلماذا كانت المعركة فاصلة\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم تكن المعركة انتصارا تكتيكيًا فحسب، بل كانت فاصلة في تاريخ المنطقة كلها. فمنذ سنين والمغول يزحفون ولا يجدون في طريقهم مقاومة تذكر، ثم فوجئوا بجيش يقاتلهم في عقر دارهم. وكشف الانتصار أن قوة المغول لم تكن كما ظن الناس، وأن في العالم الإسلامي من يقاوم لو أراد. ولذلك حين عاد المماليك إلى القاهرة لم يكونوا قد رفعوا راية جديدة، بل رفعوا راية الدولة كلها.\u003c/p\u003e\u003cp class=\"ap\"\u003eلكن النصر لم يكن ثمرة الحظ وحده، بل ثمرة قرار متأخر كاد ألا يتخذ. لولا أن الأمراء تمسكوا بالخروج لكانت مصر مفتوحة بلا جدار يحميها، لأن أول ما يفعله المنتصر هو الانقضاض. ومن هنا نفهم أن دولة تنقذ نفسها في ساعة واحدة قد تصاب في الساعات التالية بما لا يحتمل.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالتاريخ\u003c/b\u003e\u003cspan\u003e٢٥ رمضان ٦٥٨هـ الموافق ٢٥ سبتمبر ١٢٦٠م\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالموقع\u003c/b\u003e\u003cspan\u003eسهل بيسان قرب نابلس، عند سفح جبل جرزيم\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eقائدا المسلمين\u003c/b\u003e\u003cspan\u003eالسلطان قطز وقائد المماليك بيبرس\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eقائد المغول\u003c/b\u003e\u003cspan\u003eكتبغا، وهو قائد جيوش هولاكو في الشام\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالنتيجة\u003c/b\u003e\u003cspan\u003eانهيار المغول في فلسطين وضياع زحفهم نحو مصر\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالموضوع\u003c/th\u003e\u003cth\u003eالتفصيل\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالتاريخ\u003c/td\u003e\u003ctd\u003e٢٥
