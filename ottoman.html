<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="description" content="بدأت الدولة العثمانية سنة ١٢٩٩م حين أنشأ عثمان الأول إمارةً صغيرة في شمال غرب الأناضول، ثم كبرت في أقل من قرنٍ ونصف حتى صارت إمبراطورية تمتدّ من الجزا">
<title>الدولة العثمانية | موسوعة تاريخ الإسلام</title>
<link rel="preload" href="assets/fonts/amiri-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/amiri-700.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* ===== موسوعة تاريخ الإسلام — التنسيق المشترك ===== */

/* الخطوط محليّة (Subset عربي): لا شبكة، ولا اختلاف في القياس بين تشغيل وتشغيل */
@font-face{font-family:'Amiri';font-style:normal;font-weight:400;font-display:block;
  src:url(assets/fonts/amiri-400.woff2) format('woff2')}
@font-face{font-family:'Amiri';font-style:normal;font-weight:700;font-display:block;
  src:url(assets/fonts/amiri-700.woff2) format('woff2')}
@font-face{font-family:'Cairo';font-style:normal;font-weight:200 1000;font-display:block;
  src:url(assets/fonts/cairo-var.woff2) format('woff2')}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --gold:#B8942F;--gold2:#8B6914;--cream:#FBF4E4;--paper:#FFFDF8;
  --ink:#2E2A24;--muted:#7C7364;--line:#E7DCC3;
  --green:#1E6B3A;--blue:#155E9C;
  --shadow:0 4px 18px rgba(80,60,20,.08);
  --c:#B8942F;
}
body{font-family:'Cairo',sans-serif;background:var(--cream);color:var(--ink);
  min-height:100vh;line-height:1.9;transition:.3s}

body.dark{--paper:#201E1A;--cream:#161512;--ink:#E8E1D2;--muted:#A79E8B;
  --line:#3A362C;--shadow:0 4px 18px rgba(0,0,0,.35)}

main{max-width:820px;margin:0 auto;padding:1.2rem 1.1rem 5rem}

/* ---------- الترويسة ---------- */
header.top{position:sticky;top:0;z-index:60;display:flex;align-items:center;
  justify-content:space-between;gap:.6rem;padding:.55rem 1rem;
  background:var(--paper);border-bottom:2px solid var(--gold)}
.brand{font-family:'Amiri',serif;font-weight:700;font-size:1.02rem;color:var(--ink);
  text-decoration:none;display:flex;align-items:center;gap:.4rem}
.tools{display:flex;align-items:center;gap:.5rem}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
  background:transparent;color:var(--ink);font-size:1.05rem;cursor:pointer;
  display:grid;place-items:center;transition:.2s}
.ib:hover{background:var(--gold);color:#fff;border-color:var(--gold)}
.ib:active{transform:scale(.9)}

/* ---------- قبة التقدم ---------- */
.dome{width:38px;height:44px;position:relative;cursor:default}
.dome svg{width:100%;height:100%;display:block}
.dome .fill{fill:var(--gold);opacity:.85;transition:.4s}

/* ---------- شارات ---------- */
.badge{display:inline-flex;align-items:center;gap:.3rem;font-size:.72rem;
  background:var(--gold);color:#fff;border-radius:50px;padding:.15rem .6rem;
  font-weight:700}

/* ---------- المسار ---------- */
.crumbs{font-size:.82rem;color:var(--muted);margin-bottom:.8rem;
  display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.crumbs a{color:var(--muted);text-decoration:none}
.crumbs a:hover{color:var(--gold2)}

/* ---------- الترويسة البطلة ---------- */
.hero{position:relative;background:var(--paper);border:1px solid var(--line);
  border-top:6px solid var(--c);border-radius:20px;padding:1.6rem 1.3rem 1.4rem;
  text-align:center;box-shadow:var(--shadow);margin-bottom:1.4rem;overflow:hidden}
.hero .ic{font-size:2.6rem;line-height:1}
.hero h1{font-family:'Amiri',serif;font-size:1.9rem;color:var(--c);margin:.3rem 0 .1rem}
.hero .period{color:var(--gold2);font-size:.85rem;font-weight:600;margin-bottom:.6rem}
.hero .intro{color:var(--muted);font-size:.96rem;line-height:2;max-width:620px;margin:0 auto}

/* ---------- زخرفة SVG ---------- */
.orn{display:block;margin:1.2rem auto;opacity:.55}
.orn line,.orn path,.orn circle{stroke:var(--gold);stroke-width:1.1;fill:none}

/* ---------- العناوين ---------- */
h2.sec{font-family:'Amiri',serif;font-size:1.35rem;color:var(--c);
  margin:2rem 0 .9rem;display:flex;align-items:center;gap:.6rem}
h2.sec:before{content:"";width:6px;height:22px;background:var(--gold);
  border-radius:3px;flex:0 0 auto}
h2.sec .n{margin-right:auto;font-family:'Cairo';font-size:.75rem;color:var(--muted);font-weight:400}

/* ---------- الخط الزمني ---------- */
.tlwrap{position:relative;margin-bottom:.4rem}
.tl{display:flex;gap:.6rem;overflow-x:auto;padding:.6rem .2rem 1rem;
  scroll-snap-type:x mandatory;scrollbar-width:thin}
.tl::-webkit-scrollbar{height:5px}
.tl::-webkit-scrollbar-thumb{background:var(--gold);border-radius:9px}
.tli{flex:0 0 150px;scroll-snap-align:center;background:var(--paper);
  border:1px solid var(--line);border-right:4px solid var(--c);
  border-radius:14px;padding:.6rem .7rem;cursor:pointer;text-align:right;
  transition:.22s;font-family:'Cairo'}
.tli:hover,.tli.on{transform:translateY(-3px);box-shadow:var(--shadow);border-right-color:var(--gold)}
.tli b{display:block;color:var(--c);font-size:.9rem}
.tli span{display:block;color:var(--muted);font-size:.76rem;line-height:1.6}
.tlnav{display:flex;justify-content:space-between;margin-top:-.5rem}

/* ---------- الأحداث ---------- */
.ev{background:var(--paper);border:1px solid var(--line);border-radius:16px;
  padding:1rem 1.1rem;margin-bottom:.9rem;box-shadow:var(--shadow);
  opacity:0;transform:translateY(14px);transition:.45s}
.ev.in{opacity:1;transform:none}
.ev-head{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;margin-bottom:.5rem}
.ev-y{background:var(--c);color:#fff;font-size:.74rem;font-weight:700;
  padding:.15rem .55rem;border-radius:6px;white-space:nowrap}
.ev h3{font-family:'Amiri',serif;font-size:1.18rem;color:var(--ink)}
.ev p{font-family:'Amiri',serif;font-size:1.08rem;line-height:2.05;text-align:justify}
.ev .res{margin-top:.7rem;padding:.55rem .8rem;border-right:4px solid var(--gold);
  background:linear-gradient(135deg,rgba(184,148,47,.10),rgba(184,148,47,.04));
  border-radius:10px;font-size:.9rem;color:var(--gold2);font-weight:600}
.ev .res:before{content:"◀ النتيجة  "}

/* ---------- الشخصيات ---------- */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.6rem}
.pc{background:var(--paper);border:1px solid var(--line);border-radius:14px;
  padding:.65rem .8rem;border-top:3px solid var(--c)}
.pc b{display:block;color:var(--ink);font-size:.95rem}
.pc span{display:block;color:var(--muted);font-size:.78rem;line-height:1.65}

/* ---------- النتائج ---------- */
.outs{list-style:none}
.outs li{position:relative;padding:.5rem 1.5rem .5rem 0;border-bottom:1px dashed var(--line);
  font-size:.95rem}
.outs li:before{content:"◆";position:absolute;right:0;color:var(--gold);font-size:.8rem}

/* ---------- المصادر ---------- */
.src{background:var(--paper);border:1px solid var(--line);border-radius:16px;
  padding:.9rem 1.1rem;margin-top:2.2rem}
.src li{font-size:.86rem;color:var(--muted);padding:.25rem 1.2rem .25rem 0;
  position:relative;line-height:1.8}
.src li:before{content:"❋";position:absolute;right:0;color:var(--gold)}
.src li cite{font-style:normal;color:var(--ink);font-weight:600}

/* ---------- التنقل بين الصفحات ---------- */
.pager{display:flex;gap:.6rem;margin-top:1.6rem}
.pager a{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:14px;
  padding:.7rem .9rem;text-decoration:none;color:var(--ink);transition:.22s}
.pager a:hover{border-color:var(--gold);box-shadow:var(--shadow)}
.pager a small{display:block;color:var(--muted);font-size:.7rem}
.pager a b{font-size:.92rem;color:var(--c)}
.pager a.next{text-align:left}
.pager a.empty{visibility:hidden}

/* ---------- الانتقال بين الصفحات ---------- */
main{animation:pageIn .4s ease}
@keyframes pageIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}

/* ---------- فهرس الصفحة الرئيسية ---------- */
.eg{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:.8rem}
.ec{position:relative;background:var(--paper);border:1px solid var(--line);
  border-top:5px solid var(--c);border-radius:18px;padding:1rem .8rem .9rem;
  text-align:center;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);
  transition:.25s;overflow:hidden}
.ec:hover{transform:translateY(-4px);box-shadow:0 10px 26px rgba(80,60,20,.16)}
.ec .ic{font-size:2.1rem;line-height:1.2}
.ec b{display:block;color:var(--c);font-size:.98rem;margin:.25rem 0 .15rem}
.ec small{display:block;color:var(--muted);font-size:.72rem;line-height:1.55}
.ec .pg{height:5px;background:var(--line);border-radius:9px;margin-top:.55rem;overflow:hidden}
.ec .pg i{display:block;height:100%;background:var(--c);width:0;transition:.4s}
.ec .done{position:absolute;top:.4rem;left:.5rem;font-size:.95rem;color:var(--gold)}

/* ---------- البحث ---------- */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;display:none}
.ov.on{display:block}
.panel{position:fixed;inset:0;background:var(--paper);z-index:95;display:none;flex-direction:column}
.panel.on{display:flex}
.sh{display:flex;gap:.6rem;padding:.8rem;border-bottom:2px solid var(--gold)}
.sh input{flex:1;border:0;background:transparent;font-family:'Cairo';
  font-size:1.05rem;color:var(--ink);outline:none}
.sb{flex:1;overflow-y:auto;padding:.8rem}
.res{background:transparent;border:1px solid var(--line);border-radius:12px;
  padding:.7rem .9rem;margin-bottom:.5rem;cursor:pointer}
.res b{display:block;color:var(--c);font-size:.95rem}
.res small{color:var(--muted);font-size:.78rem;line-height:1.6}
.res em{font-style:normal;background:rgba(184,148,47,.22);border-radius:3px;padding:0 2px}

@media(max-width:420px){
  main{padding:.9rem .8rem 4rem}
  .hero h1{font-size:1.5rem}
  .tli{flex:0 0 132px}
}

/* ========== ١) الإطار المزخرف — حواشي المخطوطات (زوايا ثابتة الحجم) ========== */
.frame{position:relative;border:1px solid var(--gold);border-radius:6px;padding:1.6rem 1.35rem}
.frame:before{content:"";position:absolute;inset:5px;border:1px solid var(--gold);
  opacity:.28;border-radius:3px;pointer-events:none}
.crn{position:absolute;width:26px;height:26px;pointer-events:none;color:var(--gold);opacity:.75}
.crn svg{width:100%;height:100%;display:block;stroke:currentColor;fill:none;stroke-width:1.1}
.crn.tl{top:-1px;right:-1px}.cn-tr{}
.crn.tr{top:-1px;left:-1px}
.crn.bl{bottom:-1px;right:-1px}
.crn.br{bottom:-1px;left:-1px}
.frame>*:not(.crn){position:relative;z-index:1}

/* ========== ٢) الخط الزمني الكبير ========== */
.orn{width:210px;max-width:70%;height:18px;opacity:.55}
.bigtl{display:flex;gap:.55rem;overflow-x:auto;padding:1rem .3rem 1.3rem;
  scroll-snap-type:x mandatory;cursor:grab;scrollbar-width:thin;
  -webkit-overflow-scrolling:touch}
.bigtl:active{cursor:grabbing}
.bigtl::-webkit-scrollbar{height:6px}
.bigtl::-webkit-scrollbar-thumb{background:var(--gold);border-radius:9px}
.btl{flex:0 0 126px;scroll-snap-align:center;position:relative;
  display:flex;flex-direction:column;align-items:center;gap:.25rem;
  text-decoration:none;color:inherit;padding-top:1.1rem}
.btl:before{content:"";position:absolute;top:.4rem;right:-.3rem;left:-.3rem;height:2px;
  background:var(--line)}
.btl:after{content:"";position:absolute;top:0;right:calc(50% - 9px);
  width:18px;height:18px;border-radius:50%;background:var(--paper);
  border:3px solid var(--c);z-index:2;transition:.25s}
.btl:hover:after{transform:scale(1.25)}
.btl .ic{font-size:1.6rem;line-height:1;z-index:2}
.btl .nm{font-family:'Amiri',serif;font-size:.86rem;color:var(--c);text-align:center;line-height:1.5}
.btl .yr{font-size:.65rem;color:var(--muted)}
.btl .st{font-size:.6rem;color:var(--gold2);font-weight:700}

/* ========== ٣) تقليب الصفحة ========== */
.flip{position:fixed;inset:0;background:var(--cream);z-index:200;pointer-events:none;opacity:0}
.flip.go{animation:flipA .5s ease forwards}
@keyframes flipA{
  0%{opacity:.95;transform:perspective(1200px) rotateY(0)}
  55%{opacity:.95;transform:perspective(1200px) rotateY(-38deg)}
  100%{opacity:1;transform:perspective(1200px) rotateY(0)}
}
main.flip-out{animation:flipB .3s ease forwards}
@keyframes flipB{to{opacity:0;transform:perspective(1200px) translateX(-45px)}}

/* ========== ٤) تقدّم على شكل سيف ========== */
.sword{position:fixed;bottom:14px;right:50%;transform:translateX(50%);
  z-index:70;pointer-events:none;display:flex;align-items:center;gap:.5rem;
  background:var(--paper);border:1px solid var(--line);border-radius:50px;
  padding:.3rem .85rem;box-shadow:var(--shadow);font-size:.72rem;color:var(--muted)}
.sword svg{height:11px;width:118px}
.sword .bl{fill:var(--gold);opacity:.9}

/* ========== ٥) الأوسمة ========== */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:.55rem;margin-top:.8rem}
.bg{border:1px dashed var(--line);border-radius:14px;padding:.7rem .5rem;text-align:center;
  background:var(--paper);opacity:.4;filter:grayscale(1);transition:.35s}
.bg.on{opacity:1;filter:none;border:1px solid var(--gold);
  box-shadow:0 0 0 1px rgba(184,148,47,.22),var(--shadow)}
.bg .bi{font-size:1.9rem;line-height:1.2}
.bg b{display:block;font-size:.82rem;color:var(--ink);margin-top:.15rem}
.bg small{display:block;color:var(--muted);font-size:.64rem;line-height:1.5}

/* ========== ٦) شريط علوي رفيع ========== */
.topbar{position:fixed;top:0;right:0;left:0;height:3px;z-index:80}
.topbar i{display:block;height:100%;width:0;
  background:linear-gradient(90deg,var(--gold),#E8CE7C);transition:width .1s linear}

/* ==========================================================
   واجهة الصفحات العميقة (فصول متعددة)
   ========================================================== */

/* الفهرس */
.toc{margin-bottom:1.4rem;padding:1.2rem 1.3rem 1.4rem}
.toclist{list-style:none}
.toclist li{margin:0}
.toclist a{display:flex;align-items:center;gap:.6rem;padding:.42rem .3rem;
  border-bottom:1px dashed var(--line);text-decoration:none;color:var(--ink);
  font-size:.92rem;transition:.2s}
.toclist a:hover{color:var(--c);padding-right:.8rem;background:rgba(184,148,47,.07)}
.toclist b{background:var(--c);color:#fff;border-radius:6px;min-width:24px;
  text-align:center;font-size:.72rem;padding:.1rem .3rem;flex:0 0 auto}
.toclist .ttl{flex:1 1 auto;min-width:0}
.toclist .tpg{margin-inline-start:auto;flex:0 0 auto;font-size:.74rem;color:var(--muted);
  background:rgba(184,148,47,.1);border-radius:6px;padding:.05rem .4rem;min-width:26px;text-align:center}

/* عنوان القسم */
.part{margin-bottom:2.6rem}
.part-h{position:relative;text-align:center;margin:2.4rem 0 1.6rem;
  padding:1.1rem .9rem;border-top:1px solid var(--gold);border-bottom:1px solid var(--gold)}
.part-ic{font-size:2rem;line-height:1}
.part-h h2{font-family:'Amiri',serif;font-size:1.5rem;color:var(--c);margin:.2rem 0}
.part-h p{color:var(--muted);font-size:.92rem;max-width:640px;margin:.4rem auto 0;line-height:1.95}

/* الفصل */
.ch3{position:relative;background:var(--paper);border:1px solid var(--line);
  border-radius:16px;padding:1.3rem 1.2rem;margin-bottom:1.1rem;box-shadow:var(--shadow)}
.ch3-h{display:flex;align-items:flex-start;gap:.6rem;margin-bottom:.7rem;
  padding-bottom:.6rem;border-bottom:1px solid var(--line)}
.ch3-n{background:var(--c);color:#fff;font-size:.72rem;font-weight:700;
  padding:.18rem .5rem;border-radius:6px;flex:0 0 auto;margin-top:.25rem}
.ch3 h3,.rbody h3{font-family:'Amiri',serif;font-size:1.35rem;color:var(--ink);line-height:1.6}
.ch3 .lead,.rbody .lead{font-family:'Amiri',serif;font-size:1.12rem;line-height:2.05;
  color:var(--c);font-weight:700;margin-bottom:.7rem;text-align:right}
.ch3 .ap,.rbody .ap{font-family:'Amiri',serif;font-size:1.1rem;line-height:2.15;
  text-align:justify;margin-bottom:.75rem}
.ch3 .sub,.rbody .sub{font-family:'Amiri',serif;font-size:1.15rem;color:var(--c);
  margin:1.2rem 0 .5rem;padding-right:.6rem;border-right:4px solid var(--gold)}

/* صندوق الخلاصة */
.kbox{margin-top:1rem;background:linear-gradient(135deg,rgba(184,148,47,.09),rgba(184,148,47,.03));
  border:1px solid var(--line);border-radius:12px;padding:.8rem .9rem}
.kbox .bt{font-family:'Amiri',serif;color:var(--gold2);font-size:1rem;margin-bottom:.5rem}
.kgrid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.55rem}
.kb{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:.5rem .6rem}
.kb b{display:block;color:var(--blue);font-size:.88rem;margin-bottom:.1rem}
.kb span{font-size:.78rem;color:var(--muted);line-height:1.6;display:block}

/* جدول */
.tblwrap{overflow-x:auto;margin-top:1rem;border:1px solid var(--line);border-radius:12px}
.tblwrap table{border-collapse:collapse;width:100%;min-width:380px}
.tblwrap th{background:var(--c);color:#fff;font-size:.82rem;font-weight:700;
  padding:.55rem .7rem;text-align:right;white-space:nowrap}
.tblwrap td{padding:.55rem .7rem;font-size:.84rem;border-bottom:1px solid var(--line);
  line-height:1.8;vertical-align:top}
.tblwrap tr:last-child td{border-bottom:0}
.tblwrap tbody tr:nth-child(odd){background:rgba(184,148,47,.045)}

/* اقتباس */
.ch3 blockquote,.rbody blockquote{margin:1rem 0;padding:.8rem 1rem;border-right:5px solid var(--gold);
  background:rgba(184,148,47,.07);border-radius:0 12px 12px 0}
.ch3 blockquote p,.rbody blockquote p{font-family:'Amiri',serif;font-size:1.08rem;line-height:2;color:var(--gold2)}
.ch3 blockquote cite,.rbody blockquote cite{display:block;margin-top:.4rem;font-size:.78rem;
  color:var(--muted);font-style:normal}

/* خلاصة الفصل */
.ch3 .res,.rbody .res{margin-top:1rem;padding:.6rem .9rem;border-right:4px solid var(--gold);
  background:linear-gradient(135deg,rgba(184,148,47,.12),rgba(184,148,47,.04));
  border-radius:10px;font-size:.9rem;color:var(--gold2);font-weight:600}
.ch3 .up{display:block;text-align:left;margin-top:.9rem;font-size:.78rem;
  color:var(--muted);text-decoration:none}
.ch3 .up:hover{color:var(--c)}

@media(max-width:420px){
  .ch3{padding:1rem .85rem}
  .ch3 .ap,.rbody .ap{font-size:1.05rem}
  .kgrid3{grid-template-columns:1fr 1fr}
}


/* ==========================================================
   COMFORT — راحة القراءة والزخرفة
   ========================================================== */

/* عرض مريح للسطر: يمنع الإرهاق البصري */
main{max-width:760px}
.ch3 .ap,.ch3 .lead{max-width:100%}

/* سطر استهلالي كبير (حرف Headline) */
.ch3 .lead .drop,.rbody .lead .drop{float:right;font-family:'Amiri',serif;font-size:3.4rem;line-height:.82;
  color:var(--c);margin:.18rem 0 0 .45rem;font-weight:700;opacity:.9;
  border-right:3px solid var(--gold);padding:.1rem .45rem 0 0}

/* فاصل زخرفي بين الأقسام */
.porn{width:280px;max-width:80%;height:38px;margin:0 auto .6rem;display:block}
.porn .ln{stroke:var(--gold);stroke-width:1.1;fill:none;opacity:.7}
.porn .dm{stroke:var(--gold);stroke-width:.9;fill:none;opacity:.5}

/* فهرس الأقسام داخل رأس القسم */
.part-list{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin-top:.7rem}
.part-list a{font-size:.76rem;text-decoration:none;color:var(--muted);
  border:1px solid var(--line);border-radius:50px;padding:.2rem .7rem;transition:.2s}
.part-list a:hover{color:var(--c);border-color:var(--gold);background:rgba(184,148,47,.08)}

/* فهرس متشعّب */
.toclist>li{padding:0}
.toc-part{list-style:none;margin-bottom:.9rem}

/* الصفحة كلها: شريط علوي + مسرح + شريط سفلي */
body.reading{height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
body.reading .top{flex:0 0 auto}
body.reading .flip,body.reading .sword,body.reading .railbar,body.reading .crumbs{display:none}

main.reader{max-width:none;margin:0;padding:0;flex:1;min-height:0;
  display:flex;flex-direction:column;animation:none}

/* الشريط العلوي يحمل اسم الفصل */
.top.reading .brand{flex:1;min-width:0;gap:.35rem}
.top.reading .btxt{display:none}
.rbrand{font-family:'Amiri',serif;font-size:.92rem;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* المسرح */
.rstage{position:relative;flex:1;min-height:0;overflow:hidden;
  perspective:2200px;perspective-origin:50% 50%;touch-action:pan-y}

/* الصفحة */
.rpage{position:absolute;display:flex;flex-direction:column;overflow:hidden;
  background:var(--paper);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 6px 22px rgba(80,60,20,.12)}
.rbody{flex:1;min-height:0;overflow:hidden;padding:12px 20px}
.rpfoot{flex:0 0 auto;height:26px;display:flex;align-items:center;justify-content:center;
  font-size:.72rem;color:var(--muted);border-top:1px solid var(--line);
  direction:ltr;unicode-bidi:isolate}

/* حاوية القياس (خارج الشاشة) */
.rmeas{position:absolute;left:-99999px;top:0;visibility:hidden;pointer-events:none}
.rmeas .rbody{height:auto!important;padding:0;overflow:hidden}

/* ورقة التقليب */
.rleaf{position:absolute;display:none;transform-style:preserve-3d;
  will-change:transform;z-index:20;pointer-events:none}
.rleaf.on{display:block}
.rface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--paper);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);overflow:hidden}
.rback{transform:rotateY(180deg);
  background:linear-gradient(270deg,var(--paper) 55%,var(--cream) 100%)}
.rleaf::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to left,rgba(0,0,0,.30),rgba(0,0,0,0) 45%);
  opacity:calc(var(--a,0)*.95)}
.rleaf.prev::after{background:linear-gradient(to right,rgba(0,0,0,.30),rgba(0,0,0,0) 45%)}

/* الشريط السفلي */
.rfoot{flex:0 0 auto;display:flex;align-items:center;gap:.6rem;
  padding:.35rem .8rem;min-height:56px;border-top:1px solid var(--line);background:var(--paper)}
.rnav{min-height:48px;min-width:66px;padding:.35rem .9rem;border:1px solid var(--line);
  border-radius:12px;background:transparent;color:var(--ink);font-family:'Cairo';
  font-size:.9rem;font-weight:600;cursor:pointer;transition:.2s}
.rnav:hover:not(:disabled){border-color:var(--gold);background:rgba(184,148,47,.07)}
.rnav:disabled{opacity:.3;cursor:default}
.rprog{flex:1;height:9px;min-width:60px;border:0;padding:0;border-radius:9px;
  background:var(--line);overflow:hidden;cursor:pointer;display:block}
.rprog i{display:block;height:100%;width:0;
  background:linear-gradient(90deg,var(--gold),#E3C56A);transition:width .25s}

/* لوحة الفهرس والذهاب إلى صفحة */
.rpanel{position:fixed;top:0;right:0;bottom:0;width:min(86vw,360px);z-index:120;
  background:var(--paper);border-left:1px solid var(--line);display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .28s ease;
  box-shadow:-6px 0 24px rgba(0,0,0,.14)}
.rpanel.on{transform:translateX(0)}
.rphead{display:flex;align-items:center;justify-content:space-between;
  padding:.65rem .9rem;border-bottom:2px solid var(--gold);
  font-family:'Amiri';font-size:1.05rem;color:var(--c)}

.rpgo{min-height:46px;padding:0 1rem;border:0;border-radius:10px;background:var(--gold);
  color:#fff;font-family:'Cairo';font-weight:700;cursor:pointer}
.rpfont{display:flex;align-items:center;gap:.45rem;padding:.55rem .9rem;

e🧭\u003c/b\u003e\n      \u003ca href=\"#part-5\"\u003e\u003cspan class=\"ttl\"\u003eالقسم الخامس: الإرث\u003c/span\u003e\u003c/a\u003e\n      \u003cul\u003e\u003cli\u003e\u003ca href=\"#caliphate\"\u003e\u003ci\u003e\u003c/i\u003e\u003cspan class=\"ttl\"\u003eالخلافة وآخرها\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href=\"#law-administration\"\u003e\u003ci\u003e\u003c/i\u003e\u003cspan class=\"ttl\"\u003eالقانون والإدارة\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href=\"#provinces\"\u003e\u003ci\u003e\u003c/i\u003e\u003cspan class=\"ttl\"\u003eالولايات والميراث الوطني\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\u003cli\u003e\u003ca href=\"#memory\"\u003e\u003ci\u003e\u003c/i\u003e\u003cspan class=\"ttl\"\u003eالذاكرة والإرث\u003c/span\u003e\u003c/a\u003e\u003c/li\u003e\u003c/ul\u003e\n    \u003c/li\u003e\u003c/ol\u003e\n  \u003c/div\u003e"},{"u":"p","one":true,"id":"part-1","n":"القسم الأول: القيام","ic":"","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-1\" style=\"--c:#2F4F4F\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🌱\u003c/div\u003e\n      \u003ch2\u003eالقسم الأول: القيام\u003c/h2\u003e\n      \u003cp\u003eمن إمارةٍ صغيرة على حدود بيزنطة إلى إمبراطوريةٍ تحكم ثلاث قارات: كيف صعدت إمارة سوغوت في قرنٍ ونصف؟ هذا القسم يقرأ الأناضول بعد المغول، وتأسيس عثمان وأورخان، وصعود الدولة في البلقان، ثم الفتح الذي غيّر وجه العالم سنة ١٤٥٣م.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#anatolia-13c\"\u003eالأناضول في القرن الثالث عشر\u003c/a\u003e\u003ca href=\"#osman-orhan\"\u003eعثمان وأورخان: تأسيس الدولة\u003c/a\u003e\u003ca href=\"#balkans-empire\"\u003eالبلقان وصدمة أنقرة\u003c/a\u003e\u003ca href=\"#conquest-1453\"\u003eفتح القسطنطينية\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"anatolia-13c","n":"الأناضول في القرن الثالث عشر","ic":"🏕️","part":"القسم الأول: القيام","h":"\u003carticle class=\"ch3\" id=\"anatolia-13c\" data-toc=\"الأناضول في القرن الثالث عشر\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e١.١\u003c/span\u003e\n          \u003ch3\u003e🏕️ الأناضول في القرن الثالث عشر\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eق\u003c/span\u003eبل أن تُذكر كلمة «عثماني» في كتاب، كانت الأناضول هضبةً مقسّمة بين سلاجقة ومغول وإماراتٍ حدودية وبيزنطةٍ مُنهكة. فهمُ هذه الأرض شرطٌ لفهم الدولة التي وُلدت فيها.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكانت الأناضول في مطلع القرن الثالث عشر عالمًا قائمًا بذاته: هضبة واسعة تحيط بها الجبال من الشمال والجنوب، وتشقّها الأنهار نحو بحر إيجة، فيصير كل وادٍ فيها عالمًا صغيرًا منعزلًا له لغته وعاداته ومحصوله. وقد حكمها سلاجقة الروم من قونية، وبنوا فيها نظامًا من الخانات والقوافل والأسواق جعل طرق التجارة القادمة من فارس والعراق تنتهي إلى موانئ سينوب وأنطاليا وطرابزون. وكانت المدن الكبرى — قونية وقيسرية وسيواس وأماسية — مراكز علمٍ وفقهٍ وبناء، تُدار فيها المدارس والبيمارستانات والخانقاوات، ويتكلم الناس فيها العربية والفارسية والتركية والرومية في سوقٍ واحد. غير أن هذا العالم كان هشًّا من جهة العسكر: جيشٌ سلجوقي قائم على الإقطاع، وحدود طويلة مع بيزنطة، وقبائل تركمانية تتدفق من الشرق ولا تجد لها موضعًا ثابتًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوجاءت الضربة من الشرق. بعد سقوط خوارزم أمام المغول سنة ١٢٣١م اندفعت موجاتٌ من الفارّين إلى الأناضول، ثم جاء الجيش المغولي نفسه بقيادة بايجو نويان، فالتقى بالسلطان السلجوقي كيخسرو الثاني في كوسه داغ سنة ١٢٤٣م، فانهزم السلاجقة هزيمةً ساحقة. ولم يحتل المغول البلاد احتلالًا كاملًا، بل فرضوا عليها الجزية والتبعية، وتركوا السلاجقة يحكمون باسمهم، ثم قسّموا السلطنة إلى ولاياتٍ يحكمها أمراء متعددون. وكانت النتيجة أن السلطة المركزية في قونية أخذت تذوب، وأن كل والٍ صار يتصرف كأنه سيد نفسه، وأن القبائل التركمانية صارت قوةً عسكرية لا يضبطها أحد. ومنذ ذلك الحين لم يعد في الأناضول سلطانٌ واحد يُطاع، بل فراغٌ سياسي كبير يتنازعه الجميع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي هذا الفراغ وُلدت الإمارات. ظهرت في غرب الأناضول وجنوبه نحو عشرين إمارة صغيرة، منها كرميان في كوتاهية، وكاراسي في باليكسير، وصاروخان في مانيسا، وآيدين ومنتشه في الجنوب الغربي، وقرمان في الجنوب، وبينها إمارةٌ صغيرة لا اسم لها في البداية على حدود بيزنطة في سوغوت. وكانت هذه الإمارات تشترك في أمرٍ واحد: أنها قامت على الغزو في أرض الروم، وأن رجالها من الغزاة المتطوعين والقبائل المهاجرة، وأن دخلها من الغنيمة والجزية وأرض الفتح. لكنها اختلفت في الحظ: فمنها ما سيطر على موانئ التجارة فصارت له أساطيل، ومنها ما بقي إمارةً جبلية صغيرة، ومنها ما سيكتب له أن يبتلع الباقي كله.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان المجتمع الحدودي في هذه المنطقة مجتمعًا خاصًّا، لا يشبه مجتمع المدن السلجوقية ولا مجتمع بيزنطة. كان فيه الغازي: مقاتلٌ متطوع يحارب في سبيل الدين والغنيمة معًا، لا يتقاضى راتبًا ولا يملك أرضًا، وإنما يعيش على ما يصيبه من الفتح. وكان فيه الأخي: شابٌّ من أهل الحرف ينتسب إلى جماعةٍ ذات طقوسٍ وأخوّة، تستقبل الغريب وتُسكنه وتُطعمه وتحميه في سوق المدينة. وكان فيه الدراويش: مشايخ صوفية يبنون الزوايا على الطرق، ويحكون للقبائل عن الفتوح والكرامات، ويربطون الدين بالحياة اليومية. هذه الطبقات الثلاث — الغازي والأخي والفقير الصوفي — هي التي ستحمل الدولة العثمانية في أول قرنٍ من عمرها، قبل أن يصير لها ديوانٌ وجيشٌ نظامي وقانونٌ مكتوب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان الجانب الآخر من الحدود في حالةٍ أسوأ. فقد سقطت القسطنطينية في أيدي الحملة الصليبية الرابعة سنة ١٢٠٤م، وقُسمت الإمبراطورية البيزنطية بين اللاتين والبنادقة، وقامت في نيقية دولةٌ بيزنطية منفية. ولم تُستعد القسطنطينية إلا سنة ١٢٦١م على يد ميخائيل الثامن، لكن الإمبراطورية التي عادت لم تكن الإمبراطورية التي سقطت: خزينةٌ فارغة، وأسوارٌ متهالكة، وفلاحون هجروا الأرض، وتجار البنادقة يتحكمون في موانئها، وجيشٌ من المرتزقة يقاتل بأجرٍ لا بولاء. وأضف إلى ذلك الحروب الأهلية المتكررة بين أباطرة آل باليولوج، والتي استعان فيها كل فريقٍ بالجيران الأتراك. فكانت بيزنطة تموّل خصومها، وتفتح لهم أبوابها، وتُسلّمهم مدنها من حيث لا تشعر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي هذا السياق لا بد من سؤال: لماذا سوغوت؟ لأن التاريخ لا يُفسَّر بالمصادفة وحدها. تقع سوغوت في وادٍ ضيق بين جبلين، على الطريق الذي يربط قونية ببورصة ونيقية، أي على الممر الذي تمرّ فيه التجارة والقوافل بين الداخل والسهول البيزنطية. وهي قريبة من قلعة بيزنطية تُسمى بيلاجيك، فكانت على تماسٍّ دائم مع الحدود، وهذا في منطق الغزو ميزةٌ لا عيب: القريب من الثغر يصيبه من الغنيمة أكثر. وكان وراءها مراعٍ واسعة للقبائل، وأمامها سهلٌ خصب. فأرضٌ تُطعم، وطريقٌ يُغني، وحدٌّ يُقاتَل عليه، وقلعةٌ يُحتمى بها. هذه الأربعة اجتمعت في بقعةٍ واحدة، فصارت نواة دولة تمتدّ بعد قرنين على ثلاث قارات.\u003c/p\u003e\u003cp class=\"ap\"\u003eلكن المؤرخ يقف أمام هذه البداية في حيرة. فالمصادر العثمانية الأولى — تواريخ عاشق باشا زاده وعروج بك وأحمدي — كُتبت في القرن الخامس عشر، أي بعد الحدث بقرنٍ ونصف، وحملت همًّا آخر غير تسجيل ما جرى: همّ تبرير قيام الدولة، وإعطائها نسبًا نبيلًا وجذورًا في الغزو القديم. فصارت عثمان يرى في منامه شجرةً تخرج من صدره وتظلل العالم، وصار كل سلطان يُنسب إلى قبيلةٍ من قبائل الغزّ القديمة. والمؤرخ الحديث لا ينكر الخبر كله، لكنه يقرأه بحذر: يقبل ما تتقاطع فيه الروايات، ويترك ما تحمله الحاجة السياسية، ويسأل عن سكوت المصادر كما يسأل عن كلامها. ولا تُعرف لعثمان نفسه نقودٌ ضُربت باسمه، وإنما بدأت النقود في عهد ابنه أورخان، وهذا في ذاته دليلٌ على أن البداية كانت أصغر بكثير مما صوّرتها التواريخ الرسمية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان اقتصاد هذه البقعة مختلطًا بين الرعي والزراعة والتجارة، وهذا المزيج هو ما جعلها قادرة على التوسع. فالقبائل تربي الماشية على الهضبة، والفلاحون يزرعون القمح والشعير في السهول، والقوافل تحمل الحرير والتوابل والملح. لكن الدولة الناشئة كان دخلها الأول من الغنيمة: كل فتحٍ يجلب أسرى وسبيًا وخيلًا وماشية، ويُقسَّم خمسه للسلطان وأربعة أخماسه للمقاتلين. ولما توقفت الفتوح في فترات، اهتزّ الاقتصاد، فاضطرت الدولة إلى بناء نظامٍ ضريبي ثابت على الأرض المفتوحة، وهذا النظام هو الذي سيصير لاحقًا «التيمار»: أرضٌ تُمنح للمقاتل مقابل خدمته، فيصبح الجندي مالكًا لدخلها لا لرقبتها، ويصبح الفلاح مربوطًا بها لا عبدًا لها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت الأناضول في هذا القرن حلقةً في نظامٍ عالمي أوسع. ففي الشرق إيلخانات المغول في تبريز، وفي الجنوب دولة المماليك في القاهرة وهي القوة الإسلامية الكبرى التي تحمي الحرمين وتقاتل الصليبيين، وفي الشمال خانية القبيلة الذهبية، وفي الغرب مملكة المجر والبندقية وجنوة. وكانت كل قوةٍ من هذه تريد شيئًا من الأناضول: المغول يريدون الجزية، والمماليك يريدون الأمن على طريق الحج، والبنادقة يريدون الموانئ والامتيازات، والمجر تريد الحدود. وفي هذا التشابك لم يكن أمام الإمارات الصغيرة إلا أحد طريقين: أن تُبتلع، أو أن تبتلع. وقد اختارت إمارة سوغوت الطريق الثاني ببطءٍ وصبر، دون معارك كبرى في البداية، وبسياسة زواجٍ وتحالفٍ وشراء ذمم، وهي سياسة ستبقى في جينات الدولة العثمانية إلى آخر يوم.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالجغرافيا التي صنعت التاريخ\u003c/h4\u003e\u003cp class=\"ap\"\u003eالأناضول جسرٌ بين آسيا وأوروبا، لكنها ليست جسرًا سهلًا. سلسلة جبال بونتوس في الشمال، وجبال طوروس في الجنوب، وهضبةٌ في الوسط قليلة الماء، ووديانٌ تنزل غربًا نحو بحر إيجة. هذه التضاريس صنعت وحداتٍ سياسية صغيرة: كل وادٍ معزول نسبيًا عن جاره، فيسهل على أميرٍ أن يحكمه، ويصعب على سلطانٍ أن يحكمها كلها من مركزٍ واحد. ولهذا كانت الأناضول دائمًا أرض إماراتٍ متعددة، لا أرض إمبراطورية واحدة، إلا حين تأتي قوةٌ قادرة على ضبط الممرات والقلاع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت الطرق هي العصب الحقيقي. طريقٌ من قونية إلى قيسرية إلى سيواس نحو فارس، وطريقٌ من قونية غربًا إلى بورصة ونيقية نحو البسفور، وطريقٌ جنوبًا إلى أنطاليا على البحر. وعلى هذه الطرق بُنيت الخانات: مبانٍ حجرية محصّنة فيها إسطبلٌ وفراشٌ ومطبخ، يستريح فيها التاجر ليلًا مجانًا ثلاثة أيام. من يسيطر على هذه الطرق يسيطر على التجارة، ومن يسيطر على التجارة يملك المال الذي يشتري به الجيوش. ولذلك سنجد كل دولةٍ قوية في الأناضول تحرص على بناء الخانات وتأمين القوافل، لا على بناء القصور.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالمغول بعد كوسه داغ\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يكن المغول يريدون حكم الأناضول، بل استنزافها. فبعد كوسه داغ فرضوا جزيةً سنوية، وأقاموا ولاةً يراقبون السلاجقة، وأبقوا السلطان في قونية كواجهةٍ تُجمع باسمها الأموال. وكان هذا النظام يعمل بلا كلفة، لكنه كان يُفرّغ السلطة المركزية من مضمونها شيئًا فشيئًا: فمن يدفع الجزية للمغول لم يبقَ عنده ما يدفعه لجيشه، ومن لا يدفع لجيشه لا يطيعه جيشه. وفي سنة ١٣٣٥م انهارت الدولة الإيلخانية نفسها بعد موت أبي سعيد، فتوقف التهديد الخارجي فجأة، لكن السلطة المركزية كانت قد ماتت قبله.\u003c/p\u003e\u003cp class=\"ap\"\u003eوترك ذلك أثرين طويلين. الأول أن المدن صارت تدير نفسها بأهلها: قاضٍ يعيّنه الأهل، وأخيّة تحمي السوق، وخطيبٌ يجمع الناس في الجامع، وشيخٌ له زاوية. والثاني أن العلم هاجر: فلما اضطربت قونية وسيواس، انتقل الفقهاء والأطباء والمهندسون إلى المدن الغربية الآمنة، وخصوصًا بورصة وإزنيك، فوجدت الدولة الناشئة عندها رصيدًا بشريًا جاهزًا لم تدفع ثمن تكوينه. وأغلب من بنى مؤسسات عثمان الأولى كانوا من هؤلاء المهاجرين: مدرّسون من خراسان، وأطباء من فارس، وقضاة من مدنٍ سلجوقية قديمة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالغازي والأخي والدراويش\u003c/h4\u003e\u003cp class=\"ap\"\u003eاختلف المؤرخون في تفسير قيام الدولة العثمانية اختلافًا حادًّا. فذهب بعضهم إلى أنها قامت على «الغزو» وحده: جماعةٌ من المقاتلين المتطوعين على حدود الكفر، يتقدمون بلا دولة ولا نظام حتى يصيروا دولة. ورأى آخرون أن الغزو وحده لا يبني دولة، لأن الغنيمة تُصرف ولا تُبنى بها مؤسسات، وأن الأصحّ أن العثمانيين جمعوا بين ثلاثة عناصر: قوة القبيلة، وشبكة التجارة، وشرعية الغزو الديني. والحقيقة أن كلًّا منهما يصف جانبًا: الغزو أعطى الدافع والرجال، والتجارة أعطت المال، والقبيلة أعطت العصبية التي تحمل الدولة في أزماتها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان الأخيّة هو الجانب المنسي من هذه القصة. فجماعة الفتيان في المدن الأناضولية كانت تنظّم الحرف: تُسعّر، وتفتش، وتفصل في الخلافات، وتستقبل الغريب، وتُخرج في المواسم. ولما جاء العثمانيون لم يهدموها بل تسلّلوها: صار شيخ الأخيّة قاضيًا أو نقيبًا للأشراف، وصارت الزاوية جامعًا، وصارت الطقوس مولدًا واحتفالًا. وهذا هو النمط العثماني الأول في التعامل مع القوى القائمة: لا تُلغى، بل تُلبس ثوبًا رسميًّا وتُدمج في هرم الدولة. وسيُطبَّق هذا النمط لاحقًا على الكنائس والأوقاف والمذاهب والنقابات، وسيكون أحد أسرار طول عمر الدولة.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eكوسه داغ ١٢٤٣م\u003c/b\u003e\u003cspan\u003eهزيمة السلاجقة أمام المغول، وبداية تفكك الأناضول إلى إمارات\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالإمارات الحدودية\u003c/b\u003e\u003cspan\u003eنحو عشرين إمارة صغيرة قامت على أنقاض السلطنة السلجوقية\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسوغوت\u003c/b\u003e\u003cspan\u003eوادٍ على طريق القوافل وعلى حدّ بيزنطة، فيه وُلدت الدولة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eثقافة الغزو\u003c/b\u003e\u003cspan\u003eالغازي والأخي والدراويش حملوا الدولة في قرنها الأول\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالإمارة\u003c/th\u003e\u003cth\u003eمركزها\u003c/th\u003e\u003cth\u003eمصيرها\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eكرميان\u003c/td\u003e\u003ctd\u003eكوتاهية\u003c/td\u003e\u003ctd\u003eضمّها بايزيد الأول، ثم عادت عصيةً حينًا قبل أن تنطوي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eكاراسي\u003c/td\u003e\u003ctd\u003eباليكسير\u003c/td\u003e\u003ctd\u003eأول ما ضمّه أورخان من الإمارات، وأعطته أسطولًا\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eآيدين\u003c/td\u003e\u003ctd\u003eأفسس وساحل بحر إيجة\u003c/td\u003e\u003ctd\u003eبنَت أسطولًا قويًا، ثم انطوت في الدولة العثمانية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eقرمان\u003c/td\u003e\u003ctd\u003eقونية ولارندة\u003c/td\u003e\u003ctd\u003eأطول الإمارات مقاومة، ولم تُضمّ نهائيًا إلا في القرن الخامس عشر\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eصاروخان\u003c/td\u003e\u003ctd\u003eمانيسا\u003c/td\u003e\u003ctd\u003eقريبة من العثمانيين ومهادنة، ومركز تجاري مهم\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003e«لم يُبتلَ العالم منذ خلق الله آدم إلى زماننا هذا بمثل هذه النازلة»\u003c/p\u003e\u003ccite\u003eابن الأثير، الكامل في التاريخ، في وصف زحف المغول على بلاد الإسلام (بتصرّف)\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eكانت الأناضول قبل العثمانيين عالمًا غنيًّا هشًّا: مدنٌ عامرة وطرق تجارة وخانات، لكن سلطةً مركزية ذابت بعد كوسه داغ سنة ١٢٤٣م. فقامت مكانها إمارات حدودية صغيرة، يحملها الغازي والأخي والفقير الصوفي، وتغذيها الغنيمة والتجارة. وفي هذا الفراغ كانت سوغوت أقرب البقاع إلى الحدود البيزنطية وأقربها إلى الطريق التجاري، فصارت نواةً لدولةٍ لم تكن أحدٌ يتوقعها.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"osman-orhan","n":"عثمان وأورخان: تأسيس الدولة","ic":"⚔️","part":"القسم الأول: القيام","h":"\u003carticle class=\"ch3\" id=\"osman-orhan\" data-toc=\"عثمان وأورخان: تأسيس الدولة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e١.٢\u003c/span\u003e\n          \u003ch3\u003e⚔️ عثمان وأورخان: تأسيس الدولة\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي ثلاثين سنة بنى عثمان إمارةً، وفي ثلاثين أخرى حوّلها أورخان إلى دولةٍ لها جيشٌ ونقودٌ ومدارس ووزير. هذا الفصل يقرأ كيف انتقل العثمانيون من الغزو إلى الحكم.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eلا يُعرف عن عثمان بن أرطغرل إلا قليلٌ مؤكد. لا تاريخ ميلاده، ولا عدد سني حكمه بالضبط، ولا صورة حقيقية لما كان عليه. وما يعرفه المؤرخ أنه كان أميرًا على جماعةٍ من التركمان في منطقة سوغوت في أواخر القرن الثالث عشر، وأنه بدأ يتوسع على حساب القلاع البيزنطية المجاورة بوتيرةٍ بطيئة، وأنه لم يخض معركةً كبرى واحدة بالمعنى الذي نفهمه من كلمة «معركة». كانت حروبه سلسلةً من المناوشات والحصارات والاتفاقات: قلعةٌ تُفتح بالحصار، وأخرى تُسلَّم بصلح، وثالثة تُؤخذ بالزواج من صاحبتها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت طريقته في التوسع أقرب إلى الشراء منها إلى الحرب. فقد عقد تحالفاتٍ مع أمراء الروم المحليين، وتزوج من بناتهم، وأبقى لهم أملاكهم مقابل الطاعة والخدمة العسكرية. ولهذا نجد في جيشه أسماءً رومية صارت بعد جيلين أسماءً عثمانية مشهورة، مثل ميخال أوغلي الذي حارب معه في فتوحه الأولى، وبقي نسله من كبار قادة الدولة قرونًا. وهذا يعني أن الدولة في بدايتها لم تكن مشروعًا قوميًّا تركيًّا، بل مشروعًا عسكريًّا مفتوحًا لكل من يقبل الانضمام إليه من المسلمين والروم على السواء، وهذا الانفتاح هو ما سيصير لاحقًا نظام «الملل».\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سنة ١٣٠٢م انتصر عثمان على قوة بيزنطية في موضعٍ قريب من نيقوميديا، فانفتح أمامه سهل بورصة. وكانت هذه المعركة — على صغرها — نقطة تحول، لأنها أثبتت لجيرانه أن البيازنة لا يستطيعون حماية من يلجأ إليهم. فبدأت القرى اليونانية تفضّل طاعة الأمير التركي على انتظار جيشٍ بيزنطي لا يأتي. وانتقل عثمان بعدها إلى حصار القلاع الكبرى: بورصة في الجنوب، ونيقية في الشرق. ولم يُكمل حصار بورصة، فقد مرض ومات سنة ١٣٢٦م قبل أن تدخلها جيوشه بأيام، فدخلها ابنه أورخان واتخذها عاصمةً له.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأورخان هو الذي حوّل الإمارة إلى دولة. فبعد أن أخذ بورصة، جعلها مركز حكمه، وبنى فيها أول جامعٍ سلطاني، ودار سكّ النقود، وأول مدرسةٍ عالية. ثم أخذ نيقية سنة ١٣٣١م، ونيقوميديا سنة ١٣٣٧م، فأصبحت له سواحل بحر مرمرة كلها. ولما دخل نيقية حوّل كنيسة آيا صوفيا فيها إلى جامع، وأوقف عليها الأوقاف، وأسّس فيها مدرسةً أشرف عليها العالم داود القيصري. وهكذا لم يكتفِ بالفتح، بل أنشأ في المدينة المفتوحة مؤسسةً تعليمية تُخرّج القضاة والمدرسين، وهذا هو الفرق بين الغازي الذي يأخذ، والسلطان الذي يبني.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالتحول الثاني كان في الجيش. كانت القوات حتى ذلك الحين من فرسان التيمار والمتطوعين، تأتي في الموسم وتعود إلى مراعيها. وأدرك أورخان أن هذا الجيش لا يصلح لحصارٍ طويل ولا لحاميةٍ دائمة، فأنشأ فرقًا تُدفع لها رواتب منتظمة وتُدرَّب دائمًا. وكانت النواة الأولى لما سيُعرف لاحقًا بالإنكشارية والجيش السلطاني، وقد نظّمها ووسّعها من بعده مراد الأول، حتى صارت عمود الدولة. ومع الجيش الدائم جاءت الحاجة إلى المال الثابت، فجاء النظام الضريبي، وجاءت الحاجة إلى الحساب، فجاء الديوان والوزير الأول.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي السياسة الخارجية لعب أورخان لعبةً دقيقة. تزوج من أميرةٍ بيزنطية، ودخل في تحالفٍ مع الإمبراطور يوحنا السادس قانتاقوزن في حروبه الأهلية، وأرسل قواته لتقاتل معه مقابل مالٍ وامتيازات. ثم استغل ضعف الإمبراطور فأنشأ له موطئ قدمٍ في غاليبولي سنة ١٣٥٤م بعد زلزالٍ هدم أسوارها. وهكذا دخل العثمانيون أوروبا لا بمعركةٍ واحدة، بل بصداقةٍ مع إمبراطورٍ محتاج، ثم بزلزال، ثم بجيشٍ عبر المضيق ولم يعد. وهذه هي السياسة العثمانية الأولى: لا تُعلن الحرب إن كان في الإمكان أن تُستأجر.\u003c/p\u003e\u003cp class=\"ap\"\u003eولم تكن هذه الفتوح بلا ثمن. فقد جاء الطاعون الكبير سنة ١٣٤٧م فقتل في المدن الأناضولية والبيزنطية أعدادًا هائلة، وتوقفت التجارة، وهجرت قرى. لكن الوباء كان في الوقت نفسه نعمةً سياسية للدولة الناشئة: فقد أضعف خصومها أكثر مما أضعفها، لأنهم كانوا أكثر تحضرًا وأكثر سكانًا في مدنٍ مزدحمة. وفي العقود التالية تدفقت قبائل تركمانية جديدة من الشرق إلى الأراضي التي فرغت من أهلها في تراقيا، فصار للعثمانيين في أوروبا شعبٌ يدفع الضرائب ويحمل السلاح، قبل أن يصير لهم فيها ولاةٌ وقضاة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان أخطر ما واجهه أورخان سؤال الشرعية. فالغازي الذي يقاتل على الحدود لا يحتاج إلى أكثر من سيفٍ وغنيمة، أما السلطان الذي يحكم مدنًا فيها رومٌ ومسلمون وتجارٌ وفلاحون فيحتاج إلى قانونٍ وإلى تفسيرٍ لوجوده. فاستعار أورخان ألقاب السلاجقة والمغول، وضرب النقود باسمه، وأحاط نفسه بالعلماء، وأمر بجمع الضرائب وفق دفتر. ومع ذلك بقي لقب «الغازي» هو اللقب الرسمي على نقوده، لأن الدولة لم ترد أن تتخلى عن مصدر شرعيتها الأول: أنها دولة جهادٍ على ثغرٍ إسلامي. وهذا الجمع بين الغزو والبيروقراطية هو ما ميزها عن كل الإمارات التي حولها.\u003c/p\u003e\u003cp class=\"ap\"\u003eومات أورخان سنة ١٣٥٩م، وترك دولةً تبلغ مساحتها أضعاف ما ورثه، وجيشًا نظاميًّا، وديوانًا، وعاصمةً هي بورصة، ونقودًا، ومدارس، وعلاقاتٍ دولية مع بيزنطة والبنادقة وجنوة. لكنه ترك أيضًا مشكلةً سترافق الدولة ستة قرون: أن الأخ لا يأمن من أخيه، وأن العرش لا يُورث بلا دم. فبعد موته تنازع ابناه مراد وخليل، وانتهى الأمر بقتل خليل، وبدأ تقليدٌ دموي سيصير لاحقًا قانونًا مكتوبًا. وهذه هي الوجهة الأخرى للدولة القوية: أنها تشتري وحدتها بثمنٍ أخلاقي باهظ.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eمن الإمارة إلى الدولة\u003c/h4\u003e\u003cp class=\"ap\"\u003eالفرق بين الإمارة والدولة ليس في المساحة بل في المؤسسات. فالإمارة تعيش على الغنيمة، والدولة تعيش على الضريبة؛ والإمارة تحكم بالسيف، والدولة تحكم بالقانون؛ والإمارة تموت بموت أميرها، والدولة تبقى ببقاء نظامها. وقد عبر العثمانيون هذا الجسر في جيلين فقط: عثمان أخذ الأرض، وأورخان بنى فوقها ديوانًا وجيشًا ونقودًا ومدارس، ثم جاء مراد الأول فبنى فوق ذلك كلَّه فكرة «السلطنة» نفسها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوهذا التدرج يفسر سرعة الصعود. فالدولة لم تُبنَ دفعةً واحدة على نموذجٍ مُسبق، بل أُضيفت طبقةٌ فوق طبقة كلما دعت الحاجة: احتاجت المال فأنشأت التيمار، واحتاجت الجند فأنشأت الإنكشارية، واحتاجت الشرعية فاستعانت بالعلماء، واحتاجت ضبط الأقاليم فأنشأت القضاء. وكل مؤسسة من هذه وُلدت من مشكلةٍ عملية، لا من نظريةٍ مستوردة، وهذا هو سبب تماسكها الشديد.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالجيش الدائم: كيف بُني أول جيش نظامي\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الجيش في العالم الإسلامي قبل العثمانيين إما جيشًا إقطاعيًّا يأتي في الموسم ويعود، وإما جيشًا من المماليك المشترَين، وإما حشدًا قبليًّا. والعثمانيون أضافوا شكلًا رابعًا: فرقٌ مدفوعة الأجر دائمًا، تُدرَّب في السلم كما تُدرَّب في الحرب، وتعيش في ثكنات لا في بيوت، وتدين بالولاء للسلطان مباشرةً لا لأميرٍ أو قبيلة. وهذا الشكل هو الذي جعل حصار القسطنطينية ممكنًا بعد أن فشل فيه من قبلهم مرات.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت التغذية البشرية لهذا الجيش هي المشكلة الكبرى، وحلّها العثمانيون بحلٍّ أثار جدلًا أخلاقيًّا إلى اليوم: أن يُؤخذ من أبناء الرعايا المسيحيين في البلقان نسبةٌ محددة، فيُسلموا ويُربّوا في ثكنات السلطان ويُعلَّموا اللغة والعقيدة والفنون العسكرية، ثم يُفرَّقوا على الجيش والإدارة. ويُسمى هذا النظام «الدوشرمة». وقد أنتج وزراء وقادةً عظامًا، لكنه في جوهره كان انتزاعًا للأطفال من أسرهم، وهو ما يجعله من أصعب صفحات تاريخ الدولة على القارئ المعاصر.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eأورخان ودبلوماسية الزواج والتحالف\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الدبلوماسية العثمانية المبكرة أقرب إلى المقايضة منها إلى المعاهدات. زواجٌ يعقد تحالفًا، وهديةٌ تفتح قلعة، وقوةٌ تُرسل لمساعدة إمبراطور مقابل مالٍ وأرض. ولم يكن هذا ضعفًا بل حسابًا: الدولة الفتية لم تكن قادرة على حربٍ على جبهتين، فكانت تشتري السلم على جبهةٍ لتحارب على الأخرى. وقد ورث العثمانيون هذه العادة عن السلاجقة والبيزنطيين معًا، وأتقنوها حتى صارت فنًّا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوظل هذا النمط يعمل قرونًا: مع البندقية بالامتيازات التجارية، ومع فرنسا بالتحالف ضد الهابسبورغ، ومع الإمارات بالقضاء عليها بالتدريج لا بالحرب الشاملة. ودرس أورخان الحقيقي أن القوة لا تُقاس بعدد الجنود فقط، بل بعدد الأطراف التي يمكن أن تجعلها تقف إلى جانبك أو على الأقل لا تقف ضدك.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eبورصة ١٣٢٦م\u003c/b\u003e\u003cspan\u003eأول عاصمة عثمانية، وفيها أول جامع سلطاني ودار سكّ النقود\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eنيقية ١٣٣١م\u003c/b\u003e\u003cspan\u003eفتحها أورخان وحوّل كنيستها الكبرى إلى جامع وأسّس فيها مدرسة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eغاليبولي ١٣٥٤م\u003c/b\u003e\u003cspan\u003eأول موطئ قدم دائم في أوروبا، جاء بعد زلزال هدم أسوارها\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالجيش الدائم\u003c/b\u003e\u003cspan\u003eفرقٌ مدفوعة الأجر تُدرَّب دائمًا، نواة الإنكشارية لاحقًا\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمحطة\u003c/th\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eمعركة كويون حصار\u003c/td\u003e\u003ctd\u003e١٣٠٢م\u003c/td\u003e\u003ctd\u003eانفتاح سهل بورصة أمام عثمان\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eفتح بورصة\u003c/td\u003e\u003ctd\u003e١٣٢٦م\u003c/td\u003e\u003ctd\u003eأول عاصمة، وبداية المؤسسات السلطانية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eفتح نيقية ونيقوميديا\u003c/td\u003e\u003ctd\u003e١٣٣١–١٣٣٧م\u003c/td\u003e\u003ctd\u003eالسيطرة على سواحل بحر مرمرة كلها\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالعبور إلى غاليبولي\u003c/td\u003e\u003ctd\u003e١٣٥٤م\u003c/td\u003e\u003ctd\u003eبداية التوطن العثماني في البلقان\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003e«أوصيك بالعدل والرفق بالرعية، ولا تُكلّفهم ما لا يطيقون»\u003c/p\u003e\u003ccite\u003eمن وصية عثمان لابنه أورخان كما ترويها التواريخ العثمانية القديمة\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eبنى عثمان إمارةً بالتوسع الهادئ والتحالف والزواج لا بالمعارك الكبرى، وحوّلها أورخان إلى دولةٍ بجيشٍ دائم ونقودٍ ومدارس وعاصمة. وقد عبر العثمانيون جسر «الإمارة إلى الدولة» في جيلين، ثم دخلوا أوروبا بصداقة إمبراطورٍ محتاج وزلزالٍ هدم الأسوار، فصار لهم فيها شعبٌ قبل أن يصير لهم فيها ولاة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"balkans-empire","n":"البلقان وصدمة أنقرة","ic":"🌩️","part":"القسم الأول: القيام","h":"\u003carticle class=\"ch3\" id=\"balkans-empire\" data-toc=\"البلقان وصدمة أنقرة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e١.٣\u003c/span\u003e\n          \u003ch3\u003e🌩️ البلقان وصدمة أنقرة\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي نصف قرن صارت الدولة العثمانية قوةً أوروبية كبرى، ثم جاء تيمور فحطّم جيشها في ساعةٍ واحدة. هذا الفصل يقرأ الصعود السريع، والسقوط المفاجئ، وكيف نجت الدولة من موتٍ كان محققًا.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eبعد غاليبولي لم يعد العثمانيون ضيوفًا في أوروبا بل سكانًا. وفي عهد مراد الأول (١٣٦٢–١٣٨٩م) صارت أدرنة عاصمةً أوروبية للدولة، وتحوّل الطريق من الأناضول إلى البلقان إلى ممرٍّ عسكري دائم. وكانت الخطة العثمانية في البلقان واضحة: تجنّب حصار القسطنطينية، والالتفاف حولها من الغرب، والاستيلاء على مقدونيا وتراقيا وبلغاريا، حتى تصبح المدينة عاصمةً محاصرةً من البر بلا عمق. وهي خطة ذكية، لأنها لم تصرف الجهد في أعظم حصن في العالم، بل في الأرض التي تُطعم ذلك الحصن.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت البلقان في ذلك الوقت خريطةً من الممالك المتنازعة: بلغاريا، وصربيا، والبوسنة، والأفلاق، والمجر، ومدنٌ إيطالية على الساحل، وأمراءٌ محليون لا يعرفون غير مصالحهم. فاستعمل العثمانيون هذا التشتت ببراعة: تحالفوا مع هذا ضد ذاك، وأغروا أميرًا بلقبٍ أو أرض، ثم عادوا إليه بعد سنوات وقد صار وحده. وفي معركة ماريتسا سنة ١٣٧١م انهزم الصرب انهزامًا ساحقًا، فصارت كثير من الممالك البلقانية تابعةً اسميًّا للسلطان، تدفع جزية وتقدّم جندًا، وتحكم نفسها بنفسها. وهذا هو «التبعية»: لا احتلال ولا استقلال، بل شكلٌ وسط صار أداةً عثمانية أساسية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سنة ١٣٨٩م وقعت معركة كوسوفو، وهي من المعارك التي صنعت الذاكرة أكثر مما صنعت الخريطة. التقى الجيشان في سهلٍ قرب بريشتينا، وقُتل السلطان مراد الأول في المعركة — على يد صربي كما تروي المصادر — وقُتل في المقابل الأمير الصربي لازار. وانتهت المعركة بانتصار عثماني، لكن انتصارًا فقد فيه السلطان حياته. وصار يوم كوسوفو في الوجدان الصربي رمزًا للفداء، وفي الوجدان العثماني رمزًا لتضحية السلطان بنفسه في سبيل الفتح، وصار في كل وجدانٍ ذكرى تُروى للأجيال بما يخدم حاضرها لا بما جرى فقط.\u003c/p\u003e\u003cp class=\"ap\"\u003eوخلف مرادَ ابنُه بايزيد الأول، ولُقّب بـ«الصاعقة» لسرعة حركته. وكان رجلًا مختلفًا عن أبيه: أقلّ صبرًا، وأكثر ميلًا إلى الحسم العسكري، وأسرع في التوسع. فمحا إمارات الأناضول واحدةً بعد أخرى، وحاصر القسطنطينية سنوات، وبنى على البسفور قلعةً تُسمى «حصار أناضولي». ثم قاد حملةً نحو الدانوب لضرب المجر، فلما سمع أن جيشًا صليبيًّا كبيرًا قادم لنجدة المدينة، عاد مسرعًا وهزمه في نيقوبوليس سنة ١٣٩٦م هزيمةً ساحقة، وأسر عددًا من أمراء أوروبا. وكان ذلك أعلى نقطة وصعدت إليها الدولة حتى ذلك اليوم.\u003c/p\u003e\u003cp class=\"ap\"\u003eلكن الطموح الزائد يجرّ صاحبه إلى مخاطر لم يحسبها. فقد انشغل بايزيد بالبلقان والدانوب عن الشرق، حيث كان تيمورلنك يبني إمبراطوريةً من الصين إلى العراق. ولما اختلفا على إمارات الأناضول الشرقية، لم يكن أمامهما إلا الحرب. والتقى الجيشان قرب أنقرة في صيف سنة ١٤٠٢م، في يومٍ حارّ بلغ فيه العطش بالجنود مبلغًا عظيمًا. وكانت خيانة الأمراء التركمان في جيش بايزيد — الذين ساءهم ضمّه لإماراتهم — هي التي قلبت المعركة. فانهزم الجيش العثماني، وأُسر بايزيد نفسه، ومات في الأسر سنة ١٤٠٣م.\u003c/p\u003e\u003cp class=\"ap\"\u003eكانت الكارثة شاملة. فقد تفرّق الجيش، وانهارت الدولة في الأناضول، وعادت الإمارات التي محاها بايزيد إلى الظهور في أشهر، واستقلّ كل ابنٍ من أبناء بايزيد بجزءٍ من البلاد. وفي الغرب ثار الأمراء البلقانيون، وطالبوا بعودة ما أخذ منهم. وبلغ الأمر أن القسطنطينية نفسها كادت تستعيد أرضًا. وظنّ الجميع في أوروبا والشرق أن الدولة العثمانية قد انتهت، وأنها كانت ومضةً عابرة في تاريخ الأناضول، كما انتهت قبلها إمارات كثيرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eلكن الدولة لم تنتهِ، وهذا هو أهم درس في تاريخها كله. فقد بقيت لها ثلاث مؤسسات لم يمسّها الهزيمة: القضاء، والأوقاف، وشبكة العلاقات داخل الروملي. وبقيت لها شرعية «الغزو» التي تجعل أي أميرٍ يحمل رايتها يجد رجالًا يلتفون حوله. وفي السنوات العشر التالية تنازع أبناء بايزيد — سليمان وموسى وعيسى ومحمد — في حربٍ أهلية طويلة، حتى انتصر محمد الأول سنة ١٤١٣م وأعاد توحيد البلاد في دولةٍ واحدة. وكانت تلك الحرب الأهلية أثقل درسٍ تعلّمته الدولة: أن الخطر الأكبر يأتي من الداخل لا من الخارج.\u003c/p\u003e\u003cp class=\"ap\"\u003eوبعد محمد الأول جاء مراد الثاني، فسار على سياسةٍ من نوعٍ جديد: يُصلح ولا يتوسع كثيرًا، ويعقد الصلح مع خصومه بدلًا من حربهم جميعًا. فواجه ثورةً اجتماعية خطيرة قادها شيخٌ صوفي يُسمى بدر الدين محمود في الأناضول سنة ١٤١٦م، وكانت ثورةً ذات مطالب اجتماعية ودينية ضد ضريبةٍ وضد تمركز السلطة، فأخمدها بجيشه ثم بمحاكمةٍ علنية. ثم عاد إلى البلقان فانتصر في فارنا سنة ١٤٤٤م، وفي كوسوفو الثانية سنة ١٤٤٨م. وبهذين الانتصارين أُعيد تأكيد التبعية البلقانية، وصار الطريق إلى القسطنطينية مفتوحًا من ثلاث جهات.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالمفارقة أن مراد الثاني هو من مهّد للفتح الكبير، لكن التاريخ يذكره أقل من ابنه. فقد ترك دولةً مستقرّة، وجيشًا حديثًا، وحدودًا آمنة، وخزانةً مليئة، وابنًا شابًّا شديد الطموح اسمه محمد. ولما مات سنة ١٤٥١م، كان كل ما يحتاجه الفاتح قد جُهّز من قبله: الأناضول موحّدة، والبلقان تابعة، والأسطول موجود، والمدفعية تُطوَّر في المسابك، والقسطنطينية وحيدة خلف أسوارها. وما بقي إلا أن يصل رجلٌ في الحادية والعشرين يقول: أنا أفتحها.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eلماذا البلقان قبل القسطنطينية؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت القسطنطينية في نظر كل فاتحٍ هدفًا نهائيًّا، لكنها كانت في نظر العقل العسكري فخًّا. أسوارها الثلاثية من أعظم ما بناه الإنسان، وميناؤها محميٌّ بسلسلة، وسكانها يعدّون بمئات الآلاف، وأي حصارٍ طويل يجلب أسطولًا صليبيًّا من الغرب. فمن يحاصرها قبل أن يملك محيطها يخسر جيشه بين سورٍ من الداخل وأسطولٍ من الخارج. وقد جرّب العثمانيون الحصار مرات، وتعلموا أن المدينة لا تُؤخذ بالجيش وحده بل بالحصار الاقتصادي أولًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eلذلك كانت البلقان هي الطريق. فمن يملك تراقيا يملك خبز المدينة، ومن يملك مقدونيا يملك طرقها البرية، ومن يملك بلغاريا يملك الدانوب. وحين يصبح للسلطان ولاةٌ في صوفيا وسالونيك ونيش، تصير القسطنطينية جزيرةً في أرضٍ عثمانية، لا مدينةً في قلب إمبراطورية. وهذه هي القاعدة التي بقيت في الفكر العسكري العثماني قرونًا: لا تُهاجم الحصن قبل أن تُحوّله إلى جيب.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eأنقرة ١٤٠٢م: درسٌ في الهشاشة\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم تكن الهزيمة في أنقرة نتيجة ضعفٍ في الجيش، بل نتيجة خللٍ في التركيب. فجيش بايزيد كان جيشًا مركّبًا من فرقٍ نظامية ومن قوات إماراتٍ ضمّها حديثًا، وهذه الأخيرة لم تكن تقاتل من أجل الدولة بل تحت الإكراه. فلما اشتد الضغط انقلبت على قلبها. وهذا درسٌ عسكري بسيط ومهلك: أن تُقاتل بقوةٍ لا تحبك أسوأ من أن تُقاتل بقوةٍ أقل تحبك.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالدرس الثاني أن الدولة كانت قد توسعت أسرع من قدرتها على الاستيعاب. فبين ١٣٨٩ و١٤٠٢ ضمّ بايزيد إمارات الأناضول كلها تقريبًا، ولم يمهله الوقت لبناء إدارةٍ فيها ولا لتوليد ولاءٍ لأهلها. والدرس الثالث أن السلطان نفسه كان مركز التوازن كله، فبأسره انهار البنيان دفعةً واحدة. ومن هذه الدروس الثلاثة ستتعلم الدولة أن تُبطئ التوسع، وأن تُدمج قبل أن تُضيف، وأن تُوزّع السلطة على مؤسسات لا على شخص.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالفترة الفاصلة وكيف نجت الدولة\u003c/h4\u003e\u003cp class=\"ap\"\u003eبين ١٤٠٢ و١٤١٣ حكمت الدولة أربع إمارات متنازعة، كل واحدة تحمل اسمًا واحدًا: عثماني. وكانت هذه السنوات أخطر من الهزيمة نفسها، لأنها كانت ستُنهي الدولة من الداخل لو طالت. وقد نجت لثلاثة أسباب: أن الروملي بقي إلى حدٍّ كبير في يد محمد الأول فحافظ على العمق الأوروبي، وأن القضاء والأوقاف استمرّا يعملان فلم تتوقف الحياة اليومية، وأن فكرة الدولة صارت أقوى من الأشخاص بعد أن ذاق الناس فوضى التقسيم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوهذا يفسر ظاهرةً غريبة في التاريخ العثماني: أن كل أزمة خلافة تُنتج دولةً أقوى من قبلها. فقد خرج محمد الأول من الحرب الأهلية بإصلاحاتٍ في الجيش والإدارة، وخرج مراد الثاني من ثورة بدر الدين بترتيباتٍ جديدة للعلاقة بين السلطان والصوفية، وسيخرج محمد الفاتح من أزمةٍ داخلية بقانونٍ يقتل فيه أخاه الأصغر «لنظام العالم». وكل مرة يدفع النظام ثمنًا دمويًّا، ثم يخرج أكثر تمركزًا.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأدرنة عاصمة\u003c/b\u003e\u003cspan\u003eتحوّل مركز الدولة إلى أوروبا، وصارت القسطنطينية جيبًا محاصرًا\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eكوسوفو ١٣٨٩م\u003c/b\u003e\u003cspan\u003eانتصار عثماني ومقتل السلطان مراد في الميدان\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eنيقوبوليس ١٣٩٦م\u003c/b\u003e\u003cspan\u003eهزيمة حملة صليبية أوروبية وأسر أمرائها\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأنقرة ١٤٠٢م\u003c/b\u003e\u003cspan\u003eهزيمة أمام تيمور وأسر بايزيد، وبداية الفترة الفاصلة\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالأثر على الدولة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e١٣٦٢–١٣٨٩م\u003c/td\u003e\u003ctd\u003eحكم مراد الأول\u003c/td\u003e\u003ctd\u003eتثبيت الحكم في تراقيا ومقدونيا\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٣٨٩م\u003c/td\u003e\u003ctd\u003eكوسوفو الأولى\u003c/td\u003e\u003ctd\u003eتبعية صربيا وبعض البلقان اسميًّا\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٤٠٢م\u003c/td\u003e\u003ctd\u003eأنقرة\u003c/td\u003e\u003ctd\u003eانهيار مؤقت وتقسيم الدولة بين أبناء بايزيد\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٤١٣م\u003c/td\u003e\u003ctd\u003eتوحيد محمد الأول\u003c/td\u003e\u003ctd\u003eعودة الدولة موحّدة وأكثر حذرًا في التوسع\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٤٤٤–١٤٤٨م\u003c/td\u003e\u003ctd\u003eفارنا وكوسوفو الثانية\u003c/td\u003e\u003ctd\u003eتأكيد التبعية البلقانية وإضعاف المجر\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003e«إن الدولة التي تُبنى في ثلاثين سنة يمكن أن تسقط في ساعة، لكنها لا تسقط إن كان لها قاضٍ وديوان»\u003c/p\u003e\u003ccite\u003eخلاصة تُروى في مجالس المؤرخين العثمانيين عن درس أنقرة\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eتوسّعت الدولة في البلقان بخطةٍ ذكية: الالتفاف حول القسطنطينية بدل حصارها، وتجنيد التبعية بدل الاحتلال. وبلغت الذروة في نيقوبوليس ١٣٩٦م، ثم سقطت في أنقرة ١٤٠٢م أمام تيمور، فانفرط عقدها عشر سنوات. لكن القضاء والأوقاف والعمق الأوروبي أبقتها حية، فعادت موحّدة سنة ١٤١٣م وأقوى مما كانت.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"conquest-1453","n":"فتح القسطنطينية","ic":"🏰","part":"القسم الأول: القيام","h":"\u003carticle class=\"ch3\" id=\"conquest-1453\" data-toc=\"فتح القسطنطينية\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e١.٤\u003c/span\u003e\n          \u003ch3\u003e🏰 فتح القسطنطينية\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي فجر التاسع والعشرين من مايو ١٤٥٣م سقطت مدينةٌ صمدت أحد عشر قرنًا. لم يكن سقوطها معركةً عابرة، بل نهاية عصرٍ وبداية آخر، وعلامةً على تحوّل الإمارة الحدودية إلى إمبراطورية.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان محمد الثاني شابًّا غريبًا على عرشه في أول الأمر. تولّى سنة ١٤٤٤م وهو في الثانية عشرة بعد تنازل أبيه، ثم اضطر للعودة إلى مَنصّة التعليم بعد ثورة الإنكشارية، ثم عاد إلى العرش سنة ١٤٥١م بعد موت مراد الثاني. وكان قد تربّى على يد علماء ومربّين، وأتقن العربية والفارسية واليونانية، وقرأ في الجغرافيا والفلك والتاريخ، وكان يعرف ما كتبه المؤرخون عن فتوح الإسكندر وخلفاء بغداد. ولما جلس على العرش كانت أول جملةٍ قالها — كما تروي المصادر — أنّه سيُتمّ ما بدأه أسلافه في هذه المدينة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوبدأ الإعداد قبل الحرب بسنوات. ففي ١٤٥٢م بنى على البسفور قلعة «روملي حصار» في أربعة أشهر، بثلاثة أبراجٍ كبيرة ومدافع موجهة إلى المضيق، فأصبح مرور السفن من البحر الأسود إلى المدينة بيده. ولما احتجّ الإمبراطور البيزنطي على البناء، أجابه السلطان بأن له في هذه الأرض ما لأجداده، وأن الضعيف لا يُطالب بحقٍّ لا يقدر على حمايته. وفي الوقت نفسه كان يعقد الصلح مع البندقية والمجر وصربيا، ويشتري الهدوء على كل جبهةٍ ليصرف كل قوته إلى جبهةٍ واحدة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما السلاح الذي غيّر المعادلة فهو المدفع. فقد استعان بمهندسٍ صانعٍ للمدافع جاء من المجر، فسبك له مدفعًا هائلًا من النحاس، يزن مئات الأطنان، ويقذف كراتٍ حجرية تزن قنطارًا. ولم يكن هذا السلاح دقيقًا ولا سريعًا — كان يحتاج ساعاتٍ للتبريد بين الطلقة والأخرى — لكنه كان قادرًا على هدم أسوارٍ ظلّت صامدة أمام كل وسائل الحصار القديمة. وقد كان العثمانيون أول من فهم أن عصر الأسوار العالية انتهى، وأن عصر البارود بدأ.\u003c/p\u003e\u003cp class=\"ap\"\u003eوبدأ الحصار في السادس من أبريل ١٤٥٣م. كان الجيش العثماني نحو ثمانين ألفًا، وفي المدينة نحو سبعة آلاف مقاتل بينهم جنويون بقيادة جوستنياني، وسلسلةٌ حديدية تغلق القرن الذهبي. فما كان من السلطان إلا أن أمر بنقل سفنٍ صغيرة عبر البر على ألواحٍ مدهونة، من البسفور إلى داخل القرن، فاستيقظ البيزنطيون على أسطولٍ عثماني في مياههم المحمية. وكانت هذه الحركة من أشهر أعمال الحرب في التاريخ: لم تكن خدعةً فقط، بل إعلانًا بأن الحصار لن يُفكّ.\u003c/p\u003e\u003cp class=\"ap\"\u003eواستمر القصف سبعة أسابيع. سقطت أجزاء من السور، ورُدمت الفجوات بالحجارة والخشب في الليل، وأُعيد بناؤها في النهار. وتكررت الهجمات، وكلها ترتدّ. ثم في ليلة السابع والعشرين أُعلن الهجوم العام، فصعدت الموجات الأولى وارتدّت، وسقط جوستنياني جريحًا فانسحب، وترك ثغرةً في الدفاع. وفي الفجر اقتحمت فرقةٌ من الإنكشارية السور عند موضعٍ يُسمى «الباب الرومي»، ورفع أول جندي رايةً على البرج. ولما رأى الإمبراطور قسطنطين الحادي عشر أن المدينة سقطت، خلع شارات الإمبراطورية وقاتل في الصفوف الأولى حتى قُتل، ولم يُعرف له قبر.\u003c/p\u003e\u003cp class=\"ap\"\u003eودخل محمد الثاني المدينة بعد ثلاثة أيام من الغنيمة، ودخلها ماشيًا لا راكبًا، ودخل آيا صوفيا فسجد فيها شكرًا، وأمر بتحويلها إلى جامع. وكان قد منع القتل العام في الأيام الأولى، لكن الغنيمة كانت قد وقعت، فبيعت الأسرى في الأسواق، وفُقدت مكتباتٌ وأيقوناتٌ وذخائر لا تُقدَّر. والمؤرخ المنصف يقف أمام هذا المشهد بحسٍّ مزدوج: نصرٌ عظيم لأمةٍ خرجت من إمارةٍ صغيرة، وكارثةٌ إنسانية لمدينةٍ سكانها لم يختاروا الحرب. والاثنان حقيقيان، ولا يلغي أحدهما الآخر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان للفتح معنىً يتجاوز المدينة. فقد تحقق فيه حديثٌ مشهور يُروى عن النبي ﷺ في فضل فتح القسطنطينية، فصار في الوجدان الإسلامي علامةً على صدق الوعد، وتناقله الناس في الأمصار قرونًا. وأما محمد الثاني فأخذ لنفسه لقب «قيصر الروم»، أي أنه لم يكتفِ بأن يكون سلطانًا على المسلمين بل أراد أن يكون وارثًا لروما أيضًا. وهذا اللقب هو أهم ما فعله سياسيًّا: أنه أعلن أن الدولة ليست غازيةً على بيزنطة، بل خليفةٌ لها في إدارة تراثها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوشرع بعد الفتح في إعادة بناء المدينة، وهي كانت أشبه بالخرابة: سكانها تفرقوا، وأسواقها خربت، وأحياءٌ كاملة صارت حقولًا. فأمر بنقل السكان إليها من الأناضول والبلقان، وأعفى المهاجرين من الضرائب سنوات، وبنى السوق الكبير «البازار»، وأسّس مجمّع «الفاتح» بجامعه ومدرسته ومكتبته ومطبخه الخيري، وأنشأ نظامًا لإدارة المدينة يجمع بين الوالي والقاضي وشيخٍ للأسواق. وفي عشرين سنة عادت المدينة مدينةً عامرة، لكنها مدينةٌ جديدة: عثمانيةً في لغتها وإدارتها، بيزنطيةً في مخططها وشوارعها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما أوروبا فقد استقبلت الخبر بصدمةٍ لم تُنسَ. أُقيمت الصلوات والدعوات، ودُقّت الأجراس، وكُتبت الرسائل بين البلاطات، ودُعي إلى حملةٍ صليبية جديدة لم تقم. وفي الوقت نفسه بدأ نزوح علماء اليونان إلى إيطاليا، حاملين مخطوطاتٍ لم يكن الغرب يعرفها، فاتسعت بذلك حركةٌ فكرية كانت قد بدأت قبل الفتح. وهكذا أنتج الفتح نتيجتين متناقضتين: خوفًا أوروبيًّا من قوةٍ جديدة، ونهضةً أوروبيةً استفادت من تراث المدينة المسلوبة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالمؤرخ اليوم يقف أمام سؤالٍ صعب: هل كان ١٤٥٣م قطعًا أم اتصالًا؟ الذين قالوا بالقطع نظروا إلى الرمز: سقوط آخر بقية من الإمبراطورية الرومانية، وتحوّل البحر المتوسط إلى بحيرةٍ عثمانية. والذين قالوا بالاتصال نظروا إلى البنية: أن المدينة بقيت مدينةً، وأن الكنيسة الأرثوذكسية بقيت قائمةً برجالها، وأن البطريرك عاد فجلس في كرسيه برضا السلطان، وأن التجارة لم تتوقف. والحقيقة أن الأمرين معًا: انقطع رمزٌ سياسي، واتصلت حياةٌ يومية، وهذه هي طبيعة التحولات الكبرى في التاريخ.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eلماذا نجح الحصار هذه المرة؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eحاصر العثمانيون المدينة قبل ذلك مرات: في عهد بايزيد، وفي عهد مراد الثاني، وفي عهد محمد نفسه قبل الفتح. وكلها فشلت للسبب نفسه: كان الحصار برًّا فقط، فيصل المدد من البحر، وتبقى الأسوار تُرمَّم. أما في ١٤٥٣م فقد تغيّر ثلاثة أشياء معًا: صار للسلطان أسطولٌ يحاصر من البحر ولو لم يكن قويًّا، وصار لديه مدفعٌ يهدم ما لم يكن يُهدم، وصار محيط المدينة كله في يده فلا يأتيها مدد من البر. وهذه هي القاعدة: الحصون لا تسقط بالشجاعة وحدها، بل بتغيير المعادلة اللوجستية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالشيء الرابع أن السلطان قَبِل كلفةً عالية. فالمدفع كان يستهلك موادّ نادرة، والحصار سبعة أسابيع، والجيش ثمانون ألفًا يأكل كل يوم. وكان في الإمكان أن يفكّ الحصار بعد أسبوعين ويقول: لم يُقدَّر. لكنه لم يفعل، وهذا الفارق بين القائد الذي يجرّب والفاتح الذي يُصرّ.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eمن الغزو إلى الإمبراطورية\u003c/h4\u003e\u003cp class=\"ap\"\u003eبعد ١٤٥٣م تغيّر كل شيء في بنية الدولة. فالإمارة الحدودية لم تكن تحتاج إلى قانونٍ مدني ولا إلى بيروقراطية ولا إلى سياسةٍ تجاه رعايا من أديانٍ أخرى، أما الإمبراطورية فتحتاج إلى كل ذلك. فأنشأ محمد الثاني «قانون نامه» يحدد مراتب الدولة وواجبات كل مرتبة، وأعاد تنظيم الديوان، وفصل بين الشؤون العسكرية والمالية والقضائية، ووسّع نظام الدوشرمة، وأدخل المدفعية في التنظيم الدائم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأهم ما فعله أنه فصل الدولة عن القبيلة. فحتى ذلك الحين كانت العائلات التركمانية القديمة ترى في الدولة ملكًا مشتركًا لها، وكان لها نفوذٌ في الجيش والديوان. أما الفاتح فبنى نخبةً جديدة من «قابي قولي» أي عبيد السلطان، لا نسب لهم ولا قبيلة، ولاؤهم له وحده. وهذه النخبة هي التي ستحكم الدولة أربعة قرون، وهي التي ستصنع الانقسام الكبير بين «الرجل الدولة» و«الرجل القبيلة» في التاريخ العثماني.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالقسطنطينية الجديدة\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يكتفِ السلطان بالفتح، بل أراد أن يجعل المدينة عاصمة العالم الإسلامي. فبنى فيها المساجد والمدارس والبيمارستانات والأسواق والخانات والحمّامات، وربطها بطرقٍ برية وبحرية، وأمر كبار الدولة ببناء مجمّعاتهم فيها، فقامت أحياءٌ كاملة على أسماء الوزراء والقضاة. وفي أقل من نصف قرن صارت المدينة أكبر مدن أوروبا سكانًا، ومركزًا للتجارة بين الشرق والغرب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأنشأ فيها نظامًا للتعايش لم يكن مألوفًا في أوروبا وقتها: أن تُدار كل طائفةٍ دينية بشؤونها الخاصة في الزواج والميراث والتعليم، وتدفع جزية، وتحتفظ بكنائسها. وهذا النظام — المعروف لاحقًا بنظام الملل — لم يكن تسامحًا بالمفهوم الحديث، بل ترتيبًا عمليًّا لإدارة تنوعٍ لا يمكن إلغاؤه. لكنه في زمانه كان أكثر تقدّمًا من كل ما عرفه الغرب في التعامل مع الأقليات.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eروملي حصار ١٤٥٢م\u003c/b\u003e\u003cspan\u003eقلعة على البسفور في أربعة أشهر، قطعت المدد البحري عن المدينة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمدفع الكبير\u003c/b\u003e\u003cspan\u003eسبكه مهندس من المجر، وأسقط أسوارًا صمدت أحد عشر قرنًا\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003e٢٩ مايو ١٤٥٣م\u003c/b\u003e\u003cspan\u003eسقوط المدينة بعد ثلاثة وخمسين يومًا، ومقتل آخر إمبراطور بيزنطي\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eقيصر الروم\u003c/b\u003e\u003cspan\u003eلقب أخذه الفاتح ليعلن وراثته لروما لا غزوها فقط\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمرحلة\u003c/th\u003e\u003cth\u003eالتاريخ\u003c/th\u003e\u003cth\u003eما جرى\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالإعداد\u003c/td\u003e\u003ctd\u003e١٤٥١–١٤٥٢م\u003c/td\u003e\u003ctd\u003eبناء القلعة، سبك المدافع، عقد الصلح مع البندقية والمجر\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالحصار\u003c/td\u003e\u003ctd\u003e٦ أبريل ١٤٥٣م\u003c/td\u003e\u003ctd\u003eقصف يومي وسلسلة في القرن الذهبي ونقل السفن عبر البر\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالهجوم العام\u003c/td\u003e\u003ctd\u003e٢٩ مايو ١٤٥٣م\u003c/td\u003e\u003ctd\u003eاقتحام السور عند الباب الرومي ورفع الراية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eما بعد الفتح\u003c/td\u003e\u003ctd\u003e١٤٥٣–١٤٧٠م\u003c/td\u003e\u003ctd\u003eإعادة تعمير المدينة ونقل السكان وتأسيس المجمّعات\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003e«لتُفتحنّ القسطنطينية، فلنعم الأمير أميرها ولنعم الجيش ذلك الجيش»\u003c/p\u003e\u003ccite\u003eمن الحديث المشهور في فضل فتح القسطنطينية، رواه أحمد في المسند\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eبعد ثلاثة وخمسين يومًا من القصف والحصار، سقطت القسطنطينية في ٢٩ مايو ١٤٥٣م، وتحقق فيها حديثٌ مشهور صار علامةً في الوجدان الإسلامي. ولم يكن الفتح نهايةً بل بداية: تحوّلت الإمارة إلى إمبراطورية، ونشأ قانونٌ وديوانٌ ونخبةٌ جديدة، وعادت المدينة عاصمةً أكبر مما كانت.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-2","n":"القسم الثاني: النظام","ic":"","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-2\" style=\"--c:#2F4F4F\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e⚖️\u003c/div\u003e\n      \u003ch2\u003eالقسم الثاني: النظام\u003c/h2\u003e\n      \u003cp\u003eكيف حكمت دولةٌ واحدة ثلاث قارات ستة قرون؟ الجواب ليس في السيف وحده، بل في نظامٍ دقيق: سلطانٌ وديوان، وجيشٌ من نوعٍ جديد، وقضاءٌ يطبّق فقهًا واحدًا على شعوبٍ مختلفة، ووقفٌ يقدّم ما لا تقدّمه الدولة. هذا القسم يفكّك آلة الحكم العثمانية.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#sultan-diwan\"\u003eالسلطان والديوان\u003c/a\u003e\u003ca href=\"#army-timar\"\u003eالإنكشارية والتيمار\u003c/a\u003e\u003ca href=\"#justice-madhhab\"\u003eالقضاء والمذاهب\u003c/a\u003e\u003ca href=\"#millet-waqf\"\u003eالملل والأوقاف والحرف\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"sultan-diwan","n":"السلطان والديوان","ic":"🏛️","part":"القسم الثاني: النظام","h":"\u003carticle class=\"ch3\" id=\"sultan-diwan\" data-toc=\"السلطان والديوان\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٢.١\u003c/span\u003e\n          \u003ch3\u003e🏛️ السلطان والديوان\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eك\u003c/span\u003eان السلطان العثماني في الوقت نفسه قائدًا عسكريًّا ورأسًا لإدارةٍ معقّدة. وهذا الفصل يقرأ القصر والديوان والوزراء، وكيف وُزّعت السلطة بين شخصٍ يحكم ومؤسساتٍ تُدير.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eيجمع النظام العثماني بين طرفين لا يجتمعان عادةً: سلطانٌ مطلقُ السلطة نظريًّا، ومؤسساتٌ محدّدة الصلاحيات عمليًّا. فالسلطان هو صاحب السيادة، والقانون يُنسب إليه، والجيش يقسم له، والخطبة تُقال باسمه، والعملة تُضرب بعلامته. لكنه في الممارسة لا يحكم وحده: هناك ديوانٌ يقرّر، ووزراءُ ينفّذون، وقضاةٌ يحكمون باسمه لا بأمره، وعلماءُ يفتون بما يقيّد إرادته. وهذا التوازن الغريب هو ما أعطى الدولة طول عمرها، وهو أيضًا ما جعل إصلاحها صعبًا حين احتاجت الإصلاح.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان القصر هو الجهاز الأول للدولة. بُني «طوب قابي» على رأسٍ من الأرض يطلّ على البسفور والقرن الذهبي، ولم يكن قصرًا واحدًا بل مدينةً صغيرة مقسّمة إلى ثلاثة أفنية: الأول مفتوح للعامة وللعرائض، والثاني للديوان والخزينة والجيش، والثالث خاصٌّ بالسلطان وأهله ومدارس القصر. وهذا التقسيم نفسه كان إعلانًا سياسيًّا: أن السلطان ليس محجوبًا عن رعاياه، وأن بينه وبينهم أبوابًا لا تُغلق، لكنها تُحدّد المسافة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما الديوان فهو قلب الحكم. كان يجتمع في القصر أربعة أيام في الأسبوع، ويضمّ الصدر الأعظم، والوزراء، وقاضي العسكر، والدفتردار المسؤول عن المال، والنيشانجي المسؤول عن التوقيع والطغراء. وكانت تُقرأ فيه العرائض، وتُبحث الشكاوى، وتُعتمد التعيينات، وتُقرّر الحملات. ثم صار السلطان يجلس خلف نافذةٍ مُشبّكة تُطلّ على القاعة، فيسمع ما يجري دون أن يُرى، حتى إذا ما أراد التدخل دخل من بابٍ جانبي. وتلك النافذة صورةٌ كاملة لفكرة الحكم العثماني: حضورٌ دائم وغيابٌ ظاهر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت البيروقراطية هي الذاكرة الحيّة للدولة. فكل قرارٍ يُسجَّل في «دفتر المهمّات»، وكل أرضٍ تُحصى في «دفتر التحرير»، وكل مبلغٍ يدخل الخزينة يُقيَّد في دفاترٍ مزدوجة. وقد وصلت إلينا آلاف المجلدات من هذه الدفاتر، وهي اليوم من أغنى مصادر تاريخ المنطقة: فيها أسماء القرى وعدد بيوتها ومحاصيلها وضرائبها، وفيها شكاوى الفلاحين من جور الجابي، وفيها أوامر بمنع تعذيب الأسير أو بإعادة مالٍ إلى صاحبه. وأمةٌ تحفظ هذا القدر من التفاصيل عن نفسها هي أمةٌ تبني دولةً لا إمارة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت الطبقة الحاكمة تُسمّى «أهل الحلّ والعقد» أو «الخدمة العليّة»، وكانت تُقسم إلى أربع مهن: السيف (العسكر)، والقلم (الكتّاب)، والعلم (العلماء)، والمال (المحاسبون). ولم يكن الانتقال بينها سهلًا، لكنه لم يكن مستحيلًا. وكان الانتماء إليها يعني الإعفاء من الضرائب والاحتكام إلى قانونٍ خاصّ، وهذا ما جعلها طبقةً مغلقة تدريجيًّا رغم أن أصلها كان مفتوحًا: فالدوشرمة تجلب أبناء الفلاحين المسيحيين إلى قمّتها، لكن أبناء هذه القمّة يحاولون بعد قرنين أن يجعلوها وراثية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان للصدر الأعظم سلطةٌ هائلة، لأنه يجمع بين رئاسة الوزراء وقيادة الجيش والإشراف على المال. وكان السلطان يفوّضه أحيانًا تفويضًا كاملًا، حتى قيل إن الدولة تُدار من «باب باشا» لا من القصر. وفي القرن السابع عشر، حين ضعفت شخصية السلاطين وصارت الخلافة تُورَّث لأطفال، انتقل مركز الثقل فعليًّا إلى بيت الصدر الأعظم، وظهرت أسرٌ حاكمة فعليًّا مثل آل كوبريلي الذين أنقذوا الدولة من انهيارٍ في منتصف ذلك القرن. وهكذا تحوّل النظام من ملكيةٍ شخصية إلى ملكيةٍ يديرها ديوان، بلا أن يُعلن أحد هذا التحول.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما شرعية السلطان فكانت مركّبة من ثلاثة عناصر. الأول الغزو: هو قائد الجهاد على ثغر الإسلام، ولهذا كانت مراسم التتويج تُقام في جامع أبي أيوب الأنصاري بالقسطنطينية، حيث يتقلّد السيف بيد شيخٍ صوفي، لا بتاجٍ ولا بمسحةٍ دينية. والثاني العدل: هو الذي يحمي الرعية من الظلم، وتُقرأ في مجلسه شكاوى الفلاحين ضد الوزراء أنفسهم. والثالث الخلافة: وقد صارت جزءًا من اللقب بعد فتح مصر سنة ١٥١٧م، وإن كان أثرها الفعلي أقلّ بكثير من أثر السيف والعدل في الوجدان الشعبي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت هناك حدودٌ حقيقية لسلطة السلطان، لا في النصوص بل في القوى. فالإنكشارية تستطيع أن تخلع السلطان، وقد فعلت ذلك مرات، وأن تُخرج جثث الوزراء إلى باب القصر. والعلماء يستطيعون أن يفتوا ببطلان قرارٍ فيُبطَل، أو أن يرفضوا إفتاءً فيتوقّف. والقانون نفسه يُقيّده في مسائل الميراث والوقف والعبادات، فلا يستطيع أن يغيّرها بقرار. وكان السلطان يعرف ذلك، فكان يتصرّف داخل مساحةٍ محسوبة، ويستعمل في المسائل الخلافية أداة «القانون» بدل «الشريعة» ليتجنّب مواجهة العلماء.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما نظرية الحكم التي كانت تُدرَّس في المدارس وتُروى في المجالس فهي «دائرة العدل»، وهي فكرة قديمة ورثها العثمانيون عن الفرس والسلاجقة: لا ملك إلا بالرجال، ولا رجال إلا بالمال، ولا مال إلا بالعمارة، ولا عمارة إلا بالعدل، ولا عدل إلا بقيام السلطان. أي أن الرعية تُعمّر الأرض فتُخرج المال، والمال يُنفق على الجند، والجند يحمي الرعية من العدو، والعدل هو ما يضمن استمرار هذه الدورة. ومن هنا كان الظلم في هذا الفكر ليس خطيئةً أخلاقية فقط، بل خطأً اقتصاديًّا يُفقر الخزينة على المدى الطويل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوإذا قارنّا هذا النظام بغيره، نجد أنه أكثر مركزيةً من النموذج العباسي، وأقلّ عسكرةً من نموذج المماليك. فالمماليك كانوا دولة جيشٍ يحكم مدنيين، والعثمانيون بنوا دولةً فيها بيروقراطية مدنية كبيرة وقضاءٌ مستقلٌّ نسبيًّا ووقفٌ يموّل خدماتٍ لا تموّلها الدولة. وهذا التنوّع في مراكز القوة هو ما جعل الدولة تتحمّل هزائم عسكرية كثيرة دون أن تنهار، لأن انهيار جيشٍ لا يعني انهيار نظام.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eدائرة العدل: نظرية الحكم\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم تكن «دائرة العدل» مجرّد كلامٍ في كتب السياسة، بل كانت تُترجم إلى مؤسسات. فمنها جاء مبدأ أن السلطان مسؤول عن أسعار السوق، وأنه يُعاقب المحتكر، وأنه يُلزم الجابي بردّ ما أخذه بغير حق. ومنها جاء مبدأ أن الأرض ملكٌ للدولة لا للأفراد، وأن الفلاح حقّه في الزراعة مضمون ما دام يعمل، فلا يُطرد منها إلا بسببٍ يُعرض على القاضي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت هذه الدائرة تعمل ما دامت حلقاتها سليمة. فإذا اختلّت حلقةٌ — أن يضعف الجند فينهبوا بدل أن يحموا، أو أن يظلم الولاة فيُفقرون الفلاح، أو أن تنقص الخزانة فيُقلَّص الجيش — دارت الدائرة إلى الأسوأ: قلّة المال، فقلّة الجند، فانعدام الأمن، فخراب العمارة. وهذا بالضبط ما سيحدث في القرن السابع عشر، وسيسمّيه المؤرخون العثمانيون «الانحلال»، وسيفسّره بعضهم بأن الدائرة اختلّت من أعلاها.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالقصر كجهاز دولة\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يكن القصر مكان ترفٍ فحسب، بل مدرسة إدارة. ففي «الإندرون»، وهو القسم الداخلي من القصر، كان يُعلَّم الأولاد المختارون اللغة العربية والفارسية والخط والحساب والفروسية والقرآن، ثم يتدرّجون في مراتب خدمة السلطان حتى يصيروا وزراء وقادة. وكان هذا التعليم مجانيًّا بالكامل، لكنه كان يعني انقطاع الصبي عن أسرته ودخوله في ولاءٍ جديد للسلطان وحده.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت النساء في القصر جزءًا من هذا الجهاز أيضًا، لا كما تُصوّره الحكايات. فوالدة السلطان كانت تُسمّى «الوالدة السلطان» وكانت ذات نفوذٍ سياسي حقيقي، تُخاطبها الوزراء، وتُوقف الأوقاف، وتتدخّل في التعيينات. وقد حكمت بعض النساء فعليًّا في القرن السابع عشر في فترةٍ تُعرف بـ«سلطنة النساء»، وهي فترة يختلف المؤرخون في تقييمها بين من يراها انحرافًا ومن يراها نتيجةً طبيعية لضعف السلاطين لا سببًا له.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالسلطان بين الغازي والخليفة\u003c/h4\u003e\u003cp class=\"ap\"\u003eظلّ لقب «الغازي» هو اللقب الأكثر حضورًا في المراسم والحروب، لأن الدولة قامت عليه. لكنه صار مع الزمن لقبًا رمزيًّا أكثر منه وصفًا عسكريًّا، إذ لم يكن سلطانٌ يقود جيشه بنفسه بعد القرن السابع عشر إلا نادرًا. وأما لقب «الخليفة» فلم يكن له في الإدارة أثرٌ يُذكر، ولم يكن يُستعمل في الوثائق الرسمية إلا قليلًا حتى القرن التاسع عشر، حين احتاجت الدولة إلى شرعيةٍ جديدة تواجه بها القوميات
