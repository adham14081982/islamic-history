ن تُنقص، وأن الدولة يمكن أن تُطالب بإعادة أرضٍ لا أن تفتحها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ترك ذلك أثرًا في الفكر السياسي العثماني. فبدأت تظهر كتب «النصيحة» التي يكتبها وزراء وعلماء للسلطان، تحلّل أسباب الهزيمة وتقترح إصلاحات. وهذه الكتابات هي أول وعيٍ عثماني داخلي بأن هناك خللًا بنيويًّا، لا مجرّد تقصيرٍ من هذا الوزير أو ذاك. وقد كانت هذه الكتابات أول صوتٍ يقول إن العيب في النظام لا في الرجال، وإن التقليد وحده لم يبقَ كافيًا لحماية الدولة.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003e١٦٢٢م\u003c/b\u003e\u003cspan\u003eمقتل السلطان عثمان الثاني بيد الإنكشارية، أول كسرٍ لهيبة السلطان\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eكوبريلي ١٦٥٦م\u003c/b\u003e\u003cspan\u003eصدارةٌ بسلطةٍ كاملة أنقذت الدولة من الانهيار\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eفيينا ١٦٨٣م\u003c/b\u003e\u003cspan\u003eهزيمة الحملة الكبرى، وبداية الحرب الطويلة مع العصبة المقدسة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eكارلوفجة ١٦٩٩م\u003c/b\u003e\u003cspan\u003eأول معاهدة يُعترف فيها بالخسارة وفقدان المجر\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e١٦٠٠–١٦٥٠م\u003c/td\u003e\u003ctd\u003eثورات الجلالية\u003c/td\u003e\u003ctd\u003eهجرة الفلاحين وانخفاض الإنتاج\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٦٣٨م\u003c/td\u003e\u003ctd\u003eاستعادة بغداد\u003c/td\u003e\u003ctd\u003eآخر فتحٍ كبير في الشرق\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٦٤٥–١٦٦٩م\u003c/td\u003e\u003ctd\u003eحرب كريت\u003c/td\u003e\u003ctd\u003eاستنزاف مالي وفتحٌ بطيء\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٦٨٣م\u003c/td\u003e\u003ctd\u003eحصار فيينا\u003c/td\u003e\u003ctd\u003eهزيمة وفقدان المدفعية والخزينة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٦٩٩م\u003c/td\u003e\u003ctd\u003eكارلوفجة\u003c/td\u003e\u003ctd\u003eفقدان المجر وترانسلفانيا وثبات الحدود\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003e«الخلل في الرأس لا في الجسد، وفي التنظيم لا في الرجال»\u003c/p\u003e\u003ccite\u003eمن رسائل النصيحة العثمانية في مطلع القرن الثامن عشر\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eتوقّف الزمن العثماني في القرن السابع عشر: جيشٌ متضخّم يبتزّ الدولة، وفلاحون يهجرون الأرض، وثوراتٌ في الأناضول، وسلاطين يُعزلون. أنقذ كوبريلي الدولة مؤقتًا بالقوة، ثم جاءت فيينا ١٦٨٣م فكشفت فارق القوة، وكارلوفجة ١٦٩٩م فأعلنت أن الدولة لم تعد تفتح بل تدافع.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"reform-18c","n":"إصلاحات القرن الثامن عشر","ic":"🕯️","part":"القسم الرابع: التوقف والتراجع","h":"\u003carticle class=\"ch3\" id=\"reform-18c\" data-toc=\"إصلاحات القرن الثامن عشر\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٤.٢\u003c/span\u003e\n          \u003ch3\u003e🕯️ إصلاحات القرن الثامن عشر\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي القرن الثامن عشر فهم العثمانيون أنهم متأخرون، فحاولوا اللحاق: جيشٌ جديد، ومدارس هندسية، ومطابع، وسفارات في أوروبا. لكن كل إصلاح كان يُولد ثم يُقتل في مهده.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eبدأ القرن الثامن عشر بهزيمةٍ أخرى. ففي ١٧١٨م استعاد العثمانيون بلغراد بمعاهدة، لكن الحرب مع روسيا والنمسا عادت، وانتهت بمعاهدة بلغراد ١٧٣٩م التي خسروا فيها ما استعادوه. وكان الدرس المتكرر أن الدولة تستطيع أن تنتصر في معركةٍ ثم تخسر في معاهدة، لأن المفاوضات كانت تُدار بلا معرفةٍ بأحوال أوروبا ولا بلغاتها ولا بميزان القوى فيها. وكانت المفاوضات تُدار غالبًا بترجمةٍ من مترجمي الباب العالي، لا بخبرةٍ في القانون الدولي، فكانت الدولة تتنازل عن مواقع لم تكن تعرف قيمتها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوظهر أول إصلاحٍ مؤسسي حقيقي في عهد السلطان محمود الأول، ثم في عهد مصطفى الثالث، ثم في عهد عبد الحميد الأول. وكان الإصلاح يبدأ دائمًا من الجيش، لأنه المكان الذي تُقاس فيه الهزيمة. فاستُقدم خبراء فرنسيون ومسيحيون لتدريب المدفعية، وأُنشئت مدرسةٌ للهندسة البحرية، ثم مدرسةٌ للهندسة البرية، وبدأ تدريس الرياضيات والهندسة والمساحة في مدارس جديدة. وكانت هذه بدايةً مهمة لأنها أدخلت العلم الحديث إلى مؤسسة الدولة لا إلى بيوت الأفراد فقط.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي ١٧٧٤م وقعت الهزيمة الكبرى: معاهدة كوتشك قينارجة بعد حربٍ مع روسيا. وقد فقدت الدولة فيها القرم، أي شبه جزيرة القرم، وصار لها وضعٌ مستقل تحت نفوذ روسي، ثم ضمّتها روسيا سنة ١٧٨٣م بلا حرب تقريبًا. وكانت القرم أهمّ من مساحةٍ على الخريطة: كانت ساحة تجنيدٍ للفرسان، ومصدر حبوب، وقاعدة بحرية، وموضعًا لمسلمين يتحدثون التركية. وفقدانها يعني أن البحر الأسود صار بحيرةً روسية، وأن العثمانيين فقدوا عمقهم الشمالي كله.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت المعاهدة نفسها أخطر من خسارة الأرض. فقد مُنح القيصر حقّ «حماية» الرعايا الأرثوذكس في الدولة العثمانية، وهذا الحقّ صار بعد ذلك ذريعةً روسية للتدخل في الشؤون الداخلية في كل أزمة. وهكذا دخلت الدولة في نظامٍ دولي جديد لا تعرفه: نظامٌ تُبرَّر فيه الحرب بحماية أقليات، وتُدار فيه الأزمات عبر السفارات والقناصل، لا عبر الجيوش فقط. وأدركت النخبة بعد ذلك أن السياسة الخارجية صارت صناعةً لها أدواتها: سفارات دائمة، ومترجمون، ودراسةٌ لأحوال الخصوم، لا مجرّد جيشٍ يتحرك.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان السلطان سليم الثالث (١٧٨٩–١٨٠٧م) هو أكثر من حاول الإصلاح بجدية. فأنشأ «النظام الجديد»، وهو فيلقٌ عسكري على الطراز الأوروبي، بلباسٍ وأسلوب تدريبٍ حديث، وموّله من خزانةٍ خاصة، وأسّس مدارس وكتبًا مترجمة، وأرسل أول سفراء دائمين إلى العواصم الأوروبية. وكان يعرف أن المشكلة ليست في السلاح بل في النظام، فحاول بناء جيشٍ موازٍ حتى لا يصطدم بالإنكشارية مباشرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eلكن الإصلاح اصطدم بثلاث قوى في وقتٍ واحد: الإنكشارية التي رأت في الجيش الجديد تهديدًا لوجودها، والعلماء المحافظين الذين رأوا في التقليد الأوروبي خطرًا على الدين والهوية، وكبار الملاك والجباة الذين خافوا من نظامٍ ضريبي جديد. ولم يكن سليم قادرًا على كسب أي فريقٍ منها، فبقي إصلاحه معزولًا في العاصمة. وفي ١٨٠٧م انقلب عليه الجيش القديم بتحريضٍ من شيخ الإسلام، فعُزل ثم قُتل، وحُلّ النظام الجديد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي ١٧٩٨م جاءت صدمةٌ من نوعٍ آخر: حملة نابليون على مصر. فدخل الفرنسيون الإسكندرية والقاهرة بجيشٍ منظم وعلماء ومطبعة، وأعلنوا أنهم جاءوا لتحرير المصريين من المماليك لا لاحتلالهم. وكانت الصدمة أن دولةً أوروبية تستطيع أن تحتلّ ولايةً عثمانية في أسابيع، وأن تُدير فيها شؤونها بعلمائها ومهندسيها. وقد استطاع العثمانيون بالتحالف مع بريطانيا إخراج الفرنسيين بعد ثلاث سنوات، لكن الحدث ترك أثرًا لا يُمحى في وعي النخبة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوبعد سليم جاء محمود الثاني، وهو السلطان الذي قرّر أن يُنهي المشكلة من جذرها. فبدأ بإضعاف الممالك المحلية: قضى على المماليك في مصر بأمرٍ من محمد علي، وأخضع الأمراء المحليين في الأناضول والبلقان، وألغى نظام التيمار نهائيًّا. ثم في ١٨٢٦م ضرب الإنكشارية بالمدافع في ثكناتها وألغى سلاحها، وسُمّيت الحادثة «الخيرة» لأنها أزالت العقبة الكبرى أمام كل إصلاحٍ لاحق.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان ثمن الإصلاح باهظًا في الخارج. ففي ١٨٢١م انفجرت الثورة اليونانية، وبعد سنواتٍ من القتال والتدخل الأوروبي حصلت اليونان على استقلالها سنة ١٨٣٠م، وهي أول قوميةٍ مسيحية تنفصل عن الدولة. وفي السنة نفسها احتلت فرنسا الجزائر، فبدأت خسارة شمال أفريقيا. ثم انقلب محمد علي على السلطان ووصل بجيشه إلى الأناضول، فأنقذت الدولةَ معاهدةٌ مع روسيا ثم تدخلٌ أوروبي، وهذا في ذاته علامة على أن الدولة لم تعد تستطيع حماية نفسها بنفسها.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eلماذا فشلت إصلاحات سليم الثالث؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eفشلت لأنها كانت إصلاحًا بلا حاضنة اجتماعية. فسليم بنى جيشًا جديدًا في العاصمة، لكنه لم يبنِ له قاعدةً في الأقاليم، ولم يكسب الفلاحين ولا التجار ولا العلماء. وحين واجهته الإنكشارية، لم يجد في الشارع من يدافع عنه، لأن الشارع لم يكن يرى في الجيش الجديد فائدةً له.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفشلت أيضًا لأنها كانت إصلاحًا في الوسائل لا في المقابل. فالإصلاح العسكري يحتاج مالًا، والمال يحتاج نظامًا ضريبيًّا عادلًا، والنظام الضريبي يحتاج مواجهة الملتزمين. وسليم لم يستطع أن يمسّ الضريبة، فبقي جيشه يعيش على موارد هشة، وبقي كل إصلاحٍ رهينةً لمزاج الخزانة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eكوتشك قينارجة: كيف تُصنع تبعية؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eمعاهدة كوتشك قينارجة ١٧٧٤م هي أنموذجٌ مبكر لما سيُسمى لاحقًا «المسألة الشرقية». فقد أعطت روسيا حقّ التمثيل القنصلي في الولايات، وحقّ حماية الأرثوذكس، وحقّ المرور التجاري، وحقّ التدخل في شؤون القرم. وهذه الحقوق لا تبدو خطيرة في نصّها، لكنها في التطبيق صارت ذرائع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالدرس أن السيادة تُفقد بالتدريج لا بالاحتلال فقط. فمن يملك حقّ حماية طائفةٍ يملك ذريعةً للتدخل، ومن يملك ذريعةً يملك مطلبًا، ومن يملك مطلبًا يملك قرارًا. وهكذا تحوّلت الدولة العثمانية إلى دولةٍ تُدار من الخارج جزئيًّا قبل أن تُحتَلّ عسكريًّا بعد قرنٍ وأربعين سنة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eمحمود الثاني: إصلاحٌ بلا رحمة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان محمود الثاني أكثر السلاطين حسمًا في تاريخ الإصلاح العثماني. فقد أدرك أن الدولة لا تُصلح مع بقاء الإنكشارية، وأن أي إصلاحٍ سلمي سيُقتل كما قُتل من قبله. فبنى قوةً موالية، ثم انتظر اللحظة، ثم ضرب ضربةً واحدة لم تُبقِ شيئًا. ولم يكن ذلك عملًا ديمقراطيًّا بالطبع، لكنه كان الطريقة الوحيدة الممكنة في ظرفٍ لا توجد فيه مؤسسةٌ قادرة على حماية الإصلاح.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد دفع الثمن في الميدان الخارجي: خسارة اليونان والجزائر، وتدخل أوروبي في شؤونه، وخطر محمد علي. لكن ما فعله أنه فتح الباب لكل ما جاء بعده من تنظيمات وقوانين ومدارس وجرائد. وفي التاريخ لا يُقاس المصلح بنواياه فقط، بل بما فتحه لغيره من إمكانات. ومن هنا يُفهم لماذا صار هذا السلطان مكروهًا عند كثيرين في زمانه، ومُعتبَرًا عند كثيرين بعده: أنه دفع ثمنًا حاضرًا لمصلحةٍ آجلة.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eكوتشك قينارجة ١٧٧٤م\u003c/b\u003e\u003cspan\u003eفقدان القرم وحقّ روسيا في حماية الأرثوذكس\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالنظام الجديد\u003c/b\u003e\u003cspan\u003eفيلقٌ عسكري على الطراز الأوروبي أسّسه سليم الثالث ثم أُلغي\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003e١٧٩٨م\u003c/b\u003e\u003cspan\u003eحملة نابليون على مصر، أول صدمةٍ حضارية مباشرة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003e١٨٢٦م\u003c/b\u003e\u003cspan\u003eالحادثة الخيرة وإلغاء الإنكشارية، شرط كل إصلاحٍ لاحق\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالسلطان\u003c/th\u003e\u003cth\u003eالفترة\u003c/th\u003e\u003cth\u003eأهم ما فعل\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eأحمد الثالث\u003c/td\u003e\u003ctd\u003e١٧٠٣–١٧٣٠م\u003c/td\u003e\u003ctd\u003eمطبعة وترجمات وافتتاحٌ ثقافي هش\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eمصطفى الثالث\u003c/td\u003e\u003ctd\u003e١٧٥٧–١٧٧٤م\u003c/td\u003e\u003ctd\u003eمدارس هندسة ومدفعية وخبراء أوروبيون\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eعبد الحميد الأول\u003c/td\u003e\u003ctd\u003e١٧٧٤–١٧٨٩م\u003c/td\u003e\u003ctd\u003eإصلاحٌ بعد الهزيمة ومحاولات في المدفعية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eسليم الثالث\u003c/td\u003e\u003ctd\u003e١٧٨٩–١٨٠٧م\u003c/td\u003e\u003ctd\u003eالنظام الجديد وسفارات دائمة، ثم عُزل وقُتل\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eمحمود الثاني\u003c/td\u003e\u003ctd\u003e١٨٠٨–١٨٣٩م\u003c/td\u003e\u003ctd\u003eإلغاء الإنكشارية وبناء دولةٍ مركزية\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003e«ما أخذ بالقوة لا يُسترد إلا بالقوة، وما أُخذ بالعلم لا يُسترد إلا بالعلم»\u003c/p\u003e\u003ccite\u003eمن تقارير الدولة العثمانية إلى السلطان في مطلع القرن التاسع عشر\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eفهم العثمانيون في القرن الثامن عشر أنهم متأخرون، فبدأوا الإصلاح من الجيش: مدارس هندسة، وخبراء أوروبيون، وسفارات دائمة. لكن كوتشك قينارجة ١٧٧٤م فتحت باب التبعية، وفشل النظام الجديد ١٨٠٧م كشف أن الإصلاح بلا حاضنة اجتماعية يُقتل. ثم جاء محمود الثاني فأزال العقبة الكبرى، ودفع الثمن في اليونان والجزائر.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"tanzimat","n":"التنظيمات والإصلاحات","ic":"📜","part":"القسم الرابع: التوقف والتراجع","h":"\u003carticle class=\"ch3\" id=\"tanzimat\" data-toc=\"التنظيمات والإصلاحات\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٤.٣\u003c/span\u003e\n          \u003ch3\u003e📜 التنظيمات والإصلاحات\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eب\u003c/span\u003eين ١٨٣٩ و١٩٠٨م حاولت الدولة أن تُعيد تعريف نفسها: من إمبراطوريةٍ إسلامية إلى دولةٍ قانونية حديثة. وقد نجحت في كثير، وفشلت في الأهم: أن تُقنع الناس بها.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eبدأت التنظيمات بخطٍّ سلطاني قُرئ في حديقة «كلخانة» سنة ١٨٣٩م، وفيه تعهّد السلطان بأمورٍ لم تكن مألوفة: أمانٌ في النفس والمال والعرض، ومساواةٌ في الضرائب، وتجنيدٌ منظّم، ومحاكمةٌ علنية، وحمايةٌ لكل الرعايا بلا فرقٍ بين مسلمٍ ومسيحي. وكان هذا النصّ إعلانًا بأن الدولة ستُدار بقانونٍ لا بإرادةٍ شخصية. وقد قُرئ في العاصمة، ثم أُرسل إلى الولايات، وبدأت تطبيقاته في المحاكم والإدارة والضرائب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت التنظيمات استجابةً لثلاث ضغوط في وقتٍ واحد. الأول الضغط الخارجي: أن أوروبا صارت تتدخل لحماية المسيحيين، فاحتاجت الدولة أن تُثبت أنها تحميهم بنفسها لتُغلق باب التدخل. والثاني الضغط الداخلي: أن الولايات المسيحية في البلقان بدأت تُطالب بالاستقلال، فاحتاجت الدولة أن تُعطيهم حقوقًا داخل الدولة قبل أن يطلبوا دولةً خاصة. والثالث الضغط الإداري: أن الدولة لم تكن قادرة على جمع الضرائب ولا على تجنيد الجنود بكفاءة، فاحتاجت بيروقراطيةً حديثة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان أهم ما فعلته التنظيمات أنها أنشأت «المواطنة» كفكرة. فقبلها كان الناس يُعرَّفون بدينهم وطائفتهم، وبعدها صار لهم صفةٌ قانونية واحدة أمام الدولة: عثماني. وقد تُرجم هذا في قوانين: قانونٌ للأراضي، وقانونٌ للتجنيد، وقانونٌ للولايات، ومحاكم مختلطة، ومجالس إدارية فيها أعضاء من المسلمين وغير المسلمين. وكانت هذه خطواتٍ حقيقية في اتجاه دولة القانون، ولو كانت تطبيقاتها متعثرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت خسارةٌ كبرى في ١٨٥٣–١٨٥٦م: حرب القرم. فقد تحالفت الدولة مع بريطانيا وفرنسا ضد روسيا، وانتصرت في الميدان، لكنها خرجت من الحرب مثقلةً بالديون، وممنونةً لأوروبا، ومُلزَمةً بإصلاحاتٍ جديدة. وصدر في ١٨٥٦م «الخطّ الهمايوني» الذي وسّع حقوق غير المسلمين، وأدخلهم في الجيش، وألغى بعض القيود، وأعلن المساواة الكاملة أمام القانون. وكان ذلك شرطًا أوروبيًّا أكثر منه قرارًا داخليًّا، وهذا ما جعل له أثرًا معاكسًا في نفوس المسلمين.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي ١٨٧٦م صدر أول دستور عثماني، وأُعلنت «المشروطية الأولى»: مجلس نواب، ومجلس أعيان، وانتخابات، ومسؤولية الوزارة أمام المجلس. وكان هذا حدثًا مهمًّا في تاريخ المنطقة: أول برلمان في دولةٍ إسلامية. لكنه لم يعمر: فقد أُعلنت الحرب مع روسيا سنة ١٨٧٧م، وتذرّع السلطان عبد الحميد الثاني بالحرب فحلّ المجلس وعطّل الدستور، وبقي معطّلًا ثلاثين سنة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت تلك الثلاثون سنة عهدًا غريبًا: إصلاحٌ في الإدارة والتعليم والاتصالات، وقمعٌ في السياسة. فبُنيت السكك الحديدية، وأُدخل التلغراف، وأُنشئت مدارس حديثة، وطُبعت الكتب، ووُسّع التعليم العالي، وأُنشئت دار الفنون. وفي الوقت نفسه ضُيّقت حرية الصحافة، ونُفي المعارضون، وأُقيم نظام رقابةٍ صارم. وكانت النتيجة أن الدولة صارت أكثر حداثةً وأقل شرعية في الوقت نفسه، لأن الناس تعلّموا في مدارسها ثم مُنعوا من الكلام.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي ١٩٠٨م انفجر السخط: ثار ضباط «جمعية الاتحاد والترقي» في سالونيك، وأجبروا السلطان على إعادة الدستور. واحتفل الناس في المدن احتفالًا عارمًا، وخرجت الصحف، وتشكّلت الأحزاب، وانتُخب برلمان. وكانت لحظة أملٍ حقيقية. لكن الدولة كانت قد خسرت في تلك السنة نفسها البوسنة والهرسك (ضمّتها النمسا) وبلغاريا (أعلنت استقلالها) وكريت (ضمّتها اليونان)، فبدت الحرية وكأنها جاءت مع الانهيار.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي ١٩٠٩م وقعت محاولة انقلابٍ مضادة من المحافظين، فسقطت الحكومة، ثم عاد الاتحاديون بقوةٍ أكبر وأشدّ قسوة. وتحوّل الحكم تدريجيًّا إلى حكمٍ عسكري، ودخلت الدولة في سلسلة حروب: ليبيا مع إيطاليا ١٩١١م، ثم حروب البلقان ١٩١٢–١٩١٣م التي خسرت فيها تقريبًا كل أوروبا العثمانية. وملايين المسلمين من البلقان هاجروا إلى الأناضول في مأساةٍ إنسانية كبرى، غيّرت تركيبة البلاد السكانية وجعلت السياسة أكثر تشددًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالمؤرخ يقف أمام التنظيمات بموقفٍ مركّب. فقد كانت إصلاحًا حقيقيًّا في القانون والتعليم والإدارة، وأنتجت نخبةً مثقفة واعية، ومجلسًا نيابيًّا، وصحافة، ومدارس، وفكرًا دستوريًّا. لكنها فشلت في ثلاث: أنها كانت تُصنع من أعلى بلا مشاركةٍ شعبية، وأنها كانت تُموّل بقروضٍ أوروبية أوقعت الدولة في تبعيةٍ مالية، وأنها لم تستطع أن تُقنع المسلمين بأن المساواة مع المسيحيين ليست تنازلًا عن دينهم. وهذا الفشل الثالث هو الذي فتح الباب للقومية، ثم للانهيار.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالمواطنة: فكرةٌ سبقت زمانها\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان إعلان المساواة بين المسلمين وغير المسلمين في ١٨٣٩ و١٨٥٦م فكرةً جذرية في سياقها. فالدولة كانت إسلامية الشرعية، وقانونها يقوم على تمييزٍ في الجزية والخدمة العسكرية. وأن تُعلن أن الجميع سواسية أمام القانون يعني تغييرًا في أساس الشرعية نفسه، لا مجرّد إصلاحٍ إداري.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد قُبلت الفكرة عند المسيحيين بحذر، لأنهم خافوا أن تكون وسيلةً لتجنيدهم في الجيش وسحب امتيازاتهم، وقُبلت عند المسلمين برفضٍ لأنهم رأوا فيها مساسًا بمكانتهم. وهكذا لم تُكسب الفكرة أي فريقٍ بالكامل، وبقيت قانونًا في الكتب أكثر منها واقعًا في النفوس. وقد ظلّت كلمة «عثماني» في الوعي الشعبي صفةً إدارية لا هويةً جامعة، وهذا بالضبط ما ستعجز التنظيمات عن تغييره إلى آخر يوم.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالمشروطية: أول برلمان\u003c/h4\u003e\u003cp class=\"ap\"\u003eدستور ١٨٧٦م كان أهم إنجازٍ فكري في القرن التاسع عشر، لأنه أعلن أن السلطة ليست ملكًا للسلطان بل أمانة. وقد نُصّ فيه على مجلس نواب منتخب، ومجلس أعيان معيّن، واستقلال المحاكم، وحقوق أساسية. وقد استلهم واضعوه دستور بلجيكا، لكنهم أدخلوا عليه ما يُلائم الدولة: أن الشريعة مصدر من مصادر التشريع، وأن السلطان مسؤول أمام الله والمجلس معًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد عطّل عبد الحميد الدستور ثلاثين سنة، لكن الفكرة لم تمت. وحين عاد في ١٩٠٨م، عاد أقوى مما كان، لأن جيلًا كاملًا تربّى على فكرة الحرية في المدارس والصحف. وهذا يبيّن أن الأفكار لا تُقتل بالتضييق، بل تُؤجَّل فقط. وقد تعلّم جيل الاتحاد والترقي من هذا الدرس أن الدستور لا يُحفظ بالورق، بل بقوةٍ تحميه، فتحوّلوا لاحقًا إلى حماةٍ بالقوة لا بالحق.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالديون: كيف تُفقد السيادة بالمال؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eفي ١٨٨١م أعلنت الدولة عجزها عن سداد ديونها، فأنشئت «إدارة الدين العام» التي أشرفت على موارد الدولة مباشرةً، وكان لها مندوبون في الجمارك والملح والدخان والحرير. وهذا يعني أن جزءًا من الإيرادات صار يُقبض بأيدي أوروبية قبل أن يصل إلى الخزانة. وكان مندوبو الإدارة يجلسون في الموانئ والمراكز الحدودية، ويقبضون حصّة الدين قبل أن تدخل أيّ ليرةٍ إلى خزانة الدولة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان هذا أخطر من خسارة أرض، لأن الأرض تُسترد بالحرب، أما التبعية المالية فتستمر وتتراكم. وقد ورثت الجمهوريات الحديثة هذا الملف بعد انهيار الدولة، وظلّت تسدّده عقودًا. وهكذا انتقل عبء القرن التاسع عشر إلى القرن العشرين، وهذا هو معنى أن التاريخ لا يبدأ من الصفر.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eكلخانة ١٨٣٩م\u003c/b\u003e\u003cspan\u003eأول تعهّد سلطاني بالمساواة أمام القانون والأمان في المال والعرض\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003e١٨٥٦م\u003c/b\u003e\u003cspan\u003eخطّ همايوني وسّع حقوق غير المسلمين بعد ضغطٍ أوروبي\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003e١٨٧٦م\u003c/b\u003e\u003cspan\u003eأول دستور وبرلمان في دولةٍ إسلامية، ثم عُطّل ثلاثين سنة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003e١٩٠٨م\u003c/b\u003e\u003cspan\u003eإعادة الدستور، ولحظة أملٍ سبقت الانهيار بخمس سنوات\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالإصلاح\u003c/th\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالجوهر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eخطّ كلخانة\u003c/td\u003e\u003ctd\u003e١٨٣٩م\u003c/td\u003e\u003ctd\u003eأمانٌ ومساواةٌ ضريبية ومحاكمةٌ علنية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالخطّ الهمايوني\u003c/td\u003e\u003ctd\u003e١٨٥٦م\u003c/td\u003e\u003ctd\u003eحقوقٌ موسّعة لغير المسلمين ودخولهم الجيش\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eقانون الولايات\u003c/td\u003e\u003ctd\u003e١٨٦٤م\u003c/td\u003e\u003ctd\u003eتقسيم إداري حديث ومجالس منتخبة محليًّا\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمشروطية\u003c/td\u003e\u003ctd\u003e١٨٧٦م\u003c/td\u003e\u003ctd\u003eدستور وبرلمان وحقوق أساسية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eإدارة الدين العام\u003c/td\u003e\u003ctd\u003e١٨٨١م\u003c/td\u003e\u003ctd\u003eإشراف أوروبي مباشر على موارد الدولة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003e«الوطن ليس أرضًا نسكنها، بل قانونٌ يحمينا»\u003c/p\u003e\u003ccite\u003eمن أدبيات الصحافة العثمانية في عهد المشروطية\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eحاولت التنظيمات أن تحوّل الإمبراطورية إلى دولة قانون: مساواة، ودستور، وبرلمان، ومدارس، وصحافة. وقد أنجزت كثيرًا في المؤسسات، لكنها فشلت في كسب الناس، وفي الاستقلال المالي، وفي إقناع المسلمين بأن المساواة لا تمسّ دينهم. ثم جاءت الحروب فأنهت زمن الإصلاح وبقيت المسألة معلّقة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"ww1-end","n":"الحرب العالمية الأولى والنهاية","ic":"💔","part":"القسم الرابع: التوقف والتراجع","h":"\u003carticle class=\"ch3\" id=\"ww1-end\" data-toc=\"الحرب العالمية الأولى والنهاية\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٤.٤\u003c/span\u003e\n          \u003ch3\u003e💔 الحرب العالمية الأولى والنهاية\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eد\u003c/span\u003eخلت الدولة الحرب لتضمن بقاءها، فخرجت منها منقسمةً محتلة. بين ١٩١٤ و١٩٢٤م انتهت ستة قرون، ولم تنتهِ المسألة التي خلّفتها.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eلم تكن الدولة تريد الحرب، لكنها لم تكن قادرة على البقاء خارجها. ففي ١٩١٤م كانت محاصرةً بين روسيا في الشمال وبريطانيا في الجنوب، ومهدّدةً في كل ولاية. وكانت ألمانيا هي القوة الوحيدة التي تعرض عليها تحالفًا وتدريبًا وسلاحًا، فتحالفت معها في أغسطس ١٩١٤م، ثم دخلت الحرب فعليًّا في أكتوبر بعد قصفٍ بحري استُعمل ذريعة. وكان الحساب أن الحرب ستكون قصيرة، وأن التحالف مع أقوى جيشٍ في أوروبا سيضمن لدولةٍ ضعيفة أن تُحفظ في مؤتمر السلام.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت أولى المعارك كبرى ومفاجئة. ففي ١٩١٥م حاولت بريطانيا وفرنسا فتح مضيق الدردنيل للوصول إلى روسيا وإلى العاصمة، فجرت حملة غاليبولي التي استمرت أشهرًا وانتهت بانسحاب الحلفاء بعد خسائر فادحة. وقد صمد العثمانيون في معركةٍ يُشهد لها، وكان قائدٌ اسمه مصطفى كمال قد برز فيها. وكان انتصارًا حقيقيًّا، لكنه لم يُغيّر مسار الحرب لأن الجبهات الأخرى كانت تنهار.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي الشرق، استغلّ البريطانيون ضعف الدولة فحرّضوا على الثورة العربية سنة ١٩١٦م، ووعدوا بالاستقلال والوحدة. واندلعت الثورة في الحجاز، وضُربت سكة الحديد الحجازية، وتقدّم الجيش البريطاني من مصر إلى فلسطين والشام. وفي ١٩١٧م صدر وعد بلفور بإقامة وطنٍ قومي لليهود في فلسطين، وهو وعدٌ قُدّم لطرفٍ ثالث لم يكن له علاقة بالحرب ولا بالسكان الأصليين، وسيُصبح بعد ثلاثين سنة أساسًا لأكبر نكبةٍ في تاريخ المنطقة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي ١٩١٨م انهارت الجبهات: خرجت روسيا من الحرب بعد الثورة، فتحرّر جيشٌ عثماني من الشمال، لكن الجبهة الجنوبية انكسرت في معركة مجدو، وتقدّم الحلفاء إلى دمشق وحلب. وفي أكتوبر ١٩١٨م وُقّعت هدنة مودروس، وكانت شروطها قاسية: فتح المضائق، وتسريح الجيش، والانسحاب من كل الأراضي العربية، وتمكين الحلفاء من احتلال أي موقعٍ يرونه ضروريًّا. وبعد أيامٍ دخلت سفن الحلفاء إلى القسطنطينية، وصار السلطان تحت الحماية الفعلية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان مؤتمر السلام في باريس ١٩١٩م هو اللحظة التي ظهر فيها ما كان مخفيًّا. فقد تقاسمت بريطانيا وفرنسا المشرق بمعاهدة سايكس بيكو السرية سنة ١٩١٦م، وأُنشئ نظام الانتداب، وقُسّمت الأراضي العربية إلى دولٍ صناعية، وأُنشئت «الوطن القومي اليهودي» في فلسطين. ولم يكن للعرب ما وُعدوا به، ولا للعثمانيين ما حافظوا عليه. وكانت هذه هي اللحظة التي وُلدت فيها خريطة الشرق الأوسط الحديث، بخيوطٍ رُسمت في لندن وباريس لا في دمشق وبغداد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي ١٩٢٠م فُرضت معاهدة سيفر التي قسّمت الأناضول نفسها إلى مناطق نفوذ: يونانية في الغرب، وفرنسية في الجنوب، وإيطالية في الجنوب الغربي، وأرمنية في الشرق، وكردية مقترحة. وكانت المعاهدة أقسى من أن تُقبل، فانفجرت مقاومةٌ شعبية في الأناضول بقيادة مصطفى كمال، ودارت حرب استقلالٍ ضد اليونانيين والفرنسيين والأرمن، وانتهت بطرد الجيوش الأجنبية، ثم بمعاهدة لوزان ١٩٢٣م التي اعترفت بتركيا الحديثة داخل حدودها الحالية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت النهاية الرسمية على مرحلتين. في نوفمبر ١٩٢٢م ألغى البرلمان السلطنة، فانتهى حكم آل عثمان بعد ستة قرون. وفي مارس ١٩٢٤م أُلغي لقب الخلافة نفسه، وأُخرج آخر الخلفاء من البلاد. وكان إلغاء الخلافة حدثًا هائلًا في العالم الإسلامي، لأن المسلمين كانوا قد اعتادوا على وجود سلطةٍ اسمية جامعة. وقد جرت بعده محاولاتٌ في مصر والحجاز والهند لإحياء اللقب، لكنها فشلت، وبقي العالم الإسلامي بلا مركزٍ رمزي لأول مرة منذ قرون.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت النتائج البشرية أثقل من كل ذلك. فقد مات في الحرب ملايين، وهاجر ملايين آخرون: مسلمون من البلقان والقوقاز وآسيا الوسطى إلى الأناضول، ومسيحيون من الأناضول إلى اليونان في «تبادل سكاني» سنة ١٩٢٣م أُخرج فيه أكثر من مليون إنسان من بيته. وكانت المجاعات والأوبئة والتهجير القسري قد أنهت نسيجًا اجتماعيًّا عمره قرون. وهذه الخسارة البشرية لا تظهر في الخرائط، لكنها أعمق من كل خسارةٍ سياسية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالمؤرخ اليوم يقف أمام هذا الانهيار بأسئلةٍ لا تزال مفتوحة. هل كان السقوط حتميًّا؟ الدولة كانت قد خسرت الحرب، لكنها لم تكن قد خسرت الأناضول، وقد قاتلت بعد ١٩١٨م وأثبتت أنها قادرة على البقاء. فالمشكلة لم تكن في القدرة العسكرية بل في النظام السياسي: إمبراطوريةٌ متعددة القوميات لم تستطع أن تتحول إلى دولةٍ واحدة بالسرعة المطلوبة، فسبقتها القوميات إلى الانفصال، وسبقها الأوروبيون إلى التقسيم. وهذا هو الدرس الأكبر: أن الدول لا تسقط بالهزيمة وحدها، بل بالعجز عن إعادة تعريف نفسها في الوقت المناسب.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eغاليبولي: انتصارٌ في حربٍ خاسرة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان انتصار غاليبولي ١٩١٥م حقيقيًّا ومهمًّا: أن يمنع جيشٌ عثماني أقوى أسطولٍ في العالم من عبور مضيقٍ ضيق، وأن يُكبّد الحلفاء خسائر أجبرتهم على الانسحاب. وقد غيّر هذا الانتصار حسابات الحرب، وأطال عمر الدولة، وصنع أسطورةً وطنيةً في تركيا الحديثة. وقد صار هذا الانتصار بعد الحرب أساسًا لسرديةٍ وطنية جديدة، بُنيت على فكرة أن الأمة قادرة على الدفاع عن نفسها بلا إمبراطورية ولا سلطان.\u003c/p\u003e\u003cp class=\"ap\"\u003eلكنه لم يكن كافيًا. فالحرب تُحسم بالمجموع لا بالمعركة، والدولة كانت تقاتل على أربع جبهات بلا صناعةٍ ولا سككٍ حديدية كافية ولا مال. والدرس أن الشجاعة تصنع معجزةً موضعية، لكنها لا تُعوّض فارقًا صناعيًّا وبشريًّا هائلًا على المدى الطويل. وهذا هو الفارق بين الحرب التي تُدار بالحماس والحرب التي تُدار بالصناعة: الأولى تُنتج معجزات، والثانية تُنتج نتائج.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eسايكس بيكو: كيف تُرسم خريطة؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eاتفاق سايكس بيكو ١٩١٦م قسّم المشرق العربي إلى مناطق نفوذ بريطانية وفرنسية، ورُسمت حدوده بخطوطٍ مستقيمة على ورق، بلا نظرٍ إلى القبائل ولا الطوائف ولا طرق التجارة ولا الجغرافيا. وقد ظهرت هذه الخريطة بعد الحرب في نظام الانتداب، ثم صارت دولًا. ولم تُنشر نصوص الاتفاق إلا بعد قيام الثورة البلشفية في روسيا سنة ١٩١٧م، فكشفت الوثائق ما كان يُدار في الخفاء.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أنتجت هذه الخطوط ما نراه اليوم: دولٌ بحدودٍ لا تُطابق مجتمعاتها، وأقلياتٌ مقسومة بين دولتين، وأغلبيةٌ محرومة في دولةٍ صُنعت لغيرها. ولهذا لا يمكن فهم صراعات المنطقة اليوم بلا العودة إلى تلك اللحظة، حين حُسم مصير ملايين الناس في غرفةٍ مغلقة. ولهذا يصف المؤرخون هذه الاتفاقية بأنها أكبر خطأٍ سياسي في تاريخ المنطقة الحديث، لا لسوء نيّة أصحابها فقط، بل لأنهم ظنّوا أن الخرائط تُصنع بالمسطرة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eمن السلطنة إلى الجمهورية\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يكن الانتقال من الدولة العثمانية إلى تركيا الحديثة انتقالًا هادئًا. فبين ١٩١٩ و١٩٢٣م دارت حربٌ على ثلاث جبهات، وقُمعت حركاتٌ داخلية، وأُعدم سياسيون، وضُربت معارضة. ثم جاءت إصلاحاتٌ جذرية: إلغاء السلطنة والخلافة، وتحويل التعليم إلى نظامٍ موحّد، وتغيير الحرف، وإلغاء المحاكم الشرعية، ومنع بعض المظاهر الدينية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان لهذه الإصلاحات مؤيدون ومعارضون، وما زال الجدل حولها قائمًا. لكن المؤرخ يلاحظ أن الجمهورية الجديدة بُنيت على أنقاض إمبراطورية، وأن كثيرًا من مؤسساتها — الجيش، والبيروقراطية، والمدارس، والخرائط، والأرشيف — إنما هي وريثةٌ للنظام العثماني، لا قطيعةً كاملة معه. وهذا هو المعنى الدقيق لكلمة «الإرث».\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eغاليبولي ١٩١٥م\u003c/b\u003e\u003cspan\u003eصدّ حملة الحلفاء على المضائق، وأبرزت مصطفى كمال\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسايكس بيكو ١٩١٦م\u003c/b\u003e\u003cspan\u003eتقسيم المشرق سرًّا، ثم فرضه بعد الحرب بانتداب\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمودروس ١٩١٨م\u003c/b\u003e\u003cspan\u003eهدنةٌ بشروط قاسية، واحتلال العاصمة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003e١٩٢٢–١٩٢٤م\u003c/b\u003e\u003cspan\u003eإلغاء السلطنة ثم الخلافة، ونهاية ستة قرون\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e١٩١٤م\u003c/td\u003e\u003ctd\u003eالتحالف مع ألمانيا ودخول الحرب\u003c/td\u003e\u003ctd\u003eأربع جبهات وملايين الجنود\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٩١٦م\u003c/td\u003e\u003ctd\u003eالثورة العربية وسايكس بيكو\u003c/td\u003e\u003ctd\u003eانفصال المشرق وتقسيمه لاحقًا\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٩١٨م\u003c/td\u003e\u003ctd\u003eهدنة مودروس\u003c/td\u003e\u003ctd\u003eاحتلال العاصمة وتفكيك الجيش\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٩٢٠م\u003c/td\u003e\u003ctd\u003eمعاهدة سيفر\u003c/td\u003e\u003ctd\u003eتقسيم الأناضول وإشعال حرب الاستقلال\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٩٢٣م\u003c/td\u003e\u003ctd\u003eلوزان\u003c/td\u003e\u003ctd\u003eاعتراف دولي بتركيا داخل حدودها الحالية\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003e«دخلنا الحرب لنحفظ الدولة، فخرجنا منها وقد فقدناها، وبقي الشعب وحده يحمل ما تبقّى»\u003c/p\u003e\u003ccite\u003eمن مذكرات سياسي عثماني في سنوات الاحتلال\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eدخلت الدولة الحرب العالمية الأولى لتحفظ نفسها، فخرجت محتلةً مقسّمة. انتصرت في غاليبولي لكنها انهارت في الجنوب، ووُعد العرب ثم قُسّم المشرق بسايكس بيكو، وأُنشئ وطنٌ قومي في فلسطين. وفي ١٩٢٢–١٩٢٤م أُلغيت السلطنة ثم الخلافة، وبقيت المسألة التي خلّفتها الحرب مفتوحة إلى اليوم.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-5","n":"القسم الخامس: الإرث","ic":"","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-5\" style=\"--c:#2F4F4F\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🧭\u003c/div\u003e\n      \u003ch2\u003eالقسم الخامس: الإرث\u003c/h2\u003e\n      \u003cp\u003eانتهت الدولة سنة ١٩٢٢م، لكنها لم تنتهِ من حياة المنطقة: في القانون والإدارة والخرائط والمدن والذاكرة. هذا القسم يقرأ ما تركته الدولة بعد أن ذهبت، ويطرح السؤال الصعب: ما الذي نرثه فعلًا من ستة قرون؟\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#caliphate\"\u003eالخلافة وآخرها\u003c/a\u003e\u003ca href=\"#law-administration\"\u003eالقانون والإدارة\u003c/a\u003e\u003ca href=\"#provinces\"\u003eالولايات والميراث الوطني\u003c/a\u003e\u003ca href=\"#memory\"\u003eالذاكرة والإرث\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"caliphate","n":"الخلافة وآخرها","ic":"🕌","part":"القسم الخامس: الإرث","h":"\u003carticle class=\"ch3\" id=\"caliphate\" data-toc=\"الخلافة وآخرها\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٥.١\u003c/span\u003e\n          \u003ch3\u003e🕌 الخلافة وآخرها\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eك\u003c/span\u003eيف صار لقبٌ رمزيٌّ إلى مسألةٍ سياسية كبرى؟ وكيف انتهى في مارس ١٩٢٤م؟ هذا الفصل يفصل بين ما جرى فعلًا وما أُضيف لاحقًا إلى تاريخ الخلافة العثمانية.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eالخلافة في الإسلام ليست منصبًا مقدّسًا بالمعنى الكهنوتي، بل وظيفةٌ سياسية: أن يقوم رجلٌ بأمر الأمة، ويقيم العدل، ويحمي الثغور، ويقود الحج. وقد مارستها دولٌ كثيرة بأشكال مختلفة، ولم يكن هناك اتفاقٌ دائم على شروطها ولا على طريقة اختيار صاحبها. وحين ضعفت الخلافة العباسية في بغداد، صار السلاطين السلاجقة ثم المماليك هم القوة الفعلية، والخليفة العباسي رمزًا يمنح الشرعية. وهكذا كان العالم الإسلامي يعيش حالةً من الفصل بين السلطة الفعلية والرمز الشرعي، قبل أن يأتي العثمانيون.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ورث العثمانيون وظيفة الخلافة بالتدريج لا بنقلةٍ واحدة. فبعد فتح مصر سنة ١٥١٧م صاروا مسؤولين عن الحرمين وطريق الحج والأوقاف المقدسة، وهذه مسؤولياتٌ كانت في العرف الإسلامي من وظائف الخليفة. ثم بدأ لقب «الخليفة» يظهر في بعض المراسلات والخطب، لا كأساسٍ للحكم بل كوصفٍ إضافي. ولم يكن السلطان يحتاج إلى هذا اللقب ليكون شرعيًّا عند رعاياه، لأن شرعيته كانت من العدل والغزو والقانون، لا من نسبٍ إلى قريش.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما الحكاية الشهيرة بأن الخليفة العباسي المتوكل على الله تنازل عن الخلافة لسليم الأول في القاهرة، فهي روايةٌ متأخرة لا تسندها وثيقةٌ معاصرة، وقد انتشرت في القرن الثامن عشر حين احتاجت الدولة إلى تعزيز موقعها أمام روسيا وأوروبا. والمؤرخ المنصف لا ينفي أن أسرةً عباسية كانت في القاهرة، ولا ينفي أن السلطان استفاد من وجودها، لكنه يميّز بين حدثٍ جرى وروايةٍ صُنعت بعد قرنين لخدمة حاجةٍ سياسية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي القرن الثامن عشر تغيّر موقع اللقب تغيّرًا حاسمًا. فبعد معاهدة كوتشك قينارجة سنة ١٧٧٤م، صار للسلطان العثماني صلةٌ دينية رسمية بمسلمي القرم، وصار يُستعمل لقب الخليفة في المعاهدات للدلالة على هذه الصلة. أي أن اللقب دخل السياسة الدولية من باب المفاوضات لا من باب العقيدة، وهذا فرقٌ مهم: أنه صار أداةً دبلوماسية قبل أن يكون مشروعًا سياسيًّا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي القرن التاسع عشر تحوّل اللقب إلى برنامج. فقد استعمل السلطان عبد الحميد الثاني فكرة «الجامعة الإسلامية» لمواجهة التدخل الأوروبي، فبُعثت رسائل إلى علماء الهند ومصر وشمال أفريقيا، ودُعي المسلمون إلى الوحدة حول الخلافة، ونُشرت صحفٌ ومجلات في هذا المعنى. وكان الهدف عمليًّا: أن يعرف الأوروبيون أن لكل مسلمٍ في العالم مصلحةً في بقاء الدولة، فيتردّدوا في تقسيمها. لكن البرنامج لم يُنتج قوةً عسكرية، لأنه كان خطابًا بلا مؤسسة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي ١٩٠٨م صار اللقب مسألةً داخلية حادّة. فالاتحاديون كانوا يعتبرون السلطان رمزًا للاستبداد، وكانوا يريدون سلطةً برلمانية. ثم في الحرب العالمية الأولى استُعمل اللقب في دعوة المسلمين في المستعمرات إلى الجهاد ضد بريطانيا وفرنسا، فلم تنجح الدعوة نجاحًا يُذكر، لأن مصالح الناس المحلية كانت أقوى من النداء العابر للحدود. وهذا الفشل كشف حدّ الخلافة الرمزية في عالمٍ صارت فيه الدول الوطنية هي الإطار.\u003c/p\u003e\u003cp class=\"ap\"\u003eوبعد الحرب انقسمت الآراء حول مصير اللقب. فكان هناك من أراد أن يبقى في آل عثمان كرمزٍ للوحدة، ومن أراد أن ينتقل إلى شريف مكة أو إلى ملك مصر أو إلى ملك أفغانستان، ومن رأى أن الخلافة انتهت عمليًّا بسقوط الدولة ولا معنى لإحيائها. وقد عُقدت مؤتمراتٌ في القاهرة والقدس ومكة، وكُتبت كتب، وتناقلت الصحف المقترحات، ولم يخرج شيءٌ منها بقرار.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي نوفمبر ١٩٢٢م ألغى البرلمان التركي السلطنة، وبقي اللقب الديني منفصلًا عن السلطة لسنةٍ ونيّف. ثم في مارس ١٩٢٤م أُلغي اللقب نفسه، وأُخرج آخر الخلفاء من البلاد مع أسرته، وأُغلقت المؤسسات المرتبطة به. وكان القرار جزءًا من مشروع بناء دولةٍ قومية علمانية، رأت في أي رمزٍ عابرٍ للحدود خطرًا على سيادتها. ولم يكن القرار محلّ إجماعٍ في تركيا نفسها، ولا في العالم الإسلامي، لكنه نُفّذ.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ترك إلغاء الخلافة فراغًا لم يُملأ. فالمسلمون كانوا قد اعتادوا، قرونًا، على وجود سلطةٍ اسميةٍ جامعة، ولو كانت ضعيفة، فصار الغياب صدمةً نفسية أكثر منه فراغًا مؤسسيًّا. وقد ظهرت بعده حركاتٌ حاولت أن تُعيد الشكل: مؤتمرٌ في مكة، وجمعياتٌ في الهند ومصر، ومقترحاتٌ في الأزهر، وكلها انتهت إلى لا شيء، لأن العالم الجديد كانت تنظّمه دولٌ ذات حدود وسيادة، لا أمةٌ واحدة ذات خليفة.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eهل كان السلطان خليفة حقًّا؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eالجواب الدقيق: كان خليفةً بالاستعمال لا بالتأسيس. فالناس في الأمصار كانوا يذكرونه في الخطبة ويسمّونه خليفة، والوثائق الرسمية استعملت اللقب في سياقات محددة، لكن الدولة نفسها كانت تُدار بمنطق السلطنة والقانون، ولم تُؤسّس مؤسسةً خاصة بالخلافة ولا نظامًا لاختيار الخليفة ولا مجلسًا للبيعة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوهذا يعني أن الخلافة العثمانية كانت واقعًا رمزيًّا أكثر منها نظامًا سياسيًّا. ومن هنا كان إلغاؤها سهلًا إداريًّا وصعبًا نفسيًّا: لم يكن هناك جهازٌ يُلغى، بل صورةٌ في الوجدان تُكسر. وهذا يفسر لماذا ظلّ الجدل حولها قائمًا بعد قرنٍ من إلغائها. ولهذا يظلّ السؤال المطروح اليوم ليس «من كان الخليفة؟» بل «هل كانت هناك مؤسسةٌ للخلافة أصلًا؟»، والجواب عن الثاني يفسّر صعوبة الأول.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالجامعة الإسلامية: مشروعٌ بلا جيش\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان مشروع الجامعة الإسلامية في عهد عبد الحميد محاولةً ذكية لمواجهة أوروبا بسلاحٍ غير عسكري: أن تُصبح الدولة مركزًا لولاءٍ عالمي، فتصير أي حربٍ عليها حربًا على مئات الملايين. وقد بُثّت الدعوة عبر الصحف والرسائل والجواسيس والسفارات، ووُزّعت الأموال على صحفٍ في الهند ومصر وتونس.\u003c/p\u003e\u003cp class=\"ap\"\u003eلكن المشروع فشل لسببٍ بسيط: أنه لم يكن يملك ما يُترجم الولاء إلى فعل. فالمسلم في الهند كان تحت حكم بريطانيا، والمسلم في الجزائر تحت حكم فرنسا، وكلاهما كان يهتمّ بقضيته المحلية أكثر من قضيةٍ بعيدة. والدرس أن الشعارات العابرة للحدود لا تصنع قوةً إن لم يكن وراءها مصالحُ حقيقية ومؤسسات.\u003c/p\u003e\u003ch4 class=\"sub\"\u003e١٩٢٤م: لماذا أُلغي اللقب؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يكن الإلغاء مجرّد قرارٍ علماني، بل كان أيضًا قرارًا سياديًّا. فالدولة الجديدة أرادت أن تكون دولةً واحدة بحدودٍ معترف بها، وكان وجود خليفةٍ في إسطنبول يعني وجود مركزٍ يمكن أن يُطالب بولاءٍ يتجاوز الحدود. وقد رأى القائمون على الجمهورية أن هذا خطرٌ على مشروعهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في القرار أيضًا ردّ فعلٍ على استعمال اللقب في الحرب ضد الحلفاء، وعلى محاولات بعض العائلات الحاكمة في العالم الإسلامي أن تطرح نفسها بديلًا. وهكذا أُغلق ملفٌ عمره أربعة عشر قرنًا بقرارٍ إداري، وبقي سؤال الشرعية مفتوحًا في العالم الإسلامي إلى اليوم.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003e١٥١٧م\u003c/b\u003e\u003cspan\u003eضمّ الحجاز ومصر، وبداية وظيفة خدمة الحرمين لا الخلافة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003e١٧٧٤م\u003c/b\u003e\u003cspan\u003eكوتشك قينارجة تُدخل لقب الخليفة في المعاهدات الدولية\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالجامعة الإسلامية\u003c/b\u003e\u003cspan\u003eبرنامج عبد الحميد لمواجهة أوروبا بلا جيشٍ ولا مؤسسة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمارس ١٩٢٤م\u003c/b\u003e\u003cspan\u003eإلغاء الخلافة وإخراج آخر الخلفاء، ونهاية الرمز\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمرحلة\u003c/th\u003e\u003cth\u003eالفترة\u003c/th\u003e\u003cth\u003eوضع اللقب\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eما بعد الفتح\u003c/td\u003e\u003ctd\u003e١٥١٧–١٧٠٠م\u003c/td\u003e\u003ctd\u003eلقبٌ متقطع في الخطبة والمراسلات\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمعاهدات\u003c/td\u003e\u003ctd\u003e١٧٧٤–١٨٥٠م\u003c/td\u003e\u003ctd\u003eأداة دبلوماسية لصلةٍ دينية بمسلمي القرم والروم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالجامعة الإسلامية\u003c/td\u003e\u003ctd\u003e١٨٧٦–١٩٠٩م\u003c/td\u003e\u003ctd\u003eبرنامج سياسي بلا مؤسسة عسكرية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالحرب والنهاية\u003c/td\u003e\u003ctd\u003e١٩١٤–١٩٢٤م\u003c/td\u003e\u003ctd\u003eدعوة جهادٍ فاشلة، ثم إلغاء اللقب\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003e«الخلافة ليست تاجًا يُلبس، بل أمانةٌ تُحمل، ومن لم يقدر على حملها فليس له أن يطلبها»\u003c/p\u003e\u003ccite\u003eمن مقالات الصحافة العربية في الجدل حول الخلافة بعد ١٩٢٤م\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eورث العثمانيون وظيفة خدمة الحرمين لا منصب الخلافة، ثم دخل اللقب السياسة عبر المعاهدات في القرن الثامن عشر، وصار برنامجًا في القرن التاسع عشر. وكان رمزًا بلا مؤسسة، فكان إلغاؤه سنة ١٩٢٤م سهلًا إداريًّا وصعبًا نفسيًّا، وبقي سؤال الشرعية مفتوحًا بعده.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"law-administration","n":"القانون والإدارة","ic":"📚","part":"القسم الخامس: الإرث","h":"\u003carticle class=\"ch3\" id=\"law-administration\" data-toc=\"القانون والإدارة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٥.٢\u003c/span\u003e\n          \u003ch3\u003e📚 القانون والإدارة\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eأ\u003c/span\u003eكثر ما ورثته المنطقة عن العثمانيين ليس مبنًى ولا ميدانًا، بل طريقةٌ في تنظيم الدولة: قانونٌ مكتوب، ودفترٌ، ودائرةٌ إدارية، ومحكمة.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان القانون العثماني مزيجًا من ثلاثة مصادر: الشريعة، والقانون السلطاني، والعرف المحلي. والشريعة تحكم الأحوال الشخصية والعبادات والمعاملات الكبرى، والقانون السلطاني ينظّم الأرض والضرائب والمراتب والجزاءات التعزيرية، والعرف يحكم في تفاصيل كل إقليم. وهذا المزيج جعل الدولة قادرةً على الحكم في بلادٍ شديدة التنوع بلا أن تُلغي أعرافها، لكنه جعل القانون غير موحّدٍ تمامًا، فكانت الأحكام تختلف من ولايةٍ إلى أخرى.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بدأ التدوين الجدّي في القرن التاسع عشر، لأنه صار ضرورةً لا ترفًا. فمع اتساع التجارة مع أوروبا، صار التجار يحتاجون قانونًا واضحًا للشركات والسندات والإفلاس، ولم يكن الفقه القديم يغطّي هذه الصور. فصدر «قانون التجارة» سنة ١٨٥٠م مقتبسًا من القانون الفرنسي، ثم صدر «قانون الأراضي» سنة ١٨٥٨م الذي نظّم الملكية الفردية للأرض وفتح باب التسجيل، ثم صدرت «مجلة الأحكام العدلية» سنة ١٨٧٦م وهي أول تدوين مدني للفقه الحنفي في صيغة مواد مرقّمة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت المجلة حدثًا مهمًّا لأنها حوّلت الفقه من كتبٍ مطوّلة إلى مواد قانونية يمكن للقاضي أن يطبقها بسهولة. وقد تُرجمت إلى العربية والفارسية والألبانية، ودُرّست في مدارس الحقوق في بغداد ودمشق والقاهرة، وظلّت مرجعًا في بعض الدول عقودًا بعد سقوط الدولة. وهي دليل على أن الفقه الإسلامي كان قادرًا على التدوين الحديث لو تُرك له الوقت، لا أن يعجز عنه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوإلى جانب المحاكم الشرعية ظهرت «المحاكم النظامية» وهي محاكم مدنية تطبّق القوانين الجديدة، ثم المحاكم التجارية، ثم محاكم مختلطة فيها قضاةٌ أوروبيون. وكان هذا ازدواجًا في القضاء: محكمةٌ شرعية للزواج والميراث، ومحكمةٌ نظامية للعقود والتجارة. ولم يُحلّ هذا الازدواج إلا في الجمهوريات اللاحقة، وبطرقٍ مختلفة من بلدٍ إلى آخر، وأثرُه ما زال قائمًا في أنظمة القضاء في المنطقة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما الإدارة فقد كانت إنجازًا عثمانيًّا حقيقيًّا. فقد قسّمت الدولة أراضيها إلى ولايات وألوية وأقضية ونواحٍ وقرى، ولكل مستوى موظفٌ مسؤول ومجلسٌ إداري. وقانون الولايات سنة ١٨٦٤م أنشأ مجلسًا في كل ولاية يضمّ ممثلين عن الطوائف، وكانت هذه أول تجربةٍ للمشاركة المحلية في المنطقة. وقد ورثت الدول العربية وتركيا هذا التقسيم كما هو تقريبًا، حتى أن كلمة «ولاية» و«لواء» و«قضاء» بقيت في الاستعمال الرسمي إلى اليوم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان الدفتر هو أداة الإدارة الحقيقية. فالدولة العثمانية سجّلت الأرض والبيوت والسكان والمواشي والأشجار والضرائب في دفاتر مرقّمة، وأحصت القرى بأسمائها، وسجّلت الهجرات والوفيات والمواليد في سجلاتٍ مدنية. وقد كانت هذه السجلات دقيقةً إلى حدٍّ مذهل، وهي اليوم أساسٌ للبحث الديموغرافي في تاريخ المنطقة. ولا يمكن فهم مجتمعٍ من القرن السابع عشر في البلقان أو الشام بلا هذه الدفاتر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت البيروقراطية العثمانية تُنتج نوعًا من الحكم غير موجودٍ في كثير من الدول المعاصرة لها: أن يُنفَّذ قرارٌ في قريةٍ نائية بعد أسابيع من صدوره في العاصمة، وأن يُرفع اعتراضٌ من القرية إلى العاصمة، وأن يُحفظ كل ذلك في ورق. وقد كانت هذه القدرة على الوصول والنقل والتسجيل هي ما جعل إمبراطوريةً بثلاث قارات قابلةً للحكم، لا مجرّد أرضٍ محتلة.\u003c/p\u003e\u003cp class=\"ap\"\u003eلكن الإدارة نفسها صارت مشكلةً في القرن التاسع عشر. فقد تضخّم الجهاز، وتكاثرت الرتب والألقاب، وصار التوظيف بابًا للمحاباة، وصار الراتب غير كافٍ فيُستكمل بالرشوة. وفي الوقت نفسه ظهرت حاجةٌ إلى تخصّصٍ لا تعرفه البيروقراطية القديمة: مهندسون، وأطباء، وإحصائيون، ومحاسبون. فبُنيت المدارس الحديثة لتُخرّجهم، فأنتجت جيلًا متعلمًا بالأرقام والقوانين، وهذا الجيل هو الذي سيقود المعارضة الدستورية بعد ذلك.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالمؤرخ اليوم يرى أن الإرث الإداري العثماني هو الأكثر بقاءً في المنطقة. فالحدود الإدارية، والسجلات العقارية، ونظام الموظفين، والرواتب، والتقاعد، والتعداد، والبلديات، كلها وريثةٌ مباشرة أو غير مباشرة للنموذج العثماني. وحتى الدول التي قامت على أنقاض الدولة وحاولت أن تُعلن القطيعة معها، احتفظت بأجهزتها الإدارية كما هي، لأن البديل كان يعني فراغًا لا يمكن ملؤه.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eمجلة الأحكام: تدوين الفقه\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت المجلة محاولةً لصياغة الفقه الحنفي في مواد قانونية، وقد شارك في إعدادها علماء وقانونيون، وصدرت في ستة عشر كتابًا تغطي البيوع والإجارة والكفالة والرهن والهبة وغيرها. وكانت لغتها دقيقةً ومركّزة، وكل مادةٍ تُشبه نصًّا قانونيًّا حديثًا مع مثالٍ توضيحي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت المجلة جوابًا على سؤالٍ كبير: هل يمكن أن يُدوَّن الفقه كما تُدوَّن القوانين الأوروبية؟ والجواب الذي قدّمته كان إيجابيًّا. ولهذا دُرّست في كليات الحقوق عقودًا، وبقيت في بعض الدول مرجعًا رسميًّا حتى منتصف القرن العشرين، وهي شاهدٌ على أن التقليد الفقهي كان حيًّا لا جامدًا.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالولايات: الخريطة التي بقيت\u003c/h4\u003e\u003cp class=\"ap\"\u003eقانون الولايات ١٨٦٤م لم يكن مجرّد تقسيمٍ إداري، بل كان محاولةً لتقليص سلطة الولاة وتوسيع مشاركة الأهالي. فقد أنشأ مجلسًا في كل ولاية، وجعل الميزانية محلية، وأدخل ممثلين عن الطوائف. وكان الهدف أن تُدار الأقاليم بشراكةٍ لا بأمرٍ صادر من العاصمة. وقد كان هذا التحوّل من الحكم المباشر إلى المشاركة المحلية خطوةً كبيرة، لكنها ظلّت محكومةً بسلطة الوالي الذي يملك حقّ التعليق والتعطيل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد نجح القانون في ترسيخ التقسيم، وفشل في ترسيخ المشاركة، لأن المجالس صارت غالبًا في يد الأعيان وكبار الملاك. ومع ذلك، فإن خرائط الولايات التي رُسمت في تلك الفترة هي أساس الحدود الإدارية في سوريا ولبنان والعراق والأردن وفلسطين إلى اليوم، مع تعديلاتٍ طفيفة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالأرشيف: ذاكرةٌ في ورق\u003c/h4\u003e\u003cp class=\"ap\"\u003eيُعدّ الأرشيف العثماني من أكبر الأرشيفات في العالم، ويضمّ ملايين الوثائق: فرمانات، ودفاتر، وسجلات محاكم، ومراسلاتٍ دبلوماسية، وتقارير ولاة، وشكاوى أهالٍ. وقد كان محفوظًا في إسطنبول، ثم صار متاحًا للباحثين، وتُرجمت منه مجموعات كبيرة إلى العربية. ولا تزال عمليات الفهرسة والترجمة مستمرة، وكثير من الدفاتر لم يُفتح بعد، وهذا يعني أن تاريخ المنطقة لم يُكتب كله، وأن ما نعرفه اليوم قد يتغيّر غدًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأهمية هذا الأرشيف أنه لا يوثّق رأي الدولة فقط، بل يوثّق حياة الناس: من تزوّج بمن، وبكم بيع البيت، ومن شكا من الجابي، وكيف تعاملت المحكمة مع نزاعٍ على ماء. وهذه التفاصيل هي ما يجعل التاريخ اجتماعيًّا لا مجرّد سردٍ للملوك والحروب. ولهذا صار الأرشيف العثماني أداةً للتاريخ الاجتماعي والاقتصادي، لا مصدرًا للتاريخ السياسي وحده، وهذا تحوّلٌ في طريقة فهم المنطقة كلها.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eقانون الأراضي ١٨٥٨م\u003c/b\u003e\u003cspan\u003eتنظيم الملكية الفردية والتسجيل، وأساس السجلات العقارية\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمجلة الأحكام ١٨٧٦م\u003c/b\u003e\u003cspan\u003eأول تدوين مدني للفقه الحنفي في مواد مرقّمة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eقانون الولايات ١٨٦٤م\u003c/b\u003e\u003cspan\u003eتقسيم إداري ومجالس محلية بقيت آثارها في خرائط المنطقة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالدفاتر\u003c/b\u003e\u003cspan\u003eسجلات الأرض والسكان والضرائب، أساس البحث الديموغرافي\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالإصلاح\u003c/th\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالأثر الباقي\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eقانون التجارة\u003c/td\u003e\u003ctd\u003e١٨٥٠م\u003c/td\u003e\u003ctd\u003eقانون الشركات والسندات في المنطقة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eقانون الأراضي\u003c/td\u003e\u003ctd\u003e١٨٥٨م\u003c/td\u003e\u003ctd\u003eالملكية المسجّلة والسجل العقاري\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eقانون الولايات\u003c/td\u003e\u003ctd\u003e١٨٦٤م\u003c/td\u003e\u003ctd\u003eالحدود الإدارية والمجالس المحلية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمجلة\u003c/td\u003e\u003ctd\u003e١٨٧٦م\u003c/td\u003e\u003ctd\u003eتدوين الفقه ودراسته في كليات الحقوق\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003e«ما لا يُسجَّل في الدفتر لا وجود له في الدولة»\u003c/p\u003e\u003ccite\u003eقاعدة إدارية عثمانية متوارثة في دواوين الولايات\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eورثت المنطقة عن العثمانيين قانونًا مدوّنًا وإدارةً مقسّمة بدقّة وأرشيفًا هائلًا. فقانون الأراضي والمجلة وقانون الولايات صارت أساسًا للتشريع والخرائط والملكية في الدول اللاحقة. وهذا الإرث الإداري هو الأكثر بقاءً، لأنه لا يُهدم بسهولة: الدول تغيّر أنظمتها، لكنها لا تغيّر دفاترها.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"provinces","n":"الولايات والميراث الوطني","ic":"🗺️","part":"القسم الخامس: الإرث","h":"\u003carticle class=\"ch3\" id=\"provinces\" data-toc=\"الولايات والميراث الوطني\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٥.٣\u003c/span\u003e\n          \u003ch3\u003e🗺️ الولايات والميراث الوطني\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eل\u003c/span\u003eم تكن الدولة العثمانية مركزًا يبتلع الأطراف، بل شبكةً من الولايات لكل واحدةٍ وجهها ومحصولها ونخبتها. وهذا الفصل يقرأ كيف صارت هذه الولايات دولًا، وكيف ورثت مؤسساتها.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكانت الدولة تُدار من خلال ولاياتٍ شديدة التنوع. فولاية مصر كانت عالمًا قائمًا بذاته: الأزهر، وتجارة البحر الأحمر، ومماليك لا يزالون نافذين. وولاية الشام كانت مركز تجارةٍ وزراعة وحجّ. وولاية بغداد كانت حدًّا مع فارس، وولاية الحجاز كانت مركز شرعية، وولاية اليمن كانت بعيدةً عصية، وولايات البلقان كانت مصدر الجنود والضرائب، وولايات شمال أفريقيا كانت أساطيل وسواحل. ولكل واحدةٍ من هذه مسارٌ مختلف داخل الدولة الواحدة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت الإدارة العثمانية في الأقاليم تعتمد على «الوالي» وهو الحاكم العسكري والإداري، و«الدفتردار» وهو المسؤول المالي، و«القاضي» وهو المستقل نسبيًّا. وكانت هناك أيضًا قوى محلية لا يمكن تجاهلها: الأعيان، والأشراف، وشيوخ القبائل، ورؤساء الطوائف الدينية. وقد عملت الدولة معهم لا ضدهم في أغلب الأوقات، فأعطتهم مناصب وامتيازات مقابل الضرائب والطاعة. وهذا هو سرّ بقائها: أنها لم تحكم مباشرةً في كل قرية، بل حكمت عبر وسطاء.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي مصر تحوّل هذا النظام إلى إمارةٍ شبه مستقلة. فبعد حملة نابليون، صعد محمد علي باشا، وأنشأ جيشًا حديثًا وأسطولًا ومدارس ومصانع، وحكم مصر فعليًّا وإن ظلّ تابعًا اسميًّا للسلطان. وقد هدّد الدولة نفسها سنة ١٨٣١م حين زحف بجيشه إلى الأناضول، فأنقذته التدخلات الأوروبية. ومنذ ذلك الحين صارت مصر دولةً داخل دولة، ثم احتُلت من بريطانيا سنة ١٨٨٢م، وبقيت اسميًّا عثمانية حتى ١٩١٤م حين أعلنت بريطانيا الحماية عليها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي شمال أفريقيا كانت القصة أسرع. فاحتلّت فرنسا الجزائر سنة ١٨٣٠م، ثم تونس سنة ١٨٨١م، ثم احتلّت إيطاليا ليبيا سنة ١٩١١م. وفي كل حالةٍ قاوم السكان مقاومةً طويلة: بقيادة الأمير عبد القادر في الجزائر، وبمقاومةٍ شعبية في تونس وليبيا. وقد كانت الدولة العثمانية عاجزةً عن الدفاع عن هذه الولايات البعيدة، لكنها في المقابل تركت فيها مؤسساتٍ ونخبًا وأطرًا إدارية صارت أساسًا للحركات الوطنية لاحقًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي المشرق كانت الولايات أكثر تماسكًا. فدمشق وحلب وبغداد والقدس كانت مراكز علمٍ وتجارة، وفيها مدارس وأوقاف وأسواق ومجالس. وقد أنتجت هذه المدن نخبةً من العلماء والتجار والإداريين، وهذه النخبة هي التي قادت الحركة العربية في مطلع القرن العشرين، وطالبت بالإصلاح ثم باللامركزية ثم بالاستقلال. ولم تكن مطالبهم انفصالًا في البداية، بل إصلاحًا داخل الدولة، ثم تغيّر المطلب بعد أن رفضت الدولة واشتدّ القمع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي الحجاز كانت الشرعية هي الملف الأهم. فالشريف في مكة كان يُعيَّن من العاصمة، ويحكم بشراكةٍ مع الوالي، ويستفيد من الصرة والأوقاف. وكانت مكة والمدينة مدينتين لا تُنتجان شيئًا، وتعتمد كل الاعتماد على ما يأتي من الخارج. ولهذا كانت السيطرة عليهما سياسةً لا اقتصادًا، ومن يسيطر عليهما يملك رمزًا لا يملكه غيره. وحين أعلن الشريف حسين الثورة سنة ١٩١٦م، كان يعرف أن ورقة الحرمين هي أقوى ما يملك.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت البلقان هي الخسارة الكبرى. فقد كانت الولايات الأوروبية أغنى ولايات الدولة وأكثرها سكانًا، وفيها مدنٌ كبيرة مثل سالونيك وصوفيا وبلغراد وسراييفو. وقد خسرتها الدولة تدريجيًّا في القرن التاسع عشر وأوائل العشرين: اليونان ١٨٣٠م، ثم صربيا ورومانيا وبلغاريا، ثم البوسنة ١٩٠٨م، ثم ألبانيا ١٩١٢م، ثم ما تبقّى في حروب البلقان ١٩١٢–١٩١٣م. ومع كل خسارةٍ كانت تجري هجرةٌ كبيرة للمسلمين نحو الأناضول، وهي هجرةٌ غيّرت تركيبة البلاد وأثّرت في سياساتها بعد ذلك.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالمفارقة أن الدول التي قامت على أنقاض الولايات ورثت مؤسساتها العثمانية كلها. فمجالس الولايات صارت برلمانات، والألوية صارت محافظات، والأقضية صارت مدنًا، والقانون التجاري بقي معمولًا به، والمجلة دُرّست في كليات الحقوق، وسجلات الأراضي صارت أساس الملكية، وحتى الأزياء الرسمية والألقاب والمراسم انتقلت. فالقطيعة كانت سياسية، أما الإدارة فكانت استمرارًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالمؤرخ لا يستطيع أن يفهم الشرق الأوسط الحديث بلا هذا الفصل. فالحدود التي رُسمت بعد ١٩١٨م لم تُلغِ التقسيم العثماني بل عدّلته، والطوائف التي أُديرت في نظام الملل صارت أطرًا سياسية، والمدن التي بُنيت في العهد العثماني بقيت مراكز ثقل، والعلاقات بين المركز والأطراف بقيت كما هي تقريبًا. ولهذا يقال إن الدولة العثمانية لم تنتهِ سنة ١٩٢٢م، بل تحوّلت إلى اثنتين وعشرين دولة، كل واحدةٍ تحمل جزءًا من جهازها.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eمصر: دولةٌ داخل دولة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت مصر أهم ولايةٍ عثمانية وأكثرها استقلالًا. فبعد ١٥١٧م أبقى العثمانيون المماليك كطبقةٍ محلية، وأداروا البلاد عبر والٍ وقوةٍ عسكرية وجبايةٍ مركزية. لكن في القرن الثامن عشر ضعف الوالي وصعد أمراء المماليك، ثم جاء محمد علي فبنى دولةً حديثة داخل الدولة العثمانية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ظلّت العلاقة معقدة: مصر كانت ولايةً في القانون، ومملكةً في الواقع، ومحميةً بريطانيةً في السياسة. وهذا التعقيد هو أصل كثير من المسائل اللاحقة، ومنها أن مصر لم تُصبح دولةً كاملة السيادة إلا في القرن العشرين، وأن سؤال العلاقة بالدولة الأم بقي قائمًا حتى بعد سقوطها.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالبلقان: الخسارة التي شكّلت الأناضول\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم تكن خسارة البلقان خسارة أرضٍ فقط، بل كانت تغييرًا ديموغرافيًّا هائلًا. فملايين المسلمين من البوسنة وألبانيا ومقدونيا وبلغاريا وكريت هاجروا إلى الأناضول بين ١٨٧٨ و١٩٢٣م، حاملين لغاتهم وعاداتهم وذاكرة قرون. وقد استقروا في مدنٍ وبلدات، وغيّروا تركيبة السكان، وصاروا قاعدةً اجتماعية للسياسات الوطنية المتشددة بعد ذلك.\u003c/p\u003e\u003cp class=\"ap\"\u003eوهذا يفسّر جزءًا من تاريخ تركيا الحديثة: أن الدولة التي بُنيت سنة ١٩٢٣م كانت دولة مهاجرين بقدر ما كانت دولة أناضولية، وأن شعور الخطر والانكماش كان حاضرًا في تكوينها. والذاكرة الجماعية للخسارة تُنتج سياساتٍ لا تُفهم بلا معرفة أصلها. ومن هنا جاء الحذر الدائم في السياسة التركية تجاه الجيران، والحساسية الشديدة تجاه أي حديثٍ عن الأقليات أو الحدود.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالحجاز: شرعيةٌ بلا اقتصاد\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الحجاز ولايةً لا تُنتج شيئًا، وتعيش على الصرة والأوقاف والحج. ولم تكن الدولة تحكمها للاقتصاد بل للشرعية، لأن خدمة الحرمين كانت أساس موقعها في العالم الإسلامي. ولهذا كان الوالي في الحجاز أكثر حذرًا من غيره، وكانت العلاقة بالشريف علاقة تفاوضٍ دائم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوحين انقطعت الصرة في الحرب العالمية الأولى، انهار الاقتصاد المحلي، فساءت أحوال الناس، وتغيّرت موازين القوى المحلية. وهذا يبيّن أن الشرعية وحدها لا تكفي للحكم: من يحكم مدينةً لا تُنتج يجب أن يملك مالًا من الخارج، ومن يفقد المال يفقد المدينة. وهذا ما جعل الحجاز دائمًا عرضةً للتحوّلات الخارجية أكثر من غيرها من الولايات، لأن اقتصادها كان مرتبطًا بمالٍ يأتي من خارجها.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالوالي والقاضي\u003c/b\u003e\u003cspan\u003eفصلٌ بين الإدارة والقضاء في كل ولاية، بأثرٍ باقٍ في المنطقة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمحمد علي\u003c/b\u003e\u003cspan\u003eبنى دولةً حديثة في مصر داخل الدولة العثمانية\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالبلقان\u003c/b\u003e\u003cspan\u003eخسارةٌ تدريجية وهجرة ملايين المسلمين إلى الأناضول\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالحرمين\u003c/b\u003e\u003cspan\u003eشرعيةٌ بلا اقتصاد، تعتمد على الصرة والأوقاف\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالولاية\u003c/th\u003e\u003cth\u003eما ورثته الدولة الحديثة\u003c/th\u003e\u003cth\u003eالمصير\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eمصر\u003c/td\u003e\u003ctd\u003eالأزهر والقضاء والجيش والمدارس\u003c/td\u003e\u003ctd\u003eاستقلال فعلي ثم حماية بريطانية ١٨٨٢م\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالشام\u003c/td\u003e\u003ctd\u003eمجالس إدارية ومدنٌ مركزية\u003c/td\u003e\u003ctd\u003eتقسيمٌ إلى دولٍ بعد ١٩١٨م\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالعراق\u003c/td\u003e\u003ctd\u003eقانون الأراضي والدفاتر والسجلات\u003c/td\u003e\u003ctd\u003eدولةٌ تحت الانتداب ثم ملكية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالبلقان\u003c/td\u003e\u003ctd\u003eنخبٌ ومؤسسات وهجرةٌ معاكسة\u003c/td\u003e\u003ctd\u003eدولٌ قومية بين ١٨٣٠ و١٩١٣م\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eشمال أفريقيا\u003c/td\u003e\u003ctd\u003eإدارةٌ وأساطيل ونخبٌ محلية\u003c/td\u003e\u003ctd\u003eاحتلالٌ فرنسي وإيطالي\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003e«الدولة التي تحكم عبر الوسطاء تبقى، والتي تحكم بالجباة وحدهم تنهار»\u003c/p\u003e\u003ccite\u003eخلاصة يكررها المؤرخون في تحليل الإدارة العثمانية للأقاليم\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eلم تحكم الدولة ولاياتها مباشرةً، بل عبر والٍ وقاضٍ وأعيانٍ وطوائف، فبقي لكل ولاية وجهها. وقد خرجت من هذه الشبكة دولٌ حديثة ورثت المؤسسات والحدود والسجلات، وقطعت مع المركز سياسيًّا لا إداريًّا. وهذا هو الإرث الأصعب: أن تُولد دولٌ جديدة بجهازٍ قديم.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"memory","n":"الذاكرة والإرث","ic":"🧭","part":"القسم الخامس: الإرث","h":"\u003carticle class=\"ch3\" id=\"memory\" data-toc=\"الذاكرة والإرث\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٥.٤\u003c/span\u003e\n          \u003ch3\u003e🧭 الذاكرة والإرث\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eك\u003c/span\u003eيف تُذكر الدولة العثمانية اليوم؟ بين سردية «الانحلال» وسردية «الخلافة المفقودة» ونيو-عثمانية جديدة، يقف المؤرخ أمام ذاكرةٍ مثقلةٍ بالسياسة.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eلم تكن صورة الدولة العثمانية ثابتةً في الوجدان العربي. ففي القرن التاسع عشر وأوائل العشرين كانت النخبة العربية تتعامل معها بوصفها دولةً إسلامية كبرى يجب الإصلاح فيها لا الانفصال عنها، وكان كثير من المصلحين يرون في التنظيمات والمشروطية أملًا. ثم تغيّر الموقف بعد ١٩٠٨م حين صار الاتحاديون أكثر تشددًا، ثم بعد ١٩١٦م حين دخلت الحركة العربية في صراعٍ معها، فتبلورت سردية «الاستبداد العثماني» في الكتابة المدرسية العربية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي تركيا كانت السردية معاكسة في ظاهرها ومتشابهة في جوهرها. فالدولة الجديدة بنَت شرعيتها على القطيعة مع العثمانيين، وسمّت المرحلة السابقة «الانحلال»، وقدّمت نفسها كبدايةٍ جديدة. ثم تغيّر هذا بعد الثمانينيات، فبدأت العمارة العثمانية تُرمَّم، والوثائق تُنشر، والمسلسلات تُنتج، وتحوّل العثمانيون من «الماضي المتخلف» إلى «الجذر المفقود».\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أنتج هذا التحوّل ظاهرةً فكرية تُسمى «نيو-عثمانية»، وهي في الأصل مصطلحٌ نقدي أطلقه خصوم، ثم صار وصفًا لسياسةٍ خارجية تبحث عن نفوذٍ في المناطق التي كانت عثمانية. وهي في جوهرها ليست استعادةً للإمبراطورية، لأن ذلك مستحيل في نظام الدول، بل محاولة لاستثمار الذاكرة التاريخية في السياسة الحالية. وهذا الاستثمار ينجح في الاقتصاد والثقافة، ويفشل في السياسة، لأن الدول لا تُدار بالذكريات.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي المقابل هناك سردية «الخلافة المفقودة» التي ترى في ١٩٢٤م جرحًا لم يُندمل، وتتعامل مع الدولة العثمانية كرمزٍ لوحدةٍ ضائعة. وهذه السردية عاطفية في أساسها، لكنها تعبّر عن حاجةٍ حقيقية: أن المسلمين فقدوا إطارًا رمزيًّا جامعًا، ولم يجدوا بديلًا. ومع ذلك، فإن تحويل التاريخ إلى حنينٍ يُعطّل التحليل، لأن الدولة العثمانية لم تكن مدينة فاضلة، وكانت فيها ظلمٌ وفسادٌ وقتلٌ وتبعية مالية كما فيها عدلٌ وعمارةٌ وقانون.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما الإرث الحضاري فهو أكثر وضوحًا من الجدل السياسي. فالمدن العثمانية ما زالت قائمة: القسطنطينية بمساجدها وأسواقها، ودمشق بأحيائها وخاناتها، وحلب بأسواقها، وسراييفو بجسرها، والقاهرة بمآذنها العثمانية. والمطبخ العثماني انتشر في البلقان والشام وشمال أفريقيا، والقهوة صارت جزءًا من الحياة اليومية في كل هذه البلاد، والموسيقى العثمانية أثرت في الموسيقى العربية والتركية والبلقانية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي اللغة بقي أثرٌ لا يُمحى. فالعربية أخذت من التركية العثمانية كلماتٍ إدارية مثل «باشا» و«بيك» و«أوضة» و«طابور» و«شنطة»، والتركية أخذت من العربية آلاف الكلمات في الدين والعلم والحياة. والوثائق العربية في المحاكم والشريعة في القرن التاسع عشر مليئةً بالمصطلحات العثمانية، وهذا يدل على أن التأثير لم يكن في السياسة فقط بل في تفاصيل الحياة اليومية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي الأرشيف والبحث التاريخي حدث تحوّل كبير في العقود الأخيرة. فقد فُتحت الوثائق، وتُرجمت دفاتر المحاكم، وكُتبت دراساتٌ عن الفلاحين والنساء والأسواق والأوبئة، فظهرت صورةٌ أكثر تعقيدًا من سردية «سلاطين وحروب». وهذا التحوّل نفسه هو أهم إرثٍ فكري: أن يصبح تاريخ الدولة قابلًا للبحث لا للجدل فقط، وأن يُدرس كمؤسسةٍ بشرية فيها نجاحٌ وفشل، لا كرمزٍ للفخر أو للّوم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالمؤرخ اليوم يضع سؤالًا أخيرًا: هل يمكن أن نتعلّم من هذه التجربة؟ الجواب نعم في ثلاثة أمور. الأول أن الإصلاح بلا حاضنة اجتماعية يُقتل، كما قُتل إصلاح سليم الثالث. والثاني أن الدولة التي لا تُعيد تعريف شرعيتها حين يتغير العالم تُسبق بالأحداث، كما جرى للتنظيمات. والثالث أن التنوع لا يُدار بالشعارات بل بالمؤسسات والقانون، كما فعل نظام الملل في نجاحه، وكما كشف فشله حين تحوّل إلى تمييزٍ قانوني. وهذه الدروس ليست خاصةً بالعثمانيين، بل هي دروس كل دولةٍ كبيرة عاشت طويلًا ثم اضطرّت أن تتغيّر.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eسردية الانحلال ونقدها\u003c/h4\u003e\u003cp class=\"ap\"\u003eسردية الانحلال تقول إن الدولة صعدت في القرن السادس عشر ثم بدأت تنحدر بلا توقف حتى سقطت. وهي سردية مريحة لأنها بسيطة، لكنها غير دقيقة. فالدراسات الحديثة تُظهر أن القرن السابع عشر كان قرن أزمةٍ وإصلاحٍ معًا، وأن القرن الثامن عشر شهد نموًّا اقتصاديًّا في بعض المناطق، وأن التنظيمات أنتجت مؤسساتٍ حديثة حقيقية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالأدق أن يقال إن الدولة لم تكن تنحدر بخطٍّ واحد، بل كانت تُصلح في مكانٍ وتتآكل في مكان. والسقوط لم يكن نتيجة حتمية لتدهورٍ طويل، بل نتيجة حربٍ عالمية خسرتها دولةٌ لم تكن قادرة على المنافسة الصناعية. وهذا الفرق مهم، لأنه يغيّر الدرس المستفاد: من يظن أن السقوط كان قدَرًا لا يتعلّم شيئًا.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالعمارة والمطبخ والموسيقى\u003c/h4\u003e\u003cp class=\"ap\"\u003eالإرث الحضاري أقل إثارةً للجدل من الإرث السياسي، لأنه ملموس. فالقباب والمآذن والأسواق والقناطر ما زالت تُشكّل صورة المدن، والسياح يقفون أمامها بلا سؤالٍ عن السياسة. والمطبخ العثماني انتقل عبر البلقان إلى أوروبا، فصار اللحم المشوي والحلويات والقهوة جزءًا من مطابخ كثيرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالموسيقى العثمانية أنتجت مقاماتٍ وآلاتٍ انتقلت إلى الموسيقى العربية واليونانية والبلغارية. وهذه الأشياء تُبيّن أن التأثير الثقافي لا يسقط بسقوط الدولة، لأنه لا يُدار من مركزٍ واحد، بل يعيش في البيوت والأسواق والمساجد، وهذا هو أطول عمرًا من كل الحكومات.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eماذا يُقرأ لمن يريد أن يفهم؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eمن يريد أن يفهم الدولة العثمانية عليه أن يقرأ الوثائق لا الشعارات. فدفاتر المحاكم تُظهر حياةً معقّدة، والفرمانات تُظهر إدارةً دقيقة، والتقارير تُظهر أزماتٍ حقيقية. أما السرديات الكبرى، سواءٌ التي تُمجّد أو التي تُشوّه، فتُخبر عن صاحبها أكثر مما تُخبر عن الدولة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالمنهج الأفضل هو قراءة أكثر من وجهة نظر: مؤرخ تركي، ومؤرخ عربي، ومؤرخ بلقاني، ومؤرخ أوروبي، ثم الحكم على ما يتقاطع. فالتاريخ ليس محكمةً تُصدر حكمًا نهائيًّا، بل محاولةٌ لفهم كيف عاش الناس وكيف قرّروا، وما الذي كان في إمكانهم وما لم يكن. ولا يكفي أن تُقرأ الوثيقة بلا سياقها، لأن الرقم في الدفتر لا يعني شيئًا إن لم يُعرف من كتبه ولماذا.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسردية الانحلال\u003c/b\u003e\u003cspan\u003eتفسيرٌ مبسّط للسقوط، تنقده الدراسات الحديثة بالأرقام\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eنيو-عثمانية\u003c/b\u003e\u003cspan\u003eاستثمار الذاكرة في السياسة الحالية، لا استعادة الإمبراطورية\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالإرث المادي\u003c/b\u003e\u003cspan\u003eقباب وأسواق وقناطر ومطبخ وموسيقى تعيش بلا دولة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالأرشيف\u003c/b\u003e\u003cspan\u003eحوّل التاريخ من جدالٍ إلى بحث\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمجال\u003c/th\u003e\u003cth\u003eما بقي\u003c/th\u003e\u003cth\u003eكيف يُقرأ\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالعمارة\u003c/td\u003e\u003ctd\u003eمساجد وأسواق وقناطر وجسور\u003c/td\u003e\u003ctd\u003eإرثٌ حضاري بلا جدلٍ سياسي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eاللغة\u003c/td\u003e\u003ctd\u003eمصطلحاتٌ إدارية متبادلة\u003c/td\u003e\u003ctd\u003eأثرٌ يومي أكثر من الأثر الرسمي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالقانون\u003c/td\u003e\u003ctd\u003eمجلة وقانون أراضٍ وقانون تجارة\u003c/td\u003e\u003ctd\u003eأساسٌ للتشريع في دولٍ لاحقة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالذاكرة\u003c/td\u003e\u003ctd\u003eسردياتٌ متعارضة\u003c/td\u003e\u003ctd\u003eتُقاس بموقع صاحبها أكثر من الوثيقة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003e«التاريخ لا يُورَث كما هو، بل يُقرأ كما نحن»\u003c/p\u003e\u003ccite\u003eمن مقدمة إحدى الدراسات العربية الحديثة في التاريخ العثماني\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eتُذكر الدولة العثمانية اليوم بين سردية انحلالٍ وسردية خلافةٍ مفقودة، وكلتاهما سياسية أكثر منها تاريخية. أما الإرث المادي والفكري فأكثر وضوحًا: مدنٌ وقبابٌ ومطبخٌ وموسيقى وقانونٌ وأرشيف. والدرس الأهم أن تُقرأ كمؤسسةٍ بشرية فيها نجاحٌ وفشل، لا كرمزٍ للفخر أو اللوم.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"f","one":true,"id":"people","n":"أهم الشخصيات","ic":"","part":"","h":"\u003csection class=\"rsec\"\u003e\n      \u003ch2 class=\"sec\"\u003eأهم الشخصيات\u003c/h2\u003e\n      \u003cdiv class=\"people\"\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eعثمان بن أرطغرل\u003c/b\u003e\u003cspan\u003eمؤسس الإمارة العثمانية في سوغوت، وأول من وسّعها على حساب بيزنطة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eأورخان غازي\u003c/b\u003e\u003cspan\u003eحوّل الإمارة إلى دولة: جيشٌ دائم ونقودٌ ومدارس وعاصمة في بورصة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eمحمد الفاتح\u003c/b\u003e\u003cspan\u003eفتح القسطنطينية سنة ١٤٥٣م، وبنى قانون الدولة الإمبراطورية.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eسليم الأول\u003c/b\u003e\u003cspan\u003eكسر الصفويين في جالديران، وأنهى المماليك في مرج دابق والريدانية.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eسليمان القانوني\u003c/b\u003e\u003cspan\u003eحكم من ١٥٢٠م إلى ١٥٦٦م، وفي عهده بلغت الدولة أقصى اتساعها.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eسنان المعماري\u003c/b\u003e\u003cspan\u003eرئيس المعماريين خمسين سنة، ومن أعماله جامع السليمانية والسليمية.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eصقوللي محمد باشا\u003c/b\u003e\u003cspan\u003eصدرٌ أعظم أدار الدولة بعد ليبانتو، وصاغ معاهداتها مع أوروبا.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eمصطفى كمال\u003c/b\u003e\u003cspan\u003eقاد حرب الاستقلال، وأُلغي في عهده السلطنة ثم الخلافة.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\n    \u003c/section\u003e"},{"u":"f","one":true,"id":"outcomes","n":"النتائج والآثار","ic":"","part":"","h":"\u003csection class=\"rsec\"\u003e\n      \u003ch2 class=\"sec\"\u003eالنتائج والآثار\u003c/h2\u003e\n      \u003cul class=\"outs\"\u003e\u003cli\u003eحكمت الدولة ثلاث قارات ستة قرون، ونقلت مركز الثقل في العالم الإسلامي إلى البوسفور.\u003c/li\u003e\u003cli\u003eحمت الحرمين وكست الكعبة، وأدارت طريق الحج بجيشٍ وأوقافٍ ومحطات ماء.\u003c/li\u003e\u003cli\u003eأنهت الإمبراطورية البيزنطية، وأعادت تعريف العلاقة بين الدولة والكنيسة والطوائف.\u003c/li\u003e\u003cli\u003eأوقفت الزحف الأوروبي عند فيينا، ثم انحسرت حدودها في البلقان على مدى قرنين.\u003c/li\u003e\u003cli\u003eتركت قانونًا مدوّنًا وأرشيفًا هائلًا ومدنًا وقبابًا ما زالت قائمة إلى اليوم.\u003c/li\u003e\u003c/ul\u003e\n    \u003c/section\u003e"},{"u":"f","one":true,"id":"sources","n":"المصادر والمراجع","ic":"","part":"","h":"\u003cdiv class=\"src frame\" style=\"--c:#2F4F4F\"\u003e\n    \u003cspan class=\"crn tl\"\u003e\u003csvg viewBox=\"0 0 26 26\"\u003e\n\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\"/\u003e\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\" transform=\"rotate(90 13 13)\" opacity=\".5\"/\u003e\u003c/svg\u003e\u003c/span\u003e\u003cspan class=\"crn tr\"\u003e\u003csvg viewBox=\"0 0 26 26\"\u003e\n\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\"/\u003e\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\" transform=\"rotate(90 13 13)\" opacity=\".5\"/\u003e\u003c/svg\u003e\u003c/span\u003e\u003cspan class=\"crn bl\"\u003e\u003csvg viewBox=\"0 0 26 26\"\u003e\n\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\"/\u003e\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\" transform=\"rotate(90 13 13)\" opacity=\".5\"/\u003e\u003c/svg\u003e\u003c/span\u003e\u003cspan class=\"crn br\"\u003e\u003csvg viewBox=\"0 0 26 26\"\u003e\n\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\"/\u003e\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\" transform=\"rotate(90 13 13)\" opacity=\".5\"/\u003e\u003c/svg\u003e\u003c/span\u003e\n    \u003ch2 class=\"sec\" style=\"margin-top:0\"\u003eالمصادر والمراجع\u003c/h2\u003e\n    \u003cul\u003e\u003cli\u003e\u003ccite\u003eمحمد فريد بك\u003c/cite\u003e — تاريخ الدولة العلية العثمانية (السلاطين والتنظيمات الإدارية في القرنين التاسع عشر والعشرين)\u003c/li\u003e\u003cli\u003e\u003ccite\u003eخليل إينالجيك\u003c/cite\u003e — الدولة العثمانية في عصرها الكلاسيكي (الإدارة والاقتصاد والمجتمع في القرنين الخامس عشر والسادس عشر)\u003c/li\u003e\u003cli\u003e\u003ccite\u003eستانفورد شو وإيزل كورال شو\u003c/cite\u003e — تاريخ الدولة العثمانية وتركيا الحديثة (التحول من الإمبراطورية إلى الجمهورية)\u003c/li\u003e\u003cli\u003e\u003ccite\u003eجورج أنطونيوس\u003c/cite\u003e — يقظة العرب (البلاد العربية في أواخر العهد العثماني)\u003c/li\u003e\u003c/ul\u003e\n  \u003c/div\u003e"},{"u":"f","one":true,"id":"pager","n":"الحقب الأخرى","ic":"","part":"","h":"\u003cnav class=\"pager\"\u003e\n    \u003ca class=\"prev\" href=\"mamluk.html\"\u003e\u003csmall\u003e← الحقبة السابقة\u003c/small\u003e\u003cb\u003e🐎 المماليك وعالم الشرق\u003c/b\u003e\u003c/a\u003e\n    \u003ca class=\"next\" href=\"civilization.html\"\u003e\u003csmall\u003eالحقبة التالية →\u003c/small\u003e\u003cb\u003e🔬 الحضارة الإسلامية والعلوم\u003c/b\u003e\u003c/a\u003e\n  \u003c/nav\u003e"}]}</script>
<script>
/* ===== موسوعة تاريخ الإسلام — منطق الواجهة + قارئ الكتاب =====
   يعمل على صفحات «الكتاب» (التي تحمل <script id="book">) وبقية الصفحات كما هي. */

/* هل هذه صفحة قارئ؟ يُحدَّد قبل أي تهيئة */
window.__READER__ = !!document.getElementById('book');

(function () {
  'use strict';
  var STORE = 'ti_bookmarks', THEME = 'ti_theme', PROG = 'ti_progress';

  /* ---------- تحويل الأرقام إلى هندية (وقت التشغيل) ---------- */
  function arDigits(s) {
    return String(s == null ? '' : s).replace(/\d/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'[d]; });
  }
  window.arDigits = arDigits;

  /* ---------- الوضع الليلي ---------- */
  function applyTheme(d) {
    document.body.classList.toggle('dark', d);
    var b = document.getElementById('themeBtn');
    if (b) b.textContent = d ? '☀️' : '🌙';
  }
  var th = document.getElementById('themeBtn');
  if (th) th.addEventListener('click', function () {
    var d = !document.body.classList.contains('dark');
    applyTheme(d); localStorage.setItem(THEME, d ? '1' : '0');
  });
  applyTheme(localStorage.getItem(THEME) === '1');

  /* ---------- التقدّم: مشترك بين التمرير والقارئ ---------- */
  function setProgress(id, frac) {
    if (!id || id === 'home') return;
    var pr = JSON.parse(localStorage.getItem(PROG) || '{}');
    if ((pr[id] || 0) < frac) { pr[id] = frac; localStorage.setItem(PROG, JSON.stringify(pr)); }
    if (frac > 0.92) {
      var bm = JSON.parse(localStorage.getItem(STORE) || '[]');
      if (bm.indexOf(id) < 0) {
        bm.push(id); localStorage.setItem(STORE, JSON.stringify(bm));
        if (window.refreshBadges) window.refreshBadges();
      }
    }
  }
  window.__setProgress = setProgress;

  var domeFill = document.querySelector('.dome .fill');
  var topBar = document.querySelector('.topbar i');
  var swordBl = document.querySelector('.sword .bl');
  var swordTx = document.querySelector('.sword span');

  function paintProgress(pct) {
    if (domeFill) domeFill.style.opacity = (0.12 + pct * 0.88).toFixed(2);
    if (topBar) topBar.style.width = Math.round(pct * 100) + '%';
    if (swordBl) swordBl.style.clipPath = 'inset(0 ' + (100 - pct * 100) + '% 0 0)';
    if (swordTx) swordTx.textContent = 'القراءة ' + arDigits(Math.round(pct * 100)) + '٪';
  }
  window.__paintProgress = paintProgress;

  /* ---------- نظام الأوسمة ---------- */
  var BADGES = [
    { id: 'start', ic: '🌱', n: 'نَبتُ الطريق', d: 'ابدأ أول حقبة' },
    { id: 'prophets', ic: '📜', n: 'وسام النبوة', d: 'أنبياء' },
    { id: 'seerah', ic: '🕊️', n: 'وسام الرحمة', d: 'السيرة' },
    { id: 'rashidun', ic: '⚔️', n: 'وسام الفاروق', d: 'الراشدون' },
    { id: 'umayyad', ic: '🏛️', n: 'وسام البناء', d: 'الأمويه' },
    { id: 'andalus', ic: '🏰', n: 'وسام الأندلس', d: 'الأندلس' },
    { id: 'abbasid', ic: '📚', n: 'وسام الفجر', d: 'العباسيه' },
    { id: 'crusades', ic: '🛡️', n: 'وسام حطين', d: 'الصليبيون' },
    { id: 'mamluk', ic: '🐎', n: 'وسام النصر', d: 'المماليك' },
    { id: 'ottoman', ic: '🕌', n: 'وسام السلطان', d: 'العثمانيون' },
    { id: 'civilization', ic: '🔬', n: 'وسام العقل', d: 'الحضاره' },
    { id: 'modern', ic: '🕰️', n: 'وسام التاريخ', d: 'العصر الحديث' },
    { id: 'all', ic: '👑', n: 'تاج المؤرخ', d: 'كل الحقب' }
  ];
  window.refreshBadges = function () {
    var bm = JSON.parse(localStorage.getItem(STORE) || '[]');
    var host = document.getElementById('badges');
    if (!host) return;
    var done = BADGES.filter(function (b) {
      return b.id === 'start' ? bm.length >= 1
        : b.id === 'all' ? bm.length >= 12 : bm.indexOf(b.id) >= 0;
    }).map(function (b) { return b.id; });
    var pct = Math.round(done.length / BADGES.length * 100);
    document.querySelectorAll('#badges .bg').forEach(function (el) {
      el.classList.toggle('on', done.indexOf(el.dataset.b) >= 0);
    });
    var c = document.getElementById('bcnt');
    if (c) c.textContent = arDigits(done.length) + ' من ' + arDigits(BADGES.length);
    var pb = document.getElementById('bprog');
    if (pb) pb.style.width = pct + '%';
  };
  window.refreshBadges();

  /* ---------- إخفاء المفضلة ---------- */
  var f = document.getElementById('favBtn');
  if (f) {
    f.textContent = JSON.parse(localStorage.getItem(STORE) || '[]')
      .indexOf(document.body.dataset.page) >= 0 ? '★' : '☆';
    f.addEventListener('click', function () {
      var id = document.body.dataset.page;
      var bm = JSON.parse(localStorage.getItem(STORE) || '[]');
      var i = bm.indexOf(id);
      i >= 0 ? bm.splice(i, 1) : bm.push(id);
      localStorage.setItem(STORE, JSON.stringify(bm));
      f.textContent = i >= 0 ? '☆' : '★';
    });
  }
})();


/* ==========================================================
   قارئ الكتاب — تقسيم المحتوى إلى صفحات بلا تمرير عمودي
   ========================================================== */
(function () {
  'use strict';
  var dataEl = document.getElementById('book');
  if (!dataEl) return;

  var BOOK;
  try { BOOK = JSON.parse(dataEl.textContent); } catch (e) { return; }

  var PGID = BOOK.id;
  var PADX = 20, PADY = 12, FOOT = 26, GAP = 12;
  var SPREAD = false;   /* وضع الكتاب المفتوح (صفحتان متقابلتان) — يُفعَّل لاحقًا */
  var R = {
    cur: 0, total: 0, pages: [], units: [], chaps: [],
