 والأوروبيين.\u003c/p\u003e\u003cp class=\"ap\"\u003eوهذا الفارق مهم لفهم التاريخ الحديث: كثير من الجدل المعاصر حول «الخلافة العثمانية» بُني على قراءةٍ متأخرة، بينما الوثائق تقول إن الدولة كانت تُدار بمنطق السلطنة والقانون، لا بمنطق الخلافة والبيعة. واللقب الذي كان يُهمّ السلطان في مراسلاته مع أوروبا كان «ملك الشرق والغرب» أو «قيصر الروم»، لا «خليفة المسلمين».\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالديوان\u003c/b\u003e\u003cspan\u003eأربعة أيام في الأسبوع، وفيه الصدر الأعظم وقاضي العسكر والدفتردار\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eدفتر المهمّات\u003c/b\u003e\u003cspan\u003eسجلٌ رسمي لكل قرار، بقي منه آلاف المجلدات كمصدر تاريخي\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eطوب قابي\u003c/b\u003e\u003cspan\u003eثلاثة أفنية تفصل العامة عن الديوان عن الخاصة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eدائرة العدل\u003c/b\u003e\u003cspan\u003eنظرية الحكم: رجالٌ بالمال، ومالٌ بالعمارة، وعمارةٌ بالعدل\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمنصب\u003c/th\u003e\u003cth\u003eالمهمة\u003c/th\u003e\u003cth\u003eملاحظة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالصدر الأعظم\u003c/td\u003e\u003ctd\u003eرئاسة الوزراء وقيادة الجيش والإشراف على المال\u003c/td\u003e\u003ctd\u003eقد يجمع السلطة كلها في ضعف السلاطين\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eقاضي العسكر\u003c/td\u003e\u003ctd\u003eالإشراف القضائي على الجيش والولايات\u003c/td\u003e\u003ctd\u003eدرجةٌ عليا في سلك العلماء\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالدفتردار\u003c/td\u003e\u003ctd\u003eالخزانة والضرائب والحسابات\u003c/td\u003e\u003ctd\u003eعمود القدرة المالية للدولة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالنيشانجي\u003c/td\u003e\u003ctd\u003eصياغة الفرمانات وتوقيع الطغراء\u003c/td\u003e\u003ctd\u003eحافظ قانون الدولة في الوثائق\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eشيخ الإسلام\u003c/td\u003e\u003ctd\u003eالفتوى والإشراف على المؤسسات الدينية\u003c/td\u003e\u003ctd\u003eسلطةٌ معنوية تُقيّد القرار السياسي\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003e«لا ملك إلا بالرجال، ولا رجال إلا بالمال، ولا مال إلا بالعمارة، ولا عمارة إلا بالعدل»\u003c/p\u003e\u003ccite\u003eدائرة العدل كما ترد في كتب السياسة العثمانية المترجمة عن الفارسية\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eحكمت الدولة بسلطانٍ مطلق نظريًّا ومؤسساتٍ مقيّدة عمليًّا: قصرٌ وديوانٌ وبيروقراطيةٌ تحفظ كل شيء في دفاتر. وكانت شرعيته من الغزو والعدل والخلافة، لكن الحدود الحقيقية لسلطته كانت الإنكشارية والعلماء والقانون. وهذا التوازن أعطى الدولة مرونةً نادرة، لكنه جعل إصلاحها لاحقًا معركةً ضد نفسها.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"army-timar","n":"الإنكشارية والتيمار","ic":"⚔️","part":"القسم الثاني: النظام","h":"\u003carticle class=\"ch3\" id=\"army-timar\" data-toc=\"الإنكشارية والتيمار\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٢.٢\u003c/span\u003e\n          \u003ch3\u003e⚔️ الإنكشارية والتيمار\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eق\u003c/span\u003eامت الدولة على جيشين: جيشٌ مدفوع الأجر يعيش في الثكنات، وجيشٌ إقطاعي يعيش على الأرض. هذا الفصل يشرح كيف بُنيا، وكيف صارا أقوى من الدولة نفسها، ثم كيف دُمّرا معًا.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان للدولة العثمانية جيشان لا جيش واحد، وهذا سرّ قوّتها في البداية وسرّ انهيارها في النهاية. الجيش الأول هو «القابي قولي»، أي عبيد الباب، وهم فرقٌ نظامية تُدفع لها رواتب من الخزانة، وتُدرَّب دائمًا، وتقيم في ثكناتٍ في العاصمة. والجيش الثاني هو «الإيالة»، أي فرسان التيمار، وهم مقاتلون يعيشون في الأقاليم، يمنحهم السلطان حقّ جمع دخل أرضٍ معيّنة مقابل أن يأتوا عند النداء بخيولهم وسلاحهم ورجالهم. الأول جيشٌ ملكي مركزي، والثاني جيشٌ إقطاعي محلي، والجمع بينهما هو ما مكّن الدولة من حربٍ طويلة في أوروبا وآسيا في الوقت نفسه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما تغذية الجيش الأول فكانت من نظام «الدوشرمة». فكل بضع سنوات تُرسل لجنةٌ إلى قرى البلقان المسيحية لتختار صبيةً في سنٍّ محددة، تُأخذ منهم نسبةٌ معروفة، ويُفحص كل صبيٍّ جسميًّا ولغويًّا، ثم يُوزَّع الناجون على أسرٍ تركية في الأناضول ليتعلموا اللغة والعادات، ثم يدخلون ثكنة الإنكشارية أو مدرسة القصر. ولم يكن هذا النظام عشوائيًّا: كان له قانونٌ يحدّد من يُستثنى (المتزوج، وابن الراعي الوحيد، وساكن المدينة)، ويحدّد عدد المأخوذين، ويُسجّل الأسماء. وقد أنتج وزراء وقادةً عظامًا، لكنه في جوهره كان انتزاعًا للأطفال من أسرهم، ولا يصحّ تلطيفه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت الإنكشارية في بدايتها جماعةً شبه دينية. لهم ثكنةٌ تُسمّى «الغرفة»، ولكل غرفةٍ قدرٌ كبير تُطبخ فيه الحساء، ورمزهم هو القدر، وضبّاطهم أسماءُ مطبخ: الطبّاخ، وحامل القدر، وصبّ الحساء. وكانوا يُمنعون من الزواج في أول عهدهم، ويلتزمون بطاعةٍ مطلقة للسلطان، ويُحرَّم عليهم العمل في التجارة. وكان هذا الانضباط هو ما جعلهم أعظم مشاةٍ في أوروبا قرنين: يقفون في وجه الفرسان، ويحملون الحصار، ولا يفرّون.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما التيمار فكان نظامًا اقتصاديًّا بقدر ما كان عسكريًّا. فالأرض المفتوحة تُسجَّل في «دفتر التحرير» مع عدد بيوتها ومحاصيلها، ثم تُقسَّم إلى وحدات: التيمار الصغير لدخلٍ محدود، والزعامة لدخلٍ أكبر، والخاصّ لأعلى المراتب. ويُمنح الفارس «حقّ الجباية» لا ملكية الأرض، فيأخذ منها ما يكفيه ويعيش، ويقدّم في المقابل جنديًّا مسلّحًا لكل مبلغٍ محدد. وهكذا لا تدفع الخزانة شيئًا لجيشٍ كامل، ولا يحتاج الفلاح إلى رحلةٍ إلى العاصمة ليدفع ضريبته، ويبقى الجندي في أرضه يعرفها ويدافع عنها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان النظامان يعملان معًا بتناغمٍ في القرن الخامس عشر والسادس عشر. فالإنكشارية والمدفعية تكسر خطّ العدو، وفرسان التيمار يطاردون الفلول ويحمون الأجنحة، والأسطول ينقل الجيش ويحمي السواحل. وبهذا المزيج انتصر العثمانيون في شالديران ومرج دابق والريدانية وبغداد وبريفيزا، ووصلوا إلى أبواب فيينا. وكانت كلفة الحرب أقلّ بكثير من كلفتها عند خصومهم، لأن جزءًا كبيرًا من الجيش كان يُموّل نفسه من الأرض لا من الخزانة.\u003c/p\u003e\u003cp class=\"ap\"\u003eلكن النظام حمل في داخله بذور فساده. فمع توقف الفتوح في القرن السابع عشر، لم تبقَ أرضٌ جديدة تُوزَّع، فبدأت التيمارات تُمنح بالشفاعة والرشوة، وبدأ أصحابها يقطعون الأرض بلا خدمة، وبدأ الجباة يظلمون الفلاح حتى هجر الأرض. وفي الوقت نفسه تضخّم عدد الإنكشارية من بضعة آلاف إلى عشرات الآلاف، ودخلها أبناء التجار والحرفيين بالرشوة، وصاروا يشتغلون في الأسواق ويمارسون التجارة، وتزوجوا، وربطوا مصالحهم بالمدينة لا بالثكنة. فصار الجيش الذي كان يحمي الدولة قوةً داخلية تبتزّها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت النتيجة انفجارًا اجتماعيًّا في الأناضول عُرف بثورات «الجلالية» بين أواخر القرن السادس عشر وأوائل السابع عشر. فقد خرج آلاف الفلاحين والجنود المفصولين عن الأرض حاملين السلاح، ونهبوا المدن، وأحرقوا القرى، وأجبروا الدولة على تحويل جيوشها من الجبهات الخارجية إلى الداخل. وهذه الثورات هي التي جعلت الدولة تتخلى تدريجيًّا عن نظام التيمار وتتحوّل إلى «التزام» الضرائب: أن يُبيع حقّ الجباية لمُلتزمٍ يدفع مقدمًا، وهو نظامٌ أنقذ الخزانة على المدى القصير وأفقر الفلاح على المدى الطويل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سنة ١٨٢٦م انتهت القصة نهايةً دموية. كان السلطان محمود الثاني قد قرّر بناء جيشٍ حديث على النمط الأوروبي، فعلمت الإنكشارية وأثارت عصيانًا في العاصمة. فحاصرها السلطان بقواته الموالية، وضربها بالمدافع في ثكناتها، فقتل الآلاف وأحرق الثكنة، وسُمّيت الحادثة «الحادثة الخيرة». وكانت هذه ضربةً قاضيةً لجيشٍ كان أعظم جيوش أوروبا، لكنه صار عقبةً أمام أي إصلاح. وقد أدرك السلطان أنه لا يمكن إصلاح دولةٍ بجيشٍ يملك حقّ الاعتراض على إصلاحها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما الأسطول فقد كان القصة الموازية. فالدولة بنَت ترسانةً كبيرة في العاصمة، واعتمدت في البداية على المجدّفين، ثم على أسطولٍ من السفن الشراعية الثقيلة. وفي القرن السادس عشر دخل عليها خبراء من شمال أفريقيا، وعلى رأسهم خير الدين بربروس الذي صار قائدًا للأسطول، فتحوّل البحر المتوسط إلى ساحةٍ عثمانية، وانتصرت الدولة في بريفيزا سنة ١٥٣٨م. لكن الأسطول انهار في ليبانتو سنة ١٥٧١م، ثم أُعيد بناؤه في أقل من سنة، وهذه هي المفارقة: أن الدولة كانت قادرة على تعويض السفن لأنها تملك ترسانةً وصناعةً، لا لأنها تملك بحّارة.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالدوشرمة: كيف صُنع جيش من لا نسب لهم\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الهدف من الدوشرمة سياسيًّا قبل أن يكون عسكريًّا. فالدولة أرادت نخبةً لا تنتمي إلى قبيلة ولا عائلة ولا طبقة، فلا يكون لها ولاءٌ إلا للسلطان. ولهذا كانت تُبعد المأخوذين عن بلدهم، وتغيّر أسماءهم، وتُدخلهم في دينٍ جديد، وتمنعهم من الزواج مبكّرًا. والنتيجة أن رجلًا مثل محمد الفاتح أو سليمان القانوني كان يجلس في ديوانه وليس أمامه رجلٌ يقول «أنا ابن فلان»، بل رجالٌ يقولون «أنا عبد السلطان».\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أثبت النظام فعاليته قرنين، ثم انقلب على نفسه. فحين ضعفت الدولة صار الدوشرمة بابًا للرشوة: تُدفع المال ليتخطّى الصبي الفحص، أو ليُعفى، أو ليُقبل في القصر بدلًا من الثكنة. ودخل في السلك من ليس أهلًا له، وتحوّل الامتياز إلى تجارة، ثم أُلغي النظام في القرن السابع عشر عمليًّا، وحلّ محلّه التجنيد من أبناء الإنكشارية أنفسهم، فصار السلك وراثيًّا، وهكذا ماتت الفكرة الأصلية ببطء.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالتيمار: الأرض مقابل السيف\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان التيمار أذكى حلٍّ مالي وجدته الدولة لمشكلة الجيش. فبدلًا من أن تجمع الضرائب في العاصمة ثم تعيد توزيعها رواتب، جعلت الجندي يجمعها مباشرةً من الأرض التي يحميها. وهذا وفّر كلفة النقل والإدارة، وربط الجندي بالأرض، وجعل الفلاح يعرف من يحميه ويعرف من يظلمه. وكان للفلاح حقّ الشكوى عند القاضي إن تجاوز صاحب التيمار حدّه، وقد وصلت إلينا آلاف الشكاوى من هذا النوع، وهي دليل على أن النظام كان له قضاءٌ يعمل لا مجرّد نظرية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان انهياره نتيجةً لسببين متشابكين: توقف الفتوح، وارتفاع قيمة السلاح. فحين لم تبقَ أرضٌ جديدة، لم يبقَ ما يُوزَّع، فضعف الحافز على الخدمة. وحين صارت الحرب تعتمد على المشاة والمدفعية بدل الفرسان، صار الفارس الإقطاعي عبئًا أكثر منه نفعًا. وهكذا مات النظام لا لأنه ظالم، بل لأنه لم يعد ملائمًا لتقنية الحرب الجديدة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالأسطول: من المجدّفين إلى البحرية\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان البحر المتوسط في القرن السادس عشر ساحة صراعٍ ثلاثية: العثمانيون، والهابسبورغ، والبندقية. وقد فهم العثمانيون أن السيطرة على السواحل لا تُحفظ بالحصون بل بالأسطول، فبنوا ترسانةً ضخمة، واستعانوا بخبراء من المغرب وتونس والجزائر، وأدخلوا السفن الكبيرة المسلّحة بالمدافع. وكان انتصار بريفيزا سنة ١٥٣٨م علامةً على تحوّل التوازن، حتى قيل إن البحر صار عثمانيًّا.\u003c/p\u003e\u003cp class=\"ap\"\u003eلكن البحر لا يُحكم بالانتصارات فقط. فبعد ليبانتو سنة ١٥٧١م أدركت الدولة أن أسطولها لم يعد قادرًا على مواجهة أساطيل أوروبا الموحّدة، فتحوّلت إلى استراتيجيةٍ أخرى: السيطرة على الموانئ والسواحل، ودعم إمارات شمال أفريقيا، وترك البحر المفتوح للأوروبيين تدريجيًّا. وهذا التحوّل من الهجوم إلى الدفاع في البحر هو أول علامةٍ على أن الدولة بدأت تتخلى عن كونها قوةً عالمية إلى كونها قوةً إقليمية.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالقابي قولي\u003c/b\u003e\u003cspan\u003eجيش السلطان المركزي المدفوع من الخزانة، ومنه الإنكشارية\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالدوشرمة\u003c/b\u003e\u003cspan\u003eانتقاء صبية من البلقان وتربيتهم في ثكنات السلطان\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالتيمار\u003c/b\u003e\u003cspan\u003eحقّ جباية أرض مقابل خدمة عسكرية، بلا ملكية للرقبة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003e١٨٢٦م\u003c/b\u003e\u003cspan\u003eالحادثة الخيرة: ضرب الإنكشارية بالمدافع وإلغاء سلاحها\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالنظام\u003c/th\u003e\u003cth\u003eالمصدر\u003c/th\u003e\u003cth\u003eسبب الانهيار\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالإنكشارية\u003c/td\u003e\u003ctd\u003eالدوشرمة ثم الوراثة\u003c/td\u003e\u003ctd\u003eالرشوة والتجارة والتضخّم العددي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالتيمار\u003c/td\u003e\u003ctd\u003eالأرض المفتوحة ودفتر التحرير\u003c/td\u003e\u003ctd\u003eتوقف الفتوح وتغيّر تقنية الحرب\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالالتزام\u003c/td\u003e\u003ctd\u003eبيع حقّ الجباية للملتزمين\u003c/td\u003e\u003ctd\u003eإفقار الفلاح وهجرة الأرض\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالأسطول\u003c/td\u003e\u003ctd\u003eالترسانة وخبراء شمال أفريقيا\u003c/td\u003e\u003ctd\u003eتفوّق أوروبا التقني بعد القرن السابع عشر\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003e«الجيش الذي يشتكي من راتبه لا يقاتل، والجيش الذي يتاجر لا يحاصر»\u003c/p\u003e\u003ccite\u003eمن تقارير الإصلاح العثمانية في القرن الثامن عشر\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eقامت قوة الدولة على جيشين متكاملين: إنكشارية مدفوعة الأجر وتيمار إقطاعي، فكانت تحارب على جبهتين بكلفةٍ منخفضة. ثم توقف الفتوح فتضخّم الجيش وفسد نظام الأرض، فصارت الإنكشارية قوةً تبتزّ الدولة، والتيمار عبئًا على الفلاح. وانتهى الأمر بالحادثة الخيرة سنة ١٨٢٦م: أن تُدمَّر أعظم مؤسسة عسكرية بيد الدولة نفسها.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"justice-madhhab","n":"القضاء والمذاهب","ic":"⚖️","part":"القسم الثاني: النظام","h":"\u003carticle class=\"ch3\" id=\"justice-madhhab\" data-toc=\"القضاء والمذاهب\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٢.٣\u003c/span\u003e\n          \u003ch3\u003e⚖️ القضاء والمذاهب\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eك\u003c/span\u003eان القاضي في الدولة العثمانية أكثر من حَكَمٍ في خصومة: كان مسؤولًا عن السوق والوقف والوصاية والأيتام. وهذا الفصل يقرأ كيف عمل القضاء، وكيف تعايشت المذاهب الأربعة تحت سلطة قانونٍ واحد.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان القضاء هو العمود الذي قامت عليه شرعية الدولة عند رعاياها، أكثر من الجيش وأكثر من الخلافة. فالمزارع الذي يشتكي من جابٍ ظالم لا يذهب إلى الوالي بل إلى القاضي، والتاجر الذي أخلّ بوزنٍ لا يُعاقبه الجيش بل المحتسب بإشراف القاضي، والزوجة التي تطلب الطلاق لا تلجأ إلى شيخٍ بل إلى محكمة. وكان القاضي يُعيّن من العاصمة، ويُدفع له راتبٌ من الخزانة، ويُراقب من فوقه، ويُعزل إن ثبت ظلمه. وهذا الفصل بين الولاية الإدارية والقضاء — ولو لم يكن كاملًا — كان من أهم ما ميّز الدولة عن الإمارات التي سبقتها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان القاضي يجلس في محكمةٍ داخل المدينة، ويحكم في كل شيء: العقود والديون والزواج والطلاق والميراث والوقف والجنايات والحدود. وكان يسجّل كل قضيةٍ في «السجل» مع أسماء الشهود وتاريخ الجلسة. وقد وصلت إلينا سجلات محاكم مدنٍ كثيرة، وهي من أغرب المصادر التاريخية: فيها بيع بيوت، وشكاوى من نساءٍ ضد أزواجهن، وعقود شراكةٍ بين مسلمٍ ومسيحي، ودعاوى على جنودٍ تعدّوا على بساتين، وقضايا وقفٍ على إمام مسجد. وهي تُظهر مجتمعًا حيًّا معقّدًا لا يشبه الصورة النمطية عن «دولة سيف».\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان فوق القاضي درجاتٌ أعلى: «قاضي العسكر» في الأناضول والروملي، ثم «شيخ الإسلام» في العاصمة وهو أعلى مرجعٍ ديني. وكان الشيخ يُصدر «الفتوى» وهي رأيٌ شرعي غير ملزمٍ قانونيًّا لكنه ذو ثقلٍ هائل، لأن القاضي في المحكمة قد يستند إليه، والسلطان نفسه قد يتراجع أمامه. وكانت الفتاوى تُجمع في مجموعاتٍ مرتبة، وأشهرها فتاوى أبي السعود العمادي في القرن السادس عشر، وهي التي وفّقت بين قانون السلطان وفقه المذهب الحنفي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما القانون فكان له مصدران: الشريعة، وهي الفقه المستنبط من النصوص، و«القانون» وهو تشريعٌ يصدره السلطان في مسائل لا نصّ فيها أو في تنظيمٍ إداري. وقد وُضع أول «قانون نامه» منظّم في عهد محمد الفاتح، ثم توسّع في عهد سليمان حتى لُقّب «القانوني». ولم يكن هذا القانون بديلًا عن الشريعة بل مكمّلًا لها: يُنظّم الضرائب والمراتب والجزاءات التعزيرية وأمور الأرض، بينما تُترك المسائل الشخصية والعبادات للفقه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت الدولة حنفية المذهب رسميًّا: القضاة يُدرَّسون الفقه الحنفي، والفتوى الرسمية حنفية، والمدارس تُموّل على هذا الأساس. لكن هذا لم يكن يعني إلغاء المذاهب الأخرى، بل كان يعني أن الحنفي هو مذهب الدولة، وأن الشافعي والمالكي والحنبلي يُعترف بهم في العبادات الشخصية. وكان في القاهرة والأندلس والشام والمغرب من يتبع مذاهبه، وكان القاضي الحنفي يستشير المفتي الشافعي في مسائل معيّنة. وهذا التعايش المذهبي داخل دولةٍ واحدة كان من أهم أسباب قدرة الدولة على الحكم في مناطق متباعدة الأعراف.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان العلم مهنةً لها سلّمٌ واضح. يبدأ الطالب في «المدرسة» ثم يصير «معيدًا» ثم «مدرسًا» ثم يترقّى في الدرجات حتى يصل إلى مناصب القضاء الكبرى. وكان هذا السلك يُسمّى «الإلمية»، أي سلك العلم، وكان له مراتبه ورواتبه وإجازاته. وكان أبناء العلماء يجدون فيه مكانًا أسهل من غيرهم، فتشكّلت طبقةٌ علمية لها تقاليدها ولغتها وعصبيتها، وكانت في القرن السابع عشر من أقوى القوى التي تعطّل الإصلاح، لأن كل تغييرٍ يُهدّد مكانتها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان أخطر تحدٍّ للقضاء جاء من الخارج: الامتيازات الأجنبية. فمنذ القرن السادس عشر مُنحت دولٌ أوروبية حقّ محاكمة رعاياها أمام قناصلها لا أمام القاضي العثماني، ثم توسّع هذا الحقّ بالتدريج حتى صار يشمل «الحماية» لغير الأوروبيين أيضًا. وفي القرن التاسع عشر صارت المحاكم القنصلية تنظر في قضايا تجارية ضخمة، فانتُزع من القضاء الوطني جزءٌ من سيادته. وهذه الثغرة، التي بدأت كامتيازٍ تجاري صغير، صارت أحد الأسباب الاقتصادية للانهيار.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت هناك مشكلة أخرى هي الجمود. فبعد القرن السادس عشر أُغلق باب الاجتهاد عمليًّا، وصار التعليم الفقهي نقلًا للمتون لا بحثًا في المسائل الجديدة، وواجه العلماء أسئلةً لم تكن في كتب الأقدمين: الطباعة، والسكة الورقية، والسكك الحديدية، والتلغراف، والشركات المساهمة. وكانت الفتاوى في هذه المسائل حذرةً ومتأخرة، فتراكمت فجوةٌ بين الواقع والقانون. وفي المقابل كان السلطان يستعمل «القانون» لتجاوز الجمود، فيُنشئ محاكم جديدة ويُصدر تنظيماتٍ بلا انتظار الفتوى، وهكذا انقسم النظام القضائي تدريجيًّا إلى قسمين.\u003c/p\u003e\u003cp class=\"ap\"\u003eوإذا قارنّا هذا بالغرب في القرن السابع عشر، نجد أن أوروبا كانت تعيش ثورةً في القانون: عودة إلى القانون الروماني، وتدوين، وحركة «القانون الطبيعي»، ومحاكم تجارية. أما الدولة العثمانية فكان عندها قانونٌ متطوّر في زمانه، لكنه لم يُدوَّن في صيغةٍ حديثة إلا متأخرًا جدًّا في «مجلة الأحكام العدلية» سنة ١٨٧٦م. وهذا التأخر في التدوين هو ما جعل التحديث القانوني في القرن التاسع عشر يبدو كأنه استيرادٌ من الخارج لا تطويرٌ من الداخل.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالقاضي في المدينة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان القاضي في المدينة العثمانية أقرب إلى مديرٍ إداري منه إلى قاضٍ بالمعنى الحديث. فهو يشرف على السوق بالتعاون مع المحتسب، ويُثبت عقود البيع، ويُعيّن الأوصياء على الأيتام، ويراقب الأوقاف، ويفصل في خلافات الجيران على الحائط والماء. وكان يجلس في محكمته أيامًا معلومة، ويستقبل الناس بلا حجاب، ويسمع شكوى الفلاح ضد الجندي كما يسمع شكوى الجندي ضد الفلاح.\u003c/p\u003e\u003cp class=\"ap\"\u003eوهذا القرب من الناس هو ما جعل القضاء مصدر شرعيةٍ حقيقيًّا. فالناس قد لا تعرف من هو الصدر الأعظم، لكنها تعرف قاضيها بالاسم، وتستطيع أن تصل إليه. ومن هنا كان عزل القاضي الظالم حدثًا يُذكر في المدينة، ويُكتب فيه إلى العاصمة، وتُرسل لجنةٌ للتحقيق. ولا يعني هذا أن العدالة كانت كاملة — فالسجلات تحكي عن رشوةٍ وتأخيرٍ وتحيّز — لكن يعني أن هناك آليةً للتصحيح كانت تعمل أحيانًا.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eأبو السعود: قانون السلطان وفقه الأمة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان أبو السعود العمادي شيخ الإسلام في عهد سليمان القانوني، وهو من أهم من جمع بين الفقه والقانون في التاريخ الإسلامي. واجه مشكلةً عملية: أن الدولة تحتاج تشريعاتٍ في أمورٍ لم ينصّ عليها الفقه الحنفي صراحةً، مثل أنواع الضرائب على الأرض، والعقوبات على الجرائم التي لم تُحدَّد، وتنظيم الأوقاف النقدية. فكان يفتي بما يُجيز للسلطان أن يُشرّع، ويصوغ الفتوى بلغةٍ تجعل القانون العرفي داخلًا في الشريعة لا خارجًا عنها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوهذا العمل هو ما أعطى الدولة شرعيتها القانونية قرونًا. لكنه حمل أيضًا خطرًا: أن يصير الفقه مبرّرًا للسلطة بدل أن يكون رقيبًا عليها. وفي القرون التالية، حين ضعفت الدولة، صار بعض العلماء يُفتون بما يطلبه السلطان، وفقدت الفتوى جزءًا من استقلالها المعنوي، وهذا من أسباب فقدان الثقة في المؤسسة الدينية عند النخب الحديثة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالمذاهب الأربعة في دولة واحدة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان التعامل العثماني مع المذاهب عمليًّا لا عقديًّا: المذهب الحنفي هو مذهب الدولة، لأن الدولة بُنيت في بيئةٍ حنفية، ولأن الحنفي أكثر مرونةً في مسائل الإدارة والأرض. لكن الدولة لم تُجبر أحدًا على تركه، ولم تُغلق مساجد الشافعية ولا مدارسهم، وكان في مكة والمدينة والشام ومصر قضاةٌ من مذاهب أخرى.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان لهذا ثمن وثمرة. الثمن أن النظام القضائي لم يكن موحّدًا تمامًا، فكانت الأحكام تختلف من مدينةٍ إلى أخرى بحسب مذهب قاضيها. والثمرة أن الدولة استطاعت أن تحكم شعوبًا شديدة التنوع بلا حربٍ مذهبية، في وقتٍ كانت أوروبا تُحرق فيه بعضها بسبب خلافٍ على تفسير العشاء الرباني. وهذا الفارق في التسامح النسبي هو أحد أسباب بقاء الدولة في مناطق ذات تراثٍ مذهبي مختلف.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسجل المحكمة\u003c/b\u003e\u003cspan\u003eمصدر تاريخي نادر يوثّق عقود الناس وشكاواهم اليومية\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eشيخ الإسلام\u003c/b\u003e\u003cspan\u003eأعلى مرجعٍ للفتوى، وسلطته معنوية تُقيّد السلطان\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eقانون نامه\u003c/b\u003e\u003cspan\u003eتشريع السلطان في ما لا نصّ فيه، بدأ مع الفاتح واتسع مع سليمان\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمجلة الأحكام\u003c/b\u003e\u003cspan\u003eأول تدوين مدني للفقه الحنفي سنة ١٨٧٦م\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالجهة\u003c/th\u003e\u003cth\u003eالاختصاص\u003c/th\u003e\u003cth\u003eالحدّ\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالقاضي\u003c/td\u003e\u003ctd\u003eكل الخصومات المدنية والجزائية في ولايته\u003c/td\u003e\u003ctd\u003eلا يُعزل إلا بقرارٍ من العاصمة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمحتسب\u003c/td\u003e\u003ctd\u003eالسوق والأسعار والمكاييل والموازين\u003c/td\u003e\u003ctd\u003eيعمل تحت إشراف القاضي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمفتي\u003c/td\u003e\u003ctd\u003eالرأي الشرعي غير الملزم\u003c/td\u003e\u003ctd\u003eلا يُنفّذ حكمًا بنفسه\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمحاكم القنصلية\u003c/td\u003e\u003ctd\u003eرعايا الدول الأجنبية\u003c/td\u003e\u003ctd\u003eثغرة سيادية اتسعت في القرن التاسع عشر\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003e«القاضي لا يحكم بمرتبته ولا بقرابته، بل بما في السجل وبشهادة العدول»\u003c/p\u003e\u003ccite\u003eمن صيغةٍ متكررة في وثائق المحاكم العثمانية\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eكان القضاء أكثر من محكمة: كان إدارةً للمدينة وضمانًا لشرعية الدولة عند الناس. وحّد الحنفيُّ المرجعية وأبقى المذاهب الأخرى في العبادات، ووفّق أبو السعود بين الشريعة وقانون السلطان. لكن الجمود بعد القرن السادس عشر، والامتيازات القنصلية، جعلا هذا النظام يفقد سيادته وتحديثه في الوقت نفسه.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"millet-waqf","n":"الملل والأوقاف والحرف","ic":"🕊️","part":"القسم الثاني: النظام","h":"\u003carticle class=\"ch3\" id=\"millet-waqf\" data-toc=\"الملل والأوقاف والحرف\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٢.٤\u003c/span\u003e\n          \u003ch3\u003e🕊️ الملل والأوقاف والحرف\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eم\u003c/span\u003eا الذي جعل مدينةً فيها مسلمون ومسيحيون ويهود تعيش ستة قرون بلا حربٍ أهلية؟ جزءٌ من الجواب في نظام الملل، وجزءٌ في الوقف، وجزءٌ في تنظيم الأسواق والحرف.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eلم تكن «الملة» في الأصل نظامًا مكتوبًا، بل ترتيبًا عمليًّا ظهر بالتدريج. فالدولة لم تُنشئ إدارةً للأقليات، بل اعترفت بكل طائفةٍ دينية كوحدةٍ إدارية مسؤولة عن أفرادها أمام السلطان: لها رئيسها الديني، ومحاكمها في الأحوال الشخصية، ومدارسها، وأوقافها، وجبايتها الداخلية. فالبطريرك الأرثوذكسي في القسطنطينية صار مسؤولًا عن الروم، والبطريرك الأرمني عن الأرمن، والحاخام الأكبر عن اليهود. وكل واحدٍ منهم يجمع الضريبة من طائفته ويسلّمها للدولة، ويحلّ خلافاتهم الداخلية، ويضمن ولاءهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت هذه الطريقة ذكيةً إداريًّا لأنها وفّرت على الدولة جهازًا كبيرًا. فبدلًا من أن تُرسل موظفًا إلى كل قريةٍ نصرانية لتحكم في زواجهم وميراثهم، تركت ذلك لرئيس الطائفة الذي يعرفهم ويعرف لغتهم. وكانت في الوقت نفسه خطيرةً على المدى الطويل، لأنها رسّخت الانقسام: صار لكل طائفةٍ هويةٌ قانونية منفصلة، وترسّخت الحدود بين الجماعات، وحين جاء القرن التاسع عشر وظهرت فكرة المواطنة المتساوية، وجدت الدولة نفسها أمام نظامٍ قديم يُصعّب التحول إلى مواطنةٍ واحدة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما الوقف فهو أعجب مؤسسة في النظام العثماني. فالوقف أرضٌ أو بناءٌ أو مالٌ يُحبَّس أصله ويُصرف ريعه إلى جهةٍ خيرية: مسجد، أو مدرسة، أو بيمارستان، أو سبيل ماء، أو مطبخ يُطعم الفقراء، أو رباطٍ للمسافرين، أو صندوقٍ يُزوّج اليتيمات. وكان يُدار بوصية الواقف وشروطه، ويُشرف عليه «ناظر»، ويُسجّل في المحكمة. وكانت الأوقاف في بعض المدن تُغطّي ثلث الأرض المبنية، وكانت تُموّل خدماتٍ لا تُموّلها الدولة: التعليم، والصحة، والماء، والإطعام.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان نظام الوقف يعني أن جزءًا كبيرًا من «القطاع العام» كان مستقلًّا عن الخزانة. فالمدرسة تُموّل من دكّانٍ موقوف، والبيمارستان من بستانٍ موقوف، والسبيل من حمّامٍ موقوف. وكان هذا يحمي الخدمات من تقلّبات السياسة: فلو عُزل الوزير أو نشبت حرب، بقي الوقف يعمل لأن أمواله ليست في الخزانة. لكنه حمل أيضًا مشكلة: أن الأوقاف تراكمت مع القرون وصارت أصولًا مجمّدة لا يمكن بيعها ولا تطويرها، فتحوّلت إلى ثروةٍ ضخمة عاطلة، وحاولت الدولة مرارًا أن تُدمجها في «إدارة الأوقاف» لتستفيد منها، فقاوم العلماء لأن المساس بالوقف مساسٌ بالشرع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت الحرف منظّمة في «الأصناف»، وهي نقابات لكل مهنة: الجزارون، والصبّاغون، والخبّازون، والنسّاجون، والحدّادون. ولكل صنفٍ شيخٌ ورأسٌ وقواعد: من يُقبل، وكيف يُدرَّب المبتدئ، وما هو السعر، وما هو معيار الجودة، وما جزاء من يغشّ. وكان المحتسب يُراقب الأسواق ويتفقّد الموازين، ويُعاقب الغشّاش، ويمنع الاحتكار، ويُسعّر في أوقات الأزمات. وكان هذا النظام يحمي المستهلك ويحمي الحرفي معًا، لأنه يمنع المنافسة الهدّامة كما يمنع الاستغلال.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما المدينة نفسها فكانت تُدار كوحداتٍ صغيرة تُسمّى «المحلة». ولكل محلةٍ مسجدها وإمامها ومختارها، ومسؤولها عن الأمن والنظافة والضرائب. وكان الجار مسؤولًا عن جاره أمام المحكمة في بعض الحالات، وهذا يعني أن المدينة كانت شبكةً من الجماعات المتجاورة لا مجموعةً من الأفراد. وفي هذه الشبكة كان التعايش يحدث يوميًّا لا نظريًّا: جارٌ مسلم يشتري من دكّانٍ نصراني، وحرفيٌّ يهودي في سوقٍ مختلط، وأطفال يلعبون في زقاقٍ واحد.\u003c/p\u003e\u003cp class=\"ap\"\u003eلكن الصورة ليست وردية. فقد كان على غير المسلمين جزيةٌ سنوية، وقيودٌ على الملابس والمراكب في بعض العصور، ومنعٌ من بناء كنائس جديدة في بعض المناطق، وشهادتهم أقلّ وزنًا في بعض الدعاوى. وكان الدوشرمة انتزاعًا لأطفالهم. وكان التحول إلى الإسلام يفتح أبوابًا في الجيش والإدارة لا تفتح لغيره، وهذا خلق ضغطًا هائلًا على الأقليات على المدى الطويل، حتى صارت بعض المناطق التي كانت نصرانية في القرن الخامس عشر مسلمة في القرن الثامن عشر بلا حربٍ ولا إكراه مباشر، بل بضغطٍ اجتماعي واقتصادي متراكم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي المقابل، كانت الدولة ملجأً لليهود المطرودين. فحين طردتهم إسبانيا سنة ١٤٩٢م، أرسل السلطان بايزيد الثاني سفنًا لنقلهم إلى الدولة العثمانية، وأمر ولاة المدن باستقبالهم، فاستقرّوا في القسطنطينية وسالونيك وإزمير، وأحيوا فيها صناعات النسيج والطباعة، وعلّموا الدولة لغات أوروبا وفنونها الدبلوماسية. وهذا الموقف ليس تسامحًا مجانيًّا: كانت الدولة تحتاج أطباء وتجارًا وصنّاعًا ومترجمين، ووجدتهم في هؤلاء، فكان القرار سياسةً لا عاطفة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوإذا نظرنا إلى الأثر الطويل، نجد أن نظام الملل ترك بصمةً عميقة على الشرق الأوسط الحديث. فالطوائف الدينية التي تُدار اليوم في لبنان والعراق ومصر وإيران من خلال أنظمةٍ طائفية، إنما هي وريثةٌ جزئية لهذا النموذج: أن تُدار الجماعة الدينية كوحدةٍ سياسية. وقد كان هذا حلًّا عمليًّا في إمبراطوريةٍ متعددة الأديان، لكنه صار مشكلةً في دولٍ حديثة تسعى إلى مواطنةٍ متساوية. وهذه هي المفارقة: أن نظامًا ناجحًا في زمانه يمكن أن يصير عائقًا بعد ثلاثة قرون.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالملة: إدارة التنوع\u003c/h4\u003e\u003cp class=\"ap\"\u003eكلمة «ملة» في الأصل تعني الدين والطريقة، ثم صارت في الاستعمال العثماني تعني الطائفة الدينية المعترف بها. ولم يكن النظام واضح المعالم في القرن السادس عشر كما صار في التاسع عشر، حين أُعيد تنظيمه وكتابة لوائحه. لكن جوهره بقي واحدًا: أن الدولة تعترف بالجماعة لا بالفرد، وتتعامل مع رئيسها الديني لا مع كل فردٍ منها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أنتج هذا النظام نتيجةً مزدوجة: حمايةً للتنوع من جهة، وعزلةً بين الجماعات من جهة أخرى. فلم تُذب الأقليات في ثقافةٍ واحدة، لكنها لم تندمج أيضًا في مشروعٍ وطني مشترك. وحين جاءت الأفكار الحديثة عن المساواة والمواطنة، وجدت الدولة نفسها أمام بنيةٍ قديمة لا تُترجم بسهولة إلى دستور.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالوقف: القطاع الثالث\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الوقف هو الحلّ العثماني لمشكلة الخدمات العامة في دولةٍ لا تملك جهازًا ضريبيًّا حديثًا. فبدلًا من أن تبني الدولة مدرسةً وتموّلها من الخزانة، يبنيها محسنٌ من خاصته ويوقف عليها أرضًا تُدرّ دخلًا. وبهذه الطريقة بُنيت في الدولة آلاف المدارس والمساجد والحمّامات والأسبلة والبيمارستانات، وأكثرها لم تكلّف الخزانة شيئًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eلكن هذا النموذج كان يعتمد على الكرم الفردي، وهو موردٌ لا يمكن التخطيط عليه. وحين قلّت الثروة في القرن الثامن عشر، قلّ الوقف الجديد، وبدأت الأوقاف القديمة تتآكل بسبب سوء الإدارة والفساد. وحاولت الدولة إنقاذها بإنشاء إدارةٍ مركزية، لكن الإصلاح جاء متأخرًا بعد أن صار جزءٌ كبير من ثروة الأمة مجمّدًا في أصولٍ لا تُستثمر.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالحرف والأسواق\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان سوق المدينة العثمانية عالمًا منظّمًا بدقّة. لكل حرفةٍ شارعها، ولكل شارعٍ شيخها، ولكل شيخٍ قواعد. وكانت الأسعار تُحدَّد أحيانًا بقرارٍ إداري، وكانت الجودة تُفحص، وكان من يغشّ يُطاف به في السوق أو يُعاقب. وهذا التنظيم أعطى المستهلك حمايةً لم تكن موجودة في كثير من مدن أوروبا في العصور الوسطى.\u003c/p\u003e\u003cp class=\"ap\"\u003eلكن التنظيم نفسه صار عائقًا أمام التصنيع. فالنقابات قاومت التقنيات الجديدة، ومنعت توسّع الورش، وحدّدت عدد العاملين، وحافظت على الأساليب القديمة. وحين جاءت الطباعة والآلة، لم يكن في الدولة نظامٌ يسمح بالتحوّل السريع، فخسرت الحرف العثمانية تدريجيًّا أمام المنافسة الأوروبية في القرن التاسع عشر.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالملة\u003c/b\u003e\u003cspan\u003eطائفة دينية تُدار بشؤونها الداخلية ومسؤولة أمام السلطان\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالوقف\u003c/b\u003e\u003cspan\u003eأصلٌ محبَّس يُصرف ريعه لخدمةٍ خيرية، بلا خزانةٍ ولا موظفين\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمحتسب\u003c/b\u003e\u003cspan\u003eيراقب السوق والأسعار والموازين ويعاقب الغشّ\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003e١٤٩٢م\u003c/b\u003e\u003cspan\u003eاستقبال يهود إسبانيا، وتوطينهم في القسطنطينية وسالونيك وإزمير\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمؤسسة\u003c/th\u003e\u003cth\u003eما تقدّمه\u003c/th\u003e\u003cth\u003eحدّها\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالملة\u003c/td\u003e\u003ctd\u003eأحكام شخصية ومدارس وكنائس لكل طائفة\u003c/td\u003e\u003ctd\u003eرسّخت الانقسام وأعاقت المواطنة لاحقًا\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالوقف\u003c/td\u003e\u003ctd\u003eتعليم وصحة وماء وإطعام بلا خزانة\u003c/td\u003e\u003ctd\u003eجمّد الأصول ومنع التطوير\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالصنف\u003c/td\u003e\u003ctd\u003eحماية الحرفي والمستهلك وتنظيم الجودة\u003c/td\u003e\u003ctd\u003eقاوم التقنية وحدّ من التوسع\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمحلة\u003c/td\u003e\u003ctd\u003eأمنٌ ونظافة وضرائب على مستوى الحي\u003c/td\u003e\u003ctd\u003eضغطٌ اجتماعي على الأقليات\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003e«الوقف بابٌ من أبواب الخير، من دخله نال الأجر، ومن أكل ماله نال الوزر»\u003c/p\u003e\u003ccite\u003eمن صيغ حجج الأوقاف المسجلة في المحاكم العثمانية\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eعاشت الدولة ستة قرون بتنظيمٍ مدني لا يشبه الدولة الحديثة: مللٌ تُدير نفسها، وأوقافٌ تُموّل الخدمات، وأصنافٌ تُنظّم الأسواق، ومحلاتٌ تُدير الأحياء. وقد نجح هذا النموذج في إدارة تنوعٍ هائل، لكنه جمّد الأصول وأعاق التحوّل حين احتاجت الدولة إلى التحديث.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-3","n":"القسم الثالث: الذروة","ic":"","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-3\" style=\"--c:#2F4F4F\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🕌\u003c/div\u003e\n      \u003ch2\u003eالقسم الثالث: الذروة\u003c/h2\u003e\n      \u003cp\u003eفي نصف قرن امتدّت الدولة من بودابست إلى أسوان، وصارت أقوى دولة في العالم: سليم الأول يفتح الشرق، وسليمان القانوني يضرب أبواب فيينا ويقنّن الدولة، وسنان يبني أعظم قبابها، والأسطول يجعل البحر المتوسط بحيرةً عثمانية.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#selim-east\"\u003eسليم الأول والشرق\u003c/a\u003e\u003ca href=\"#suleyman-law\"\u003eسليمان القانوني\u003c/a\u003e\u003ca href=\"#sinan-architecture\"\u003eالعمارة وسنان\u003c/a\u003e\u003ca href=\"#navy-mediterranean\"\u003eالبحر المتوسط والأسطول\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"selim-east","n":"سليم الأول والشرق","ic":"🌅","part":"القسم الثالث: الذروة","h":"\u003carticle class=\"ch3\" id=\"selim-east\" data-toc=\"سليم الأول والشرق\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٣.١\u003c/span\u003e\n          \u003ch3\u003e🌅 سليم الأول والشرق\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eب\u003c/span\u003eين ١٥١٢ و١٥٢٠م غيّر سليم الأول خريطة العالم الإسلامي: هزم الصفويين، وأنهى دولة المماليك، وضمّ الحجاز والشام ومصر. وفي ثماني سنوات صارت الدولة أكبر دولة إسلامية سنّية في التاريخ.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان سليم الأول ابناً للسلطان بايزيد الثاني، وقد وصل إلى العرش بطريقةٍ قاسية: بمواجهة أبيه ثم بإزاحة أخوته. ولم يكن ذلك غريبًا في تقاليد البيت العثماني، لكنه ترك في شخصيته أثرًا: حزمٌ بلا تردد، وسرّيةٌ في القرار، وسرعةٌ في الحركة. ولما جلس على العرش سنة ١٥١٢م وجد أمامه مشكلتين: أن الشرق صار ساحةً لصعودٍ صفوي شيعي يهدّد الأناضول من الداخل، وأن الجنوب تحكمه دولة المماليك التي كانت في نظر العثمانيين حامية الحرمين ومركز السنة، فلا يمكن ضربها بلا حساب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان الخطر الصفوي هو الأول. فقد كان الشاه إسماعيل قد بنى دولةً في فارس، ومدّ نفوذه إلى الأناضول الشرقي عبر القبائل والوعّاظ، حتى صار له أنصارٌ داخل أراضي الدولة نفسها. وكان هذا أخطر من جيشٍ على الحدود، لأن الولاء لدولةٍ أخرى داخل الدولة يهدمها من الداخل. فقرّر سليم أن يضرب المركز قبل الأطراف، وزحف إلى الشرق سنة ١٥١٤م، والتقى بالشاه في سهل جالديران.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت معركة جالديران في أغسطس ١٥١٤م من المعارك التي حسمها السلاح لا العدد. فالجيش الصفوي كان من الفرسان السريعة والقوس والنشّاب، والجيش العثماني كان من المشاة والإنكشارية والمدفعية. فثبتت المشاة خلف المتاريس، وضربت المدافع صفوف الفرسان، فتحوّل الهجوم إلى انسحاب، وجُرح الشاه نفسه. ولم يحتلّ سليم تبريز طويلًا، لكنه كسر أسطورة الجيش الصفوي الذي لا يُهزم، وضمّ الأناضول الشرقي، وقطع الطريق بين الشاه وأنصاره في الداخل.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم تحوّل إلى الجنوب. وكانت دولة المماليك قد صمدت أمام الصليبيين والمغول قرونًا، لكنها في مطلع القرن السادس عشر كانت تعيش أزمةً داخلية: صراعٌ بين المماليك والسلطان، وانهيارٌ في الاقتصاد بسبب تحوّل طرق التجارة إلى رأس الرجاء الصالح، وضعفٌ في التسليح أمام المدفعية. ولم يكن السلطان المملوكي قانصوه الغوري يريد الحرب مع العثمانيين، لكن الضغط على الحدود والتحريض المتبادل جعلاها حتمية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي أغسطس ١٥١٦م التقى الجيشان في مرج دابق شمال حلب. وكانت المعركة قصيرةً وحاسمة: انفجرت مدفعية العثمانيين في صفوف المماليك، وارتدّ الفرسان، وسقط الغوري ميتًا في الميدان — وقيل إنه مات بالصدمة أو بالسكتة قبل أن يُقتل. ودخل سليم حلب ثم دمشق بلا مقاومة تُذكر، وأعلن الأمان لأهلها، وأبقى القضاة والمدارس والأوقاف على حالها. وفي يناير ١٥١٧م دخل القاهرة بعد معركة الريدانية، وانتهت دولة المماليك التي حكمت مصر والشام أكثر من قرنين ونصف.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان أهم ما جرى بعد الفتح ليس احتلال مصر، بل انتقال الشرعية. فسليم لم يأخذ من المماليك جيشًا ولا أرضًا فقط، بل أخذ منهم دورهم التاريخي: خدمة الحرمين، ورعاية طريق الحج، والدفاع عن السنة. وقد وصل إليه شريف مكة بمفاتيح الحرمين، فلقّب نفسه «خادم الحرمين الشريفين»، وهو لقبٌ تواضعيّ في ظاهره لكنه في باطنه إعلانٌ بأن الدولة صارت مسؤولةً عن أقدس بقاع الإسلام. وهذا اللقب كان أصدق تعبيرًا عن الوضع الجديد من أي لقبٍ آخر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما حكاية «تنازل الخليفة العباسي المتوكل عن الخلافة لسليم» فهي رواية متأخرة لا تثبت بها وثيقة معاصرة، وقد أُشيعت في القرن الثامن عشر حين احتاجت الدولة إلى تعزيز شرعيتها. والصحيح أن العثمانيين ورثوا وظيفة حماية الحرمين ورعاية الحج، وأن لقب «الخليفة» صار يُستعمل أحيانًا في المراسلات، لكنه لم يكن أساس الحكم ولا مصدر تشريعه. والمؤرخ الحديث يميّز بين ما جرى فعلًا وما أُضيف لاحقًا لتبرير الحاضر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت إدارة الأقاليم الجديدة مسألةً صعبة. فمصر كانت عالمًا قائمًا بذاته: الأزهر، والأوقاف، وتجارة البحر الأحمر، ومماليك لا يزالون أحياءً. فابتكر العثمانيون حلًّا وسطًا: أبقوا المماليك كطبقةٍ حاكمة محليًّا، وأرسلوا واليًا عثمانيًّا، وجعلوا الجباية في يد دفتردار مركزي، وأبقوا القضاء على مذهبه الشافعي في مصر. وهكذا صارت مصر ولايةً عثمانية في السياسة والمال، ومصريةً في القضاء والتعليم والتقاليد. وهذا النموذج سيتكرر في الشام والحجاز واليمن والجزائر.\u003c/p\u003e\u003cp class=\"ap\"\u003eومات سليم الأول سنة ١٥٢٠م في طريق عودته من حملةٍ جديدة، وعمره نحو الخمسين، بعد ثماني سنوات من الحكم غيّرت التاريخ. وترك دولةً تضاعفت مساحتها ثلاث مرات، وخزانةً مليئة بالغنائم، ومشكلةً جديدة: كيف تُدار إمبراطوريةٌ بهذا الحجم بأجهزةٍ صُمّمت لدولةٍ أصغر بكثير؟ وكان الجواب سيأتي في عهد ابنه، الذي سيُلقّب بالقانوني، لا لأنه سنّ القانون، بل لأنه جعله نظامًا يُحكم به عالمٌ واسع.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eجالديران: عندما هزمت المدفعية الفرسان\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت معركة جالديران درسًا في تفوّق التنظيم على الشجاعة. فالفرسان الصفويون كانوا من أفضل فرسان العالم، لكنهم كانوا يقاتلون بسلاح القرن الخامس عشر ضد جيشٍ يملك مدفعيةً منظمة ومشاةً مدرّبة على الثبات. وقد حاول الشاه أن يستدرج العثمانيين إلى مناورةٍ سريعة، فرفض سليم وثبت في موقعه، حتى إذا اقترب الفرسان صبّت عليهم المدافع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأثر هذه المعركة لم يكن في الأرض التي أُخذت، بل في الصورة التي انكسرت. فقد كانت الدولة الصفوية قد بنت شرعيتها على أن جيشها مؤيّدٌ لا يُغلب، فلمّا انهزم في ميدانٍ مفتوح، اهتزّت هذه الصورة، وتراجع التوسع الصفوي غربًا لعقود. وهكذا يمكن أن تكون المعركة أهم مما نتج عنها من أرض.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eنهاية المماليك: لماذا سقطت دولةٌ صمدت قرنين؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يسقط المماليك لأنهم ضعفاء، بل لأن نظامهم كان قد صار قديمًا في لحظةٍ حرجة. فجيشهم من فرسانٍ مشترَين يُدرَّبون سنوات، وعتادهم بلا مدفعية تقريبًا، واقتصادهم يعتمد على طرق التجارة القديمة التي بدأت تنحرف نحو المحيط. وأضف إلى ذلك أن طبقة المماليك كانت تُعيد إنتاج نفسها بالشراء والولاء الشخصي، ولم تكن قادرة على تعبئة سكان البلاد معها في حربٍ وطنية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ترك سقوطهم أثرًا نفسيًّا عميقًا في المشرق: فدولةٌ كانت تُعدّ حامية السنة وسيّدة الشرق صارت ولايةً في أشهر. وهذا الحدث هو الذي أعطى العثمانيين الثقة للادعاء بأنهم وارثو العالم الإسلامي، لا مجرّد إمارةٍ حدودية في البلقان. وبعده لم يبقَ في العالم الإسلامي سوى ثلاث قوى: العثمانيون، والصفويون، والمغول في الهند.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالحرمين وطريق الحج\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت مسؤولية الحرمين هي أثقل ما ورثه العثمانيون، وأكثر ما أضاف إليهم شرعية. فالدولة كانت تُرسل كل عام «الصرة» وهي أموالٌ نقدية تُوزّع على فقراء مكة والمدينة، وتُموّل كسوة الكعبة، وتُؤمّن قوافل الحج من الشام ومصر واليمن. وكان انقطاع الحج أو تعرّض القافلة للنهب كارثةً سياسية تفوق أي هزيمة عسكرية.\u003c/p\u003e\u003cp class=\"ap\"\u003eولهذا أنشأت الدولة نظامًا كاملًا للحج: أمير الحج، وقوة عسكرية مرافقة، ومحطات ماء على الطريق، وأوقافٌ تُصرف على الحرمين. وكان هذا النظام يعمل حتى في أسوأ سنوات الضعف، لأن شرعية السلطان عند المسلمين ارتبطت به أكثر من أي شيء آخر. وحين انقطع الحج في الحرب العالمية الأولى، كان ذلك من علامات النهاية التي شعر بها الناس قبل أن تُعلن.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eجالديران ١٥١٤م\u003c/b\u003e\u003cspan\u003eهزيمة الصفويين وكسر أسطورة جيشهم، وتأمين الأناضول الشرقي\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمرج دابق ١٥١٦م\u003c/b\u003e\u003cspan\u003eسقوط حلب والشام ومقتل السلطان المملوكي في الميدان\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالريدانية ١٥١٧م\u003c/b\u003e\u003cspan\u003eدخول القاهرة ونهاية دولة المماليك\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eخادم الحرمين\u003c/b\u003e\u003cspan\u003eلقب أخذه سليم بدل لقب الخليفة، وهو أصدق في الدلالة\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمعركة\u003c/th\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالخصم\u003c/th\u003e\u003cth\u003eالنتيجة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eجالديران\u003c/td\u003e\u003ctd\u003e١٥١٤م\u003c/td\u003e\u003ctd\u003eالصفويون\u003c/td\u003e\u003ctd\u003eضمّ الأناضول الشرقي وتبريز مؤقتًا\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eمرج دابق\u003c/td\u003e\u003ctd\u003e١٥١٦م\u003c/td\u003e\u003ctd\u003eالمماليك\u003c/td\u003e\u003ctd\u003eسقوط الشام وحلب\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالريدانية\u003c/td\u003e\u003ctd\u003e١٥١٧م\u003c/td\u003e\u003ctd\u003eالمماليك\u003c/td\u003e\u003ctd\u003eسقوط مصر ونهاية الدولة المملوكية\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003e«أنا خادم الحرمين، لا مالكهما»\u003c/p\u003e\u003ccite\u003eما يُروى عن سليم الأول بعد ضمّ الحجاز\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eفي ثماني سنوات حوّل سليم الأول الدولة من قوةٍ إقليمية إلى أكبر دولة إسلامية سنّية: كسر الصفويين في جالديران، وأنهى المماليك في مرج دابق والريدانية، وضمّ الشام ومصر والحجاز. وأهم ما ورثه لم يكن الأرض بل وظيفة خدمة الحرمين، وهي التي صارت مصدر شرعية الدولة قرونًا.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"suleyman-law","n":"سليمان القانوني","ic":"👑","part":"القسم الثالث: الذروة","h":"\u003carticle class=\"ch3\" id=\"suleyman-law\" data-toc=\"سليمان القانوني\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٣.٢\u003c/span\u003e\n          \u003ch3\u003e👑 سليمان القانوني\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eأ\u003c/span\u003eربع وستون سنة على العرش، وأربع عشرة حملة، وحدودٌ من بودابست إلى بغداد. سليمان هو ذروة الدولة العثمانية بلا منافس، وهو أيضًا بداية أسطورتها في الشرق والغرب معًا.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eلم يكن سليمان في بداية حكمه معروفًا بالحرب. فقد تولّى سنة ١٥٢٠م بعد أبٍ مهيب، وكان الناس يظنون أنه سيكتفي بما ورثه. لكنه في أول ثلاث سنوات فتح بلغراد سنة ١٥٢١م، ورودس سنة ١٥٢٢م، فأنهى وجود فرسان القديس يوحنا في شرق المتوسط بعد أن صمدوا قرنين. وكانت رودس عمليةً صعبة: جزيرة محصّنة، وحصارٌ طويل، ومدفعية تُرجم بلا توقف، ثم تسليمٌ مشرّف للفرسان سمح لهم بالخروج بسلاحهم. وهذا المزيج بين القوة والبراغماتية سيبقى أسلوبه.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم جاءت المجر. ففي أغسطس ١٥٢٦م التقى الجيش العثماني بالجيش المجري في سهل موهاكس، وكانت المعركة سريعةً وحاسمة: انهار الخط المجري في أقل من ساعتين، ومات الملك لويس الثاني غرقًا في مستنقعٍ أثناء الفرار، ولم يبقَ له وريث. فدخل سليمان بودا، وأصبحت المجر ساحةً مفتوحة، ثم دفعته الظروف إلى دعم أميرٍ تابع له على العرش، فتحوّلت المجر إلى ولايةٍ عثمانية اسميًّا وحربٍ دائمة فعليًّا مع الهابسبورغ.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سنة ١٥٢٩م حاصر فيينا. ولم يكن الحصار ناجحًا: جاء الشتاء مبكرًا، وطالت خطوط الإمداد، ورفضت الحامية التسليم، فانسحب الجيش بعد أسابيع. وكان هذا أول حدٍّ يقفه العثمانيون في أوروبا الوسطى، وأول إشارة إلى أن قوةً تعتمد على الحصار والمدفعية لا تستطيع أن تعمل في شتاءٍ قاسٍ بعيدًا عن قواعدها. وقد أعاد العثمانيون الكرّة بعد قرنٍ ونصف، وبنفس النتيجة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي الشرق كان الصفويون قد عادوا إلى القوة. فقاد سليمان ثلاث حملاتٍ كبرى إلى فارس، وفي حملة ١٥٣٤م دخل بغداد، فأعاد إليها مركزها العلمي، ورمّم مشاهد الأئمة، وأوقف عليها الأوقاف. ولم تكن الحرب مع الصفويين حربًا حاسمة، لأن طبيعة الأرض والخصم لا تسمح بذلك: فالصفويون ينسحبون ويحرقون ويتركون الأرض للعثمانيين ثم يعودون. فتحوّل الصراع إلى حرب حدودٍ طويلة انتهت بمعاهدةٍ سنة ١٥٥٥م قسّمت القوقاز بين الطرفين، وهي من أطول المعاهدات أثرًا في تاريخ المنطقة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي البحر كان التحوّل الأكبر. فقد دخل خير الدين بربروس في خدمة الدولة، فصار قائدًا للأسطول، وضمّ الجزائر إلى الدولة، وحقّق انتصار بريفيزا سنة ١٥٣٨م على أسطولٍ أوروبي موحّد. وبعد ذلك صار البحر المتوسط ساحةً عثمانية، وصارت السواحل الإيطالية والإسبانية تُهاجم من الجزائر وتونس، وتحوّلت مدن الساحل الشمالي الأفريقي إلى ولاياتٍ عثمانية لها أساطيلها الخاصة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما لقب «القانوني» فلم يأتِ من كثرة القوانين، بل من ترتيبها. ففي عهده جُمع القانون العثماني في «قانون نامه» شامل، ونُظّمت مراتب الدولة ورواتبها وأزياءها ومراسمها، ووُضّحت قواعد الأرض والضرائب، ورُبِط القانون العرفي بالشريعة برباطٍ محكم على يد شيخ الإسلام أبي السعود. وكانت النتيجة أن الدولة صارت قابلةً للحكم من مركزٍ واحد رغم اتساعها، لأن كل والٍ يعرف ما له وما عليه في ورقةٍ مكتوبة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت شخصيته مثار جدلٍ في الشرق والغرب. ففي أوروبا صار «سليمان العظيم» رمزًا للخطر الشرقي، وكُتبت عنه المسرحيات والقصص. وفي الدولة نفسها كان سلطانًا يجمع بين الفقه والشعر، ويكتب بنفسه، ويُجالس العلماء، ويحكم بسرعةٍ وحسم. وأشهر ما يُروى عنه حبّه لزوجته خرم سلطان، وهي جارية صارت زوجةً شرعية وكتبت اسمها في السياسة، وهو أمرٌ خرج عن تقاليد القصر، وأثار جدلًا في زمانه كما يثير اليوم.\u003c/p\u003e\u003cp class=\"ap\"\u003eلكن عهده كان قاسيًا أيضًا. فقد أُعدم صدره الأعظم إبراهيم باشا سنة ١٥٣٦م بعد سنواتٍ من الصداقة والقرب، وأُعدم ابنه مصطفى سنة ١٥٥٣م بأمرٍ منه بعد وشاياتٍ وتخوّفٍ من نفوذه، ثم مات ابنه الآخر محمد شابًّا. وهذه الأحداث تُظهر أن نظام الخلافة العثماني كان يدفع ثمن وحدته من أبنائه: أن يقتل السلطان ابنه ليمنع حربًا أهلية، وأن يعيش الجميع في ظلّ خوفٍ دائم من الغد.\u003c/p\u003e\u003cp class=\"ap\"\u003eومات سليمان سنة ١٥٦٦م في خيمةٍ أمام قلعة سِجِتوار في المجر، أثناء حملته الثالثة عشرة، فكتم الصدر الأعظم خبر موته حتى استُكمل الفتح، ثم أُعلن النبأ في العودة. وكانت الدولة في أقصى اتساعها: نحو خمسة عشر مليون نسمة، وثلاث قارات، وأسطول يسيطر على نصف المتوسط، وخزانةٌ تجاوز دخلها كل ممالك أوروبا مجتمعة. لكن الحدود نفسها كانت قد توقفت عند حدودها الطبيعية: فيينا من الشمال، وفارس من الشرق، والصحراء من الجنوب، والمحيط من الغرب. وما بعد هذه الحدود لم يكن فتحًا بل استنزافًا.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eلماذا توقف التوسع؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eيظن كثيرون أن توقف التوسع كان نتيجة ضعفٍ مفاجئ، والحقيقة أنه كان نتيجة نجاحٍ وصل إلى حدّه. فالدولة بلغت في عهد سليمان حدودًا لا يمكن تجاوزها بوسائل القرن السادس عشر: الشتاء في أوروبا الوسطى يمنع حصارًا طويلًا، والصحراء في الجنوب لا تُغذّي جيشًا، وفارس أرضٌ شاسعة بلا مدنٍ حاسمة، والمحيط الأطلسي ليس ميدانًا لسفن البحر المتوسط.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأضف إلى ذلك أن كلفة الحرب صارت أعلى من عائدها. ففي بداية الدولة كان كل فتحٍ يجلب غنيمةً وأرضًا وضرائب جديدة، أما في القرن السابع عشر فصار الفتح يجلب جيشًا كبيرًا يُدفع له، وحاميةً تُبنى، وحربًا مع أوروبا كلها. وهكذا تحوّل التوسع من استثمارٍ مربح إلى نزيفٍ مالي، وتوقّف لأسبابٍ حسابية لا عسكرية.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالقانوني: كيف قُنّنت إمبراطورية\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت مشكلة سليمان أن دولةً بهذا الاتساع لا تُحكم بالعرف المحلي، لأن لكل إقليمٍ عرفه وضرائبه ومقاييسه. فجمع القانون في صيغةٍ واحدة، وحدّد مراتب العلماء والوزراء والجند، وربط كل رتبةٍ براتبٍ وزيٍّ ومراسم. وكانت هذه التفاصيل الصغيرة هي التي تصنع الدولة: أن يعرف كل رجلٍ موقعه، وأن يُعرف من هو من ملبسه، وأن لا يتجاوز أحدٌ حدّه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالأهم أنه جعل القانون أداةً للتوازن بين المصلحة والشرع. فحين أراد تنظيم الأرض والضرائب، استفتى العلماء، وصاغ الفتوى بما يُجيز، ثم أصدر القانون. وهذا المسار — استشارةٌ ثم فتوى ثم تشريع — أعطى قراراته شرعيةً مزدوجة: شرعية السلطة وشرعية الدين. ولهذا بقي قانون سليمان مرجعًا في الدولة ثلاثة قرون، ولم يُستبدل إلا في التنظيمات الحديثة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eخرم سلطان وسلطنة القصر\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان زواج سليمان من جاريةٍ في القصر حدثًا غير مألوف، لأن التقاليد كانت تمنع الجواري من الزواج الشرعي من السلطان. وقد أثار هذا الزواج جدلًا في البلاط، ثم صار له أثرٌ سياسي حقيقي: أن صار لخرم سلطان نفوذٌ في التعيينات، ومراسلاتٌ مع الملوك، وأوقافٌ كبيرة في القدس ومكة والقسطنطينية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بالغ بعض المؤرخين في تصويرها «سلطانةً خفية»، وبالغ آخرون في تحميلها كل شرّ في العهد. والحقيقة أن أثرها كان في نطاقٍ محدود: في المراسم، وفي بعض التعيينات، وفي الأوقاف. لكن أهم ما فعلته أنها فتحت بابًا لدورٍ سياسي أكبر لنساء القصر، وهو ما سيتضخم في القرن التالي في فترةٍ تُعرف بنفوذ النساء، وستكون من علامات ضعف السلطة المركزية لا قوّتها.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eموهاكس ١٥٢٦م\u003c/b\u003e\u003cspan\u003eانهيار المجر ومقتل ملكها، وتحوّلها إلى ساحة صراعٍ مع الهابسبورغ\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eحصار فيينا ١٥٢٩م\u003c/b\u003e\u003cspan\u003eأول حدٍّ للدولة في أوروبا الوسطى، وفشلٌ بسبب الشتاء والإمداد\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eبغداد ١٥٣٤م\u003c/b\u003e\u003cspan\u003eإعادة المدينة مركزًا علميًّا ووقفًا على المشاهد\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eبريفيزا ١٥٣٨م\u003c/b\u003e\u003cspan\u003eانتصار بحري جعل البحر المتوسط ساحةً عثمانية\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e١٥٢١–١٥٢٢م\u003c/td\u003e\u003ctd\u003eبلغراد ورودس\u003c/td\u003e\u003ctd\u003eتأمين البلقان وشرق المتوسط\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٥٢٦م\u003c/td\u003e\u003ctd\u003eموهاكس\u003c/td\u003e\u003ctd\u003eسقوط المجر ومقتل ملكها\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٥٢٩م\u003c/td\u003e\u003ctd\u003eحصار فيينا\u003c/td\u003e\u003ctd\u003eتوقف التوسع في أوروبا الوسطى\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٥٣٤م\u003c/td\u003e\u003ctd\u003eبغداد\u003c/td\u003e\u003ctd\u003eضمّ العراق وترميم المشاهد\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e١٥٥٥م\u003c/td\u003e\u003ctd\u003eمعاهدة الصلح مع الصفويين\u003c/td\u003e\u003ctd\u003eتقسيم القوقاز وحدودٌ طويلة الأمد\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003e«السلطان في خيمته، والخيمة في الميدان، والميدان في أرض العدو»\u003c/p\u003e\u003ccite\u003eمن وصف الرحالة الأوروبيين لحملات سليمان\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eبلغت الدولة في عهد سليمان أقصى اتساعها: من بلغراد ورودس إلى بغداد ومصر، ومن موهاكس إلى سواحل شمال أفريقيا. وقنّن سليمان الدولة فصارت تُحكم من مركزٍ واحد، لكن التوسع توقف عند حدودٍ طبيعية واقتصادية: فيينا، وفارس، والصحراء، والمحيط. وبعده لم يبقَ إلا أن تُحفظ الإمبراطورية أو تُفقد.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"sinan-architecture","n":"العمارة وسنان","ic":"🕌","part":"القسم الثالث: الذروة","h":"\u003carticle class=\"ch3\" id=\"sinan-architecture\" data-toc=\"العمارة وسنان\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٣.٣\u003c/span\u003e\n          \u003ch3\u003e🕌 العمارة وسنان\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eل\u003c/span\u003eم تكن القبة العثمانية مجرّد هندسة، بل كانت بيانًا سياسيًّا: أن هذه الدولة تستطيع أن تبني ما لم يبنه أحد. وفي قلب هذا البيان رجلٌ واحد اسمه سنان.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eورث العثمانيون فنّ البناء عن ثلاث مدارس: السلجوقية في الأناضول بقبابها الحجرية وزخارفها الهندسية، والبيزنطية في القسطنطينية بقبتها الكبرى المعلّقة على أربعة أكتاف، والمملوكية في الشام ومصر بمآذنها وأحواضها. وكان التحدي الذي واجه المعماريين العثمانيين هو الجمع: كيف تُبنى قبةٌ ضخمة واحدة تُغطي بيت الصلاة كله، لا سلسلةُ قبابٍ صغيرة كما في السلجوقي، ولا بازيليكا طويلة كما في البيزنطي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد حلّ هذا التحدي تدريجيًّا: قبةٌ نصف كروية محمولة على أربعة أقواس، ثم إضافة أنصاف قبابٍ تُوزّع الثقل، ثم تعليق القبة على أربعة دعائم مع مثلثاتٍ كروية تنقل الحمل إلى الأعمدة. وكل جيلٍ من المعماريين أضاف خطوة، حتى وصلت القبة إلى قطرٍ لم يُرَ مثله في العالم الإسلامي. وكانت هذه القباب في الوقت نفسه رمزًا سياسيًّا: أن السلطان يبني ما يُنافس آيا صوفيا، ثم يتجاوزها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان سنان هو ذروة هذه المدرسة. وُلد في قريةٍ أناضولية نحو ١٤٨٩م، وأُخذ في الدوشرمة جنديًّا، وشارك في حملاتٍ عسكرية، ثم تعلّم الهندسة من خلال بناء الجسور والقلاع. وفي سنة ١٥٣٩م صار رئيسًا للمعماريين في الدولة، وبقي في المنصب خمسين سنة، حتى مات سنة ١٥٨٨م عن نحو مئة سنة. ويُنسب إليه أكثر من ثلاثمئة بناء بين مسجدٍ ومدرسةٍ وحمّامٍ وخانٍ وجسرٍ وقنطرة ماء.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأعظم أعماله الأولى مسجد «شهزاده» في القسطنطينية، بناه لابن سليمان المتوفى، وفيه بدأت ملامح المدرسة تتضح: قبة مركزية، وأنصاف قباب، وتناظرٌ تام. ثم جاء «السليمانية» سنة ١٥٥٧م، وهو مجمّعٌ كامل لا مسجد فقط: جامع، وأربع مدارس، ومكتبة، وبيمارستان، ومطبخٌ خيري، وخان، وحمّام. وكان في تصميمه ذروة التوازن بين الكتلة والفراغ، ويُروى أن سنان قال إنه أراد أن يكون «قبّةً تسبح في الهواء».\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما تحفته الأخيرة فمسجد «سليمية» في أدرنة، وقد بناه في الثمانينيات من عمره. وفيه تجاوز قبة آيا صوفيا في القطر، وحلّ مشكلة الأربعة أنصاف القباب بثمانٍ دفعت الجدران إلى الأطراف، فصار المكان كله مفتوحًا للضوء. ويُروى عنه أنه قال في وصفه إنه «مسجدٌ لا مثيل له في الدنيا»، وهو قولٌ يُنسب إليه في المصادر العثمانية، ويُعدّ في تاريخ العمارة نقطةً نهائية في تطوّر القبة المفردة.\u003c/p\u003e\u003cp class=\"ap\"\u003eولم تكن العمارة العثمانية مقتصرة على المساجد. فالدولة بنَت القناطر لنقل الماء إلى المدن، وأشهرها قناطر «كرك تشمه» التي تُغذّي القسطنطينية، والجسور الطويلة على الأنهار في البلقان، والخانات على طرق القوافل، والبيمارستانات، والأسبلة التي يُشرب منها مجانًا. وكان هذا النوع من البناء هو الذي يربط الدولة بأرضها: أن يمرّ الفلاح على جسرٍ بناه السلطان، فيعرف أن الدولة موجودة في حياته لا في الكتب فقط.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت للمعماريين مؤسسةٌ رسمية: «المعماري باشي» وهو رئيس المعماريين، تحته فريقٌ من المهندسين والبنّائين والنقّاشين والخطّاطين. وكانت الدولة تُرسل هذا الفريق إلى الأقاليم لبناء الجوامع والحمّامات، فانتشر الطراز العثماني من البوسنة إلى الحجاز. وكانت المواد تُجلب من محاجرٍ محددة، والرخام من مرمرة، والخشب من غابات الأناضول، والرصاص للقباب من معادن الدولة. وهذا يعني أن البناء كان صناعةً كاملة لا عملًا فرديًّا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في العمارة معنىً دينيًّا وسياسيًّا في الوقت نفسه. فالمسجد السلطاني يُبنى على أعلى تلةٍ في المدينة، بأربع مآذن أو ست، وكل مئذنةٍ رمزٌ لسلطانٍ أو لمرتبة. والقبة الكبرى ترمز إلى وحدة الأمة تحت سلطانٍ واحد، والزخرفة النباتية والخطّ العربي يملآن الفراغ بالذكر بدل الصورة. وكانت هذه اللغة المعمارية مفهومةً للناس بلا كلام: من يرى القبة يعرف من بناها ولماذا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أثرت هذه المدرسة في العمارة الإسلامية كلها. فانتقل طراز القبة العثمانية إلى مصر والشام والمغرب والهند، وصارت مآذن القاهرة في القرن التاسع عشر تُقلّد المآذن العثمانية، ووصل التأثير إلى مساجد جنوب شرق آسيا. وفي المقابل، حين ضعفت الدولة في القرن التاسع عشر، تحوّلت العمارة إلى تقليدٍ أوروبي مختلط، وظهرت أبنيةٌ تجمع بين القبة العثمانية والواجهة الكلاسيكية، وهي اليوم من علامات تلك المرحلة الانتقالية في المدن العثمانية.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالقبة كبيانٍ سياسي\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يكن اختيار القبة الكبرى قرارًا جماليًّا فقط. فالقبة الواحدة فوق بيت صلاةٍ واحد تعني وحدةً مرئية: جماعةٌ واحدة تحت سقفٍ واحد، لا أروقةٌ منفصلة ولا صحنٌ مفتوح. وكان هذا المعنى مهمًّا لدولةٍ تحكم شعوبًا متعددة، لأنها تقول للناس بلغةٍ بصرية: أنتم أمةٌ واحدة في مكانٍ واحد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان التنافس مع آيا صوفيا صريحًا. فكل سلطانٍ أراد أن يبني قبةً تُضاهيها أو تتجاوزها، وهذا التنافس أنتج أعظم إنجازات العمارة العثمانية. ومن المفارقات أن البنّائين العثمانيين تعلّموا من البناء البيزنطي ثم تجاوزوه، ثم حافظوا على آيا صوفيا نفسها ورمّموها قرونًا، فصاروا حماةً لتراث منافسيهم.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eسنان: من جنديٍّ إلى رئيس المعماريين\u003c/h4\u003e\u003cp class=\"ap\"\u003eسيرة سنان تلخّص النظام العثماني كله. فلم يكن ابن عائلةٍ من المعماريين، بل صبيًّا أُخذ من قريته في الدوشرمة، وتعلّم في ثكنات الجيش، وشارك في حروب، ثم اكتشف فيه قادته موهبةً هندسية. وهذه هي الفكرة التي قامت عليها الدولة: أن تُعطي الفرصة لمن ليس له نسب، مقابل ولاءٍ كامل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بقي خمسين سنة في منصبه، وهذا الاستقرار هو ما جعل مدرسةً معمارية كاملة تُبنى على يديه. فلو تغيّر رئيس المعماريين كل عشر سنوات، لما وصل الطراز إلى نضجه. ومن هنا درسٌ في الإدارة الثقافية: أن الإبداع يحتاج وقتًا أطول من عمر الحكومات، فإذا أرادت دولةٌ أن تبني تراثًا فعليها أن تُبقي أهل الاختصاص لا أن تُبدّلهم مع كل وزير.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالمدينة العثمانية\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم تكن المدينة العثمانية مخططًا واحدًا، بل نتاج تراكم. الجامع في الوسط، وحوله السوق، وحول السوق الأحياء السكنية، وكل حيٍّ له مسجدٌ صغير وحمّام ومدرسة. والشوارع ضيقة متعرّجة، والبيوت من طابقين بخشبٍ وطوب، والنوافذ مشبّكة، والأفنية الداخلية فيها شجر. وهذا النسيج كان يُبنى بالوقف والأهل لا بمخططٍ مركزي، فصار كل حيٍّ مختلفًا عن جاره.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت المياه هي العنصر الحاسم. فالمدينة العثمانية تُبنى حيث الماء: قناة، أو نهر، أو بئر. ولهذا بُنيت القناطر والأسبلة والحماّمات قبل المساجد الكبرى أحيانًا. وحين تُذكر مدينةٌ عثمانية في المصادر، يُذكر معها «سبيلها» و«حمّامها»، لأن هذين كانا علامةً على أنها مدينةٌ حيّة لا قرية.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسنان\u003c/b\u003e\u003cspan\u003eرئيس المعماريين خمسين سنة، ونُسب إليه أكثر من ثلاثمئة بناء\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالسليمانية ١٥٥٧م\u003c/b\u003e\u003cspan\u003eمجمّعٌ كامل: جامع ومدارس ومكتبة وبيمارستان ومطبخ\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالسليمية\u003c/b\u003e\u003cspan\u003eقبة أدرنة التي تجاوزت آيا صوفيا في القطر\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالوقف العمراني\u003c/b\u003e\u003cspan\u003eالقناطر والأسبلة والحمّامات بُنيت قبل المساجد الكبرى أحيانًا\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالبناء\u003c/th\u003e\u003cth\u003eالمدينة\u003c/th\u003e\u003cth\u003eالسمة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eشهزاده\u003c/td\u003e\u003ctd\u003eالقسطنطينية\u003c/td\u003e\u003ctd\u003eأول تجربة ناضجة في القبة المركزية\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالسليمانية\u003c/td\u003e\u003ctd\u003eالقسطنطينية\u003c/td\u003e\u003ctd\u003eمجمّعٌ متكامل يوازن الكتلة والفراغ\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالسليمية\u003c/td\u003e\u003ctd\u003eأدرنة\u003c/td\u003e\u003ctd\u003eأوسع قبة مفردة، وثمانٍ تحمل الأعباء\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eجسر صوغوتلي\u003c/td\u003e\u003ctd\u003eالبوسنة\u003c/td\u003e\u003ctd\u003eهندسة جسورٍ طويلة على الأنهار\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003e«أردتُ أن تكون قبةً تسبح في الهواء»\u003c/p\u003e\u003ccite\u003eما يُنسب إلى سنان في وصف قبّة السليمانية\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eجمعت العمارة العثمانية بين القبة السلجوقية والهيكل البيزنطي، وأنتجت قبةً واحدة تُغطي بيت الصلاة كله. وفي قلب هذا التطور رجلٌ واحد: سنان، أُخذ في الدوشرمة وبقي خمسين سنة في منصبه، فبَنى السليمانية والسليمية والقناطر والجسور، وحوّل العمارة إلى بيانٍ سياسي عن وحدة الأمة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"navy-mediterranean","n":"البحر المتوسط والأسطول","ic":"⛵","part":"القسم الثالث: الذروة","h":"\u003carticle class=\"ch3\" id=\"navy-mediterranean\" data-toc=\"البحر المتوسط والأسطول\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٣.٤\u003c/span\u003e\n          \u003ch3\u003e⛵ البحر المتوسط والأسطول\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eم\u003c/span\u003eن بريفيزا إلى ليبانتو: قرنٌ حاول فيه العثمانيون أن يجعلوا البحر المتوسط بحيرةً لهم، ونجحوا نصف نجاح ثم خسروا النصف الآخر. هذه قصة قوةٍ بحرية بُنيت ثم أُهملت.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان البحر المتوسط في مطلع القرن السادس عشر مقسومًا بين ثلاث قوى: البندقية بأسطولها التجاري العريق، والهابسبورغ في إسبانيا ونابولي وصقلية، والعثمانيون في الأناضول والبلقان. وكانت السواحل الشمالية الأفريقية — من طرابلس إلى الجزائر — ساحةً مفتوحة لهذه القوى، يحكمها أمراء محليون وأساطيل قرصنة تعمل لحساب نفسها. وفهم العثمانيون أن من يسيطر على هذه السواحل يسيطر على الحوض الغربي كله.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان خير الدين بربروس هو مفتاح هذا التحوّل. جاء من جزيرةٍ في بحر إيجه، وعمل مع أخيه في غزو السفن الإسبانية والبرتغالية، ثم استقرّ في الجزائر، ثم دخل في طاعة السلطان سنة ١٥١٩م، فصار قائدًا عثمانيًّا بأسطولٍ خاص. وكانت قيمته أنه يعرف البحر كما يعرف أهلُه: الرياح والتيارات والموانئ والجزر. وهذه المعرفة كانت أهم من السفن، لأن الدولة كانت تستطيع بناء السفن ولا تستطيع بناء خبرةٍ في عشر سنوات.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سنة ١٥٣٨م وقعت معركة بريفيزا في البحر اليوناني. وكان الأسطول المسيحي الموحّد بقيادة الأدميرال أندريا دوريا أكبر عددًا، لكنه لم يستطع أن يحسم المعركة، فانسحب بعد يومٍ من المناورة. وكانت النتيجة أن البحر صار مفتوحًا للسفن العثمانية، وأن هيبة الأسطول العثماني ارتفعت ارتفاعًا هائلًا. ولم تكن المعركة انتصارًا ساحقًا بالمعنى التكتيكي، لكنها كانت انتصارًا استراتيجيًّا: أن يخرج أسطولٌ مسيحي موحّد من معركةٍ مع أسطولٍ عثماني بلا نتيجة، فهذا في العرف البحري هزيمة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوبعد بريفيزا امتدّ النفوذ العثماني في شمال أفريقيا: طرابلس سنة ١٥٥١م، ثم الجزائر وتونس، ثم محاولةٌ لطرد الإسبان من مالطة سنة ١٥٦٥م انتهت بالفشل بعد حصارٍ مرير. وكان فشل مالطة مهمًّا لأنه أظهر حدًّا للقوة العثمانية في البحر: أن الدولة تستطيع أن تهزم أسطولًا في معركة، لكنها لا تستطيع أن تحتلّ جزيرةً محصّنة بعيدة عن قواعدها، لأن الإمداد في البحر أصعب منه في البر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سنة ١٥٧١م فتح العثمانيون قبرص، وكانت تحت حكم البندقية. وكان الفتح عنيفًا: حصارٌ طويل، ومجاعة، ثم استسلامٌ ومجزرةٌ بحقّ الحامية والمدنيين، وهي من الصفحات القاتمة في تاريخ الدولة. فردّت أوروبا بتشكيل «العصبة المقدسة» بقيادة إسبانيا والبندقية، فالتقى الأسطولان في خليج ليبانتو في أكتوبر ١٥٧١م، في واحدةٍ من أكبر المعارك البحرية في التاريخ.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت ليبانتو كارثة. فقد خسر العثمانيون أكثر من مئتي سفينة، وقتل آلاف البحّارة، وكانت السفن تُدفع إلى الشاطئ وتُحرق. واحتفلت أوروبا احتفالًا لم تعرفه من قبل، ونُقشت لوحاتٌ وضُربت ميداليات، وقيل إن نصف قوة العثمانيين في البحر قد انتهت. لكن الصدر الأعظم آنذاك — وكان رجلًا حكيمًا اسمه صقوللي محمد باشا — قال جملةً بقيت في التاريخ: إن أخذوا منّا الأسطول، فإنّا نأخذ منهم الجزيرة، وإننا نستطيع أن نبني أسطولًا جديدًا ولا يستطيعون أن يبنوا جزيرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان كلامه صحيحًا. ففي أقلّ من سنة أُعيد بناء الأسطول بأكثر من مئتي سفينة جديدة، لأن الدولة كانت تملك ترساناتٍ وموادَّ وبحّارة. وفي السنة التالية استعاد العثمانيون تونس من الإسبان. وهكذا لم تُنهِ ليبانتو القوة العثمانية في البحر، لكنها أنهت أسطورتها: أن الأسطول العثماني لا يُهزم. ومنذ ذلك الحين تحوّل الهدف من السيطرة على البحر إلى الدفاع عن السواحل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت مشكلة الأسطول الحقيقية هي التقنية. فالعثمانيون بنوا سفنًا على الطراز المتوسطي: سفن تجديف طويلة، وسفن شراعية ثقيلة. وأما أوروبا فقد تطوّرت إلى السفن الشراعية الكبيرة المسلّحة بعشرات المدافع، التي لا تحتاج مجدّفين ولا تعتمد على الريح في المناورة. وهذا الفارق صار حاسمًا في القرن السابع عشر: أن سفينةً أوروبية واحدة قد تُبيد أسطولًا من السفن الصغيرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي القرن الثامن عشر صار الأسطول العثماني في حالةٍ سيئة: سفن قديمة، وقيادةٌ من غير أهل البحر، ورشوةٌ في الترسانة، وقلّة تدريب. وحاول السلطان سليم الثالث إصلاحه فأنشأ مدرسةً بحرية وأتى بخبراء، لكن الإصلاح جاء في وقتٍ كانت الدولة تُقاتل فيه روسيا على البحر الأسود وتخسر أسطولها في «تشسمة» سنة ١٧٧٠م. وهكذا انتقل البحر المتوسط من بحيرةٍ عثمانية إلى ساحةٍ للأساطيل الأوروبية، وصارت السواحل العثمانية تُهدَّد من البحر لا تُهدِّد.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eبريفيزا: كيف تُصنع الهيبة؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم تكن بريفيزا معركةً حاسمة بالمعنى العسكري، فقد انسحب الأسطول المسيحي ولم يُدمَّر. لكن أثرها كان في الهيبة: أن أسطولًا موحّدًا من إسبانيا والبندقية والبابوية يخرج من ميدانٍ أمام العثمانيين بلا نصر، يعني أن البحر لم يعد آمنًا لهم. وهذا المعنى هو ما فتح بعدها السواحل الأفريقية كلها للعثمانيين بلا حربٍ كبيرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالدرس أن الهيبة في البحر لا تُبنى بعدد السفن فقط، بل بالسجلّ: أن يعرف كل بحّارٍ في المتوسط أن أسطولًا معيّنًا لا يُهزم. وهذا السجلّ هو الذي يجعل المدن تُسلّم بلا قتال، ويجعل التجار يدفعون الاتاوة، ويجعل الخصوم يحسبون ألف حساب قبل الإبحار. ولهذا كان العثمانيون يحرصون على إظهار أسطولهم في الموانئ في مواسم معلومة، لأن العرض في البحر جزءٌ من الحرب في البحر.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eليبانتو: هزيمةٌ لم تُنهِ الدولة\u003c/h4\u003e\u003cp class=\"ap\"\u003eتُروى ليبانتو في أوروبا كنصرٍ عظيم، وهي كانت كذلك في يومها. لكن المؤرخ يلاحظ أن أثرها الاستراتيجي كان محدودًا: فقد استُعيد الأسطول في أشهر، واستُعيدت تونس في السنة التالية، وبقيت قبرص عثمانية ثلاثة قرون. والسبب أن الدولة كانت تملك ما يُسمّى «العمق الصناعي»: ترسانة، ومحاجر خشب، ومعادن، وبحّارة، فاستطاعت أن تُعوّض الخسارة.\u003c/p\u003e\u003cp class=\"ap\"\u003eلكن الحرب البحرية تُقاس بالاتجاه لا بالحادثة. فبعد ليبانتو لم يعد العثمانيون يبحثون عن معركةٍ فاصلة في البحر، بل انتقلوا إلى الدفاع. وهذا التحوّل هو المؤشر الحقيقي: أن الدولة لم تعد تطمح إلى السيطرة على المتوسط، بل إلى حماية سواحلها منه. وفي التاريخ البحري، من ينتقل من الهجوم إلى الدفاع فقد المبادرة ولو انتصر في معركة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eلماذا خسر العثمانيون البحر؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eخسروا البحر لأنهم خسروا التقنية أولًا، ثم خسروا المؤسسة. فالسفينة الشراعية الكبيرة المسلّحة بالمدافع غيّرت قواعد اللعبة، ولم تُواكب الترسانة العثمانية هذا التحول بالسرعة الكافية. ثم إن قيادة الأسطول صارت منصبًا يُمنح بالمحاباة لا بالخبرة، فتراجع التدريب، وساءت أحوال البحّارة، وانتشرت الرشوة في الترسانة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالدرس الأعمّ أن القوة البحرية تحتاج إلى اقتصادٍ صناعي خلفها لا إلى بحّارةٍ فقط. فالدولة التي لا تصنع مدافعها وحديدها وخشبها بمقاييس عالية لا تستطيع أن تُبقي أسطولًا. وهذا ما ستفهمه الدولة متأخرةً في القرن التاسع عشر، حين اشترت سفنًا حديثة من الخارج ولم تستطع أن تُشغّلها بكفاءة.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eبربروس\u003c/b\u003e\u003cspan\u003eقائد بحري من بحر إيجه دخل في طاعة السلطان، وبنى قوة الدولة البحرية\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eبريفيزا ١٥٣٨م\u003c/b\u003e\u003cspan\u003eانتصار استراتيجي جعل البحر المتوسط ساحةً عثمانية\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eليبـانتو ١٥٧١م\u003c/b\u003e\u003cspan\u003eكارثة بحرية، لكن الأسطول أُعيد بناؤه في أقل من سنة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eتشسمة ١٧٧٠م\u003c/b\u003e\u003cspan\u003eإحراق الأسطول العثماني على يد روسيا، وبداية تراجعٍ دائم\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمعركة\u003c/th\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالنتيجة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eبريفيزا\u003c/td\u003e\u003ctd\u003e١٥٣٨م\u003c/td\u003e\u003ctd\u003eهيبة بحرية عثمانية وامتداد في شمال أفريقيا\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eمالطة\u003c/td\u003e\u003ctd\u003e١٥٦٥م\u003c/td\u003e\u003ctd\u003eفشل الحصار، وأول حدٍّ للقوة العثمانية في البحر\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eليبـانتو\u003c/td\u003e\u003ctd\u003e١٥٧١م\u003c/td\u003e\u003ctd\u003eخسارة الأسطول، ثم إعادة بنائه في سنة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eتشسمة\u003c/td\u003e\u003ctd\u003e١٧٧٠م\u003c/td\u003e\u003ctd\u003eإحراق الأسطول، وبداية التفوق الروسي في البحر الأسود\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003e«إن أخذوا منّا الأسطول فإنّا نأخذ منهم الجزيرة، ونحن نبني أسطولًا ولا يستطيعون أن يبنوا جزيرة»\u003c/p\u003e\u003ccite\u003eما يُنسب إلى صقوللي محمد باشا بعد ليبانتو\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eبنى العثمانيون قوةً بحرية بشراكة خبراء شمال أفريقيا، فسيطروا على الحوض الشرقي والغربي في القرن السادس عشر. ثم جاءت ليبانتو فكشفت هشاشة التقنية، لكن الأسطول أُعيد لأن الدولة كانت تملك ترسانة. والتدهور الحقيقي جاء حين تخلّفت السفن والقيادة عن التحوّل التقني، فانتقلت الدولة من الهجوم في البحر إلى الدفاع عن سواحلها.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-4","n":"القسم الرابع: التوقف والتراجع","ic":"","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-4\" style=\"--c:#2F4F4F\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🍂\u003c/div\u003e\n      \u003ch2\u003eالقسم الرابع: التوقف والتراجع\u003c/h2\u003e\n      \u003cp\u003eمن فيينا ١٦٨٣م إلى مودروس ١٩١٨م: قصة قرنين ونصف حاولت فيهما الدولة أن تُصلح نفسها فلم تستطع، أو لم تُترك لها الفرصة. هذا القسم يقرأ الأزمة، ثم الإصلاح، ثم التنظيمات، ثم النهاية.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#crisis-17c\"\u003eأزمة القرن السابع عشر\u003c/a\u003e\u003ca href=\"#reform-18c\"\u003eإصلاحات القرن الثامن عشر\u003c/a\u003e\u003ca href=\"#tanzimat\"\u003eالتنظيمات والإصلاحات\u003c/a\u003e\u003ca href=\"#ww1-end\"\u003eالحرب العالمية الأولى والنهاية\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"crisis-17c","n":"أزمة القرن السابع عشر","ic":"🌾","part":"القسم الرابع: التوقف والتراجع","h":"\u003carticle class=\"ch3\" id=\"crisis-17c\" data-toc=\"أزمة القرن السابع عشر\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٤.١\u003c/span\u003e\n          \u003ch3\u003e🌾 أزمة القرن السابع عشر\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eب\u003c/span\u003eعد موت سليمان بدأت الدولة تفقد ما كانت تملكه: سلطةً مركزية، وجيشًا منضبطًا، وفلاحين على الأرض. وفي ١٦٨٣م وصلت إلى فيينا، ثم ارتدّت إلى ما وراء بلغراد.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eالقرن السابع عشر هو القرن الذي توقّف فيه الزمن العثماني. فبعد موت سليمان سنة ١٥٦٦م دخلت الدولة في سلسلةٍ من السلاطين الضعفاء أو الأطفال، وتولّى الحكم فعليًّا الصدور العظام ونساء القصر والإنكشارية. ولم يكن الضعف في الأشخاص فقط، بل في البنية: نظام التيمار بدأ يتفكك، والإنكشارية بدأت تتضخم وتتاجر، والفلاح بدأ يهجر الأرض بسبب الضرائب، فانخفض الإنتاج، فانخفض دخل الخزانة، فتأخّرت رواتب الجند، فزاد السخط، فزادت الثورات. وهذه حلقةٌ مفرغة لم يكن الخروج منها ممكنًا بإصلاحٍ جزئي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوظهرت أول علامات الخلل في القصر. ففي سنة ١٦٢٢م قُتل السلطان عثمان الثاني على يد الإنكشارية بعد أن حاول تقليص نفوذهم وإصلاح الجيش، وهو أول سلطان يُقتل بيد جنده. وكانت هذه سابقةً خطيرة: أن الجيش صار له حقّ الاعتراض على السلطان. وبعد ذلك تكرر المشهد: عزلٌ، وقتل، وتغيير وزيرٍ في ليلة. وكان السلطان في هذه الفترة يعيش في قصرٍ محصّن، ويحكم من خلال تقارير، ويفقد تدريجيًّا صلةً حقيقية بالبلاد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي الأناضول انفجرت ثورات «الجلالية». وكانت بدايتها جنودًا فُصلوا من الخدمة أو فلاحين هربوا من الضرائب، ثم صارت حركاتٍ مسلّحة كبيرة بلغت عشرات الآلاف، نهبت المدن وأحرقت القرى وهزّت الاقتصاد. وقد استمرّت متقطعةً من أواخر القرن السادس عشر إلى منتصف السابع عشر، وأجبرت الدولة على تحويل جيوشها من الجبهات الخارجية إلى الداخل. وكان أثرها الأعمق هو الهجرة: أن آلاف الفلاحين تركوا الأرض، فانخفض الإنتاج الزراعي في وقتٍ كانت الخزانة في أشدّ الحاجة إليه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي سنة ١٦٣٨م استعاد السلطان مراد الرابع بغداد من الصفويين بعد حملةٍ شاقة، وكان سلطانًا حازمًا أعاد بعض الهيبة للدولة، لكنه مات شابًّا سنة ١٦٤٠م فعادت الفوضى. ثم جاءت أزمةٌ مالية حادة، وحربٌ طويلة مع البندقية على جزيرة كريت استمرت أربعًا وعشرين سنة، واستنزفت الخزانة والرجال. وفي هذه اللحظة ظهر رجلٌ غيّر مسار الأزمة: محمد كوبريلي، الذي تولّى الصدارة سنة ١٦٥٦م بشرطٍ غير مألوف: أن يُمنح سلطةً كاملة بلا تدخّل، وأن يكون له حقّ العزل والتعيين، وأن لا يُحاسب إلا أمام السلطان.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أنقذ كوبريلي الدولة بالقوة. فقمع التمردات في الأناضول بحملاتٍ قاسية، وأعدم المتمرّدين، وأعاد الانضباط إلى الإنكشارية، وأصلح الخزانة، وأعاد هيبة الدولة في البلقان. وخلفه ابنه فاضل أحمد، ففتح كريت سنة ١٦٦٩م، ووصلت الدولة إلى أقصى قوتها بعد سليمان. ثم جاء من بعدهما قرة مصطفى، الذي قاد الحملة الكبرى على فيينا سنة ١٦٨٣م، وهي الحملة التي غيّرت كل شيء.\u003c/p\u003e\u003cp class=\"ap\"\u003eوحصار فيينا سنة ١٦٨٣م كان أكبر حملة عثمانية في أوروبا بعد قرنٍ ونصف. وقد وصل الجيش إلى الأسوار، وحاصر المدينة سبعة أسابيع، لكنه لم يكن يملك مدفعية حصارٍ كافية، ولا كان يعلم أن جيشًا أوروبيًّا موحّدًا بقيادة ملك بولندا قادم. وفي ١٢ سبتمبر ١٦٨٣م وقع الهجوم المفاجئ على المعسكر العثماني، فانهار الجيش، وفقد العثمانيون مدفعيتهم وخزينتهم، وانسحبوا في فوضى. وكانت الهزيمة نقطة تحوّل: أوروبا أدركت أن الدولة قابلة للهزيمة، فشكّلت «العصبة المقدسة» واستمرت الحرب ستة عشر عامًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوانتهت الحرب بمعاهدة كارلوفجة سنة ١٦٩٩م، وهي أول معاهدة يُعترف فيها العثمانيون بالخسارة ويُتفاوضون فيها من موقع الضعف. فقدوا المجر كلها تقريبًا، وترانسلفانيا، وأجزاءً من كرواتيا، وأوكرانيا. ولأول مرة في تاريخهم، صاروا طرفًا يُعطى ولا يأخذ فقط. وكان أثر المعاهدة نفسيًّا أعمق من أثرها الجغرافي: أن الدولة التي كانت تفتح صارت تدافع، وأن حدودها صارت ثابتة، وأن فكرة «الفتح الدائم» ماتت.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت هناك محاولةٌ لإصلاحٍ مبكر. ففي ١٧١٨م عُقدت معاهدةٌ مع النمسا استعاد بها العثمانيون بلغراد وأجزاءً من صربيا، ثم جاء عهد «لالة» في عهد أحمد الثالث، فظهرت فيه أول مطبعةٍ عثمانية، وأول ترجماتٍ من الأوروبية في الطب والجغرافيا، وأول حدائق على الطراز الأوروبي. وكان هذا الافتتاح الثقافي مهمًّا لكنه كان هشًّا، لأنه كان في القصر لا في المجتمع، ولأنه انتهى بانتفاضةٍ شعبية سنة ١٧٣٠م أطاحت بالسلطان وقتلت الصدر الأعظم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالمؤرخ لا يصف القرن السابع عشر بالانحلال الكامل، لأن الدولة فيه كانت لا تزال قادرة على الفتح والدفاع، وقد بلغت في نهايته أقصى حدودها في أوروبا. لكن ما جرى فيه كان تحوّلًا في طبيعة الدولة: من إمبراطوريةٍ تتوسّع إلى إمبراطوريةٍ تُدافع، ومن نظامٍ يعمل بالفتح والغنيمة إلى نظامٍ يعمل بالضريبة والتفاوض. ومن لم يفهم هذا التحول ظنّ أن الأمر مجرّد ضعف سلاطين، والحقيقة أن الأمر تغيّر في البنية الاقتصادية والعسكرية كلها.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eكيف تتحول مؤسسة إلى مشكلة؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eالإنكشارية لم تفسد في يوم. ففي البداية كان الدخول إليها يعني تدريبًا شاقًّا وانضباطًا صارمًا، وكان من يخالف يُطرد. ثم صار الدخول يُشترى، وصار أبناء الإنكشارية يرثون المكان، وصار الجندي يعمل في السوق ويملك دكّانًا، وصار عدده يتضخم من بضعة آلاف إلى عشرات الآلاف. وكل خطوة من هذه كانت منطقية في وقتها: الجندي يحتاج دخلًا إضافيًّا حين تتأخر رواتبه، والدولة تحتاج أعدادًا أكبر في الحروب الطويلة.\u003c/p\u003e\u003cp class=\"ap\"\u003eلكن المجموع صار كارثة: جيشٌ لا يقاتل، لكنه يستطيع أن يخلع السلطان، ويعرف كيف يُشلّ العاصمة. وهذه هي المفارقة: أن المؤسسة التي بُنيت لحماية الدولة صارت أكبر خطرٍ عليها، لا بخيانةٍ منها بل بتشوّهٍ بطيء لم يجرؤ أحد على تصحيحه لأن التصحيح كان يعني مواجهتها.\u003c/p\u003e\u003ch4 class=\"sub\"\u003e١٦٨٣م: ما الذي جرى في فيينا؟\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم تكن الحملة على فيينا قرارًا عشوائيًّا، بل جاءت في سياق صراعٍ مع الهابسبورغ على المجر. وكان قائد الحملة يطمع في فتحٍ كبير يعزّز موقعه، فدفع السلطان إلى الحرب. لكن الجيش العثماني وصل متأخرًا في الموسم، ولم يكن يملك مدفعيةً كافية لهدم أسوار فيينا، ولم تكن خططه محكمة للتعامل مع جيشٍ خارجي قد يأتي لنجدة المدينة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالأهم أن أوروبا كانت قد تغيّرت. ففي ١٦٨٣م لم تكن أوروبا ممالك متنازعة كما كانت في ١٥٢٩م، بل كانت دولًا أقوى ماليًّا وعسكريًّا، ولها جيوش دائمة ومدفعية وتنظيم. وحين انهزم العثمانيون أمام تحالفٍ أوروبي، لم تكن الهزيمة عسكرية فقط، بل كانت إعلانًا بأن فارق القوة التقنية بدأ يميل ضدهم.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eكارلوفجة: أول اعتراف بالخسارة\u003c/h4\u003e\u003cp class=\"ap\"\u003eمعاهدة كارلوفجة ١٦٩٩م ليست مجرّد وثيقةٍ حدودية، بل هي أول مرة يجلس فيها العثمانيون على طاولةٍ مع أعدائهم كطرفٍ منهزم. وقد تفاوضوا بذكاء واستطاعوا الاحتفاظ ببعض المواقع، لكن المبدأ نفسه تغيّر: أن الحدود يمكن أ
