في الصدور. وكان هذا الحفظ قويًّا في الجملة، لكنه كان يتعرض للنسيان والتحريف إذا مات الحافظ. ولهذا كان تدوين القرآن في حياة النبي وفي عهد أبي بكر وعثمان حدثًا عظيمًا في تاريخ الحفظ، لأنه نقل الأمة من حفظ الصدور إلى حفظ السطور. وكان هذا الحفظ قويًّا في الجملة، لكنه يتعرض للنسيان والتحريف إذا مات الحافظ.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان النبي أميًّا لا يقرأ ولا يكتب، وهذا من أعظم دلائل النبوة، لأنه جاء بكتاب لا يستطيع أحد أن يقول إنه قرأه في كتاب قبله. وقد قال القرآن: وما كنت تتلو من قبله من كتاب ولا تخطه بيمينك، إذًا لارتاب المبطلون. وقد كان هذا الوصف معروفًا عند قريش، فلم يستطيعوا أن ينكروه. وقد كان هذا الوصف معروفًا عند قريش، فلم يستطيعوا أن ينكروه وهم يعرفون حاله.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد انتشرت الكتابة انتشارًا سريعًا بعد الإسلام، لأن الدولة احتاجت إلى دواوين ورسائل وعقود، ولأن القرآن احتاج إلى نسخ ومصاحف. وفي أقل من قرن صارت العربية لغة كتابة في الشام والعراق ومصر وفارس، وظهر خط النسخ والكوفي والثلث، وصارت الكتابة فنًّا له قواعده كما كان الشعر فنًّا له قواعده. وفي أقل من قرن صارت العربية لغة كتابة في الشام والعراق ومصر وفارس.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالمسند وخط الحجاز\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان المسند خطًّا خاصًّا بجنوب الجزيرة، يُكتب بحروف منفصلة لها أشكال هندسية، وقد وُجد في نقوش كثيرة تعود إلى ممالك سبأ وحمير. وكان يُكتب من اليمين إلى اليسار في الغالب، وأحيانًا بالتبادل في الاتجاه بين السطور. وكان يُكتب من اليمين إلى اليسار في الغالب، وأحيانًا بالتبادل في الاتجاه بين السطور.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما خط الحجاز فكان أبسط وأقرب إلى الخط العربي المعروف، وكان يُكتب به في مكة والمدينة قبل الإسلام. وقد كان قليل الحروف الموصولة في أوله، ثم تطوّر بالنقط والتشكيل بعد الإسلام حين احتاج المسلمون إلى ضبط القرآن. ثم تطوّر بالنقط والتشكيل بعد الإسلام حين احتاج المسلمون إلى ضبط القرآن ضبطًا دقيقًا.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالكتابة والعقود\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الكتابة في الجاهلية أداةً للعقود أكثر منها أداةً للأدب، لأن الشعر كان يُحفظ ولا يُكتب. وقد كان الناس يكتبون الوصايا والديون والعهود، ويُشهدون عليها، وكان في مكة من يكتب الوثائق بأجر. وكان الشعر يُحفظ ولا يُكتب في الأغلب، لأن العرب كانوا يعتمدون على الرواية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد جاء الإسلام فأمر بكتابة الدين في أطول آية في القرآن، وهي آية المداينة، وأمر بالإشهاد والعدل في الكتابة. وبهذا صارت الكتابة أداةً شرعيةً واقتصادية، وصار الكاتب شاهدًا على الحقوق لا مجرد ناسخٍ للكلام. وقد أمر القرآن بكتابة الدين في أطول آية فيه، وأمر بالإشهاد والعدل في الكتابة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eمن الصدور إلى السطور\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الانتقال من الحفظ إلى الكتابة أهم تحوّل ثقافي في تاريخ العرب، لأنه جعل التراث قابلًا للحفظ الدقيق والنقل الواسع. وقد بدأ هذا الانتقال بالقرآن ثم بالحديث ثم بالشعر والنسب والتاريخ، وفي كل مرحلة كان للكتابة أثر في ضبط المادة. وقد بدأ هذا الانتقال بالقرآن ثم بالحديث ثم بالشعر والنسب والتاريخ، مرحلةً بعد مرحلة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان لهذا الانتقال ثمن أيضًا، لأن الكتابة لا تحفظ الصوت والإعراب كما يحفظه الحافظ، فاحتاج العلماء إلى الرواية مع الكتابة. ولهذا بقي الإسناد معروفًا في الحديث، وبقي السماع شرطًا في الرواية، وهذا هو ما جعل التراث الإسلامي محفوظًا من جهتين. ولهذا بقي الإسناد معروفًا في الحديث، وبقي السماع شرطًا في الرواية عند المحدثين.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمسند\u003c/b\u003e\u003cspan\u003eخط جنوب الجزيرة في نقوش سبأ وحمير\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالخط العربي\u003c/b\u003e\u003cspan\u003eتطوّر من النبطي وانتقل إلى الحجاز\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالاستعمال\u003c/b\u003e\u003cspan\u003eعقود ووصايا ورسائل أكثر من أدب\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالأمية\u003c/b\u003e\u003cspan\u003eالنبي أمي، وهذا من دلائل النبوة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالتحول\u003c/b\u003e\u003cspan\u003eمن حفظ الصدور إلى حفظ السطور\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالخط\u003c/th\u003e\u003cth\u003eموضعه\u003c/th\u003e\u003cth\u003eما بقي منه\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالمسند\u003c/td\u003e\u003ctd\u003eاليمن\u003c/td\u003e\u003ctd\u003eنقوش على الصخور والمعابد\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالنبطي\u003c/td\u003e\u003ctd\u003eشمال الجزيرة والشام\u003c/td\u003e\u003ctd\u003eأصل الخط العربي الشمالي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالجزم\u003c/td\u003e\u003ctd\u003eالحجاز\u003c/td\u003e\u003ctd\u003eخط مكة والمدينة قبل الإسلام\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالكوفي\u003c/td\u003e\u003ctd\u003eالكوفة والبصرة\u003c/td\u003e\u003ctd\u003eمصاحف القرون الأولى\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالنسخ\u003c/td\u003e\u003ctd\u003eالعالم الإسلامي\u003c/td\u003e\u003ctd\u003eخط المصاحف إلى اليوم\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eوَمَا كُنتَ تَتْلُو مِن قَبْلِهِ مِن كِتَابٍ وَلَا تَخُطُّهُ بِيَمِينِكَ إِذًا لَّارْتَابَ الْمُبْطِلُونَ\u003c/p\u003e\u003ccite\u003eسورة العنكبوت، الآية ٤٨\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eكانت الكتابة قليلةً لكنها موجودة، وكان الخط العربي قد تهيّأ قبل الإسلام ليكتب به القرآن. وقد نقل الإسلام الأمة من حفظ الصدور إلى حفظ السطور، فصار التراث محفوظًا بالرواية والكتابة معًا.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-6","n":"القسم السادس: العقل الجاهلي","ic":"","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-6\" style=\"--c:#8B6914\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🔮\u003c/div\u003e\n      \u003ch2\u003eالقسم السادس: العقل الجاهلي\u003c/h2\u003e\n      \u003cp\u003eكان للعرب قبل الإسلام عالمٌ من المعرفة لا يُكتب في الكتب: كهانةٌ وعرافة، وأنسابٌ تُحفظ في الصدور، وأمثالٌ تُقال في المجالس، ومعارفُ في النجوم والأمطار والطبّ. وهذا القسم يقرأ ذلك العقل كما كان، لا كما تصوّره الحكايات اللاحقة.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#soothsaying\"\u003eالكهانة والعرافة والطيرة\u003c/a\u003e\u003ca href=\"#days-and-lineages\"\u003eأيام العرب والأنساب\u003c/a\u003e\u003ca href=\"#practical-knowledge\"\u003eالطبّ والنجوم ومعارف الحياة\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"soothsaying","n":"الكهانة والعرافة والطيرة","ic":"🔮","part":"القسم السادس: العقل الجاهلي","h":"\u003carticle class=\"ch3\" id=\"soothsaying\" data-toc=\"الكهانة والعرافة والطيرة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٦.١\u003c/span\u003e\n          \u003ch3\u003e🔮 الكهانة والعرافة والطيرة\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eك\u003c/span\u003eان الناس في جزيرة العرب يسألون الغيب قبل أن يسألوا الطبيب، وكان في كل قبيلةٍ كاهنٌ يُرجَع إليه في الحرب والنسب والضالّة. ولم تكن الكهانة دينًا يُعبد به، بل كانت مؤسسةً اجتماعية لها أجرها ومكانتها.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان الكاهن في المجتمع الجاهلي من يتّصل بالجنّ في زعم الناس، فيُخبرهم بما سيقع أو بما خفي، وكان الناس يأتونه في السؤال عن نسب طفل، وعن موضع بعيرٍ ضاع، وعن نتيجة حربٍ تُقبل، وعن تفسير حلم. وقد كان الكاهن يجلس في موضعٍ معروف، ويأخذ على كلامه أجرًا أو هدية، وكان كلامه يُشبه الحكم، لأن الناس كانوا يُصدّقونه في كثيرٍ من أمورهم. وقد كان هذا الموضع يُعرف في القبيلة، وكان الناس يقصدونه من مسافةٍ بعيدة، وكان في هذا دليلًا على أن الحاجة إلى معرفة الغيب كانت حاجةً عامة لا خاصة بطبقةٍ واحدة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان للكهانة طريقةٌ في الكلام تُسمّى السجع، وهي كلامٌ مقفّى قصير يُشبه الشعر ولا يُوزن على بحوره، وكان الناس يرون في هذا الكلام أثرًا من الجنّ، لأنهم كانوا يرون أن الشعر نفسه يأتي من وادٍ يُسمّى وادي عبقر تسكنه الجنّ. وقد كان في هذا التصوّر تفسيرٌ شعبي لظاهرة الإلهام: أن الكلام الجميل لا يُقال بل يُلقى على اللسان. وقد كان في هذا الكلام إيقاعٌ يُسهّل حفظه، وكان الناس يُردّدونه في المجالس، وكان في تكراره سلطةٌ تُشبه سلطة الشعار في عصرنا، لأن ما يُحفظ يبقى وما يُقال مرةً واحدة يُنسى.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت العرافة نوعًا آخر من النظر في الغيب، وكانت تُستعمل فيها أدواتٌ مادّة: خطٌّ يُخطّ في الأرض، ونظرٌ في النجوم، ورميٌ بالحصى، ونظرٌ في كتف الحيوان، وكان في كل نوعٍ من هذه الأنواع من يدّعي الخبرة فيه. وقد كان الناس يفرّقون بين الكاهن الذي يُخبر بالمستقبل، والعرّاف الذي يُخبر بالماضي والخفايا، وكانت العامة تُسمّي كليهما باسمٍ واحد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان الاستقسام بالأزلام من أشهر طرق طلب القرار، وكانت الأزلام قداحًا مكتوبًا على بعضها «افعل» وعلى بعضها «لا تفعل»، فإذا أراد الرجل سفرًا أو زواجًا أو حربًا ضرب بها، فإن خرج «افعل» مضى، وإن خرج «لا تفعل» أمسك. وقد كان في هذا العجز عن اتخاذ القرار اعتمادًا على شيءٍ لا يُسأل ولا يُسأل عن جوابه، وكان الإسلام يرفضه رفضًا صريحًا لأنه يُشبه ادّعاء علم الغيب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت الطيرة من أوسع هذه المعارف انتشارًا، وهي التشاؤم من شيءٍ يُرى أو يُسمع: طائرٌ يمرّ، أو صوتٌ يُسمع، أو عرجٌ في دابة، وكان الرجل قد يردّ سفرًا كاملًا بسبب طيرٍ مرّ في اتجاهٍ لا يُحبه. وقد كان في هذا نوعٌ من القلق الذي يُصيب الناس في مجتمعٍ بلا أمن، لأن من لا يستطيع أن يُسيطر على ما حوله يبحث عن علاماتٍ تُطمئنه أو تُنذره. وقد كان في هذا الاختيار تهرّبٌ من المسؤولية، لأن من رمى القداح لا يستطيع أن يقول إنه أخطأ، ولأن القرار صار في يد القدح لا في يده، وكان هذا هو ما رفضه الإسلام حين جعل الأمر شورى وعلمًا لا قرعة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في الجزيرة من يُنكر هذه المعارف كلها، وكان فيهم من يُسمّى بالحكيم، وهو الذي يعرف الحياة بالتجربة لا بالكهانة، وكان كلامه يُشبه المثل ويُحفظ ويُروى. وقد كان في هذا خطٌّ آخر من التفكير الجاهلي: خطٌّ يعتمد على التجربة والملاحظة، وكان منه ما بقي في أمثال العرب وفي حكمهم، وكان منه ما دخل الإسلام بعد ذلك لأنه لا يُعارضه. وقد كان في هذا القلق ما يُفسّر كثرة العرافين والكهان في الجزيرة، لأن السوق تُنتج ما يُطلب، وكان الناس يطلبون الطمأنينة أكثر مما يطلبون الحقيقة، وكان هذا هو أساس صناعة الكهانة في كل زمان.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الكهانة شيءٌ من الوظيفة السياسية: فالكاهن كان يستطيع أن يُحرّض قبيلةً على حرب، وأن يُهدّئها، وأن يُعطي شرعيةً لزعيمٍ جديد، وكان بعض الكهان يُنافسون الزعماء في النفوذ. ولهذا كان الإسلام يُشدّد في رفض الكهانة، لأنها كانت سلطةً موازية للسلطة القبلية، وكان من يُصدّقها يضع قراره في يد غير أهل القرار. وقد كان في هذا الخطّ ما يُشبه الفلسفة العملية، وكان أصحابه يُعرفون بالتجربة لا بالدعوى، وكان كلامهم يُحفظ لأنه يُقال في موضعٍ يُحتاج إليه، لا لأنه يُقال في مجلسٍ للتفاخر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بقي من هذا العالم أثرٌ في اللغة والأدب: فكثيرٌ من ألفاظ الطيرة والتشاؤم والسجع دخل في العربية، وكثيرٌ من صور الشعر الجاهلي تُشير إلى الجنّ والكهان، وقد حفظت كتب الأدب أخبارًا كثيرة عن كهان العرب وكلامهم. وهذه الأخبار لا تُصدَّق كلها، لكنها تدلّ على أن الكهانة كانت ظاهرةً حقيقيةً في المجتمع، لا حكايةً أُلّفت بعد ذلك. وقد كان في هذا التنافس ما يُفسّر شدة الحملات على الكهان في الإسلام الأول، لأن النبيّ كان يُدرك أن من يُصدّق كاهنًا فقد أشرك في الطاعة قبل أن يُشرك في الاعتقاد.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالكاهن وسلطته\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الكاهن في القبيلة يقوم بوظيفةٍ تُشبه وظيفة القاضي والمستشار في وقتٍ واحد، وكان الناس يأتونه بأمورٍ لا يُحسنون حلها: نسبٌ مُتنازع عليه، ومالٌ ضائع، ودمٌ يُطلب. وكان كلامه يُقبل لأن أحدًا لا يستطيع أن يُثبت خطأه، ولأن الناس كانوا يخشون أن يُكذّبوه فيُصيبهم ما قال.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا الكلام قوّةٌ لا تحتاج إلى جيش، لأن من يُصدّقه الناس يحكم بلا سلاح. ولهذا كانت الكهانة تُشبه وسائل الإعلام في العصور القديمة: تُصنع فيها الأخبار، وتُبرَّر فيها القرارات، وتُوجَّه فيها الجماعات. وقد كان الإسلام يُواجه هذا كله بمنهجٍ واضح: أن الغيب لله، وأن القرار للإنسان.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالطيرة والقلق\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان التشاؤم بالطير عادةً عامة في جزيرة العرب، وكان الرجل إذا خرج لسفرٍ أو تجارةٍ فرأى طيرًا يطير في اتجاهٍ يُكرهه رجع، وكان الناس يُسمّون ذلك الطيرة. وقد كان في هذا انعكاسًا لحياةٍ بلا ضمان: فالتاجر لا يعرف هل يعود بماله، والمحارب لا يعرف هل يعود بحياته، ومن لا يملك ضمانًا يبحث عن إشارة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا أيضًا نوعٌ من صناعة القرار بلا مسؤولية: فالذي يرجع بسبب طيرٍ لا يُلام، لأن الطير هو الذي أمره، وهكذا يُهرب الإنسان من ثقل اختياره إلى علامةٍ خارجية. وقد كان في الإسلام في هذا الباب توجيهٌ واضح: أن يتوكّل الإنسان ويعمل، وأن لا يجعل قراره في يد طائر.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالحكمة بين الكهانة والتجربة\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يكن كل العقل الجاهلي كهانةً وخرافة، فقد كان في العرب حكماء يُعرفون بالتجربة، وكان كلامهم يُجمع ويُروى، ومنهم من كان يُشار إليه في النسب والحرب والصلح. وكان في أمثالهم ما يُشبه الفلسفة العملية: كلامٌ قصير في معنى الحياة والمال والصبر والجار. وقد كان في هذا الكلام ما يُشبه الحكمة، لأنه يُقال في موضعٍ يُحتاج فيه إلى قرار، وكان أصحابه يُعرفون بالتجربة لا بالدعوى.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا الخطّ ما يُفسّر قبول العرب للإسلام بسرعةٍ نسبية: أنهم كانوا يعرفون معاني العدل والوفاء والكرم قبل أن تُشرَّع، وأن الإسلام جاء ليُهذّب ما كان ويُقيم ما اعوجّ منه. ولهذا قال النبيّ في بعض ما رُوي عنه إنه بُعث ليُتمّم مكارم الأخلاق، وهذا يُشير إلى أن الأرض كانت مُهيّأةً بالمعنى لا بالشريعة.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالكاهن\u003c/b\u003e\u003cspan\u003eمن يُخبر بالغيب بزعم اتصاله بالجنّ\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالسجع\u003c/b\u003e\u003cspan\u003eكلامٌ مقفّى قصير يُنسب إلى الكهان\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالأزلام\u003c/b\u003e\u003cspan\u003eقداحٌ للاستقسام بين افعل ولا تفعل\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالطيرة\u003c/b\u003e\u003cspan\u003eالتشاؤم بالطير والصوت والحركة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالحكمة\u003c/b\u003e\u003cspan\u003eخطٌّ آخر يعتمد على التجربة\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالنوع\u003c/th\u003e\u003cth\u003eطريقته\u003c/th\u003e\u003cth\u003eموقف الإسلام منه\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالكهانة\u003c/td\u003e\u003ctd\u003eادّعاء الاتصال بالجنّ\u003c/td\u003e\u003ctd\u003eرفضٌ صريح وتحريم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالعرافة\u003c/td\u003e\u003ctd\u003eالنظر في الخطّ والنجوم\u003c/td\u003e\u003ctd\u003eرفضٌ لأنه ادّعاء غيب\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالاستقسام\u003c/td\u003e\u003ctd\u003eضرب القداح للأمر والنهي\u003c/td\u003e\u003ctd\u003eرفضٌ لأنه بلا علم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالطيرة\u003c/td\u003e\u003ctd\u003eالتشاؤم بالطير والأصوات\u003c/td\u003e\u003ctd\u003eنهيٌ وتوجيه إلى التوكّل\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالحكمة\u003c/td\u003e\u003ctd\u003eالتجربة والأمثال\u003c/td\u003e\u003ctd\u003eقبولٌ لما يوافق الشرع\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eقُل لَّا يَعْلَمُ مَن فِي السَّمَاوَاتِ وَالْأَرْضِ الْغَيْبَ إِلَّا اللَّهُ\u003c/p\u003e\u003ccite\u003eسورة النمل، الآية ٦٥\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eكانت الكهانة مؤسسةً اجتماعية تُنتج قراراتٍ وتُبرّر سلطات، وكانت الطيرة تُعبّر عن قلق مجتمعٍ بلا أمن. وقد رفض الإسلام ادّعاء الغيب كلّه، وأبقى من العقل الجاهلي ما كان قائمًا على التجربة والخلق.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"days-and-lineages","n":"أيام العرب والأنساب","ic":"📜","part":"القسم السادس: العقل الجاهلي","h":"\u003carticle class=\"ch3\" id=\"days-and-lineages\" data-toc=\"أيام العرب والأنساب\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٦.٢\u003c/span\u003e\n          \u003ch3\u003e📜 أيام العرب والأنساب\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eك\u003c/span\u003eانت القبيلة تعرف تاريخها بالأنساب وبالأيام: يوم انتصرت فيه، ويوم انكسرت فيه، ومن قُتل من أبنائها ومن قتل. ولم يكن هذا ترفًا، بل كان ذاكرةً سياسية تُحدّد من يُحالف ومن يُعادي.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان النسب في المجتمع الجاهلي هو الهوية الأولى للإنسان، وكان الرجل يُعرف بابن فلان من بني فلان، وكان في القبيلة من يُسمّى النسّابة، وهو الذي يحفظ أنساب الناس وفروعهم وأخبارهم. وقد كان هذا العلم ضروريًّا في أمورٍ عملية: في الدية، وفي الميراث، وفي الشهادة، وفي الحلف، وفي الزواج، لأن كل شيءٍ في القبيلة يُحسب بالنسب. وقد كان هذا العلم يُستعمل في أمورٍ لا تُحصى: في معرفة من يُحالف من، وفي تحديد من يُدفع له العقل، وفي معرفة من يُزوَّج من، وكان في هذا دليلًا على أن النسب كان نظامًا قانونيًّا لا مجرّد فخر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت القبيلة تُنسب إلى جدٍّ أعلى، وكانت الفروع تتشعّب منه، وكان في العرب من يُنسب إلى عدنان ومن يُنسب إلى قحطان، وكان هذا التقسيم يُستعمل في الفخر وفي التحالف أحيانًا، لكنه لم يكن تقسيمًا عنصريًّا بالمعنى الحديث، لأن القبائل كانت تتحالف وتتداخل وتتحرّك من مكانٍ إلى مكان. وقد كان في هذا التقسيم ما يُستعمل في السياسة أكثر مما يُستعمل في العلم، لأن من يُريد أن يجمع قبائل يقول إنها من أصلٍ واحد، ومن يُريد أن يُفرّق بينها يقول إنها من أصلين.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت أيام العرب هي وقائعها الكبرى، وكانت تُسمّى باسم الموضع الذي وقعت فيه، أو باسم القبيلة التي انتصرت، أو باسم سبب الحرب. وقد كان من أشهرها حرب البسوس، وقد استمرّت نحو أربعين سنة، وكان سببها ناقةً قُتلت، ثم صارت حربًا بين قبيلتين، ثم صارت مثالًا على أن الحرب قد تبدأ من سببٍ صغير وتستمر لأن أحدًا لا يستطيع أن يتوقّف. وقد كان في هذه الحرب ما يُشبه كل الحروب الأهلية في التاريخ: أن يبدأ الخلاف على حقٍّ صغير، ثم يتّسع لأن كل طرفٍ يخاف أن يظهر ضعفه، ثم يصير تاريخًا يُروى ويُعلّم الأبناء الثأر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان من أشهرها أيضًا حرب داحس والغبراء، وقد كانت بين قبيلتين على فرسين تسابقتا، وقد استمرّت سنواتٍ طويلة، وكانت في تفاصيلها تُشبه كل الحروب الأهلية: أن يبدأ الأمر بخلافٍ على حقٍّ صغير، ثم يتّسع حتى يصير دمًا، ثم يصير تاريخًا يُروى للأبناء. وقد كان في هذه الحروب ما يُسمّى بالثأر، وكان الثأر نظامًا للعدل في مجتمعٍ بلا دولة، وكان في الوقت نفسه سببًا في حروبٍ لا تنتهي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت حرب الفجار من الحروب التي وقعت في الأشهر الحُرُم، وقد سُمّيت بذلك لأنها كانت فجورًا في شهرٍ حرّمته العرب، وقد شهدها النبيّ في شبابه، وقال إنه حضرها مع عمومته، وكان في حضوره لها ما يدل على أن العرب كانوا يُفرّقون بين الحرب المشروعة والحرب المحرّمة، وأنهم كانوا يُدركون أن بعض القتال ظلم. وقد كان في هذا الحضور دليلًا على أن النبيّ عرف مجتمعه من داخله، وكان يعرف أسماء القبائل وأخبارها وحروبها، وهذا ما يظهر في القرآن وفي الحديث من ذكرٍ لأيام العرب وأمثالهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان يوم ذي قار من الأيام التي وقعت قريبًا من ظهور الإسلام، وقد كانت بين قبيلة عربية وبين الفرس، وقد انتصر فيها العرب، وكانت تُذكر في الشعر العربي بكثير من الفخر، لأنها كانت انتصارًا لقبيلةٍ على دولة. وقد كان في هذا اليوم معنى مهم: أن العرب كانوا يعرفون أن الفرس دولةٌ كبيرة، وأنهم كانوا يُقارنون أنفسهم بها، وأنهم كانوا ينتظرون فرصةً يُثبتون فيها أنفسهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت الأنساب والأيام تُحفظ في الشعر أولًا، لأن الشعر كان ديوان العرب، وكانت القصيدة تُحفظ وتُروى وتُتوارث، وكان فيها أسماء القتلى والمواضع والوقائع. وقد كان في هذا الحفظ خطرٌ أيضًا: أن يُبالغ الشاعر في مدح قبيلته وفي هجاء خصمه، وأن تُصبح الرواية أداةً في النزاع لا سجلًّا له، وهذا ما يجعل قراءة الأيام تحتاج إلى مقارنةٍ بين روايات القبائل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد انتقل هذا العلم إلى الإسلام، فبقي علم النسب مُعتمدًا في الديوان والعطاء، وبقيت الأيام مادةً للشعر والتاريخ، وكتب المؤرخون المسلمون عن أيام العرب كتبًا مستقلة. وقد كان في هذا الانتقال فائدةٌ ومنفعة: أن تُحفظ أخبار أمةٍ كانت بلا كتاب، وأن يُعرف بها سياق القرآن الذي نزل في قومٍ لهم تاريخ وأسماء ومواضع. وقد كان في هذا الانتقال خدمةٌ للتاريخ الإسلامي، لأن المؤرخين وجدوا في الأيام مادةً لكتابة السيرة، ولأنهم استطاعوا أن يُحدّدوا أسماء من قابلهم النبيّ وأماكن الوقائع بفضل هذا الحفظ.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالنسب كهوية\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الرجل في الجاهلية يُعرَف باسم قبيلته قبل اسمه، وكان من لا قبيلة له لا حماية له، لأن الحماية كانت تأتي من الجماعة لا من القانون. ولهذا كان الانتساب إلى قبيلةٍ قوية ضرورةً اجتماعية، وكان الناس يحرصون على أن يُعرف نسبهم، وكان في هذا حمايةٌ وقيودٌ في الوقت نفسه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الإسلام تحوّلٌ في هذا المفهوم: أن يبقى النسب معروفًا للتعريف لا للتفضيل، وأن يُصبح التقيّم بالتقوى لا بالأصل. وقد بقي مع ذلك أثرٌ في الديوان والعطاء في العهود الأولى، ثم تلاشى تدريجيًّا مع اتساع الدولة ودخول الناس من كل الأمم. وقد كان في هذا الحفظ وظيفةٌ سياسية، لأن من يعرف نسب القبيلة يعرف من يُحالفه ومن يُعاديه، وكان هذا علمًا يُستعمل في السلم والحرب.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالثأر ونظام العدل\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الثأر هو نظام العدل في مجتمعٍ لا دولة فيه، لأن القبيلة كانت تُلزم نفسها بأن تُقتل قاتل قتيلها أو تأخذ ديته. وكان في هذا ردعٌ فعّال، لأن من يعرف أن قبيلته ستُقتل بسببه يتردّد قبل أن يقتل، لكنه كان يُنتج سلسلةً من القتل لا تنتهي، لأن كل ثأرٍ يُنتج ثأرًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد جاء الإسلام ليُحوّل هذا النظام إلى نظامٍ آخر: أن تكون الدية حقًّا لأهل القتيل، وأن يُعفى عن القاتل إن أرادوا، وأن تكون السلطة هي التي تُنفّذ. وكان في هذا تحوّلٌ كبير في مفهوم العدل: من عدلٍ تقوم به الجماعة بنفسها إلى عدلٍ تقوم به مؤسسة، وهذا هو معنى الدولة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالشعر ديوان العرب\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الشعر في الجاهلية وظيفةً اجتماعية كاملة: يمدح فيرفع، ويهجو فيخفض، ويرثي فيُبكي، ويصف فيُعلّم. وكان الشاعر لسان قبيلته في المفاخرة، وكانت القصيدة تُنشد في الأسواق وفي مواسم الحج، وكانت تُحفظ في الصدور وتُروى في المجالس. وقد كان الشاعر في القبيلة يُشبه المتحدث الرسمي في عصرنا، لأنه كان يُعبّر عن الجماعة أمام الجماعات الأخرى في الأسواق والمواسم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا الشعر مادةٌ تاريخية مهمة، لأن فيه أسماء المواضع والقبائل والوقائع، وفيه وصف الحياة اليومية من الطعام واللباس والحيوان. ولهذا يُقال إن من أراد أن يعرف الجزيرة قبل الإسلام فليقرأ الشعر الجاهلي، مع الحذر من أن الشاعر يُبالغ ويُزيّن. وقد كان في هذا الشعر ما يُبالغ فيه الشاعر، وكان الناس يعرفون ذلك، وكانوا يُقارنون بين روايات القبائل ليصلوا إلى صورةٍ أقرب إلى الواقع.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالنسب\u003c/b\u003e\u003cspan\u003eهوية الرجل وحمايته في القبيلة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالنسّابة\u003c/b\u003e\u003cspan\u003eمن يحفظ الأنساب والأخبار\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالبسوس\u003c/b\u003e\u003cspan\u003eحربٌ استمرّت نحو أربعين سنة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eداحس والغبراء\u003c/b\u003e\u003cspan\u003eحربٌ بدأت بسباق فرسين\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eذو قار\u003c/b\u003e\u003cspan\u003eانتصار عربي على الفرس قرب الإسلام\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالواقعة\u003c/th\u003e\u003cth\u003eسببها\u003c/th\u003e\u003cth\u003eأثرها\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eحرب البسوس\u003c/td\u003e\u003ctd\u003eناقةٌ قُتلت\u003c/td\u003e\u003ctd\u003eحربٌ أربعين سنة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eداحس والغبراء\u003c/td\u003e\u003ctd\u003eسباقٌ بين فرسين\u003c/td\u003e\u003ctd\u003eثأرٌ طويل بين قبيلتين\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eحرب الفجار\u003c/td\u003e\u003ctd\u003eقتالٌ في شهرٍ حرام\u003c/td\u003e\u003ctd\u003eإدراك العرب لحرمة الشهر\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eيوم ذي قار\u003c/td\u003e\u003ctd\u003eصراعٌ مع الفرس\u003c/td\u003e\u003ctd\u003eفخرٌ عربي قبل الإسلام\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالأيام\u003c/td\u003e\u003ctd\u003eوقائع القبائل\u003c/td\u003e\u003ctd\u003eذاكرةٌ سياسية محفوظة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eيَا أَيُّهَا النَّاسُ إِنَّا خَلَقْنَاكُم مِّن ذَكَرٍ وَأُنثَى وَجَعَلْنَاكُمْ شُعُوبًا وَقَبَائِلَ لِتَعَارَفُوا\u003c/p\u003e\u003ccite\u003eسورة الحجرات، الآية ١٣\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eكان النسب هويةً وحماية، وكانت الأيام ذاكرةً سياسية، وكان الثأر نظام عدلٍ بلا دولة. وقد نقل الإسلام هذه المفاهيم من الجماعة إلى المؤسسة، وأبقى النسب للتعريف لا للتفضيل.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"practical-knowledge","n":"الطبّ والنجوم ومعارف الحياة","ic":"🌿","part":"القسم السادس: العقل الجاهلي","h":"\u003carticle class=\"ch3\" id=\"practical-knowledge\" data-toc=\"الطبّ والنجوم ومعارف الحياة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٦.٣\u003c/span\u003e\n          \u003ch3\u003e🌿 الطبّ والنجوم ومعارف الحياة\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eق\u003c/span\u003eبل الإسلام كان في الجزيرة من يعرف الحجامة والكي والأعشاب، ومن يعرف الأنواء والنجوم والرياح، ومن يعرف الطرق والآبار. ولم يكن هذا علمًا مكتوبًا، بل كان خبرةً تُنقل من شيخٍ إلى تلميذ.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان الطبّ في الجزيرة بسيطًا، وكان يقوم على التجربة: الحجامة لفصد الدم، والكي لبعض الأوجاع، والأعشاب لبعض الأمراض، والعسل واللبن والتمر للتغذية والعلاج. وكان في العرب من يُسمّى الطبيب، وكان أشهرهم الحارث بن كلدة، وقد قيل إنه تعلّم في فارس، وكان يُعالج بالأعشاب والحمية، وكان كلامه في الطب يُشبه الحكمة العملية أكثر من العلم المنظّم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت الجراحة محدودة، وكانت تُعالج الجروح بالكي وبالضماد، وكانت الكسور تُجبَّر بالخشب، وكان في هذا ما يُشبه الطبّ الشعبي في كل المجتمعات القديمة: أن يُعالج ما يُرى بالعين، وأن يُترك ما لا يُرى للقدر. ولم يكن في الجزيرة مستشفيات ولا مدارس طبّ، وكانت المعرفة تنتقل بالمجالسة والمشاهدة. وقد كان هذا الطبّ يُمارس في البيوت وفي الأسواق، وكان الطبيب يتنقّل بين القبائل، وكان يُدفع له أجرٌ أو هدية، وكان في هذا مهنةً حرة لا مؤسسةً حكومية، وهذا ما يُفسّر تنوّع ممارساته واختلافها بين قبيلة وأخرى.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان علم الأنواء من أهمّ ما يعرفه العرب، وهو النظر في النجوم لمعرفة وقت المطر وتغيّر الفصول، وكانوا يُسمّون النجوم التي تطلع في أوقاتٍ معيّنة أنواءً، وكانوا ينسبون المطر إليها، وكان في هذا خطأٌ في السبب وصوابٌ في الملاحظة: أنهم ربطوا بين طلوع النجم ونزول المطر لأن التجربة أعطتهم هذا الربط، وكانوا يُخطئون في نسبة المطر إلى النجم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت معرفة الرياح والطرق ضرورةً للتجارة، وكان التاجر يعرف متى تُسافر القافلة وإلى أي جهة، وكان يعرف مواضع الآبار والمراعي، وكان يعرف أسماء النجوم التي يُهتدى بها في الليل. وقد كان هذا العلم العملي هو الذي جعل تجارة القوافل ممكنة، وكانت القافلة تعبر صحراءً بلا علاماتٍ بشرية، فلا يهديها إلا النجوم ومعرفة الأرض. وقد كان في هذا العلم ما هو صحيحٌ في الملاحظة وخاطئٌ في التفسير، وكان العرب يعرفون متى يأتي المطر من التجربة لكنهم كانوا ينسبونه إلى النجم، وهذا فرقٌ بين معرفة الظاهرة ومعرفة سببها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت معرفة الأنساب والأمثال والأخبار نوعًا آخر من المعرفة، وكانت تُحفظ في الصدور، وكان من يحفظها يُسمّى راويةً. وكان في هذا الحفظ نظامٌ تعليمي كامل: أن يجلس الشاب إلى الشيخ سنوات، ويحفظ عنه الشعر والأخبار والحكم، ثم يُصبح هو راويةً يُحفظ عنه. وقد كان في هذا ما يُشبه الجامعة بلا مبنى، لأن العلم كان يُنقل بالمجالسة لا بالكتاب. وقد كان في هذه المعرفة ما جعل العرب قومًا يُسافرون في أرضٍ لا يُسافر فيها غيرهم، وكانت القافلة تحتاج إلى قائدٍ يعرف النجوم والآبار والرياح، وكان هذا القائد يُسمّى الخريت، وكان يُعرف بخبرته لا بنسبه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت في الجزيرة صناعاتٌ تحتاج إلى معرفة تقنية: دبغ الجلود، ونسج الثياب، وصناعة السيوف، وبناء السدود والقنوات في اليمن، وصناعة الحلي. وقد كان في اليمن وحدها هندسة مياهٍ متقدّمة، لأن سدّ مأرب كان يحتاج إلى حسابٍ في الميول والفتحات والتصريف، وكان في هذا دليلًا على أن الجزيرة لم تكن خاليةً من التقنية، بل كانت تقنيتها موزّعةً بحسب الحاجة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت المعارف في الجزيرة تُنقل شفويًّا، ولم تكن مكتوبة في الغالب، وكانت الكتابة موجودة لكنها لم تكن شائعة، وكان من يكتب قليلًا. وقد كان في هذا ضعفٌ وقوّةٌ في الوقت نفسه: ضعفٌ لأن المعرفة تُفقد إذا مات حاملها، وقوّةٌ لأنها تبقى حيّةً في الناس، وتتغيّر معهم، ولا تُصبح نصًّا جامدًا. وقد كان في هذا الشفوي ما يُفسّر قوّة الذاكرة عند العرب، لأن من يعتمد على حفظه يُدرَّب عليه من صغره، وكان في هذا تدريبٌ جعلهم قادرين بعد الإسلام على حفظ القرآن والحديث والأشعار.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد دخل هذا كله في الإسلام بعد ذلك: فالحجامة والكي والأعشاب دخلت في الطب النبوي وفي كتب الطب العربي، والأنواء دخلت في علم الفلك والزراعة، ومعرفة الطرق دخلت في الجغرافيا وفي علم المسالك، والرواية الشفوية صارت أساسًا لعلم الحديث وعلم النسب. وقد كان في هذا الانتقال دليلًا على أن الإسلام لم يبدأ من فراغ، بل بدأ من مجتمعٍ له خبرة، وأعطاه إطارًا جديدًا.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالطبّ بين التجربة والحدس\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الطبّ الجاهلي يعتمد على ملاحظةٍ طويلة، وكان في بعض ما وصفه صوابٌ يُصدّقه الطبّ الحديث، وفي بعضه خطأ. وقد كان في هذا شأن كل طبٍّ قديم: أن يُخلط بين ما نجح بالمصادفة وما نجح بالسبب، وأن يُحفظ الناجح ويُنسى الفاشل، لأن الناس يتذكّرون من شُفي ولا يتذكّرون من مات.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الحارث بن كلدة مثالًا على طبيبٍ يجمع بين التجربة والحكمة، وكان يقول إن الحمية رأس الدواء، وكان يُشدّد على الغذاء قبل الدواء. وهذا القول قريبٌ من الطبّ الحديث في معناه، وإن اختلفت أدواته، وهذا يدل على أن بعض المعرفة الإنسانية تتكرّر في كل المجتمعات لأنها تُستخرج من التجربة نفسها.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالأنواء والنجوم\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان العرب يُقسّمون السنة إلى أنواء، ولكل نوءٍ وقتٌ معروف، وكانوا يقولون إن المطر ينزل عند طلوع نوءٍ معيّن، وكان في هذا ربطٌ بين ظاهرتين متزامنتين لا بين سببٍ ونتيجة. وقد كان في هذا خطأٌ منهجي، لكنه كان خطوةً أولى في بناء تقويمٍ زراعي يُعتمد عليه في الحرث والحصاد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بقي هذا التقويم في الحياة العربية بعد الإسلام، وكان يُستعمل في الزراعة وفي السفر، وكان في بعض الأحاديث نهيٌ عن نسبة المطر إلى النوء، لأن النسبة تُشبه الشرك في السببية. وقد كان في هذا الموقف دقةٌ في التفريق بين استعمال النجوم للتوقيت وبين ادّعاء أنها تُنزل المطر.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالشفوي والمكتوب\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الجزيرة مجتمعًا شفويًّا في الأساس، وكانت الكتابة تُستعمل في العقود والرسائل القصيرة، وكان الشعر والأخبار تُحفظ في الصدور. وقد كان في هذا قوّةً في الحفظ، لأن الصدور تحفظ ما لا تحفظه الأوراق في بلدٍ قليل الورق، وكان فيه خطرًا لأن الحافظ قد يموت بما يحفظ.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الإسلام تحوّلٌ كبير: أن يُكتب القرآن ويُجمع، وأن تُكتب السنة، وأن تُدوّن الأخبار والأنساب. وقد كان في هذا الانتقال من الشفوي إلى المكتوب أثرٌ في كل العلوم الإسلامية بعد ذلك، لأن الكتاب جعل المعرفة قابلةً للنقد والمقارنة والتعديل. وقد كان في هذا الموقف تفريقٌ دقيق بين ما هو توقيتٌ مشروع وما هو ادّعاء سببٍ لا يملكه الإنسان، وهذا التفريق هو جوهر الموقف الإسلامي من العلوم القديمة.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالحارث بن كلدة\u003c/b\u003e\u003cspan\u003eأشهر أطباء العرب قبل الإسلام\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالأنواء\u003c/b\u003e\u003cspan\u003eتقويمٌ زراعي بالنجوم والرياح\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالرواية\u003c/b\u003e\u003cspan\u003eنقل الشعر والأخبار بالمجالسة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالتقنية\u003c/b\u003e\u003cspan\u003eالسدود والجلود والحديد في اليمن\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالتحوّل\u003c/b\u003e\u003cspan\u003eمن الصدور إلى الكتاب بعد الإسلام\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمجال\u003c/th\u003e\u003cth\u003eما عرفه العرب\u003c/th\u003e\u003cth\u003eما انتقل منه\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالطبّ\u003c/td\u003e\u003ctd\u003eالحجامة والكي والأعشاب\u003c/td\u003e\u003ctd\u003eالطب النبوي والطب العربي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالأنواء\u003c/td\u003e\u003ctd\u003eالنجوم والرياح والفصول\u003c/td\u003e\u003ctd\u003eالتقويم الزراعي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالطرق\u003c/td\u003e\u003ctd\u003eالآبار والمواضع والنجوم\u003c/td\u003e\u003ctd\u003eالجغرافيا وعلم المسالك\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالحرفة\u003c/td\u003e\u003ctd\u003eالجلود والنسيج والحديد\u003c/td\u003e\u003ctd\u003eالصناعات في الأمصار\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالرواية\u003c/td\u003e\u003ctd\u003eحفظ الشعر والأخبار\u003c/td\u003e\u003ctd\u003eالحديث والنسب والتاريخ\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eوَعَلَّمَكُم مَّا لَمْ تَكُونُوا تَعْلَمُونَ\u003c/p\u003e\u003ccite\u003eسورة البقرة، الآية ١٥١\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eكان في الجزيرة طبٌّ بالتجربة ونجومٌ للتقويم ومعرفةٌ بالطرق والحرف، وكانت هذه المعارف تُحفظ في الصدور. وقد دخلت في الإسلام وأعطاها إطارًا جديدًا، فصارت أساسًا للطب والفلك والجغرافيا في الحضارة الإسلامية.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-7","n":"القسم السابع: ليلة الإسلام","ic":"","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-7\" style=\"--c:#8B6914\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🌄\u003c/div\u003e\n      \u003ch2\u003eالقسم السابع: ليلة الإسلام\u003c/h2\u003e\n      \u003cp\u003eفي القرن السادس الميلادي تغيّرت خريطة الجزيرة: سقط سدّ مأرب فهاجرت قبائل، وقامت في اليمن دولٌ تتنازعها الحبشة وفارس، وانهارت مملكة الحيرة، ووقعت في مكة حادثة الفيل. وفي هذا العالم الذي تتغيّر فيه كل شيء، وُلد رجلٌ في قريش سنة ٥٧٠م.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#yemen-and-the-fall\"\u003eاليمن: سدّ مأرب وسقوط الممالك\u003c/a\u003e\u003ca href=\"#year-of-the-elephant\"\u003eعام الفيل ومولد النبي\u003c/a\u003e\u003ca href=\"#map-of-powers\"\u003eخريطة القوى سنة ٦١٠م\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"yemen-and-the-fall","n":"اليمن: سدّ مأرب وسقوط الممالك","ic":"🌊","part":"القسم السابع: ليلة الإسلام","h":"\u003carticle class=\"ch3\" id=\"yemen-and-the-fall\" data-toc=\"اليمن: سدّ مأرب وسقوط الممالك\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٧.١\u003c/span\u003e\n          \u003ch3\u003e🌊 اليمن: سدّ مأرب وسقوط الممالك\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eك\u003c/span\u003eانت اليمن أرض الحضارة في الجزيرة، فيها سدودٌ ومدنٌ وممالك، ثم انهار سدّها الكبير فخرجت قبائلها إلى كل جهة. ولم يكن انهيار السدّ حادثةً هندسية فقط، بل كان بداية تحوّلٍ في توزيع القبائل في الجزيرة كلها.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكانت مملكة سبأ في اليمن من أقدم ممالك الجزيرة، وكانت قوّتها في الزراعة وفي التجارة، وكانت عاصمتها مأرب، وكان فيها سدٌّ كبير يُحوّل مياه الأمطار إلى أراضٍ زراعية واسعة. وقد كان السدّ يُبنى بالحجارة والطين، وكان له فتحاتٌ للتصريف، وكان يُرمّم كلما تصدّع، وكان في هذا دليلًا على أن اليمن كانت دولةً ذات إدارةٍ هندسية. وقد بقي من آثار هذا السدّ بقايا في مأرب يراها الزائر اليوم، وقد نقشت أخبار ترميمه على صخورٍ في الموضع، وكان في هذا النقش دليلًا على أن السدّ كان مشروع دولةٍ يُدوّن لا عملًا فرديًّا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بدأ ضعف المملكة قبل انهيار السدّ بقرون: فالتجارة تغيّرت طرقها، وظهرت مملكة حمير ثم سيطرت على سبأ، وكانت الحروب بين الممالك اليمنية تُنهك الأرض والناس. وقد كان في هذا ما يُشبه ما جرى في دولٍ كثيرة: أن تُبنى الحضارة على موردٍ واحد، فإذا تغيّر المورد أو أُهمل، انهار البناء كله. وقد كان في هذا الانهيار درسٌ اقتصادي واضح: أن دولةً تعتمد على محصولٍ واحد وعلى شبكة ريٍّ واحدة تكون عرضةً للسقوط إذا أهملت صيانتها، وهذا ما يُفسّر لماذا صارت اليمن بعد ذلك بلاد هجرةٍ لا بلاد تجمّع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد وقع انهيار السدّ في القرن السادس الميلادي، وكان فيضانٌ عظيم سمّاه القرآن سيل العرم، وقد وصفه بأنه أرسل على القوم سيلًا أخرجهم من جنّاتهم، وكان في هذا الانهيار نهاية مملكةٍ زراعية، وبداية هجرةٍ قبلية كبيرة. وقد خرجت قبائل من الأزد وغيرها إلى يثرب وعمان والشام والعراق، وكانت هذه الهجرة من أهمّ ما غيّر خريطة الجزيرة قبل الإسلام.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت اليمن في القرن السادس مسرحًا لصراعٍ بين قوى خارجية: فالحبشة كانت قد سيطرت على الساحل، وكانت تدعم من يُواليها، وكانت بيزنطة تُحرّضها على اليمن لأن اليمن كانت تُسيطر على طريق التجارة إلى الهند. وقد كان في هذا الصراع سببٌ اقتصادي واضح: أن من يملك اليمن يملك باب البحر الأحمر، ومن يملك الباب يتحكّم في تجارة الشرق. وقد كان في هذا الصراع ما يُشبه صراع الطرق في العصر الحديث: أن تُقاتل الدول على ممرٍّ مائي، وأن يُدفع في هذه الحرب مالٌ وسلاح ودين، وأن يكون أهل البلاد آخر من يُسأل عن مصيرهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان ذو نواس آخر ملوك حمير، وكان يهوديًّا، وقد اضطهد نصارى نجران اضطهادًا شديدًا، وقد ذُكرت هذه الحادثة في القرآن في سورة البروج، وفيها أخدودٌ أُحرق فيه المؤمنون. وقد كان لهذه الحادثة أثرٌ سياسي كبير، لأنها أعطت الحبشة سببًا للتدخّل، وكانت بيزنطة تُحرّض عليها، وكانت النتيجة أن دخلت الحبشة اليمن سنة ٥٢٥م. وقد كان في اضطهاد نجران ما جعل القضية دينيةً في الظاهر وسياسيةً في العمق، لأن من يضطهد أقليةً يُعطي جاره سببًا للتدخّل، وكان في هذا ما يتكرّر في التاريخ في كل مرةٍ تُستعمل فيها حماية الأقليات ذريعةً للسيطرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد حكم الحبشيون اليمن نحو خمسين سنة، وكان من ولاتهم أبرهة، وقد بنى في صنعاء كنيسةً كبيرة أراد أن يجعلها وجهةً للحجّ العرب، وكان في هذا تحدٍّ لمكانة الكعبة عند العرب. وقد كان في هذا العمل سياسةً دينيةً واقتصاديةً في وقتٍ واحد: أن يُحوّل الحجّ من مكة إلى صنعاء، فيتحوّل المال والوجاهة إلى اليمن. وقد كان في بناء كنيسة صنعاء ما يُشبه الحرب الاقتصادية: أن تُنافس مكة في موسم الحجّ، فيتحوّل الحجيج والتجارة إلى الجنوب، وتفقد قريش مصدر رزقها الأول، وكان هذا أخطر من أي هجومٍ عسكري.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد انتهى حكم الحبشة في اليمن على يد الفرس، وقد دخلوا اليمن في النصف الثاني من القرن السادس، وكان آخر ولاة الفرس يُسمّى باذان، وقد أسلم بعد ذلك في عهد النبيّ. وقد كان في هذا التحوّل دليلًا على أن اليمن كانت ساحةً مفتوحة للقوى الكبرى، وأن أهلها كانوا يعيشون في دولةٍ يتغيّر حاكمها كل جيل، وكان هذا من أسباب عدم قيام دولةٍ عربية مستقلة في الجنوب في ذلك الوقت.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان لهذا كله أثرٌ في مكة: فقد جاءت إلى الحجاز قبائل من اليمن بعد انهيار السدّ، وكانت منهم الأوس والخزرج في يثرب، وكانت منهم قبائل في الطائف، وكان في هذا ما جعل الحجاز أكثر ازدحامًا وأكثر تنوّعًا. وقد كان في هذا أيضًا ما جعل يثرب مدينةً ذات قبائل مختلطة، وفيها يهود، وكان هذا كله مقدّمةً لهجرة النبيّ إليها بعد ذلك. وقد كان في هذا الازدحام ما يجعل المدينة أكثر تعقيدًا: أن تُقسم الأرض بين قبائل لا تجمعها دولة، وأن تكون كل قبيلةٍ حليفةً لغيرها، وكان هذا ما جعل يثرب تُقاتل نفسها سنواتٍ ثم تبحث عن حكمٍ يحكم بينها.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eسدّ مأرب: الهندسة والسياسة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان السدّ يعتمد على تحويل مياه الأمطار من وادٍ واسع إلى حوضٍ يُغذّي القنوات، وكانت له فتحاتٌ تُفتح وتُغلق بحسب الحاجة، وكان يُرمّم بأموال الدولة وسخرة الناس. وقد كان في هذا مشروعًا عامًّا يحتاج إلى سلطةٍ قادرة على تجنيد العمال وجمع المال، وهذا ما يُفسّر ارتباط السدّ بقوّة الدولة.\u003c/p\u003e\u003cp class=\"ap\"\u003eولمّا ضعفت الدولة أهمّت الترميم، فتصدّع السدّ ثم انهار، وكان الانهيار نتيجةً للضعف السياسي قبل أن يكون سببًا فيه. وهذا درسٌ يتكرّر في تاريخ البنى التحتية: أن ما يُبنى بالسلطة ينهار بانهيارها، وأن المشروع الكبير يحتاج إلى مؤسسةٍ لا إلى رجل. وقد كان في هذا الترميم عبءٌ مالي كبير، وكانت الدولة تجمعه من الخراج ومن السخرة، وكان في هذا ما يُفسّر سرعة انهيار السدّ حين ضعفت الخزانة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eنجران والحبشة وفارس\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت نجران مدينةً نصرانية في شمال اليمن، وكانت لها مكانةٌ دينية وتجارية، وقد وقع فيها اضطهادٌ ذُكر في القرآن، وكان في هذا الاضطهاد تحويلٌ لصراعٍ ديني إلى قضيةٍ سياسية تُستعملها القوى الخارجية. وقد كان في نجران نصارى من العرب ومن الحبشة، وكانت لها أسقفيةٌ وعلاقةٌ بالكنيسة في الشام، وكان في هذا ما جعلها محطّ أنظار القوى الخارجية، وكان في هذا أيضًا ما جعل أخبارها تُحفظ في المصادر السريانية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد دخلت الحبشة اليمن بحجّة حماية النصارى، ثم دخل الفرس بحجّة إخراج الحبشة، وكان اليمنيون في كل مرةٍ يُستعملون لا يُستشارون. وقد كان في هذا ما يُفسّر عدم قيام دولةٍ يمنية قوية بعد ذلك، لأن البلاد صارت ساحةً لصراعٍ أكبر منها. وقد كان في كل تدخّلٍ خارجي ثمنٌ داخلي: أن تُدفع الضرائب للحاكم الجديد، وأن يُجنّد الشباب في حروبه، وأن تُستنزف الأرض، وكان في هذا ما جعل اليمن تفقد قدرتها على بناء دولةٍ خاصة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالهجرة القبلية\u003c/h4\u003e\u003cp class=\"ap\"\u003eبعد انهيار السدّ خرجت قبائل كثيرة من اليمن، وكان خروجها على مراحل، وكان لكل قبيلةٍ وجهة: الشام والعراق وعمان والحجاز. وقد كانت هذه الهجرة من أسباب تكوّن القبائل التي نعرفها في الحجاز قبل الإسلام، وكانت من أسباب كثرة الحروب على الأرض والماء في يثرب. وقد كان في هذه الهجرة ما يُفسّر كثرة الأسماء اليمنية في قبائل الحجاز، وكان في هذا أيضًا ما جعل الشعر الحجازي يحمل ألفاظًا وأخبارًا من الجنوب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا الانتقال أثرٌ ثقافي أيضًا: أن تنتقل مع القبائل أشعارها وأمثالها وحكاياتها، وأن يختلط اليمني بالحجازي في لغةٍ واحدة. وقد كان في هذا ما جعل العربية الفصحى تُوحّد اللهجات، لأن الشعر الجاهلي كان لغةً مشتركة بين قبائل متفرّقة. وقد كان في هذا الاختلاط ما جعل العربية لغةً عليا تُستعمل في الشعر بين قبائل مختلفة اللهجات، وكان في هذا ما هيّأ الجزيرة لكتابٍ واحدٍ يُقرأ بلغةٍ واحدة.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمأرب\u003c/b\u003e\u003cspan\u003eعاصمة سبأ وسدّها الكبير\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eسيل العرم\u003c/b\u003e\u003cspan\u003eانهيار السدّ في القرن السادس الميلادي\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eذو نواس\u003c/b\u003e\u003cspan\u003eآخر ملوك حمير واضطهاد نجران\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالحبشة\u003c/b\u003e\u003cspan\u003eدخلت اليمن سنة ٥٢٥م\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالفرس\u003c/b\u003e\u003cspan\u003eأخرجوا الحبشة في القرن السادس\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالحقبة\u003c/th\u003e\u003cth\u003eالحكم\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eقبل الميلاد\u003c/td\u003e\u003ctd\u003eمملكة سبأ\u003c/td\u003e\u003ctd\u003eسدّ مأرب والزراعة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالقرن الثالث\u003c/td\u003e\u003ctd\u003eمملكة حمير\u003c/td\u003e\u003ctd\u003eتوحيد اليمن وتجارة البحر\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٥٢٣م\u003c/td\u003e\u003ctd\u003eاضطهاد نجران\u003c/td\u003e\u003ctd\u003eذريعةٌ للتدخّل الحبشي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٥٢٥م\u003c/td\u003e\u003ctd\u003eالحكم الحبشي\u003c/td\u003e\u003ctd\u003eأبرهة وكنيسة صنعاء\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالنصف الثاني من القرن السادس\u003c/td\u003e\u003ctd\u003eالحكم الفارسي\u003c/td\u003e\u003ctd\u003eباذان وآخر ولاة الفرس\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eفَأَعْرَضُوا فَأَرْسَلْنَا عَلَيْهِمْ سَيْلَ الْعَرِمِ\u003c/p\u003e\u003ccite\u003eسورة سبأ، الآية ١٦\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eكانت اليمن أرض حضارةٍ زراعية، فلمّا ضعفت دولتها أُهمل سدّها فانهار، فخرجت قبائلها إلى الجزيرة كلها. وقد صارت البلاد بعد ذلك ساحةً لصراعٍ بين الحبشة وفارس، فلم تقم فيها دولةٌ عربية قوية قبل الإسلام.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"year-of-the-elephant","n":"عام الفيل ومولد النبي","ic":"🐘","part":"القسم السابع: ليلة الإسلام","h":"\u003carticle class=\"ch3\" id=\"year-of-the-elephant\" data-toc=\"عام الفيل ومولد النبي\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٧.٢\u003c/span\u003e\n          \u003ch3\u003e🐘 عام الفيل ومولد النبي\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي سنةٍ يُقدّرها المؤرخون بنحو ٥٧٠م زحف جيشٌ من اليمن إلى مكة ومعه فيل، فردّ الله كيده، وسُمّي ذلك العام عام الفيل. وفي العام نفسه وُلد في قريش طفلٌ يُسمّى محمد بن عبد الله.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان أبرهة والي اليمن من قِبَل الحبشة، وقد بنى في صنعاء كنيسةً كبيرة أراد أن يصرف إليها حجّ العرب، وقد كان في هذا تحدٍّ للكعبة ولقريش ولمكانتها في الجزيرة. وقد ذكرت الروايات أن بعض العرب أحدث في الكنيسة ما أغضبه، فقرّر أن يهدم الكعبة، وأن يخرج بجيشٍ كبير ومعه فيلٌ أو فيلة. وقد كان في هذا التحدّي ما يُشبه إعلان حربٍ على مكانةٍ دينية، وكان أبرهة يرى أن الدين والسياسة والتجارة في الجزيرة مرتبطة، وأن من يملك الحجّ يملك الطريق.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد خرج أبرهة بجيشه نحو مكة، وكان في طريقه يُلقي المقاومة من قبائل العرب، وقد حاول بعض زعماء العرب أن يقفوا في وجهه فلم يستطيعوا، وكان جيشه أكبر من أن تُقاومه قبيلة. وقد كان في هذا الجيش فيل، وكان العرب لم يروا فيلًا من قبل، وكان في هذا ما زاد الرهبة في نفوسهم. وقد كان في هذا الجيش من الحبشيين ومن العرب الموالين، وكان في طريقه يُلقي مقاومةً من قبائل مثل خثعم، وقد قُتل في هذه المقاومة زعيمها، وكان في هذا ما يدل على أن العرب حاولوا أن يقفوا ولو بجهدٍ قليل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد وصل الجيش إلى وادي محسّر قريبًا من مكة، وكانت قريش قد عجزت عن مقاومته، وكان عبد المطلب جدّ النبيّ قد ذهب إليه يُفاوضه في إبله التي أُخذت، فسأله أبرهة عن إبله وسأله أن يترك الكعبة، فقال عبد المطلب كلمته المشهورة: أنا ربّ الإبل، وللبيت ربٌّ يحميه. وقد كان في هذه الكلمة معنى ديني عميق: أن البيت ليس ملكًا لقريش بل لربٍّ يحميه. وقد كان في موقف عبد المطلب حكمةٌ سياسية: أنه لم يُحاول أن يُقاتل جيشًا لا يستطيع مقاومته، بل فاوض في ماله وترك البيت لمن يحميه، وكان في هذا تفريقٌ بين ما يستطيع الإنسان حمايته وما يتركه لمن هو أقوى منه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ذكر القرآن هذه الحادثة في سورة الفيل، وقال إن الله أرسل على الجيش طيرًا أبابيل ترميهم بحجارةٍ من سجيل، فجعلهم كعصفٍ مأكول. وقد كان في هذا الوصف إعلانًا بأن البيت محفوظٌ بأمر الله لا بقوّة قريش، وكان في هذا أيضًا إشارةً إلى أن القبيلة التي لا تملك قوّةً يمكن أن تُحفظ بغير قوّتها. وقد كان في هذا الإعلان ما يُثبت أن المكان المقدّس لا يُحمى بعددٍ ولا بسلاح، وكان في هذا ما رسّخ في نفوس قريش أن لبيتهم حرمةً لا تُنتهك، وكان هذا من أسباب مكانتها بعد ذلك.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت هذه الحادثة في ذاكرة قريش، وكانوا يؤرّخون بها، وكانوا يقولون: وُلد فلان عام الفيل، وكان النبيّ يُذكر أنه وُلد في ذلك العام. وقد كان في هذا التزامن معنى رمزي كبير: أن العام الذي حُفظت فيه الكعبة من الهدم هو العام الذي وُلد فيه من سيُعيد إليها مكانتها الدينية. وقد كان في التأريخ بهذه الحادثة ما يُشبه اتخاذ حادثةٍ كبرى بدايةً للتقويم، وكان في هذا دليلًا على أن الجزيرة كانت تُؤرّخ بالأحداث لا بالسنين، وأن الحادثة كانت معروفةً عند الجميع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان مولد النبيّ في مكة سنة ٥٧٠م أو ٥٧١م في روايات المؤرخين، وكان من بني هاشم من قريش، وقد مات أبوه عبد الله قبل ولادته أو بعدها بقليل، وكانت أمه آمنة بنت وهب، وقد وُلد يتيمًا. وقد كان في هذا التفصيل ما يُشير إلى أن الرجل الذي سيُغيّر الجزيرة لم يُولد في قصرٍ ولا في مال، بل وُلد في بيتٍ من بيوت قريش المتوسطة. وقد كان في يتمه وفقره ما جعله يعرف حال الضعفاء من داخل بيوتهم، وكان في هذا ما يظهر في القرآن من دفاعٍ عن اليتيم والمسكين والمستضعف، لأن الخطاب لم يكن نظريًّا عند من عاش الحال.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت قريش في هذا العهد تحكم مكة بإدارةٍ من أعيانها، وكانت وظائف الحرم موزّعةً بين بطونها: السقاية والرفادة والحجابة واللواء والسفارة. وقد كان في هذا النظام ما يُشبه الحكومة المحلية، وكانت قريش تُدير الحجّ والتجارة معًا، وكانت في هذا تُشبه دولة مدينةٍ صغيرة تعيش على مكانٍ مقدّس وسوقٍ تجاري. وقد كان في هذا التوزيع ما يُشبه الدستور العرفي لمكة، وكان في هذا النظام ما يُنظّم الحجّ ويُدير المال، وكان في هذا أيضًا ما جعل قريش قادرةً على التفاوض مع القبائل باسم الحرم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في حياة النبيّ قبل البعثة ما يُذكر في السيرة: أنه رُضع في بني سعد، وأنه عاش مع جدّه عبد المطلب ثم عمّه أبي طالب، وأنه سافر مع عمّه إلى الشام في تجارة، وأنه عُرف بالصادق الأمين. وقد كان في هذه السنوات ما يُهيّئ الرجل لرسالةٍ لا تُبنى على معجزةٍ فقط، بل على معرفةٍ بالناس وأسواقهم وأخلاقهم. وقد كان في هذه السنوات ما يُهيّئ الرجل للرسالة: معرفةٌ بالناس، وأمانةٌ في التجارة، وخبرةٌ في السفر، وكان في هذا ما يجعل دعوته تبدأ من داخل المجتمع لا من خارجه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا العام أيضًا ما يُشير إلى تحوّلٍ أكبر: أن الحبشة فقدت سيطرتها على اليمن بعد ذلك، وأن الفرس صاروا أصحاب الكلمة في الجنوب، وأن الطريق التجاري بين اليمن والشام صار في يد قوى متنازعة. وقد كان في هذا ما يجعل مكة في موقعٍ مهمّ: أنها في وسط الطريق، وأنها المكان الوحيد الذي لا يستطيع أحدٌ أن يُلغيه، لأن الحجّ كان في الكعبة لا في كنيسة.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالحادثة في القرآن والتاريخ\u003c/h4\u003e\u003cp class=\"ap\"\u003eذكر القرآن حادثة الفيل في سورةٍ كاملة، ووجّه الخطاب إلى قريش بما يذكّرهم بنعمةٍ عليهم، وكان في هذا استدلالًا على أن الله يحمي بيته. وقد كان في السورة أيضًا إشارة إلى أن الجيش كان ذا عدّةٍ وقوّة، وأن ما أوقعه لم يكن قوّةً بشرية. وقد كان في هذا الاستدلال تذكيرٌ بنعمةٍ ماضية، لأن القرآن كان يُخاطب قومًا يعرفون الحادثة ويُرون آثارها في الطريق، وكان في هذا ما يجعل الحجّة قريبةً منهم لا بعيدة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد روى المؤرخون تفاصيل كثيرة عن الحادثة، وكانت بعض الروايات تُبالغ، لكن أصل الحادثة ثابت في القرآن وفي الشعر الجاهلي، وقد بقي في العربية اسم عام الفيل يُستعمل في التأريخ. وهذا يدل على أن الحادثة كانت معروفةً ومشهورةً في الجزيرة كلها، لا في مكة وحدها.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eمكة قبل البعثة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت مكة في هذا العهد مدينةً تجارية صغيرة لكنها ذات مكانةٍ دينية كبيرة، وكانت قريش قد صارت طبقةً من التجار تُدير القوافل إلى الشام واليمن والحبشة. وقد كان في مكة سوقٌ في موسم الحجّ، وكانت القبائل تأتي للحجّ والتجارة معًا، وكان في هذا ازدواجٌ بين الدين والاقتصاد جعل المدينة تعيش.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في مكة أيضًا نظامٌ اجتماعي صارم: قبائل وموالٍ وعبيد، وكانت الحروب بين القبائل تُهدّد التجارة، وكانت قريش تُحاول أن تُقيم هدنةً في الأشهر الحرم لتأمين الطرق. وقد كان في هذا النظام ما سيرفضه الإسلام بعد ذلك: العصبية، والاستغلال، ووأد البنات، وتفاوت الناس بالحسب والنسب.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eمولدٌ في عامٍ محفوظ\u003c/h4\u003e\u003cp class=\"ap\"\u003eوُلد النبيّ يتيمًا في بيتٍ من بيوت قريش، وكان في هذا ما يجعله قريبًا من الضعفاء الذين سيدعوهم بعد ذلك، لأنه عرف اليتم والفقر من داخلهما. وقد كان في نشأته بين قريش ما جعله يعرف أنسابها وحروبها وأسواقها، وكان في هذا ما يظهر في القرآن من خطابٍ لقريش بلسانٍ يعرفونه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في تزامن مولده مع حادثة الفيل ما استعمله المؤرخون للدلالة على مكانته، وكان في هذا نوعٌ من التأريخ الرمزي الذي يُربط فيه الحدثان ليكونا معنى واحدًا. وقد كان في هذا أيضًا ما يُظهر أن الجزيرة كانت تنتظر تحوّلًا، لأن كل قواها كانت في حالة سيولةٍ وصراع.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأبرهة\u003c/b\u003e\u003cspan\u003eوالي اليمن الحبشي وصاحب الفيل\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eعبد المطلب\u003c/b\u003e\u003cspan\u003eجدّ النبيّ وصاحب كلمة الإبل\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالسورة\u003c/b\u003e\u003cspan\u003eسورة الفيل في القرآن\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمولد\u003c/b\u003e\u003cspan\u003eنحو سنة ٥٧٠م في مكة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالنسب\u003c/b\u003e\u003cspan\u003eمحمد بن عبد الله بن عبد المطلب الهاشمي\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالسنة\u003c/th\u003e\u003cth\u003eالحدث\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eنحو ٥٧٠م\u003c/td\u003e\u003ctd\u003eزحف أبرهة إلى مكة\u003c/td\u003e\u003ctd\u003eحادثة الفيل وحفظ البيت\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eنحو ٥٧٠م\u003c/td\u003e\u003ctd\u003eمولد النبيّ\u003c/td\u003e\u003ctd\u003eبداية عهدٍ جديد في الجزيرة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٥٧٦م\u003c/td\u003e\u003ctd\u003eوفاة أمه آمنة\u003c/td\u003e\u003ctd\u003eنشأته في بني سعد ثم عند جدّه\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e٥٧٩م\u003c/td\u003e\u003ctd\u003eوفاة جدّه عبد المطلب\u003c/td\u003e\u003ctd\u003eكفالة أبي طالب له\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eنحو ٥٩٠م\u003c/td\u003e\u003ctd\u003eسفره في تجارةٍ إلى الشام\u003c/td\u003e\u003ctd\u003eخبرته بالأسواق والطرق\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eأَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِأَصْحَابِ الْفِيلِ\u003c/p\u003e\u003ccite\u003eسورة الفيل، الآية ١\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eزحف جيشٌ من اليمن لهدم الكعبة فردّه الله، وسُمّي ذلك العام عام الفيل، وفيه وُلد النبيّ يتيمًا في مكة. وقد كان في هذا التزامن ما قرأه المؤرخون رمزًا: أن البيت حُفظ في العام الذي وُلد فيه من سيُعيد إليه مكانته.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"map-of-powers","n":"خريطة القوى سنة ٦١٠م","ic":"🗺️","part":"القسم السابع: ليلة الإسلام","h":"\u003carticle class=\"ch3\" id=\"map-of-powers\" data-toc=\"خريطة القوى سنة ٦١٠م\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٧.٣\u003c/span\u003e\n          \u003ch3\u003e🗺️ خريطة القوى سنة ٦١٠م\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي السنة التي بُعث فيها النبيّ كانت الجزيرة محصورةً بين دولتين كبيرتين تتنازعان: بيزنطة وفارس، وكانت على أطرافها ممالك صغيرة تتبع هاتين الدولتين، وكانت مكة وإقليم الحجاز في الوسط بلا دولةٍ تُديرها.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكانت بيزنطة في سنة ٦١٠م في حربٍ طويلة مع فارس، وكانت قد خسرت الشام ومصر سنوات، وكان هرقل قد بدأ يُعيد تنظيم دولته، وكان في هذه الحرب استنزافٌ للطرفين. وقد كان في هذا ما يجعل الجزيرة ساحةً ثانوية في حساب القوى الكبرى، لأن انتباهها كان إلى الشمال، وكان في هذا فرصةً لتكوّن قوةٍ جديدة في الوسط. وقد كان في هذه الحرب ما جعل بيزنطة تُهمل أطرافها، وكان في هذا ما جعل الطرق البرية في الجزيرة أكثر أهمية، وكان في هذا ما أفاد مكة لأنها صارت معبرًا بديلًا للتجارة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان الفرس الساسانيون في عهد كسرى الثاني قد بلغوا أقصى اتساعهم، وكانوا يُسيطرون على العراق واليمن وأجزاءٍ من الشام، وكانت دولتهم تُدار بإدارةٍ مركزية قديمة، وكان فيها ديوانٌ وجيشٌ ونظام طبقات. وقد كان في هذا النظام قوّةٌ في الحرب وضعفٌ في المرونة، لأن الدولة التي تُدار من مركزٍ واحد تحتاج إلى وقتٍ طويل لتتغيّر. وقد كان في هذا النظام ما جعله عرضةً للانكسار السريع، لأن الدولة المركزية إذا انهزمت في معركةٍ كبيرة تفقد أطرافها في وقتٍ واحد، وهذا ما حدث فعلًا بعد ذلك.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان الغساسنة في الشام عربًا نصارى يتبعون بيزنطة، وكانوا يُدافعون عن الحدود مقابل مالٍ ولقب، وكانت حاضرتهم في الجابية والجولان، وكانت لهم مكانةٌ في الشعر العربي. وكان المناذرة في الحيرة عربًا يتبعون فارس، وكانوا يُدافعون عن حدود العراق، وكان في بلاطهم شعراءٌ وكتّاب، وكانت الحيرة مدينةً ذات ثقافةٍ مختلطة. وقد كان في هذه العلاقة ما يجعل العرب يُقاتلون في حروبٍ لا تخصّهم، وكان في هذا ما جعل بعض القبائل ترفض التبعية وتُحاول أن تُقيم دولةً مستقلة، وكان في هذا ما مهّد للفكرة الإسلامية عن الأمة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الجزيرة ممالك أخرى صغيرة: كندة في نجد وقد ضعفت، وحمير في اليمن وقد سقطت، وبني تغلب وبني بكر في الشمال الشرقي، وكانت هذه القبائل تُدير نفسها بنفسها، وكانت تُحالف من يُعطيها أكثر. وقد كان في هذا النظام القبلي ما يجعل الجزيرة ساحةً مفتوحةً للتحالفات السريعة، وكان في هذا ما سيستعمله الإسلام بعد ذلك. وقد كان في هذا النظام القبلي ما يجعل التحالفات سريعةً وسريعة الانكسار، لأن كل قبيلةٍ كانت تُحالف لتحصل على غنيمةٍ أو أمان، وكان في هذا ما جعل الجزيرة أرضًا سهلةً للتوحيد إذا ظهرت قوّةٌ قادرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت يثرب في هذا العهد مدينةً زراعية صغيرة، فيها قبائل من الأوس والخزرج، وفيها يهود من بني قينقاع والنضير وقريظة، وكانت الحروب بين الأوس والخزرج قد استمرّت سنوات، وكانت المدينة تحتاج إلى من يُصلح بينها. وقد كان في هذا ما يجعلها أرضًا مناسبةً لهجرةٍ جديدة بعد ذلك. وقد كان في هذه الحروب ما جعل المدينة تحتاج إلى حكمٍ أعلى من القبيلة، وكان في هذا ما جعلها تقبل النبيّ بعد ذلك حكمًا بينها، وكان في هذا ما يُفسّر سرعة البيعة في يثرب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت الطائف في يد ثقيف، وكانت مدينةً زراعية محصّنة، وكانت تُنافس مكة في التجارة، وكان فيها كرمةٌ وعنب، وكان أهلها يُريدون أن يكون لهم مكانة دينية أيضًا. وقد كان في العلاقة بين مكة والطائف ما يُشبه المنافسة الاقتصادية، وقد ظهر ذلك في مواقف ثقيف من الإسلام في أول الأمر. وقد كان في هذه المنافسة ما جعل ثقيف ترفض الإسلام في أول الأمر، لأن الإسلام كان يعني أن تُصبح مكة مركز الحجّ وحده، وأن تفقد الطائف مكانتها الدينية والاقتصادية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت مكة في الوسط بلا دولةٍ بالمعنى السياسي، وكانت تُدار من أعيان قريش، وكانت وظائفها موزّعةً بين بطونها، وكانت تعيش على الحجّ والتجارة. وقد كان في هذا الوضع قوّةٌ وضعفٌ: قوّةٌ لأنها لم تكن تحت حكم دولةٍ كبيرة، وضعفٌ لأنها لم تكن قادرةً على حماية طرقها بعيدًا عن أسوارها، وكانت قوافلها تُهاجَم. وقد كان في هذا الضعف ما يجعل مكة تحتاج إلى هدنةٍ مع القبائل، وكانت تُعقد الأحلاف لتأمين الطرق، وكان في هذا ما جعل قريشًا تُدرك أن الأمن شرطٌ للتجارة، وأن الدين الذي يُقيم الأمن قد يكون نافعًا لها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في الجزيرة قبل الإسلام أديانٌ متعدّدة: وثنيةٌ في معظم القبائل، ويهوديةٌ في يثرب وخيبر وتيماء، ونصرانيةٌ في نجران وبني تغلب وبعض قبائل الشام، وحنيفيةٌ في أفرادٍ قلائل يرفضون الوثنية. وقد كان في هذا التنوّع ما يجعل الدعوة الجديدة تُواجه أسئلةً كثيرة: عن التوحيد، وعن الأنبياء السابقين، وعن الكتب، وكان القرآن يُجيب على هذه الأسئلة في سياقها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا العالم أيضًا ما يُسمّى بالفراغ الديني في الوسط: أن مكة كانت تُقدّس الأصنام لكنها كانت تعرف اسم الله، وكانت تعرف الحنيفية، وكانت تسمع عن اليهود والنصارى. وقد كان في هذا الفراغ ما يجعل الدعوة إلى دين إبراهيم مقبولةً عند بعض الناس، لأنها لم تكن دينًا جديدًا بالكلية بل عودةً إلى أصلٍ معروف. وقد كان في هذا الفراغ الديني ما يُفسّر أن أول ما دعت إليه الدعوة كان توحيد الله ونبذ الأصنام، لأنه كان يُخاطب ما يعرفه الناس ويُعيدهم إلى أصلٍ يذكرونه، وكان في هذا ما جعل الحوار معهم ممكنًا.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eبيزنطة وفارس\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الحرب بين بيزنطة وفارس في أوائل القرن السابع الميلادي من أطول الحروب وأكثرها استنزافًا، وقد خسرت بيزنطة الشام ومصر سنوات، ثم عادت وانتصرت بعد ذلك. وقد كان في هذه الحرب ما يُفسّر اهتمام القرآن بها في سورة الروم، لأن المسلمين كانوا يُتابعون أخبارها وكانوا يرجون أن ينتصر الروم لأنهم أهل كتاب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه الحرب أثرٌ اقتصادي على الجزيرة: أن الطرق التجارية إلى الشام تعطّلت، وأن أسعار السلع تغيّرت، وأن قريشًا وجدت صعوبةً في تجارتها. وقد كان في هذا ما يجعل مكة في حاجةٍ إلى نظامٍ جديد، وكان في هذا أيضًا ما يجعل الناس يتساءلون عن معنى الأحداث الكبرى.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالغساسنة والمناذرة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الغساسنة والمناذرة دولتين عربيتين على أطراف الدولتين الكبيرتين، وكانتا تُدافعان عن الحدود مقابل مالٍ ولقب، وكانتا تُشبّهان الدول الحاجزة في العصر الحديث. وقد كان في هذا الوضع معنى سياسي دقيق: أن القبائل العربية كانت تُستعمل في حروبٍ لا تخصّها، وكانت تُدفع لها أموالٌ لتحمي حدود غيرها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في بلاط الحيرة ثقافةٌ عربية عالية، وكان فيها شعراء وكتّاب ونصارى ويهود، وكانت مدينةً تُشبه الحاضرة الصغيرة. وقد كان في هذا ما يُظهر أن العرب لم يكونوا جميعًا بدوًا، وأن فيهم مدنًا ودولًا وإدارات، وأن صورة البدوي الوحيد ليست الصورة الكاملة للجزيرة قبل الإسلام.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالوسط بلا دولة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الحجاز في الوسط بلا دولةٍ مركزية، وكانت القبائل تُدير نفسها بالتحالف والنسب، وكانت مكة حالةً خاصة لأنها مدينةٌ مقدّسة وتجارية في وقتٍ واحد. وقد كان في هذا الوضع ما يُشبه الفراغ السياسي الذي يملؤه من يملك شرعيةً دينية أو قوّةً عسكرية. وقد كان في هذا الفراغ ما يملؤه من يملك شرعيةً دينية، وكان في هذا ما يُفسّر أن النبيّ بدأ بالدعوة إلى الأخلاق والتوحيد قبل أن يُقيم دولة، لأنه كان يبني الشرعية قبل أن يبني السلطة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا الفراغ ما يُفسّر سرعة قيام الدولة الإسلامية بعد ذلك: أن الجزيرة لم تكن تحت حكم دولةٍ كبيرة تُدافع عن نفسها، وأن القبائل كانت تنتظر من يجمعها، وأن مكة كانت تنتظر من يُعيد ترتيب مكانتها. وقد كان في هذا كله ما يجعل الدعوة الجديدة تُواجه مقاومةً من المصالح القائمة، لا من دولةٍ قائمة.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eبيزنطة\u003c/b\u003e\u003cspan\u003eهرقل وحربٌ طويلة مع فارس\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eفارس\u003c/b\u003e\u003cspan\u003eكسرى الثاني وأقصى اتساع الدولة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالغساسنة\u003c/b\u003e\u003cspan\u003eعربٌ نصارى على حدود بيزنطة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمناذرة\u003c/b\u003e\u003cspan\u003eعربٌ على حدود فارس في الحيرة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالحجاز\u003c/b\u003e\u003cspan\u003eوسطٌ بلا دولةٍ مركزية\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالقوة\u003c/th\u003e\u003cth\u003eالموقع\u003c/th\u003e\u003cth\u003eعلاقتها بالجزيرة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eبيزنطة\u003c/td\u003e\u003ctd\u003eالشام ومصر والأناضول\u003c/td\u003e\u003ctd\u003eحليفة الغساسنة وحارسة طريق الشام\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eفارس\u003c/td\u003e\u003ctd\u003eالعراق واليمن\u003c/td\u003e\u003ctd\u003eحليفة المناذرة وحاكمة اليمن\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالغساسنة\u003c/td\u003e\u003ctd\u003eالشام والجولان\u003c/td\u003e\u003ctd\u003eحاجزٌ عربي على حدود بيزنطة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمناذرة\u003c/td\u003e\u003ctd\u003eالحيرة والعراق\u003c/td\u003e\u003ctd\u003eحاجزٌ عربي على حدود فارس\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eقريش\u003c/td\u003e\u003ctd\u003eمكة والحجاز\u003c/td\u003e\u003ctd\u003eمدينةٌ مقدّسة وتجارية بلا دولة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eغُلِبَتِ الرُّومُ فِي أَدْنَى الْأَرْضِ وَهُم مِّن بَعْدِ غَلَبِهِمْ سَيَغْلِبُونَ\u003c/p\u003e\u003ccite\u003eسورة الروم، الآيتان ٢ و٣\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eفي سنة ٦١٠م كانت الجزيرة بين بيزنطة وفارس، وعلى أطرافها ممالك عربية تابعة، وفي وسطها مكة بلا دولة. وقد كان في هذا الفراغ ما يجعل قيام دولةٍ جديدة ممكنًا، وما يجعل مقاومتها تأتي من المصالح لا من الدول.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"f","one":true,"id":"people","n":"أهم الشخصيات","ic":"","part":"","h":"\u003csection class=\"rsec\"\u003e\n      \u003ch2 class=\"sec\"\u003eأهم الشخصيات\u003c/h2\u003e\n      \u003cdiv class=\"people\"\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eشُرَاحيل بن عبد الله\u003c/b\u003e\u003cspan\u003eملك الحيرة نحو ١٩٥م، ويُنسب إليه تدوين أوّل تشريع مكتوب بين العرب.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eالمُنْذِر بن النَّعْمَان\u003c/b\u003e\u003cspan\u003eملك الحيرة الملقب بالملك المؤتمن، ومَنْ نُسب إليه بناء قصر الخِوان في بادية الحيرة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eأَبْرَهَة بن أَسْلَم\u003c/b\u003e\u003cspan\u003eأمير الحبشة صاحب سنة الفيل الذي قصد مكة بجيوش الفيلة فدُحرت سنة ٥٧٠م.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eالأسقف بن عبيد\u003c/b\u003e\u003cspan\u003eأسقف نجران المسيحي الذي عُرف بالخطاب والحارث، وترأس مسيحية جنوب الجزيرة.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eعبد الله بن جُدْعان\u003c/b\u003e\u003cspan\u003eمن كبار قريش في الجاهلية، اشتهر بالكرم وكثرة الخيل وحسن الصحبة والمجلس.\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"pc\"\u003e\u003cb\u003eطُقَيْل بن عُمَيْر\u003c/b\u003e\u003cspan\u003eشاعر جاهلي مشهور، حفظت كتب الأدب طرفاً من شعره في الشكر والأخذ بالعطاء.\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\n    \u003c/section\u003e"},{"u":"f","one":true,"id":"outcomes","n":"النتائج والآثار","ic":"","part":"","h":"\u003csection class=\"rsec\"\u003e\n      \u003ch2 class=\"sec\"\u003eالنتائج والآثار\u003c/h2\u003e\n      \u003cul class=\"outs\"\u003e\u003cli\u003eتركت ممالك اليمن نظاماً زراعياً وقنوات سقي عمرت قروناً، فجعلت جنوب الجزيرة مركزاً لتجارة اللبان.\u003c/li\u003e\u003cli\u003eأوجد تعاقب الغساسنة والمناذرة في العراق نواةً عربية كانت سلفاً لدولة الأمويين.\u003c/li\u003e\u003cli\u003eخلّدت أسواق عكاظ ومواسمها لغة الشعر الجاهلي ومكارم الأخلاق التي نقلها المؤرخون.\u003c/li\u003e\u003cli\u003eتركت أصنام الكعبة وذكريات الجاهلية نصوصاً حفظت وصف المجتمع العربي قبل الإسلام.\u003c/li\u003e\u003cli\u003eمكثّفت تجارة موانئ اليمن والشام جعلت الجزيرة طرفاً في اقتصاد البحر المتوسط.\u003c/li\u003e\u003cli\u003eجاء عام ٦١٠م بداية حقبة جديدة ربطت تاريخ الجزيرة العربية بمصير العالم بأسره.\u003c/li\u003e\u003c/ul\u003e\n    \u003c/section\u003e"},{"u":"f","one":true,"id":"sources","n":"المصادر والمراجع","ic":"","part":"","h":"\u003cdiv class=\"src frame\" style=\"--c:#8B6914\"\u003e\n    \u003cspan class=\"crn tl\"\u003e\u003csvg viewBox=\"0 0 26 26\"\u003e\n\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\"/\u003e\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\" transform=\"rotate(90 13 13)\" opacity=\".5\"/\u003e\u003c/svg\u003e\u003c/span\u003e\u003cspan class=\"crn tr\"\u003e\u003csvg viewBox=\"0 0 26 26\"\u003e\n\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\"/\u003e\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\" transform=\"rotate(90 13 13)\" opacity=\".5\"/\u003e\u003c/svg\u003e\u003c/span\u003e\u003cspan class=\"crn bl\"\u003e\u003csvg viewBox=\"0 0 26 26\"\u003e\n\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\"/\u003e\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\" transform=\"rotate(90 13 13)\" opacity=\".5\"/\u003e\u003c/svg\u003e\u003c/span\u003e\u003cspan class=\"crn br\"\u003e\u003csvg viewBox=\"0 0 26 26\"\u003e\n\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\"/\u003e\u003cpath d=\"M1 8V3a2 2 0 0 1 2-2h5M1 4h3M4 1v3\" transform=\"rotate(90 13 13)\" opacity=\".5\"/\u003e\u003c/svg\u003e\u003c/span\u003e\n    \u003ch2 class=\"sec\" style=\"margin-top:0\"\u003eالمصادر والمراجع\u003c/h2\u003e\n    \u003cul\u003e\u003cli\u003e\u003ccite\u003eالمسعودي\u003c/cite\u003e — مروج الذهب ومعادن الجوهر (أخبار ممالك اليمن وقصورها)\u003c/li\u003e\u003cli\u003e\u003ccite\u003eابن الأثير\u003c/cite\u003e — الكامل في التاريخ (أحداث المناذرة وسنة الفيل)\u003c/li\u003e\u003cli\u003e\u003ccite\u003eابن هشام\u003c/cite\u003e — السيرة النبوية (وفيها عام الفيل ومقدمته)\u003c/li\u003e\u003cli\u003e\u003ccite\u003eابن خلدون\u003c/cite\u003e — تاريخ ابن خلدون (العبر) (أحوال العرب قبل الإسلام)\u003c/li\u003e\u003c/ul\u003e\n  \u003c/div\u003e"},{"u":"f","one":true,"id":"pager","n":"الحقب الأخرى","ic":"","part":"","h":"\u003cnav class=\"pager\"\u003e\n    \u003ca class=\"prev empty\"\u003e\u003c/a\u003e\n    \u003ca class=\"next\" href=\"prophets.html\"\u003e\u003csmall\u003eالحقبة التالية →\u003c/small\u003e\u003cb\u003e🕌 محطات من قصص الأنبياء\u003c/b\u003e\u003c/a\u003e\n  \u003c/nav\u003e"}]}</script>
<script>
/* ===== موسوعة تاريخ الإسلام — منطق الواجهة + قارئ الكتاب =====
   يعمل على صفحات «الكتاب» (التي تحمل <script id="book">) وبقية الصفحات كما هي. */

/* هل هذه صفحة قارئ؟ يُحدَّد قبل أي تهيئة */
window.__READER__ = !!document.getElementById('book');

(function () {
  'use strict';
  var STORE = 'ti_bookmarks', THEME = 'ti_theme', PROG = 'ti_progress';

  /* ---------- تحويل الأرقام إلى هندية (وقت التشغيل) ---------- */
  function arDigits(s) {
    return String(s == null ? '' : s).replace(/\d/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'[d]; });
  }
  window.arDigits = arDigits;

  /* ---------- الوضع الليلي ---------- */
  function applyTheme(d) {
    document.body.classList.toggle('dark', d);
    var b = document.getElementById('themeBtn');
    if (b) b.textContent = d ? '☀️' : '🌙';
  }
  var th = document.getElementById('themeBtn');
  if (th) th.addEventListener('click', function () {
    var d = !document.body.classList.contains('dark');
    applyTheme(d); localStorage.setItem(THEME, d ? '1' : '0');
  });
  applyTheme(localStorage.getItem(THEME) === '1');

  /* ---------- التقدّم: مشترك بين التمرير والقارئ ---------- */
  function setProgress(id, frac) {
    if (!id || id === 'home') return;
    var pr = JSON.parse(localStorage.getItem(PROG) || '{}');
    if ((pr[id] || 0) < frac) { pr[id] = frac; localStorage.setItem(PROG, JSON.stringify(pr)); }
    if (frac > 0.92) {
      var bm = JSON.parse(localStorage.getItem(STORE) || '[]');
      if (bm.indexOf(id) < 0) {
        bm.push(id); localStorage.setItem(STORE, JSON.stringify(bm));
        if (window.refreshBadges) window.refreshBadges();
      }
    }
  }
  window.__setProgress = setProgress;

  var domeFill = document.querySelector('.dome .fill');
  var topBar = document.querySelector('.topbar i');
  var swordBl = document.querySelector('.sword .bl');
  var swordTx = document.querySelector('.sword span');

  function paintProgress(pct) {
    if (domeFill) domeFill.style.opacity = (0.12 + pct * 0.88).toFixed(2);
    if (topBar) topBar.style.width = Math.round(pct * 100) + '%';
    if (swordBl) swordBl.style.clipPath = 'inset(0 ' + (100 - pct * 100) + '% 0 0)';
    if (swordTx) swordTx.textContent = 'القراءة ' + arDigits(Math.round(pct * 100)) + '٪';
  }
  window.__paintProgress = paintProgress;

  /* ---------- نظام الأوسمة ---------- */
  var BADGES = [
    { id: 'start', ic: '🌱', n: 'نَبتُ الطريق', d: 'ابدأ أول حقبة' },
    { id: 'prophets', ic: '📜', n: 'وسام النبوة', d: 'أنبياء' },
    { id: 'seerah', ic: '🕊️', n: 'وسام الرحمة', d: 'السيرة' },
    { id: 'rashidun', ic: '⚔️', n: 'وسام الفاروق', d: 'الراشدون' },
    { id: 'umayyad', ic: '🏛️', n: 'وسام البناء', d: 'الأمويه' },
    { id: 'andalus', ic: '🏰', n: 'وسام الأندلس', d: 'الأندلس' },
    { id: 'abbasid', ic: '📚', n: 'وسام الفجر', d: 'العباسيه' },
    { id: 'crusades', ic: '🛡️', n: 'وسام حطين', d: 'الصليبيون' },
    { id: 'mamluk', ic: '🐎', n: 'وسام النصر', d: 'المماليك' },
    { id: 'ottoman', ic: '🕌', n: 'وسام السلطان', d: 'العثمانيون' },
    { id: 'civilization', ic: '🔬', n: 'وسام العقل', d: 'الحضاره' },
    { id: 'modern', ic: '🕰️', n: 'وسام التاريخ', d: 'العصر الحديث' },
    { id: 'all', ic: '👑', n: 'تاج المؤرخ', d: 'كل الحقب' }
  ];
  window.refreshBadges = function () {
    var bm = JSON.parse(localStorage.getItem(STORE) || '[]');
    var host = document.getElementById('badges');
    if (!host) return;
    var done = BADGES.filter(function (b) {
      return b.id === 'start' ? bm.length >= 1

/* ==========================================================

(function () {

  /* ---------- ٥) تصنيف الكتل ---------- */

    if (el.classList.contains('res')) return 'tx';
    if (el.classList.contains('people')) return 'ls';
    if (el.classList.contains('toclist')) return 'ls';
    if (el.querySelector && el.querySelector('.toclist,.people,ul,ol')) return 'ls';
    if (t === 'H2' || t === 'H3' || t === 'H4' || t === 'H5') return 'hd';
    return 'other';

  /* الحاوية التي أبناؤها عناصر القائمة (قد تكون داخل إطار) */
  function listHost(el) {

  }
  function isHeading(el) {

    if (el.classList.contains('ch3-h')) return true;

  }

  /* مدى الكتلة القابل للتقسيم: [بداية، نهاية) */
  function rangeOf(el, kind) {
    if (kind === 'tx' || kind === 'qt') return [0, textOf(el).length];
    if (kind === 'ls') return [0, listHost(el).children.length];
    if (kind === 'toc') return [0, tocRows(el).length];
    if (kind === 'tb') return [0, el.querySelectorAll('tbody tr').length];
    if (kind === 'kb') {
      var g = el.querySelector('.kgrid3');
      return [0, g ? g.children.length : 0];
    }
    return [0, 0];
  }

  /* ---------- ٦) نصوص الكتلة ---------- */
  function textOf(el) {
    if (el.tagName === 'BLOCKQUOTE') {
      var p = el.querySelector('p');
      return p ? p.textContent : el.textContent;
    }
    return el.textContent;
  }
  function cloneWithText(el, text, keepDrop) {
    var c = el.cloneNode(true);
    var drop = c.querySelector('.drop');
    var kids = Array.prototype.slice.call(c.childNodes);
    for (var i = 0; i < kids.length; i++) {
      var k = kids[i];
      if (k.nodeType === 3) c.removeChild(k);
      else if (k.nodeType === 1 && !(keepDrop && k === drop)) c.removeChild(k);
    }
    var body = text;
    if (keepDrop && drop) body = text.slice(drop.textContent.length);
    c.appendChild(document.createTextNode(body));
    return c;

  function makeText(el, a, e, keepDrop) {
    if (el.tagName === 'BLOCKQUOTE') {
      var c = el.cloneNode(true);
      var p = c.querySelector('p');
      p.textContent = el.querySelector('p').textContent.slice(a, e);
      var cite = c.querySelector('cite');
      if (cite && a > 0) cite.remove();
      return c;
    }
    return cloneWithText(el, el.textContent.slice(a, e), keepDrop);
  }
  function snapSentence(text, pos) {
    var marks = ['.', '؟', '!', '۔', '،', '؛', ':'];
    for (var i = pos; i > pos - 220 && i > 40; i--) {
      if (marks.indexOf(text[i - 1]) >= 0) return i;
    }
    return pos;
  }

  /* ---------- ٧) تقسيم الكتل ---------- */
  function splitBlock(el, kind, a, e, avail) {
    if (avail < 70) return null;
    if (kind === 'tx' || kind === 'qt') {
      var full = textOf(el);
      /* عتبة منخفضة: كان ٢٤٠/٢٠٠ حرفًا فيترك فراغًا كبيرًا في أسفل الصفحات
         حين تأتي فقرة متوسطة لا تسع كاملة. نسمح بالقسمة ما دامت البقية سطرًا معتبرًا. */
      if (e - a < 90) return null;
      var hasDrop = !!el.querySelector('.drop');
      /* تقدير نسبي ثم تصحيحان على الأكثر — أسرع بكثير من البحث الثنائي على الجوال */
      var span = e - a;
      var fullH = measureOne(el);
      if (!(fullH > avail)) return null;
      var guess = a + Math.max(60, Math.min(span - 60, Math.round(span * (avail / fullH) * 0.97)));
      var best = -1;
      for (var it = 0; it < 3; it++) {
        var h = measureOne(makeText(el, a, guess, a === 0 && hasDrop));
        if (h <= avail) {
          best = guess;
          var room = avail - h;
          if (room < 24) break;
          var step = Math.max(24, Math.round(span * room / fullH));
          if (guess + step > e - 50) break;
          guess += step;
        } else {
          var back = Math.max(24, Math.round(span * (h - avail) / fullH));
          if (guess - back <= a + 50) break;
          guess -= back;
        }
      }
      if (best < 0) return null;
      var cut = snapSentence(full, best);
      if (cut <= a || cut >= e) cut = best;
      /* لا نُبقِي ذيلًا قصيرًا جدًا (سطرًا مبتورًا) ولا رأسًا قصيرًا جدًا */
      if ((cut - a) < 70 || (e - cut) < 50) return null;
      var p1 = makeText(el, a, cut, a === 0 && hasDrop);
      var p2 = makeText(el, cut, e, false);
      return [
        { d: { k: kind === 'qt' ? 'qt' : 'tx', a: a, e: cut, dp: (a === 0 && hasDrop) ? 1 : 0 }, node: p1 },
        { d: { k: kind === 'qt' ? 'qt' : 'tx', a: cut, e: e, dp: 0 }, node: p2 }
      ];
    }
    if (kind === 'tb') return splitTable(el, a, e, avail);
    if (kind === 'ls') return splitList(el, a, e, avail);
    if (kind === 'kb') return splitKbox(el, a, e, avail);

  /* جدول: يُقسَّم بالصفوف مع تكرار صف العناوين */
  function splitTable(el, a, e, avail) {

    if (!rows.length) return null;
    function build(r0, r1) {

      }
      if (r0 > 0) { var cap = w.querySelector('.tblcap'); if (cap) cap.remove(); }
      return w;
    }
    var lo = a + 1, hi = e - 1, best = -1;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      if (measureOne(build(a, mid)) <= avail) { best = mid; lo = mid + 1; } else hi = mid - 1;
    }
    if (best < 0 || best <= a) return null;
    return [
      { d: { k: 'tb', a: a, b: best }, node: build(a, best) },
      { d: { k: 'tb', a: best, b: e }, node: build(best, e) }

  }

  /* قائمة أو شبكة: تُقسَّم بعناصرها */
  function splitList(el, a, e, avail) {
    var host = listHost(el);
    var kids = host.children;
    if (kids.length < 3) return null;
    function build(c0, c1) {
      var c = el.cloneNode(true);
      var h = listHost(c);
      var ch = Array.prototype.slice.call(h.children);
      for (var i = 0; i < ch.length; i++) if (i < c0 || i >= c1) h.removeChild(ch[i]);

  /* فهرس الفصول: يُقسَّم بالصفوف، مع تكرار عنوان القسم في الصفحة التالية */
  function tocRows(el) {
    var host = listHost(el), rows = [];
    Array.prototype.slice.call(host.children).forEach(function (li) {
      var ul = (li.classList && li.classList.contains('toc-part')) ? li.querySelector('ul') : null;
      if (ul) {
        rows.push({ kind: 'p', node: li });
        Array.prototype.slice.call(ul.children).forEach(function (c) { rows.push({ kind: 'c', node: c }); });
      } else rows.push({ kind: 'c', node: li });
