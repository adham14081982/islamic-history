<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="description" content="تمتد هذه الحقبة من أقدم آثار الاستيطان في الجزيرة العربية حتى عام 610م الذي وُلد فيه النبي محمد ﷺ، أي نحو ستة آلاف عام. نبضت فيها ممالك كبرى مثل سبأ و">
<title>الجزيرة العربية قبل الإسلام | موسوعة تاريخ الإسلام</title>
<link rel="preload" href="assets/fonts/amiri-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/amiri-700.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* ===== موسوعة تاريخ الإسلام — التنسيق المشترك ===== */

/* الخطوط محليّة (Subset عربي): لا شبكة، ولا اختلاف في القياس بين تشغيل وتشغيل */
@font-face{font-family:'Amiri';font-style:normal;font-weight:400;font-display:block;
  src:url(assets/fonts/amiri-400.woff2) format('woff2')}
@font-face{font-family:'Amiri';font-style:normal;font-weight:700;font-display:block;
  src:url(assets/fonts/amiri-700.woff2) format('woff2')}
@font-face{font-family:'Cairo';font-style:normal;font-weight:200 1000;font-display:block;
  src:url(assets/fonts/cairo-var.woff2) format('woff2')}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --gold:#B8942F;--gold2:#8B6914;--cream:#FBF4E4;--paper:#FFFDF8;
  --ink:#2E2A24;--muted:#7C7364;--line:#E7DCC3;
  --green:#1E6B3A;--blue:#155E9C;
  --shadow:0 4px 18px rgba(80,60,20,.08);
  --c:#B8942F;
}
body{font-family:'Cairo',sans-serif;background:var(--cream);color:var(--ink);
  min-height:100vh;line-height:1.9;transition:.3s}

body.dark{--paper:#201E1A;--cream:#161512;--ink:#E8E1D2;--muted:#A79E8B;
  --line:#3A362C;--shadow:0 4px 18px rgba(0,0,0,.35)}

main{max-width:820px;margin:0 auto;padding:1.2rem 1.1rem 5rem}

/* ---------- الترويسة ---------- */
header.top{position:sticky;top:0;z-index:60;display:flex;align-items:center;
  justify-content:space-between;gap:.6rem;padding:.55rem 1rem;
  background:var(--paper);border-bottom:2px solid var(--gold)}
.brand{font-family:'Amiri',serif;font-weight:700;font-size:1.02rem;color:var(--ink);
  text-decoration:none;display:flex;align-items:center;gap:.4rem}
.tools{display:flex;align-items:center;gap:.5rem}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
  background:transparent;color:var(--ink);font-size:1.05rem;cursor:pointer;
  display:grid;place-items:center;transition:.2s}
.ib:hover{background:var(--gold);color:#fff;border-color:var(--gold)}
.ib:active{transform:scale(.9)}

/* ---------- قبة التقدم ---------- */
.dome{width:38px;height:44px;position:relative;cursor:default}
.dome svg{width:100%;height:100%;display:block}
.dome .fill{fill:var(--gold);opacity:.85;transition:.4s}

/* ---------- شارات ---------- */
.badge{display:inline-flex;align-items:center;gap:.3rem;font-size:.72rem;
  background:var(--gold);color:#fff;border-radius:50px;padding:.15rem .6rem;
  font-weight:700}

/* ---------- المسار ---------- */
.crumbs{font-size:.82rem;color:var(--muted);margin-bottom:.8rem;
  display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.crumbs a{color:var(--muted);text-decoration:none}
.crumbs a:hover{color:var(--gold2)}

/* ---------- الترويسة البطلة ---------- */
.hero{position:relative;background:var(--paper);border:1px solid var(--line);
  border-top:6px solid var(--c);border-radius:20px;padding:1.6rem 1.3rem 1.4rem;
  text-align:center;box-shadow:var(--shadow);margin-bottom:1.4rem;overflow:hidden}
.hero .ic{font-size:2.6rem;line-height:1}
.hero h1{font-family:'Amiri',serif;font-size:1.9rem;color:var(--c);margin:.3rem 0 .1rem}
.hero .period{color:var(--gold2);font-size:.85rem;font-weight:600;margin-bottom:.6rem}
.hero .intro{color:var(--muted);font-size:.96rem;line-height:2;max-width:620px;margin:0 auto}

/* ---------- زخرفة SVG ---------- */
.orn{display:block;margin:1.2rem auto;opacity:.55}
.orn line,.orn path,.orn circle{stroke:var(--gold);stroke-width:1.1;fill:none}

/* ---------- العناوين ---------- */
h2.sec{font-family:'Amiri',serif;font-size:1.35rem;color:var(--c);
  margin:2rem 0 .9rem;display:flex;align-items:center;gap:.6rem}
h2.sec:before{content:"";width:6px;height:22px;background:var(--gold);
  border-radius:3px;flex:0 0 auto}
h2.sec .n{margin-right:auto;font-family:'Cairo';font-size:.75rem;color:var(--muted);font-weight:400}

/* ---------- الخط الزمني ---------- */
.tlwrap{position:relative;margin-bottom:.4rem}
.tl{display:flex;gap:.6rem;overflow-x:auto;padding:.6rem .2rem 1rem;
  scroll-snap-type:x mandatory;scrollbar-width:thin}
.tl::-webkit-scrollbar{height:5px}
.tl::-webkit-scrollbar-thumb{background:var(--gold);border-radius:9px}
.tli{flex:0 0 150px;scroll-snap-align:center;background:var(--paper);
  border:1px solid var(--line);border-right:4px solid var(--c);
  border-radius:14px;padding:.6rem .7rem;cursor:pointer;text-align:right;
  transition:.22s;font-family:'Cairo'}
.tli:hover,.tli.on{transform:translateY(-3px);box-shadow:var(--shadow);border-right-color:var(--gold)}
.tli b{display:block;color:var(--c);font-size:.9rem}
.tli span{display:block;color:var(--muted);font-size:.76rem;line-height:1.6}
.tlnav{display:flex;justify-content:space-between;margin-top:-.5rem}

/* ---------- الأحداث ---------- */
.ev{background:var(--paper);border:1px solid var(--line);border-radius:16px;
  padding:1rem 1.1rem;margin-bottom:.9rem;box-shadow:var(--shadow);
  opacity:0;transform:translateY(14px);transition:.45s}
.ev.in{opacity:1;transform:none}
.ev-head{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;margin-bottom:.5rem}
.ev-y{background:var(--c);color:#fff;font-size:.74rem;font-weight:700;
  padding:.15rem .55rem;border-radius:6px;white-space:nowrap}
.ev h3{font-family:'Amiri',serif;font-size:1.18rem;color:var(--ink)}
.ev p{font-family:'Amiri',serif;font-size:1.08rem;line-height:2.05;text-align:justify}
.ev .res{margin-top:.7rem;padding:.55rem .8rem;border-right:4px solid var(--gold);
  background:linear-gradient(135deg,rgba(184,148,47,.10),rgba(184,148,47,.04));
  border-radius:10px;font-size:.9rem;color:var(--gold2);font-weight:600}
.ev .res:before{content:"◀ النتيجة  "}

/* ---------- الشخصيات ---------- */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.6rem}
.pc{background:var(--paper);border:1px solid var(--line);border-radius:14px;
  padding:.65rem .8rem;border-top:3px solid var(--c)}
.pc b{display:block;color:var(--ink);font-size:.95rem}
.pc span{display:block;color:var(--muted);font-size:.78rem;line-height:1.65}

/* ---------- النتائج ---------- */
.outs{list-style:none}
.outs li{position:relative;padding:.5rem 1.5rem .5rem 0;border-bottom:1px dashed var(--line);
  font-size:.95rem}
.outs li:before{content:"◆";position:absolute;right:0;color:var(--gold);font-size:.8rem}

/* ---------- المصادر ---------- */
.src{background:var(--paper);border:1px solid var(--line);border-radius:16px;
  padding:.9rem 1.1rem;margin-top:2.2rem}
.src li{font-size:.86rem;color:var(--muted);padding:.25rem 1.2rem .25rem 0;
  position:relative;line-height:1.8}
.src li:before{content:"❋";position:absolute;right:0;color:var(--gold)}
.src li cite{font-style:normal;color:var(--ink);font-weight:600}

/* ---------- التنقل بين الصفحات ---------- */
.pager{display:flex;gap:.6rem;margin-top:1.6rem}
.pager a{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:14px;
  padding:.7rem .9rem;text-decoration:none;color:var(--ink);transition:.22s}
.pager a:hover{border-color:var(--gold);box-shadow:var(--shadow)}
.pager a small{display:block;color:var(--muted);font-size:.7rem}
.pager a b{font-size:.92rem;color:var(--c)}
.pager a.next{text-align:left}
.pager a.empty{visibility:hidden}

/* ---------- الانتقال بين الصفحات ---------- */
main{animation:pageIn .4s ease}
@keyframes pageIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}

/* ---------- فهرس الصفحة الرئيسية ---------- */
.eg{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:.8rem}
.ec{position:relative;background:var(--paper);border:1px solid var(--line);
  border-top:5px solid var(--c);border-radius:18px;padding:1rem .8rem .9rem;
  text-align:center;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);
  transition:.25s;overflow:hidden}
.ec:hover{transform:translateY(-4px);box-shadow:0 10px 26px rgba(80,60,20,.16)}
.ec .ic{font-size:2.1rem;line-height:1.2}
.ec b{display:block;color:var(--c);font-size:.98rem;margin:.25rem 0 .15rem}
.ec small{display:block;color:var(--muted);font-size:.72rem;line-height:1.55}
.ec .pg{height:5px;background:var(--line);border-radius:9px;margin-top:.55rem;overflow:hidden}
.ec .pg i{display:block;height:100%;background:var(--c);width:0;transition:.4s}
.ec .done{position:absolute;top:.4rem;left:.5rem;font-size:.95rem;color:var(--gold)}

/* ---------- البحث ---------- */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;display:none}
.ov.on{display:block}
.panel{position:fixed;inset:0;background:var(--paper);z-index:95;display:none;flex-direction:column}
.panel.on{display:flex}
.sh{display:flex;gap:.6rem;padding:.8rem;border-bottom:2px solid var(--gold)}
.sh input{flex:1;border:0;background:transparent;font-family:'Cairo';
  font-size:1.05rem;color:var(--ink);outline:none}
.sb{flex:1;overflow-y:auto;padding:.8rem}
.res{background:transparent;border:1px solid var(--line);border-radius:12px;
  padding:.7rem .9rem;margin-bottom:.5rem;cursor:pointer}
.res b{display:block;color:var(--c);font-size:.95rem}
.res small{color:var(--muted);font-size:.78rem;line-height:1.6}
.res em{font-style:normal;background:rgba(184,148,47,.22);border-radius:3px;padding:0 2px}

@media(max-width:420px){
  main{padding:.9rem .8rem 4rem}
  .hero h1{font-size:1.5rem}
  .tli{flex:0 0 132px}
}

/* ========== ١) الإطار المزخرف — حواشي المخطوطات (زوايا ثابتة الحجم) ========== */
.frame{position:relative;border:1px solid var(--gold);border-radius:6px;padding:1.6rem 1.35rem}
.frame:before{content:"";position:absolute;inset:5px;border:1px solid var(--gold);
  opacity:.28;border-radius:3px;pointer-events:none}
.crn{position:absolute;width:26px;height:26px;pointer-events:none;color:var(--gold);opacity:.75}
.crn svg{width:100%;height:100%;display:block;stroke:currentColor;fill:none;stroke-width:1.1}
.crn.tl{top:-1px;right:-1px}.cn-tr{}
.crn.tr{top:-1px;left:-1px}
.crn.bl{bottom:-1px;right:-1px}
.crn.br{bottom:-1px;left:-1px}
.frame>*:not(.crn){position:relative;z-index:1}

/* ========== ٢) الخط الزمني الكبير ========== */
.orn{width:210px;max-width:70%;height:18px;opacity:.55}
.bigtl{display:flex;gap:.55rem;overflow-x:auto;padding:1rem .3rem 1.3rem;
  scroll-snap-type:x mandatory;cursor:grab;scrollbar-width:thin;
  -webkit-overflow-scrolling:touch}
.bigtl:active{cursor:grabbing}
.bigtl::-webkit-scrollbar{height:6px}
.bigtl::-webkit-scrollbar-thumb{background:var(--gold);border-radius:9px}
.btl{flex:0 0 126px;scroll-snap-align:center;position:relative;
  display:flex;flex-direction:column;align-items:center;gap:.25rem;
  text-decoration:none;color:inherit;padding-top:1.1rem}
.btl:before{content:"";position:absolute;top:.4rem;right:-.3rem;left:-.3rem;height:2px;
  background:var(--line)}
.btl:after{content:"";position:absolute;top:0;right:calc(50% - 9px);
  width:18px;height:18px;border-radius:50%;background:var(--paper);
  border:3px solid var(--c);z-index:2;transition:.25s}
.btl:hover:after{transform:scale(1.25)}
.btl .ic{font-size:1.6rem;line-height:1;z-index:2}
.btl .nm{font-family:'Amiri',serif;font-size:.86rem;color:var(--c);text-align:center;line-height:1.5}
.btl .yr{font-size:.65rem;color:var(--muted)}
.btl .st{font-size:.6rem;color:var(--gold2);font-weight:700}

/* ========== ٣) تقليب الصفحة ========== */
.flip{position:fixed;inset:0;background:var(--cream);z-index:200;pointer-events:none;opacity:0}
.flip.go{animation:flipA .5s ease forwards}
@keyframes flipA{
  0%{opacity:.95;transform:perspective(1200px) rotateY(0)}
  55%{opacity:.95;transform:perspective(1200px) rotateY(-38deg)}
  100%{opacity:1;transform:perspective(1200px) rotateY(0)}
}
main.flip-out{animation:flipB .3s ease forwards}
@keyframes flipB{to{opacity:0;transform:perspective(1200px) translateX(-45px)}}

/* ========== ٤) تقدّم على شكل سيف ========== */
.sword{position:fixed;bottom:14px;right:50%;transform:translateX(50%);
  z-index:70;pointer-events:none;display:flex;align-items:center;gap:.5rem;
  background:var(--paper);border:1px solid var(--line);border-radius:50px;
  padding:.3rem .85rem;box-shadow:var(--shadow);font-size:.72rem;color:var(--muted)}
.sword svg{height:11px;width:118px}
.sword .bl{fill:var(--gold);opacity:.9}

/* ========== ٥) الأوسمة ========== */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:.55rem;margin-top:.8rem}
.bg{border:1px dashed var(--line);border-radius:14px;padding:.7rem .5rem;text-align:center;
  background:var(--paper);opacity:.4;filter:grayscale(1);transition:.35s}
.bg.on{opacity:1;filter:none;border:1px solid var(--gold);
  box-shadow:0 0 0 1px rgba(184,148,47,.22),var(--shadow)}
.bg .bi{font-size:1.9rem;line-height:1.2}
.bg b{display:block;font-size:.82rem;color:var(--ink);margin-top:.15rem}
.bg small{display:block;color:var(--muted);font-size:.64rem;line-height:1.5}

/* ========== ٦) شريط علوي رفيع ========== */
.topbar{position:fixed;top:0;right:0;left:0;height:3px;z-index:80}
.topbar i{display:block;height:100%;width:0;
  background:linear-gradient(90deg,var(--gold),#E8CE7C);transition:width .1s linear}

/* ==========================================================
   واجهة الصفحات العميقة (فصول متعددة)
   ========================================================== */

/* الفهرس */
.toc{margin-bottom:1.4rem;padding:1.2rem 1.3rem 1.4rem}
.toclist{list-style:none}
.toclist li{margin:0}
.toclist a{display:flex;align-items:center;gap:.6rem;padding:.42rem .3rem;
  border-bottom:1px dashed var(--line);text-decoration:none;color:var(--ink);
  font-size:.92rem;transition:.2s}
.toclist a:hover{color:var(--c);padding-right:.8rem;background:rgba(184,148,47,.07)}
.toclist b{background:var(--c);color:#fff;border-radius:6px;min-width:24px;
  text-align:center;font-size:.72rem;padding:.1rem .3rem;flex:0 0 auto}
.toclist .ttl{flex:1 1 auto;min-width:0}
.toclist .tpg{margin-inline-start:auto;flex:0 0 auto;font-size:.74rem;color:var(--muted);
  background:rgba(184,148,47,.1);border-radius:6px;padding:.05rem .4rem;min-width:26px;text-align:center}

/* عنوان القسم */
.part{margin-bottom:2.6rem}
.part-h{position:relative;text-align:center;margin:2.4rem 0 1.6rem;
  padding:1.1rem .9rem;border-top:1px solid var(--gold);border-bottom:1px solid var(--gold)}
.part-ic{font-size:2rem;line-height:1}
.part-h h2{font-family:'Amiri',serif;font-size:1.5rem;color:var(--c);margin:.2rem 0}
.part-h p{color:var(--muted);font-size:.92rem;max-width:640px;margin:.4rem auto 0;line-height:1.95}

/* الفصل */
.ch3{position:relative;background:var(--paper);border:1px solid var(--line);
  border-radius:16px;padding:1.3rem 1.2rem;margin-bottom:1.1rem;box-shadow:var(--shadow)}
.ch3-h{display:flex;align-items:flex-start;gap:.6rem;margin-bottom:.7rem;
  padding-bottom:.6rem;border-bottom:1px solid var(--line)}
.ch3-n{background:var(--c);color:#fff;font-size:.72rem;font-weight:700;
  padding:.18rem .5rem;border-radius:6px;flex:0 0 auto;margin-top:.25rem}
.ch3 h3,.rbody h3{font-family:'Amiri',serif;font-size:1.35rem;color:var(--ink);line-height:1.6}
.ch3 .lead,.rbody .lead{font-family:'Amiri',serif;font-size:1.12rem;line-height:2.05;
  color:var(--c);font-weight:700;margin-bottom:.7rem;text-align:right}
.ch3 .ap,.rbody .ap{font-family:'Amiri',serif;font-size:1.1rem;line-height:2.15;
  text-align:justify;margin-bottom:.75rem}
.ch3 .sub,.rbody .sub{font-family:'Amiri',serif;font-size:1.15rem;color:var(--c);
  margin:1.2rem 0 .5rem;padding-right:.6rem;border-right:4px solid var(--gold)}

/* صندوق الخلاصة */
.kbox{margin-top:1rem;background:linear-gradient(135deg,rgba(184,148,47,.09),rgba(184,148,47,.03));
  border:1px solid var(--line);border-radius:12px;padding:.8rem .9rem}
.kbox .bt{font-family:'Amiri',serif;color:var(--gold2);font-size:1rem;margin-bottom:.5rem}
.kgrid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.55rem}
.kb{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:.5rem .6rem}
.kb b{display:block;color:var(--blue);font-size:.88rem;margin-bottom:.1rem}
.kb span{font-size:.78rem;color:var(--muted);line-height:1.6;display:block}

/* جدول */
.tblwrap{overflow-x:auto;margin-top:1rem;border:1px solid var(--line);border-radius:12px}
.tblwrap table{border-collapse:collapse;width:100%;min-width:380px}
.tblwrap th{background:var(--c);color:#fff;font-size:.82rem;font-weight:700;
  padding:.55rem .7rem;text-align:right;white-space:nowrap}
.tblwrap td{padding:.55rem .7rem;font-size:.84rem;border-bottom:1px solid var(--line);
  line-height:1.8;vertical-align:top}
.tblwrap tr:last-child td{border-bottom:0}
.tblwrap tbody tr:nth-child(odd){background:rgba(184,148,47,.045)}

/* اقتباس */
.ch3 blockquote,.rbody blockquote{margin:1rem 0;padding:.8rem 1rem;border-right:5px solid var(--gold);
  background:rgba(184,148,47,.07);border-radius:0 12px 12px 0}
.ch3 blockquote p,.rbody blockquote p{font-family:'Amiri',serif;font-size:1.08rem;line-height:2;color:var(--gold2)}
.ch3 blockquote cite,.rbody blockquote cite{display:block;margin-top:.4rem;font-size:.78rem;
  color:var(--muted);font-style:normal}

/* خلاصة الفصل */
.ch3 .res,.rbody .res{margin-top:1rem;padding:.6rem .9rem;border-right:4px solid var(--gold);
  background:linear-gradient(135deg,rgba(184,148,47,.12),rgba(184,148,47,.04));
  border-radius:10px;font-size:.9rem;color:var(--gold2);font-weight:600}
.ch3 .up{display:block;text-align:left;margin-top:.9rem;font-size:.78rem;
  color:var(--muted);text-decoration:none}
.ch3 .up:hover{color:var(--c)}

@media(max-width:420px){
  .ch3{padding:1rem .85rem}
  .ch3 .ap,.rbody .ap{font-size:1.05rem}
  .kgrid3{grid-template-columns:1fr 1fr}
}


/* ==========================================================
   COMFORT — راحة القراءة والزخرفة
   ========================================================== */

/* عرض مريح للسطر: يمنع الإرهاق البصري */
main{max-width:760px}
.ch3 .ap,.ch3 .lead{max-width:100%}

/* سطر استهلالي كبير (حرف Headline) */
.ch3 .lead .drop,.rbody .lead .drop{float:right;font-family:'Amiri',serif;font-size:3.4rem;line-height:.82;
  color:var(--c);margin:.18rem 0 0 .45rem;font-weight:700;opacity:.9;
  border-right:3px solid var(--gold);padding:.1rem .45rem 0 0}

/* فاصل زخرفي بين الأقسام */
.porn{width:280px;max-width:80%;height:38px;margin:0 auto .6rem;display:block}
.porn .ln{stroke:var(--gold);stroke-width:1.1;fill:none;opacity:.7}
.porn .dm{stroke:var(--gold);stroke-width:.9;fill:none;opacity:.5}

/* فهرس الأقسام داخل رأس القسم */
.part-list{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin-top:.7rem}
.part-list a{font-size:.76rem;text-decoration:none;color:var(--muted);
  border:1px solid var(--line);border-radius:50px;padding:.2rem .7rem;transition:.2s}
.part-list a:hover{color:var(--c);border-color:var(--gold);background:rgba(184,148,47,.08)}

/* فهرس متشعّب */
.toclist>li{padding:0}
.toc-part{list-style:none;margin-bottom:.9rem}

/* ==========================================================
   القارئ — كتاب بلا تمرير عمودي
   ========================================================== */

/* الصفحة كلها: شريط علوي + مسرح + شريط سفلي */
body.reading{height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
body.reading .top{flex:0 0 auto}
body.reading .flip,body.reading .sword,body.reading .railbar,body.reading .crumbs{display:none}

main.reader{max-width:none;margin:0;padding:0;flex:1;min-height:0;
  display:flex;flex-direction:column;animation:none}

/* الشريط العلوي يحمل اسم الفصل */
.top.reading .brand{flex:1;min-width:0;gap:.35rem}
.top.reading .btxt{display:none}
.rbrand{font-family:'Amiri',serif;font-size:.92rem;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* المسرح */
.rstage{position:relative;flex:1;min-height:0;overflow:hidden;
  perspective:2200px;perspective-origin:50% 50%;touch-action:pan-y}

/* الصفحة */
.rpage{position:absolute;display:flex;flex-direction:column;overflow:hidden;
  background:var(--paper);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 6px 22px rgba(80,60,20,.12)}
.rbody{flex:1;min-height:0;overflow:hidden;padding:12px 20px}
.rpfoot{flex:0 0 auto;height:26px;display:flex;align-items:center;justify-content:center;
  font-size:.72rem;color:var(--muted);border-top:1px solid var(--line);
  direction:ltr;unicode-bidi:isolate}

/* حاوية القياس (خارج الشاشة) */
.rmeas{position:absolute;left:-99999px;top:0;visibility:hidden;pointer-events:none}
.rmeas .rbody{height:auto!important;padding:0;overflow:hidden}

/* ورقة التقليب */
.rleaf{position:absolute;display:none;transform-style:preserve-3d;
  will-change:transform;z-index:20;pointer-events:none}
.rleaf.on{display:block}
.rface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--paper);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);overflow:hidden}
.rback{transform:rotateY(180deg);
  background:linear-gradient(270deg,var(--paper) 55%,var(--cream) 100%)}
.rleaf::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to left,rgba(0,0,0,.30),rgba(0,0,0,0) 45%);
  opacity:calc(var(--a,0)*.95)}
.rleaf.prev::after{background:linear-gradient(to right,rgba(0,0,0,.30),rgba(0,0,0,0) 45%)}

/* الشريط السفلي */
.rfoot{flex:0 0 auto;display:flex;align-items:center;gap:.6rem;
  padding:.35rem .8rem;min-height:56px;border-top:1px solid var(--line);background:var(--paper)}
.rnav{min-height:48px;min-width:66px;padding:.35rem .9rem;border:1px solid var(--line);
  border-radius:12px;background:transparent;color:var(--ink);font-family:'Cairo';
  font-size:.9rem;font-weight:600;cursor:pointer;transition:.2s}
.rnav:hover:not(:disabled){border-color:var(--gold);background:rgba(184,148,47,.07)}
.rnav:disabled{opacity:.3;cursor:default}
.rprog{flex:1;height:9px;min-width:60px;border:0;padding:0;border-radius:9px;
  background:var(--line);overflow:hidden;cursor:pointer;display:block}
.rprog i{display:block;height:100%;width:0;
  background:linear-gradient(90deg,var(--gold),#E3C56A);transition:width .25s}

/* لوحة الفهرس والذهاب إلى صفحة */
.rpanel{position:fixed;top:0;right:0;bottom:0;width:min(86vw,360px);z-index:120;
  background:var(--paper);border-left:1px solid var(--line);display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .28s ease;
  box-shadow:-6px 0 24px rgba(0,0,0,.14)}
.rpanel.on{transform:translateX(0)}
.rphead{display:flex;align-items:center;justify-content:space-between;
  padding:.65rem .9rem;border-bottom:2px solid var(--gold);
  font-family:'Amiri';font-size:1.05rem;color:var(--c)}
.rpjump{display:flex;gap:.5rem;padding:.7rem .9rem;border-bottom:1px solid var(--line)}
.rpjump input{flex:1;min-width:0;min-height:46px;border:1px solid var(--line);border-radius:10px;
  background:var(--cream);color:var(--ink);font-family:'Cairo';font-size:1rem;padding:0 .7rem}
.rpgo{min-height:46px;padding:0 1rem;border:0;border-radius:10px;background:var(--gold);
  color:#fff;font-family:'Cairo';font-weight:700;cursor:pointer}
.rpfont{display:flex;align-items:center;gap:.45rem;padding:.55rem .9rem;
  border-bottom:1px solid var(--line);font-size:.85rem;color:var(--muted)}
.rpfont span{margin-left:auto}
.rpfont button{min-width:44px;min-height:42px;border:1px solid var(--line);border-radius:9px;
  background:transparent;color:var(--ink);font-family:'Cairo';font-size:.92rem;cursor:pointer}

003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🌍\u003c/div\u003e\n      \u003ch2\u003eالقسم الأول: الأرض والناس\u003c/h2\u003e\n      \u003cp\u003eلا يمكن فهم تاريخ العرب قبل الإسلام دون فهم أرضهم: مساحة واسعة، ماء قليل، طرق طويلة، وقبائل لا تجمعها دولة. هذه الفصول الثلاثة ترسم الأرض والدم والمال، وهي الأصول التي قامت عليها الجزيرة قبل أن يقوم عليها الإسلام.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#land-and-routes\"\u003eأرض الجزيرة ومناخها وطرقها\u003c/a\u003e\u003ca href=\"#tribe-and-blood\"\u003eالقبيلة والنسب والدم\u003c/a\u003e\u003ca href=\"#trade-and-livelihood\"\u003eالاقتصاد: التجارة والرعي والزرع\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"land-and-routes","n":"أرض الجزيرة ومناخها وطرقها","ic":"🗺️","part":"القسم الأول: الأرض والناس","h":"\u003carticle class=\"ch3\" id=\"land-and-routes\" data-toc=\"أرض الجزيرة ومناخها وطرقها\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e١.١\u003c/span\u003e\n          \u003ch3\u003e🗺️ أرض الجزيرة ومناخها وطرقها\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eق\u003c/span\u003eبل أن يُولد في مكة نبيّ، كانت الجزيرة العربية أرضًا يعرفها تجار الشام واليمن أكثر مما يعرفها ملوك الأرض. أرض واسعة، قليلة الماء، كثيرة الطرق، لا تحكمها دولة واحدة، ويحكمها في الحقيقة شيئان: الماء والقبيلة.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eتقع جزيرة العرب في الجنوب الغربي من قارة آسيا، ويحدّها البحر الأحمر من الغرب، والبحر العربي والمحيط الهندي من الجنوب والجنوب الشرقي، والخليج العربي من الشرق، وتتصل بالشام والعراق من الشمال. وتبلغ مساحتها نحو ثلاثة ملايين كيلومتر مربع، وهي في أكثرها هضبة قديمة انكسرت أطرافها فقامت على حدودها جبال وسهول ساحلية. ولم تكن هذه الأرض معزولة كما يظن من ينظر إلى الخريطة وحدها، لأن بحرها من الغرب وطريقها من الشمال جعلاها في قلب التجارة القديمة بين الهند واليمن والشام ومصر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوتنقسم الجزيرة عند أهلها إلى أقاليم يعرفها العربي بلسانه قبل أن يعرفها الجغرافي بخريطته. فالحجاز هو الشريط الجبلي الغربي الذي يفصل تهامة عن نجد، وفيه مكة والمدينة والطائف. وتهامة هي السهل الساحلي الغربي، حارٌّ رطب، قليل الماء، تقوم فيه مدن الساحل وموانئه. ونجد هي الهضبة الوسطى، أوسع الأقاليم وأقلها ماءً، وفيها قبائل كثيرة لا تعرف حياة المدن إلا في نقاط قليلة. واليمن في الجنوب، أخصب البلاد وأكثرها مطرًا وعمرانًا، وعمان والبحرين واليمامة في الشرق، ولكل منها تجارتها ونخيلها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوفي قلب هذه الأرض تقع صحارٍ لا يعبرها إلا من يعرفها: الربع الخالي في الجنوب، والنفود في الشمال، والدهناء بينهما. وقد عملت هذه الرمال عمل السور والحاجز، فمنعت الجيوش الكبيرة من عبور الجزيرة، وحمت أهلها من الغزو المنظّم قرونًا. لكنها في الوقت نفسه لم تكن فارغة تمامًا، فقد كان فيها آبارٌ معروفة وطرقٌ يعرفها الدليل بالنجوم وبآثار الأرض، وكانت القوافل تعبرها في مواسم محدودة بماء محسوب ورجال مأجورين.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالماء هو مفتاح هذه الأرض. فالمطر قليل، وإذا جاء جاء سيلًا يجرف الأودية ثم يذهب، فبُنيت الحياة على ما يُحفظ لا على ما ينزل. وحُفرت الآبار، وعُمرت العيون في الواحات، وأقيمت السدود في اليمن وغيرها، وكان السدّ الواحد يعني قيام قرية بأكملها وسقوطه يعني هجرتها. ولهذا كان في الأمثال العربية أن الأرض تُعرف بموضع مائها لا بموضع قومها، وكانت القبيلة تُقاتل على بئر كما تُقاتل على شرف.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت طرق التجارة هي التي ربطت هذه الأرض بالعالم. فأشهرها طريق البخور الذي يصعد من اليمن على طول الحجاز إلى الشام وغزة، وتحمل عليه القوافل اللبان والمرّ والتوابل والنسيج. وكان وراءه طريق ثانٍ من اليمن إلى العراق عبر اليمامة، وطريق ثالث يسير على الساحل الشرقي نحو الخليج وفارس. وكل طريق من هذه كان يعني مدنًا تعيش على التجارة، وقبائل تعيش على أجر الحماية، وأسواقًا تُقام في مواسم معلومة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقامت في الجزيرة مدنٌ قليلة لكنها ثقيلة الوزن. فمكة كانت مدينة الحرم والتجارة، والمدينة كانت واحة زراعية في وسط طرق الشام، والطائف كانت بستان الحجاز وعنبها، وخيبر كانت أرض النخيل والحصون، وهجر في الشرق كانت سوق البحرين. ولم تكن هذه المدن مدنًا بالمعنى الذي يعرفه أهل الشام ومصر، فلم يكن فيها أسوار دائمة ولا جيوش نظامية، وكانت أقرب إلى محطات كبيرة على طرق طويلة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوإذا نظرت إلى تاريخ الجزيرة بعد ذلك، وجدت أن جغرافيا هذه الأرض هي التي رسمت خطوطه. فالمدن التي قامت إنما قامت على ماء أو طريق، والقبائل التي قاتلت إنما قاتلت على مرعى أو بئر، والدولة التي وُلدت في مكة لم تكن دولة أرض زراعية بل دولة طريق وحرم. ولهذا لم يكن عجبًا أن يخرج من هذه الأرض دينٌ يجمع الناس على كلمة واحدة، ثم يخرج منها فتحٌ يغيّر خريطة العالم في أقل من قرن.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eحدود الجزيرة وأقاليمها\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يكن العربي القديم يعرف كلمة جزيرة العرب بالمعنى الذي نعرفه اليوم، بل كان يعرف الأقاليم بأسمائها وأهلها. فالحجاز عنده ليس خطًّا على خريطة بل جبالٌ ومدنٌ وقبائل، وتهامة ليست سهلًا فقط بل حرارة ورطوبة وبحر، ونجد ليست هضبة فقط بل مراعٍ ومواردُ ماء متنقلة. وهذا الفهم المحلي هو الذي حكم حركة الناس في هذه الأرض أكثر من أي رسم إداري.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ظلّت هذه الأقاليم مختلفة في اقتصادها اختلافًا كبيرًا. فاليمن بلاد زراعة وسدود ومدن قديمة، ونجد بلاد رعي وإبل وترحال، والحجاز بلاد تجارة وحرم. ولهذا لم تكن الجزيرة وحدة اقتصادية واحدة، بل سوقًا متصلة بطرق: ما يخرج من اليمن يمرّ بالحجاز، وما يخرج من نجد يُباع في أسواق الأطراف، وما يخرج من عمان يسلك البحر إلى الهند.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالماء: الحياة والطريق\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الآبار تُحفر بأيدي القبائل وتُورَّث كما تُورَّث الأرض، وكانت البئر الواحدة تعني حقًّا لا يُتنازل عنه. ومن أشهر ما جرى في هذا الباب حفر عبد المطلب جد النبي لبئر زمزم بعد أن انطمرت، وما أثار ذلك من نزاع بين قريش على نسبتها إلى قبيلة بعينها. فالماء في هذه الأرض ليس موردًا اقتصاديًا فقط، بل هو أساس المكانة الاجتماعية أيضًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت السيول تُستقبل بسدود صغيرة تُحوّل الماء إلى المزارع، وكان أهل اليمن أعرف الناس بهذا. فسدّ مأرب ظلّ يقوم ببلاد سبأ قرونًا، وحين انهار تغيّر عمران المنطقة وتفرّق أهلها في البلاد. وقد ضرب الله به مثلًا في القرآن في سيل العرم، فصار انهيار السدّ رمزًا لانقلاب النعمة عند العرب قبل الإسلام.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eطرق التجارة الثلاثة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الطريق الأول طريق البخور، وهو أقدمها وأكثرها ربحًا. يبدأ من موانئ اليمن وحضرموت، ويصعد في الحجاز مارًّا بمكة ويثرب، ثم ينتهي إلى الشام وغزة وموانئ البحر المتوسط. وقد ازدهرت على هذا الطريق مدنٌ مثل مكة التي جمعت بين الحرم والتجارة، فصارت محطةً دينية وتجارية في وقت واحد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما الطريق الثاني فكان طريق العراق، ينزل من اليمن واليمامة نحو الحيرة والأبلة، ويخدم تجارة الفرس والعرب على حدّ سواء. والثالث طريق الساحل الشرقي، يسير من عمان والبحرين إلى الخليج، ويصل بالسفن إلى فارس والهند. وبهذه الطرق الثلاثة كانت الجزيرة حلقة وصل لا طرفًا معزولًا، وهذا ما جعلها مطمعًا للأمبراطوريتين في الشمال.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالأرض والإنسان\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم تكن هذه الأرض قادرة على حمل دولة مركزية كبيرة، لأنها لا تملك ما تحتاجه الدولة من أرض زراعية تُجبى وتُحصَّن. فالقبيلة هي الوحدة السياسية الطبيعية، والتحالف هو أقصى ما تبلغه الوحدة، والمدينة هي الاستثناء الذي يقوم على تجارة أو حرم. ولهذا كان من الطبيعي أن يكون أول ما بناه الإسلام في المدينة مسجدًا وسوقًا ووثيقةً بين قبائل، لا قصرًا ولا جيشًا دائمًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eغير أن هذه الأرض نفسها كانت قادرة على أن تُنتج رجالًا يصلحون لقيادة العالم، لأنها ربّت فيهم خصالًا لا تُربّى في المدن الكبيرة: الصبر على الشدة، ومعرفة الطريق، والاعتماد على النفس، والوفاء للجماعة. وهذه الخصال هي التي جعلت الجيوش العربية في القرن الأول تتقدم في أرض لا يعرفها أحد غيرها، وتُدير ما فتحته بسرعة لا تُفسّر بالسلاح وحده.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمساحة\u003c/b\u003e\u003cspan\u003eنحو ثلاثة ملايين كيلومتر مربع\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالأقاليم\u003c/b\u003e\u003cspan\u003eالحجاز وتهامة ونجد واليمن وعمان والبحرين واليمامة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالصحارى\u003c/b\u003e\u003cspan\u003eالربع الخالي والنفود والدهناء\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالطرق\u003c/b\u003e\u003cspan\u003eطريق البخور وطريق العراق وطريق الساحل الشرقي\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمدن\u003c/b\u003e\u003cspan\u003eمكة والمدينة والطائف وخيبر وهجر\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالإقليم\u003c/th\u003e\u003cth\u003eطبيعته\u003c/th\u003e\u003cth\u003eاقتصاده الغالب\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالحجاز\u003c/td\u003e\u003ctd\u003eجبال وسهول بين تهامة ونجد\u003c/td\u003e\u003ctd\u003eالتجارة والحرم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eتهامة\u003c/td\u003e\u003ctd\u003eسهل ساحلي حار قليل الماء\u003c/td\u003e\u003ctd\u003eالموانئ وصيد البحر\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eنجد\u003c/td\u003e\u003ctd\u003eهضبة واسعة قليلة المطر\u003c/td\u003e\u003ctd\u003eالرعي والإبل والترحال\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eاليمن\u003c/td\u003e\u003ctd\u003eأخصب البلاد وأكثرها مطرًا\u003c/td\u003e\u003ctd\u003eالزراعة والسدود والمدن\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eاليمامة والبحرين\u003c/td\u003e\u003ctd\u003eواحات ونخيل على الخليج\u003c/td\u003e\u003ctd\u003eالنخيل والتجارة البحرية\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eأَوَلَمْ نُمَكِّن لَّهُمْ حَرَمًا آمِنًا تُجْبَىٰ إِلَيْهِ ثَمَرَاتُ كُلِّ شَيْءٍ رِّزْقًا مِّن لَّدُنَّا\u003c/p\u003e\u003ccite\u003eسورة القصص، الآية ٥٧\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eأرض واسعة قليلة الماء، لا تحكمها دولة بل تحكمها القبيلة والطريق. ومن هذه الجغرافيا القاسية خرج اقتصاد القوافل، وخرج الحرم الآمن، وخرج الناس الذين حملوا الرسالة بعد ذلك إلى العالم.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"tribe-and-blood","n":"القبيلة والنسب والدم","ic":"🪢","part":"القسم الأول: الأرض والناس","h":"\u003carticle class=\"ch3\" id=\"tribe-and-blood\" data-toc=\"القبيلة والنسب والدم\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e١.٢\u003c/span\u003e\n          \u003ch3\u003e🪢 القبيلة والنسب والدم\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي الجزيرة العربية لم تكن القبيلة تنظيمة اجتماعية فقط، بل كانت الدولة والجيش والمحكمة والتأمين الاجتماعي. ومن لم تكن له قبيلة لم تكن له حماية، ومن خرج عنها خرج من الحياة العامة.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكانت القبيلة عند العرب الأداة التي يقوم بها كل شيء. فهي التي تحمي الفرد وتنتقم له وتدفع ديته وتقسم ميراثه وتزوجه وتُحالفه. وليس في هذا مبالغة، فالأرض لا تحمل دولة، والطرق لا تحمل شرطة، فلم يكن أمام الإنسان إلا أن يعتمد على جماعته في كل شأن من شؤون حياته. ولهذا كان الانتساب إلى القبيلة أهم من المال، وأهم من المهنة، وأهم أحيانًا من الدين نفسه في الحساب الاجتماعي.\u003c/p\u003e\u003cp class=\"ap\"\u003eويقوم النسب على سلسلة من الآباء تُحفظ بالرواية لا بالكتابة، ويُعرف بها الرجل فيُقال فلان بن فلان بن فلان حتى يبلغ القبيلة ثم البطن ثم الفخذ ثم العشيرة. ولهذه السلسلة وظيفة عملية دقيقة: بها يُعرف من يُقاتل مع من، ومن يدفع دية من، ومن يحق له أن ينزل في ماء قبيلة بعينها. ولهذا كان حفظ النسب صناعةً لها رجالها، وكان النسّابون في الجزيرة أشبه بسجلات الأحوال المدنية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت العصبية هي الروح التي تُحرّك هذا البناء. فالقبيلة تنصر أبناءها على الحق وعلى الباطل، وتقول في أمثالها: انصر أخاك ظالمًا أو مظلومًا. وقد أنكر الإسلام هذا المعنى في جملته وسمّاه عصبية جاهلية، وأبقى من العصبية ما هو حق: أن تُنصر المظلوم، وأن تُعطى الدية، وأن يُحفظ الدم من أن يُهدر. وهذا التمييز بين العصبية الجاهلية والعصبية الحقّة من أدقّ ما فعله النبي في بناء المجتمع الجديد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت الحروب بين القبائل تقوم على أسباب صغيرة وتستمر سنين. فقتل رجل من قبيلة رجلًا من أخرى يفتح سلسلة من الثأر لا تنتهي إلا بدية أو بصلح، وقد استمرت بعض حروب العرب أربعين سنة. ومن أشهرها حرب البسوس بين بكر وتغلب، وحرب داحس والغبراء بين عبس وذبيان، وكلتاهما قامت على حادث تافه وانتهت بآلاف القتلى. ولهذا كان من أعظم ما جاء به الإسلام أنه حوّل هذه الطاقة من الثأر إلى الجهاد الجامع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت القبيلة تتعامل مع القبائل الأخرى بثلاثة أشكال: الحلف، والجوار، والصلح. فالحلف عقدٌ دائم يُدمج قبيلتين في حساب واحد، والجوار عقدٌ مؤقت يُجير فيه القوي الضعيف، والصلح اتفاق على وقف القتال مدةً معلومة. وقد عرفت مكة هذه الأشكال كلها، وكانت قريش نفسها حلفًا من بطون اجتمعت على الحرم والتجارة، ثم صارت تُحالف من حولها من القبائل على حماية القوافل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا النظام من العدل ما لا يُنكر، ومن الظلم ما لا يُحتمل. فالقبيلة تحمي أبناءها جميعًا ولو كانوا ظالمين، وتترك الغريب ولو كان مظلومًا، وتُقدّم الشريف على الوضيع في الدية والمكانة. وقد جاء الإسلام فبنى على أنقاض هذا كله مجتمعًا يقوم على الإيمان والأخوّة والعدل، ولم يهدم القبيلة نفسها بل أعاد توجيهها: أبقى النسب وجعل التقوى هي الميزان.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان لهذا التحويل أثر عملي كبير في سرعة الفتوح. فالجيش الذي خرج من الجزيرة كان قبائلَ مختلفة الأنساب والأمزجة، وقد جمعها الإسلام في جيش واحد له ديوان واحد وقائد واحد. ولو بقيت العصبية على حالها لما استطاع هذا الجيش أن يقف في صف واحد، ولما استطاع أن يحكم البلاد التي فتحها، لأن الحكم يحتاج إلى عدل لا إلى نصرة. وقد ظهر ذلك في الفتنة الكبرى بعد مقتل عثمان، حين صارت القبيلة تُحرّك الموقف أكثر مما يُحرّكه الحق.\u003c/p\u003e\u003cp class=\"ap\"\u003eولم تمت العصبية بموت الجاهلية، بل عادت في صور جديدة بعد الفتوح، وظهرت في الخلافات السياسية وفي المفاضلة بين العرب والموالي. وهذا يدل على أن ما بناه الإسلام في المدينة كان قويًا لكنه لم يكن سحرًا، وأنه احتاج إلى من يحفظه بعد ذلك، وأن أخطر ما يُهدد أي مجتمع هو أن تعود العصبية بلباس الدين. وقد نبّه النبي إلى هذا الخطر قبل وقوعه، فحذّر من دعوى القومية يوم قال بعضهم: يا للمهاجرين، ويا للأنصار.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالنسب: سجلّ الأحوال القديم\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان النسّاب يعرف من أي بطون العرب رجلٌ ما، ويستطيع أن يصل نسبه إلى عدنان أو قحطان، وكان الناس يحتاجون هذا في كل شيء: في الزواج، وفي الدية، وفي الحلف، وفي القضاء. ولهذا كان في كل قبيلة رجالٌ يحفظون أنساب الناس وأخبارهم، وكانت معرفتهم هذه سلطةً اجتماعية حقيقية لا يُستغنى عنها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد حفظ لنا الإسلام هذا التراث لكنه أعاد ترتيبه. فالنسب بقي معروفًا، بل صار علمًا يُدرّس في كتب الأنساب، لكن قيمته تغيّرت: لم يعد أساسًا للمكانة عند الله، ولا سببًا لتقديم أحد في الحق. وقد قال النبي في خطبة الوداع ما يُلخّص هذا كله: إن أباكم واحد، كلكم لآدم وآدم من تراب.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالثأر والدية\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الثأر هو القانون الذي يحكم العلاقات بين القبائل، وكانت الدية هي البديل الذي يُوقف سلسلة القتل. فإذا قُتل رجل من قبيلة دفعت القاتلة ديته إلى أهله، وكانت الدية تُقدّر بالإبل، وتختلف باختلاف المكانة: دية الشريف أكثر من دية الوضيع، ودية الرجل أكثر من دية المرأة. وقد جاء الإسلام فألغى هذا التفاوت وجعل الدماء سواء.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت الدية نظامًا عقلانيًا في مجتمع لا سلطة فيه، لأنه يُعوّض الأسرة ويُنهي النزاع. غير أن عيبه أنه كان يعمل لصالح القوي، لأن القبيلة القوية تستطيع أن ترفض الدية وتختار الحرب، والقبيلة الضعيفة تُقبل ما تُعطاه. ولهذا كان أول ما فعله النبي في المدينة أنه جعل الدماء بين المسلمين سواء، وأدخل القصاص والدية في نظام واحد.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالحلف والجوار\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الحلف عقدًا يُعقد بين قبيلتين فيصيران كقبيلة واحدة في النصرة والدية، وقد عقدت قريش أحلافًا كثيرة مع من حولها. وأما الجوار فهو أن يُجير رجلٌ من قبيلة قوية رجلًا من قبيلة ضعيفة، فيصير الأخير في حماية الأول مدةً معلومة. وقد استعمل النبي هذا العرف نفسه حين أجارته قريش في أول الدعوة، ثم استعمله المسلمون في المدينة مع من جاورهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان لهذين العرفين أثر كبير في انتشار الإسلام، لأن الداخل في الإسلام كان يدخل في حلف مع جماعة المؤمنين. ولهذا كان من أهم ما فعله النبي أنه جعل الإيمان نفسه عقدًا يُغني عن عقد الحلف، فقال: المؤمنون كالبنيان يشد بعضه بعضًا، وصار المسلم أخًا للمسلم لا بحلف ولا بنسب بل بالدين.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eما بقي من القبيلة\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يهدم الإسلام القبيلة، بل جعلها وعاءً للتنظيم لا أساسًا للتفاضل. وقد بقي للنسب أثره في التعارف والتكافل، وبقي للقبيلة دورها في الجند والديوان في العصور اللاحقة، حتى صارت في بعض الدول العربية وحدةً إدارية وسياسية. وهذا يدل على أن النبي تعامل مع الواقع تعامل المصلح لا تعامل الهادم.\u003c/p\u003e\u003cp class=\"ap\"\u003eغير أن هذا البقاء نفسه كان مصدر مشكلات طويلة في تاريخ المسلمين، لأن العصبية عادت في مواضع كثيرة بلباس الدين أو بلباس السياسة. وقد حذّر النبي من ذلك تحذيرًا صريحًا حين قال: دعوها فإنها منتنة، حين قال بعض الناس يومًا: يا للمهاجرين، ويا للأنصار. فكان في هذا التحذير تشخيصٌ لداء سيعود كلما ضعف الإيمان وضعف العدل.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالوحدة\u003c/b\u003e\u003cspan\u003eالقبيلة ثم البطن ثم الفخذ ثم العشيرة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالوظائف\u003c/b\u003e\u003cspan\u003eالحماية والدية والقضاء والتزويج والحلف\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأشهر الحروب\u003c/b\u003e\u003cspan\u003eالبسوس وداحس والغبراء\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأدوات العلاقة\u003c/b\u003e\u003cspan\u003eالحلف والجوار والصلح\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eموقف الإسلام\u003c/b\u003e\u003cspan\u003eأبقى النسب وألغى التفاضل به\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمؤسسة\u003c/th\u003e\u003cth\u003eوظيفتها قبل الإسلام\u003c/th\u003e\u003cth\u003eما صار إليه\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالقبيلة\u003c/td\u003e\u003ctd\u003eالدولة والجيش والمحكمة\u003c/td\u003e\u003ctd\u003eوعاء تنظيم لا أساس تفاضل\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالنسب\u003c/td\u003e\u003ctd\u003eمصدر مكانة وحقوق\u003c/td\u003e\u003ctd\u003eمعرفة وتعارف لا ميزان\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالثأر\u003c/td\u003e\u003ctd\u003eقانون العلاقات بين القبائل\u003c/td\u003e\u003ctd\u003eقصاص ودية في نظام واحد\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالحلف\u003c/td\u003e\u003ctd\u003eدمج قبيلتين في نصرة واحدة\u003c/td\u003e\u003ctd\u003eأخوّة الإيمان تُغني عنه\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالولاء\u003c/td\u003e\u003ctd\u003eللجماعة على الحق والباطل\u003c/td\u003e\u003ctd\u003eللحق ولو على النفس\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eيَا أَيُّهَا النَّاسُ إِنَّا خَلَقْنَاكُم مِّن ذَكَرٍ وَأُنثَىٰ وَجَعَلْنَاكُمْ شُعُوبًا وَقَبَائِلَ لِتَعَارَفُوا إِنَّ أَكْرَمَكُمْ عِندَ اللَّهِ أَتْقَاكُمْ\u003c/p\u003e\u003ccite\u003eسورة الحجرات، الآية ١٣\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eكانت القبيلة دولةً بلا مؤسسات، تحمي وتقتل وتقضي وتُعوّض. وقد أبقاها الإسلام وعاءً وألغاها ميزانًا، فصار النسب للتعارف والتقوى للتفاضل، وهذا التحويل هو أول ما لزم لبناء أمة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"trade-and-livelihood","n":"الاقتصاد: التجارة والرعي والزرع","ic":"🐪","part":"القسم الأول: الأرض والناس","h":"\u003carticle class=\"ch3\" id=\"trade-and-livelihood\" data-toc=\"الاقتصاد: التجارة والرعي والزرع\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e١.٣\u003c/span\u003e\n          \u003ch3\u003e🐪 الاقتصاد: التجارة والرعي والزرع\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eع\u003c/span\u003eاشت الجزيرة على ثلاثة أعمدة: إبلٌ تُربّى، ونخلٌ يُسقى، وقافلةٌ تعبر. ولم يكن أي منها غنيًّا، لكن اجتماعها في يد قريش جعل مكة سوقًا لا تُغلق.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان الرعي هو أوسع أنشطة الجزيرة وأقدمها. فالإبل هي سفينة الصحراء، بها يُقطع الطريق ويُحمل المتاع ويُشرب اللبن ويُؤكل اللحم ويُلبس الوبر، وبها تُقاس الثروة وتُدفع الدية. وكانت القبائل تنتقل بالمرعى في مواسم معلومة، وتنزل على الماء في مواعيد لا تتأخر، وكانت معرفة هذه المواعيد فنًّا يُورَّث. ومن لم يعرف مرعى قومه وموارد مائه لم يستطع أن يعيش.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت الزراعة محدودة لكنها ثقيلة الأثر حيث قامت. فالنخيل في يثرب وخيبر واليمامة والطائف، والحبوب في اليمن والطائف، والعنب في الطائف خاصة. وكان النخل هو الأصل في هذه الواحات لأنه يتحمل العطش ويُعطي غذاءً يُخزَّن، فصار النخل عند العرب شجرةً مباركة تُقاس بها الأموال وتُسمّى بها الأماكن. وقد ذكر القرآن النخل في مواضع كثيرة لأنه كان معروفًا لكل سامع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما التجارة فكانت أعظم أبواب الثروة وأقلها استقرارًا. فالقافلة تحتاج رأس مال ورجالًا ودليلًا وأجر حماية وسوقًا تُبيع فيها، وكل ذلك يحتاج إلى تنظيم لا تملكه قبيلة منفردة. وقد نجحت قريش في هذا التنظيم نجاحًا جعل مكة مركزًا تجاريًا للجزيرة كلها، وأخذت تُسيّر قافلتين في السنة: واحدة إلى الشام في الصيف وأخرى إلى اليمن في الشتاء، وفي ذلك نزل قوله تعالى: لإيلاف قريش.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت الأسواق الموسمية هي البورصة التي يلتقي فيها التجار والشعراء والخطباء. فسوق عكاظ ومجنة وذو المجاز كانت تُقام في أشهر معلومة، وكانت محرّمة القتال فيها، فصارت مكانًا آمنًا للبيع والشراء والمنافرة والمفاخرة. وفي هذه الأسواق كانت تُعرض البضائع وتُعقد الأحلاف وتُسمع القصائد، وكانت القبائل تلتقي فيها مرة في السنة فتعرف أخبار بعضها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في الاقتصاد الجاهلي من الظلم ما يفسّر بعض ما جاء الإسلام ليُصلحه. فالربا كان فاشيًا، وكان الرجل يُقرض أخاه بالضعف فيأكل ماله، وكان المضطر يُضطر إلى بيع عرضه أو رهان حريته. وكانت المعاملات قائمة على الغرر والجهالة، فتبيع القبيلة ما في بطن ناقتها، ويُقام الميسر على الجزور فيأخذ الأغنياء اللحم ويُغرم الفقراء الثمن. وقد جاء الإسلام فحرّم الربا والميسر والغرر، وأمر بالعدل في المكيال والميزان.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت مكة في هذا الاقتصاد حالة خاصة. فهي مدينة بلا زرع ولا ماء كثير، لكنها مدينة الحرم، والحرم يجعل الطريق آمنًا ويجعل الناس يقصدونها. فاجتمعت لها حرمة البيت وأمن الطريق وحذق التجارة، فصارت مركزًا ماليًا للجزيرة قبل أن تكون مركزًا دينيًا. وقد وصف القرآن هذا الوضع وصفًا دقيقًا حين قال: أو لم نمكن لهم حرمًا آمنًا تُجبى إليه ثمرات كل شيء.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان لهذا الاقتصاد أثر مباشر في الدعوة. فالنبي نفسه عمل في التجارة قبل النبوة، وعرف أسواق الشام وأخلاق التجار، وكان أول ما ضبطه في المدينة بعد الهجرة هو السوق: جعلها صدقةً لا خراجًا عليها، ومنع فيها الحلف والبيع على بيع أخيه. وقد جاء في القرآن تحذير شديد من أكل الأموال بالباطل ومن التطفيف، وهذا يدل على أن الإصلاح الاقتصادي كان في قلب الرسالة لا على هامشها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوإذا نظرت إلى ما بعد الفتوح، وجدت أن هذه الخبرة التجارية هي التي جعلت العرب قادرين على إدارة بلاد واسعة. فمن يعرف الطريق يعرف كيف يحكمه، ومن يعرف السوق يعرف كيف يجبي الخراج، ومن اعتاد أن يحسب المؤونة يعرف كيف يُدير جيشًا في أرض بعيدة. ولهذا لم يكن غريبًا أن تكون أولى الدواوين في الدولة الإسلامية دواوين خراج وجند، وأن يكون أول من نظّم البريد والعطاء رجالًا من أهل الحساب والتجارة.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالإبل والمرعى\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الإبل أثمن ما يملكه العربي، وبها تُدفع الدية وتُقدَّر الثروة وتُعقد المهور. وكانت القبيلة تنتقل في دائرتها المعتادة بين مراعٍ تعرفها، ولا تخرج عنها إلا في حرب أو في جدب. وهذه الحركة الدائرية هي التي جعلت الجزيرة تُعرف كأنها خريطة متحركة، لكل قبيلة فيها موضعها ووقتها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت هذه الحياة تُنتج خصالًا لا تُنتجها المدن: الصبر على العطش، ومعرفة النجوم، والاعتماد على النفس، والكرم الذي هو في أصله تأمين على المستقبل. فمن يُطعم اليوم يُطعم غدًا، ومن يُضيّف الغريب يُضاف في بلاد غريبة. وقد أبقى الإسلام هذه الخصال وجعلها من الإيمان حين قال النبي: من كان يؤمن بالله واليوم الآخر فليكرم ضيفه.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالنخل والواحة\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم تكن الواحة مدينة بالمعنى السياسي، بل كانت مجموعة منازل حول عين ماء وبستان نخل. وأهلها لا يستطيعون أن ينتقلوا، لأن أموالهم في الأرض لا في الإبل، ولهذا كانوا أكثر استقرارًا وأشد حاجة إلى الأمن. ومن هنا صار أهل الواحات أكثر ميلًا إلى العهود والوثائق، وأقل ميلًا إلى الحروب المفتوحة من أهل البادية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان لهذا الفرق أثر في تاريخ المدينة قبل الإسلام، فقد كانت يثرب واحةً يسكنها الأوس والخزرج واليهود، وكان بينهم من الحروب ما يُشبه حروب القبائل. وحين جاء النبي إلى المدينة وجد قومًا يعرفون الزراعة والتجارة والحصن، فبنى معهم دولةً لها وثيقة وعقد، وهذا النوع من الحكم لا يقوم إلا في مجتمع مستقر.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالقافلة والحرم\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت القافلة مشروعًا جماعيًا يحتاج رأس مال ورجالًا وتأمينًا. وكانت قريش تُجمع فيها الأموال من أشرافها فيشترك عدة رجال في قافلة واحدة، ويقسمون الربح بحسب الحصة. وهذا يعني أن مكة عرفت شكلًا من أشكال الشركة قبل الإسلام، وأن نجاحها التجاري كان نتيجة تنظيم لا نتيجة ثروة طبيعية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان للحرم دور حاسم في هذا النجاح، لأنه جعل مكة محرمةً لا يُسفك فيها دم ولا يُظلم فيها أحد. فصار التاجر يأمن على ماله فيها، وصار من حولها يحترمون قوافلها. وحين جاء الإسلام أقرّ حرمة مكة وشدّدها، فصار الأمن الذي بناه الجاهلي على عرفٍ مدعومًا بشرع. ولذلك بقي الحرم في الإسلام محرّمًا على القتال، وبقي من دخله آمنًا على نفسه وماله.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالربا والميسر: ما جاء الإسلام ليُصلحه\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يكن الربا في الجاهلية استثناءً بل قاعدة، وكان الرجل إذا أقرض آخر اشترط أن يردّ أكثر. وإذا لم يجد المدين ردّ المال أُخّرت له المدة وزيد المال، حتى يصير الدين ضعف الأصل. وهذا هو الربا الذي حرّمه القرآن تحريمًا قاطعًا في أواخر ما نزل، وربطه بالظلم صراحةً. ثم جاءت الآيات الأخيرة فشدّدت التحريم وسمّته حربًا على الله ورسوله.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما الميسر فكان قمارًا على الجزور، يُقسم فيه اللحم على السهام، فيأخذ من لم يُشارك بالمال حصة، ويغرم من شارك نصيبًا. وقد حرّمه القرآن مع الخمر والأنصاب، لأن ضرره ليس في المال وحده بل في الأخلاق والعدل. وقد كان في هذا التحريم حمايةٌ للفقراء من أن تُستنزف أموالهم بغير عوض.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالأعمدة\u003c/b\u003e\u003cspan\u003eالرعي والتجارة والزراعة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eقافلة قريش\u003c/b\u003e\u003cspan\u003eرحلة الشتاء إلى اليمن ورحلة الصيف إلى الشام\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالأسواق\u003c/b\u003e\u003cspan\u003eعكاظ ومجنة وذو المجاز\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمحرّمات\u003c/b\u003e\u003cspan\u003eالربا والميسر والغرر والتطفيف\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمكة\u003c/b\u003e\u003cspan\u003eحرم آمن تُجبى إليه ثمرات كل شيء\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالنشاط\u003c/th\u003e\u003cth\u003eأدواته\u003c/th\u003e\u003cth\u003eأثره في المجتمع\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالرعي\u003c/td\u003e\u003ctd\u003eالإبل والغنم والمراعي المعلومة\u003c/td\u003e\u003ctd\u003eالترحال والكرم وقياس الثروة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالزراعة\u003c/td\u003e\u003ctd\u003eالنخل والحبوب والعيون\u003c/td\u003e\u003ctd\u003eالاستقرار والوثائق والعهود\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالتجارة\u003c/td\u003e\u003ctd\u003eالقوافل والأسواق والحلف\u003c/td\u003e\u003ctd\u003eالثروة والتنظيم والاتصال بالعالم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالصناعة\u003c/td\u003e\u003ctd\u003eالنسيج والجلد والحديد\u003c/td\u003e\u003ctd\u003eسدّ حاجة محلية محدودة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمال\u003c/td\u003e\u003ctd\u003eالربا والميسر والرهان\u003c/td\u003e\u003ctd\u003eتركّز الثروة وظلم الضعيف\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eوَيْلٌ لِّلْمُطَفِّفِينَ الَّذِينَ إِذَا اكْتَالُوا عَلَى النَّاسِ يَسْتَوْفُونَ وَإِذَا كَالُوا أَوْ وَزَنُوا يُخْسِرُونَ\u003c/p\u003e\u003ccite\u003eسورة المطففين، الآيات ١ إلى ٣\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eلم تكن الجزيرة غنية، لكنها كانت متصلة: إبلٌ في الداخل، ونخلٌ في الواحات، وقوافل على الطرق. وقد جاء الإسلام فأصلح قواعد هذا الاقتصاد من الربا والميسر والغرر، لأن العدل في المال أصلٌ في الدين لا فرعٌ عنه.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-2","n":"القسم الثاني: الأديان والمعتقدات","ic":"","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-2\" style=\"--c:#8B6914\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🕯️\u003c/div\u003e\n      \u003ch2\u003eالقسم الثاني: الأديان والمعتقدات\u003c/h2\u003e\n      \u003cp\u003eلم تكن الجزيرة أرضًا بلا دين، بل كانت أرضًا تجتمع فيها الوثنية واليهودية والنصرانية وبقايا الحنيفية. وهذه الفصول الثلاثة تعرض ما كان الناس يعبدونه، وكيف كان أهل الكتاب حاضرين في المدن والقرى، وكيف بقي في الجزيرة من يبحث عن دين إبراهيم وحده.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#idols-and-rituals\"\u003eالوثنية وأصنام العرب\u003c/a\u003e\u003ca href=\"#jews-and-christians\"\u003eاليهودية والنصرانية في الجزيرة\u003c/a\u003e\u003ca href=\"#hanifs\"\u003eالحنيفية والأحناف قبل البعثة\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"idols-and-rituals","n":"الوثنية وأصنام العرب","ic":"🗿","part":"القسم الثاني: الأديان والمعتقدات","h":"\u003carticle class=\"ch3\" id=\"idols-and-rituals\" data-toc=\"الوثنية وأصنام العرب\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٢.١\u003c/span\u003e\n          \u003ch3\u003e🗿 الوثنية وأصنام العرب\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eل\u003c/span\u003eم يكن العربي الجاهلي منكرًا لوجود الله، بل كان يقرّ بأنه الخالق الرازق، ثم يعبد الأصنام لتقرّبه إليه. وهذا هو جوهر الوثنية التي جاء الإسلام ليهدمها من أساسها.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان أكثر العرب يقرّون بوجود إله واحد أعلى، يسمّونه الله، ويعتقدون أنه خالق السماوات والأرض ومدبّر الأمر. وقد حكى القرآن هذا الإقرار عنهم في مواضع كثيرة، ومنها قوله: ولئن سألتهم من خلق السماوات والأرض ليقولن الله. لكنهم لم يقفوا عند هذا الإقرار، بل جعلوا بينهم وبين الله وسطاء من الأصنام، وقالوا: ما نعبدهم إلا ليقربونا إلى الله زلفى. فكان الشرك عندهم في الوساطة لا في إنكار الخالق.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأشهر ما تُروى في ابتداء عبادة الأصنام قصة عمرو بن لحيّ الخزاعي، وقد ذكره النبي فقال: رأيت عمرو بن لحيّ يجرّ قصبه في النار، لأنه أول من غيّر دين إبراهيم. وتذكر كتب السيرة أنه جلب أصنامًا من الشام إلى الحجاز ونصبها حول الكعبة ودعا الناس إلى عبادتها، فانتشرت في القبائل. وسواء صحّت تفاصيل القصة أو لم تصح، فإنها تصف تحوّلًا حقيقيًا: أن البيت الذي بُني للتوحيد صار فيه ما يُعبد من دون الله.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان أعظم أصنام العرب أربعة: هُبل، وكان أعظمها عند قريش ومنصوبًا في جوف الكعبة على صورة إنسان من عقيق أو من نحاس، واللات، وكانت في الطائف عند ثقيف، والعزّى، وكانت في نخلة قرب مكة عند شجرة تُعظّمها قريش، ومناة، وكانت في قديد على ساحل البحر عند الأوس والخزرج. وقد ذكر القرآن هذه الثلاث في سورة النجم: أفرأيتم اللات والعزى، ومناة الثالثة الأخرى.\u003c/p\u003e\u003cp class=\"ap\"\u003eوإلى جانب هذه الأربعة كانت أصنام القبائل كثيرة: ودّ وسواع ويغوث ويعقوب ونسر، وهي التي ذكرها القرآن على لسان نوح، وقد صارت بعد ذلك إلى قبائل عربية تعبدها. وكان في كل بيت صنم يُصلّي إليه صاحبه إذا دخل وإذا خرج، وكان في الكعبة وفي ساحتها عدد كبير من الأصنام حتى بلغت في بعض الروايات ثلاث مئة وستين، وهو رقم يرمز إلى عدد أيام السنة أكثر مما يدل على إحصاء دقيق.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت الشعائر التي تُقام لهذه الأصنام مزيجًا من عبادات قديمة حُوّلت عن أصلها. فالحج إلى البيت كان قائمًا، والطواف به كان قائمًا، والهدي والذبح كانا قائمين، والتلبية كانت تُقال. لكنها دخلت فيها زيادات الشرك: فكانوا يهلّون بأسماء أصنامهم، ويذبحون لغير الله، ويطوفون عراة في بعض الروايات، ويقفون في مواقف معلومة كعرفات ومزدلفة ومنى. وقد أبقى الإسلام هذه المواقف وأبطل ما دخلها من شرك، فصار الحج حجًّا لإبراهيم لا حجًّا للأصنام.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في المجتمع الجاهلي فنون أخرى من الكشف عن الغيب: فكانوا يستقسمون بالأزلام، وهي قداح تُرمى عند السفر أو الزواج أو الحرب ليخرج أحدها بالأمر أو النهي. وكانوا يسألون الكهّان والعرّافين، ويصدّقون قولهم في الغيب، ويعتقدون في الجن أنهم يوحون إليهم. وقد واجه القرآن هذه الصناعة كلها بقوله: قل لا يعلم من في السماوات والأرض الغيب إلا الله، وبقوله: وما تنزلت به الشياطين.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان للوثنية أثر اجتماعي ثقيل، وأثقل ما فيها مسألة الأنثى. فكان من العرب من يئد ابنته خشية العار أو الفقر، وكان من يتركها حيّة على هوان. وكانت المرأة تُورَّث ولا تُورِّث في بعض الأحوال، وكانت الجارية تُباع وتُشترى. وقد واجه القرآن هذا كله مواجهة صريحة في سورة التكوير: وإذا الموءودة سُئلت، بأي ذنب قُتلت، وفي سورة النحل في ذمّ من يستبشر بالأنثى ويخفى وجهه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد صمدت الوثنية قرونًا لا لأنها دينٌ مقنع، بل لأنها كانت مصلحةً لطوائف من الناس. فقريش كانت تحرس الأصنام وتخدم الحجيج، فكانت لها مكانة ومكسب من كل من يزور مكة. وكانت الأصنام رمزًا لهوية القبيلة، فمن ترك صنمه خرج من جماعته. ولهذا لم تكن الدعوة إلى التوحيد مسألة عقيدة فقط، بل كانت مسألة سلطة ومال ومكانة، وهذا هو ما جعل الصراع مع قريش طويلًا وشديدًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eولم يكن انهيار الوثنية في مكة انهيارًا لعقيدة فقط، بل كان انهيارًا لبناء كامل من المصالح. وقد رأى النبي ذلك، فلم يبدأ بالهجوم على الأصنام بل بالدعوة إلى الله، حتى إذا فُتحت مكة أُزيلت الأصنام بيده وهو يقول: جاء الحق وزهق الباطل، إن الباطل كان زهوقًا. وهذا الترتيب في العمل هو من فقه الدعوة: أن تُبنى القاعدة أولًا، ثم يُهدم البناء على قاعدة ثابتة.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالإله الأعلى والأصنام الوسيطة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان العربي يقول في تلبيته: لبيك اللهم لبيك، لبيك لا شريك لك، إلا شريكًا هو لك، تملكه وما ملك. وهذا نصٌّ صريح في أنهم كانوا يعرفون التوحيد ثم أدخلوا عليه الشرك على سبيل الشركة لا الإنكار. ولهذا كان القرآن يخاطبهم بما يعرفونه: أأنتم أشد خلقًا أم السماء، ويسألهم: من يرزقكم من السماء والأرض.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت فكرة الشفاعة هي العقد الذي ربط الأصنام بالله في أذهانهم. فالصنم لا يخلق ولا يرزق، لكنه يشفع عند الله، وهو في نظرهم كالوزير عند الملك. وقد أبطل القرآن هذا التصور من أصله: قل لله الشفاعة جميعًا، وأن الشفاعة لا تكون إلا بإذنه ولمن ارتضى، وأن من اتخذ من دونه أولياء فالله هو الولي.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eأصنام مكة والطائف\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان لهُبل مكانة خاصة عند قريش لأنه في جوف الكعبة، وكانوا يستقسمون عنده بالأزلام، ويرجعون إليه في أمورهم الكبرى. وقد بقي ذكره في الشعر بعد الإسلام دليلًا على ثقله في الذاكرة الجاهلية. وأما اللات في الطائف فقد كانت لثقيف، وكانت لها سدنة وبيت يُعظَّم، وقد هدمها المغيرة بن شعبة بأمر النبي بعد فتح الطائف.\u003c/p\u003e\u003cp class=\"ap\"\u003eوالعزّى كانت أعزّ الأصنام عند قريش، ولها شجرة بنخلة، وكانوا يطوفون حولها ويذبحون عندها. وقد بعث النبي خالد بن الوليد بعد فتح مكة فهدمها، وقال في ذلك شعرٌ يُروى. وأما مناة فكانت عند قديد، وكان أهل المدينة من الأوس والخزرج يعظّمونها ويحجّون إليها، وقد هدمها علي بن أبي طالب بأمر النبي.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eشعائر الحج قبل الإسلام\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان العرب يحجّون إلى البيت ويعتمرون، ويقفون بعرفة ويبيتون بمزدلفة، ويذبحون الهدي وينحرون بمنى، ويحلقون رؤوسهم. وهذه الشعائر لم تكن مبتدعة في الإسلام بل أُقرّت على أصلها، لأنها من ملة إبراهيم التي بقي منها أثر في الجزيرة. وقد قال النبي في خطبة الوداع ما يدل على أن الحج قائم على سنة إبراهيم لا على سنة قريش.\u003c/p\u003e\u003cp class=\"ap\"\u003eغير أن الجاهلية أدخلت في هذه الشعائر زيادات كثيرة: فكانوا يطوفون عراة، وكانوا يحرّمون على من طاف بالبيت أن يستظل أو يأكل، وكانوا يقدّمون بعض المواقف ويؤخّرون بعضها على غير أصل. وقد جاء الإسلام فأعاد ترتيبها كما جاءت في القرآن: ثم أفيضوا من حيث أفاض الناس، واستغفروا الله إن الله غفور رحيم.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eلماذا صمدت الوثنية\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم تصمد الوثنية لبرهانها، فقد كان العربي نفسه يرى أن الحجر لا يسمع ولا يضر ولا ينفع، وكان يقول فيه شعرًا ساخرًا أحيانًا. وإنما صمدت لأنها كانت نظامًا اجتماعيًا: لكل قبيلة صنم تعرفه، ولكل بيت صنم يدخله، ولكل موسم شعيرة يجتمع عليها الناس. فمن تركها لم يترك عقيدة فحسب بل ترك جماعته وعرفه ومكانته.\u003c/p\u003e\u003cp class=\"ap\"\u003eولهذا كان الصراع في مكة أشد مما يُتوقع من خلاف في العقيدة. فقد كانت قريش ترى في التوحيد ضربًا من إلغاء مكانتها بين العرب، لأنها سدنة البيت وحماته. وقد قالوا للنبي في ذلك قولًا صريحًا: إن اتباعنا الهدى معك نتخطف من أرضنا. فأجابهم القرآن بأن الله مكّن لهم حرمًا آمنًا، وأن الأمن من عنده لا من الأصنام.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالإقرار بالخالق\u003c/b\u003e\u003cspan\u003eكانوا يقرّون بالله ويجعلون الأصنام وسائط\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالأصنام الأربعة\u003c/b\u003e\u003cspan\u003eهُبل واللات والعزّى ومناة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمواضعها\u003c/b\u003e\u003cspan\u003eالكعبة والطائف ونخلة وقديد\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالشعائر\u003c/b\u003e\u003cspan\u003eحج وطواف وهدي أُقرّت وأُبطل ما دخلها\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأثرها\u003c/b\u003e\u003cspan\u003eهوية قبيلة ومصلحة قريش ومكانة سدنة\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالصنم\u003c/th\u003e\u003cth\u003eموضعه\u003c/th\u003e\u003cth\u003eمن كان يعبده\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eهُبل\u003c/td\u003e\u003ctd\u003eجوف الكعبة\u003c/td\u003e\u003ctd\u003eقريش وأهل مكة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eاللات\u003c/td\u003e\u003ctd\u003eالطائف\u003c/td\u003e\u003ctd\u003eثقيف ومن حولها\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالعزّى\u003c/td\u003e\u003ctd\u003eنخلة قرب مكة\u003c/td\u003e\u003ctd\u003eقريش خاصة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eمناة\u003c/td\u003e\u003ctd\u003eقديد على الساحل\u003c/td\u003e\u003ctd\u003eالأوس والخزرج\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eودّ وسواع ويغوث ونسر\u003c/td\u003e\u003ctd\u003eمواضع متفرقة\u003c/td\u003e\u003ctd\u003eقبائل عربية متعددة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eأَفَرَأَيْتُمُ اللَّاتَ وَالْعُزَّىٰ وَمَنَاةَ الثَّالِثَةَ الْأُخْرَىٰ أَلَكُمُ الذَّكَرُ وَلَهُ الْأُنثَىٰ\u003c/p\u003e\u003ccite\u003eسورة النجم، الآيات ١٩ إلى ٢١\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eكان الشرك عند العرب في الوساطة لا في إنكار الخالق، وكانت الأصنام رمزًا للقبيلة ومصلحةً لقريش. ولهذا لم يكن هدمها مسألة عقيدة فقط، بل كان تغييرًا لنظام كامل من المكانة والمال.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"jews-and-christians","n":"اليهودية والنصرانية في الجزيرة","ic":"✡️","part":"القسم الثاني: الأديان والمعتقدات","h":"\u003carticle class=\"ch3\" id=\"jews-and-christians\" data-toc=\"اليهودية والنصرانية في الجزيرة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٢.٢\u003c/span\u003e\n          \u003ch3\u003e✡️ اليهودية والنصرانية في الجزيرة\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eل\u003c/span\u003eم تكن الجزيرة أرضًا وثنية خالصة، فقد كان فيها يهودٌ في يثرب وخيبر، ونصارى في نجران واليمن والشام، وكان العرب يسمعون منهم أسماء الأنبياء وكتبهم قبل أن يسمعوا من النبي.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان اليهود في الجزيرة أقل عددًا من النصارى وأكثر حضورًا في المدن. وقد استقرّت ثلاث قبائل يهودية في يثرب: بنو قينقاع وبنو النضير وبنو قريظة، وكانوا يعملون في الزراعة والتجارة والصياغة، ويسكنون في حصون ومنازل محصّنة. وقد كانت لهم مكانة اقتصادية أعلى من مكانتهم العددية، لأنهم كانوا يعرفون الكتاب ويقرؤون ويكتبون في أمة لا تعرف القراءة إلا قليلًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان لليهود في خيبر أكثر من ذلك: أرض نخيل وعيون وحصون، وكانت خيبر مركزًا يهوديًا كبيرًا في الشمال. وكان في تيماء وفدك وقرى أخرى جماعات يهودية أصغر. ويُروى أن اليهود هاجروا إلى الحجاز بعد خراب الهيكل واضطهاد الروم لهم في الشام، فاستقروا في واحات الجزيرة حيث الماء والنخيل، واختلطوا بالعرب في اللغة والعادات اختلاطًا جعلهم عربًا في اللسان واللباس.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان اليهود يحتفظون بدينهم ولا يدعون إليه، لأنهم كانوا يرون أنفسهم أمة مختارة لا أمة تبشير. ولهذا لم يدخل في دينهم من العرب إلا قليل، وكانت علاقتهم بالعرب علاقة تجارة وجوار وحلف أكثر منها علاقة دعوة. غير أنهم كانوا يحدّثون من جالسهم عن التوراة وعن أنبياء بني إسرائيل، وكانت هذه الأحاديث تنتشر في المجالس وتُضاف إليها أساطير كثيرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما النصرانية فكانت أوسع انتشارًا وأكثر تأثيرًا في الثقافة. فقد كان في نجران أسقفية معروفة، وأهل نجران نصارى من بني الحارث بن كعب، ولهم كنيسة تُسمّى القليس. وكان في اليمن نصارى بعد أن دخلها الأحباش، وكان في الحيرة نصارى من النساطرة، وفي الشام نصارى من الغساسنة على مذهب الملكانيين، وكانت القبائل العربية على حدود الشام تدين بالنصرانية اسمًا وتقاليد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في النصرانية العربية رهبان وكنائس وأعياد، وكان الشعراء يتغنّون بالرهبان وبالصوامع. وقد ذكر القرآن الرهبان والقسيسين في موضعين، ومدح منهم من لا يستكبرون، وذمّ من غلا في الدين. وكان من أشهر من لقي النبي في صغره راهب يُقال له بَحيرى في بُصرى، وهي رواية أوردها الترمذي وفيها كلام عند أهل الحديث، لكنها تدل على أن بيئة الشام النصرانية كانت معروفة لأهل مكة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان الجدل بين اليهود والنصارى معروفًا في الجزيرة، لأن كليهما كان له كتاب ونبي، وكل واحد منهما كان يزعم أنه على دين إبراهيم. وقد نقل القرآن هذا الجدل في مواضع كثيرة: وقالت اليهود ليست النصارى على شيء، وقالت النصارى ليست اليهود على شيء. وكان هذا الجدل يشغل مجالس أهل الكتاب في المدينة ونجران، ويمدّ العرب بمادة للتفكير في الدين. وكان هذا الجدل ينتقل إلى مجالس العرب في مكة والمدينة، فيسمعون الحجة والرد معًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان لهذا الحضور أثر مباشر في استقبال الدعوة. فأهل يثرب كانوا يسمعون من يهودهم أن نبيًّا يُبعث في هذا الزمان، وكانوا يرجون أن يكون منهم، فلما جاء من قريش آمن به بعضهم وكفر به اليهود. وهذا المعنى ذكره القرآن: ولما جاءهم كتاب من عند الله مصدق لما معهم وكانوا من قبل يستفتحون على الذين كفروا، فلما جاءهم ما عرفوا كفروا به. وهذا المعنى هو الذي جعل أهل يثرب يبادرون إلى الإيمان قبل غيرهم، لأنهم كانوا ينتظرون.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد عامل الإسلام أهل الكتاب معاملةً مخصوصة: أقرّ لهم بدينهم، وأجاز لهم البقاء عليه مقابل الجزية، وحرّم أموالهم ودماءهم، وأباح طعامهم ونساءهم. وهذا الحكم لم يكن موجودًا لأهل الأصنام، ولهذا كان أهل الكتاب في الجزيرة أول من عرف نظامًا للتعايش مع المسلمين، وأول من دخل في عقود الذمة بعد الفتوح. وقد كان هذا الحكم أوسع مما عرفه أهل الجزيرة من قبل، لأن العرب لم يعرفوا تعايشًا مع دين مخالف على هذا النحو.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eيهود يثرب وخيبر\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت القبائل اليهودية في يثرب تعيش في حصون لها، ولها نخل وآبار، ولها حلف مع الأوس والخزرج. وقد كانت هذه الحصون سلاحًا في الحرب وأداة في السلم، لأن من دخلها كان في حماية. ولهذا كان اليهود طرفًا في حروب المدينة قبل الإسلام، وكانوا يُحالفون هذا البطن على ذاك، حتى صار لهم في كل نزاع موقف.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت خيبر أقوى مركز يهودي في الجزيرة، لأنها أرض زراعية غنية بعيونها ونخيلها، ولأنها بعيدة عن مراكز العرب. وقد ظلّت خيبر مستقلة حتى فتحها النبي سنة سبع للهجرة، فصارت أرضًا للمسلمين وأُقرّ أهلها على زراعتها مقابل نصف الخارج. وهذا العقد هو أصل نظام المزارعة في الفقه الإسلامي.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eنصارى نجران والشام\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت نجران مدينة نصرانية في جنوب الجزيرة، ولها أسقف وكنيسة، وقد ورد ذكرها في القرآن في سورة البروج وفي قصة المباهلة. وقد جاء وفدها إلى النبي في المدينة وجرت بينهم مباحثة طويلة، وانتهت إلى عقد صُلح كتبه النبي لهم، وفيه أمانٌ لأنفسهم وأموالهم وكنائسهم مقابل الجزية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما نصارى الشام فكانوا على صلة بالروم، وكانت القبائل العربية هناك مثل غسان تدين لهم بالطاعة. وكان لهؤلاء أثر في اللغة والأدب، لأن العرب كانوا يسمعون منهم ألفاظًا دينية لم تكن في لغتهم، مثل الصلاة والزكاة والقربان. وقد دخلت بعض هذه الألفاظ في الشعر الجاهلي قبل الإسلام، وهذا يدل على عمق التبادل الثقافي.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالجدل الديني قبل البعثة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان في مكة من يعرف شيئًا من أخبار الأنبياء، وكان في المدينة من ينتظر نبيًّا، وكان في نجران من يجادل في المسيح. وهذا كله خلق مناخًا دينيًّا لم يكن فارغًا، وكان الناس فيه يتساءلون عن البعث والحساب وعن الدين الصحيح. وقد استعمل القرآن هذا التساؤل نفسه في خطابه: وإذا قيل إن وعد الله حق والساعة لا ريب فيها قلتم ما ندري ما الساعة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان هذا الجدل نعمةً ونقمة في وقت واحد. نعمة لأنه هيّأ العقول لقبول الوحي، ونقمة لأنه أنتج عادات في الجدل والمماراة، حتى صار بعض أهل الكتاب يجادلون بالباطل ويريدون أن يُضلّوا. وقد وصف القرآن هذا فقال: ودّ كثير من أهل الكتاب لو يردونكم من بعد إيمانكم كفارًا حسدًا من عند أنفسهم.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eيهود يثرب\u003c/b\u003e\u003cspan\u003eبنو قينقاع وبنو النضير وبنو قريظة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eمراكز أخرى\u003c/b\u003e\u003cspan\u003eخيبر وتيماء وفدك\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eنصارى الجزيرة\u003c/b\u003e\u003cspan\u003eنجران واليمن والحيرة والغساسنة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالعلاقة\u003c/b\u003e\u003cspan\u003eتجارة وجوار وحلف لا دعوة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالحكم\u003c/b\u003e\u003cspan\u003eأهل الكتاب لهم دينهم وعليهم الجزية\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالطائفة\u003c/th\u003e\u003cth\u003eالموضع\u003c/th\u003e\u003cth\u003eأثرها في البيئة العربية\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eيهود يثرب\u003c/td\u003e\u003ctd\u003eالمدينة\u003c/td\u003e\u003ctd\u003eالزراعة والصياغة ومعرفة الكتاب\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eيهود خيبر\u003c/td\u003e\u003ctd\u003eشمال الحجاز\u003c/td\u003e\u003ctd\u003eالنخيل والحصون والمزارعة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eنصارى نجران\u003c/td\u003e\u003ctd\u003eجنوب الجزيرة\u003c/td\u003e\u003ctd\u003eأسقفية وجدل ديني ووفود\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eنصارى الحيرة\u003c/td\u003e\u003ctd\u003eالعراق\u003c/td\u003e\u003ctd\u003eالنسطورية والأدب والشعر\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eغسان\u003c/td\u003e\u003ctd\u003eحدود الشام\u003c/td\u003e\u003ctd\u003eنصرانية قبلية وعلاقة بالروم\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eوَقَالَتِ الْيَهُودُ لَيْسَتِ النَّصَارَىٰ عَلَىٰ شَيْءٍ وَقَالَتِ النَّصَارَىٰ لَيْسَتِ الْيَهُودُ عَلَىٰ شَيْءٍ وَهُمْ يَتْلُونَ الْكِتَابَ\u003c/p\u003e\u003ccite\u003eسورة البقرة، الآية ١١٣\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eكان في الجزيرة كتابٌ ونبيّ يُذكران قبل البعثة، وكان الجدل الديني قائمًا في المدن والقرى. ولهذا لم يكن الإسلام خبرًا غريبًا على أهلها، بل كان جوابًا عن سؤال كانوا يسألونه.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"hanifs","n":"الحنيفية والأحناف قبل البعثة","ic":"🕋","part":"القسم الثاني: الأديان والمعتقدات","h":"\u003carticle class=\"ch3\" id=\"hanifs\" data-toc=\"الحنيفية والأحناف قبل البعثة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٢.٣\u003c/span\u003e\n          \u003ch3\u003e🕋 الحنيفية والأحناف قبل البعثة\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eب\u003c/span\u003eين أوثانٍ تُعبد وكتابٍ يُقرأ، بقي في الجزيرة من رفض هذا وذاك وقال: أعبُد إله إبراهيم. ولم يكونوا جماعةً ولا مذهبًا، بل أفرادًا يبحثون، وكانوا مقدمةً لما جاء بعدهم.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eالحنيف في اللغة هو المائل عن الطريق المعوج إلى الطريق المستقيم، وفي الشرع هو من اتبع ملة إبراهيم مخلصًا لله. وقد كان في العرب قبل البعثة من يعرف هذا المعنى ويقول به، ويرى أن عبادة الأصنام ضلال، وأن دين إبراهيم هو الحق. ولم يكن هؤلاء كثيرين، ولم يكونوا جماعة منظمة، لكن وجودهم يدل على أن الفطرة لم تكن ميتة في الجزيرة. وقد كان هذا المعنى واضحًا في شعر من عاصرهم من العرب، وفي إنكارهم على قريش خدمتها للأصنام.\u003c/p\u003e\u003cp class=\"ap\"\u003eومن أشهرهم زيد بن عمرو بن نفيل، وكان من قريش، وقد رفض عبادة الأصنام وخرج يطلب دين إبراهيم في الشام والعراق والجزيرة. وتذكر الروايات أنه لقي راهبًا ويهوديًّا فسألهما عن الدين فدلّاه على الحنيفية، فرجع إلى مكة يقول: اللهم إني أشهد أني على دين إبراهيم. وقد مات قبل البعثة، وقال عنه النبي: إنه يُبعث أمةً وحده. وقد كان يصرّح بذلك في المسجد الحرام وفي مجامع قريش، فلا يخاف لومة لائم في دينه.\u003c/p\u003e\u003cp class=\"ap\"\u003eومنهم قُسّ بن ساعدة الإيادي، وكان خطيبًا مشهورًا في سوق عكاظ، وكان يدعو إلى التوحيد وينهى عن الظلم ويذكر البعث. وقد رُوي أنه قال في خطبته: أيها الناس، اجتمعوا واعقلوا، واعلموا أن من مات فقد فات، وأن ما هو آت قريب. وقد أثنى النبي على خطبته وقال: كان على دين إبراهيم، وإنه يُحشر أمةً وحده. وقد حفظت كتب الأدب طرفًا من خطبه، وهي تدل على أن التوحيد كان معروفًا في الجزيرة قبل البعثة بأجيال.\u003c/p\u003e\u003cp class=\"ap\"\u003eومنهم أمية بن أبي الصلت، وكان شاعرًا مثقفًا قرأ كتب أهل الكتاب وعرف أخبار الأنبياء، وكان يرجو أن يكون النبي المنتظر من ثقيف، فلما جاء النبي من قريش كفر به حسدًا. وقد روي أن النبي قال فيه: آمن شعره وكفر قلبه. وهذا يدل على أن المعرفة بالدين لا تُغني عن التسليم، وأن الحسد قد يمنع صاحبه من الحق الذي يعرفه. وقد اختلفت الروايات في موته، وأكثرها أنه مات على التوحيد قبل أن تُبعث النبوة في قريش.\u003c/p\u003e\u003cp class=\"ap\"\u003eومنهم ورقة بن نوفل، وكان ابن عم خديجة، وقد تنصّر وقرأ الكتب، فلما جاءته خديجة بخبر الوحي قال: هذا الناموس الذي نزل على موسى، وتمنى أن يكون حيًّا حين يُخرج قومه النبي. وقد مات بعد ذلك بقليل، وقال عنه النبي في رواية: لا تسبّوا ورقة، فإني رأيت له جنتين. وهذه الرواية تدل على أنه مات على التوحيد. وقد روى البخاري طرفًا من خبره في أول الوحي، وهو من أوثق ما وصل إلينا في هذا الباب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان لهؤلاء الأحناف أثر في تهيئة البيئة للدعوة، لأنهم أعلنوا رفض الأصنام في وقت كان رفضها فيه خطرًا. وقد كانت قريش تعرفهم وتعرف موقفهم، فلما جاء النبي لم يكن خبر التوحيد جديدًا عليها كل الجدة. وقد قال أبو سفيان في بعض الروايات إنه سمع من أمية بن أبي الصلت ومن غيره ما جعله يتوقف في الأصنام قبل إسلامه. وقد كانت قريش تحتمل موقفه لأنه لم يكن يدعو إلى جماعة، وإنما كان يقول برأيه في مجالسه.\u003c/p\u003e\u003cp class=\"ap\"\u003eغير أن هؤلاء لم يستطيعوا أن يصنعوا دينًا لأنهم كانوا أفرادًا لا جماعة، ولا شريعة لهم ولا كتاب ولا نبي يُتبع. وكان كل واحد منهم يبحث بطريقته، ويقول برأيه، ولا يملك أن يجمع الناس على شيء. وهذا فرق جوهري بين الحنيفية كحالة فردية والإسلام كدين جامع، وقد أشار القرآن إلى هذا حين قال: ثم أوحينا إليك أن اتبع ملة إبراهيم حنيفًا. ولهذا كان القرآن يخاطبهم بما يعرفونه من التوحيد لا بما يستنكرونه، فيقول: ولئن سألتهم من خلق السماوات والأرض ليقولن الله.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذا درسٌ في تاريخ الأديان: أن الفطرة قد تهدي إلى التوحيد، لكنها لا تستطيع أن تبني أمة. فالأمة تحتاج إلى شريعة وإلى قائد وإلى جماعة، وهذا ما جاء به النبي. ولهذا لم يكن الأحناف سابقين للإسلام بمذهب، بل كانوا سابقين له بشهادة أن لا إله إلا الله، وهو نصف الشهادة الذي بقيت عليهم نصفها الثاني. وقد بقي أثر هذا الفرق في الفقه: أن الشهادة لا تصح إلا بجزأيها معًا، لا بإقرار بالخالق وحده.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eمعنى الحنيفية\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم تكن الحنيفية مذهبًا له كتب ولا رجال، بل كانت موقفًا: أن تعبد الله وحده وتترك ما سواه. وقد كان صاحبها يقول: أنا على دين إبراهيم، ولا يعرف من تفاصيل هذا الدين إلا ما بقي في الذاكرة من أخبار الخليل. ولهذا كانت حنيفيتهم عامةً في الأصول، خاليةً من التفاصيل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان هذا النقص هو الذي جعل الإسلام يُكملها. فقد جاء القرآن يحدّد ملة إبراهيم ويشرحها: قل إنني هداني ربي إلى صراط مستقيم دينًا قيمًا ملة إبراهيم حنيفًا وما كان من المشركين. فصار الحنيف في الإسلام من أتبع إبراهيم على ما جاء به الوحي، لا على ما بقي في الذاكرة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eأعلام الأحناف\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان زيد بن عمرو بن نفيل أشهرهم، وقد كان يصرّح في مكة بأنه على دين إبراهيم، وكان ينهى عن وأد البنات وينتزع البنت من يد أبيها إذا أراد قتلها. وقد قتله قومه في بعض الروايات، وقيل مات في الطريق. وقد روى ابنه سعيد بن زيد، أحد العشرة المبشرين بالجنة، حديث النبي فيه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان قُسّ بن ساعدة خطيبًا لا شاعرًا، وله خطب في التوحيد والبعث، وقد وصفه النبي بأنه كان على دين إبراهيم. وأما ورقة بن نوفل فقد كان أعلمهم بالكتب، وهو الذي شهد بأن ما جاء النبي هو الناموس الذي نزل على موسى، فكان أول من صدّق الوحي من أهل الكتاب في مكة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eلماذا لم يصيروا جماعة\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يصيروا جماعة لأنهم لم يملكوا شريعةً ولا كتابًا ولا قائدًا. فكل واحد منهم كان يرى الحق في الجملة، ولا يعرف تفاصيله، فلم يكن في وسعه أن يقول للناس: هذا حلال وهذا حرام. وهذا هو الفرق بين من يرى الطريق ومن يمشي فيه بالناس. وكان هذا النقص في الشريعة هو الذي جعل حنيفيتهم حالةً فردية لا حركةً جماعية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان اختلافهم في التفاصيل سببًا في تفرقهم، فمنهم من تنصّر، ومنهم من بقي حنيفًا لا ينتسب إلى دين، ومنهم من مات قبل البعثة. ولهذا لم يكونوا جماعةً يمكن أن تُبنى عليها دولة، وإنما كانوا أصواتًا فردية في زمن الشرك، وهذا أقصى ما يمكن أن يبلغه من لا وحي عنده.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمعنى\u003c/b\u003e\u003cspan\u003eالميل عن الشرك إلى ملة إبراهيم\u003c/span\u003e\u003c/div\u003e\u003cdiv cl
