ass=\"kb\"\u003e\u003cb\u003eزيد بن عمرو\u003c/b\u003e\u003cspan\u003eرفض الأصنام وخرج يطلب دين إبراهيم\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eقُسّ بن ساعدة\u003c/b\u003e\u003cspan\u003eخطيب عكاظ وداعٍ إلى التوحيد والبعث\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eورقة بن نوفل\u003c/b\u003e\u003cspan\u003eأول من صدّق الوحي من أهل الكتاب\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالحدّ\u003c/b\u003e\u003cspan\u003eأفراد بلا شريعة ولا جماعة ولا كتاب\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالحنيف\u003c/th\u003e\u003cth\u003eموضعه\u003c/th\u003e\u003cth\u003eما يُعرف عنه\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eزيد بن عمرو بن نفيل\u003c/td\u003e\u003ctd\u003eمكة\u003c/td\u003e\u003ctd\u003eرفض الأصنام ونهى عن وأد البنات\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eقُسّ بن ساعدة\u003c/td\u003e\u003ctd\u003eعكاظ والإياد\u003c/td\u003e\u003ctd\u003eخطبة التوحيد والبعث\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eأمية بن أبي الصلت\u003c/td\u003e\u003ctd\u003eالطائف\u003c/td\u003e\u003ctd\u003eشاعر قرأ الكتب وكفر حسدًا\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eورقة بن نوفل\u003c/td\u003e\u003ctd\u003eمكة\u003c/td\u003e\u003ctd\u003eتنصّر وصدّق الوحي\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eعثمان بن الحويرث\u003c/td\u003e\u003ctd\u003eمكة\u003c/td\u003e\u003ctd\u003eطلب النصرانية عند قيصر\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eثُمَّ أَوْحَيْنَا إِلَيْكَ أَنِ اتَّبِعْ مِلَّةَ إِبْرَاهِيمَ حَنِيفًا وَمَا كَانَ مِنَ الْمُشْرِكِينَ\u003c/p\u003e\u003ccite\u003eسورة النحل، الآية ١٢٣\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eكان في الجزيرة من رفض الأصنام وقال بدين إبراهيم، لكنهم لم يملكوا شريعةً ولا جماعة. وكان وجودهم دليلًا على أن الفطرة لم تمت، وأن ما جاء به النبي كان جوابًا كاملًا لسؤال بقي معلّقًا.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-3","n":"القسم الثالث: الإمبراطوريتان على الحدود","ic":"","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-3\" style=\"--c:#8B6914\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e🏛️\u003c/div\u003e\n      \u003ch2\u003eالقسم الثالث: الإمبراطوريتان على الحدود\u003c/h2\u003e\n      \u003cp\u003eكانت الجزيرة محصورة بين إمبراطوريتين عظيمتين: بيزنطة في الشمال الغربي وفارس في الشمال الشرقي، وكان في جنوبها مملكة قديمة تتحكم في تجارة البحر. وهذه الفصول الثلاثة تعرض جيرانه الثلاثة، وكيف صنع صراعهم الفراغ الذي وُلد فيه الإسلام.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#byzantium\"\u003eالروم وبيزنطة والشام\u003c/a\u003e\u003ca href=\"#sasanians\"\u003eالفرس الساسانيون والعراق\u003c/a\u003e\u003ca href=\"#abyssinia-and-yemen\"\u003eالحبشة واليمن وسقوط دولة سبأ\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"byzantium","n":"الروم وبيزنطة والشام","ic":"🏛️","part":"القسم الثالث: الإمبراطوريتان على الحدود","h":"\u003carticle class=\"ch3\" id=\"byzantium\" data-toc=\"الروم وبيزنطة والشام\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٣.١\u003c/span\u003e\n          \u003ch3\u003e🏛️ الروم وبيزنطة والشام\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eك\u003c/span\u003eانت بيزنطة في نظر العرب دولة الروم، دولة عظيمة بعيدة، لها مدن عظيمة وجيوش وجباية وكنائس. ولم تكن بعيدة عن الجزيرة كما يُظن، فقد كانت الشام بابها، وكانت القبائل العربية على حدودها جندها.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكانت الإمبراطورية البيزنطية هي الوريث الشرعي للإمبراطورية الرومانية في الشرق، وعاصمتها القسطنطينية، ولغتها الرسمية اليونانية، ودينها النصرانية على مذهب المجمع الخلقيدوني. وقد ورثت عن رومة ولاياتها الشرقية: الشام وفلسطين ومصر وآسيا الصغرى، وظلت تحكمها بنظام إداري دقيق يجمع بين الولاة والجباة والجند. وكانت في القرن السادس الميلادي أقوى دولة في البحر المتوسط، لكن قوتها كانت تُستهلك في جبهتين: جبهة الفرس في الشرق، وجبهة البرابرة في البلقان.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت الشام أهم ولاياتها الشرقية، وفيها دمشق وحلب وأنطاكية والقدس وقيسارية، وكانت هذه المدن تعيش على الزراعة والتجارة معًا. وقد كانت الشام طريق القوافل من الجزيرة إلى البحر، وكانت موانئها تصدّر الزيت والقمح والنسيج إلى القسطنطينية وأوروبا. وكانت الإدارة البيزنطية تجبي من الشام ضرائب ثقيلة، وتُحصي الأرض والناس والمواشي، وتُطالب بالعشور والرسوم على كل شيء.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت المسألة الدينية أعقد من المسألة المالية. فقد كان في الشام ومصر من النصارى من يخالف مذهب الدولة، وكان في مصر أقباط يقولون بطبيعة واحدة للمسيح، وفي الشام يعاقبة على قول قريب من ذلك. وقد عدّتهم الدولة هراطقة، فضايقتهم وعزلت أساقفتهم وصادرت كنائسهم أحيانًا. وهذا الخلاف الديني جعل حكم بيزنطة ثقيلًا على أهل الشام ومصر، حتى إن بعضهم فضّل حكمًا آخر على حكمها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت القبائل العربية على حدود الشام هي الجند غير الرسمي لبيزنطة. وأشهرها غسان، وكانت قبائل من الأزد نزلت الشام بعد انهيار سدّ مأرب في الروايات، ودخلت في طاعة الروم، وحملت لقبًا شرفيًا من قياصرتهم، ودافعت عن الحدود مقابل مال وامتياز. وكانت غسان نصرانية على مذهب الدولة، وكانت لها مدن وقصور وشعراء، وكانت درع بيزنطة في وجه الفرس وأعرابهم. وقد بقي أثرهم في أسماء المواضع وفي الشعر العربي بعد الإسلام.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أنهكت الحرب بين بيزنطة وفارس الدولة إنهالكًا شديدًا. فقد دخل الفرس الشام سنة ٦١٣م وأخذوا دمشق والقدس، ثم دخلوا مصر سنة ٦١٩م، وكان ذلك نكبة كبرى للدولة وللكنيسة. ثم استطاع هرقل أن يعيد تنظيم جيوشه ويسترد ما فُقد في حملات طويلة بين ٦٢٢م و٦٢٨م، حتى وصل إلى قلب فارس وأعاد الصليب إلى القدس. وكانت هذه الحرب الطويلة قد استنزفت الخزينة والرجال معًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان لبيزنطة في الجزيرة أثر ثقافي وتجاري واضح. فالتجار العرب يعرفون أسواق الشام وموانئها، ويعرفون اللغة اليونانية بقدر ما يحتاجونه في البيع والشراء، ويعرفون النصرانية من كنائسها ورهبانها. وكانت القوافل تصل إلى بصرى وأنطاكية وغزة، وكانت هذه المدن تعرض على العرب بضائع لا تُوجد في الجزيرة: الزيت والزجاج والنسيج والعملة الذهبية. وقد كانت هذه الحرب أطول حرب عرفها الشرق في ذلك العصر، وأكثرها استنزافًا للرجال.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في تجربة بيزنطة درسٌ للعرب قبل الإسلام. فقد رأوا دولةً عظيمة تُهزم أمام دولة أعظم منها، ورأوا دينًا واحدًا يتفرق أهله إلى مذاهب يكفّر بعضها بعضًا، ورأوا جبايةً تُثقل الرعية. وقد ذكر القرآن هذه التجربة في أول ما نزل بعد الهجرة، في قوله: غُلبت الروم في أدنى الأرض وهم من بعد غلبهم سيغلبون، فكان في ذلك إشارة إلى أن أخبار الشام ليست بعيدة عن مكة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان أثر هذا كله في الفتوح كبيرًا. فحين دخل المسلمون الشام وجدوا بلادًا أنهكتها الحرب، وأهلًا يشتكون من الضرائب ومن الاضطهاد الديني، وجيشًا لا يقاتل إلا بأجر. وقد كتب خالد بن الوليد إلى أهل دمشق أمانًا، وكتب غيره إلى مدن أخرى، فلم تكن الفتوح في الشام غزوًا لأرض مجهولة بل دخولًا في بلاد يعرفها العرب من تجارتهم وجوارهم. وقد وجد المسلمون في هذه البلاد أهلًا يعرفون العربية ويحترمون من يحفظ العهد.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالقسطنطينية والولايات الشرقية\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت القسطنطينية مدينة لا تُشبه مدن العرب، بأسوارها وأسواقها وقصورها، وكانت تُدار بدواوين كثيرة: ديوان الجند وديوان الخراج وديوان البريد وديوان السر. وقد ورث المسلمون هذا النمط الإداري بعد الفتوح، لا بالتقليد الحرفي بل بالحاجة، لأن إدارة بلاد واسعة تحتاج إلى دفاتر وموظفين لا إلى شيوخ قبائل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت الولايات الشرقية تُدار من قبل ولاة يعيّنهم الإمبراطور، ويُشرف عليهم موظفون ماليون مستقلون عنه، وهذا الفصل بين السلطة والمال كان من أسباب قوة الدولة. وقد أخذه المسلمون بعد ذلك في نظام العامل والمشرف، وفي ديوان الخراج وديوان الجند، فصار جزءًا من تراثهم الإداري.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالخلاف الديني وثقله\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يكن الخلاف في طبيعة المسيح مسألة لاهوتية بعيدة عن الناس، بل كان يدخل في الكنائس والبيوت والأسواق. فمن قال بقول الدولة كان موضع ثقة، ومن خالفه كان موضع شك، وكان القاضي والجابي يعرفان مذهب الرجل قبل أن يعرفا اسمه. وهذا جعل الدين في الشام ومصر مسألةً سياسية بالضرورة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد استفاد المسلمون من هذا في الفتوح استفادةً لم يكونوا يتوقعونها. فقد وجدوا في مصر والشام من يفضّل حكمًا لا يسأل عن المذهب، ووجدوا رهبانًا وأساقفة يطلبون الأمان على كنائسهم. ولهذا كانت معاهدات الفتوح في هذه البلاد أكثر تسامحًا مما كان متوقعًا، لأن الطرف الآخر كان يحتاج إلى الأمان أكثر مما يحتاج إلى السيادة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eغسان والحدود العربية\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت غسان قبائل عربية في الشام تتبع الروم، وقد بلغت مكانتها في القرن السادس حتى صار ملوكها يُلقّبون بالملك، وكانت لهم عاصمة في الجابية وقصور في البلقاء. وكانت وظيفتهم حراسة الحدود في وجه أعراب الحجاز والفرس، وكان الروم يدفعون لهم مالًا سنويًا مقابل ذلك. وكان ملوكها يُسمّون في المصادر العربية ملوك الشام، وكان لهم قصور في البلقاء.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان لهذه القبائل دور في نقل الثقافة إلى الجزيرة، لأن أبناءها كانوا يعرفون العربية والنصرانية واليونانية، وكانوا يترددون على مكة في التجارة. وقد أسلم كثير منهم بعد الفتوح، ودخلوا في جيوش المسلمين، وكان منهم من قاتل في اليرموك ضد دولة كان أجداده يحمونها، وهذا التحول يدل على أن الولاء القبلي لم يكن دائمًا أقوى من الدين.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالعاصمة\u003c/b\u003e\u003cspan\u003eالقسطنطينية، واللغة الرسمية اليونانية\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالولايات\u003c/b\u003e\u003cspan\u003eالشام وفلسطين ومصر وآسيا الصغرى\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالحرب مع فارس\u003c/b\u003e\u003cspan\u003eمن سنة ٦٠٢م إلى سنة ٦٢٨م\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eحلفاؤها العرب\u003c/b\u003e\u003cspan\u003eغسان على حدود الشام\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eنقطة ضعفها\u003c/b\u003e\u003cspan\u003eالضرائب والخلاف الديني في الشام ومصر\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالوجه\u003c/th\u003e\u003cth\u003eبيزنطة\u003c/th\u003e\u003cth\u003eأثره في الجزيرة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالدين\u003c/td\u003e\u003ctd\u003eنصرانية خلقيدونية رسمية\u003c/td\u003e\u003ctd\u003eكنائس ورهبان ومذاهب متصارعة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالاقتصاد\u003c/td\u003e\u003ctd\u003eزراعة وتجارة وضرائب ثقيلة\u003c/td\u003e\u003ctd\u003eأسواق الشام تجذب قوافل العرب\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالجند\u003c/td\u003e\u003ctd\u003eجيوش نظامية وحلفاء قبليون\u003c/td\u003e\u003ctd\u003eغسان درع الحدود\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالحرب\u003c/td\u003e\u003ctd\u003eصراع طويل مع فارس\u003c/td\u003e\u003ctd\u003eإنهاك الدولة واستنزاف الخزينة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالإدارة\u003c/td\u003e\u003ctd\u003eدواوين وولاة وموظفون\u003c/td\u003e\u003ctd\u003eنموذج أخذه المسلمون بعد الفتوح\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eغُلِبَتِ الرُّومُ فِي أَدْنَى الْأَرْضِ وَهُم مِّن بَعْدِ غَلَبِهِمْ سَيَغْلِبُونَ فِي بِضْعِ سِنِينَ\u003c/p\u003e\u003ccite\u003eسورة الروم، الآيات ٢ إلى ٤\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eكانت بيزنطة دولة عظيمة أنهكتها الحرب والضرائب والخلاف الديني، وكانت الشام بابها إلى الجزيرة. ولهذا لم تكن الفتوح في الشام غزوًا لأرض مجهولة، بل دخولًا في بلاد يعرفها العرب من تجارتهم.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"sasanians","n":"الفرس الساسانيون والعراق","ic":"🔥","part":"القسم الثالث: الإمبراطوريتان على الحدود","h":"\u003carticle class=\"ch3\" id=\"sasanians\" data-toc=\"الفرس الساسانيون والعراق\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٣.٢\u003c/span\u003e\n          \u003ch3\u003e🔥 الفرس الساسانيون والعراق\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eك\u003c/span\u003eانت فارس الدولة التي تُشبه بيزنطة في العظمة وتُخالفها في الدين واللغة، وكانت العراق ولايتها الغربية وبابها إلى العرب. وقد كان صراع الدولتين هو الخبر الأكبر في الجزيرة قبل الإسلام.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eقامت الدولة الساسانية في فارس سنة ٢٢٤م على أنقاض الدولة الفرثية، وكانت دينها الزرادشتية، ولغتها الفارسية، وعاصمتها المدائن قرب بغداد اليوم. وقد بنت الدولة نفسها على نظام طبقي دقيق: أهل الدين وأهل الحرب وأهل الكتابة والعامة، ولكل طبقة مكانها وواجبها. وكان الملك فيها يُسمّى شاه، وله سلطة مطلقة، ويُحيط به ديوان من الوزراء والكتّاب. وكان الملك في فارس يُعدّ ظلًّا لله على الأرض في تصوّر أهلها، وله هيبة دينية لا سياسية فقط.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان العراق هو أغنى ولاياتها وأقربها إلى العرب، وفيه المدائن والحيرة والأبلة، وفيه دجلة والفرات وسواد الزرع. وكانت الدولة تجبي منه خراجًا عظيمًا، وتُموّل به جيوشها وحروبها. وكانت طرق التجارة تمرّ من العراق إلى الخليج والهند والصين، وكانت بضائع فارس تُشترى في أسواق العرب وتُشترى بضائع العرب في أسواق فارس. وكانت السفن تصل من الخليج إلى الأبلة، ومنها تُحمل البضائع إلى المدائن ثم إلى فارس.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان للفرس حلفاء من العرب مثل الروم، وأشهرهم المناذرة في الحيرة، وكانوا من قبيلة لخم، وكانت وظيفتهم حراسة الحدود الغربية لفارس في وجه أعراب البادية وغسان. وقد بلغ المناذرة مكانة كبيرة، وكان ملوكهم يُعرفون بلقب الملك، وكانت الحيرة مدينة أدب وشعر وتجارة، وكان فيها من النصارى النساطرة عدد كبير. وقد كان المناذرة يقولون الشعر ويحمون الشعراء، وكانت الحيرة محطةً أدبية يعرفها العرب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان الصراع بين فارس وبيزنطة هو محور السياسة في المشرق قرونًا، وكانت الجزيرة ساحة لهذا الصراع. فمن انتصر في الشام خاف على العراق، ومن انتصر في العراق خاف على الشام، وكانت القبائل العربية تتحرك بحسب توازن القوى، وكانت الطرق التجارية تُغلق وتُفتح بحسب الحرب. وقد بلغ الصراع ذروته في عهد كسرى الثاني الذي دخل الشام ومصر، ثم انهزم أمام هرقل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في تاريخ فارس درسٌ آخر للعرب: أن الملك المطلق قد يُطاح به بسهولة. فقد قُتل كسرى الثاني سنة ٦٢٨م، ودخلت الدولة في فوضى عارمة، وتعاقب على العرش في أربع سنوات عدد من الملوك والأمراء، حتى صارت الدولة تُدار بالاغتيال لا بالوراثة. وكان هذا الانهيار السريع سببًا في أن الفرس لم يستطيعوا أن يقفوا أمام الفتوح بعد ذلك بسنوات قليلة. وقد روى المؤرخون أخبار هذه الفوضى بالتفصيل، لأنها كانت حديث الناس في المشرق كله.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان للفرس أثر في الجزيرة من جهة اليمن أيضًا، فقد أخرجوا الأحباش منها في أواخر القرن السادس، وصارت اليمن ولاية فارسية يحكمها عامل يُسمّى المرزبان. وكان هذا العامل بعيدًا عن المركز، وكانت اليمن في تلك السنين قد أنهكتها الحروب والاحتلال والثورات، فلم تكن قادرة على أن تلعب دورًا في الأحداث الكبرى. وقد كانت اليمن في تلك الأيام تُدار من بعيد، ولم تكن لها حظوة عند ملوك فارس.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في العراق من العرب من يعرف الفرس عن قرب: تجارٌ في الحيرة والأبلة، وقبائل على الحدود مثل تغلب وبكر وتميم، ونصارى من النساطرة، وكتّاب يعرفون الفارسية. وكان هؤلاء هم الذين نقلوا إلى الجزيرة أخبار الفرس وأساليبهم في الملك والإدارة. وقد استفاد المسلمون من هذه المعرفة بعد الفتوح حين احتاجوا إلى إدارة العراق. وقد كان هؤلاء العرب يعرفون الفارسية بقدر ما يحتاجونه في التجارة والكتابة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان سقوط فارس أسرع مما توقع أحد. فقد انتهت الدولة الساسانية في معركة القادسية سنة ٦٣٦م ثم في نهاوند سنة ٦٤٢م، ودخل المسلمون المدائن ووجدوا فيها ما لم يروه من قبل: قصورًا وسجادًا وذهبًا وديوانًا. وقد قال عمر بن الخطاب في وصف ما وجدوه عبارةً تدل على دهشته، وأمر أن تُقوَّم الغنائم وتُحصى، فكان هذا أول لقاء للمسلمين بحضارة دولة عظيمة. وقد وصف المؤرخون ما وجده المسلمون في المدائن وصفًا يدل على الدهشة أكثر من الوصف.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالمدائن والزرادشتية\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت المدائن مدينة عظيمة على دجلة، فيها قصور الأكاسرة وإيوان كسرى المشهور، وفيها النار المقدسة التي تُعبد عند الزرادشتيين. وكانت الزرادشتية دين الدولة، تقوم على عبادة النار والصراع بين الخير والشر، ولها رجال دين لهم سلطة ونفوذ، ولها شرائع خاصة في الزواج والميراث.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في العراق أديان أخرى: نصارى نساطرة، ويهود كثيرون في بابل، وصابئة في الجنوب. وكانت الدولة تتعامل مع هذه الطوائف بحسب المصلحة، تارةً تتسامح وتارةً تضيّق. وهذا التعدد الديني جعل العراق بلادًا معقدة، وجعل من يحكمها يحتاج إلى سياسة لا إلى قوة فقط. وكان رجال الدين في فارس طبقةً لها أرض ومال وسلطة، وكان الملك يحتاج إليهم.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالمناذرة والحيرة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الحيرة مدينة عربية على حدود العراق، وكانت عاصمة المناذرة، وكانت مركزًا للتجارة والأدب. وقد عرف العرب الحيرة بأنها موضع الملوك والكتّاب، وكان من شعرائهم من يمدح ملوكها، وكان فيها من يعرف الفارسية والكتابة. وقد كانت الحيرة أول مدينة عربية تتصل بإدارة دولة كبيرة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان المناذرة حلفاء الفرس في وجه غسان والروم، وكانت وظيفتهم حماية الحدود مقابل مال. وقد ضعفت دولتهم في آخر عهدها، حتى أغضب آخر ملوكهم كسرى فقتله، فسقطت الحيرة بعده. وقد كان سقوطها مقدمة لسقوط فارس كلها، لأن العرب فقدوا الحاجز الذي كان يفصلهم عن العراق. وقد كان سقوطها بداية سقوط الدولة كلها، لأن العرب كانوا حاجزًا لا جيشًا نظاميًّا.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالانهيار السريع\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم تسقط فارس في معركة واحدة، بل سقطت في سلسلة من الاغتيالات والانقلابات بدأت بمقتل كسرى الثاني. فقد قتله ابنه في رواية، ثم قُتل ابنه، ثم تعاقب على العرش من لا يملك من السلطة شيئًا، وكانت الدولة تُدار باسم ملك لا يحكم، وبواسطة قواد يتنازعون. وكانت الدولة تُدار باسم ملك لا يملك من الأمر شيئًا، وبواسطة قواد يتنازعون النفوذ.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان هذا الانهيار هو الذي جعل الفتوح ممكنة. فالدولة التي تُنهك في الداخل لا تستطيع أن تُدافع عن حدودها، والأمة التي تنقسم على ملكها لا تجتمع على حرب. وقد لاحظ المسلمون ذلك، وقد كانوا يتابعون أخبار الفرس والروم من تجارتهم، كما تدل عليه سورة الروم التي نزلت في أخبار غلبة الروم.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالعاصمة\u003c/b\u003e\u003cspan\u003eالمدائن على دجلة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالدين\u003c/b\u003e\u003cspan\u003eالزرادشتية، مع نصارى ويهود وصابئة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالحلفاء العرب\u003c/b\u003e\u003cspan\u003eالمناذرة في الحيرة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالانهيار\u003c/b\u003e\u003cspan\u003eمقتل كسرى الثاني سنة ٦٢٨م وفوضى العرش\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالنهاية\u003c/b\u003e\u003cspan\u003eالقادسية سنة ٦٣٦م ونهاوند سنة ٦٤٢م\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالوجه\u003c/th\u003e\u003cth\u003eفارس الساسانية\u003c/th\u003e\u003cth\u003eأثره في الجزيرة\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالحكم\u003c/td\u003e\u003ctd\u003eملك مطلق وديوان مركزي\u003c/td\u003e\u003ctd\u003eنموذج إداري عرفه العرب في الحيرة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالدين\u003c/td\u003e\u003ctd\u003eزرادشتية رسمية\u003c/td\u003e\u003ctd\u003eتعدد ديني في العراق\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالاقتصاد\u003c/td\u003e\u003ctd\u003eزراعة السواد وتجارة الخليج\u003c/td\u003e\u003ctd\u003eأسواق وأعمال تجارية للعرب\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالحلفاء\u003c/td\u003e\u003ctd\u003eالمناذرة في الحيرة\u003c/td\u003e\u003ctd\u003eحاجز بين العرب والعراق\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمصير\u003c/td\u003e\u003ctd\u003eانهيار سريع بعد ٦٢٨م\u003c/td\u003e\u003ctd\u003eفتح العراق في سنوات قليلة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eأَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِعَادٍ إِرَمَ ذَاتِ الْعِمَادِ الَّتِي لَمْ يُخْلَقْ مِثْلُهَا فِي الْبِلَادِ\u003c/p\u003e\u003ccite\u003eسورة الفجر، الآيات ٦ إلى ٨\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eكانت فارس دولة عظيمة في الدين والإدارة والزرع، لكنها انهارت في أربع سنوات بعد مقتل ملكها. وبهذا الانهيار انفتح العراق أمام المسلمين، فدخلوا المدائن ووجدوا حضارة لم يعرفوا مثلها.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"abyssinia-and-yemen","n":"الحبشة واليمن وسقوط دولة سبأ","ic":"🌊","part":"القسم الثالث: الإمبراطوريتان على الحدود","h":"\u003carticle class=\"ch3\" id=\"abyssinia-and-yemen\" data-toc=\"الحبشة واليمن وسقوط دولة سبأ\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٣.٣\u003c/span\u003e\n          \u003ch3\u003e🌊 الحبشة واليمن وسقوط دولة سبأ\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eف\u003c/span\u003eي جنوب الجزيرة كانت اليمن أرض الحضارة القديمة والسدود والقصور، ثم صارت ساحة لحرب بين الحبشة وفارس. وحين انهارت اليمن انهار معها آخر طرف من أطراف الجزيرة القديمة.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكانت اليمن في العصور القديمة من أغنى بلاد الجزيرة وأكثرها عمرانًا، وفيها ممالك مثل سبأ ومعين وحمير، وكانت تقوم على زراعة السدود وتجارة البخور. وقد بلغت مملكة سبأ ذروتها في القرن الثامن قبل الميلاد، وبنَت سدّ مأرب الذي حوّل السيول إلى بساتين، وكانت قصورها ومدنها معروفة في العالم القديم. وقد ذكر القرآن مملكة سبأ في قصة سليمان وبلقيس. وقد بقي من آثارها في اليمن ما يدل على هندسة مائية متقدمة، وعلى مدن كانت أكبر من قرى الحجاز.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت اليمن في العصر الذي يسبق الإسلام تحت حكم الحميريين، وكانوا قد وحّدوا البلاد، وكانت دولتهم على صلة بالروم والفرس. وقد اعتنق بعض ملوكهم اليهودية في القرن الرابع الميلادي، وكان آخرهم ذو نواس، وهو الذي ارتبط بخبر أصحاب الأخدود في سورة البروج. وتذكر الروايات أنه اضطهد نصارى نجران وأحرقهم في أخدود، فاستغاثوا بملك الحبشة. وقد كان هذا الاضطهاد سببًا في تدخّل خارجي غيّر مصير البلاد كلها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد دخلت الحبشة اليمن سنة ٥٢٥م بقيادة أراطة، ثم حكمها أبرهة، وكان نصرانيًّا. وقد أراد أن يصرف حجّ العرب من مكة إلى كنيسة بناها في صنعاء، فلما لم يلتفت العرب إليها سار بجيش فيه فيلة إلى مكة، فكانت حادثة الفيل التي وُلد فيها النبي. وقد ذكر القرآن هذه الحادثة في سورة الفيل: ألم تر كيف فعل ربك بأصحاب الفيل. وقد كان هذا أول جيش فيه فيلة يصل إلى الحجاز في ذاكرة العرب، ولهذا سُمّي العام به.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كانت حادثة الفيل نقطة تحوّل في تاريخ الجزيرة، لأنها أظهرت أن مكة محمية بحماية ليست من قوة أهلها. وقد كان العرب يعرفون هذه الحادثة ويتحدثون بها، وكانت في ذاكرة قريش وفي حسابها السياسي. وقد وُلد النبي في العام نفسه في أشهر الروايات، فكانت الحادثة مقدمةً لظهوره في الوعي العربي. وقد صارت الحادثة تاريخًا يُؤرَّخ به، فيقال: وُلد عام الفيل، وكان ذلك قبل البعثة بأربعين سنة.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم خرج الأحباش من اليمن على يد الفرس في أواخر القرن السادس، بعد أن استنجد أهل اليمن بكسرى، فبعث جيشًا بقيادة وهرز، فقتل مسروقًا آخر ملوك الحبشة في اليمن، وصارت اليمن ولاية فارسية. وكان ذلك آخر تحوّل سياسي كبير في الجنوب قبل الإسلام، وقد ترك اليمن في حالة إنهاك شديد. وقد كان خروج الأحباش بداية انهيار طويل لم تنتهِ منه اليمن قبل الإسلام.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان لخراب سدّ مأرب أثر كبير في تاريخ الجزيرة. فالروايات العربية تتحدث عن سيل العرم الذي هدم السد، وتذكر أن قبائل كثيرة هاجرت من اليمن بعده إلى الشام والعراق والحجاز. وقد ذكر القرآن هذا الحدث في قوله: فكفروا فأرسلنا عليهم سيل العرم وبدلناهم بجنتيهم جنتين ذواتي أكل خمط وأثل وشيء من سدر قليل. وقد ذكر المفسرون أن السيل كان بداية تفرّق القبائل عن مواطنها في الجنوب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان من نتائج هذه الهجرات أن الجزيرة صارت أكثر اختلاطًا. فغسان نزلت الشام، والأوس والخزرج نزلت يثرب في الروايات، وخزاعة نزلت مكة، وبعض القبائل نزلت العراق. وهذا الاختلاط جعل الجزيرة أرضًا واحدة في اللغة والأنساب والأخبار، وإن كانت متفرقة في السياسة، وهيّأ ذلك لظهور أمة واحدة تجمعها كلمة واحدة. وقد كانت هذه القبائل تحمل معها أنسابها وأشعارها، فنقلت أخبار اليمن إلى الجزيرة كلها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان حال الجنوب في نظر أهل الحجاز عبرة. فقد كانت اليمن أرض القصور والسدود والبخور، ثم صارت أرض حروب واحتلال وثورات، ثم صارت ولايةً فارسية بعيدة عن مركزها. وكان في هذا دلالة على أن العمران لا يحمي صاحبه إذا ضعفت دولته، وأن الجزيرة التي كانت أطرافها في يد دول كبيرة لم يكن فيها موضع واحد مستقل إلا الحرم وأهله. وقد كان هذا الدرس حاضرًا في حساب قريش حين فكّرت في مصيرها بين الدول الكبرى.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eسبأ وسدّ مأرب\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان السدّ هو أساس عمران سبأ، لأنه كان يحفظ ماء السيل ويوزّعه على البساتين في مواسم محددة. وقد بلغ طوله في بعض الروايات مئات الأمتار، وكانت له بوابات ومصارف تُدار بعناية، وكان أهل البلاد يعرفون مواعيد الماء كما يعرف الفلاح مواعيد الزرع. وكان الماء يُقسم بحسب الأرض لا بحسب الناس، ولهذا كان لكل بستان نصيب معلوم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد انهار السدّ في القرن السادس الميلادي بعد إهمال وتصدّع، فذهب الماء إلى الرمال وغرق ما حوله من الأرض. وقد صار هذا الحدث في الذاكرة العربية رمزًا لزوال النعمة بسبب الكفر، وقد ذكره القرآن في سورة سبأ في سياق التذكير بنعمة الله على أهلها. وقد بقي في اليمن من آثار السدّ ما يدل على ضخامة العمل ودقة إدارته.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eأصحاب الأخدود\u003c/h4\u003e\u003cp class=\"ap\"\u003eتروي سورة البروج خبر قوم حفروا أخدودًا وأحرقوا فيه المؤمنين، وتصف ذلك بأنه فتنة للمؤمنين. وقد ربط المفسرون هذه الآية بخبر ذي نواس في نجران، حين عرض على أهلها النصرانية فرفضوا، فأحرقهم في أخدود. والرواية تفصيلها في كتب السير، وأصلها في القرآن ثابت. وقد ذكر المفسرون أن الأخدود كان في نجران، وأن الملك عرض على أهلها الرجوع عن دينهم فرفضوا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان لهذا الخبر أثر في الوعي العربي، لأنه جعل النصرانية في الجنوب قضيةً لها شهداء، وجعل الحبشة تُدخل اليمن بحجة حماية النصارى. وبهذا صار الدين في الجنوب جزءًا من الصراع السياسي بين الحبشة وفارس والروم، لا مسألةً داخلية فقط. وقد صار الخبر في الذاكرة العربية شاهدًا على ثبات أهل الدين في وجه السلطان.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالحبشة ثم فارس\u003c/h4\u003e\u003cp class=\"ap\"\u003eحكم الأحباش اليمن نحو نصف قرن، وكان حكمهم عسكريًا يعتمد على الحاميات والجباية، ولم يستطيعوا أن يبنوا دولةً مستقرة. وقد ثار عليهم أهل البلاد مرارًا، وكانت الثورات تُقابل بالقمع، فزادت الكراهية وقلّ الأمن. وقد كان الحكم العسكري يعتمد على الجباية أكثر مما يعتمد على الزراعة والعمران.\u003c/p\u003e\u003cp class=\"ap\"\u003eثم جاء الفرس فطردوهم، وصارت اليمن ولاية ساسانية. وكان هذا التحوّل يعني أن الجنوب خرج من دائرة النصرانية إلى دائرة الزرادشتية، وأن الجزيرة لم يبقَ فيها موضع مستقل إلا الحجاز. وقد كان هذا الوضع هو الذي جعل مكة مركز الثقل الوحيد في الجزيرة عند ظهور الإسلام. وقد كان هذا التحول آخر فصل في تاريخ الجزيرة قبل الإسلام، وأقربها إلى زمن البعثة.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالممالك\u003c/b\u003e\u003cspan\u003eسبأ ومعين وحمير\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالسد\u003c/b\u003e\u003cspan\u003eمأرب، وانهياره في القرن السادس الميلادي\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالأخدود\u003c/b\u003e\u003cspan\u003eاضطهاد ذي نواس لنصارى نجران\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالاحتلال\u003c/b\u003e\u003cspan\u003eالحبشة سنة ٥٢٥م ثم فارس في أواخر القرن السادس\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالهجرة\u003c/b\u003e\u003cspan\u003eقبائل اليمن إلى الشام والعراق والحجاز\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمرحلة\u003c/th\u003e\u003cth\u003eالحكم\u003c/th\u003e\u003cth\u003eالأثر\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eقبل القرن الرابع\u003c/td\u003e\u003ctd\u003eمملكة سبأ وحمير\u003c/td\u003e\u003ctd\u003eسدود وقصور وتجارة بخور\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالقرن الرابع\u003c/td\u003e\u003ctd\u003eحمير ويهودية الملوك\u003c/td\u003e\u003ctd\u003eاضطهاد نصارى نجران\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eسنة ٥٢٥م\u003c/td\u003e\u003ctd\u003eالحبشة\u003c/td\u003e\u003ctd\u003eاحتلال عسكري وحاميات\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eحوالي ٥٧٠م\u003c/td\u003e\u003ctd\u003eحادثة الفيل\u003c/td\u003e\u003ctd\u003eهزيمة أبرهة أمام مكة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eأواخر القرن السادس\u003c/td\u003e\u003ctd\u003eفارس\u003c/td\u003e\u003ctd\u003eولاية ساسانية وإنهاك البلاد\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eلَقَدْ كَانَ لِسَبَإٍ فِي مَسْكَنِهِمْ آيَةٌ جَنَّتَانِ عَن يَمِينٍ وَشِمَالٍ كُلُوا مِن رِّزْقِ رَبِّكُمْ وَاشْكُرُوا لَهُ\u003c/p\u003e\u003ccite\u003eسورة سبأ، الآية ١٥\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eكانت اليمن أرض العمران القديم، فأنهكتها الحروب والاحتلال حتى صارت ولايةً بعيدة عن مركزها. وبانهيار الجنوب وضعف الشمال لم يبقَ في الجزيرة موضع مستقل إلا مكة، فصارت هي مركز الثقل.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-4","n":"القسم الرابع: المجتمع والقيم","ic":"","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-4\" style=\"--c:#8B6914\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e⚖️\u003c/div\u003e\n      \u003ch2\u003eالقسم الرابع: المجتمع والقيم\u003c/h2\u003e\n      \u003cp\u003eالمجتمع الجاهلي ليس صورة واحدة، بل صور متعددة بحسب القبيلة والمدينة والبادية. هذه الفصول الثلاثة تعرض مكانة المرأة والطفل، وقواعد الحرب والسلم، ونظام العبودية والولاء، وهي المواضع التي جاء الإسلام ليغيّر فيها أكثر ما غيّر.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#women-and-children\"\u003eالمرأة والطفل في المجتمع الجاهلي\u003c/a\u003e\u003ca href=\"#war-and-peace\"\u003eالحرب والسلم وأيام العرب\u003c/a\u003e\u003ca href=\"#slavery-and-ranks\"\u003eالعبودية والولاء والطبقات\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"women-and-children","n":"المرأة والطفل في المجتمع الجاهلي","ic":"👩","part":"القسم الرابع: المجتمع والقيم","h":"\u003carticle class=\"ch3\" id=\"women-and-children\" data-toc=\"المرأة والطفل في المجتمع الجاهلي\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٤.١\u003c/span\u003e\n          \u003ch3\u003e👩 المرأة والطفل في المجتمع الجاهلي\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eل\u003c/span\u003eا يمكن وصف حال المرأة في الجاهلية بوصف واحد، فقد كانت ملكةً في مملكة، وتاجرةً في مكة، وموروثةً في قبيلة، وموءودةً في أخرى. والإسلام لم يتعامل مع صورة واحدة، بل مع واقع متعدد أصلحه بابًا بابًا.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكانت مكانة المرأة في الجزيرة تختلف اختلافًا كبيرًا بين قبيلة وأخرى، وبين البادية والمدينة، وبين الطبقة والطبقة. فقد كانت في بعض البيوت ذات مال تُتاجر به، كخديجة بنت خويلد التي كانت تاجرةً لها مال وغلام، وكانت في بعض القبائل تُورَّث الأرض والمال، وكانت في بعضها الآخر لا ترث شيئًا ويُرثى بها هي نفسها. ولهذا لا يصحّ أن يُقال إن المرأة الجاهلية كانت في حال واحدة، بل يقال إنها كانت في أحوال متفاوتة يجمعها أنها لم تكن ذات حق ثابت.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ذكرت عائشة رضي الله عنها في صحيح البخاري صورًا من أنكحة الجاهلية، فمنها ما كان قائمًا على الخطبة والولي والمهر، ومنها نكاح الاستبضاع، وهو أن يقول الرجل لامرأته اذهبي إلى فلان فاستبضعي منه، ومنها نكاح الرهط، وهو أن يجتمع نفر على امرأة واحدة، ومنها نكاح البغايا، وكانت المرأة منهن تُعرف برايتها. وهذه الصور تدل على أن العلاقة بين الرجل والمرأة لم تكن محكومة بعقد واحد، بل بعادات متعددة بحسب القبيلة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان المهر في بعض القبائل حقًّا للمرأة نفسها، وفي بعضها كان يُدفع إلى وليّها، وكان الولي في كثير من الأحوال هو صاحب القرار في التزويج. وقد كانت المرأة في بعض البيوت تُشاور، وكانت في أكثرها تُزوَّج بغير إذنها، وكانت البكر تُستأذن استئذانًا صوريًّا. وقد جاء الإسلام فأقرّ الولي وأبطل الإجبار، وجعل إذن المرأة شرطًا في صحة العقد، وأعطاها مهرها حقًّا لها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأشدّ ما يُذكر من حال المرأة في الجاهلية مسألة الميراث. فكانت المرأة لا ترث في كثير من القبائل، بل كان الرجل يرث زوجة أبيه كما يرث ماله، فيتزوجها إن شاء أو يزوّجها غيره ويأخذ مهرها. وقد نزل القرآن في هذا صريحًا: يا أيها الذين آمنوا لا يحل لكم أن ترثوا النساء كرهًا، ولا تعضلوهن لتذهبوا ببعض ما آتيتموهن. وبهذا أُغلق باب من أظلم أبواب العرف الجاهلي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما وأد البنات فقد كان موجودًا لكنه لم يكن عامًّا، وكان في قبائل معروفة أكثر من غيرها. وكانت أسبابه الخوف من العار إذا سبّتها العرب، والخوف من الفقر إذا كبرت، والخوف من الأسر في الحرب. وقد واجه القرآن هذا الفعل مواجهةً شديدة في سورة التكوير وسورة النحل وسورة الإسراء، وجعل قتل الأولاد من الإملاق جريمةً وكفرًا بنعمة الرزق: ولا تقتلوا أولادكم من إملاق نحن نرزقكم وإياهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان الطفل في المجتمع الجاهلي يُعدّ ثروةً ورجلًا في المستقبل، ولهذا كان الأولاد الذكور أعزّ من الإناث في حساب القبيلة. وكانت العادة أن يُرسل المولود إلى المرضعات في البادية لتقوى لغته ويشتد عوده، وكان يتعلم الرمي والسباحة وركوب الخيل في صغره. وكانت الأسماء تُختار عند الولادة بحسب التفاؤل أو بحسب العادة، وكان النسب يُثبت بالأب لا بالأم في الأغلب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان للتبني مكان في هذا المجتمع، وكان الرجل يتبنى ابن غيره فينسب إليه ويصير له حكم الابن في الميراث والنكاح. وقد أبطل الإسلام التبني في قوله: ادعوهم لآبائهم هو أقسط عند الله، وأبقى الرعاية والتربية دون أن تُغيّر النسب. وكان في هذا حماية لحقوق الأنساب من الاختلاط، وتخفيفٌ لمسألة كانت تُسبّب نزاعات كثيرة في الميراث. وقد تبنّى النبي زيد بن حارثة قبل النهي، فكان يُدعى زيد بن محمد حتى نزلت الآية، ثم عاد إلى نسبه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد جاء الإسلام بتغيير متدرج في هذا كله. فأثبت للمرأة حقها في الميراث والصداق والإرادة، وجعل لها ذمة مالية مستقلة، وحرّم وأد البنات، وحرّم الإكراه في النكاح، وأمر بالإحسان إلى الوالدين. ولم يهدم الأسرة القائمة بل أعاد ترتيبها على أساس من العدل والرحمة، ولهذا كان هذا الباب من أوسع أبواب التغيير الذي أحدثه الدين في الجزيرة. وقد كان هذا التغيير تدريجيًا في بعض الأبواب وحاسمًا في أخرى، وهذا من فقه التغيير في الإسلام.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eأنكحة الجاهلية\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت أنكحة الجاهلية متعددة، وفي بعضها ما يُشبه الزواج المعروف، وفي بعضها ما يُشبه الاشتراك أو الاتخاذ. وقد ذكرت عائشة أربع صور منها في حديث البخاري، وهي من أوثق ما ورد في وصف هذا الباب، لأنها تروي عن أهل الجاهلية من أهل العلم بأخبارهم. وكان لكل صورة من هذه الصور أثر في النسب، ولهذا احتاج الإسلام إلى ضبطه ضبطًا دقيقًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أبطل الإسلام كل هذه الصور إلا النكاح القائم على الولي والشهود والمهر، وجعل النسب يُثبت بالفراش، وجعل العدة حكمًا يحفظ الأنساب. وبهذا صار الزواج عقدًا معلومًا له أركان وشروط، بعد أن كان عرفًا متغيرًا بحسب القبيلة والمكانة. وقد سأل الناس عن هذه الصور بعد الإسلام، فجاءت السنة ببيانها وبيان ما يُقبل منها.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالموءودة والحق في الحياة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان وأد البنات جريمةً يعرفها العرب، وقد ذكرها القرآن في مواضع عدة بأسلوب يقرّع الفاعل ويُبشّع فعله. وأشدّ ما في هذه الآيات أنها تجعل الوأد قتلًا للنفس بغير حق، وتربطه بسوء الظن بالله في الرزق: ولا تقتلوا أولادكم خشية إملاق نحن نرزقهم وإياكم. وقد كانت العرب تسمع هذا التقرير فتسكت، لأن الفطرة كانت تُنكره وإن لم تُحرّمه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في العرب من عاب هذا الفعل قبل الإسلام، ومنهم زيد بن عمرو بن نفيل الذي كان ينتزع البنت من يد أبيها إذا أراد قتلها. وهذا يدل على أن الفطرة كانت تُنكر هذا الفعل في بعض النفوس، وأن الإسلام جاء فأيّد هذه الفطرة وجعلها شرعًا عامًّا. وقد كان في هذا دليل على أن الإسلام جاء ليُقوّي ما في الفطرة من خير لا ليُلغيه.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالطفولة والتنشئة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت تنشئة الطفل في الجاهلية تقوم على ثلاثة أشياء: اللغة، والفروسية، والنسب. فاللغة تُصقل في البادية عند المرضعات، والفروسية تُتعلّم في الميدان، والنسب يُحفظ بالرواية. وكان من لا يُحسن هذه الثلاثة لا يُعدّ كاملًا في قومه، ولهذا كانت الأسرة تحرص على تعليم ابنها الرمي والسباحة وركوب الخيل.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أبقى الإسلام هذه المقاصد وغيّر غايتها. فبقي تعليم اللغة والرمي والسباحة مطلوبًا، لكنه صار وسيلةً لخدمة الدين والأمة لا للمفاخرة القبلية. وقد قال النبي في تعليم الأبناء: مروهم بالصلاة وهم أبناء سبع، فجعل التربية عبادةً لا مجرد عادة. وقد كان هذا التعليم يُسمّى في الجاهلية الأدب، وهو أصل ما سُمّي بعد ذلك تربية.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eتعدد الأحوال\u003c/b\u003e\u003cspan\u003eمن التاجرة إلى الموروثة في قبيلة واحدة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأنكحة\u003c/b\u003e\u003cspan\u003eالاستبضاع والرهط والبغايا والخطبة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالميراث\u003c/b\u003e\u003cspan\u003eحرمان المرأة ووراثتها كرهًا\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالوأد\u003c/b\u003e\u003cspan\u003eفي قبائل معروفة، والقرآن يقرّعه\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالإصلاح\u003c/b\u003e\u003cspan\u003eحق الميراث والصداق والإرادة\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمسألة\u003c/th\u003e\u003cth\u003eحالها في الجاهلية\u003c/th\u003e\u003cth\u003eحكم الإسلام\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالميراث\u003c/td\u003e\u003ctd\u003eحرمان المرأة غالبًا\u003c/td\u003e\u003ctd\u003eنصيب معلوم للأنثى والذكر\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالنكاح\u003c/td\u003e\u003ctd\u003eصور متعددة بلا عقد واحد\u003c/td\u003e\u003ctd\u003eعقد بولي وشهود ومهر\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالإرادة\u003c/td\u003e\u003ctd\u003eإجبار البكر وتزويج بغير إذن\u003c/td\u003e\u003ctd\u003eإذن المرأة شرط\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالوأد\u003c/td\u003e\u003ctd\u003eقتل البنات خوف العار والفقر\u003c/td\u003e\u003ctd\u003eتحريم قاطع ووعيد شديد\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالنسب\u003c/td\u003e\u003ctd\u003eتبنٍّ يغيّر الأنساب\u003c/td\u003e\u003ctd\u003eالنسب للآباء والرعاية باقية\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eوَإِذَا الْمَوْءُودَةُ سُئِلَتْ بِأَيِّ ذَنبٍ قُتِلَتْ\u003c/p\u003e\u003ccite\u003eسورة التكوير، الآيتان ٨ و٩\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eلم تكن المرأة الجاهلية في حال واحدة، لكنها كانت في الأغلب بلا حق ثابت. وقد أعطاها الإسلام حق الحياة والميراث والإرادة، وجعل الأسرة مبنية على العدل والرحمة لا على العرف والمصلحة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"war-and-peace","n":"الحرب والسلم وأيام العرب","ic":"🏹","part":"القسم الرابع: المجتمع والقيم","h":"\u003carticle class=\"ch3\" id=\"war-and-peace\" data-toc=\"الحرب والسلم وأيام العرب\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٤.٢\u003c/span\u003e\n          \u003ch3\u003e🏹 الحرب والسلم وأيام العرب\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eك\u003c/span\u003eانت الحرب في الجاهلية صناعةً واقتصادًا وذاكرة، وكان السلم عقدًا يُشترى بالمال أو يُفرض بالحلف. وأيام العرب هي سجلّ هذه الحروب، وفيها من الشعر ما هو تاريخ ومن التاريخ ما هو شعر.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان الغزو بين القبائل جزءًا من اقتصاد البادية، لأن الأرض لا تُعطي إلا بالقليل، ولأن الإبل هي الثروة، فكانت القبيلة تغزو جارتها فتأخذ إبلها وتُعيدها بعد ذلك أو تُبقيها. ولم يكن الغزو في نظرهم جريمةً بل مكرمة، وكانوا يفخرون به في الشعر ويسمّون الغازي فارسًا وشجاعًا. وهذا الفهم هو الذي جاء الإسلام ليغيّره، فجعل القتال لدفع العدوان وإعلاء الكلمة لا للنهب.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان للعرب أشهر حرمةً في أشهر معلومة، وهي ذو القعدة وذو الحجة والمحرم ورجب، وكانوا يكفّون فيها عن القتال. وكانت هذه الأشهر هي مواسم الحج والأسواق، فكانت الأمن فيها شرطًا للتجارة والاجتماع. وقد أقرّ الإسلام حرمة هذه الأشهر وبقيت في التشريع، لكنه لم يجعلها عذرًا لمن بدأ بالعدوان. وكانت العرب تُسمّي هذه الأشهر الحرم، وكانت تُحترم حتى في أشد الحروب وأطولها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت أيام العرب هي وقائعهم الكبرى، ولكل يوم اسم يُعرف به. فمنها يوم بعاث بين الأوس والخزرج في يثرب، ويوم الفجار بين قريش وهوازن، ويوم ذي قار بين بكر والفرس، وأيام حرب البسوس بين بكر وتغلب، وحرب داحس والغبراء بين عبس وذبيان. وكانت هذه الأيام تُروى في المجالس وتُحفظ في الشعر، وكان الرجل يعرف أيام قومه كما يعرف أنسابه. وكانت هذه الأيام تُسمّى بأسماء المواضع أو بالوقائع نفسها، فتُعرف بذلك في الأشعار.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان للحرب قواعد عرفية يحترمها العرب في الأغلب: لا يُقتل من ألقى سلاحه، ولا تُقتل المرأة ولا الطفل ولا الشيخ، ولا يُهدم بيت الله، ولا يُقطع شجر مثمر في الحرم. ولم تكن هذه القواعد قانونًا مكتوبًا بل عرفًا يخالفونه كثيرًا، غير أن وجودها يدل على أن فكرة الحرب المقيّدة لم تكن غريبة على العقل العربي. وكان من عرفهم أن يردّوا الأسير إلى قومه بفداء، وأن يدفنوا القتيل ولا يُمثّلوا به.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان السلم يُصنع بثلاثة أشياء: الدية، والحلف، والجوار. فالدية تُنهي الثأر، والحلف يُدخل القبيلتين في نصرة واحدة، والجوار يُعطي الفرد حماية الجماعة. وكانت العرب تعقد الصلح بعد سنوات من القتال فيُسمّى صلحًا أو موادعة، وكانت بعض الصلوم تُكتب وتُعلَّق في الكعبة، وهذا يدل على أن الوثيقة كانت معروفة عندهم. وقد كان هذا الصلح يُكتب أحيانًا ويُعلَّق في الكعبة ليكون أشدّ إلزامًا لمن يعقده.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت حرب بعاث في يثرب من أهم هذه الأيام، لأنها كانت قبل الهجرة بسنوات قليلة، وقد قُتل فيها سادات الأوس والخزرج، وتفرّقت القبيلة إلى حزبين. وقد كانت هذه الحرب سببًا في أن أهل يثرب احتاجوا إلى حكمٍ خارجي يحكم بينهم، فكان ذلك من دواعي قبولهم للنبي حين جاء إليهم. ولهذا فإن حربًا قبلية في واحة صغيرة صارت مقدمةً لدولة. وقد كانت هذه الحرب من أعظم ما هيّأ المدينة لقبول حكمٍ خارجي يحكم بين قبائلها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد جاء الإسلام فأعاد تعريف القتال. فلم يبقَ الغزو مكرمةً، بل صار الجهاد في سبيل الله له شروط وأخلاق: لا تُقاتل من لم يقاتل، ولا تُغدر، ولا تُمثّل، ولا تقتل امرأةً ولا صبيًّا، ولا تقطع شجرةً بغير حاجة. وقد قال النبي في وصاياه لجيوشه ما صار أصلًا في فقه الحرب عند المسلمين، وهو ما يُعرف اليوم بالقانون الدولي الإنساني في أصله الأول. وقد أمر النبي أمراءه بهذه الوصايا في كل سرية أرسلها، فصارت أصلًا في فقه الجهاد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في هذا التحويل أثر عميق في الجزيرة. فالقبائل التي كانت تقاتل بعضها سنين صارت جيشًا واحدًا في أقل من عشرين سنة، والطاقة التي كانت تُصرف في الثأر صارت تُصرف في الفتح. وهذا لا يُفسَّر بالقوة وحدها، بل بتحويل المعنى: أن الموت في سبيل الله صار أشرف من الموت في ثأر قبيلة، وأن الأمة صارت أكبر من القبيلة. وقد لاحظ أهل البلاد المفتوحة هذا الفرق، وذكروه في كتبهم وفي أخبارهم عن الفاتحين.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eالأشهر الحرم والأمن\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الأشهر الحرم في الجاهلية وقتًا للأمن التجاري والديني معًا، لأن الحج والأسواق تحتاج إلى سلام. وقد كان العربي يرى القاتل في هذه الأشهر فلا يمدّ يده إليه، وكانت القبائل تتحاسب على ما جرى قبلها في هذه المدة. وبهذا كانت الأشهر الحرم أشبه بهدنة سنوية عامة في جزيرة لا دولة فيها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد أقرّ الإسلام حرمة هذه الأشهر، وشدّد في تحريم القتال فيها إلا لمن بدأ، وربطها بالنسيء الذي كان العرب يفعلونه فيؤخرون الشهر الحرام عامًا ويقدّمون غيره. وقد نهى القرآن عن ذلك لأنه يُفقد الحرمة معناها، وقال: إنما النسيء زيادة في الكفر. وقد بقي تحريم الأشهر الحرم في الإسلام، وبقي للناس فيها تعظيم وتعريف.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eأيام العرب وذاكرتها\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الأيام تُحفظ بالشعر أكثر مما تُحفظ بالكتاب، لأن الشعر هو ديوان العرب. فالقصيدة تذكر الوقعة وتذكر القتلى وتذكر الفرسان، وكانت القبيلة تحرص على أن يكون لها شاعر يُخلّد أيامها. ولهذا صار الشعر مصدرًا تاريخيًا لا يُستغنى عنه في دراسة الجزيرة قبل الإسلام. وقد كان الشعر الجاهلي مصدرًا رئيسًا لمعرفة هذه الأيام، لأنه حفظ أسماءها وأخبارها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان في هذه الأيام من الفخر ما يجعل الصلح صعبًا، لأن كل قبيلة تريد أن يكون لها النصر في الرواية. ولهذا كانت المصادر تختلف في أخبار اليوم الواحد، لأن كل قبيلة ترويه من جهتها. وهذا الاختلاف نفسه دليل على أن الحرب كانت تُخاض مرتين: مرة في الميدان، ومرة في الذاكرة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eمن الغزو إلى الجهاد\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم يلغِ الإسلام القتال بل قيّده، لأنه لا يمكن لدولة أن تقوم في جزيرةٍ مليئة بالغزو بلا قوة. لكنه غيّر مصدر الشرعية: لم يبقَ القتال مكرمةً في نفسه، بل صار مشروعًا بأمر الله وله أخلاق. وقد قال النبي: من قاتل لتكون كلمة الله هي العليا فهو في سبيل الله، فحدّد النية لا الفعل وحده.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان هذا التغيير صعبًا على نفوس كثيرة، ولهذا نزل في القرآن قوله: كتب عليكم القتال وهو كره لكم، وقوله: وعسى أن تكرهوا شيئًا وهو خير لكم. وكان من ثمرات هذا التربية أن الجيوش التي خرجت من الجزيرة كانت تحمل معها قواعد الحرب قبل أن تحمل سيوفها، وهذا ما لاحظه أهل البلاد المفتوحة.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالغزو\u003c/b\u003e\u003cspan\u003eاقتصاد البادية ومكرمة قبل الإسلام\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالأشهر الحرم\u003c/b\u003e\u003cspan\u003eأربعة أشهر أمن للحج والأسواق\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eأشهر الأيام\u003c/b\u003e\u003cspan\u003eبعاث والفجار وذو قار والبسوس وداحس\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eصناعة السلم\u003c/b\u003e\u003cspan\u003eالدية والحلف والجوار\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالتحويل\u003c/b\u003e\u003cspan\u003eمن الغزو إلى الجهاد المقيّد بأخلاق\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eاليوم\u003c/th\u003e\u003cth\u003eالطرفان\u003c/th\u003e\u003cth\u003eأثره\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eيوم بعاث\u003c/td\u003e\u003ctd\u003eالأوس والخزرج\u003c/td\u003e\u003ctd\u003eإهلاك سادات يثرب وتهيئة المدينة للهجرة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eيوم الفجار\u003c/td\u003e\u003ctd\u003eقريش وهوازن\u003c/td\u003e\u003ctd\u003eحضره النبي صغيرًا\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eيوم ذي قار\u003c/td\u003e\u003ctd\u003eبكر والفرس\u003c/td\u003e\u003ctd\u003eأول انتصار عربي على فارس\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eحرب البسوس\u003c/td\u003e\u003ctd\u003eبكر وتغلب\u003c/td\u003e\u003ctd\u003eأربعون سنة من الثأر\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eداحس والغبراء\u003c/td\u003e\u003ctd\u003eعبس وذبيان\u003c/td\u003e\u003ctd\u003eحرب على فرس وفرس\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eوَقَاتِلُوا فِي سَبِيلِ اللَّهِ الَّذِينَ يُقَاتِلُونَكُمْ وَلَا تَعْتَدُوا إِنَّ اللَّهَ لَا يُحِبُّ الْمُعْتَدِينَ\u003c/p\u003e\u003ccite\u003eسورة البقرة، الآية ١٩٠\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eكان الغزو اقتصادًا ومكرمة، والسلم عقدًا يُشترى. وقد غيّر الإسلام مصدر شرعية القتال وقيّده بأخلاق، فصارت الطاقة التي كانت تُصرف في الثأر تُصرف في بناء أمة.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"slavery-and-ranks","n":"العبودية والولاء والطبقات","ic":"⛓️","part":"القسم الرابع: المجتمع والقيم","h":"\u003carticle class=\"ch3\" id=\"slavery-and-ranks\" data-toc=\"العبودية والولاء والطبقات\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٤.٣\u003c/span\u003e\n          \u003ch3\u003e⛓️ العبودية والولاء والطبقات\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eك\u003c/span\u003eان في الجزيرة عبيدٌ وموالٍ وأحرار، وكانت الطبقة تُعرف بالنسب والمال والحرفة. وقد تعامل الإسلام مع هذا الواقع بالتدريج: ضيّق منابع الرق، ووسّع أبواب العتق، وغيّر القيمة التي يُقاس بها الناس.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان الرق في الجزيرة قديمًا ومعروفًا في الأمم كلها، وكانت مصادره ثلاثة: الأسر في الحرب، والشراء من أسواق الرقيق، والاسترقاق بسبب الحرب أو الدين. وكان الرقيق يُباع ويُشترى ويُورَّث، وكانت له أحكام في الزواج والميراث تختلف بحسب سيده. ولم يكن الرق في الجزيرة أشد مما كان في فارس والروم، لكنه كان قائمًا ومؤسسةً من مؤسسات الاقتصاد. وكان الرقيق في الجزيرة قليلًا بالنسبة إلى الأمم المجاورة، لأن الاقتصاد لم يكن قائمًا على زراعة واسعة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان أسواق الرقيق منتشرة في الجزيرة وفي أطرافها، وكانت القوافل تحمل السبايا من الحبشة واليمن والروم والفرس. وكان الرقيق يعملون في الرعي والزراعة والخدمة والصناعة، وكان بعضهم يصل إلى مناصب عالية في بيوت الأشراف إذا أثبت كفاءة وولاءً. وقد بلغ بعض الموالي في مكة مكانةً جعلتهم من وجوه الناس، مثل زيد بن حارثة الذي كان مولى النبي ثم صار قائدًا في جيوش المسلمين.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت معاملة الرقيق تختلف بحسب السيد وبحسب البلد. فكان في مكة من يُحسن إلى رقيقه، وكان في غيرها من يُسيء ويُجهد. وقد ذكر القرآن هذه الحال في سياق الأمر بالإحسان: واعبدوا الله ولا تشركوا به شيئًا وبالوالدين إحسانًا وبذي القربى واليتامى والمساكين والجار ذي القربى والجار الجنب والصاحب بالجنب وابن السبيل وما ملكت أيمانكم. وقد كان هذا الأمر أوسع من مجرد النصيحة، لأنه دخل في باب العبادة نفسها لا في باب الأخلاق وحده.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في الجاهلية بابان للخروج من الرق: العتق، والمكاتبة. فالعتق أن يُحرّر السيد رقيقه بلا مقابل، والمكاتبة أن يتفق معه على مال يدفعه على أقسام فيصير حرًّا إذا أدّاه. وقد أقرّ الإسلام البابين ووسّعهما، وجعل العتق كفارةً لبعض الذنوب، وحثّ عليه حثًّا شديدًا، وجعل المكاتبة حقًّا للعبد إذا طلبها وأمكن، فقال: والذين يبتغون الكتاب مما ملكت أيمانكم فكاتبوهم إن علمتم فيهم خيرًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في المجتمع طبقات تُعرف بالنسب والمال: فبيوت الأشراف في القبيلة، وعامتها، والموالي، والرقيق. وكانت المكانة تُورَّث في الأغلب، وكان الرجل يُعرف بأبيه وبطنه، وكان من لا نسب له يُعرف بولائه. وقد كان هذا النظام يُنتج ظلمًا في الدية والمناكحة والشهادة، وقد جاء الإسلام فألغى التفاضل بالنسب وجعل التقوى هي الميزان. وقد كان في هذا النظام من الظلم ما جعل الإسلام يعيد ترتيب المكانة على أساس آخر غير النسب والمال.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان موقف الإسلام من الرق تدريجيًا لا انقلابيًا، وهذا من فقهه في التعامل مع الواقع. فلم يأمر بإلغاء الرق دفعةً واحدة لأن الاقتصاد كان قائمًا عليه، لكنه ضيّق منابعه، وأمر بالإحسان إلى الرقيق، ووسّع أبواب العتق، وجعل العتق كفارةً، وقرّر أن الرقيق إخوة لساداتهم في الإنسانية. وقد قال النبي: إخوانكم خولكم، جعلهم الله تحت أيديكم، فمن كان أخوه تحت يده فليُطعمه مما يأكل وليُلبسه مما يلبس.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان لهذا التدرج أثر واضح في القرون الأولى، فقد دخل في الإسلام من الرقيق والموالي أعداد كبيرة، وصار بعضهم من كبار العلماء والقادة. وكان في هذا دليل على أن الإسلام فتح باب الصعود الاجتماعي لمن كان محرومًا منه، وأن المكانة صارت تُنال بالعلم والتقوى أكثر من النسب. وكان من أشهرهم بلال بن رباح المؤذن، وزيد بن حارثة قائد الجيوش، وسالم مولى أبي حذيفة، وعطاء وسعيد بن جبير من كبار التابعين.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد بقي الرق في العالم الإسلامي قرونًا بعد ذلك، وهذا من المسائل التي يدرسها المؤرخون في سياق التاريخ الاجتماعي لا في سياق النصوص وحدها. والذي يهمّ في هذا الفصل أن الإسلام غيّر نظرة المجتمع إلى الرقيق من «مال» إلى «إنسان له حق»، وأن هذا التغيير هو الذي جعل إلغاء الرق ممكنًا بعد ذلك في العالم كله. وقد كان إلغاء الرق في العالم في القرنين التاسع عشر والعشرين نتيجة تراكم أخلاقي طويل بدأ به الإسلام.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eمنابع الرق\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت الحرب أكبر منبع للرق، لأن الأسير كان يُسترق أو يُفدى أو يُقتل. وكان الشراء منبعًا ثانيًا، وكانت الأسواق تُجلب إليها السبايا من أفريقيا والروم وفارس. وكان منبع ثالث هو الاسترقاق بسبب الدين أو بسبب الدين، وكان هذا أقلها. وقد كان الأسير يُخيّر بين المنّ والفداء والمقابلة، وهذا ما أقرّه الإسلام بعد ذلك في أحكام الأسرى.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ضيّق الإسلام المنابع: فمن أسلم من الرقيق لم يُسترق، والأسير صار له حق الفداء أو المنّ أو المقابلة، ومن دخل في العهد لم يُسترق. وبهذا لم يُلغِ الرق لكنه أغلق أكثر أبوابه، وهذا هو معنى التدرج في التشريع. وقد بقي في الفقه باب الأسرى مفصّلًا في أحكامه، وهو من أبواب الجهاد التي كُتب فيها الكثير.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالمكاتبة والعتق\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت المكاتبة عقدًا بين السيد ورقيقه على مال يُدفع أقساطًا مقابل الحرية، وكانت معروفة في الجاهلية. وقد أقرّها الإسلام وشدّد على تشجيعها، وأمر بأن يُعان المكاتب من مال الزكاة، فقال: وآتوهم من مال الله الذي آتاكم. وبهذا صارت المكاتبة طريقًا مؤسسيًا للحرية لا فضلًا من السيد وحده.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما العتق فقد جعله الإسلام قربةً وكفارة، فجعل عتق الرقبة كفارةً لقتل الخطأ وللظهار وللإفطار في رمضان. وهذا يعني أن الحرية صارت مطلوبةً في الشرع لا متروكةً لمزاج السيد، وقد كان لهذا أثر في كثرة العتق في القرون الأولى. وقد كان العتق في الإسلام يُشترط فيه أن يكون الرقيق كاملًا لا ناقصًا، لأن العتق لا يتبعّض.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالموالي والمكانة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان المولى في الجاهلية تابعًا لبيت من بيوت العرب، يرثه البيت ويحميه ويُدافع عنه. وقد أقرّ الإسلام الولاء لكنه جعله رابطةً اجتماعية لا رقًّا، وأمر بأن يُعطى المولى من العطاء. وقد صار الموالي في الدولة الإسلامية طبقةً كبيرة من العلماء والتجار والجند. وكان المولى يُعرف بمن والاه، وكان ولاؤه لبيت سيده لا لقبيلته الأصلية، ولهذا كان يُنسب إلى مولاه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد ظهر في العصر الأموي خلاف حول مكانة الموالي، وكان من أسباب سقوط الدولة أن كثيرًا من الموالي شعر بالغبن. وقد عاد هذا الخلاف في العصر العباسي بصورة أخرى، وهذا يدل على أن المسألة الاجتماعية لا تُحلّ بنصٍّ واحد بل تحتاج إلى مؤسسات تحفظ العدل. وقد كتب عمر بن الخطاب في هذا الباب ما يدل على أنه كان يراقب العدل بين الناس جميعًا.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمنابع\u003c/b\u003e\u003cspan\u003eالأسر والشراء والاسترقاق\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالعمل\u003c/b\u003e\u003cspan\u003eالرعي والزراعة والخدمة والصناعة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالخروج\u003c/b\u003e\u003cspan\u003eالعتق والمكاتبة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالتدرج\u003c/b\u003e\u003cspan\u003eتضييق المنابع وتوسيع العتق\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالميزان\u003c/b\u003e\u003cspan\u003eالتقوى لا النسب ولا الملك\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالمسألة\u003c/th\u003e\u003cth\u003eفي الجاهلية\u003c/th\u003e\u003cth\u003eفي الإسلام\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eمصدر الرق\u003c/td\u003e\u003ctd\u003eالحرب والشراء والاسترقاق\u003c/td\u003e\u003ctd\u003eتضييق المنابع وإغلاق أكثرها\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمعاملة\u003c/td\u003e\u003ctd\u003eبحسب مزاج السيد\u003c/td\u003e\u003ctd\u003eإحسان وإطعام وإلباس\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالحرية\u003c/td\u003e\u003ctd\u003eعتق أو مكاتبة اختيارية\u003c/td\u003e\u003ctd\u003eعتق كفارة ومكاتبة مأمورة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمكانة\u003c/td\u003e\u003ctd\u003eبالنسب والمال\u003c/td\u003e\u003ctd\u003eبالعلم والتقوى\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالولاء\u003c/td\u003e\u003ctd\u003eرابطة تبعية\u003c/td\u003e\u003ctd\u003eرابطة اجتماعية بحقوق\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eإِنَّ أَكْرَمَكُمْ عِندَ اللَّهِ أَتْقَاكُمْ\u003c/p\u003e\u003ccite\u003eسورة الحجرات، الآية ١٣\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eلم يلغِ الإسلام الرق في يومه، لكنه أغلق منابعه ووسّع أبواب الحرية وغيّر ميزان المكانة. وهذا التدرج هو ما جعل التغيير ممكنًا في مجتمع كان اقتصادُه قائمًا على هذا النظام.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"p","one":true,"id":"part-5","n":"القسم الخامس: اللسان والشعر","ic":"","part":"","h":"\u003cdiv class=\"part-h\" id=\"part-5\" style=\"--c:#8B6914\"\u003e\n      \u003csvg class=\"porn\" viewBox=\"0 0 300 40\" fill=\"none\"\u003e\n    \u003cpath class=\"ln\" d=\"M0 20h118M182 20h118\"/\u003e\n    \u003cpath class=\"dm\" d=\"M124 20l16-14 16 14-16 14zM144 20l16-14 16 14-16 14z\"/\u003e\n    \u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"11\"/\u003e\u003ccircle class=\"ln\" cx=\"164\" cy=\"20\" r=\"5\"/\u003e\n    \u003cpath class=\"ln\" d=\"M10 14h36M10 26h36M254 14h36M254 26h36\"/\u003e\u003c/svg\u003e\n      \u003cdiv class=\"part-ic\"\u003e📜\u003c/div\u003e\n      \u003ch2\u003eالقسم الخامس: اللسان والشعر\u003c/h2\u003e\n      \u003cp\u003eكان الشعر ديوان العرب، يحفظ أنسابهم وأيامهم وقيمهم، وكانت اللغة العربية أغنى ما ورثوه، وكان الخط قليل الانتشار كثير الأثر. وهذه الفصول الثلاثة تعرض الذاكرة الثقافية للجزيرة قبل الإسلام، وهي الذاكرة التي حملت القرآن بعد ذلك.\u003c/p\u003e\n      \u003cdiv class=\"part-list\"\u003e\u003ca href=\"#jahili-poetry\"\u003eالشعر الجاهلي ووظيفته\u003c/a\u003e\u003ca href=\"#language-and-proverbs\"\u003eاللغة والأمثال والخطابة\u003c/a\u003e\u003ca href=\"#script-and-writing\"\u003eالخط والكتابة في الجزيرة\u003c/a\u003e\u003c/div\u003e\n    \u003c/div\u003e"},{"u":"c","one":false,"id":"jahili-poetry","n":"الشعر الجاهلي ووظيفته","ic":"🎼","part":"القسم الخامس: اللسان والشعر","h":"\u003carticle class=\"ch3\" id=\"jahili-poetry\" data-toc=\"الشعر الجاهلي ووظيفته\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٥.١\u003c/span\u003e\n          \u003ch3\u003e🎼 الشعر الجاهلي ووظيفته\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eل\u003c/span\u003eم يكن الشعر عند العرب ترفًا فنيًا، بل كان سجلّ القبيلة ولسانها السياسي ومحكمة الشرف فيها. ومن أراد أن يفهم الجزيرة قبل الإسلام فليقرأ شعرها قبل أن يقرأ أخبارها.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكان الشعر في الجاهلية فنًّا له قواعد صارمة، وأشهر صوره القصيدة التي تبدأ بالوقوف على الأطلال وذكر الحبيبة، ثم تنتقل إلى وصف الناقة والرحلة، ثم تبلغ الغرض الذي يُبنى عليه الشعر: الفخر أو المدح أو الرثاء أو الهجاء أو الوصف أو الحكمة. وكان الشاعر يبني قصيدته على بحر معلوم وقافية معلومة، ويحتاج إلى معرفة اللغة ومعانيها وإلى حفظ أشعار من قبله، فكان الشعر صناعةً تُتعلَّم لا موهبةً فقط.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت للقصيدة وظيفة اجتماعية دقيقة: فهي التي تُثبت شرف القبيلة أو تهدمه، وهي التي تُخلّد أيام الحرب أو تنسيها، وهي التي تُحرّك الرجال إلى القتال أو تدفعهم إلى الصلح. ولهذا كانوا يقولون: الشعر ديوان العرب، أي السجل الذي تُحفظ فيه أخبارهم. ومن هنا كان الشاعر في القبيلة بمنزلة الإعلام والوثيقة والمحكمة في وقت واحد. وقد كان الشاعر يُستأجر أحيانًا لهجاء قبيلة أو مدح أخرى، فصار الشعر مهنةً لها أجر معلوم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت أشهر القصائد الجاهلية ما عُرف بالمعلقات، وهي قصائد طويلة بلغت من الجودة ما جعلها تُعلَّق على الكعبة في الروايات. ومن أصحابها امرؤ القيس وزهير بن أبي سلمى ولبيد بن ربيعة وطرفة بن العبد وعمرو بن كلثوم وعنترة بن شداد والحارث بن حلزة. وليست هذه القائمة متفقًا عليها بين الرواة، فبعضهم يجعلها سبعًا وبعضهم عشرًا، وهذا الاختلاف نفسه يدل على أن الاختيار كان ذوقًا لا قانونًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت أسواق العرب مواسم للشعر كما كانت مواسم للتجارة. ففي سوق عكاظ كان الشعراء يُنشدون ويُفاضل بينهم، وكانت القبائل تُرسل شعراءها ليفخرون بها، وكان من يخرج متفوقًا يعود إلى قومه وقد رفع رأسهم. وقد قال النبي في هذا السوق كلمةً تُروى عنه، وحضره في صغره في أيام الفجار كما تذكر الروايات، وكان يستمع إلى الشعر ويُثني على جيده. وقد اختلف الرواة في عددها وفي أسماء أصحابها اختلافًا يدل على أن الاختيار كان ذوقًا لا قانونًا.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في الشعر الجاهلي من الصدق ما يجعله مصدرًا تاريخيًا موثوقًا في بعض ما يرويه، لأن الشاعر يصف ما رأى ويذكر ما جرى. لكن فيه أيضًا من المبالغة ما يجعله غير صالح للاعتماد على تفصيله، لأن الفخر يدفع إلى التضخيم والهجاء يدفع إلى التشويه. ولهذا يستعمل المؤرخ الشعر مع الخبر لا بدلًا منه، ويُقارن بين الروايات ليعرف ما اتفقت عليه. وقد كان في هذه الأسواق من يُنشد ومن يروي ومن يحكم بين الشعراء فيُفاضل بينهم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان الشعر يحمل قيم العرب التي عاشوا بها: الكرم، والشجاعة، والوفاء، والصبر، والحرية، والأنفة من الظلم. وكان يحمل أيضًا عيوبهم: التفاخر بالأنساب، والاستهانة بالضعيف، والغلو في الثأر. وقد أبقى الإسلام من هذا التراث ما وافق الحق، وردّ ما خالفه، وكان النبي يستشهد بأبيات منه ويقول: إن من الشعر حكمة. ولهذا كان النقاد يُفرّقون بين ما يُقبل من الشعر خبرًا وما يُردّ، ويُقارنون الروايات بعضها ببعض.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان للشعر أثر في الدعوة نفسها. فقريش اتهمت النبي بأنه شاعر، فردّ القرآن هذه التهمة بأسلوب يبيّن الفرق بين كلام البشر والوحي: وما علمناه الشعر وما ينبغي له. وكان ذلك تحديًا أدبيًا في أمة تعرف الشعر وتقيس به البلاغة، وقد عجزت عن أن تأتي بمثل القرآن مع تمكنها من الفصاحة. وقد كان في الشعر الجاهلي من الحكمة ما أقره الإسلام، ومن الفخر بالأنساب ما ردّه ونهى عنه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد حفظ الرواة هذا الشعر قبل أن يُكتب، وكانت الرواية صناعةً لها أسانيدها. ثم دُوّن الشعر في العصر الأموي والعباسي، ودخل فيه ما ليس منه بسبب الوضع والانتحال. ولهذا كان علماء اللغة يفحصون الشعر ويُميّزون صحيحه من منحوله، وهذا العلم نفسه صار بابًا من أبواب النقد الأدبي عند العرب. وقد كان هذا التحدي قائمًا على علمهم بالبلاغة لا على جهلهم بها، ولهذا كان أشدّ عليهم.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eبنية القصيدة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكانت القصيدة الجاهلية تُبنى على مقاطع مترابطة: نسيبٌ في أولها، ثم وصف الرحلة والناقة، ثم الغرض. ولم يكن هذا الترتيب عبثًا، لأنه يمنح الشاعر مجالًا للاستهلال ثم للانتقال إلى ما يريد. وقد بقي هذا البناء معروفًا في الشعر العربي قرونًا، حتى تغيّر في العصر الحديث. وكان لكل مقطع من هذه المقاطع وظيفة في بناء القصيدة لا يُستغنى عنها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان الوزن والقافية قيدًا يفرض على الشاعر دقةً في اختيار الألفاظ، ولهذا كان الشعر الجاهلي غنيًّا بالمفردات دقيقًا في الوصف. وقد حفظ لنا هذا الشعر ألفاظًا كثيرة لم تبقَ في اللغة اليوم، ولهذا كان معجم اللغة العربية يعتمد عليه اعتمادًا كبيرًا. وقد حفظ هذا الشعر ألفاظًا كثيرة لم تبقَ في اللغة اليوم، فصار معجمًا للعربية القديمة.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالشعر والسياسة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الشاعر لسان قبيلته في المفاوضات كما كان لسانها في الحرب. فكان يُرسل إلى قبيلة أخرى ليفخر بها أو يهجوها، وكان هجاؤه يُعدّ سلاحًا لأن الكلمة تبقى بعد انتهاء المعركة. وقد رُوي أن بعض القبائل كانت تخاف هجاء شاعر أكثر مما تخاف سيف مقاتل. وكان الشاعر يُرسل إلى قبيلة أخرى ليفخر بها أو يهجوها، فكانت الكلمة سلاحًا في السلم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد عرف النبي هذه الوظيفة، فاستعمل الشعر في الدفاع عن الدعوة، وأقرّ حسان بن ثابت على هجاء المشركين، وقال: إن روح القدس مع حسان ما دافع عن رسول الله. وهذا يدل على أن الإسلام لم يُلغِ الشعر بل وجّهه، وأن الميدان الأدبي كان ميدانًا حقيقيًا في الصراع. وكان حسان بن ثابت أشهر من دافع عن النبي بشعره، وقد أقرّه النبي على ذلك.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالشعر بعد الإسلام\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم ينقطع الشعر الجاهلي بعد الإسلام، بل بقي يُروى ويُدرس ويُستشهد به في تفسير القرآن وفي شرح اللغة. وقد كان الخلفاء يستمعون إليه، وكان العلماء يروونه في مجالسهم، وكان من أحفظ الناس له من هو من كبار التابعين. وبهذا صار الشعر الجاهلي جزءًا من الثقافة الإسلامية لا خارجًا عنها.\u003c/p\u003e\u003cp class=\"ap\"\u003eغير أن غرضه تغيّر. فقد ذهب الفخر القبلي الذي كان يُحرّك القبائل، وبقي الوصف والحكمة والرثاء. وقد ظهر في العصر الأموي شعر سياسي جديد، وفي العصر العباسي شعر صناعي متأثر بالفلسفة والترجمة. وهذا يدل على أن الشعر العربي لم ينقطع بل تحوّل، وأن جذوره الجاهلية بقيت في أوزانه وألفاظه.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالوظيفة\u003c/b\u003e\u003cspan\u003eسجل القبيلة ولسانها السياسي\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالمعلقات\u003c/b\u003e\u003cspan\u003eسبع أو عشر قصائد بلغت الذروة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالأسواق\u003c/b\u003e\u003cspan\u003eعكاظ ومجنة وذو المجاز\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالقيم\u003c/b\u003e\u003cspan\u003eالكرم والشجاعة والوفاء والأنفة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالرواية\u003c/b\u003e\u003cspan\u003eحُفظ بالرواية ثم دُوّن ودخل فيه الوضع\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالشاعر\u003c/th\u003e\u003cth\u003eمن قبيلته\u003c/th\u003e\u003cth\u003eما يُعرف به\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eامرؤ القيس\u003c/td\u003e\u003ctd\u003eكندة\u003c/td\u003e\u003ctd\u003eصاحب أول المعلقات ووصف الطلل\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eزهير بن أبي سلمى\u003c/td\u003e\u003ctd\u003eمزينة\u003c/td\u003e\u003ctd\u003eالحكمة ومدح الصلح\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eلبيد بن ربيعة\u003c/td\u003e\u003ctd\u003eعامر\u003c/td\u003e\u003ctd\u003eوصف الطبيعة وأسلم في آخر عمره\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eطرفة بن العبد\u003c/td\u003e\u003ctd\u003eبكر\u003c/td\u003e\u003ctd\u003eالفخر والهجاء وقُتل صغيرًا\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eعنترة بن شداد\u003c/td\u003e\u003ctd\u003eعبس\u003c/td\u003e\u003ctd\u003eالفروسية والغزل والأنفة\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eوَمَا عَلَّمْنَاهُ الشِّعْرَ وَمَا يَنبَغِي لَهُ إِنْ هُوَ إِلَّا ذِكْرٌ وَقُرْآنٌ مُّبِينٌ\u003c/p\u003e\u003ccite\u003eسورة يس، الآية ٦٩\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eكان الشعر ديوان العرب وسجلّ قبائلهم ومحكمة شرفهم، وكان له في السياسة والحرب سلاح. وقد أبقى الإسلام منه ما وافق الحق وردّ ما خالفه، فبقي أساسًا للثقافة العربية بعد الإسلام.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"language-and-proverbs","n":"اللغة والأمثال والخطابة","ic":"🗣️","part":"القسم الخامس: اللسان والشعر","h":"\u003carticle class=\"ch3\" id=\"language-and-proverbs\" data-toc=\"اللغة والأمثال والخطابة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٥.٢\u003c/span\u003e\n          \u003ch3\u003e🗣️ اللغة والأمثال والخطابة\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eك\u003c/span\u003eانت العربية قبل الإسلام لغةً غنيةً بلا معجم ولا كتاب، محفوظة في الصدور والمنابر والأسواق. وكانت الأمثال خلاصة تجربتها، والخطابة سلاحها في السلم والحرب.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eكانت العربية في الجزيرة لغةً واحدة في أصولها، متعددة في لهجاتها. فلكل قبيلة لهجة في النطق وبعض المفردات، وكانت قريش أقرب القبائل إلى اللغة التي نزل بها القرآن لأنها كانت تُخالط الحجيج والتجار من كل الأقطار. وقد اختار الله هذه اللغة لأنها كانت أفصح اللغات وأوسعها في التعبير عن المعاني الدقيقة. وكانت قريش تُعدّ أفصح العرب لاختلاطها بالحجيج والتجار من كل قبيلة في المواسم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت اللغة تُحفظ بالسماع لا بالكتاب، وكانت النساء والرجال يحفظون الأشعار والخطب والأمثال، وكان الحفظ هو المدرسة. ولهذا كان العربي يعرف من المفردات ما لا يعرفه اليوم من قرأ المعاجم، لأن اللغة كانت تُتعلَّم في الحياة لا في الكتب. وقد كان هذا الحفظ هو الذي جعل العربية تصل إلينا سليمةً بعد قرون. وكان الحفظ يُختبر به الرجال، فمن قلّ حفظه قلّ حظه في المجالس وفي الوفود.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت الأمثال خلاصة التجربة القبلية، تُصاغ في جملة قصيرة تُحفظ فتُصبح حكمًا. ومن أشهرها: الصيف ضيّعت اللبن، وسبق السيف العذل، ورجع بخفي حنين، وعاد الأمر إلى نصابه. وكان المثل يُقال في حادثة وقعت ثم يُصبح عامًّا، فصار للأمثال قصص تُروى معها، وهذا ما جعلها مادةً تاريخية أيضًا. وكان المثل يُقال في حادثة وقعت ثم يصير عامًّا، ولهذا كان له قصة تُروى معه.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت الخطابة فنًّا آخر له قواعده. فكان الخطيب يقف في السوق أو في الحرب أو في الوفود، فيتكلم بجمل مسجوعة قصيرة قوية، ويُحرّك الناس إلى الصلح أو الحرب أو الفخر. وكان من أشهر خطباء الجاهلية قُسّ بن ساعدة وأكثم بن صيفي، وكانت خطبهم تُحفظ كما تُحفظ القصائد. وكانت الخطب تُقال في الصلح والحرب والوفود والأعراس، وكانت تُحفظ كما تُحفظ القصائد.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان للسجع مكانة في الكلام الجاهلي، وهو أن تُوافق أواخر الجمل في الحرف، كقولهم: الحمد لله الذي لا يُنسى ولا يُخفى. وقد كان السجع يُستعمل في الخطب والدعاء والوصايا، وكان له وقع في الأذن. وقد جاء القرآن بأسلوب ليس شعرًا ولا سجعًا كسجع الكهان، فأبطل به ما كانوا يعرفونه من صناعة الكهانة. وقد كان السجع يُستعمل في الدعاء والوصايا أكثر من استعماله في الشعر.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت اللغة أداة للتمييز الاجتماعي أيضًا. فمن كان فصيحًا كان أقدر على الفخر والمفاوضة، وكانت القبيلة تفتخر بخطيبها كما تفتخر بفارسها. وكان في الأسواق من يُفاضل بين الشعراء والخطباء، وكانت المنافرة تقوم على الكلام قبل السلاح في كثير من الأحوال. وكانت المفاخرة بالكلام تُسمّى المنافرة، وكانت تُحكَّم فيها العرب في أسواقها. وقد كان الخطيب يُعدّ من وجوه قومه، وكانت القبيلة تفتخر بخطيبها كما تفتخر بفارسها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان لهذه اللغة أثر حاسم في فهم القرآن. فلما نزل القرآن بلسان عربي مبين، كان العرب يفهمونه بلا ترجمة، وكان إعجازه عندهم في نظمه وبلاغته قبل كل شيء. ولهذا كان التحدي به أشدّ عليهم، لأنهم كانوا أهل الفصاحة والبيان، فلم يستطيعوا أن يأتوا بسورة من مثله. ولهذا كان التحدي بالقرآن أشدّ عليهم من التحدي بالسيف، لأنهم أهل البيان لا أهل الجهل به.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد حفظ الإسلام هذه اللغة ورعاها، لأن فهم الدين يتوقف عليها. فنشأ علم النحو لحفظ الإعراب، وعلم اللغة لضبط المفردات، وعلم البلاغة لفهم الإعجاز. وبهذا صارت العربية لغة علم لا لغة قبيلة، وصارت أداةً لوحدة الأمة بعد أن كانت أداةً لتفريق القبائل. وقد نشأ النحو لحفظ الإعراب، ونشأت البلاغة لفهم الإعجاز، فصارت العربية علمًا يُدرَّس. وقد صارت العربية بعد ذلك لغة علم لا لغة قبيلة، وهذا من أعظم آثار الإسلام على اللسان.\u003c/p\u003e\n        \u003ch4 class=\"sub\"\u003eاللهجات والعربية الفصحى\u003c/h4\u003e\u003cp class=\"ap\"\u003eلم تكن لهجات الجزيرة متباعدة تباعدًا يمنع التفاهم، بل كانت تتفاوت في النطق وبعض المفردات. وكانت قريش تسمع لهجات الحجيج كلها في المواسم، فصارت تعرف من كل لهجة ما تحتاج إليه، وصارت لغتها أقرب اللغات إلى الاعتدال والوضوح. وكانت لهجات تميم وبكر وهذيل معروفة في الأسواق، ولكل لهجة خصائصها في النطق.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد نزل القرآن بأشهر اللغات وأفصحها، وأُذن في القراءة ببعض الحروف على لغات أخرى توسعةً على الناس. وهذا يدل على أن العربية كانت لغةً حيةً متعددة اللهجات، وأن الوحي تعامل مع هذا التعدد تعاملًا رحيمًا لا هادمًا. وقد نزل القرآن بأشهر اللغات وأفصحها، وأُذن في بعض الحروف على لغات أخرى توسعةً.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالمثل والحكمة\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان المثل يُولد من حادثة، ثم يُجرَّد من تفاصيلها فيصير قاعدة. ولهذا كان المثل يحمل خبرًا مضغوطًا في جملة، وكان من يسمعه يعرف قصته أو يسأل عنها. وقد جُمعت الأمثال في كتب مثل مجمع الأمثال للميداني، وبقيت حتى اليوم تُستعمل في الكلام اليومي. وقد جُمعت الأمثال في كتب مثل مجمع الأمثال للميداني، وبقيت تُستعمل في الكلام اليومي.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكانت الحكمة قريبة من المثل لكنها أوسع، لأنها لا ترتبط بحادثة. وكان من حكماء العرب لقمان في الروايات، وأكثم بن صيفي، وكانت حكمهم تُروى في الوصايا. وقد أقرّ الإسلام ما فيها من حق، وردّ ما خالفه، وهذا هو معنى قول النبي: إن من الشعر حكمة. وكانت الحكمة أوسع من المثل لأنها لا ترتبط بحادثة، وإنما تُقال في كل موضع يناسبها.\u003c/p\u003e\u003ch4 class=\"sub\"\u003eالخطابة والسجع\u003c/h4\u003e\u003cp class=\"ap\"\u003eكان الخطيب في الجاهلية يُعدّ من وجوه قومه، لأن الكلمة كانت تُحرّك الناس أكثر من السيف في مواضع كثيرة. وكانت الخطب تُقال في الصلح والحرب والوفود والأعراس، وكانت تُحفظ وتُروى كما تُروى القصائد، ولهذا وصل إلينا منها شيء كثير. وكان الخطيب يُعدّ من وجوه قومه، وكانت القبيلة تفتخر بخطيبها كما تفتخر بفارسها.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد استعمل الإسلام الخطابة في الدعوة والجهاد والجمعة، فصار المنبر مؤسسةً دينية وسياسية. وقد خطب النبي في مواضع كثيرة، وكانت خطبه قصيرةً بليغة، وكان أبو بكر وعمر يخطبان الناس بما يشبه خطب الجاهلية في قوتها لكن بمعانٍ جديدة. وقد خطب النبي في مواضع كثيرة، وكانت خطبه قصيرةً بليغةً، وخطب أبو بكر وعمر بعده.\u003c/p\u003e\n        \u003cdiv class=\"kbox\"\u003e\u003cdiv class=\"bt\"\u003eخلاصة الفصل\u003c/div\u003e\u003cdiv class=\"kgrid3\"\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eاللغة\u003c/b\u003e\u003cspan\u003eواحدة في أصولها متعددة في لهجاتها\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالحفظ\u003c/b\u003e\u003cspan\u003eالصدور قبل الكتب\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالأمثال\u003c/b\u003e\u003cspan\u003eخلاصة التجربة في جملة قصيرة\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالخطابة\u003c/b\u003e\u003cspan\u003eمنبر السوق والحرب والوفود\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"kb\"\u003e\u003cb\u003eالأثر\u003c/b\u003e\u003cspan\u003eالنحو والبلاغة لخدمة فهم القرآن\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\n        \u003cdiv class=\"tblwrap\"\u003e\u003cdiv class=\"tblcap\"\u003eجدول\u003c/div\u003e\n        \u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eالفن\u003c/th\u003e\u003cth\u003eصورته\u003c/th\u003e\u003cth\u003eما بقي منه\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eالشعر\u003c/td\u003e\u003ctd\u003eقصيدة بوزن وقافية\u003c/td\u003e\u003ctd\u003eأساس العروض واللغة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالخطابة\u003c/td\u003e\u003ctd\u003eكلام مسجوع في المواقف\u003c/td\u003e\u003ctd\u003eالمنبر والجمعة\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالمثل\u003c/td\u003e\u003ctd\u003eجملة تحمل حكاية\u003c/td\u003e\u003ctd\u003eأمثال دارجة إلى اليوم\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالحكمة\u003c/td\u003e\u003ctd\u003eقول جامع بلا حادثة\u003c/td\u003e\u003ctd\u003eأدب وأخلاق\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eالسجع\u003c/td\u003e\u003ctd\u003eتوافق أواخر الجمل\u003c/td\u003e\u003ctd\u003eأسلوب في الخطب والرسائل\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\u003c/div\u003e\u003cblockquote\u003e\u003cp\u003eوَمَا أَرْسَلْنَا مِن رَّسُولٍ إِلَّا بِلِسَانِ قَوْمِهِ لِيُبَيِّنَ لَهُمْ\u003c/p\u003e\u003ccite\u003eسورة إبراهيم، الآية ٤\u003c/cite\u003e\u003c/blockquote\u003e\n        \u003cdiv class=\"res\"\u003eكانت العربية لغةً محفوظة في الصدور، غنيةً بالأمثال والخطب، وكانت أداة فخر وتفريق. وقد صارت بعد الإسلام لغة علم ووحدة، لأن فهم الدين توقف عليها فقامت لها علومها.\u003c/div\u003e\n      \u003c/article\u003e"},{"u":"c","one":false,"id":"script-and-writing","n":"الخط والكتابة في الجزيرة","ic":"✒️","part":"القسم الخامس: اللسان والشعر","h":"\u003carticle class=\"ch3\" id=\"script-and-writing\" data-toc=\"الخط والكتابة في الجزيرة\"\u003e\n        \u003cdiv class=\"ch3-h\"\u003e\n          \u003cspan class=\"ch3-n\"\u003e٥.٣\u003c/span\u003e\n          \u003ch3\u003e✒️ الخط والكتابة في الجزيرة\u003c/h3\u003e\n        \u003c/div\u003e\n        \u003cp class=\"lead\"\u003e\u003cspan class=\"drop\"\u003eك\u003c/span\u003eانت الجزيرة أمةً تسمع أكثر مما تقرأ، والكتابة فيها قليلة لكنها لم تكن معدومة. والخط الذي كُتب به القرآن بعد ذلك كان موجودًا قبل الإسلام، وكان يعرفه نفرٌ قليل في مكة والمدينة.\u003c/p\u003e\n        \u003cp class=\"ap\"\u003eلم تكن الكتابة معروفة عند جميع العرب، بل كانت صناعةً لقليل منهم، وكان من يكتب يُسمّى كاتبًا ويُعدّ ذا فضل. وكانت الكتابة تُستعمل في العقود والوصايا والرسائل والعهود، وكانت تُكتب على الجلود والعظام والحجارة وسعف النخل. وقد ورد في القرآن ذكر القرطاس والقلم والكتاب، وهذا يدل على أن هذه الأدوات كانت معروفة للسامعين. وكانت الأدوات معروفة: القرطاس والقلم والرق والعظام، وقد ذكرها القرآن في مواضع.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في جنوب الجزيرة خط قديم يُسمّى المسند، وكان يُكتب به في ممالك سبأ ومعين وحمير، وله صور حروف مختلفة عن الخط العربي المعروف. وقد بقي من آثاره نقوش كثيرة على الصخور والمعابد، وهي اليوم من أهم مصادر تاريخ اليمن القديم. وقد انقطع هذا الخط بعد انهيار تلك الممالك، ولم يبقَ منه إلا النقوش. وقد بقي من هذه النقوش آلاف، وهي اليوم مادة أساسية لدراسة تاريخ اليمن القديم.\u003c/p\u003e\u003cp class=\"ap\"\u003eوأما الخط الذي كُتب به القرآن فهو الخط العربي الشمالي، ويُرجّح الباحثون أنه تطور من الخط النبطي الذي كان يُستعمل في شمال الجزيرة والشام. وقد انتقل هذا الخط إلى الحجاز قبل الإسلام بزمن، وتعلّمه نفر من أهل مكة والمدينة، وكانوا يكتبون به الرسائل والعقود. وقد سُمّي هذا الخط في أول أمره خطًا جزمًا، ثم تطوّر بعد ذلك إلى الخطوط المعروفة. وقد سُمّي هذا الخط في أول أمره جزمًا، ثم تطوّر بعد ذلك إلى الخطوط المعروفة.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان من أشهر من كتب بمكة قبل الإسلام نفرٌ قليل، ويُذكر أن بشر بن عبد الملك تعلّم الخط في الحيرة ثم علّمه أهل مكة، وأن أبا قحافة والد أبي بكر كان ممن يعرف الكتابة. وهذه الأخبار تدل على أن الكتابة كانت موجودة في مكة قبل البعثة، لكنها كانت محصورة في بيوت قليلة. وهذه الأخبار تدل على أن الكتابة كانت محصورة في بيوت قليلة لا في عامة الناس.\u003c/p\u003e\u003cp class=\"ap\"\u003eوكان في المدينة كتّابٌ من اليهود وغيرهم، وكان أهل الكتاب يقرؤون التوراة ويكتبونها، وكان بعض العرب يكتب العربية والعبرية. وقد كان في المدينة قبل الإسلام من يكتب العقود والعهود بين القبائل، وهذا يدل على أن الكتابة كانت أداةً قانونية لا أدبية فقط. وكان أهل الكتاب يقرؤون التوراة ويكتبونها، وكان بعض العرب يكتب العربية والعبرية. وكان في المدينة قبل الإسلام من يكتب العقود بين القبائل، وكانت الكتابة أداة قانونية.\u003c/p\u003e\u003cp class=\"ap\"\u003eوقد كان لقلّة الكتابة أثر في حفظ التراث، لأن الشعر والنسب والأخبار كانت تُحفظ
